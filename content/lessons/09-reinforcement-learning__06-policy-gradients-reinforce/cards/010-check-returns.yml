- concept: при единственной награде в конце эпизода возврат шага равен награде, умноженной на γ в степени числа шагов до неё
  question: 'Эпизод из трёх шагов: награда приходит только на последнем шаге и равна 5, остальные награды нулевые. Дисконт γ = 0,6. Чему равен возврат самого первого шага эпизода?'
  explanation: 'До награды остаётся два перехода, значит множитель γ² = 0,36 и возврат равен 5 · 0,36 = 1,8. В общем виде при единственной награде r на последнем шаге T возврат равен G_t = γ^(T−t) · r: степень равна числу шагов, отделяющих действие от награды.'
  kind: numeric
  answer: 1.8
  tolerance: 0.01
  id: 010-check-returns-1
  fingerprint: 2b8a7ca3
- concept: при единственной награде в конце возвраты образуют геометрическую прогрессию с отношением γ, поэтому γ восстанавливается из отношения соседних возвратов
  question: В эпизоде награда приходит только на последнем шаге, остальные награды нулевые. Функция подсчёта возвратов вернула по шагам 2, 4, 8. Какое значение γ использовалось?
  explanation: Каждый шаг назад от награды добавляет один множитель γ, поэтому соседние возвраты связаны как G_t = γ · G_{t+1}. Здесь 4 = γ · 8, то есть γ = 0,5. Величина награды сокращается в отношении и не нужна.
  kind: choice
  options:
    - 0,5
    - 0,25
    - '2'
    - 'определить нельзя: нужна ещё величина награды'
  correct: 0
  id: 010-check-returns-2
  fingerprint: 7719a714
- concept: вес действия в градиенте убывает экспоненциально с расстоянием до награды, поэтому дальние действия закрепляются слабее
  question: В эпизоде из 20 шагов награда приходит только на последнем шаге. Объясни своими словами, как при γ = 0,5 распределяется обучающий сигнал по действиям эпизода и чем это плохо для длинных эпизодов.
  explanation: Множитель убывает не линейно, а экспоненциально по расстоянию. Поэтому выбор γ — это выбор горизонта, на котором REINFORCE вообще способен назначать вину и заслугу.
  kind: open
  reference: 'Возврат шага равен награде, умноженной на γ в степени расстояния до награды. При γ = 0,5 действие за 10 шагов до награды получает множитель ≈ 0,001, а за 20 шагов — ≈ 10⁻⁶. В слагаемом G_t · ∇log π это множитель шага: последние действия закрепляются сильно, а ранние получают вес, тонущий в шуме оценки градиента. Значит при малом γ и длинном эпизоде причины успеха, лежащие в начале эпизода, практически не обучаются; для длинного кредита нужен γ, близкий к единице.'
  id: 010-check-returns-3
  fingerprint: eb48b54c
