- concept: вектор вероятностей в записи траектории относится к состоянию до выполнения записанного действия
  question: 'Объясни своими словами, к какому состоянию относится сохранённый в переходе вектор вероятностей действий: к состоянию до действия или после него?'
  explanation: Сначала по текущему состоянию вычисляются вероятности и выбирается действие. Следующее состояние появляется лишь после вызова среды, поэтому сохранённый вектор описывает выбор в исходном состоянии.
  kind: open
  reference: 'Вектор вероятностей относится к состоянию до действия: политика вычисляет распределение по текущему состоянию, затем из него выбирается действие и только после этого среда создаёт следующее состояние.'
