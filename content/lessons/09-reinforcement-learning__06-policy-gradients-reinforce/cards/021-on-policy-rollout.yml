- concept: обучающий сигнал считается по вероятностям политики, действовавшей в момент выбора, поэтому их сохраняют, а не пересчитывают по текущим параметрам
  question: Агент собрал эпизод, параметры политики уже обновлены, и теперь по этому эпизоду считают ∇log π для каждого шага. Вероятности действий пересчитали прогоном состояний через обновлённую политику. Что не так с таким подсчётом?
  explanation: 'REINFORCE оценивает ∇J как среднее G_t·∇log π_θ(a_t|s_t), где π_θ — политика, породившая эти действия. После обновления параметров та же пара (s, a) получает другую вероятность: действию с фактической вероятностью 0,45 могут приписать 0,9, и множитель градиента станет неверным. Поэтому rollout сохраняет вектор вероятностей вместе с переходом.'
  kind: choice
  options:
    - 'Ничего: вероятности зависят только от состояния, а состояния в записи сохранены'
    - Получен градиент лог-вероятности другой политики — той, которая эти действия не выбирала, поэтому оценка градиента смещена
    - Пересчёт корректен, но занимает больше времени, чем чтение сохранённых значений
    - Пересчёт корректен только при жадном выборе действий, а при сэмплировании даёт другой знак градиента
  correct: 1
  id: 021-on-policy-rollout-1
  fingerprint: af03ec46
- concept: в запись шага траектории кладут вектор вероятностей по всем действиям, а не только выбранное действие и его вероятность
  question: Что кладут в запись шага траектории четвёртым элементом, чтобы позже восстановить градиент лог-вероятности?
  explanation: Градиент лог-вероятности по логитам равен one-hot(a) минус вектор вероятностей, то есть нужны вероятности всех действий, а не только выбранного. Поэтому в запись идёт весь вектор probs, посчитанный до сэмплирования.
  kind: cloze
  template: |-
    a = sample_action(probs, rng)
    s_next, r, done = env.step(s, a)
    trajectory.append((s, a, r, ___))
  answer: probs
  accept:
    - probs
    - вектор probs
    - probs целиком
  id: 021-on-policy-rollout-2
  fingerprint: 800eea6e
- concept: внутри одного rollout параметры политики не меняются, расхождение сохранённых и пересчитанных вероятностей появляется только когда опыт используется после обновления параметров
  question: Эпизод длиной 40 шагов собран одним rollout без обновлений параметров внутри цикла. Когда сохранённые probs начнут расходиться с вероятностями, посчитанными по текущим параметрам?
  explanation: 'Внутри rollout θ фиксировано, поэтому пересчёт дал бы те же самые вероятности на всех 40 шагах. Расхождение вносит именно шаг обновления параметров: собранный ранее опыт становится опытом уже прошлой политики.'
  kind: choice
  options:
    - 'Уже внутри rollout: каждое сэмплирование сдвигает распределение'
    - Начиная со второго шага эпизода, потому что состояние изменилось
    - Только после того, как параметры обновлены — например, при повторном использовании или отложенной обработке собранного опыта
    - 'Никогда: probs — детерминированная функция состояния и от параметров не зависят'
  correct: 2
  id: 021-on-policy-rollout-3
  fingerprint: 833d80fb
