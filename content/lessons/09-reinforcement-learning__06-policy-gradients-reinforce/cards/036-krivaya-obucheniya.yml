- concept: сглаженная кривая возвратов — диагностика, она не входит в градиент и не меняет политику
  question: Инженер добавил в цикл REINFORCE подсчёт среднего возврата по последним 50 эпизодам и рисует его на графике. Как это влияет на обучение агента?
  explanation: На политику влияет только то, что попадает в формулу обновления. Сглаженная кривая никуда не подставляется — её считают для отчёта и глазами. Базовая линия влияет на обучение именно потому, что вычитается из возврата внутри градиента; просто нарисовать среднее — не то же самое, что вычесть его из G_t.
  kind: choice
  options:
    - 'Никак: это измерение результата, в вычисление градиента оно не входит и параметры политики не меняет'
    - Снижает дисперсию градиента, потому что любое усреднение возвратов работает как базовая линия
    - Ускоряет сходимость, так как сглаженный возврат — более надёжный обучающий сигнал
    - Смещает оценку градиента, поэтому такую метрику нельзя считать во время обучения
