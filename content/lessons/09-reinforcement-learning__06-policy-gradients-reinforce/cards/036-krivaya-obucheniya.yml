- concept: 'обновление среднего по скользящему окну: прибавляется разность вошедшего и вышедшего возвратов, делённая на длину окна'
  question: Кривую обучения сглаживают скользящим окном длины 40 эпизодов. Сейчас средний возврат по окну равен 12.5. Прошёл новый эпизод с возвратом 49, а из окна вышел самый старый эпизод с возвратом 9. Чему равно новое среднее по окну?
  explanation: 'Сумма по окну меняется на (49 − 9) = 40, длина окна остаётся 40, значит среднее сдвигается на 40/40 = 1: 12.5 + 1 = 13.5. Пересчитывать всю сумму не нужно — достаточно разности вошедшего и вышедшего значения, делённой на длину окна. Отсюда и эффект сглаживания: один рекордный эпизод двигает линию лишь на 1/40 своей величины относительно выбывшего.'
  kind: numeric
  answer: 13.5
  tolerance: 0.01
  id: 036-krivaya-obucheniya-1
  fingerprint: 30ff79e8
- concept: длина окна сглаживания задаёт компромисс между скоростью реакции и уровнем остаточного шума
  question: 'Возвраты эпизодов сильно разбросаны из-за сэмплирования действий. Инженер строит две сглаженные кривые: по окну в 10 эпизодов и по окну в 500. Что верно про их поведение?'
  explanation: 'Усреднение по n эпизодам давит случайный разброс примерно как 1/√n, поэтому длинное окно даёт гладкую линию. Но то же усреднение растягивает реакцию: новое поведение политики становится видно только когда оно займёт заметную долю окна. Короткое окно — наоборот. Поэтому обычно держат и сырые возвраты (виден разброс), и сглаженную кривую (видно направление).'
  kind: choice
  options:
    - Окно 10 быстрее отражает реальное изменение политики, но в нём остаётся больше шума; окно 500 спокойнее, но реагирует с задержкой
    - Окно 500 быстрее отражает изменение политики, потому что усредняет больше данных
    - Обе кривые ведут себя одинаково, длина окна влияет только на память под хранение возвратов
    - Окно 10 полностью убирает шум, а окно 500 его усиливает
