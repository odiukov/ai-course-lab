- concept: константная базовая линия сдвигает преимущества всех шагов эпизода одинаково, поэтому меняет уровень и знак сигнала, но не относительные веса шагов внутри эпизода
  question: Базовая линия — одно число, которое вычитается из reward-to-go каждого шага эпизода. Объясни, что это делает с относительными весами шагов внутри одного эпизода и что меняется при сравнении эпизодов между собой.
  explanation: Константный сдвиг не переупорядочивает шаги внутри эпизода — он снимает общее смещение возвратов и снижает дисперсию оценки градиента. Различать шаги по состоянию умеет только V̂(s), которая даёт своё ожидание в каждом состоянии, а не одно число на всю среду.
  kind: open
  reference: 'Внутри одного эпизода вычитание одного и того же числа — параллельный сдвиг: разность преимуществ двух шагов равна разности их возвратов, поэтому порядок и разрывы между шагами сохраняются. Меняется общий уровень: шаги с возвратом выше ориентира получают положительный вес и закрепляются, ниже — отрицательный и подавляются. Между эпизодами базовая линия центрирует сигнал: эпизод лучше ожидания целиком усиливается, хуже — целиком ослабляется, и обучение перестаёт зависеть от постоянной добавки к наградам среды. Чтобы отличать хорошие и плохие шаги внутри эпизода по состоянию, нужна базовая линия, зависящая от состояния, — обученная V̂(s).'
  id: 034-code-train-3
