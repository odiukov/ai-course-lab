- concept: пока базовая линия не вышла на типичный уровень возвратов, преимущества всех действий имеют одинаковый знак и не различают удачные и неудачные эпизоды
  question: В среде за каждый шаг начисляется штраф, поэтому все возвраты отрицательны. Базовая линия инициализирована нулём и обновляется скользящим средним. Что происходит на первых итерациях обучения?
  explanation: Преимущество = возврат − базовая линия. При базовой линии 0 и отрицательных возвратах каждое преимущество отрицательно, и шаг подъёма давит вниз вероятности всех пройденных действий — даже у самого удачного эпизода. Оценка градиента остаётся несмещённой (базовая линия не зависит от действия), просто дисперсия и сигнал плохие, пока ориентир не подтянется к среднему уровню возвратов.
  kind: choice
  options:
    - Преимущества всех шагов отрицательны, поэтому вероятности всех выполненных действий снижаются, и сравнение эпизодов между собой начинает работать только когда базовая линия опустится к типичному уровню возвратов
    - Преимущества всех шагов положительны, поэтому вероятности выполненных действий растут независимо от качества эпизода
    - Обновление обнуляется, потому что нулевая базовая линия делает преимущество равным нулю
    - Градиент становится несмещённым только после первого обновления базовой линии, до этого шаги обучения нужно пропускать
