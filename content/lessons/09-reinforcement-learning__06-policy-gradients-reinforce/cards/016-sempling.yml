- concept: частота выбора действия при сэмплировании сходится к его вероятности в политике
  question: Политика в некотором состоянии даёт вероятности действий 0,5, 0,3, 0,15 и 0,05. Агент попадает в это состояние 800 раз и каждый раз сэмплирует действие. Сколько примерно раз будет выбрано действие с вероятностью 0,05?
  explanation: 'Ожидаемое число выборов = вероятность × число попыток: 0,05 · 800 = 40. Именно поэтому редкое действие всё-таки проверяется: за один проход оно почти наверняка не выпадет, но на длинной серии эпизодов накапливается достаточно опыта, чтобы обучение подняло или опустило его вероятность.'
  kind: numeric
  answer: 40
  tolerance: 5
  id: 016-sempling-2
  fingerprint: '222597e7'
- concept: действие с нулевой вероятностью никогда не сэмплируется, поэтому обучение не может его переоценить
  question: Объясни своими словами, почему для стохастической политики опасно, если вероятность какого-то действия становится ровно нулевой.
  explanation: 'Ноль вероятности — необратимая потеря исследования: действие не сэмплируется, опыта по нему нет, обновлять его вероятность нечем. Отсюда же практический приём +1e-12 внутри логарифма: он спасает от −∞ и порчи всех весов, но не возвращает действие в игру.'
  kind: open
  reference: 'Сэмплирование выбирает действие пропорционально его вероятности, поэтому действие с вероятностью 0 не попадёт ни в один эпизод. Раз оно не выполняется, про его награду не собирается опыт, и градиент по его вероятности не получает подкрепляющего сигнала — вероятность остаётся нулевой навсегда. Даже если это действие ведёт к высокой награде, агент никогда об этом не узнает: возможность исправить ошибочную оценку исчезает вместе с ненулевой вероятностью. Пока вероятность положительна (пусть 0,02), действие изредка проверяется и может быть переоценено. Дополнительно: нулевая вероятность даёт log(0) = −∞, из-за чего в log_prob добавляют малую константу.'
  id: 016-sempling-3
  fingerprint: 308a646e
