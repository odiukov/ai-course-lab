- concept: reward-to-go для всех шагов эпизода вычисляется одним обратным проходом по рекуррентности G_t = r_{t+1} + γ·G_{t+1}
  question: Эпизод уже собран, награды сохранены. Расставьте шаги эффективного вычисления reward-to-go для всех моментов времени.
  explanation: Прямое суммирование хвоста для каждого t стоит O(T²). Рекуррентность G_t = r_{t+1} + γ·G_{t+1} идёт с конца эпизода и даёт все значения за один проход, O(T). Именно так reward-to-go считают в реализациях REINFORCE.
  kind: order
  items:
    - Взять последний шаг эпизода и положить его reward-to-go равным последней награде
    - Перейти на один шаг назад по эпизоду
    - Взять награду текущего шага и прибавить к ней γ, умноженное на уже посчитанный reward-to-go следующего шага
    - Повторять сдвиг назад и пересчёт, пока не будет обработан первый шаг эпизода
  id: 008-reward-to-go-3
  fingerprint: b071d4ac
