- concept: действие, после которого наград больше нет, получает нулевой вес при reward-to-go, хотя полный возврат траектории дал бы ему большой положительный вес
  question: 'Эпизод из четырёх шагов, награды после действий: 8, 3, 0, 0; γ = 0,6. Каким множителем взвешивается градиент лог-вероятности последнего, четвёртого действия при использовании reward-to-go?'
  explanation: 'Reward-to-go суммирует только награды после действия: для последнего шага это единственная награда 0, значит вес равен 0. Взвешивание полным возвратом дало бы этому же действию 8 + 0,6·3 = 9,8 — жирную похвалу за очки, набранные задолго до него.'
