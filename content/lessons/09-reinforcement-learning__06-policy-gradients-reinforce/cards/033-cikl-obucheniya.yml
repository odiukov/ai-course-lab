- concept: замена скользящего среднего обучаемой оценкой состояния превращает REINFORCE в actor-critic
  question: В REINFORCE базовая линия — скользящее среднее возвратов последних эпизодов. Её заменяют на отдельную модель, которая по состоянию предсказывает ожидаемый возврат из этого состояния и обучается вместе с политикой. Какой алгоритм получается?
  explanation: 'Обучаемая V̂(s) — это critic: она даёт своё ожидание для каждого состояния, а политика (actor) взвешивает градиенты преимуществом возврат − V̂(s). Действия по-прежнему выбирает политика сэмплированием, поэтому это не Q-learning; и данные всё так же собираются текущей политикой, поэтому off-policy это не делает.'
  kind: choice
  options:
    - 'Actor-critic: политика остаётся actor, обучаемая оценка состояния становится critic'
    - 'Q-learning: обучаемая оценка состояния заменяет политику и действия выбираются argmax'
    - 'Off-policy REINFORCE: обучаемая базовая линия позволяет переиспользовать старые траектории'
    - 'Ничего не меняется: любая базовая линия даёт тот же алгоритм, только с другим кодом'
  correct: 0
  id: 033-cikl-obucheniya-1
  fingerprint: 247b3587
- concept: baseline-скользящее среднее считается по предыдущим эпизодам, а свежий возврат входит в него только после того, как использован для сравнения
  question: 'Базовая линия — среднее возвратов последних четырёх эпизодов. Последние четыре возврата: −30, −26, −24, −16. Свежий завершённый эпизод дал возврат −9. Какое значение базовой линии используется при вычислении преимуществ этого свежего эпизода?'
  explanation: 'Порядок жёсткий: сначала возврат сравнивается с базовой линией, построенной по прошлому опыту, и только потом сам добавляется в неё. Среднее (−30 − 26 − 24 − 16)/4 = −24, преимущество равно −9 − (−24) = +15. Если сначала включить −9 в среднее, базовая линия подтянется к возврату, преимущество сожмётся, и эпизод частично оценит сам себя.'
  kind: numeric
  answer: -24
  tolerance: 0.01
  id: 033-cikl-obucheniya-2
  fingerprint: c9c47c2b
- concept: 'скользящее среднее возвратов — базовая линия без обучаемых параметров: одно число, обновляемое после эпизода'
  question: Объясни своими словами, почему скользящее среднее возвратов считается самой дешёвой возможной базовой линией, и что при этом теряется по сравнению с обучаемой оценкой состояния.
  explanation: 'Ключевая развилка: стоимость против точности точки сравнения. Скользящее среднее — ноль обучаемых параметров и одно обновление на эпизод; V̂(s) — отдельная модель, зато точка сравнения своя для каждого состояния. Обе базовые линии несмещённые, потому что ни одна не зависит от выбранного действия.'
  kind: open
  reference: 'Скользящее среднее — одно скалярное число, у него нет обучаемых параметров, нет отдельного прямого и обратного прохода: после каждого эпизода в него дописывается новый возврат за O(1). Поэтому дисперсию обновлений оно снижает почти бесплатно, и в маленьких средах вроде GridWorld этого хватает для сходимости. Теряется зависимость от состояния: одно число описывает всю среду, поэтому в состояниях, где возврат систематически выше или ниже общего среднего, точка сравнения смещена и часть дисперсии остаётся. Обучаемая V̂(s) даёт своё ожидание для каждого состояния, но стоит отдельной модели, её параметров и своей ошибки оценки.'
  id: 033-cikl-obucheniya-3
  fingerprint: 67ad5cb2
