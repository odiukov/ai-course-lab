- concept: on-policy обучение обменивает эффективность по данным на корректность оценки градиента
  question: Объясни своими словами, почему on-policy методы вроде REINFORCE считаются неэффективными по данным, и какой ценой off-policy-поправки возвращают старые переходы в обучение.
  explanation: 'Ключевая связка: свежесть данных нужна не из аккуратности, а потому что сама формула градиента — матожидание по траекториям текущей политики. Importance sampling снимает требование свежести, но платит дисперсией, поэтому его комбинируют с ограничением шага политики.'
  kind: open
  reference: Каждый переход стоит реального взаимодействия со средой, но в on-policy схеме используется ровно для одного обновления, после чего распределение данных перестаёт соответствовать новым параметрам, и переход выбрасывается. Отсюда потребность в тысячах эпизодов у ванильного REINFORCE. Off-policy-поправка через importance sampling умножает старый переход на отношение π_new/π_old и делает оценку снова состоятельной, но при заметном расхождении политик это отношение может быть очень большим или очень маленьким, из-за чего дисперсия оценки градиента резко растёт. Практический компромисс — ограничивать расхождение или обрезать вес (PPO).
  id: 032-svezhest-dannyh-3
  fingerprint: 400ef95e
