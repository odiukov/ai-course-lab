- concept: повторное применение градиента, посчитанного по устаревшим траекториям, оценивает градиент не текущей политики, а той, что собирала данные
  question: Агент обучается ванильным REINFORCE. Инженер решил сэкономить и делает 8 подряд шагов градиентного подъёма по одному и тому же батчу траекторий, без каких-либо поправок. Что принципиально ломается начиная со второго шага?
  explanation: Формула градиента — матожидание по траекториям, порождённым текущей политикой. Первый шаг корректен, дальше распределение данных отстаёт от параметров, и агент двигается по подсказке для своего прошлого поведения. Награды и состояния при этом не «портятся» — портится именно соответствие распределения. Легально переиспользовать батч можно только с поправкой importance sampling (и лучше с обрезкой, как в PPO).
  kind: choice
  options:
    - Возвраты G_t перестают быть дисконтированными и требуют пересчёта с другим γ
    - 'Оценка перестаёт быть оценкой градиента текущей политики: данные распределены по старой π, а параметры уже другие'
    - Награды среды становятся недействительными, потому что эпизоды уже завершены
    - Градиент логарифма вероятности обнуляется, так как действия уже были выбраны
  correct: 1
