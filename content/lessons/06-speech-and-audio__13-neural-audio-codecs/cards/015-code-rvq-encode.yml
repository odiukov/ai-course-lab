- concept: ранние ступени RVQ сильнее влияют на разборчивость аудио, чем поздние
  question: В RVQ-аудиокодеке отдельно заменили случайными индексами выход самой ранней и самой поздней ступени. Какая порча обычно сильнее ухудшит разборчивость речи?
  explanation: 'Ранний codebook задаёт основную, грубую часть представления сигнала, поэтому его случайные индексы разрушают речь сильнее. Поздний codebook вносит небольшие уточнения: как в эксперименте с codebook 7, его порча может быть почти незаметна.'
  kind: choice
  options:
    - Порча самой ранней ступени
    - Порча самой поздней ступени
    - Обе порчи повлияют одинаково
    - Ни одна порча не повлияет на декодирование
  correct: 0
  id: 015-code-rvq-encode-1
  fingerprint: bdb8d164
- concept: качество RVQ растёт с насыщением при добавлении codebook'ов
  question: Почему при выборе числа активных codebook'ов в аудиокодеке разумно искать изгиб кривой «ошибка — битрейт», а не просто включать максимум доступных ступеней?
  explanation: Улучшение качества RVQ имеет убывающую отдачу. В предложенном опыте ожидается большой скачок между 1 и 4 codebook'ами, меньший между 4 и 8 и почти незаметный между 8 и 32, хотя битрейт продолжает расти.
  kind: open
  reference: После нескольких первых ступеней каждый следующий codebook обычно даёт всё меньший выигрыш в качестве, но продолжает увеличивать битрейт. Изгиб кривой показывает компромисс, после которого дополнительный трафик почти не уменьшает ошибку.
  id: 015-code-rvq-encode-2
  fingerprint: '16739323'
