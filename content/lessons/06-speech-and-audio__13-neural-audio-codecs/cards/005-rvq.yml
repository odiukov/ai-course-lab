- concept: число битов для индексов RVQ линейно растёт с количеством codebook'ов
  question: RVQ использует 6 codebook'ов по 512 кодов. Сколько бит нужно записать для одного кадра, если передаётся по одному индексу из каждого codebook?
  explanation: Индекс среди 512 вариантов занимает log₂(512) = 9 бит. Для 6 независимо выбранных индексов требуется 6 × 9 = 54 бита.
  kind: numeric
  answer: 54
  tolerance: 0.01
  id: 005-rvq-1
  fingerprint: ddecd185
- concept: последовательное квантование остатка в RVQ
  question: Расположи этапы кодирования и восстановления кадра с помощью RVQ в правильном порядке.
  explanation: Каждая ступень приближает не исходный вектор заново, а ошибку предыдущих ступеней. Сумма выбранных векторов образует итоговое квантованное представление кадра.
  kind: order
  items:
    - Принять выход энкодера за начальный остаток
    - Выбрать в текущем codebook вектор, наиболее близкий к остатку
    - Вычесть выбранный вектор из остатка и передать новый остаток следующему codebook
    - В декодере сложить выбранные векторы всех ступеней
  id: 005-rvq-2
  fingerprint: 582b9887
- concept: комбинаторная ёмкость каскада RVQ без явного хранения всех комбинаций
  question: Почему несколько небольших codebook'ов в RVQ могут задавать гораздо больше вариантов квантованного вектора, чем суммарное число хранящихся в них кодов?
  explanation: Каждая ступень независимо выбирает код для оставшегося residual. Комбинация выборов определяет сумму векторов, поэтому число возможных результатов перемножается, хотя сами таблицы остаются небольшими.
  kind: choice
  options:
    - Выбранные на разных ступенях векторы складываются, поэтому их сочетания образуют множество возможных сумм
    - Декодер хранит отдельную запись для каждого возможного входного сигнала
    - Каждый следующий codebook полностью заменяет выбор предыдущего
    - Все codebook'и во время инференса объединяются в одну явно сохранённую таблицу
  correct: 0
  id: 005-rvq-3
  fingerprint: 2bc4efab
