- concept: дискретный выход нейросетевого аудиокодека позволяет моделировать аудио как последовательность токенов
  question: Для генерации речи трансформером выбирают между классическим кодеком с более высоким PESQ и нейросетевым кодеком, который выдаёт индексы из конечных codebook’ов. Какое преимущество второго кодека непосредственно важно для генерации?
  explanation: Индексы codebook’ов образуют конечный словарь, поэтому трансформер может предсказывать следующий индекс как обычный токен. Opus даёт сжатый поток байтов и не предоставляет такого токенного интерфейса, хотя при 20 kbps достигает более высокого PESQ.
  kind: choice
  options:
    - Он гарантирует более точное восстановление исходной волны
    - Его выход можно предсказывать как последовательность категориальных токенов
    - Он устраняет необходимость декодировать сжатое представление
    - Его PESQ автоматически растёт при обучении языковой модели
  correct: 1
  id: 040-pesq-opus-1
  fingerprint: 20966f3c
- concept: PESQ оценивает качество реконструкции, но не пригодность представления для генеративной модели
  question: Почему нельзя выбирать аудиокодек для генеративной речевой модели только по значению PESQ?
  explanation: Opus получает PESQ 4.0 и опережает Mimi с PESQ 3.1, но это сравнение относится к реконструкции. Для генерации также нужны дискретный словарь, предсказуемость токенов языковой моделью и приемлемый битрейт.
  kind: open
  reference: PESQ оценивает воспринимаемое сходство реконструкции с исходным аудио, но не показывает, выдаёт ли кодек дискретные токены, насколько удобно языковой модели их предсказывать и какова длина получающейся последовательности.
  id: 040-pesq-opus-2
  fingerprint: a64b4ef2
