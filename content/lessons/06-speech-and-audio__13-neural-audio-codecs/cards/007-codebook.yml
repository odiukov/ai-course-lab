- concept: codebook сопоставляет дискретные индексы обученным векторам
  question: Что хранится в codebook нейронного аудиокодека?
  explanation: Codebook — это таблица обучаемых векторов. Квантователь передаёт индекс выбранной записи, а декодер по этому индексу извлекает соответствующий вектор.
  kind: choice
  options:
    - Правила арифметического кодирования аудиопотока
    - Таблица обученных векторов, к которым обращаются по дискретным индексам
    - Текстовые названия фонем и музыкальных нот
  correct: 1
  id: 007-codebook-1
  fingerprint: 1bb63219
- concept: декодирование индекса требует одинакового соответствия между индексами и векторами у энкодера и декодера
  question: Объясни своими словами, почему индекс codebook нельзя правильно декодировать с помощью другой версии этой таблицы.
  explanation: Сам индекс не содержит координат кодового вектора. Он работает как ссылка на запись, поэтому обе стороны должны использовать один и тот же codebook с одинаковым порядком записей.
  kind: open
  reference: Индекс обозначает только позицию записи в конкретном codebook. Если таблицы различаются или записи расположены в другом порядке, декодер извлечёт не тот вектор, который выбрал энкодер, и восстановленный сигнал исказится.
  id: 007-codebook-2
  fingerprint: 22f5bf75
