- concept: знак остатка задаёт направление коррекции на следующей ступени RVQ
  question: Первая ступень RVQ выбрала кодовый вектор, одна из координат которого больше соответствующей координаты исходного вектора. Какой знак будет иметь эта координата остатка?
  explanation: Остаток вычисляется как r = x − c. Если выбранная координата c больше исходной x, разность отрицательна, поэтому следующая ступень должна скорректировать результат вниз.
  kind: choice
  options:
    - Положительный
    - Нулевой
    - Отрицательный
  correct: 2
  id: 011-residual-1
  fingerprint: 9b097610
- concept: поздние codebook'и RVQ обучаются квантовать распределение остатков
  question: На каких данных должен специализироваться второй codebook в RVQ?
  explanation: Второй codebook получает остаток r = x − c первой ступени. Поэтому его векторы покрывают характерные ошибки первой аппроксимации, обычно лежащие в более узком диапазоне, чем исходные латентные значения.
  kind: choice
  options:
    - На исходных аудиосэмплах до энкодера
    - На индексах, выбранных первой ступенью
    - На ошибках между латентными векторами и кодами первой ступени
  correct: 2
  id: 011-residual-2
  fingerprint: 5f3c5505
