- concept: трансформер EnCodec моделирует временные зависимости между латентными кадрами
  question: Какую функцию выполняет трансформер в архитектуре EnCodec?
  explanation: Свёртки извлекают локальные признаки волны, а трансформер добавляет контекст между соседними по времени латентными кадрами. После этого представление проходит через узкое горлышко RVQ.
  kind: choice
  options:
    - Учитывает связи между кадрами латентной последовательности
    - Выбирает частоту дискретизации исходной записи
    - Преобразует индексы codebook непосредственно в значения PCM
    - Заменяет обучение кодовых векторов сортировкой индексов
  correct: 0
