- concept: положение RVQ в тракте EnCodec между энкодером и декодером
  question: Расположите этапы обработки сигнала в EnCodec в правильном порядке.
  explanation: EnCodec сначала сжимает волну энкодером, затем обрабатывает временной контекст и квантует латентные кадры с помощью RVQ. Декодер выполняет обратное преобразование в волну.
  kind: order
  items:
    - Свёрточный энкодер преобразует волну в последовательность латентных кадров
    - Трансформер учитывает временной контекст латентных кадров
    - RVQ заменяет каждый латентный кадр набором дискретных индексов
    - Декодер восстанавливает звуковую волну из квантованных представлений
  id: 022-encodec-1
  fingerprint: 5923afff
- concept: сокращение временной последовательности выполняет энкодер до квантования
  question: Почему размещение RVQ после свёрточного энкодера позволяет EnCodec получить более короткое дискретное представление, чем квантование каждого отсчёта волны?
  explanation: Само квантование меняет непрерывные значения на дискретные, но не обязано сокращать их количество. В EnCodec длину последовательности уменьшает энкодер, который преобразует множество отсчётов волны в существенно меньшее число латентных кадров.
  kind: choice
  options:
    - Энкодер объединяет группы отсчётов в более редкие латентные кадры, и RVQ кодирует уже эти кадры
    - RVQ автоматически удаляет повторяющиеся индексы после квантования
    - Декодер отбрасывает часть индексов перед восстановлением волны
    - Трансформер заменяет всю запись единственным индексом
  correct: 0
