  fingerprint: d197e1ba
- concept: разделение семантических и акустических токенов упрощает генерацию речи языковой моделью
  question: Почему языковой модели обычно проще генерировать речь через semantic-first кодек, чем через кодек, оптимизированный только на реконструкцию?
  explanation: 'В reconstruction-first токенах слова, голос и прочие особенности звука переплетены. Mimi и SpeechTokenizer факторизуют представление: семантический поток отвечает за содержание, а остальные потоки — за акустические детали, что упрощает моделирование речи.'
  kind: open
  reference: Semantic-first кодек предоставляет отдельное представление лингвистического и фонетического содержания, а акустические детали выносит в другие потоки. Языковой модели не приходится одновременно извлекать структуру языка и структуру звучания из одних и тех же запутанных токенов.
  id: 002-dva-semeystva-2
  fingerprint: ad918352
