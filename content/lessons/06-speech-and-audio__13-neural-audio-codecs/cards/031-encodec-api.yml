- concept: оси тензора кодов EnCodec соответствуют батчу, ступеням RVQ и временным кадрам
  question: EnCodec вернул тензор кодов формы `(B, Q, T)`. Что обозначают его оси?
  explanation: 'Для каждого элемента батча кодек выдаёт по одному индексу от каждого активного codebook на каждом временном кадре. Поэтому оси идут в порядке: батч, codebook, время.'
  kind: choice
  options:
    - '`B` — временные кадры, `Q` — элементы батча, `T` — ступени RVQ'
    - '`B` — ступени RVQ, `Q` — временные кадры, `T` — элементы батча'
    - '`B` — элементы батча, `Q` — активные ступени RVQ, `T` — временные кадры'
  correct: 2
  id: 031-encodec-api-1
  fingerprint: 8fee651a
- concept: целевая полоса пропускания управляет числом активных codebook, не меняя временную сетку
  question: Один и тот же аудиосигнал дважды кодируют EnCodec, но во втором запуске уменьшают `target_bandwidth`. Объясни, какая ось тензора `codes` должна уменьшиться, какая сохранится и почему.
  explanation: '`target_bandwidth` регулирует объём дискретной информации на кадр через число активных codebook. Частоту появления самих кадров задаёт энкодер, поэтому при неизменном входе временная длина тензора не меняется.'
  kind: open
  reference: 'Уменьшится ось активных ступеней RVQ: на каждый временной кадр будет записано меньше индексов. Ось временных кадров сохранится, поскольку её задают длительность сигнала и временное сжатие энкодера, а не выбранное число ступеней квантования.'
  id: 031-encodec-api-2
  fingerprint: 05897af0
