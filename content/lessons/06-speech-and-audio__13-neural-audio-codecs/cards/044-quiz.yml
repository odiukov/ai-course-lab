- concept: PESQ и ViSQOL являются объективными приближениями к субъективной оценке MOS
  question: Чем оценки PESQ и ViSQOL отличаются от MOS, хотя и коррелируют с ней?
  explanation: PESQ и ViSQOL автоматически сравнивают аудиосигналы и служат приближёнными показателями воспринимаемого качества. MOS основана на прослушивании и оценках людей, поэтому это связанные, но не тождественные измерения.
  kind: open
  reference: PESQ и ViSQOL вычисляются алгоритмически, поэтому называются объективными метриками. MOS получают из субъективных оценок слушателей. Корреляция означает, что метрики часто отражают человеческое восприятие качества, но не делает их прямыми оценками людей.
  id: 044-quiz-2
