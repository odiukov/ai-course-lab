- concept: в генеративном и сетевом трактах одной системы могут использоваться разные кодеки
  question: Голосовой ассистент внутри сервера генерирует речь языковой моделью, а затем передаёт готовый звук пользователю. Объясни, какие кодеки уместны внутри генератора и при передаче по сети.
  explanation: Назначение кодека определяется ролью конкретного участка системы. Mimi или SNAC дают токенный интерфейс для генерации, а Opus эффективнее доставляет уже созданный аудиосигнал.
  kind: open
  reference: 'Внутри генератора уместны Mimi или SNAC: языковая модель может предсказывать их аудиотокены. После декодирования готовый звук лучше передавать через Opus, поскольку на сетевом этапе токены для LM уже не нужны, а важны эффективное сжатие и низкая вычислительная нагрузка.'
  id: 042-use-it-1
  fingerprint: 4c911898
- concept: локальное редактирование аудио сочетает reconstruction-first кодек DAC с inpainting
  question: Редактор должен заменить повреждённый фрагмент записи, сохранив остальной звук максимально близким к оригиналу. Какой вариант лучше соответствует этой задаче?
  explanation: Для тонкого локального редактирования важна точность реконструкции, поэтому подходит DAC-44.1k, а inpainting генерирует содержимое только в изменяемой области. Остальные варианты ориентированы на передачу либо другие сценарии генерации.
  kind: choice
  options:
    - DAC с inpainting
    - Opus без генеративной модели
    - Mimi с авторегрессивной языковой моделью
    - EnCodec с текстовым условием T5
