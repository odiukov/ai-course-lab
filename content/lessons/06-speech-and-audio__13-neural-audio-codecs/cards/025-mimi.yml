- concept: снижение частоты кадров сокращает последовательность ценой более грубого временного разрешения
  question: Почему низкая частота кадров аудиокодека удобна для авторегрессивной генерации речи и какое ограничение она создаёт?
  explanation: Чем реже появляются кадры, тем короче временная последовательность. Обратная сторона — каждый дискретный кадр должен описывать больший участок речи, поэтому обычная оптимизация только на восстановление волны может ухудшить передачу фонетического содержания.
  kind: open
  reference: Языковой модели приходится предсказывать меньше временных позиций, поэтому генерация требует более короткого контекста и меньшего числа шагов. Однако каждый кадр охватывает более длинный фрагмент сигнала, из-за чего кодеку труднее сохранить быстрые фонетические изменения без дополнительного семантического обучения.
