- concept: нормировка ошибки на число отсчётов позволяет сравнивать сигналы разной длительности
  question: Заполни знаменатель в реализации средней ошибки восстановления для списков одинаковой длины.
  explanation: Деление на число отсчётов превращает сумму квадратов ошибок в среднее. Поэтому значение метрики не растёт лишь из-за большей длительности сигнала.
  kind: cloze
  template: return sum((x - x_hat) * (x - x_hat) for x, x_hat in zip(original, reconstructed)) / ___
  answer: len(original)
  accept:
    - len(reconstructed)
  id: 019-code-reconstruction-mse-1
  fingerprint: ed3c7696
- concept: MSE достигает минимального значения только при поэлементном совпадении сигналов
  question: При каком условии reconstruction MSE достигает своего минимально возможного значения? Объясни через свойства квадратов ошибок.
  explanation: Отдельный квадрат ошибки не бывает отрицательным. Если хотя бы одна пара отсчётов различается, её вклад положителен; при полном поэлементном совпадении все вклады исчезают.
  kind: open
  reference: MSE минимальна, когда каждый восстановленный отсчёт совпадает с соответствующим исходным отсчётом. Квадраты разностей неотрицательны, поэтому их среднее может стать минимальным лишь тогда, когда каждая разность равна нулю.
  id: 019-code-reconstruction-mse-2
  fingerprint: 44c8a702
