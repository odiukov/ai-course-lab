- concept: MSE чувствителен к малому временному сдвигу из-за поэлементного сопоставления сигналов
  question: Почему слегка сдвинутая во времени реконструкция может получить большой MSE, хотя на слух почти не отличается от оригинала?
  explanation: MSE не выравнивает сигналы во времени и не моделирует слуховое восприятие. Поэтому даже незаметный для человека сдвиг способен резко увеличить поэлементную ошибку; воспринимаемое качество лучше оценивать метриками вроде PESQ или ViSQOL.
  kind: open
  reference: MSE сопоставляет отсчёты с одинаковыми индексами. После временного сдвига каждый отсчёт сравнивается уже с другим участком сигнала, поэтому возникает множество поэлементных ошибок, даже если форма и воспринимаемое звучание сохранились.
