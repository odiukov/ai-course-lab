- concept: MSE усредняет квадраты поэлементных ошибок
  question: Заполни выражение для средней квадратичной ошибки между исходным сигналом x и реконструкцией x_hat.
  explanation: Квадрат делает вклад каждой ошибки неотрицательным, поэтому отклонения в разные стороны не компенсируют друг друга при усреднении.
  kind: cloze
  template: MSE = mean(___)
  answer: (x - x_hat) * (x - x_hat)
  accept:
    - (x_hat - x) * (x_hat - x)
    - square(x - x_hat)
    - square(x_hat - x)
  id: 018-oshibka-2
  fingerprint: 3d934bfe
- concept: низкий MSE не гарантирует высокого воспринимаемого качества аудио
  question: Почему при сравнении аудиокодеков нельзя считать вариант с меньшим MSE безусловно более качественным на слух?
  explanation: MSE полезен как грубая проверка корректности восстановления, но слуховая заметность ошибок зависит не только от их амплитуды. PESQ и ViSQOL лучше учитывают воспринимаемое качество.
  kind: open
  reference: MSE измеряет поотсчётное квадратичное расхождение и не моделирует особенности человеческого слуха. Разные типы искажений с похожим MSE могут восприниматься по-разному, поэтому для оценки слышимого качества используют перцептивные метрики, например PESQ или ViSQOL.
  id: 018-oshibka-3
