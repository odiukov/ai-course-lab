<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Два порядка обхода одного графа</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --canvas: #ffffff;
      --ink: #172033;
      --muted: #59657a;
      --frame: #cbd3df;
      --edge: #68758b;
      --node: #ffffff;
      --node-stroke: #24334d;
      --bfs: #1769d2;
      --bfs-soft: #e5f0ff;
      --dfs: #d85b12;
      --dfs-soft: #fff0e6;
      --level-a: #f2f6fb;
      --level-b: #edf4fc;
      --level-c: #f2f6fb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --canvas: #18202d;
        --ink: #edf3fc;
        --muted: #b1bdd0;
        --frame: #3d4a5e;
        --edge: #8f9db2;
        --node: #202b3b;
        --node-stroke: #d7e2f2;
        --bfs: #68a8ff;
        --bfs-soft: #203c61;
        --dfs: #ff985b;
        --dfs-soft: #59331f;
        --level-a: #1c2635;
        --level-b: #202d3e;
        --level-c: #1c2635;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      background: var(--canvas);
    }

    h1 {
      margin: unset;
      padding: 14px 18px 10px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    figure {
      margin: unset;
      background: var(--canvas);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--canvas);
    }

    .canvas-frame {
      fill: var(--canvas);
      stroke: var(--frame);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .route-panel {
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .route-panel.bfs {
      fill: var(--bfs-soft);
      stroke: var(--bfs);
    }

    .route-panel.dfs {
      fill: var(--dfs-soft);
      stroke: var(--dfs);
    }

    .route-title {
      font-size: 18px;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .route-title.bfs,
    .legend-swatch.bfs {
      fill: var(--bfs);
    }

    .route-title.dfs,
    .legend-swatch.dfs {
      fill: var(--dfs);
    }

    .divider {
      stroke: var(--frame);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .level-band {
      stroke: var(--frame);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .level-band.start {
      fill: var(--level-a);
    }

    .level-band.near {
      fill: var(--level-b);
    }

    .level-band.deep {
      fill: var(--level-c);
    }

    .edge {
      fill: none;
      stroke: var(--edge);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .node {
      fill: var(--node);
      stroke: var(--node-stroke);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .node-id {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .badge {
      stroke: var(--canvas);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .badge.bfs {
      fill: var(--bfs);
    }

    .badge.dfs {
      fill: var(--dfs);
    }

    .badge-number {
      fill: #ffffff;
      font-size: 13px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .band-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .legend-swatch {
      stroke: var(--canvas);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      margin: unset;
      padding: 18px;
      background: var(--canvas);
      color: var(--ink);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Два порядка обхода одного графа</h1>

    <figure aria-labelledby="diagram-title">
      <svg
        id="diagram"
        viewBox="0 0 1000 420"
        width="1000"
        height="420"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="diagram-title"
      ></svg>

      <p id="fallback" hidden>
        Один граф из пяти узлов: порядок BFS — 0, 1, 2, 3, 4;
        порядок DFS — 0, 1, 3, 4, 2.
      </p>
    </figure>
  </main>

  <script>
    const DATA = [{
      mapping: {
        origin: { x: 50, y: 10 },
        scale: 75,
        zero: 0
      },

      frame: {
        x: 0.14,
        y: 0.08,
        w: 12.52,
        h: 5.38
      },

      style: {
        corner: 0.12,
        nodeRadius: 0.38,
        badgeRadius: 0.23,
        swatchRadius: 0.12
      },

      routes: [
        {
          kind: "bfs",
          name: "BFS · очередь",
          order: [0, 1, 2, 3, 4],
          panel: { x: 0.34, y: 0.18, w: 5.82, h: 0.68 },
          label: { x: 0.60, y: 0.52, anchor: "start" }
        },
        {
          kind: "dfs",
          name: "DFS · стек",
          order: [0, 1, 3, 4, 2],
          panel: { x: 6.30, y: 0.18, w: 6.02, h: 0.68 },
          label: { x: 6.56, y: 0.52, anchor: "start" }
        }
      ],

      divider: {
        from: { x: 0.38, y: 1.04 },
        to: { x: 12.28, y: 1.04 }
      },

      bands: [
        {
          kind: "start",
          x: 0.36,
          y: 1.27,
          w: 2.34,
          h: 3.22,
          label: { x: 1.53, y: 4.73, text: "старт" }
        },
        {
          kind: "near",
          x: 2.86,
          y: 1.27,
          w: 2.34,
          h: 3.22,
          label: { x: 4.03, y: 4.73, text: "соседи старта" }
        },
        {
          kind: "deep",
          x: 5.38,
          y: 1.27,
          w: 6.90,
          h: 3.22,
          label: { x: 8.83, y: 4.73, text: "следующие уровни" }
        }
      ],

      nodes: [
        {
          id: 0,
          x: 1.48,
          y: 2.91,
          bfs: { order: 0, x: 0.92, y: 2.31 },
          dfs: { order: 0, x: 2.04, y: 3.51 }
        },
        {
          id: 1,
          x: 4.03,
          y: 1.95,
          bfs: { order: 1, x: 3.47, y: 1.39 },
          dfs: { order: 1, x: 4.59, y: 2.55 }
        },
        {
          id: 2,
          x: 4.03,
          y: 3.75,
          bfs: { order: 2, x: 3.47, y: 3.19 },
          dfs: { order: 4, x: 4.59, y: 4.31 }
        },
        {
          id: 3,
          x: 7.12,
          y: 1.95,
          bfs: { order: 3, x: 6.56, y: 1.39 },
          dfs: { order: 2, x: 7.68, y: 2.55 }
        },
        {
          id: 4,
          x: 10.18,
          y: 1.95,
          bfs: { order: 4, x: 9.62, y: 1.39 },
          dfs: { order: 3, x: 10.74, y: 2.55 }
        }
      ],

      edges: [
        { from: 0, to: 1 },
        { from: 0, to: 2 },
        { from: 1, to: 3 },
        { from: 3, to: 4 }
      ],

      legend: [
        {
          kind: "bfs",
          point: { x: 0.58, y: 5.22 },
          text: {
            x: 0.82,
            y: 5.22,
            value: "синяя метка — номер посещения BFS"
          }
        },
        {
          kind: "dfs",
          point: { x: 6.38, y: 5.22 },
          text: {
            x: 6.62,
            y: 5.22,
            value: "оранжевая метка — номер посещения DFS"
          }
        }
      ],

      copy: {
        separator: ", ",
        description:
          "Связи графа одинаковы. Синие метки показывают порядок обхода в ширину, оранжевые — порядок обхода в глубину."
      }
    }];

    const [D] = DATA;
    const origin = D.mapping.origin;
    const scale = D.mapping.scale;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const create = (name, attributes, text) => {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });

        if (text !== undefined) {
          element.textContent = text;
        }

        return element;
      };

      const description = create("desc", {}, D.copy.description);
      svg.appendChild(description);

      const frame = create("rect", {
        class: "canvas-frame",
        x: sx(D.frame.x),
        y: sy(D.frame.y),
        width: sx(D.frame.x + D.frame.w) - sx(D.frame.x),
        height: sy(D.frame.y + D.frame.h) - sy(D.frame.y),
        rx: sx(D.style.corner) - sx(D.mapping.zero),
        ry: sy(D.style.corner) - sy(D.mapping.zero)
      });
      svg.appendChild(frame);

      const routeLayer = create("g", {
        "aria-label": "Последовательности посещения"
      });

      D.routes.forEach(route => {
        const panel = create("rect", {
          class: `route-panel ${route.kind}`,
          x: sx(route.panel.x),
          y: sy(route.panel.y),
          width: sx(route.panel.x + route.panel.w) - sx(route.panel.x),
          height: sy(route.panel.y + route.panel.h) - sy(route.panel.y),
          rx: sx(D.style.corner) - sx(D.mapping.zero),
          ry: sy(D.style.corner) - sy(D.mapping.zero)
        });

        const label = create("text", {
          class: `route-title ${route.kind}`,
          x: sx(route.label.x),
          y: sy(route.label.y),
          "text-anchor": route.label.anchor
        }, `${route.name}: ${route.order.join(D.copy.separator)}`);

        routeLayer.appendChild(panel);
        routeLayer.appendChild(label);
      });

      svg.appendChild(routeLayer);

      const divider = create("line", {
        class: "divider",
        x1: sx(D.divider.from.x),
        y1: sy(D.divider.from.y),
        x2: sx(D.divider.to.x),
        y2: sy(D.divider.to.y)
      });
      svg.appendChild(divider);

      const bandLayer = create("g", {
        "aria-label": "Уровни относительно стартового узла"
      });

      D.bands.forEach(band => {
        const area = create("rect", {
          class: `level-band ${band.kind}`,
          x: sx(band.x),
          y: sy(band.y),
          width: sx(band.x + band.w) - sx(band.x),
          height: sy(band.y + band.h) - sy(band.y),
          rx: sx(D.style.corner) - sx(D.mapping.zero),
          ry: sy(D.style.corner) - sy(D.mapping.zero)
        });

        const caption = create("text", {
          class: "band-label",
          x: sx(band.label.x),
          y: sy(band.label.y),
          "text-anchor": "middle"
        }, band.label.text);

        bandLayer.appendChild(area);
        bandLayer.appendChild(caption);
      });

      svg.appendChild(bandLayer);

      const edgeLayer = create("g", {
        "aria-label": "Связи графа"
      });

      D.edges.forEach(edge => {
        const from = D.nodes.find(node => node.id === edge.from);
        const to = D.nodes.find(node => node.id === edge.to);

        if (!from || !to) {
          throw new Error("Не найдена вершина связи");
        }

        edgeLayer.appendChild(create("line", {
          class: "edge",
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y)
        }));
      });

      svg.appendChild(edgeLayer);

      const nodeLayer = create("g", {
        "aria-label": "Пять узлов с номерами двух обходов"
      });

      D.nodes.forEach(node => {
        const group = create("g", {
          "aria-label":
            `Узел ${node.id}: BFS ${node.bfs.order}, DFS ${node.dfs.order}`
        });

        group.appendChild(create("circle", {
          class: "node",
          cx: sx(node.x),
          cy: sy(node.y),
          r: sx(D.style.nodeRadius) - sx(D.mapping.zero)
        }));

        group.appendChild(create("text", {
          class: "node-id",
          x: sx(node.x),
          y: sy(node.y)
        }, node.id));

        group.appendChild(create("circle", {
          class: "badge bfs",
          cx: sx(node.bfs.x),
          cy: sy(node.bfs.y),
          r: sx(D.style.badgeRadius) - sx(D.mapping.zero)
        }));

        group.appendChild(create("text", {
          class: "badge-number",
          x: sx(node.bfs.x),
          y: sy(node.bfs.y)
        }, node.bfs.order));

        group.appendChild(create("circle", {
          class: "badge dfs",
          cx: sx(node.dfs.x),
          cy: sy(node.dfs.y),
          r: sx(D.style.badgeRadius) - sx(D.mapping.zero)
        }));

        group.appendChild(create("text", {
          class: "badge-number",
          x: sx(node.dfs.x),
          y: sy(node.dfs.y)
        }, node.dfs.order));

        nodeLayer.appendChild(group);
      });

      svg.appendChild(nodeLayer);

      const legendLayer = create("g", {
        "aria-label": "Обозначения цветных меток"
      });

      D.legend.forEach(item => {
        legendLayer.appendChild(create("circle", {
          class: `legend-swatch ${item.kind}`,
          cx: sx(item.point.x),
          cy: sy(item.point.y),
          r: sx(D.style.swatchRadius) - sx(D.mapping.zero)
        }));

        legendLayer.appendChild(create("text", {
          class: "legend-text",
          x: sx(item.text.x),
          y: sy(item.text.y),
          "text-anchor": "start"
        }, item.text.value));
      });

      svg.appendChild(legendLayer);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.replaceChildren();
        svg.setAttribute("aria-hidden", "true");
      }

      if (fallback) {
        fallback.hidden = false;
        fallback.textContent =
          "Схема должна была показать один граф из пяти узлов: " +
          "BFS — 0, 1, 2, 3, 4; DFS — 0, 1, 3, 4, 2.";
      }
    }
  </script>
</body>
</html>
