<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Треугольник и его матрица смежности</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #536079;
      --grid: #aeb8c9;
      --cell: #e8edf5;
      --node: #ffffff;
      --edge-01: #1769aa;
      --edge-12: #b64367;
      --edge-02: #16785c;
      --on-color: #ffffff;
      --halo: #ffffff;
      --rule: #d4dae5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101522;
        --panel: #171e2d;
        --ink: #edf2fb;
        --muted: #b8c2d5;
        --grid: #738098;
        --cell: #293247;
        --node: #171e2d;
        --edge-01: #55a9e6;
        --edge-12: #ef789a;
        --edge-02: #4ec49d;
        --on-color: #101522;
        --halo: #171e2d;
        --rule: #465168;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      max-width: 1000px;
      margin: auto;
      background: var(--panel);
      outline: 1px solid var(--rule);
    }

    h1 {
      font-size: 22px;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    [hidden] {
      display: none;
    }

    .section-title {
      fill: var(--ink);
      font-size: 19px;
      font-weight: 700;
    }

    .caption {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .guide {
      stroke: var(--rule);
      stroke-width: 1px;
    }

    .edge-halo {
      stroke: var(--halo);
      stroke-width: 9px;
      stroke-linecap: round;
    }

    .edge {
      fill: none;
      stroke-width: 6px;
      stroke-linecap: round;
    }

    .edge-01 {
      stroke: var(--edge-01);
    }

    .edge-12 {
      stroke: var(--edge-12);
    }

    .edge-02 {
      stroke: var(--edge-02);
    }

    .node {
      fill: var(--node);
      stroke: var(--ink);
      stroke-width: 3px;
    }

    .node-label {
      fill: var(--ink);
      font-size: 19px;
      font-weight: 750;
      dominant-baseline: middle;
    }

    .matrix-cell {
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .diagonal {
      fill: var(--cell);
    }

    .cell-01 {
      fill: var(--edge-01);
    }

    .cell-12 {
      fill: var(--edge-12);
    }

    .cell-02 {
      fill: var(--edge-02);
    }

    .matrix-index {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
      dominant-baseline: middle;
    }

    .matrix-value {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 750;
      dominant-baseline: middle;
    }

    .matrix-value.connected {
      fill: var(--on-color);
    }

    .bracket {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3px;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .equals {
      fill: var(--muted);
      font-size: 28px;
      font-weight: 700;
      dominant-baseline: middle;
    }

    .legend-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    .legend-line {
      stroke-width: 6px;
      stroke-linecap: round;
    }

    .legend-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 600;
      dominant-baseline: middle;
    }

    #fallback {
      color: var(--ink);
      background: var(--panel);
      font-size: 17px;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Треугольник и его матрица смежности</h1>

    <svg id="diagram"
         viewBox="0 0 1000 440"
         width="1000"
         height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Граф-треугольник и его матрица смежности</title>
      <desc id="svg-desc">
        Рёбра между узлами 0, 1 и 2 окрашены так же, как соответствующие
        симметричные пары единиц в матрице смежности.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать треугольный граф из узлов 0, 1 и 2 рядом
      с матрицей смежности: 0, 1, 1; 1, 0, 1; 1, 1, 0.
    </p>

    <noscript>
      Схема: узлы 0, 1 и 2 соединены попарно; матрица смежности —
      [[0,1,1],[1,0,1],[1,1,0]].
    </noscript>
  </figure>

  <script>
    const diagramData = {
      canvas: { width: 1000, height: 440 },
      guide: { x1: 49, y1: 5, x2: 49, y2: 33 },
      titles: [
        { text: "Граф", x: 22, y: 6, anchor: "middle" },
        { text: "Матрица A", x: 72, y: 6, anchor: "middle" }
      ],
      nodes: [
        { id: "0", x: 22, y: 12 },
        { id: "1", x: 11, y: 27 },
        { id: "2", x: 33, y: 27 }
      ],
      nodeRadius: 2.5,
      edges: [
        {
          from: { x: 22, y: 12 },
          to: { x: 11, y: 27 },
          className: "edge-01"
        },
        {
          from: { x: 11, y: 27 },
          to: { x: 33, y: 27 },
          className: "edge-12"
        },
        {
          from: { x: 22, y: 12 },
          to: { x: 33, y: 27 },
          className: "edge-02"
        }
      ],
      equals: { text: "=", x: 46, y: 20, anchor: "middle" },
      graphCaption: {
        text: "Каждая пара узлов соединена",
        x: 22,
        y: 32,
        anchor: "middle"
      },
      columnCaption: {
        text: "столбец: куда",
        x: 72,
        y: 9,
        anchor: "middle"
      },
      rowCaption: {
        text: "строка: откуда",
        x: 51,
        y: 11.5,
        anchor: "start"
      },
      columnHeaders: [
        { text: "0", x: 64, y: 12 },
        { text: "1", x: 72, y: 12 },
        { text: "2", x: 80, y: 12 }
      ],
      rowHeaders: [
        { text: "0", x: 58, y: 16 },
        { text: "1", x: 58, y: 22 },
        { text: "2", x: 58, y: 28 }
      ],
      cells: [
        { value: "0", x: 61, y: 13, w: 6, h: 6, className: "diagonal" },
        { value: "1", x: 69, y: 13, w: 6, h: 6, className: "cell-01 connected" },
        { value: "1", x: 77, y: 13, w: 6, h: 6, className: "cell-02 connected" },
        { value: "1", x: 61, y: 19, w: 6, h: 6, className: "cell-01 connected" },
        { value: "0", x: 69, y: 19, w: 6, h: 6, className: "diagonal" },
        { value: "1", x: 77, y: 19, w: 6, h: 6, className: "cell-12 connected" },
        { value: "1", x: 61, y: 25, w: 6, h: 6, className: "cell-02 connected" },
        { value: "1", x: 69, y: 25, w: 6, h: 6, className: "cell-12 connected" },
        { value: "0", x: 77, y: 25, w: 6, h: 6, className: "diagonal" }
      ],
      brackets: [
        [
          { x: 60, y: 13 },
          { x: 59, y: 13 },
          { x: 59, y: 31 },
          { x: 60, y: 31 }
        ],
        [
          { x: 84, y: 13 },
          { x: 85, y: 13 },
          { x: 85, y: 31 },
          { x: 84, y: 31 }
        ]
      ],
      matrixCaption: {
        text: "нули на диагонали · единицы вне диагонали",
        x: 72,
        y: 33,
        anchor: "middle"
      },
      legendTitle: {
        text: "Один цвет связывает тропу с двумя зеркальными клетками",
        x: 50,
        y: 36.5,
        anchor: "middle"
      },
      legend: [
        {
          className: "edge-01",
          line: { x1: 8, y1: 40, x2: 12, y2: 40 },
          label: { text: "0—1 ↔ (0,1) и (1,0)", x: 13.5, y: 40, anchor: "start" }
        },
        {
          className: "edge-02",
          line: { x1: 39, y1: 40, x2: 43, y2: 40 },
          label: { text: "0—2 ↔ (0,2) и (2,0)", x: 44.5, y: 40, anchor: "start" }
        },
        {
          className: "edge-12",
          line: { x1: 70, y1: 40, x2: 74, y2: 40 },
          label: { text: "1—2 ↔ (1,2) и (2,1)", x: 75.5, y: 40, anchor: "start" }
        }
      ]
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 10, y: 10 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelPadding = { x: 8, y: 8 };
    const lineWidths = { guide: 1, edge: 6, node: 3 };
    const fontSizes = { small: 14, regular: 17, large: 22 };

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (tag, attributes, text) => {
        const element = document.createElementNS(namespace, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, value);
        });

        if (text !== undefined) {
          element.textContent = text;
        }

        return element;
      };

      const addText = (item, className) => {
        svg.appendChild(make("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor || "middle",
          class: className
        }, item.text));
      };

      const addLine = (item, className) => {
        svg.appendChild(make("line", {
          x1: sx(item.x1),
          y1: sy(item.y1),
          x2: sx(item.x2),
          y2: sy(item.y2),
          class: className
        }));
      };

      addLine(diagramData.guide, "guide");

      diagramData.titles.forEach(item => addText(item, "section-title"));
      addText(diagramData.equals, "equals");

      diagramData.edges.forEach(edge => {
        addLine({
          x1: edge.from.x,
          y1: edge.from.y,
          x2: edge.to.x,
          y2: edge.to.y
        }, "edge-halo");

        addLine({
          x1: edge.from.x,
          y1: edge.from.y,
          x2: edge.to.x,
          y2: edge.to.y
        }, `edge ${edge.className}`);
      });

      diagramData.nodes.forEach(node => {
        svg.appendChild(make("circle", {
          cx: sx(node.x),
          cy: sy(node.y),
          r: sx(diagramData.nodeRadius),
          class: "node"
        }));

        svg.appendChild(make("text", {
          x: sx(node.x),
          y: sy(node.y),
          "text-anchor": "middle",
          class: "node-label"
        }, node.id));
      });

      addText(diagramData.graphCaption, "caption");
      addText(diagramData.columnCaption, "caption");
      addText(diagramData.rowCaption, "caption");

      diagramData.columnHeaders.forEach(item => {
        addText({
          text: item.text,
          x: item.x,
          y: item.y,
          anchor: "middle"
        }, "matrix-index");
      });

      diagramData.rowHeaders.forEach(item => {
        addText({
          text: item.text,
          x: item.x,
          y: item.y,
          anchor: "middle"
        }, "matrix-index");
      });

      diagramData.cells.forEach(cell => {
        svg.appendChild(make("rect", {
          x: sx(cell.x),
          y: sy(cell.y),
          width: sx(cell.w),
          height: sy(cell.h),
          class: `matrix-cell ${cell.className.split(" ").shift()}`
        }));

        svg.appendChild(make("text", {
          x: sx(cell.x + cell.w / scale.x * scale.x / diagramData.nodeRadius),
          y: sy(cell.y + cell.h / scale.y * scale.y / diagramData.nodeRadius),
          "text-anchor": "middle",
          class: `matrix-value ${cell.className.includes("connected") ? "connected" : ""}`
        }, cell.value));
      });

      diagramData.brackets.forEach(points => {
        const commands = points.map((point, index) => {
          const command = index === origin.x ? "M" : "L";
          return `${command} ${sx(point.x)} ${sy(point.y)}`;
        }).join(" ");

        svg.appendChild(make("path", {
          d: commands,
          class: "bracket"
        }));
      });

      addText(diagramData.matrixCaption, "caption");
      addText(diagramData.legendTitle, "legend-title");

      diagramData.legend.forEach(item => {
        addLine(item.line, `legend-line ${item.className}`);
        addText(item.label, "legend-label");
      });

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
