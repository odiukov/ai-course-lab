<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один раунд обмена признаками</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --card: #f8fafc;
    --formula: #eef2ff;
    --result: #ecfdf5;
    --text: #172033;
    --muted: #566178;
    --border: #aeb8c8;
    --guide: #64748b;
    --a: #2563eb;
    --b: #d97706;
    --c: #059669;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --panel: #182131;
      --card: #202b3d;
      --formula: #252c4b;
      --result: #173a32;
      --text: #f3f6fb;
      --muted: #bdc7d7;
      --border: #58657a;
      --guide: #a3aec0;
      --a: #69a3ff;
      --b: #f5ad49;
      --c: #48d6a1;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: unset;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .frame {
    background: var(--panel);
    border: 1px solid var(--border);
  }

  header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }

  h1 {
    margin: unset;
    font-size: 20px;
  }

  header p {
    margin: unset;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--panel);
  }

  text {
    fill: var(--text);
    font-family: inherit;
  }

  .section-title {
    font-size: 16px;
    font-weight: bold;
    fill: var(--muted);
  }

  .card-shape {
    fill: var(--card);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .formula-shape {
    fill: var(--formula);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .result-shape {
    fill: var(--result);
    stroke: var(--border);
    stroke-width: 1.5;
  }

  .accent {
    stroke-width: 4;
    stroke-linecap: round;
  }

  .node-label {
    font-size: 16px;
    font-weight: bold;
  }

  .vector-label {
    font-size: 18px;
    font-weight: bold;
  }

  .formula-label {
    font-size: 15px;
    font-weight: bold;
  }

  .result-label {
    font-size: 17px;
    font-weight: bold;
  }

  .message {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .update {
    fill: none;
    stroke: var(--guide);
    stroke-width: 2.5;
    stroke-linecap: round;
  }

  .stroke-a { stroke: var(--a); }
  .stroke-b { stroke: var(--b); }
  .stroke-c { stroke: var(--c); }
  .fill-a { fill: var(--a); }
  .fill-b { fill: var(--b); }
  .fill-c { fill: var(--c); }
  .fill-guide { fill: var(--guide); }

  .legend-label {
    font-size: 13px;
    fill: var(--muted);
  }

  .simultaneous {
    font-size: 14px;
    font-weight: bold;
    fill: var(--text);
  }

  .fallback {
    font-size: 17px;
    fill: var(--text);
  }
</style>
</head>
<body>
<main class="frame">
  <header>
    <h1>Один раунд обмена признаками</h1>
    <p>Каждый узел одновременно усредняет исходные карточки своих соседей.</p>
  </header>

  <svg id="diagram" viewBox="0 0 1120 440" width="1120" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Обмен признаками между узлами A, B и C</title>
    <desc id="svg-description">Слева показаны исходные карточки трёх узлов, в центре входящие сообщения соседей, справа — результаты усреднения.</desc>
    <g id="stage"></g>
  </svg>
</main>

<script>
const diagramData = [{
  headings: [
    {x: .35, y: .5, anchor: "start", text: "До агрегации"},
    {x: 11, y: .5, anchor: "start", text: "Среднее соседей"},
    {x: 17.1, y: .5, anchor: "start", text: "После агрегации"}
  ],
  sources: [
    {tone: "a", x1: .35, y1: 1.25, x2: 4.1, y2: 2.35, ax: .52, ay1: 1.43, ay2: 2.17,
     nx: .78, ny: 1.86, vx: 1.72, vy: 1.86, node: "Узел A", value: "[1, 0]"},
    {tone: "b", x1: .35, y1: 3.55, x2: 4.1, y2: 4.65, ax: .52, ay1: 3.73, ay2: 4.47,
     nx: .78, ny: 4.16, vx: 1.72, vy: 4.16, node: "Узел B", value: "[0, 1]"},
    {tone: "c", x1: .35, y1: 5.85, x2: 4.1, y2: 6.95, ax: .52, ay1: 6.03, ay2: 6.77,
     nx: .78, ny: 6.46, vx: 1.72, vy: 6.46, node: "Узел C", value: "[1, 1]"}
  ],
  formulas: [
    {x1: 11, y1: 1.25, x2: 15.2, y2: 2.35, tx: 13.1, ty: 1.86,
     text: "A ← среднее(B, C)"},
    {x1: 11, y1: 3.55, x2: 15.2, y2: 4.65, tx: 13.1, ty: 4.16,
     text: "B ← среднее(A, C)"},
    {x1: 11, y1: 5.85, x2: 15.2, y2: 6.95, tx: 13.1, ty: 6.46,
     text: "C ← среднее(A, B)"}
  ],
  results: [
    {x1: 17.1, y1: 1.25, x2: 22.15, y2: 2.35, tx: 19.625, ty: 1.86,
     text: "A = [0.5, 1.0]"},
    {x1: 17.1, y1: 3.55, x2: 22.15, y2: 4.65, tx: 19.625, ty: 4.16,
     text: "B = [1.0, 0.5]"},
    {x1: 17.1, y1: 5.85, x2: 22.15, y2: 6.95, tx: 19.625, ty: 6.46,
     text: "C = [0.5, 0.5]"}
  ],
  messages: [
    {tone: "b", p1:{x:4.1,y:3.91}, c1:{x:6.15,y:3.91}, c2:{x:8.75,y:1.65}, p2:{x:11,y:1.65},
     head:[{x:11,y:1.65},{x:10.72,y:1.51},{x:10.72,y:1.79}]},
    {tone: "c", p1:{x:4.1,y:6.18}, c1:{x:6.35,y:6.18}, c2:{x:8.65,y:1.95}, p2:{x:11,y:1.95},
     head:[{x:11,y:1.95},{x:10.72,y:1.81},{x:10.72,y:2.09}]},
    {tone: "a", p1:{x:4.1,y:1.63}, c1:{x:6.15,y:1.63}, c2:{x:8.75,y:3.95}, p2:{x:11,y:3.95},
     head:[{x:11,y:3.95},{x:10.72,y:3.81},{x:10.72,y:4.09}]},
    {tone: "c", p1:{x:4.1,y:6.46}, c1:{x:6.35,y:6.46}, c2:{x:8.65,y:4.25}, p2:{x:11,y:4.25},
     head:[{x:11,y:4.25},{x:10.72,y:4.11},{x:10.72,y:4.39}]},
    {tone: "a", p1:{x:4.1,y:1.97}, c1:{x:6.35,y:1.97}, c2:{x:8.65,y:6.25}, p2:{x:11,y:6.25},
     head:[{x:11,y:6.25},{x:10.72,y:6.11},{x:10.72,y:6.39}]},
    {tone: "b", p1:{x:4.1,y:4.39}, c1:{x:6.15,y:4.39}, c2:{x:8.75,y:6.55}, p2:{x:11,y:6.55},
     head:[{x:11,y:6.55},{x:10.72,y:6.41},{x:10.72,y:6.69}]}
  ],
  updates: [
    {p1:{x:15.2,y:1.8}, p2:{x:17.1,y:1.8},
     head:[{x:17.1,y:1.8},{x:16.82,y:1.66},{x:16.82,y:1.94}]},
    {p1:{x:15.2,y:4.1}, p2:{x:17.1,y:4.1},
     head:[{x:17.1,y:4.1},{x:16.82,y:3.96},{x:16.82,y:4.24}]},
    {p1:{x:15.2,y:6.4}, p2:{x:17.1,y:6.4},
     head:[{x:17.1,y:6.4},{x:16.82,y:6.26},{x:16.82,y:6.54}]}
  ],
  legend: [
    {tone:"a", x1:.45, x2:.95, y:7.85, tx:1.1, ty:7.9, text:"A отправляет [1, 0]"},
    {tone:"b", x1:4.1, x2:4.6, y:7.85, tx:4.75, ty:7.9, text:"B отправляет [0, 1]"},
    {tone:"c", x1:7.75, x2:8.25, y:7.85, tx:8.4, ty:7.9, text:"C отправляет [1, 1]"}
  ],
  note: {x:12.05, y:7.9, text:"Все новые карточки вычисляются одновременно"},
  fallback: [
    {x:.6, y:3.5, text:"Схема должна была показать один одновременный раунд обмена:"},
    {x:.6, y:4.1, text:"A → [0.5, 1.0], B → [1.0, 0.5], C → [0.5, 0.5]."}
  ]
}];

const origin = Object.freeze({x: 26, y: 22});
const scale = 48;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const [scene] = diagramData;
  const stage = document.getElementById("stage");
  const ns = "http://www.w3.org/2000/svg";

  const make = (tag, attrs, value) => {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([name, content]) => node.setAttribute(name, content));
    if (value !== undefined) node.textContent = value;
    return node;
  };

  const boxPath = item =>
    `M ${sx(item.x1)} ${sy(item.y1)} L ${sx(item.x2)} ${sy(item.y1)} ` +
    `L ${sx(item.x2)} ${sy(item.y2)} L ${sx(item.x1)} ${sy(item.y2)} Z`;

  const arrowHead = (points, className) => make("polygon", {
    points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: className
  });

  scene.messages.forEach(item => {
    stage.append(make("path", {
      d: `M ${sx(item.p1.x)} ${sy(item.p1.y)} C ${sx(item.c1.x)} ${sy(item.c1.y)} ` +
         `${sx(item.c2.x)} ${sy(item.c2.y)} ${sx(item.p2.x)} ${sy(item.p2.y)}`,
      class: `message stroke-${item.tone}`
    }));
    stage.append(arrowHead(item.head, `fill-${item.tone}`));
  });

  scene.updates.forEach(item => {
    stage.append(make("line", {
      x1: sx(item.p1.x), y1: sy(item.p1.y),
      x2: sx(item.p2.x), y2: sy(item.p2.y),
      class: "update"
    }));
    stage.append(arrowHead(item.head, "fill-guide"));
  });

  scene.sources.forEach(item => {
    stage.append(make("path", {d: boxPath(item), class: "card-shape"}));
    stage.append(make("line", {
      x1: sx(item.ax), y1: sy(item.ay1),
      x2: sx(item.ax), y2: sy(item.ay2),
      class: `accent stroke-${item.tone}`
    }));
    stage.append(make("text", {
      x: sx(item.nx), y: sy(item.ny),
      "text-anchor": "start", class: "node-label"
    }, item.node));
    stage.append(make("text", {
      x: sx(item.vx), y: sy(item.vy),
      "text-anchor": "start", class: "vector-label"
    }, item.value));
  });

  scene.formulas.forEach(item => {
    stage.append(make("path", {d: boxPath(item), class: "formula-shape"}));
    stage.append(make("text", {
      x: sx(item.tx), y: sy(item.ty),
      "text-anchor": "middle", class: "formula-label"
    }, item.text));
  });

  scene.results.forEach(item => {
    stage.append(make("path", {d: boxPath(item), class: "result-shape"}));
    stage.append(make("text", {
      x: sx(item.tx), y: sy(item.ty),
      "text-anchor": "middle", class: "result-label"
    }, item.text));
  });

  scene.headings.forEach(item => stage.append(make("text", {
    x: sx(item.x), y: sy(item.y),
    "text-anchor": item.anchor, class: "section-title"
  }, item.text)));

  scene.legend.forEach(item => {
    stage.append(make("line", {
      x1: sx(item.x1), y1: sy(item.y),
      x2: sx(item.x2), y2: sy(item.y),
      class: `message stroke-${item.tone}`
    }));
    stage.append(make("text", {
      x: sx(item.tx), y: sy(item.ty),
      "text-anchor": "start", class: "legend-label"
    }, item.text));
  });

  stage.append(make("text", {
    x: sx(scene.note.x), y: sy(scene.note.y),
    "text-anchor": "start", class: "simultaneous"
  }, scene.note.text));
} catch (error) {
  const [scene] = diagramData;
  const stage = document.getElementById("stage");
  const ns = "http://www.w3.org/2000/svg";
  if (stage) {
    stage.replaceChildren();
    scene.fallback.forEach(item => {
      const text = document.createElementNS(ns, "text");
      text.setAttribute("x", sx(item.x));
      text.setAttribute("y", sy(item.y));
      text.setAttribute("text-anchor", "start");
      text.setAttribute("class", "fallback");
      text.textContent = item.text;
      stage.append(text);
    });
  }
}
</script>
</body>
</html>
