<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь от графа к лапласиану</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ghostwhite;
      --card: white;
      --ink: midnightblue;
      --muted: slategray;
      --accent: royalblue;
      --accent-soft: aliceblue;
      --edge: darkslateblue;
      --minus: firebrick;
      --outline: lightsteelblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --card: darkslategray;
        --ink: white;
        --muted: lightsteelblue;
        --accent: lightskyblue;
        --accent-soft: slategray;
        --edge: lightsteelblue;
        --minus: lightsalmon;
        --outline: lightslategray;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h2 {
      color: var(--ink);
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--page);
    }

    .card {
      fill: var(--card);
      stroke: var(--outline);
    }

    .divider {
      stroke: var(--outline);
    }

    .graph-edge {
      stroke: var(--edge);
      stroke-linecap: round;
    }

    .graph-node {
      fill: var(--accent);
      stroke: var(--card);
    }

    .arrow {
      stroke: var(--accent);
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .heading {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .matrix {
      fill: var(--ink);
      font-size: 22px;
      font-variant-numeric: tabular-nums;
    }

    .negative {
      fill: var(--minus);
    }

    .bracket {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .caption {
      fill: var(--muted);
      font-size: 15px;
    }

    .arrow-label {
      fill: var(--accent);
      font-size: 14px;
      font-weight: bold;
    }

    .symbol {
      fill: var(--accent);
      font-size: 25px;
      font-weight: bold;
    }

    .fallback {
      color: var(--ink);
      font-size: 17px;
      text-align: center;
    }

    .fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h2 id="static-title">Путь от графа к лапласиану</h2>

  <svg id="diagram"
       viewBox="0 0 1440 430"
       width="1440"
       height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="static-title diagram-description">
    <desc id="diagram-description">
      Треугольный граф последовательно превращается в матрицу смежности A,
      матрицу степеней D с диагональю 2, 2, 2 и лапласиан L равный D минус A.
    </desc>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Схема должна была показать путь: треугольный граф → матрица смежности A
    → D = diag(2, 2, 2) → L = D − A.
  </p>

  <script>
    const diagramData = [
      [20, 10],
      [10, 10],
      [0, 1, 1.2, 1.6, 2, 2.4, 3],
      [1.6, 2.4, 3.2],
      [
        [0, 1, 25, 40, [12.5, 5], [2, 8], [23, 8]],
        [31, 1, 28, 40, [45, 5], [33, 8], [57, 8]],
        [65, 1, 28, 40, [79, 5], [67, 8], [91, 8]],
        [99, 1, 41, 40, [119.5, 5], [101, 8], [138, 8]]
      ],
      [
        [[12.5, 13], [6.5, 29], [18.5, 29]],
        [[0, 1], [1, 2], [2, 0]],
        [12.5, 37]
      ],
      [
        [[25.5, 21], [30.5, 21], [[30.5, 21], [29.4, 20.3], [29.4, 21.7]], [26, 17], "записываем связи"],
        [[59.5, 21], [64.5, 21], [[64.5, 21], [63.4, 20.3], [63.4, 21.7]], [60, 17], "суммы строк"],
        [[93.5, 21], [98.5, 21], [[98.5, 21], [97.4, 20.3], [97.4, 21.7]], [94, 17], "вычитаем A"]
      ],
      [
        [
          [39.5, 45, 50.5],
          [16, 22, 28],
          [[37, 13], [36.3, 13], [36.3, 31], [37, 31]],
          [[53, 13], [53.7, 13], [53.7, 31], [53, 31]],
          [45, 37]
        ],
        [
          [73.5, 79, 84.5],
          [16, 22, 28],
          [[71, 13], [70.3, 13], [70.3, 31], [71, 31]],
          [[87, 13], [87.7, 13], [87.7, 31], [87, 31]],
          [79, 37]
        ],
        [
          [109.5, 119.5, 129.5],
          [16, 22, 28],
          [[104.5, 13], [103.8, 13], [103.8, 31], [104.5, 31]],
          [[134.5, 13], [135.2, 13], [135.2, 31], [134.5, 31]],
          [119.5, 37]
        ]
      ],
      [
        [[0, 1, 1], [1, 0, 1], [1, 1, 0]],
        [[2, 0, 0], [0, 2, 0], [0, 0, 2]],
        [[2, -1, -1], [-1, 2, -1], [-1, -1, 2]]
      ],
      [
        "Треугольный граф",
        "Матрица смежности A",
        "Матрица степеней D",
        "Лапласиан L",
        "у каждого узла 2 связи",
        "в каждой строке две единицы",
        "D = diag(2, 2, 2)",
        "L = D − A"
      ]
    ];

    const [
      originPair,
      scalePair,
      commonNumbers,
      strokeNumbers,
      cards,
      graphData,
      arrows,
      matrixLayouts,
      matrices,
      labels
    ] = diagramData;

    const [originX, originY] = originPair;
    const [scaleX, scaleY] = scalePair;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const [zero, one, nodeRadius, cornerRadius, two] = commonNumbers;
    const [thinStroke, normalStroke, strongStroke] = strokeNumbers;
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function make(tag, attributes, content) {
      const element = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });
      if (content !== undefined) {
        element.textContent = content;
      }
      return element;
    }

    function append(tag, attributes, content, parent = svg) {
      const element = make(tag, attributes, content);
      parent.appendChild(element);
      return element;
    }

    function logicalWidth(value) {
      return sx(value) - sx(zero);
    }

    function logicalHeight(value) {
      return sy(value) - sy(zero);
    }

    function drawLine(from, to, className, width, parent = svg) {
      const [fromX, fromY] = from;
      const [toX, toY] = to;
      append("line", {
        x1: sx(fromX),
        y1: sy(fromY),
        x2: sx(toX),
        y2: sy(toY),
        class: className,
        "stroke-width": width
      }, undefined, parent);
    }

    function drawText(point, text, className, anchor, parent = svg) {
      const [x, y] = point;
      append("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, text, parent);
    }

    function pathFrom(points) {
      return points.map((point, index) => {
        const [x, y] = point;
        return `${index === zero ? "M" : "L"} ${sx(x)} ${sy(y)}`;
      }).join(" ");
    }

    function drawCard(card, heading) {
      const [x, y, width, height, titlePoint, dividerStart, dividerEnd] = card;
      const group = append("g", { "aria-label": heading });
      append("rect", {
        x: sx(x),
        y: sy(y),
        width: logicalWidth(width),
        height: logicalHeight(height),
        rx: logicalWidth(cornerRadius),
        ry: logicalHeight(cornerRadius),
        class: "card",
        "stroke-width": thinStroke
      }, undefined, group);
      drawText(titlePoint, heading, "heading", "middle", group);
      drawLine(dividerStart, dividerEnd, "divider", thinStroke, group);
      return group;
    }

    function drawArrow(arrow) {
      const [start, end, head, labelPoint, label] = arrow;
      drawLine(start, end, "arrow", normalStroke);
      append("polygon", {
        points: head.map(point => {
          const [x, y] = point;
          return `${sx(x)},${sy(y)}`;
        }).join(" "),
        class: "arrow-head"
      });
      drawText(labelPoint, label, "arrow-label", "start");
    }

    function formatValue(value) {
      return value < zero ? `−${Math.abs(value)}` : String(value);
    }

    function drawMatrix(layout, values, footer, group) {
      const [columns, rows, leftBracket, rightBracket, footerPoint] = layout;

      append("path", {
        d: pathFrom(leftBracket),
        class: "bracket",
        "stroke-width": normalStroke
      }, undefined, group);

      append("path", {
        d: pathFrom(rightBracket),
        class: "bracket",
        "stroke-width": normalStroke
      }, undefined, group);

      values.forEach((row, rowIndex) => {
        row.forEach((value, columnIndex) => {
          drawText(
            [columns[columnIndex], rows[rowIndex]],
            formatValue(value),
            value < zero ? "matrix negative" : "matrix",
            "middle",
            group
          );
        });
      });

      drawText(footerPoint, footer, "caption", "middle", group);
    }

    try {
      const [graphCard, adjacencyCard, degreeCard, laplacianCard] = cards;
      const [
        graphHeading,
        adjacencyHeading,
        degreeHeading,
        laplacianHeading,
        graphFooter,
        adjacencyFooter,
        degreeFooter,
        laplacianFooter
      ] = labels;

      const graphGroup = drawCard(graphCard, graphHeading);
      const adjacencyGroup = drawCard(adjacencyCard, adjacencyHeading);
      const degreeGroup = drawCard(degreeCard, degreeHeading);
      const laplacianGroup = drawCard(laplacianCard, laplacianHeading);

      const [nodes, edges, graphFooterPoint] = graphData;

      edges.forEach(edge => {
        const [fromIndex, toIndex] = edge;
        drawLine(nodes[fromIndex], nodes[toIndex], "graph-edge", strongStroke, graphGroup);
      });

      nodes.forEach(node => {
        const [x, y] = node;
        append("circle", {
          cx: sx(x),
          cy: sy(y),
          r: logicalWidth(nodeRadius),
          class: "graph-node",
          "stroke-width": normalStroke
        }, undefined, graphGroup);
      });

      drawText(graphFooterPoint, graphFooter, "caption", "middle", graphGroup);

      arrows.forEach(drawArrow);

      const [adjacencyLayout, degreeLayout, laplacianLayout] = matrixLayouts;
      const [adjacencyValues, degreeValues, laplacianValues] = matrices;

      drawMatrix(
        adjacencyLayout,
        adjacencyValues,
        adjacencyFooter,
        adjacencyGroup
      );

      drawMatrix(
        degreeLayout,
        degreeValues,
        degreeFooter,
        degreeGroup
      );

      drawMatrix(
        laplacianLayout,
        laplacianValues,
        laplacianFooter,
        laplacianGroup
      );

      const [laplacianFooterPoint] = [laplacianLayout[laplacianLayout.length - one]];
      const [footerX, footerY] = laplacianFooterPoint;
      drawText(
        [footerX, footerY - two],
        "D − A",
        "symbol",
        "middle",
        laplacianGroup
      );
    } catch (error) {
      svg.setAttribute("hidden", "");
      fallback.hidden = false;
    }
  </script>
</body>
</html>
