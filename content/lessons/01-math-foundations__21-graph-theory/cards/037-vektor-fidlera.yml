- concept: близкая к нулю координата вектора Фидлера указывает на пограничное положение вершины
  question: Координата некоторой вершины в векторе Фидлера очень близка к нулю. Что это означает для разбиения графа по знаку?
  explanation: Ноль служит порогом разбиения. Чем ближе координата к нему, тем слабее выражено положение вершины по одну из сторон спектрального разреза.
  kind: open
  reference: 'Вершина находится около границы между группами: знак задаёт формальную принадлежность, но она выражена менее уверенно, чем у вершин с большой по модулю координатой.'
