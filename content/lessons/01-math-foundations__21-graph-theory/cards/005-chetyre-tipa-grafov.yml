- concept: тип графа определяется независимо по направленности связей и наличию числовых весов
  question: В транспортной модели между связанными станциями можно ехать в обе стороны, а для каждого соединения хранится стоимость поездки. Какой тип графа подходит?
  explanation: Возможность двигаться в обе стороны делает граф неориентированным, а числовая стоимость каждого соединения — взвешенным. Направленность и наличие веса определяются независимо.
  kind: choice
  options:
    - Ориентированный невзвешенный
    - Неориентированный невзвешенный
    - Ориентированный взвешенный
    - Неориентированный взвешенный
  correct: 3
  id: 005-chetyre-tipa-grafov-1
  fingerprint: 790a65ad
- concept: невзвешенный граф не хранит числовые различия между рёбрами
  question: Объясни своими словами, означает ли невзвешенный граф, что все представленные им связи одинаковы в реальности.
  explanation: Если убрать с переходов расходы энергии, например 3 и 8 единиц, модель станет невзвешенной, хотя сами переходы по-прежнему могут требовать разных затрат в реальности.
  kind: open
  reference: Нет. Невзвешенность означает только, что модель хранит факт наличия ребра, но не записывает для него числовой вес. Реальные связи могут различаться по расстоянию, стоимости или силе, однако эти различия в таком графе не представлены числами.
  id: 005-chetyre-tipa-grafov-2
  fingerprint: 0f638a98
