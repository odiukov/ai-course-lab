- concept: симметричная нормировка масштабирует сообщение с учётом степеней обоих концов ребра
  question: После добавления петель степени двух соединённых узлов стали равны 9 и 16. Каков коэффициент при сообщении по невзвешенному ребру между ними при симметричной нормировке?
  explanation: Коэффициент равен обратной величине квадратного корня из произведения степеней. Квадратный корень из 9 · 16 равен 12, поэтому коэффициент приблизительно равен 0.0833.
  kind: numeric
  answer: 0.0833
  tolerance: 0.001
  id: 048-simmetrichnaya-normirovka-1
  fingerprint: cbb0406c
- concept: нормированная матрица смежности является дополнением нормированного лапласиана до единичного оператора
  question: Восстановите связь оператора смешивания GCN с симметрично нормированным лапласианом.
  explanation: Из равенства L_sym = I − S следует S = I − L_sym. Поэтому GCN использует сглаживающую часть той же конструкции, а лапласиан описывает отличие исходного сигнала от результата смешивания.
  kind: cloze
  template: S = ___
  answer: I - L_sym
  accept:
    - I-L_sym
    - I − L_sym
    - I - Lₛᵧₘ
  id: 048-simmetrichnaya-normirovka-2
