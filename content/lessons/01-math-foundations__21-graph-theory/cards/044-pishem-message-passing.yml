- concept: изолированный узел без петли получает нулевой результат при соседской агрегации
  question: В слое message passing используются только признаки соседей, без петель и смещения. Что произойдёт с выходом изолированного узла, если нулевую сумму его строки заменить безопасным ненулевым делителем?
  explanation: У изолированного узла строка матрицы смежности нулевая. Безопасный делитель предотвращает ошибку, но строка остаётся нулевой, поэтому агрегация и последующее линейное преобразование дают нулевой вектор.
  kind: choice
  options:
    - Он сохранит собственные признаки
    - Он получит средний вектор всех узлов графа
    - Его признаки станут неопределёнными
    - Он получит нулевой вектор
  correct: 3
  id: 044-pishem-message-passing-1
  fingerprint: bd2b4b45
- concept: матрица весов меняет размерность признаков, сохраняя число узлов
  question: Заполни форму результата одного раунда message passing.
  explanation: Агрегация по графу сохраняет по одной строке на каждый из шести узлов. Умножение векторов ширины пять на матрицу весов формы пять на семь создаёт семь новых признаков, поэтому форма результата — шесть на семь.
  kind: cloze
  template: |-
    features.shape == (6, 5)
    weight_matrix.shape == (5, 7)
    output.shape == ___
  answer: (6, 7)
  accept:
    - 6×7
    - 6 x 7
    - '[6, 7]'
  id: 044-pishem-message-passing-2
  fingerprint: ad809742
