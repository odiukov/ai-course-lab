- concept: двусторонние дороги с указанными расстояниями образуют неориентированный взвешенный граф
  question: Дороги между населёнными пунктами разрешают движение в обе стороны, а каждому участку сопоставлена его длина. Какой тип графа подходит для такой карты?
  explanation: Движение в обе стороны соответствует неориентированным рёбрам, а длина участка является числовым весом.
  kind: choice
  options:
    - Ориентированный и невзвешенный
    - Неориентированный и взвешенный
    - Ориентированный и взвешенный
