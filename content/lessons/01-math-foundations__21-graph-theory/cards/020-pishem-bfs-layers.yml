- concept: хранение слоя вместе с вершиной устраняет необходимость в общем счётчике волн
  question: Объясни своими словами, почему функции bfs_layers не нужен отдельный общий счётчик волн, если очередь хранит пары вида (вершина, слой).
  explanation: У разных элементов очереди явно сохранены их собственные слои. Алгоритм берёт слой текущей вершины и назначает её впервые обнаруженным соседям следующий слой, не отслеживая границы волн отдельной переменной.
  kind: open
  reference: Каждая извлечённая из очереди вершина уже несёт номер своего слоя. Для её соседей можно сразу вычислить следующий слой и сохранить его вместе с ними при добавлении в очередь, поэтому общий счётчик не требуется.
  id: 020-pishem-bfs-layers-2
