- concept: ядро лапласиана состоит из векторов, постоянных на каждой компоненте связности
  question: Почему вектор, постоянный внутри каждой компоненты связности, но принимающий разные значения на разных компонентах, лежит в ядре лапласиана?
  explanation: Лапласиан реагирует на разности значений вдоль рёбер. Внутри компоненты значения одинаковы, а между разными компонентами рёбер нет, поэтому лапласиан не обнаруживает ни одной ненулевой разности.
  kind: open
  reference: Лапласиан сравнивает значения только в вершинах, соединённых рёбрами. Концы каждого ребра принадлежат одной компоненте и получают одинаковые значения, поэтому все разности вдоль рёбер равны нулю и результат умножения лапласиана на вектор нулевой.
