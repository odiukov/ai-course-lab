- concept: проверка посещённости после извлечения из стека исключает повторное добавление вершины в результат
  question: В итеративном DFS в стек помещают только ещё не посещённых соседей. Почему после pop() всё равно нужно повторно проверять, посещена ли извлечённая вершина?
  explanation: 'Проверка перед добавлением в стек не исключает дубликаты среди ожидающих кандидатов: несколько обработанных вершин могут обнаружить одного общего соседа. Проверка после pop() не позволяет повторно обработать такой узел.'
  kind: open
  reference: Одну вершину могут поместить в стек из нескольких ветвей, пока она ещё не была обработана. После обработки первого экземпляра остальные нужно пропустить, чтобы вершина появилась в порядке обхода только один раз.
