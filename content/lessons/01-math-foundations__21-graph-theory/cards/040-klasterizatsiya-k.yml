- concept: близость точек в спектральном вложении отражает связность соответствующих вершин графа
  question: Почему k-means может обнаруживать сообщества после переноса вершин в пространство собственных векторов лапласиана?
  explanation: Спектральное вложение преобразует структуру рёбер в геометрические расстояния. Плотно связанные вершины оказываются рядом по нескольким спектральным координатам, а разделённые узкими местами группы — дальше друг от друга.
  kind: open
  reference: 'Собственные векторы с малыми собственными значениями задают гладкие функции на графе: у хорошо связанных вершин их значения обычно близки, а через слабые межкластерные связи меняются заметнее. Поэтому вершины одного сообщества образуют близкие точки, которые может разделить k-means.'
  id: 040-klasterizatsiya-k-2
