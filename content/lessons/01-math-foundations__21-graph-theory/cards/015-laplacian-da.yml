- concept: элементы лапласиана определяются как разность матрицы степеней и матрицы смежности
  question: Как устроены элементы лапласиана простого невзвешенного графа без петель?
  explanation: В матрице D степени находятся на диагонали, а вне диагонали стоят нули. Поэтому при вычитании A диагональ L сохраняет степени, а каждое ребро даёт значение −1 вне диагонали.
  kind: choice
  options:
    - На диагонали стоят степени вершин, у смежных разных вершин — отрицательные единицы, у несмежных — нули
    - На диагонали стоят нули, а у смежных вершин — их степени
    - На диагонали стоят отрицательные степени вершин, а у смежных вершин — положительные единицы
  correct: 0
  id: 015-laplacian-da-1
  fingerprint: a6ca0d2b
- concept: сумма элементов каждой строки лапласиана невзвешенного графа равна нулю
  question: Объясните своими словами, почему сумма элементов каждой строки матрицы L = D − A невзвешенного графа равна нулю.
  explanation: Диагональный элемент строки L равен степени вершины, а отрицательные элементы соответствуют её связям. Их суммарный вклад равен степени с противоположным знаком, поэтому итоговая сумма равна нулю.
  kind: open
  reference: В строке D находится степень выбранной вершины, а сумма строки A равна числу её соседей, то есть той же степени. Поэтому при вычитании эти величины сокращаются.
  id: 015-laplacian-da-2
  fingerprint: 70ecdf74
