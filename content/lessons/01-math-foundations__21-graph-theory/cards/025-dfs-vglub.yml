- concept: отметки посещённых вершин предотвращают зацикливание DFS
  question: Объясни своими словами, зачем DFS отмечает уже посещённые вершины.
  explanation: В циклическом графе путь может снова привести к ранее обработанной вершине. Проверка отметки о посещении разрывает такое повторение и гарантирует завершение обхода конечного графа.
  kind: open
  reference: Отметки не позволяют повторно обходить одну и ту же вершину. Без них DFS в графе с циклом может бесконечно переходить по уже пройденным рёбрам.
  id: 025-dfs-vglub-3
  fingerprint: 5f740ceb
