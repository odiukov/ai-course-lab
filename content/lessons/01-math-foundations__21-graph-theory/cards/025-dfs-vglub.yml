- concept: DFS исследует ветвь до тупика, а затем возвращается к последней развилке
  question: Расположи действия поиска в глубину в правильном порядке.
  explanation: DFS сначала проходит выбранную ветвь настолько глубоко, насколько возможно. Если продолжать путь нельзя, алгоритм возвращается к последней развилке и исследует следующую ветвь.
  kind: order
  items:
    - Перейти из текущей вершины в ещё не посещённого соседа
    - Продолжать углубление, пока доступны непосещённые соседи
    - В тупике начать возврат по пройденному пути
    - Вернуться к последней вершине с неисследованной ветвью
    - Продолжить обход по этой ветви
  id: 025-dfs-vglub-1
  fingerprint: 6f12fe32
- concept: итеративный DFS использует стек с порядком LIFO
  question: Заполни пропуск в описании структуры данных для итеративного DFS.
  explanation: Стек работает по принципу «последним добавлен — первым извлечён». Благодаря этому DFS продолжает обход от недавно обнаруженной вершины и движется вглубь.
  kind: cloze
  template: В итеративном DFS вершины для дальнейшей обработки хранят в структуре данных ___ с порядком LIFO.
  answer: стек
