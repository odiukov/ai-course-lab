- concept: вершины с одинаковой длиной кратчайшего пути от старта принадлежат одному уровню BFS
  question: Дан невзвешенный неориентированный граф с рёбрами S–A, S–B, A–C, B–D, C–E и D–E. BFS запускают из S. Какая пара вершин окажется на одном уровне?
  explanation: Кратчайший путь от S до C проходит через A, а до D — через B. Оба пути содержат одинаковое число рёбер, поэтому C и D принадлежат одному уровню BFS.
  kind: choice
  options:
    - A и C
    - C и D
    - B и E
    - S и D
  correct: 1
  id: 021-sloi-bfs-1
  fingerprint: bef1d729
- concept: порядок соседей может изменить очерёдность вершин внутри уровня, но не состав уровней BFS
  question: Два запуска BFS используют один граф и одну стартовую вершину, но перебирают соседей в разном порядке. Что может измениться в результате обхода, а что останется неизменным?
  explanation: Перестановка соседей меняет порядок их добавления в очередь и потому может переставить вершины внутри одной волны. Кратчайшие расстояния от старта от этого не меняются, поэтому вершины не переходят между уровнями.
  kind: open
  reference: Может измениться порядок посещения вершин, находящихся на одном уровне. Уровень каждой достижимой вершины и состав уровней останутся прежними, поскольку они определяются длиной кратчайшего пути от старта.
  id: 021-sloi-bfs-2
