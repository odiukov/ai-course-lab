- concept: результат хранит каждую компоненту как отдельный вложенный список
  question: BFS вернул order — список вершин одной компоненты. Какая операция сохранит эту компоненту отдельной группой в результате?
  explanation: append добавляет весь список order как один элемент components. extend добавил бы вершины по отдельности и разрушил структуру списка компонент, а у обычного списка нет метода update.
