- concept: разреженное представление матрицы экономит память на графах с небольшим числом рёбер относительно числа возможных связей
  question: Почему для большого разреженного графа результат nx.adjacency_matrix(G) обычно не следует сразу преобразовывать методом toarray()?
  explanation: Матрица смежности большого графа часто почти целиком состоит из нулей. Разреженный формат хранит только существенные элементы, а toarray() выделяет память под каждую ячейку плотной матрицы.
  kind: choice
  options:
    - Плотный массив не поддерживает операции линейной алгебры
    - Преобразование удаляет веса рёбер
    - Плотный массив хранит все нулевые элементы и может потребовать слишком много памяти
    - Разреженная матрица автоматически вычисляет PageRank
  correct: 2
  id: 050-networkx-karate-1
  fingerprint: d6279bd5
- concept: PageRank оценивает влияние узла с учётом значимости связанных с ним узлов
  question: Объясни своими словами, почему узел с меньшим числом связей иногда может получить больший PageRank, чем узел с большим числом связей.
  explanation: Степень узла просто считает связи, а PageRank рекурсивно взвешивает их по значимости соседей. Поэтому популярность и структурное влияние — не одно и то же.
  kind: open
  reference: PageRank учитывает не только количество связей, но и влияние узлов, от которых они приходят. Несколько связей с авторитетными узлами могут дать больший результат, чем множество связей с периферийными.
  id: 050-networkx-karate-2
  fingerprint: 6fe9a748
