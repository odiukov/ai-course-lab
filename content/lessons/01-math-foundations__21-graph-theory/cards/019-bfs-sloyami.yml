- concept: очередь FIFO обеспечивает послойный порядок обхода BFS
  question: 'В неориентированном графе соседей просматривают по алфавиту: A соединена с B и C, B — с D, C — с E. В каком порядке вершины будут извлекаться из очереди при BFS из A?'
  explanation: 'После обработки A в очереди находятся B и C. Обработка B добавляет D в конец очереди, а обработка C — вершину E. Поэтому вершины извлекаются в порядке A, B, C, D, E: весь ближайший слой обрабатывается раньше следующего.'
  kind: choice
  options:
    - A, B, D, C, E
    - A, C, B, E, D
    - A, B, C, E, D
    - A, C, E, B, D
    - A, B, C, D, E
  correct: 4
  id: 019-bfs-sloyami-1
  fingerprint: 82c7830a
- concept: пометка вершины при добавлении в очередь предотвращает её повторное обнаружение
  question: Две уже обрабатываемые вершины имеют общего непосещённого соседа X. Почему в BFS вершину X следует пометить найденной сразу при добавлении в очередь, а не при последующем извлечении?
  explanation: Состояние «найдена» должно устанавливаться одновременно с добавлением в очередь. Тогда при повторной встрече общего соседа алгоритм пропустит его и не создаст дублирующую работу.
  kind: open
  reference: Если отложить пометку, обе вершины могут независимо добавить X в очередь. Немедленная пометка гарантирует, что X будет поставлена в очередь только один раз.
