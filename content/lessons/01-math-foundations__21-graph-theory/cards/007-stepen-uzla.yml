- concept: степень вершины неориентированного графа равна числу инцидентных ей рёбер
  question: В простом неориентированном графе к вершине инцидентны семь рёбер. Какова степень этой вершины?
  explanation: Степень вершины — число рёбер, которые её касаются. Например, в треугольнике каждую вершину касаются два ребра, поэтому её степень равна 2.
  kind: numeric
  answer: 7
  tolerance: 0.01
  id: 007-stepen-uzla-1
  fingerprint: 2753bc10
- concept: исходящая степень учитывает рёбра, начинающиеся в данной вершине
  question: Заполни пропуск в формуле исходящей степени вершины v.
  explanation: Ориентированное ребро (v, u) выходит из v и входит в u. Поэтому исходящая степень v считает рёбра, у которых v стоит в начале; входящая степень считает рёбра вида (u, v).
  kind: cloze
  template: deg⁺(v) = |{(___, u) ∈ E}|
  answer: v
  accept:
    - v
    - вершина v
  id: 007-stepen-uzla-2
  fingerprint: de582d8b
- concept: матрица степеней диагональна и хранит степень каждой вершины на диагонали
  question: Объясни своими словами, где в матрице степеней D записаны степени вершин и что находится вне диагонали.
  explanation: Матрица степеней хранит отдельный числовой итог для каждой вершины, а не связи между разными вершинами. Поэтому для треугольника она имеет диагональ 2, 2, 2, а вне диагонали стоят нули.
  kind: open
  reference: Степень каждой вершины v записана в диагональном элементе D[v][v], а все внедиагональные элементы равны нулю.
