- concept: компоненты связности разбивают неориентированный граф на максимальные группы взаимно достижимых вершин
  question: В неориентированном графе есть вершины A, B, C, D, E и F. Рёбра соединяют A с B, B с C и D с E; вершина F изолирована. Каковы компоненты связности?
  explanation: По рёбрам можно пройти между A, B и C, а также между D и E. Между этими группами пути нет. Изолированная вершина F образует самостоятельную компоненту.
  kind: choice
  options:
    - '{A, B, C}, {D, E}, {F}'
    - '{A, B}, {C, D, E}, {F}'
    - '{A, B, C, D, E}, {F}'
    - '{A, B, C, F}, {D, E}'
  correct: 0
  id: 029-komponenty-svyaznosti-1
  fingerprint: a0d89aed
- concept: все компоненты связности находятся повторным запуском обхода из непосещённых вершин
  question: Расположи действия алгоритма поиска всех компонент связности неориентированного графа в правильном порядке.
  explanation: Один обход охватывает всю компоненту стартовой вершины. Следующий запуск из ещё не посещённой вершины находит другую компоненту, поскольку предыдущие обходы не смогли до неё добраться.
  kind: order
  items:
    - Создать пустое множество посещённых вершин и пустой список компонент
    - Выбрать непосещённую вершину; если такой вершины нет, завершить алгоритм
    - Запустить из выбранной вершины BFS или DFS
    - Добавить найденные обходом вершины в множество посещённых и сохранить их как компоненту
    - Вернуться к выбору непосещённой вершины
  id: 029-komponenty-svyaznosti-2
  fingerprint: 9241fde0
