- concept: значение Фидлера характеризует наличие слабых связей и общую связность графа
  question: Объясни своими словами, что можно заключить о связности графа, если его значение Фидлера мало.
  explanation: Значение Фидлера — наименьшее ненулевое собственное значение лапласиана. Чем оно меньше, тем слабее соединены некоторые части графа; большое значение соответствует более устойчивой связности.
  kind: open
  reference: 'Малое значение Фидлера указывает на слабое место или бутылочное горлышко: граф можно сравнительно легко разделить на части.'
