- concept: нормированная строка матрицы смежности вычисляет среднее признаков соседей
  question: У узла есть соседи со скалярными признаками 6, 12 и 21. Ненулевые веса соседей в соответствующей строке нормированной матрицы смежности одинаковы и в сумме дают единицу. Какой признак получится после агрегации?
  explanation: При одинаковых нормированных весах вычисляется среднее признаков соседей, поэтому результат равен 13. Значение 39 получилось бы при суммировании без нормировки.
  kind: choice
  options:
    - '39'
    - '13'
    - '18'
  correct: 1
  id: 043-message-passing-matrix-1
  fingerprint: d925d279
- concept: каждый раунд message passing расширяет доступную узлу окрестность на одно ребро
  question: Объясни своими словами, как количество раундов message passing связано с расстоянием, с которого информация может повлиять на представление узла.
  explanation: Первый раунд приносит признаки непосредственных соседей, следующий — сведения от соседей соседей. Повторение агрегации постепенно распространяет информацию по графу.
  kind: open
  reference: За каждый раунд информация проходит не более чем через одно ребро. Поэтому после K раундов на представление узла могут повлиять вершины из его K-шаговой окрестности.
  id: 043-message-passing-matrix-2
  fingerprint: b7dda576
