- concept: матрица смежности неориентированного графа симметрична
  question: В неориентированном графе вершины u и v соединены ребром. Как это отражается в матрице смежности?
  explanation: Неориентированное ребро действует в обе стороны, поэтому его значение записывается в две зеркальные ячейки. Из-за этого матрица смежности неориентированного графа симметрична.
  kind: choice
  options:
    - Заполняется только ячейка A[u][v]
    - Заполняется только ячейка A[v][u]
    - Ячейки A[u][v] и A[v][u] содержат одинаковое значение
  correct: 2
  id: 011-pishem-adjacency-1
  fingerprint: 7c364118
- concept: взвешенная матрица смежности хранит вес ребра
  question: Ребро взвешенного ориентированного графа задано как (u, v, w). Заполните пропуск.
  explanation: Во взвешенном графе ячейка матрицы хранит не просто признак наличия связи, а вес соответствующего ребра.
  kind: cloze
  template: A[u][v] = ___
  answer: w
  accept:
    - weight
    - вес
  id: 011-pishem-adjacency-2
  fingerprint: 151beb4e
- concept: диагональ матрицы смежности кодирует петли
  question: Объясните своими словами, при каком условии элемент A[v][v] может быть ненулевым.
  explanation: Строка и столбец диагональной ячейки относятся к одной вершине, поэтому такая ячейка описывает связь вершины с самой собой.
  kind: open
  reference: Элемент A[v][v] может быть ненулевым, если в графе есть петля — ребро из вершины v в неё же. При отсутствии петли этот диагональный элемент равен нулю.
  id: 011-pishem-adjacency-3
  fingerprint: 388f0100
