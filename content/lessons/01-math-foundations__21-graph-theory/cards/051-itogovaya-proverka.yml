- concept: PageRank делит вклад узла поровну между его исходящими ссылками
  question: Заполни знаменатель в выражении для вклада страницы u в PageRank страницы v до применения демпфирования.
  explanation: Оценка страницы распределяется между всеми страницами, на которые она ссылается. Поэтому одна исходящая ссылка передаёт лишь долю score(u), обратно пропорциональную исходящей степени u.
  kind: cloze
  template: contribution(u → v) = score(u) / ___
  answer: out_degree(u)
  accept:
    - deg_out(u)
    - исходящая степень u
    - число исходящих рёбер u
  id: 051-itogovaya-proverka-1
  fingerprint: 5fed1d16
- concept: алгоритм Дейкстры последовательно выбирает минимальное предварительное расстояние и релаксирует рёбра
  question: Расположи основные действия алгоритма Дейкстры в правильном порядке.
  explanation: Дейкстра сначала задаёт начальные расстояния, затем каждый раз выбирает ближайшую необработанную вершину и релаксирует её рёбра. Так окончательные кратчайшие расстояния постепенно распространяются по графу.
  kind: order
  items:
    - Присвоить стартовой вершине расстояние ноль, остальным — бесконечность
    - Извлечь необработанную вершину с минимальным предварительным расстоянием
    - Попытаться улучшить расстояния до её соседей через выбранную вершину
    - Продолжать выбор и релаксацию, пока нужные вершины не будут обработаны
  id: 051-itogovaya-proverka-2
  fingerprint: 37285b27
