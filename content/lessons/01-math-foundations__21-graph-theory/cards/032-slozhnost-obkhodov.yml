- concept: суммарная работа циклов по спискам смежности пропорциональна числу рёбер
  question: Почему вложенный цикл по соседям в BFS или DFS не приводит к сложности O(VE), если граф хранится списками смежности?
  explanation: В ориентированном графе каждое ребро просматривается один раз, а в неориентированном — дважды. Постоянный множитель не меняет асимптотику, поэтому вклад рёбер остаётся O(E).
  kind: open
  reference: Каждая достигнутая вершина обрабатывается один раз, а суммарная длина всех просмотренных списков смежности пропорциональна числу рёбер. Поэтому работа с вершинами занимает O(V), с рёбрами — O(E), а весь обход — O(V + E).
  id: 032-slozhnost-obkhodov-1
  fingerprint: 853ade31
- concept: операция извлечения из очереди BFS должна выполняться за постоянное время
  question: Почему для очереди BFS в Python используют deque с вызовом popleft(), а не список с удалением первого элемента?
  explanation: У deque операция popleft() имеет сложность O(1). Удаление из начала списка может стоить O(V) из-за сдвига элементов и на разреженном графе нарушить ожидаемую границу O(V + E).
  kind: choice
  options:
    - popleft() работает за постоянное время, а удаление первого элемента списка требует сдвинуть оставшиеся элементы
    - deque автоматически сортирует вершины по расстоянию от старта
    - deque самостоятельно удаляет уже посещённые вершины
    - список нельзя использовать для хранения вершин графа
