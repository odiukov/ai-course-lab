- concept: стохастическую функцию тестируют, фиксируя состояние генератора случайных чисел, что делает выход детерминированным при тех же входах
  question: Функция выбора следующего токена использует случайный розыгрыш, поэтому на одинаковом входе выдаёт разные ответы. Объясни своими словами, как построить для неё воспроизводимый тест.
  explanation: 'PRNG детерминирован: seed задаёт всю последующую последовательность. Фиксируя его, вы отделяете проверяемую логику (масштабирование логитов, фильтрация, softmax) от случайности. Дополнительно полезен статистический тест без seed: прогнать много розыгрышей и сверить частоты с вероятностями.'
  kind: open
  reference: 'Нужно зафиксировать состояние генератора псевдослучайных чисел перед вызовом (seed или отдельный объект-генератор с заданным seed). Псевдослучайная последовательность полностью определяется состоянием, поэтому при одинаковых логитах, temperature и параметрах фильтрации функция вернёт один и тот же token ID при каждом запуске. Тогда результат можно сравнить с эталонным значением. Без фиксации seed случайность маскирует ошибку: неверная нормализация или перепутанный порядок операций всё равно возвращают «какой-то правдоподобный» индекс, и тест не падает.'
