- concept: in-place операция над массивом логитов портит данные вызывающей стороны, а обычное деление создаёт новый массив
  question: В функцию сэмплирования передан массив логитов длины 4096, который вызывающий код потом использует для логирования. Какая строка испортит эти данные?
  explanation: '`/=` — augmented assignment: numpy пишет результат в тот же буфер, и массив у вызывающей стороны меняется. Обычное `logits / 0.7` выделяет новый массив, оригинал остаётся нетронутым. Для функции сэмплирования это важно: те же логиты могут понадобиться для отладки, метрик или второго прохода с другими настройками.'
  kind: choice
  options:
    - scaled = logits / 0.7
    - logits /= 0.7
    - scaled = np.array(logits) / 0.7
    - scaled = logits.copy() / 0.7
