- concept: градиент по входу цепочки операций равен произведению приходящего градиента на локальные производные всех операций между ними
  question: 'Скаляр x проходит через две операции подряд: сначала f, потом g. Локальная производная g по своему входу равна 0.25, локальная производная f по x равна 0.5. К выходу g обратное распространение принесло градиент 6.0. Чему равен градиент loss по x?'
  explanation: 'Правило цепочки: приходящий градиент последовательно умножается на локальную чувствительность каждой операции. 6.0 × 0.25 × 0.5 = 0.75. Отсюда же следует, что цепочка множителей меньше единицы затухает по глубине, а множителей больше единицы — взрывается.'
  kind: numeric
  answer: 0.75
  tolerance: 0.01
  id: 042-backward-po-grafu-1
  fingerprint: 9ddd99b5
- concept: к тензору, использованному несколькими операциями, градиенты со всех путей складываются
  question: Один и тот же тензор h подаётся на вход трём разным операциям, и результаты всех трёх влияют на loss. Что делает обратное распространение с градиентом по h?
  explanation: 'Разветвление в прямом проходе даёт суммирование в обратном: полная производная по h — сумма частных производных по каждому пути. Поэтому общая (tied) таблица эмбеддингов, применённая и на входе, и в выходной проекции, получает сумму двух вкладов, а residual-сложение суммирует градиент из обходного пути и из преобразующей ветви. Усреднение или выбор одной ветви дал бы неверную производную.'
  kind: choice
  options:
    - берёт градиент только от той ветви, где он по модулю наибольший
    - складывает вклады, пришедшие по всем трём путям
    - усредняет три вклада, деля их сумму на число ветвей
    - оставляет вклад последней по порядку вычисления ветви, затирая предыдущие
  correct: 1
  id: 042-backward-po-grafu-2
  fingerprint: fa8205aa
- concept: обратный проход требует сохранённых промежуточных значений прямого прохода, поэтому память растёт с глубиной и длиной последовательности
  question: Объясни своими словами, почему прямой проход при обучении обязан держать в памяти промежуточные активации, тогда как при инференсе их можно выбрасывать сразу после использования.
  explanation: Обратный проход не пересчитывает модель заново — он идёт по сохранённой записи и на каждой операции спрашивает локальную чувствительность, а та выражается через запомненные входы/выходы. Именно это, а не сами параметры, делает обучение в разы более требовательным к памяти, чем инференс.
  kind: open
  reference: 'Локальная производная операции обычно зависит от значений её входов и/или выходов: для матричного умножения Y = X·W производная по W равна произведению входа X на приходящий градиент, для GELU и softmax локальный множитель считается из самого входного/выходного значения. Значит, чтобы пройти граф назад, нужны те самые числа, что были посчитаны вперёд, — их сохраняют вместе с записью операций (вычислительный граф). При инференсе градиенты не нужны, каждый слой отдаёт результат дальше, и промежуточные тензоры можно освобождать. Отсюда практика: память на обучение растёт пропорционально числу слоёв, размеру батча и длине последовательности, а gradient checkpointing экономит её, сохраняя лишь часть активаций и пересчитывая остальные во время backward.'
  id: 042-backward-po-grafu-3
  fingerprint: 3a076c80
