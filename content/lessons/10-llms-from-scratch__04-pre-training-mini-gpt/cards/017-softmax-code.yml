- concept: softmax нормализует вдоль последней оси массива через axis=-1
  question: Дополни реализацию softmax так, чтобы каждый набор логитов нормализовался независимо от остальных, при любом числе измерений входа.
  explanation: axis=-1 всегда указывает на последнюю ось, где лежат кандидаты токенов. Одна и та же функция тогда работает и для вектора логитов, и для тензора (batch, seq_len, vocab). Любая другая ось (0 или None) смешает распределения разных позиций в одно общее.
  kind: cloze
  template: |-
    e = np.exp(x - x.max(axis=___, keepdims=True))
    return e / e.sum(axis=___, keepdims=True)
  answer: '-1'
  accept:
    - '-1'
    - x.ndim - 1
    - x.ndim-1
  id: 017-softmax-code-1
  fingerprint: ab71ec2b
- concept: keepdims=True сохраняет ось длины 1 для корректного broadcasting при нормализации
  question: В softmax для тензора логитов формы (8, 4, 50) сумму экспонент посчитали как e.sum(axis=-1) без keepdims. Что произойдёт при делении e на эту сумму?
  explanation: 'Без keepdims редукция удаляет ось: (8, 4, 50) превращается в (8, 4). Broadcasting выравнивает формы справа, сравнивает 50 с 4 и падает. С keepdims=True сумма имеет форму (8, 4, 1) и корректно растягивается вдоль последней оси. Опасный случай — когда размеры случайно совпадают: тогда ошибки не будет, а нормализация тихо применится не к той оси.'
  kind: choice
  options:
    - Сумма получит форму (8, 4), и NumPy бросит ошибку несовпадения форм при делении на тензор (8, 4, 50)
    - 'Ничего не изменится: NumPy сам восстановит потерянную ось в конце'
    - Деление пройдёт, но вероятности станут отрицательными
    - Экспоненты переполнятся и превратятся в inf
  correct: 0
  id: 017-softmax-code-2
  fingerprint: a6081775
- concept: softmax по последней оси даёт по одному распределению на каждый ведущий индекс, поэтому полная сумма равна произведению ведущих размерностей
  question: На вход softmax с axis=-1 подали тензор логитов формы (3, 5, 7). Чему равна сумма всех элементов результата?
  explanation: Нормализуется каждый набор из 7 кандидатов по отдельности, и таких наборов 3 × 5 = 15. Каждый даёт сумму 1, значит полная сумма равна 15, а не 1. Если проверка выдаёт 1, нормализация прошла по всему массиву сразу и позиции влияют друг на друга.
  kind: numeric
  answer: 15
  tolerance: 0.01
  id: 017-softmax-code-3
  fingerprint: 3320be2a
