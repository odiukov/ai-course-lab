- concept: локализация застрявшего loss идёт от проверки факта обновления весов к причинам, которые его блокируют
  question: Loss языковой модели держится на уровне случайной инициализации сотни шагов подряд. Расставь шаги диагностики так, чтобы каждый следующий проверялся только после подтверждения предыдущего.
  explanation: 'Сначала выясняется грубый факт — меняются ли веса. Если нет, причина лежит в цепочке «градиенты — вызов апдейта — размер шага». Только когда обновления подтверждены и заметны, есть смысл подозревать разметку целей: при неверных целях веса меняются, но модель учит несуществующую закономерность.'
  kind: order
  items:
    - 'Сравнить снимок весов до и после шага: изменились ли параметры вообще'
    - Проверить, что обратный проход даёт ненулевые градиенты
    - Проверить, что шаг оптимизатора действительно вызывается в теле цикла
    - 'Проверить величину learning rate: обновление может быть слишком мелким, чтобы сдвинуть предсказания'
    - 'Проверить сдвиг между input_ids и target_ids: цели могут быть неверными'
  id: 049-proverka-training-1
  fingerprint: 2180d5c2
- concept: слишком малый learning rate даёт корректные, но пренебрежимо малые обновления, и loss стоит на месте при исправном коде
  question: 'Словарь модели — 512 токенов, loss после 400 шагов держится около 6.24. Проверка показала: градиенты ненулевые, шаг оптимизатора вызывается, веса после каждого шага отличаются от прежних в 12-м знаке. Какая причина наиболее вероятна?'
  explanation: 'ln(512) ≈ 6.24 — уровень случайной модели. Веса меняются, значит backward и апдейт работают. Изменение в 12-м знаке означает, что шаг умножается на крошечный коэффициент: обновления математически корректны, но их размер не двигает предсказания. Лечится подъёмом learning rate, а не переписыванием прямого прохода.'
  kind: choice
  options:
    - Обратный проход не строит граф вычислений
    - Learning rate задан на порядки меньше нужного
    - Функция потерь считает вероятность не того токена
    - Батч слишком мал, чтобы градиент существовал
  correct: 1
  id: 049-proverka-training-2
  fingerprint: c9f543f3
- concept: минимальная проверка обучаемости — сравнение снимка параметров до и после шага, а не наблюдение за самим loss
  question: Заполни пропуск в минимальной проверке того, что один шаг обучения действительно изменил параметры.
  explanation: 'Снимок весов делают через copy(), иначе сравниваются два имени одного массива и проверка всегда пройдёт. Отрицание np.allclose ловит самый частый случай: цикл считает loss, но не обновляет модель. Само значение loss такой баг не выдаёт — оно просто стоит на уровне ln(|V|).'
  kind: cloze
  template: |-
    w_before = model.layers[0].W.copy()
    train_step(model, batch)
    assert not np.___(w_before, model.layers[0].W)
  answer: allclose
  accept:
    - allclose
    - array_equal
  id: 049-proverka-training-3
  fingerprint: 11f80986
