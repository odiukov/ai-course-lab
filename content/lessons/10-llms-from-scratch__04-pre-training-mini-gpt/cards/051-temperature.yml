- concept: деление логитов на T меньше единицы растягивает разрывы и повышает вероятность лидера
  question: У модели два кандидата на следующий токен с логитами 9 и 6. Генерация идёт с temperature 0.75. Чему примерно равна вероятность кандидата с логитом 9 после softmax?
  explanation: 'Логиты делят на T: 9/0.75 = 12 и 6/0.75 = 8. Разрыв был 3, стал 4. Softmax зависит только от разности: e^4/(1+e^4) ≈ 0.982. Без деления (T = 1) разрыв 3 дал бы ≈ 0.953 — понижение temperature заострило распределение.'
  kind: numeric
  answer: 0.982
  tolerance: 0.01
  id: 051-temperature-1
  fingerprint: 46d0a0eb
- concept: 'temperature — монотонное преобразование логитов: порядок кандидатов и argmax не меняются'
  question: У токена A наибольший логит среди всех токенов словаря. Генерацию запускают с temperature 3. Что произойдёт с распределением после softmax?
  explanation: 'Деление на положительное T сохраняет порядок логитов, значит argmax не меняется ни при каком T > 0. Высокая temperature только сжимает разрывы: распределение приближается к равномерному, но равным не становится, и редкие токены лишь получают заметный шанс при случайном выборе.'
  kind: choice
  options:
    - A перестанет быть самым вероятным токеном, лидером станет какой-то другой токен
    - A останется самым вероятным, но его вероятность упадёт, а разрывы с остальными сожмутся
    - Вероятности всех токенов словаря станут в точности равными
    - 'Ранжирование перевернётся: токен с наименьшим логитом станет наиболее вероятным'
  correct: 1
  id: 051-temperature-2
  fingerprint: a2e40e78
- concept: temperature применяется к логитам до softmax, а случайный выбор происходит уже после нормализации
  question: Расставь операции выбора одного следующего токена в правильном порядке.
  explanation: 'Temperature действует на логиты, а не на готовые вероятности: она меняет остроту распределения ещё до нормализации. Сам выбор токена остаётся случайным сэмплированием — temperature настраивает распределение, но токен не выбирает. Случай T = 0 обрабатывают отдельно: деление на ноль невозможно, поэтому просто берут argmax логитов (greedy decoding).'
  kind: order
  items:
    - Прямой проход даёт вектор логитов для последней позиции
    - Каждый логит делится на temperature
    - Softmax превращает изменённые логиты в распределение вероятностей
    - Из полученного распределения случайно сэмплируется токен
  id: 051-temperature-3
  fingerprint: fc2d5b1d
