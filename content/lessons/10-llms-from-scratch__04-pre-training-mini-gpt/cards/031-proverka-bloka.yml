- concept: во втором residual-сложении блока слагаемым служит выход первого residual-сложения, а не исходный вход блока
  question: В pre-norm блоке трансформера обозначим вход блока как u, а результат первой residual-связи (после attention) как h. С чем складывается выход MLP во второй residual-связи?
  explanation: 'Блок работает последовательно: h = u + attn(LN(u)), затем out = h + mlp(LN(h)). Второе сложение берёт уже обновлённое состояние h. Если бы туда попал u, вклад attention выпал бы из выхода блока. В записях оба состояния часто зовут одной буквой x, поэтому смотреть надо на то, что реально пришло на вход ветки.'
  kind: choice
  options:
    - С u — исходным входом блока
    - С h — состоянием после первой residual-связи
    - С нормализованным LayerNorm-ом входом MLP
    - С выходом attention до его сложения с входом
  correct: 1
  id: 031-proverka-bloka-1
  fingerprint: 07ddc068
- concept: 'без residual-пути градиент затухает мультипликативно по глубине: множители блоков перемножаются'
  question: 'Глубокая сеть без residual-связей: каждый блок умножает градиент на 0.6. Во сколько раз ослабнет градиент, дойдя через 8 таких блоков до первого слоя? Дай итоговый множитель.'
  explanation: 'Множители блоков перемножаются: 0.6^8 ≈ 0.0168, то есть градиент падает примерно в 60 раз. Residual-связь добавляет к этому пути прямое слагаемое с множителем 1, поэтому сигнал доходит до ранних слоёв целым и стопки из десятков блоков остаются обучаемыми.'
  kind: numeric
  answer: 0.0168
  tolerance: 0.002
  id: 031-proverka-bloka-2
  fingerprint: fed7bc9f
- concept: residual-связь даёт градиенту сквозной путь мимо преобразующей ветви, что делает обучаемыми стопки из десятков блоков
  question: Объясни своими словами, почему residual-связи позволяют ставить друг за другом десятки трансформер-блоков, а без них глубокая стопка не обучается.
  explanation: 'Ключ — аддитивность: identity-слагаемое превращает мультипликативную цепочку в цепочку с обходным путём. Именно поэтому реальные модели держат 12, 32 и 96 блоков подряд.'
  kind: open
  reference: Выход ветки прибавляется к её входу, поэтому производная выхода блока по входу содержит слагаемое-единицу. При backpropagation это даёт сквозной путь, по которому градиент течёт от loss к любому слою без умножения на веса ветки. Без residual градиент умножается на множитель каждого блока, множители перемножаются и по мере роста глубины градиент экспоненциально затухает (или взрывается), и ранние блоки перестают получать обучающий сигнал.
  id: 031-proverka-bloka-3
  fingerprint: bcb058a0
