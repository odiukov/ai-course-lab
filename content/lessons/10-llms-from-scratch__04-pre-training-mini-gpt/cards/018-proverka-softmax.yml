- concept: softmax инвариантен к прибавлению одной константы ко всем логитам
  question: Два логита равны 12 и 9. Перед softmax из обоих вычли 12. Какую вероятность получит первый элемент? Ответ с точностью до сотых.
  explanation: 'После сдвига логиты равны 0 и −3, разрыв тот же самый: 3. p = e^0/(e^0+e^−3) = 1/(1+0.0498) ≈ 0.95. Тот же ответ даёт softmax(12, 9) без сдвига — общий множитель e^12 сокращается в числителе и знаменателе.'
  kind: numeric
  answer: 0.95
  tolerance: 0.02
  id: 018-proverka-softmax-1
  fingerprint: 073dadcc
- concept: causal-маска прибавляет большое отрицательное число к будущим позициям, и softmax обнуляет их веса
  question: В causal-маске к элементам scores для будущих позиций прибавляют −1e9 перед softmax. Что происходит с весами этих позиций?
  explanation: Маска добавляется к scores до экспоненты. exp(score − 1e9) ≈ 0, такие позиции получают нулевой вес и не попадают в weights @ V. Отрицательных весов softmax не даёт вовсе — все выходы положительны и в сумме дают 1.
  kind: choice
  options:
    - Они становятся практически нулевыми, потому что exp от очень большого отрицательного числа неотличим от нуля
    - Они становятся отрицательными, и вклад будущих токенов вычитается из результата
    - 'Они остаются прежними: softmax нормализует их обратно при делении на сумму'
  correct: 0
  id: 018-proverka-softmax-2
  fingerprint: 05bfbd16
- concept: порядок операций внутри одной головы self-attention
  question: Расставь шаги вычисления одной головы self-attention с causal-маской в правильном порядке.
  explanation: 'Маска обязана прибавляться до softmax: только тогда экспонента превращает будущие позиции в нули. Масштабирование на sqrt(d_k) идёт до маски, а умножение на V — уже после нормализации весов.'
  kind: order
  items:
    - Перемножить Q и транспонированный K, получив матрицу scores
    - Поделить scores на квадратный корень из размерности головы
    - Прибавить к scores causal-маску
    - Применить softmax по последней оси и получить веса внимания
    - Умножить веса внимания на V
  id: 018-proverka-softmax-3
  fingerprint: 830f4a1b
