- concept: порядок одной итерации обучающего цикла языковой модели
  question: Расставь этапы одной итерации обучения авторегрессионной языковой модели в правильном порядке.
  explanation: 'Цикл всегда один и тот же: токенизация, forward, loss, backward, update. Градиент нельзя посчитать до loss, а loss — до прямого прохода. Одна итерация меняет веса чуть-чуть; поведение модели меняют десятки тысяч повторений.'
  kind: order
  items:
    - Текст разбивается на токены и превращается в последовательность числовых ID
    - Прямой проход по сети выдаёт распределение вероятностей следующего токена
    - Предсказание сравнивается с настоящим следующим токеном, считается loss
    - Обратный проход считает градиент loss по каждому параметру
    - Оптимизатор обновляет параметры на небольшой шаг против градиента
  id: 001-zachem-obuchat-1
  fingerprint: c175b5aa
- concept: размер файла весов = число параметров × размер типа данных
  question: Модель содержит 200 миллионов параметров и хранится в fp32. Сколько мегабайт (1 МБ = 10^6 байт) занимает файл весов?
  explanation: 'fp32 = 4 байта на параметр. 200·10^6 × 4 = 8·10^8 байт = 800 МБ. В fp16 тот же чекпоинт весил бы 400 МБ. Отсюда простое правило прикидки: параметры в миллиардах × 4 = гигабайты в fp32.'
  kind: numeric
  answer: 800
  tolerance: 5
  id: 001-zachem-obuchat-2
  fingerprint: 6c3b7148
- concept: обратный проход вычисляет производную loss по каждому параметру, а не новое предсказание
  question: Что именно вычисляет обратный проход (backward pass) при обучении сети?
  explanation: Backward pass идёт от loss к входу по правилу цепочки и выдаёт градиент — по одному числу на каждый параметр. Само обновление веса делает уже оптимизатор, а новый loss появится только на следующем прямом проходе.
  kind: choice
  options:
    - Вероятности следующего токена по уже обновлённым весам
    - Частную производную loss по каждому параметру — насколько параметр повлиял на ошибку
    - Новое значение loss после шага оптимизатора
    - Токенизацию входной последовательности в обратном порядке
  correct: 1
  id: 001-zachem-obuchat-3
  fingerprint: 3cf0ccf9
