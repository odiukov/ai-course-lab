- concept: gradient clipping по норме умножает все компоненты на один коэффициент max_norm / текущая_норма
  question: Норма полного вектора градиентов на шаге равна 24.0, порог clipping по норме — 1.5. Одна из компонент градиента до обрезки равна 8.0. Чему станет равна эта компонента после clipping?
  explanation: Clipping по норме масштабирует весь вектор на общий коэффициент max_norm / norm = 1.5 / 24 = 0.0625. Компонента 8.0 × 0.0625 = 0.5. Все компоненты умножаются на одно и то же число, поэтому направление обновления сохраняется, меняется только длина шага. Если бы норма была ниже порога, градиент остался бы нетронутым.
  kind: numeric
  answer: 0.5
  tolerance: 0.01
  id: 047-optimizer-schedule-1
  fingerprint: 2279c314
- concept: Adam хранит скользящие оценки моментов градиента и подбирает эффективный размер шага отдельно для каждого параметра
  question: Чем обновление весов в Adam отличается от обновления в обычном SGD с тем же learning rate?
  explanation: 'Adam накапливает первый и второй моменты градиента по истории шагов. Деление на корень из второго момента даёт каждому параметру свой масштаб: вес с устойчивым сигналом двигается уверенно, вес с шумными скачками — осторожнее. Градиент по-прежнему считается по батчу, а ограничение выбросов — задача отдельного механизма clipping.'
  kind: choice
  options:
    - Adam хранит скользящие средние градиента и его квадрата и делит шаг каждого параметра на его собственную оценку масштаба, поэтому разные параметры двигаются с разной эффективной скоростью
    - Adam считает градиент по всему датасету, а не по батчу, поэтому его оценка направления точнее
    - Adam обрезает слишком большие градиенты, поэтому отдельный clipping ему не нужен
    - Adam делает несколько forward-проходов на один backward и усредняет предсказания
