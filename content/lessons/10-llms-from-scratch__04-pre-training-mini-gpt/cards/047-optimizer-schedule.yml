- concept: прогрев learning rate нужен потому, что у случайно инициализированной модели градиенты велики и неинформативны, и большой шаг уводит обучение в расходимость
  question: Модель со случайной инициализацией запускают на обучение сразу с пикового learning rate, без прогрева. Что наиболее вероятно произойдёт и почему?
  explanation: На первых шагах веса случайны, градиенты велики и являются шумной оценкой направления. Крупное обновление по такому градиенту ломает масштаб активаций, и loss взлетает. Прогрев поднимает learning rate от почти нулевого до пикового за первые шаги (у GPT-2 — 2000 шагов, около 2% обучения), после чего косинусное затухание снижает шаг к концу, чтобы модель не металась вокруг удачных весов.
  kind: choice
  options:
    - 'Loss может резко подскочить и обучение разойтись: у необученной модели градиенты большие и плохо указывают полезное направление, поэтому крупный шаг уносит веса в область, из которой модель не восстанавливается'
    - Обучение пройдёт так же, но потребует ровно на длину прогрева меньше шагов
    - Loss просто перестанет меняться, потому что без прогрева оптимизатор не успевает накопить моменты градиента
    - Модель переобучится на первом батче, потому что высокий learning rate заставляет её запоминать данные
  correct: 0
  id: 047-optimizer-schedule-3
