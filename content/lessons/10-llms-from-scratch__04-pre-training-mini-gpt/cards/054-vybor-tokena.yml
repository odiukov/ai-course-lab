- concept: 'авторегрессивная генерация: выбранный токен возвращается во вход, и распределение пересчитывается заново для каждой новой позиции'
  question: Расставь шаги одной итерации авторегрессивной генерации в правильном порядке.
  explanation: Генерация — не один розыгрыш на весь текст, а цепочка зависимых шагов. Каждый выбранный токен становится частью входа следующего прогона, поэтому распределение для позиции N+1 зависит от того, что было выбрано на позиции N. Из-за этого одна случайная развилка меняет весь дальнейший текст.
  kind: order
  items:
    - Прогнать текущую последовательность через модель и взять логиты последней позиции
    - Превратить логиты в распределение вероятностей по словарю
    - Выбрать один токен из распределения (сэмплированием или argmax)
    - Дописать выбранный токен в конец последовательности
    - Повторить прогон уже с обновлённой последовательностью
