- concept: greedy decoding выбирает максимум на каждом шаге по отдельности и потому не даёт наиболее вероятной последовательности целиком
  question: 'Декодирование ведётся жадно: на каждой позиции берётся токен с максимальной вероятностью. Что верно про полученную последовательность?'
  explanation: 'Argmax на каждой позиции — локальное решение. Токен с наибольшей вероятностью сейчас может вести в ветку, где все продолжения плохи, а чуть менее вероятный первый токен — в ветку с высокими вероятностями дальше. Произведение вероятностей по всей цепочке при жадном выборе не максимизируется. Детерминированность при этом полная: тот же вход даёт тот же выход.'
  kind: choice
  options:
    - Она детерминирована при фиксированной модели и промпте, но не обязана быть самой вероятной последовательностью из всех возможных
    - Она гарантированно имеет наибольшую вероятность среди всех последовательностей той же длины
    - Она случайна, поскольку максимум распределения на каждом шаге разный
    - Она совпадает с результатом сэмплирования, если распределение нормировано
