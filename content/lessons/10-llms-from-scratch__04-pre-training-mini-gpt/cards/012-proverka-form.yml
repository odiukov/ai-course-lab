- concept: внутри стопки блоков трансформера последняя размерность не меняется, форма меняется только при эмбеддингах и в выходной проекции
  question: 'GPT-подобная модель: d_model = 512, 24 блока, словарь 32 000 токенов. Батч ID токенов имеет форму (16, 256). Где по ходу прямого прохода последняя размерность тензора меняет значение?'
  explanation: Эмбеддинги превращают каждый ID в вектор длины d_model = 512, выходная проекция меняет 512 на 32 000 логитов. Все 24 блока и layer norm переписывают значения, но остаточные связи требуют одинаковой ширины на входе и выходе блока, поэтому размерность остаётся 512. Softmax тоже форму не трогает.
  kind: choice
  options:
    - На каждом блоке трансформера, так как attention и feedforward пересчитывают вектора
    - Только при поиске эмбеддингов и в финальной линейной проекции в размер словаря
    - В финальной layer normalization и в softmax
    - Только при сложении token и position эмбеддингов
  correct: 1
  id: 012-proverka-form-1
  fingerprint: 0b1575cd
- concept: размер выходного тензора логитов = batch × seq_len × vocab_size, по одному распределению на каждую позицию
  question: Батч из 8 последовательностей по 64 токена прогнали через модель со словарём 32 000 токенов. Сколько чисел содержит тензор логитов на выходе?
  explanation: 8 × 64 × 32 000 = 16 384 000. Модель выдаёт распределение по всему словарю для каждой позиции, а не одно на последовательность, — поэтому выходной тензор на порядки больше внутреннего представления.
  kind: numeric
  answer: 16384000
  tolerance: 1
  id: 012-proverka-form-2
  fingerprint: a99bff99
- concept: порядок стадий прямого прохода GPT от ID токенов до вероятностей
  question: Расставь стадии прямого прохода GPT в правильном порядке.
  explanation: 'Свёрток и рекуррентности в GPT нет: эмбеддинги, позиционная информация, стопка блоков, нормализация, проекция в словарь, softmax. Layer norm стоит до линейной головы, а не после.'
  kind: order
  items:
    - Поиск token embeddings по ID токенов
    - Сложение token embeddings с position embeddings
    - Прогон через стопку decoder-блоков трансформера
    - Финальная layer normalization
    - Линейная проекция в размер словаря
    - Softmax для получения вероятностей следующего токена
  id: 012-proverka-form-3
  fingerprint: cd73d6d7
