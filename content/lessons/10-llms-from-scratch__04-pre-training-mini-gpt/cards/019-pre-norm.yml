- concept: 'порядок операций внутри одного pre-norm-блока трансформера: нормализация идёт до каждой преобразующей ветви, residual складывается с ненормализованным входом'
  question: Расставь операции одного блока GPT-2 (pre-norm) в порядке их выполнения при прямом проходе, от входа блока к его выходу.
  explanation: В pre-norm блоке LayerNorm стоит перед каждой из двух преобразующих ветвей, а не после сложения. Ветвь получает нормализованную копию, но residual прибавляет именно исходный, ненормализованный вход — так у сигнала остаётся прямой путь через весь блок.
  kind: order
  items:
    - LayerNorm над входом блока
    - Multi-Head Self-Attention над нормализованной копией
    - прибавление входа блока к выходу attention (residual)
    - LayerNorm над результатом первой половины блока
    - MLP (feed-forward) над нормализованной копией
    - прибавление входа второй половины к выходу MLP (residual)
  id: 019-pre-norm-1
  fingerprint: dd9a953b
- concept: различие pre-norm и post-norm — в позиции LayerNorm относительно residual-сложения, набор операций одинаков
  question: Оригинальный Transformer построен как post-norm, GPT-2 — как pre-norm. Чем именно эти два блока отличаются друг от друга?
  explanation: 'Набор деталей один и тот же: LayerNorm, attention, MLP, два residual-сложения. Различается только порядок. Post-norm: преобразование, сложение с входом, затем LayerNorm всей суммы. Pre-norm: LayerNorm входа, преобразование, затем сложение.'
  kind: choice
  options:
    - В post-norm LayerNorm применяется к сумме после residual-сложения, в pre-norm — к входу ветви до преобразования
    - В post-norm нет residual-связей, они появляются только в pre-norm
    - В post-norm вместо LayerNorm используется softmax по признакам
    - 'В post-norm attention и MLP идут в обратном порядке: сначала MLP, потом attention'
  correct: 0
  id: 019-pre-norm-2
  fingerprint: 345c3305
- concept: в pre-norm residual-путь не проходит через LayerNorm, поэтому обучающий сигнал легче доходит до ранних слоёв глубокой модели
  question: Почему pre-norm обычно предпочитают для глубоких стеков (например, 40 блоков подряд)?
  explanation: 'В post-norm каждое residual-сложение сразу проходит через LayerNorm, то есть «пропускной» путь на каждом блоке дополнительно обрабатывается. В pre-norm этот путь чистый: вклад «×1» идёт от loss к любому слою напрямую. Чем глубже стек, тем заметнее разница в устойчивости обучения; число параметров и причинность маски от выбора нормализации не зависят.'
  kind: choice
  options:
    - Residual-путь остаётся без обязательной нормализации после каждого сложения, поэтому при обратном распространении сигнал проще доходит до первых блоков
    - Pre-norm убирает нужду в residual-связях и экономит память на активациях
    - Pre-norm уменьшает число параметров блока примерно вдвое
    - Pre-norm делает attention причинным, а post-norm — нет
  correct: 0
  id: 019-pre-norm-3
