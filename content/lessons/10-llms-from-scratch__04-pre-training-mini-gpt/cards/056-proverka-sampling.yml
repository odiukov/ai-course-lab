  fingerprint: 502041cd
- concept: temperature перевешивает всех кандидатов, а top-k/top-p удаляют часть из них насовсем
  question: Нужный редкий токен полностью пропал из генерации при top-k = 8. Объясни, почему повышение temperature до 2.0 его не вернёт, и что вернёт.
  explanation: 'Три ручки действуют на разных этапах: temperature перевешивает шансы, top-k и top-p вырезают кандидатов. Нулевую вероятность после отсечения не поднять перевешиванием.'
  kind: open
  reference: 'Temperature делит логиты и меняет соотношение вероятностей, но носитель распределения сохраняется целиком — она не удаляет и не добавляет кандидатов. Top-k и top-p работают иначе: они обрезают хвост, ставят отсечённым токенам нулевую вероятность, и после перенормировки такой токен не может быть выбран ни при какой temperature. Если токен не попал в 8 лидеров, вернуть его можно только ослаблением отсечения — увеличить k, поднять порог p или отключить фильтр. Косвенно высокая temperature помогает лишь тем, что сглаженное распределение может протолкнуть токен внутрь ядра top-p, но при фиксированном top-k состав кандидатов задаётся порядком логитов, который temperature не меняет.'
  id: 056-proverka-sampling-2
  fingerprint: f82c10c7
- concept: temperature меняет размер ядра top-p, потому что применяется к логитам раньше отсечения
  question: Порог top-p оставили прежним, а temperature подняли с 0.6 до 1.3. Что обычно произойдёт с числом токенов, которые пройдут отсечение?
  explanation: 'Temperature делит логиты до softmax, поэтому отсечение видит уже изменённые вероятности. Высокая temperature сглаживает распределение, лидер держит меньшую долю, и минимальная группа, набирающая порог, разрастается. Так три ручки не независимы: temperature косвенно управляет размером ядра top-p.'
  kind: choice
  options:
    - 'Оно вырастет: распределение стало более плоским, и на набор той же суммарной вероятности нужно больше токенов'
    - 'Оно не изменится: число кандидатов у top-p задаётся только порогом'
    - Оно упадёт до одного токена, как при greedy decoding
    - Оно станет фиксированным и равным значению top-k
  correct: 0
  id: 056-proverka-sampling-3
  fingerprint: 0ece0ec5
