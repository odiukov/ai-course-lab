- concept: prefill ограничен вычислительной мощностью, decode — пропускной способностью памяти
  question: Инженер заменил видеокарту на модель с вдвое большей пропускной способностью памяти, но с той же пиковой производительностью в FLOPS. Что изменится в обслуживании запроса из 3000 токенов промпта с генерацией 200 токенов?
  explanation: Обработка промпта (prefill) идёт по всем позициям параллельно и грузит вычислительные блоки — она compute-bound и зависит от FLOPS. Пошаговая генерация (decode) на каждом шаге тянет из памяти веса модели и накопленный KV cache при малом объёме арифметики — она memory-bound. Поэтому рост пропускной способности памяти ускоряет токены в секунду, а не время до первого токена.
  kind: choice
  options:
    - Заметно вырастет скорость генерации в токенах в секунду, а время до первого токена почти не изменится
    - Заметно сократится время до первого токена, а скорость генерации почти не изменится
    - Обе метрики ускорятся ровно вдвое, так как обе фазы упираются в память
    - 'Не изменится ничего: обе фазы упираются только в арифметику'
  correct: 0
  id: 059-prefill-decode-1
  fingerprint: 5f0a0d4c
- concept: нижняя граница скорости decode = пропускная способность памяти / объём весов, читаемых на каждом шаге
  question: Веса модели занимают 2.4 ГБ, и на каждом шаге генерации они целиком читаются из памяти видеокарты. Пропускная способность памяти — 1200 ГБ/с. Вкладом KV cache и арифметикой пренебрегаем. Сколько токенов в секунду даёт такая верхняя оценка скорости генерации при batch size 1?
  explanation: 'Шаг decode не может быть быстрее, чем чтение весов: 2.4 ГБ / 1200 ГБ/с = 0.002 с = 2 мс на токен, то есть 500 токенов в секунду. Это и есть смысл memory-bound режима: время шага определяет объём перекачанных байт, а не количество операций. Арифметики на одну новую позицию мало, поэтому вычислительные блоки простаивают в ожидании загрузки.'
  kind: numeric
  answer: 500
  tolerance: 5
  id: 059-prefill-decode-2
  fingerprint: f9330ea3
- concept: почему обработка целого промпта параллелится, а генерация следующих токенов — нет
  question: Объясни своими словами, почему модель может обработать промпт из 4096 токенов за один параллельный проход, но не может так же параллельно сгенерировать следующие 300 токенов.
  explanation: 'Разница между фазами — не в реализации, а в доступности данных: параллелить можно только то, что известно заранее. Отсюда и разные узкие места: у prefill — арифметика, у decode — перекачка байт, и потому время до первого токена и токены в секунду чинятся разным железом.'
  kind: open
  reference: 'В промпте все токены уже известны заранее, поэтому внутри каждого слоя ключи, значения и attention для всех позиций считаются одновременно — это одно большое матричное умножение, загружающее вычислительные блоки (compute-bound). При генерации следующий токен зависит от того, какой токен был только что выбран: до выбора его вход неизвестен, поэтому шаги строго последовательны. На каждом таком шаге обрабатывается одна новая позиция, но из памяти всё равно читаются все веса модели и накопленный KV cache, поэтому фаза упирается в пропускную способность памяти (memory-bound).'
  id: 059-prefill-decode-3
  fingerprint: 0ea65f82
