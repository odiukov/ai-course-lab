- concept: 'знание в нейросети закодировано распределённо: отдельный параметр не соответствует отдельному факту'
  question: Инженер хочет, чтобы языковая модель на 350 миллионов параметров перестала знать один конкретный факт, и ищет параметр, отвечающий именно за этот факт. Почему такой поиск обычно не даёт результата?
  explanation: Обучение сдвигает каждое число понемногу, если сдвиг помогает предсказывать продолжения множества текстов. В итоге одна связь опирается на комбинацию весов, а один вес влияет на множество разных связей. Адреса вида «ячейка с фактом» в сети нет, поэтому удалить факт как строку из таблицы не получается.
  kind: choice
  options:
    - Параметры хранятся в сжатом виде, и их нельзя прочитать по отдельности
    - 'Факт закодирован распределённо: он поддерживается комбинацией многих параметров, а каждый из них участвует и в других предсказаниях'
    - Факты хранятся не в весах, а в токенизаторе, поэтому в параметрах их нет
    - Параметр хранит факт, но только после дополнительного обучения на этом факте
  correct: 1
  id: 002-parametry-smysl-1
  fingerprint: d9224056
- concept: изменение одного веса меняет не одну запись, а сразу несколько склонностей модели
  question: В обученной модели вручную обнулили один вес в матрице одного из 24 блоков. Какой эффект наиболее вероятен?
  explanation: 'Один вес входит в множество путей вычисления, поэтому его изменение действует широко и слабо, а не точечно. Обратная сторона той же картины: одна знакомая связь держится на многих числах, и обнуление одного из них редко её ломает целиком.'
  kind: choice
  options:
    - Модель полностью потеряет одну способность и сохранит все остальные без изменений
    - 'Ничего не изменится: вес участвует только в неиспользуемой ветке вычислений'
    - Модель слегка изменит сразу несколько склонностей — какие фрагменты связывать, какие признаки усиливать, какому продолжению дать больше вероятности
    - Модель начнёт выдавать равномерное распределение над словарём
  correct: 2
  id: 002-parametry-smysl-2
  fingerprint: 779329fe
- concept: параметр сам по себе не имеет значения; ответ возникает при прохождении входа через всю систему весов
  question: Объясни своими словами, что именно хранит отдельный параметр обученной языковой модели и в какой момент появляется конкретный ответ модели.
  explanation: 'Ключевое разделение: веса хранят выученную систему взаимных настроек, а не готовые ответы. Отсюда и практические следствия — нельзя удалить факт правкой одного числа, и нельзя прочитать содержимое модели, глядя на отдельные веса без прогона входа.'
  kind: open
  reference: 'Отдельный параметр — это просто настраиваемое число. Само по себе оно не означает ни слова, ни правила, ни факта: значение оно получает только через своё участие в вычислениях. Обучение выставило его так, чтобы предсказания на большом наборе текстов были точнее, и результат такой настройки распределён по всем весам сразу. Конкретный ответ не лежит внутри готовым, а вычисляется, когда входной текст проходит через всю систему весов и на выходе получается распределение вероятностей над следующим токеном.'
  id: 002-parametry-smysl-3
  fingerprint: bc90d2da
