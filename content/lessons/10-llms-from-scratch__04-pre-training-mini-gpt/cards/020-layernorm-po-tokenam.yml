- concept: layer normalization считает среднее и дисперсию по признакам одного токена, поэтому не зависит от батча и длины последовательности
  question: Тензор активаций имеет форму (batch=32, seq_len=256, d_model=512). По какому набору значений layer normalization считает среднее и дисперсию для одной позиции?
  explanation: 'LayerNorm работает вдоль оси признаков: mean и var берутся по d_model=512 для каждой позиции отдельно. Отсюда независимость от batch size и от длины последовательности — в отличие от batch normalization, где статистика собирается по батчу и результат для одного примера зависит от соседей. Это и делает LayerNorm пригодной для inference с батчем размера 1 и переменной длиной входа.'
  kind: choice
  options:
    - По 512 признакам этой позиции внутри её собственного вектора
    - По 32 значениям одного признака через весь батч
    - По 256 позициям последовательности для каждого признака отдельно
    - По всем 32 × 256 × 512 значениям тензора сразу
  correct: 0
  id: 020-layernorm-po-tokenam-1
  fingerprint: fe4ee294
- concept: 'вычисление нормализованного значения: вычесть среднее вектора и поделить на его стандартное отклонение'
  question: Вектор признаков токена равен [2, 4, 6, 8]. Применяется layer normalization с gamma = 1, beta = 0, eps пренебрежимо мал. Чему равна первая координата результата?
  explanation: 'Среднее = 5, отклонения [-3, -1, 1, 3], дисперсия = (9+1+1+9)/4 = 5, стандартное отклонение ≈ 2.236. Первая координата: (2 - 5) / 2.236 ≈ -1.34. Заметь: результат зависит только от относительного разброса, а не от абсолютного масштаба — вектор [20, 40, 60, 80] дал бы те же числа.'
  kind: numeric
  answer: -1.34
  tolerance: 0.03
  id: 020-layernorm-po-tokenam-2
  fingerprint: 01e5dfc9
- concept: обучаемые gamma и beta возвращают модели возможность отойти от фиксированного нулевого среднего и единичной дисперсии
  question: Зачем в layer normalization добавляют обучаемые параметры масштаба и сдвига, если нормализация уже привела вектор к нулевому среднему и единичной дисперсии? Объясни своими словами.
  explanation: 'Ключ: нормализация стабилизирует масштаб, а gamma/beta возвращают степени свободы, которые она отняла. Оба параметра обучаемые и per-feature, поэтому слой в пределе может выучить даже почти обратное преобразование. Их стартовые значения (единицы и нули) делают слой на первом шаге обычной нормализацией.'
  kind: open
  reference: 'Без них выход слоя жёстко заперт в одном фиксированном распределении: любое представление обязано иметь нулевое среднее и единичную дисперсию, а это сокращает выразительность сети. gamma (по одному числу на признак) позволяет заново растянуть или сжать каждый признак, beta — сдвинуть его. Инициализация gamma = 1, beta = 0 означает, что вначале преобразование сводится к чистой нормализации, а дальше обучение само решает, каким признакам нужен больший масштаб. Число параметров — 2 × d_model, то есть пренебрежимо мало по сравнению с матрицами attention и FFN.'
  id: 020-layernorm-po-tokenam-3
  fingerprint: 3e5d61ad
