- concept: после обнуления отсечённых токенов вероятности выживших делятся на их сумму, поэтому вероятность лидера растёт
  question: 'Вероятности кандидатов по убыванию: 0.4, 0.25, 0.15, 0.1, 0.06, 0.04. Применяется top-p с порогом 0.85. Чему равна вероятность лидера после перенормировки?'
  explanation: 'Накопленная сумма: 0.4, 0.65, 0.80, 0.90 — порог 0.85 перекрыт на четвёртом токене, ядро = 4 токена с суммой 0.90. Отсечённые получают ноль, остальные делятся на 0.90: 0.4 / 0.90 ≈ 0.444. Обрезание хвоста само по себе повышает вероятность лидера, поэтому top-p работает как дополнительное сужение поверх temperature.'
  kind: numeric
  answer: 0.444
  tolerance: 0.01
