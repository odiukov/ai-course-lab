- concept: 'порядок операций nucleus sampling: сортировка, накопление, отсечение по порогу, перенормировка, случайный выбор'
  question: Расставь шаги nucleus sampling (top-p) по порядку выполнения.
  explanation: 'Накопленную сумму нельзя считать до сортировки — иначе порог перекроется случайным набором токенов, а не самыми вероятными. Перенормировка обязательна перед выбором: после обнуления хвоста сумма меньше единицы, и сэмплировать из ненормализованного вектора нельзя.'
  kind: order
  items:
    - отсортировать токены по убыванию вероятности
    - считать накопленную сумму вероятностей вдоль отсортированного списка
    - оставить минимальный префикс, чья накопленная сумма перекрывает порог p, остальным присвоить нулевую вероятность
    - поделить вероятности оставшихся токенов на их сумму
    - сделать случайный выбор по полученному распределению
