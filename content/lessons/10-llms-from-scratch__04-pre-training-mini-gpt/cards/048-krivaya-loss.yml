- concept: разброс loss между соседними шагами вызван разными батчами, вывод об обучении делают по тренду за десятки шагов
  question: 'Логи обучения языковой модели показывают loss: 4.02, 3.87, 3.95, 3.71, 3.80, 3.62. Одно значение выше предыдущего. Какой вывод корректен?'
  explanation: 'Loss на шаге измеряется на одном случайном фрагменте. Фрагмент с редкими байтами или необычной пунктуацией даёт более высокий штраф, чем фрагмент с частыми сочетаниями. Судить надо по сглаженной линии за десятки шагов: 4.02 → 3.62 это спуск, несмотря на локальные подъёмы.'
  kind: choice
  options:
    - Каждый шаг считает loss на другом фрагменте текста, поэтому значения шумят; общий нисходящий тренд говорит, что обучение идёт
    - Loss обязан монотонно падать; рост на одном шаге означает ошибку в градиентах
    - Рост loss означает, что learning rate завышен, и обучение надо перезапустить
    - Такой разброс возможен только при повреждённых данных
  correct: 0
  id: 048-krivaya-loss-1
  fingerprint: e57788f4
- concept: loss, колеблющийся вокруг ln(V) без нисходящего тренда, означает, что обновления не меняют предсказания
  question: Модель со словарём 32000 токенов обучается 3000 шагов. Loss всё время колеблется около 10.4 и не идёт вниз. Что это указывает?
  explanation: ln(32000) ≈ 10.37 — уровень равномерного распределения, то есть модель предсказывает как случайная. Если после множества шагов уровень не сдвинулся, значит градиенты не доходят до параметров или шаг обновления не выполняется. Работающая связка forward, loss, backward, update даёт видимый нисходящий тренд.
  kind: choice
  options:
    - 'Параметры фактически не улучшают предсказания: цикл forward-loss-backward-update где-то разорван (например, обновление весов не применяется)'
    - Модель уже сошлась к оптимуму для этого словаря
    - 'Нормальная картина: loss всегда падает только после десятков тысяч шагов'
    - Ошибка в вычислении cross-entropy, потому что настоящий loss не может держаться так высоко
  correct: 0
  id: 048-krivaya-loss-2
  fingerprint: f073d4c9
- concept: падающий training loss подтверждает работу оптимизации, но не качество предсказаний на новом тексте
  question: Training loss упал с 9.1 до 2.4. Что этот факт доказывает про модель, а что нет? Объясни своими словами.
  explanation: 'Training loss отвечает на первый вопрос — «обновления весов действительно работают?». Вопрос обобщения отдельный: на маленьком корпусе модель легко подгоняется под него, и низкий training loss при этом соседствует с плохими предсказаниями на новом тексте.'
  kind: open
  reference: 'Падающий training loss доказывает, что механика обучения работает: градиенты считаются, обновления весов применяются, модель всё чаще назначает высокую вероятность правильному следующему токену на том тексте, который ей выдали. Он не доказывает, что модель хорошо продолжит новый, невиданный текст: модель могла запомнить обучающий фрагмент. Для суждения об обобщении нужен loss на отложенных данных, которых не было в обучении.'
  id: 048-krivaya-loss-3
  fingerprint: 328e3ed0
