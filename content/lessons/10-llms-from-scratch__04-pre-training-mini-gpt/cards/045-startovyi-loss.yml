- concept: ожидаемый loss необученной модели равен натуральному логарифму размера словаря
  question: Модель только что инициализирована малыми случайными весами, поэтому логиты почти одинаковы и вероятность распределяется практически поровну между всеми токенами. В словаре 32000 токенов. Чему примерно равен кросс-энтропийный loss на первом шаге?
  explanation: Правильному токену достаётся примерно 1/V вероятности, а cross-entropy даёт -ln(1/V) = ln(V). ln(32000) ≈ 10.37. Для побайтового словаря аналогично получается ln(256) ≈ 5.55.
  kind: numeric
  answer: 10.37
  tolerance: 0.08
  id: 045-startovyi-loss-1
  fingerprint: 7e03921a
- concept: стартовый loss сильно ниже ln(V) указывает на баг или утечку целей, а не на качество модели
  question: Словарь модели содержит 8192 токена, значит ожидаемый стартовый loss около 9.01. На нулевом шаге обучения выводится loss 1.2. Что наиболее вероятно?
  explanation: 'До единого обновления весов модель не может знать ничего сверх равномерной догадки, а равномерная догадка стоит ровно ln(V). Значение сильно ниже означает, что модель видит ответ: типично targets не сдвинуты на позицию либо loss считается не по тем индексам.'
  kind: choice
  options:
    - Модель удачно инициализирована и уже уловила статистику языка
    - 'В коде баг: сдвиг целей, утечка правильных ответов во вход или ошибка в подсчёте loss'
    - Learning rate слишком мал, поэтому loss стартует низко
    - Словарь на деле меньше заявленного, и это норма
  correct: 1
  id: 045-startovyi-loss-2
  fingerprint: d39c9ced
- concept: совпадение стартового loss с ln(V) — необходимое, но не достаточное условие корректности реализации
  question: Стартовый loss совпал с ln(V) для данного словаря. Что именно из этого следует?
  explanation: 'Проверка ловит только грубые поломки: перепутанные targets, сломанный softmax, слишком большой масштаб весов (тогда loss улетает вверх). Ошибка в маске, в градиентах или в оптимизаторе такую проверку спокойно переживёт.'
  kind: choice
  options:
    - Прямой и обратный проходы реализованы верно
    - Выход модели близок к равномерному распределению, то есть грубых ошибок в целях, softmax и масштабе инициализации нет; остальной код не проверен
    - Обучение гарантированно сойдётся
    - Размер словаря выбран оптимально для этих данных
  correct: 1
  id: 045-startovyi-loss-3
  fingerprint: 14af21a4
