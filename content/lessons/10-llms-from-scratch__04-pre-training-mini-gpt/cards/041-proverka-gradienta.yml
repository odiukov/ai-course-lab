- concept: 'знак градиента по логиту задаёт направление обновления: отрицательный ровно у целевого токена, положительный у всех остальных'
  question: Одна позиция последовательности, словарь из 50 000 токенов, целевой токен один. Что верно про знаки градиентов кросс-энтропии по 50 000 логитам этой позиции?
  explanation: Градиент по логиту = p_i − y_i. У нецелевых токенов y_i = 0, значит градиент равен p_i > 0 — логит опускают. У целевого y = 1, значит p − 1 < 0 — логит поднимают. Знак определяет целевой токен, а не текущий максимум распределения.
  kind: choice
  options:
    - Ровно один градиент отрицательный — у целевого токена, остальные 49 999 положительные
    - Все 50 000 градиентов отрицательные, потому что loss нужно уменьшать
    - Ровно один градиент положительный — у целевого токена, остальные отрицательные
    - Знаки зависят от того, какой токен получил максимальную вероятность, а не от целевого
  correct: 0
  id: 041-proverka-gradienta-1
  fingerprint: 0aa584fb
- concept: модуль градиента по логиту целевого токена равен нехватке его вероятности до единицы, поэтому у уверенной модели обучающий сигнал затухает
  question: Модель уже хорошо обучена и даёт правильному следующему токену вероятность 0,98. Чему равен градиент кросс-энтропии по логиту этого токена? Укажи со знаком.
  explanation: p − 1 = 0,98 − 1 = −0,02. Модуль градиента — это нехватка вероятности правильного токена до единицы. Чем увереннее модель, тем меньше градиенты и тем слабее обновление весов; на старте, при почти равномерном распределении, тот же градиент близок к −1.
  kind: numeric
  answer: -0.02
  tolerance: 0.005
  id: 041-proverka-gradienta-2
