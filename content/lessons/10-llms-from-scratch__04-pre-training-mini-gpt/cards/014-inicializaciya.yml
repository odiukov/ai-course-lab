- concept: порядок скалярного произведения двух случайных векторов равен sigma² × sqrt(размерности)
  question: Два вектора размерности 1024 заполнены независимыми нормальными числами со стандартным отклонением 0,05. Какой порядок величины имеет их скалярное произведение?
  explanation: 'Скалярное произведение — сумма 1024 независимых слагаемых, каждое порядка sigma² = 0,0025. Слагаемые случайных знаков складываются как sqrt(N), поэтому итог ≈ 0,0025 × sqrt(1024) = 0,0025 × 32 = 0,08. Отсюда видно, почему масштаб инициализации выбирают малым: при sigma = 1 та же сумма улетела бы в десятки, и softmax сразу насытился бы.'
  kind: numeric
  answer: 0.08
  tolerance: 0.015
  id: 014-inicializaciya-1
  fingerprint: afc2c364
- concept: 'нулевая инициализация создаёт симметрию: одинаковые параметры получают одинаковые градиенты и не расходятся'
  question: Почему матрицу token embeddings нельзя инициализировать нулями, хотя нули гарантируют малые активации?
  explanation: Проблема нулей — симметрия, а не численный сбой. Одинаковые параметры дают одинаковые выходы и одинаковые градиенты, значит остаются одинаковыми и после шага оптимизатора. Случайность нужна именно для разрушения симметрии; малый масштаб (в GPT-2 sigma = 0,02) нужен отдельно — для устойчивости.
  kind: choice
  options:
    - Все строки стартуют идентичными, поэтому представления разных токенов не различаются, и обучение не разводит их по разным ролям
    - Нулевые веса делают loss бесконечным на первой итерации
    - Матрица нулей не имеет обратной, поэтому обратный проход невозможен
    - Оптимизатор Adam делит на веса, а деление на ноль запрещено
  correct: 0
