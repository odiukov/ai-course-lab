- concept: слишком большой масштаб инициализации раздувает активации и делает первые шаги обучения неустойчивыми
  question: Объясни своими словами, что произойдёт с прямым и обратным проходом трансформера, если веса эмбеддингов инициализировать нормальными числами со стандартным отклонением 3,0.
  explanation: 'Ключевые два эффекта: раздутые промежуточные значения (насыщение softmax, экстремальные логиты) и нестабильные градиенты на первых шагах. Малый масштаб решает вторую половину задачи, случайность — первую (различимость параметров).'
  kind: open
  reference: 'Активации на входе окажутся огромными. Внутри attention скалярные произведения растут как sigma² × sqrt(embed_dim), поэтому softmax насытится: почти вся вероятность уйдёт на один токен, распределение станет почти one-hot и его производные — почти нулевыми. Логиты на выходе тоже будут экстремальными, стартовый loss окажется намного выше ln(vocab_size), а градиенты — либо очень большими (резкие, раскачивающие шаги, риск расхождения и NaN), либо исчезающе малыми на насыщенных участках. Модель фактически стартует с сильных случайных «убеждений», которые трудно переучить. Поэтому масштаб берут малым — порядка 0,02 для GPT-2 — чтобы веса были разными, но начальные значения спокойными.'
  id: 014-inicializaciya-3
  fingerprint: fd34bf5e
