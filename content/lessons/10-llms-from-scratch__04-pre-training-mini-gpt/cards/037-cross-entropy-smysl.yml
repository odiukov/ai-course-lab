- concept: cross-entropy равна минус натуральному логарифму вероятности правильного токена
  question: Модель назначила настоящему следующему токену вероятность 0,05. Чему равен кросс-энтропийный штраф на этой позиции?
  explanation: 'L = -log(p) = -ln(0,05) ≈ 2,996. Логарифм растёт быстро при малых p: 0,9 даёт ≈0,11, а 0,001 уже ≈6,91 — самоуверенная ошибка стоит дорого.'
  kind: numeric
  answer: 3
  tolerance: 0.05
  id: 037-cross-entropy-smysl-1
  fingerprint: 61ebe151
- concept: cross-entropy оценивает величину вероятности правильного токена, а не его место в ранжировании
  question: 'Две модели на одной позиции ставят настоящий следующий токен на первое место: первая даёт ему вероятность 0,40, вторая — 0,85. Что покажет cross-entropy?'
  explanation: 'L = -log(p правильного токена): -ln(0,40) ≈ 0,92 против -ln(0,85) ≈ 0,16. Метрика «угадал ли argmax» эти две модели не различает, а cross-entropy различает — и потому даёт непрерывный сигнал для градиентов.'
  kind: choice
  options:
    - 'Штрафы совпадут: обе угадали токен-победителя'
    - У второй модели штраф меньше, потому что она отдала правильному токену больше вероятности
    - 'У второй модели штраф больше: высокая вероятность считается переобучением'
    - Штраф не определён, пока не сравнить вероятности остальных токенов словаря
  correct: 1
  id: 037-cross-entropy-smysl-2
  fingerprint: 65044a73
- concept: loss батча — среднее покомпонентных штрафов по всем позициям
  question: В батче четыре позиции. Правильным токенам модель назначила вероятности 0,5; 0,5; 0,25 и 0,125. Чему равен итоговый loss батча?
  explanation: 'Штрафы: 0,693; 0,693; 1,386; 2,079. Сумма 4,852, делим на 4 позиции — 1,213. Один скаляр на батч нужен, чтобы backward-проход получил единственную величину для дифференцирования.'
  kind: numeric
  answer: 1.213
  tolerance: 0.02
