- concept: градиент кросс-энтропии по логиту равен вероятности после softmax минус индикатор правильного класса
  question: Дополните формулу градиента кросс-энтропийной потери по логиту токена i, если p — распределение после softmax, а y — индекс целевого токена.
  explanation: 'Композиция softmax и кросс-энтропии сворачивается в разность распределения и one-hot вектора target: dL/dz = p - onehot(y). Именно поэтому в коде backward-шага не нужны отдельные производные softmax и логарифма — они сокращаются аналитически.'
  kind: cloze
  template: dL/dz_i = p_i - ___
  answer: 1[i = y]
  accept:
    - индикатор i = y
    - '[i == y]'
    - one-hot по y
    - y_i (one-hot)
    - 1, если i = y, иначе 0
    - delta_{iy}
  id: 039-gradient-logitov-1
  fingerprint: 6adfebaa
- concept: величина градиента по логиту целевого токена при равномерном распределении близка к минус единице
  question: Необученная модель со словарём 4096 токенов выдаёт на позиции почти равномерное распределение. Чему равен градиент dL/dz для логита правильного целевого токена?
  explanation: p_y = 1/4096 ≈ 0.000244, индикатор равен 1, значит градиент = 0.000244 - 1 ≈ -0.99976. Знак отрицательный, а шаг оптимизатора идёт против градиента, поэтому логит правильного токена заметно поднимается. Градиенты неправильных токенов при этом крошечные и положительные (+0.000244 каждый).
  kind: numeric
  answer: -0.99976
  tolerance: 0.001
  id: 039-gradient-logitov-2
  fingerprint: 0e1491ad
- concept: сумма градиентов по всем логитам одной позиции равна нулю
  question: Для одной позиции последовательности сложили градиенты dL/dz_i по всем токенам словаря. Чему равна эта сумма и почему?
  explanation: 'Сумма = Σp_i - Σ1[i=y] = 1 - 1 = 0. Градиент по логитам перераспределяет «давление»: сколько прибавляется правильному кандидату, столько в сумме снимается с остальных. Это удобная проверка при отладке backward-шага — сумма градиентов по оси словаря должна быть нулевой с точностью до ошибок float.'
  kind: choice
  options:
    - 'Нулю: сумма вероятностей softmax равна 1, а сумма индикаторов целевого класса тоже равна 1'
    - 'Единице: каждая вероятность положительна, а вычитается только один индикатор'
    - 'Минус единице: вклад целевого токена доминирует над остальными'
    - 'Зависит от размера словаря: чем он больше, тем больше сумма'
  correct: 0
  id: 039-gradient-logitov-3
  fingerprint: bbc169b0
