- concept: token IDs из внешнего data pipeline должны лежать внутри словаря модели, иначе слой эмбеддингов получит индекс за границей таблицы
  question: Батчи приходят из отдельного data pipeline со своим токенизатором. Допишите проверку, которая ловит несовместимость словарей до прямого прохода.
  explanation: 'Таблица эмбеддингов имеет ровно vocab_size строк. Если pipeline токенизировал корпус словарём большего размера, то ID за границей либо уронит индексацию, либо молча возьмёт неверную строку. Симметрично полезно проверять target_ids: цели тоже адресуют столбцы логитов.'
  kind: cloze
  template: 'assert int(input_ids.max()) < ___  # индексы должны попадать в таблицу эмбеддингов модели'
  answer: vocab_size
  accept:
    - model.vocab_size
    - V
    - len(vocab)
    - model.config.vocab_size
  id: 046-batch-iz-pipeline-1
  fingerprint: 45b3af8c
- concept: если pipeline уже отдал готовую пару input_ids/target_ids, повторный сдвиг внутри обучающего цикла разрушает соответствие вход-цель
  question: 'Data pipeline возвращает две матрицы формы 48×512: input_ids и target_ids, где цель уже стоит на позицию впереди входа. Что должен сделать обучающий цикл?'
  explanation: Сдвиг делают один раз. Если pipeline отдаёт одну последовательность длиной seq_len+1, сдвиг делает цикл; если он отдаёт готовую пару — работа уже сделана. Повторный сдвиг даст цель через две позиции и укоротит матрицы до разных форм, а модель начнёт учиться не тому предсказанию.
  kind: choice
  options:
    - Отрезать последний столбец у input_ids и первый у target_ids, как при нарезке сырого текста
    - Передать обе матрицы модели и функции потерь без изменений
    - Склеить обе матрицы в одну длиной 1024 и заново нарезать её на пары
    - Сдвинуть target_ids ещё на позицию вперёд, чтобы модель училась смотреть дальше
  correct: 1
  id: 046-batch-iz-pipeline-2
  fingerprint: e0bf9213
- concept: при склейке независимых документов в один поток цель на стыке берётся из другого документа, поэтому границы надо резать или разделять специальным токеном
  question: 300 независимых документов склеили в один поток token IDs и нарезали окнами фиксированной длины без учёта границ. Какая ошибка в разметке возникает?
  explanation: 'Сдвиг на позицию не знает о границах: на стыке пара «вход-цель» соединяет конец одного текста с началом другого. Модель учится несуществующему переходу. Лечится разделительным токеном между документами (и/или маскированием таких целей) либо нарезкой каждого документа отдельно.'
  kind: choice
  options:
    - Все окна получаются короче заявленной длины на один токен
    - Для последнего токена документа правильным ответом становится первый токен следующего, никак с ним не связанного документа
    - Токены первого документа встречаются чаще остальных и перекошивают частоты
    - Модель получает одну и ту же цель для всех позиций окна
  correct: 1
  id: 046-batch-iz-pipeline-3
  fingerprint: 79f128a4
