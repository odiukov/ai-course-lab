  question: Расставь шаги вычисления кросс-энтропии для логитов формы (batch, seq_len, vocab_size) и целей формы (batch, seq_len).
  explanation: 'Сначала сводятся ведущие оси, иначе индексация перепутает примеры и позиции. Нормировка идёт до выбора: сравнивать нужно со всеми токенами словаря. Выбор одного столбца на строку даёт логарифмы вероятностей правильных токенов, и лишь потом знак и усреднение сворачивают их в скаляр — вернуть массив вместо числа значит забыть последний шаг.'
  kind: order
