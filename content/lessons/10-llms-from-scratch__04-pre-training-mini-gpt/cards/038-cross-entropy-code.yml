- concept: log_softmax считают одной формулой, потому что путь softmax → log теряет очень малые вероятности из-за исчезновения порядка в float
  question: 'Модель уверенно ошиблась: правильному токену она даёт вероятность порядка 1e-320. Почему кросс-энтропию считают через log_softmax напрямую, а не как np.log(softmax(logits))?'
  explanation: 'Диапазон float64 обрывается около 1e-308: экспонента маленького логита обнуляется, softmax отдаёт ровно 0, log(0) = -inf, и весь loss превращается в inf или nan. Формула logits - max - log(sum(exp(logits - max))) вычисляет логарифм вероятности без промежуточного возведения в экспоненту самого результата, поэтому спокойно возвращает большие отрицательные числа.'
  kind: choice
  options:
    - Такая вероятность округляется до нуля в float64, и логарифм даёт -inf, хотя корректное значение около -737
    - np.log работает только с массивами формы (N,), а softmax возвращает двумерный массив
    - softmax возвращает вероятности, которые не суммируются в единицу, и логарифм это усиливает
    - np.log медленнее умножения, и на длинных последовательностях это заметно по времени
