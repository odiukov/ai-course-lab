<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Масштаб GPT‑2 Small</title>
<style>
  :root {
    --bg: #f7f4ed;
    --panel: #fffdf7;
    --panel-alt: #e8f0ff;
    --ink: #1f2937;
    --muted: #5f6b7a;
    --edge: #94a3b8;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --warm: #d97706;
    --warm-soft: #fef3c7;
    --arrow: #334155;
    --legend: #eef2ff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --panel: #172033;
      --panel-alt: #1e3a5f;
      --ink: #f8fafc;
      --muted: #cbd5e1;
      --edge: #64748b;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --warm: #fbbf24;
      --warm-soft: #453716;
      --arrow: #dbeafe;
      --legend: #202946;
    }
  }

  html,
  body {
    background: var(--bg);
    color: var(--ink);
  }

  .figure {
    background: var(--bg);
    border: 1px solid var(--edge);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .title {
    color: var(--ink);
    font-size: 22px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--bg);
  }

  .weight-panel {
    fill: var(--panel);
    stroke: var(--edge);
    stroke-width: 2px;
  }

  .weight-accent {
    fill: var(--accent);
  }

  .matrix-band {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 1px;
  }

  .step-panel {
    fill: var(--panel);
    stroke: var(--edge);
    stroke-width: 2px;
  }

  .step-accent {
    fill: var(--warm-soft);
    stroke: var(--warm);
    stroke-width: 1px;
  }

  .legend-panel {
    fill: var(--legend);
    stroke: var(--edge);
    stroke-width: 1px;
  }

  .arrow {
    fill: none;
    stroke: var(--arrow);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-head {
    fill: var(--arrow);
    stroke: var(--arrow);
    stroke-width: 1px;
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .section-label {
    font-size: 18px;
    font-weight: bold;
  }

  .hero-number {
    fill: var(--accent);
    font-size: 30px;
    font-weight: bold;
  }

  .hero-label {
    font-size: 16px;
    font-weight: bold;
  }

  .band-label {
    font-size: 14px;
  }

  .storage-number {
    fill: var(--warm);
    font-size: 24px;
    font-weight: bold;
  }

  .storage-label,
  .step-term,
  .arrow-label {
    font-size: 14px;
  }

  .step-name {
    font-size: 16px;
    font-weight: bold;
  }

  .step-term,
  .storage-label {
    fill: var(--muted);
  }

  .arrow-label {
    fill: var(--arrow);
    font-weight: bold;
  }

  .legend-label {
    font-size: 16px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>
<figure class="figure" aria-labelledby="diagram-title">
  <div class="title" id="diagram-title">Масштаб GPT‑2 Small</div>
  <svg id="diagram"
       xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 1200 430"
       width="1200"
       height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">124 438 272 параметра GPT‑2 Small занимают примерно 500 МБ в FP32 и изменяются циклом из прямого прохода, вычисления ошибки, обратного прохода и обновления весов.</desc>
  </svg>
</figure>

<script>
const DATA = [
  {
    origin: { x: 0, y: 0 },
    scale: 1,
    fallback: [
      600,
      215,
      "Схема: 124 438 272 параметра — примерно 500 МБ в FP32 — проходят цикл обучения."
    ]
  },
  {
    type: "rectangles",
    values: [
      [60, 50, 370, 290, "weight-panel"],
      [60, 50, 10, 290, "weight-accent"],
      [95, 155, 300, 26, "matrix-band"],
      [95, 191, 300, 26, "matrix-band"],
      [95, 227, 300, 26, "matrix-band"],

      [520, 55, 200, 80, "step-panel"],
      [520, 55, 200, 10, "step-accent"],
      [870, 55, 200, 80, "step-panel"],
      [870, 55, 200, 10, "step-accent"],
      [870, 255, 200, 80, "step-panel"],
      [870, 255, 200, 10, "step-accent"],
      [520, 255, 200, 80, "step-panel"],
      [520, 255, 200, 10, "step-accent"],

      [60, 372, 1010, 46, "legend-panel"]
    ]
  },
  {
    type: "arrows",
    values: [
      [
        [[430, 105], [520, 105]],
        [[520, 105], [508, 98], [508, 112]],
        "arrow"
      ],
      [
        [[720, 95], [870, 95]],
        [[870, 95], [858, 88], [858, 102]],
        "arrow"
      ],
      [
        [[970, 135], [970, 255]],
        [[970, 255], [963, 243], [977, 243]],
        "arrow"
      ],
      [
        [[870, 295], [720, 295]],
        [[720, 295], [732, 288], [732, 302]],
        "arrow"
      ],
      [
        [[520, 315], [430, 315]],
        [[430, 315], [442, 308], [442, 322]],
        "arrow"
      ]
    ]
  },
  {
    type: "labels",
    values: [
      [245, 28, 0, 0, "Файл весов", "section-label", "middle"],
      [795, 28, 0, 0, "Один обучающий цикл", "section-label", "middle"],

      [245, 94, 0, 0, "124 438 272", "hero-number", "middle"],
      [245, 124, 0, 0, "ПАРАМЕТРА", "hero-label", "middle"],
      [245, 168, 0, 0, "эмбеддинги", "band-label", "middle"],
      [245, 204, 0, 0, "матрицы 12 блоков", "band-label", "middle"],
      [245, 240, 0, 0, "прочие обученные числа", "band-label", "middle"],
      [245, 286, 0, 0, "≈ 500 МБ", "storage-number", "middle"],
      [245, 317, 0, 0, "только веса в FP32", "storage-label", "middle"],

      [620, 88, 0, 0, "Прямой проход", "step-name", "middle"],
      [620, 113, 0, 0, "forward", "step-term", "middle"],
      [970, 88, 0, 0, "Функция ошибки", "step-name", "middle"],
      [970, 113, 0, 0, "loss", "step-term", "middle"],
      [970, 288, 0, 0, "Обратный проход", "step-name", "middle"],
      [970, 313, 0, 0, "backward", "step-term", "middle"],
      [620, 288, 0, 0, "Обновление весов", "step-name", "middle"],
      [620, 313, 0, 0, "update", "step-term", "middle"],

      [430, 105, 45, -20, "все веса", "arrow-label", "middle"],
      [720, 95, 75, -20, "предсказание", "arrow-label", "middle"],
      [970, 195, -20, 0, "значение loss", "arrow-label", "end"],
      [795, 295, 0, -20, "градиенты", "arrow-label", "middle"],
      [475, 315, 0, -20, "новые веса", "arrow-label", "middle"],

      [565, 395, 0, 0, "FP32: 4 байта на параметр → примерно 500 МБ только весов", "legend-label", "middle"]
    ]
  }
];

const [config, rectangleData, arrowData, labelData] = DATA;
const origin = Object.freeze(config.origin);
const scale = config.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

const svg = document.getElementById("diagram");
const SVG_NS = "http://www.w3.org/2000/svg";

function makeElement(name, className) {
  const node = document.createElementNS(SVG_NS, name);
  if (className) node.setAttribute("class", className);
  svg.appendChild(node);
  return node;
}

function setAttributes(node, attributes) {
  for (const [name, value] of Object.entries(attributes)) {
    node.setAttribute(name, String(value));
  }
}

function drawRectangle(record) {
  const [x, y, width, height, className] = record;
  const node = makeElement("rect", className);
  setAttributes(node, {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y)
  });
}

function mappedPoints(points) {
  return points
    .map(([x, y]) => `${sx(x)},${sy(y)}`)
    .join(" ");
}

function drawArrow(record) {
  const [points, head, className] = record;
  const shaft = makeElement("polyline", className);
  setAttributes(shaft, { points: mappedPoints(points) });

  const tip = makeElement("polygon", "arrow-head");
  setAttributes(tip, { points: mappedPoints(head) });
}

function drawLabel(record) {
  const [x, y, offsetX, offsetY, value, className, anchor] = record;
  const node = makeElement("text", className);
  setAttributes(node, {
    x: sx(x + offsetX),
    y: sy(y + offsetY),
    "text-anchor": anchor,
    "dominant-baseline": "middle"
  });
  node.textContent = value;
}

try {
  rectangleData.values.forEach(drawRectangle);
  arrowData.values.forEach(drawArrow);
  labelData.values.forEach(drawLabel);
} catch (error) {
  svg.replaceChildren();
  const [x, y, message] = config.fallback;
  const warning = makeElement("text", "fallback");
  setAttributes(warning, {
    x: sx(x),
    y: sy(y),
    "text-anchor": "middle",
    "dominant-baseline": "middle"
  });
  warning.textContent = message;
}
</script>
</body>
</html>
