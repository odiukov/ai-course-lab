- concept: порог маршрутизации гибридного DST выбирают по совместному компромиссу между JGA и расходами на LLM
  question: На проверочных диалогах конфигурация A редко вызывает LLM, но имеет низкую JGA. Конфигурация B повышает JGA, однако выходит за бюджет. Конфигурация C достигает такой же JGA, как B, при меньшей доле вызовов LLM и укладывается в бюджет. Какую конфигурацию разумнее выбрать?
  explanation: Порог — настраиваемый гиперпараметр. Его оценивают одновременно по JGA, доле обращений к LLM и стоимости одного turn. При одинаковом качестве предпочтительна конфигурация с меньшими расходами.
  kind: choice
  options:
    - A, потому что минимальное число вызовов LLM важнее качества состояния
    - B, потому что при одинаковой JGA доля вызовов LLM не имеет значения
    - C, потому что она сохраняет лучшее качество при меньшей стоимости
    - Любую, потому что порог маршрутизации не влияет на работу трекера
  correct: 2
  id: 035-hybrid-routing-1
  fingerprint: 42d58169
- concept: средняя стоимость гибридного трекера определяется долей turn, отправленных в LLM
  question: Гибридный трекер отправляет в LLM 40% turn. Один вызов модели стоит $0.015, а стоимость выполнения правил можно считать пренебрежимо малой. Какова средняя стоимость обработки одного turn в долларах?
  explanation: 'Ожидаемая стоимость равна доле маршрутизированных turn, умноженной на цену вызова: 0.40 × 0.015 = 0.006 доллара за turn.'
  kind: numeric
  answer: 0.006
  tolerance: 0.0001
  id: 035-hybrid-routing-2
  fingerprint: 8f5704f8
