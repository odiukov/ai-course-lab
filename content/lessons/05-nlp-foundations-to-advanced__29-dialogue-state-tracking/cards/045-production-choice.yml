- concept: размеченные состояния позволяют дообучить DST для широкого домена
  question: Для широкого домена накоплен большой корпус диалогов с эталонным состоянием после каждой реплики. Какой подход к DST наиболее уместен?
  explanation: Разметка вида «история диалога — правильное состояние» даёт обучающие пары для специализированного LDST. LoRA позволяет адаптировать базовую модель дешевле полного дообучения.
  kind: choice
  options:
    - Дообучить LDST-модель с LoRA на размеченных диалогах
    - Ограничиться регулярными выражениями без обучения
    - Использовать только готовую LLM без схемы и валидации
    - Заменить трекинг состояния поиском по истории диалога
  correct: 0
  id: 045-production-choice-1
  fingerprint: f1955a90
- concept: голосовой DST требует распознавания и нормализации до извлечения состояния
  question: Расположи компоненты голосового диалогового трекера в порядке обработки пользовательской реплики.
  explanation: DST работает с текстом, поэтому голос сначала преобразуют в расшифровку. Нормализатор уменьшает влияние ошибок и вариативности ASR, после чего LLM-DST извлекает slots.
  kind: order
  items:
    - Распознать речь с помощью ASR
    - Нормализовать полученную расшифровку
    - Извлечь диалоговое состояние с помощью LLM-DST
  id: 045-production-choice-2
  fingerprint: fbbfb625
- concept: многодоменный DST использует отдельный типизированный контракт состояния для каждого домена
  question: Почему в многодоменной системе бронирования полезно задавать отдельную Pydantic-модель состояния для каждого домена?
  explanation: Схемы отеля, транспорта и ресторана различаются. Разделение моделей локализует эти различия и предотвращает смешивание несовместимых полей при генерации состояния.
  kind: open
  reference: У разных доменов разные slots, типы и ограничения. Отдельные модели не позволяют полям одного домена случайно попадать в состояние другого, упрощают валидацию и дают каждому обработчику точный контракт.
  id: 045-production-choice-3
  fingerprint: 3465fc6e
