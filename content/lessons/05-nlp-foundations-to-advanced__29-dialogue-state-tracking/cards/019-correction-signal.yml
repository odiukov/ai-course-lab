- concept: детектор коррекции служит сигналом маршрутизации и не определяет изменение состояния
  question: Детектор обнаружил в реплике пользователя маркер исправления. Как DST-система должна использовать этот результат?
  explanation: Детектор коррекции сообщает только о наличии исправления. Он не определяет, какой slot затронут и какое значение нужно записать. Поэтому сигнал можно использовать для подтверждения или специального маршрута обработки, а изменение состояния поручить экстракторам либо модели, учитывающей контекст.
  kind: choice
  options:
    - Автоматически перезаписать slot, который изменялся последним
    - Направить реплику на более осторожную обработку, а slot и новое значение определить отдельно
    - Очистить всё диалоговое состояние и записать маркер исправления как новый slot
  correct: 1
  id: 019-correction-signal-1
  fingerprint: 79dbcdad
- concept: последний изменённый slot нельзя надёжно считать объектом пользовательской коррекции
  question: Почему правило «при коррекции перезапиши последний изменённый slot» остаётся ненадёжным даже при наличии журнала времени обновлений?
  explanation: 'Журнал обновлений позволяет узнать, какой slot менялся недавно, но не доказывает, что пользователь исправляет именно его. Маркер коррекции не содержит адреса изменения: нужный slot устанавливается по новому значению и контексту.'
  kind: open
  reference: Пользователь может исправлять ограничение, упомянутое раньше, а не последнее обновлённое значение. Время изменения показывает порядок записей, но не смысловую связь коррекции со slot. Объект исправления нужно определять из содержания реплики и контекста диалога.
  id: 019-correction-signal-2
  fingerprint: bf8f2108
