  fingerprint: a26ec96e
- concept: ontology-free DST переносится на открытые домены благодаря генерации не только значений, но и имён slot
  question: Объясни своими словами, почему ontology-free DST легче переносить в сервисы, где после запуска могут появляться новые домены и новые типы пользовательских ограничений. Какой ценой достигается эта гибкость?
  explanation: Классические DST-системы ожидают известный перечень доменов и slot. Ontology-free подход снимает это ограничение, однако переносит больше решений на генеративную модель, поэтому сложнее гарантировать смысловую корректность результата и контролировать стоимость.
  kind: open
  reference: 'Ontology-free DST не зависит от заранее зафиксированной онтологии: модель генерирует имена slot и их значения непосредственно из диалога. Поэтому новую схему не обязательно полностью задавать вручную, но поведение становится менее предсказуемым и объяснимым, а вычислительные затраты возрастают.'
  id: 009-architectures-2
  fingerprint: c32ff11a
