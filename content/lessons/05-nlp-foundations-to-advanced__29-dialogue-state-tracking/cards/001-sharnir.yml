- concept: нормализация разговорной формулировки в допустимое значение slot
  question: Пользователь просит найти «что-нибудь бюджетное», а поле price в API принимает только значения cheap, moderate и expensive. Какой результат должен сформировать DST?
  explanation: 'DST должен сопоставить разговорную формулировку с каноническим значением из схемы бэкенда. Здесь «бюджетное» нормализуется в price: cheap.'
  kind: choice
  options:
    - Сохранить исходную фразу в поле price
    - 'Записать price: cheap'
    - Сгенерировать пользователю вежливое подтверждение без заполнения price
    - Передать все допустимые значения price
  correct: 1
  id: 001-sharnir-1
  fingerprint: '06666478'
- concept: качество DST определяется параметрами действия, а не убедительностью ответа
  question: Почему вежливый и осмысленный ответ диалоговой системы ещё не доказывает, что запрос пользователя обработан правильно?
  explanation: Ответ пользователю и структурированное состояние — разные результаты. Даже убедительная реплика не предотвращает ошибочное бронирование, поиск или платёж, если хотя бы один параметр бэкенда извлечён неверно.
  kind: open
  reference: Потому что текст ответа может верно передавать общий смысл, тогда как DST передаст бэкенду неверные slot-значения. Правильность определяется тем, соответствуют ли параметры вызова API намерению пользователя и приведут ли они к нужному действию.
  id: 001-sharnir-2
