- concept: response_model превращает обычный вызов клиента LLM в получение проверенного экземпляра Pydantic-модели
  question: Объясни своими словами, чем результат вызова LLM с Instructor и response_model отличается от обычного текстового ответа провайдера.
  explanation: Instructor оборачивает привычный клиент провайдера и добавляет аргумент response_model. После проверки Pydantic вызывающий код получает готовый RestaurantState, а не текст для ручного разбора.
  kind: open
  reference: Вместо сырого сообщения, из которого нужно самостоятельно извлекать текст, разбирать JSON и проверять поля, вызов возвращает экземпляр указанной Pydantic-модели. Поэтому к значениям состояния можно обращаться как к типизированным атрибутам объекта.
