- concept: валидатор DST пропускает только известные slots со значениями допустимых типов и enum
  question: 'Схема бронирования разрешает cuisine: italian/chinese/indian/thai/any, area: north/south/east/west/center, price: cheap/moderate/expensive, people: целое число, day: строка. Неизвестные slots запрещены. Какое состояние пройдёт валидацию?'
  explanation: В первом состоянии все имена slots известны, enum-значения входят в разрешённые списки, а people задан целым числом. Остальные варианты содержат соответственно неизвестный slot, недопустимый enum и неверный тип.
  kind: choice
  options:
    - '{"cuisine": "chinese", "area": "south", "people": 6, "day": "friday"}'
    - '{"cuisine": "chinese", "seating": "outside", "people": 6}'
    - '{"area": "south", "price": "luxury", "people": 6}'
    - '{"cuisine": "chinese", "area": "south", "people": "six"}'
  correct: 0
  id: 026-validation-contract-1
  fingerprint: dd24112e
- concept: проверенное состояние должно отделять извлечение параметров от вызова бэкенда
  question: Расположи этапы обработки реплики так, чтобы некорректное состояние не дошло до системы бронирования.
  explanation: Валидация выполняется после извлечения состояния, но до реального действия. Ошибка на этой границе останавливает неизвестные поля, недопустимые категории и значения неверных типов.
  kind: order
  items:
    - Получить от трекера кандидатное диалоговое состояние
    - Проверить имена slots, значения закрытых enum и типы
    - Передать успешно проверенное состояние в бэкенд
  id: 026-validation-contract-2
  fingerprint: 647136d3
