- concept: обновление DST создаёт новый словарь состояния, не мутируя переданное состояние
  question: Система сохраняет previous_state в журнале, а затем вычисляет состояние после новой реплики. Как следует инициализировать new_state, чтобы дальнейшие присваивания не изменили сохранённый previous_state?
  explanation: dict(previous_state) создаёт отдельный словарь с прежними парами slot-value. Присваивания в new_state не мутируют previous_state; простое присваивание сохранило бы ссылку на тот же словарь, а пустой словарь потерял бы прежние данные.
  kind: choice
  options:
    - new_state = dict(previous_state)
    - new_state = previous_state
    - new_state = {}
  correct: 0
  id: 017-update-policy-1
  fingerprint: 1df8a672
- concept: пользовательская коррекция заменяет прежнее значение slot, а не добавляется к нему
  question: 'В состоянии DST записано cuisine = "thai". Пользователь говорит: «Вообще-то хочу корейскую кухню». Каким должно стать значение cuisine?'
  explanation: Коррекция выражает актуальное ограничение пользователя, поэтому новое каноническое значение перезаписывает старое. Slot хранит текущую цель, а не историю всех ранее названных вариантов.
  kind: choice
  options:
    - '["thai", "korean"]'
    - '"korean"'
    - '"thai korean"'
  correct: 1
  id: 017-update-policy-2
  fingerprint: 5320b536
