- concept: проверка равенства длин до zip предотвращает оценку неполного прогона
  question: Трекер вернул меньше состояний, чем содержится в эталоне, причём вся общая часть совпадает. Как должна поступить надёжная реализация joint_goal_accuracy?
  explanation: Python zip молча останавливается на конце более короткого списка. Поэтому без предварительной проверки потерянные предсказания могут остаться незамеченными; расхождение длин должно приводить к ValueError.
  kind: choice
  options:
    - Оценить только общую часть списков
    - Поднять ValueError до попарного сравнения
    - Дополнить недостающие предсказания пустыми словарями
    - Разделить число совпадений на длину эталона
  correct: 1
  id: 039-joint-goal-accuracy-1
  fingerprint: 1341d6dd
- concept: пустой парный вход обрабатывается явно до вычисления отношения
  question: Объясни своими словами, зачем joint_goal_accuracy отдельно обрабатывает случай, когда оба входных списка пусты, и какой результат должна вернуть.
  explanation: Явная ветка для двух пустых списков задаёт предсказуемый контракт функции и предотвращает деление на ноль. Проверка длин выполняется раньше, чтобы пустой список только с одной стороны не был принят за корректный пустой набор.
  kind: open
  reference: 'После проверки равенства длин функция должна вернуть вещественный ноль: совпадения нельзя делить на пустое число состояний, иначе возникнет ZeroDivisionError.'
  id: 039-joint-goal-accuracy-2
  fingerprint: a4af7500
