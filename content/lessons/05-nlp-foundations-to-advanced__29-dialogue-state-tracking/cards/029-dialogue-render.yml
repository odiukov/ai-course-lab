- concept: формат расшифровки должен быть консистентным между примерами и рабочими запросами
  question: Почему для LLM-driven DST важнее последовательно использовать один формат расшифровки диалога, чем выбирать конкретные метки или разделители?
  explanation: Метки и разделители служат структурными сигналами. Их точный вид можно выбрать произвольно, но внезапная смена оформления заставляет модель заново интерпретировать роли и границы реплик вместо восстановления состояния.
  kind: open
  reference: 'У конкретных меток и разделителей нет обязательной семантики: модель может работать с разными форматами. Но стабильное оформление даёт одинаковые сигналы ролей и границ реплик. Если формат рабочих запросов отличается от формата демонстраций или обучающих данных, возникает ненужный сдвиг представления и качество извлечения состояния может снизиться.'
