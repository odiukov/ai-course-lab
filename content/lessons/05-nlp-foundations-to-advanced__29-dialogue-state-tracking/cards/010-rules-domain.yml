- concept: конечный словарь правил не обобщается на отсутствующие в нём перефразы
  question: Объясни своими словами, почему добавление синонимов повышает покрытие rule-based slot extractor, но не устраняет его хрупкость на новых формулировках.
  explanation: Словарь может покрывать около 70% типичных фраз, однако это покрытие основано на перечислении вариантов, а не на понимании смысла. Поэтому неизвестная формулировка возвращает отсутствие значения, пока инженер не добавит новое правило.
  kind: open
  reference: Экстрактор распознаёт только явно перечисленные слова и шаблоны. Каждый новый синоним закрывает дополнительные известные формулировки, но семантически похожая фраза, для которой правила нет, всё равно останется нераспознанной.
  id: 010-rules-domain-2
  fingerprint: 4bb96d91
