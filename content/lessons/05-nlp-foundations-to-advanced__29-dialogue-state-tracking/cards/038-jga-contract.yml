- concept: JGA равна доле turn с полностью совпавшим состоянием
  question: Из семи проверенных turn состояния полностью совпали с эталоном в пяти. Чему равна JGA? Ответ округли до трёх знаков после запятой.
  explanation: 'В числитель входят только полностью верные состояния: JGA = 5 / 7 ≈ 0.714. Частично правильные turn не добавляют дробных баллов.'
