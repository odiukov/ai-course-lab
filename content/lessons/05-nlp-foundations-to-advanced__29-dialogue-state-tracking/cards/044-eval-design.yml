- concept: отложенные диалоги оценивают обобщение DST без утечки из настройки
  question: Как корректно использовать отложенный набор диалогов при разработке трекера состояния?
  explanation: Если результаты на отложенных диалогах влияют на правила, промпт или гиперпараметры, набор фактически становится частью разработки. Финальная оценка на нетронутых диалогах лучше показывает качество на новых пользовательских формулировках.
  kind: choice
  options:
    - Подбирать по нему словарь правил, а после настройки измерить на нём итоговое качество
    - Не использовать его для настройки правил, промпта и порога маршрутизации, а открыть только для финальной оценки
    - Проверять на нём каждую версию трекера и выбирать версию с лучшим результатом
    - Добавлять его трудные реплики в обучающий набор после каждой ошибки
  correct: 1
  id: 044-eval-design-1
  fingerprint: b9330d41
- concept: ручной анализ ошибок отдельного slot выявляет систематические языковые причины сбоев DST
  question: Расположите этапы диагностики наиболее проблемного slot в правильном порядке.
  explanation: Сначала локализуют слабый slot по отдельной метрике, затем изучают контекст его ошибок, сравнивают эталон с прогнозом и группируют причины — например, исправления, отрицания или неоднозначные ссылки. Такой разбор показывает, что именно нужно улучшать.
  kind: order
  items:
    - Вычислить качество отдельно для каждого slot и выбрать наиболее проблемный
    - Собрать ошибочные ходы выбранного slot вместе с предшествующей историей
    - Сопоставить ожидаемое значение с предсказанным
    - Разметить языковые причины ошибок и найти повторяющиеся классы сбоев
  id: 044-eval-design-2
  fingerprint: 6636468d
