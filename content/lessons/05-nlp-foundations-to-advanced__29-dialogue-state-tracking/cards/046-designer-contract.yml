- concept: полный DST-дизайн фиксирует все решения, необходимые для воспроизводимого запуска трекера
  question: Какое описание задаёт полноценный инженерный контракт для dialogue state tracker?
  explanation: Полный контракт описывает не только структуру состояния, но и получение значений, правила изменения, проверку качества, подтверждение сомнительных действий и версию схемы. Это делает поведение трекера воспроизводимым и проверяемым.
  kind: choice
  options:
    - Перечень доменов и выбранная модель извлечения
    - Метрики качества и набор отложенных диалогов
    - Политика обновления состояния и сценарии подтверждения
    - Схема, экстрактор, обновление, оценка и подтверждение без версии схемы
    - Схема, политика обновления и версия без способа извлечения и оценки
    - Экстрактор, метрики и версия без схемы состояния
    - Версионированная схема, обоснованный выбор экстрактора, политика обновления, протокол оценки и условия явного подтверждения
  correct: 6
  id: 046-designer-contract-1
  fingerprint: bb47dbe2
- concept: низкая уверенность извлечения является самостоятельным основанием для явного подтверждения
  question: Заполните действие DST-контроллера, чтобы не передавать в бэкенд значение slot, извлечённое с недостаточной уверенностью.
  explanation: При уверенности ниже установленного порога система должна уточнить значение у пользователя. Это правило действует даже тогда, когда само последующее действие не считается разрушительным.
  kind: cloze
  template: |-
    if extraction_confidence < confidence_threshold:
        next_action = ___
  answer: request_explicit_confirmation
