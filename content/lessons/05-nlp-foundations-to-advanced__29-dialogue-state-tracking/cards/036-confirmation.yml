- concept: расхождение между извлечённым состоянием и независимой проверкой обрабатывается по принципу fail-closed
  question: Объясни своими словами, как комплаенс-чувствительная DST-система должна поступить, если извлечённые критические параметры не проходят независимую проверку.
  explanation: Вторичная проверка должна влиять на управление действием, а не быть только диагностикой. При конфликте система закрывает путь к необратимой операции и возвращается к уточнению состояния.
  kind: open
  reference: 'Система должна остановить действие, не передавать параметры в бэкенд и запросить у пользователя уточнение. Нельзя выбирать результат LLM или проверки наугад: расхождение означает, что безопасного основания для выполнения операции нет.'
