- concept: ранний возврат делает результат экстрактора зависимым от порядка правил при нескольких совпадениях
  question: Экстрактор перебирает группы синонимов по порядку и сразу возвращает каноническое значение найденной группы. Что произойдёт, если одна реплика содержит синонимы сразу из двух групп?
  explanation: Оператор `return` завершает функцию при первом совпадении. Если в одной реплике подходят несколько групп, приоритет неявно задаётся порядком их перебора; для другого поведения нужны явные приоритеты или обработка всех совпадений.
  kind: open
  reference: Экстрактор вернёт каноническое значение первой совпавшей группы и не проверит последующие группы, поэтому при пересекающихся совпадениях результат зависит от порядка правил.
