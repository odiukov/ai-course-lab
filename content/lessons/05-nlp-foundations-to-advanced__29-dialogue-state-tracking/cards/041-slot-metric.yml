- concept: slot accuracy вычисляется как доля точно совпавших значений среди всех проверяемых позиций slot
  question: В тесте из 18 ходов проверяют по 6 slot, включая ещё не заданные пользователем. Предсказание точно совпало с эталоном в 81 позиции. Какова slot accuracy в процентах?
  explanation: Всего проверяется 18 × 6 = 108 позиций. Точно совпали 81, поэтому slot accuracy равна 81 / 108 = 0,75, или 75%. Позиции с пустым эталонным значением также входят в расчёт.
  kind: numeric
  answer: 75
  tolerance: 0.01
  id: 041-slot-metric-1
  fingerprint: d2c69b21
- concept: slot accuracy выявляет частичное улучшение DST, которое может не отражаться в JGA
  question: После обновления DST его JGA не изменилась, но slot accuracy выросла. Какой вывод наиболее обоснован?
  explanation: JGA засчитывает ход только при полном совпадении состояния. Slot accuracy оценивает отдельные позиции, поэтому может показать рост числа правильных значений даже тогда, когда в каждом состоянии ещё остаётся хотя бы одна ошибка.
  kind: choice
  options:
    - Трекер стал правильно восстанавливать больше отдельных slot, но этого пока недостаточно для увеличения числа полностью верных состояний
    - Трекер обязательно начал добавлять лишние slot во все состояния
    - Качество трекера не изменилось, потому что учитывать следует только JGA
    - Метрики противоречат друг другу, поэтому результаты теста недействительны
  correct: 0
  id: 041-slot-metric-2
  fingerprint: 451264aa
