<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Видео превращается в последовательность кубиков</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#59657a;
  --line:#8290a8;
  --accent:#3867d6;
  --accent-fill:#dfe9ff;
  --patch:#e58b28;
  --patch-fill:#ffe4bd;
  --token:#16856b;
  --token-fill:#d7f3eb;
  --order:#8353bd;
  --order-fill:#eee2fb;
  --soft:#e6ebf3;
  --error:#a52b37
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111722;
    --panel:#182131;
    --ink:#edf3ff;
    --muted:#b4bfd2;
    --line:#7f8da5;
    --accent:#7ea5ff;
    --accent-fill:#263c67;
    --patch:#f2ad5b;
    --patch-fill:#583d24;
    --token:#55d2b1;
    --token-fill:#204c43;
    --order:#c39aef;
    --order-fill:#493760;
    --soft:#344158;
    --error:#ff9aa5
  }
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{
  margin:auto;
  padding:12px;
  max-width:1200px;
  background:var(--panel);
  border:1px solid var(--soft)
}
h1{
  margin:0 0 8px;
  font-size:20px;
  text-align:center
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:430px;
  background:var(--bg)
}
.line{fill:none;stroke:var(--line);stroke-width:2}
.strong{fill:none;stroke:var(--ink);stroke-width:2}
.accent-line{fill:none;stroke:var(--accent);stroke-width:3}
.patch-line{fill:none;stroke:var(--patch);stroke-width:3}
.token-line{fill:none;stroke:var(--token);stroke-width:3}
.order-line{fill:none;stroke:var(--order);stroke-width:3}
.frame{fill:var(--panel);stroke:var(--line);stroke-width:2}
.patch-fill{fill:var(--patch-fill);stroke:var(--patch);stroke-width:2}
.grid-fill{fill:var(--accent-fill);stroke:var(--accent);stroke-width:2}
.token-fill{fill:var(--token-fill);stroke:var(--token);stroke-width:2}
.order-fill{fill:var(--order-fill);stroke:var(--order);stroke-width:2}
.panel-fill{fill:var(--panel);stroke:var(--soft);stroke-width:2}
.label{fill:var(--ink);font-size:14px}
.small{fill:var(--muted);font-size:12px}
.section{fill:var(--ink);font-size:16px;font-weight:bold}
.value{fill:var(--ink);font-size:15px;font-weight:bold}
.error{fill:var(--error);font-size:16px}
</style>
</head>
<body>
<figure>
  <h1>Видео превращается в последовательность кубиков</h1>
  <svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Патчификация видео в 256 токенов</title>
    <desc id="svg-desc">Тензор формы 1, 4, 8, 16, 16 разбивается кубиками 2 на 2 на 2 в сетку 4 на 8 на 8, после чего разворачивается по осям t, h, w.</desc>
    <g id="stage"></g>
  </svg>
</figure>
<script>
const [data]=[{
  zero:0,one:1,two:2,three:3,four:4,eight:8,sixteen:16,
  canvas:{width:1200,height:430},
  origin:{x:20,y:15},scale:5,
  pad:{none:0,near:4,far:8},
  line:{normal:2,strong:3},
  arrow:{head:2.4,half:1.2},
  input:{
    x:5,y:23,size:17,frames:8,stepX:1.05,stepY:-0.72,
    patchX:2,patchY:2,patchSize:4
  },
  cube:{x:57,y:27,size:9,depthX:4,depthY:-4},
  grid:{
    x:91,y:23,t:4,h:8,w:8,cell:2.15,
    layerX:2.15,layerY:-2.15
  },
  card:{x:132,y:24,w:13,h:18},
  bars:[
    {x:135,y:36,w:1.4,h:3},
    {x:138,y:32,w:1.4,h:7},
    {x:141,y:28,w:1.4,h:11}
  ],
  sequence:{
    y:26,w:5.2,h:12,
    cards:[
      {x:158,c:"grid-fill"},{x:164.4,c:"grid-fill"},
      {x:170.8,c:"grid-fill"},{x:177.2,c:"token-fill"},
      {x:188.5,c:"token-fill"},{x:194.9,c:"token-fill"},
      {x:207.5,c:"order-fill"},{x:213.9,c:"order-fill"},
      {x:220.3,c:"order-fill"}
    ],
    dots:[183.1,201.4]
  },
  order:{
    labelX:157,startX:160,
    rows:[
      {y:54,endX:183,text:"w — меняется первым"},
      {y:60,endX:204,text:"h — затем"},
      {y:66,endX:229,text:"t — затем"}
    ]
  },
  panels:[
    {x:2,y:10,w:47,h:59},
    {x:52,y:10,w:25,h:59},
    {x:81,y:10,w:45,h:59},
    {x:129,y:10,w:19,h:59},
    {x:152,y:10,w:80,h:59}
  ],
  arrows:[
    {x1:46,y1:36,x2:55,y2:36,cls:"patch-line"},
    {x1:70,y1:36,x2:88,y2:36,cls:"accent-line"},
    {x1:121,y1:36,x2:129,y2:36,cls:"token-line"},
    {x1:147,y1:36,x2:155,y2:36,cls:"order-line"}
  ],
  footer:{x:2,y:73,w:230,h:9},
  fallback:{x:116,y:39},
  featureTicks:[0.24,0.48,0.72]
}];

const origin=Object.freeze({x:data.origin.x,y:data.origin.y});
const scale=data.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

const svg=document.getElementById("diagram");
const stage=document.getElementById("stage");
const ns="http://www.w3.org/2000/svg";

try{
  const add=(tag,attrs,cls,parent=stage)=>{
    const el=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));
    if(cls)el.setAttribute("class",cls);
    parent.appendChild(el);
    return el;
  };

  const group=()=>add("g",{});
  const line=(x1,y1,x2,y2,cls="line",parent=stage)=>
    add("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2)},cls,parent);

  const rect=(x,y,w,h,cls="frame",parent=stage)=>
    add("rect",{
      x:sx(x),y:sy(y),
      width:sx(x+w)-sx(x),
      height:sy(y+h)-sy(y)
    },cls,parent);

  const polygon=(points,cls,parent=stage)=>
    add("polygon",{
      points:points.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ")
    },cls,parent);

  const text=(x,y,value,cls="label",anchor="middle",dx=data.pad.none,dy=data.pad.none,parent=stage)=>{
    const el=add("text",{
      x:sx(x),y:sy(y),dx,dy,
      "text-anchor":anchor,
      "dominant-baseline":"middle"
    },cls,parent);
    el.textContent=value;
    return el;
  };

  const arrow=(x1,y1,x2,y2,cls="strong",parent=stage)=>{
    const vx=x2-x1;
    const vy=y2-y1;
    const length=Math.sqrt(vx*vx+vy*vy);
    const ux=vx/length;
    const uy=vy/length;
    const baseX=x2-ux*data.arrow.head;
    const baseY=y2-uy*data.arrow.head;
    const px=-uy*data.arrow.half;
    const py=ux*data.arrow.half;
    line(x1,y1,baseX,baseY,cls,parent);
    polygon([
      {x:x2,y:y2},
      {x:baseX+px,y:baseY+py},
      {x:baseX-px,y:baseY-py}
    ],cls,parent);
  };

  const cube=(x,y,size,dx,dy,fillClass)=>{
    const g=group();
    polygon([
      {x:x,y:y},{x:x+dx,y:y+dy},
      {x:x+size+dx,y:y+dy},{x:x+size,y:y}
    ],fillClass,g);
    polygon([
      {x:x+size,y:y},{x:x+size+dx,y:y+dy},
      {x:x+size+dx,y:y+size+dy},{x:x+size,y:y+size}
    ],fillClass,g);
    rect(x,y,size,size,fillClass,g);
    line(x+size/data.two,y,x+size/data.two,y+size,"patch-line",g);
    line(x,y+size/data.two,x+size,y+size/data.two,"patch-line",g);
    line(x+dx/data.two,y+dy/data.two,x+size+dx/data.two,y+dy/data.two,"patch-line",g);
    line(x+size+dx/data.two,y+dy/data.two,x+size+dx/data.two,y+size+dy/data.two,"patch-line",g);
    return g;
  };

  data.panels.forEach(panel=>rect(panel.x,panel.y,panel.w,panel.h,"panel-fill"));
  rect(data.footer.x,data.footer.y,data.footer.w,data.footer.h,"panel-fill");

  text(25.5,14,"Входное видео","section");
  text(64.5,14,"Патч","section");
  text(103.5,14,"Сетка","section");
  text(138.5,14,"Проекция","section");
  text(192,14,"Последовательность","section");

  const inputGroup=group();
  for(let frame=data.input.frames-data.one;frame>=data.zero;frame-=data.one){
    rect(
      data.input.x+frame*data.input.stepX,
      data.input.y+frame*data.input.stepY,
      data.input.size,data.input.size,"frame",inputGroup
    );
  }

  rect(
    data.input.x+data.input.patchX,
    data.input.y+data.input.patchY,
    data.input.patchSize,data.input.patchSize,
    "patch-fill",inputGroup
  );
  rect(
    data.input.x+data.input.patchX+data.input.stepX,
    data.input.y+data.input.patchY+data.input.stepY,
    data.input.patchSize,data.input.patchSize,
    "patch-fill",inputGroup
  );

  arrow(data.input.x,data.input.y+data.input.size+data.four,
        data.input.x+data.input.size,data.input.y+data.input.size+data.four,
        "accent-line",inputGroup);
  text(data.input.x+data.input.size/data.two,
       data.input.y+data.input.size+data.eight,
       "W = 16","small","middle",data.pad.none,data.pad.none,inputGroup);

  arrow(data.input.x-data.three,data.input.y+data.input.size,
        data.input.x-data.three,data.input.y,
        "accent-line",inputGroup);
  text(data.input.x-data.four,data.input.y+data.input.size/data.two,
       "H = 16","small","end",data.pad.none,data.pad.none,inputGroup);

  arrow(data.input.x+data.input.size+data.two,
        data.input.y-data.two,
        data.input.x+data.input.size+data.eight,
        data.input.y-data.sixteen/data.two,
        "accent-line",inputGroup);
  text(data.input.x+data.input.size+data.eight,
       data.input.y-data.sixteen/data.two-data.two,
       "T = 8 кадров","small","middle");

  text(25.5,48,"тензор (1, 4, 8, 16, 16)","value");
  text(25.5,53,"4 канала остаются признаками","small");
  text(25.5,57,"внутри пространственных позиций","small");
  text(25.5,63,"выделены соседние 2 кадра","small");

  cube(
    data.cube.x,data.cube.y,data.cube.size,
    data.cube.depthX,data.cube.depthY,"patch-fill"
  );
  text(64.5,47,"2 × 2 × 2","value");
  text(64.5,52,"пространственно-временной","small");
  text(64.5,56,"кубик","small");
  text(64.5,63,"окно = шаг","small");

  data.arrows.forEach(item=>arrow(item.x1,item.y1,item.x2,item.y2,item.cls));
  text(50.5,31,"нарезка","small");
  text(79,31,"без перекрытий","small");
  text(123.5,31,"свёртка","small");
  text(149.5,31,"flatten","small");

  const gridGroup=group();
  for(let layer=data.grid.t-data.one;layer>=data.zero;layer-=data.one){
    const gx=data.grid.x+layer*data.grid.layerX;
    const gy=data.grid.y+layer*data.grid.layerY;
    const gw=data.grid.w*data.grid.cell;
    const gh=data.grid.h*data.grid.cell;
    rect(gx,gy,gw,gh,"grid-fill",gridGroup);
    for(let column=data.one;column<data.grid.w;column+=data.one){
      line(gx+column*data.grid.cell,gy,
           gx+column*data.grid.cell,gy+gh,"line",gridGroup);
    }
    for(let row=data.one;row<data.grid.h;row+=data.one){
      line(gx,gy+row*data.grid.cell,
           gx+gw,gy+row*data.grid.cell,"line",gridGroup);
    }
  }

  rect(
    data.grid.x,
    data.grid.y,
    data.grid.cell,
    data.grid.cell,
    "patch-fill",gridGroup
  );
  text(103.5,48,"4 временных слоя","value");
  text(103.5,53,"в каждом — сетка 8 × 8","small");
  text(103.5,58,"итого 4 × 8 × 8","small");
  text(103.5,63,"= 256 позиций","value");

  rect(data.card.x,data.card.y,data.card.w,data.card.h,"token-fill");
  data.bars.forEach(bar=>
    rect(bar.x,bar.y,bar.w,bar.h,"token-fill")
  );
  data.featureTicks.forEach(tick=>{
    const y=data.card.y+data.card.h*tick;
    line(data.card.x+data.two,y,
         data.card.x+data.card.w-data.two,y,"token-line");
  });
  text(138.5,47,"1 кубик","small");
  text(138.5,52,"→","value");
  text(138.5,57,"1 токен","small");
  text(138.5,63,"из 64 чисел","value");

  data.sequence.cards.forEach(card=>
    rect(card.x,data.sequence.y,data.sequence.w,data.sequence.h,card.c)
  );
  data.sequence.dots.forEach(dot=>{
    text(dot,data.sequence.y+data.sequence.h/data.two,"•••","value");
  });
  text(192,43,"256 токенов","value");
  text(192,48,"порядок осей flatten: t → h → w","small");

  data.order.rows.forEach((row,index)=>{
    const cls=index===data.zero?"accent-line":
              index===data.one?"token-line":"order-line";
    text(data.order.labelX,row.y,row.text,"small","end",-data.pad.far);
    arrow(data.order.startX,row.y,row.endX,row.y,cls);
  });

  text(117,77.5,
       "(1, 4, 8, 16, 16)  →  кубики 2 × 2 × 2  →  сетка 4 × 8 × 8  →  256 токенов по 64 числа",
       "value");
}catch(error){
  stage.replaceChildren();
  const fallback=document.createElementNS(ns,"text");
  fallback.setAttribute("x",sx(data.fallback.x));
  fallback.setAttribute("y",sy(data.fallback.y));
  fallback.setAttribute("text-anchor","middle");
  fallback.setAttribute("dominant-baseline","middle");
  fallback.setAttribute("class","error");
  fallback.textContent="Тензор (1, 4, 8, 16, 16) должен разбиться патчами 2 × 2 × 2 в сетку 4 × 8 × 8 из 256 токенов.";
  stage.appendChild(fallback);
}
</script>
</body>
</html>
