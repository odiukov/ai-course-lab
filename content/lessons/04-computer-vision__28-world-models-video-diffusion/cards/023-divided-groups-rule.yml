- concept: временное внимание группирует токены по фиксированной позиции сетки, а не по траектории объекта
  question: Мяч между кадрами переместился из позиции p в позицию q. Какие токены непосредственно взаимодействуют с токеном (t, q) во временном подслое divided attention?
  explanation: Временная группа строится для фиксированной координаты (h, w). Поэтому токен в позиции q смотрит на ту же позицию q в других кадрах, даже если движущийся объект раньше находился в другом месте.
  kind: choice
  options:
    - Токены позиции q из остальных моментов времени
    - Токены, через которые проходит траектория мяча
    - Все пространственные позиции кадра t
    - Все токены видео
  correct: 0
  id: 023-divided-groups-rule-1
  fingerprint: 3cbbe997
- concept: последовательность временного и пространственного внимания создаёт двухэтапный путь между произвольными видеотокенами
  question: Объясните, как в одном divided-attention блоке информация от токена (tₛ, pₛ) может попасть к токену (tₑ, pₑ), если различаются и момент времени, и пространственная позиция.
  explanation: Временное внимание сначала переносит сведения вдоль фиксированной позиции, а пространственное — между позициями выбранного кадра. Поэтому токены с разными временными и пространственными координатами связаны не напрямую, а через промежуточный токен.
  kind: open
  reference: Во временном подслое информация идёт от (tₛ, pₛ) к токену (tₑ, pₛ), поскольку у них совпадает пространственная позиция. Затем пространственный подслой передаёт её внутри момента tₑ от позиции pₛ к позиции pₑ.
  id: 023-divided-groups-rule-2
  fingerprint: 6f1f354a
