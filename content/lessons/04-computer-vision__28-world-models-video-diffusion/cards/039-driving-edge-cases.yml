- concept: реальные данные нужны для проверки правдоподобия driving world model, а синтетические — для покрытия редкого хвоста сценариев
  question: Объясни, почему даже качественная driving world model не устраняет потребность в реальных записях дорожного движения.
  explanation: Синтетика предоставляет редкие ситуации по запросу, однако её пригодность зависит от точности модели мира. Сравнение с реальными данными показывает, насколько правдоподобно модель воспроизводит дорожную среду и последствия действий.
  kind: open
  reference: Реальные записи нужны, чтобы проверять соответствие симулятора настоящей дорожной динамике и обнаруживать его систематические ошибки. Синтетические данные дополняют их множеством редких или опасных сценариев, но не могут сами подтвердить собственную реалистичность.
