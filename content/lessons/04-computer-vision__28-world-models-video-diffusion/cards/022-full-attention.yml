- concept: число оценок в full joint attention квадратично зависит от числа пространственно-временных токенов
  question: Video Transformer обрабатывает 300 пространственно-временных токенов с full joint attention. Сколько элементов содержит матрица оценок внимания для одной головы, если учитываются также сравнения токенов с самими собой?
  explanation: Матрица содержит отдельную оценку для каждой упорядоченной пары «запрос — ключ». Поэтому при 300 токенах требуется 300 × 300 = 90 000 элементов.
  kind: numeric
  answer: 90000
  tolerance: 0.1
  id: 022-full-attention-1
  fingerprint: 798165b7
- concept: full joint attention обеспечивает прямое взаимодействие любых токенов независимо от расстояния во времени и пространстве
  question: Какое свойство отличает full joint attention в Video DiT?
  explanation: Full joint attention строит общую матрицу внимания для всех пространственно-временных токенов. Поэтому удалённые области разных кадров могут взаимодействовать напрямую, но цена такого глобального обмена растёт квадратично с числом токенов.
  kind: choice
  options:
    - Токен взаимодействует только с соседями внутри локального пространственно-временного окна
    - Токен сначала взаимодействует только по времени, а затем только внутри своего кадра
    - Любой токен может напрямую учитывать любой другой токен видео в одном слое внимания
    - Токены разных кадров объединяются до вычисления внимания и перестают различаться
  correct: 2
  id: 022-full-attention-2
  fingerprint: d1b8ab2e
