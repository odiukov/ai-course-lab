- concept: временное и пространственное внимание могут использовать независимые обучаемые параметры
  question: В divided-attention блоке временное и пространственное внимание реализованы отдельными экземплярами MultiheadAttention. Что из этого следует?
  explanation: Отдельные экземпляры MultiheadAttention имеют независимые параметры. Поэтому один модуль может специализироваться на динамике во времени, а другой — на связях между позициями внутри кадра.
  kind: choice
  options:
    - Они могут обучить разные проекции для временных и пространственных зависимостей
    - Они обязаны совместно использовать одни и те же веса
    - Градиенты поступают только в модуль временного внимания
    - Пространственный модуль не содержит обучаемых параметров
  correct: 0
  id: 026-attention-pairs-1
  fingerprint: d3fe4b5c
- concept: pre-norm residual-блок нормализует вход вычислительной ветви, сохраняя исходный тензор в остаточном пути
  question: Заполни пропуск в схеме pre-norm residual-ветви attention.
  explanation: Нормализация применяется перед attention только в вычислительной ветви. Остаточный путь переносит исходный y и складывает его с результатом attention.
  kind: cloze
  template: y = y + attention(___)
  answer: norm(y)
  accept:
    - layer_norm(y)
    - ln(y)
