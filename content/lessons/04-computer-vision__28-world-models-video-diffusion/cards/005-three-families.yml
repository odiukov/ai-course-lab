- concept: world model для RL предсказывает следующее latent-состояние и награду
  question: Агенту нужно без дополнительных реальных проб оценивать последствия разных последовательностей действий. Какой выход модели лучше всего подходит для этой задачи?
  explanation: 'Для обучения и планирования в RL недостаточно представить, как изменится состояние: нужно также оценить полезность перехода. Поэтому такие world models предсказывают latent-переход вместе с наградой.'
  kind: choice
  options:
    - Готовый видеоролик, сгенерированный по начальному промпту
    - Следующие видеокадры, реагирующие на действие, но без оценки результата
    - Следующее latent-состояние и предсказанная награда при заданных состоянии и действии
  correct: 2
  id: 005-three-families-1
  fingerprint: 2e1bd418
- concept: latent-динамика позволяет эффективно разыгрывать воображаемые переходы для RL
  question: Почему world model для RL часто моделирует переходы в сжатом latent-пространстве, а не генерирует подробные пиксельные кадры?
  explanation: Для выбора действий агенту важнее динамика существенных признаков состояния, чем визуальная детализация. Компактное latent-представление снижает стоимость воображаемых rollout и помогает учиться на меньшем числе реальных взаимодействий.
  kind: choice
  options:
    - Так модель может сосредоточиться на значимой для управления динамике и дешевле разыгрывать множество воображаемых переходов
    - Потому что latent-модель не должна получать действия на вход
    - Потому что только пиксельные модели способны предсказывать награду
    - Так будущие состояния перестают зависеть от текущего состояния
  correct: 0
  id: 005-three-families-2
  fingerprint: '05199e07'
