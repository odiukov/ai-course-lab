- concept: ограничивающая рамка задаёт пространственное условие для объекта, не предписывая его пиксельный вид
  question: Объясни своими словами, что сообщает driving world model ограничивающая рамка вокруг требуемого автомобиля и какие детали она оставляет модели.
  explanation: Bounding box — это частичное пространственное ограничение, а не готовое изображение объекта. Оно обеспечивает управляемое размещение участника сцены, сохраняя модели свободу реалистично достроить его внешний вид и окружение.
  kind: open
  reference: Рамка задаёт область, в которой должен находиться автомобиль, но не определяет точные пиксели, цвет, текстуру и прочие детали его внешнего вида. Эти детали модель синтезирует сама, согласуя объект с остальной сценой.
