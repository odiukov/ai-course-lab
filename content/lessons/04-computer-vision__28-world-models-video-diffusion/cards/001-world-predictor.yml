- concept: video diffusion моделирует распределение возможных будущих состояний вместо их усреднения
  question: Почему стохастическая video diffusion подходит для предсказания будущих кадров лучше, чем детерминированная модель, минимизирующая ошибку между единственным прогнозом и наблюдаемым продолжением?
  explanation: 'Будущее неоднозначно: скрытое событие может произойти или не произойти. Video diffusion представляет пространство возможных продолжений и позволяет получать отдельные правдоподобные сценарии, не смешивая их в один усреднённый прогноз.'
  kind: open
  reference: У одной и той же истории может быть несколько правдоподобных продолжений. Детерминированная модель склонна усреднять несовместимые варианты и получать размытое или физически странное будущее, тогда как diffusion-модель может сэмплировать разные согласованные продолжения из условного распределения.
  id: 001-world-predictor-2
  fingerprint: a74c6783
