- concept: hosted-модель для готового ролика выбирают по соответствию её контракта вывода требованиям проекта
  question: Нужно получить законченный креативный ролик по текстовому описанию с синхронным звуком. Какой признак модели важнее всего проверить при первичном отборе?
  explanation: 'Для готового ролика ключевым является контракт результата: допустимые входы, длительность, разрешение и наличие звука. Пошаговое управление и бесконечный rollout нужны интерактивным мирам, а число параметров само по себе не гарантирует подходящий формат вывода.'
  kind: choice
  options:
    - Поддерживает ли её API генерацию видео нужной длительности и разрешения вместе со звуком
    - Способна ли модель бесконечно продолжать трёхмерный мир
    - Можно ли передавать ей управляющее действие после каждого кадра
    - Сколько параметров было использовано при её обучении
  correct: 0
  id: 048-hosted-model-choice-1
  fingerprint: 8eb491e3
- concept: статус доступа к hosted-модели определяет возможность её производственной интеграции
  question: Команда нашла модель с подходящими демонстрациями, но она доступна только как исследовательский превью. Объясни, почему этого недостаточно для выбора модели в рабочий продукт.
  explanation: Качество демонстрации и доступность для разработки — разные критерии. API обычно можно встроить в приложение, тогда как исследовательский превью может быть закрытым или временным, а готовый продукт может разрешать работу только через собственный интерфейс.
  kind: open
  reference: Исследовательский превью не гарантирует открытый и стабильный программный доступ, необходимые лимиты или пригодные для коммерческого запуска условия. Перед выбором нужно отдельно проверить наличие API либо другого способа интеграции, доступность для команды и правила использования.
  id: 048-hosted-model-choice-2
  fingerprint: 30db74ad
