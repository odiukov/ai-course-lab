- concept: раздельные позиционные коды осей локализуют изменение координаты
  question: Два видеотокена имеют одинаковые пространственные координаты, но относятся к разным моментам времени. Какая часть факторизованного позиционного кода должна различаться?
  explanation: Каждая часть кодирует собственную координату. При неизменных высоте и ширине их коды совпадают, а изменение момента времени отражается только во временной части.
  kind: choice
  options:
    - Только временная часть
    - Только вертикальная часть
    - Только горизонтальная часть
    - Все части обязательно
  correct: 0
  id: 019-axis-encoding-rule-1
  fingerprint: 63e080ef
- concept: аддитивное sin/cos-кодирование и RoPE по-разному вводят позицию в attention
  question: Какое утверждение правильно отличает аддитивное sin/cos-позиционное кодирование от настоящего RoPE?
  explanation: Обе схемы могут использовать сходные синусы, косинусы и частоты, но действуют в разных местах. Аддитивная схема изменяет представление токена, тогда как RoPE поворачивает пары компонент запросов и ключей и тем самым меняет их сравнение.
  kind: choice
  options:
    - Аддитивный код прибавляется к токенам, а RoPE вращает пары каналов запросов и ключей
    - Аддитивный код применяется только ко времени, а RoPE — только к пространству
    - RoPE прибавляет координаты к значениям attention, а аддитивный код меняет маску
    - Между ними нет архитектурного различия, если используются одинаковые частоты
  correct: 0
  id: 019-axis-encoding-rule-2
  fingerprint: '70428606'
- concept: чётность ширины осевого sin/cos-кода обеспечивает точное число каналов
  question: Объясни, почему размерность, выделенная одной оси в sin/cos-позиционном коде, должна быть чётной.
  explanation: Одна частота всегда занимает парные sin/cos-компоненты. Поэтому осевой блок естественно имеет чётную ширину; иначе после склейки позиционного кода его форма не совпадёт с формой токена.
  kind: open
  reference: 'Для каждой частоты создаётся пара компонент: синус и косинус. При нечётной выделенной размерности целочисленное деление при выборе частот отбрасывает один канал, поэтому осевой код получается короче ожидаемого и итоговая склейка не совпадает с шириной токена.'
  id: 019-axis-encoding-rule-3
  fingerprint: 92d9cf8c
