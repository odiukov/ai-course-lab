- concept: число токенов должно совпадать с числом позиций временно-пространственной сетки
  question: Почему перед добавлением позиционного кода проверяют равенство L = T · H · W?
  explanation: Индексы времени, высоты и ширины разворачиваются в последовательность длины T · H · W. Если L отличается, позиционные строки невозможно корректно сопоставить токенам.
  kind: open
  reference: Позиционный код создаёт по одной строке для каждой комбинации временной и двух пространственных координат. Поэтому число строк кода должно совпадать с числом токенов, чтобы каждой позиции сетки соответствовал ровно один токен.
  id: 021-position-shapes-2
  fingerprint: 6d52a280
