- concept: пороги автоматических проверок физической правдоподобности калибруются для конкретного домена и сохраняются вместе с тестовым набором
  question: Порог допустимых скачков траектории откалиброван на городских автомобильных видео. Теперь тем же тестом хотят проверять видео складских роботов. Как поступить корректно?
  explanation: Наблюдаемые скорости, масштаб, частота кадров, шум измерений и допустимые манёвры зависят от домена. Поэтому порог имеет смысл только вместе с условиями калибровки и конкретным набором тестов.
  kind: choice
  options:
    - Заново откалибровать порог на данных складского домена и версионировать его вместе с соответствующими тестовыми сценами
    - Оставить прежний порог, поскольку физические законы одинаковы во всех доменах
    - Убрать числовой порог и принимать решение только по визуальному впечатлению
    - Применять порог лишь к роликам, которые уже прошли ручной просмотр
