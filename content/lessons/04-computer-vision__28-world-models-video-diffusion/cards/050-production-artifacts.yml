- concept: прохождение поведенческих проверок не доказывает наличие у видеомодели корректного внутреннего понимания физики
  question: Объясни своими словами, почему успешное прохождение тестов на гравитацию, непрерывность движения и сохранение объектов не доказывает, что видеомодель понимает физику.
  explanation: Автоматические проверки дают воспроизводимый сигнал для приёмки релиза, но не раскрывают внутренний механизм модели и не гарантируют обобщение на все возможные физические ситуации.
  kind: open
  reference: Такие тесты проверяют только наблюдаемое поведение модели на конечном наборе сцен и по выбранным метрикам. Модель может удовлетворять этому контракту, но ошибаться в новых условиях или воспроизводить внешние закономерности без корректной причинной модели мира.
