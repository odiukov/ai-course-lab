- concept: фиксация временной координаты выделяет один момент видео во всех каналах
  question: Тензор x имеет оси в порядке (C, T, H, W). Какой срез выделит один момент времени t, сохранив все каналы и всю пространственную карту?
  explanation: Время находится на оси T, следующей после C, поэтому индекс t ставится во вторую позицию. Результат x[:, t, :, :] имеет оси (C, H, W) и описывает один момент во всех каналах.
  kind: choice
  options:
    - x[:, t, :, :]
    - x[t, :, :, :]
    - x[:, :, t, :]
    - x[:, :, :, t]
