- concept: латентные каналы содержат выученные признаки, а не обязаны соответствовать цветовым компонентам
  question: Как следует интерпретировать ось C в video latent формы (C, T, H, W)?
  explanation: 'Ось C хранит каналы внутреннего представления: они могут кодировать контуры, текстуры, движение и другие выученные признаки. В форме (16, 12, 32, 48) время задаёт T = 12, а не C = 16.'
  kind: choice
  options:
    - Как набор выученных каналов признаков, смысл которых задаётся энкодером
    - Как количество кадров в видеоролике
    - Как обязательный набор цветовых компонентов исходных пикселей
    - Как ширину латентной пространственной карты
