- concept: в одном слое window attention токен напрямую взаимодействует только с токенами своего локального временно-пространственного окна
  question: В слое Video Transformer используется неперекрывающееся window attention по времени, высоте и ширине. Какие токены могут непосредственно участвовать в вычислении представления выбранного токена?
  explanation: Window attention ограничивает один слой локальным объёмом по времени, высоте и ширине. Токены за границами окна не имеют прямой связи в этом слое, даже если совпадают с выбранным токеном по времени или пространственной позиции.
  kind: choice
  options:
    - Только токены, находящиеся с ним в одном локальном трёхмерном окне
    - Все токены того же кадра независимо от пространственного расстояния
    - Все токены с той же пространственной координатой во всём видео
    - Все токены видео, но с меньшими весами для удалённых позиций
  correct: 0
  id: 027-window-attention-1
  fingerprint: b5609872
- concept: сдвиг окон между слоями переносит информацию через границы локальной разбивки
  question: Объясните своими словами, зачем в Video Swin сдвигать окна attention между последовательными слоями.
  explanation: 'Сдвиг меняет состав локальных групп: прежняя граница окна перестаёт быть постоянным барьером. Благодаря последовательности разных разбиений локальные связи образуют путь между всё более удалёнными токенами.'
  kind: open
  reference: При фиксированной разбивке токены из соседних окон не взаимодействуют напрямую. После сдвига часть этих токенов попадает в общее окно, поэтому информация пересекает прежние границы и через несколько слоёв распространяется на более широкий временно-пространственный контекст без full joint attention.
  id: 027-window-attention-2
  fingerprint: 72cd5867
