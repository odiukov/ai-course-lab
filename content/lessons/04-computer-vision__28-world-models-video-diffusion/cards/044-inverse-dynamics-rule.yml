- concept: обратная динамика по наблюдениям может быть неоднозначной
  question: Почему по паре наблюдений «до перехода» и «после перехода» не всегда можно однозначно восстановить действие робота?
  explanation: 'Обратная задача не обязана иметь единственное решение: разные выполнимые команды способны привести к одинаковому видимому результату. Кроме того, камера показывает не все физические переменные, влияющие на необходимое действие.'
  kind: open
  reference: Один и тот же наблюдаемый переход могут создавать разные действия и траектории, а изображения могут не содержать скрытых факторов вроде нагрузки, контактов и скоростей. Поэтому inverse dynamics может потребоваться дополнительное состояние, история наблюдений или распределение возможных действий.
  id: 044-inverse-dynamics-rule-1
  fingerprint: a27c8bf2
- concept: inverse dynamics зависит от кинематики, динамики и пространства команд конкретного робота
  question: Два робота должны осуществить одинаковый переход между наблюдаемыми состояниями, но имеют разные конструкции манипуляторов и интерфейсы приводов. Что следует ожидать от inverse dynamics?
  explanation: Желаемый визуальный переход может быть общим, но исполняющие его команды зависят от сочленений, приводов, ограничений и формата управления конкретного робота. Поэтому inverse dynamics замыкает план на физическое воплощение робота.
  kind: choice
  options:
    - Она обязана выдать одинаковую команду, поскольку изображения перехода совпадают
    - Она должна преобразовать переход в команды, подходящие кинематике, динамике и пространству действий каждого робота
    - Она должна заменить желаемое следующее наблюдение текстовым описанием
    - Она может игнорировать устройство робота, если визуальный результат достижим
  correct: 1
