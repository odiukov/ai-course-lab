- concept: вектор перехода в inverse dynamics вычисляется как целевое наблюдение минус текущее
  question: Заполни выражение так, чтобы код вычислял направление перехода от текущего наблюдения к целевому.
  explanation: Обратная динамика восстанавливает действие, приведшее от текущего состояния к целевому, поэтому изменение вычисляется в направлении target − current. Обратный порядок поменял бы направление действия.
  kind: cloze
  template: delta = tuple(___ for current, target in zip(obs_current, obs_target))
  answer: target - current
  accept:
    - target-current
  id: 045-inverse-dynamics-1
  fingerprint: 2ccb286a
- concept: inverse dynamics должна отклонять переходы, которым не соответствует ни одно допустимое действие
  question: Робот допускает только изменения {(s, 0), (-s, 0), (0, s), (0, -s), (0, 0)}, где s — длина одного шага. Как должна поступить inverse_dynamics, если между наблюдениями получено изменение (s, s)?
  explanation: Изменение (s, s) является диагональным и отсутствует в заданном множестве действий. Выбор ближайшей команды исказил бы восстановленный переход, поэтому функция должна явно отклонить его.
  kind: choice
  options:
    - Вернуть горизонтальное действие, проигнорировав вертикальную составляющую
    - Вернуть вертикальное действие, проигнорировав горизонтальную составляющую
    - Явно сообщить, что допустимое действие для такого перехода не найдено
    - Вернуть действие ожидания
  correct: 2
  id: 045-inverse-dynamics-2
  fingerprint: cb00cd3c
