- concept: sin/cos-код начала координат не зависит от выбранных частот
  question: Объясни, какой вид имеет sin/cos-код одной оси в начале координат и почему частоты на него не влияют.
  explanation: Координата умножается на каждую частоту. В начале координат произведения равны нулю, а sin(0) и cos(0) дают соответственно нулевую и единичную половины кодировки.
  kind: open
  reference: Все фазы в начале координат нулевые независимо от частоты, поэтому синусная половина состоит из нулей, а косинусная — из единиц.
