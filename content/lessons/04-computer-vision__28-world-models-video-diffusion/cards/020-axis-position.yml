- concept: геометрическая лестница частот имеет постоянное отношение соседних частот
  question: Частоты заданы как f_k = exp(-ln(B) · k / F), где B больше единицы. Как ведёт себя отношение следующей частоты к текущей при изменении k?
  explanation: При делении соседних членов зависимость от k сокращается, и остаётся множитель exp(-ln(B) / F). Поэтому частоты образуют геометрическую прогрессию.
  kind: choice
  options:
    - Растёт вместе с k
    - Остаётся постоянным и равно exp(-ln(B) / F)
    - Убывает вместе с k
    - Остаётся постоянным и равно exp(ln(B) / F)
