- concept: перезапуск с изменённым промптом создаёт новый rollout, а не управляемое продолжение прежнего
  question: Почему изменение промпта после неудачного результата и повторная генерация не считается вмешательством в уже начатый rollout?
  explanation: Интерактивное вмешательство сохраняет текущую историю сцены и меняет её дальнейшее развитие новым действием. Повторный запуск с другим промптом создаёт новый вариант ролика и не ветвит уже сгенерированную последовательность.
  kind: open
  reference: Потому что прежний rollout не продолжается из достигнутого состояния с учётом новой команды. Модель запускает отдельную генерацию, которая заново выбирает траекторию, движение камеры и другие детали.
  id: 006-pure-video-2
