- concept: идентификаторы latent actions определены лишь с точностью до согласованной перестановки
  question: После обучения все идентификаторы latent actions согласованно переименовали и в энкодере, и в декодере. Что произойдёт с поведением модели?
  explanation: У latent action нет заранее заданного человеческого названия. Если одинаково переставить коды во всех частях модели, соответствие между переходом и генерацией сохранится, поэтому поведение останется прежним.
  kind: choice
  options:
    - Модель утратит управление, потому что каждый идентификатор привязан к названию клавиши
    - 'Поведение не изменится: важны согласованные эффекты кодов, а не их условные имена'
    - Все скрытые действия сольются в один вариант
    - Модель сможет порождать только неподвижные кадры
  correct: 1
  id: 031-latent-action-learning-1
  fingerprint: 78c36508
- concept: наблюдаемый latent action не гарантированно совпадает с истинной управляющей командой
  question: Почему latent action, выведенный из соседних видеокадров, нельзя автоматически считать фактически нажатой пользователем клавишей?
  explanation: Пара кадров показывает результат изменения, а не его однозначную причину. Поэтому latent action кодирует полезную закономерность перехода; причинная интерпретация как конкретной команды требует дополнительных предположений или данных.
  kind: open
  reference: 'Один и тот же наблюдаемый переход может быть вызван разными скрытыми причинами: командой пользователя, внешней силой, движением другого объекта или камеры. Без разметки управления модель выделяет повторяемый тип изменения, но не обязательно устанавливает его истинную причинную команду.'
  id: 031-latent-action-learning-2
  fingerprint: e3df6245
