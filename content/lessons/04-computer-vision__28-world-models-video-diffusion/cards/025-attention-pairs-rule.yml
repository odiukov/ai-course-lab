- concept: число пар внимания в divided-режиме складывается из временных и пространственных сравнений
  question: Видеотрансформер обрабатывает токенную сетку с T = 6, H = 5 и W = 7. Сколько направленных пар запрос–ключ вычисляется в divided attention за временную и пространственную операции вместе?
  explanation: Пространственных позиций 5·7 = 35. Временное внимание даёт 35·6·6 = 1260 пар, а пространственное — 6·35·35 = 7350. Всего 1260 + 7350 = 8610.
  kind: numeric
  answer: 8610
  tolerance: 0.01
  id: 025-attention-pairs-rule-1
  fingerprint: 4635b317
- concept: attention считает направленные пары запрос–ключ и включает сравнение токена с самим собой
  question: Объясни своими словами, почему для последовательности длины L матрица full self-attention содержит L·L оценок, а не число неупорядоченных пар различных токенов.
  explanation: Матрица attention имеет отдельную строку для каждого запроса и отдельный столбец для каждого ключа. Поэтому порядок токенов в паре важен, а диагональные элементы отвечают самосопоставлениям.
  kind: open
  reference: Каждый из L токенов независимо выступает запросом и сопоставляется со всеми L ключами, включая собственный. Направления «токен A запрашивает токен B» и «токен B запрашивает токен A» соответствуют разным элементам матрицы внимания.
  id: 025-attention-pairs-rule-2
  fingerprint: 7e2a2591
