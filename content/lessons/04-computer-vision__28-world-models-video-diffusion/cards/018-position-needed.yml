- concept: одинаковое содержимое токенов не кодирует их временные и пространственные координаты
  question: Почему self-attention без позиционного кодирования не может надёжно различить два одинаковых токена, взятых из разных кадров или разных областей кадра?
  explanation: Сам индекс элемента в последовательности не используется стандартным self-attention как признак. Статистические подсказки в содержимом иногда позволяют угадать положение, но не заменяют явного кодирования временных и пространственных координат.
  kind: open
  reference: Одинаковые токены дают одинаковые представления содержимого и, следовательно, одинаковые запросы, ключи и значения. Координаты времени, высоты и ширины в вычисление не входят, поэтому различить положения можно только после добавления явного позиционного сигнала.
  id: 018-position-needed-2
  fingerprint: 2259250b
