- concept: видеогенеративная модель служит симулятором будущих наблюдений
  question: Какой компонент робототехнического стека предсказывает, как визуально будет развиваться выполнение запланированного действия?
  explanation: 'Видеогенеративная модель выполняет роль прямого симулятора: по состоянию и запланированному действию она воображает будущие наблюдения. VLM отвечает за семантический план, а inverse dynamics связывает желаемые переходы с управлением роботом.'
  kind: choice
  options:
    - VLM, формирующая высокоуровневый план
    - Видеогенеративная модель, создающая последовательность будущих наблюдений
    - Inverse dynamics model, выдающая команды приводам
    - Функция награды, оценивающая итоговый кадр
  correct: 1
  id: 043-imagine-rollout-1
  fingerprint: 73fb0469
- concept: воображаемые видеороллауты сокращают опасные испытания на физическом роботе
  question: Объясни своими словами, почему видеомодель мира может уменьшить потребность в рискованных пробах на реальном роботе.
  explanation: World model переносит часть исследования и обучения во внутренние видеороллауты. Робот может получить опыт возможных последствий без обязательного выполнения каждого пробного действия в реальной среде.
  kind: open
  reference: Модель позволяет разыгрывать последствия действий в виде воображаемых последовательностей наблюдений. Обучение и проверка неудачных вариантов частично происходят в симуляции, поэтому меньше ошибок приходится совершать на физическом оборудовании.
  id: 043-imagine-rollout-2
  fingerprint: e45d7338
