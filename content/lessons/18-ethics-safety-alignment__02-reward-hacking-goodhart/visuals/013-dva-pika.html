<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Пик золота наступает раньше пика прокси</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --ink: #172033;
      --muted: #5e687a;
      --axis: #39445a;
      --guide: #9aa5b6;
      --proxy: #2563eb;
      --gold: #d97706;
      --band: #e8eef9;
      --proxy-fill: #dbeafe;
      --gold-fill: #ffedd5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .figure {
      width: 100%;
      background: var(--bg);
      padding: 14px 16px 10px;
    }
    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 750;
    }
    .fallback {
      margin: 12px 0;
      font-size: 16px;
      line-height: 1.45;
      color: var(--muted);
    }
    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      overflow: visible;
      background: var(--bg);
    }
    svg text {
      font-size: 15px;
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
      stroke-linejoin: round;
    }
    .axis, .tick, .guide, .curve, .interval-arrow {
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .axis {
      stroke: var(--axis);
      stroke-width: 2px;
    }
    .tick {
      stroke: var(--axis);
      stroke-width: 2px;
    }
    .guide {
      stroke: var(--guide);
      stroke-width: 1.5px;
      stroke-dasharray: 5 5;
    }
    .curve {
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .proxy { stroke: var(--proxy); }
    .gold { stroke: var(--gold); }
    .interval-band { fill: var(--band); opacity: .62; }
    .interval-arrow {
      stroke: var(--muted);
      stroke-width: 1.5px;
    }
    .arrowhead { fill: var(--axis); }
    .interval-head { fill: var(--muted); }
    .point {
      stroke: var(--bg);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }
    .proxy-point { fill: var(--proxy); }
    .gold-point { fill: var(--gold); }
    .proxy-label { fill: var(--proxy); font-weight: 700; }
    .gold-label { fill: var(--gold); font-weight: 700; }
    .strong { font-weight: 750; }
    .muted { fill: var(--muted); }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --ink: #edf2f8;
        --muted: #b2bdcc;
        --axis: #c6cfdb;
        --guide: #687488;
        --proxy: #6ea8ff;
        --gold: #ffb454;
        --band: #1d2a3d;
        --proxy-fill: #18345f;
        --gold-fill: #4a2e12;
      }
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 id="diagram-title">Пик золота наступает раньше пика прокси</h1>
    <p id="fallback" class="fallback">
      Схема должна показать две параболы: золотой пик при d = 2,5,
      прокси-пик при d = 10, где прокси-награда равна 5, а золотая — −10.
    </p>
    <svg id="chart" viewBox="0 0 1000 330" width="1000" height="330"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="diagram-title diagram-desc">
      <desc id="diagram-desc">
        При усилении оптимизации золотая награда достигает максимума раньше
        прокси-награды. Между d равным 2,5 и d равным 10 прокси растёт,
        хотя золотая награда уже падает.
      </desc>
    </svg>
  </main>

  <script>
    const data = Object.freeze({
      alpha: 1,
      curves: [
        { id: "proxy", beta: 0.05, end: 11.2, className: "proxy",
          labelX: 5.7, labelDx: 12, labelDy: -12,
          label: "Прокси-награда · β = 0,05" },
        { id: "gold", beta: 0.2, end: 10, className: "gold",
          labelX: 5.8, labelDx: 12, labelDy: 18,
          label: "Золотая награда · β = 0,2" }
      ],
      bounds: { xMin: 0, xMax: 11.55, yMin: -10.8, yMax: 7.25 },
      frame: { originX: 106, originY: 140, scaleX: 72, scaleY: 15 },
      sample: { step: 0.05 },
      math: { two: 2 },
      compareD: 10,
      ticksX: [
        { value: 2.5, label: "d = 2,5" },
        { value: 10, label: "d = 10" }
      ],
      ticksY: [
        { value: 5, label: "5" },
        { value: -10, label: "−10" }
      ],
      tick: { xHalf: 0.16, yHalf: 0.24 },
      arrow: {
        xBase: 0.28, xHalf: 0.24,
        yBase: 0.48, yHalf: 0.15,
        intervalY: 6.15, intervalBase: 0.22, intervalHalf: 0.24
      },
      band: { top: 6.65, bottom: -10.6 },
      pointRadius: 6,
      label: { gap: 12, far: 28, down: 22, zero: 0, small: 4, low: 18 },
      axisLabel: { xDx: 12, yDx: 12 },
      alphaLabel: { x: 0.25, y: 5.75 },
      intervalLabel: "Прокси ещё растёт, золото уже падает"
    });

    const origin = Object.freeze({
      x: data.frame.originX,
      y: data.frame.originY
    });
    const scale = Object.freeze({
      x: data.frame.scaleX,
      y: data.frame.scaleY
    });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const svg = document.getElementById("chart");
    const fallback = document.getElementById("fallback");
    const ns = "http://www.w3.org/2000/svg";

    try {
      const make = (name, attrs, content) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) =>
          node.setAttribute(key, String(value))
        );
        if (content !== null) node.textContent = content;
        return node;
      };

      const add = node => svg.appendChild(node);

      const line = (x1, y1, x2, y2, className) =>
        add(make("line", {
          x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2),
          class: className
        }, null));

      const polygon = (points, className) =>
        add(make("polygon", {
          points: points.map(point =>
            `${sx(point.x)},${sy(point.y)}`
          ).join(" "),
          class: className
        }, null));

      const textAt = (x, y, dx, dy, anchor, className, content) =>
        add(make("text", {
          x: sx(x) + dx,
          y: sy(y) + dy,
          "text-anchor": anchor,
          class: className
        }, content));

      const point = (x, y, className) =>
        add(make("circle", {
          cx: sx(x), cy: sy(y), r: data.pointRadius,
          class: `point ${className}`
        }, null));

      const reward = (curve, d) =>
        data.alpha * d - curve.beta * d * d;

      const peakD = curve =>
        data.alpha / (data.math.two * curve.beta);

      const proxy = data.curves.find(curve => curve.id === "proxy");
      const gold = data.curves.find(curve => curve.id === "gold");
      const proxyPeakD = peakD(proxy);
      const goldPeakD = peakD(gold);
      const proxyPeakY = reward(proxy, proxyPeakD);
      const goldPeakY = reward(gold, goldPeakD);
      const proxyAtTen = reward(proxy, data.compareD);
      const goldAtTen = reward(gold, data.compareD);
      const intervalMid = (goldPeakD + proxyPeakD) / data.math.two;

      add(make("rect", {
        x: sx(goldPeakD),
        y: sy(data.band.top),
        width: sx(proxyPeakD) - sx(goldPeakD),
        height: sy(data.band.bottom) - sy(data.band.top),
        class: "interval-band"
      }, null));

      line(goldPeakD, data.label.zero, goldPeakD, goldPeakY,
        "guide");
      line(proxyPeakD, goldAtTen, proxyPeakD, proxyPeakY,
        "guide");

      line(data.bounds.xMin, data.label.zero, data.bounds.xMax,
        data.label.zero, "axis");
      line(data.label.zero, data.bounds.yMin, data.label.zero,
        data.bounds.yMax, "axis");

      polygon([
        { x: data.bounds.xMax, y: data.label.zero },
        { x: data.bounds.xMax - data.arrow.xBase, y: data.arrow.xHalf },
        { x: data.bounds.xMax - data.arrow.xBase, y: -data.arrow.xHalf }
      ], "arrowhead");

      polygon([
        { x: data.label.zero, y: data.bounds.yMax },
        { x: -data.arrow.yHalf, y: data.bounds.yMax - data.arrow.yBase },
        { x: data.arrow.yHalf, y: data.bounds.yMax - data.arrow.yBase }
      ], "arrowhead");

      data.ticksX.forEach(tick => {
        line(tick.value, -data.tick.yHalf, tick.value,
          data.tick.yHalf, "tick");
        textAt(tick.value, data.label.zero, data.label.zero,
          data.label.down, "middle", "strong", tick.label);
      });

      data.ticksY.forEach(tick => {
        line(-data.tick.xHalf, tick.value, data.tick.xHalf,
          tick.value, "tick");
        textAt(data.label.zero, tick.value, -data.label.gap,
          data.label.small, "end", "strong", tick.label);
      });

      data.curves.forEach(curve => {
        let d = data.bounds.xMin;
        let path = "";
        let first = true;
        while (d <= curve.end) {
          const command = first ? "M" : "L";
          path += `${command}${sx(d)},${sy(reward(curve, d))} `;
          first = false;
          d += data.sample.step;
        }
        path += `L${sx(curve.end)},${sy(reward(curve, curve.end))}`;
        add(make("path", {
          d: path,
          class: `curve ${curve.className}`
        }, null));

        textAt(curve.labelX, reward(curve, curve.labelX),
          curve.labelDx, curve.labelDy, "start",
          `${curve.className}-label`, curve.label);
      });

      line(goldPeakD, data.arrow.intervalY, proxyPeakD,
        data.arrow.intervalY, "interval-arrow");

      polygon([
        { x: goldPeakD, y: data.arrow.intervalY },
        { x: goldPeakD + data.arrow.intervalBase,
          y: data.arrow.intervalY + data.arrow.intervalHalf },
        { x: goldPeakD + data.arrow.intervalBase,
          y: data.arrow.intervalY - data.arrow.intervalHalf }
      ], "interval-head");

      polygon([
        { x: proxyPeakD, y: data.arrow.intervalY },
        { x: proxyPeakD - data.arrow.intervalBase,
          y: data.arrow.intervalY + data.arrow.intervalHalf },
        { x: proxyPeakD - data.arrow.intervalBase,
          y: data.arrow.intervalY - data.arrow.intervalHalf }
      ], "interval-head");

      textAt(intervalMid, data.arrow.intervalY, data.label.zero,
        -data.label.gap, "middle", "muted strong",
        data.intervalLabel);

      point(goldPeakD, goldPeakY, "gold-point");
      point(proxyPeakD, proxyPeakY, "proxy-point");
      point(data.compareD, goldAtTen, "gold-point");

      textAt(goldPeakD, goldPeakY, -data.label.gap,
        -data.label.far, "end", "gold-label",
        "Золотой пик: d = 2,5");

      textAt(proxyPeakD, proxyPeakY, -data.label.gap,
        data.label.far, "end", "proxy-label",
        "Прокси-пик: d = 10");

      textAt(data.compareD, proxyAtTen, data.label.gap,
        -data.label.gap, "start", "proxy-label",
        "Rпрокси(10) = 5");

      textAt(data.compareD, goldAtTen, -data.label.gap,
        -data.label.gap, "end", "gold-label",
        "Rзолото(10) = −10");

      textAt(data.bounds.xMax, data.label.zero,
        data.axisLabel.xDx, data.label.small, "start",
        "strong", "d");

      textAt(data.label.zero, data.bounds.yMax,
        data.axisLabel.yDx, data.label.small, "start",
        "strong", "Награда R");

      textAt(data.alphaLabel.x, data.alphaLabel.y,
        data.label.zero, data.label.zero, "start",
        "muted strong", "α = 1");

      fallback.hidden = true;
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
