- concept: обратные указатели Витерби восстанавливают оптимальную последовательность тегов после прямого прохода
  question: Расположите этапы декодирования Витерби для bigram HMM в правильном порядке.
  explanation: Прямой проход сохраняет лучший частичный результат для каждого тега и указатель на его предшественника. После выбора лучшего финального тега обратный проход восстанавливает весь путь. Благодаря этому не требуется хранить и перебирать все полные цепочки.
  kind: order
  items:
    - Вычислить начальные результаты переходов от BOS с учётом эмиссии первого токена
    - Для каждой следующей позиции и каждого тега выбрать лучшего предшественника, сохранив результат и обратный указатель
    - После обработки предложения выбрать тег с лучшим итоговым результатом
    - Пройти по обратным указателям к началу и развернуть восстановленную последовательность
