- concept: сравнение точности POS-теггеров требует одинаковых условий оценки
  question: Объясни своими словами, почему нельзя напрямую сравнивать точность MFT на одном корпусе с точностью другого POS-теггера на другом корпусе или при иной системе тегов.
  explanation: Цифры точности сопоставимы лишь при одинаковом корпусе, разбиении, tagset и подготовке токенов. Иначе результат около 85% для MFT и результат другой модели измеряют качество в разных задачах.
  kind: open
  reference: Сложность корпуса, разбиение данных, набор тегов и токенизация влияют на точность. Поэтому результат baseline задаёт осмысленную нижнюю границу только для модели, проверенной на том же тестовом наборе и с тем же протоколом оценки.
  id: 019-mft-result-2
  fingerprint: 65754f65
