- concept: активные зависимости nsubj и obj недостаточны для извлечения SVO из пассивных конструкций
  question: Почему простой экстрактор, ищущий у глагола только зависимости nsubj и obj, вероятнее всего пропустит участников в предложении «The bridge was repaired by workers»?
  explanation: В пассивной конструкции bridge обычно размечается как пассивный субъект, а workers — как участник предложной группы. Правило только для активных nsubj и obj такие роли не охватывает.
  kind: choice
  options:
    - В пассиве пациент и исполнитель обычно представлены другими зависимостями
    - В пассивных предложениях глагол перестаёт быть частью dependency-дерева
    - spaCy удаляет дополнения из предложений с предлогами
    - Пассивные предложения невозможно разбирать синтаксически
  correct: 0
