- concept: однородные члены требуют обхода связей координации при извлечении аргументов глагола
  question: Объясни своими словами, почему проверка только непосредственных детей глагола может извлечь не все дополнения из предложения с однородными объектами.
  explanation: 'В dependency-дереве однородные объекты не обязаны каждый отдельно зависеть от глагола: последующие элементы часто присоединены к первому объекту через связь координации.'
  kind: open
  reference: Парсер может присоединить к глаголу только первый объект, а остальные связать с ним отношением координации. Поэтому для полного результата нужно раскрывать цепочку однородных членов, а не ограничиваться непосредственными детьми глагола.
  id: 038-extract-svo-3
  fingerprint: 250998af
