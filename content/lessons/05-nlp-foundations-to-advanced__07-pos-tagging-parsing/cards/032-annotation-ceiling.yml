- concept: надёжная проверка необычно высокой точности требует независимого разделения, настройки по валидации и однократной итоговой оценки
  question: Расположи этапы проверки подозрительно высокой точности POS-теггера в правильном порядке.
  explanation: Сначала исключают утечку между наборами, затем используют валидацию для всех инженерных решений. Нетронутый тест даёт итоговую оценку, а свежий корпус помогает проверить, не связано ли высокое качество с особенностями конкретного теста.
  kind: order
  items:
    - Разделить корпус по документам и устранить совпадающие или почти совпадающие примеры между наборами
    - Обучать варианты модели и выбирать настройки только по валидационной выборке
    - Один раз измерить качество выбранной модели на нетронутой тестовой выборке
    - Проверить итоговую модель на другом свежем корпусе
