- concept: PTB различает обычные существительные по числу и отдельно отмечает имена собственные
  question: Какая разметка Penn Treebank верна для слов river, rivers и Thames?
  explanation: В PTB тег NN обозначает обычное существительное в единственном числе, NNS — во множественном, а NNP — имя собственное в единственном числе. Это часть подробной системы из 36 тегов.
  kind: choice
  options:
    - river/NN, rivers/NNS, Thames/NNP
    - river/NNS, rivers/NN, Thames/NNP
    - river/NNP, rivers/NNS, Thames/NN
    - river/NN, rivers/NNP, Thames/NNS
  correct: 0
  id: 003-ptb-1
  fingerprint: b8805e48
- concept: PTB кодирует разные грамматические формы английского глагола отдельными тегами
  question: Объясни, чем различаются теги VBD, VBZ и VBG, и приведи по одной подходящей английской глагольной форме.
  explanation: 'PTB не ограничивается общей категорией «глагол»: VBD сохраняет признак прошедшего времени, VBZ — настоящее время, третье лицо и единственное число, а VBG — форму на -ing.'
  kind: open
  reference: VBD обозначает прошедшее время, например finished; VBZ — настоящее время в третьем лице единственного числа, например finishes; VBG — форму на -ing, например finishing.
  id: 003-ptb-2
  fingerprint: 5e93327e
