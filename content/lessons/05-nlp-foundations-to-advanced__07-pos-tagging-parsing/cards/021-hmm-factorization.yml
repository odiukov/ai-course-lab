- concept: эмиссия HMM задаёт вероятность наблюдаемого слова при выбранном теге
  question: Восстановите направление условной вероятности эмиссии в POS-теггере на основе HMM.
  explanation: 'Эмиссия оценивает вероятность увидеть слово при условии выбранного тега: P(word | tag). Обратная условная вероятность P(tag | word) не является эмиссией HMM.'
  kind: cloze
  template: P(___)
  answer: word | tag
  accept:
    - слово | тег
    - w_i | t_i
  id: 021-hmm-factorization-1
  fingerprint: c5d0fe68
- concept: максимизация эмиссии отдельно для каждого токена не гарантирует наиболее вероятную последовательность тегов
  question: Почему нельзя гарантированно найти лучшую последовательность тегов, выбирая для каждого слова тег только с самой высокой эмиссионной вероятностью?
  explanation: Оценка пути складывается из эмиссионных и переходных факторов. Из-за переходов лучший тег в отдельной позиции может не входить в глобально лучший путь.
  kind: open
  reference: В совместную вероятность входят не только эмиссии, но и переходы между соседними тегами. Локально сильный тег может образовать маловероятные переходы, поэтому HMM сравнивает оценки целых последовательностей.
  id: 021-hmm-factorization-2
  fingerprint: 444d859e
