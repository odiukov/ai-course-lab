- concept: предсказания POS-теггера должны сохранять длину и порядок последовательности токенов
  question: Функция tag_for(token) возвращает POS-тег для одного токена и не изменяет его. Какая реализация сохраняет порядок токенов, создаёт ровно один тег для каждого из них и не изменяет список tokens?
  explanation: Списковое включение обходит tokens в исходном порядке и добавляет по одному результату на каждый элемент. Сортировка меняет порядок, а множество удаляет повторяющиеся теги и не сохраняет соответствие позициям.
  kind: choice
  options:
    - return [tag_for(token) for token in tokens]
    - return [tag_for(token) for token in sorted(tokens)]
    - return list({tag_for(token) for token in tokens})
  correct: 0
  id: 016-predict-mft-1
  fingerprint: 3e1f4d5b
- concept: обход пустой последовательности естественно создаёт пустой список предсказаний
  question: Объясни своими словами, почему выражение `[tag_for(token) for token in tokens]` корректно работает при пустом списке tokens без отдельной проверки.
  explanation: Списковое включение добавляет результат только при наличии очередного токена. Если токенов нет, добавлять нечего, поэтому функция возвращает пустой список автоматически.
  kind: open
  reference: В пустом списке нет элементов для обхода, поэтому тело спискового включения не выполняется ни разу, а результатом становится новый пустой список.
  id: 016-predict-mft-2
  fingerprint: c1763e0a
