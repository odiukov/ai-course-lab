- concept: MFT обучается подсчётом тегов отдельно для каждого слова и сохраняет самый частый
  question: Расположите этапы работы most-frequent-tag baseline в правильном порядке.
  explanation: MFT сначала строит частотный словарь «слово — теги», затем сохраняет победивший тег и использует его для всех последующих употреблений этого слова.
  kind: order
  items:
    - Накопить частоты тегов для каждого слова в обучающей выборке
    - Для каждого слова выбрать тег с наибольшей частотой
    - При разметке известного слова вернуть сохранённый тег
  id: 013-mft-training-1
  fingerprint: 2f01527f
- concept: для неизвестного слова MFT использует самый частый тег всего обучающего корпуса
  question: Токена нет в словаре word_best, построенном MFT-теггером. Какой тег вернёт реализация с default_tag?
  explanation: default_tag вычисляется по общим частотам тегов в обучающей выборке. predict_mft использует его, если нормализованный токен отсутствует в word_best.
  kind: choice
  options:
    - Случайный тег из набора тегов
    - Тег предыдущего токена
    - Самый частый тег во всей обучающей выборке
    - Специальный тег неизвестного слова
  correct: 2
  id: 013-mft-training-2
  fingerprint: 5ccdcc1a
- concept: приведение токенов к нижнему регистру объединяет регистровые варианты при обучении MFT
  question: Заполните пропуск так, чтобы MFT считал варианты написания одного слова в разных регистрах вместе.
  explanation: Нормализация регистра не позволяет начальной заглавной букве создать отдельную словарную запись. Ту же нормализацию нужно применять и при предсказании.
  kind: cloze
  template: word_tag_counts[___][tag] += 1
  answer: token.lower()
  accept:
    - token.casefold()
  id: 013-mft-training-3
  fingerprint: 18536a5d
