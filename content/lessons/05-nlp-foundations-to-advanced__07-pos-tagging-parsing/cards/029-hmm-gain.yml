- concept: улучшение accuracy следует оценивать также через относительное сокращение числа ошибок
  question: Точность теггера выросла с 82% до 91%. На сколько процентов относительно прежнего уровня сократилась доля ошибочных токенов?
  explanation: Доля ошибок уменьшилась с 18% до 9%. Относительное сокращение равно (18 − 9) / 18 = 0,5, то есть 50%. Поэтому умеренный прирост accuracy может означать резкое уменьшение числа ошибок.
  kind: numeric
  answer: 50
  tolerance: 0.01
  id: 029-hmm-gain-2
