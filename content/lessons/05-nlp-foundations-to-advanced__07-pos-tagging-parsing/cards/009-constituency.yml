- concept: constituency parsing представляет предложение как иерархию вложенных составляющих
  question: Какое описание результата constituency parsing верно?
  explanation: Разбор по составляющим объединяет слова в NP, VP, PP и другие группы, а затем вкладывает меньшие группы в более крупные. Плоские теги относятся к POS tagging, а связи между главными и зависимыми словами — к dependency parsing.
  kind: choice
  options:
    - Иерархическое дерево размеченных групп, в котором одна составляющая может входить в другую
    - Плоский список грамматических тегов — по одному для каждого токена
    - Набор связей между словами, где у каждого зависимого указаны главное слово и тип отношения
  correct: 0
  id: 009-constituency-1
  fingerprint: fa1ba7a0
- concept: слова являются листьями constituency-дерева, а NP, VP и PP — его нетерминальными категориями
  question: Какие элементы constituency-дерева являются листьями, а какие — нетерминальными узлами?
  explanation: Слова уже нельзя раскрыть на более мелкие синтаксические составляющие, поэтому они находятся в листьях. NP, VP и PP создаются разбором для обозначения групп и располагаются во внутренних узлах дерева.
  kind: choice
  options:
    - Листья — слова; нетерминальные узлы — категории групп, например NP, VP и PP
    - Листья — категории NP, VP и PP; нетерминальные узлы — слова
    - Листья — отношения вроде subject и object; нетерминальные узлы — POS-теги
    - И слова, и категории групп всегда являются листьями
  correct: 0
  id: 009-constituency-2
  fingerprint: fe82cdf9
