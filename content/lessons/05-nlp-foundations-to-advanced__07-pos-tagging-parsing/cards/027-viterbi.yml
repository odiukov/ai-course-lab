- concept: временная сложность Витерби квадратична по числу тегов
  question: Число допустимых POS-тегов увеличили втрое, а длину предложения оставили прежней. Как примерно изменится объём вычислений bigram Viterbi?
  explanation: Для каждого текущего тега алгоритм перебирает все предыдущие теги, поэтому работа пропорциональна квадрату размера набора тегов. Утроение этого размера увеличивает число сравнений примерно в девять раз.
  kind: choice
  options:
    - Не изменится
    - Увеличится втрое
    - Увеличится примерно в девять раз
    - Увеличится примерно в двадцать семь раз
  correct: 2
  id: 027-viterbi-1
  fingerprint: 830a292b
- concept: инициализация Витерби использует переход из BOS и эмиссию первого слова
  question: Заполни выражение для начального состояния решётки Витерби.
  explanation: До первого слова обычного предыдущего тега нет. Начальный score складывается из логарифма вероятности перехода от специального состояния <BOS> и логарифма эмиссии первого слова выбранным тегом.
  kind: cloze
  template: V[start, tag] = ___
  answer: log P(tag | <BOS>) + log P(word_start | tag)
  accept:
    - log(P(tag | <BOS>)) + log(P(word_start | tag))
    - log P(tag|<BOS>) + log P(word_start|tag)
  id: 027-viterbi-2
  fingerprint: b1686b1c
- concept: таблицы Витерби требуют единого неизменного соответствия индексов и тегов
  question: Почему список тегов для Viterbi нужно сформировать один раз и затем использовать одинаково при заполнении V, back и восстановлении ответа?
  explanation: V и back хранят индексы, а не сами строки тегов. Поэтому корректность декодирования зависит от стабильного отображения «индекс → тег» на всём протяжении алгоритма.
  kind: open
  reference: Индекс столбца должен всегда обозначать один и тот же тег. Если порядок тегов изменится между заполнением таблиц и восстановлением пути, scores и обратные указатели будут интерпретированы как относящиеся к другим тегам, и результат окажется неверным.
  id: 027-viterbi-3
  fingerprint: 285e6d05
