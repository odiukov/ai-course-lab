- concept: CRF использует заданные признаки, а трансформер обучает контекстные представления токенов
  question: Как точнее всего различаются способы использования контекста в CRF и трансформере для POS-tagging?
  explanation: В CRF инженер может явно задать признаки слова и его окружения. Трансформер вместо фиксированного набора таких подсказок обучает представление токена на основе контекста.
  kind: choice
  options:
    - CRF применяет заданные признаки вроде суффикса и соседних слов, а трансформер обучает контекстное представление токена
    - CRF рассматривает только само слово, а трансформер использует только предыдущий тег
    - CRF автоматически открывает признаки, а трансформер требует вручную перечислить все полезные шаблоны
    - Обе модели используют исключительно таблицы переходов и эмиссий
  correct: 0
  id: 031-modern-taggers-1
  fingerprint: 37da0008
- concept: условная модель CRF допускает произвольные перекрывающиеся признаки наблюдаемой последовательности
  question: Объясните своими словами, почему линейно-цепочечный CRF проще дополнить признаками суффикса и слов с обеих сторон от токена, чем биграммную HMM.
  explanation: CRF не обязан описывать, как были сгенерированы слова. Поэтому в его функцию оценки можно включать форму токена, аффиксы и соседние слова, сохраняя совместный выбор согласованной цепочки тегов.
  kind: open
  reference: HMM задаёт совместную генеративную модель через переходы тегов и эмиссии слов, поэтому добавление зависимых и перекрывающихся наблюдаемых признаков нарушает её простую факторизацию. CRF напрямую моделирует последовательность тегов при известной последовательности слов и может включать в оценку произвольные признаки всего доступного наблюдаемого контекста.
  id: 031-modern-taggers-2
