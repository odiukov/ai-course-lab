- concept: параметр K должен охватывать полное множество исходов условного распределения
  question: HMM оценивает эмиссии по словарю V и резервирует отдельный исход <UNK> для незнакомых слов. Какое значение K нужно использовать при сглаживании эмиссионной вероятности?
  explanation: K — число возможных исходов данного распределения. Для эмиссий оно включает все известные слова и отдельный вариант для незнакомого слова; для переходов набор исходов определяется возможными следующими состояниями.
  kind: choice
  options:
    - Число всех токенов в обучающем корпусе
    - Размер словаря V без отдельного исхода <UNK>
    - Размер словаря V плюс отдельный исход <UNK>
    - Число различных POS-тегов
  correct: 2
  id: 025-laplace-logprob-1
  fingerprint: ceb93f45
- concept: при неизменных остальных аргументах сглаженная логарифмическая вероятность возрастает вместе со счётчиком события
  question: Заполните знак сравнения для двух событий одного условного распределения.
  explanation: Общий знаменатель у событий одинаков, а больший счётчик даёт больший числитель. Натуральный логарифм — строго возрастающая функция, поэтому порядок вероятностей сохраняется.
  kind: cloze
  template: Если count_A > count_B при одинаковых total, K и alpha, то laplace_logprob(A) ___ laplace_logprob(B).
  answer: '>'
  accept:
    - больше
    - выше
