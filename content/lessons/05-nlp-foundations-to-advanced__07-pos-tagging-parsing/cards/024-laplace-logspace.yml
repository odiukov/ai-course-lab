- concept: сглаживание Лапласа добавляет псевдосчётчик в числитель и во все K исходов знаменателя
  question: В таблице HMM исход x встретился 3 раза при условии g, всего после g наблюдалось 50 исходов, а число возможных исходов K равно 12. Чему равна сглаженная вероятность P(x|g) при α = 0,2?
  explanation: По формуле Лапласа P(x|g) = (3 + 0,2) / (50 + 0,2 × 12) = 3,2 / 52,4 ≈ 0,0611. Добавка в знаменателе учитывает псевдосчётчик для каждого возможного исхода.
  kind: numeric
  answer: 0.0611
  tolerance: 0.0002
  id: 024-laplace-logspace-1
  fingerprint: 268a403d
- concept: вычисления в log-space предотвращают численное обнуление и сохраняют наиболее вероятный путь
  question: Объясни своими словами, почему при декодировании длинной последовательности HMM удобно складывать логарифмы вероятностей вместо перемножения самих вероятностей и почему это не меняет выбранную последовательность тегов.
  explanation: 'Log-space устраняет underflow при работе с длинными цепочками: вместо микроскопических произведений вычисляются суммы. Поскольку логарифм сохраняет порядок положительных чисел, результат поиска максимального по вероятности пути не меняется.'
  kind: open
  reference: Произведение множества малых вероятностей может из-за ограниченной точности вычислений округлиться до нуля. После логарифмирования произведение превращается в сумму, которая численно устойчивее. Логарифм строго возрастает, поэтому путь с максимальной исходной вероятностью остаётся путём с максимальной суммой логарифмов.
  id: 024-laplace-logspace-2
  fingerprint: de132e53
