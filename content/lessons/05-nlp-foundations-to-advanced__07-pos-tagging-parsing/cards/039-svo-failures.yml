- concept: отсутствующее подлежащее нельзя надёжно восстановить по синтаксическому дереву отдельного предложения
  question: Парсер обрабатывает предложение «Подписал договор и отправил заказчику», не имея предыдущего контекста. Как экстрактору событий следует представить исполнителя действий?
  explanation: Исполнитель не представлен отдельным токеном, поэтому дерево зависимостей не содержит данных для его надёжного определения. Восстановить пропущенное подлежащее можно лишь из более широкого контекста или дополнительных знаний.
  kind: choice
  options:
    - Считать исполнителем «договор»
    - Считать исполнителем «заказчика»
    - Оставить исполнителя неизвестным или вернуть неполную структуру
    - Создать произвольное местоимение в качестве исполнителя
  correct: 2
  id: 039-svo-failures-1
  fingerprint: '89690173'
- concept: перенос общего аргумента между однородными глаголами должен учитывать явно заданные локальные аргументы
  question: Почему при извлечении событий из предложения «Анна подписала, а Борис отправил контракт» нельзя безусловно перенести подлежащее первого глагола на второй?
  explanation: Координация не гарантирует общность всех участников. Экстрактор должен сначала искать локальное подлежащее или дополнение каждого глагола и лишь затем осторожно наследовать отсутствующий аргумент.
  kind: open
  reference: У второго глагола уже есть собственное явно выраженное подлежащее «Борис». Безусловный перенос создал бы ошибочную тройку «Анна — отправила — контракт». Общий аргумент следует распространять только после проверки, что у связанного глагола нет собственного несовместимого аргумента.
  id: 039-svo-failures-2
  fingerprint: 4426fb1a
