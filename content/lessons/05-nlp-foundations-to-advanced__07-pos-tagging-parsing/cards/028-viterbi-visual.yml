- concept: ячейка решётки Витерби хранит оценку лучшего пути к заданному состоянию, а не локальную вероятность тега
  question: Что означает значение в ячейке V[позиция, NOUN] решётки Витерби?
  explanation: 'Витерби хранит максимум, а не сумму по путям: ячейка соответствует лучшему пути по уже обработанному префиксу при условии, что его последний тег — NOUN. Это не локальная эмиссия и не маргинальная вероятность тега.'
  kind: choice
  options:
    - Лучший накопленный log-score среди путей по префиксу, которые заканчиваются тегом NOUN
    - Только логарифм вероятности эмиссии текущего слова из тега NOUN
    - Суммарную вероятность всех путей, проходящих через тег NOUN
    - Лучший score полного предложения без ограничения на текущий тег
  correct: 0
  id: 028-viterbi-visual-1
  fingerprint: cc2d2f0c
- concept: эмиссия текущего слова одинакова для всех кандидатов на роль предшественника фиксированной ячейки
  question: Объясни, почему при выборе лучшего предшественника для фиксированных текущего слова и тега эмиссионный log-score можно прибавить уже после нахождения максимума по предыдущим тегам.
  explanation: Для фиксированной ячейки сравниваются накопленный score предшественника и переход к текущему тегу. Эмиссионный score текущего слова — одна и та же константа во всех кандидатах, поэтому он изменяет итоговое значение ячейки, но не победившего предшественника.
  kind: open
  reference: Эмиссия зависит только от текущего слова и текущего тега, поэтому для всех предшественников этой ячейки она одинакова. Общая прибавка не меняет, какой предыдущий тег даёт максимум.
  id: 028-viterbi-visual-2
  fingerprint: c8161534
