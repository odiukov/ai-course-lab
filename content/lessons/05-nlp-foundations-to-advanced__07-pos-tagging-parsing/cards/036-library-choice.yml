- concept: качество парсера нужно измерять на репрезентативных текстах целевого домена
  question: Почему высокая точность парсера на новостном корпусе недостаточна для выбора модели, которая будет обрабатывать сообщения пользователей с опечатками?
  explanation: Опубликованная метрика характеризует конкретный корпус, а не любое применение. Проверка на собственных текстах выявляет ошибки, которые действительно возникнут в продукте.
  kind: open
  reference: 'Точность зависит от домена и типа текста: модель, хорошо работающая на новостях, может ошибаться в сообщениях с разговорной лексикой и опечатками. Кандидатов нужно сравнить на размеченной выборке, репрезентативной для будущего потока данных.'
