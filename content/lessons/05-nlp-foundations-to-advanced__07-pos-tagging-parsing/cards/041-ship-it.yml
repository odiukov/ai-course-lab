- concept: целевые проверки известных неоднозначностей дополняют агрегированную оценку парсера
  question: Объясни своими словами, почему высокой общей метрики недостаточно для выпуска POS- и dependency-пайплайна и какие типы ошибок следует проверять отдельно.
  explanation: Ошибки в словах вроде saw, book и can или неверное PP-присоединение могут разрушить извлечение фактов, даже если среднее качество выглядит высоким. В материале поэтому требуется вручную просмотреть 20 результатов и проверить варианты регистра.
  kind: open
  reference: Общая метрика может скрывать редкие, но критичные для downstream-задачи ошибки. Поэтому отдельно проверяют лексическую неоднозначность существительного и глагола, присоединение предложных групп и варианты регистра, а также вручную просматривают реальные результаты из целевого домена.
  id: 041-ship-it-2
  fingerprint: 8de8323a
- concept: для прикладной NLP-системы следует интегрировать готовый обученный парсер, а не разрабатывать собственный
  question: Команде приложения нужен классический POS- и dependency-анализ для извлечения информации. Какое инженерное решение наиболее обоснованно?
  explanation: Разработка качественного парсера с нуля — исследовательский проект. В прикладной системе рациональнее выбрать проверенную модель и оформить её использование как воспроизводимый контракт с обязательными тестами.
  kind: choice
  options:
    - Реализовать новый parser с нуля специально для приложения
    - Выбрать готовую библиотеку и конкретную модель, затем зафиксировать интеграцию и проверки отказов
    - Отказаться от тестов, если библиотека популярна
    - Выбирать parser только по скорости на одном предложении
  correct: 1
  id: 041-ship-it-3
