- concept: transition-based parser строит dependency-дерево последовательностью локальных действий над стеком и буфером
  question: Как transition-based dependency parser обычно строит синтаксический разбор предложения?
  explanation: Transition-based parser хранит обработанные токены в стеке, непрочитанные — в буфере и постепенно меняет состояние действиями SHIFT, создания дуги и REDUCE. Оценка всех возможных рёбер с последующим выбором дерева относится к graph-based parsing.
  kind: choice
  options:
    - Оценивает все возможные пары слов, а затем выбирает максимальное остовное дерево
    - Последовательно применяет действия над стеком и буфером, создавая дуги между словами
    - Сначала объединяет слова только в составляющие NP и VP, не назначая словам вершины
    - Независимо выбирает для каждого слова наиболее частый POS-тег
  correct: 1
  id: 033-transition-parser-1
  fingerprint: b0ab465e
- concept: жадное декодирование ускоряет transition-based parsing, но допускает распространение ранних ошибок
  question: Почему жадный transition-based parser работает быстро, но ошибочное раннее действие может испортить дальнейший разбор?
  explanation: Жадное декодирование не хранит множество полных альтернативных разборов. Это экономит вычисления, но ранняя неверная дуга или преждевременный REDUCE меняет доступные следующие действия и может вызвать цепочку ошибок.
  kind: open
  reference: На каждом состоянии парсер сразу выбирает лучшее локальное действие и не перебирает все деревья, поэтому число действий обычно пропорционально длине предложения. Однако выбранное действие изменяет стек, буфер и уже построенные дуги; без возврата назад последующие решения принимаются из ошибочного состояния.
  id: 033-transition-parser-2
  fingerprint: ead1b426
