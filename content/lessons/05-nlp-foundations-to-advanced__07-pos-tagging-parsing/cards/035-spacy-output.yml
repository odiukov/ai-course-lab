- concept: совместная интерпретация spaCy-полей dep_ и head
  question: Для токена `books` spaCy вернул `dep_ = "dobj"` и `head.text = "reads"`. Что это означает?
  explanation: '`dep_` называет синтаксическое отношение текущего токена к его главному слову, а `head` указывает на это главное слово. Поэтому `books` связано с `reads` как прямое дополнение.'
  kind: choice
  options:
    - '`books` является прямым дополнением при главном слове `reads`'
    - '`reads` является прямым дополнением при главном слове `books`'
    - '`dobj` — это подробный POS-тег слова `books`'
    - '`reads` — это универсальная POS-категория слова `books`'
  correct: 0
  id: 035-spacy-output-1
  fingerprint: ffebf988
- concept: распознавание корня dependency-дерева в выводе spaCy
  question: Объясни своими словами, по каким значениям `dep_` и `head` можно распознать корневой токен dependency-дерева в spaCy.
  explanation: У корня нет другого главного слова, поэтому spaCy делает его главным для самого себя и помечает отношение значением `ROOT`. Для остальных токенов `head` обычно ведёт к другому токену выше по дереву.
  kind: open
  reference: У корневого токена `dep_` имеет значение `ROOT`, а `head` указывает на сам этот токен.
  id: 035-spacy-output-2
  fingerprint: 290aa292
