<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дерево зависимостей предложения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --panel-soft: #eef6ff;
      --ink: #172033;
      --muted: #526079;
      --line: #2869c7;
      --arrow: #174d96;
      --node: #f5f9ff;
      --node-border: #8fb6ea;
      --root: #e4f7ed;
      --root-border: #299763;
      --root-ink: #17633f;
      --accent: #fff4d6;
      --accent-border: #d49a1f;
      --shadow: #d7e1ef;
      --label-halo: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182131;
        --panel-soft: #1b2b42;
        --ink: #eef5ff;
        --muted: #b7c5d9;
        --line: #75aef5;
        --arrow: #a7ceff;
        --node: #202e43;
        --node-border: #5d8fc9;
        --root: #173c30;
        --root-border: #5bc792;
        --root-ink: #a9edca;
        --accent: #3c3118;
        --accent-border: #dfad40;
        --shadow: #0d121b;
        --label-halo: #182131;
      }
    }

    html {
      background: var(--page);
    }

    body {
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      background: var(--page);
      max-width: 1040px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .intro {
      color: var(--muted);
      font-size: 14px;
      margin-top: 0;
      margin-bottom: 8px;
    }

    svg {
      background: var(--page);
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--shadow);
      stroke-width: 1.5px;
    }

    .panel-secondary {
      fill: var(--panel-soft);
    }

    .section-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .count {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .arc {
      fill: none;
      stroke: var(--line);
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2px;
    }

    .mini-arc {
      stroke-width: 1.7px;
    }

    .arrowhead {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .node {
      fill: var(--node);
      stroke: var(--node-border);
      stroke-width: 1.5px;
    }

    .root-node {
      fill: var(--root);
      stroke: var(--root-border);
      stroke-width: 2px;
    }

    .punct-node {
      fill: var(--accent);
      stroke: var(--accent-border);
    }

    .token {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    .mini-token {
      font-size: 13px;
    }

    .relation {
      fill: var(--ink);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
      paint-order: stroke;
      stroke: var(--label-halo);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .root-label {
      fill: var(--root-ink);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .note {
      fill: var(--muted);
      font-size: 12px;
      text-anchor: middle;
    }

    .fallback {
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--shadow);
      font-size: 16px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-intro">
    <h1 id="diagram-title">Дерево зависимостей предложения</h1>
    <p class="intro" id="diagram-intro">
      Стрелка идёт от главного слова к зависимому.
    </p>
    <svg
      id="diagram"
      viewBox="0 0 1040 420"
      width="1040"
      height="420"
      role="img"
      aria-label="Семь токенов The cats were running at 3pm и точка образуют дерево с шестью дугами. Без точки остаются шесть слов и пять дуг."
      preserveAspectRatio="xMidYMid meet">
    </svg>
    <p id="fallback" class="fallback"></p>
  </figure>

  <script>
    const diagramData = [
      {
        zero: 0,
        radius: 1.15,
        arrowLength: 0.95,
        arrowHalf: 0.48
      },
      {
        panel: { x1: 1.2, y1: 1.2, x2: 100, y2: 25.8 },
        heading: { x: 4, y: 4.6, text: "Полное предложение" },
        count: { x: 88, y: 4.6, text: "7 токенов · 6 дуг" },
        nodes: [
          { x1: 5.5, y1: 19.4, x2: 14.5, y2: 23.5, tx: 10, ty: 22.15, text: "The", kind: "node" },
          { x1: 20, y1: 19.4, x2: 30, y2: 23.5, tx: 25, ty: 22.15, text: "cats", kind: "node" },
          { x1: 35, y1: 19.4, x2: 45, y2: 23.5, tx: 40, ty: 22.15, text: "were", kind: "node" },
          { x1: 49.5, y1: 19.4, x2: 64.5, y2: 23.5, tx: 57, ty: 22.15, text: "running", kind: "root-node" },
          { x1: 67.5, y1: 19.4, x2: 74.5, y2: 23.5, tx: 71, ty: 22.15, text: "at", kind: "node" },
          { x1: 79, y1: 19.4, x2: 89, y2: 23.5, tx: 84, ty: 22.15, text: "3pm", kind: "node" },
          { x1: 92.5, y1: 19.4, x2: 97.5, y2: 23.5, tx: 95, ty: 22.15, text: ".", kind: "punct-node" }
        ],
        edges: [
          {
            start: { x: 22.2, y: 19.4 },
            c1: { x: 20.6, y: 16.2 },
            c2: { x: 13.8, y: 16.2 },
            end: { x: 11.8, y: 19.4 },
            label: { x: 17, y: 15.65, text: "det · определитель" }
          },
          {
            start: { x: 53.5, y: 19.4 },
            c1: { x: 49, y: 11.4 },
            c2: { x: 31, y: 11.4 },
            end: { x: 26.6, y: 19.4 },
            label: { x: 40, y: 10.7, text: "nsubj · подлежащее" }
          },
          {
            start: { x: 52.2, y: 19.4 },
            c1: { x: 49.8, y: 16.1 },
            c2: { x: 43.8, y: 16.1 },
            end: { x: 41.6, y: 19.4 },
            label: { x: 46.7, y: 15.55, text: "aux · вспомогательное" }
          },
          {
            start: { x: 61.3, y: 19.4 },
            c1: { x: 63.1, y: 16.1 },
            c2: { x: 68, y: 16.1 },
            end: { x: 69.6, y: 19.4 },
            label: { x: 65.6, y: 15.55, text: "prep · предлог" }
          },
          {
            start: { x: 72.5, y: 19.4 },
            c1: { x: 74.5, y: 16.1 },
            c2: { x: 80.7, y: 16.1 },
            end: { x: 82.5, y: 19.4 },
            label: { x: 77.5, y: 15.55, text: "pobj · объект предлога" }
          },
          {
            start: { x: 62.5, y: 19.4 },
            c1: { x: 69.5, y: 6.5 },
            c2: { x: 90.5, y: 6.5 },
            end: { x: 94.5, y: 19.4 },
            label: { x: 80.2, y: 5.85, text: "punct · пунктуация" }
          }
        ],
        rootLabel: {
          x: 57,
          y: 25.05,
          text: "ROOT · вершина без главного слова"
        }
      },
      {
        panel: { x1: 1.2, y1: 27, x2: 100, y2: 40.8 },
        heading: { x: 4, y: 30.25, text: "То же дерево без точки" },
        count: { x: 88, y: 30.25, text: "6 слов · 5 дуг" },
        nodes: [
          { x1: 8, y1: 35.8, x2: 16, y2: 38.9, tx: 12, ty: 37.85, text: "The", kind: "node" },
          { x1: 22, y1: 35.8, x2: 31, y2: 38.9, tx: 26.5, ty: 37.85, text: "cats", kind: "node" },
          { x1: 37, y1: 35.8, x2: 46, y2: 38.9, tx: 41.5, ty: 37.85, text: "were", kind: "node" },
          { x1: 51, y1: 35.8, x2: 64, y2: 38.9, tx: 57.5, ty: 37.85, text: "running", kind: "root-node" },
          { x1: 69, y1: 35.8, x2: 75, y2: 38.9, tx: 72, ty: 37.85, text: "at", kind: "node" },
          { x1: 80, y1: 35.8, x2: 89, y2: 38.9, tx: 84.5, ty: 37.85, text: "3pm", kind: "node" }
        ],
        edges: [
          {
            start: { x: 24, y: 35.8 },
            c1: { x: 22, y: 33.8 },
            c2: { x: 16, y: 33.8 },
            end: { x: 14, y: 35.8 }
          },
          {
            start: { x: 54, y: 35.8 },
            c1: { x: 50, y: 31.5 },
            c2: { x: 31, y: 31.5 },
            end: { x: 28, y: 35.8 }
          },
          {
            start: { x: 53, y: 35.8 },
            c1: { x: 50.5, y: 33.7 },
            c2: { x: 45, y: 33.7 },
            end: { x: 43, y: 35.8 }
          },
          {
            start: { x: 61, y: 35.8 },
            c1: { x: 64, y: 33.7 },
            c2: { x: 69, y: 33.7 },
            end: { x: 70.5, y: 35.8 }
          },
          {
            start: { x: 73.5, y: 35.8 },
            c1: { x: 76, y: 33.7 },
            c2: { x: 81.5, y: 33.7 },
            end: { x: 83, y: 35.8 }
          }
        ],
        rootLabel: { x: 57.5, y: 40.05, text: "ROOT" },
        note: {
          x: 84.5,
          y: 40.05,
          text: "точка и дуга punct отсутствуют"
        }
      }
    ];

    const origin = { x: 20, y: 8 };
    const scale = { x: 10, y: 10 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const [metrics, completeTree, treeWithoutPoint] = diagramData;
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const NS = "http://www.w3.org/2000/svg";

      const element = (name, attributes, text) => {
        const item = document.createElementNS(NS, name);
        Object.entries(attributes).forEach(([key, value]) => {
          item.setAttribute(key, value);
        });
        if (text !== undefined) item.textContent = text;
        return item;
      };

      const addText = (parent, item, className, anchor) => {
        parent.appendChild(element("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: className,
          "text-anchor": anchor || "start"
        }, item.text));
      };

      const addPanel = (parent, panel, secondary) => {
        parent.appendChild(element("rect", {
          x: sx(panel.x1),
          y: sy(panel.y1),
          width: sx(panel.x2) - sx(panel.x1),
          height: sy(panel.y2) - sy(panel.y1),
          rx: sx(metrics.radius) - sx(metrics.zero),
          ry: sy(metrics.radius) - sy(metrics.zero),
          class: secondary ? "panel panel-secondary" : "panel"
        }));
      };

      const arrowPoints = edge => {
        const dx = edge.end.x - edge.c2.x;
        const dy = edge.end.y - edge.c2.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const bx = edge.end.x - ux * metrics.arrowLength;
        const by = edge.end.y - uy * metrics.arrowLength;
        const px = -uy * metrics.arrowHalf;
        const py = ux * metrics.arrowHalf;
        return [
          `${sx(edge.end.x)},${sy(edge.end.y)}`,
          `${sx(bx + px)},${sy(by + py)}`,
          `${sx(bx - px)},${sy(by - py)}`
        ].join(" ");
      };

      const addEdge = (parent, edge, miniature) => {
        const path = [
          "M", sx(edge.start.x), sy(edge.start.y),
          "C", sx(edge.c1.x), sy(edge.c1.y),
          sx(edge.c2.x), sy(edge.c2.y),
          sx(edge.end.x), sy(edge.end.y)
        ].join(" ");

        parent.appendChild(element("path", {
          d: path,
          class: miniature ? "arc mini-arc" : "arc"
        }));

        parent.appendChild(element("polygon", {
          points: arrowPoints(edge),
          class: "arrowhead"
        }));

        if (edge.label) {
          addText(parent, edge.label, "relation", "middle");
        }
      };

      const addNode = (parent, node, miniature) => {
        parent.appendChild(element("rect", {
          x: sx(node.x1),
          y: sy(node.y1),
          width: sx(node.x2) - sx(node.x1),
          height: sy(node.y2) - sy(node.y1),
          rx: sx(metrics.radius) - sx(metrics.zero),
          ry: sy(metrics.radius) - sy(metrics.zero),
          class: `node ${node.kind}`
        }));

        parent.appendChild(element("text", {
          x: sx(node.tx),
          y: sy(node.ty),
          class: miniature ? "token mini-token" : "token"
        }, node.text));
      };

      const drawTree = (tree, miniature) => {
        const group = element("g", {
          "aria-label": tree.count.text
        });

        addPanel(group, tree.panel, miniature);
        addText(group, tree.heading, "section-title", "start");
        addText(group, tree.count, "count", "middle");

        tree.edges.forEach(edge => addEdge(group, edge, miniature));
        tree.nodes.forEach(node => addNode(group, node, miniature));
        addText(group, tree.rootLabel, "root-label", "middle");

        if (tree.note) {
          addText(group, tree.note, "note", "middle");
        }

        svg.appendChild(group);
      };

      drawTree(completeTree, false);
      drawTree(treeWithoutPoint, true);
      fallback.remove();
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.replaceChildren();
      fallback.textContent =
        "Схема должна была показать семь токенов «The cats were running at 3pm .» с running как ROOT и шестью направленными дугами; без точки остаются шесть слов и пять дуг.";
    }
  </script>
</body>
</html>
