- concept: продакшен-готовность следует измерять на наборе, защищённом от загрязнения обучающими данными
  question: Мультиагентная система показывает высокий результат на публичном наборе, задачи и решения которого могли попасть в обучающие данные модели. Какая дополнительная проверка даст наиболее надёжное основание для допуска в продакшен?
  explanation: Результат на загрязнённом наборе может отражать запоминание решений, а не способность решать новые задачи. Поэтому курс рекомендует SWE-bench Pro или внутренний Pro-эквивалент вместо Verified.
  kind: choice
  options:
    - Повторить тот же тест с другим порядком задач
    - Использовать закрытый набор сопоставимой сложности, не доступный при обучении и разработке
    - Попросить разработчиков субъективно оценить несколько удачных ответов
    - Увеличить число агентов и снова запустить публичный тест
