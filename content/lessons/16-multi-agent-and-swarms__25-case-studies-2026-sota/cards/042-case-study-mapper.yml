- concept: case-study mapper превращает фактическое описание системы в сопоставление с референсом, риск-ориентированный пробел и приоритетное изменение
  question: Расположите этапы применения case-study mapper в правильном порядке.
  explanation: Сначала анализируют реальное состояние проекта, затем находят ближайший проверенный кейс. После этого выявляют не любое отличие, а значимый защитный механизм, и превращают его в конкретное следующее изменение.
  kind: order
  items:
    - Описать фактически работающую систему, её выходной артефакт и наблюдаемые сбои.
    - Сопоставить систему с референсами по типу результата, маршрутизации, контрактам и масштабу.
    - Выделить отсутствующее проверенное решение, связанное с конкретным риском.
    - Выбрать минимальное следующее изменение, закрывающее самый опасный пробел.
