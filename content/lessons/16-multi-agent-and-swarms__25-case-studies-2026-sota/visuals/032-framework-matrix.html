<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Матрица фреймворков на апрель 2026 года</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --ink: midnightblue;
      --muted: slategray;
      --line: lightsteelblue;
      --panel: ghostwhite;
      --lead: seagreen;
      --lead-soft: honeydew;
      --community: darkgoldenrod;
      --community-soft: lightyellow;
      --maintenance: firebrick;
      --maintenance-soft: mistyrose;
      --rc: darkorchid;
      --rc-soft: lavender;
      --production: royalblue;
      --production-soft: aliceblue;
      --banner: lavender;
      --banner-line: mediumpurple;
      --white: white;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
    }

    h1 {
      margin: unset;
      padding: 12px 18px 8px;
      font-size: 21px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
      font-family: inherit;
    }

    .outer-panel,
    .card,
    .banner,
    .footer-strip {
      stroke-width: 1.5px;
    }

    .outer-panel {
      fill: var(--panel);
      stroke: var(--line);
    }

    .banner {
      fill: var(--banner);
      stroke: var(--banner-line);
    }

    .footer-strip {
      fill: var(--panel);
      stroke: var(--line);
    }

    .card {
      stroke: var(--line);
    }

    .lead-card {
      fill: var(--lead-soft);
      stroke: var(--lead);
    }

    .community-card {
      fill: var(--community-soft);
      stroke: var(--community);
    }

    .maintenance-card {
      fill: var(--maintenance-soft);
      stroke: var(--maintenance);
    }

    .rc-card {
      fill: var(--rc-soft);
      stroke: var(--rc);
    }

    .production-card {
      fill: var(--production-soft);
      stroke: var(--production);
    }

    .lead-fill { fill: var(--lead); }
    .community-fill { fill: var(--community); }
    .maintenance-fill { fill: var(--maintenance); }
    .rc-fill { fill: var(--rc); }
    .production-fill { fill: var(--production); }

    .section-title {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .banner-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .banner-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .protocol {
      fill: var(--white);
      stroke: var(--banner-line);
      stroke-width: 1.5px;
    }

    .protocol-text {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .framework {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .framework-large {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 13px;
      font-weight: bold;
    }

    .lead-text { fill: var(--lead); }
    .community-text { fill: var(--community); }
    .maintenance-text { fill: var(--maintenance); }
    .rc-text { fill: var(--rc); }
    .production-text { fill: var(--production); }

    .best {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .note {
      fill: var(--muted);
      font-size: 12px;
    }

    .footer-text {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--maintenance);
      font-size: 18px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --line: #475569;
        --panel: #1e293b;
        --lead: #6ee7b7;
        --lead-soft: #123c34;
        --community: #fcd34d;
        --community-soft: #423514;
        --maintenance: #fca5a5;
        --maintenance-soft: #4b1f25;
        --rc: #d8b4fe;
        --rc-soft: #3b2557;
        --production: #93c5fd;
        --production-soft: #172f52;
        --banner: #302555;
        --banner-line: #a78bfa;
        --white: #1e293b;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Матрица фреймворков на апрель 2026 года</h1>
    <svg id="matrix" viewBox="0 0 1200 470" width="1200" height="470"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="diagram-title diagram-desc">
      <desc id="diagram-desc">Матрица жизненного цикла восьми агентных фреймворков: два лидера продакшена, поддерживаемый сообществом AG2, AutoGen в режиме поддержки, Microsoft Agent Framework в RC и три продакшен-SDK.</desc>
    </svg>
  </main>

  <script>
    const data = {
      canvas: { width: 1200, height: 470 },
      labelPadding: 12,
      lineThickness: 1.5,
      fontSize: 13,
      frame: { x: 18, y: 8, width: 1164, height: 414, radius: 12 },
      banner: { x: 30, y: 20, width: 1140, height: 58, radius: 9 },
      bannerText: {
        x: 50,
        y: 46,
        lines: [
          { text: "Сначала смотри на жизненный цикл", dy: 0, className: "banner-title" },
          { text: "MCP и A2A почти не различают строки", dy: 20, className: "banner-note" }
        ]
      },
      protocols: [
        { x: 875, y: 32, width: 124, height: 34, radius: 17, text: "MCP · везде" },
        { x: 1011, y: 32, width: 139, height: 34, radius: 17, text: "A2A · большинство" }
      ],
      sections: [
        { x: 42, y: 105, text: "ОСНОВНОЙ КОРОТКИЙ СПИСОК", anchor: "start" },
        { x: 584, y: 105, text: "ОСТАЛЬНЫЕ — УЗКИЕ СЦЕНАРИИ", anchor: "start" }
      ],
      leadersPanel: { x: 30, y: 88, width: 526, height: 322, radius: 9 },
      othersPanel: { x: 570, y: 88, width: 600, height: 322, radius: 9 },
      cards: [
        {
          x: 42, y: 120, width: 502, height: 128, radius: 9,
          kind: "lead", barHeight: 8,
          texts: [
            { x: 62, y: 153, text: "LangGraph", className: "framework-large", anchor: "start" },
            { x: 62, y: 180, text: "Лидер в продакшене", className: "status lead-text", anchor: "start" },
            { x: 62, y: 208, text: "Структурированные графы · чекпойнты · человек в цикле", className: "best", anchor: "start" },
            { x: 62, y: 230, text: "Выбор по умолчанию для продакшена", className: "note", anchor: "start" }
          ]
        },
        {
          x: 42, y: 266, width: 502, height: 128, radius: 9,
          kind: "lead", barHeight: 8,
          texts: [
            { x: 62, y: 299, text: "CrewAI", className: "framework-large", anchor: "start" },
            { x: 62, y: 326, text: "Лидер в продакшене", className: "status lead-text", anchor: "start" },
            { x: 62, y: 354, text: "Команды по ролям · последовательный или иерархический процесс", className: "best", anchor: "start" },
            { x: 62, y: 376, text: "Силён в явном разбиении работы по ролям", className: "note", anchor: "start" }
          ]
        },
        {
          x: 582, y: 120, width: 180, height: 132, radius: 9,
          kind: "community", barHeight: 8,
          texts: [
            { x: 598, y: 151, text: "AG2", className: "framework", anchor: "start" },
            { x: 598, y: 178, text: "Поддерживается", className: "status community-text", anchor: "start" },
            { x: 598, y: 197, text: "сообществом", className: "status community-text", anchor: "start" },
            { x: 598, y: 224, text: "Линия AutoGen v0.2", className: "note", anchor: "start" },
            { x: 598, y: 241, text: "GroupChat", className: "note", anchor: "start" }
          ]
        },
        {
          x: 774, y: 120, width: 180, height: 132, radius: 9,
          kind: "maintenance", barHeight: 8,
          texts: [
            { x: 790, y: 150, text: "Microsoft", className: "framework", anchor: "start" },
            { x: 790, y: 169, text: "AutoGen", className: "framework", anchor: "start" },
            { x: 790, y: 197, text: "Режим поддержки", className: "status maintenance-text", anchor: "start" },
            { x: 790, y: 216, text: "февраль 2026", className: "status maintenance-text", anchor: "start" },
            { x: 790, y: 240, text: "Развитие переехало", className: "note", anchor: "start" }
          ]
        },
        {
          x: 966, y: 120, width: 192, height: 132, radius: 9,
          kind: "rc", barHeight: 8,
          texts: [
            { x: 982, y: 150, text: "Microsoft Agent", className: "framework", anchor: "start" },
            { x: 982, y: 169, text: "Framework", className: "framework", anchor: "start" },
            { x: 982, y: 197, text: "RC · февраль 2026", className: "status rc-text", anchor: "start" },
            { x: 982, y: 224, text: "Оркестрация и", className: "note", anchor: "start" },
            { x: 982, y: 241, text: "корпоративные интеграции", className: "note", anchor: "start" }
          ]
        },
        {
          x: 582, y: 270, width: 180, height: 124, radius: 9,
          kind: "production", barHeight: 8,
          texts: [
            { x: 598, y: 300, text: "OpenAI Agents SDK", className: "framework", anchor: "start" },
            { x: 598, y: 329, text: "Продакшен", className: "status production-text", anchor: "start" },
            { x: 598, y: 356, text: "Наследник Swarm", className: "note", anchor: "start" },
            { x: 598, y: 375, text: "передача через инструмент", className: "note", anchor: "start" }
          ]
        },
        {
          x: 774, y: 270, width: 180, height: 124, radius: 9,
          kind: "production", barHeight: 8,
          texts: [
            { x: 790, y: 300, text: "Google ADK", className: "framework", anchor: "start" },
            { x: 790, y: 329, text: "Продакшен", className: "status production-text", anchor: "start" },
            { x: 790, y: 348, text: "апрель 2025", className: "status production-text", anchor: "start" },
            { x: 790, y: 375, text: "A2A и Google Cloud", className: "note", anchor: "start" }
          ]
        },
        {
          x: 966, y: 270, width: 192, height: 124, radius: 9,
          kind: "production", barHeight: 8,
          texts: [
            { x: 982, y: 299, text: "Anthropic Claude", className: "framework", anchor: "start" },
            { x: 982, y: 318, text: "Agent SDK", className: "framework", anchor: "start" },
            { x: 982, y: 346, text: "Продакшен", className: "status production-text", anchor: "start" },
            { x: 982, y: 373, text: "Одиночный агент · Research", className: "note", anchor: "start" }
          ]
        }
      ],
      footer: {
        x: 18, y: 432, width: 1164, height: 30, radius: 8,
        textX: 600, textY: 452,
        text: "Читай так: зрелость → подходящий сценарий → экосистема"
      },
      fallback: {
        x: 600, y: 238,
        text: "Схема должна показать жизненный цикл восьми агентных фреймворков."
      }
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("matrix");
      const ns = "http://www.w3.org/2000/svg";
      const layer = document.createElementNS(ns, "g");

      const node = (name, attrs, className) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => element.setAttribute(key, value));
        if (className) element.setAttribute("class", className);
        return element;
      };

      const rect = (item, className) => node("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.width) - sx(0),
        height: sy(item.height) - sy(0),
        rx: sx(item.radius),
        ry: sy(item.radius)
      }, className);

      const text = item => {
        const element = node("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor || "start"
        }, item.className);
        element.textContent = item.text;
        return element;
      };

      layer.appendChild(rect(data.frame, "outer-panel"));
      layer.appendChild(rect(data.banner, "banner"));
      layer.appendChild(text({
        x: data.bannerText.x,
        y: data.bannerText.y + data.bannerText.lines[0].dy,
        text: data.bannerText.lines[0].text,
        className: data.bannerText.lines[0].className,
        anchor: "start"
      }));
      layer.appendChild(text({
        x: data.bannerText.x,
        y: data.bannerText.y + data.bannerText.lines[1].dy,
        text: data.bannerText.lines[1].text,
        className: data.bannerText.lines[1].className,
        anchor: "start"
      }));

      data.protocols.forEach(item => {
        layer.appendChild(rect(item, "protocol"));
        layer.appendChild(text({
          x: item.x + item.width / 2,
          y: item.y + item.height / 2 + data.labelPadding / 3,
          text: item.text,
          className: "protocol-text",
          anchor: "middle"
        }));
      });

      layer.appendChild(rect(data.leadersPanel, "outer-panel"));
      layer.appendChild(rect(data.othersPanel, "outer-panel"));
      data.sections.forEach(item => {
        layer.appendChild(text({
          x: item.x,
          y: item.y,
          text: item.text,
          className: "section-title",
          anchor: item.anchor
        }));
      });

      data.cards.forEach(card => {
        layer.appendChild(rect(card, `card ${card.kind}-card`));
        layer.appendChild(node("rect", {
          x: sx(card.x),
          y: sy(card.y),
          width: sx(card.width) - sx(0),
          height: sy(card.barHeight) - sy(0),
          rx: sx(card.radius),
          ry: sy(card.radius)
        }, `${card.kind}-fill`));
        card.texts.forEach(item => layer.appendChild(text(item)));
      });

      layer.appendChild(rect(data.footer, "footer-strip"));
      layer.appendChild(text({
        x: data.footer.textX,
        y: data.footer.textY,
        text: data.footer.text,
        className: "footer-text",
        anchor: "middle"
      }));

      svg.appendChild(layer);
    } catch (error) {
      const svg = document.getElementById("matrix");
      const ns = "http://www.w3.org/2000/svg";
      const message = document.createElementNS(ns, "text");
      message.setAttribute("x", sx(data.fallback.x));
      message.setAttribute("y", sy(data.fallback.y));
      message.setAttribute("text-anchor", "middle");
      message.setAttribute("class", "fallback");
      message.textContent = data.fallback.text;
      svg.appendChild(message);
    }
  </script>
</body>
</html>
