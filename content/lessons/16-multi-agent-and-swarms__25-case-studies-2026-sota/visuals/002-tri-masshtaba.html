<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Три масштаба мультиагентной инженерии</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f8fafc;
  --panel:#ffffff;
  --panel-soft:#f1f5f9;
  --ink:#172033;
  --muted:#5f6b7a;
  --line:#a8b4c5;
  --anthropic:#d97757;
  --anthropic-soft:#fff1eb;
  --meta:#4f6fd8;
  --meta-soft:#edf2ff;
  --molt:#178c78;
  --molt-soft:#e8f7f3;
  --platform:#d8eee9;
  --white:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111827;
    --panel:#182235;
    --panel-soft:#202d43;
    --ink:#edf3fb;
    --muted:#b6c1d1;
    --line:#617089;
    --anthropic:#ee9677;
    --anthropic-soft:#432c2a;
    --meta:#8fa8ff;
    --meta-soft:#27375e;
    --molt:#62ceb7;
    --molt-soft:#173f3a;
    --platform:#214c47;
    --white:#101827;
  }
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{
  font-size:24px;
  line-height:1.2;
  text-align:center;
  color:var(--ink);
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:438px;
  background:var(--bg);
  font-family:inherit;
}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
.soft{fill:var(--panel-soft)}
.anthropic-soft{fill:var(--anthropic-soft)}
.meta-soft{fill:var(--meta-soft)}
.molt-soft{fill:var(--molt-soft)}
.platform{fill:var(--platform)}
.connector{fill:none;stroke:var(--line);stroke-width:2}
.anthropic-line{fill:none;stroke:var(--anthropic);stroke-width:2}
.meta-line{fill:none;stroke:var(--meta);stroke-width:2}
.molt-line{fill:none;stroke:var(--molt);stroke-width:2}
.arrow-head-anthropic{fill:var(--anthropic)}
.arrow-head-meta{fill:var(--meta)}
.arrow-head-molt{fill:var(--molt)}
.heading{fill:var(--ink);font-size:20px;font-weight:bold}
.kicker{fill:var(--muted);font-size:13px;font-weight:bold;letter-spacing:.08em}
.label{fill:var(--ink);font-size:15px}
.small{fill:var(--muted);font-size:13px}
.count{fill:var(--ink);font-size:18px;font-weight:bold}
.node-text{fill:var(--ink);font-size:15px;font-weight:bold}
.role-text{fill:var(--ink);font-size:14px}
.agent{fill:var(--panel);stroke:var(--anthropic);stroke-width:2}
.agent-core{fill:var(--anthropic)}
.population-dot{fill:var(--molt)}
.population-dot-alt{fill:var(--panel);stroke:var(--molt);stroke-width:2}
.footer-title{fill:var(--muted);font-size:13px;font-weight:bold;letter-spacing:.06em}
.footer-label{fill:var(--ink);font-size:14px;font-weight:bold}
#error{
  color:var(--ink);
  background:var(--panel);
  font-size:16px;
}
</style>
</head>
<body>
<h1>Три масштаба мультиагентной инженерии</h1>
<svg id="diagram" viewBox="0 0 1200 438" width="1200" height="438"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Три масштаба мультиагентной инженерии</title>
  <desc id="svg-desc">Сравнение супервизора Anthropic с десятью и более субагентами, команды MetaGPT из пяти ролей и популяции Moltbook примерно из двух целых трёх десятых миллиона агентских аккаунтов.</desc>
</svg>
<p id="error" hidden></p>
<script>
const DATA={
  origin:[0,0],
  scale:[1,1],
  canvas:{x:0,y:0,w:1200,h:438},
  radius:{panel:16,card:10,badge:17,dot:7,core:3},
  panels:[
    {x:18,y:10,w:366,h:342,soft:"anthropic-soft"},
    {x:417,y:10,w:366,h:342,soft:"meta-soft"},
    {x:816,y:10,w:366,h:342,soft:"molt-soft"}
  ],
  headers:[
    {x:42,kickerY:39,titleY:68,kicker:"ANTHROPIC",title:"Супервизор и субагенты"},
    {x:441,kickerY:39,titleY:68,kicker:"METAGPT",title:"Команда из 5 ролей"},
    {x:840,kickerY:39,titleY:68,kicker:"MOLTBOOK",title:"Популяция агентов"}
  ],
  supervisor:{x:111,y:86,w:180,h:50,textX:201,textY:116},
  hub:{x:201,y:136},
  agents:[
    {x:63,y:183},{x:126,y:177},{x:201,y:181},{x:276,y:177},{x:339,y:183},
    {x:88,y:238},{x:154,y:245},{x:225,y:245},{x:291,y:238},{x:201,y:285}
  ],
  agentStem:{y:168},
  agentEllipsis:{x:331,y:276},
  anthropicCount:{x:201,y:310},
  captions:[
    {x:201,y:335,text:"Разделить задачу и собрать ответы"},
    {x:600,y:335,text:"Управлять переходами между ролями"},
    {x:999,y:335,text:"Поддерживать общую среду"}
  ],
  roles:[
    {x:476,y:84,w:248,h:35,text:"Менеджер продукта"},
    {x:476,y:129,w:248,h:35,text:"Архитектор"},
    {x:476,y:174,w:248,h:35,text:"Руководитель проекта"},
    {x:476,y:219,w:248,h:35,text:"Инженер"},
    {x:476,y:264,w:248,h:35,text:"QA-инженер"}
  ],
  roleArrows:[
    {line:{x1:600,y1:119,x2:600,y2:127},head:[{x:594,y:122},{x:600,y:129},{x:606,y:122}]},
    {line:{x1:600,y1:164,x2:600,y2:172},head:[{x:594,y:167},{x:600,y:174},{x:606,y:167}]},
    {line:{x1:600,y1:209,x2:600,y2:217},head:[{x:594,y:212},{x:600,y:219},{x:606,y:212}]},
    {line:{x1:600,y1:254,x2:600,y2:262},head:[{x:594,y:257},{x:600,y:264},{x:606,y:257}]}
  ],
  platform:{x:844,y:84,w:310,h:216},
  platformHeader:{x:999,y:108,text:"≈2,3 млн агентских аккаунтов"},
  layer:{x:858,y:256,w:282,h:31,textX:999,textY:276},
  population:[
    {x:871,y:133,r:7,c:"population-dot"},
    {x:902,y:126,r:5,c:"population-dot-alt"},
    {x:934,y:137,r:6,c:"population-dot"},
    {x:970,y:126,r:7,c:"population-dot-alt"},
    {x:1004,y:138,r:5,c:"population-dot"},
    {x:1039,y:127,r:6,c:"population-dot"},
    {x:1073,y:139,r:7,c:"population-dot-alt"},
    {x:1110,y:127,r:5,c:"population-dot"},
    {x:1131,y:149,r:5,c:"population-dot-alt"},
    {x:884,y:165,r:5,c:"population-dot-alt"},
    {x:918,y:162,r:7,c:"population-dot"},
    {x:953,y:170,r:5,c:"population-dot"},
    {x:988,y:161,r:6,c:"population-dot-alt"},
    {x:1023,y:172,r:7,c:"population-dot"},
    {x:1057,y:162,r:5,c:"population-dot-alt"},
    {x:1093,y:171,r:6,c:"population-dot"},
    {x:1124,y:181,r:7,c:"population-dot"},
    {x:868,y:196,r:6,c:"population-dot"},
    {x:902,y:204,r:7,c:"population-dot-alt"},
    {x:937,y:194,r:5,c:"population-dot"},
    {x:972,y:207,r:6,c:"population-dot"},
    {x:1007,y:197,r:7,c:"population-dot-alt"},
    {x:1042,y:207,r:5,c:"population-dot"},
    {x:1077,y:195,r:7,c:"population-dot"},
    {x:1111,y:207,r:5,c:"population-dot-alt"},
    {x:1132,y:225,r:6,c:"population-dot"},
    {x:882,y:231,r:5,c:"population-dot-alt"},
    {x:917,y:235,r:6,c:"population-dot"},
    {x:951,y:228,r:7,c:"population-dot"},
    {x:987,y:237,r:5,c:"population-dot-alt"},
    {x:1022,y:229,r:6,c:"population-dot"},
    {x:1057,y:237,r:7,c:"population-dot-alt"},
    {x:1092,y:228,r:5,c:"population-dot"}
  ],
  footer:{
    title:{x:24,y:377,text:"МАСШТАБ ИНЖЕНЕРНОЙ ОТВЕТСТВЕННОСТИ"},
    labels:[
      {x:201,y:404,text:"один ответ"},
      {x:600,y:404,text:"процесс"},
      {x:999,y:404,text:"условия платформы"}
    ],
    line:{x1:24,y1:420,x2:1165,y2:420},
    head:[{x:1152,y:412},{x:1176,y:420},{x:1152,y:428}],
    ticks:[
      {x1:201,y1:414,x2:201,y2:426},
      {x1:600,y1:414,x2:600,y2:426},
      {x1:999,y1:414,x2:999,y2:426}
    ]
  }
};
const [ORIGIN_X,ORIGIN_Y]=DATA.origin;
const [SCALE_X,SCALE_Y]=DATA.scale;
const sx=x=>ORIGIN_X+x*SCALE_X;
const sy=y=>ORIGIN_Y+y*SCALE_Y;

try{
  const svg=document.getElementById("diagram");
  const NS="http://www.w3.org/2000/svg";
  const make=(tag,attrs,text)=>{
    const node=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([name,value])=>node.setAttribute(name,value));
    if(text!==undefined) node.textContent=text;
    svg.appendChild(node);
    return node;
  };
  const rect=(item,cls,round)=>{
    make("rect",{
      x:sx(item.x),y:sy(item.y),
      width:sx(item.x+item.w)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(round)-sx(0),class:cls
    });
  };
  const line=(item,cls)=>{
    make("line",{
      x1:sx(item.x1),y1:sy(item.y1),
      x2:sx(item.x2),y2:sy(item.y2),class:cls
    });
  };
  const circle=(item,cls)=>{
    make("circle",{
      cx:sx(item.x),cy:sy(item.y),
      r:sx(item.r)-sx(0),class:cls
    });
  };
  const text=(x,y,value,cls,anchor)=>{
    make("text",{x:sx(x),y:sy(y),class:cls,"text-anchor":anchor},value);
  };
  const polygon=(points,cls)=>{
    make("polygon",{
      points:points.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" "),
      class:cls
    });
  };

  rect(DATA.canvas,"soft",DATA.radius.card);
  DATA.panels.forEach(panel=>rect(panel,`panel ${panel.soft}`,DATA.radius.panel));
  DATA.headers.forEach(header=>{
    text(header.x,header.kickerY,header.kicker,"kicker","start");
    text(header.x,header.titleY,header.title,"heading","start");
  });

  DATA.agents.forEach(agent=>{
    line({x1:DATA.hub.x,y1:DATA.agentStem.y,x2:agent.x,y2:agent.y},"anthropic-line");
  });
  line({x1:DATA.hub.x,y1:DATA.hub.y,x2:DATA.hub.x,y2:DATA.agentStem.y},"anthropic-line");
  rect(DATA.supervisor,"panel",DATA.radius.card);
  text(DATA.supervisor.textX,DATA.supervisor.textY,"Супервизор Anthropic","node-text","middle");
  DATA.agents.forEach(agent=>{
    circle({x:agent.x,y:agent.y,r:DATA.radius.dot},"agent");
    circle({x:agent.x,y:agent.y,r:DATA.radius.core},"agent-core");
  });
  text(DATA.agentEllipsis.x,DATA.agentEllipsis.y,"…","count","middle");
  text(DATA.anthropicCount.x,DATA.anthropicCount.y,"10+ субагентов","count","middle");

  DATA.roles.forEach(role=>{
    rect(role,"panel meta-soft",DATA.radius.card);
    text(role.x+role.w/2,role.y+role.h/2+5,role.text,"role-text","middle");
  });
  DATA.roleArrows.forEach(arrow=>{
    line(arrow.line,"meta-line");
    polygon(arrow.head,"arrow-head-meta");
  });

  rect(DATA.platform,"panel molt-soft",DATA.radius.card);
  text(DATA.platformHeader.x,DATA.platformHeader.y,DATA.platformHeader.text,"count","middle");
  DATA.population.forEach(dot=>circle(dot,dot.c));
  rect(DATA.layer,"platform",DATA.radius.card);
  text(DATA.layer.textX,DATA.layer.textY,"доступ • изоляция • события • устойчивость","small","middle");

  DATA.captions.forEach(caption=>{
    text(caption.x,caption.y,caption.text,"small","middle");
  });

  text(DATA.footer.title.x,DATA.footer.title.y,DATA.footer.title.text,"footer-title","start");
  DATA.footer.labels.forEach(label=>{
    text(label.x,label.y,label.text,"footer-label","middle");
  });
  line(DATA.footer.line,"connector");
  DATA.footer.ticks.forEach(tick=>line(tick,"connector"));
  polygon(DATA.footer.head,"arrow-head-molt");
}catch(error){
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("error");
  svg.hidden=true;
  fallback.hidden=false;
  fallback.textContent="Схема должна показать три масштаба: супервизор Anthropic с 10+ субагентами, команду MetaGPT из 5 ролей и популяцию Moltbook примерно из 2,3 млн агентских аккаунтов.";
}
</script>
</body>
</html>
