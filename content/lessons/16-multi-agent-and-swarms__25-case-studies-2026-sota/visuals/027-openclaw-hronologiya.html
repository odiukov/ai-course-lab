<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>От локального ReAct-агента к массовой экосистеме</title>
<style>
:root {
  color-scheme: light dark;
  --bg: whitesmoke;
  --panel: white;
  --ink: midnightblue;
  --muted: slategray;
  --line: lightslategray;
  --blue: royalblue;
  --green: seagreen;
  --orange: darkorange;
  --red: firebrick;
  --purple: rebeccapurple;
  --zone: aliceblue;
  --local: lavender;
  --agent: honeydew;
  --network: lavenderblush;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: midnightblue;
    --panel: darkslategray;
    --ink: white;
    --muted: lightsteelblue;
    --line: slategray;
    --blue: cornflowerblue;
    --green: mediumseagreen;
    --orange: orange;
    --red: lightcoral;
    --purple: plum;
    --zone: darkslateblue;
    --local: midnightblue;
    --agent: darkgreen;
    --network: darkmagenta;
  }
}
html, body { background: var(--bg); color: var(--ink); }
body { font-family: system-ui, sans-serif; }
figure { width: 100%; }
.diagram-title {
  color: var(--ink);
  font-size: 19px;
  font-weight: bold;
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 520px;
  background: var(--bg);
}
.timeline { stroke: var(--line); fill: none; }
.connector { stroke: var(--line); fill: none; }
.card { fill: var(--panel); stroke: var(--line); }
.zone-bg { fill: var(--zone); stroke: var(--line); }
.stage-local { fill: var(--local); stroke: var(--blue); }
.stage-agent { fill: var(--agent); stroke: var(--green); }
.stage-network { fill: var(--network); stroke: var(--purple); }
.blue { fill: var(--blue); stroke: var(--blue); }
.green { fill: var(--green); stroke: var(--green); }
.orange { fill: var(--orange); stroke: var(--orange); }
.red { fill: var(--red); stroke: var(--red); }
.purple { fill: var(--purple); stroke: var(--purple); }
.node-core { fill: var(--bg); stroke: none; }
.event-date {
  fill: var(--muted);
  font-size: 13px;
  font-weight: bold;
}
.event-main {
  fill: var(--ink);
  font-size: 17px;
  font-weight: bold;
}
.event-sub { fill: var(--muted); font-size: 13px; }
.zone-label {
  fill: var(--ink);
  font-size: 14px;
  font-weight: bold;
}
.stage-title {
  fill: var(--muted);
  font-size: 13px;
  font-weight: bold;
}
.stage-main {
  fill: var(--ink);
  font-size: 16px;
  font-weight: bold;
}
.stage-sub { fill: var(--ink); font-size: 13px; }
.arrow { fill: var(--line); stroke: var(--line); }
#fallback { color: var(--ink); font-size: 16px; }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <div class="diagram-title" id="diagram-heading">
    От локального ReAct-агента к массовой экосистеме
  </div>
  <svg id="diagram" viewBox="0 0 1000 440" width="1000" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Хронология OpenClaw и Moltbook</title>
    <desc id="svg-description">
      Временная шкала от локального Clawdbot в ноябре 2025 года
      до экосистемы Moltbook и событий марта 2026 года.
    </desc>
  </svg>
  <p id="fallback" hidden>
    Схема должна показать путь от локального Clawdbot в ноябре 2025 года
    к Moltbook с примерно 2,3 миллиона аккаунтов, покупке Meta,
    запрету в Китае и 247 тысячам звёзд GitHub в марте 2026 года.
  </p>
</figure>
<script>
const DATA = Object.freeze({
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },
  zero: 0,
  style: {
    axisWidth: 4,
    connectorWidth: 2,
    borderWidth: 2,
    stripeWidth: 7,
    nodeRadius: 9,
    coreRadius: 4
  },
  timeline: {
    from: { x: 35, y: 140 },
    to: { x: 955, y: 140 },
    arrow: [
      { x: 955, y: 140 },
      { x: 939, y: 131 },
      { x: 939, y: 149 }
    ]
  },
  cards: [
    {
      point: { x: 118, y: 140 },
      link: { x1: 118, y1: 131, x2: 118, y2: 108 },
      box: { x: 18, y: 14, w: 205, h: 94 },
      accent: "blue",
      lines: [
        { dy: 22, text: "НОЯБРЬ 2025", cls: "event-date" },
        { dy: 50, text: "Clawdbot", cls: "event-main" },
        { dy: 74, text: "локальный ReAct-агент", cls: "event-sub" }
      ]
    },
    {
      point: { x: 345, y: 140 },
      link: { x1: 345, y1: 149, x2: 345, y2: 174 },
      box: { x: 240, y: 174, w: 210, h: 100 },
      accent: "green",
      lines: [
        { dy: 23, text: "ФЕВРАЛЬ 2026", cls: "event-date" },
        { dy: 52, text: "Запуск Moltbook", cls: "event-main" },
        { dy: 77, text: "социальный слой агентов", cls: "event-sub" }
      ]
    },
    {
      point: { x: 517, y: 140 },
      link: { x1: 517, y1: 131, x2: 517, y2: 108 },
      box: { x: 415, y: 14, w: 205, h: 94 },
      accent: "orange",
      lines: [
        { dy: 22, text: "ФЕВРАЛЬ 2026", cls: "event-date" },
        { dy: 50, text: "≈ 2,3 млн аккаунтов", cls: "event-main" },
        { dy: 74, text: "за считаные дни", cls: "event-sub" }
      ]
    },
    {
      point: { x: 642, y: 140 },
      link: { x1: 642, y1: 149, x2: 642, y2: 174 },
      box: { x: 540, y: 174, w: 205, h: 100 },
      accent: "purple",
      lines: [
        { dy: 23, text: "10 МАРТА 2026", cls: "event-date" },
        { dy: 52, text: "Meta покупает", cls: "event-main" },
        { dy: 77, text: "Moltbook", cls: "event-sub" }
      ]
    },
    {
      point: { x: 772, y: 140 },
      link: { x1: 772, y1: 131, x2: 772, y2: 108 },
      box: { x: 665, y: 14, w: 215, h: 94 },
      accent: "red",
      lines: [
        { dy: 22, text: "МАРТ 2026", cls: "event-date" },
        { dy: 50, text: "Запрет OpenClaw", cls: "event-main" },
        { dy: 74, text: "на госкомпьютерах Китая", cls: "event-sub" }
      ]
    },
    {
      point: { x: 885, y: 140 },
      link: { x1: 885, y1: 149, x2: 885, y2: 174 },
      box: { x: 765, y: 174, w: 215, h: 100 },
      accent: "blue",
      lines: [
        { dy: 23, text: "МАРТ 2026", cls: "event-date" },
        { dy: 52, text: "247 тыс. звёзд", cls: "event-main" },
        { dy: 77, text: "GitHub у OpenClaw", cls: "event-sub" }
      ]
    }
  ],
  zone: { x: 10, y: 292, w: 980, h: 138 },
  zoneLabel: { x: 25, y: 317 },
  stages: [
    {
      box: { x: 20, y: 332, w: 235, h: 86 },
      cls: "stage-local",
      lines: [
        { dy: 22, text: "ЛОКАЛЬНЫЙ ЦИКЛ", cls: "stage-title" },
        { dy: 48, text: "Clawdbot", cls: "stage-main" },
        { dy: 71, text: "задача → действие → результат", cls: "stage-sub" }
      ]
    },
    {
      box: { x: 320, y: 332, w: 270, h: 86 },
      cls: "stage-agent",
      lines: [
        { dy: 22, text: "ДОСТУПНЫЙ ДРУГИМ АГЕНТ", cls: "stage-title" },
        { dy: 48, text: "Moltbook", cls: "stage-main" },
        { dy: 71, text: "профиль • поиск • сообщения", cls: "stage-sub" }
      ]
    },
    {
      box: { x: 655, y: 332, w: 325, h: 86 },
      cls: "stage-network",
      lines: [
        { dy: 22, text: "ОБЩАЯ СРЕДА", cls: "stage-title" },
        { dy: 48, text: "Массовая экосистема", cls: "stage-main" },
        { dy: 71, text: "миллионы самостоятельных ReAct-циклов", cls: "stage-sub" }
      ]
    }
  ],
  stageArrows: [
    {
      line: { x1: 270, y1: 375, x2: 305, y2: 375 },
      head: [
        { x: 305, y: 375 },
        { x: 293, y: 367 },
        { x: 293, y: 383 }
      ]
    },
    {
      line: { x1: 605, y1: 375, x2: 640, y2: 375 },
      head: [
        { x: 640, y: 375 },
        { x: 628, y: 367 },
        { x: 628, y: 383 }
      ]
    }
  ]
});

const origin = Object.freeze(DATA.origin);
const scale = Object.freeze(DATA.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");

try {
  const make = (tag, attrs, cls) => {
    const node = document.createElementNS(svg.namespaceURI, tag);
    for (const [name, value] of Object.entries(attrs)) {
      node.setAttribute(name, String(value));
    }
    if (cls) node.setAttribute("class", cls);
    return node;
  };

  const rect = (parent, box, cls) => {
    parent.appendChild(make("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.w) - sx(DATA.zero),
      height: sy(box.h) - sy(DATA.zero)
    }, cls));
  };

  const line = (parent, segment, cls, width) => {
    parent.appendChild(make("line", {
      x1: sx(segment.x1),
      y1: sy(segment.y1),
      x2: sx(segment.x2),
      y2: sy(segment.y2),
      "stroke-width": width
    }, cls));
  };

  const polygon = (parent, points, cls) => {
    const mapped = points.map(point =>
      `${sx(point.x)},${sy(point.y)}`
    ).join(" ");
    parent.appendChild(make("polygon", { points: mapped }, cls));
  };

  const label = (parent, box, lines) => {
    const x = box.x + box.w / DATA.style.borderWidth;
    const text = make("text", {
      x: sx(x),
      y: sy(box.y),
      "text-anchor": "middle"
    });
    for (const item of lines) {
      const span = make("tspan", {
        x: sx(x),
        y: sy(box.y + item.dy)
      }, item.cls);
      span.textContent = item.text;
      text.appendChild(span);
    }
    parent.appendChild(text);
  };

  line(svg, {
    x1: DATA.timeline.from.x,
    y1: DATA.timeline.from.y,
    x2: DATA.timeline.to.x,
    y2: DATA.timeline.to.y
  }, "timeline", DATA.style.axisWidth);
  polygon(svg, DATA.timeline.arrow, "arrow");

  for (const event of DATA.cards) {
    line(svg, event.link, "connector", DATA.style.connectorWidth);
  }

  for (const event of DATA.cards) {
    const group = make("g", {}, "");
    rect(group, event.box, "card");
    rect(group, {
      x: event.box.x,
      y: event.box.y,
      w: DATA.style.stripeWidth,
      h: event.box.h
    }, event.accent);
    label(group, event.box, event.lines);

    group.appendChild(make("circle", {
      cx: sx(event.point.x),
      cy: sy(event.point.y),
      r: sx(DATA.style.nodeRadius) - sx(DATA.zero),
      "stroke-width": DATA.style.borderWidth
    }, event.accent));

    group.appendChild(make("circle", {
      cx: sx(event.point.x),
      cy: sy(event.point.y),
      r: sx(DATA.style.coreRadius) - sx(DATA.zero)
    }, "node-core"));
    svg.appendChild(group);
  }

  rect(svg, DATA.zone, "zone-bg");

  const zoneText = make("text", {
    x: sx(DATA.zoneLabel.x),
    y: sy(DATA.zoneLabel.y),
    "text-anchor": "start"
  }, "zone-label");
  zoneText.textContent = "Расширяется среда вокруг неизменного локального цикла";
  svg.appendChild(zoneText);

  for (const arrow of DATA.stageArrows) {
    line(svg, arrow.line, "timeline", DATA.style.connectorWidth);
    polygon(svg, arrow.head, "arrow");
  }

  for (const stage of DATA.stages) {
    const group = make("g", {}, "");
    rect(group, stage.box, stage.cls);
    label(group, stage.box, stage.lines);
    svg.appendChild(group);
  }
} catch (error) {
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
</body>
</html>
