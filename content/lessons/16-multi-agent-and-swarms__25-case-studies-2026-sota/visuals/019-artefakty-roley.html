<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Контракты передачи между пятью ролями MetaGPT</title>
<style>
:root{
  color-scheme:light dark;
  --page:white;
  --panel:#f7f9fc;
  --card:white;
  --ink:#172033;
  --muted:#596579;
  --line:#7b8799;
  --soft:#dce3ec;
  --accent:#2563eb;
  --accent-soft:#e8f0ff;
  --artifact:#fff7db;
  --artifact-line:#b87800;
  --contract:#eef7f2;
  --contract-line:#26845a;
  --shadow:#cbd5e1;
  --stroke:2px;
  --thin:1px;
  --title-size:20px;
  --role-size:18px;
  --body-size:15px;
  --small-size:13px;
  --artifact-size:14px;
  --label-pad:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{
  width:100%;
  margin:0;
  overflow:hidden;
  background:var(--panel);
  border:var(--thin) solid var(--soft);
}
figcaption{
  padding:10px 16px;
  font-size:var(--title-size);
  font-weight:750;
  line-height:1.25;
  background:var(--card);
  border-bottom:var(--thin) solid var(--soft);
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:470px;
  background:var(--panel);
}
text{fill:var(--ink)}
.role-card{
  fill:var(--card);
  stroke:var(--soft);
  stroke-width:var(--stroke);
}
.role-accent{fill:var(--accent)}
.role-title{
  font-size:var(--role-size);
  font-weight:750;
  text-anchor:middle;
}
.role-body{
  fill:var(--muted);
  font-size:var(--body-size);
  text-anchor:middle;
}
.role-rule{
  stroke:var(--soft);
  stroke-width:var(--thin);
}
.arrow{
  stroke:var(--line);
  stroke-width:var(--stroke);
  stroke-linecap:round;
}
.arrow-head{fill:var(--line)}
.leader{
  stroke:var(--artifact-line);
  stroke-width:var(--thin);
}
.artifact-pill{
  fill:var(--artifact);
  stroke:var(--artifact-line);
  stroke-width:var(--thin);
}
.artifact-text{
  fill:var(--ink);
  font-size:var(--artifact-size);
  font-weight:700;
  text-anchor:middle;
}
.contract-box{
  fill:var(--contract);
  stroke:var(--contract-line);
  stroke-width:var(--thin);
}
.contract-title{
  fill:var(--contract-line);
  font-size:var(--body-size);
  font-weight:750;
}
.contract-number{
  fill:var(--contract-line);
  font-size:var(--body-size);
  font-weight:800;
  text-anchor:middle;
}
.contract-main{
  font-size:var(--body-size);
  font-weight:700;
}
.contract-note{
  fill:var(--muted);
  font-size:var(--small-size);
}
.report-sheet{
  fill:var(--card);
  stroke:var(--accent);
  stroke-width:var(--stroke);
}
.report-fold{fill:var(--accent-soft);stroke:var(--accent);stroke-width:var(--thin)}
.report-line{stroke:var(--accent);stroke-width:var(--thin);stroke-linecap:round}
.report-text{
  fill:var(--muted);
  font-size:var(--small-size);
  font-weight:700;
  text-anchor:middle;
}
#fallback{
  margin:0;
  padding:18px;
  color:var(--ink);
  background:var(--panel);
  font-size:var(--body-size);
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#0d1119;
    --panel:#111827;
    --card:#182131;
    --ink:#eef3fb;
    --muted:#aeb9ca;
    --line:#9aa8bd;
    --soft:#344154;
    --accent:#74a7ff;
    --accent-soft:#21385d;
    --artifact:#342b16;
    --artifact-line:#e3ad45;
    --contract:#142d25;
    --contract-line:#63c997;
    --shadow:#070a10;
  }
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Контракты передачи между 5 ролями MetaGPT</figcaption>
  <svg id="diagram" viewBox="0 0 1500 470" width="1500" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Цепочка из пяти ролей MetaGPT и структурированных артефактов между ними"></svg>
  <p id="fallback" hidden>Схема должна была показать цепочку: продакт-менеджер передаёт PRD архитектору, архитектор — архитектуру менеджеру проекта, менеджер проекта — план инженеру, инженер — код QA-инженеру, а QA-инженер выпускает отчёт проверки.</p>
</figure>

<script>
const DATA=[{
  canvas:{x:0,y:0,w:1500,h:470},
  roles:[
    {x:35,y:135,w:210,h:150,bar:8,r:16,
     title:[{text:"Продакт-",x:140,y:172},{text:"менеджер",x:140,y:196}],
     body:[{text:"Формулирует функции,",x:140,y:235},{text:"ограничения и критерии",x:140,y:257}]},
    {x:295,y:135,w:210,h:150,bar:8,r:16,
     title:[{text:"Архитектор",x:400,y:184}],
     body:[{text:"Определяет компоненты,",x:400,y:235},{text:"связи и решения",x:400,y:257}]},
    {x:555,y:135,w:210,h:150,bar:8,r:16,
     title:[{text:"Менеджер",x:660,y:172},{text:"проекта",x:660,y:196}],
     body:[{text:"Делит работу на задачи",x:660,y:235},{text:"и зависимости",x:660,y:257}]},
    {x:815,y:135,w:210,h:150,bar:8,r:16,
     title:[{text:"Инженер",x:920,y:184}],
     body:[{text:"Реализует задачи",x:920,y:235},{text:"по критериям",x:920,y:257}]},
    {x:1075,y:135,w:210,h:150,bar:8,r:16,
     title:[{text:"QA-инженер",x:1180,y:184}],
     body:[{text:"Сверяет код",x:1180,y:235},{text:"с требованиями",x:1180,y:257}]}
  ],
  transfers:[
    {label:"PRD",pill:{x:222,y:35,w:96,h:42,r:14},text:{x:270,y:61},
     lead:{x1:270,y1:77,x2:270,y2:198},
     line:{x1:245,y1:210,x2:295,y2:210},
     head:[{x:295,y:210},{x:282,y:202},{x:282,y:218}]},
    {label:"Архитектура",pill:{x:444,y:35,w:172,h:42,r:14},text:{x:530,y:61},
     lead:{x1:530,y1:77,x2:530,y2:198},
     line:{x1:505,y1:210,x2:555,y2:210},
     head:[{x:555,y:210},{x:542,y:202},{x:542,y:218}]},
    {label:"План задач",pill:{x:720,y:35,w:140,h:42,r:14},text:{x:790,y:61},
     lead:{x1:790,y1:77,x2:790,y2:198},
     line:{x1:765,y1:210,x2:815,y2:210},
     head:[{x:815,y:210},{x:802,y:202},{x:802,y:218}]},
    {label:"Код",pill:{x:1004,y:35,w:92,h:42,r:14},text:{x:1050,y:61},
     lead:{x1:1050,y1:77,x2:1050,y2:198},
     line:{x1:1025,y1:210,x2:1075,y2:210},
     head:[{x:1075,y:210},{x:1062,y:202},{x:1062,y:218}]},
    {label:"Отчёт проверки",pill:{x:1235,y:35,w:190,h:42,r:14},text:{x:1330,y:61},
     lead:{x1:1330,y1:77,x2:1330,y2:198},
     line:{x1:1285,y1:210,x2:1372,y2:210},
     head:[{x:1372,y:210},{x:1359,y:202},{x:1359,y:218}]}
  ],
  report:{
    sheet:[{x:1372,y:151},{x:1464,y:151},{x:1464,y:269},{x:1372,y:269}],
    fold:[{x:1434,y:151},{x:1464,y:181},{x:1434,y:181}],
    lines:[
      {x1:1391,y1:201,x2:1445,y2:201},
      {x1:1391,y1:218,x2:1445,y2:218},
      {x1:1391,y1:235,x2:1431,y2:235}
    ],
    text:[{text:"Результаты",x:1418,y:292},{text:"и дефекты",x:1418,y:309}]
  },
  contract:{
    title:{text:"Каждая передача проверяется по 3 частям контракта",x:35,y:347},
    boxes:[
      {x:35,y:365,w:430,h:78,r:14,cx:72,cy:404,cr:20,n:"1",
       main:{text:"Обязательные поля",x:108,y:395},
       note:{text:"Что должно быть заполнено",x:108,y:419}},
      {x:500,y:365,w:430,h:78,r:14,cx:537,cy:404,cr:20,n:"2",
       main:{text:"Допустимый формат",x:573,y:395},
       note:{text:"Как результат читается дальше",x:573,y:419}},
      {x:965,y:365,w:500,h:78,r:14,cx:1002,cy:404,cr:20,n:"3",
       main:{text:"Условие приёмки",x:1038,y:395},
       note:{text:"Что должен проверить получатель",x:1038,y:419}}
    ]
  }
}];
const origin={x:0,y:0};
const scale={x:1,y:1};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const [d]=DATA;
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";
  const make=(name,attrs,text)=>{
    const node=document.createElementNS(ns,name);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
    if(text!==undefined) node.textContent=text;
    return node;
  };

  svg.append(make("rect",{
    x:sx(d.canvas.x),y:sy(d.canvas.y),
    width:sx(d.canvas.w)-sx(d.canvas.x),
    height:sy(d.canvas.h)-sy(d.canvas.y),
    fill:"var(--panel)"
  }));

  d.roles.forEach(role=>{
    svg.append(make("rect",{
      class:"role-card",x:sx(role.x),y:sy(role.y),
      width:sx(role.w)-sx(0),height:sy(role.h)-sy(0),
      rx:sx(role.r)-sx(0),ry:sy(role.r)-sy(0)
    }));
    svg.append(make("rect",{
      class:"role-accent",x:sx(role.x),y:sy(role.y),
      width:sx(role.bar)-sx(0),height:sy(role.h)-sy(0),
      rx:sx(role.r)-sx(0),ry:sy(role.r)-sy(0)
    }));
    role.title.forEach(line=>{
      svg.append(make("text",{
        class:"role-title",x:sx(line.x),y:sy(line.y)
      },line.text));
    });
    svg.append(make("line",{
      class:"role-rule",
      x1:sx(role.x+role.bar+18),y1:sy(role.y+76),
      x2:sx(role.x+role.w-18),y2:sy(role.y+76)
    }));
    role.body.forEach(line=>{
      svg.append(make("text",{
        class:"role-body",x:sx(line.x),y:sy(line.y)
      },line.text));
    });
  });

  d.transfers.forEach(item=>{
    svg.append(make("line",{
      class:"leader",
      x1:sx(item.lead.x1),y1:sy(item.lead.y1),
      x2:sx(item.lead.x2),y2:sy(item.lead.y2)
    }));
    svg.append(make("line",{
      class:"arrow",
      x1:sx(item.line.x1),y1:sy(item.line.y1),
      x2:sx(item.line.x2),y2:sy(item.line.y2)
    }));
    svg.append(make("polygon",{
      class:"arrow-head",
      points:item.head.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ")
    }));
    svg.append(make("rect",{
      class:"artifact-pill",
      x:sx(item.pill.x),y:sy(item.pill.y),
      width:sx(item.pill.w)-sx(0),height:sy(item.pill.h)-sy(0),
      rx:sx(item.pill.r)-sx(0),ry:sy(item.pill.r)-sy(0)
    }));
    svg.append(make("text",{
      class:"artifact-text",x:sx(item.text.x),y:sy(item.text.y)
    },item.label));
  });

  svg.append(make("polygon",{
    class:"report-sheet",
    points:d.report.sheet.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ")
  }));
  svg.append(make("polygon",{
    class:"report-fold",
    points:d.report.fold.map(point=>`${sx(point.x)},${sy(point.y)}`).join(" ")
  }));
  d.report.lines.forEach(line=>{
    svg.append(make("line",{
      class:"report-line",
      x1:sx(line.x1),y1:sy(line.y1),x2:sx(line.x2),y2:sy(line.y2)
    }));
  });
  d.report.text.forEach(line=>{
    svg.append(make("text",{
      class:"report-text",x:sx(line.x),y:sy(line.y)
    },line.text));
  });

  svg.append(make("text",{
    class:"contract-title",
    x:sx(d.contract.title.x),y:sy(d.contract.title.y),
    "text-anchor":"start"
  },d.contract.title.text));

  d.contract.boxes.forEach(box=>{
    svg.append(make("rect",{
      class:"contract-box",x:sx(box.x),y:sy(box.y),
      width:sx(box.w)-sx(0),height:sy(box.h)-sy(0),
      rx:sx(box.r)-sx(0),ry:sy(box.r)-sy(0)
    }));
    svg.append(make("circle",{
      class:"contract-box",cx:sx(box.cx),cy:sy(box.cy),
      r:sx(box.cr)-sx(0)
    }));
    svg.append(make("text",{
      class:"contract-number",x:sx(box.cx),y:sy(box.cy+5)
    },box.n));
    svg.append(make("text",{
      class:"contract-main",x:sx(box.main.x),y:sy(box.main.y),
      "text-anchor":"start"
    },box.main.text));
    svg.append(make("text",{
      class:"contract-note",x:sx(box.note.x),y:sy(box.note.y),
      "text-anchor":"start"
    },box.note.text));
  });
}catch(error){
  const fallback=document.getElementById("fallback");
  fallback.hidden=false;
}
</script>
</body>
</html>
