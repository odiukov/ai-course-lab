- concept: расхождение траекторий между прогонами — валидный результат разведки, означающий, что агент остаётся в проде
  question: 'Разведка закончена, но траектории агента расходятся от задачи к задаче: устойчивой повторяющейся последовательности нет. Объясни своими словами, что это говорит об архитектуре и что делать дальше.'
  explanation: Разведка отвечает на вопрос «есть ли здесь граф», и оба исхода — ответ. Отрицательный результат экономит неделю на воркфлоу, который развалится на реальном трафике.
  kind: open
  reference: 'Это не провал разведки, а её ответ. Отсутствие стабильной траектории означает, что следующий шаг реально зависит от результата предыдущего, число шагов задаётся данными во время выполнения, и перечислимого графа тут нет. Значит домен относится к классу open-ended / variable-length задач, где агент выигрывает у воркфлоу, и агент остаётся в продакшене — за это платят стоимостью, латентностью и сложностью отладки. Попытка всё равно закодировать угаданный граф даст мёртвые ветви и переполненную категорию «прочее». Разумный компромисс: кодифицировать в воркфлоу только те подотрезки, которые повторяются стабильно, оставив агенту вариативную часть.'
