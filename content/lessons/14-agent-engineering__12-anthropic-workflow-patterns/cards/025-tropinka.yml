- concept: разведка требует лога вызовов инструментов (какие, в каком порядке, сколько раз), а не только оценки финальных ответов
  question: Что нужно собирать с агента во время разведочной фазы в новом домене, чтобы из неё вообще можно было вывести воркфлоу?
  explanation: Кодификация переносит в код именно последовательность шагов. Метрика качества говорит, работает ли агент, но не говорит, ЧТО он делал, — из неё граф не восстановить. Стоимость и латентность нужны для решения об экономии, но не задают узлы. Ошибочные прогоны показывают дыры, но повторяющийся скелет виден как раз на успешных.
  kind: choice
  options:
