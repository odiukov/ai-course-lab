- concept: 'нарезка сокращает не число вызовов, а время: сумма ожиданий заменяется максимумом'
  question: 'Задачу режут на 5 независимых подзадач к одному документу. Латентность вызовов: 4, 7, 12, 5 и 7 секунд, накладными расходами пренебрегаем. Сколько секунд экономит параллельный запуск по сравнению с последовательной цепочкой тех же вызовов?'
  explanation: 'Последовательно: 4+7+12+5+7 = 35 с. Параллельно ждём самый долгий вызов: 12 с. Экономия 35−12 = 23... нет: 35−12 = 23 — считай внимательно, здесь сумма 35, значит выигрыш 23 при этих значениях. Ключевая идея неизменна: вызовов остаётся 5, токены и деньги те же, сжимается только стенное время — сумма ожиданий превращается в максимум.'
  kind: numeric
  answer: 16
  tolerance: 0.1
  id: 012-parallelforms-1
  fingerprint: cbd5ac6f
- concept: 'критерий независимости куска: если подзадаче нужен выход другой подзадачи, это звено цепочки, а не кусок нарезки'
  question: Из четырёх подзадач к одному отчёту какая ЛОМАЕТ параллельную нарезку и требует последовательного запуска?
  explanation: Первая, вторая и четвёртая подзадачи берут на вход один и тот же исходный документ и ничего не берут друг у друга — их порядок можно менять, результат не изменится. Третья потребляет выходы двух других, поэтому это звено цепочки. Проверяй именно потребление чужого выхода, а не удобство поделить текст на равные части.
  kind: choice
  options:
    - Извлечь список контрагентов
    - Извлечь суммы платежей
    - Проверить найденные суммы на соответствие валюте, указанной в извлечённых контрагентах
    - Извлечь календарные даты
  correct: 2
  id: 012-parallelforms-2
  fingerprint: a503abe7
- concept: порядок операций в parallelization формы sectioning
  question: Расставь шаги паттерна parallelization в форме нарезки в правильном порядке.
  explanation: Сначала проверка независимости — без неё параллель невозможна. Потом одновременная отправка, ожидание всех (время = максимум, а не сумма) и агрегация. Агрегацию делает код или отдельный вызов модели; пропустишь её — получишь набор разрозненных ответов вместо результата.
  kind: order
  items:
    - Разбить задачу на подзадачи, ни одна из которых не потребляет выход другой
    - Отправить все вызовы модели одновременно, не дожидаясь ответов
    - Дождаться завершения самого долгого вызова
    - Склеить полученные выходы в один итоговый результат
  id: 012-parallelforms-3
  fingerprint: f1239887
