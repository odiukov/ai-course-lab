- concept: долговечное состояние нужно тогда, когда пауза в выполнении длиннее жизни процесса
  question: Оркестратор запускает подзадачи, а затем останавливается и ждёт решения человека — иногда неделю. Какая возможность делает такой пайплайн работоспособным и какой фреймворк её даёт?
  explanation: 'Пауза длиннее жизни процесса означает, что состояние обязано лежать на диске, иначе перезапуск обнуляет работу. Именно это даёт LangGraph: продолжение с прерванного шага спустя произвольное время. Роли и почтовые ящики здесь ничего не решают.'
  kind: choice
  options:
    - Шаблонизация ролей — CrewAI
    - Конкурентность по модели акторов — AutoGen
    - Долговечное состояние, сохраняемое вне процесса, — LangGraph
    - Структурированный вывод — прямые вызовы API
  correct: 2
