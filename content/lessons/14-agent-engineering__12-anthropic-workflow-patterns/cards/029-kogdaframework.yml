- concept: Claude Agent SDK берут ради готовой формы харнеса Claude Code, а не ради трёх инфраструктурных потребностей
  question: Чем мотив взять Claude Agent SDK отличается от мотивов взять LangGraph, AutoGen или CrewAI?
  explanation: 'Проверка «нужна ли хоть одна из трёх инфраструктурных возможностей» к Claude Agent SDK неприменима: он отвечает на вопрос «хочу ли я такой харнес», а не «умею ли я сам хранить состояние и гонять акторов».'
  kind: open
  reference: 'LangGraph, AutoGen и CrewAI закрывают инфраструктурные дыры: долговечное состояние, конкурентность по модели акторов, шаблонизацию ролей. Claude Agent SDK берут по другой причине — когда нужна сама форма харнеса Claude Code (его цикл работы с инструментами, файлами, контекстом), и пересобирать её с нуля дороже, чем взять готовую. То есть покупается конкретный готовый харнес, а не системная возможность общего назначения.'
  id: 029-kogdaframework-3
  fingerprint: efa6a493
