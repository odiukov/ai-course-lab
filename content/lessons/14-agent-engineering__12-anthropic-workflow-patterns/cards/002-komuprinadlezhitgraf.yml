- concept: агент покупает работу с задачами без заданных границ ценой стоимости, латентности и сложности отладки
  question: Что именно даёт передача выбора шагов модели вместо жёсткого графа в коде, и чем за это платят? Объясни своими словами.
  explanation: 'Разделение проходит по владению графом. Гибкость агента не бесплатна: она обменивается на предсказуемость стоимости и на возможность аудита путей. Поэтому место есть обоим подходам, а выбор — это выбор между «я знаю маршрут заранее» и «маршрут известен только по ходу дела».'
  kind: open
  reference: 'Даёт: возможность решать задачи без заранее заданных границ — те, где маршрут нельзя прописать в коде, потому что он неизвестен до момента исполнения и зависит от конкретного входа. Плата: больше вызовов модели (выше стоимость и латентность), и главное — режимы отказа, про которые труднее рассуждать: нет заранее известного множества путей, отказ может не воспроизводиться, а вместо чтения своей ветки кода инженер разбирает трассу вызовов. Воркфлоу же дешевле, быстрее и проще в отладке ровно потому, что граф принадлежит инженеру.'
