- concept: retrieval достаёт внешние документы под текущий запрос, память сохраняет состояние между вызовами
  question: 'Ассистент по страховым претензиям должен: (а) найти нужный пункт в базе полисов под каждый новый вопрос и (б) помнить решение по клиенту, принятое на прошлой неделе. Какие возможности augmented LLM закрывают эти задачи?'
  explanation: 'Retrieval — подтягивание внешних данных в контекст под конкретный запрос: база полисов лежит снаружи, модель достаёт из неё абзац. Память — сохранение состояния между вызовами: то, что выяснено раньше, доступно позже без повторного вывода. Разные механизмы: retrieval читает чужой корпус, память пишет и читает собственные записи системы.'
  kind: choice
  options:
    - (а) retrieval, (б) память
    - (а) память, (б) retrieval
    - обе — retrieval, память тут не нужна
    - обе — память, retrieval тут не нужен
  correct: 0
  id: 004-augmentedllm-1
  fingerprint: 9a9faa02
- concept: tools означает, что модель порождает вызов функции, который исполняет код, а не текстовое описание действия
  question: Что именно добавляет модели подключение инструментов (tools)?
  explanation: 'Инструмент — это контракт: модель возвращает имя функции и аргументы, исполняет её код приложения, результат возвращается в контекст. Без этого модель может только написать «нужно отправить письмо». Обрати внимание: подключение инструментов само по себе не даёт модели управление ходом работы — это отдельное свойство, а не следствие tools.'
  kind: choice
  options:
    - Модель начинает сама решать, сколько шагов сделать до ответа
    - Модель выдаёт структурированный вызов функции, который исполняет внешний код, и получает результат обратно
    - Модель дообучается на логах выполненных действий
    - Модель получает больше контекстного окна под описание действий
  correct: 1
  id: 004-augmentedllm-2
  fingerprint: e97f4e13
- concept: паттерны различаются схемой соединения вызовов augmented LLM, а не устройством самого вызова
  question: 'Коллега говорит: «prompt chaining, routing, parallelization, orchestrator-workers, evaluator-optimizer — это разные технологии, надо изучать каждую отдельно». Объясни своими словами, почему это неверно и что на самом деле отличает паттерны друг от друга.'
  explanation: 'Сложность живёт в схеме соединения, а не в узле. Практический вывод: освоив один augmented-вызов и научившись передавать выход одного вызова на вход другого, ты получаешь все паттерны как варианты разводки, а не как новый материал.'
  kind: open
  reference: 'Все паттерны собраны из одного и того же элемента — вызова augmented LLM (модель плюс retrieval, инструменты, память). Сам вызов везде одинаков. Отличается только топология соединения таких вызовов: последовательно (выход одного идёт на вход следующего), параллельно (несколько вызовов на одном входе с последующей агрегацией), с ветвлением по классификации входа, с проверяющим вызовом в петле. Поэтому изучать нужно один атомарный кирпич плюс способы кладки, а не пять независимых механизмов.'
  id: 004-augmentedllm-3
  fingerprint: 66a89c23
