- concept: в parallelization формы sectioning результат агрегируется по индексу подзадачи, а не по порядку завершения вызовов
  question: Разделы обрабатываются конкурентно, ответы приходят в произвольном порядке, а итоговый список обязан идти в порядке разделов. Что подставить, чтобы каждый ответ лёг на своё место?
  explanation: 'Каждый future помечается позицией своей подзадачи, и ответ пишется в results[позиция]. Порядок завершения вызовов при конкурентном исполнении недетерминирован: он зависит от латентности провайдера, а не от кода. Сборка через append дала бы отчёт, перемешанный от прогона к прогону. Позиционная запись делает выход паттерна детерминированным независимо от того, исполняются вызовы последовательно или параллельно.'
  kind: cloze
  template: |-
    results = [None] * len(sections)
    with ThreadPoolExecutor() as pool:
        futures = {pool.submit(run_section, task_text, s): ___ for i, s in enumerate(sections)}
    for future in as_completed(futures):
        results[futures[future]] = future.result()
  answer: i
  accept:
    - i
    - index
    - idx
  id: 013-parallelsections-1
  fingerprint: af675318
- concept: 'нарезка и голосование по-разному сводят N ответов: нарезка сохраняет их как N разных частей, голосование сводит к одному результату'
  question: Две формы parallelization запускают N вызовов LLM. Чем принципиально отличается шаг агрегации у нарезки (sectioning) и у голосования (voting)?
  explanation: 'Нарезка даёт каждому вызову свою подзадачу, поэтому ответы не взаимозаменяемы — каждый занимает своё место в итоге. Голосование даёт всем вызовам один и тот же промпт, ответы взаимозаменяемы и конкурируют между собой, поэтому агрегация обязана их свести: большинство, медиана или синтез. Кто выполняет агрегацию — код или ещё одна LLM — вопрос реализации, а не формы.'
  kind: choice
  options:
    - У нарезки N ответов остаются N разными частями итога и склеиваются; у голосования N ответов на один и тот же промпт сводятся к одному результату большинством или синтезом
    - У нарезки агрегация делается ещё одним вызовом LLM, у голосования — программным кодом
    - У нарезки N ответов сводятся к одному большинством, у голосования каждый ответ попадает в свою секцию итога
    - Агрегация одинаковая, отличается только число параллельных вызовов
