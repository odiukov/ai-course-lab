- concept: выбор паттерна фиксируют парой «паттерн + заранее названное условие его пересмотра», потому что верный сегодня выбор устаревает по мере изменения нагрузки
  question: Почему при выборе воркфлоу-паттерна рекомендуют сразу записывать вместе с ним условие пересмотра, а не возвращаться к вопросу, когда система начнёт работать плохо?
  explanation: 'Ценность в паре: сам выбор фиксирует, что делать сейчас, а порог фиксирует, при каком наблюдаемом факте решение перестаёт быть верным. Это тот же приём, что и для перехода агент→воркфлоу, только в обратную сторону.'
  kind: open
  reference: 'Правильность паттерна зависит от свойств потока задач, а они меняются: у роутера растёт число ветвей и распухает fallback-ветка «прочее», оркестратор начинает регулярно упираться в потолок вызовов, у цепочки появляются входы, требующие шагов вне графа. Пока порог не назван числом заранее, момент перехода определяется на глаз и обсуждается уже под давлением инцидента. Записанная пара «паттерн + условие пересмотра» (доля запусков в потолке, число ветвей роутера, доля попаданий в fallback) превращает миграцию в агента из аварии в запланированную точку: критерий выбран, когда никто не защищает текущее решение, а проверяется по логам механически.'
