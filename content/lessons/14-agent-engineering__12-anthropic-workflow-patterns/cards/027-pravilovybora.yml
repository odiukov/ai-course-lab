- concept: условие пересмотра паттерна формулируют измеримым порогом и сверяют с реальной статистикой прогонов, а не с ощущением инженера
  question: 'При запуске оркестратора записали правило пересмотра: «уходим в агента, если потолок в 8 вызовов упирается чаще, чем в 15% запусков». За квартал из 240 запусков в потолок упёрлись 66. Какова доля упёршихся запусков в процентах?'
  explanation: 66/240 = 27.5%, это выше порога 15%, значит правило сработало и пора переходить к агенту. Смысл записанного заранее порога в том, что решение принимается арифметикой по логам, а не спором о том, «часто ли» упирается потолок.
