- concept: в многораундовом цикле контекст растёт монотонно, поэтому порог сжатия ставят с запасом на следующий круг
  question: 'Оркестратор работает циклами: каждый круг добавляет в контекст ответы воркеров и не удаляет прежние. Объясни своими словами, почему решение о сжатии истории принимают до того, как контекст упрётся в предел окна.'
  explanation: 'Практически: если каждый круг стоит примерно 42k токенов, порог сжатия ставится не в нескольких тысячах от предела, а минимум за один круг до него. Иначе система ломается ровно в момент, когда работа ещё не закончена.'
  kind: open
  reference: 'Контекст в таком цикле только растёт: то, что уже лежит, не исчезает, а каждый новый круг докладывает сверху. Значит, момент «места ровно хватило» означает, что на следующий круг места нет вовсе — вызов оборвётся посреди работы. Кроме того, сжимать поздно дороже: до самого срабатывания раздутый контекст оплачивается на каждом вызове и ухудшает выборку нужного. Поэтому порог ставят с запасом, рассчитанным на объём одного следующего круга, а не на остаток до предела.'
  id: 030-kontekstbudget-3
  fingerprint: 71e110af
