- concept: реальный бюджет контекста — окно минус несжимаемые фиксированные части, а не номинальный размер окна
  question: Окно модели — 128k токенов. Системный промпт вместе с определениями инструментов занимает 22k, исходное задание и подложенные документы — 14k. Оркестратор запускает 7 воркеров, каждый возвращает по 6k токенов. Сколько токенов останется свободно после того, как все ответы воркеров лягут в контекст?
  explanation: '7 × 6k = 42k на ответы воркеров. 128 − 22 − 14 − 42 = 50k. Из номинального окна сразу вычитаются части, которые нельзя ни выкинуть, ни сжать (системный промпт, схемы инструментов): планировать надо от остатка, а не от 128k.'
  kind: numeric
  answer: 50
  tolerance: 0.5
  id: 030-kontekstbudget-1
  fingerprint: 6aa3f4e2
- concept: 'критерий «влезло в окно» недостаточен: точность выборки нужного падает и цена растёт задолго до предела'
  question: Инженер добавляет в контекст ещё три справочных документа. Суммарно всё умещается в окно с запасом. Почему этого недостаточно, чтобы считать решение бесплатным?
  explanation: Заполнение окна — не двоичное «влезло / ошибка». Деградация качества начинается задолго до предела, а каждый удержанный токен уходит в оплату при каждом обращении к модели. Поэтому вопрос ставится не «поместится ли», а «стоит ли это место».
  kind: choice
  options:
    - Модель откажется отвечать, если контекст заполнен больше чем наполовину
    - Точность выборки нужного фрагмента падает по мере роста доли нерелевантных токенов, а сам объём оплачивается на каждом вызове, а не один раз
    - Документы придётся переиндексировать в векторной базе перед каждым вызовом
    - Токены сверх половины окна тарифицируются по двойной ставке
  correct: 1
