- concept: 'голосование и evaluator-optimizer улучшают качество одного ответа разными механизмами: N независимых прогонов за один раунд против последовательного цикла с обратной связью'
  question: И голосование (форма parallelization), и evaluator-optimizer нацелены на то, чтобы поднять качество одного ответа. Объясни своими словами, чем они отличаются по механизму, по числу вызовов и по латентности.
  explanation: 'Ключ в наличии обратной связи. Параллельные прогоны друг о друге не знают — отсюда фиксированная цена и один раунд ожидания. Evaluator-optimizer (обобщённый Self-Refine) кормит критику обратно в генератор, поэтому это цепочка с циклом: латентность суммируется, а бюджет вызовов приходится ограничивать явно.'
  kind: open
  reference: 'Голосование: N независимых прогонов одного промпта запускаются одновременно, ни один не видит остальных, обратной связи нет; качество растёт за счёт агрегации разброса. Стоимость N вызовов известна заранее, латентность — один раунд (максимум по прогонам). Evaluator-optimizer: генератор предлагает ответ, оценщик его критикует, критика возвращается в генератор, цикл повторяется до прохождения проверки. Вызовы строго последовательны, каждый следующий видит предыдущий, поэтому латентность складывается, а число раундов заранее не фиксировано — его ограничивают вручную (лимит итераций). Голосование берёт лучшее из независимых попыток, evaluator-optimizer чинит одну попытку направленной обратной связью.'
  id: 016-checkparallel-3
  fingerprint: afcbbb66
