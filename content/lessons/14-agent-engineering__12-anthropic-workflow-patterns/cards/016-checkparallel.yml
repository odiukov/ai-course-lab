- concept: 'голосование даёт выигрыш только при недетерминированной выборке: при temperature 0 N прогонов одного промпта совпадают'
  question: 'Инженер строит голосование: один промпт, 7 прогонов, агрегация большинством. Все запросы идут с temperature 0 и одинаковым контекстом. Что получится?'
  explanation: 'Голосование ловит разброс выборки: разные прогоны идут по разным траекториям и ошибаются в разных местах, поэтому большинство надёжнее одиночного ответа. Убрал источник разброса — платишь семикратную цену за один и тот же ответ. Разброс дают ненулевая temperature либо варьирование формулировки промпта.'
  kind: choice
  options:
    - 7 практически одинаковых ответов — платим за 7 вызовов, информации как от одного
    - 7 разных ответов, потому что модель всё равно случайна на каждом вызове
    - 'Ошибка агрегации: большинство нельзя посчитать при чётном числе вариантов'
  correct: 0
