- concept: 'воркфлоу на open-ended задаче ломается неполнотой ответа, а не ростом цены: фиксированный граф обрывает работу там, где по данным нужно было продолжать'
  question: Задачу «собери всё, что известно про поставщика, и остановись, когда картина сложится» зашили в воркфлоу из 6 фиксированных шагов поиска и прогнали на 30 поставщиках. Какой режим отказа тут ожидаем и почему он опаснее простого замедления?
  explanation: Ключ — что именно ломается. Цена и латентность у воркфлоу как раз предсказуемы; ценой предсказуемости он платит на задачах с неизвестной длиной, где обрыв цепочки маскируется под нормальный ответ.
  kind: open
  reference: 'Граф задаёт число шагов заранее, а задача задаёт условие остановки по содержанию. На поставщиках, где всё находится сразу, лишние шаги просто тратят вызовы. На поставщиках, где новая находка порождает новый запрос, воркфлоу останавливается на шестом шаге посреди цепочки и возвращает уверенный, но неполный ответ — без сигнала, что работа не доделана. Это хуже замедления: пропуск не виден ни в логе, ни в формате результата, тогда как перерасход виден в счёте. Отсюда и признак: если условие завершения задаётся данными, а не счётчиком, графом его не закрыть.'
