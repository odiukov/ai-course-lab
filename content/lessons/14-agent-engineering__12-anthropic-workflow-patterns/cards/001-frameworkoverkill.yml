- concept: первый артефакт при отладке LLM-приложения — фактический текст, дошедший до модели
  question: Классификатор обращений на базе LLM массово ставит один и тот же класс почти всем входам. Объясни своими словами, что нужно посмотреть в первую очередь и почему толщина абстракции над вызовом модели напрямую определяет стоимость этой проверки.
  explanation: 'Ключ: наблюдаемость промпта — не удобство, а главный отладочный артефакт. Каждый слой между вашим кодом и HTTP-запросом умножает время до этого артефакта, поэтому слой оправдан только тогда, когда даёт выигрыш больше этой постоянной платы.'
  kind: open
  reference: 'Смотреть надо на фактический текст запроса, ушедшего в модель (собранный промпт вместе с подставленным входом), а не на код сборки. Модель видит только эту строку, и почти все такие сбои — склеенная не та инструкция, потерянная подстановка, обрезанный вход, перепутанный порядок примеров — видны прямо в ней. При прямом вызове API строка печатается одной командой. Во фреймворке итоговый промпт собирается из нескольких шаблонов, разложенных по разным файлам и слоям, поэтому получение той же строки превращается в отдельное расследование. Это и есть цена абстракции: она платится не при сборке системы, а каждый раз при отладке.'
  id: 001-frameworkoverkill-2
  fingerprint: 3869c4cb
