- concept: роутер принимает решение один раз на входе, поэтому не покрывает задачи, где ветвление нужно после каждого результата инструмента
  question: 'Поиск по документам: ответ может лежать в одном файле, а может тянуть цепочку ссылок неизвестной глубины. Почему роутер (классификация запроса и выбор обработчика) не решает эту задачу?'
  explanation: 'Решение роутера принимается на входе, когда данных о глубине ссылок ещё нет. Здесь же нужно решение после каждого возврата инструмента: «нашлась новая ссылка — идём дальше» или «хватит». Это цикл с решением внутри, а не однократная развилка. Оркестратор ветвит на ходу, но потолок вызовов у него всё равно задан кодом.'
  kind: choice
  options:
    - Роутер не умеет вызывать инструменты, только выбирать промпт
    - Роутер классифицирует один раз, до того как получен хоть один результат поиска, и потом уже не пересматривает выбор
    - Роутер всегда дороже агента по числу вызовов модели
    - Роутер требует размеченного датасета категорий, которого в поиске нет
