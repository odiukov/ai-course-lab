- concept: 'в новом домене порядок работы: сначала агент как разведка, потом кодификация повторяющейся траектории в воркфлоу'
  question: Домен новый, правильная последовательность шагов неизвестна. Расставь порядок работы по рекомендации Anthropic.
  explanation: 'Воркфлоу нельзя нарисовать до того, как знаешь граф. Агент здесь работает как разведка: его траектории — это данные о том, какой граф на самом деле нужен. Если на прогонах стабильно выходит один и тот же набор шагов, воркфлоу дешевле, предсказуемее по цене и проще в отладке.'
  kind: order
  items:
    - Собрать агента с нужными инструментами и минимумом жёстких ограничений
    - Прогнать его на серии реальных задач домена и залогировать фактические траектории
    - Найти шаги, которые повторяются от запуска к запуску
    - Заменить агента фиксированным воркфлоу из этих шагов и оставить агента только для остатка
