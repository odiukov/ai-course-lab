- concept: 'evaluator-optimizer применим только там, где критерий приёмки формулируется явно: без него у цикла нет условия остановки'
  question: Пара «генератор + оценщик» крутится, пока оценщик не пропустит результат. Какое свойство задачи обязано выполняться, чтобы этот паттерн вообще работал, и что происходит, если оно не выполняется?
  explanation: 'Evaluator-optimizer — обобщённый Self-Refine: обратная связь оценщика идёт на вход следующего вызова генератора. Работает он ровно там, где «прошло/не прошло» проверяемо. На задачах вкусового качества цикл превращается в трату вызовов без гарантии сходимости.'
  kind: open
  reference: 'Нужен явно формулируемый критерий приёмки, который оценщик может применить к тексту-кандидату: компилируется ли код, проходят ли тесты, сохранены ли все факты оригинала, соблюдён ли формат. Критерий задаёт условие остановки цикла. Если критерия нет и оценщик выносит вердикт по вкусу, цикл либо не сходится (замечания меняются от раунда к раунду), либо останавливается произвольно; итерации при этом стоят денег и латентности, но качество не растёт монотонно. Поэтому в реализацию всегда ставят и второе условие выхода — жёсткий лимит числа раундов.'
