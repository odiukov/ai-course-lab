- concept: у воркфлоу стоимость запроса задана графом и одинакова для лёгкого и тяжёлого входа
  question: Задача решена воркфлоу-цепочкой из 7 вызовов LLM, каждый вызов стоит 1.5 цента. На вход подали самый тяжёлый документ из корпуса. Сколько центов будет стоить обработка этого запроса?
  explanation: 'Число вызовов задаёт граф, написанный инженером, а не модель: 7 × 1.5 = 10.5 центов и для лёгкого, и для тяжёлого входа. Сложность входа влияет на качество ответа, но не на количество шагов — поэтому цена запроса известна до его запуска.'
  kind: numeric
  answer: 10.5
  tolerance: 0.01
  id: 022-workflowbeats-1
  fingerprint: 1e6c7bca
- concept: у агента нет верхней границы числа вызовов, поэтому цену запроса нельзя назвать заранее
  question: 'Команда сравнивает две реализации одной задачи: воркфлоу из 9 фиксированных вызовов и агента с теми же инструментами. Замеры показали, что средняя стоимость запроса у агента ниже. Почему этого недостаточно, чтобы гарантировать бюджет на 50 000 запросов в сутки?'
  explanation: 'Bounded cost — свойство графа, а не свойство средней метрики. У воркфлоу максимум равен минимуму: 9 вызовов всегда. Агент сам решает, сколько раз обратиться к модели и инструментам, поэтому распределение стоимости имеет хвост, и планировать бюджет приходится по неизвестному максимуму.'
  kind: choice
  options:
    - У агента число вызовов определяет модель, поэтому верхняя граница стоимости неизвестна — отдельные запросы могут стоить в разы больше среднего
    - Агент использует более дорогие модели, чем воркфлоу, и средняя цена измерена неверно
    - Средняя стоимость всегда занижена, потому что не учитывает стоимость входных токенов
    - Агент не умеет кэшировать промпты, а воркфлоу умеет
  correct: 0
  id: 022-workflowbeats-2
  fingerprint: b1b161b5
- concept: compliance-bound задачи требуют графа, который аудитор читает до запуска, а не восстанавливает из траекторий
  question: Регулятор требует до внедрения получить полное описание того, какие вызовы модели и в каком порядке система делает при обработке заявки. Что делает воркфлоу подходящим выбором для такой задачи?
  explanation: 'Compliance-bound задача упирается не в цену и не в качество, а в проверяемость. У воркфлоу объект проверки — сам код графа. У агента такого артефакта нет: последовательность шагов рождается на исполнении, и аудитору пришлось бы выводить её из собранных траекторий, которые покрывают только те входы, что уже случились.'
  kind: choice
  options:
    - Граф шагов написан инженером и существует как артефакт до запуска — его можно передать на проверку целиком
    - Воркфлоу логирует все свои вызовы, а агент логировать их не может
    - Воркфлоу использует детерминированные модели с temperature 0, поэтому его вывод воспроизводим
    - У воркфлоу меньше вызовов LLM, а регуляторы ограничивают их число
  correct: 0
  id: 022-workflowbeats-3
  fingerprint: 1db892f2
