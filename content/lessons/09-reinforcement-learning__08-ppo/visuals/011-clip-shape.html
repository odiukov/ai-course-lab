<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма PPO-цели внутри и за пределами коридора</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #58657a;
      --axis: #344054;
      --grid: #cbd5e1;
      --band: #e3edff;
      --positive: #1769e0;
      --negative: #c43d62;
      --ghost: #7b8799;
      --border: #d5dce8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #171f2d;
        --ink: #eef3fb;
        --muted: #b2bfd2;
        --axis: #d0d8e6;
        --grid: #465267;
        --band: #203a61;
        --positive: #6aa8ff;
        --negative: #ff7f9f;
        --ghost: #9aa8bb;
        --border: #344056;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      padding: 14px 20px 4px;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    #fallback {
      padding: 16px 20px 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
    }

    #fallback.hidden {
      display: none;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .axis,
    .tick,
    .boundary,
    .curve,
    .ghost,
    .legend-line {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--axis);
    }

    .tick {
      stroke: var(--axis);
    }

    .boundary {
      stroke: var(--grid);
      stroke-dasharray: 6 6;
    }

    .curve.positive,
    .legend-line.positive {
      stroke: var(--positive);
    }

    .curve.negative {
      stroke: var(--negative);
    }

    .ghost,
    .legend-line.ghost {
      stroke: var(--ghost);
      stroke-dasharray: 9 7;
    }

    .band {
      fill: var(--band);
    }

    .arrow {
      fill: var(--axis);
    }

    .joint.positive {
      fill: var(--positive);
    }

    .joint.negative {
      fill: var(--negative);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
    }

    .panel-title {
      font-size: 18px;
      font-weight: 720;
    }

    .band-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .tick-label,
    .axis-label,
    .legend-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .plateau-label {
      font-size: 14px;
      font-weight: 680;
    }

    .positive-text {
      fill: var(--positive);
    }

    .negative-text {
      fill: var(--negative);
    }

    .summary {
      font-size: 15px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Форма PPO-цели внутри и за пределами коридора</h1>
    <div id="fallback">
      Два графика: при Aₜ = +3 плоская часть находится справа от 1,2,
      а при Aₜ = −3 — слева от 0,8.
    </div>
    <svg
      id="chart"
      viewBox="0 0 960 450"
      width="960"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Клиппованная surrogate-цель PPO</title>
      <desc id="svg-desc">
        Два графика цели по отношению вероятностей от 0,5 до 1,5.
        Для положительного преимущества линия становится горизонтальной
        после 1,2, а для отрицательного — горизонтальна до 0,8.
      </desc>
    </svg>
  </main>

  <script>
    const DATA = Object.freeze({
      canvas: [960, 450],
      origin: [0, 450],
      scale: [96, 45],
      metrics: {
        labelGap: 8,
        axisStroke: 2,
        curveStroke: 4,
        guideStroke: 2,
        dotRadius: 5
      },
      panels: [
        {
          title: ["Aₜ = +3", 2.85, 8.55, "middle", "panel-title positive-text"],
          band: [2.15, 3.10, 3.55, 7.35],
          bandLabel: ["коридор ε = 0,2", 2.85, 7.70, "middle", "band-label"],
          axes: [
            [[1.05, 3.10], [4.90, 3.10]],
            [[1.05, 3.10], [1.05, 7.35]]
          ],
          arrows: [
            [[4.90, 3.10], [4.72, 3.22], [4.72, 2.98]],
            [[1.05, 7.35], [0.93, 7.17], [1.17, 7.17]]
          ],
          boundaries: [
            [[2.15, 3.10], [2.15, 7.35]],
            [[3.55, 3.10], [3.55, 7.35]]
          ],
          ghost: [
            [1.05, 4.10], [2.15, 4.92], [2.85, 5.45],
            [3.55, 6.00], [4.65, 6.85]
          ],
          curve: [
            [1.05, 4.10], [2.15, 4.92], [2.85, 5.45],
            [3.55, 6.00], [4.65, 6.00]
          ],
          joint: [3.55, 6.00, "positive"],
          ticks: [
            [1.05, "0,5"], [2.15, "0,8"], [2.85, "1"],
            [3.55, "1,2"], [4.65, "1,5"]
          ],
          labels: [
            ["цель", 1.05, 7.58, "middle", 0, 0, "axis-label"],
            ["rₜ", 4.90, 3.46, "end", 0, 0, "axis-label"],
            ["плоская крыша после 1,2", 4.10, 6.38, "middle", 0, 0,
              "plateau-label positive-text"]
          ],
          colorClass: "positive"
        },
        {
          title: ["Aₜ = −3", 7.15, 8.55, "middle", "panel-title negative-text"],
          band: [6.45, 3.10, 7.85, 7.35],
          bandLabel: ["коридор ε = 0,2", 7.15, 7.70, "middle", "band-label"],
          axes: [
            [[5.35, 3.10], [9.20, 3.10]],
            [[5.35, 3.10], [5.35, 7.35]]
          ],
          arrows: [
            [[9.20, 3.10], [9.02, 3.22], [9.02, 2.98]],
            [[5.35, 7.35], [5.23, 7.17], [5.47, 7.17]]
          ],
          boundaries: [
            [[6.45, 3.10], [6.45, 7.35]],
            [[7.85, 3.10], [7.85, 7.35]]
          ],
          ghost: [
            [5.35, 6.85], [6.45, 6.00], [7.15, 5.45],
            [7.85, 4.92], [8.95, 4.10]
          ],
          curve: [
            [5.35, 6.00], [6.45, 6.00], [7.15, 5.45],
            [7.85, 4.92], [8.95, 4.10]
          ],
          joint: [6.45, 6.00, "negative"],
          ticks: [
            [5.35, "0,5"], [6.45, "0,8"], [7.15, "1"],
            [7.85, "1,2"], [8.95, "1,5"]
          ],
          labels: [
            ["цель", 5.35, 7.58, "middle", 0, 0, "axis-label"],
            ["rₜ", 9.20, 3.46, "end", 0, 0, "axis-label"],
            ["плоский участок до 0,8", 5.90, 6.38, "middle", 0, 0,
              "plateau-label negative-text"]
          ],
          colorClass: "negative"
        }
      ],
      tickShape: [3.10, 2.94, 2.68],
      legend: [
        {
          line: [[1.20, 1.45], [1.85, 1.45]],
          className: "legend-line positive",
          text: ["Lᴄʟɪᴘ — итог min", 2.00, 1.45, "start", 8, 5, "legend-label"]
        },
        {
          line: [[4.00, 1.45], [4.65, 1.45]],
          className: "legend-line ghost",
          text: ["rₜAₜ без ограничения", 4.80, 1.45, "start", 8, 5, "legend-label"]
        }
      ],
      summary: [
        "Внутри коридора линии совпадают; снаружи min гасит выгоду только с одной стороны",
        5.00, 0.55, "middle", 0, 0, "summary"
      ]
    });

    const origin = Object.freeze(DATA.origin);
    const scale = Object.freeze(DATA.scale);
    const [originX, originY] = origin;
    const [scaleX, scaleY] = scale;
    const sx = x => originX + x * scaleX;
    const sy = y => originY - y * scaleY;

    try {
      const svg = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const element = (name, attrs = {}) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };

      const line = (points, className, strokeWidth) => {
        const [[x1, y1], [x2, y2]] = points;
        return element("line", {
          x1: sx(x1), y1: sy(y1),
          x2: sx(x2), y2: sy(y2),
          class: className,
          "stroke-width": strokeWidth
        });
      };

      const polyline = (points, className, strokeWidth) =>
        element("polyline", {
          points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
          class: className,
          "stroke-width": strokeWidth,
          "stroke-linejoin": "round",
          "stroke-linecap": "round"
        });

      const polygon = (points, className) =>
        element("polygon", {
          points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
          class: className
        });

      const text = ([content, x, y, anchor, dx, dy, className]) => {
        const node = element("text", {
          x: sx(x) + dx,
          y: sy(y) + dy,
          "text-anchor": anchor,
          class: className
        });
        node.textContent = content;
        return node;
      };

      const rectangle = ([x1, y1, x2, y2], className) =>
        element("rect", {
          x: sx(x1),
          y: sy(y2),
          width: sx(x2) - sx(x1),
          height: sy(y1) - sy(y2),
          class: className
        });

      const fragment = document.createDocumentFragment();

      DATA.panels.forEach(panel => {
        const group = element("g");

        group.append(
          rectangle(panel.band, "band"),
          text(panel.title),
          text(panel.bandLabel)
        );

        panel.boundaries.forEach(points =>
          group.append(line(points, "boundary", DATA.metrics.guideStroke))
        );

        panel.axes.forEach(points =>
          group.append(line(points, "axis", DATA.metrics.axisStroke))
        );

        panel.arrows.forEach(points =>
          group.append(polygon(points, "arrow"))
        );

        panel.ticks.forEach(([x, label]) => {
          group.append(
            line(
              [[x, DATA.tickShape[0]], [x, DATA.tickShape[1]]],
              "tick",
              DATA.metrics.axisStroke
            ),
            text([
              label, x, DATA.tickShape[2], "middle",
              0, DATA.metrics.labelGap, "tick-label"
            ])
          );
        });

        group.append(
          polyline(panel.ghost, "ghost", DATA.metrics.guideStroke),
          polyline(
            panel.curve,
            `curve ${panel.colorClass}`,
            DATA.metrics.curveStroke
          ),
          element("circle", {
            cx: sx(panel.joint[0]),
            cy: sy(panel.joint[1]),
            r: DATA.metrics.dotRadius,
            class: `joint ${panel.joint[2]}`
          })
        );

        panel.labels.forEach(label => group.append(text(label)));
        fragment.append(group);
      });

      DATA.legend.forEach(item => {
        fragment.append(
          line(item.line, item.className, DATA.metrics.guideStroke),
          text(item.text)
        );
      });

      fragment.append(text(DATA.summary));
      svg.append(fragment);
      fallback.classList.add("hidden");
    } catch (error) {
      const svg = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      svg.replaceChildren();
      fallback.classList.remove("hidden");
      fallback.textContent =
        "Схема должна была показать два графика surrogate по rₜ от 0,5 до 1,5: " +
        "при Aₜ = +3 — плоскую крышу после 1,2, при Aₜ = −3 — плоский участок до 0,8.";
    }
  </script>
</body>
</html>
