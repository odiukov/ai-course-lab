<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Из чего складываются 2536 ключей</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5d6672; --axis:#8a929e;
    --full:#b9c0cb; --c1:#2f7fbf; --c2:#c9782a; --c3:#3f9b6d; --dash:#98a1ad;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181c; --fg:#e8ecf1; --muted:#9aa4b1; --axis:#6d7684;
      --full:#4a515c; --c1:#5aa9e6; --c2:#e6a35a; --c3:#63c britanni;
    }
  }
  @media (prefers-color-scheme: dark){
    :root{ --c3:#63c295; --dash:#6d7684; }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--muted);line-height:1.5;}
  text{fill:var(--fg);}
  .t-muted{fill:var(--muted);}
  .ln{stroke:var(--axis);fill:none;}
</style>
<div class="wrap">
  <h2>Из чего складываются 2536 ключей</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы -------------------------------------------------
    var D = {
      axisMax: 64000,
      ticks: [0, 16000, 32000, 48000, 64000],
      colW: 14000,
      zoom: 20,
      full:   { x: 4000,  value: 64000, top: "64000 ключей", cap: "полное attention" },
      nsa:    { x: 28000, cap: "NSA" },
      blow:   { x: 56000, cap: "тот же столбик" },
      parts: [
        { name: "сжатая",    value: 1000, color: "var(--c1)" },
        { name: "выбранная", value: 1024, color: "var(--c2)" },
        { name: "окно",      value: 512,  color: "var(--c3)" }
      ],
      labelX:  72000,
      axisEnd: 72000,
      titleAt: { x: -11000, y: 32000 },
      capY:    -3200,
      sumY:    -6400,
      sumText: "1000 + 1024 + 512 = 2536"
    };

    // ---- один origin, один scale, одна пара sx/sy ----------------------
    var origin = { x: 90, y: 450 };
    var scale  = 0.00625;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    // пиксельные отступы подписей и толщины — единственные литералы ниже
    var PAD = 9, FS = 13, FSS = 12, LW = 1;

    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 780 500");
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("role", "img");

    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); } svg.appendChild(e); return e; }
    function line(x1,y1,x2,y2,extra){
      var a = { x1:sx(x1), y1:sy(y1), x2:sx(x2), y2:sy(y2),
                stroke:"var(--axis)", "stroke-width":LW };
      for(var k in (extra||{})) a[k] = extra[k];
      return el("line", a);
    }
    function box(x, y0, y1, fill){
      return el("rect", { x:sx(x), y:sy(y1), width:sx(x + D.colW) - sx(x),
                          height:sy(y0) - sy(y1), fill:fill });
    }
    function label(px, py, s, anchor, cls, size){
      var t = el("text", { x:px, y:py, "text-anchor":anchor,
                           "font-size":(size||FS), "class":(cls||"") });
      t.textContent = s; return t;
    }

    var bg = el("rect", { x:0, y:0, width:780, height:500, fill:"var(--bg)" });
    svg.insertBefore(bg, svg.firstChild);

    // ---- оси ------------------------------------------------------------
    line(0, 0, 0, D.axisMax);
    line(0, 0, D.axisEnd, 0);
    D.ticks.forEach(function(t){
      line(0, t, -1200, t);
      label(sx(-1200) - PAD, sy(t) + 4, String(t), "end", "t-muted", FSS);
    });
    var ttl = label(sx(D.titleAt.x), sy(D.titleAt.y), "ключей на запрос",
                    "middle", "t-muted", FSS);
    ttl.setAttribute("transform",
      "rotate(-90 " + sx(D.titleAt.x) + " " + sy(D.titleAt.y) + ")");

    // ---- столбик полного attention --------------------------------------
    box(D.full.x, 0, D.full.value, "var(--full)");
    var fullMid = (sx(D.full.x) + sx(D.full.x + D.colW)) / 2;
    label(fullMid, sy(D.full.value) - PAD, D.full.top, "middle", "", FS);
    label(fullMid, sy(D.capY), D.full.cap, "middle", "t-muted", FSS);

    // ---- столбик NSA в том же масштабе ----------------------------------
    var base = 0, total = 0, i;
    for(i = 0; i < D.parts.length; i++){
      box(D.nsa.x, base, base + D.parts[i].value, D.parts[i].color);
      base += D.parts[i].value;
    }
    total = base;
    var nsaMid = (sx(D.nsa.x) + sx(D.nsa.x + D.colW)) / 2;
    label(nsaMid, sy(total) - PAD, total + " ключей", "middle", "", FS);
    label(nsaMid, sy(D.capY), D.nsa.cap, "middle", "t-muted", FSS);

    // ---- он же, растянутый в D.zoom раз ---------------------------------
    line(D.nsa.x + D.colW, total, D.blow.x, total * D.zoom,
         { stroke:"var(--dash)", "stroke-dasharray":"4 4" });
    line(D.nsa.x + D.colW, 0, D.blow.x, 0,
         { stroke:"var(--dash)", "stroke-dasharray":"4 4" });

    base = 0;
    for(i = 0; i < D.parts.length; i++){
      var p = D.parts[i];
      var hi = base + p.value * D.zoom;
      box(D.blow.x, base, hi, p.color);
      label(sx(D.labelX), sy((base + hi) / 2) + 4,
            p.name + " — " + p.value, "start", "", FS);
      base = hi;
    }
    var blowMid = (sx(D.blow.x) + sx(D.blow.x + D.colW)) / 2;
    label(blowMid, sy(total * D.zoom) - PAD,
          D.blow.cap + ", ×" + D.zoom, "middle", "t-muted", FSS);
    label(blowMid, sy(D.capY), "три ветки", "middle", "t-muted", FSS);
    label(blowMid, sy(D.sumY), D.sumText, "middle", "", FS);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна была показать: столбик ' +
      'полного attention — 64000 ключей на запрос, рядом столбик NSA — ' +
      '2536 ключей (в 25 раз ниже), и тот же столбик NSA, увеличенный в ' +
      '20 раз, разбитый снизу вверх на три части: сжатая ветка 1000, ' +
      'выбранная 1024, оконная 512. 1000 + 1024 + 512 = 2536.</p>';
  }
})();
</script>
</html>
