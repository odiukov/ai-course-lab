- concept: симметричная матрица равна своей транспонированной матрице
  question: Какое равенство является необходимым и достаточным условием симметричности матрицы A?
  explanation: 'Транспонирование меняет местами строки и столбцы. Матрица симметрична тогда и только тогда, когда эта операция её не изменяет: A = Aᵀ.'
  kind: choice
  options:
    - A = Aᵀ
    - A = −Aᵀ
    - AAᵀ = I
  correct: 0
  id: 027-symmetry-teoriya-1
  fingerprint: '60701e27'
- concept: симметричная матрица обязательно является квадратной
  question: Объясни своими словами, почему прямоугольная неквадратная матрица не может быть симметричной.
  explanation: Для равенства A = Aᵀ обе стороны должны иметь одинаковую форму. Это возможно только при равном числе строк и столбцов.
  kind: open
  reference: При транспонировании число строк и число столбцов меняются местами. У неквадратной матрицы после этого изменяется форма, поэтому она не может совпасть с исходной матрицей.
  id: 027-symmetry-teoriya-2
  fingerprint: 7bd38487
