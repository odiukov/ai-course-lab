- concept: двоичная маска выборочно подавляет компоненты при поэлементном умножении
  question: Что происходит с вектором при поэлементном умножении на двоичную маску?
  explanation: В произведении Адамара каждая компонента взаимодействует только с соответствующей позицией маски. Поэтому маска может выборочно подавлять значения, не смешивая соседние позиции.
  kind: choice
  options:
    - Все компоненты смешиваются посредством скалярных произведений
    - Компоненты переставляются в порядке, заданном маской
    - Отключённые маской компоненты исчезают, а включённые сохраняются
  correct: 2
  id: 007-hadamard-teoriya-1
  fingerprint: 964fead7
- concept: гейт независимо масштабирует соответствующую ему компоненту
  question: Заполни пропуск в формуле поэлементного применения гейта к компонентам вектора.
  explanation: Компонента гейта g_i масштабирует только соответствующую компоненту x_i. Промежуточный коэффициент позволяет ослабить сигнал, не отключая его полностью.
  kind: cloze
  template: y_i = x_i \cdot ___
  answer: g_i
  accept:
    - g[i]
    - gᵢ
    - gate_i
  id: 007-hadamard-teoriya-2
  fingerprint: '037013e2'
- concept: dropout реализуется случайной поэлементной маской во время обучения
  question: Объясни своими словами, как dropout использует поэлементное умножение во время обучения нейросети.
  explanation: Dropout не смешивает активации между позициями. Он случайно выбирает, какие из них временно подавить, и применяет этот выбор как поэлементную маску.
  kind: open
  reference: 'Dropout умножает активации на случайно сгенерированную маску: часть позиций подавляется, а остальные продолжают передавать сигнал. Маска меняется во время обучения.'
  id: 007-hadamard-teoriya-3
  fingerprint: 78cc7864
