- concept: рекурсивное разложение определителя по минорам
  question: Расположите действия алгоритма разложения определителя по строке в правильном порядке.
  explanation: Для каждого элемента строки строится минор без его строки и столбца. Определитель минора вычисляется тем же способом, а результаты входят в сумму с чередующимися знаками.
  kind: order
  items:
    - Выбрать очередной элемент строки разложения и определить знак его алгебраического дополнения
    - Удалить строку и столбец выбранного элемента, получив минор
    - Рекурсивно вычислить определитель минора до базового случая
    - Умножить элемент на знак и определитель минора, затем сложить полученные слагаемые
  id: 030-determinant-bolshe-1
  fingerprint: 11d8f020
- concept: факториальный рост стоимости рекурсивного разложения по минорам
  question: Почему рекурсивное разложение по минорам непрактично для определителей больших матриц?
  explanation: На каждом уровне создаётся несколько миноров, и каждый из них снова разветвляет вычисление. Например, матрица 4x4 порождает 12 базовых определителей 2x2, а дальнейший рост быстро становится факториальным.
  kind: choice
  options:
    - Число рекурсивных вычислений растёт примерно факториально с размером матрицы
    - Алгоритм применим только к диагональным матрицам
    - Каждый рекурсивный вызов увеличивает размер минора
    - Алгоритм всегда возвращает приближённое значение
  correct: 0
