- concept: диагональный элемент матрицы ковариаций равен дисперсии соответствующего признака
  question: Заполни пропуск в формуле для диагонального элемента матрицы ковариаций.
  explanation: Ковариация признака с самим собой измеряет его собственный разброс и совпадает с его дисперсией. Поэтому на главной диагонали матрицы ковариаций стоят дисперсии признаков.
  kind: cloze
  template: cov(x, x) = ___
