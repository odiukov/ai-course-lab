- concept: learning rate поэлементно масштабирует градиенты
  question: Градиент одного из весов равен -7, а learning rate — 0.04. Чему равен масштабированный градиент?
  explanation: При умножении градиента на learning rate получаем 0.04 · (-7) = -0.28. Так масштабируется каждый элемент вектора или матрицы градиентов.
  kind: numeric
  answer: -0.28
  tolerance: 0.001
  id: 006-skalyar-1
  fingerprint: 6dbc7484
- concept: положительный скаляр меняет масштаб вектора, сохраняя его форму, направление и пропорции компонентов
  question: Объясни своими словами, что изменится и что сохранится при умножении вектора градиентов на положительный learning rate.
  explanation: Один положительный скаляр одинаково масштабирует все компоненты. Поэтому соотношения между ними и направление вектора не меняются, а величина шага становится меньше или больше.
  kind: open
  reference: Каждая компонента умножится на одно и то же число. Форма вектора, его направление и отношения между компонентами сохранятся, а длина изменится пропорционально learning rate.
  id: 006-skalyar-2
  fingerprint: a1896667
