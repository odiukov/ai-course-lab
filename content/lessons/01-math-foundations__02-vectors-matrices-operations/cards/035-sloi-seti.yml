- concept: полносвязный слой последовательно выполняет линейное преобразование, добавление bias и активацию
  question: Расположи операции прямого прохода полносвязного слоя в правильном порядке.
  explanation: Сначала вычисляется W @ x, затем к предактивации добавляется b, после чего применяется ReLU. Это соответствует выражению relu(W @ x + b).
  kind: order
  items:
    - Вычислить матричное произведение весов и входного вектора
    - Прибавить вектор bias
    - Поэлементно применить ReLU
