- concept: результат умножения матрицы на вычисленную обратную проверяют с учётом погрешности чисел с плавающей точкой
  question: При проверке обратной матрицы произведение B @ B⁻¹ содержит 0.999999999 вместо единицы и очень малые ненулевые элементы вместо нулей. Объясни, означает ли это ошибку и как корректно проверить результат.
  explanation: Операции с дробными числами дают погрешность округления. Поэтому корректная проверка устанавливает, достаточно ли близко произведение к единичной матрице.
  kind: open
  reference: Такие малые отклонения обычно возникают из-за округления чисел с плавающей точкой. Произведение нужно сравнивать с единичной матрицей приближённо, задав небольшой допуск, а не требовать точного равенства элементов.
