- concept: нулевой определитель означает потерю информации при линейном преобразовании
  question: Почему для квадратной матрицы с нулевым определителем невозможно построить обратную матрицу?
  explanation: При нулевом определителе преобразование схлопывает хотя бы одно направление. Несколько разных входов могут дать один выход, поэтому обратное преобразование не может однозначно восстановить исходные данные.
  kind: choice
  options:
    - Преобразование переводит разные входные векторы в один результат, поэтому однозначно восстановить вход нельзя
    - Произведение такой матрицы на любой вектор всегда содержит только отрицательные компоненты
    - Обратная матрица существует, но обязательно имеет больше строк
    - Нулевой определитель запрещает только приближённые вычисления
