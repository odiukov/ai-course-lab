- concept: матрица линейного слоя имеет форму «размер выхода × размер входа»
  question: Заполни пропуск в формуле формы матрицы весов линейного слоя.
  explanation: Каждая строка матрицы вычисляет одну выходную характеристику и должна содержать по одному весу для каждой входной компоненты. Поэтому строк столько, сколько выходов, а столбцов — сколько входов.
  kind: cloze
  template: Если x имеет размер d_in, а y = W @ x должен иметь размер d_out, то shape(W) = ___.
  answer: d_out × d_in
  accept:
    - d_out x d_in
    - (d_out, d_in)
    - d_out*d_in
