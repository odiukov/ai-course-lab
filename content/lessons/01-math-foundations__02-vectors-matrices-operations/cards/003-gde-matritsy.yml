- concept: длина вектора после разворачивания изображения равна числу его пикселей
  question: Одноканальное изображение размером 32 × 32 пикселя разворачивают в вектор. Сколько компонентов будет в этом векторе?
  explanation: 'Каждый пиксель становится одной компонентой вектора, поэтому его длина равна произведению высоты и ширины изображения: 32 × 32 = 1024.'
  kind: numeric
  answer: 1024
  tolerance: 0.1
  id: 003-gde-matritsy-1
  fingerprint: 4a3653a9
- concept: размер embedding является инженерным выбором с компромиссом между ёмкостью и вычислительной стоимостью
  question: Входной вектор оставили без изменений, а размер embedding увеличили с 96 до 192. Какое последствие наиболее вероятно?
  explanation: Размер embedding задаёт число выходных характеристик слоя. Его увеличение добавляет строки в матрицу весов, повышая потенциальную выразительность представления вместе с затратами памяти и вычислений.
  kind: choice
  options:
    - Слой сможет хранить более подробное представление, но потребует больше весов и вычислений
    - Количество исходных пикселей автоматически уменьшится
    - Размер embedding никак не влияет на форму матрицы весов
    - Новый размер embedding будет определяться только разрешением изображения
  correct: 0
