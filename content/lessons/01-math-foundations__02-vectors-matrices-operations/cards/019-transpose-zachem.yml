- concept: при транспонировании произведения порядок множителей обращается
  question: Заполни пропуск в тождестве для транспонирования произведения матриц.
  explanation: 'Транспонировать нужно каждый множитель, одновременно изменив их порядок: (AB)^T = B^T A^T. Выражение A^T B^T в общем случае неверно.'
  kind: cloze
  template: (AB)^T = ___
  answer: B^T A^T
