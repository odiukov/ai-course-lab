- concept: двойное транспонирование возвращает исходную матрицу
  question: Объясни своими словами, почему повторное транспонирование матрицы возвращает исходную матрицу.
  explanation: 'Транспонирование лишь переставляет индексы местами. Если выполнить эту перестановку повторно, исходный порядок индексов восстановится: (Aᵀ)ᵀ = A.'
  kind: open
  reference: При первом транспонировании индексы каждого элемента меняются местами, а при повторном — меняются обратно. Поэтому каждый элемент возвращается на исходную позицию.
  id: 017-transpose-teoriya-2
