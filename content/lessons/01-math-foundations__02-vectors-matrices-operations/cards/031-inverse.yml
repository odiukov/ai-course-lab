- concept: вычисление элемента обратной матрицы по формуле через определитель
  question: Для матрицы A = [[3, 5], [7, 13]] чему равен левый верхний элемент обратной к A матрицы?
  explanation: Левый верхний элемент обратной матрицы равен d / (ad − bc). Здесь 13 / (3·13 − 5·7) = 13 / 4 = 3.25.
  kind: numeric
  answer: 3.25
  tolerance: 0.0001
  id: 031-inverse-1
  fingerprint: 841f27d9
- concept: применение обратной матрицы восстанавливает исходный вектор после обратимого линейного преобразования
  question: Пусть y = Ax, а B — обратная к A матрица. Как выразить x через y?
  explanation: 'Нужно умножить результат слева на обратную матрицу: By = BAx = Ix = x. Поэтому исходный вектор восстанавливается как x = By.'
  kind: choice
  options:
    - x = By
    - x = Ay
    - x = (A + B)y
  correct: 0
  id: 031-inverse-2
  fingerprint: 149dab48
