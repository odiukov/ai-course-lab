<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Растяжение bias по строкам</title>
<style>
  :root{
    --bg:#fbfaf7; --panel:#ffffff; --ink:#1b2430; --muted:#5c6773;
    --line:#b9c0c8; --dash:#8d97a2;
    --c0:#1f6b46; --c1:#a8511a; --c2:#26548f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --panel:#1a2028; --ink:#e8edf3; --muted:#9aa6b2;
      --line:#4a545f; --dash:#7b8794;
      --c0:#6fd39b; --c1:#f0a463; --c2:#7fb3ee;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  figure{margin:0;padding:14px 12px 10px;max-width:780px;}
  figcaption{font-size:15px;font-weight:600;margin-bottom:6px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .cell{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
  .cell.ghost{stroke:var(--dash);stroke-dasharray:5 4}
  .num{font-size:17px;fill:var(--ink)}
  .op{font-size:22px;fill:var(--muted)}
  .lab{font-size:13px;fill:var(--muted)}
  .arr{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
  .head{fill:var(--muted)}
  .k0{fill:var(--c0)} .k1{fill:var(--c1)} .k2{fill:var(--c2)}
  .s0{stroke:var(--c0)} .s1{stroke:var(--c1)} .s2{stroke:var(--c2)}
  .fail{font-size:14px;color:var(--ink);padding:8px 0}
</style>
<figure>
  <figcaption>Растяжение bias по строкам</figcaption>
  <div id="fig"></div>
</figure>
<script>
(function(){
  var host = document.getElementById('fig');
  try{
    /* --- данные схемы --- */
    var A = [[1,2,3],[4,5,6]];
    var B = [10,20,30];
    var C = [[11,22,33],[14,25,36]];

    /* --- одно начало координат и один масштаб --- */
    var ORIGIN = {x:50, y:44};
    var SCALE  = {x:52, y:46};
    function sx(u){ return ORIGIN.x + u * SCALE.x; }
    function sy(v){ return ORIGIN.y + v * SCALE.y; }

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 780 285');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label',
      'Матрица 1,2,3 / 4,5,6 плюс строка 10,20,30, копируемая на обе строки, равно 11,22,33 / 14,25,36');

    function el(n,a){
      var e = document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]);
      return e;
    }
    function add(n,a,t){ var e=el(n,a); if(t!=null) e.textContent=t; svg.appendChild(e); return e; }

    /* ячейка занимает единичный квадрат сетки данных */
    function cell(x, y, value, colorKey, ghost){
      add('rect',{
        x:sx(x), y:sy(y),
        width: sx(x+1)-sx(x), height: sy(y+1)-sy(y),
        rx:4, class:'cell'+(ghost?' ghost':'')+(colorKey!=null?' s'+colorKey:'')
      });
      add('text',{
        x:sx(x+0.5), y:sy(y+0.5),
        'text-anchor':'middle','dominant-baseline':'central',
        class:'num'+(colorKey!=null?' k'+colorKey:'')
      }, value);
    }
    function block(rows, x0, y0, colored, ghost){
      for(var i=0;i<rows.length;i++)
        for(var j=0;j<rows[i].length;j++)
          cell(x0+j, y0+i, rows[i][j], colored?j:null, ghost);
    }

    /* --- блоки --- */
    block(A, 0, 2, false, false);                 /* матрица */
    block([B], 5, 0, true, false);                /* строка bias */
    block([B,B], 5, 2, true, true);               /* её копии */
    block(C, 10, 2, true, false);                 /* результат */

    add('text',{x:sx(3.6), y:sy(3), 'text-anchor':'middle','dominant-baseline':'central', class:'op'}, '+');
    add('text',{x:sx(9.0), y:sy(3), 'text-anchor':'middle','dominant-baseline':'central', class:'op'}, '=');

    /* --- стрелки копирования: ствол слева, две ветки вправо --- */
    add('polyline',{class:'arr', points:
      sx(5)+','+sy(0.5)+' '+sx(4.4)+','+sy(0.5)+' '+sx(4.4)+','+sy(3.5)});
    [2.5, 3.5].forEach(function(row){
      add('line',{class:'arr', x1:sx(4.4), y1:sy(row), x2:sx(4.78), y2:sy(row)});
      add('polygon',{class:'head', points:
        sx(4.95)+','+sy(row)+' '+
        sx(4.74)+','+sy(row-0.11)+' '+
        sx(4.74)+','+sy(row+0.11)});
    });

    /* --- подписи: у каждой свой якорь и своя сторона --- */
    add('text',{x:sx(6.5), y:sy(-0.28),'text-anchor':'middle',class:'lab'},
      'строка bias 1×3');
    add('text',{x:sx(4.25), y:sy(1.52),'text-anchor':'end',class:'lab'},
      'копируется на каждую строку');
    add('text',{x:sx(1.5), y:sy(4.34),'text-anchor':'middle',class:'lab'},
      'матрица 2×3');
    add('text',{x:sx(11.5), y:sy(4.34),'text-anchor':'middle',class:'lab'},
      'результат 2×3');
    add('text',{x:sx(6.5), y:sy(4.86),'text-anchor':'middle',class:'lab'},
      'пунктир — та же строка [10, 20, 30], повторённая для каждой строки; цвет = столбец');

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна показывать: к матрице [[1,2,3],[4,5,6]] '+
      'прибавляется строка [10,20,30]; эта строка копируется без изменений на оба ряда '+
      '(+10 в первый столбец, +20 во второй, +30 в третий), результат — [[11,22,33],[14,25,36]].</p>';
  }
})();
</script>
</html>
