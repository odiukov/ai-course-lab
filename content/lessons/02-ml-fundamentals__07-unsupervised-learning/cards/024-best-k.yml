- concept: начальная лучшая оценка должна допускать выбор кандидата с отрицательным silhouette
  question: Все допустимые значения silhouette могут оказаться отрицательными. Чем следует инициализировать best_score перед поиском максимума?
  explanation: Отрицательная бесконечность меньше любой реальной оценки silhouette, поэтому первый вычисленный результат обязательно станет текущим лидером. При начальном нуле все отрицательные кандидаты были бы ошибочно отвергнуты.
