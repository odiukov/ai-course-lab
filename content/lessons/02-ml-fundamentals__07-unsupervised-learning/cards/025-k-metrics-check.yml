- concept: для вычисления silhouette необходим хотя бы один чужой кластер
  question: Почему коэффициент силуэта нельзя вычислить для разбиения, состоящего только из единственного кластера?
  explanation: Формула силуэта сравнивает близость точки к своему кластеру с близостью к ближайшему чужому. Без чужого кластера такое сравнение невозможно.
  kind: open
  reference: Для вычисления силуэта нужна величина b — среднее расстояние до ближайшего чужого кластера. Если кластер единственный, чужого кластера нет, поэтому b не определено.
  id: 025-k-metrics-check-2
  fingerprint: c627a825
