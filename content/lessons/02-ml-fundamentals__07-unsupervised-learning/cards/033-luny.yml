- concept: одинаковое количество кластеров не гарантирует одинакового разбиения данных
  question: Два алгоритма обнаружили одинаковое количество кластеров в данных из переплетённых полумесяцев. Почему этого недостаточно, чтобы считать их результаты эквивалентными?
  explanation: Количество кластеров описывает только число групп, но не их состав и геометрию. K-Means может разделить полумесяцы линейной границей, тогда как DBSCAN способен объединить точки вдоль плотных изогнутых областей.
  kind: open
  reference: Нужно сравнить, какие именно точки объединены. Один алгоритм может сохранить каждый полумесяц целиком, а другой — разрезать обе дуги и собрать кластеры из их частей, хотя количество кластеров совпадёт.
  id: 033-luny-2
