- concept: высокий положительный силуэт указывает на уверенное положение точки внутри хорошо отделённого кластера
  question: Точка получила коэффициент силуэта 0,64. Как это значение разумнее всего интерпретировать?
  explanation: Заметно положительный силуэт получается, когда точка существенно ближе к объектам своего кластера, чем к ближайшему чужому кластеру. Это указывает на достаточно уверенное назначение, а не на процент правильных ответов.
  kind: choice
  options:
    - Точка в среднем заметно ближе к своему кластеру, чем к ближайшему чужому
    - Расстояния до своего и ближайшего чужого кластеров почти одинаковы
    - Точка в среднем ближе к ближайшему чужому кластеру
    - Значение показывает долю правильно назначенных точек
  correct: 0
  id: 022-siluet-interpretatsiya-1
  fingerprint: b0ba32d9
- concept: силуэт около нуля означает почти равные расстояния до своего и ближайшего чужого кластеров
  question: Точка получила коэффициент силуэта 0,06. Объясните своими словами, что это говорит о её положении относительно кластеров.
  explanation: При силуэте 0,06 значения внутрикластерного расстояния и расстояния до ближайшего чужого кластера близки. Поэтому точку нельзя считать уверенно расположенной внутри своей группы.
  kind: open
  reference: 'Точка находится около границы кластеров: среднее расстояние до объектов своего кластера лишь немного меньше среднего расстояния до ближайшего чужого кластера, поэтому назначение неуверенное.'
  id: 022-siluet-interpretatsiya-2
  fingerprint: 5d7ba31a
