- concept: border-точка входит в кластер DBSCAN, но не продолжает его расширение
  question: При расширении кластера DBSCAN обнаруженная точка не удовлетворяет условию core-точки. Как алгоритм поступает с ней, если она находится в eps-окрестности core-точки?
  explanation: Border-точка достижима из core-точки и поэтому принадлежит её кластеру. Однако собственная окрестность border-точки недостаточно плотна, поэтому через неё кластер дальше не разрастается.
  kind: choice
  options:
    - Удаляет точку из данных и отменяет построение кластера
    - Обязательно начинает с неё новый кластер
    - Присоединяет её как border-точку, но не добавляет её соседей для дальнейшего расширения
    - Объявляет шумом весь уже найденный кластер
  correct: 2
  id: 030-rasshirenie-klastera-1
  fingerprint: 248a8671
- concept: первоначальная метка шума в DBSCAN может быть заменена меткой кластера
  question: Объясни своими словами, почему точка, первоначально отмеченная DBSCAN как шум, позднее может войти в кластер.
  explanation: Метка шума во время обхода является предварительной. В приведённой реализации условие labels[q] == -1 позволяет заменить её меткой текущего кластера, когда точка встречается в seed_set.
  kind: open
  reference: При первом посещении у точки может оказаться недостаточно соседей, поэтому она получает метку шума. Если позднее расширение кластера от другой core-точки достигнет её, алгоритм заменит метку шума на идентификатор этого кластера; такая точка может оказаться border-точкой.
  id: 030-rasshirenie-klastera-2
  fingerprint: aae4c39b
