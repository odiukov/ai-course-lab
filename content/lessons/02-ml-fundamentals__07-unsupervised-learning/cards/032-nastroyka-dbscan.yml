- concept: глобальный eps создаёт конфликт при кластеризации областей с разной плотностью
  question: Почему стандартному DBSCAN трудно одновременно корректно выделить очень плотный и заметно более разреженный кластер?
  explanation: Порог плотности DBSCAN задаётся глобальными eps и min_samples. Если характерные расстояния внутри кластеров сильно различаются, подходящего для всех областей радиуса может не существовать.
  kind: open
  reference: DBSCAN применяет одинаковый eps ко всему набору. Малого радиуса может хватить для плотного кластера, но точки разреженного кластера окажутся шумом. Больший радиус соединит разреженный кластер, однако может слить плотную группу с соседними точками или другим кластером.
  id: 032-nastroyka-dbscan-2
