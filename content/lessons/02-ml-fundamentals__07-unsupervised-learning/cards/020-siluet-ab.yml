- concept: вычисление коэффициента силуэта точки по значениям a и b
  question: Среднее расстояние от точки до объектов своего кластера равно 2,5, а до ближайшего чужого кластера в среднем — 7,5. Чему равен коэффициент силуэта точки? Округлите до сотых.
  explanation: 'Коэффициент равен (b − a) / max(a, b). Получаем (7,5 − 2,5) / 7,5 ≈ 0,67: точка заметно ближе к своему кластеру.'
  kind: numeric
  answer: 0.67
  tolerance: 0.01
  id: 020-siluet-ab-1
  fingerprint: 8b88c09b
- concept: b в коэффициенте силуэта определяется по ближайшему чужому кластеру в среднем
  question: Как вычисляется величина b для отдельной точки при расчёте коэффициента силуэта?
  explanation: Сначала для каждого чужого кластера отдельно находят среднее расстояние от рассматриваемой точки до его объектов. В качестве b берут наименьшее из этих средних, а не расстояние до одной ближайшей чужой точки.
  kind: choice
  options:
    - Находится среднее расстояние до каждого чужого кластера, затем выбирается наименьшее
    - Выбирается расстояние до единственной ближайшей точки из любого чужого кластера
    - Усредняются расстояния сразу до всех точек всех чужих кластеров
    - Выбирается расстояние до самого далёкого центроида
  correct: 0
  id: 020-siluet-ab-2
  fingerprint: b1421c4f
- concept: отрицательный силуэт указывает на большую близость точки к чужому кластеру
  question: Объясните своими словами, что означает отрицательный коэффициент силуэта отдельной точки.
  explanation: 'Отрицательный результат возникает при a > b: в среднем точка ближе к некоторому чужому кластеру, чем к собственному. Это признак возможного ошибочного назначения.'
  kind: open
  reference: Среднее расстояние до своего кластера больше, чем до ближайшего чужого кластера, поэтому точка, вероятно, назначена неудачно.
  id: 020-siluet-ab-3
