- concept: требование согласия детекторов меняет баланс между ложными тревогами и пропущенными аномалиями
  question: Как обычно изменяется результат, если считать аномальными только объекты, отмеченные одновременно DBSCAN и GMM, а не объекты, отмеченные хотя бы одним методом?
  explanation: Пересечение оставляет только согласованные срабатывания и потому задаёт более строгий фильтр. Он обычно сокращает число ложных тревог, но отбрасывает объекты, замеченные лишь одним детектором.
  kind: choice
  options:
    - Ложных тревог обычно становится меньше, но возрастает риск пропустить аномалию
    - Ложных тревог и пропусков всегда становится меньше
    - Результат не меняется, потому что оба метода ищут одно и то же
    - Аномальными обязательно окажутся все объекты вне крупнейшего кластера
