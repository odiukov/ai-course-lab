- concept: одиночные срабатывания помогают исследовать различия между критериями аномальности разных методов
  question: Зачем сохранять отдельно объекты, отмеченные только DBSCAN, и объекты, отмеченные только GMM, если основной список строится по согласию методов?
  explanation: Одиночное срабатывание не обязательно ошибочно. Раздельный анализ таких объектов позволяет увидеть, какой тип необычности обнаруживает каждый метод, и проверить кандидатов, исключённых строгим правилом.
  kind: open
  reference: Эти списки показывают, где методы применяют разные критерии аномальности. DBSCAN опирается на локальную плотность, а GMM — на соответствие вероятностной модели смеси, поэтому анализ расхождений помогает понять ограничения методов и не потерять потенциальные аномалии.
  id: 045-anomaly-pipeline-3
