- concept: K-Means лучше подходит для компактных кластеров вокруг центроидов и может искажать группы сложной формы
  question: Для какого набора данных стандартный K-Means с евклидовым расстоянием наиболее вероятно даст разбиение, не соответствующее естественным группам?
  explanation: K-Means минимизирует расстояния до центроидов, поэтому предпочитает компактные группы вокруг одного центра. Для переплетённых дуг он может разрезать обе естественные группы поперёк, даже если число кластеров задано верно.
  kind: choice
  options:
    - Несколько компактных и хорошо разделённых облаков точек
    - Две переплетённые дуги, каждая из которых образует отдельную группу
    - Несколько округлых облаков примерно одинакового размера
  correct: 1
  id: 026-granitsy-kmeans-1
  fingerprint: 8adba7c6
- concept: стандартный K-Means требует задать число кластеров до запуска и не определяет его самостоятельно
  question: Какое решение необходимо принять до запуска стандартного K-Means, если естественное число групп в данных неизвестно?
  explanation: K является обязательным входным параметром K-Means. Методы оценки разбиений могут помочь подобрать его, но каждый отдельный запуск всё равно выполняется с заранее заданным числом кластеров.
  kind: open
  reference: Нужно заранее выбрать число кластеров K. Один запуск K-Means строит разбиение только для переданного K и сам не определяет, сколько естественных групп содержат данные.
  id: 026-granitsy-kmeans-2
  fingerprint: 8512c016
