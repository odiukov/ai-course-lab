- concept: назначение точки зависит от текущего положения центроидов
  question: Почему неподвижная точка может перейти в другой кластер на следующей итерации K-Means?
  explanation: Метка кластера определяется не самой точкой раз и навсегда, а сравнением расстояний до текущих центроидов. Их перемещение способно изменить результат этого сравнения.
  kind: open
  reference: После пересчёта центроиды могут переместиться. Тогда ближайшим к точке может оказаться другой центроид, и назначение изменится.
