- concept: общий silhouette score является средним оценок отдельных точек, поэтому каждая точка имеет одинаковый вес
  question: Почему нельзя сначала усреднить силуэты отдельно внутри каждого кластера, а затем взять невзвешенное среднее полученных кластерных оценок?
  explanation: 'Итоговая оценка рассчитывается как среднее списка силуэтов всех точек. Усреднение средних по кластерам без учёта их размеров изменяет метрику: маленький кластер начинает влиять на результат так же сильно, как большой.'
  kind: open
  reference: Так кластеры получат одинаковый вес независимо от числа точек. Стандартный общий silhouette score усредняет оценки всех точек напрямую, поэтому вклад кластера пропорционален его размеру.
