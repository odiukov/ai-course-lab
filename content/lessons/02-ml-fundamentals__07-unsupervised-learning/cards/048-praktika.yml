  question: Как корректно сравнить случайную инициализацию K-Means с K-Means++ и почему одного запуска недостаточно?
  explanation: Быстрая остановка не гарантирует низкую inertia, а один удачный или неудачный случайный старт может исказить сравнение. Серия запусков позволяет оценить обе характеристики устойчивее.
