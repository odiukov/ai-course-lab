- concept: метод локтя является эвристикой и может не давать однозначного выбора K
  question: Почему по графику inertia не всегда можно однозначно выбрать число кластеров методом локтя?
  explanation: Метод опирается на визуально или численно заметное убывание дополнительной пользы. Если inertia снижается плавно, положение локтя зависит от интерпретации и не определяет единственный ответ.
  kind: open
  reference: На графике может не быть резкого перехода от больших улучшений к малым либо несколько значений K могут выглядеть одинаково правдоподобно. Поэтому метод локтя является эвристикой, а не гарантией единственного правильного K.
