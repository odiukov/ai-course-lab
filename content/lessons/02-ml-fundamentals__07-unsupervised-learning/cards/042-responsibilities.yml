- concept: строки матрицы responsibilities соответствуют объектам, а столбцы — компонентам смеси
  question: В матрице мягких принадлежностей GMM элемент r[i][j] относится к объекту i и компоненте j. Что содержит строка r[i]?
  explanation: Внешний индекс выбирает объект, а внутренний — компоненту. Поэтому строка содержит полный набор мягких принадлежностей выбранного объекта.
  kind: choice
  options:
    - Принадлежности одного объекта ко всем компонентам
    - Принадлежности всех объектов к одной компоненте
    - Параметры распределения одной компоненты
    - Жёсткие метки всех объектов
  correct: 0
  id: 042-responsibilities-1
  fingerprint: b0f91c03
- concept: нормирование сохраняет порядок ненормированных оценок компонент
  question: Заполни выражение для компоненты, которая получит жёсткую метку объекта после вычисления мягких принадлежностей.
  explanation: Все оценки компонент для одного объекта делятся на один и тот же положительный итог. Нормирование меняет масштаб оценок, но не компоненту с максимальным значением.
  kind: cloze
  template: argmax_j r[i][j] = argmax_j ___
  answer: w[j] * p(x[i] | theta[j])
  accept:
    - weights[j] * gaussian_pdf(data[i], means[j], variances[j])
    - w_j * p(x_i | theta_j)
  id: 042-responsibilities-2
  fingerprint: 43fe3eaf
