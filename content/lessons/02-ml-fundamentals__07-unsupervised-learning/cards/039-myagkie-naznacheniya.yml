- concept: разрыв между наибольшими вероятностями GMM показывает неоднозначность назначения, которую скрывает argmax
  question: GMM вернула для объекта A вероятности [0.79, 0.14, 0.07], а для объекта B — [0.47, 0.36, 0.17]. Какой вывод верен?
  explanation: 'У обоих объектов максимальна вероятность первой компоненты, поэтому argmax даст одинаковую метку. Однако у B две ведущие вероятности различаются лишь на 0.11, тогда как у A разрыв равен 0.65: B находится в более неоднозначном положении.'
  kind: choice
  options:
    - Объект A назначен менее однозначно, потому что его максимальная вероятность выше
    - Получить жёсткую метку из вероятностей невозможно
    - При выборе максимальной вероятности оба объекта получат первую метку, но назначение B менее однозначно
    - Объекты обязательно получат разные жёсткие метки, поскольку их распределения вероятностей различаются
