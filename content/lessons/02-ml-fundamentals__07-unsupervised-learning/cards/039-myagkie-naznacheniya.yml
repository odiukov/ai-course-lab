- concept: вероятности принадлежности GMM выражают уверенность модели, а не физический состав объекта
  question: Объясни своими словами, что означает вектор вероятностей принадлежности, выданный GMM, и почему его нельзя трактовать как физические доли объекта.
  explanation: GMM сравнивает, насколько хорошо каждая гауссова компонента объясняет наблюдение. Поэтому результат описывает неопределённость модельного назначения, а не внутренний состав самого объекта.
  kind: open
