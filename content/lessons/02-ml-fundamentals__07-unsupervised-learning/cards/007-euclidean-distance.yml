- concept: евклидово расстояние равно квадратному корню из суммы квадратов покоординатных разностей
  question: Чему равно евклидово расстояние между точками [7, 11] и [15, 26]?
  explanation: Разности координат равны 8 и 15. Поэтому расстояние равно sqrt(8² + 15²) = sqrt(289) = 17.
  kind: numeric
  answer: 17
  tolerance: 0.01
  id: 007-euclidean-distance-1
  fingerprint: a26d0307
- concept: zip при разной длине векторов игнорирует координаты после конца более короткого вектора
  question: Что произойдёт, если функция вычисляет расстояние через zip(a, b), а векторы a и b имеют разную длину?
  explanation: zip останавливается, когда заканчивается более короткая последовательность. Поэтому такая реализация корректна только при условии, что оба вектора имеют одинаковую размерность.
  kind: choice
  options:
    - Лишние координаты более длинного вектора не попадут в вычисление
    - zip автоматически дополнит короткий вектор нулями
    - zip обязательно выбросит исключение
    - Все координаты более длинного вектора будут сравнены с последней координатой короткого
