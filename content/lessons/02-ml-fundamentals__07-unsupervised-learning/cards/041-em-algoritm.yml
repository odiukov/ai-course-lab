- concept: итерация EM последовательно оценивает мягкие принадлежности, обновляет параметры и проверяет сходимость
  question: Расположите действия одной итерации EM для гауссовой смеси в правильном порядке.
  explanation: На E-шаге вычисляются responsibilities при текущих параметрах. На M-шаге эти значения служат весами для пересчёта средних, дисперсий и долей компонент. После проверки сходимости цикл либо завершается, либо повторяется.
  kind: order
  items:
    - При фиксированных текущих параметрах вычислить мягкие принадлежности объектов компонентам
    - Использовать мягкие принадлежности как веса и обновить параметры компонент
    - Оценить изменение параметров и при отсутствии сходимости начать следующую итерацию
  id: 041-em-algoritm-1
  fingerprint: c5805b76
- concept: среднее компоненты на M-шаге является взвешенным средним объектов с весами-responsibilities
  question: Восстановите формулу обновления среднего компоненты на M-шаге EM.
  explanation: Responsibility r_ij задаёт силу влияния объекта x_i на компоненту j. Поэтому числитель складывает взвешенные объекты, а знаменатель нормирует сумму по общей ответственности компоненты.
  kind: cloze
  template: μ_j = ___
  answer: Σ_i r_ij x_i / Σ_i r_ij
  accept:
    - (Σ_i r_ij x_i) / (Σ_i r_ij)
    - sum_i(r_ij * x_i) / sum_i(r_ij)
  id: 041-em-algoritm-2
  fingerprint: '47454559'
