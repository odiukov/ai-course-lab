- concept: смысл отдельной точки на графике inertia от K
  question: Объясни своими словами, что обозначает отдельная точка на графике метода локтя для K-Means.
  explanation: Каждому проверяемому значению K соответствует отдельный запуск K-Means и одно итоговое значение inertia. Эта пара величин и образует точку графика.
  kind: open
  reference: Точка показывает значение inertia, полученное после запуска K-Means с указанным на горизонтальной оси количеством кластеров K.
