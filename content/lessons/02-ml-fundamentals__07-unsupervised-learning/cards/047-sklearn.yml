- concept: random_state фиксирует случайность для воспроизводимого запуска
  question: Какой параметр нужно подставить, чтобы при неизменном seed случайная инициализация K-Means воспроизводилась?
  explanation: Параметр random_state фиксирует состояние генератора случайных чисел. При одинаковых данных, параметрах и программной среде это позволяет повторить результат случайной инициализации.
