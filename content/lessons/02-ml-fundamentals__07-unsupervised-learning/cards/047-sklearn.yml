- concept: n_init запускает K-Means с несколькими инициализациями и сохраняет лучший результат
  question: Расположи этапы выбора результата K-Means при нескольких начальных инициализациях в правильном порядке.
  explanation: Несколько стартов уменьшают зависимость результата от одной случайной инициализации. Параметр n_init управляет такими запусками, а библиотека сохраняет вариант с наименьшей inertia.
  kind: order
  items:
    - Сформировать несколько начальных наборов центроидов
    - Для каждого набора выполнить K-Means до сходимости
    - Сравнить итоговые значения inertia
    - Сохранить результат с минимальной inertia
