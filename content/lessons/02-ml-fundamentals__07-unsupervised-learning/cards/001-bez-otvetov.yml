- concept: без известных меток качество найденной структуры нельзя оценить обычной долей правильных ответов
  question: Почему для кластеризации набора без известных меток нельзя напрямую вычислить обычную accuracy?
  explanation: Отсутствие эталонных меток мешает разделить результаты на правильные и неправильные. Поэтому привычная проверка по ответам неприменима, даже если алгоритм действительно обнаружил полезную структуру.
  kind: open
  reference: Для accuracy нужно сравнить предсказание каждого объекта с известным правильным ответом. В неразмеченных данных таких ответов нет, поэтому осмысленность найденной структуры приходится оценивать другими, косвенными способами.
