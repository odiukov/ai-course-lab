- concept: найденная структура определяется переданными признаками, а не ожидаемыми названиями групп
  question: Алгоритм сгруппировал документы главным образом по используемой лексике, хотя аналитик ожидал разделения по профессиям авторов. Как правильнее интерпретировать результат?
  explanation: Алгоритм работает с представленными ему признаками и не знает желаемых бизнес-категорий. Поэтому найденные группы требуют содержательной интерпретации и могут не совпасть с привычным делением.
  kind: choice
  options:
    - Алгоритм нашёл структуру в доступных признаках, которая не обязана совпадать с ожиданиями аналитика
    - Алгоритм обязан был восстановить профессии, даже если таких меток и подходящих признаков не было
    - Любое несовпадение с ожидаемыми названиями доказывает, что обучение без учителя невозможно
