- concept: вес компоненты задаёт её априорную долю, а вероятность принадлежности относится к конкретной точке
  question: Объясни своими словами, почему большой вес компоненты GMM не гарантирует, что произвольная конкретная точка с высокой вероятностью относится именно к ней.
  explanation: Вес — свойство компоненты в целом, а вероятность принадлежности вычисляется отдельно для наблюдаемой точки с учётом её положения относительно всех компонент.
  kind: open
  reference: Вес показывает общую распространённость компоненты во всей смеси до рассмотрения конкретной точки. Вероятность принадлежности точки зависит также от того, насколько хорошо её положение согласуется со средним и ковариацией каждой компоненты.
