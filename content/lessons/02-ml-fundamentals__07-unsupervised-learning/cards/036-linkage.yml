- concept: single, complete и average linkage сравнивают соответственно минимум, максимум и среднее межкластерных расстояний
  question: Для пары кластеров A–B минимальное расстояние между точками меньше, чем у остальных пар. Для C–D меньше всего максимальное расстояние, а для E–F — среднее расстояние по всем межкластерным парам точек. Какие слияния выберут методы?
  explanation: Single linkage сравнивает минимальные межкластерные расстояния, complete linkage — максимальные, а average linkage — средние по всем парам точек. Поэтому методы выберут соответственно A–B, C–D и E–F.
  kind: choice
  options:
    - Single — A–B; complete — C–D; average — E–F
    - Single — C–D; complete — E–F; average — A–B
    - Single — E–F; complete — A–B; average — C–D
  correct: 0
  id: 036-linkage-1
  fingerprint: '37720116'
- concept: Ward выбирает слияние с наименьшим приростом суммарной внутрикластерной дисперсии
  question: У двух кластеров есть очень близкие граничные точки, однако их объединение резко увеличит разброс точек вокруг центра нового кластера. Объясните, почему метод Ward может не выбрать эту пару для следующего слияния.
  explanation: Короткое расстояние между отдельными граничными точками важно для single linkage, но не определяет выбор Ward. Ward предпочитает слияние, которое меньше всего ухудшает компактность кластеров.
  kind: open
  reference: Ward оценивает не ближайшую пару отдельных точек, а прирост суммарной внутрикластерной дисперсии после слияния. Если этот прирост велик, метод выберет другую пару кластеров с меньшим увеличением дисперсии.
  id: 036-linkage-2
  fingerprint: 769fe61a
