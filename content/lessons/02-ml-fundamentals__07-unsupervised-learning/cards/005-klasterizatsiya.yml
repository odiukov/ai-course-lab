- concept: GMM допускает мягкое назначение объектов эллиптическим кластерам
  question: Чем назначение объекта кластеру в GMM отличается от жёсткого назначения единственной группе?
  explanation: 'Мягкое назначение выражает неопределённость: объект может иметь заметную принадлежность сразу к нескольким компонентам GMM. Это полезно в областях, где кластеры перекрываются.'
  kind: open
  reference: GMM может задать для объекта степени принадлежности к нескольким кластерам, а не только одну окончательную метку; при этом модель допускает эллиптическую форму кластеров.
