- concept: неизменность назначений служит критерием остановки алгоритма Ллойда
  question: После обновления центроидов алгоритм K-Means заново распределил точки, но ни одна точка не сменила кластер. Что следует сделать?
  explanation: Если состав групп не изменился, их средние тоже останутся прежними. Следующий пересчёт не сдвинет центроиды, поэтому дальнейшие итерации повторят уже полученный результат.
  kind: choice
  options:
    - 'Остановить алгоритм: назначения стабилизировались'
    - Выбрать новые случайные центроиды
    - Увеличить количество кластеров
    - Продолжать, пока центроиды не совпадут с наблюдаемыми точками
