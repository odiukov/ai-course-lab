- concept: центроид K-Means не обязан совпадать ни с одной наблюдаемой точкой
  question: Какое утверждение о пересчитанном центроиде K-Means верно?
  explanation: Центроид получают усреднением координат назначенных точек. Результат такого вычисления может не совпадать ни с одним наблюдением — как центр (4,5) для точек (2,3), (4,7) и (6,5).
  kind: choice
  options:
    - Он может находиться в точке, которой нет среди исходных наблюдений
    - Он всегда совпадает с одной из назначенных ему точек
    - Он обязательно совпадает с самой близкой к старому центроиду точкой
