- concept: квадратичный рост памяти ограничивает применение иерархической кластеризации на больших данных
  question: Объясни своими словами, почему иерархическую кластеризацию обычно не выбирают для очень большого набора объектов, даже если дендрограмма была бы полезна.
  explanation: Дендрограмма показывает последовательность объединений, но её построение требует работы с попарными отношениями между объектами. Из-за квадратичного роста памяти иерархические методы лучше подходят для сравнительно небольших наборов.
  kind: open
  reference: Иерархическому методу приходится хранить или обрабатывать множество попарных расстояний. Необходимая память растёт квадратично с числом объектов, поэтому на больших наборах метод становится слишком ресурсоёмким.
