- concept: совпадение локтя inertia и максимума silhouette усиливает обоснованность выбора K
  question: Для кандидата Б на графике inertia наблюдается локоть, и его средний silhouette выше, чем у остальных кандидатов. Какой вывод наиболее обоснован?
  explanation: Локоть указывает, что дальнейшее увеличение K даёт лишь небольшое снижение inertia, а максимум silhouette — что кластеры лучше разделены. Совпадение сигналов поддерживает один выбор.
  kind: choice
  options:
    - Кандидат Б поддерживается сразу двумя критериями и выглядит предпочтительным
    - Кандидат Б следует отвергнуть, потому что inertia должна перестать уменьшаться полностью
    - Нужно выбрать кандидата с наибольшим K независимо от silhouette
  correct: 0
