- concept: сравнительный тест кластеризаторов должен раздельно проверять разные свойства структуры данных
  question: Объясни своими словами, зачем при сравнении кластеризаторов использовать отдельные наборы с компактными группами, группами сложной формы и редкими изолированными точками.
  explanation: Разные структуры данных создают разные трудности. Раздельные испытания помогают понять, какое именно свойство алгоритма объясняет его успех или неудачу, а не сводить сравнение к результату на одном удобном наборе.
  kind: open
  reference: 'Такие наборы проверяют разные способности алгоритмов: работу с компактными группами, устойчивость к сложной геометрии и возможность не включать изолированные объекты в кластеры. Успех в одном испытании не позволяет предсказать результат в остальных.'
