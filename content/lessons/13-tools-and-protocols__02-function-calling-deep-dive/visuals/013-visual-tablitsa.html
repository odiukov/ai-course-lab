<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Девять строк различий</title>
<style>
  :root{
    --bg:#ffffff; --fg:#0f172a; --muted:#5b6b7f; --grid:#c8d2de;
    --head:#eef2f7; --zebra:#f8fafc; --hl1:#fde9a9; --hl2:#c9e7f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1220; --fg:#e6ecf5; --muted:#9fb0c4; --grid:#33465e;
      --head:#152033; --zebra:#101a2b; --hl1:#5c4310; --hl2:#123a52;
    }
  }
  body{margin:0;padding:14px;background:var(--bg);color:var(--fg);
       font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2{margin:0 0 2px;font-size:15px}
  p.sub{margin:0 0 8px;font-size:12.5px;color:var(--muted)}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .cellbg{fill:var(--zebra)}
  .headbg{fill:var(--head)}
  .hl1{fill:var(--hl1)}
  .hl2{fill:var(--hl2)}
  .ln{stroke:var(--grid);fill:none}
  text{fill:var(--fg)}
  .m{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
  .s{font-size:11.5px}
  .h{font-size:12.5px;font-weight:600}
  .lg{font-size:11.5px;fill:var(--muted)}
  #fb{font-size:13px;color:var(--fg);white-space:pre-wrap}
</style>
<h2>Таблица различий: 9 строк — 9 строчек кода</h2>
<p class="sub">Одинаковые ячейки закрашены одним цветом: различия там, где цвета нет.</p>
<div id="host"></div>
<div id="fb"></div>
<script>
(function(){
try{
  /* ---------- данные ---------- */
  var DATA = {
    cols: ["OpenAI","Anthropic","Gemini"],
    head: "Что сравниваем",
    rows: [
      {k:"Оболочка объявления", c:[
        {t:['{type:"function",','function:{…}}'],mono:1},
        {t:['{name, description,','input_schema}'],mono:1},
        {t:['{functionDeclarations:','[{…}]}'],mono:1}]},
      {k:"Поле схемы", c:[
        {t:['parameters'],mono:1,g:"P"},
        {t:['input_schema'],mono:1},
        {t:['parameters'],mono:1,g:"P"}]},
      {k:"Контейнер ответа", c:[
        {t:['tool_calls[]','в сообщении ассистента']},
        {t:['content[] с типом','tool_use']},
        {t:['parts[] с типом','functionCall']}]},
      {k:"Тип аргументов", c:[
        {t:['JSON строкой']},
        {t:['разобранный объект'],g:"O"},
        {t:['разобранный объект'],g:"O"}]},
      {k:"Формат id", c:[
        {t:['call_…'],mono:1},
        {t:['toolu_…'],mono:1},
        {t:['UUID (Gemini 3+)']}]},
      {k:"Блок результата", c:[
        {t:['роль tool,','tool_call_id']},
        {t:['user с tool_result,','tool_use_id']},
        {t:['functionResponse','с совпадающим id']}]},
      {k:"Заставить вызвать", c:[
        {t:['tool_choice:{type:"function",','function:{name}}'],mono:1},
        {t:['tool_choice:{type:"tool",','name}'],mono:1},
        {t:['function_calling_config:','mode:"ANY"'],mono:1}]},
      {k:"Запретить инструменты", c:[
        {t:['tool_choice:"none"'],mono:1},
        {t:['tool_choice:{type:"none"}'],mono:1},
        {t:['mode:"NONE"'],mono:1}]},
      {k:"Строгая схема", c:[
        {t:['strict: true'],mono:1},
        {t:['схема и есть','контракт']},
        {t:['responseSchema','на уровне запроса']}]}
    ]
  };

  /* ---------- одна система координат ---------- */
  var scale  = 58;
  var origin = {x:18, y:16};
  function sx(u){ return origin.x + u*scale; }
  function sy(v){ return origin.y + v*scale; }

  /* геометрия в единицах сетки */
  var LAB = 4.2, COL = 3.95, ROW = 0.62;
  var NR  = DATA.rows.length;
  function colX(i){ return i===0 ? 0 : LAB + (i-1)*COL; }   // левый край колонки
  function colW(i){ return i===0 ? LAB : COL; }
  function rowY(j){ return j*ROW; }                          // 0 — шапка
  var RIGHT = colX(4), BOT = rowY(NR+1);
  var LEGY = BOT + 0.24, LEGH = 0.26;

  var NS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 968 "+Math.round(sy(LEGY+LEGH+0.2)));
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Девять строк различий между OpenAI, Anthropic и Gemini");

  function add(tag,attrs,cls){
    var e=document.createElementNS(NS,tag);
    for(var k in attrs) e.setAttribute(k,attrs[k]);
    if(cls) e.setAttribute("class",cls);
    svg.appendChild(e); return e;
  }
  function rect(x,y,w,h,cls){
    add("rect",{x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y)},cls);
  }
  function line(x1,y1,x2,y2){
    add("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),"stroke-width":1},"ln");
  }
  function label(x,y,txt,cls,anchor){
    var t=add("text",{x:sx(x),y:sy(y),"text-anchor":anchor,"dominant-baseline":"middle"},cls);
    t.appendChild(document.createTextNode(txt));
  }
  /* одна или две строки внутри ячейки: смещение тоже через sy */
  function cellText(cx,cy,lines,cls){
    if(lines.length===1){ label(cx,cy,lines[0],cls,"middle"); return; }
    label(cx,cy-0.115,lines[0],cls,"middle");
    label(cx,cy+0.115,lines[1],cls,"middle");
  }

  /* какие ячейки совпадают */
  var seen={}, hl={};
  DATA.rows.forEach(function(r){ r.c.forEach(function(c){
    if(c.g) seen[c.g]=(seen[c.g]||0)+1;
  });});
  var order=Object.keys(seen).filter(function(g){return seen[g]>1;});
  order.forEach(function(g,i){ hl[g]= i===0 ? "hl1" : "hl2"; });

  /* фон строк */
  rect(colX(0),rowY(0),RIGHT,ROW,"headbg");
  for(var j=1;j<=NR;j++){
    if(j%2===0) rect(colX(0),rowY(j),RIGHT,ROW,"cellbg");
  }
  /* подсветка совпадений */
  DATA.rows.forEach(function(r,ri){
    r.c.forEach(function(c,ci){
      if(c.g && hl[c.g]) rect(colX(ci+1),rowY(ri+1),colW(ci+1),ROW,hl[c.g]);
    });
  });

  /* сетка */
  for(var i=0;i<=4;i++) line(colX(i),rowY(0),colX(i),BOT);
  for(var j2=0;j2<=NR+1;j2++) line(colX(0),rowY(j2),RIGHT,rowY(j2));

  /* шапка */
  label(colX(0)+0.12,rowY(0)+ROW/2,DATA.head,"h","start");
  DATA.cols.forEach(function(name,ci){
    label(colX(ci+1)+colW(ci+1)/2,rowY(0)+ROW/2,name,"h","middle");
  });

  /* строки */
  DATA.rows.forEach(function(r,ri){
    var cy=rowY(ri+1)+ROW/2;
    label(colX(0)+0.12,cy,(ri+1)+". "+r.k,"s","start");
    r.c.forEach(function(c,ci){
      cellText(colX(ci+1)+colW(ci+1)/2,cy,c.t,c.mono?"m":"s");
    });
  });

  /* легенда */
  rect(colX(0)+0.05,LEGY,0.3,LEGH,"hl1");
  label(colX(0)+0.45,LEGY+LEGH/2,"parameters — одна и та же ячейка: OpenAI и Gemini","lg","start");
  rect(colX(0)+6.9,LEGY,0.3,LEGH,"hl2");
  label(colX(0)+7.3,LEGY+LEGH/2,"разобранный объект — Anthropic и Gemini","lg","start");
  label(RIGHT-0.1,LEGY+LEGH/2,"9 строк, не 90","lg","end");

  document.getElementById("host").appendChild(svg);
}catch(e){
  document.getElementById("fb").textContent =
    "Схема не построилась. Она должна показывать таблицу 3 колонок "+
    "(OpenAI, Anthropic, Gemini) и 9 строк различий: оболочка объявления, "+
    "поле схемы, контейнер ответа, тип аргументов, формат id, блок результата, "+
    "заставить вызвать инструмент, запретить инструменты, строгая схема. "+
    "Одинаковые ячейки закрашены одним цветом: parameters у OpenAI и Gemini, "+
    "разобранный объект у Anthropic и Gemini. Девять строк, не девяносто.";
}
})();
</script>
</html>
