- concept: несколько гейтов с разными отчётами и путями расщепляют источник истины о статусе задачи
  question: 'Команда договорилась так: локально работает один гейт и пишет отчёт в `~/tmp/verify.json`, а в CI запускается второй гейт со своими правилами и своим путём отчёта. Какой отказ это создаёт?'
  explanation: 'Правило «один отчёт, один путь»: гейт выдаёт единственный `verification_report.json` на закрытие задачи по фиксированному пути, и CI читает тот же путь. Два гейта с разными правилами дают два разных статуса — спор о готовности возвращается вместо однозначного вердикта.'
  kind: choice
  options:
    - 'Отказа нет: две независимые проверки надёжнее одной'
    - 'Источник истины расщеплён: на одну задачу приходится два вердикта, и «готово» зависит от того, чей отчёт открыли'
    - Единственное последствие — CI станет медленнее
  correct: 1
