- concept: отмена действует на одну конкретную находку в одном прогоне и не меняет само правило
  question: Человек с записанной причиной и своим идентификатором отменил блокирующую находку по одной задаче. Что происходит со следующим прогоном гейта, где то же правило снова срабатывает?
  explanation: Отмена — подписанное решение по конкретной находке, а не правка правила. Ослабить само правило можно только изменив его в версионируемой конфигурации, и это отдельное, тоже видимое действие. Иначе одна разовая уступка молча превратилась бы в постоянную дыру.
  kind: choice
  options:
    - Правило запоминает отмену и в дальнейшем выдаёт warn вместо block
    - Правило снова даёт блокирующую находку, и для неё нужна своя отмена с собственной причиной и подписью
    - Гейт пропускает эту проверку, пока отмену явно не отзовут
    - Отмена автоматически распространяется на все задачи того же автора
  correct: 1
  id: 023-override-check-1
  fingerprint: c368f0fe
- concept: отмена существует как запись в подписанном журнале, поэтому ответственность восстанавливается задним числом
  question: Через полгода после релиза разбирают инцидент и находят мерж, прошедший с блокирующей находкой. Объясни своими словами, откуда берётся ответ на вопросы «кто разрешил» и «на каком основании», и почему устного согласования в чате для этого недостаточно.
  explanation: Смысл двух полей — не бюрократия, а восстановимость решения после факта. Без журнала отмена неотличима от того, что гейт просто не сработал.
  kind: open
  reference: 'Ответ берётся из подписанной записи отмены в журнале аудита: там лежат override_reason и overridden_by, привязанные к конкретной находке и прогону. Устное согласование не является входом гейта и не сохраняется в проверяемом виде: чат можно потерять, переписать или трактовать по-разному, а по записи в журнале через месяцы восстанавливается и субъект решения, и его обоснование. Отмена ценна не тем, что снимает блокировку, а тем, что оставляет след, по которому решение можно вернуть и оспорить.'
  id: 023-override-check-2
  fingerprint: ddc14030
