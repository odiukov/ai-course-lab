- concept: успешная отмена сохраняет находку блокирующей и лишь добавляет реквизиты, а не понижает и не удаляет её
  question: Ревьюер корректно отменил блокирующую находку об отсутствующем файле лицензии. Как должна выглядеть находка в отчёте после отмены?
  explanation: 'Удаление или понижение стирает факт: отчёт перестаёт показывать, что проверка не пройдена. Отмена — это надстройка над провалом, а не его исправление, поэтому severity остаётся, а рядом появляется запись об ответственности.'
  kind: choice
  options:
    - Удалена из списка находок, чтобы не мешать вердикту
    - Понижена до предупреждения, поскольку риск принят
    - Осталась с severity block, к ней добавлены причина отмены и идентификатор человека
    - Заменена новой находкой уровня info с текстом об отмене
  correct: 2
  id: 022-apply-override-1
  fingerprint: 8447d00b
- concept: 'причина из одних пробелов не считается причиной: реквизит проверяется по содержимому, а не по факту передачи'
  question: Заполни пропуск в проверке реквизитов отмены так, чтобы строка из пробельных символов не проходила как причина.
  explanation: Пустая строка и строка из пробелов одинаково бесполезны для разбора решения. Проверка на непустоту после удаления краевых пробелов отсекает формально заполненное поле, за которым нет объяснения.
  kind: cloze
  template: |-
    if not override_reason.___():
        return finding  # отмена не применена
  answer: strip
  accept:
    - strip
    - strip()
  id: 022-apply-override-2
  fingerprint: da299cdd
- concept: 'реквизиты отмены проверяются до записи полей: находка меняется только после того, как выполнены все предусловия'
  question: Расставь шаги apply_override в правильном порядке.
  explanation: 'Запись реквизитов — последнее действие, а не первое. Если хотя бы одно предусловие не выполнено, функция отказывает и возвращает находку активной: частично отменённого состояния не существует. Вердикт при этом по-прежнему собирается свёрткой находок, а не выставляется здесь.'
  kind: order
  items:
    - 'Убедиться, что severity находки равна block: предупреждения отмены не требуют'
    - Проверить, что причина отмены непуста после удаления краевых пробелов
    - Проверить, что подпись содержит идентификатор, соответствующий человеку
    - Вернуть находку с заполненными полями отмены, не трогая сообщение, источник и severity
  id: 022-apply-override-3
  fingerprint: dcc655a5
