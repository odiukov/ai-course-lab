- concept: итоговый passed — производное поле, вычисляемое из списка находок, а не самостоятельное утверждение в отчёте
  question: В отчёте поле passed равно true, а среди находок лежит блокирующая. Что не так с самим устройством такого отчёта?
  explanation: Противоречие возможно только там, где вердикт и находки — два независимых утверждения. Когда passed вычисляется из findings, любое изменение набора находок автоматически меняет вердикт, и рассинхрону негде закрепиться.
  kind: choice
  options:
    - 'Находку следует отбросить: положительный вердикт важнее отдельной записи'
    - Поле passed хранится как независимое утверждение; будь оно вычисляемым из findings, такое состояние было бы недостижимо
    - Отчёту не хватает третьего значения статуса для подобных случаев
    - 'Отчёт корректен: блокирующие находки допускают положительный вердикт, если их немного'
  correct: 1
  id: 018-report-verdict-1
  fingerprint: 5c9cd5b1
- concept: 'один отчёт обслуживает и автоматическое решение, и разбор причин: вердикт и обоснование лежат вместе'
  question: Автоматика получила отчёт с отрицательным вердиктом и остановила мерж. Где она берёт причины отказа?
  explanation: 'Отчёт закрывает оба запроса сразу: машине — однозначный статус, человеку — перечень того, что чинить. Если за обоснованием нужно идти в другой источник, вердикт и объяснение начинают расходиться.'
  kind: choice
  options:
    - В логах прогона агента, которые нужно поднять отдельно
    - 'В том же отчёте: список находок с кодами и ссылками на свидетельства лежит рядом с вердиктом'
    - В переписке с агентом, выполнявшим задачу
    - Причины восстанавливаются повторным прогоном всех проверок
  correct: 1
