- concept: 'серьёзность зависит от типа пересечённой границы: прямой запрет — всегда блокировка, выход за согласованную область — по настроенной строгости'
  question: 'Отчёт области изменений показывает две записи: агент записал файл в каталог, помеченный как запрещённый, и изменил файл вне разрешённой области задачи, на который прямого запрета нет. Какие серьёзности получат находки?'
  explanation: 'Запрещённая запись нарушает заранее объявленное ограничение — её серьёзность фиксирована как block. Изменение вне области ограничения не нарушает, оно просто не заказывалось, поэтому его серьёзность настраивается: строгий режим блокирует, мягкий оставляет предупреждение.'
  kind: choice
  options:
    - 'Обе block: любое неожиданное изменение одинаково опасно'
    - 'Обе warn: агент действовал добросовестно, решение оставляем человеку'
    - Запись в запрещённое место — block; изменение вне области — block или warn в зависимости от политики строгости
    - Запись в запрещённое место — warn, а выход за область — block, потому что нарушает границы задачи
  correct: 2
  id: 009-scope-verdict-1
  fingerprint: 2810b550
- concept: запрет и выход за область разделены потому, что несут разный риск, а не разный объём самодеятельности
  question: Объясни своими словами, почему гейт не сводит любое неожиданное изменение файлов к одной категории нарушения области.
  explanation: 'Различие проходит по типу пересечённой границы, а не по количеству лишних правок. Отсюда и разные строки в таблице проверок: forbidden write — block, off-scope write — block или warn.'
  kind: open
  reference: 'Это разные риски. Запись в запрещённое место означает, что уже нарушено известное явное ограничение — оценивать полезность такого изменения не требуется, оно блокирует приёмку. Изменение вне разрешённой области может быть безобидным: запрета оно не нарушает, но его никто не заказывал и никто не проверял как часть задачи, поэтому проект вправе выбрать для него строгость сам. Слить обе категории в одну — значит либо блокировать поток из-за безобидных правок, либо пропускать прямые нарушения запретов.'
  id: 009-scope-verdict-2
  fingerprint: 1cd321ee
