- concept: адрес итогового отчёта детерминированно выводится из идентификатора задачи, поэтому читатель вычисляет его сам
  question: Функция записывает итоговый отчёт гейта в заранее оговорённое место. Заполни пропуск так, чтобы читатель мог вычислить путь, зная только задачу.
  explanation: 'Имя файла — функция от идентификатора задачи: для task-118 это outputs/verification/task-118.json. Тогда CI не нужно спрашивать у писателя, куда он положил результат — адрес выводится из самой задачи.'
  kind: cloze
  template: report_path = Path("outputs") / "verification" / f"{___}.json"
  answer: task_id
  accept:
    - task_id
    - report.task_id
    - report['task_id']
  id: 019-verification-report-1
  fingerprint: 036d77ca
- concept: повторное закрытие одной задачи обновляет тот же файл, а не создаёт версионированные копии
  question: 'Задачу task-118 прогнали через гейт трижды: первый раз с блокирующей находкой, потом дважды после исправлений. Сколько итоговых отчётов должно остаться на диске и как они называются?'
  explanation: 'Дата, номер прогона или суффикс -final возвращают ту же проблему, что и разные каталоги: у одной задачи появляется несколько кандидатов на роль итога. История прогонов живёт в журналах и логах, а вердикт — ровно в одном перезаписываемом файле.'
  kind: choice
  options:
    - Три файла с суффиксами прогонов, чтобы сохранить историю попыток
    - Один файл outputs/verification/task-118.json, перезаписанный последним прогоном
    - Один файл на прогон с датой в имени, а последний дополнительно копируется как -final
    - 'Два файла: последний результат и отдельная копия первого блокирующего прогона'
  correct: 1
  id: 019-verification-report-2
  fingerprint: 875ae8dd
- concept: записанный артефакт считается доказательством только после перечитывания с диска и сверки с вычисленным вердиктом
  question: Функция сериализовала отчёт и вызвала запись в файл без исключений. Почему после этого она перечитывает файл и сравнивает поле passed с вердиктом, посчитанным по находкам?
  explanation: 'Читателем артефакта будет другой процесс. Обрыв записи, битая сериализация или частичный файл дают внешне успешный вызов и нечитаемое доказательство. Сверка прочитанного passed с вычисленным подтверждает: то, что увидит CI, совпадает с тем, что решил гейт.'
  kind: choice
  options:
    - Чтобы пересчитать вердикт заново по более строгому правилу
    - Чтобы убедиться, что на диске лежит разбираемый JSON и ровно тот вердикт, который будет прочитан CI
    - Чтобы отфильтровать предупреждения, которые не должны попадать в артефакт
    - Чтобы зафиксировать время записи и отличить свежий отчёт от устаревшего
  correct: 1
  id: 019-verification-report-3
  fingerprint: cfa2eb97
