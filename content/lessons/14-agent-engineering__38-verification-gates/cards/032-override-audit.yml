- concept: отмена привязана к зафиксированному в ней состоянию репозитория и не переносится на изменившийся код
  question: Ответственный человек оформил отмену блокирующей находки. Затем агент добавил в задачу новые коммиты, и гейт снова выдаёт находку с тем же кодом. Закрывает ли её прежняя запись отмены?
  explanation: Человек оценивал конкретный снимок кода. Новый коммит — другой предмет решения, поэтому старая запись остаётся в журнале как свидетельство прошлого решения, но не разрешает текущее состояние.
  kind: choice
  options:
    - 'Нет: запись относится к зафиксированному в ней коммиту, для нового состояния нужна новая отмена'
    - 'Да: код находки совпадает, значит решение продолжает действовать'
    - Да, если с момента отмены прошло немного времени и правило не менялось
  correct: 0
  id: 032-override-audit-1
  fingerprint: 29e51014
- concept: версию проверяемого кода идентифицирует коммит, а не момент времени
  question: В записи отмены уже есть метка времени. Зачем дополнительно хранить идентификатор коммита?
  explanation: Пять полей записи отвечают на «когда, что, почему, кто и на какой версии кода». Именно последнее поле восстанавливает предмет решения — без него разрешение легко приклеивается не к той версии.
  kind: choice
  options:
    - 'Время не определяет состояние кода: в один момент существуют разные ветки и разные версии дифа, а коммит указывает точный снимок'
    - Коммит нужен только для сортировки записей журнала
    - Коммит дублирует метку времени и хранится ради совместимости форматов
  correct: 0
