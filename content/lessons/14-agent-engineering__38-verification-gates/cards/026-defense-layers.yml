- concept: вероятности промаха независимых слоёв перемножаются
  question: Три независимых слоя контроля, каждый пропускает дефект с вероятностью 0.2. Какова вероятность, что дефект пройдёт все слои?
  explanation: 'При независимости промахи перемножаются: 0.2 × 0.2 × 0.2 = 0.008, примерно один случай из 125. Отсюда и смысл нескольких границ: каждый отдельный фильтр может быть посредственным, а совокупный пропуск всё равно мал.'
  kind: numeric
  answer: 0.008
  tolerance: 0.0005
  id: 026-defense-layers-1
  fingerprint: a65cedaf
- concept: перемножение вероятностей верно только при независимости слоёв; общая причина отказа обнуляет выигрыш
  question: Почему расчёт совокупной надёжности через произведение вероятностей промаха — оценка сверху, а не гарантия?
  explanation: Умножение опирается на независимость. Если слои читают одну конфигурацию, наследуют один список исключений или сводятся к одному и тому же движку, одна ошибка выключает сразу несколько границ, и реальный пропуск куда выше расчётного. Поэтому слои полезно делать разными по механизму, а не только по количеству.
  kind: choice
  options:
    - Слои могут отказывать по общей причине (одна конфигурация, один игнорируемый набор правил), и тогда их отказы не независимы
    - Потому что вероятности всегда меняются со временем и их нельзя измерить
    - Потому что произведение вероятностей применимо только к чётному числу слоёв
