- concept: 'свёртка результатов правил не компенсаторная: успехи не перекрывают блокирующий провал, а предупреждения не складываются в блокировку'
  question: 'Прогон A: из 15 правил 11 прошли, одно провалено с серьёзностью block, три — с warn. Прогон B: из 15 правил три провалены с warn, остальные прошли. Какие вердикты выдаст гейт?'
  explanation: 'Гейт берёт не долю успехов и не число провалов, а наибольшую серьёзность. Один провал уровня block закрывает passed: true, сколько бы правил ни прошло рядом. И наоборот, предупреждения не накапливаются до блокировки — они остаются видимыми пометками в вердикте.'
  kind: choice
  options:
    - 'A — passed: false; B — passed: true с пометками о предупреждениях'
    - 'Оба false: в каждом прогоне есть проваленные правила'
    - 'Оба true: в обоих случаях большинство правил прошло'
    - A — false; B — false, потому что три предупреждения по совокупности дают блокировку
  correct: 0
  id: 011-rule-blocks-1
  fingerprint: d0837fbd
- concept: какие провалы останавливают задачу, объявлено заранее в самих правилах, и гейт лишь применяет это объявление
  question: Гейт читает отчёт правил и встречает провал правила, которое видит впервые. Откуда берётся решение, останавливать ли задачу?
  explanation: 'Условие гейта фиксировано: «все правила уровня block должны пройти». Что считается block, решает автор правила до прогона, поэтому один и тот же отчёт всегда даёт один и тот же вердикт, а красный результат сам по себе ещё не означает остановку.'
  kind: choice
  options:
    - Из серьёзности, объявленной для этого правила заранее и приехавшей вместе с записью отчёта
    - Гейт сам оценивает, насколько провал важен для этой задачи
    - Из доли проваленных правил в отчёте
    - Из пометки, которую агент оставил в описании выполненной работы
  correct: 0
  id: 011-rule-blocks-2
  fingerprint: 9b03077b
