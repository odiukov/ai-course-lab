- concept: 'перед сравнением обе величины приводятся к одной шкале: доля и проценты — разные представления одного значения'
  question: В отчёте покрытие записано как доля 0.925, а минимально допустимое значение в настройках задано как 90 (проценты). Функция сравнивает эти два числа напрямую. Что произойдёт?
  explanation: 0.925 < 90 в любой арифметике, поэтому проверка объявит провал, хотя фактическое покрытие 92,5% выше порога 90%. Ошибка шкалы даёт не «примерно верный», а полностью перевёрнутый вердикт, причём стабильно — то есть детерминированно неправильный. Приводить обе величины к одной шкале нужно до сравнения, а не интерпретировать результат постфактум.
  kind: choice
  options:
    - Гейт выдаст блокирующую находку, хотя покрытие выше минимума
    - Гейт пропустит задачу, хотя покрытие ниже минимума
    - 'Сравнение корректно: 0.925 и 90 обозначают одно и то же'
    - Функция вернёт предупреждение вместо блокировки
  correct: 0
