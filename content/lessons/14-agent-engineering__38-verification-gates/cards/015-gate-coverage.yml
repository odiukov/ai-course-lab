- concept: отсутствующее или нечисловое значение покрытия — не ноль и не повод пропустить проверку, а самостоятельная блокирующая находка
  question: Отчёт о покрытии загружен, но поле с текущим покрытием отсутствует (или содержит строку вместо числа). Как должна поступить проверка покрытия?
  explanation: 'Непроведённое измерение — не результат измерения. Подстановка нуля выдаёт выдуманный факт за измеренный и портит причину провала; пустой список приравнивает «не знаем» к «всё хорошо» — именно так гейт становится зелёным на пустом месте. Значение прошлого мержа маскирует поломку сбора метрик. Правильный ответ: отдельная блокирующая находка, из которой видно, что сломана не кодовая база, а измерение.'
  kind: choice
  options:
    - Вернуть блокирующую находку с причиной «покрытие не измерено»
    - Подставить ноль и сообщить о падении ниже минимума
    - 'Вернуть пустой список: нарушений порога не зафиксировано'
    - Взять значение прошлого мержа как текущее
  correct: 0
