- concept: ручной разбор возможен только если вердикт воспроизводится вне инфраструктуры пайплайна
  question: Человек сомневается в заявленном успехе и хочет разобраться сам. Почему важно, чтобы проверку можно было выполнить вне автоматического пайплайна?
  explanation: Ручной разбор — это повторное вычисление того же вердикта на тех же входах. Если проверка вплетена в конкретный пайплайн и тянет его переменные, повторить её негде, и спорный статус нечем перепроверить.
  kind: choice
  options:
    - Иначе воспроизвести вердикт можно только внутри пайплайна, и разбор сводится к вере в его вывод
    - Иначе пайплайн не сможет сохранить отчёт на диск
    - Иначе придётся заводить отдельные правила строгости для каждой ветки
  correct: 0
