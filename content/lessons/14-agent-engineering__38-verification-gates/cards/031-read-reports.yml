- concept: набор демонстрационных сценариев обязан включать полностью корректный случай, иначе вечно-красный гейт неотличим от корректного
  question: Набор демонстрационных сценариев для гейта состоит только из случаев, которые должны блокироваться. Что такой набор не способен показать?
  explanation: Отрицательные сценарии проверяют чувствительность, положительный — специфичность. Без положительного случая нельзя утверждать, что блокировки вызваны реальными нарушениями.
  kind: open
  reference: 'Он не проверяет отсутствие ложных блокировок: гейт, который возвращает провал на любом входе, пройдёт такой набор целиком. Нужен хотя бы один сценарий с полным согласованным набором артефактов, дающий passed: true, — только он отличает работающий гейт от постоянно красного.'
