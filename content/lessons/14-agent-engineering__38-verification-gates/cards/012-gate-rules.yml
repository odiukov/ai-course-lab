  question: 'Отчёт правил содержит 14 записей: 9 успешных и 5 проваленных, среди проваленных 4 имеют блокирующую серьёзность. Сколько находок вернёт корректная функция переноса провалов отчёта в находки гейта?'
  explanation: 'Успешные правила находок не порождают, значит кандидатов 5. Останавливаться на первой блокирующей находке нельзя: одного блока достаточно, чтобы запретить положительный вердикт, но исполнителю нужен полный перечень, иначе он чинит по одной проблеме за прогон. Ответ 4 означал бы потерю предупреждений, ответ 1 — раннюю остановку.'
