- concept: модель может поставлять сигналы и находки, но решение о статусе выносит воспроизводимая свёртка правил
  question: Команда хочет использовать LLM в процессе закрытия задач. Какое распределение ролей сохраняет свойства гейта?
  explanation: Роль модели — расширять список замеченного, роль гейта — превращать зафиксированное в статус. Как только вероятностный компонент оказывается на последнем шаге, одинаковые входы перестают гарантировать одинаковый выход.
  kind: choice
  options:
    - Модель выносит итоговый вердикт, а правила применяются только при её отказе отвечать
    - Модель формирует находки и замечания, а статус задачи вычисляется из находок фиксированным правилом
    - Модель и правила голосуют, вердикт принимается большинством
    - Модель выносит вердикт, а правила проверяют его постфактум
  correct: 1
  id: 024-no-llm-judge-1
  fingerprint: b67ed9b3
- concept: изменение вердикта обязано указывать на изменившийся артефакт или изменившееся правило; расхождение при неизменных входах — дефект самого гейта
  question: 'Гейт прогнали дважды подряд по одному и тому же набору артефактов и получили сначала passed: true, затем passed: false. Как это трактовать?'
  explanation: Вердикт — функция от входов и правил. Если ни то, ни другое не менялось, а результат изменился, в гейт просочился недетерминированный источник (модель, порядок обхода, время, сеть). «Внимательнее» — не свойство проверки статуса.
  kind: choice
  options:
    - 'Как нормальный разброс: второй прогон был внимательнее, ему и верить'
    - 'Как дефект гейта: при неизменных артефактах и правилах вердикт обязан повторяться, иначе статус недоказуем'
    - Как признак того, что артефакты устарели между прогонами
    - Как повод усреднить результаты нескольких прогонов
  correct: 1
  id: 024-no-llm-judge-2
  fingerprint: aa2896c1
- concept: высокая средняя точность вероятностного судьи не заменяет воспроизводимости, когда результат управляет действием
  question: Модель-судья совпадает с решением человека в 96% случаев — точнее, чем часть команды. Объясни своими словами, почему её всё равно нельзя ставить последним шагом гейта.
  explanation: Точность отвечает на вопрос «часто ли угадывает», а гейту нужен ответ на вопрос «всегда ли одинаково и можно ли показать причину». Для рекомендаций первое достаточно, для статуса — нет.
  kind: open
  reference: 'Вердикт гейта не оценка, а управляющее решение: он либо открывает завершение задачи, либо возвращает её на исправление. Остаточные 4% означают, что один и тот же набор артефактов иногда даёт разные действия — статус становится лотереей, и на него нельзя опереться ни автору, ни CI. Кроме того, вероятностный вердикт нельзя возвести к конкретной находке и правилу: непонятно, что чинить и почему в следующий раз результат будет другим. Детерминированная проверка при тех же входах отвечает одинаково, а изменение ответа всегда объясняется изменившимся артефактом или правилом. Модель полезна раньше — как источник замечаний для качественного ревью.'
  id: 024-no-llm-judge-3
  fingerprint: 74edd7c5
