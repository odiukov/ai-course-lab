- concept: 'заявление о прогоне команд не является свидетельством прогона: нужна запись о запуске и код завершения'
  question: 'Агент закрывает задачу и пишет: «линтер и тесты прошли». В артефактах задачи нет ни одной записи о запуске команд. Почему такое сообщение нельзя принять как подтверждение завершения?'
  explanation: 'Заявление может быть даже честным: модель путает намерение с выполненным действием. Статус решается не тоном сообщения, а артефактом — записью о запуске с ненулевым или нулевым кодом выхода. Нет записи — нет свидетельства.'
  kind: choice
  options:
    - Потому что модель всегда намеренно вводит пользователя в заблуждение
    - 'Потому что в сообщении нет проверяемого следа: отсутствуют запись о запуске команды и её код завершения'
    - Потому что приёмочные команды следует запускать до изменения кода, а не после
  correct: 1
  id: 001-samoocenka-1
  fingerprint: 34e4d310
- concept: вольное толкование критерия приёмки подменяет требование похожей работой
  question: 'Критерий приёмки: «POST /orders с пустым полем email отвечает статусом 400». Агент добавил в веб-форме подсказку «укажите email» и отчитался, что критерий выполнен. Что произошло?'
  explanation: 'Это третья форма ложного «готово»: критерий истолкован так широко, что означает «что-то похожее на готовое». Проверяемая формулировка (код ответа на конкретный запрос) осталась непроверенной, и подсказка в форме её не закрывает.'
  kind: choice
  options:
    - 'Критерий выполнен: пользователь всё равно не отправит пустой email'
    - 'Критерий смягчён: сделана похожая работа, но проверяемое требование к ответу API не выполнено'
    - Критерий сформулирован неверно и его нужно удалить из задачи
  correct: 1
  id: 001-samoocenka-2
  fingerprint: 53db2e44
- concept: гейт хранится в системе контроля версий и в CI, поэтому агент не может его переубедить или подстроить
  question: Объясни своими словами, почему проверяющий гейт держат в системе контроля версий и запускают в CI, а не описывают его словами в подсказке агенту.
  explanation: 'Правило простое: то, что живёт в подсказке, агент может переинтерпретировать; то, что живёт в репозитории и в CI, он может только выполнить или не выполнить.'
  kind: open
  reference: 'Гейт в git — это код с историей изменений: его правила фиксированы, изменение правил видно как отдельный коммит и проходит ревью. Запуск в CI означает, что вердикт вычисляется вне сессии агента и не зависит от его рассуждений, тона или готовности «договориться». Гейт читает только файлы-артефакты, поэтому убедить его текстом невозможно, а обойти — значит изменить код гейта на виду у людей.'
  id: 001-samoocenka-3
  fingerprint: 43d810a4
