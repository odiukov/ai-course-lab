- concept: детерминизм демонстрируется изменением ровно одного входа при неизменных остальных
  question: Как показать на демонстрации, что вердикт определяется артефактами, а не случайностью прогона?
  explanation: 'Детерминизм — это функция от входов: те же входы дают тот же ответ, изменённый вход даёт объяснимо другой. Контролируемая замена одного артефакта показывает обе половины утверждения. Многократный прогон на одинаковых входах покажет только стабильность, но не связь входа с вердиктом.'
  kind: choice
  options:
    - Менять по одному входному артефакту при неизменных остальных и проверять, что вердикт переворачивается предсказуемо
    - Запустить проверку много раз на одном наборе входов и усреднить долю положительных вердиктов
    - Сравнить вердикты на разных задачах и убедиться, что они различаются
  correct: 0
  id: 030-demo-scenarios-1
  fingerprint: 763f3f65
- concept: демонстрационные наборы строят так, чтобы каждый отрицательный исход изолировал одну проверку
  question: Демонстрационный набор из пяти задач готовят для показа работы проверки статуса. Почему в каждом отрицательном случае нарушают ровно одно условие?
  explanation: 'Демонстрация ценна приписываемостью: одно нарушение — одна сработавшая проверка — понятная причина отказа. При нескольких нарушениях сразу отрицательный вердикт верен, но чему именно он обязан, из вывода не видно, и рецепт исправления не читается.'
  kind: choice
  options:
    - Иначе непонятно, какая именно проверка дала отрицательный вердикт, и наблюдаемая связь причины со следствием теряется
    - Иначе проверка выполнит только первое правило и остановится
    - Иначе итоговый вердикт станет недетерминированным
  correct: 0
  id: 030-demo-scenarios-2
  fingerprint: 5617a9e1
