- concept: гейт ничего не измеряет заново, а сводит уже готовые отчёты, каждый по его предмету
  question: Объясни, почему гейт не запускает приёмочные команды сам и не пересчитывает область изменений, а только читает готовые отчёты.
  explanation: 'Отсюда и частая ошибка: один зелёный отчёт принимают за доказательство всей готовности. Каждое свидетельство закрывает только свою часть, а гейт требует их все.'
  kind: open
  reference: 'Артефакты фиксируют свидетельство в момент работы: какая команда запускалась, с каким кодом вышла, какие файлы были записаны. Повторный запуск внутри гейта создал бы новое состояние и новое свидетельство, а вердикт перестал бы быть воспроизводимым по сохранённому набору артефактов. Кроме того, разделение обязанностей делает источник каждой находки прослеживаемым: журнал команд отвечает за запуски и коды выхода, отчёт области изменений — за запрещённые и посторонние записи, отчёт правил — за обязательные правила. Работа гейта — свести эти выводы и выставить статус.'
  id: 004-inputs-check-2
  fingerprint: 23ef2182
