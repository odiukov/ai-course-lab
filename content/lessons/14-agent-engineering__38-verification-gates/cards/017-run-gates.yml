- concept: находки от каждой проверки вливаются в общий список поэлементно, а не вкладываются как отдельный список
  question: Собирающая функция накапливает находки всех проверок в одну переменную `findings`, чтобы следующий слой обрабатывал их единообразно. Заполни пропуск.
  explanation: '`append` положил бы в общий список ещё один список, и получилась бы вложенная структура: следующий слой не смог бы одинаково перебрать все находки и посчитать блокирующие. `extend` (или `+=`) добавляет элементы по отдельности, сохраняя плоскую форму — то, ради чего у всех проверок один и тот же тип результата.'
  kind: cloze
  template: findings.___(gate_scope(scope_report, diff_report))
  answer: extend
  accept:
    - extend
    - +=
    - list.extend
  id: 017-run-gates-1
  fingerprint: 41e51aff
- concept: собирающий слой транспортирует находки без изменения их содержимого — смысл находки принадлежит породившей её проверке
  question: Собирающая функция получает от проверки границ находку с блокирующей серьёзностью и хочет понизить её до предупреждения, потому что «в этой ветке это терпимо». Почему так делать нельзя?
  explanation: 'Серьёзность — часть решения проверки, принятого по её артефакту и её правилу. Если сборщик правит серьёзность, код находки и сообщение, то отчёт перестаёт объяснять сам себя: ссылка на свидетельство ведёт в одно место, а вердикт назначен в другом. Послабления по ветке выражаются отдельным механизмом строгости, а не редактированием чужих находок на лету.'
  kind: choice
  options:
    - Только сама проверка видит свидетельство и правило, по которым назначена серьёзность; переписывание в сборщике отрывает вердикт от его обоснования
    - Серьёзность технически неизменяема после создания записи
    - Понижение серьёзности всегда должно повышать её, а не понижать
    - Сборщик не имеет доступа к полю серьёзности
  correct: 0
