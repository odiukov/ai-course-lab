- concept: фиксированный порядок обхода проверок и групп находок делает вывод сборщика воспроизводимым между запусками
  question: Расставь шаги работы собирающей функции в правильном порядке.
  explanation: 'Порядок вызовов закреплён в самой функции, а не выбирается по ситуации: тогда одинаковый набор артефактов даёт побайтово одинаковый список находок, и отчёты можно сравнивать между запусками, а тесты не ломаются от перестановки. Общий вердикт здесь не вычисляется — сборщик возвращает материал, решение принимает следующий слой.'
  kind: order
  items:
    - Передать проверке ровно тот срез входных артефактов, который ей нужен
    - Получить от проверки её список находок
    - Добавить полученные находки в общий список поэлементно
    - Повторить то же для остальных проверок в заранее закреплённом порядке
    - Вернуть общий плоский список находок вызывающему слою
