- concept: уровень строгости выбирают по цене ошибки контекста, а не назначают глобально навсегда
  question: Почему предупреждающим проверкам не назначают уровень блокировки один раз и навсегда, а вводят отдельный строгий режим?
  explanation: Ключ в том, что риск задаёт не находка, а контекст. Разделение «обычный / строгий» сохраняет и рабочий поток, и жёсткость там, где исправление после факта обходится дорого.
  kind: open
  reference: 'Постоянная блокировка на мелких отклонениях останавливала бы повседневную работу, и команда начала бы обходить гейт или штамповать отмены — правило обесценилось бы. Постоянная мягкость, наоборот, пропускает те же отклонения туда, где ошибка дорога: релизная ветка, блокирующий выпуск PR, разбор после инцидента. Поэтому одна и та же находка трактуется по-разному в зависимости от цены ошибки в этом контексте, а режим включается точечно, а не глобально по умолчанию.'
