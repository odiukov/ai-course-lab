- concept: 'warn добавляет пометку и не отменяет положительный вердикт, block запрещает passed: true'
  question: По итогам проверки собрано несколько findings, и у всех severity `warn`. Каким может быть итоговый вердикт?
  explanation: 'Серьёзность решает всё: `warn` только добавляет пометку к вердикту, `block` не даёт выставить `passed: true`. Поэтому набор одних предупреждений оставляет задачу проходимой, но с зафиксированными замечаниями.'
  kind: choice
  options:
    - '`passed: false`: любая находка отменяет готовность'
    - '`passed: true` с приложенными предупреждениями'
    - Вердикт не определён, статус должен выставить человек
  correct: 1
  id: 005-finding-model-1
  fingerprint: 74c71fbe
- concept: finding не заменяет исходный отчёт, а фиксирует вывод и ссылку на свидетельство
  question: Что должна содержать запись finding, чтобы вердикт можно было перепроверить, не доверяя формулировке сообщения?
  explanation: 'Finding — краткая карточка вывода: какая проверка сработала, насколько серьёзна проблема, что обнаружено и куда смотреть. Копировать отчёт незачем, а оценка уверенности вернула бы в статус вероятностный элемент.'
  kind: choice
  options:
    - Полную копию исходного отчёта проверки
    - Имя проверки, severity и ссылку на свидетельство в исходном артефакте
    - Оценку уверенности модели в том, что находка настоящая
  correct: 1
  id: 005-finding-model-2
  fingerprint: 5fa39127
- concept: единая форма записи позволяет применять одно правило обработки к находкам из любых отчётов
  question: Объясни, что даёт гейту приведение всех находок к единой форме finding.
  explanation: 'Это и есть смысл единой формы: логика вердикта отделена от особенностей источников, поэтому она остаётся короткой и детерминированной.'
  kind: open
  reference: 'Разнородные отчёты говорят на своих языках: где-то отсутствует код завершения, где-то найден запрещённый путь, где-то не прошло правило. После приведения к единой записи гейту не нужно знать особенности каждого отчёта: он читает у всех findings одно поле severity и применяет единое правило — блокирующая находка запрещает `passed: true`, предупреждающая добавляет пометку. Итог зависит от явно записанной серьёзности, а не от формулировки сообщения, и новую проверку можно добавить, не меняя логику вердикта.'
  id: 005-finding-model-3
  fingerprint: 4d034c1a
