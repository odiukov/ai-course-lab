- concept: независимость проверок означает замкнутость каждой на своём предмете, а сведение их результатов — обязанность отдельного уровня
  question: Что означает требование независимости отдельных проверок гейта и почему при таком требовании всё равно нужна единая точка их запуска?
  explanation: Независимость — свойство каждой проверки, полнота — свойство процедуры. Первое не даёт второго, поэтому уровни разделены.
  kind: open
  reference: 'Независимость означает, что каждая проверка отвечает только за свою область и не читает выводы соседей: проверка области не смотрит на покрытие, проверка правил не решает, запускалась ли приёмочная команда. Так проверка остаётся простой, детерминированной и объяснимой, а её находки — атрибутируемыми. Но раз никто из них не знает о существовании остальных, ни одна не может гарантировать, что набор проверок был полным и что ни один результат не потерян. Эту гарантию даёт единая точка запуска: она подаёт всем одинаковые входные артефакты, вызывает полный заранее заданный набор и собирает все находки в общем формате, не исправляя и не переосмысливая их. Новая обязательная проверка подключается там же, в одном месте.'
  id: 016-gate-orchestration-2
  fingerprint: 28107d17
