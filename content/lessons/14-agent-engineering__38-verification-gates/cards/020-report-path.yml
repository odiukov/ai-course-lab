- concept: идентификатор задачи в пути изолирует отчёты параллельно закрываемых задач друг от друга
  question: Два агента одновременно закрывают задачи 903 и 904, каждый пишет итоговый отчёт гейта. Какую роль играет идентификатор задачи в пути отчёта?
  explanation: Фиксированный каталог даёт одно место, идентификатор — одну ячейку внутри него. Без идентификатора параллельные закрытия писали бы в общий файл, и статус задачи 903 зависел бы от того, кто записал последним.
  kind: choice
  options:
    - Он нужен только для читаемости имени файла, вердикт от него не зависит
    - Он разводит результаты разных задач, чтобы второй отчёт не затирал первый и вердикты не смешивались
    - Он позволяет хранить несколько версий отчёта одной задачи
    - Он определяет, чей отчёт считается главным при конфликте вердиктов
  correct: 1
  id: 020-report-path-1
  fingerprint: 668aa861
- concept: промежуточные файлы и логи остаются свидетельствами, а точка объявления статуса ровно одна
  question: 'После прогона на диске лежат: журнал запусков команд, вывод покрытия, дамп диффа и итоговый отчёт гейта. Инструменту нужно узнать, закрыта ли задача. Куда он обращается?'
  explanation: Логи и отчёты инструментов нужны, чтобы объяснить вердикт, но ни один из них его не объявляет. Если статус разрешено выводить из любого свидетельства, разные читатели придут к разным ответам на один и тот же вопрос.
  kind: choice
  options:
    - В журнал запусков — там видно, что все команды завершились кодом 0
    - В любой из файлов, где статус выражен однозначно
    - Только в итоговый отчёт гейта по установленному пути; остальные файлы — свидетельства, а не вердикты
    - В отчёт покрытия, потому что он измеряет результат работы напрямую
  correct: 2
  id: 020-report-path-2
  fingerprint: 8573c3d0
