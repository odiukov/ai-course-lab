- concept: причина и подпись отвечают на разные вопросы, поэтому обязательны обе, а не одна на выбор
  question: Зачем действительная отмена требует одновременно причину и идентификатор человека, а не одного из двух?
  explanation: Отмена должна быть разбираема спустя месяцы. Анонимная причина не даёт адресата для уточнений, подпись без причины не позволяет проверить логику решения. Только вместе они образуют документ, а не лазейку.
  kind: choice
  options:
    - Два поля повышают шанс, что хотя бы одно заполнено корректно
    - Причина отвечает на «почему пропустили», идентификатор — на «кто взял риск»; без первого решение необъяснимо, без второго не с кем разбираться
    - Причина нужна автору задачи, а идентификатор — системе контроля версий
    - Идентификатор задаёт уровень доступа, а причина — срок действия отмены
