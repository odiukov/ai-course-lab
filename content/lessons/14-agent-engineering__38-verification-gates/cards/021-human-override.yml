- concept: подпись должна указывать на конкретного ответственного человека, а не на роль, сервис или безличный идентификатор
  question: В поле подписи отмены стоит значение «system». Объясни своими словами, почему это не считается действительной отменой, даже если причина написана подробно.
  explanation: Проверка идентификатора — не проверка непустоты строки, а проверка связи с человеком. Иначе автоматизация сможет подписывать собственные исключения и обходить гейт легально.
  kind: open
  reference: '«system» (как и имя сервисной учётки или агента) не соответствует человеку, который может нести ответственность за принятый риск. Смысл подписи — восстановить, кого спросить о решении и с кого спрос, если исключение окажется ошибкой. Безличный идентификатор оставляет причину без владельца: формально поле заполнено, фактически решение анонимно, и запрет обойдён без принятия ответственности.'
