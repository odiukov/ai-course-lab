- concept: доказательство требуется для каждой ожидаемой команды поимённо, лишняя запись журнала не закрывает пропуск
  question: Ожидаемых приёмочных команд — 5. В журнале тоже 5 записей, все с нулевым кодом выхода, но одна из записей относится к команде, которой нет в списке ожидаемых, а для команды `lint` записи нет вовсе. Что должна вернуть функция сверки журнала?
  explanation: 'Обход идёт по списку ожидаемых команд, а не по строкам журнала. Совпадение количеств ничего не доказывает: для `lint` нет записи, значит нет свидетельства запуска — блокирующая находка. Лишняя запись про постороннюю команду её не заменяет.'
  kind: choice
  options:
    - 'Пустой список: записей столько же, сколько ожидаемых команд'
    - Блокирующую находку об отсутствии свидетельства запуска для `lint`
    - Предупреждение о лишней записи, поскольку все коды выхода нулевые
    - Пустой список, но с пометкой о перестановке команд
  correct: 1
  id: 008-gate-feedback-1
  fingerprint: eb36abd3
- concept: проверки одной ожидаемой команды идут строго последовательно, каждая следующая осмысленна только при пройденной предыдущей
  question: Расставь шаги проверки одной ожидаемой приёмочной команды в правильном порядке.
  explanation: 'Порядок вынужденный: сравнивать код выхода бессмысленно, пока не найдена запись, а сравнение с нулём невозможно, пока код может быть null. Каждое нарушение даёт свою отдельную находку, а не сливается в одну общую.'
  kind: order
  items:
    - Взять очередную команду из списка ожидаемых приёмочных команд
    - Найти в журнале прогонов запись именно для этой команды; записи нет — блокирующая находка «запуск не подтверждён»
    - Убедиться, что код выхода в найденной записи не null; null — блокирующая находка «результат неизвестен»
    - Сравнить числовой код выхода с нулём; при ненулевом коде — блокирующая находка о провале команды
  id: 008-gate-feedback-2
  fingerprint: 10525fcc
