- concept: дешёвая детерминированная проверка стоит после агента, но перед дорогим качественным ревью
  question: Расставь этапы закрытия задачи в правильном порядке.
  explanation: 'Порядок экономит дорогое ревью: сначала детерминированный фильтр отсекает явный брак (незапущенные команды, запись в запрещённый файл, упавшее блокирующее правило), и только выжившее попадает на содержательную оценку читаемости и стиля.'
  kind: order
  items:
    - 'Проверки задачи записывают свои артефакты: диф, отчёт области изменений, отчёт правил, журнал приёмочных команд'
    - Гейт читает эти артефакты и применяет к ним заранее заданные правила
    - Вердикт записан в единственный отчёт о проверке с признаком `passed`
    - При положительном вердикте задача уходит агенту-ревьюеру на качественную оценку
  id: 003-gate-flow-1
  fingerprint: 89b90cc9
- concept: у вердикта ровно два продолжения; ветка «условно готово» по конструкции отсутствует
  question: 'Гейт выставил `passed: false` из-за блокирующей находки, но агент предлагает отправить работу ревьюеру с пометкой «условно готово, доделаем по замечаниям». Почему такой ветки в схеме нет?'
  explanation: Отрицательный вердикт запрещает объявлять работу готовой и выносит проблему человеку. Как только появляется третья дорога, она становится дорогой по умолчанию, и весь смысл гейта — однозначное следующее действие — исчезает.
  kind: choice
  options:
    - Ревьюер технически не умеет читать пометки к задаче
    - 'Промежуточная ветка возвращает статус в область заявлений агента: «готово» снова определяет его оценка, а не артефакты'
    - Пометка допустима, если ревьюер — человек, а не агент
