- concept: допуск действует только для перечисленных конкретных случаев; ссылка на категорию допуском не является
  question: Проектная политика разрешает часть изменений вне согласованного скоупа. Как записать такой допуск, чтобы он остался проверяемым?
  explanation: Проверяемость требует, чтобы допуск можно было сопоставить с дифом механически. Категория без перечня позволяет объявить служебным что угодно, а решение на стороне автора возвращает субъекта, которого ограничение и должно сдерживать.
  kind: choice
  options:
    - Перечнем конкретных путей или записей, для которых допуск действует
    - Общей формулировкой вида «служебные изменения допустимы»
    - Правом автора задачи объявить изменение служебным при закрытии
  correct: 0
