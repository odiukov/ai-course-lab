- concept: 'запрос помощи с отчётом не равен передаче готовой работы: одно не меняет статус, другое меняет'
  question: Проверка дала отрицательный вердикт. Агент отправляет отчёт человеку с просьбой помочь. Что при этом происходит со статусом задачи?
  explanation: 'Эскалация не трогает статус: она просит вмешательства при сохранённой блокировке. Передача же объявляет работу пригодной для следующего этапа. Если смешать их, отрицательный вердикт превращается в совет, который дешевле обойти, чем выполнить.'
  kind: choice
  options:
    - Статус остаётся незавершённым, блокировка видима; отправка отчёта — эскалация, а не переход в готовность
    - Задача считается переданной, а блокировка становится замечанием для получателя
    - Статус переходит в промежуточный «на рассмотрении», снимающий запрет на завершение
  correct: 0
  id: 029-refuse-done-1
  fingerprint: 78026afc
- concept: проверка должна предшествовать созданию артефакта, который транслирует статус дальше по потоку
  question: Почему проверку запускают до генерации документа передачи, а не после неё?
  explanation: Документ передачи — это утверждение «работа пригодна к следующему этапу». Выпустив его первым, вы получаете артефакт со статусом, который проверка ещё не подтвердила, и отзывать его придётся вручную у всех, кто уже на него сослался.
  kind: choice
  options:
    - Документ передачи фиксирует заявленную готовность и распространяет её дальше; созданный при отрицательном вердикте, он вводит в заблуждение получателей
    - После генерации документа артефакты становятся недоступны для чтения
    - Генерация документа сбрасывает найденные ранее отклонения
  correct: 0
