- concept: падение покрытия измеряется в процентных пунктах (вычитанием), а не в процентах от прошлого значения
  question: На прошлом мерже покрытие было 30%, сейчас 27%. Минимум — 25%, допустимое падение — 5 процентных пунктов. Проходит ли проверка покрытия?
  explanation: 'Порог задан в процентных пунктах: 30 − 27 = 3 пункта. Относительная величина (3 от 30, то есть 10%) к порогу не относится. Смешение двух шкал — самый частый источник ложных вердиктов в этой проверке.'
  kind: choice
  options:
    - 'Не проходит: покрытие упало на 10% относительно прошлого значения, а это больше допустимых 5'
    - 'Проходит: минимум соблюдён, а падение равно 3 процентным пунктам и укладывается в допустимые 5'
    - 'Не проходит: любое снижение покрытия блокирует мерж'
    - 'Проходит: сравнение с прошлым мержем применяется, только когда покрытие ниже минимума'
  correct: 1
  id: 014-coverage-floor-1
  fingerprint: 0714f2a5
- concept: абсолютный минимум и допустимое падение относительно прошлого мержа закрывают разные способы деградации
  question: Почему проверке покрытия недостаточно одной границы — либо абсолютного минимума, либо сравнения с прошлым результатом? Объясни, какой способ деградации пропускает каждая граница поодиночке.
  explanation: 'Две границы отвечают на разные вопросы: «достаточно ли покрытия вообще?» и «не стало ли хуже, чем было?». Значение выше минимума ещё не означает, что покрытие не ухудшилось.'
  kind: open
  reference: 'Только абсолютный минимум разрешает медленное сползание: покрытие спокойно уходит с высокого уровня к самому порогу, и каждый отдельный мерж выглядит законным. Только сравнение с прошлым мержем не даёт резких провалов, но позволяет годами держаться на стабильно низком уровне, потому что база сравнения — это вчерашнее плохое значение. Вместе они защищают и базовый уровень качества, и уже достигнутый: первая граница ловит опасное состояние, вторая — опасную динамику. Нарушение любой из них становится блокирующей находкой.'
  id: 014-coverage-floor-2
  fingerprint: 00b55b96
