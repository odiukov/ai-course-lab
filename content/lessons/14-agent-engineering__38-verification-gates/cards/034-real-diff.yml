- concept: исправляют порождающую причину класса ложных срабатываний, а не отдельные повторяющиеся находки
  question: Прогон по настоящему дифу дал 14 однотипных ложных находок на файлы, которые создаются сборкой автоматически. Что правильно сделать?
  explanation: 'Однотипные срабатывания имеют одну причину: чинится правило. Массовые отмены превращают дисциплину в ритуал, а глобальное понижение серьёзности убивает и настоящий сигнал.'
  kind: choice
  options:
