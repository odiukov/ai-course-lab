- concept: признание находки настоящей и выбор её серьёзности — два отдельных решения калибровки
  question: 'При разборе прогона по реальному дифу находка признана настоящей: она указывает на реальное отклонение. Какое решение остаётся принять?'
  explanation: Настоящее отклонение не обязано быть блокирующим, а опасное изменение, помеченное только предупреждением, требует усиления правила. Поэтому серьёзность калибруется отдельно от вопроса «сигнал или шум».
