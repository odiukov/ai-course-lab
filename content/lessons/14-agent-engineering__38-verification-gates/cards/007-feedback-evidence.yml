  question: Гейту нужно убедиться, что обязательная приёмочная команда действительно запускалась и чем она завершилась. В какой артефакт он смотрит?
  explanation: 'План перечисляет, что должно быть проверено; журнал прогонов фиксирует, что было выполнено и с каким кодом. Из семи проверок гейта три опираются именно на feedback_record.jsonl: запуск был, кода null нет, код нулевой.'
  kind: choice
  options:
