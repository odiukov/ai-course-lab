- concept: разбиение потока по типам позволяет держать узких воркеров с меньшим набором инструментов и коротким промптом вместо универсалов
  question: Объясни своими словами, почему разделение входящего потока на очереди по типам работы удешевляет самого воркера, даже если общее число воркеров не меняется.
  explanation: Экономия здесь не в количестве воркеров, а в сложности каждого. Специализация переносит знание о типах работы из промпта воркера в конфигурацию маршрутизации, где оно задаётся один раз.
  kind: open
  reference: 'Универсальный воркер обязан уметь любую задачу, которая может оказаться в общей очереди: ему нужны инструкции по всем видам работы, все инструменты и весь контекст. Когда поток разделён по типам, воркер подписан на один тип и обслуживает только его. Значит его промпт короче, набор инструментов меньше, шансов на путаницу между несхожими сценариями меньше. При 4 типах и 5 воркерах на тип получается 20 узких исполнителей вместо 20 универсалов — суммарное число то же, но каждый проще, дешевле в токенах и надёжнее. Побочно исчезает класс ошибок «задачу взял неподходящий исполнитель».'
  id: 027-content-routing-2
  fingerprint: 63d3b69a
- concept: длина отдельной очереди типа локализует нехватку мощности до конкретного типа работы, чего общая очередь не показывает
  question: Рой обрабатывает четыре типа заданий. В варианте с общей очередью операторы видят только, что очередь растёт. Что даёт разделение на очереди по типам с точки зрения диагностики?
  explanation: 'Разделение по типам не ускоряет обработку само по себе: суммарная работа та же. Но накопление становится адресным. Если растёт очередь изображений, ясно, куда добавлять воркеров; в общей очереди тот же затор выглядит как «система не справляется» без указания места.'
  kind: choice
  options:
    - Показывает, мощности какого именно типа работы не хватает — растёт конкретная очередь
    - Гарантирует, что суммарная длина очередей перестанет расти
    - Уравнивает длительность заданий разных типов
    - Позволяет обойтись меньшим числом воркеров при той же нагрузке
