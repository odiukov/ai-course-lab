- concept: при разбросе длительностей равномерность нагрузки оценивают суммарным временем занятости воркеров, а не числом взятых задач
  question: Задачи в рое сильно различаются по длительности. Какая метрика честнее показывает, равномерно ли распределилась нагрузка между воркерами?
  explanation: 'Счётчик задач считает штуки, а не работу: воркер с 4 длинными задачами может трудиться дольше воркера с 12 короткими. Суммарная занятость сравнима напрямую, и её разброс сразу показывает, у кого была недогрузка. Счётчики становятся осмысленной метрикой только когда длительности задач сопоставимы.'
  kind: choice
  options:
    - Число задач, взятых каждым воркером из очереди
    - Суммарное время занятости каждого воркера за прогон
    - Порядок, в котором воркеры записывали результаты в общий пул
