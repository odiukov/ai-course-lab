- concept: 'порядок режимов по длине шкалы для одного набора независимых задач: рой не длиннее жёсткого закрепления, а оно не длиннее последовательного'
  question: Один набор независимых задач с разбросом длительностей прогнали в трёх режимах при одном и том же числе воркеров. Расставь режимы по длине временной шкалы — от самой короткой к самой длинной.
  explanation: Sequential складывает все длительности. Fixed assignment работает параллельно, но заканчивается вместе с самым загруженным воркером. Swarm догружает освободившихся из общей очереди и стремится к сумме, поделённой на число воркеров. При равных длительностях задач fixed и swarm сходятся, но fixed никогда не оказывается короче.
  kind: order
  items:
    - 'swarm: воркеры тянут задачи из общей очереди'
    - 'fixed assignment: задачи заранее закреплены за воркерами'
    - 'sequential: все задачи идут друг за другом на одной линии'
