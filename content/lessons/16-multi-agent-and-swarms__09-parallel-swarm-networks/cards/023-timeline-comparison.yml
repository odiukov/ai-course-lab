- concept: пустое место справа на линии воркера при жёстком закреплении означает недоступность закреплённых за другими задач, а не отсутствие работы в системе
  question: На шкале режима fixed assignment линия одного воркера кончается рано, дальше — пустота, а на линии соседа отрезки продолжаются. Что означает эта пустота?
  explanation: 'Работа в системе есть — она видна на линии соседа. Пустота возникает из-за владения: при статическом закреплении задача принадлежит конкретному воркеру. Общая очередь убирает владение, и освободившийся воркер сразу тянет следующий отрезок, из-за чего пустоты почти исчезают.'
  kind: choice
  options:
    - В системе больше не осталось невыполненных задач
    - Воркер свободен, но оставшиеся задачи закреплены за другим воркером и забрать их он не может
    - Воркер сломался и выпал из прогона
    - Воркер ждёт результата задачи соседа, чтобы продолжить свою
