- concept: старение приоритета влияет только на порядок выбора следующей задачи и не меняет длительность её выполнения
  question: Задача выполняется 40 минут и лежит в очереди с включённым старением приоритета. Что изменится в её показателях по сравнению с очередью без старения?
  explanation: Старение — правило упорядочивания в очереди. Оно даёт задаче ход не позже некоторого момента, но 40 минут работы после взятия останутся 40 минутами.
  kind: choice
  options:
    - Сократится время самого выполнения задачи
    - Сократится ограниченным сверху её время ожидания, а длительность выполнения останется прежней
    - Задача будет выполняться параллельно несколькими воркерами
  correct: 1
  id: 032-priority-aging-1
  fingerprint: 3b039f96
- concept: гарантия продвижения при старении исчезает, если рост приоритета упирается в потолок не лучше приоритета вновь поступающих задач
  question: Меньшее число означает более ранний выбор. Ожидающая задача стартует с приоритетом 9 и стареет на единицу за каждый интервал ожидания, но улучшение остановлено на значении 6. Новые срочные задачи поступают с приоритетом 6 непрерывно. Что произойдёт?
  explanation: Гарантия держится на том, что накопленное ожидание рано или поздно перевешивает стартовое преимущество новых задач. Потолок 6 при потоке задач с приоритетом 6 это перевешивание отменяет — остаётся в лучшем случае ничья, разрешаемая произвольно.
  kind: choice
  options:
    - Задача гарантированно будет выбрана, потому что старение включено
    - 'Задача может голодать дальше: дойдя до потолка 6, она перестаёт улучшаться и лишь сравнивается с новыми задачами'
    - Задача получит приоритет 0 и вытеснит все срочные
  correct: 1
  id: 032-priority-aging-2
  fingerprint: 9a8eaecb
