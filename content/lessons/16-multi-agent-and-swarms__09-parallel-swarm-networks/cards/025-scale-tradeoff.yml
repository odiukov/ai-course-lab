- concept: в системе без координатора трассу задачи восстанавливают по сквозному идентификатору сообщения, а не по единому журналу решений
  question: В полностью децентрализованной агентной системе задача завершилась с подозрительным результатом. Что позволяет восстановить её путь через воркеров и очереди?
  explanation: Координатора нет, значит нет и единой последовательности решений «назначил — получил ответ — выбрал следующий шаг». Историю приходится сшивать из распределённых записей, и склеивает их только общий идентификатор сообщения. Подписки говорят, кто мог взять задачу, но не кто взял её фактически.
  kind: choice
  options:
    - 'Сквозной идентификатор сообщения, который записывается на каждом переходе: выдача, подтверждение обработки, повтор, запись результата'
    - Общий журнал координатора, куда попадают все назначения задач
    - Список текущих подписок каждого воркера
    - Порядок элементов в очереди на момент публикации задачи
  correct: 0
  id: 025-scale-tradeoff-1
  fingerprint: 6c34087d
- concept: расхождение часов узлов делает сортировку логов по времени ненадёжным способом восстановить причинный порядок событий
  question: Почему при разборе инцидента в распределённом рое недостаточно собрать логи всех узлов и отсортировать записи по времени?
  explanation: 'Это и есть цена децентрализации: экономия на центральном координаторе оборачивается расходами на идентификаторы, журналирование и восстановление причинности. Таймстамп остаётся полезной подсказкой, но не доказательством порядка.'
  kind: open
  reference: 'Часы разных узлов расходятся, а сообщения задерживаются в сети и в брокере. Поэтому запись «результат получен» может иметь меньший таймстамп, чем породившее её «задача выдана», и порядок по времени не совпадёт с причинной цепочкой. Нужны явные средства связывания: идентификатор сообщения, ссылка на родительскую задачу, номер попытки — то есть причинность фиксируется структурой записей, а не их таймстампами.'
  id: 025-scale-tradeoff-2
  fingerprint: e553b658
- concept: порядок работ при построении трассируемости в системе без координатора
  question: Расставьте шаги, которые делают путь задачи в рое без координатора восстановимым.
  explanation: 'Трассируемость закладывается на публикации, а не на разборе инцидента: если идентификатора не было изначально, склеить распределённые записи потом нечем.'
  kind: order
  items:
    - Присвоить сообщению уникальный идентификатор в момент публикации
    - Записывать на каждом воркере факты получения, подтверждения и повторной попытки вместе с этим идентификатором
    - Собрать все записи разных узлов по одному идентификатору
    - 'Восстановить путь задачи: кто взял, сколько было попыток, где появился результат'
  id: 025-scale-tradeoff-3
  fingerprint: c65b6b29
