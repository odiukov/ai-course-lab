- concept: 'три средства против голодания действуют на разные части системы: порядок внутри очереди, резерв исполнителей, ограничение входящего потока'
  question: Какое средство борьбы с голоданием действует не на порядок задач и не на исполнителей, а на вход в очередь?
  explanation: Старение правит порядок внутри очереди, специализация резервирует исполнителей и оплачивается потерей пропускной способности на быстрых задачах, back-pressure сдерживает поступление работы. Средства не взаимозаменяемы — они лечат разные концы одной проблемы.
  kind: choice
  options:
    - 'Back-pressure: ограничение того, сколько быстрых задач вообще попадает в очередь'
    - Старение приоритета ожидающих задач
    - 'Специализация: часть воркеров берёт только долгие задачи'
    - Увеличение числа воркеров общего профиля
  correct: 0
