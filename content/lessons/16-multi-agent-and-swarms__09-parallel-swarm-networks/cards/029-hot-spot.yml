- concept: 'старение приоритета: приоритет ожидающей задачи улучшается со временем ожидания, что даёт гарантию её выбора'
  question: В очереди с приоритетами меньшее число означает более высокий приоритет. Задача поступила с приоритетом 15, и за каждые 3 минуты ожидания её приоритет уменьшается на 1. Через сколько минут ожидания её приоритет станет равен 6?
  explanation: 'Нужно снизить приоритет на 15 − 6 = 9 пунктов, по одному за 3 минуты: 9 × 3 = 27 минут. Смысл старения в том, что достаточно долго ожидающая задача рано или поздно обязана оказаться впереди свежих быстрых задач.'
  kind: numeric
  answer: 27
  tolerance: 0.1
  id: 029-hot-spot-2
