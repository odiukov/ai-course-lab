- concept: 'голодание и горячая точка требуют разных лечений: порядок выбора внутри очереди против распределения задач между воркерами'
  question: 'Логи показывают: два воркера из семи взяли почти всю работу, времена ожидания задач при этом сопоставимы. Что здесь поможет?'
  explanation: Сопоставимые времена ожидания говорят, что задачи не голодают — перекошен разбор работы. Старение правит порядок внутри очереди и на распределение между воркерами не влияет.
  kind: choice
  options:
    - Старение приоритета — оно выровняет счётчики воркеров
    - 'Исправление распределения задач между воркерами: выборка из очереди, маршрутизация, привязка задач'
    - Увеличение времени выполнения задач у перегруженных воркеров
