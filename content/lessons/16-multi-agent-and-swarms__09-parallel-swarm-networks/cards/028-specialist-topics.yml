- concept: 'подписка на топик задаёт границу компетенции: воркер конкурирует за работу только внутри своей специализации'
  question: Двое переводчиков подписаны на один топик, ещё один воркер — на топик со счетами. Как распределяется работа между ними и почему ошибка «не тот исполнитель взял задачу» не возникает?
  explanation: 'Подписка работает как граница компетенции: соревнование за работу идёт только среди специалистов одного типа, поэтому короткие предметные инструкции остаются достаточными.'
  kind: open
  reference: 'Внутри топика переводов двое подписчиков конкурируют за сообщения: задание забирает тот, кто освободился первым, — самобалансировка сохраняется. За пределы своего топика ни один из них не заходит: сообщения со счетами им попросту не доставляются. Пригодность исполнителя обеспечена топологией подписок, а не проверкой внутри воркера после извлечения задачи.'
