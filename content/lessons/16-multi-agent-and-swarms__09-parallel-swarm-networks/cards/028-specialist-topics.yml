- concept: тип задач, на топик которого никто не подписан, накапливается бесконечно, хотя система работает и ошибок не возникает
  question: Задачи публикуются в топик, у которого нет ни одного подписчика. Что произойдёт?
  explanation: Отправитель не выбирает исполнителя, он лишь публикует в канал; работа выполняется только теми, кто на этот канал подписан. Поэтому покрытие всех типов подписками — отдельное требование к конфигурации, а не следствие работоспособности шины.
  kind: choice
  options:
    - Задачи будут копиться в топике и никогда не будут обработаны, при этом остальные топики работают штатно и ошибок не возникает
    - Задачи автоматически перейдут в ближайший топик с подписчиками
    - Публикация завершится ошибкой, потому что получатель не найден
    - Первый освободившийся воркер любого топика заберёт задачу
