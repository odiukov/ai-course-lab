- concept: queue.Queue выдаёт элемент ровно одному потоку, а общие агрегаты результатов и счётчиков требуют собственной синхронизации
  question: В роевом демо несколько потоков одновременно вызывают `q.get()` у общей `queue.Queue` и дописывают результат в общий список. Где нужна собственная блокировка?
  explanation: '`queue.Queue` синхронизирована внутри: один элемент достаётся ровно одному потоку, дополнительный lock на `get()` не нужен. А обычный список и целочисленные счётчики — нет: одновременные `append` и инкременты надо укрывать локом либо давать каждому воркеру отдельную ячейку.'
  kind: choice
  options:
    - Вокруг `q.get()`, иначе два потока получат одну задачу
    - 'Нигде: и очередь, и список потокобезопасны'
    - Вокруг записи в общий список и счётчики; `q.get()` уже потокобезопасен
    - Только вокруг `q.put()`, чтение защищать не нужно
