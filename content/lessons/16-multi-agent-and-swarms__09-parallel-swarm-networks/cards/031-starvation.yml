- concept: высокая пропускная способность и полная занятость воркеров не свидетельствуют об отсутствии голодания
  question: Все воркеры роя заняты без простоев, счётчик завершённых задач быстро растёт, средняя длина очереди стабильна. Почему эти показатели не доказывают, что голодания нет, и что нужно измерять дополнительно?
  explanation: 'Средние по системе прячут хвост. Нужны метрики на задачу: максимум и перцентили времени ожидания, возраст самой старой записи в очереди.'
  kind: open
  reference: 'Пропускная способность и занятость — агрегаты по всей системе, они складываются из массы коротких задач и не показывают судьбу отдельной работы. Голодание видно только по показателям конкретной задачи: возрастной профиль ожидания, максимальное (а не среднее) время нахождения в очереди, хвостовые перцентили. Задача может лежать часами, пока средние метрики выглядят здоровыми.'
