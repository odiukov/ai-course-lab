- concept: голодающая задача готова к выполнению и исполнитель для неё свободен — препятствие создаёт правило выбора, а не блокировка или нехватка ресурсов
  question: Какая ситуация является именно голоданием задачи, а не другой проблемой?
  explanation: Голодание — про правило выбора. Ожидание чужого результата — незакрытая зависимость, а потерянная у упавшего воркера задача — проблема доставки. В обоих этих случаях менять порядок выборки бесполезно.
  kind: choice
  options:
    - Задача ждёт результата другой задачи, который ещё не записан
    - Задача готова, подходящий свободный воркер есть, но правило выбора каждый раз берёт другую задачу
    - Задача взята воркером, который упал и не вернул её в очередь
  correct: 1
