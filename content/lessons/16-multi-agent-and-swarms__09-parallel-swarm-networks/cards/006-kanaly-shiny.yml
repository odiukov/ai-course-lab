- concept: подключение нового агента к общей шине не требует изменений в уже работающих агентах
  question: Рой из 20 агентов работает через общую шину обмена сообщениями. Подключают 21-го агента. Сколько уже работающих агентов придётся при этом дорабатывать?
  explanation: 'В этом и выгода шины: точка подключения одна на агента. При прямых каналах 21-й участник потребовал бы 20 новых связей и правки во всех 20 существующих агентах; через шину стоимость подключения не зависит от размера роя.'
  kind: choice
