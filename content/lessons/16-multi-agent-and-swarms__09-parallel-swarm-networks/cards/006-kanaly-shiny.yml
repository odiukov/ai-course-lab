- concept: шина сокращает число каналов, но не даёт агентам знания о составе роя и не заводит им списки соседей
  question: Что общая шина обмена сообщениями НЕ даёт агентам роя?
  explanation: 'Шина решает ровно одну задачу — убирает индивидуальные каналы. Знание состава роя она не добавляет: агент видит только общий интерфейс обмена, а не список коллег и их состояние. Ожидать от шины реестра участников — типичная подмена: за это отвечают отдельные механизмы (discovery, реестр состояний).'
  kind: choice
  options:
    - Единый интерфейс отправки и приёма сообщений
    - Возможность работать, не зная, сколько всего агентов запущено
    - Актуальный список соседей и знание, кто из агентов чем сейчас занят
    - Сокращение числа прямых связей между агентами
