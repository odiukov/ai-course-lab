- concept: 'wall-clock жёсткого режима замеряется вокруг всей группы потоков: таймер стартует до запуска и останавливается после ожидания последнего потока'
  question: Расставь шаги замера времени режима жёсткого назначения в правильном порядке.
  explanation: Прогон заканчивается вместе с самым медленным потоком, поэтому таймер останавливают после ожидания всех потоков. Если остановить его сразу после старта, измерится время запуска, а не обработки.
  kind: order
  items:
    - Разложить задачи по отдельным спискам — по одному списку на воркера
    - Запустить таймер
    - Стартовать потоки, каждый со своим списком задач
    - Дождаться завершения всех потоков
    - Остановить таймер и посчитать прошедшее время
  id: 018-simulate-fixed-1
  fingerprint: c68d985d
- concept: отдельная ячейка результата на воркера снимает одновременную запись нескольких потоков в один счётчик
  question: Три потока считают, сколько задач выполнил каждый. Зачем каждому потоку выделять собственную ячейку результата вместо общего счётчика?
  explanation: Общий счётчик изменяют несколько потоков одновременно, и часть инкрементов может пропасть. Своя ячейка на воркера убирает конкуренцию за запись; на распределение задач и порядок запуска это не влияет.
  kind: choice
  options:
    - Чтобы потоки не изменяли одновременно одну и ту же переменную и счёт не терялся
    - Чтобы потоки запускались в детерминированном порядке
    - Чтобы задачи распределялись между потоками равномернее
