- concept: 'круговая раздача задач по воркерам: остаток от деления достаётся первым воркерам, последние получают меньше'
  question: '20 задач раздают заранее по кругу трём воркерам: первую — первому, вторую — второму, третью — третьему, четвёртую снова первому и так далее. Сколько задач окажется в списке последнего воркера?'
  explanation: '20 = 3 × 6 + 2, поэтому два первых воркера получают по 7 задач, а последний — 6. Списки почти равны по количеству, но это ничего не говорит о времени: оно зависит от длительностей попавших задач.'
  kind: numeric
  answer: 6
  tolerance: 0.5
