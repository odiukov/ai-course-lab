- concept: оценка wall-clock роя — суммарная длительность задач, поделённая на число воркеров
  question: Задачи независимы, коротки и однородны по длительности, их суммарная длительность 119 секунд. Рой из 7 воркеров тянет их из общей очереди, балансировка близка к идеальной. Какого wall-clock стоит ожидать (в секундах)?
  explanation: '119 / 7 = 17 с. Рой стремится к этому пределу: освободившийся воркер сразу берёт следующую задачу, поэтому работа размазывается по всем воркерам почти без простоев. Приблизиться к сумме, поделённой на число воркеров, мешают только крупные задачи в конце и накладные расходы.'
  kind: numeric
  answer: 17
  tolerance: 1
