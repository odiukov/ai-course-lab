- concept: сравнение режимов по времени корректно только при одинаковом наборе задач и одинаковом числе воркеров
  question: 'Инженер сравнивает fixed assignment и swarm по настенным часам: fixed прогонял 30 задач на 7 воркерах, swarm — 44 задачи на 11 воркерах. Что не так с выводом «swarm быстрее»?'
  explanation: 'Отношение времён говорит о способе распределения только при равных условиях: тот же набор задач, то же число воркеров, тот же охватываемый секундомером участок. При разном объёме работы и разном числе воркеров измерены две разные системы.'
  kind: choice
  options:
    - 'Ничего: настенные часы измерены в обоих режимах, сравнение корректно'
    - Отличаются и набор задач, и число воркеров — разница во времени отражает разный объём работы и ресурсов, а не способ распределения
    - Надо было сравнивать не время, а число задач у каждого воркера
    - Swarm нельзя сравнивать с fixed, потому что порядок завершения у него не детерминирован
