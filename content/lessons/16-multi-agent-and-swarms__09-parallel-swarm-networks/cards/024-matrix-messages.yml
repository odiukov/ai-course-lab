- concept: в полностью очередной модели предел масштабирования переносится с координатора на брокер сообщений
  question: Координация нескольких агентов полностью сведена к публикации и подписке на топики. Где теперь находится предел масштабирования системы?
  explanation: Агента-раздатчика в схеме нет, значит его частота решений больше ничего не ограничивает. Остаётся пропускная способность брокера — инфраструктурная задача, которую очередные системы решают на порядки лучше, чем один агент-планировщик.
  kind: choice
  options:
    - В частоте решений центрального агента-раздатчика
    - В способности брокера принимать, хранить и раздавать сообщения
    - В числе прямых каналов между агентами, которое растёт квадратично
    - В размере контекстного окна самого нагруженного агента
  correct: 1
