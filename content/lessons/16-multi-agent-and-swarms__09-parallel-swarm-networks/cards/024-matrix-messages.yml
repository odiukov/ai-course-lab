- concept: отказоустойчивость обеспечивается долговечностью сообщений в очереди, а не резервным координатором
  question: В полностью очередной модели координации (и данные, и управление — сериализованные сообщения) воркер падает посреди обработки. За счёт чего работа не теряется?
  explanation: 'Устойчивость в такой модели держится на свойстве транспорта: сообщение сохранено в очереди и не исчезает вместе с воркером. Резервный координатор не нужен — его вообще нет в схеме.'
  kind: choice
  options:
    - Сообщение долговечно хранится в брокере, поэтому после восстановления обработку можно продолжить
    - Резервный supervisor замечает падение и переназначает задачу
    - Соседние агенты держат копии состояния упавшего воркера
    - Каждый агент перед обработкой рассылает состояние всем остальным подписчикам
  correct: 0
  id: 024-matrix-messages-2
