- concept: проверка пригодности роя — разбить работу на задания и убедиться, что каждое может начаться немедленно
  question: Тебе дали большую работу и спрашивают, годится ли рой. Какую проверку ты выполняешь, прежде чем ответить?
  explanation: Признак пригодности — независимость заданий, а не масштаб работы. Скрейпинг сотен страниц подходит, отчёт с зависимыми главами — нет.
  kind: open
  reference: 'Разбить работу на отдельные задания и для каждого спросить: доступны ли все его входные данные прямо сейчас, без результатов соседних заданий. Если да — задания независимы, рой подходит, особенно при разбросе длительностей и когда важно общее время. Если часть заданий ждёт результата других, независимого набора нет: рой не устранит зависимость, лишние воркеры будут простаивать. Размер работы сам по себе аргументом не является.'
