- concept: минимальное время цепочки зависимых этапов равно сумме её звеньев и не сокращается добавлением воркеров
  question: Работа состоит из 5 этапов, каждый занимает 6 минут, и каждый этап использует результат предыдущего. В распоряжении 12 воркеров. За сколько минут в лучшем случае завершится вся работа?
  explanation: 'Этапы связаны цепочкой: второй не может начаться раньше конца первого. Параллелизм здесь не применим, время равно 5 × 6 = 30 минут при любом числе воркеров. Такая работа рою не подходит — свободные воркеры просто ждут.'
  kind: numeric
  answer: 30
  tolerance: 0.5
  id: 014-check-fit-1
  fingerprint: f6eee98e
- concept: рой уместен, когда критерием успеха является общее время завершения пачки, а не воспроизводимый порядок обработки
  question: Пачку из 600 документов нужно классифицировать. Какое требование заказчика делает рой неподходящим выбором?
  explanation: 'Рой обменивает детерминизм на пропускную способность: воркеры завершают задачи в произвольном порядке. Требование «общее время» и разброс длительностей — как раз аргументы в пользу роя, а требование потоковой записи в исходном порядке ему противоречит.'
  kind: choice
  options:
    - Уложиться в минимальное общее время обработки пачки
    - Записывать результаты строго в том порядке, в котором документы поступали, по мере готовности
    - 'Обрабатывать документы разной длины: от одной страницы до сотен'
  correct: 1
