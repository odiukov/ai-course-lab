- concept: 'pull-модель: освободившийся воркер сам запрашивает следующую задачу вместо ожидания назначения'
  question: В роевой архитектуре воркер закончил свою задачу, а необработанные задачи ещё есть. Что он делает дальше?
  explanation: 'Рой инвертирует направление: работу не раздают (push), её забирают (pull). Ни центральное решение, ни знание о других воркерах не нужны — воркер знает только очередь. Если задач нет, он просто ждёт поступления.'
  kind: choice
  options:
    - Сообщает центральному агенту о готовности и ждёт, пока тот подберёт ему работу
    - Сам запрашивает следующую доступную задачу из общей очереди
    - Опрашивает остальных воркеров, чтобы узнать, кто перегружен, и забирает часть его работы
    - Пересчитывает приоритеты общей цели и выбирает, какую задачу считать важнее
  correct: 1
  id: 002-pull-model-1
  fingerprint: e54b7c3b
- concept: выдача задачи из очереди сопровождается пометкой «занята», иначе двое воркеров возьмут одну работу
  question: Двенадцать воркеров одновременно тянут задачи из общей очереди. Что обеспечивает, что один и тот же элемент работы не будет обработан дважды?
  explanation: 'Атомарная выдача с пометкой «занята» — и есть та «координация, встроенная в семантику очереди». Без неё pull-модель разваливается: без предварительного закрепления диапазонов ничто не мешает двум воркерам взять одну задачу.'
  kind: choice
  options:
    - Воркеры перед взятием задачи согласуют выбор между собой
    - Очередь при выдаче задачи сразу помечает её занятой, и другим она уже не достаётся
    - Каждому воркеру заранее закреплён свой диапазон задач
    - Дубли неизбежны, поэтому лишние результаты отбрасывают на этапе записи
  correct: 1
  id: 002-pull-model-2
  fingerprint: '45588883'
- concept: 'pull-модель балансирует нагрузку сама: доля выполненной работы определяется фактической скоростью воркера'
  question: 'В очереди 300 разнородных документов: короткие квитанции и длинные договоры. Объясни, почему при pull-модели быстрый воркер обработает больше документов, чем медленный, хотя распределение никто не рассчитывал заранее.'
  explanation: 'Это главное практическое преимущество pull-модели над предварительным разделением: неоднородная длительность задач больше не приводит к простою, и оценивать сложность задач заранее не требуется.'
  kind: open
  reference: 'Каждый воркер повторяет цикл «взял — выполнил — записал — запросил следующую». Кто раньше освободился, тот раньше вернётся за новой задачей, поэтому количество взятых задач автоматически пропорционально фактической скорости воркера. Никакого заранее рассчитанного плана нет: балансировка получается как побочный эффект правила выдачи. При статическом делении (по 25 документов каждому) быстрый воркер простаивал бы, а медленный оставался бы с тяжёлым остатком.'
  id: 002-pull-model-3
  fingerprint: ddc5c32f
