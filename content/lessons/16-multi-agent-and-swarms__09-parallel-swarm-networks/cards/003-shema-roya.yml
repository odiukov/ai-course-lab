- concept: 'цикл воркера в рое: pull, process, write'
  question: Расставь действия одной итерации воркера роевой сети в правильном порядке.
  explanation: 'Вся роевая схема сводится к трём строчкам цикла: pull, process, write. Воркер не начинает с опроса коллег и не заканчивает докладом оркестратору — оркестратора нет.'
  kind: order
  items:
    - Забрать задачу из общей очереди
    - Обработать задачу
    - Записать результат в общий пул результатов
  id: 003-shema-roya-1
  fingerprint: 0e63db3f
- concept: порождённое продолжение работы возвращается в ту же общую очередь и достаётся любому свободному воркеру
  question: Обрабатывая свой фрагмент, воркер обнаружил, что нужна ещё одна порция работы — проверка связанного фрагмента. Как это устроено в роевой архитектуре?
  explanation: 'Продолжение — обычная задача, а очередь — единственный вход работы. Возврат продолжения в очередь сохраняет свойство «воркер знает только очередь»: адресной передачи между воркерами в схеме нет, а пул результатов хранит готовое, а не будущую работу.'
  kind: choice
  options:
    - Воркер выполняет продолжение сам, чтобы не терять контекст
    - Воркер кладёт новую задачу в ту же общую очередь, и её заберёт любой свободный воркер
    - Воркер передаёт продолжение напрямую конкретному соседу, у которого меньше загрузка
    - Воркер записывает продолжение в пул результатов как незавершённый элемент
  correct: 1
