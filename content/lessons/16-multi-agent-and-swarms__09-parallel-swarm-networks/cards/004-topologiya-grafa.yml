- concept: узел топологии обозначает роль или общее хранилище, а не физическую машину
  question: Роевую систему развернули на 4 серверах; всего запущено 12 процессов-воркеров с разными именами, плюс общая очередь и пул результатов. Сколько узлов-воркеров содержит топология этой системы?
  explanation: Узлы топологии — это роли и общие точки хранения, а не железо. 12 процессов-воркеров дают 12 узлов независимо от того, что они уплотнены на 4 машины; очередь и пул добавляют к ним ещё два узла другого вида.
  kind: numeric
