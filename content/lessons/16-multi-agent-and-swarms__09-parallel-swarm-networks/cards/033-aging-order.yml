  question: Чем заполнить пропуск, чтобы при равных приоритетах Python не пытался сравнивать сами объекты задач?
  explanation: При равенстве первых элементов кортежа сравнение переходит ко второму. Монотонный счётчик всегда сравним и заодно задаёт FIFO среди равных; без него сравнение дойдёт до `task` и упадёт с TypeError, если у полезной нагрузки нет порядка.
