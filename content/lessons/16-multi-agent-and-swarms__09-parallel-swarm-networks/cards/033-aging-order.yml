- concept: ключ уже вставленной записи не пересчитывается сам, поэтому старение требует пересчёта приоритета в момент выбора или переупорядочивания ожидающих записей
  question: Эффективный приоритет с учётом ожидания вычисляется один раз — в момент `put()`. Почему при этом старения фактически не происходит?
  explanation: Куча упорядочена по ключу, зафиксированному при вставке; сама она ничего не пересчитывает. Пока запись лежит, её ключ не меняется, поэтому эффективный приоритет надо считать перед выборкой — пересобирая очередь или переупорядочивая ожидающие записи.
  kind: choice
  options:
    - Потому что на момент вставки время ожидания равно нулю и ключ навсегда остаётся равным базовой важности
    - Потому что PriorityQueue хранит записи в порядке вставки
    - Потому что несколько потоков перезаписывают ключ друг друга
