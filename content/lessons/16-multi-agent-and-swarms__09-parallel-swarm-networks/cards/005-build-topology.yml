- concept: 'узлы графа различаются по имени: одинаковые имена воркеров склеиваются в один узел'
  question: Функция строит топологию на 6 воркеров, но всем воркерам присваивает одно и то же имя узла. Что получится?
  explanation: Идентичность узла в графе задаёт его имя. Шесть одинаковых имён — это один узел с шестью повторно заданными связями, и параллелизма в такой топологии нет. Отсюда требование уникальных имён вида worker-0 … worker-5.
  kind: choice
  options:
    - Шесть узлов, различимых по порядку добавления
    - 'Один узел-воркер: повторные добавления с тем же именем ссылаются на тот же узел'
    - Шесть узлов, но связи достанутся только первому из них
    - 'Ошибка построения: граф не примет узел без уникального типа'
  correct: 1
  id: 005-build-topology-1
  fingerprint: 0c134c74
- concept: 'набор связей роевой топологии: воркер—очередь и воркер—пул, без связей воркер-воркер и без узла supervisor'
  question: Какой набор связей соответствует децентрализованной роевой топологии?
  explanation: Правильный вариант описывает цикл pull → process → write и только его. Появление узла supervisor возвращает то самое узкое место, а связи воркер—воркер ломают свойство «воркер знает лишь две общие точки — откуда брать и куда писать».
  kind: choice
  options:
    - supervisor → каждый воркер, каждый воркер → пул результатов
    - Каждый воркер ← очередь (получение задачи), каждый воркер → пул результатов, воркер → очередь для продолжений
    - Каждый воркер ↔ каждый другой воркер, плюс общая очередь как резерв
    - Очередь → supervisor → воркеры → очередь
  correct: 1
  id: 005-build-topology-2
  fingerprint: e0800f67
- concept: 'признак корректного масштабирования: очередь и пул остаются единственными экземплярами при любом числе воркеров'
  question: Как проверить, что функция построения роевой топологии корректно масштабируется, вызвав её на 2, 6 и 7 воркерах?
  explanation: 'Инвариант роя: общие точки — по одному экземпляру, воркеры — однотипные повторы. Квадратичный рост связей означал бы прямые каналы между воркерами, а размножение очереди или пула — потерю единой точки координации.'
  kind: choice
  options:
    - Убедиться, что число узлов очереди и пула растёт вместе с числом воркеров
    - Убедиться, что различий в топологиях нет, кроме их размера
    - Убедиться, что растёт только число узлов-воркеров и их связей к единственной очереди и единственному пулу
    - Убедиться, что число связей растёт квадратично относительно числа воркеров
  correct: 2
  id: 005-build-topology-3
  fingerprint: f1cf013d
