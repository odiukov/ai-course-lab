- concept: упреждающее распределение требует знания длительности задач, которая часто выясняется только во время выполнения
  question: Почему заранее составленный план распределения задач между воркерами часто оказывается несбалансированным?
  explanation: Чтобы разложить задачи поровну по времени, нужно знать это время заранее. На практике оно выясняется в процессе. Поэтому распределение по факту освобождения работает там, где упреждающий план вынужден угадывать.
  kind: choice
  options:
    - Потому что воркеры имеют разную вычислительную мощность
    - 'Потому что длительность задачи обычно неизвестна до выполнения: одна страница отвечает мгновенно, другая тормозит'
    - Потому что число задач не делится нацело на число воркеров
    - Потому что план распределения занимает слишком много памяти
  correct: 1
