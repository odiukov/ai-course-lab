- concept: степень узла-хаба растёт с числом воркеров, а степень воркера остаётся постоянной
  question: В роевой топологии 9 воркеров тянут задачи из одной общей очереди и пишут результаты в общий пул. Сколько каналов сходится в узле очереди?
  explanation: 'Очередь — хаб: с ней соединён каждый воркер, поэтому её степень равна 9 и растёт вместе с сетью. Степень отдельного воркера при этом всегда 2. Нагрузка на хаб — плата за линейный общий рост каналов.'
