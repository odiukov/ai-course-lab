- concept: канал определяется парой узлов, а не числом операций, выполняемых по нему
  question: Воркер забирает задачу из общей очереди, а после обработки кладёт в ту же очередь задачу-продолжение. Сколько каналов между этим воркером и очередью учитывается в графе топологии?
  explanation: Топология считает соединения, а не действия. Чтение и запись идут по одному и тому же каналу воркер—очередь. Путать операции с каналами — типичная причина завышенного подсчёта.
  kind: choice
