- concept: проверка связности как обход от одного узла с накоплением достижимых и сравнением их числа с числом узлов
  question: Расставь шаги проверки связности графа обходом в правильном порядке.
  explanation: Обход даёт множество узлов, достижимых от старта. Равенство его размера общему числу узлов и есть проверяемое условие связности; неравенство означает существование отдельной компоненты.
  kind: order
  items:
    - Взять произвольный узел за стартовый и поместить его в множество посещённых
    - Достать узел из списка необработанных и просмотреть его связи
    - Каждого соседа, которого нет в множестве посещённых, отметить посещённым и добавить в список необработанных
    - Повторять, пока список необработанных не опустеет
    - Сравнить размер множества посещённых с общим числом узлов графа
  id: 009-is-connected-2
  fingerprint: f0c474c7
- concept: множество посещённых нужно, чтобы взаимные связи узлов не приводили к бесконечному обходу
  question: Зачем при обходе графа для проверки связности хранить множество посещённых узлов?
  explanation: Связи двунаправленные, поэтому без отметок обход будет бесконечно возвращаться между парой узлов. Множество посещённых обеспечивает завершение и одновременно служит счётчиком достижимых узлов.
  kind: choice
  options:
    - Чтобы обход не ходил по кругу на взаимных связях и гарантированно завершился
    - Чтобы измерить длину кратчайшего пути между узлами
    - Чтобы узлы с единственной связью не попали в результат
    - Чтобы порядок обхода совпал с порядком объявления узлов
  correct: 0
  id: 009-is-connected-3
