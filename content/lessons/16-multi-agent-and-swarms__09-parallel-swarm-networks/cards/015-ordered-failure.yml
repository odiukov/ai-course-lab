- concept: порядок извлечения задач из очереди не задаёт порядок их завершения
  question: Этапы A, B и C одного конвейера положили в общую очередь именно в этом порядке; B использует результат A, C — результат B. Восемь свободных воркеров разбирают очередь. Гарантирует ли порядок постановки, что B увидит готовый результат A?
  explanation: 'B забирают через миллисекунды после A, а A может считаться минуты. Зависимость — это запрет на запуск до появления входных данных, а очередь такого условия не хранит: она знает только «задача есть». Порядок обеспечивает supervisor или граф зависимостей.'
  kind: choice
  options:
    - 'Нет: очередь задаёт лишь порядок выдачи задач, а не порядок их завершения'
    - 'Да: FIFO-очередь выдаёт задачи по порядку, значит и завершение пойдёт по порядку'
    - Да, если воркеров не меньше, чем этапов
  correct: 0
  id: 015-ordered-failure-1
  fingerprint: 4104937b
- concept: нарушенная зависимость в общей очереди даёт недетерминированный сбой, зависящий от таймингов
  question: Конвейер с зависимыми этапами, положенными в общую очередь, иногда отрабатывает корректно, а иногда падает на пустых входных данных. Объясни, почему сбой плавающий.
  explanation: Это гонка, а не ошибка данных. Такие сбои дорого воспроизводить, поэтому зависимость нужно выражать явно, а не надеяться на порядок постановки в очередь.
  kind: open
  reference: Корректность здесь получается случайно. Зависимый этап забирают тогда, когда его успел взять свободный воркер, а не тогда, когда готов вход. Если предыдущий этап случайно завершился раньше (быстрый ответ сервиса, меньше воркеров, задержка при выдаче), результат уже лежит в пуле и всё проходит. Если нет — этап читает пустое значение. Исход определяют тайминги, поэтому один и тот же код ведёт себя по-разному в разных прогонах; на машине с меньшим числом воркеров баг может вообще не проявляться.
  id: 015-ordered-failure-2
  fingerprint: 133dcbd2
