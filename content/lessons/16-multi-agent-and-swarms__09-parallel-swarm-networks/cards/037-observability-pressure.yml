- concept: длина очереди растёт со скоростью, равной разнице между темпом поступления и темпом обработки
  question: В сервис поступает 300 задач в секунду, а рой воркеров успевает завершать 200 задач в секунду. Очередь стартовала пустой. Сколько задач будет ждать в очереди через 240 секунд?
  explanation: 'Очередь копит разницу темпов: 300 − 200 = 100 задач в секунду. За 240 секунд накапливается 100 × 240 = 24000 задач. Ошибок при этом нет и воркеры полностью заняты — перегрузка видна только по росту очереди и времени ожидания.'
  kind: numeric
  answer: 24000
  tolerance: 1
  id: 037-observability-pressure-1
  fingerprint: 1343cf4d
- concept: метки времени одного trace ID делят задержку на ожидание в очереди и время обработки, что указывает, какое звено виновато
  question: 'По записям с одним trace ID видно: задача поступила в очередь в момент 0, воркер забрал её в момент 45 с, завершил в момент 51 с. Что это говорит о причине задержки?'
  explanation: 'Из 51 секунды жизни задачи 45 приходится на лежание в очереди и только 6 — на работу воркера. Разбиение сквозной задержки по меткам одного trace ID и локализует звено: тут добавлять надо воркеров, а не оптимизировать обработку.'
  kind: choice
  options:
    - 'Тормозит сама обработка: воркеру не хватает ресурсов или инструмент отвечает медленно'
    - 'Тормозит ожидание в очереди: мощности воркеров не хватает под входящий поток'
    - 'Ничего сказать нельзя: по меткам времени вклад очереди и вклад обработки не разделяются'
  correct: 1
  id: 037-observability-pressure-2
  fingerprint: ac33e777
- concept: back-pressure ограничивает темп поступления, приводя вход в соответствие с пропускной способностью; измерение затора само его не устраняет
  question: Мониторинг показывает, что очередь растёт непрерывно, а воркеры заняты на 100%. Что такое back-pressure и почему одной наблюдаемости здесь недостаточно?
  explanation: 'Наблюдение и регулирование — разные функции. Trace ID отвечает на вопрос «где потерялось время», back-pressure — на вопрос «как не дать очереди расти»: без ограничения входа единственный исход при 120 задач/с против 80 задач/с — бесконечно растущее ожидание.'
  kind: open
  reference: 'Наблюдаемость (trace ID, длина очереди, возраст самой старой задачи) только измеряет затор — темп поступления она не меняет, поэтому очередь и память продолжают расти. Back-pressure — обратный сигнал производителю по потоку: при превышении порога (длина очереди или время ожидания старейшей задачи) производитель притормаживает, делает паузу или отклоняет запросы с предложением повторить позже. Тем самым темп входа принудительно опускается до фактической пропускной способности роя, и очередь перестаёт расти неограниченно. Метрики нужны как источник порога для срабатывания back-pressure, но решают проблему не они.'
  id: 037-observability-pressure-3
  fingerprint: 07c22685
