- concept: выигрыш роя над жёстким назначением определяется разбросом длительностей задач, а при равных длительностях исчезает
  question: В каком случае жёсткое закрепление задач даст практически то же время прогона, что и рой с общей очередью?
  explanation: 'Преимущество роя берётся из разброса длительностей: он позволяет освободившемуся воркеру взять ещё работу. При равных длительностях и делении без остатка оба режима заканчивают одновременно, и разрыв тем больше, чем сильнее разброс.'
