- concept: мгновенная пустота очереди не является признаком завершения работы, пока есть воркер, чья задача может породить продолжение
  question: 'Рой из 9 воркеров тянет задачи из общей очереди, и обработка задачи может добавить в очередь продолжение. Наблюдатель видит: очередь пуста, но часть воркеров ещё занята обработкой. Можно ли считать работу роя законченной?'
  explanation: «Пусто сейчас» и «работа закончена» — разные утверждения. Пока хотя бы один воркер обрабатывает задачу, способную породить продолжение, очередь может снова наполниться. Признак завершения — пустая очередь плюс отсутствие задач в обработке; только после этого её закрывают и новые задачи не принимаются.
  kind: choice
  options:
    - 'Нет: занятые воркеры могут положить в очередь продолжения, и пустота окажется временной'
    - 'Да: пустая очередь — достаточный признак того, что работы больше не будет'
    - Да, если пустоту очереди зафиксировали дважды подряд
    - Нет, потому что воркеры обязаны обработать одинаковое число задач
  correct: 0
  id: 019-worker-loop-1
  fingerprint: c5ad9606
- concept: при пустой, но не закрытой очереди воркер ждёт, а не завершается
  question: 'Воркер роя выполнил pull и не получил задачу: очередь пуста, сигнала о закрытии не было. Что он должен сделать?'
  explanation: 'Пустая очередь может быть пустой лишь временно: соседи ещё пишут результаты и продолжения. Поэтому выход воркера привязывают не к пустоте, а к явному сигналу закрытия. Ранний выход по пустой очереди уменьшает рой до нуля воркеров ещё до конца работы.'
  kind: choice
  options:
    - 'Завершить поток: задач нет, значит работа закончена'
    - Ждать появления задачи или сигнала о закрытии очереди
    - Забрать задачу у соседнего воркера напрямую
    - Создать себе искусственную задачу, чтобы не простаивать
  correct: 1
  id: 019-worker-loop-2
