- concept: порядок результатов восстанавливают номерами задач и сортировкой после обработки, а не ограничением параллелизма
  question: Рой обрабатывает 480 независимых задач, но итоговый отчёт нужно выдать в том же порядке, в котором задачи были поставлены. Как получить нужный порядок, не теряя пропускной способности?
  explanation: 'Порядок нужен только на выдаче, а не на вычислении. Номер задачи — дешёвая метка, сортировка 480 готовых результатов стоит миллисекунды. Два других варианта убивают параллелизм: воркеры простаивают ради порядка, который можно восстановить потом.'
  kind: choice
  options:
    - Хранить при каждой задаче её номер и отсортировать собранные результаты после обработки
    - Выдавать воркерам по одной задаче и не начинать следующую, пока не завершилась предыдущая
    - Оставить в работе одного воркера, чтобы результаты появлялись строго последовательно
  correct: 0
  id: 013-throughput-first-1
  fingerprint: 617a96df
- concept: пропускная способность — число завершённых задач, делённое на затраченное время
  question: Рой из 6 воркеров завершил 480 задач за 60 секунд. Какова пропускная способность сети в задачах в секунду?
  explanation: 480 / 60 = 8 задач в секунду. Пропускная способность измеряет завершённую работу за время и не зависит от того, в каком порядке эти 480 результатов появились.
  kind: numeric
  answer: 8
  tolerance: 0.1
  id: 013-throughput-first-2
  fingerprint: cbbdca5b
- concept: порядок завершения задач в рое не детерминирован и может отличаться между прогонами
  question: Один и тот же набор независимых задач прогнали в рое дважды, и последовательность появления результатов оказалась разной. Что это значит?
  explanation: Рой не воспроизводит порядок, он занимает освободившиеся мощности. Короткая задача обгоняет длинную, а разброс времён ответа внешних сервисов меняет картину от прогона к прогону. Проверять надо состав результатов, а не их последовательность.
  kind: choice
  options:
    - 'Это нормально: порядок завершения зависит от фактических длительностей задач и момента освобождения воркеров'
    - Очередь потеряла часть задач и подставила их в другом месте
    - 'Число воркеров подобрано неверно: при правильном числе порядок повторяется'
  correct: 0
  id: 013-throughput-first-3
  fingerprint: 45b494ae
