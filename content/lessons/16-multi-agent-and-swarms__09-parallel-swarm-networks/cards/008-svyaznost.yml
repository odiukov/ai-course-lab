- concept: 'взаимодействие через общий узел не требует адресации: отправитель не выбирает получателя'
  question: Агент завершил часть работы и должен передать продолжение другому агенту, но не знает ни его имени, ни его состояния. Объясни, как продолжение всё-таки доходит до исполнителя и почему это не адресная передача.
  explanation: 'Ключевое различие: «между узлами есть путь» ≠ «узлы соединены каналом». Общий узел даёт достижимость без адресации, поэтому агенты остаются незнакомцами, а сеть — связной.'
  kind: open
  reference: 'Агент кладёт продолжение в общее хранилище (очередь), а не отправляет конкретному получателю. Позже его забирает тот агент, который окажется свободным. В топологии между двумя агентами существует путь через общий узел, но это возможный маршрут, а не персональный канал: отправитель не выбирает адресата и не знает состав сети. Достижимость обеспечивает общий узел, а не знание друг о друге.'
