- concept: операция, задающая итоговое состояние, идемпотентна сама по себе, а операция-приращение требует внешнего ключа идемпотентности
  question: Какая из операций остаётся безопасной при повторной доставке без дополнительного учёта обработанных ID?
  explanation: Присвоение конечного состояния даёт тот же результат при любом числе повторов. Приращение и отправка письма накапливают эффект, поэтому им нужен постоянный ID задачи и запись о том, что этот ID уже обработан.
  kind: choice
  options:
    - «прибавить к балансу 700 бонусов»
    - «установить баланс равным 700 бонусам»
    - «отправить клиенту письмо о начислении»
