- concept: выполнение действия и отметка ID обработанным должны быть неделимы, иначе падение между ними возвращает дублирование
  question: Воркер проверяет, обработан ли ID, выполняет начисление, затем отдельным шагом записывает ID в таблицу обработанных. Какой сбой ломает идемпотентность и как это чинят?
  explanation: Проверка-действие-отметка идемпотентны только целиком. Любой зазор внутри этой последовательности — точка, где повтор снова даёт двойной эффект.
  kind: open
  reference: 'Падение между начислением и записью ID: задача вернётся в очередь, проверка не найдёт ID и начисление повторится. Чинят объединением изменения данных и записи ID в одну транзакцию (или записью ID с уникальным ограничением как частью того же коммита). Когда действие выполняет внешний сервис, тот же ID передают ему ключом идемпотентности, и дедупликацию делает он.'
