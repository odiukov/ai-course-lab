- concept: условия активации перепроверяются при изменении состояния сети, а не по расписанию переходов
  question: Что заставляет роевой граф проверить, какая нода может проснуться следующей?
  explanation: 'Отсюда и разница с расписанием: в supervisor-графе следующая нода известна из ребра, в роевом — вычисляется из текущей занятости исполнителей и наличия подходящей работы.'
  kind: open
  reference: 'Изменение состояния: появилась новая незакрытая задача, освободился воркер, записан результат предыдущей работы. После такого изменения перебираются условия активации, и просыпается та нода, чьё условие сейчас выполнено. Триггером служит именно состояние, а не завершение конкретной предыдущей ноды по прописанному переходу.'
