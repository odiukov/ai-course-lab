- concept: циклы в направленном роевом графе возникают из-за повторной активации одной и той же ноды, возвращающейся в пул после завершения работы
  question: Почему роевую архитектуру описывают как направленный граф с циклами, хотя каждое ребро направлено?
  explanation: 'Цикл — это не ошибка топологии, а нормальный режим: 6 доступных нод могут по очереди просыпаться десятки раз за прогон. Граф описывает разрешённые активации, а не однократный маршрут.'
  kind: choice
  options:
    - Потому что нода после завершения работы возвращается в пул доступных и может активироваться снова, пока подходящая работа остаётся
    - Потому что данные обязаны пройти по графу в обе стороны для подтверждения
    - Потому что каждая нода соединена с каждой, и любой путь замыкается
    - Потому что цикл нужен для синхронизации часов между нодами
