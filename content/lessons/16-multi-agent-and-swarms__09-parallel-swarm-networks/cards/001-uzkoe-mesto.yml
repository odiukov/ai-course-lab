- concept: узкое место — звено, чья пропускная способность ограничивает всю систему
  question: Объясни своими словами, что такое узкое место в многоагентной системе и почему рост числа исполнителей не помогает, если узкое место — центральный агент планирования.
  explanation: 'Ключ — предел задаёт не суммарная мощность исполнителей, а частота решений центрального звена. Отсюда и вывод к роевым архитектурам: убрать решение «кому выдать дальше» из горячего пути.'
  kind: open
  reference: 'Узкое место — элемент системы с наименьшей пропускной способностью: она и определяет общую скорость. Если каждое назначение работы проходит через одного агента, максимум задач в секунду равен частоте его решений (например, 1 / время одного вызова LLM). Исполнители лишь ждут этих решений, поэтому их количество не меняет предел; новые исполнители только увеличивают длину очереди запросов к центральному агенту. Помогает не увеличение числа воркеров, а устранение обязательного центрального решения перед каждой задачей.'
