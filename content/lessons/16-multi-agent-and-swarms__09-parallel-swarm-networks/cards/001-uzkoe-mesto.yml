- concept: пропускная способность системы с центральным планировщиком ограничена частотой его решений
  question: В системе 500 воркеров, выполнение каждой задачи занимает пренебрежимо мало времени, но назначение каждой задачи требует отдельного решения центрального агента длительностью 1.5 секунды, и решения идут последовательно. Сколько задач система обработает за минуту?
  explanation: '60 / 1.5 = 40 назначений в минуту. Число воркеров в расчёт не входит вообще: считает пропускную способность самого узкого звена, то есть последовательного планировщика. Именно поэтому центральный supervisor перестаёт масштабироваться на сотнях воркеров.'
  kind: numeric
  answer: 40
  tolerance: 1
  id: 001-uzkoe-mesto-1
  fingerprint: 875426eb
- concept: добавление воркеров за пределом узкого места удлиняет очередь к нему, а не увеличивает пропускную способность
  question: Все задания раздаёт один центральный планировщик, и он загружен полностью. Число воркеров увеличивают с 500 до 900. Что произойдёт с системой?
  explanation: Пропускную способность задаёт узкое место — планировщик. Он не ускоряется от роста числа клиентов, поэтому 400 новых воркеров только добавляют ожидающих в его очередь. Ускорить систему можно, лишь убрав из горячего пути его решение (или распараллелив его).
  kind: choice
  options:
    - 'Пропускная способность вырастет примерно вдвое: рук стало вдвое больше'
    - Пропускная способность почти не изменится, а очередь обращений к планировщику вырастет
    - Планировщик начнёт принимать решения быстрее, так как получит больше запросов
    - Задачи начнут дублироваться, потому что планировщик не успевает их помечать
