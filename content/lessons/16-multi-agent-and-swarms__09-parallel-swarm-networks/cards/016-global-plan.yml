- concept: 'supervisor нужен для решений, требующих взгляда на весь замысел: заметить пробел, заказать доп. проверку, отбросить версию'
  question: Какие решения по ходу исследовательской задачи может принять supervisor и не может принять общая очередь задач?
  explanation: Ключевое слово — адаптивность плана. Рой ускоряет сбор частей, а связность отвечает за центр, который видит замысел.
  kind: open
  reference: 'Supervisor держит план целиком: какие версии проверяем, какие данные считаем достаточными, какой следующий вопрос вытекает из полученного ответа. Получив первые результаты, он замечает пробел и заказывает дополнительную проверку, отбрасывает слабую версию, требует привести данные к одному периоду и в конце собирает вывод, где одна часть поддерживает другую. Очередь хранит только факт «задача доступна для взятия»; у неё нет представления о роли задачи в рассуждении и о состоянии плана, поэтому новые задачи из промежуточных результатов она сама не выводит.'
  id: 016-global-plan-2
  fingerprint: 65185b80
- concept: 'гибрид: центр отвечает за решения уровня плана, а раздачу независимых подзадач можно оставить общей очереди'
  question: Задача требует единого связного плана. Означает ли это, что supervisor должен лично выдавать каждую подзадачу?
  explanation: Схемы совместимы. Центр нужен там, где решение опирается на весь замысел; там, где задания независимы, pull из общей очереди быстрее и не создаёт узкого места из планировщика.
  kind: choice
  options:
