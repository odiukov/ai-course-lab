<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Топики и подписки воркеров-специалистов</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: white;
      --panel: ghostwhite;
      --panel-jam: oldlace;
      --ink: midnightblue;
      --muted: slategray;
      --topic: royalblue;
      --topic-fill: aliceblue;
      --worker: seagreen;
      --worker-fill: honeydew;
      --route: steelblue;
      --message: cornflowerblue;
      --message-fill: lightcyan;
      --jam: crimson;
      --jam-fill: mistyrose;
      --shadow: lightsteelblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: midnightblue;
        --panel: darkslateblue;
        --panel-jam: darkslategray;
        --ink: white;
        --muted: lightsteelblue;
        --topic: lightskyblue;
        --topic-fill: darkslateblue;
        --worker: lightgreen;
        --worker-fill: darkgreen;
        --route: lightsteelblue;
        --message: lightskyblue;
        --message-fill: steelblue;
        --jam: salmon;
        --jam-fill: maroon;
        --shadow: slategray;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: unset;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      background: var(--bg);
      overflow: hidden;
    }

    h1 {
      margin: unset;
      padding: 12px 24px 4px;
      font-size: 22px;
      line-height: normal;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--bg);
    }

    svg text {
      fill: var(--ink);
      font-family: inherit;
    }

    .lane {
      fill: var(--panel);
      stroke: var(--shadow);
    }

    .lane.jam {
      fill: var(--panel-jam);
      stroke: var(--jam);
    }

    .task {
      fill: var(--bg);
      stroke: var(--route);
    }

    .queue {
      fill: var(--topic-fill);
      stroke: var(--topic);
    }

    .worker {
      fill: var(--worker-fill);
      stroke: var(--worker);
    }

    .message {
      fill: var(--message-fill);
      stroke: var(--message);
    }

    .message.jam {
      fill: var(--jam-fill);
      stroke: var(--jam);
    }

    .message-line {
      stroke: var(--message);
      stroke-linecap: round;
    }

    .message-line.jam {
      stroke: var(--jam);
    }

    .route {
      fill: none;
      stroke: var(--route);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .subscription {
      fill: none;
      stroke: var(--worker);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .route-arrow {
      fill: var(--route);
    }

    .subscription-arrow {
      fill: var(--worker);
    }

    .topic-text {
      fill: var(--topic);
      font-weight: 700;
    }

    .worker-text {
      fill: var(--worker);
      font-weight: 700;
    }

    .muted {
      fill: var(--muted);
    }

    .jam-text {
      fill: var(--jam);
      font-weight: 700;
    }

    .status {
      fill: var(--worker);
    }

    .caption-box {
      fill: var(--jam-fill);
      stroke: var(--jam);
    }

    .fallback {
      padding: 16px 24px;
      color: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Топики и подписки воркеров-специалистов</h1>
    <svg id="diagram"
         viewBox="0 0 1200 450"
         width="1200"
         height="450"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-title diagram-description">
      <title id="diagram-title">Три топика и шесть специализированных воркеров</title>
      <desc id="diagram-description">Три очереди типов задач. К каждой очереди подписаны два специализированных воркера. В топике translation накопились сообщения, поэтому пробка видна именно в этой очереди.</desc>
    </svg>
    <p id="fallback" class="fallback" hidden>
      Схема должна была показать три тематические очереди — translation, invoice и vision,
      по два подписанных специалиста у каждой и пробку из накопившихся сообщений
      в очереди translation.
    </p>
  </main>

  <script>
    const data = [
      {
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1,
        laneX: 24,
        laneWidth: 1152,
        laneHeight: 110,
        laneRadius: 18,
        taskX: 48,
        taskWidth: 198,
        taskHeight: 58,
        taskRadius: 12,
        queueX: 304,
        queueWidth: 354,
        queueHeight: 82,
        queueRadius: 14,
        queueHeaderX: 326,
        queueHeaderOffsetY: 22,
        queueMetaX: 636,
        messageY: 4,
        messageWidth: 32,
        messageHeight: 30,
        messageRadius: 5,
        messageLineInset: 7,
        messageLineTop: 10,
        messageLineBottom: 19,
        queueExitX: 658,
        hubX: 752,
        workerX: 814,
        workerWidth: 338,
        workerHeight: 46,
        workerRadius: 13,
        workerTextX: 842,
        workerMetaX: 1130,
        workerDotX: 832,
        workerDotRadius: 5,
        workerUpperOffset: -27,
        workerLowerOffset: 27,
        workerTitleOffset: -4,
        workerMetaOffset: 14,
        subscriptionLabelX: 718,
        subscriptionLabelOffset: -11,
        arrowLength: 12,
        arrowHalf: 7,
        routeStartGap: 10,
        routeEndGap: 4,
        captionX: 304,
        captionY: 418,
        captionWidth: 848,
        captionHeight: 25,
        captionRadius: 12,
        captionTextX: 728,
        captionTextY: 436,
        stroke: 2,
        strongStroke: 3,
        thinStroke: 1,
        dash: 7,
        dashGap: 6,
        fontTitle: 17,
        fontBody: 15,
        fontSmall: 13,
        fontCaption: 14,
        labelPad: 8
      },
      {
        y: 67,
        topic: "translation",
        task: "Перевести письмо",
        worker: "Переводчик",
        specialization: "только translation",
        jam: true,
        messages: [326, 366, 406, 446, 486, 526, 566, 606]
      },
      {
        y: 202,
        topic: "invoice",
        task: "Проверить счёт",
        worker: "Специалист по счетам",
        specialization: "только invoice",
        jam: false,
        messages: [606]
      },
      {
        y: 337,
        topic: "vision",
        task: "Описать изображение",
        worker: "Vision-специалист",
        specialization: "только vision",
        jam: false,
        messages: [606]
      }
    ];

    const [layout, ...lanes] = data;
    const origin = { x: layout.originX, y: layout.originY };
    const scale = { x: layout.scaleX, y: layout.scaleY };
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const node = (name, attributes, className) => {
        const element = svg.ownerDocument.createElementNS(svg.namespaceURI, name);
        if (className) element.setAttribute("class", className);
        Object.entries(attributes || {}).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        return element;
      };

      const add = (parent, name, attributes, className) => {
        const element = node(name, attributes, className);
        parent.appendChild(element);
        return element;
      };

      const text = (parent, value, x, y, className, anchor, fontSize) => {
        const element = add(parent, "text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          "font-size": fontSize
        }, className);
        element.textContent = value;
        return element;
      };

      const rect = (parent, x, y, width, height, radius, className, strokeWidth) =>
        add(parent, "rect", {
          x: sx(x),
          y: sy(y),
          width: sx(width),
          height: sy(height),
          rx: sx(radius),
          "stroke-width": strokeWidth
        }, className);

      const line = (parent, x1, y1, x2, y2, className, strokeWidth, dashed) => {
        const attributes = {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          "stroke-width": strokeWidth
        };
        if (dashed) {
          attributes["stroke-dasharray"] = `${sx(layout.dash)} ${sx(layout.dashGap)}`;
        }
        return add(parent, "line", attributes, className);
      };

      const arrow = (parent, tipX, tipY, className) => {
        const points = [
          `${sx(tipX)},${sy(tipY)}`,
          `${sx(tipX - layout.arrowLength)},${sy(tipY - layout.arrowHalf)}`,
          `${sx(tipX - layout.arrowLength)},${sy(tipY + layout.arrowHalf)}`
        ].join(" ");
        return add(parent, "polygon", { points }, className);
      };

      const messageCard = (parent, x, y, jammed) => {
        const cardClass = jammed ? "message jam" : "message";
        const lineClass = jammed ? "message-line jam" : "message-line";

        rect(
          parent,
          x,
          y,
          layout.messageWidth,
          layout.messageHeight,
          layout.messageRadius,
          cardClass,
          layout.thinStroke
        );

        line(
          parent,
          x + layout.messageLineInset,
          y + layout.messageLineTop,
          x + layout.messageWidth - layout.messageLineInset,
          y + layout.messageLineTop,
          lineClass,
          layout.thinStroke,
          false
        );

        line(
          parent,
          x + layout.messageLineInset,
          y + layout.messageLineBottom,
          x + layout.messageWidth - layout.messageLineInset,
          y + layout.messageLineBottom,
          lineClass,
          layout.thinStroke,
          false
        );
      };

      lanes.forEach(lane => {
        const group = add(svg, "g", {
          "aria-label": `Топик ${lane.topic}`
        });

        const laneTop = lane.y - layout.laneHeight / layout.stroke;
        const taskTop = lane.y - layout.taskHeight / layout.stroke;
        const queueTop = lane.y - layout.queueHeight / layout.stroke;
        const workerUpperY = lane.y + layout.workerUpperOffset;
        const workerLowerY = lane.y + layout.workerLowerOffset;
        const workerUpperTop = workerUpperY - layout.workerHeight / layout.stroke;
        const workerLowerTop = workerLowerY - layout.workerHeight / layout.stroke;
        const laneClass = lane.jam ? "lane jam" : "lane";

        rect(
          group,
          layout.laneX,
          laneTop,
          layout.laneWidth,
          layout.laneHeight,
          layout.laneRadius,
          laneClass,
          lane.jam ? layout.strongStroke : layout.stroke
        );

        rect(
          group,
          layout.taskX,
          taskTop,
          layout.taskWidth,
          layout.taskHeight,
          layout.taskRadius,
          "task",
          layout.stroke
        );

        text(
          group,
          "ЗАДАНИЕ",
          layout.taskX + layout.labelPad * layout.stroke,
          lane.y - layout.labelPad,
          "muted",
          "start",
          layout.fontSmall
        );

        text(
          group,
          lane.task,
          layout.taskX + layout.labelPad * layout.stroke,
          lane.y + layout.labelPad * layout.stroke,
          "",
          "start",
          layout.fontBody
        );

        const routeStart = layout.taskX + layout.taskWidth + layout.routeStartGap;
        const routeEnd = layout.queueX - layout.routeEndGap;

        line(
          group,
          routeStart,
          lane.y,
          routeEnd,
          lane.y,
          "route",
          layout.stroke,
          false
        );
        arrow(group, layout.queueX, lane.y, "route-arrow");

        rect(
          group,
          layout.queueX,
          queueTop,
          layout.queueWidth,
          layout.queueHeight,
          layout.queueRadius,
          "queue",
          layout.strongStroke
        );

        text(
          group,
          `ТОПИК  ${lane.topic}`,
          layout.queueHeaderX,
          lane.y - layout.queueHeaderOffsetY,
          "topic-text",
          "start",
          layout.fontTitle
        );

        text(
          group,
          lane.jam ? "ПРОБКА" : "очередь",
          layout.queueMetaX,
          lane.y - layout.queueHeaderOffsetY,
          lane.jam ? "jam-text" : "muted",
          "end",
          layout.fontSmall
        );

        lane.messages.forEach(messageX => {
          messageCard(
            group,
            messageX,
            lane.y + layout.messageY,
            lane.jam
          );
        });

        line(
          group,
          layout.queueExitX,
          lane.y,
          layout.hubX,
          lane.y,
          "subscription",
          layout.stroke,
          true
        );

        line(
          group,
          layout.hubX,
          lane.y,
          layout.workerX - layout.arrowLength,
          workerUpperY,
          "subscription",
          layout.stroke,
          true
        );

        line(
          group,
          layout.hubX,
          lane.y,
          layout.workerX - layout.arrowLength,
          workerLowerY,
          "subscription",
          layout.stroke,
          true
        );

        arrow(group, layout.workerX, workerUpperY, "subscription-arrow");
        arrow(group, layout.workerX, workerLowerY, "subscription-arrow");

        text(
          group,
          "подписки",
          layout.subscriptionLabelX,
          lane.y + layout.subscriptionLabelOffset,
          "worker-text",
          "middle",
          layout.fontSmall
        );

        [
          { center: workerUpperY, top: workerUpperTop, suffix: "А" },
          { center: workerLowerY, top: workerLowerTop, suffix: "Б" }
        ].forEach(worker => {
          rect(
            group,
            layout.workerX,
            worker.top,
            layout.workerWidth,
            layout.workerHeight,
            layout.workerRadius,
            "worker",
            layout.stroke
          );

          add(group, "circle", {
            cx: sx(layout.workerDotX),
            cy: sy(worker.center),
            r: sx(layout.workerDotRadius)
          }, "status");

          text(
            group,
            `${lane.worker} ${worker.suffix}`,
            layout.workerTextX,
            worker.center + layout.workerTitleOffset,
            "worker-text",
            "start",
            layout.fontBody
          );

          text(
            group,
            lane.specialization,
            layout.workerMetaX,
            worker.center + layout.workerMetaOffset,
            "muted",
            "end",
            layout.fontSmall
          );
        });
      });

      rect(
        svg,
        layout.captionX,
        layout.captionY,
        layout.captionWidth,
        layout.captionHeight,
        layout.captionRadius,
        "caption-box",
        layout.stroke
      );

      text(
        svg,
        "Сообщения копятся внутри translation — место пробки видно сразу",
        layout.captionTextX,
        layout.captionTextY,
        "jam-text",
        "middle",
        layout.fontCaption
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) svg.hidden = true;
      if (fallback) fallback.hidden = false;
    }
  </script>
</body>
</html>
