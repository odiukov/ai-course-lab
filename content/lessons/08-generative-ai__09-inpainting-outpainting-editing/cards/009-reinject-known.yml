- concept: успех наивного inpainting на неупорядоченном векторе подтверждает выбор кластера, но не бесшовное согласование изображения
  question: Почему успешная дорисовка замаскированных координат в игрушечном наборе неупорядоченных чисел ещё не доказывает, что тот же метод даст бесшовный inpainting изображения?
  explanation: Игрушечный пример проверяет главным образом попадание в правильный кластер. Изображение дополнительно требует точного пространственного согласования по всей границе маски, чего успех на неупорядоченных данных не демонстрирует.
  kind: open
  reference: В игрушечной задаче известному контексту достаточно сообщить модели глобальную принадлежность к кластеру, а между координатами нет пространственной границы. В изображении сгенерированная область должна локально продолжать текстуру, линии, освещение и зерно соседних пикселей, поэтому правильного глобального содержания недостаточно для отсутствия шва.
  id: 009-reinject-known-2
  fingerprint: 9bb9d08f
