- concept: SDEdit выполняет редактирование через зашумление оригинала и обратную диффузию с новым условием
  question: Расположите этапы редактирования изображения методом SDEdit в правильном порядке.
  explanation: SDEdit сначала частично разрушает исходник прямым зашумлением, а затем применяет обычную обратную диффузию с новым промптом. Поэтому редактирование не требует переобучения модели.
  kind: order
  items:
    - Взять исходное изображение
    - Добавить к нему шум до выбранного промежуточного состояния
    - Запустить обратную цепочку из этого состояния с новым промптом
    - Получить отредактированное изображение
  id: 020-sdedit-princip-1
  fingerprint: 3ad37058
- concept: глубина начального зашумления задаёт компромисс между сохранением оригинала и свободой редактирования
  question: Для SDEdit увеличили глубину зашумления исходного изображения перед запуском обратной цепочки. Как обычно изменится результат?
  explanation: Чем сильнее зашумлён оригинал, тем меньше его структуры остаётся в стартовом состоянии. Поэтому новый промпт влияет сильнее, но верность исходному изображению снижается; при слабом шуме происходит обратное.
  kind: choice
  options:
    - Он будет точнее сохранять мелкие детали оригинала
    - Модель получит больше свободы, но хуже сохранит исходное содержание
    - Обратная цепочка перестанет учитывать новый промпт
    - Потребуется заново обучить параметры диффузионной модели
  correct: 1
  id: 020-sdedit-princip-2
  fingerprint: 5cac2ef2
