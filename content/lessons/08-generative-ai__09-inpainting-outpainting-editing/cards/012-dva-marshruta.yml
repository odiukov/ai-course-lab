- concept: обучение на случайно замаскированных областях согласует обучающую задачу модели с задачей inpainting
  question: Почему обычный денойзер, применённый с наивным inpainting-сэмплером, обычно хуже продолжает линии, текстуры и освещение через границу маски, чем специализированная inpainting-модель?
  explanation: 'Ключевое различие находится в обучающей задаче: случайные маски дают модели множество примеров согласования заплатки с окружением. Техническое возвращение известного контекста обычному денойзеру само по себе не формирует такого навыка.'
  kind: open
  reference: Специализированную модель обучают восстанавливать случайно скрытые области по чистому незамаскированному окружению. Поэтому она учится использовать границу и окружающий контекст именно для связного продолжения изображения. Обычный денойзер такой задачи при обучении не решал, а наивный сэмплер лишь принудительно удерживает известный контекст.
  id: 012-dva-marshruta-2
