- concept: RePaint согласует области с помощью повторных переходов между зашумлением и шумоподавлением
  question: Какой приём использует RePaint для лучшего согласования сгенерированной области с известным окружением?
  explanation: Повторное зашумление с последующим шумоподавлением даёт модели дополнительные возможности согласовать неизвестную область с известным контекстом. Однократное копирование контекста такого взаимодействия не обеспечивает.
  kind: choice
  options:
    - Периодически снова зашумляет состояние и повторяет часть обратного процесса
    - Один раз копирует исходные пиксели перед началом генерации
    - Полностью запрещает шумоподавителю учитывать пиксели вне маски
