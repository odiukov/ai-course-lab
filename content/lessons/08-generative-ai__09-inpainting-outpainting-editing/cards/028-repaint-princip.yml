- concept: ресэмплинг RePaint увеличивает число вычислений модели и задержку генерации
  question: Как применение RePaint влияет на вычислительную стоимость по сравнению с обратной диффузией без ресэмплинга и почему?
  explanation: Повторная обработка состояний требует дополнительных вызовов модели. Поэтому улучшение согласованности результата достигается ценой большей задержки и вычислительной нагрузки.
  kind: open
  reference: Вычислительная стоимость и время генерации возрастают, потому что алгоритм повторно посещает некоторые участки расписания и выполняет дополнительные проходы диффузионной модели.
  id: 028-repaint-princip-2
  fingerprint: 2f5a6c89
