- concept: редактирование всего изображения допускает изменения по всему кадру при сохранении смысла или структуры оригинала
  question: Почему для превращения фотографии в акварельную иллюстрацию обычно подходит редактирование всего изображения, а не локальная дорисовка?
  explanation: При глобальной смене стиля изменения не ограничены отдельным участком или пространством за границами холста. Редактирование всего изображения преобразует весь кадр, сохраняя его смысловую или структурную узнаваемость.
  kind: open
  reference: Новый стиль должен затронуть все части кадра, поэтому модели разрешают изменять пиксели по всему изображению. При этом она должна сохранить содержание и структуру оригинала — основные объекты, их расположение и композицию.
