- concept: для интерактивного редактирования важнее задержка одиночного запроса, чем суммарная пропускная способность
  question: Почему увеличение числа изображений, обрабатываемых системой за единицу времени, не гарантирует более быстрый отклик интерактивного редактора?
  explanation: В интерактивном сценарии критично время от действия пользователя до готового результата. Оптимизация пакетной обработки полезна для нагрузки сервиса, но сама по себе не уменьшает время прохождения отдельного изображения через SAM, VAE и диффузионную модель.
  kind: open
  reference: Пропускная способность описывает совокупный объём работы системы, а пользователь ждёт завершения одного конкретного запроса. Батчинг и повышение загрузки ускорителя могут увеличить общий объём обработки, не сократив задержку последовательных стадий этого запроса.
