- concept: оптимизация доминирующей по времени стадии сильнее всего уменьшает общую задержку
  question: Какое изменение сильнее всего сократит задержку последовательного пайплайна редактирования?
  explanation: Первое изменение экономит 0,10 с, второе — 0,20 с, а третье — 1,1 с. Поэтому сначала выгоднее оптимизировать стадию, которая занимает основную часть полного времени ответа.
