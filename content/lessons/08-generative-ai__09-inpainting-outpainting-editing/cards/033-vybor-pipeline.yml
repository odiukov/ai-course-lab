- concept: SAM определяет область редактирования, а диффузионный inpainting синтезирует новый фон
  question: Расположите этапы замены фона вокруг товара в правильном порядке.
  explanation: 'SAM отвечает за вопрос «где редактировать»: он выделяет товар. После инверсии маски областью генерации становится фон, а SD-Inpaint решает, чем его заполнить.'
  kind: order
  items:
    - Получить точную маску товара с помощью SAM
    - Инвертировать маску, чтобы разрешить изменение фона
    - Передать изображение и маску в SD-Inpaint для генерации нового фона
  id: 033-vybor-pipeline-1
  fingerprint: '91764339'
- concept: ControlNet-OpenPose помогает сохранить позу при локальной перерисовке частей тела
  question: На изображении нужно исправить неестественную кисть персонажа, сохранив положение руки и позу тела. Какой пайплайн подходит лучше всего?
  explanation: SD-Inpaint ограничивает перерисовку областью кисти, подробный промпт заново задаёт нужный объект, а ControlNet-OpenPose удерживает геометрию позы.
  kind: choice
  options:
    - SD-Inpaint с подробным описанием руки и ControlNet-OpenPose
    - Outpainting с маской за границами холста
    - SAM без генеративной модели
    - InstructPix2Pix с инструкцией изменить всю сцену
  correct: 0
  id: 033-vybor-pipeline-2
  fingerprint: 7f233b8f
- concept: глобальную правку без заданного контура выполняют модели редактирования по инструкции
  question: Фотограф просит превратить дневную сцену в вечернюю, но не задаёт маску и допускает согласованные изменения по всему кадру. Какой тип пайплайна следует выбрать и почему?
  explanation: Если команда относится ко всей сцене и точного контура нет, используют редактирование по инструкции — например, InstructPix2Pix или Flux-Kontext. Масочный inpainting уместнее для заранее локализованной правки.
  kind: open
  reference: 'Подойдут InstructPix2Pix или Flux-Kontext: они принимают инструкцию к исходному изображению и сами локализуют необходимые изменения. Inpainting здесь неудобен, потому что для него пришлось бы заранее определять область правки маской.'
  id: 033-vybor-pipeline-3
  fingerprint: 4bc0d1a1
