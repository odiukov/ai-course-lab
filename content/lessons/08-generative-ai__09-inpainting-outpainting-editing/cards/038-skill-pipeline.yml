- concept: решения в editing pipeline принимаются в порядке зависимостей от области правки к параметрам и проверке результата
  question: Расположите этапы подготовки конфигурации редактирования изображения в логичном порядке.
  explanation: 'Модель и параметры выбирают после определения области и характера правки. Проверки формулируют для уже заданного маршрута: они должны выявлять шов, утечку изменений и нарушение масштаба.'
