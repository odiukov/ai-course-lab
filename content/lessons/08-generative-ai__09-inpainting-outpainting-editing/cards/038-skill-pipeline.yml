- concept: проверка результата редактирования должна отдельно покрывать шов, утечку изменений и геометрическую согласованность
  question: Какие типы дефектов должен выявлять минимальный чек-лист приёмки локально отредактированного изображения?
  explanation: 'Эти проверки покрывают разные классы брака: заметную границу вставки, нарушение защищённой части исходника и несогласованность размеров нового содержимого со сценой.'
