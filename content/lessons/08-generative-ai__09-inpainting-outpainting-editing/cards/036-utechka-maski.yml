- concept: предобработка контекста должна подавлять случайные дефекты, сохраняя структурные ориентиры для inpainting
  question: Как подготовить шумную область вокруг маски перед inpainting и почему нельзя чрезмерно её сглаживать?
  explanation: Умеренная очистка уменьшает вероятность переноса случайной грязи внутрь маски. При этом структурные признаки окружения нужны модели для восстановления согласованных краёв, цвета, света и фактуры, поэтому агрессивная обработка тоже ухудшает результат.
  kind: open
  reference: Следует слегка подавить шум или размыть артефакты сжатия вокруг маски, но сохранить полезные границы, цветовые переходы, освещение и направление текстуры. Чрезмерное сглаживание удалит ориентиры, необходимые модели для согласованного продолжения изображения.
