- concept: маска передаёт пространственное разрешение на редактирование, а не визуальные признаки
  question: Почему маске для inpainting не нужны признаки цвета, текстуры или освещения?
  explanation: Маска управляет тем, где выполнять редактирование, но не описывает, что именно нужно нарисовать. Цвета и детали модель получает из латентных представлений и других условий.
  kind: open
  reference: Маска должна лишь указывать для каждой пространственной позиции, относится ли она к области перегенерации. Внешний вид сцены передают шумный латент и закодированный оригинал.
