- concept: объединяемые по каналам данные должны иметь согласованные пространственные координаты
  question: Почему шумный латент, кодировка исходного изображения и маска должны быть пространственно выровнены перед объединением по каналам?
  explanation: Конкатенация по каналам сохраняет пространственную сетку. В каждой её позиции U-Net одновременно сопоставляет текущее шумное состояние, чистый ориентир и значение маски, поэтому сдвиг любого компонента нарушает смысл такого сопоставления.
  kind: open
  reference: Значения во всех каналах на одной пространственной позиции должны относиться к одному участку изображения. Иначе маска укажет не ту область, а чистый контекст будет описывать другие координаты, поэтому модель получит противоречивые условия.
  id: 016-devyat-kanalov-2
  fingerprint: 29eaea88
