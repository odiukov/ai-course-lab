- concept: позднее уточнение контекста не отменяет структурные решения, сформированные внутри маски на ранних шагах денойзинга
  question: Объясни своими словами, почему всё более чистый контекст снаружи маски на поздних шагах денойзинга не гарантирует исправления уже возникшего смещения линии внутри маски.
  explanation: Диффузионное сэмплирование последовательно развивает ранее полученное состояние. Если положение элемента было выбрано при слабой информации о границе, позднее уменьшение шума не обязательно заставит модель пересобрать этот элемент.
  kind: open
  reference: На ранних шагах модель при шумном контексте уже формирует грубую структуру скрытой области. Последующие шаги в основном уточняют текущую латентную траекторию, а не начинают генерацию заново. Поэтому очистившийся внешний контекст может оказаться недостаточным, чтобы перестроить уже сложившуюся внутри маски линию.
