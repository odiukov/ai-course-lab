  question: Inpainting U-Net обучен получать сначала шумный латент, затем кодировку исходного изображения и маску. Что произойдёт, если на инференсе поменять компоненты местами, но сохранить допустимую итоговую форму?
  explanation: Веса входной свёртки обучаются для конкретной семантики каждой позиции каналов. Перестановка компонентов может не вызвать ошибку формы, но нарушит соответствие между данными и обученными весами.
  kind: choice
