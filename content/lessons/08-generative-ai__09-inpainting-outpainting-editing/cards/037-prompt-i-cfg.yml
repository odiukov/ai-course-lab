- concept: для маленьких масок снижение CFG уменьшает риск чрезмерно насыщенной и контрастной заплатки
  question: Почему при небольшой маске высокий CFG может сделать отредактированную область неестественно яркой и какое изменение параметра обычно помогает?
  explanation: Чем меньше доступная для генерации область, тем заметнее чрезмерное давление текстового условия. Умеренный CFG ослабляет гипертрофированные признаки и помогает встроить деталь в исходную сцену.
  kind: open
  reference: Высокий CFG заставляет модель слишком буквально и сильно подчёркивать признаки из промпта в ограниченной области, из-за чего растут насыщенность, контраст и яркость детали. Обычно CFG следует снизить, чтобы правка лучше согласовалась с окружением.
  id: 037-prompt-i-cfg-2
  fingerprint: e9e72a4e
