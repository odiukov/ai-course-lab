- concept: определение кластера уменьшает неопределённость скрытых координат, но не устраняет её полностью
  question: Почему знание наиболее вероятного кластера позволяет предсказать общий знак скрытых координат, но не их точные значения?
  explanation: Принадлежность кластеру сообщает, вокруг какого центра лежат скрытые координаты. Их точные значения остаются случайными из-за разброса внутри облака.
  kind: open
  reference: Кластер задаёт область вероятных значений и её центр, однако каждый объект содержит случайные отклонения от центра. Поэтому контекст определяет компоненту распределения, а конкретные скрытые координаты всё ещё нужно сэмплировать.
