<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Один переполненный контекст против четырёх специализированных</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#5f6c82;
  --line:#718096;
  --blue:#dcecff;
  --blue-strong:#2563a8;
  --green:#dcf4e7;
  --green-strong:#23734b;
  --violet:#eee5ff;
  --violet-strong:#6941a5;
  --amber:#fff0c9;
  --amber-strong:#8b5b00;
  --red:#ffe1e1;
  --red-strong:#b83232;
  --rail:#cbd5e1;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111827;
    --panel:#1b2434;
    --ink:#eef3fb;
    --muted:#b7c2d5;
    --line:#91a0b8;
    --blue:#183858;
    --blue-strong:#8ac5ff;
    --green:#183e31;
    --green-strong:#85ddb0;
    --violet:#342752;
    --violet-strong:#c3a7ff;
    --amber:#493917;
    --amber-strong:#ffd071;
    --red:#4e2529;
    --red-strong:#ff9da5;
    --rail:#526075;
  }
}
html,body{margin:unset;background:var(--bg)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.figure{background:var(--bg);border:2px solid var(--rail);overflow:hidden}
.title{
  background:var(--panel);
  color:var(--ink);
  font-size:18px;
  font-weight:bold;
  text-align:center
}
svg{display:block;width:100%;height:auto;max-height:470px;background:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
.header{fill:var(--red);stroke:var(--red-strong);stroke-width:2}
.orchestrator{fill:var(--blue);stroke:var(--blue-strong);stroke-width:2}
.research{fill:var(--blue);stroke:var(--blue-strong);stroke-width:2}
.coder{fill:var(--green);stroke:var(--green-strong);stroke-width:2}
.reviewer{fill:var(--violet);stroke:var(--violet-strong);stroke-width:2}
.tester{fill:var(--amber);stroke:var(--amber-strong);stroke-width:2}
.card{fill:var(--panel);stroke:var(--line);stroke-width:2}
.warning{fill:var(--red);stroke:var(--red-strong);stroke-width:2}
.merge{fill:var(--green);stroke:var(--green-strong);stroke-width:2}
.flow{fill:none;stroke:var(--blue-strong);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.output{fill:none;stroke:var(--green-strong);stroke-width:2;stroke-linecap:round}
.cross{stroke:var(--red-strong);stroke-width:2;stroke-linecap:round}
.heading{fill:var(--ink);font-size:17px;font-weight:bold}
.label{fill:var(--ink);font-size:15px;font-weight:bold}
.small{fill:var(--muted);font-size:14px}
.tiny{fill:var(--muted);font-size:13px}
.alert{fill:var(--red-strong);font-size:14px;font-weight:bold}
.blueText{fill:var(--blue-strong)}
.greenText{fill:var(--green-strong)}
.fallback{font-size:16px;color:var(--ink);background:var(--panel)}
</style>
</head>
<body>
<main class="figure" aria-labelledby="diagram-title">
  <div class="title" id="diagram-title">
    Один переполненный контекст против четырёх специализированных
  </div>
  <svg id="diagram" viewBox="0 0 1200 450" width="1200" height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Слева один агент хранит вперемешку документацию, код, ревью и тесты. Справа оркестратор распределяет работу между четырьмя специализированными агентами.">
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна была показать один переполненный контекст слева и четыре чистых специализированных окна справа.
  </div>
</main>
<script>
const diagramData={
  origin:[0,0],
  scale:[1,1],
  canvas:[0,0,1200,450],
  radius:10,
  dash:[8,6],
  marker:{w:12,h:12,refX:10,refY:6,points:[[1,1],[10,6],[1,11]]},
  headings:[
    {x:288,y:32,text:"ОДНО ПЕРЕПОЛНЕННОЕ ОКНО"},
    {x:880,y:32,text:"ЧЕТЫРЕ СПЕЦИАЛИЗИРОВАННЫХ ОКНА"}
  ],
  left:{
    frame:[25,55,525,380],
    head:[25,55,525,55],
    texts:[
      {x:287,y:80,text:"ОДИН АГЕНТ • ОДНО ОКНО",kind:"label"},
      {x:287,y:99,text:"строит REST API и удерживает всё сразу",kind:"small"},
      {x:55,y:139,text:"API-ДОКУМЕНТАЦИЯ",kind:"label"},
      {x:55,y:160,text:"50k токенов",kind:"small"},
      {x:324,y:139,text:"ИССЛЕДОВАНИЕ",kind:"label"},
      {x:324,y:160,text:"найденные примеры",kind:"small"},
      {x:55,y:213,text:"ТРЕБОВАНИЯ",kind:"label"},
      {x:55,y:234,text:"ограничения API",kind:"small"},
      {x:221,y:213,text:"КОД",kind:"label"},
      {x:221,y:234,text:"маршруты • модели",kind:"small"},
      {x:221,y:255,text:"обработка ошибок",kind:"small"},
      {x:55,y:283,text:"РЕВЬЮ",kind:"label"},
      {x:55,y:304,text:"замечания и баги",kind:"small"},
      {x:55,y:352,text:"ТЕСТЫ",kind:"label"},
      {x:55,y:373,text:"прогоны • результаты",kind:"small"},
      {x:278,y:318,text:"ранняя полезная находка",kind:"small"},
      {x:392,y:352,text:"ВЫТЕСНЯЕТСЯ",kind:"alert"},
      {x:392,y:398,text:"НОВЫЙ ФРАГМЕНТ",kind:"label"},
      {x:392,y:419,text:"ещё данные в то же окно",kind:"small"}
    ],
    cards:[
      {box:[45,122,250,55],kind:"card"},
      {box:[305,122,220,55],kind:"card"},
      {box:[45,195,155,55],kind:"card"},
      {box:[210,195,315,78],kind:"card"},
      {box:[45,265,155,58],kind:"card"},
      {box:[45,334,205,55],kind:"card"},
      {box:[268,298,257,62],kind:"card dashed"},
      {box:[268,378,257,45],kind:"warning"}
    ],
    cross:[[276,306],[517,354]],
    push:[[392,365],[392,376]]
  },
  right:{
    orchestrator:[590,55,580,62],
    orchestratorText:[
      {x:880,y:80,text:"ОРКЕСТРАТОР",kind:"label"},
      {x:880,y:101,text:"общая цель: REST API пользователей",kind:"small"}
    ],
    rail:[
      [[880,117],[880,151]],
      [[658,151],[1100,151]],
      [[658,151],[658,174]],
      [[805,151],[805,174]],
      [[952,151],[952,174]],
      [[1100,151],[1100,174]]
    ],
    agents:[
      {
        box:[590,174,137,181],kind:"research",
        texts:[
          {x:658,y:199,text:"ИССЛЕДОВАТЕЛЬ",kind:"label"},
          {x:658,y:227,text:"читает",kind:"small"},
          {x:658,y:248,text:"документацию",kind:"small"},
          {x:658,y:278,text:"50k токенов",kind:"label blueText"},
          {x:658,y:299,text:"остаются здесь",kind:"tiny"},
          {x:658,y:330,text:"выход: выжимка",kind:"tiny"}
        ]
      },
      {
        box:[737,174,137,181],kind:"coder",
        texts:[
          {x:805,y:199,text:"КОДЕР",kind:"label"},
          {x:805,y:227,text:"требования",kind:"small"},
          {x:805,y:248,text:"+ нужные",kind:"small"},
          {x:805,y:269,text:"находки",kind:"small"},
          {x:805,y:299,text:"пишет код",kind:"label greenText"},
          {x:805,y:330,text:"выход: код",kind:"tiny"}
        ]
      },
      {
        box:[884,174,137,181],kind:"reviewer",
        texts:[
          {x:952,y:199,text:"РЕВЬЮЕР",kind:"label"},
          {x:952,y:227,text:"видит код",kind:"small"},
          {x:952,y:248,text:"проверяет",kind:"small"},
          {x:952,y:269,text:"качество",kind:"small"},
          {x:952,y:299,text:"ищет баги",kind:"label"},
          {x:952,y:330,text:"выход: замечания",kind:"tiny"}
        ]
      },
      {
        box:[1031,174,139,181],kind:"tester",
        texts:[
          {x:1100,y:199,text:"ТЕСТИРОВЩИК",kind:"label"},
          {x:1100,y:227,text:"код +",kind:"small"},
          {x:1100,y:248,text:"требования",kind:"small"},
          {x:1100,y:278,text:"гоняет тесты",kind:"label"},
          {x:1100,y:309,text:"видит только",kind:"tiny"},
          {x:1100,y:330,text:"нужное для проверки",kind:"tiny"}
        ]
      }
    ],
    outputs:[
      [[658,355],[658,389]],
      [[805,355],[805,389]],
      [[952,355],[952,389]],
      [[1100,355],[1100,389]]
    ],
    merge:[590,389,580,46],
    mergeText:[
      {x:880,y:408,text:"ОРКЕСТРАТОР СОБИРАЕТ РЕЗУЛЬТАТЫ",kind:"label"},
      {x:880,y:427,text:"общая цель без склада всех черновиков",kind:"tiny"}
    ]
  }
};

const [originX,originY]=diagramData.origin;
const [scaleX,scaleY]=diagramData.scale;
const origin={x:originX,y:originY};
const scale={x:scaleX,y:scaleY};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const NS="http://www.w3.org/2000/svg";
  const make=(name,attrs)=>{
    const node=document.createElementNS(NS,name);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));
    return node;
  };
  const appendText=item=>{
    const node=make("text",{
      x:sx(item.x),y:sy(item.y),
      class:item.kind,"text-anchor":"middle"
    });
    node.textContent=item.text;
    svg.appendChild(node);
  };
  const appendRect=(box,kind)=>{
    const [x,y,w,h]=box;
    svg.appendChild(make("rect",{
      x:sx(x),y:sy(y),
      width:sx(w)-sx(diagramData.origin[0]),
      height:sy(h)-sy(diagramData.origin[1]),
      rx:sx(diagramData.radius)-sx(diagramData.origin[0]),
      class:kind
    }));
  };
  const pathFrom=points=>{
    let first=true;
    return points.map(([x,y])=>{
      const command=first?"M":"L";
      first=false;
      return command+" "+sx(x)+" "+sy(y);
    }).join(" ");
  };
  const appendPath=(points,kind,arrow)=>{
    const attrs={d:pathFrom(points),class:kind};
    if(arrow)attrs["marker-end"]="url(#arrow)";
    svg.appendChild(make("path",attrs));
  };

  const defs=make("defs",{});
  const marker=make("marker",{
    id:"arrow",
    markerWidth:sx(diagramData.marker.w)-sx(diagramData.origin[0]),
    markerHeight:sy(diagramData.marker.h)-sy(diagramData.origin[1]),
    refX:sx(diagramData.marker.refX),
    refY:sy(diagramData.marker.refY),
    orient:"auto",
    markerUnits:"userSpaceOnUse"
  });
  marker.appendChild(make("path",{
    d:pathFrom(diagramData.marker.points),
    fill:"var(--blue-strong)"
  }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  diagramData.headings.forEach(appendText);
  appendRect(diagramData.left.frame,"panel");
  appendRect(diagramData.left.head,"header");
  diagramData.left.cards.forEach(item=>{
    appendRect(item.box,item.kind.replace(" dashed",""));
    if(item.kind.includes("dashed")){
      const last=svg.lastElementChild;
      last.setAttribute(
        "stroke-dasharray",
        (sx(diagramData.dash[0])-sx(diagramData.origin[0]))+" "+
        (sx(diagramData.dash[1])-sx(diagramData.origin[0]))
      );
    }
  });
  appendPath(diagramData.left.cross,"cross",false);
  appendPath(diagramData.left.push,"flow",true);
  diagramData.left.texts.forEach(appendText);

  appendRect(diagramData.right.orchestrator,"orchestrator");
  diagramData.right.orchestratorText.forEach(appendText);
  diagramData.right.rail.forEach(points=>appendPath(points,"flow",true));
  diagramData.right.agents.forEach(agent=>{
    appendRect(agent.box,agent.kind);
    agent.texts.forEach(appendText);
  });
  diagramData.right.outputs.forEach(points=>appendPath(points,"output",true));
  appendRect(diagramData.right.merge,"merge");
  diagramData.right.mergeText.forEach(appendText);
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
</body>
</html>
