<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цена связности: 4 маршрута против 12 связей</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --surface-2: #f1f4f8;
      --ink: #172033;
      --muted: #5e687a;
      --border: #ccd3df;
      --divider: #aeb8c8;
      --orchestrator: #6d4aff;
      --orchestrator-soft: #eee9ff;
      --research: #087f8c;
      --coder: #d96c06;
      --tester: #2374d8;
      --reviewer: #b13b72;
      --badge: #e9edf4;
      --fallback: #8b2635;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --surface: #171d28;
        --surface-2: #202838;
        --ink: #eef2f8;
        --muted: #aeb8c8;
        --border: #3a465a;
        --divider: #58657a;
        --orchestrator: #a58cff;
        --orchestrator-soft: #292344;
        --research: #55c5ca;
        --coder: #ffad59;
        --tester: #71aeff;
        --reviewer: #ec82b3;
        --badge: #252e3e;
        --fallback: #ff9aaa;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      padding: 14px 18px 10px;
      font-size: 20px;
      font-weight: bold;
      color: var(--ink);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--surface);
    }

    .panel {
      fill: var(--surface-2);
      stroke: var(--border);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .divider {
      stroke: var(--divider);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .route,
    .swarm-route {
      fill: none;
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .swarm-route {
      stroke-width: 2px;
    }

    .agent-card,
    .agent-node {
      fill: var(--surface);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .orchestrator {
      fill: var(--orchestrator-soft);
      stroke: var(--orchestrator);
      stroke-width: 2.5px;
      vector-effect: non-scaling-stroke;
    }

    .badge {
      fill: var(--badge);
      stroke: var(--border);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .panel-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .badge-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .agent-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .agent-letter {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .orchestrator-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .small-label {
      fill: var(--muted);
      font-size: 12px;
    }

    .formula {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    #fallback {
      margin: 0;
      padding: 18px;
      color: var(--fallback);
      background: var(--surface);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Цена связности: 4 маршрута против 12 связей</h1>
    <svg id="diagram"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"></svg>
    <p id="fallback" hidden>
      Слева должны быть показаны оркестратор, четыре исполнителя и четыре
      центральных маршрута; справа — четыре равноправных агента и двенадцать
      возможных направленных связей между ними.
    </p>
  </figure>

  <script>
    const DATA = [{
      origin: { x: 0, y: 0 },
      scale: { x: 10, y: 10 },
      m: {
        zero: 0,
        one: 1,
        negativeOne: -1,
        half: 0.5,
        two: 2,
        canvasW: 120,
        canvasH: 45,
        panelY: 1,
        panelH: 43,
        panelRadius: 1.2,
        leftX: 2,
        rightX: 62,
        panelW: 56,
        dividerX: 60,
        dividerTop: 2.5,
        dividerBottom: 43,
        titleY: 4.2,
        leftTitleX: 5,
        rightTitleX: 65,
        badgeY: 4.2,
        badgeW: 15,
        badgeH: 3.8,
        badgeRadius: 1.9,
        leftBadgeX: 49,
        rightBadgeX: 109,
        cardW: 14,
        cardH: 5,
        cardRadius: 1,
        orchW: 14,
        orchH: 7,
        orchRadius: 1.2,
        orchX: 30.5,
        orchY: 24,
        orchTextY: 23.2,
        orchSubY: 25.4,
        arrowLength: 0.9,
        arrowWidth: 0.42,
        nodeRadius: 3.1,
        curve: 1.65,
        formulaY: 39.4,
        legendY: 42,
        leftSummaryX: 30,
        rightSummaryX: 90
      },
      leftAgents: [
        {
          name: "Исследователь",
          color: "var(--research)",
          x: 30.5, y: 10.5,
          from: { x: 30.5, y: 13 },
          to: { x: 30.5, y: 20.5 }
        },
        {
          name: "Кодер",
          color: "var(--coder)",
          x: 10.5, y: 24,
          from: { x: 17.5, y: 24 },
          to: { x: 23.5, y: 24 }
        },
        {
          name: "Тестировщик",
          color: "var(--tester)",
          x: 50.5, y: 24,
          from: { x: 43.5, y: 24 },
          to: { x: 37.5, y: 24 }
        },
        {
          name: "Ревьюер",
          color: "var(--reviewer)",
          x: 30.5, y: 37.5,
          from: { x: 30.5, y: 35 },
          to: { x: 30.5, y: 31.5 }
        }
      ],
      swarmAgents: [
        { key: "И", name: "исследователь", color: "var(--research)", x: 72, y: 14 },
        { key: "К", name: "кодер", color: "var(--coder)", x: 108, y: 14 },
        { key: "Т", name: "тестировщик", color: "var(--tester)", x: 72, y: 33 },
        { key: "Р", name: "ревьюер", color: "var(--reviewer)", x: 108, y: 33 }
      ]
    }];

    const [D] = DATA;
    const origin = D.origin;
    const scale = D.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const NS = "http://www.w3.org/2000/svg";
      const M = D.m;

      const make = (name, attrs = {}) => {
        const element = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attrs)) {
          element.setAttribute(key, value);
        }
        return element;
      };

      const add = (parent, child) => {
        parent.appendChild(child);
        return child;
      };

      const text = (parent, value, x, y, className, anchor = "middle") => {
        const element = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        });
        element.textContent = value;
        return add(parent, element);
      };

      const rect = (parent, x, y, width, height, radius, className, stroke) => {
        const attrs = {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(radius) - sx(M.zero),
          ry: sy(radius) - sy(M.zero),
          class: className
        };
        if (stroke) attrs.stroke = stroke;
        return add(parent, make("rect", attrs));
      };

      const circle = (parent, x, y, radius, className, stroke) =>
        add(parent, make("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(radius) - sx(M.zero),
          class: className,
          stroke
        }));

      const arrowHead = (parent, end, previous, color) => {
        const dx = end.x - previous.x;
        const dy = end.y - previous.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const base = {
          x: end.x - ux * M.arrowLength,
          y: end.y - uy * M.arrowLength
        };
        const side = {
          x: -uy * M.arrowWidth,
          y: ux * M.arrowWidth
        };
        const points = [
          end,
          { x: base.x + side.x, y: base.y + side.y },
          { x: base.x - side.x, y: base.y - side.y }
        ];
        return add(parent, make("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          fill: color
        }));
      };

      const straightArrow = (parent, from, to, color) => {
        add(parent, make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: "route",
          stroke: color
        }));
        arrowHead(parent, to, from, color);
      };

      const curvedArrow = (parent, fromNode, toNode) => {
        const dx = toNode.x - fromNode.x;
        const dy = toNode.y - fromNode.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const start = {
          x: fromNode.x + ux * M.nodeRadius,
          y: fromNode.y + uy * M.nodeRadius
        };
        const end = {
          x: toNode.x - ux * M.nodeRadius,
          y: toNode.y - uy * M.nodeRadius
        };
        const control = {
          x: (fromNode.x + toNode.x) * M.half - uy * M.curve,
          y: (fromNode.y + toNode.y) * M.half + ux * M.curve
        };
        const route = make("path", {
          d: `M ${sx(start.x)} ${sy(start.y)} Q ${sx(control.x)} ${sy(control.y)} ${sx(end.x)} ${sy(end.y)}`,
          class: "swarm-route",
          stroke: fromNode.color,
          "aria-label": `${fromNode.name} направляет сообщение агенту: ${toNode.name}`
        });
        add(parent, route);
        arrowHead(parent, end, control, fromNode.color);
      };

      const pill = (parent, centerX, centerY, label) => {
        rect(
          parent,
          centerX - M.badgeW * M.half,
          centerY - M.badgeH * M.half,
          M.badgeW,
          M.badgeH,
          M.badgeRadius,
          "badge"
        );
        text(parent, label, centerX, centerY, "badge-label");
      };

      svg.replaceChildren();

      const titleNode = make("title", { id: "svg-title" });
      titleNode.textContent = "Сравнение четырёх центральных маршрутов и двенадцати направленных связей";
      add(svg, titleNode);

      const descNode = make("desc", { id: "svg-desc" });
      descNode.textContent =
        "Слева четыре исполнителя соединены только с оркестратором. Справа каждый из четырёх агентов может отправить сообщение каждому из трёх остальных.";
      add(svg, descNode);

      rect(svg, M.zero, M.zero, M.canvasW, M.canvasH, M.zero, "canvas");
      rect(svg, M.leftX, M.panelY, M.panelW, M.panelH, M.panelRadius, "panel");
      rect(svg, M.rightX, M.panelY, M.panelW, M.panelH, M.panelRadius, "panel");

      add(svg, make("line", {
        x1: sx(M.dividerX),
        y1: sy(M.dividerTop),
        x2: sx(M.dividerX),
        y2: sy(M.dividerBottom),
        class: "divider"
      }));

      text(svg, "С центром", M.leftTitleX, M.titleY, "panel-title", "start");
      text(svg, "Без центра", M.rightTitleX, M.titleY, "panel-title", "start");
      pill(svg, M.leftBadgeX, M.badgeY, "4 маршрута");
      pill(svg, M.rightBadgeX, M.badgeY, "12 связей");

      const leftRoutes = add(svg, make("g", { "aria-label": "Четыре центральных маршрута" }));
      for (const agent of D.leftAgents) {
        straightArrow(leftRoutes, agent.from, agent.to, agent.color);
      }

      rect(
        svg,
        M.orchX - M.orchW * M.half,
        M.orchY - M.orchH * M.half,
        M.orchW,
        M.orchH,
        M.orchRadius,
        "orchestrator"
      );
      text(svg, "Оркестратор", M.orchX, M.orchTextY, "orchestrator-label");
      text(svg, "решает, что дальше", M.orchX, M.orchSubY, "small-label");

      for (const agent of D.leftAgents) {
        rect(
          svg,
          agent.x - M.cardW * M.half,
          agent.y - M.cardH * M.half,
          M.cardW,
          M.cardH,
          M.cardRadius,
          "agent-card",
          agent.color
        );
        text(svg, agent.name, agent.x, agent.y, "agent-label");
      }

      const swarmRoutes = add(svg, make("g", {
        "aria-label": "Двенадцать возможных направленных связей"
      }));
      for (const sender of D.swarmAgents) {
        for (const receiver of D.swarmAgents) {
          if (sender !== receiver) curvedArrow(swarmRoutes, sender, receiver);
        }
      }

      for (const agent of D.swarmAgents) {
        circle(svg, agent.x, agent.y, M.nodeRadius, "agent-node", agent.color);
        text(svg, agent.key, agent.x, agent.y, "agent-letter");
      }

      text(
        svg,
        "4 агента → 4 управляемых маршрута",
        M.leftSummaryX,
        M.legendY,
        "formula"
      );
      text(
        svg,
        "4 отправителя × 3 получателя = 12 направлений",
        M.rightSummaryX,
        M.formulaY,
        "formula"
      );
      text(
        svg,
        "И — исследователь · К — кодер · Т — тестировщик · Р — ревьюер",
        M.rightSummaryX,
        M.legendY,
        "small-label"
      );

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
