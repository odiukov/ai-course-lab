- concept: 'порядок разбора задачи перед выбором мультиагентной схемы: сначала названное ограничение, затем структура зависимостей, затем топология, затем сравнение выигрыша с надбавкой'
  question: Расставь шаги разбора задачи, по итогам которого принимается решение о мультиагентной схеме.
  explanation: Топология — следствие, а не отправная точка. Без названного ограничения нечего снимать, без карты зависимостей нельзя отличить параллельные ветви от цепочки, а без подсчёта надбавки решение принимается по валовому выигрышу вместо чистого.
  kind: order
  items:
    - 'Назвать конкретное наблюдаемое ограничение одного агента: переполнение окна, смешение экспертиз или последовательное узкое место'
    - 'Описать структуру зависимостей между подзадачами: какие входы нужны каждой и от чьих результатов она зависит'
    - Выбрать простейшую топологию, которая снимает названное ограничение при такой структуре зависимостей
    - Оценить надбавку координации и сравнить её с ожидаемым выигрышем
  id: 049-final-quiz-1
  fingerprint: b74538ce
- concept: 'средство подбирается под тип потолка: последовательное узкое место снимается одновременным запуском, а не изоляцией контекста и не разделением ролей'
  question: Задача целиком помещается в окно агента, экспертиза требуется одна и та же, но 7 независимых проверок выполняются по очереди, и единственная претензия — общее время. Что снимет ограничение?
  explanation: 'Три причины потолка лечатся разными средствами. Здесь окно не переполнено и экспертиза одна, значит изоляция контекста и разделение ролей ничего не ускорят: время уходит на очередь. Одновременный запуск независимых ветвей — единственное средство против последовательного узкого места; swarm добавил бы координацию без нужды.'
  kind: choice
  options:
    - Разнести проверки по специалистам с разными системными промптами, чтобы у каждой была своя роль
    - Запустить все 7 проверок одновременно и собрать результаты после готовности полного набора
    - Вынести материал проверок в отдельные окна и вернуть в основной агент короткие выжимки
    - Поставить peer swarm, где агенты сами разбирают проверки и договариваются между собой
  correct: 1
  id: 049-final-quiz-2
  fingerprint: 9dadada5
- concept: минимальное число исполнителей по объёму материала оценивается делением на свободную часть окна, оставшуюся после постоянных накладных расходов
  question: Материал — 90 файлов по 6 тысяч токенов. Окно исполнителя 128 тысяч токенов, из них 28 тысяч постоянно заняты системным промптом и инструкциями. Материал делится произвольно. Сколько минимум исполнителей нужно, чтобы весь материал был прочитан?
  explanation: 'Считать надо не по размеру окна, а по свободной его части: 128 − 28 = 100 тысяч токенов на материал. Всего материала 90 × 6 = 540 тысяч токенов, значит 540 / 100 = 5.4, и потребуется 6 исполнителей — дробного агента не бывает, остаток занимает целое окно.'
  kind: numeric
  answer: 6
  tolerance: 0.4
  id: 049-final-quiz-3
