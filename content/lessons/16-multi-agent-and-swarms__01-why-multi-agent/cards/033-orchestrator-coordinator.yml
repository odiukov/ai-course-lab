- concept: детерминированная маршрутизация по полям сообщения дешевле и предсказуемее в коде, чем в модели
  question: 'Маршрутизация в системе полностью описана правилами: поле адресата задаёт входящий ящик, статус `done` отправляет результат следующему участнику, неизвестный адрес даёт ошибку. Что даст замена этого кода вызовом LLM?'
  explanation: 'Правила такого вида — это работа оператора `if`. Модель за неё берёт токены и не даёт детерминизма: один и тот же вход может быть разложен по-разному. Поэтому координатор обычно не-агентный компонент, обычный код.'
  kind: choice
  options:
    - Расход токенов на каждое сообщение и риск разной обработки одинаковых входов
    - Ту же цену и то же поведение, поскольку правила простые
    - Более строгую гарантию доставки, потому что модель понимает содержание сообщений
  correct: 0
