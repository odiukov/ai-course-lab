- concept: координатор действует по полям контракта сообщения и не оценивает смысл задачи, поэтому таблица правил не покрывает новые формулировки
  question: Координатору поручили не только доставлять сообщения, но и выбирать исполнителей по смыслу входящей задачи. Объясни своими словами, что здесь сломается.
  explanation: 'Граница проходит так: оркестратор решает, что и кому стоит поручить, координатор доставляет уже созданное сообщение по правилам. Сдвиг границы в любую сторону стоит дорого: модель на месте `if` жжёт токены, код на месте планирования не покрывает новых случаев.'
  kind: open
  reference: 'Координатор — не агент: он сопоставляет поля сообщения (адресат, тип, статус) с заранее заданными правилами. Выбор исполнителей зависит от содержания задачи, а формулировок бесконечно много: каждая новая задача либо не попадает ни в одно правило, либо попадает в неподходящее. Список правил приходится наращивать без конца, и всё равно он не даёт того, что нужно — рассуждения о смысле. Такое решение принадлежит оркестратору на базе LLM.'
