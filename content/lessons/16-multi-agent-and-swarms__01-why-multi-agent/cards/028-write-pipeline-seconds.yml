- concept: пустой список стадий — корректный вход, дающий нейтральный элемент сложения, а не ошибку
  question: Что должна вернуть функция полного времени pipeline, если список стадий пуст?
  explanation: 'Сумма пустого набора — нейтральный элемент сложения, то есть ноль секунд. Это делает функцию безопасной для составных случаев: добавление пустой ветви расчёта не ломает вызов и не требует отдельной проверки у вызывающего кода.'
  kind: choice
  options:
    - 'Ноль секунд: работы нет, ждать нечего'
    - 'Исключение: pipeline без стадий бессмыслен'
    - None, чтобы вызывающий код сам решил, что делать
    - Время одной стадии по умолчанию
