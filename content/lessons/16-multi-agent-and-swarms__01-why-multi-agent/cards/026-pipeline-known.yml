- concept: полная задержка последовательного pipeline равна сумме длительностей стадий, потому что стадии не перекрываются во времени
  question: 'Pipeline из трёх зависимых агентов: первый работает 7 секунд, второй 25, третий 13. Сколько секунд пройдёт от запроса до итогового ответа?'
  explanation: 'Каждый следующий агент не может начать, пока не получил вход от предыдущего, поэтому времена складываются: 7 + 25 + 13 = 45. Максимум (25) был бы ответом только при одновременной независимой работе.'
  kind: numeric
  answer: 45
  tolerance: 0.1
  id: 026-pipeline-known-1
  fingerprint: 6e591a69
- concept: сбой стадии pipeline не портит результат следующих стадий, а вовсе не даёт им запуститься
  question: Средняя стадия pipeline упала с ошибкой. Что произойдёт с последующими стадиями?
  explanation: 'Вход следующей стадии — это выход предыдущей. Нет выхода — нет запуска. Как на конвейере: если покраска встала, на сборку машины не приезжают вообще, а не приезжают неокрашенными. Отсюда и требование обрабатывать отказ стадии явно.'
  kind: choice
  options:
    - Они отработают на неполных данных и вернут ухудшенный результат
    - 'Они вообще не запустятся: у них нет входа, вся цепочка блокируется'
    - Они запустятся параллельно, компенсируя выпавшую стадию
    - Они перезапустят упавшую стадию и продолжат сами
  correct: 1
