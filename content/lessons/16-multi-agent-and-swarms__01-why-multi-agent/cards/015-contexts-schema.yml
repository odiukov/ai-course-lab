- concept: общий материал дублируется в нескольких окнах, поэтому сумма занятых окон больше объёма уникального материала
  question: Задачу раздали 5 специализированным агентам. Спецификация на 6 000 токенов кладётся в окно каждого из пяти. Документация на 70 000 токенов нужна только исследователю. Готовый код на 12 000 токенов попадает к трём агентам (кодер, ревьюер, тестировщик). Сколько токенов суммарно занято по всем пяти окнам?
  explanation: '5×6 000 = 30 000 за спецификацию, 70 000 у исследователя, 3×12 000 = 36 000 за код. Итого 136 000, тогда как уникального материала всего 88 000. Разделение по ролям не сокращает суммарный объём: общий материал копируется в каждое окно, где он нужен. Выигрыш измеряется не суммой, а загрузкой отдельного окна.'
  kind: numeric
  answer: 136000
  tolerance: 100
  id: 015-contexts-schema-1
  fingerprint: fc58434a
- concept: разделение по ролям помогает, только если материал делится по границам ролей; роль, чей собственный материал больше окна, требует дальнейшего дробления
  question: Работу разделили на роли. Исследователю по его роли нужно прочитать 400 000 токенов документации, а окно модели — 200 000 токенов. Что даёт такое разделение?
  explanation: 'Материал прикреплён к роли: документацию читает исследователь, а не кодер или ревьюер. Разделение снимает загрязнение чужим содержимым, но не уменьшает объём внутри одной роли. Если материал одной роли больше окна, роль дробят дальше (несколько исследователей по разделам документации) либо режут материал поиском и выборкой.'
  kind: choice
  options:
    - 'Проблема снята: четыре роли делят документацию между собой'
    - Окна остальных агентов чистые, но роль исследователя всё равно не помещается — её нужно дробить дальше или сокращать материал до чтения
    - Окно исследователя расширяется, потому что остальные агенты его не используют
    - Оркестратор возьмёт лишнюю часть документации в своё окно автоматически
  correct: 1
