- concept: оркестратор упирается в тот же предел, если накапливает сырые выводы всех агентов вместо сжатых итогов
  question: 'Оркестратор складывает в своё окно полные сырые выводы каждого агента: прочитанную документацию, все черновики кода, полный лог тестов. К чему это приводит?'
  explanation: 'Чистые окна специалистов ничего не дают, если один участник склеивает у себя всё сырьё: 50k документации плюс черновики плюс логи снова дают перегруженный контекст. Оркестратор держит цель, сжатые итоги ролей и ссылки на артефакты, а полное содержание остаётся у автора.'
  kind: choice
  options:
    - 'Ни к чему: оркестратор не рассуждает, а только пересылает данные'
    - Качество растёт, потому что оркестратор видит всю картину целиком
    - Окно оркестратора собирает всё то же содержимое, что было у одиночного агента, и упирается в тот же предел
    - Специализированные агенты теряют свои окна
