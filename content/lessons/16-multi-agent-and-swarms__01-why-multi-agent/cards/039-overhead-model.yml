- concept: coordination_overhead учитывает только работу, порождённую разделением, а полезная работа агентов в него не входит
  question: Какая из перечисленных трат НЕ входит в coordination_overhead?
  explanation: 'Критерий один: существовала бы эта трата у одного агента? Чтение материала ради задачи — существовала бы, это полезная работа. Передача, сборка и переделки из-за рассинхронизации появляются именно потому, что работа разделена.'
  kind: choice
  options:
    - Чтение исследователем файлов кодовой базы ради ответа на исходный вопрос
    - Формирование и передача сообщения от исследователя к кодеру
    - Отдельная обработка выходов нескольких агентов ради общего ответа
    - Повторный вызов агента после замечания ревьюера, вызванного рассинхронизацией
  correct: 0
  id: 039-overhead-model-1
  fingerprint: 3b3052f4
- concept: сообщение и вызов модели — разные единицы учёта, между ними нет соответствия один к одному
  question: Почему в модели накладных расходов количество межагентных сообщений и количество вызовов модели считают раздельно, а не приравнивают одно к другому?
  explanation: Приравняв сообщения к вызовам, вы получите систематически неверную оценку в обе стороны — и переоценку при пакетной обработке входящих, и недооценку при уточнениях и повторах.
  kind: open
  reference: 'Между ними нет соответствия один к одному в обе стороны. Агент может получить несколько адресованных ему сообщений и обработать их за один запуск — тогда сообщений больше, чем вызовов. И наоборот: на одно полученное сообщение агент может потратить два и более запуска (уточнение, повторная попытка) — тогда вызовов больше, чем сообщений. Поэтому величины измеряются отдельно, а уже их стоимость приводится к общей единице и складывается.'
  id: 039-overhead-model-2
  fingerprint: 110a6b98
- concept: разнородные компоненты накладных расходов складываются только после приведения к одной выбранной единице измерения
  question: Передача сообщений, синтез результатов и дополнительные вызовы измеряются разными сущностями. Что нужно сделать, прежде чем сложить их в одно число накладных расходов?
  explanation: Сумма имеет смысл только в общей единице. Сначала выбирается шкала (токены либо условная стоимость), затем каждый компонент выражается в ней, и лишь потом происходит сложение.
  kind: choice
  options:
    - Привести все три компонента к одной выбранной единице — например, к токенам или к условной стоимости вызова
    - Взять максимальный из трёх компонентов, потому что остальные им поглощаются
    - Отбросить компонент, который измеряется не в вызовах модели
    - Умножить компоненты друг на друга, чтобы разные единицы сократились
  correct: 0
  id: 039-overhead-model-3
  fingerprint: 81e74a8a
