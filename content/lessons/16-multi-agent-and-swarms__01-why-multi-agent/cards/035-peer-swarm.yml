- concept: swarm масштабируется на много агентов, потому что нет единственного центра, чья пропускная способность ограничивает добавление участников
  question: Почему peer swarm масштабируется на большое число агентов лучше, чем схема с центральным оркестратором?
  explanation: 'В схеме с оркестратором каждый исполнитель обслуживается центром: его контекст и число решений растут с числом агентов. В swarm решения возникают из локальных взаимодействий, поэтому центр не упирается в предел — плата берётся отладкой и отсутствием единственного ответственного за поведение системы.'
  kind: choice
  options:
    - Каждый новый агент не добавляет решений и сообщений единственному центру, который иначе становится узким местом
    - Агенты в swarm расходуют меньше токенов на одно и то же действие
    - В swarm число связей между агентами растёт медленнее, чем при центральном оркестраторе
