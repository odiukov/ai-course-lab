- concept: равноправие агентов в swarm означает отсутствие обязательного центра маршрутизации, а не одинаковость их ролей
  question: Что означает «равноправные агенты» в peer swarm?
  explanation: 'Специализация сохраняется: исследователь, кодер, ревьюер по-прежнему разные. Равноправие — про структуру связей: любой может обратиться к любому напрямую, и работа не обязана проходить через одного участника.'
  kind: choice
  options:
    - У всех агентов один и тот же системный промпт и одинаковые инструменты
    - Все агенты видят один общий контекст и потому принимают одинаковые решения
    - Ни один агент не является обязательным центром маршрутизации, при этом роли могут различаться
