- concept: ветвь fan-out допустима, только если получила все нужные входы на старте и завершается без промежуточных результатов соседних ветвей
  question: Какой набор подзадач можно честно запустить как fan-out?
  explanation: 'Проверка простая: сможет ли каждая ветвь дойти до конца, если соседи до слияния молчат. У поиска по трём сервисам входы известны на старте — да. В остальных вариантах вход одной роли — это выход другой, значит перед нами цепочка, а не веер.'
  kind: choice
  options:
    - Три агента ищут одну известную сигнатуру ошибки в логах трёх разных сервисов
    - Первый агент выясняет причину сбоя, второй правит код, третий пишет тест на исправление
    - Первый агент пишет спецификацию, второй реализует её, третий сверяет реализацию со спецификацией
    - Первый агент составляет план миграции, остальные выполняют его пункты
  correct: 0
  id: 029-fanout-independence-1
  fingerprint: c9663c69
- concept: одновременный запуск зависимых подзадач не ускоряет работу, а превращается в ожидание и работу по догадкам с последующей переделкой
  question: Команда запустила три зависимые подзадачи параллельно, надеясь ускориться. Объясни своими словами, почему выигрыша по времени не будет.
  explanation: 'Ключ: параллельность ускоряет независимую работу и маскирует зависимую. Диагностика — проверить, все ли входы ветви известны в момент старта; если нет, зависимость надо оформлять как передачу результата, а не как ещё одну ветвь веера.'
  kind: open
  reference: Параллелизм экономит время только тогда, когда ветви независимы. Зависимая ветвь на старте не имеет нужного входа, поэтому она либо простаивает до появления результата соседа (и итог всё равно последовательный), либо начинает работать по догадке о ещё не полученном результате. Догадка почти наверняка расходится с фактическим выводом, и работу приходится переделывать — то есть суммарные токены и время растут по сравнению с честной последовательной передачей. Одновременный запуск не устраняет зависимость, он лишь прячет её на схеме.
  id: 029-fanout-independence-2
  fingerprint: 35f9fb33
