  question: Почему при подсчёте координационной нагрузки в схеме прямого общения агентов пару «агент A и агент B» считают как два маршрута, а не как один?
  explanation: 'Канал — это не провод, а контракт: кто кому имеет право писать, с какой структурой сообщения и что делать при сбое. Эти правила задаются для каждого направления отдельно, поэтому обратный маршрут не бесплатное следствие прямого.'
  kind: choice
