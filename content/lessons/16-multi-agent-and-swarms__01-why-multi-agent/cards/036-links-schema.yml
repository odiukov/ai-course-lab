- concept: цена peer swarm — отсутствие единой точки, объясняющей решение системы, из-за чего разбор поведения усложняется
  question: Систему из нескольких агентов без центрального координатора отлаживать труднее, чем схему с оркестратором. Что именно создаёт эту трудность?
  explanation: В схеме с оркестратором есть один узел, через который прошли все решения о делегировании, — его след и читают при разборе. В swarm результат возникает из взаимодействия равноправных агентов, ответственного узла нет, и на вопрос «почему система сделала вот это» приходится отвечать реконструкцией всей переписки. Журналы при этом вести можно и нужно — проблема в отсутствии единой точки принятия решения.
  kind: choice
  options:
    - 'Нет единственного места, где принималось решение: поведение сложилось из взаимодействия агентов, и восстанавливать его приходится по всей сети обменов'
    - Агенты без координатора не ведут журнал сообщений, поэтому история обмена не сохраняется
    - Каждый агент в такой схеме использует собственную модель, поэтому ответы нельзя воспроизвести
    - Без координатора агенты работают строго последовательно, и промежуточные состояния не наблюдаются
