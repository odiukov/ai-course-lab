- concept: контекстное окно — конечный бюджет в токенах, и остаток места считается вычитанием уже занятого объёма
  question: Контекстное окно агента — 256 000 токенов, из них 190 000 уже заняты. Каждый следующий файл добавляет примерно 11 000 токенов. Сколько таких файлов ещё поместится целиком?
  explanation: 256 000 − 190 000 = 66 000 свободных токенов; 66 000 / 11 000 = 6 файлов. Седьмой уже не влезет, и его придётся сокращать или вытеснять что-то другое — именно так конечность окна превращается в потерю ранее прочитанного.
  kind: numeric
  answer: 6
  tolerance: 0.5
