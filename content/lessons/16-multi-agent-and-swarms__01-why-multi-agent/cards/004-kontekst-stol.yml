- concept: за одно и то же пространство контекста конкурируют все виды содержимого работы, а не только читаемые файлы
  question: Что именно занимает место в контекстном окне агента во время работы над задачей? Перечисли своими словами и объясни, почему это делает «прочитать побольше файлов» плохой стратегией.
  explanation: Типичная ошибка — считать бюджетом только исходники. На деле вывод тестов и длинные логи съедают окно быстрее файлов, а рассуждения агента копятся с каждым ходом.
  kind: open
  reference: 'Место занимают: формулировка задачи и системный промпт, содержимое прочитанных файлов, ответы инструментов (вывод команд, логи, ошибки тестов), собственные рассуждения агента и принятые ранее решения. Всё это конкурирует за один конечный бюджет токенов. Поэтому чтение лишних файлов не бесплатно: оно вытесняет или заслоняет ответы инструментов и ранние ограничения, от которых зависит корректность решения. Разумнее читать выборочно и переносить дальше сжатые выводы, а не сырое содержимое.'
  id: 004-kontekst-stol-3
