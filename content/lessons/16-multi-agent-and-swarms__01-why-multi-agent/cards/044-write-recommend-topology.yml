- concept: в цепочке ранних возвратов более специфичное условие проверяется раньше более общего, иначе общая ветвь перехватывает задачу
  question: Функция выбора топологии построена как цепочка ранних возвратов. Расставь проверки в порядке, при котором задача с несколькими совпадающими признаками получит верный ответ.
  explanation: 'Ранний возврат перехватывает задачу окончательно, поэтому специфичное условие должно стоять перед общим. У задачи с динамическим составом поручений части тоже могут быть независимыми: если проверка независимости стоит раньше, функция вернёт fan-out и до ветки orchestrator дело не дойдёт. Обратный порядок безопасен — у чисто параллельной задачи признака динамического выбора нет.'
  kind: order
  items:
    - проверить, что разделение работы вообще не требуется, и вернуть single
    - проверить, что стадии строго зависимы — выход предыдущей является входом следующей, — и вернуть pipeline
    - проверить, что состав подзадач определяется только по промежуточным результатам, и вернуть orchestrator
    - проверить, что части независимы и известны заранее, и вернуть fan-out
  id: 044-write-recommend-topology-1
  fingerprint: c0fc4f0f
- concept: цепочка ранних возвратов обязана заканчиваться безопасной ветвью по умолчанию — одиночным агентом
  question: Функция выбора топологии состоит из ранних возвратов по признакам задачи. Почему после последней проверки обязательна ветвь по умолчанию, возвращающая одиночного агента?
  explanation: 'Признаки описывают конкретные ограничения; их отсутствие — законный случай, а не ошибка. Возвращать в этом случае мультиагентную схему нельзя: координация покупается сообщениями, вызовами и сборкой результата, а ограничения, которое она снимает, нет.'
  kind: choice
  options:
    - Задача, не совпавшая ни с одним признаком, иначе останется без ответа, а самый дешёвый безопасный вариант — не делить работу вообще
    - Ветвь по умолчанию нужна, чтобы функция всегда возвращала самую мощную схему на случай ошибки в признаках
    - Без неё нельзя вернуть swarm, потому что swarm не имеет собственного условия
    - Она нужна только для пустого входа, при непустых признаках недостижима
  correct: 0
