- concept: 'порядок делегирования чтения: узкая постановка, чистое окно исполнителя, работа с материалом, возврат сжатого результата'
  question: Расставь шаги делегирования тяжёлого чтения дочернему агенту.
  explanation: 'Ключевой момент — второй шаг: у исполнителя своё окно, иначе схема вырождается в чтение тех же файлов родительским контекстом и никакой экономии не даёт.'
  kind: order
  items:
    - родитель формулирует узкую задачу и передаёт её дочернему агенту
    - дочерний агент стартует с собственным чистым контекстом
    - дочерний агент загружает и разбирает объёмный материал в своём окне
    - дочерний агент возвращает родителю сжатый результат
    - родитель продолжает работу, не загружая исходный материал
