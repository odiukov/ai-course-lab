- concept: родительский контекст растёт на размер возвращённой выжимки, а не на объём, прочитанный дочерним агентом
  question: В контексте родительского агента занято 12000 токенов. Он поручает дочернему агенту изучить 30 файлов по 5000 токенов каждый; дочерний агент возвращает выжимку в 600 токенов. Сколько токенов будет занято в контексте родителя после делегирования?
  explanation: '150000 токенов исходников живут в окне дочернего агента и остаются там. Родитель платит только за возврат: 12000 + 600 = 12600. Именно это делает делегирование выгодным — коэффициент сжатия здесь 250:1.'
  kind: numeric
  answer: 12600
  tolerance: 50
  id: 023-real-systems-1
  fingerprint: cde01b18
- concept: детали, не попавшие в выжимку, родителю недоступны — это цена делегирования, а не побочный эффект
  question: Дочерний агент изучил кодовую базу и вернул родителю короткий вывод. Позже родителю понадобилась деталь, которой в выводе не было. Что верно?
  explanation: Граница между агентами пропускает только возврат. Всё, что не вошло в выжимку, для родителя не существует, поэтому качество формулировки задачи дочернему агенту определяет, придётся ли делать повторный проход.
  kind: choice
  options:
    - 'деталь недоступна: её придётся добывать новым делегированием или запросом'
    - 'деталь доступна: прочитанное дочерним агентом остаётся видимым родителю'
    - деталь восстановится автоматически при следующем шаге рассуждения родителя
    - родитель может дочитать нужный файл только если дочерний агент ещё работает
