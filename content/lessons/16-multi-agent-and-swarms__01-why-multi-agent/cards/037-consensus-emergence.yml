- concept: consensus — протокол с заранее заданным условием закрытия разногласия, а не требование одинаковых мнений
  question: Пять агентов независимо оценивают план миграции и дают несовпадающие вердикты. Что даёт системе протокол consensus?
  explanation: 'Consensus не приводит мнения к одному, он задаёт наблюдаемое условие остановки спора: квалифицированное большинство, единогласие или вердикт отдельного проверяющего. Без такого условия система не знает, когда разногласие исчерпано.'
  kind: choice
  options:
    - Условие, при выполнении которого разногласие считается закрытым и работа идёт дальше
    - Гарантию, что после обмена аргументами все агенты придут к одинаковому выводу
    - Правило всегда брать вердикт агента с самым длинным обоснованием
    - Механизм, запрещающий агентам выдавать противоречащие друг другу выходы
  correct: 0
  id: 037-consensus-emergence-1
  fingerprint: 50b7189c
- concept: emergent behavior — паттерн уровня системы, возникший из локальных взаимодействий и не запрограммированный, при этом не обязательно полезный
  question: 'В работающей мультиагентной системе замечено: агенты начали пересылать спорные задачи по кругу, не доводя их до решения. Никто такого правила не задавал. Как это классифицировать?'
  explanation: 'Emergent behavior — любой паттерн уровня системы, выросший из локальных взаимодействий помимо проекта. Оценка «полезно или вредно» — отдельная от факта возникновения: бесконечная пересылка и слишком быстрое согласие такие же emergent-паттерны, как удачная эвристика.'
  kind: choice
  options:
    - Это emergent behavior — незапрограммированный паттерн системы, и он вредный
    - 'Это не emergent behavior: emergent behavior по определению означает удачную находку системы'
    - Это ошибка одного агента, потому что паттерны системы всегда прописаны в промптах
    - Это consensus, потому что агенты согласованно выбрали одинаковое действие
  correct: 0
  id: 037-consensus-emergence-2
  fingerprint: 3a8c64db
- concept: параллельные агенты без протокола разрешения противоречий быстрее производят конфликт, а не решение
  question: Четыре агента параллельно оценивают одно и то же изменение и выдают противоречащие выводы, а система берёт вывод того, кто ответил первым. Что здесь сломано и что должно быть добавлено?
  explanation: Consensus нужен ровно там, где выходы агентов могут противоречить друг другу. Без него параллельная схема даёт не решение, а более быстрый конфликт.
  kind: open
  reference: 'Параллельность ускорила производство противоречивых выходов, но не дала способа их разрешить: выбор по скорости ответа не связан с качеством вывода и делает результат системы случайным. Нужен протокол consensus — явное условие, при котором спор считается закрытым (например, совпадение вердиктов у квалифицированного большинства, единогласие или разбор отдельным проверяющим агентом). Протокол задаётся заранее, до запуска ветвей, потому что он определяет, какие выходы вообще принимаются.'
  id: 037-consensus-emergence-3
  fingerprint: 787b27c2
