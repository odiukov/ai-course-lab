- concept: эффект разделения подтверждается повторяемым сравнением с заранее измеренной одиночной схемой на одинаковых входах
  question: Ты хочешь доказать, что отдельный агент-ревьюер улучшает работу. Новая схема на одном прогоне дала хороший результат. Почему этого недостаточно для решения?
  explanation: Без заранее измеренного исходного результата не с чем сравнивать, а без одинаковых входов сравниваются разные задачи, а не разные схемы. Улучшение засчитывается, только если оно повторяется и связано с тем ограничением, ради которого вводилось разделение.
  kind: choice
  options:
    - 'Задача могла просто оказаться легче: нужен зафиксированный до изменения результат одиночной схемы и сравнение на том же наборе задач с теми же ограничениями'
    - Один прогон всегда занижает качество мультиагентной схемы, поэтому её нельзя оценивать сразу
    - Ревьюер начинает работать корректно только после нескольких запусков подряд
    - Расход токенов невозможно измерить на коротких прогонах, а качество можно
  correct: 0
  id: 048-practical-decision-1
  fingerprint: 3f48d217
- concept: критерий успеха выбирается до эксперимента, иначе метрика подбирается под уже полученный результат
  question: Почему критерий «что считать выигрышем» формулируют до запуска сравнения одиночной и разделённой схем, а не после?
  explanation: Метрик всегда несколько — качество, время, стоимость, число ручных вмешательств, — и почти в любом прогоне какая-нибудь из них улучшится. Заранее названный критерий вроде «время падает без потери качества» делает результат проверяемым, а не подгоняемым.
  kind: choice
  options:
    - Иначе под уже полученный результат подберут ту метрику, по которой он выглядит успехом, и сравнение перестанет что-либо доказывать
    - Иначе нельзя будет посчитать расход токенов, он фиксируется только заранее
    - Иначе агенты не узнают, к какой цели стремиться во время работы
    - Иначе разделённую схему нельзя будет запустить на тех же задачах
  correct: 0
  id: 048-practical-decision-2
  fingerprint: d524c45c
- concept: 'решение принимается по чистому выигрышу: измеренное улучшение минус цена координации'
  question: Разделённая схема дала небольшой прирост качества, но добавила передачу контекста между агентами, отдельный шаг синтеза ответов и дополнительные вызовы модели. Как принимать решение?
  explanation: 'Координация — не бесплатный побочный эффект, а часть счёта: сообщения, синтез, лишние вызовы и новые места для сбоя. Оценивается чистый выигрыш. Обнулить эту цену нельзя — она следствие самого разделения, поэтому её вычитают, а не ждут её исчезновения.'
  kind: choice
  options:
    - 'Сравнить прирост с ценой координации: если он её не перекрывает, разделение не оправдано'
    - 'Принять разделение: любой прирост качества важнее расходов на координацию'
    - 'Отклонить разделение: добавление вызовов модели само по себе делает схему хуже'
    - Отложить решение до тех пор, пока цену координации не удастся полностью убрать
  correct: 0
  id: 048-practical-decision-3
