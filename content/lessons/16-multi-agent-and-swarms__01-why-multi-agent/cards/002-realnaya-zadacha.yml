- concept: 'структура агентного цикла: состояние — выбор шага — вызов инструмента — результат в контекст — новое решение'
  question: Расставь фазы одного витка агентного цикла в правильном порядке.
  explanation: 'Цикл замкнут: каждый результат меняет состояние, из которого выбирается следующий шаг. Поэтому объём накопленного растёт с каждым витком, а не остаётся постоянным.'
  kind: order
  items:
    - Агент смотрит на текущее состояние задачи и накопленные сведения
    - Выбирает следующий шаг
    - Вызывает инструмент
    - Получает результат и добавляет его к накопленным сведениям
    - Заново решает, что делать дальше
  id: 002-realnaya-zadacha-1
  fingerprint: 0de8e562
- concept: реальную кодовую базу тяжёлой делает сеть зависимостей, раскрывающаяся постепенно, а не сложность отдельного файла
  question: Агент правит поведение при сбое сетевого запроса. Файлы простые, но задача разрастается. Что именно её раздувает?
  explanation: 'Сложность здесь структурная: даже простые файлы образуют длинную сеть зависимостей, которая раскрывается только по ходу работы. Агент вынужден тащить вперёд всё больше сведений и одновременно помнить исходное требование.'
  kind: choice
  options:
    - Отдельные файлы содержат слишком сложные алгоритмы
    - Каждое открытие тянет за собой новые связи — настройки, преобразование ошибок, тесты с инфраструктурой, документацию внешнего API — и объём этих связей заранее не виден
    - Модель плохо читает исходный код и требует перечитывать каждый файл
    - Инструменты возвращают результаты медленнее, чем модель успевает рассуждать
