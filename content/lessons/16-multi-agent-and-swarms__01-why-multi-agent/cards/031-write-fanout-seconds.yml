- concept: время схемы с параллельным участком и последующей общей стадией складывается из максимума ветвей и длительности этой стадии
  question: Три независимые ветви запускаются одновременно и работают 9, 12 и 6 секунд. После того как все ветви закончили, отдельный агент-сборщик сводит их результаты ещё 8 секунд. Через сколько секунд появится итоговый ответ?
  explanation: 'Параллельный участок занимает 12 секунд — столько работает самая долгая ветвь. Сборка стартует только после неё и добавляет свои 8 секунд: 12 + 8 = 20. Складывать все длительности подряд (9 + 12 + 6 + 8 = 35) нельзя: ветви не ждут друг друга.'
  kind: numeric
  answer: 20
  tolerance: 0.5
  id: 031-write-fanout-seconds-1
  fingerprint: 4d8722a9
- concept: оптимизация самой долгой ветви даёт выигрыш только до уровня следующей по длительности ветви
  question: 'Fan-out из трёх ветвей: 20, 14 и 9 секунд. Самую долгую ветвь переписали, и теперь она выполняется за 6 секунд. Сколько секунд ждёт пользователь после этой оптимизации?'
  explanation: 'Выигрыш обрывается на следующей по длительности ветви. Ускорение на 14 секунд (с 20 до 6) сократило ожидание только с 20 до 14: теперь узкое место — ветвь на 14 секунд. Дальнейшая работа над уже ускоренной ветвью не даст ничего.'
  kind: numeric
  answer: 14
  tolerance: 0.5
  id: 031-write-fanout-seconds-2
  fingerprint: 5e1d0633
- concept: пустой набор параллельных ветвей — корректный вход с нулевым ожиданием, а поиск максимума по пустому набору требует явного значения по умолчанию
  question: Функция считает время ожидания fan-out через поиск максимума в списке длительностей ветвей. Ей передали пустой список. Как должна вести себя корректная реализация?
  explanation: Ветвей нет — ждать нечего, поэтому осмысленный ответ нулевой. Но встроенный поиск максимума по пустой последовательности бросает исключение, так что нейтральное значение задаётся явно (например, аргументом default). Это не особый случай логики, а особенность агрегации.
  kind: choice
  options:
    - Вернуть нулевое ожидание, задав значение по умолчанию для поиска максимума
    - 'Упасть с ошибкой: максимум пустой последовательности не определён'
    - Вернуть None, потому что времени ожидания в этом случае не существует
    - Вернуть длительность одной условной ветви, взятую как минимальный шаг планировщика
  correct: 0
