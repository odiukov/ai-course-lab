- concept: фабрика фиксирует единый порядок запуска и единую форму результата для всех специалистов
  question: Что делает функция запуска специалиста, созданного общей фабрикой? Расставь действия по порядку.
  explanation: 'Порядок и форма упаковки живут в одном месте — в фабрике. Поэтому результаты всех специалистов сравнимы и суммируемы: расход токенов складывается по одному и тому же полю, а не по трём по-разному названным. Именно этого расхождения и не избежать при копировании кода запуска под каждую роль.'
  kind: order
  items:
    - принять входные данные конкретного запуска
    - вызвать модель, передав постоянный системный промпт роли и эти входные данные
    - 'упаковать ответ модели в общую форму результата: содержимое, израсходованные токены, вызовы инструментов'
    - вернуть результат вызывающему коду
  id: 046-specialists-in-code-2
  fingerprint: ba48845f
- concept: новый специалист — это конфигурация (имя роли и короткий промпт), а не новая реализация механизма
  question: В системе шесть специалистов, созданных одной фабрикой. Что нужно, чтобы добавить седьмого — инженера по производительности?
  explanation: Фабрика разделяет неизменное (как вызвать модель, как упаковать ответ) и настраиваемое (роль). Добавление специалиста меняет настройку, а не архитектуру. Копирование механизма как раз и порождает расхождения между копиями, ради устранения которых фабрика и вводится.
  kind: choice
  options:
    - 'Имя роли и короткий системный промпт: механизм вызова модели и форма результата уже находятся в фабрике'
    - Скопировать код запуска одного из существующих специалистов и подправить его под новую роль
    - Новый тип результата, потому что замеры производительности не укладываются в общую форму
    - Изменить промпты остальных шести специалистов, чтобы они знали о появлении седьмого
  correct: 0
