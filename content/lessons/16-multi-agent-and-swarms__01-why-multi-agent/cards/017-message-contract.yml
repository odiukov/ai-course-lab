- concept: 'у контракта сообщения два слоя: технический тип полей и смысловая договорённость о содержимом'
  question: 'Тип сообщения фиксирует поля: отправитель, получатель, содержимое строкой и время создания. Почему одного этого недостаточно и какая договорённость нужна дополнительно? Объясни своими словами.'
  explanation: Типы ловят структурные ошибки, а смысловой контракт — бесполезное содержимое правильной формы. Без второго слоя граница ролей формально соблюдена, а работа дальше не идёт.
  kind: open
  reference: 'Технический слой гарантирует форму: получатель точно получит текст, а не произвольный объект, и всегда будет знать происхождение и назначение сообщения. Но он ничего не говорит о том, что должно лежать внутри содержимого: под тип «строка» одинаково подходит и полезная выжимка, и весь журнал поиска, и намёк из трёх слов. Поэтому роли договариваются о смысловом формате — например, исследователь передаёт кодеру файл, наблюдаемое поведение и ограничение. Только оба слоя вместе делают сообщение пригодным для работы следующей роли.'
  id: 017-message-contract-2
  fingerprint: f2996d43
