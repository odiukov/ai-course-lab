- concept: граница роли состоит из двух частей — единственной ответственности и условия завершения, каждая предотвращает свой сбой
  question: 'Агенту задали единственную ответственность: «ты отвечаешь только за качество кода». Он не пишет новых фич и не занимается исследованием, но раз за разом возвращается к тому же файлу и предлагает всё новые улучшения. Чего не хватает в описании роли?'
  explanation: Единственная ответственность удерживает агента от ухода в чужую роль, но не отвечает на вопрос «когда стоп». Без условия завершения агент бесконечно улучшает результат внутри своей же зоны.
  kind: choice
  options:
    - 'Условия завершения: по какому результату роль считается выполненной'
    - Ещё более узкой ответственности
    - Доступа к большему числу инструментов
    - Общего контекста остальных агентов
  correct: 0
  id: 016-role-boundaries-1
  fingerprint: df98eaad
- concept: условие завершения должно быть наблюдаемым результатом, а не оценочным состоянием
  question: Какое условие завершения роли пригодно для проверки со стороны?
  explanation: 'Наблюдаемое условие можно проверить, не заглядывая внутрь рассуждений агента: есть список дефектов со ссылками или явное «чисто». Оценочные формулировки вроде «стало качественным» не дают точки остановки и превращают роль в бесконечную.'
  kind: choice
  options:
    - «Перечислены найденные дефекты с привязкой к строкам либо явно сообщено, что дефектов не найдено»
    - «Код стал качественным»
    - «Агент считает, что работа сделана хорошо»
    - «Потрачено достаточно ходов на проверку»
  correct: 0
  id: 016-role-boundaries-2
  fingerprint: acacec07
- concept: отсутствие находок — законный завершённый результат роли, а не сигнал продолжать работу
  question: Ревьюер проверил изменение и не нашёл ни одного дефекта. Почему важно, чтобы роль допускала такой исход явно? Объясни своими словами.
  explanation: Условие завершения должно покрывать все допустимые исходы роли. Иначе агент подгоняет работу под единственный признанный формат ответа.
  kind: open
  reference: Если единственным признаком завершения считается список найденных проблем, агент без находок остаётся без условия остановки и начинает либо искать дальше по кругу, либо выдумывать замечания ради результата, либо уходить в чужую роль и править код. Явный исход «проверено, проблем не обнаружено» делает пустой результат таким же законным завершением, как и список дефектов, и позволяет следующему этапу двигаться дальше.
  id: 016-role-boundaries-3
  fingerprint: 9e46d4e6
