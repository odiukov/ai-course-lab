- concept: 'граница переполнения строгая: накопленный объём, равный пределу, ещё помещается, переполнение начинается при превышении'
  question: Доступная ёмкость контекста — 250k токенов. Агент уже накопил 175k токенов. Следующий результат инструмента весит ровно 75k токенов. Что произойдёт после его добавления?
  explanation: 'Условие переполнения — строгое превышение: 175k + 75k = 250k равно пределу, значит данные ещё влезают. Первым переполняющим будет следующий шаг, добавляющий хотя бы один токен. Если писать проверку как «сумма >= предел», точка перегрузки сместится на шаг раньше настоящей.'
  kind: choice
  options:
    - 'Переполнения нет: сумма стала ровно 250k, это ещё помещается, но свободного места не осталось'
    - Переполнение произойдёт, потому что при достижении предела место всегда считается исчерпанным заранее
    - Переполнение произойдёт, потому что каждый результат инструмента округляется вверх до следующего предела
    - 'Определить нельзя: пока сумма не превысила предел вдвое, состояние контекста не определено'
  correct: 0
  id: 007-overflow-point-1
  fingerprint: 0f71f6d5
- concept: точка переполнения определяется префиксной суммой, а не сравнением каждой отдельной порции с размером окна
  question: Все порции данных, которые агент читает по очереди, по отдельности меньше контекстного окна. Объясни своими словами, почему из этого не следует, что переполнения не будет, и как тогда искать первый переполняющий шаг.
  explanation: Именно из-за накопления порции по 30k, 70k и 60k при окне 128k дают переполнение на третьем шаге, хотя ни одна из них сама по себе окно не переполняет.
  kind: open
  reference: 'Порции не заменяют друг друга, а накапливаются в одном контексте, поэтому значение имеет не размер отдельной порции, а накопленная (префиксная) сумма всех предыдущих плюс текущая. Первый переполняющий шаг — тот, на котором накопленная сумма до добавления ещё не превышала предел, а после добавления превысила. Сравнивать нужно после каждого добавления, и сравнивать с той же величиной, которую считаешь: если часть окна зарезервирована под системный промпт и будущий ответ, доступная ёмкость меньше полного размера окна.'
  id: 007-overflow-point-2
  fingerprint: bdaa6ddd
