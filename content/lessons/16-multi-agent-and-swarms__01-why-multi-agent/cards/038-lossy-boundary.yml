- concept: потери на границе агентов неустранимы, потому что отправитель не знает заранее, какая деталь понадобится получателю
  question: 'Агент A аккуратно оформил сообщение для агента B: цель, ограничения, ссылки на файлы. Почему потеря информации на этой границе всё равно останется?'
  explanation: Сжатие контекста в сообщение — выбор, что оставить. Выбор делается до того, как получатель начал работу, поэтому релевантность мелочи ещё неизвестна. Аккуратное оформление снижает потери, но не превращает выбор в знание.
  kind: choice
  options:
    - Потому что модель ограничена максимальной длиной одного ответа
    - Потому что отправитель в момент передачи не знает, какая из замеченных мелочей окажется решающей для решения получателя
    - Потому что получатель всегда работает на более слабой модели
    - Потому что текстовый формат сообщений искажает смысл при сериализации
  correct: 1
  id: 038-lossy-boundary-1
  fingerprint: '83637954'
- concept: потери накапливаются мультипликативно по цепочке границ, а не оцениваются по одной передаче
  question: Цепочка из 5 агентов, каждый передаёт результат следующему. Пусть каждая передача доносит половину значимых деталей отправителя. Какая доля деталей первого агента (в процентах) дойдёт до последнего?
  explanation: 5 агентов — 4 границы, доля равна 0.5^4 = 0.0625, то есть 6.25%. Каждая граница сжимает уже сжатое, поэтому оценивать надо длину цепочки, а не качество одной передачи.
  kind: numeric
  answer: 6.25
  tolerance: 0.2
  id: 038-lossy-boundary-2
  fingerprint: 33c8659a
- concept: 'полнота передачи и изоляция контекста — обмен: перенос всего контекста отменяет выигрыш разделения'
  question: Чтобы убрать потери, инженер решает пересылать получателю весь контекст отправителя целиком. Что при этом ломается?
  explanation: Сжатие на границе — плата за чистое окно получателя. Передав весь контекст, вы возвращаете исходную проблему объёма и шума, ради которой и делили работу. Поэтому граница настраивается по объёму передаваемого, а не отменяется.
  kind: choice
  options:
    - 'Ничего: это правильный способ устранить потери на границе'
    - Пропадает изоляция контекста — получатель снова упирается в предел окна и разбирает чужой рабочий след
    - Сообщения перестают быть самодостаточными
    - Роли агентов перестают различаться по системным промптам
  correct: 1
  id: 038-lossy-boundary-3
  fingerprint: 651b449b
