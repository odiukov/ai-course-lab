- concept: насыщение контекста зависит от накопленного объёма, смешение ролей проявляется с самого начала независимо от объёма
  question: Качество работы агента низкое. Какой признак говорит именно о насыщении контекста, а не о смешении ролей?
  explanation: 'Насыщение — количественный эффект: пока содержимого мало, всё работает, деградация появляется вместе с объёмом и бьёт по самым ранним деталям. Смешение ролей качественное: агент делает понемногу из каждой обязанности даже на маленькой задаче, где места в окне полно.'
  kind: choice
  options:
    - Качество держится на коротких задачах и падает по мере роста накопленной истории, причём теряются ранние детали
    - Агент выдаёт частичный результат сразу, даже на самой первой короткой задаче
    - Агент вызывает инструменты по очереди, а не одновременно
    - Агент отказывается завершать работу без подтверждения
