- concept: несовместимость выходов исполнителей разрешает оркестратор, потому что исполнители не связаны друг с другом и не видят чужих заданий
  question: В схеме orchestrator-worker один исполнитель переименовал поле в схеме данных, другой написал валидатор под старое имя. Оба задания выполнены корректно, вместе результаты не работают. Кто разрешает противоречие?
  explanation: 'Стрелки в этой схеме идут только от центра к исполнителям: worker A и worker B друг о друге ничего не знают и договориться не могут. Ответственность за целостность итога лежит ровно в одном месте — там же, где принимаются решения о плане и синтезе результатов.'
  kind: choice
  options:
    - 'Тот исполнитель, который сдал работу позже: его версия перекрывает предыдущую'
    - Исполнители договариваются напрямую, обменявшись своими выходами
    - 'Оркестратор: у него полная картина цели, он может уточнить задание, вернуть работу или отбросить несовместимый результат'
  correct: 2
  id: 034-central-responsibility-1
  fingerprint: a275aad5
- concept: выполнение условия завершения роли закрывает подзадачу, а право объявить задачу системы завершённой остаётся у оркестратора
  question: 'Исполнитель отчитался: его условие завершения выполнено. Почему из этого не следует, что задача системы решена?'
  explanation: 'Делегирование распределяет работу, но не размывает ответственность за итог. Поэтому при сбое не нужно распутывать взаимные договорённости агентов: проверяются решения одного центра.'
  kind: open
  reference: 'Условие завершения роли описывает только её собственную ответственность — например, «проверка прогнана, замечания выписаны». Оно ничего не говорит о совместимости этого результата с выходами других исполнителей и о том, достигнута ли исходная цель. Полную картину цели держит оркестратор: он собирает ответы, синтезирует итог и может вернуть работу на исправление, уточнить задание или отказаться от результата. Объявить «работа завершена» вправе только он.'
  id: 034-central-responsibility-2
  fingerprint: 5bb6db83
