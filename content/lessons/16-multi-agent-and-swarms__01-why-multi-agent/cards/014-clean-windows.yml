- concept: вниз по цепочке передаётся сжатый вывод (решение, ограничения, точные ссылки), а след поиска остаётся у автора
  question: 'Исследователь прочитал 90 000 токенов документации по авторизации: сравнил несколько способов входа, отбросил устаревшие примеры, наткнулся на ограничение библиотеки. Что корректно передать кодеру, а что должно остаться у исследователя? Объясни своими словами.'
  explanation: Ценность разделения не в том, что появился ещё один агент, а в том, что через границу проходит компактный вывод. Черновики не исчезают — они просто не путешествуют дальше по цепочке.
  kind: open
  reference: 'Кодеру передаётся результат: выбранный подход, обнаруженные ограничения, которые влияют на реализацию, и точные ссылки на нужные места документации. У исследователя остаётся путь поиска: отвергнутые варианты, сравнения, сырые куски документации, промежуточные рассуждения. Смысл в том, что вывод самодостаточен для следующей роли, а след процесса нужен только тому, кто его прошёл; переслав журнал целиком, мы вернём кодера к чужой работе и займём его окно материалом, который он не будет применять.'
