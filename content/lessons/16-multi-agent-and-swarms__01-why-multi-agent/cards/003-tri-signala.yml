  question: Какая из задач НЕ страдает от последовательного узкого места, то есть её части можно вести одновременно?
  explanation: Параллелить можно только то, где вход одной части не зависит от выхода другой. Шесть независимых файлов читаются одновременно; «код после исследования» или «исправления после тестов» — цепочка зависимостей, там очередь вынужденная, а не потерянная возможность.
