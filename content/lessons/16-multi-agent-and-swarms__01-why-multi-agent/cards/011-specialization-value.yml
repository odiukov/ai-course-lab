- concept: выигрыш даёт разделение обязанностей и изоляция контекста, а не увеличение числа копий модели
  question: 'Инженер запустил 6 копий одной модели, и каждой выдал одинаковый промпт: «изучи документацию, напиши код, найди ошибки, прогони тесты». Что изменится по сравнению с одним агентом с тем же промптом?'
  explanation: 'Копия модели сама по себе ничего не чинит: конфликт целей заложен в промпт, и каждая копия унаследует его целиком. Выигрыш появляется только когда у каждого экземпляра одна роль, свой чистый контекст и понятный контракт вход/выход.'
  kind: choice
  options:
    - 'Качество вырастет пропорционально числу копий: больше моделей — больше найденных дефектов'
    - 'Практически ничего не изменится по существу: каждая копия по-прежнему выбирает между четырьмя ролями, размытость обязанностей просто размножилась'
    - Качество вырастет, потому что копии автоматически поделят между собой перечисленные роли
    - Задача станет решаться быстрее, так как одинаковые промпты позволяют переиспользовать контекст между копиями
  correct: 1
  id: 011-specialization-value-1
  fingerprint: ca41c10a
- concept: 'контракт вход/выход изолирует контексты: агент получает только материал своей роли, а не всю историю работы соседей'
  question: Исследователь прочитал 80k токенов документации и отдал короткие заметки. Объясни, что даёт ревьюеру то, что эти 80k в его окно не попадают.
  explanation: 'Специализация — это не только узкий промпт, но и узкий вход: каждый агент видит результат предыдущего этапа, а не всю его черновую работу.'
  kind: open
  reference: 'Контекст ревьюера остаётся занят только тем, что нужно для его работы, — кодом и, при необходимости, спецификацией. Это даёт две вещи: во-первых, свободную ёмкость (документация не съедает окно и не приближает переполнение), во-вторых, отсутствие постороннего материала, конкурирующего за внимание, — ревьюер не отвлекается на детали API, из которых код уже собран. Контракт вход/выход и определяет, что именно передаётся дальше: результат работы исследователя, а не его сырьё.'
  id: 011-specialization-value-2
  fingerprint: 90826db0
