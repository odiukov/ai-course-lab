- concept: внутри цикла порция сначала добавляется к сумме, и только потом сумма сравнивается с лимитом
  question: Функция идёт по списку порций и должна вернуть индекс той, на которой накопленная сумма впервые превысила лимит. Расставь действия одной итерации цикла в правильном порядке.
  explanation: Если поменять местами прибавление и сравнение, цикл проверяет сумму без текущей порции и замечает переполнение на одну итерацию позже — классическая ошибка на единицу. Сравнение всегда идёт после прибавления.
  kind: order
  items:
    - Взять очередную порцию вместе с её индексом
    - Прибавить размер порции к накопленной сумме
    - Сравнить обновлённую сумму с лимитом
    - Если сумма превысила лимит — вернуть индекс этой порции и прекратить обход
  id: 008-write-first-overflow-1
  fingerprint: b29b3e99
- concept: особое возвращаемое значение сигнализирует, что переполнения не случилось ни разу
  question: Список порций закончился, а накопленная сумма ни разу не превысила лимит. Что должна вернуть функция поиска первой переполняющей порции?
  explanation: Любой числовой ответ вызывающая сторона примет за настоящий индекс переполнения. Нужен признак «такого элемента нет» — None. Возврат длины списка или нуля перепутает случай «всё поместилось» со случаем «переполнилось сразу».
  kind: choice
  options:
    - None — переполняющей порции не существует, весь материал уместился
    - Индекс последнего элемента списка
    - Длину списка как признак успеха
    - 0, потому что переполнения не было
  correct: 0
  id: 008-write-first-overflow-2
  fingerprint: ad87be1c
- concept: результат — позиция переполняющей порции, а не её размер и не свободный остаток
  question: Лимит равен 80 токенов, порции идут в порядке 18, 23, 19, 44. Какой индекс (нумерация с нуля) вернёт функция поиска первого переполнения?
  explanation: 'Суммы по ходу обхода: 18, 41, 60, 104. Лимит превышен только на четвёртой порции, её индекс — 3. Ответ — именно позиция, а не размер порции (44) и не остаток места перед ней (20).'
  kind: numeric
  answer: 3
  tolerance: 0.4
  id: 008-write-first-overflow-3
  fingerprint: ef54020f
