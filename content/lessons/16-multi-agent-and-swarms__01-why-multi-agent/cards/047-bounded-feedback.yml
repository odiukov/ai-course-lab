- concept: цикл правок не гарантирует сходимости, поэтому предел задаётся заранее, а не по факту достижения согласия
  question: Объясни своими словами, почему предел числа кругов в цикле «правка — проверка» задаётся заранее, а не устанавливается по ходу, когда станет видно, что согласие не достигается.
  explanation: Ключ — отсутствие гарантии сходимости. Правка порождает новый код, новый код порождает новые замечания; «дождаться полного согласия» — условие, момент наступления которого не определён. Заранее заданный лимит превращает открытый процесс в процесс с известной верхней границей расхода, а остаточные замечания становятся обычным сообщением по контракту, а не поводом продолжать.
  kind: open
  reference: 'Цикл не имеет гарантии сходимости: каждая правка меняет код и способна породить новое замечание, которого раньше не было, а ревьюер на новом круге может переключиться на другое место. Значит, признак «спор скоро закончится» ненаблюдаем изнутри цикла — по нему нельзя принять решение об остановке. Единственная величина, которую можно контролировать заранее, — число кругов. Она даёт жёсткую верхнюю границу на число вызовов модели, то есть на стоимость и задержку. Лимит становится частью явного условия завершения роли: цикл заканчивается либо выполнением критериев ревью, либо исчерпанием кругов, и оба исхода наступают за предсказуемое время.'
  id: 047-bounded-feedback-3
