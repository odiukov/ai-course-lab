- concept: 'стоимость ограниченного цикла кодер–ревьюер линейна по числу кругов: круг = правка плюс проверка, то есть два вызова модели'
  question: 'В цикле правок один круг состоит из двух действий: агент-кодер вносит изменения, затем агент-ревьюер проверяет результат. Лимит цикла — 5 кругов. Сколько дополнительных вызовов модели добавит цикл в худшем случае?'
  explanation: 'Каждый круг — ровно два вызова: один на правку, один на проверку. При лимите в 5 кругов верхняя граница равна 5 × 2 = 10 вызовов. Именно эта линейная зависимость и делает лимит инструментом контроля стоимости и задержки: без него верхней границы нет вовсе.'
  kind: numeric
  answer: 10
  tolerance: 0.5
  id: 047-bounded-feedback-1
  fingerprint: 5ea0f251
- concept: 'исчерпание лимита кругов — не приёмка результата: при оставшихся замечаниях цикл останавливается и передаёт их выше как отдельный исход'
  question: Цикл кодер–ревьюер исчерпал разрешённое число кругов, но ревьюер по-прежнему фиксирует существенные замечания. Что должна сделать система?
  explanation: 'У исчерпанного лимита два разных исхода: критерии выполнены — работа закрыта; замечания остались — цикл всё равно останавливается, но результат помечается как неготовый и уходит выше. Решение (менять требования, выбрать другой подход, разрешить компромисс) принимает тот, кто отвечает за задачу целиком, а не сам цикл. Продление лимита возвращает ту же неограниченность, ради устранения которой лимит и вводили.'
  kind: choice
  options:
    - 'Считать код принятым: лимит достигнут, значит работа завершена успешно'
    - Остановить цикл и передать оставшиеся замечания оркестратору или человеку для решения о дальнейших действиях
    - Продлить лимит ещё на несколько кругов, раз согласие не достигнуто
    - Откатить код к версии до первой правки и завершить работу
  correct: 1
