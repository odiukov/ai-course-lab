  fingerprint: 0d6976c2
- concept: у сообщения ровно один адресат, поэтому контексты образуют разбиение журнала без копирования
  question: В журнале 30 сообщений, у каждого один адресат. Контексты строятся для 5 ролей; 4 сообщения адресованы имени, которого нет в списке этих ролей. Сколько сообщений суммарно окажется во всех построенных контекстах?
  explanation: Каждое сообщение попадает не более чем в один контекст — то есть контексты делят журнал, а не размножают его. 30 − 4 = 26; четыре сообщения к неизвестному адресату просто никуда не попадают, и это видимый признак опечатки в имени роли.
  kind: numeric
  answer: 26
  tolerance: 0.5
