- concept: в паттерне subagents план и общая задача остаются у родителя, дети получают узкие подзадачи и возвращают отчёт о результате
  question: Агент получает запрос «собери отчёт по трём отчётным периодам», сам держит план, порождает трёх исполнителей с узкими заданиями и принимает от них отчёты. Какая это архитектура?
  explanation: 'В subagents связь иерархическая: план и сборка итога остаются наверху, вниз уходит только узкое задание, наверх — только результат. Так устроен Claude Code. В pipeline нет владельца плана, работа течёт по стадиям; в swarm нет постоянного координатора вовсе.'
  kind: choice
  options:
    - 'Subagents: родитель владеет планом, дети выполняют подзадачи и докладывают результат'
    - 'Pipeline: выход одного агента становится входом следующего'
    - 'Swarm: равноправные агенты сами разбирают работу из общего состояния'
    - 'Single agent: одна петля и один контекст на всю задачу'
  correct: 0
  id: 025-spectrum-schema-1
  fingerprint: 39e24e5b
- concept: team — параллельные явные роли, обменивающиеся адресными сообщениями через шину под координацией оркестратора, в отличие от последовательной передачи выхода в pipeline
  question: Задача требует одновременно аналитика данных, юриста и редактора; они переписываются адресными сообщениями, а сведением занимается отдельный оркестратор. Какому паттерну это соответствует?
  explanation: 'Признак team — несколько постоянных ролей, действующих одновременно, плюс обмен сообщениями и координатор. В pipeline роли тоже разные, но никогда не работают одновременно: следующая стадия стартует лишь на выходе предыдущей.'
  kind: choice
  options:
    - 'Pipeline: каждая роль преобразует вход и передаёт его дальше по цепочке'
    - 'Team: явные роли работают одновременно и общаются через шину сообщений, оркестратор координирует'
    - 'Subagents: одна роль порождает временных детей под свои подзадачи'
    - 'Single agent: одна модель по очереди примеряет три роли'
  correct: 1
