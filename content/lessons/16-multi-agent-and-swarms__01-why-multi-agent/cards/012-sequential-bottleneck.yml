- concept: при одновременном запуске задержка равна длительности самой долгой ветви, а не сумме длительностей
  question: Шесть независимых проверок занимают 9, 4, 7, 11, 5 и 8 секунд. Их запускают все одновременно. Через сколько секунд будут готовы все результаты?
  explanation: Ветви не ждут друг друга, поэтому общая задержка задаётся самой медленной — 11 секунд. Последовательный запуск дал бы сумму 44 секунды; параллельный превращает сумму в максимум.
  kind: numeric
  answer: 11
  tolerance: 0.4
  id: 012-sequential-bottleneck-1
  fingerprint: c1dc1384
- concept: параллельный запуск сокращает задержку, но не уменьшает объём полезной работы и её стоимость
  question: Шесть независимых проверок по 9 секунд перевели с очереди на одновременный запуск. Что при этом изменилось?
  explanation: 'Параллелизм переставляет работу во времени, а не отменяет её: те же 54 секунды вычислений просто выполняются одновременно. Экономится ожидание пользователя, а расход ресурсов (и стоимость вызовов модели) остаётся тем же.'
  kind: choice
  options:
    - Время до готового результата упало с 54 секунд до 9, а суммарный объём работы остался прежним — 54 секунды вычислений
    - И задержка, и суммарный объём работы уменьшились в шесть раз
    - Задержка осталась прежней, но объём работы сократился
    - Ни задержка, ни объём работы не меняются — распределение чисто формальное
  correct: 0
