- concept: 'два ориентира измеряют разные ресурсы: длину рабочего пути и объём удерживаемого материала'
  question: Почему в правиле два ориентира — по числу вызовов инструментов и по объёму данных, а не один?
  explanation: Задача может быть короткой по объёму, но требовать длинной цепочки шагов, и наоборот — один большой набор файлов при паре действий. Ресурсы разные, поэтому и проверок две.
  kind: choice
  options:
    - Это одна и та же величина, второй ориентир нужен для страховки
    - 'Они измеряют разные ограничения: длину рабочего пути одного цикла и объём материала, который надо удерживать одновременно'
    - Первый относится к стоимости, второй — к задержке
    - Первый применяется к оркестратору, второй — к исполнителям
  correct: 1
