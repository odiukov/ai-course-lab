- concept: превышение ориентира — повод искать конкретное наблюдаемое ограничение, а не достаточная причина строить мультиагентную систему
  question: Задача чуть вышла за один из ориентиров правила большого пальца. Объясни своими словами, почему этого ещё недостаточно, чтобы вводить второго агента, и что нужно проверить сначала.
  explanation: Правило отвечает на вопрос «стоит ли вообще смотреть в сторону разделения», а решение принимается по конкретной причине потолка. Иначе сложность растёт заранее и без выигрыша.
  kind: open
  reference: 'Ориентиры — эвристика проверки здравого смысла, а не порог включения архитектуры: рядом с границей поведение системы не меняется скачком. Разделение оправдывает наблюдаемое ограничение: материал перестаёт помещаться в окно и ранние детали теряются, один промпт смешивает разные режимы работы, либо независимые подзадачи вынужденно идут по очереди и растягивают время. Без такого сигнала второй агент не снимает ограничения, а добавляет передачу сообщений с потерями, лишние вызовы и логику координации как новый источник багов.'
