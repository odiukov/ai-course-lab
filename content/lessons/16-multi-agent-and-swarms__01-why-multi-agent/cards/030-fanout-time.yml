  question: В fan-out две ветви из трёх уже вернули результат. Что делает шаг слияния?
  explanation: 'Fan-in — барьер: система переходит к сборке только с полным набором результатов. Поэтому ранние ветви ничего не ускоряют, их выводы простаивают, а общее ожидание определяется последней ветвью, а не средним по ветвям.'
