  fingerprint: 59d001e8
- concept: 'критерий выбора одного агента: небольшая связная задача, которую один цикл удерживает целиком'
  question: 'Задача: поправить одну функцию и прогнать её тесты. Объясни своими словами, почему здесь разделение на несколько агентов скорее навредит.'
  explanation: Граница проходит не по «лёгкая/сложная», а по тому, сохраняет ли один цикл задачу как целое. Пока сохраняет — стоимость координации не окупается.
  kind: open
  reference: 'Задача маленькая и связная: один цикл удерживает и требование, и код, и результат тестов, ничего не вытесняется. Разделение добавило бы передачу состояния между агентами, лишние вызовы модели, задержку и риск потери деталей на стыках — то есть накладные расходы без выигрыша. Разделение оправдано, когда работа распадается на крупные части с чётким контрактом передачи результата и единый цикл перестаёт надёжно держать связность.'
  id: 001-granitsa-uroka-2
