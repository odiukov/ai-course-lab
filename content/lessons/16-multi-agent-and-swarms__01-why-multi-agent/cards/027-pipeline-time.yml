- concept: полное время последовательного pipeline не зависит от порядка стадий, поэтому перестановка стадий не ускоряет цепочку
  question: Инженер предлагает поставить самую быструю стадию первой, чтобы пользователь получил ответ раньше. Что произойдёт с полным временем pipeline?
  explanation: Полное время — сумма длительностей, а сложение не зависит от порядка слагаемых. Раньше появится лишь промежуточный результат первой стадии; финальный ответ всё равно ждёт последнюю. Сократить итог можно только ускорив или убрав стадию.
