- concept: размер контекста агента задаётся объёмом адресованных ему сообщений, а не размером общего журнала
  question: 'Общий журнал разросся до 12 000 токенов. Агенту `coder` адресованы два сообщения: 400 и 250 токенов. Сколько примерно токенов займёт его входной контекст?'
  explanation: 'Вход собирается из его почты: 400 + 250 = 650. Рост журнала до 12 000 токенов на окно кодера не влияет — за место в его окне платят только адресованные ему письма.'
  kind: numeric
  answer: 650
  tolerance: 5
  id: 020-separate-contexts-2
