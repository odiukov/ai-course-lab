- concept: 'у журнала и у контекстов разные функции: журнал даёт системе координацию, контексты дают агентам изоляцию'
  question: Зачем системе хранить общий журнал сообщений, если каждый агент всё равно видит только свою папку? Объясни своими словами.
  explanation: Две структуры для двух целей. Функция раскладки берёт общую стопку и готовит отдельную стопку каждому — исходная стопка при этом никуда не исчезает.
  kind: open
  reference: 'Журнал — единая история обмена: по нему система знает, кто кому что отправил, в каком порядке шли передачи, и может собрать итоговый результат работы, восстановить ход или отладить сбой. Контексты решают другую задачу — ограничить вход каждого агента до его обязанностей. Раскладка по получателям строится из журнала, а не вместо него: без журнала не будет координации, без раскладки не будет изоляции окон.'
  id: 020-separate-contexts-3
  fingerprint: 548c82b3
