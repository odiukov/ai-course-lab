- concept: 'swarm отличается отсутствием постоянного координатора: агенты сами берут работу из общего состояния'
  question: Чем swarm отличается от team?
  explanation: Team держится на явных ролях и координаторе, swarm — на общем состоянии и самостоятельном отборе работы. Уникальные роли и очередность — признаки team и pipeline, а не swarm.
  kind: choice
  options:
