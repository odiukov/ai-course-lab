- concept: 'правило выбора: брать простейшую архитектуру, уже снимающую ограничение, потому что движение вправо покупается координацией, а не сообразительностью'
  question: Задача перестала укладываться в одного агента из-за одной тяжёлой подзадачи чтения большого модуля. Какую архитектуру брать?
  explanation: 'Ограничение здесь одно — объём чтения, и его снимает уже ближайшая архитектура справа. Более правая архитектура не «умнее»: она добавляет передачи, общее состояние и новые места для ошибки без нужды.'
  kind: choice
  options:
    - Субагента под эту подзадачу, оставив план у родителя
    - 'Сразу team с оркестратором и шиной сообщений: запас координации не помешает'
    - Swarm с общим состоянием, чтобы задача решалась быстрее всего
    - Тот же один агент, но с более сильной моделью и более длинным промптом
