- concept: логика координации — кто что делает, когда и в каком порядке — сама является отдельным источником багов, независимым от качества агентов
  question: Какое утверждение про мультиагентную систему верно?
  explanation: 'Разделение работы добавляет новый слой — маршрутизацию и порядок. У этого слоя свои дефекты: сообщение ушло не тому, стадия стартовала до готовности входов, ответ не дождались. Качество агентов от них не защищает.'
  kind: choice
  options:
    - Баг может целиком лежать в логике координации — неверный адресат, порядок или момент запуска, — при исправно работающих агентах
    - Если все агенты решают свои подзадачи верно, система по построению не может ошибиться
    - Логика координации — это код, а код не бывает источником ошибок в отличие от модели
    - Ошибки координации проявляются только при параллельном запуске
