- concept: число агентов задаёт нижнюю границу числа последовательных вызовов модели, а переговоры увеличивают её сверх этого минимума
  question: Система разбита на 6 агентов. Что можно сказать о количестве последовательных вызовов модели?
  explanation: Каждому агенту нужен хотя бы один вызов, отсюда нижняя граница. Если агенты переговариваются — уточняют задание, отвечают на замечания, — фактическое число вызовов и задержка растут выше этой границы.
  kind: choice
  options:
    - Их минимум шесть, и каждое уточнение или ответ на замечание добавляет вызовы сверх этого минимума
    - 'Ровно шесть: по одному на агента, переговоры вызовов не требуют'
    - Меньше шести, потому что часть агентов обрабатывается в одном вызове
    - Число вызовов не зависит от числа агентов, оно определяется только объёмом данных
