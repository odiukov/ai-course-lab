- concept: 'fan-out и orchestrator различаются моментом, когда определяется состав поручений: до старта или по промежуточным результатам'
  question: В обоих случаях работу выполняют несколько исполнителей. В первом набор подзадач известен ещё до запуска и подзадачи не зависят друг от друга. Во втором понять, кого звать дальше, можно только после промежуточных результатов. Что это различие означает для выбора топологии?
  explanation: 'Fan-out требует, чтобы весь набор ветвей был известен на старте — иначе нечего запускать одновременно. Если набор поручений выясняется по ходу, кто-то должен смотреть на промежуточные результаты и решать следующий шаг; это и есть работа оркестратора. Число исполнителей ничего не различает: оно одинаково больше единицы в обоих случаях.'
  kind: choice
  options:
    - 'Первый случай — fan-out, второй — orchestrator: различает момент, когда определяется состав поручений'
    - Оба случая — fan-out, разница только в числе исполнителей
    - 'Первый случай — orchestrator, второй — pipeline: во втором стадии идут по очереди'
    - Оба случая требуют swarm, потому что исполнителей больше одного
  correct: 0
  id: 043-topology-decision-1
  fingerprint: 70e4a002
- concept: топология выводится из структуры зависимостей между подзадачами, а не из числа доступных агентов или объёма работы
  question: Объясни своими словами, какие свойства самой задачи определяют выбор топологии и почему количество доступных агентов таким свойством не является.
  explanation: Топология — это описание потока данных и зависимостей между ролями. Ресурсы (сколько исполнителей доступно, сколько денег на вызовы) влияют на то, потянешь ли ты схему, но не на то, какая схема выражает задачу.
  kind: open
  reference: 'Выбор определяется структурой зависимостей: нужно ли вообще делить работу; связаны ли части так, что выход одной является входом следующей (последовательные стадии); можно ли выполнять части независимо и слить результаты; известен ли состав подзадач заранее или определяется по промежуточным результатам; требуется ли прямая координация равноправных участников без единого центра решений. Количество доступных агентов — это ресурс, а не устройство задачи: пять доступных исполнителей не делают зависимые стадии независимыми и не превращают конвейер в параллельную схему. Свободные исполнители при зависимых стадиях просто ждут.'
  id: 043-topology-decision-2
  fingerprint: 0c754b7f
