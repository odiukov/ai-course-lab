<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матрица выбора формата по среде запуска</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f8fafc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #64748b;
    --grid: #cbd5e1;
    --hardware: #e0f2fe;
    --engine: #ede9fe;
    --scenario: #fef3c7;
    --best-bg: #dcfce7;
    --best-ink: #166534;
    --good-bg: #e0f2fe;
    --good-ink: #075985;
    --off-bg: #f8fafc;
    --off-ink: #94a3b8;
    --row-alt: #f8fafc;
    --border: #94a3b8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0b1120;
      --panel: #111827;
      --ink: #e5e7eb;
      --muted: #9ca3af;
      --grid: #334155;
      --hardware: #0c4a6e;
      --engine: #4c1d95;
      --scenario: #78350f;
      --best-bg: #14532d;
      --best-ink: #bbf7d0;
      --good-bg: #164e63;
      --good-ink: #bae6fd;
      --off-bg: #111827;
      --off-ink: #64748b;
      --row-alt: #172033;
      --border: #475569;
    }
  }

  html,
  body {
    margin: 0;
    background: var(--page);
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  figure {
    box-sizing: border-box;
    width: 100%;
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--ink);
  }

  figcaption {
    padding: 10px 14px;
    border-bottom: 1px solid var(--grid);
    background: var(--panel);
  }

  .title {
    display: block;
    font-size: 18px;
    font-weight: bold;
  }

  .subtitle {
    display: block;
    padding-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--panel);
  }

  .frame {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1px;
  }

  .corner {
    fill: var(--row-alt);
  }

  .band-hardware {
    fill: var(--hardware);
  }

  .band-engine {
    fill: var(--engine);
  }

  .band-scenario {
    fill: var(--scenario);
  }

  .header-cell,
  .row-cell {
    fill: var(--panel);
  }

  .row-cell.alt {
    fill: var(--row-alt);
  }

  .cell.best {
    fill: var(--best-bg);
  }

  .cell.good {
    fill: var(--good-bg);
  }

  .cell.off {
    fill: var(--off-bg);
  }

  .grid {
    stroke: var(--grid);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .major-grid {
    stroke: var(--border);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .band-label {
    fill: var(--ink);
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
  }

  .corner-title {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
    text-anchor: start;
  }

  .corner-note {
    fill: var(--muted);
    font-size: 11px;
    text-anchor: start;
  }

  .column-label {
    fill: var(--ink);
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
  }

  .row-title {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
    text-anchor: start;
  }

  .row-detail {
    fill: var(--muted);
    font-size: 11px;
    text-anchor: start;
  }

  .mark {
    font-size: 18px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: central;
  }

  .mark.best {
    fill: var(--best-ink);
  }

  .mark.good {
    fill: var(--good-ink);
  }

  .mark.off {
    fill: var(--off-ink);
  }

  .legend-label {
    fill: var(--ink);
    font-size: 12px;
    text-anchor: start;
    dominant-baseline: central;
  }

  .legend-mark {
    font-size: 14px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: central;
  }

  .legend-mark.best {
    fill: var(--best-ink);
  }

  .legend-mark.good {
    fill: var(--good-ink);
  }

  .legend-mark.off {
    fill: var(--off-ink);
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
    text-anchor: middle;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">
    <span class="title">Матрица выбора формата по среде запуска</span>
    <span class="subtitle">Выберите столбец среды и оставьте форматы с зелёной точкой или голубой галочкой.</span>
  </figcaption>

  <svg id="matrix" width="1000" height="430" viewBox="0 0 1000 430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      Сравнение GGUF, GPTQ, AWQ, FP8, MXFP4 и NVFP4 по железу,
      движкам и сценарию с большим количеством LoRA.
    </desc>
  </svg>
</figure>

<script>
const [
  origin,
  scale,
  frame,
  layout,
  bands,
  columns,
  rows,
  legend,
  fallback
] = [
  { x: 18, y: 14 },
  1,
  { left: 0, top: 0, right: 964, bottom: 400 },
  {
    rowLabelRight: 224,
    bandBottom: 28,
    headerBottom: 98,
    bodyBottom: 350,
    legendTop: 362,
    legendBottom: 400,
    rowHalf: 21,
    rowTextX: 14,
    rowTitleOffset: -4,
    rowDetailOffset: 13,
    cornerTitleY: 59,
    cornerNoteY: 78,
    bandLabelY: 18,
    legendBoxHalf: 9,
    legendTextGap: 15
  },
  [
    {
      label: "ЖЕЛЕЗО",
      left: 224,
      right: 539,
      center: 381.5,
      className: "band-hardware"
    },
    {
      label: "ДВИЖОК",
      left: 539,
      right: 854,
      center: 696.5,
      className: "band-engine"
    },
    {
      label: "СЦЕНАРИЙ",
      left: 854,
      right: 964,
      center: 909,
      className: "band-scenario"
    }
  ],
  [
    {
      left: 224,
      right: 329,
      center: 276.5,
      lines: [
        { text: "CPU", y: 68 }
      ]
    },
    {
      left: 329,
      right: 434,
      center: 381.5,
      lines: [
        { text: "Hopper /", y: 61 },
        { text: "Ada", y: 78 }
      ]
    },
    {
      left: 434,
      right: 539,
      center: 486.5,
      lines: [
        { text: "Blackwell", y: 68 }
      ]
    },
    {
      left: 539,
      right: 644,
      center: 591.5,
      lines: [
        { text: "vLLM", y: 68 }
      ]
    },
    {
      left: 644,
      right: 749,
      center: 696.5,
      lines: [
        { text: "TRT-LLM", y: 68 }
      ]
    },
    {
      left: 749,
      right: 854,
      center: 801.5,
      lines: [
        { text: "llama.cpp", y: 68 }
      ]
    },
    {
      left: 854,
      right: 964,
      center: 909,
      lines: [
        { text: "много", y: 61 },
        { text: "LoRA", y: 78 }
      ]
    }
  ],
  [
    {
      title: "GGUF",
      detail: "Q4_K_M / Q5_K_M · 4–5 бит",
      y: 119,
      alternate: false,
      cells: ["best", "off", "off", "off", "off", "best", "off"]
    },
    {
      title: "GPTQ",
      detail: "4–8 бит",
      y: 161,
      alternate: true,
      cells: ["off", "off", "off", "good", "off", "off", "best"]
    },
    {
      title: "AWQ",
      detail: "4 бита",
      y: 203,
      alternate: false,
      cells: ["off", "off", "off", "best", "off", "off", "off"]
    },
    {
      title: "FP8",
      detail: "8 бит",
      y: 245,
      alternate: true,
      cells: ["off", "best", "good", "good", "good", "off", "off"]
    },
    {
      title: "MXFP4",
      detail: "4 бита",
      y: 287,
      alternate: false,
      cells: ["off", "off", "best", "off", "best", "off", "off"]
    },
    {
      title: "NVFP4",
      detail: "4 бита",
      y: 329,
      alternate: true,
      cells: ["off", "off", "best", "off", "best", "off", "off"]
    }
  ],
  [
    {
      status: "best",
      glyph: "●",
      label: "первый кандидат",
      boxCenter: 246,
      textX: 268,
      y: 381
    },
    {
      status: "good",
      glyph: "✓",
      label: "подходит",
      boxCenter: 493,
      textX: 515,
      y: 381
    },
    {
      status: "off",
      glyph: "—",
      label: "не целевая связка шага",
      boxCenter: 704,
      textX: 726,
      y: 381
    }
  ],
  {
    x: 482,
    y: 205,
    text: "Матрица должна была показать совместимость форматов со средой запуска."
  }
];

const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

const svg = document.getElementById("matrix");
const namespace = "http://www.w3.org/2000/svg";

function element(name, attributes, text) {
  const node = document.createElementNS(namespace, name);
  Object.entries(attributes).forEach(([key, value]) => {
    node.setAttribute(key, value);
  });
  if (text !== undefined) node.textContent = text;
  return node;
}

function rectangle(left, top, right, bottom, className) {
  return element("rect", {
    x: sx(left),
    y: sy(top),
    width: sx(right) - sx(left),
    height: sy(bottom) - sy(top),
    class: className
  });
}

function line(xStart, yStart, xEnd, yEnd, className) {
  return element("line", {
    x1: sx(xStart),
    y1: sy(yStart),
    x2: sx(xEnd),
    y2: sy(yEnd),
    class: className
  });
}

function label(x, y, text, className) {
  return element("text", {
    x: sx(x),
    y: sy(y),
    class: className
  }, text);
}

try {
  const content = element("g", { "aria-hidden": "true" });

  content.appendChild(
    rectangle(frame.left, frame.top, frame.right, frame.bottom, "frame")
  );

  content.appendChild(
    rectangle(
      frame.left,
      frame.top,
      layout.rowLabelRight,
      layout.headerBottom,
      "corner"
    )
  );

  bands.forEach(band => {
    content.appendChild(
      rectangle(
        band.left,
        frame.top,
        band.right,
        layout.bandBottom,
        band.className
      )
    );
    content.appendChild(
      label(
        band.center,
        layout.bandLabelY,
        band.label,
        "band-label"
      )
    );
  });

  content.appendChild(
    label(
      layout.rowTextX,
      layout.cornerTitleY,
      "Формат",
      "corner-title"
    )
  );

  content.appendChild(
    label(
      layout.rowTextX,
      layout.cornerNoteY,
      "точка старта → столбец среды",
      "corner-note"
    )
  );

  columns.forEach(column => {
    content.appendChild(
      rectangle(
        column.left,
        layout.bandBottom,
        column.right,
        layout.headerBottom,
        "header-cell"
      )
    );

    column.lines.forEach(columnLine => {
      content.appendChild(
        label(
          column.center,
          columnLine.y,
          columnLine.text,
          "column-label"
        )
      );
    });
  });

  rows.forEach(row => {
    const rowClass = row.alternate ? "row-cell alt" : "row-cell";

    content.appendChild(
      rectangle(
        frame.left,
        row.y - layout.rowHalf,
        layout.rowLabelRight,
        row.y + layout.rowHalf,
        rowClass
      )
    );

    content.appendChild(
      label(
        layout.rowTextX,
        row.y + layout.rowTitleOffset,
        row.title,
        "row-title"
      )
    );

    content.appendChild(
      label(
        layout.rowTextX,
        row.y + layout.rowDetailOffset,
        row.detail,
        "row-detail"
      )
    );

    row.cells.forEach((status, columnPosition) => {
      const column = columns[columnPosition];
      const glyph = status === "best" ? "●" : status === "good" ? "✓" : "—";

      content.appendChild(
        rectangle(
          column.left,
          row.y - layout.rowHalf,
          column.right,
          row.y + layout.rowHalf,
          "cell " + status
        )
      );

      content.appendChild(
        label(
          column.center,
          row.y,
          glyph,
          "mark " + status
        )
      );
    });
  });

  content.appendChild(
    line(
      layout.rowLabelRight,
      frame.top,
      layout.rowLabelRight,
      layout.bodyBottom,
      "major-grid"
    )
  );

  columns.forEach(column => {
    content.appendChild(
      line(
        column.left,
        layout.bandBottom,
        column.left,
        layout.bodyBottom,
        "grid"
      )
    );
  });

  content.appendChild(
    line(
      frame.right,
      layout.bandBottom,
      frame.right,
      layout.bodyBottom,
      "grid"
    )
  );

  content.appendChild(
    line(
      frame.left,
      layout.bandBottom,
      frame.right,
      layout.bandBottom,
      "major-grid"
    )
  );

  content.appendChild(
    line(
      frame.left,
      layout.headerBottom,
      frame.right,
      layout.headerBottom,
      "major-grid"
    )
  );

  rows.forEach(row => {
    content.appendChild(
      line(
        frame.left,
        row.y + layout.rowHalf,
        frame.right,
        row.y + layout.rowHalf,
        "grid"
      )
    );
  });

  content.appendChild(
    line(
      frame.left,
      layout.legendTop,
      frame.right,
      layout.legendTop,
      "major-grid"
    )
  );

  legend.forEach(item => {
    content.appendChild(
      rectangle(
        item.boxCenter - layout.legendBoxHalf,
        item.y - layout.legendBoxHalf,
        item.boxCenter + layout.legendBoxHalf,
        item.y + layout.legendBoxHalf,
        "cell " + item.status
      )
    );

    content.appendChild(
      label(
        item.boxCenter,
        item.y,
        item.glyph,
        "legend-mark " + item.status
      )
    );

    content.appendChild(
      label(
        item.textX,
        item.y,
        item.label,
        "legend-label"
      )
    );
  });

  svg.appendChild(content);
} catch (error) {
  while (svg.lastChild) svg.removeChild(svg.lastChild);
  svg.appendChild(
    label(
      fallback.x,
      fallback.y,
      fallback.text,
      "fallback"
    )
  );
}
</script>
</body>
</html>
