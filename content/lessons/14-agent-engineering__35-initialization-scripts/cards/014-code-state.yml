- concept: путь и предел передаются пробе параметрами, что делает её проверяемой на подставных данных
  question: Почему проба свежести принимает путь к файлу и максимальный возраст аргументами, а не берёт их из констант внутри тела?
  explanation: 'Зашитые внутрь путь и предел привязывают пробу к одной конкретной машине: проверить её поведение на границе и на отсутствующем файле можно только порчей реального окружения.'
  kind: choice
