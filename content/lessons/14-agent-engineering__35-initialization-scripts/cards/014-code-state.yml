- concept: отсутствие файла состояния решается до любых вычислений возраста, а не после
  question: Расставь шаги пробы свежести состояния в правильном порядке.
  explanation: 'Время изменения читается только у существующего файла: попытка вычислить возраст до проверки существования даёт исключение вместо внятного вердикта. Оба исхода при этом возвращаются в одной форме (name, status, detail).'
  kind: order
  items:
    - Получить путь к файлу состояния и допустимый возраст как параметры
    - Проверить существование файла; если его нет — вернуть block с указанием проверенного пути
    - Прочитать время последнего изменения существующего файла
    - Вычислить возраст как разницу текущего времени и времени изменения
    - Сравнить возраст с допустимым пределом и вернуть block при превышении, иначе pass
  id: 014-code-state-1
  fingerprint: a93028fd
- concept: 'граница допустимого возраста включающая: возраст, равный пределу, ещё проходит'
  question: Допустимый возраст состояния — 72 часа. Файл изменён ровно 72 часа назад. Какой статус вернёт корректная проба?
  explanation: 'Граница фиксируется заранее и одинаково трактуется всеми запусками: превышением считается возраст больше предела. Иначе один и тот же файл получает разные вердикты у разных реализаций.'
  kind: choice
  options:
    - 'pass: предел включающий, block даёт только возраст строго больше предела'
    - 'block: предел достигнут, значит превышен'
    - 'warn: граничный случай не относится ни к одному исходу'
    - pass или block — зависит от того, как реализована проба
