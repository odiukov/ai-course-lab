- concept: проверять надо фактическую версию запущенного интерпретатора, а не заявленную в документации или конфигурации
  question: Проект требует Python 3.13. В конфигурации проекта записано именно это значение. Что должна делать проба рантайма?
  explanation: Запись в конфигурации — это заявление о требовании, а не показание прибора. Терминал может вызывать Python 3.9 при любой записи в файлах, и тогда несовпадение всплывёт позже как странное поведение тестов. Проба обязана измерять реальность.
  kind: choice
  options:
    - Прочитать значение из конфигурации и сверить его с документацией проекта
    - Убедиться, что интерпретатор вообще установлен и доступен
    - Получить версию фактически запущенного интерпретатора и сравнить её с требованием
  correct: 2
  id: 006-runtime-probe-1
  fingerprint: '28314201'
- concept: правило сравнения версий (точное совпадение или нижняя граница) должно быть зафиксировано заранее — оно меняет вердикт
  question: Требование записано как «не ниже 3.9». Запущен Python 3.13. Какой вердикт даёт проба и почему это важно фиксировать заранее?
  explanation: Один и тот же интерпретатор проходит требование «не ниже 3.9» и не проходит «ровно 3.9». Если правило не зафиксировано в скрипте, толкование выбирается по ходу дела — и проба перестаёт быть воспроизводимой.
  kind: choice
  options:
    - 'Провал: версия отличается от указанной в требовании'
    - 'Успех: правило задаёт нижнюю границу, а при правиле «ровно 3.9» тот же интерпретатор дал бы провал'
    - 'Вердикт неопределён: пробе следует спросить человека'
  correct: 1
  id: 006-runtime-probe-2
  fingerprint: 43cec7d0
