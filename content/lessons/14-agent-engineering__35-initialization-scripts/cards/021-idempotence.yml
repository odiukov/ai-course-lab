- concept: 'init наблюдает стенд, но не изменяет его: проба с побочным эффектом ломает идемпотентность'
  question: Проба окружения при отсутствии каталога `.cache` создаёт его и возвращает pass. Первый прогон меняет содержимое отчёта, второй — уже нет. Что здесь неверно?
  explanation: 'Идемпотентность — это неизменность результата при повторе на тех же входах. Проба, чинящая мир, сама создаёт различие между первым и последующими прогонами: линейка меняет рост. В CI и хуках такому скрипту доверять нельзя, потому что он не измеряет, а редактирует стенд.'
  kind: choice
  options:
    - Проба изменяет проверяемый стенд, поэтому результат зависит от того, какой это по счёту прогон, а не только от состояния проекта
    - 'Ничего: расхождение исчезло на втором прогоне, значит идемпотентность соблюдена'
    - 'Ошибка только в статусе: создание каталога должно давать warn вместо pass'
    - Проба обязана создавать каталог каждый раз заново, тогда прогоны сравняются
  correct: 0
  id: 021-idempotence-1
  fingerprint: f7f421be
- concept: нестабильные поля в отчёте лишают сравнение двух прогонов диагностической ценности
  question: В отчёт init на каждом запуске пишется случайный `run_id`. Почему это мешает проверять сам скрипт?
  explanation: 'Проверка идемпотентности строится на diff двух отчётов подряд: допустимо ровно одно отличие — свежая отметка времени, отвечающая на вопрос «когда проверяли». Любое другое нестабильное поле делает разницу постоянной, и сигнал «стенд изменился» тонет в шуме.'
  kind: choice
  options:
    - 'Сравнение двух подряд идущих отчётов перестаёт отделять реальное изменение стенда от шума: разница есть всегда'
    - Случайный идентификатор увеличивает размер отчёта и замедляет пробы
    - CI не умеет читать JSON со случайными строками
    - Идентификатор мешает вычислить отпечаток зависимостей
  correct: 0
  id: 021-idempotence-2
  fingerprint: ceb1a21e
