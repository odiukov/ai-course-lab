- concept: проба команды тестов проверяет разрешимость команды, а не зелёность самих тестов
  question: Каноническая команда тестов задана и запускается, но часть тестов падает. Какой статус должна вернуть init-проба команды тестов?
  explanation: 'Две разные поломки: «непонятно, чем проверять» — сломан workbench; «проверили и нашли проблему» — измерительный прибор исправен и сделал свою работу. Init отвечает за первое. Если блокировать старт из-за красных тестов, агента нельзя будет позвать чинить именно эти тесты.'
  kind: choice
  options:
    - 'Успешный: способ проверки существует и работает, а красные тесты — это найденный дефект проекта'
    - 'Блокирующий: пока тесты красные, стенд считается неисправным'
    - Блокирующий, но только если упало больше половины тестов
    - Успешный, но лишь после того как проба сама починит упавшие тесты
  correct: 0
  id: 010-test-command-1
  fingerprint: b8f3330c
- concept: наличия тестовых файлов недостаточно — нужен один заранее выбранный воспроизводимый способ запуска
  question: В репозитории есть папка тестов, файл сборки и файл конфигурации проекта. Почему этого мало и требуется одна каноническая команда тестов?
  explanation: Агенту нужен воспроизводимый ответ на вопрос «как здесь проверяют изменения». Пока способов несколько и выбор делается наугад, два прогона одного и того же кода могут дать разные вердикты, и ни одному из них нельзя верить.
  kind: choice
  options:
    - 'Разные способы запуска дают разный результат: один охватит не все тесты, другой упадёт из-за неверной рабочей папки — угаданный запуск невоспроизводим'
    - Потому что тестовые файлы могут устареть, а команда обновляется автоматически
    - Потому что без единой команды тесты нельзя записать в отчёт в формате JSON
    - Потому что запуск тестов из папки всегда медленнее, чем через команду
  correct: 0
  id: 010-test-command-2
  fingerprint: 28c82421
- concept: без известной команды тестов утверждение агента «ничего не сломал» непроверяемо
  question: Что именно теряет агент, если у стенда нет известной команды тестов?
  explanation: Способность менять код и способность доказать корректность изменения — разные вещи. Именно вторую даёт каноническая команда тестов, и её отсутствие делает стенд непригодным для автономной работы.
  kind: open
  reference: 'Он по-прежнему может внести изменение, но не может его подтвердить: у него нет действия, которое отличает рабочий код от сломанного. Требование «проверь свою работу» остаётся пожеланием, а любой отчёт об успехе — недоказуемым утверждением. Команда тестов превращает это требование в конкретный запуск с наблюдаемым исходом.'
  id: 010-test-command-3
  fingerprint: 5c701cc8
