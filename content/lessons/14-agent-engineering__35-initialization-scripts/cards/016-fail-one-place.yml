- concept: предупреждения фиксируются в том же отчёте, что и блокирующие провалы, но в решении о допуске не участвуют
  question: 'Прогон init: две пробы дали предупреждение, блокирующих провалов нет. Что попадает в init_report.json и каким будет решение о допуске?'
  explanation: 'Отчёт — единственная точка, где видно состояние стенда целиком, поэтому в него идут результаты всех проб. Но вердикт о допуске выносят только блокирующие уровни: иначе любое замечание об удобстве останавливало бы работу.'
  kind: choice
  options:
    - Предупреждения записываются в тот же отчёт наравне с остальными пробами, но вход не закрывают — старт разрешён
    - Предупреждения в отчёт не пишутся, раз старт всё равно разрешён
    - Любое предупреждение закрывает вход наравне с блокирующим провалом
    - Предупреждения пишутся в отдельный файл, и именно он определяет допуск
