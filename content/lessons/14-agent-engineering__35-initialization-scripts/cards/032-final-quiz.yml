- concept: 'пробы независимы друг от друга: вердикт одной не должен зависеть от результата ранее выполненной'
  question: Проба зависимостей написана так, что возвращает «пройдено» без реальной проверки, если раньше в прогоне провалилась проба рантайма. Чем это плохо?
  explanation: 'Проба — детерминированная функция от состояния стенда, возвращающая (name, status, detail). Связка между пробами делает отчёт зависимым от истории прогона: одну пробу нельзя проверить в изоляции на подставных данных, а сравнение двух прогонов теряет смысл.'
  kind: choice
  options:
    - 'Вердикт пробы перестаёт быть функцией только наблюдаемого состояния стенда: её нельзя запустить отдельно, а два прогона в разном составе дают разные отчёты'
    - Это удлиняет прогон, потому что состояние приходится хранить между пробами
    - Это нарушает требование записывать отчёт до завершения процесса
    - 'Ничего плохого: пропуск лишней работы после провала — правильная оптимизация'
