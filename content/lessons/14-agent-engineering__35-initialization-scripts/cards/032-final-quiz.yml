- concept: 'цена бутстрапа структурна: она возникает из того, что сессия начинается без знания о среде, и снимается переносом знания в детерминированный скрипт, а не более сообразительным агентом'
  question: Объясни своими словами, почему цену бутстрапа нельзя устранить, взяв более сильную модель, и что её реально убирает.
  explanation: Цена бутстрапа масштабируется с числом сессий, а не с качеством модели. Лечение — детерминированное измерение вместо повторного вывода.
  kind: open
  reference: 'Расход возникает не от слабости модели, а от устройства сессии: каждая новая сессия начинается без знания о стенде, поэтому агент заново выясняет версию рантайма, состав репозитория, команду тестов — и платит за это токенами и временем при каждом старте. Более сильная модель выясняет то же самое, просто увереннее. Убирает расход перенос этого знания из рассуждений в детерминированный скрипт: пробы выясняют факты один раз за прогон, дешёвыми локальными проверками, и оставляют результат в виде артефакта, который не надо переоткрывать.'
