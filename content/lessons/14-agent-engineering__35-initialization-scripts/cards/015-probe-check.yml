- concept: понижение блокирующего сбоя до предупреждения ради зелёного старта переносит цену отказа в середину сессии
  question: Почему нельзя понизить известный блокирующий сбой до предупреждения только ради того, чтобы init завершился успешно?
  explanation: Init существует ровно для того, чтобы отказываться стартовать на сломанном стенде. Понижение уровня ради зелёного результата отменяет его единственную функцию.
  kind: open
  reference: 'Уровень пробы не оценка неприятности, а решение о допуске: можно ли после этого сбоя честно передать workbench агенту. Понижение уровня не восстанавливает утраченную гарантию — оно лишь прячет её отсутствие. Дефект никуда не девается и проявится в середине сессии, где будет неотличим от дефекта кода, а ремонт обойдётся во всю потраченную работу. Плюс отчёт перестаёт быть основанием для решения: зелёный старт больше не означает исправный стенд.'
  id: 015-probe-check-2
  fingerprint: 0c95ffcc
