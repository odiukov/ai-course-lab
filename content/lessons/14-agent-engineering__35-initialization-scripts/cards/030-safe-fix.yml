- concept: 'автоисправление разрешено классу зависимостей, который не меняет поставляемый продукт: dev — да, runtime — только с одобрением человека'
  question: '`init --fix` обнаружил, что не установлены линтер и библиотека, которую импортирует само приложение. Что скрипт вправе доустановить сам?'
  explanation: 'Линтер, форматтер, тестовый раннер обслуживают работу разработчика и не попадают к пользователю — их установка обратима и безобидна. Runtime-зависимость загружается работающим приложением: её появление или смена версии влияет на исполняемый продукт, совместимость и содержимое поставки. --fix значит «выполнять только заранее разрешённый класс изменений», а не «чинить всё найденное».'
  kind: choice
  options:
    - Оба пакета — флаг --fix ровно для этого и добавлен
    - 'Только линтер: runtime-зависимость меняет поведение и поставку продукта, поэтому требует явного одобрения'
    - 'Только библиотеку приложения: без неё стенд неработоспособен, а линтер терпит'
    - 'Ничего: --fix лишь печатает команды, которые человек выполняет руками'
  correct: 1
  id: 030-safe-fix-1
  fingerprint: d73d134c
- concept: класс зависимости берётся из явного объявления проекта, а не выводится по имени или репутации пакета
  question: Объясните своими словами, почему --fix обязан определять класс зависимости по объявлению в файле зависимостей проекта, а не по имени пакета.
  explanation: Граница между «можно чинить молча» и «нужно одобрение» — вопрос безопасности, поэтому она обязана опираться на объявленный факт, а не на угадывание. Проект уже разделил зависимости на классы; задача --fix — прочитать это разделение, а не воссоздать его.
  kind: open
  reference: 'Имя ничего не доказывает: пакет с «test» или «lint» в названии может быть импортирован рабочим кодом, а безобидно названная библиотека — оказаться runtime-зависимостью. Догадка по имени превращает границу автоисправления в эвристику, которая рано или поздно ошибётся в сторону изменения продукта. Явные разделы файла зависимостей — единственный источник, который проект сам и объявил; по нему решение воспроизводимо, проверяемо и меняется вместе с проектом, а не с фантазией скрипта.'
  id: 030-safe-fix-2
  fingerprint: 3de336f5
- concept: 'при запрете на автоисправление init всё равно выдаёт максимум пользы: блокирующий статус, имя пакета и предложенную команду, но не выполняет её'
  question: Не хватает runtime-зависимости, автоматическая установка для этого класса запрещена. Как должен повести себя init?
  explanation: 'Запрет касается действия, а не наблюдения: вердикт и диагностика остаются полными. Человек получает имя пакета и готовую команду — ремонт занимает минуту, а решение о правке продукта остаётся за ним. Установка «задним числом с одобрением» бессмысленна: изменение уже произошло.'
  kind: choice
  options:
    - 'Промолчать: раз чинить нельзя, сообщать не о чем'
    - Поставить блокирующий статус, назвать отсутствующий пакет и предложить команду установки, но не выполнять её
    - Установить пакет и пометить изменение как требующее последующего одобрения
    - Понизить результат до предупреждения, чтобы не мешать старту сессии
  correct: 1
  id: 030-safe-fix-3
  fingerprint: 75e591db
