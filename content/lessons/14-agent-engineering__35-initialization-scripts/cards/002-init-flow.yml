- concept: 'порядок запуска: init выполняется целиком до передачи управления агенту, и допуск решается по итогам проб'
  question: Расставь этапы запуска агентной сессии с init-скриптом в правильном порядке.
  explanation: 'Init — не часть работы над задачей, а предшествующая ей фаза. Пробы дают отчёт, отчёт даёт вердикт, вердикт открывает или закрывает вход в agent loop. Если этапы перемешать (агент стартует параллельно пробам), проверка теряет смысл: правки уже пошли.'
  kind: order
  items:
    - Старт сессии передаёт управление init-скрипту
    - 'Скрипт выполняет пробы среды: рантайм, зависимости, пути, переменные окружения, тесты'
    - Результаты проб записываются в машиночитаемый отчёт
    - По отчёту принимается решение healthy / unhealthy
    - При healthy управление передаётся в цикл работы агента
  id: 002-init-flow-1
  fingerprint: 99175cdd
- concept: результат проб — машиночитаемый артефакт для следующей сессии, а не поток сообщений в консоли
  question: Почему init-скрипт записывает результаты проб в файл отчёта, а не ограничивается печатью в консоль?
  explanation: 'Консольный вывод адресован человеку и исчезает вместе с сессией. Файл-отчёт переживает сессию: по нему принимается вердикт healthy/unhealthy, и из него агент берёт готовые факты об окружении вместо собственного расследования.'
  kind: choice
  options:
    - Печать в консоль работает медленнее записи на диск
    - Отчёт — данные, которые читают и логика допуска, и агент в новой сессии, не повторяя проверок
    - Консоль не поддерживает вывод статусов проверок
  correct: 1
  id: 002-init-flow-2
  fingerprint: 6651fad8
