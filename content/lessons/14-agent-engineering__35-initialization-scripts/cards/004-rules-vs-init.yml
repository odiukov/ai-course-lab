- concept: правило задаёт требуемое условие, init превращает его в наблюдаемый факт
  question: В репозитории записано стартовое правило «работать только на среде, где запускаются тесты». Что добавляет к этому init-скрипт?
  explanation: Правило описывает условие допустимости, но само ничего не наблюдает. Init берёт это условие, выполняет конкретную пробу (какая команда тестов, разрешима ли она) и оставляет проверяемый результат. Требование остаётся тем же — появляется свидетельство.
  kind: choice
  options:
    - Он делает правило строже, запрещая больше действий, чем сформулировано
    - 'Он заменяет правило: при наличии проверки формулировать требование не нужно'
    - Он выполняет проверку и даёт воспроизводимый результат — выполнено требование или нет
  correct: 2
  id: 004-rules-vs-init-1
  fingerprint: 2423b7a0
- concept: правило без проверки — пожелание, проверка без правила — измерение не того, что важно
  question: 'Объясни, что ломается в двух случаях: правила старта есть, но init-скрипта нет; init-скрипт есть, но стартовых правил нет.'
  explanation: 'Роли не взаимозаменяемы: правило задаёт вопрос, init приносит ответ. Отсутствие любой из половин даёт либо пожелание без контроля, либо отполированный провал.'
  kind: open
  reference: 'Правила без init остаются советом «будь осторожен»: каждый агент трактует условие по-своему, и разные сессии дают разные ответы об одной и той же среде. Ничто не мешает начать работу на нездоровом стенде. Init без правил — аккуратно выполненные пробы не того: скрипт может безупречно измерять величины, которые не определяют допустимость работы, и выдать зелёный статус там, где важное условие никем не сформулировано и потому не проверяется.'
  id: 004-rules-vs-init-2
  fingerprint: f32a4b81
