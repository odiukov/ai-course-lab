- concept: 'init переносим, потому что не вызывает API ни одного фреймворка: обёртку меняют без правки скрипта'
  question: Один и тот же init-скрипт запускают локальный хук, CI-job и entrypoint контейнера, ни строчки в нём не меняя. Что это обеспечивает?
  explanation: 'Внутри скрипта нет ни хуковых, ни CI-, ни контейнерных вызовов — только локальные пробы и результат процесса. Поэтому обернуть его может bash, Make или файл задач, а смена платформы не трогает саму проверку. Копии с правками — прямая противоположность переносимости: их придётся синхронизировать.'
  kind: choice
  options:
    - Скрипт определяет, кто его вызвал, и подстраивает поведение под каждую обёртку
    - Скрипт не обращается к API ни одной из этих систем и общается с ними только через общий интерфейс процесса
    - У каждой обёртки хранится своя копия скрипта с нужными правками
    - Скрипт написан на bash, а bash понимают все три среды
  correct: 1
  id: 029-deployment-1
  fingerprint: 05573ca6
- concept: обёртки различаются только действием после успеха, а реакция на отказ у всех одна — обрыв цепочки
  question: Хук, CI-job `setup-agent` и Docker entrypoint вызывают один init. Чем они между собой отличаются?
  explanation: 'Всё, что относится к оценке стенда — состав проб, серьёзность, вердикт, — уже решено внутри init. Обёртке остаётся довести вердикт до своей среды: продолжить цепочку или оборвать её, сохранив логи. Как только одна из обёрток начинает трактовать отказ по-своему, единой гарантии больше нет.'
  kind: choice
  options:
    - 'Реакцией на отказ: одни прекращают запуск, другие продолжают с предупреждением'
    - Только действием после успеха — вернуть управление инструменту, разблокировать зависимый job, сделать exec рантайма; при отказе все три обрывают цепочку
    - 'Набором проб: каждой среде нужен свой набор проверок'
    - 'Порогом серьёзности: в CI блокирует любой провал, локально — только часть'
  correct: 1
  id: 029-deployment-2
