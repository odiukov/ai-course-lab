- concept: статус адресован программе и определяет вердикт, пояснение адресовано человеку и определяет ремонт
  question: Проба переменных окружения провалилась. Зачем в результате нужно текстовое пояснение, если статус уже говорит «провал»?
  explanation: 'Статус — вход логики допуска: по нему скрипт решает остановиться или продолжить. Пояснение — вход для человека: «отсутствует переменная OPENAI_API_KEY» позволяет починить среду, а голое слово «провал» заставляет расследовать заново.'
  kind: choice
  options:
    - Пояснение используется скриптом, чтобы решить, останавливать ли запуск
    - Пояснение называет конкретную причину, по которой человек может устранить проблему
    - Пояснение нужно только при успешных пробах, чтобы подтвердить проверку
