- concept: в расчёт отпечатка входит и относительное имя манифеста, и его содержимое
  question: Почему в отпечаток добавляют относительное имя каждого манифеста, а не только его содержимое?
  explanation: Отпечаток обязан описывать всю конфигурацию зависимостей, а она задана парами «где объявлено» и «что объявлено». Имя файла — часть содержания состояния, а не служебная деталь. Оно же различает наличие и отсутствие манифеста в наборе.
  kind: choice
  options:
    - Иначе одинаковый текст в разных манифестах даст один и тот же отпечаток, и перенос объявлений между файлами останется незамеченным
    - Чтобы отпечаток было легче читать человеку
    - Чтобы хэш-функция принимала данные в виде байтов
    - Чтобы отпечаток менялся при каждом запуске
