- concept: между склеиваемыми частями нужны однозначные разделители, иначе разные наборы дают одинаковую байтовую последовательность
  question: Имена и содержимое файлов склеиваются в одну последовательность перед хэшированием. Зачем между частями ставят однозначный разделитель или пишут длину каждой части?
  explanation: 'Классический пример: пары («a», «bc») и («ab», «c») при простой склейке дают «abc» в обоих случаях. Разделитель или префикс длины делает разбор однозначным, и разные конфигурации гарантированно расходятся по отпечатку.'
  kind: choice
  options:
    - Без этого разные наборы имён и содержимого могут склеиться в одинаковую последовательность байтов и получить одинаковый отпечаток
    - Без этого хэш-функция даст ошибку на пустом файле
    - Разделители ускоряют вычисление на больших файлах
    - Они нужны, чтобы результат вывелся шестнадцатеричной строкой
