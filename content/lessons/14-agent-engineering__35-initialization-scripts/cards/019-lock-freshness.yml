- concept: 'недоверие к локу переводит init на полный прогон проб, а не в отказ старта: лок — кеш-оптимизация, а не источник вердикта'
  question: Проверка лока дала отрицательный результат (истёк срок или отпечаток не совпал). Что делает init дальше?
  explanation: 'Лок — кеш успешного прохода, а не вердикт. Его непригодность означает лишь потерю права на короткий путь: пробы гоняются заново, и стенд может оказаться полностью исправным. Отказ старта порождают провалы блокирующих проб, а не сам факт устаревшего лока.'
  kind: choice
  options:
    - Выполняет полный набор проб и решает допуск по их результатам
    - Отказывает в старте, потому что лок оказался недействительным
    - Стартует без проверок, записав предупреждение о непригодном локе
    - Перезаписывает лок текущим отпечатком и продолжает по короткому пути
  correct: 0
  id: 019-lock-freshness-2
