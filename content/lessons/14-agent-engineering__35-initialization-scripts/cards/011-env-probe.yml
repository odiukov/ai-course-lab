- concept: проба переменных окружения подтверждает выполнение известного предусловия, но не валидность значения
  question: Проба обязательных переменных окружения прошла успешно. Что из этого следует?
  explanation: 'Проба отвечает на узкий вопрос: выполнено ли известное обязательное условие старта. Отозванный или чужой ключ она не поймает — для этого нужен сетевой вызов, которому не место в старте. Ранний отказ не устраняет будущие ошибки, но не даёт заранее сломанной сессии притвориться рабочей.'
  kind: choice
  options:
    - Только то, что все обязательные имена заданы и содержат значение; действительность ключа и его права не проверены
    - Что ключи действительны и у них достаточно прав для всех вызовов сервиса
    - Что значения переменных соответствуют формату, ожидаемому каждым сервисом
    - Что внешние сервисы доступны по указанным адресам
  correct: 0
  id: 011-env-probe-1
  fingerprint: b4cef61b
- concept: в отчёт попадает имя отсутствующей переменной, но никогда её значение
  question: Проба обнаружила, что обязательная переменная окружения не задана. Что она пишет в объяснение?
  explanation: 'Среди обязательных переменных обычно ключи доступа и пароли. Для ремонта достаточно имени: человек знает, что подставлять. Значения, попавшие в отчёт или журнал, утекают вместе с ними — а отчёт живёт дольше сессии и читается на других машинах.'
  kind: choice
  options:
    - Имя переменной и место, где её нужно настроить — без значений каких-либо переменных
    - Имя переменной и текущие значения всех остальных обязательных переменных для сравнения
    - Значение переменной в усечённом виде, чтобы было видно, что именно не так
    - Хеш ожидаемого значения, чтобы человек сверил его вручную
  correct: 0
  id: 011-env-probe-2
  fingerprint: 523e2298
