- concept: несовпадение отпечатка означает неприменимость прежнего результата к новой конфигурации, а не доказанную поломку зависимостей
  question: Отпечаток зависимостей не совпал с записанным в локе. Что именно этим доказано?
  explanation: Отпечаток — не диагноз, а привязка результата к содержимому. Новая конфигурация вполне может оказаться исправной, но это устанавливается прогоном проб, а не старой записью.
  kind: choice
  options:
    - Что сохранённый успешный результат получен для другой конфигурации и больше не служит доказательством исправности текущей
    - Что зависимости сломаны и среду нужно переустанавливать
    - Что лок повреждён и его надо удалить вручную
    - Что системные часы разошлись с временем записи лока
