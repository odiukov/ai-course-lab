- concept: каждый выясненный контракт проекта отображается в отдельную пробу, а собранный скрипт закрепляется шагом пайплайна
  question: Расставь по порядку шаги превращения разбора проекта в исполняемое правило допуска.
  explanation: Сначала контракты, потом их отображение в пробы, потом код, потом закрепление в пайплайне. Перескок через первый шаг даёт шаблон вместо проектного скрипта; перескок через последний оставляет правило добровольным.
  kind: order
  items:
    - 'Выяснить контракты проекта: где зафиксирована версия рантайма, какой командой ставятся зависимости, чем запускаются тесты, какие переменные обязательны, нужны ли локальные сервисы'
    - Сопоставить каждому контракту отдельную пробу и понятный человеку текст объяснения сбоя
    - Сгенерировать init_agent.py, собирающий эти пробы в один прогон
    - Закрепить вызов скрипта отдельным шагом CI-workflow
  id: 031-project-artifact-2
