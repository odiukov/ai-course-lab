- concept: правила допуска живут в одном исполняемом скрипте, который вызывают и локально, и из CI, а не дублируются в конфигурации пайплайна
  question: Команда предлагает описать проверки среды прямо шагами CI-конфигурации, а локально пользоваться init_agent.py. Объясни своими словами, чем это хуже одного скрипта, вызываемого из обоих мест.
  explanation: Дублирование правил — источник расхождения сред. Скрипт как единственный носитель условий даёт одинаковый вердикт локально и в CI, а конфигурация пайплайна остаётся тонкой обёрткой.
  kind: open
  reference: 'Два описания одного правила расходятся: локально требование обновили, в пайплайне забыли — и вердикт зависит от того, где запустились. Один скрипт делает правило единственным артефактом: CI вызывает тот же контракт запуска, что и разработчик, получает тот же ненулевой код выхода и тот же init_report.json с причинами. Правила при этом версионируются вместе с кодом проекта и тестируются локально до попадания в пайплайн, а конфигурация CI сводится к одной строке вызова.'
