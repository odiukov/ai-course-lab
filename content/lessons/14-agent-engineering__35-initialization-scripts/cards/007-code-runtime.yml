- concept: кортежи версий сравниваются поэлементно слева направо, а строки — посимвольно, что даёт разные вердикты
  question: Порог версии записан как (4, 9), запущенный интерпретатор даёт (4, 10). Что вернут сравнение кортежей и сравнение тех же версий как строк "4.10" и "4.9"?
  explanation: 'Кортеж сравнивается поэлементно: 4 == 4, дальше 10 > 9. Строка сравнивается посимвольно: после "4." идёт ''1'' против ''9'', и ''1'' < ''9'', так что "4.10" < "4.9". Поэтому версии держат числовыми кортежами, а не текстом.'
  kind: choice
  options:
    - 'Кортежи: (4, 10) больше (4, 9) — проба проходит; строки: "4.10" меньше "4.9" — проба ложно блокирует'
    - 'Оба способа дают одинаковый вердикт: версия подходит'
    - Кортежи вообще не поддерживают сравнение, работает только строковое
    - Кортежи сравнивают сумму элементов, поэтому (4, 10) и (4, 9) почти равны
