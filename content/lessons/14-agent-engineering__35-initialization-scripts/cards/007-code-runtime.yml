- concept: объяснение пробы фиксирует наблюдённое значение и порог, чтобы вердикт перепроверялся без повторного запуска
  question: Проба версии рантайма провалилась. Почему объяснения «версия неверна» недостаточно и что обязано попасть в него вместо этого?
  explanation: 'Проба возвращает машинный статус и человеческое объяснение. Ценность объяснения — в паре «наблюдалось / ожидалось»: она делает отказ воспроизводимым и превращает его в конкретную инструкцию по починке.'
  kind: open
  reference: 'Отчёт читают позже и на другой машине, где исходной среды уже нет. Фраза «версия неверна» не позволяет ни повторить вердикт, ни понять ремонт: неизвестно, что обнаружено и с чем сравнивалось. Объяснение обязано нести обе величины — фактическую версию интерпретатора и требуемый минимум. Тогда вердикт проверяем арифметически по самому отчёту, а действие очевидно: поднять интерпретатор до указанного порога.'
