- concept: 'на неисправной среде наблюдения агента неоднозначны: дефект среды неотличим от дефекта кода'
  question: Объясни своими словами, почему запуск агента на среде с проваленной пробой опасен не только потерей времени, но и качеством правок.
  explanation: Ключ — неотличимость источника ошибки. Испорченный измерительный прибор даёт не «менее точные» результаты, а результаты, из которых нельзя сделать вывод об измеряемом объекте.
  kind: open
  reference: 'Агент судит о коде по результатам его выполнения. Если сломана сама среда (нет пакета, не та версия рантайма, нет переменной окружения), падение теста не сообщает ничего о коде: сигнал смешивает дефект стенда и дефект программы. Агент, приняв поломку среды за баг проекта, начинает править исправный код — появляются лишние изменения, а исходная причина маскируется. Поэтому вердикт unhealthy останавливает запуск и передаёт точную причину человеку.'
  id: 003-health-gate-1
  fingerprint: ea108d2f
- concept: починка среды и выполнение пользовательской задачи — разные работы, их нельзя смешивать в одном прогоне
  question: Проба зависимостей провалена. Агенту поручено исправить бизнес-логику. Что здесь верно?
  explanation: 'Смешение двух работ в одном прогоне даёт diff, где правки среды и правки логики перепутаны, а проверить логику всё равно нечем. Третий вариант хуже всех: он убирает не поломку, а единственный способ заметить её последствия.'
  kind: choice
  options:
    - Восстановление среды — отдельная работа, она должна закончиться до начала работы над задачей
    - 'Агент может совместить: чинить среду по мере того, как падают тесты задачи'
    - Задачу можно выполнить, если заранее запретить агенту запускать тесты
