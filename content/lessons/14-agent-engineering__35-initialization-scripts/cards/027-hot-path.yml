- concept: 'бюджет времени горячего пути оценивается по суммарной задержке за день: длительность прогона × число сессий'
  question: Проверка в горячем пути init стабильно занимает 9 секунд. Разработчик за день стартует 12 сессий. Сколько секунд чистого ожидания это добавляет за день?
  explanation: '9 × 12 = 108 секунд, почти две минуты простоя ежедневно. Именно поэтому урок ставит порог в три секунды на весь холостой прогон: цена проверки умножается на частоту запусков, а не платится один раз. Когда ожидание становится заметным, человек начинает обходить init — и барьер исчезает совсем.'
  kind: numeric
  answer: 108
  tolerance: 0.5
  id: 027-hot-path-1
  fingerprint: 337b2415
- concept: 'внешняя зависимость в горячем пути даёт ложный отказ: исправный стенд блокируется из-за чужого сбоя'
  question: Проба в init обращается к внешнему серверу лицензий и падает по тайм-ауту, хотя проект, зависимости и тесты в порядке. Чем плох такой вердикт?
  explanation: 'Задача init — сказать, годен ли стенд. Внешний вызов подмешивает в вердикт состояние чужого сервиса и сети: работоспособная машина оказывается «сломанной», а причина лежит вне зоны ремонта. Проверка, которая порождает такие отказы, принадлежит отдельному workflow, а не входной двери каждой сессии.'
  kind: choice
  options:
    - Тем, что проверка лицензий вообще бесполезна
    - Тем, что исправный стенд получает отказ по причине, к стенду не относящейся, и приписать сбой нечему
    - Тем, что тайм-аут всегда доказывает исправность стенда
    - Тем, что при сетевой ошибке нельзя записать отчёт
  correct: 1
