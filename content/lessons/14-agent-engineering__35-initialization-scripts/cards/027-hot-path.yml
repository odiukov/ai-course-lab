- concept: дорогую, но воспроизводимую проверку кэшируют, а недетерминированную выносят наружу — лечения разные
  question: 'Две проверки не укладываются в бюджет init: полный локальный обход дерева файлов (результат воспроизводим) и вызов модели для классификации найденной ошибки. Что с ними делать?'
  explanation: 'Медленность и недетерминизм — разные болезни. Дорогая, но повторяемая проверка честно кэшируется: сохранённый результат остаётся верным при тех же условиях. Кэш недетерминированного ответа лишь фиксирует один случайный вердикт и выдаёт его за факт, поэтому такой вызов убирают из горячего пути целиком.'
  kind: choice
  options:
    - Оставить обе, просто подняв бюджет времени
    - Обход дерева кэшировать и пропускать по свежему локу, вызов модели вынести в отдельный workflow
    - 'Вынести обе: раз медленные, значит не пробы'
    - Кэшировать обе — кэш снимает и медленность, и изменчивость ответа
  correct: 1
