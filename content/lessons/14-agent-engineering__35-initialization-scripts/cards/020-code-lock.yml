- concept: отметка времени лока из будущего трактуется как несвежесть, а не как максимальный запас доверия
  question: В prereqs.lock отметка времени на 30 часов впереди текущего времени (сбились часы машины), допустимый возраст — 3 дня, отпечаток совпадает. Каким должен быть результат проверки свежести?
  explanation: Формула возраста при отметке из будущего даёт отрицательное число, которое формально «меньше предела» и молча открывает короткий путь по испорченным данным. Отклонение отрицательного возраста возвращает проверку к честному прогону проб.
  kind: choice
  options:
    - 'Несвежий: отрицательный возраст — признак неверных данных или сбитых часов, а не доказательство недавней проверки'
    - 'Свежий: возраст меньше предела, значит условие выполнено'
    - 'Свежий: раз отпечаток совпал, время можно не учитывать'
    - 'Исключение: такой лок нельзя интерпретировать, и init обязан упасть'
  correct: 0
  id: 020-code-lock-1
  fingerprint: 87ce8933
- concept: валидный кеш проб подтверждает совпадение условий прошлой проверки, но не текущую исправность стенда
  question: Функция свежести лока вернула True. Какое утверждение из этого НЕ следует?
  explanation: 'True говорит только о пригодности кеша: условия прежней проверки не изменились по двум измеримым признакам. Состояние стенда между записью лока и текущим запуском никем не наблюдалось, поэтому дешёвые критические проверки бездумно отключать нельзя.'
  kind: choice
  options:
    - 'Что все зависимости установлены прямо сейчас: пакет могли удалить вручную уже после записи лока'
    - Что лок записан не позже допустимого срока
    - Что сохранённый в локе отпечаток совпадает с текущим
    - Что лок существует и корректно читается
  correct: 0
  id: 020-code-lock-2
  fingerprint: 869b9954
