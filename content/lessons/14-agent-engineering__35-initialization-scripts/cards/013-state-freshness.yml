- concept: '«старый» и «устаревший» — разные свойства: актуальность решает контракт памяти, а не один только возраст записи'
  question: Объясни своими словами, почему давняя запись состояния может остаться допустимой, а совсем недавняя — уже нет.
  explanation: Init не изобретает правило свежести и не толкует текст записи, а применяет заранее согласованные признаки контракта к текущим фактам.
  kind: open
  reference: 'Возраст сам по себе не критерий. Контракт памяти репозитория заранее задаёт признаки актуальности: привязка к рабочей сессии, отметка обновления, соответствие текущему состоянию репозитория. Давняя запись остаётся валидной, если с тех пор состояние не менялось и признаки сохранены. Свежая запись становится недостоверной, если после неё репозиторий перешёл в другое состояние — откат изменений, обрыв сессии, чужой коммит. Поэтому проверки одного времени недостаточно: вердикт выносит контракт, а время лишь один из его признаков.'
  id: 013-state-freshness-2
  fingerprint: 7f2c8b75
- concept: 'непроверенное устаревшее состояние опаснее отсутствующего: агент достраивает несуществующий результат'
  question: Сессия оборвалась, изменения не сохранились, но доска осталась с отметкой «задача в работе». Init свежесть не проверял. Чем это опасно для следующей сессии?
  explanation: Отметка активной задачи — утверждение о состоянии работы. Без проверки актуальности агент строит план поверх ложной посылки, и расхождение всплывает уже в результатах.
  kind: choice
  options:
    - Агент примет следы оборванной работы за подтверждённую точку продолжения и станет достраивать результат, которого в репозитории нет
    - Агент потеряет доступ к репозиторию
    - Отчёт init станет длиннее из-за лишней пробы
    - 'Ничем: агент перечитает исходники и отметку проигнорирует'
  correct: 0
