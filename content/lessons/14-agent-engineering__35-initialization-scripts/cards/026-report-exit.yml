- concept: запись отчёта предшествует завершению процесса, иначе провальный прогон не оставляет диагностики
  question: Init-скрипт обнаружил блокирующий провал пробы. Расставьте действия в правильном порядке.
  explanation: Если процесс завершится раньше записи, файла не будет именно в том прогоне, ради которого он и нужен — в неуспешном. Отчёт обязан быть на диске до вызова выхода, иначе диагностика теряется вместе с процессом.
  kind: order
  items:
    - Собрать результаты всех проб в единую структуру
    - Вычислить вердикт по наличию блокирующих провалов
    - Записать отчёт на диск, включая провалившиеся пробы
    - Завершить процесс кодом выхода, соответствующим вердикту
  id: 026-report-exit-1
  fingerprint: d3ea8af3
- concept: код выхода несёт двоичный допуск, а конкретика провала живёт только в отчёте
  question: Один прогон init завершился кодом 12, другой — кодом 47. Что из этого различия извлекает вызывающий конвейер?
  explanation: CI, Docker и хуки ветвятся по «ноль / не ноль». Любая содержательная диагностика — имена проб, статусы, пояснения — читается из отчёта, а не декодируется из величины кода. Кодировать смысл в номере кода значит требовать от конвейера парсер, которого у него нет.
  kind: choice
  options:
    - 'Ничего сверх факта «не ноль»: вердикт двоичный, а какая именно проба упала — видно только из отчёта'
    - 'Число провалившихся проб: 12 и 47 — это счётчики'
    - 'Уровень серьёзности: чем больше число, тем строже блокировка'
    - Время выполнения проб в секундах
  correct: 0
  id: 026-report-exit-2
  fingerprint: 09929ee3
- concept: отчёт фиксирует весь набор запущенных проб, а не только провалы, иначе непроведённая проверка неотличима от пройденной
  question: Init-скрипт записывает в отчёт только провалившиеся пробы. Что теряет человек, который потом этот отчёт читает?
  explanation: Отчёт — машиночитаемое доказательство прогона. Успешные записи фиксируют, что проверка была проведена; без них отсутствие жалобы нельзя отличить от отсутствия проверки.
  kind: open
  reference: 'Пропадает состав проверки: непонятно, какие пробы вообще выполнялись. Проба, которая не запустилась, была отключена или упала до записи, выглядит в таком отчёте так же, как успешно пройденная. Пустой отчёт становится двусмысленным — либо стенд исправен, либо не проверялось ничего. Полный список проб со статусами и пояснениями делает отчёт самодостаточным доказательством объёма проверки, а не только списком жалоб.'
  id: 026-report-exit-3
  fingerprint: b5bb514c
