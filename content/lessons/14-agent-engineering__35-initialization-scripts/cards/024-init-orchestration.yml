- concept: вердикт вычисляется по наличию хотя бы одного блокирующего провала, а не большинством голосов проб
  question: 'Из девяти проб семь вернули pass и две провалились: у первой провалившейся уровень warn, у второй — block. Каким будет вердикт оркестратора?'
  explanation: 'Правило вердикта — существование, а не пропорция: хотя бы один провал уровня block означает потерю необходимой гарантии, и никакое количество зелёных проб её не восполняет. Провал уровня warn попадает в отчёт, но в решении о допуске не участвует.'
  kind: choice
  options:
    - 'Старт запрещён: существует провал уровня block, доля успешных проб роли не играет'
    - 'Старт разрешён: успешных проб подавляющее большинство'
    - 'Старт разрешён с предупреждением: два провала из девяти укладываются в норму'
    - 'Вердикт неопределён: смешанные уровни требуют решения человека'
  correct: 0
  id: 024-init-orchestration-1
  fingerprint: c7b4fbe0
- concept: право решать о старте принадлежит одной точке — оркестратору; пробы наблюдают и сообщают, но не завершают процесс
  question: Проба версии интерпретатора обнаружила несовместимую версию и сама вызывает выход из процесса с ненулевым кодом. Что в этом плохо?
  explanation: Пробы — однородные наблюдатели с общим контрактом результата; интерпретация уровней, запись отчёта и код выхода живут в одной точке. Иначе добавление шестой пробы означает добавление шестого места, где программа может закончиться.
  kind: choice
  options:
    - 'Решение о допуске размазывается по пробам: отчёт остаётся недописанным, остальные проблемы не собраны, а вердикт больше не вычисляется в одном месте'
    - 'Ничего: блокирующий сбой обязан прекращать работу как можно раньше, где бы он ни обнаружился'
    - Плохо только то, что код выхода выбирает проба, а не оркестратор; выход из процесса в пробе допустим
    - Проба обязана сама записать отчёт перед выходом, тогда поведение корректно
  correct: 0
