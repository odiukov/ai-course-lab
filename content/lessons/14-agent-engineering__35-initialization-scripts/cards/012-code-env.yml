- concept: 'пустое значение переменной равнозначно её отсутствию: проверяется наличие значения, а не наличие ключа'
  question: Одна обязательная переменная не задана вовсе, другая задана, но равна пустой строке. Как должна отнестись к ним проба окружения?
  explanation: 'Пустая строка не даёт процессу ничего: ни ключа, ни адреса. Проверка «ключ присутствует в окружении» пропустила бы эту конфигурацию и отложила отказ на середину работы. Правильный контракт — «переменная задана и содержит значение».'
  kind: choice
  options:
    - 'Обе засчитываются как пропуск: пустое значение так же непригодно, как отсутствующее'
    - 'Пропуск только у незаданной: заданная переменная существует, значит условие выполнено'
    - 'Пропуск только у пустой: она сигнализирует о неверной настройке, а незаданная просто необязательна'
    - 'Ни одна не пропуск: проба обязана лишь перечислить имена, а решение принимает человек'
  correct: 0
  id: 012-code-env-1
  fingerprint: 4074e609
- concept: нормализация значения (обрезка пробелов) — часть контракта и не вводится пробой самовольно
  question: Обязательная переменная содержит строку из одних пробелов. Как поступает проба, если требования проекта про нормализацию ничего не говорят?
  explanation: 'Как только проба начинает чинить входные данные по собственному разумению, её вердикт перестаёт соответствовать записанному требованию: два одинаковых окружения получают разные ответы в зависимости от догадок пробы. Нужна обрезка — её вносят в требования явно, и тогда она проверяема.'
  kind: choice
  options:
    - 'Считает значение непустым: обрезку пробелов проба не выдумывает — это отдельное правило, которое должно быть записано'
    - Молча обрезает пробелы и объявляет переменную пропущенной
    - Обрезает пробелы и записывает исправленное значение обратно в окружение
    - Возвращает статус предупреждения, потому что вердикт неопределим
  correct: 0
  id: 012-code-env-2
  fingerprint: '64292229'
- concept: успешный результат пробы окружения тоже несёт содержательное объяснение — объём проверенного, но не сами значения
  question: Проба окружения прошла. Что осмысленно написать в её объяснении и чего писать нельзя?
  explanation: Успех без деталей неотличим от пробы, которая обошла пустой список требований и радостно отчиталась. Число проверенных имён закрывает этот разрыв, не раскрывая ни одного секрета.
  kind: open
  reference: 'Осмысленно указать объём проверки — сколько обязательных имён проверено, а при желании и сами имена. Тогда по отчёту видно, что проверялся ожидаемый список, а не пустой. Нельзя выводить значения: среди них пароли и токены, и успешный статус ничего в этом не меняет.'
  id: 012-code-env-3
  fingerprint: 5f113232
