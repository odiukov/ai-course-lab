- concept: превышение бюджета diff требует ратификации новой базы человеком, а не автоматического сдвига якоря
  question: Init сравнивает HEAD с last-known-good коммитом. Бюджет — 30 файлов, реально изменено 88. Какое поведение соответствует паттерну LKG-anchoring?
  explanation: 'LKG — база, признанная исправной человеком. Автопродвижение якоря уничтожает смысл проверки: любой дрейф мгновенно легализуется. Скрипт останавливается и возвращает решение человеку; в уроке дефолтный бюджет — 50 файлов.'
  kind: choice
  options:
    - Отказать в старте и потребовать, чтобы человек утвердил новый last-known-good коммит
    - 'Автоматически переписать LKG на текущий HEAD и стартовать: база просто устарела'
    - Стартовать с предупреждением и поднять бюджет до 88 файлов на этот запуск
    - Стартовать, но запретить агенту трогать файлы вне diff
  correct: 0
  id: 022-lkg-anchor-1
  fingerprint: 8b9b3707
- concept: сравнение с предыдущей сессией вместо фиксированного якоря скрывает накопленный дрейф
  question: Каждая сессия меняет 12 файлов. Init сравнивает HEAD не с утверждённым LKG, а с коммитом прошлой сессии, поэтому каждый раз видит 12. Сколько файлов на самом деле отличается от LKG после 7 таких сессий?
  explanation: 12 × 7 = 84. Скользящая база показывает 12 и всегда проходит любой разумный бюджет, хотя расстояние до проверенной точки растёт линейно. Фиксированный якорь — единственный способ сделать накопленный дрейф наблюдаемым.
  kind: numeric
  answer: 84
  tolerance: 0.5
  id: 022-lkg-anchor-2
  fingerprint: 55002ca0
- concept: бюджет diff измеряет объём, который агент способен честно охватить, а не качество изменений
  question: Почему лимит на число изменённых файлов относительно LKG — это порог доверия, а не оценка качества кода? Объясни своими словами.
  explanation: 'Порог про способность агента охватить diff, а не про качество. Отсюда и способ ремонта: не «почини код», а «человек утверждает новую базу».'
  kind: open
  reference: 'Лимит ничего не говорит о коде: изменения могут быть отличными и всё равно превысить бюджет, а могут быть плохими и уложиться в него. Он ограничивает объём контекста, который агент способен реально удержать и сверить с базой. На маленьком diff агент сверяет работу с базой честно; на огромном — начинает достраивать и выдумывать, а его вывод становится непроверяемым. Поэтому 50 файлов (дефолт урока) — настраиваемый предел объёма, который команда согласна доверить агенту без нового человеческого осмотра; настраивать можно, молча игнорировать нельзя.'
  id: 022-lkg-anchor-3
  fingerprint: d41bf0b0
