<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут шума, подделки и решения дискриминатора</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #58647a;
    --border: #bcc5d6;
    --fake: #d95f38;
    --fake-soft: #fff0e9;
    --real: #2674c8;
    --real-soft: #eaf4ff;
    --model: #7253b8;
    --model-soft: #f1edff;
    --output: #207865;
    --output-soft: #e8f7f2;
    --pixel: #273247;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111624;
      --panel: #171e2d;
      --ink: #edf2ff;
      --muted: #b5bfd3;
      --border: #536079;
      --fake: #ff936f;
      --fake-soft: #38241f;
      --real: #72b6ff;
      --real-soft: #172d45;
      --model: #b69cff;
      --model-soft: #292441;
      --output: #75d8bd;
      --output-soft: #17352f;
      --pixel: #e7edfa;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  .stage {
    max-width: 960px;
    margin-inline: auto;
    background: var(--panel);
  }

  .title {
    color: var(--ink);
    background: var(--panel);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 21px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--panel);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .card {
    stroke: var(--border);
    stroke-width: 2px;
  }

  .noise-card {
    fill: var(--panel);
    stroke: var(--fake);
  }

  .model-card {
    fill: var(--model-soft);
    stroke: var(--model);
  }

  .fake-card {
    fill: var(--fake-soft);
    stroke: var(--fake);
  }

  .real-card {
    fill: var(--real-soft);
    stroke: var(--real);
  }

  .output-card {
    fill: var(--output-soft);
    stroke: var(--output);
  }

  .source-card {
    fill: var(--real-soft);
    stroke: var(--real);
  }

  .arrow-fake {
    fill: var(--fake);
    stroke: var(--fake);
  }

  .arrow-real {
    fill: var(--real);
    stroke: var(--real);
  }

  .arrow-output {
    fill: var(--output);
    stroke: var(--output);
  }

  .arrow-line {
    fill: none;
    stroke-width: 3px;
    stroke-linecap: round;
  }

  text {
    fill: var(--ink);
    font-size: 14px;
  }

  .major {
    font-size: 24px;
    font-weight: bold;
  }

  .node-name {
    font-size: 16px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .route-fake {
    fill: var(--fake);
    font-size: 13px;
    font-weight: bold;
  }

  .route-real {
    fill: var(--real);
    font-size: 13px;
    font-weight: bold;
  }

  .route-output {
    fill: var(--output);
    font-size: 13px;
    font-weight: bold;
  }

  .pixel-stroke {
    fill: none;
    stroke: var(--pixel);
    stroke-width: 7px;
    stroke-linecap: square;
    stroke-linejoin: round;
  }

  .port {
    stroke: var(--panel);
    stroke-width: 2px;
  }

  .separator {
    stroke: var(--border);
    stroke-width: 1px;
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="stage">
  <div class="title">Маршрут шума, подделки и решения дискриминатора</div>
  <svg id="diagram"
       viewBox="0 0 960 390"
       width="960"
       height="390"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Как шум превращается в подделку и попадает в дискриминатор</title>
    <desc id="svg-desc">Вектор из ста чисел проходит через генератор, становится изображением из семисот восьмидесяти четырёх пикселей и вместе с настоящим изображением поступает в общий дискриминатор.</desc>
  </svg>
</main>

<script>
const data = [
  {
    origin: { x: 30, y: 365 },
    scale: 10,
    bounds: { left: -3, right: 93, bottom: -2.5, top: 36.5 },
    head: { length: 1.15, half: 0.68 },
    radius: 0.7,
    labelPad: 6,
    portRadius: 0.42
  },
  {
    backdrop: { x: -3, y: -2.5, w: 96, h: 39 },
    noise: { x: 2, y: 24, w: 15, h: 9, cls: "noise-card" },
    generator: { x: 24, y: 23, w: 14, h: 11, cls: "model-card" },
    fake: { x: 45, y: 22, w: 12, h: 12, cls: "fake-card" },
    source: { x: 24, y: 8, w: 12, h: 7, cls: "source-card" },
    real: { x: 45, y: 5, w: 12, h: 12, cls: "real-card" },
    discriminator: { x: 68, y: 9, w: 13, h: 25, cls: "model-card" },
    output: { x: 84, y: 15.5, w: 8, h: 8, cls: "output-card" },
    separator: { x1: 60, y1: 19.5, x2: 65.5, y2: 19.5 }
  },
  [
    { x1: 17.8, y1: 28.5, x2: 23.2, y2: 28.5, cls: "arrow-fake" },
    { x1: 38.8, y1: 28.5, x2: 44.2, y2: 28, cls: "arrow-fake" },
    { x1: 57.8, y1: 28, x2: 67.2, y2: 27, cls: "arrow-fake" },
    { x1: 36.8, y1: 11.5, x2: 44.2, y2: 11, cls: "arrow-real" },
    { x1: 57.8, y1: 11, x2: 67.2, y2: 12.5, cls: "arrow-real" },
    { x1: 81.8, y1: 19.5, x2: 83.2, y2: 19.5, cls: "arrow-output" }
  ],
  [
    {
      cls: "pixel-stroke",
      points: [
        [47.3, 31], [54.5, 31], [51.5, 28.5],
        [49.1, 26.5], [53.8, 26.5], [53.8, 24.2], [47.2, 24.2]
      ]
    },
    {
      cls: "pixel-stroke",
      points: [
        [47.5, 14.7], [53.9, 14.7], [52.4, 12.8],
        [50.7, 11.1], [49.2, 9.1], [48.2, 7.2]
      ]
    }
  ],
  [
    { x: 9.5, y: 30.2, text: "z", cls: "major", anchor: "middle" },
    { x: 9.5, y: 27.6, text: "100 чисел", cls: "node-name", anchor: "middle" },
    { x: 9.5, y: 25.5, text: "шумовой вектор", cls: "small", anchor: "middle" },

    { x: 31, y: 31.2, text: "G", cls: "major", anchor: "middle" },
    { x: 31, y: 28.5, text: "генератор", cls: "node-name", anchor: "middle" },
    { x: 31, y: 25.7, text: "100 → 784", cls: "small", anchor: "middle" },
    { x: 31, y: 24.2, text: "расширяет", cls: "small", anchor: "middle" },

    { x: 51, y: 35.2, text: "x̂ = G(z)", cls: "node-name", anchor: "middle" },
    { x: 51, y: 20.3, text: "подделка · 784 пикселя · 28×28", cls: "route-fake", anchor: "middle" },

    { x: 30, y: 12.8, text: "учебные", cls: "node-name", anchor: "middle" },
    { x: 30, y: 10.5, text: "данные", cls: "small", anchor: "middle" },
    { x: 40.3, y: 13.4, text: "без G", cls: "route-real", anchor: "middle", dy: -6 },

    { x: 51, y: 18.5, text: "x", cls: "node-name", anchor: "middle" },
    { x: 51, y: 3.2, text: "настоящее · 784 пикселя · 28×28", cls: "route-real", anchor: "middle" },

    { x: 60.8, y: 30.7, text: "готовая подделка", cls: "route-fake", anchor: "middle", dy: -6 },
    { x: 60.7, y: 9.1, text: "настоящий образец", cls: "route-real", anchor: "middle", dy: 6 },

    { x: 74.5, y: 30.8, text: "D", cls: "major", anchor: "middle" },
    { x: 74.5, y: 27.7, text: "дискриминатор", cls: "node-name", anchor: "middle" },
    { x: 74.5, y: 23.4, text: "видит только", cls: "small", anchor: "middle" },
    { x: 74.5, y: 21.6, text: "готовый образец", cls: "small", anchor: "middle" },
    { x: 74.5, y: 17.4, text: "784 пикселя", cls: "small", anchor: "middle" },
    { x: 74.5, y: 15.4, text: "→ одно число", cls: "small", anchor: "middle" },

    { x: 88, y: 24.8, text: "решение D", cls: "route-output", anchor: "middle" },
    { x: 88, y: 21, text: "D(·)", cls: "node-name", anchor: "middle" },
    { x: 88, y: 18.2, text: "от 0 до 1", cls: "node-name", anchor: "middle" },
    { x: 88, y: 13.2, text: "1 — настоящее", cls: "route-real", anchor: "middle" },
    { x: 88, y: 11.2, text: "0 — подделка", cls: "route-fake", anchor: "middle" },

    { x: 48, y: 0.5, text: "D не оценивает шум и не наблюдает работу G — он сравнивает готовые изображения одного формата", cls: "small", anchor: "middle" }
  ],
  [
    { x: 68, y: 27, cls: "arrow-fake" },
    { x: 68, y: 12.5, cls: "arrow-real" },
    { x: 81, y: 19.5, cls: "arrow-output" }
  ]
];

const [metric, layout, arrows, patterns, labels, ports] = data;
const origin = Object.freeze(metric.origin);
const scale = metric.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y - y * scale;

const svg = document.getElementById("diagram");
const namespace = svg.namespaceURI;

try {
  const make = (name, attributes, text) => {
    const element = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes || {})) {
      element.setAttribute(key, String(value));
    }
    if (text !== undefined) element.textContent = text;
    return element;
  };

  const append = (name, attributes, text, parent) => {
    const element = make(name, attributes, text);
    (parent || svg).appendChild(element);
    return element;
  };

  const rect = (item, extraClass) => {
    append("rect", {
      x: sx(item.x),
      y: sy(item.y + item.h),
      width: sx(item.x + item.w) - sx(item.x),
      height: sy(item.y) - sy(item.y + item.h),
      rx: sx(item.x + metric.radius) - sx(item.x),
      class: `card ${item.cls} ${extraClass || ""}`
    });
  };

  const arrow = item => {
    const dx = item.x2 - item.x1;
    const dy = item.y2 - item.y1;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const baseX = item.x2 - ux * metric.head.length;
    const baseY = item.y2 - uy * metric.head.length;
    const perpX = -uy * metric.head.half;
    const perpY = ux * metric.head.half;

    append("line", {
      x1: sx(item.x1),
      y1: sy(item.y1),
      x2: sx(baseX),
      y2: sy(baseY),
      class: `arrow-line ${item.cls}`
    });

    append("polygon", {
      points: [
        `${sx(item.x2)},${sy(item.y2)}`,
        `${sx(baseX + perpX)},${sy(baseY + perpY)}`,
        `${sx(baseX - perpX)},${sy(baseY - perpY)}`
      ].join(" "),
      class: item.cls
    });
  };

  const textAt = item => {
    const attributes = {
      x: sx(item.x),
      y: sy(item.y),
      class: item.cls,
      "text-anchor": item.anchor,
      "dominant-baseline": "middle"
    };
    if ("dx" in item) attributes.dx = item.dx;
    if ("dy" in item) attributes.dy = item.dy;
    append("text", attributes, item.text);
  };

  append("rect", {
    x: sx(layout.backdrop.x),
    y: sy(layout.backdrop.y + layout.backdrop.h),
    width: sx(layout.backdrop.x + layout.backdrop.w) - sx(layout.backdrop.x),
    height: sy(layout.backdrop.y) - sy(layout.backdrop.y + layout.backdrop.h),
    fill: "var(--panel)"
  });

  append("line", {
    x1: sx(layout.separator.x1),
    y1: sy(layout.separator.y1),
    x2: sx(layout.separator.x2),
    y2: sy(layout.separator.y2),
    class: "separator"
  });

  rect(layout.noise);
  rect(layout.generator);
  rect(layout.fake);
  rect(layout.source);
  rect(layout.real);
  rect(layout.discriminator);
  rect(layout.output);

  for (const item of arrows) arrow(item);

  for (const pattern of patterns) {
    append("polyline", {
      points: pattern.points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
      class: pattern.cls
    });
  }

  for (const port of ports) {
    append("circle", {
      cx: sx(port.x),
      cy: sy(port.y),
      r: sx(port.x + metric.portRadius) - sx(port.x),
      class: `port ${port.cls}`
    });
  }

  for (const label of labels) textAt(label);
} catch (error) {
  while (svg.lastChild) svg.removeChild(svg.lastChild);
  const fallback = document.createElementNS(namespace, "text");
  fallback.setAttribute("x", String(sx(metric.bounds.left + metric.head.length)));
  fallback.setAttribute("y", String(sy(metric.bounds.top - metric.head.length)));
  fallback.setAttribute("class", "fallback");
  fallback.setAttribute("text-anchor", "start");
  fallback.textContent = "Схема: 100 чисел шума → G → 784 пикселя 28×28 → D → одно число от 0 до 1; настоящий x входит прямо в D.";
  svg.appendChild(fallback);
}
</script>
</body>
</html>
