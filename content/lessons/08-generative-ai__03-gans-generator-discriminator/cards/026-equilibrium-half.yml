- concept: постоянный нейтральный ответ дискриминатора сам по себе не доказывает совпадение распределений
  question: Дискриминатор выдаёт всем настоящим и сгенерированным образцам вероятность ровно в середине допустимого диапазона. Какой вывод об обучении GAN обоснован?
  explanation: Ответ 0.5 возникает и при совпадении распределений, и у слабого дискриминатора. Чтобы отличить равновесие от недообучения, нужно дополнительно оценить качество и разнообразие генерации или способность дискриминатора обнаруживать заведомые различия.
  kind: choice
  options:
    - Распределение генератора обязательно совпало с распределением данных
    - Распределения могли совпасть, но дискриминатор также мог просто не научиться замечать различия
    - Генератор обязательно запомнил обучающую выборку
    - Дискриминатор надёжно отличает подделки от настоящих данных
  correct: 1
  id: 026-equilibrium-half-1
  fingerprint: 74b92817
- concept: равенство общих долей классов не заменяет локального совпадения плотностей данных и генератора
  question: Почему одинаковое общее количество настоящих и сгенерированных образцов ещё не означает, что оптимальный дискриминатор должен давать нейтральный ответ для каждого возможного образца?
  explanation: Даже при равном числе примеров классы могут занимать разные области пространства данных. Тогда оптимальный дискриминатор использует локальное отношение плотностей и отклоняется от 0.5 там, где одна из плотностей выше.
  kind: open
  reference: Равные размеры классов задают лишь одинаковые априорные вероятности. Для нейтрального ответа в каждой точке должны совпадать локальные плотности настоящих и сгенерированных данных; иначе признаки образца изменяют вероятность его происхождения.
  id: 026-equilibrium-half-2
  fingerprint: e90a3387
