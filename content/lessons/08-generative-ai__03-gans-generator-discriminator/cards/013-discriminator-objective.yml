- concept: масштабирование всей функции потерь положительной константой сохраняет направление градиента, но изменяет его величину
  question: В одной реализации GAN средние потери дискриминатора на настоящей и поддельной частях усредняют, а в другой — складывают. Части имеют одинаковый размер. Как это различие влияет на градиент?
  explanation: Сумма групповых средних отличается от их среднего лишь положительным постоянным множителем. Такой множитель не меняет направление градиента, но масштабирует его и фактический шаг оптимизатора.
  kind: choice
  options:
    - Меняет знак градиента и заставляет дискриминатор обучаться в противоположном направлении
    - Сохраняет направление градиента, но пропорционально увеличивает его величину
    - Обнуляет вклад поддельных образцов в обновление
    - Влияет только на отображаемое значение потери, но не на величину обновления параметров
