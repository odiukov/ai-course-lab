- concept: дискриминатор сравнивает настоящие и сгенерированные образцы в одном пространстве данных
  question: Какие объекты дискриминатор стандартного GAN получает для классификации?
  explanation: 'Дискриминатору передают объекты одного формата: настоящий x из данных и подделку G(z). Сам исходный шум z дискриминатор не классифицирует.'
  kind: choice
  options:
    - Только векторы шума до их обработки генератором
    - Вектор шума и параметры генератора
    - Настоящий образец и внутренние активации генератора
    - Настоящий образец x и готовый сгенерированный образец G(z)
  correct: 3
  id: 003-gan-map-1
  fingerprint: 6b610560
- concept: случайный латентный вектор служит источником вариативности генерируемых образцов
  question: Объясни своими словами, как замена латентного вектора z может изменить результат генерации и на каком этапе этот результат становится входом дискриминатора.
  explanation: Шум задаёт изменяемую заготовку, но ещё не является образцом данных. Сначала генератор отображает z в пространство данных, после чего дискриминатор проверяет полученный G(z).
  kind: open
  reference: Генератор преобразует каждый латентный вектор z в готовый образец G(z), поэтому разные значения z могут приводить к разным подделкам. Дискриминатор получает результат только после этого преобразования и оценивает уже G(z), а не исходный шум.
  id: 003-gan-map-2
  fingerprint: 25fe624a
