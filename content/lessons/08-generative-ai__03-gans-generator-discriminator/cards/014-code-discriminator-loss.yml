- concept: равное влияние ветвей при разных размерах батчей обеспечивается усреднением каждой ветви отдельно
  question: Почему при разном числе настоящих и сгенерированных образцов нежелательно усреднять их поэлементные потери одним общим средним?
  explanation: При общем усреднении вклад ветви определяется её размером. Раздельные средние с последующим объединением поровну сохраняют равное влияние настоящих и сгенерированных данных.
