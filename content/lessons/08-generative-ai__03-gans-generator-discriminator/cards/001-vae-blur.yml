- concept: байесовски оптимальный прогноз при MSE равен условному среднему целевой величины
  question: Декодер обучают минимизировать ожидаемую среднеквадратичную ошибку. При фиксированном латентном коде возможны разные целевые изображения. Какой детерминированный прогноз минимизирует ожидаемую MSE?
  explanation: Для квадратичной потери байесовски оптимален условный математический ожидатель. Поэтому при нескольких допустимых вариантах декодер получает стимул усреднять их, а не выбирать один из них.
  kind: choice
  options:
    - Условное среднее целевых изображений
    - Самое часто встречающееся целевое изображение
    - Случайно выбранное целевое изображение
    - Изображение с самыми резкими контурами
  correct: 0
  id: 001-vae-blur-1
  fingerprint: a03d270f
- concept: низкая попиксельная ошибка не гарантирует правдоподобность изображения как единого объекта
  question: Объясни своими словами, почему усреднение нескольких резких и правдоподобных изображений может дать размытое и неправдоподобное изображение, хотя его MSE будет низкой.
  explanation: Если одному коду соответствуют разные положения глаз, рта или других границ, попиксельное среднее накладывает эти варианты друг на друга. Оно близко к ним по MSE, но теряет резкие контуры и глобальную целостность.
  kind: open
  reference: MSE оценивает каждый пиксель относительно конкретной цели и не проверяет согласованность изображения целиком. Средние значения могут быть близки к пикселям каждого допустимого варианта, но смешивать несовместимые положения контуров и деталей. В результате модель получает низкую ошибку за изображение, которое не соответствует ни одному правдоподобному варианту.
  id: 001-vae-blur-2
  fingerprint: 404598b9
