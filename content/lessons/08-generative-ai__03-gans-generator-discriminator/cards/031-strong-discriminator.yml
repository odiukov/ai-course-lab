- concept: диагностическая точность дискриминатора требует сбалансированного батча и фиксированного правила классификации
  question: Расположите действия для корректного измерения диагностической точности дискриминатора GAN.
  explanation: Точность имеет понятный смысл только при равных долях классов и заранее заданном правиле D(x) >= 0.5. Тогда постоянный ответ 0.5 даёт 50%, а результат нельзя искусственно улучшить преобладанием одного класса или изменением порога.
  kind: order
  items:
    - Собрать батч с равными долями настоящих и сгенерированных образцов
    - Получить оценки дискриминатора для всех образцов
    - Преобразовать оценки в классы по порогу середины диапазона, относя равенство к классу настоящих
    - Посчитать долю классифицированных верно образцов
  id: 031-strong-discriminator-1
  fingerprint: 8665de88
- concept: почти безошибочная точность на сбалансированном батче указывает на слишком сильный дискриминатор, который следует ослабить
  question: На сбалансированном контрольном батче дискриминатор GAN почти безошибочно отделяет настоящие образцы от сгенерированных, а его оценки подделок прижаты к нижней границе. Как лучше интерпретировать ситуацию?
  explanation: 'Точность около 95% и выше на правильно сбалансированном батче означает, что D почти чисто разделяет классы. Такой D даёт генератору мало полезного обучающего сигнала, поэтому баланс восстанавливают ослаблением дискриминатора: снижают его learning rate, добавляют шум или уменьшают его мощность.'
  kind: choice
  options:
    - GAN достигла равновесия, поэтому обучение обеих сетей можно завершить
    - Дискриминатор слишком силён; стоит снизить его learning rate или добавить шум к его входам
    - Дискриминатор недостаточно обучен; нужно увеличить его learning rate
    - Генератор уже точно воспроизводит распределение данных
  correct: 1
