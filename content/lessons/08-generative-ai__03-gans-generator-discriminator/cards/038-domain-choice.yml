- concept: узкий и однородный домен делает специализированный GAN практичным выбором
  question: Объясни своими словами, почему GAN может быть удачным выбором для генерации изображений из узкого и однородного домена.
  explanation: Преимущество GAN проявляется, когда пространство допустимых изображений хорошо ограничено. Чем разнообразнее домен, тем труднее генератору охватить его без пропуска редких вариантов.
  kind: open
  reference: В узком домене генератору нужно моделировать ограниченный набор объектов, поз и стилей. Это упрощает покрытие распределения и позволяет GAN создавать резкие изображения с помощью сравнительно компактной специализированной модели.
  id: 038-domain-choice-2
  fingerprint: 3bf54c89
- concept: состязательное обучение может использоваться как компонент генеративной системы другого семейства
  question: Как состязательный подход может применяться в современной диффузионной системе, не выступая самостоятельным генератором?
  explanation: 'Состязательный сигнал продолжает использоваться внутри других генеративных систем: например, дискриминатор может оценивать правдоподобие кропов или участвовать в дистилляции диффузионной модели. При этом основным генератором остаётся модель другого семейства.'
  kind: choice
  options:
    - Как дискриминатор для перцептивной потери или состязательной дистилляции
    - Как замена текстового кодировщика таблицей случайных меток
    - Как способ полностью исключить обучающие изображения
    - Как правило выбора разрешения без вычисления градиентов
  correct: 0
  id: 038-domain-choice-3
