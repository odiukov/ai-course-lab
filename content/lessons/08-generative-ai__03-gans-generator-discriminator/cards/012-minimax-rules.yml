- concept: одно изменение оценки подделки имеет противоположный смысл для генератора и дискриминатора
  question: Какое изменение D(G(z)) одновременно означает успех генератора и ухудшение дискриминатора на сгенерированном образце?
  explanation: D(G(z)) — оценка вероятности того, что подделка настоящая. Генератор стремится повысить эту оценку, а дискриминатор — понизить, поэтому её рост выгоден G и невыгоден D.
  kind: choice
  options:
    - D(G(z)) увеличивается
    - D(G(z)) уменьшается
    - D(G(z)) остаётся неизменным
  correct: 0
  id: 012-minimax-rules-1
  fingerprint: b71ae4cd
- concept: заморозка параметров дискриминатора не препятствует передаче градиента генератору
  question: Объясни, как дискриминатор помогает обучать генератор, если во время шага генератора параметры дискриминатора не обновляются.
  explanation: Заморозить D — значит не изменять его параметры, а не разрывать вычислительный граф. D остаётся дифференцируемой функцией, через которую генератор получает направление улучшения своих образцов.
  kind: open
  reference: Параметры дискриминатора фиксируются, но обратное распространение всё равно проходит через его вычисления. Производная оценки дискриминатора по сгенерированному образцу сообщает, как изменить выход G, а затем градиент доходит до параметров генератора. Оптимизатор обновляет только G.
  id: 012-minimax-rules-2
  fingerprint: 797602b0
