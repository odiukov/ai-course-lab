- concept: градиент батчевой потери сохраняет покомпонентное соответствие логитам дискриминатора
  question: Почему функция градиента generator loss должна вернуть отдельное значение для каждого элемента батча, а не сложить все производные в один скаляр?
  explanation: Скалярная сумма уничтожила бы соответствие между образцами и их логитами. Вектор производных позволяет передать каждому сгенерированному образцу свой сигнал и затем корректно распространить его через дискриминатор к генератору.
  kind: open
  reference: У каждого сгенерированного образца есть собственный логит дискриминатора, поэтому обратному проходу нужна частная производная потери по каждому логиту. Для среднего по батчу каждый компонент имеет вид (p - y_real) / N, где N — размер батча. Усреднение масштабирует компоненты, но не объединяет их в один градиент.
