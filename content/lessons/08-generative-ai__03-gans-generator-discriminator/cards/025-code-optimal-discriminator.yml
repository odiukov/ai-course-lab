- concept: общий локальный масштаб плотностей сокращается в оптимальном дискриминаторе
  question: В каждой точке обе плотности умножили на один и тот же положительный коэффициент, который может зависеть от точки. Как изменится поэлементный результат optimal_discriminator?
  explanation: В отношении p_data / (p_data + p_g) общий положительный множитель сокращается. Поэтому важна локальная пропорция плотностей, а не их общий масштаб.
  kind: choice
  options:
    - Не изменится
    - Станет ближе к вероятности настоящих данных
    - Станет зависеть от суммы плотностей по всему массиву
  correct: 0
  id: 025-code-optimal-discriminator-1
  fingerprint: 7c965e2b
- concept: маскирование позволяет вычислить отношение плотностей без неопределённого деления
  question: Расположите действия для безопасной поэлементной реализации optimal_discriminator в правильном порядке.
  explanation: Предварительно заполненный результат уже содержит ответ для точек, где обе плотности равны нулю. Деление выполняется только при ненулевом знаменателе, поэтому NaN не возникает, а форма входного массива сохраняется.
  kind: order
  items:
    - Создать выходной массив той же формы, заполнив его нейтральной вероятностью
    - Поэлементно вычислить сумму плотностей данных и генератора
    - Построить маску элементов, в которых эта сумма ненулевая
    - Только на выбранных маской элементах записать отношение плотности данных к сумме плотностей
  id: 025-code-optimal-discriminator-2
  fingerprint: 2776ee1a
