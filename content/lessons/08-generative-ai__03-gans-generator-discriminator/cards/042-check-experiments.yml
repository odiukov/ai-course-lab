- concept: численные значения BCE и WGAN-loss нельзя напрямую использовать для выбора лучшего метода
  question: В одном эксперименте BCE уменьшается, а в другом потеря критика WGAN становится отрицательной. Какой вывод об их качестве обоснован?
  explanation: BCE и WGAN оптимизируют разные величины с разными шкалами. Их сравнивают по общим показателям — например, устойчивости, времени сходимости, образцам и покрытию мод.
  kind: choice
  options:
    - Отрицательная потеря означает, что WGAN обучился лучше
    - Меньшее численное значение автоматически указывает на лучший метод
    - По самим значениям потерь победителя определить нельзя; нужны общие метрики качества и одинаковые условия
  correct: 2
  id: 042-check-experiments-1
  fingerprint: 4193c527
- concept: контролируемый эксперимент отделяет эффект функции потерь от случайности и различий в вычислительном бюджете
  question: Расположите этапы корректного сравнения BCE и WGAN.
  explanation: Сначала задают единые условия и критерии, затем выполняют повторные запуски, после чего сравнивают общие показатели. Так различия нельзя ошибочно объяснить удачным seed или большим вычислительным бюджетом.
  kind: order
  items:
    - Зафиксировать данные, архитектуру, размер батча, бюджет времени и измеряемые показатели
    - Провести для каждого метода несколько случайных запусков и собирать результаты в одинаковых контрольных точках
    - Сопоставить распределение результатов по времени сходимости, качеству образцов и покрытию мод
  id: 042-check-experiments-2
  fingerprint: 318bb5e7
