- concept: сигмоида преобразует неограниченный логит дискриминатора в допустимую вероятность
  question: Последний линейный слой дискриминатора выдаёт произвольное вещественное значение. Зачем перед вероятностной интерпретацией к нему применяют сигмоиду?
  explanation: Логит может быть любым вещественным числом, а сигмоида ограничивает результат диапазоном от 0 до 1, позволяя трактовать его как вероятность того, что образец настоящий.
  kind: choice
  options:
    - Чтобы преобразовать логит в допустимую вероятность
    - Чтобы поменять знак каждого отрицательного логита
    - Чтобы нормализовать логиты по всему батчу
    - Чтобы выбрать класс с наибольшим логитом
  correct: 0
  id: 005-sigmoid-probability-1
  fingerprint: bc4f7570
- concept: монотонность сигмоиды сохраняет порядок образцов по оценке дискриминатора
  question: Дискриминатор присвоил образцу A больший логит, чем образцу B. Что обязательно верно после применения одной и той же сигмоиды?
  explanation: 'Сигмоида строго возрастает: большему логиту всегда соответствует больший выход. Она меняет шкалу значений, но не переставляет образцы по степени правдоподобия.'
  kind: choice
  options:
    - Вероятность подлинности A выше вероятности подлинности B
    - Вероятности подлинности A и B станут одинаковыми
    - Вероятность подлинности A ниже вероятности подлинности B
    - Сравнить вероятности можно только после нормализации по батчу
  correct: 0
  id: 005-sigmoid-probability-2
  fingerprint: a6035157
- concept: конечный логит после сигмоиды не даёт граничной вероятности полной уверенности
  question: Может ли конечный логит после сигмоиды дать вероятность, точно соответствующую полной уверенности в подлинности или подделке? Объясни своими словами.
  explanation: Сигмоида асимптотически приближается к 0 при уменьшении логита и к 1 при его увеличении, но достигает этих границ только в пределе.
  kind: open
  reference: Нет. Для любого конечного логита выход сигмоиды строго находится между границами вероятностного диапазона. Он лишь приближается к ним при очень больших по модулю логитах.
  id: 005-sigmoid-probability-3
  fingerprint: 609a4081
