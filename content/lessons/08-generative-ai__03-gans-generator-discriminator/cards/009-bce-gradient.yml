- concept: для отрицательного класса величина градиента BCE растёт по мере приближения ошибочной вероятности к верхней границе
  question: Предсказанная вероятность положительного класса равна 0,6, а истинная метка — отрицательный класс. Чему равна производная BCE по этой вероятности?
  explanation: Для отрицательной метки производная равна обратной величине зазора до верхней границы вероятности. Зазор составляет 0,4, поэтому производная равна 2,5. Положительный знак означает, что при градиентном спуске вероятность уменьшится.
  kind: numeric
  answer: 2.5
  tolerance: 0.01
