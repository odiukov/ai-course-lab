- concept: генератор и дискриминатор выполняют противоположные по направлению преобразования
  question: Какая пара преобразований правильно описывает архитектурные роли сетей в GAN?
  explanation: 'Генератор работает как декодер: разворачивает компактное латентное представление в образец. Дискриминатор действует как классификатор: извлекает из образца признаки и сводит их к одному score.'
  kind: choice
  options:
    - 'Генератор: образец → скалярный score; дискриминатор: латентный вектор → образец'
    - 'Генератор: латентный вектор → образец; дискриминатор: образец → скалярный score'
    - 'Генератор: образец → латентный вектор; дискриминатор: латентный вектор → образец'
  correct: 1
  id: 004-opposite-networks-1
  fingerprint: f97a67d4
- concept: осмысленное расширение латентного представления требует обучаемого смешивания признаков
  question: Почему простое копирование компонентов латентного вектора не заменяет обучаемые слои генератора?
  explanation: Рост размерности сам по себе не создаёт правдоподобный образец. Генератор должен выучить совместное влияние скрытых признаков на выход, чтобы детали образца были согласованы между собой.
  kind: open
  reference: Копирование лишь увеличивает число значений и создаёт повторы, но не моделирует зависимости между частями образца. Обучаемые слои смешивают латентные признаки так, чтобы один признак мог согласованно влиять на множество выходных компонентов и формировать целостную структуру.
  id: 004-opposite-networks-2
  fingerprint: 5ba057c2
