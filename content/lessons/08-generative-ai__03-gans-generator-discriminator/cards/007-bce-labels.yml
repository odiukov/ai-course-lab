- concept: loss дискриминатора складывает BCE для настоящего и сгенерированного образцов
  question: Дискриминатор приписал вероятность «настоящее» 4/5 настоящему образцу и 2/5 сгенерированному. Чему равен суммарный BCE по этим двум образцам? Используй натуральный логарифм.
  explanation: Для настоящего образца штраф равен −ln(4/5). Для подделки правильному классу соответствует вероятность 1−2/5=3/5, поэтому её штраф равен −ln(3/5). Сумма составляет примерно 0,734.
  kind: numeric
  answer: 0.734
  tolerance: 0.005
  id: 007-bce-labels-1
  fingerprint: 925413ba
- concept: BCE учитывает уверенность вероятностного прогноза, а не только правильность класса
  question: Почему два дискриминатора с одинаковой долей правильных классификаций могут иметь разный BCE?
  explanation: Пороговая классификация считает ответы 0,9 и 0,51 одинаково правильными, но BCE назначает первому меньший штраф. Поэтому одинаковая accuracy не означает одинаковое качество вероятностных прогнозов.
  kind: open
  reference: BCE зависит от вероятностей, назначенных правильным меткам. Уверенные правильные прогнозы получают меньший штраф, осторожные — больший, а уверенные ошибки штрафуются особенно сильно. Обычная доля правильных ответов этой разницы не отражает.
  id: 007-bce-labels-2
  fingerprint: 199142bd
