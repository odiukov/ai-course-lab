- concept: DCGAN повышает устойчивость GAN с помощью архитектуры, адаптированной к изображениям
  question: GAN выдаёт изображения с рваными контурами и артефактами из-за неудачной архитектуры генератора и дискриминатора. Какое изменение непосредственно нацелено на эту проблему?
  explanation: Это набор архитектурных решений DCGAN. Свёртки учитывают локальную структуру изображений, транспонированные свёртки повышают разрешение, batch normalization стабилизирует активации, а LeakyReLU сохраняет градиент при отрицательных входах.
  kind: choice
  options:
    - Использовать свёртки, транспонированные свёртки, batch normalization и LeakyReLU
    - Начать обучение с низкого разрешения и постепенно добавлять слои
    - Подавать отдельные параметры стиля на разные уровни генератора
  correct: 0
  id: 035-architecture-repairs-1
  fingerprint: 4e4025d6
- concept: Progressive GAN осваивает высокое разрешение через постепенное наращивание генератора и дискриминатора
  question: Расположи этапы обучения Progressive GAN в правильном порядке.
  explanation: Progressive GAN сначала изучает общую структуру на низком разрешении, а затем постепенно наращивает обе сети. Благодаря этому модели не приходится сразу решать задачу генерации всех мелких деталей.
  kind: order
  items:
    - Обучить генератор и дискриминатор на изображениях низкого разрешения
    - Добавить к обеим сетям слои для работы с более высоким разрешением
    - Продолжить обучение, осваивая более мелкие детали изображения
  id: 035-architecture-repairs-2
  fingerprint: e313bf75
- concept: StyleGAN разделяет управление признаками через mapping-сеть и подачу стилей на разные уровни генератора
  question: Объясни своими словами, почему подача отдельных параметров стиля на разные уровни генератора StyleGAN упрощает независимое изменение признаков изображения.
  explanation: В обычном генераторе признаки могут быть сильно перепутаны в одном латентном представлении. StyleGAN распределяет стилевое управление по уровням синтеза, отделяя влияние на крупную структуру от влияния на мелкие детали.
  kind: open
  reference: 'Mapping-сеть преобразует исходный латентный вектор в промежуточное представление стиля. Его параметры подаются на разные уровни генератора: уровни, формирующие крупную структуру, управляют общими признаками, а уровни мелких деталей — текстурой и локальными особенностями. Поэтому изменение одного признака меньше затрагивает остальные.'
  id: 035-architecture-repairs-3
  fingerprint: d03088c2
