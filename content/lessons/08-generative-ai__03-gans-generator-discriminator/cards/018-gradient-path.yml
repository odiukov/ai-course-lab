- concept: затухание градиента ванильной цели возникает в производной сигмоиды, а не в производной логарифма по вероятности
  question: Пусть p = σ(s) = 0,04, а ванильная цель генератора равна log(1 − p). Какой множитель цепного правила главным образом ослабляет градиент по логиту s?
  explanation: 'По вероятности наклон логарифма остаётся заметным: −1/(1 − p). Ослабление создаёт сигмоида: dp/ds = p(1 − p). Поэтому итоговая производная ванильной цели по логиту равна −p и становится малой при p, близком к нулю.'
  kind: choice
  options:
    - d log(1 − p)/dp, потому что при малом p он стремится к нулю
    - dp/ds = p(1 − p), потому что у насыщенной сигмоиды этот множитель мал
    - Производная логита по параметрам генератора, потому что она всегда равна нулю
    - Само значение log(1 − p), потому что значение функции всегда совпадает с её производной
  correct: 1
  id: 018-gradient-path-1
  fingerprint: bdf6da54
- concept: non-saturating потеря сохраняет сильный градиент по логиту при низкой оценке подделки
  question: Генератор минимизирует non-saturating потерю L = −log σ(s). Дискриминатор выдаёт для подделки вероятность p = 0,07. Чему равна производная dL/ds?
  explanation: Для non-saturating цели dL/ds = −(1 − p). Поэтому при p = 0,07 получаем −(1 − 0,07) = −0,93. Даже уверенно отвергнутая подделка даёт генератору почти полный градиент.
  kind: numeric
  answer: -0.93
  tolerance: 0.001
  id: 018-gradient-path-2
  fingerprint: dc9c60ee
