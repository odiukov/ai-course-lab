- concept: хорошие FID и IS не гарантируют покрытие всех мод распределения данных
  question: Генератор стабильно получает хорошие FID и IS, но может не создавать изображения редкой подкатегории. Объясни, почему метрики не исключают такую проблему и как её дополнительно проверить.
  explanation: Устойчивая агрегированная метрика ещё не подтверждает присутствие каждого варианта данных. Для обнаружения пропущенных поз, классов или подкатегорий нужна отдельная проверка покрытия мод.
  kind: open
  reference: 'FID и IS агрегируют свойства всей коллекции, поэтому хорошие средние показатели могут скрыть отсутствие редкой моды. Кроме того, IS не сравнивает генерацию с реальным набором напрямую. Покрытие важных мод нужно проверять отдельно: подсчитывать образцы по категориям, использовать разметку или просматривать стратифицированные выборки.'
  id: 036-evaluation-samples-2
  fingerprint: 79c6b83f
