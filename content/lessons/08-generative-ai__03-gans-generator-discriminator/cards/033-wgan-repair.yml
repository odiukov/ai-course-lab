- concept: оценка расстояния Вассерштейна вычисляется как разность средних баллов критика для настоящих и сгенерированных данных
  question: Критик WGAN поставил настоящим образцам баллы 4.2, 6.2 и 8.2, а сгенерированным — 1.4, 2.4 и 3.4. Чему равна оценка E[C(x)] − E[C(G(z))]?
  explanation: 'Средний балл настоящих образцов равен 6.2, а сгенерированных — 2.4. Их разность: 6.2 − 2.4 = 3.8.'
  kind: numeric
  answer: 3.8
  tolerance: 0.01
  id: 033-wgan-repair-1
  fingerprint: f5d65eaf
- concept: выход критика WGAN является вещественным баллом, а не вероятностью принадлежности к классу
  question: Как следует интерпретировать значение C(x), выдаваемое критиком WGAN?
  explanation: Критик WGAN не применяет сигмоиду и не решает задачу вероятностной классификации. Его вещественные баллы используются через разность средних значений на настоящих и сгенерированных образцах.
  kind: choice
  options:
    - Как вероятность того, что образец настоящий
    - Как вещественный балл, используемый для сравнения настоящего и сгенерированного распределений
    - Как номер класса изображения
    - Как вероятность ошибки генератора
  correct: 1
  id: 033-wgan-repair-2
  fingerprint: 490af766
- concept: липшицево ограничение критика обеспечивает ограниченную скорость изменения его оценок
  question: Объясни своими словами, зачем в WGAN ограничивать критика по Липшицу и как с этим связан gradient penalty.
  explanation: 'WGAN нужен достаточно гладкий критик: близкие входы не должны получать произвольно далёкие оценки. Gradient penalty служит способом приблизительно поддерживать это свойство во время обучения.'
  kind: open
  reference: Без ограничения критик мог бы менять баллы сколь угодно резко, поэтому разность средних не давала бы требуемого гладкого сигнала расстояния. Липшицево условие ограничивает скорость изменения оценки, а gradient penalty штрафует критика за нарушение ограничения на норму градиента.
  id: 033-wgan-repair-3
  fingerprint: 1617754a
