- concept: память батча GAN ограничивают временные активации, тогда как у авторегрессионной модели растёт состояние каждого запроса
  question: Объясни, почему при обслуживании множества запросов память GAN и авторегрессионной языковой модели масштабируется по-разному.
  explanation: Одношаговая генерация не требует сохранять историю запроса между последовательными итерациями. У авторегрессионного декодирования такая история представлена растущим KV-кэшем, который конкурирует за память с новыми запросами.
  kind: open
  reference: GAN выполняет один прямой проход, после которого временные активации можно освободить; постоянно нужны главным образом веса. Авторегрессионная модель хранит KV-кэш отдельно для каждого незавершённого запроса, причём его размер растёт с длиной последовательности. Поэтому батч GAN обычно ограничен активациями одного прохода, а конкурентность языковой модели — ещё и накопленным состоянием запросов.
  id: 040-production-inference-2
  fingerprint: 2afd8bcc
- concept: фиксированная стоимость независимых запросов GAN делает статический батчинг практичным
  question: Сервис обрабатывает независимые входы одинаковой формы, и каждый образец создаётся одним проходом GAN с практически одинаковым числом FLOPs. Какая стратегия обслуживания обычно наиболее уместна?
  explanation: Запросы GAN имеют предсказуемую фиксированную стоимость и завершаются вместе после одного прохода. Поэтому обычный статический батч хорошо загружает ускоритель, а сложный планировщик незавершённых последовательностей обычно не требуется.
  kind: choice
  options:
    - Собирать статические батчи под целевую загрузку ускорителя
    - Обязательно применять in-flight batching с заменой завершённых последовательностей
    - Разделять каждый запрос на стадии prefill и decode
    - Резервировать растущий KV-кэш для каждого активного запроса
