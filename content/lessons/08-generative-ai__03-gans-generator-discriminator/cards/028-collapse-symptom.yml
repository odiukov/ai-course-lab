- concept: mode collapse проявляется как потеря разнообразия при сохранении правдоподобия отдельных образцов
  question: Настоящие данные содержат несколько хорошо различимых мод. Генератор создаёт убедительные образцы, но почти все они принадлежат одной моде. Как точнее всего назвать эту проблему?
  explanation: При коллапсе мод генератор осваивает лишь часть распределения данных. Отдельные результаты могут выглядеть правдоподобно, однако разнообразие настоящих данных не воспроизводится.
  kind: choice
  options:
    - Переобучение дискриминатора на настоящих данных
    - Коллапс мод
    - Численная нестабильность сигмоиды
    - Исчезновение градиента из-за слишком большого батча
  correct: 1
  id: 028-collapse-symptom-1
  fingerprint: 9dd584e0
- concept: градиент генератора вычисляется в областях, которые генератор уже посещает, поэтому пропущенная мода может не давать прямого сигнала для её освоения
  question: Почему дискриминатор не обязательно возвращает генератор к пропущенной моде, даже если умеет распознавать настоящие образцы из неё?
  explanation: Дискриминатор может знать, что образцы пропущенной моды настоящие, но градиент генератора проходит через сгенерированные образцы. Когда подделки сосредоточены в другой области, сигнал преимущественно улучшает уже найденный тип результата.
  kind: open
  reference: Обновление генератора опирается на оценки и градиенты дискриминатора в точках, созданных самим генератором. Если генератор не выдаёт образцы в области пропущенной моды, там нет подделок, через которые мог бы прийти прямой обучающий сигнал. Поэтому обучение может продолжать улучшать уже освоенную моду.
  id: 028-collapse-symptom-2
  fingerprint: eebbe1c3
