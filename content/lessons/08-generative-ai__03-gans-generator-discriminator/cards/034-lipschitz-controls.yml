- concept: spectral normalization нормирует матрицу весов по её наибольшему сингулярному значению
  question: Чем нужно нормировать матрицу весов слоя, чтобы ограничить максимальное усиление входных различий?
  explanation: Наибольшее сингулярное значение показывает максимальный коэффициент растяжения вектора матрицей. Деление весов на эту величину ограничивает операторную норму слоя и тем самым сдерживает резкость всего критика.
  kind: cloze
  template: W_SN = W / ___
  answer: σ_max(W)
  accept:
    - наибольшее сингулярное значение W
    - спектральная норма W
    - '||W||₂'
