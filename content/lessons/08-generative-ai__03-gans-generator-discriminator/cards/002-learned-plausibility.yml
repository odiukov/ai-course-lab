- concept: дискриминатор создаёт обучаемый сигнал правдоподобия без явной формулы плотности данных
  question: Как GAN обучает генератор, если правдоподобие изображения нельзя вычислить по готовой формуле?
  explanation: Дискриминатор учится на реальных и сгенерированных примерах, а затем служит дифференцируемой оценкой правдоподобия. Генератор получает через него градиент, хотя явная формула log p(x) неизвестна.
  kind: choice
  options:
    - Сравнивает каждый результат с единственным ближайшим изображением из обучающей выборки
    - Назначает изображениям вручную составленные штрафы за отдельные визуальные дефекты
    - Передаёт генератору градиент от дискриминатора, обученного отличать реальные данные от сгенерированных
  correct: 2
  id: 002-learned-plausibility-1
  fingerprint: 9433cba6
- concept: в равновесии GAN дискриминатор не может определить происхождение образца
  question: Почему нейтральный ответ идеального дискриминатора не означает, что каждое изображение лишь частично настоящее?
  explanation: Дискриминатор решает задачу классификации источника. Когда реальные и сгенерированные распределения совпали, различить источники по изображению невозможно, поэтому остаются только априорные частоты классов.
  kind: open
  reference: В равновесии распределение генератора совпадает с распределением данных, поэтому внешний вид образца больше не сообщает, из какого источника он пришёл. При сбалансированной подаче реальных и сгенерированных примеров дискриминатор выражает неопределённость о происхождении, а не степень «настоящести» самого изображения.
  id: 002-learned-plausibility-2
  fingerprint: 3af7efa6
- concept: состязательное обучение поочерёдно улучшает дискриминатор и генератор
  question: Расположите действия одного цикла обучения GAN в логическом порядке.
  explanation: Сначала дискриминатор учится распознавать текущие подделки, затем его оценка используется для обновления генератора. После улучшения генератора появляются новые подделки, и критерий дискриминатора приходится уточнять.
  kind: order
  items:
    - Получить реальные образцы и сгенерировать подделки из случайных скрытых кодов
    - Обновить дискриминатор, усиливая различение реальных данных и подделок
    - Снова пропустить сгенерированные образцы через дискриминатор
    - Обновить генератор по сигналу дискриминатора так, чтобы подделки чаще принимались за реальные
  id: 002-learned-plausibility-3
  fingerprint: dda66b2f
