- concept: малый датасет повышает вероятность переобучения дискриминатора
  question: Какое наблюдение сильнее всего поддерживает гипотезу, что дискриминатор запоминает обучающие примеры вместо освоения обобщаемых признаков?
  explanation: На малом и однообразном датасете дискриминатору проще запомнить конкретные изображения. Тогда он может уверенно отличать их от генераций, не формируя полезный для генератора сигнал об общих свойствах данных.
  kind: choice
  options:
    - Обучающий датасет мал и содержит мало разнообразных примеров
    - Сетка сэмплов сохраняется через равные интервалы
    - Генератор получает новый латентный вектор для каждого сэмпла
    - Потери записываются после каждой эпохи
  correct: 0
  id: 041-debugger-protocol-1
  fingerprint: abfeedb3
- concept: диагностика GAN строится как ранжирование гипотез с контролируемой проверкой
  question: Расставьте этапы диагностики сломанного прогона GAN в правильном порядке.
  explanation: Сначала фиксируют симптом, затем собирают согласованные свидетельства и ранжируют объяснения. После этого проверяют ведущую гипотезу одной минимальной правкой, сохраняя seed, частоту снимков и точки сравнения, чтобы результат можно было связать именно с этой правкой.
  kind: order
  items:
    - Точно описать наблюдаемый симптом и момент его появления
    - Сопоставить кривые потерь, синхронные сетки сэмплов и размер датасета
    - Для каждой гипотезы записать подтверждения, противоречия и уровень уверенности, затем ранжировать причины
    - Выбрать минимальную правку, проверяющую наиболее вероятную причину
    - Перезапустить обучение в прежних контрольных условиях и сравнить результаты в тех же точках
  id: 041-debugger-protocol-2
  fingerprint: d0716f5f
