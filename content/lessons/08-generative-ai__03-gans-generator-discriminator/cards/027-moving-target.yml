- concept: обновление дискриминатора изменяет градиентное поле, по которому обучается генератор
  question: Почему задача генератора в GAN остаётся нестационарной, хотя формула его потери и целевая метка не меняются?
  explanation: Формальная цель генератора остаётся прежней, но поверхность этой цели определяется текущим дискриминатором. Обновление соперника перестраивает поверхность потерь и задаёт генератору новый обучающий сигнал.
  kind: open
  reference: Потеря генератора вычисляется через текущую версию дискриминатора. Когда параметры дискриминатора меняются, меняются его границы решений, чувствительность к признакам и градиент по сгенерированным образцам. Поэтому прежнее изменение генератора могло улучшать потерю, а после обучения дискриминатора полезным становится уже другое направление обновления.
