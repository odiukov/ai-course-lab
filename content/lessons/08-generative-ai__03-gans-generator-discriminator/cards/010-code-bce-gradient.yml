- concept: защитное ограничение вероятностей не должно изменять входной массив, необходимый последующим звеньям обратного прохода
  question: Почему при вычислении градиента BCE безопасные вероятности следует создавать в отдельном массиве, а не ограничивать входной массив p на месте?
  explanation: Ограничение вероятностей нужно для конечных знаменателей, но оно не должно создавать побочный эффект. Защищённая копия сохраняет исходный p для дальнейшего распространения градиента.
  kind: open
  reference: Изменение p на месте уничтожает исходные активации, которые могут понадобиться сигмоиде и другим операциям обратного прохода. Отдельный защищённый массив обеспечивает численную устойчивость вычисления BCE и сохраняет корректные данные для цепного правила.
  id: 010-code-bce-gradient-2
  fingerprint: 2b5fc3bc
