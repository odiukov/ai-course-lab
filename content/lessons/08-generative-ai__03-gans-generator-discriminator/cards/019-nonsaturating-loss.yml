- concept: градиент non-saturating loss естественно ослабевает по мере роста уверенности в качестве генерации
  question: Генератор обучается с non-saturating loss. Что происходит с производной потери по логиту, когда дискриминатор всё увереннее принимает сгенерированный образец за настоящий?
  explanation: 'Для non-saturating loss производная по логиту равна −(1−p). Когда p растёт и приближается к единице, модуль производной уменьшается: убедительная генерация требует менее сильной коррекции.'
  kind: choice
  options:
    - Производная приближается к нулю с отрицательной стороны, поэтому коррекция генератора ослабевает
    - Производная становится всё более отрицательной, поэтому коррекция генератора усиливается
    - Производная меняет знак, поэтому генератор начинает снижать оценку подделки
    - Производная остаётся постоянной при любой оценке дискриминатора
  correct: 0
  id: 019-nonsaturating-loss-1
  fingerprint: 78fecb33
- concept: ванильная и non-saturating цели сохраняют одинаковое предпочтение генератора по оценкам дискриминатора
  question: Почему переход от ванильной цели генератора к non-saturating loss не меняет желаемое направление обучения, хотя меняет величину градиента?
  explanation: Обе функции потерь убывают в нужном для генератора направлении при росте p. Однако при малом p ванильная форма даёт градиент по логиту −p, а non-saturating форма — −(1−p), поэтому траектория и скорость обучения различаются.
  kind: open
  reference: При минимизации обе цели побуждают генератор увеличивать D(G(z)), то есть добиваться того, чтобы дискриминатор чаще принимал подделки за настоящие. Различается не предпочитаемый результат, а сила обучающего сигнала в разных областях вероятности.
  id: 019-nonsaturating-loss-2
  fingerprint: 4c1d5018
