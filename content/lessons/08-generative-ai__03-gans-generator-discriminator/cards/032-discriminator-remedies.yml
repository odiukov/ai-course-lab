- concept: learning rate и архитектурная мощность управляют разными свойствами дискриминатора
  question: Объясни своими словами, чем снижение learning rate дискриминатора отличается от уменьшения числа его слоёв или каналов.
  explanation: 'Learning rate регулирует темп адаптации D: в материале предлагается уменьшить его в 2–5 раз. Число слоёв, каналов и параметров определяет мощность модели. Оба приёма могут ослабить D, но действуют через разные механизмы.'
  kind: open
  reference: Снижение learning rate замедляет изменение параметров дискриминатора, но сохраняет множество функций, которые он способен представить. Уменьшение числа слоёв или каналов ограничивает само это множество и не позволяет дискриминатору реализовать столь сложную границу разделения.
  id: 032-discriminator-remedies-2
