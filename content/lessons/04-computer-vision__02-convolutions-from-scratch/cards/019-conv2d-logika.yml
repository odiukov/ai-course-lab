- concept: наивная реализация свёртки служит эталоном корректности для оптимизированных реализаций
  question: Почему при разработке быстрой реализации свёртки полезно сохранять медленную версию с явными вложенными циклами?
  explanation: 'Прозрачная реализация с циклами удобна как ground truth: ускоренный алгоритм должен выдавать те же значения с учётом допустимой погрешности вычислений.'
  kind: open
  reference: Явная реализация непосредственно следует определению свёртки и легко проверяется по отдельным окнам. Её результат можно сравнивать с результатом оптимизированной версии, чтобы обнаруживать ошибки в индексах, границах и суммировании.
