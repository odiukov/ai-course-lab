- concept: модуль отклика сохраняет силу перепада, но уничтожает его направленность
  question: 'Две одинаково резкие границы имеют противоположные переходы яркости: от тёмного к светлому и от светлого к тёмному. Что произойдёт с информацией о них после взятия модуля отклика Sobel-x?'
  explanation: До взятия модуля одинаково сильные противоположные переходы различаются знаком отклика. После взятия модуля этот знак исчезает, и детектор показывает только резкость границы.
