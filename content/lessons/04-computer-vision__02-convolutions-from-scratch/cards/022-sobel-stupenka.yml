- concept: нулевая сумма коэффициентов Sobel-x подавляет области постоянной яркости
  question: Почему свёртка однородной области изображения с ядром Sobel-x даёт нулевой отклик, даже если все пиксели в этой области белые?
  explanation: Sobel-x измеряет изменение яркости, а не сам уровень яркости. В постоянной области вклады противоположных сторон ядра гасят друг друга; ненулевой отклик возникает там, где значения под ними различаются.
  kind: open
  reference: В однородном окне все пиксели имеют одинаковое значение. Поэтому результат равен этому значению, умноженному на сумму коэффициентов ядра. У Sobel-x положительные и отрицательные коэффициенты взаимно компенсируются, так что их сумма равна нулю.
  id: 022-sobel-stupenka-1
  fingerprint: 7466e87a
- concept: Sobel-x обнаруживает вертикальные границы через изменение яркости вдоль горизонтальной оси
  question: На изображении яркость резко меняется слева направо, а сама граница вытянута вертикально. Какой оператор даст сильный отклик на такую границу?
  explanation: Sobel-x оценивает изменение яркости вдоль горизонтальной оси. Поэтому он реагирует на переход слева направо, линия которого ориентирована вертикально.
  kind: choice
  options:
    - Sobel-x
    - Sobel-y
    - Фильтр равномерного размытия
  correct: 0
