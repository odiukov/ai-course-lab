- concept: нулевое дополнение задаёт значение вне границ входа, не изменяя исходные пиксели
  question: Что происходит, когда окно свёртки выходит за границу входа при zero padding?
  explanation: Zero padding добавляет вокруг входа временные нулевые значения. Исходные пиксели при этом не меняются, а ядро сохраняет свой полный размер даже у границы.
  kind: choice
  options:
    - Недостающие позиции считаются равными нулю, а исходные значения сохраняются
    - Недостающие позиции заполняются средним значением входа
    - Крайние пиксели переносятся внутрь входа
    - Окно автоматически уменьшается до доступной области
  correct: 0
  id: 013-padding-ramka-1
  fingerprint: 79deaad1
- concept: отклик свёртки на границе использует меньше реальных данных входа, чем отклик во внутренней области
  question: Объясни своими словами, чем различается состав окна свёртки у границы и в центре входа при zero padding.
  explanation: Нулевая рамка позволяет вычислять выход для крайних пикселей. Однако часть множителей там равна нулю и не содержит наблюдаемой информации, тогда как центральное окно целиком лежит на входе.
  kind: open
  reference: В центре все позиции окна соответствуют реальным значениям входа. У границы часть позиций приходится на нулевое дополнение, поэтому отклик можно вычислить, но он использует меньше реальной информации изображения.
  id: 013-padding-ramka-2
  fingerprint: 7eefcd3f
