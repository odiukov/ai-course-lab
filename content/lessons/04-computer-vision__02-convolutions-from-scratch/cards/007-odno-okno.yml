- concept: результат свёртки является знаковым откликом ядра, а не вероятностью
  question: В некотором окне изображения ядро получило большой отрицательный отклик. Что можно заключить без дополнительных сведений о выученных весах?
  explanation: Свёртка в одной позиции вычисляет взвешенную сумму, которая может иметь любой знак. Сама по себе она не является вероятностью, а интерпретация положительных и отрицательных откликов определяется выученными весами и последующими слоями.
  kind: choice
  options:
    - Искомый признак с уверенностью отсутствует
    - Сумма взвешенных значений отрицательна, но её точный смысл зависит от весов ядра
    - Вычисление ошибочно, потому что отклик свёртки не может быть отрицательным
    - Вероятность наличия признака близка к нулю
