- concept: padding не увеличивает теоретический receptive field
  question: Объясни своими словами, почему добавление padding не увеличивает теоретический receptive field активации.
  explanation: Padding меняет доступность граничных положений и содержимое области обзора у края, но не расширяет зависимость активации от реальных пикселей исходного изображения.
  kind: open
  reference: 'Размер теоретического receptive field определяется ядрами, strides и накопленным эффективным шагом. Padding лишь позволяет ядру выходить за границу изображения: соответствующая часть поля заполняется добавленными значениями, а не новыми пикселями исходного входа.'
  id: 049-receptive-field-fn-3
  fingerprint: 33dc6dff
