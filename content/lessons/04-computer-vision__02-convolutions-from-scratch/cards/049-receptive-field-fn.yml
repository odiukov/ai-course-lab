  fingerprint: c3deedb9
- concept: эффективный шаг последовательно умножается на stride каждого слоя
  question: Заполни оператор в формуле обновления эффективного шага.
  explanation: Stride разрежает соседние позиции относительно предыдущей карты признаков, поэтому расстояние между ними во входных пикселях умножается на stride текущего слоя.
