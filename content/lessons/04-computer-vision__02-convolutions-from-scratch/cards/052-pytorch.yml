- concept: для проверки эквивалентности ручной и библиотечной свёртки им нужны одинаковые веса и смещения
  question: Почему ручная свёртка и свёрточный слой PyTorch с одинаковыми kernel size, stride и padding могут выдать разные значения, и как провести корректное сравнение?
  explanation: Конфигурация слоя описывает геометрию операции, а конкретный результат зависит от коэффициентов фильтров и смещений. После переноса одинаковых параметров реализации должны дать практически совпадающие результаты.
  kind: open
  reference: Одинаковые гиперпараметры задают форму и способ перемещения окна, но не значения обучаемых параметров. Слой PyTorch обычно случайно инициализирует веса и смещения, поэтому для сравнения в него нужно скопировать параметры ручной реализации и подать тот же вход.
