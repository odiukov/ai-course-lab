- concept: отдельные срезы весов позволяют фильтру по-разному реагировать на входные каналы
  question: Пространственный рисунок сначала подан только в красный канал, а затем только в синий. Почему обученный свёрточный фильтр может дать разные отклики?
  explanation: Ядро 3×3 на RGB-входе содержит три среза 3×3. Эти срезы обучаются независимо, поэтому фильтр способен учитывать не только пространственный рисунок, но и канал, в котором он появился.
  kind: open
  reference: У фильтра есть отдельный набор весов для каждого входного канала. Поэтому одинаковый пространственный рисунок умножается на разные веса в красном и синем срезах и может дать разные суммы.
