- concept: выходной размер свёртки определяется размером входа, ядром, padding и stride
  question: Одномерный вход имеет длину 41, ширина ядра равна 11, padding — 7 с каждой стороны, а stride — 5. Какова длина выхода?
  explanation: Padding учитывается с обеих сторон. Доступный ядру путь делится на stride с округлением вниз, после чего учитывается начальная позиция ядра. Получается девять выходных ячеек.
  kind: numeric
  answer: 9
  tolerance: 0.001
  id: 009-formula-razmera-1
  fingerprint: 3bf64e43
- concept: округление вниз исключает неполное положение ядра, а дополнительная единица учитывает начальную позицию
  question: Почему в формуле выходного размера свёртки результат деления округляют вниз и затем добавляют единицу?
  explanation: Дробный остаток stride не образует допустимую позицию ядра, поэтому используется округление вниз. Начальная установка ядра тоже даёт результат и учитывается отдельно.
  kind: open
  reference: Округление вниз оставляет только целые перемещения, после которых ядро полностью помещается на входе. Единица нужна потому, что начальная позиция ядра уже создаёт выходную ячейку до первого перемещения.
  id: 009-formula-razmera-2
