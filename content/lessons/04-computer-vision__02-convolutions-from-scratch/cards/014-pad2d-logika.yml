- concept: многоточие в индексировании охватывает произвольное число ведущих осей
  question: Объясни, почему присваивание вида `out[..., h_slice, w_slice] = x` подходит и для матрицы, и для тензора с дополнительными ведущими осями.
  explanation: Запись `...` автоматически заменяет необходимое количество полных срезов по ведущим осям. Код индексирует явно только высоту и ширину и не зависит от того, сколько осей расположено перед ними.
  kind: open
  reference: Многоточие выбирает все ведущие оси целиком независимо от их количества, а явные срезы относятся к пространственным осям. Поэтому исходные значения помещаются внутрь рамки без изменения структуры ведущих осей.
