- concept: ускорение свёртки достигается параллельным выполнением арифметики и устранением накладных расходов интерпретируемых циклов
  question: Почему оптимизированная реализация многоканальной свёртки может быть намного быстрее наивных циклов Python, хотя вычисляет тот же результат?
  explanation: 'Математическая операция остаётся прежней. Выигрыш даёт организация вычислений: оптимизированные библиотеки и ускорители группируют и параллельно выполняют множество операций, тогда как вложенные циклы Python несут большие накладные расходы.'
  kind: choice
  options:
    - Она не учитывает отрицательные коэффициенты фильтров
    - Она выполняет множество операций параллельно и избегает вызова интерпретатора для каждой позиции
    - Она всегда создаёт меньше выходных элементов
    - Она заменяет умножения случайными приближениями
