- concept: blur ослабляет локальное отличие от окружения, а sharpen усиливает его
  question: Почему центральный пиксель, который светлее своего окружения, после blur становится менее заметным, а после sharpen — более заметным?
  explanation: В blur_3x3 все девять пикселей получают вес 1/9, и локальный выброс смешивается с окружением. В sharpen центр имеет вес 5, а четыре ближайших соседа — вес −1, поэтому разность между центром и окружением подчёркивается.
  kind: open
  reference: Blur усредняет центр с соседями, поэтому значение центра приближается к значениям окружения. Sharpen усиливает центр и вычитает вклад соседей, поэтому отличие центра от окружения возрастает.
  id: 024-bazovye-filtry-2
  fingerprint: 83ff3012
