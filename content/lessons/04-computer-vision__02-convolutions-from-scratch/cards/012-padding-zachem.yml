- concept: сжатие карты признаков без padding мешает прямому поэлементному сложению в residual connection
  question: Объясни своими словами, почему последовательность свёрток без padding может сделать identity shortcut в residual-блоке несовместимым с основной ветвью.
  explanation: Residual connection требует совпадения форм складываемых тензоров. Если основная ветвь сжимается, а shortcut остаётся неизменным, перед сложением приходится отдельно согласовывать их размеры.
  kind: open
  reference: Основная ветвь после свёрток без padding имеет меньшие высоту и ширину, а identity shortcut сохраняет исходную форму. Карты разных пространственных размеров нельзя напрямую сложить поэлементно.
