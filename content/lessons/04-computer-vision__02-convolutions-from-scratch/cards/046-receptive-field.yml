- concept: активация зависит только от входных элементов внутри своего поля восприятия
  question: Параметры свёрточной сети зафиксированы, а во входном изображении изменили только пиксель за пределами поля восприятия выбранной активации. Что произойдёт с этой активацией?
  explanation: Поле восприятия включает все элементы входа, от которых по вычислительному графу зависит активация. Изменение за его пределами не может до неё распространиться; изменение внутри поля может повлиять на результат, хотя не обязано, например из-за нулевых весов.
  kind: choice
  options:
    - Она обязательно увеличится
    - Она обязательно уменьшится
    - Она не изменится
    - Она станет равна изменённому пикселю
  correct: 2
  id: 046-receptive-field-1
  fingerprint: 393b3b78
- concept: пространственный размер поля восприятия не умножается на число входных каналов
  question: Объясни своими словами, как следует понимать поле восприятия активации свёртки, если вход содержит несколько каналов.
  explanation: Свёрточное ядро перемещается по пространственным осям, одновременно охватывая всю глубину входа. Поэтому каналы увеличивают число участвующих значений, но не размер видимой области по высоте и ширине.
  kind: open
  reference: Поле восприятия описывает связанную с активацией пространственную область входа. В каждой пространственной позиции этой области свёртка использует значения всех входных каналов, но добавление каналов само по себе не расширяет пространственные границы поля.
  id: 046-receptive-field-2
  fingerprint: 74951be5
