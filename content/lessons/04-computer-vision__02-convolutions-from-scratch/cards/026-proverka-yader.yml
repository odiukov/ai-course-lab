- concept: сумма весов определяет отклик на однородное окно, но не пространственную избирательность ядра
  question: У нескольких свёрточных ядер одинаковая сумма весов. Что это позволяет заключить об их откликах и почему этого недостаточно, чтобы определить назначение каждого ядра?
  explanation: Сумма коэффициентов описывает реакцию ядра на постоянную яркость. Размытие, повышение резкости и копирование пикселя могут сохранять одинаковый общий уровень, но по-разному смешивать центр с соседями.
  kind: open
  reference: 'На однородном окне такие ядра дадут одинаковый отклик, потому что он зависит только от яркости окна и суммы весов. На неоднородном окне результаты могут различаться: назначение фильтра определяется также расположением положительных, отрицательных и нулевых коэффициентов.'
