- concept: промежуточная нелинейность не позволяет свернуть весь блок в один линейный оператор
  question: Почему блок «свёртка → ReLU → свёртка» в общем случае нельзя заменить единственной свёрткой с тем же полем восприятия без изменения вычисляемой функции?
  explanation: Без промежуточной активации последовательность свёрток остаётся линейным преобразованием. ReLU между двумя свёртками 3×3 добавляет зависимое от входа преобразование, которого нет у одной свёртки 5×5.
  kind: open
  reference: ReLU нелинейно обнуляет часть промежуточных откликов в зависимости от входа. Поэтому весь блок является нелинейным отображением, тогда как единственная свёртка выполняет только линейное или, при наличии смещения, аффинное преобразование.
  id: 051-dva-tri-protiv-pyati-2
