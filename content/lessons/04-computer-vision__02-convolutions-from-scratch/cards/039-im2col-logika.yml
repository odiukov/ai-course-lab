- concept: построчный обход положений окна задаёт линейный индекс столбца im2col
  question: Заполни формулу индекса столбца cols для положения окна с координатами i и j при построчном обходе.
  explanation: Перед строкой i уже записано i полных рядов по w_out положений, а внутри текущего ряда перед окном находится j столбцов.
  kind: cloze
  template: col = ___
  answer: i * w_out + j
  accept:
    - i*w_out+j
    - j + i*w_out
    - j+i*w_out
  id: 039-im2col-logika-2
  fingerprint: 3365feff
