- concept: каждый свёрточный фильтр разворачивается в отдельную строку матрицы весов
  question: Тензор весов свёртки имеет форму `(C_out, C_in, K_h, K_w)`. Матрица окон содержит по одному развёрнутому окну в каждом столбце. Какую форму должна иметь матрица весов, чтобы её можно было умножить на матрицу окон и получить по строке на каждый выходной канал?
  explanation: Каждый из `C_out` фильтров охватывает все входные каналы и пространственные координаты ядра. Поэтому его веса образуют одну строку длины `C_in · K_h · K_w`, совпадающей с высотой матрицы окон.
  kind: choice
  options:
    - '`(C_out, C_in · K_h · K_w)`'
    - '`(C_in, C_out · K_h · K_w)`'
    - '`(C_in · K_h · K_w, C_out)`'
  correct: 0
  id: 042-matmul-formy-1
  fingerprint: c3220c0d
- concept: после матричного умножения reshape только восстанавливает пространственные оси выходной карты
  question: После умножения матрицы фильтров на матрицу окон получена таблица формы `(C_out, P)`. Объясни, при каких условиях её можно преобразовать в тензор формы `(C_out, H_out, W_out)` без изменения вычисленных откликов.
  explanation: Матричное умножение уже вычислило все отклики. Операция `reshape` только заменяет линейный индекс позиции парой пространственных индексов, поэтому ей нужны правильное число позиций и согласованный порядок столбцов.
  kind: open
  reference: Число столбцов `P` должно равняться `H_out · W_out`, а столбцы должны идти в том же порядке, в котором позиции раскладываются по высоте и ширине. Такое преобразование лишь меняет представление индексов и не выполняет новой арифметики.
  id: 042-matmul-formy-2
  fingerprint: b87158ce
