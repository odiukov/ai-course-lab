<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как ядро движется по изображению</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #64748b;
      --grid: #94a3b8;
      --input: #dbeafe;
      --input-alt: #eff6ff;
      --kernel: #f59e0b55;
      --kernel-line: #d97706;
      --route: #2563eb;
      --reset: #7c3aed;
      --output: #bbf7d0;
      --output-line: #16a34a;
      --label-pad: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: var(--label-pad);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: var(--label-pad);
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    h1 {
      margin: var(--label-pad);
      font-size: 22px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
      font-size: 14px;
    }

    .section-title {
      font-size: 17px;
      font-weight: bold;
    }

    .small {
      font-size: 12px;
      fill: var(--muted);
    }

    .input-cell {
      fill: var(--input-alt);
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .input-cell.alt {
      fill: var(--input);
    }

    .kernel-window {
      fill: var(--kernel);
      stroke: var(--kernel-line);
      stroke-width: 3px;
    }

    .route {
      fill: none;
      stroke: var(--route);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .reset-route {
      fill: none;
      stroke: var(--reset);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .output-cell {
      fill: var(--output);
      stroke: var(--output-line);
      stroke-width: 2px;
    }

    .output-dot {
      fill: var(--output-line);
    }

    .swatch-input {
      fill: var(--input);
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .swatch-kernel {
      fill: var(--kernel);
      stroke: var(--kernel-line);
      stroke-width: 2px;
    }

    #error {
      margin: var(--label-pad);
      color: #b91c1c;
      font-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0f172a;
        --panel: #111827;
        --ink: #e5edf8;
        --muted: #a8b5c8;
        --grid: #64748b;
        --input: #1e4f7a;
        --input-alt: #183653;
        --kernel: #f59e0b55;
        --kernel-line: #fbbf24;
        --route: #60a5fa;
        --reset: #c084fc;
        --output: #14532d;
        --output-line: #4ade80;
      }

      #error {
        color: #fca5a5;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Как ядро движется по изображению</h1>
    <svg
      id="diagram"
      viewBox="0 0 1000 440"
      width="1000"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Девять положений ядра 3×3 на изображении 5×5</title>
      <desc id="svg-description">
        Ядро проходит три положения слева направо, возвращается влево,
        опускается на один пиксель и повторяет проход. Девять допустимых
        положений образуют выход 3×3.
      </desc>
    </svg>
    <p id="error" hidden>
      Здесь должна быть схема: ядро 3×3 занимает девять допустимых положений
      на входе 5×5 и образует выход 3×3.
    </p>
  </figure>

  <script>
    const data = [
      {
        zero: 0,
        one: 1,
        two: 2,
        input: 5,
        kernel: 3,
        stride: 1,
        positions: 9,
        valid: 3
      },
      {
        panelX: [5, 17, 29],
        panelY: [8, 21, 34],
        panelCell: 1.35,
        outputX: 53,
        outputY: 17,
        outputCell: 3.2,
        legendX: 70,
        legendY: 14,
        legendRows: [19, 25, 31, 37],
        sectionY: 3,
        arrowSize: 0.85,
        dotRadius: 0.28,
        swatchSize: 2.2,
        dashOn: 0.75,
        dashOff: 0.5,
        routeGap: 0.6,
        resetOuterX: 42,
        resetInnerX: 2.5,
        outputArrowStart: 38,
        outputArrowEnd: 50,
        outputArrowY: 18,
        outputLabelY: 16,
        legendTextX: 75,
        legendRouteEndX: 74,
        legendRouteStartX: 69.5,
        legendKernelX: 70,
        legendInputX: 70,
        legendCellX: 70,
        legendCellInset: 0.55,
        legendCellDotX: 71.1,
        labelX: 22,
        noteY: 42.5,
        noteLeftX: 5,
        noteRightX: 95
      }
    ];
    const origin = Object.freeze({ x: 22, y: 16 });
    const scale = Object.freeze({ x: 9.45, y: 9.2 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const [spec, layout] = data;
    const svg = document.getElementById("diagram");
    const error = document.getElementById("error");
    const NS = "http://www.w3.org/2000/svg";
    const LABEL_PAD = 6;

    function element(name, attributes, className) {
      const node = document.createElementNS(NS, name);
      if (className) node.setAttribute("class", className);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      return node;
    }

    function append(parent, name, attributes, className) {
      const node = element(name, attributes, className);
      parent.appendChild(node);
      return node;
    }

    function rect(parent, x, y, width, height, className) {
      return append(parent, "rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y)
      }, className);
    }

    function line(parent, x1, y1, x2, y2, className) {
      return append(parent, "line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2)
      }, className);
    }

    function text(parent, value, x, y, anchor, className, dx, dy) {
      const node = append(parent, "text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor,
        dx: dx,
        dy: dy
      }, className);
      node.textContent = value;
      return node;
    }

    function arrowHead(parent, fromX, fromY, toX, toY, className) {
      const angle = Math.atan2(toY - fromY, toX - fromX);
      const size = layout.arrowSize;
      const wing = size;
      const leftX = toX - size * Math.cos(angle) + wing * Math.sin(angle);
      const leftY = toY - size * Math.sin(angle) - wing * Math.cos(angle);
      const rightX = toX - size * Math.cos(angle) - wing * Math.sin(angle);
      const rightY = toY - size * Math.sin(angle) + wing * Math.cos(angle);

      append(parent, "polygon", {
        points: [
          `${sx(toX)},${sy(toY)}`,
          `${sx(leftX)},${sy(leftY)}`,
          `${sx(rightX)},${sy(rightY)}`
        ].join(" ")
      }, className);
    }

    function arrow(parent, x1, y1, x2, y2, className) {
      line(parent, x1, y1, x2, y2, className);
      arrowHead(parent, x1, y1, x2, y2, className);
    }

    function curvedReset(parent, startX, startY, endX, endY) {
      const controlY = (startY + endY) / spec.two;
      const path = append(parent, "path", {
        d: [
          `M ${sx(startX)} ${sy(startY)}`,
          `C ${sx(layout.resetOuterX)} ${sy(controlY)}`,
          `${sx(layout.resetInnerX)} ${sy(controlY)}`,
          `${sx(endX)} ${sy(endY)}`
        ].join(" "),
        "stroke-dasharray": [
          sx(layout.dashOn) - sx(spec.zero),
          sx(layout.dashOff) - sx(spec.zero)
        ].join(" ")
      }, "reset-route");
      path.setAttribute("fill", "none");
      arrowHead(
        parent,
        layout.resetInnerX,
        controlY,
        endX,
        endY,
        "reset-route"
      );
    }

    function drawInputSnapshot(parent, x, y, kernelColumn, kernelRow) {
      Array.from({ length: spec.input }).forEach((unusedRow, row) => {
        Array.from({ length: spec.input }).forEach((unusedColumn, column) => {
          const alternate = (row + column) % spec.two === spec.zero;
          rect(
            parent,
            x + column * layout.panelCell,
            y + row * layout.panelCell,
            layout.panelCell,
            layout.panelCell,
            alternate ? "input-cell alt" : "input-cell"
          );
        });
      });

      rect(
        parent,
        x + kernelColumn * layout.panelCell,
        y + kernelRow * layout.panelCell,
        spec.kernel * layout.panelCell,
        spec.kernel * layout.panelCell,
        "kernel-window"
      );
    }

    function drawOutput(parent) {
      Array.from({ length: spec.valid }).forEach((unusedRow, row) => {
        Array.from({ length: spec.valid }).forEach((unusedColumn, column) => {
          const x = layout.outputX + column * layout.outputCell;
          const y = layout.outputY + row * layout.outputCell;
          rect(
            parent,
            x,
            y,
            layout.outputCell,
            layout.outputCell,
            "output-cell"
          );
          append(parent, "circle", {
            cx: sx(x + layout.outputCell / spec.two),
            cy: sy(y + layout.outputCell / spec.two),
            r: sx(x + layout.dotRadius) - sx(x)
          }, "output-dot");
        });
      });
    }

    function drawLegend(parent) {
      text(
        parent,
        "Маршрут ядра 3×3",
        layout.legendX,
        layout.legendY,
        "start",
        "section-title",
        LABEL_PAD,
        spec.zero
      );

      rect(
        parent,
        layout.legendInputX,
        layout.legendRows[spec.zero] - layout.swatchSize / spec.two,
        layout.swatchSize,
        layout.swatchSize,
        "swatch-input"
      );
      text(
        parent,
        "входное изображение 5×5",
        layout.legendTextX,
        layout.legendRows[spec.zero],
        "start",
        "",
        LABEL_PAD,
        LABEL_PAD / spec.two
      );

      rect(
        parent,
        layout.legendKernelX,
        layout.legendRows[spec.one] - layout.swatchSize / spec.two,
        layout.swatchSize,
        layout.swatchSize,
        "swatch-kernel"
      );
      text(
        parent,
        "одно и то же ядро 3×3",
        layout.legendTextX,
        layout.legendRows[spec.one],
        "start",
        "",
        LABEL_PAD,
        LABEL_PAD / spec.two
      );

      arrow(
        parent,
        layout.legendRouteStartX,
        layout.legendRows[spec.two],
        layout.legendRouteEndX,
        layout.legendRows[spec.two],
        "route"
      );
      text(
        parent,
        "шаг вправо: 1 пиксель",
        layout.legendTextX,
        layout.legendRows[spec.two],
        "start",
        "",
        LABEL_PAD,
        LABEL_PAD / spec.two
      );

      rect(
        parent,
        layout.legendCellX,
        layout.legendRows[spec.valid] - layout.swatchSize / spec.two,
        layout.swatchSize,
        layout.swatchSize,
        "output-cell"
      );
      append(parent, "circle", {
        cx: sx(layout.legendCellDotX),
        cy: sy(layout.legendRows[spec.valid]),
        r: sx(layout.legendCellX + layout.dotRadius) -
          sx(layout.legendCellX)
      }, "output-dot");
      text(
        parent,
        "одна остановка → одна ячейка",
        layout.legendTextX,
        layout.legendRows[spec.valid],
        "start",
        "",
        LABEL_PAD,
        LABEL_PAD / spec.two
      );
    }

    try {
      const layer = append(svg, "g", {
        "aria-hidden": "true"
      });

      text(
        layer,
        "Вход 5×5 · 9 допустимых положений",
        layout.panelX[spec.zero],
        layout.sectionY,
        "start",
        "section-title",
        spec.zero,
        LABEL_PAD
      );

      layout.panelY.forEach((panelY, kernelRow) => {
        layout.panelX.forEach((panelX, kernelColumn) => {
          drawInputSnapshot(
            layer,
            panelX,
            panelY,
            kernelColumn,
            kernelRow
          );
        });

        const middleY =
          panelY + spec.input * layout.panelCell / spec.two;

        layout.panelX.slice(spec.one).forEach((panelX, index) => {
          const previousX = layout.panelX[index];
          const previousRight =
            previousX + spec.input * layout.panelCell;
          arrow(
            layer,
            previousRight + layout.routeGap,
            middleY,
            panelX - layout.routeGap,
            middleY,
            "route"
          );
        });
      });

      const firstMiddleY =
        layout.panelY[spec.zero] +
        spec.input * layout.panelCell / spec.two;
      text(
        layer,
        "шаг 1 пиксель",
        (layout.panelX[spec.zero] + spec.input * layout.panelCell +
          layout.panelX[spec.one]) / spec.two,
        firstMiddleY,
        "middle",
        "small",
        spec.zero,
        -LABEL_PAD
      );

      layout.panelY.slice(spec.zero, spec.two).forEach((panelY, row) => {
        const nextY = layout.panelY[row + spec.one];
        curvedReset(
          layer,
          layout.panelX[spec.two] + spec.input * layout.panelCell,
          panelY + spec.input * layout.panelCell,
          layout.panelX[spec.zero],
          nextY
        );
      });

      text(
        layer,
        "у края: влево и вниз на 1 пиксель",
        layout.labelX,
        (layout.panelY[spec.zero] + spec.input * layout.panelCell +
          layout.panelY[spec.one]) / spec.two,
        "middle",
        "small",
        spec.zero,
        LABEL_PAD
      );

      text(
        layer,
        "Выход 3×3",
        layout.outputX,
        layout.legendY,
        "start",
        "section-title",
        spec.zero,
        spec.zero
      );
      drawOutput(layer);

      arrow(
        layer,
        layout.outputArrowStart,
        layout.outputArrowY,
        layout.outputArrowEnd,
        layout.outputArrowY,
        "route"
      );
      text(
        layer,
        "9 остановок",
        (layout.outputArrowStart + layout.outputArrowEnd) / spec.two,
        layout.outputLabelY,
        "middle",
        "small",
        spec.zero,
        -LABEL_PAD
      );

      drawLegend(layer);

      line(
        layer,
        layout.noteLeftX,
        layout.noteY,
        layout.noteRightX,
        layout.noteY,
        "route"
      );
      text(
        layer,
        "Ядро занимает 3×3, но каждый раз сдвигается только на 1 пиксель",
        (layout.noteLeftX + layout.noteRightX) / spec.two,
        layout.noteY,
        "middle",
        "",
        spec.zero,
        -LABEL_PAD
      );
    } catch (failure) {
      svg.setAttribute("hidden", "");
      error.hidden = false;
    }
  </script>
</body>
</html>
