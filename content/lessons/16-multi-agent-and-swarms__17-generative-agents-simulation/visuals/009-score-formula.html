<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как три сигнала складываются в оценку воспоминания</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f8fafc;
  --panel: #ffffff;
  --panel-soft: #f1f5f9;
  --ink: #172033;
  --muted: #5d687b;
  --line: #cbd5e1;
  --line-strong: #8491a5;
  --recency: #c65300;
  --recency-bg: #fff0df;
  --importance: #7139b6;
  --importance-bg: #f3eaff;
  --relevance: #087f73;
  --relevance-bg: #ddf7f2;
  --winner: #167342;
  --winner-bg: #e2f6e9;
  --arrow: #64748b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --panel: #182235;
    --panel-soft: #202c40;
    --ink: #edf3fb;
    --muted: #b3bfd0;
    --line: #3d4d64;
    --line-strong: #718198;
    --recency: #ffad62;
    --recency-bg: #442b1d;
    --importance: #d3a8ff;
    --importance-bg: #352547;
    --relevance: #63d9cb;
    --relevance-bg: #173b39;
    --winner: #75d99d;
    --winner-bg: #173c2b;
    --arrow: #9aabc1;
  }
}
html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
h1 {
  font-size: 20px;
  text-align: center;
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 430px;
  background: var(--bg);
}
text {
  fill: var(--ink);
}
.frame {
  fill: var(--panel);
  stroke: var(--line);
  stroke-width: 2px;
}
.soft {
  fill: var(--panel-soft);
  stroke: var(--line);
  stroke-width: 2px;
}
.recency {
  fill: var(--recency-bg);
  stroke: var(--recency);
  stroke-width: 2px;
}
.importance {
  fill: var(--importance-bg);
  stroke: var(--importance);
  stroke-width: 2px;
}
.relevance {
  fill: var(--relevance-bg);
  stroke: var(--relevance);
  stroke-width: 2px;
}
.winner {
  fill: var(--winner-bg);
  stroke: var(--winner);
  stroke-width: 2px;
}
.rule, .route {
  fill: none;
  stroke: var(--line-strong);
  stroke-width: 2px;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.route {
  stroke: var(--arrow);
}
.arrowhead {
  fill: var(--arrow);
}
.recency-text {
  fill: var(--recency);
}
.importance-text {
  fill: var(--importance);
}
.relevance-text {
  fill: var(--relevance);
}
.winner-text {
  fill: var(--winner);
}
.muted {
  fill: var(--muted);
}
.title {
  font-size: 17px;
  font-weight: bold;
}
.formula {
  font-size: 14px;
  font-weight: bold;
}
.body {
  font-size: 16px;
}
.small {
  font-size: 13px;
}
.tiny {
  font-size: 12px;
}
.strong {
  font-weight: bold;
}
#fallback {
  font-size: 16px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--line);
}
</style>
</head>
<body>
<main>
  <h1>Как три сигнала складываются в оценку воспоминания</h1>
  <svg id="scheme" viewBox="0 0 1200 430" width="1200" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Взвешенная оценка воспоминаний</title>
    <desc id="svg-desc">Три цветных слагаемых — свежесть, важность и смысловая уместность — образуют score. После сортировки план праздника получает 2,0, разговор о погоде 1,3, и лучшие записи попадают в top-k.</desc>
    <g id="diagram"></g>
  </svg>
  <div id="fallback" hidden>Схема должна была показать три взвешенных сигнала, их сумму score и переход лучших воспоминаний в top-k.</div>
  <noscript><p>Схема должна была показать три взвешенных сигнала, их сумму score и переход лучших воспоминаний в top-k.</p></noscript>
</main>
<script>
const data = Object.freeze([{
  kind: "layout",
  zero: 0,
  originX: 0,
  originY: 0,
  scale: 1,
  radius: 9,
  heading: {x: 25, y: 20, text: "Оценка одной записи"},
  score: {x: 25, y: 36, w: 112, h: 64, cx: 81, a: 60, b: 82},
  equals: {x: 156, y: 68},
  terms: [
    {x: 180, y: 36, w: 248, h: 64, cx: 304, a: 59, b: 82, cls: "recency", textCls: "recency-text", formula: "w_recency × exp(−decay × age)", label: "свежесть R"},
    {x: 458, y: 36, w: 230, h: 64, cx: 573, a: 59, b: 82, cls: "importance", textCls: "importance-text", formula: "w_importance × importance", label: "важность I"},
    {x: 718, y: 36, w: 244, h: 64, cx: 840, a: 59, b: 82, cls: "relevance", textCls: "relevance-text", formula: "w_relevance × cos_sim", label: "уместность L"}
  ],
  pluses: [{x: 443, y: 68}, {x: 703, y: 68}],
  topArrow: {
    points: [{x: 974, y: 68}, {x: 1028, y: 68}],
    head: [{x: 1038, y: 68}, {x: 1026, y: 60}, {x: 1026, y: 76}],
    label: {x: 1001, y: 49}
  },
  topk: {x: 1042, y: 36, w: 133, h: 64, cx: 1108, a: 60, b: 82},
  divider: [{x: 25, y: 119}, {x: 1175, y: 119}],
  examplesTitle: {x: 25, y: 141},
  weights: {x: 1175, y: 141},
  memories: [
    {
      box: {x: 25, y: 158, w: 690, h: 100},
      title: {x: 45, y: 182, text: "Разговор о погоде"},
      time: {x: 692, y: 182, text: "5 минут назад"},
      terms: [
        {x: 45, y: 216, text: "1 × 0,9", cls: "recency-text"},
        {x: 180, y: 216, text: "+ 0,1 × 2", cls: "importance-text"},
        {x: 335, y: 216, text: "+ 1 × 0,2", cls: "relevance-text"}
      ],
      captions: [
        {x: 45, y: 242, text: "свежесть", cls: "recency-text"},
        {x: 205, y: 242, text: "важность", cls: "importance-text"},
        {x: 365, y: 242, text: "уместность", cls: "relevance-text"}
      ],
      score: {x: 565, y: 196, w: 112, h: 40, cx: 621, cy: 216, text: "= 1,3"}
    },
    {
      box: {x: 25, y: 270, w: 690, h: 100},
      title: {x: 45, y: 294, text: "План: праздник Изабеллы"},
      time: {x: 692, y: 294, text: "записан утром"},
      terms: [
        {x: 45, y: 328, text: "1 × 0,3", cls: "recency-text"},
        {x: 180, y: 328, text: "+ 0,1 × 8", cls: "importance-text"},
        {x: 335, y: 328, text: "+ 1 × 0,9", cls: "relevance-text"}
      ],
      captions: [
        {x: 45, y: 354, text: "свежесть", cls: "recency-text"},
        {x: 205, y: 354, text: "важность", cls: "importance-text"},
        {x: 365, y: 354, text: "уместность", cls: "relevance-text"}
      ],
      score: {x: 565, y: 308, w: 112, h: 40, cx: 621, cy: 328, text: "= 2,0"}
    }
  ],
  routes: [
    {
      points: [{x: 715, y: 216}, {x: 760, y: 216}, {x: 760, y: 310}, {x: 825, y: 310}],
      head: [{x: 835, y: 310}, {x: 824, y: 302}, {x: 824, y: 318}]
    },
    {
      points: [{x: 715, y: 328}, {x: 785, y: 328}, {x: 785, y: 228}, {x: 825, y: 228}],
      head: [{x: 835, y: 228}, {x: 824, y: 220}, {x: 824, y: 236}]
    }
  ],
  ranking: {
    box: {x: 835, y: 158, w: 340, h: 212},
    title: {x: 855, y: 182},
    first: {x: 855, y: 200, w: 300, h: 64, titleX: 872, titleY: 225, scoreX: 1137, scoreY: 225, hintX: 872, hintY: 247},
    second: {x: 855, y: 278, w: 300, h: 64, titleX: 872, titleY: 303, scoreX: 1137, scoreY: 303, hintX: 872, hintY: 325},
    footer: {x: 1005, y: 357}
  },
  conclusion: {x: 25, y: 389, w: 1150, h: 29, cx: 600, cy: 404}
}]);

const layout = data.find(item => item.kind === "layout");
const origin = Object.freeze({x: layout.originX, y: layout.originY});
const scale = layout.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("scheme");
  const root = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  const make = (name, cls) => {
    const node = document.createElementNS(ns, name);
    if (cls) node.setAttribute("class", cls);
    root.appendChild(node);
    return node;
  };

  const box = (o, cls) => {
    const node = make("rect", cls);
    node.setAttribute("x", sx(o.x));
    node.setAttribute("y", sy(o.y));
    node.setAttribute("width", sx(o.x + o.w) - sx(o.x));
    node.setAttribute("height", sy(o.y + o.h) - sy(o.y));
    node.setAttribute("rx", sx(o.x + layout.radius) - sx(o.x));
    node.setAttribute("ry", sy(o.y + layout.radius) - sy(o.y));
    return node;
  };

  const label = (o, cls, anchor, content) => {
    const node = make("text", cls);
    node.setAttribute("x", sx(o.x));
    node.setAttribute("y", sy(o.y));
    node.setAttribute("text-anchor", anchor);
    node.setAttribute("dominant-baseline", "middle");
    node.textContent = content === undefined ? o.text : content;
    return node;
  };

  const segment = (points, cls, name) => {
    const node = make(name, cls);
    node.setAttribute("points", points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "));
    return node;
  };

  const route = o => {
    segment(o.points, "route", "polyline");
    segment(o.head, "arrowhead", "polygon");
  };

  label(layout.heading, "title", "start");
  box(layout.score, "soft");
  label({x: layout.score.cx, y: layout.score.a}, "body strong", "middle", "score");
  label({x: layout.score.cx, y: layout.score.b}, "tiny muted", "middle", "итог");
  label(layout.equals, "title", "middle", "=");

  layout.terms.forEach(term => {
    box(term, term.cls);
    label({x: term.cx, y: term.a}, `formula ${term.textCls}`, "middle", term.formula);
    label({x: term.cx, y: term.b}, `tiny ${term.textCls}`, "middle", term.label);
  });

  layout.pluses.forEach(point => label(point, "title", "middle", "+"));
  route(layout.topArrow);
  label(layout.topArrow.label, "tiny muted", "middle", "сортировка");
  box(layout.topk, "winner");
  label({x: layout.topk.cx, y: layout.topk.a}, "body strong winner-text", "middle", "top-k");
  label({x: layout.topk.cx, y: layout.topk.b}, "tiny winner-text", "middle", "лучшие");

  segment(layout.divider, "rule", "polyline");
  label(layout.examplesTitle, "title", "start", "Два воспоминания при одинаковых весах");
  label(layout.weights, "small muted", "end", "веса: 1 · 0,1 · 1");

  layout.memories.forEach(memory => {
    box(memory.box, "frame");
    label(memory.title, "body strong", "start");
    label(memory.time, "small muted", "end");
    memory.terms.forEach(term => label(term, `body strong ${term.cls}`, "start"));
    memory.captions.forEach(caption => label(caption, `tiny ${caption.cls}`, "start"));
    box(memory.score, "soft");
    label({x: memory.score.cx, y: memory.score.cy}, "body strong", "middle", memory.score.text);
  });

  layout.routes.forEach(route);

  box(layout.ranking.box, "frame");
  label(layout.ranking.title, "title", "start", "После сортировки по score");

  box(layout.ranking.first, "winner");
  label({x: layout.ranking.first.titleX, y: layout.ranking.first.titleY}, "body strong", "start", "Праздник Изабеллы");
  label({x: layout.ranking.first.scoreX, y: layout.ranking.first.scoreY}, "body strong winner-text", "end", "score 2,0");
  label({x: layout.ranking.first.hintX, y: layout.ranking.first.hintY}, "tiny winner-text", "start", "выше в списке");

  box(layout.ranking.second, "soft");
  label({x: layout.ranking.second.titleX, y: layout.ranking.second.titleY}, "body strong", "start", "Разговор о погоде");
  label({x: layout.ranking.second.scoreX, y: layout.ranking.second.scoreY}, "body strong", "end", "score 1,3");
  label({x: layout.ranking.second.hintX, y: layout.ranking.second.hintY}, "tiny muted", "start", "ниже в списке");

  label(layout.ranking.footer, "small strong", "middle", "top-k → в текущий промпт");

  box(layout.conclusion, "soft");
  label({x: layout.conclusion.cx, y: layout.conclusion.cy}, "small strong", "middle",
    "Ни один сигнал не выбирает запись сам — решает взвешенная сумма.");
} catch (error) {
  const svg = document.getElementById("scheme");
  const fallback = document.getElementById("fallback");
  if (svg) svg.hidden = true;
  if (fallback) {
    fallback.hidden = false;
    fallback.textContent = "Схема должна была показать три взвешенных сигнала, их сумму score и переход лучших воспоминаний в top-k.";
  }
}
</script>
</body>
</html>
