- concept: 'распределение ролей общественного стека по владельцам: измерение, публичность, обязательные правила, технические ограничители'
  question: Кто в общественном стеке защиты отвечает за независимое измерение того, на что модель реально способна?
  explanation: У каждого слоя свой вопрос. Гражданское общество выносит проблему в публичное поле, государство устанавливает обязательность, практики ставят ограничители в коде, а измерение возможностей — задача внешнего оценщика. Роли не взаимозаменяемы, поэтому один владелец не закрывает стек.
  kind: choice
  options:
    - Внешние оценщики вроде METR — измерение проводит сторона, не подчинённая разработчику
    - Гражданское общество, потому что оно публикует материалы о рисках
    - Государственные органы, потому что они формулируют обязательные требования
    - Инженеры лаборатории, потому что у них полный доступ к модели
