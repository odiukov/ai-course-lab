- concept: остаточный риск независимых слоёв перемножается, поэтому полнота стека даёт меньший пропуск, чем один очень прочный слой
  question: Четыре независимых слоя защиты, каждый пропускает 20% проблем. Какая доля проблем проходит все четыре слоя? Ответ в процентах.
  explanation: '0,2⁴ = 0,0016, то есть 0,16% — примерно одна проблема из шестисот. Один слой надёжностью 95% пропустил бы 5%, в тридцать с лишним раз больше. Перемножение работает только при независимости слоёв: если они опираются на общий источник или общее допущение, отказы коррелируют и произведение перестаёт описывать реальность.'
