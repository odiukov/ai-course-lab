- concept: подпись под общей формулировкой означает признание приоритета, но не согласие о вероятности, сценарии и наборе мер
  question: Сотни исследователей и руководителей компаний подписали одну строку о том, что риск вымирания от ИИ заслуживает приоритета уровня пандемий и ядерной войны. Что эта подпись доказывает, а что — нет?
  explanation: Именно то, что заявление оставило за скобками, обеспечило широту подписи — и оно же ограничивает выводы, которые из подписи можно делать.
  kind: open
  reference: Подпись означает, что подписант считает риск заслуживающим внимания сопоставимого уровня. Она не доказывает, что подписанты согласны о вероятности катастрофы, о конкретном сценарии её наступления или о том, какие меры нужно принимать. Разные подписанты могли исходить из разных объяснений опасности — потеря контроля, злоупотребление, концентрация власти — и предпочитать разные политики. Ссылаться на такое заявление как на консенсус по поводу вероятности или решения нельзя.
  id: 005-statement-2
  fingerprint: ea698796
- concept: 'функция такого заявления — координация: одновременный публичный сигнал многих влиятельных участников о приоритете, а не новое знание о риске'
  question: Заявление о риске от ИИ не содержало ни новых данных, ни новых аргументов — только уже известную мысль в одну строку. В чём тогда состоял его основной эффект?
  explanation: 'Ценность была координационной: до заявления говорить о риске вымирания публично было репутационно рискованно поодиночке, после — на тему указали разом сотни известных имён. Это меняет повестку, но не создаёт ни доказательства, ни обязательства.'
  kind: choice
  options:
    - Оно доказало, что катастрофический сценарий вероятен
    - Оно позволило множеству влиятельных участников одновременно и публично обозначить один приоритет, сделав тему легитимной для обсуждения
    - Оно установило для лабораторий обязательные ограничения на выпуск моделей
    - Оно заменило собой необходимость в исследованиях по безопасности
  correct: 1
