- concept: параметры выкатки не отменяют достигнутый порог, а определяют, какие именно действия нужно выполнить
  question: 'Одна и та же модель, чьи возможности достигли установленного порога, разворачивается двумя способами: доступ у двенадцати проверяющих в изолированной среде без внешних подключений — и открытый API с правом модели выполнять действия. Что верно?'
  explanation: 'Решение двухосевое. Порог возможностей — переключатель: достигнут — режим требований включён, и режим доступа этого не отменяет. Параметры выкатки отвечают на второй вопрос: что именно организация делает с возможностью, и потому задают применимые действия — проверку до выпуска, ограничение доступа, документированное решение ответственного лица.'
  kind: choice
  options:
    - Специальный режим требований включён в обоих случаях, но применимый набор действий разный — режим доступа влияет на исполнение, а не на факт срабатывания порога
    - В изолированной среде порог считается недостигнутым, потому что внешних пользователей нет
    - 'Наборы обязанностей совпадают полностью: раз возможности одинаковы, режим доступа роли не играет'
    - Порог перестаёт применяться, если организация обещает осторожное обращение с моделью
  correct: 0
  id: 031-obligations-logic-1
  fingerprint: bc8c5046
- concept: 'порядок разбора: сначала включение режима по возможностям, затем контекст развёртывания, затем конкретные применимые действия'
  question: Расставь шаги разбора обязательств для планируемого выпуска модели.
  explanation: 'Оси нельзя менять местами: пока не установлено, включён ли режим, описание выкатки не к чему применять. И наоборот, достигнутый порог сам по себе не говорит, нужна ли предвыпускная проверка или ограничение доступа — это определяется режимом развёртывания.'
  kind: order
  items:
    - Установить, достигли ли возможности модели установленного порога, то есть включается ли специальный режим требований
    - 'Описать параметры выкатки: широта доступа, круг пользователей, разрешённые действия модели'
    - Сверить пару «возможности + режим развёртывания» с актуальной редакцией требований
    - Зафиксировать конкретные применимые действия и ответственных за их исполнение
  id: 031-obligations-logic-2
  fingerprint: 70bca970
- concept: 'широта доступа сама по себе не создаёт обязанностей: без достижения порога специальный режим не срабатывает'
  question: 'Команда выпускает слабую модель, не дотягивающую до порога возможностей, но открывает её примерно сорока тысячам пользователей. Коллега говорит: «Раз выкатка массовая, спецрежим включён». Объясни своими словами, в чём ошибка рассуждения.'
  explanation: Две проверки независимы и обе обязательны. Первая отвечает «включилось ли правило», вторая — «какое действие применимо». Замена первой второй даёт либо ложное срабатывание на слабой модели, либо пропуск сильной модели, выпущенной в закрытый контур.
  kind: open
  reference: 'Ошибка в подмене одной оси другой. Специальный режим включает достижение порога возможностей — это условие срабатывания правила. Массовость доступа не заменяет это условие: она уточняет, как исполнять требования, если они уже возникли. При недостигнутом пороге широкая выкатка не создаёт обязанностей спецрежима (общие требования и внутренние политики при этом действуют). Симметрично неверно и обратное: достигнутый порог не снимается ссылкой на узкий закрытый доступ.'
  id: 031-obligations-logic-3
  fingerprint: 96bae075
