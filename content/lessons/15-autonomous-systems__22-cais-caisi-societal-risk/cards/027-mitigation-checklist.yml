- concept: 'при объединении мер из нескольких меток одна и та же мера попадает в чек-лист один раз: пункт описывает работу, а не число категорий, его затребовавших'
  question: Метки риска могут требовать пересекающихся мер (один и тот же внешний аудит нужен нескольким категориям). Заполни пропуск так, чтобы совпадающая мера попала в итоговый чек-лист один раз, а порядок пунктов остался предсказуемым.
  explanation: Пункт чек-листа — это работа с владельцем и проверяемым результатом. Если два рычага требуют одного аудита, аудит проводится один, и повторная строка не добавляет ни задачи, ни проверки — только шум, из-за которого исполнитель ищет несуществующую вторую работу. Проверка `not in` перед добавлением даёт дедупликацию и сохраняет порядок первого появления, в отличие от `set()`, где порядок теряется.
