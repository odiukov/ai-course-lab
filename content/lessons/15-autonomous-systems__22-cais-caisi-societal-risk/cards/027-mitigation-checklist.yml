- concept: порядок пунктов задаётся фиксированным перечнем категорий, а не порядком поступивших меток, чтобы одинаковый набор меток всегда давал побайтово одинаковый чек-лист и его можно было сравнивать между выкатками
  question: Почему при сборке чек-листа стоит обходить категории в фиксированном заранее заданном порядке, а не в том порядке, в каком метки пришли на вход?
  explanation: 'Детерминированность здесь не эстетика, а условие сравнимости. Чек-лист нужен для проверки исполнения, значит его версии кладут рядом; воспроизводимый порядок превращает diff в осмысленный сигнал. Тот же принцип: функция должна зависеть от множества меток, а не от случайностей их подачи.'
  kind: open
  reference: 'Чек-лист — рабочий артефакт, который сравнивают: между выкатками, между версиями разметки, в ревью и в тестах. Если порядок зависит от порядка меток на входе, то один и тот же набор рисков даёт разные списки, и diff показывает перестановку строк там, где содержательно ничего не изменилось; настоящее добавление или исчезновение меры тонет в этом шуме. Фиксированный обход по перечню категорий делает вывод функцией только от множества меток: одинаковый вход — идентичный выход, и любое различие в списке означает различие в оценке риска, а не в порядке аргументов. Побочно это упрощает тесты: ожидаемый список пишется буквально, без сортировки результата.'
  id: 027-mitigation-checklist-3
  fingerprint: cde75bb4
