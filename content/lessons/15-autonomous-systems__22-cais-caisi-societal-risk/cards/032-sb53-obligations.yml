- concept: функция не изменяет переданные данные, поэтому повторный вызов на том же входе даёт тот же результат
  question: Функция обязательств получает словарь профиля модели и по ходу работы дописывает в него служебный ключ, а также добавляет пункты прямо в переданный список выкаток. Какая проблема возникает в первую очередь?
  explanation: Мутация входа делает функцию зависимой от истории вызовов. Тот же профиль, прогнанный второй раз, уже несёт следы первого прогона, и расхождение результатов невозможно объяснить логикой требований. Функция должна читать вход и собирать новый результат.
  kind: choice
  options:
    - Повторный вызов на тех же данных даст другой результат, и порядок вызовов в тестах и в конвейере начнёт влиять на вывод
    - Функция станет работать медленнее из-за увеличения размера словаря
    - Результат перестанет быть строкой и его нельзя будет сравнить с ожидаемым
    - 'Ничего страшного: вход всё равно больше нигде не используется'
