- concept: 'функция применимости обязанностей не классифицирует конкретное событие: тяжесть и срок — зона ответственности другой функции'
  question: В функцию, определяющую применимые обязательства модели и выкатки, предлагают добавить проверку «является ли произошедший сбой сообщаемым инцидентом и не истёк ли срок». Почему это плохая идея?
  explanation: Одна функция отвечает на вопрос «какой режим требований применим к этой модели и этой выкатке» — он решается до любых происшествий. Классификация события (тяжесть, факт отправки, дедлайн) отвечает на другой вопрос и меняется во времени. Слитые вместе, они дают функцию, которую нельзя протестировать по одной оси, не зафиксировав другую.
  kind: choice
  options:
    - 'Это смешивает два разных решения: какие обязанности вообще применимы к выпуску и какой статус у конкретного события — их придётся тестировать и менять по отдельности'
    - Потому что срок сообщения вычислить невозможно без обращения к внешнему сервису
    - Потому что функция обязательств должна возвращать только логическое значение
    - Потому что тяжесть инцидента вообще не влияет на обязанность сообщать
  correct: 0
