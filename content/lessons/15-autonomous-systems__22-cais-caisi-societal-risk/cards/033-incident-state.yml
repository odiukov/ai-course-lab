- concept: «сообщение не требуется» — вывод о применимости правила, а не оценка тяжести события
  question: 'Инцидент тяжёлый: модель помогла обойти защиту сервиса. Но организация и режим её выкатки не попадают под условия обязательного уведомления. Какой статус корректен?'
  explanation: Это две разные шкалы. Тяжесть описывает событие, статус сообщения описывает состояние обязанности. Ярлык «низкий риск» на тяжёлом инциденте искажает картину для внутреннего разбора и последующих решений, хотя внешнего уведомления действительно не требуется.
  kind: choice
  options:
    - «Сообщение не требуется» — обязанность не возникла, при этом тяжесть события остаётся высокой
    - «Низкий риск» — раз уведомлять не нужно, событие незначительное
    - «Просрочено» — тяжёлый инцидент нельзя оставлять без уведомления
    - «Ожидает сообщения» — до выяснения деталей статус должен быть промежуточным
  correct: 0
  id: 033-incident-state-1
  fingerprint: 80e39bb7
- concept: статус — свойство процесса сообщения и меняется во времени при неизменной тяжести события
  question: Обязанность уведомить возникла, отчёт пока не отправлен, срок не истёк. Дальше организация бездействует. Расставь состояния в хронологическом порядке.
  explanation: Тяжесть инцидента за это время не менялась ни разу — менялось состояние обязанности. Отправка закрывает вопрос исполнения даже после истечения срока, но факт просрочки остаётся отдельным фактом для разбора.
  kind: order
  items:
    - 'Ожидает сообщения: обязанность есть, отчёт не отправлен, срок впереди'
    - 'Просрочено: срок истёк, отчёт так и не отправлен'
    - 'Сообщено: отчёт отправлен, факт отправки подтверждён'
  id: 033-incident-state-2
  fingerprint: 65afad1b
- concept: 'при недостающих входных данных статус «недостаточно данных», а не «не требуется»: отсутствие сведений не доказывает отсутствие обязанности'
  question: В карточке инцидента нет даты обнаружения и нет подтверждения, достигла ли модель порога возможностей. Как правильно оформить статус?
  explanation: Выбор «не требуется» при пустых полях превращает отсутствие доказательств в доказательство отсутствия обязанности — и делает пропущенное уведомление внешне неотличимым от законно отсутствующего. Отдельный статус «недостаточно данных» держит случай видимым до выяснения.
  kind: choice
  options:
    - «Недостаточно данных» и передача на проверку — недостающие сведения нужно добыть, а не интерпретировать
    - '«Сообщение не требуется»: пока обязанность не подтверждена, её нет'
    - '«Просрочено»: раз даты нет, срок считается истёкшим'
    - '«Сообщено»: отсутствие записи об отправке обычно означает, что отправка была неформальной'
  correct: 0
