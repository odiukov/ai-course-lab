- concept: рамка категорий катастрофического риска — рабочая классификация, подлежащая пересмотру по мере роста возможностей и накопления опыта внедрений
  question: Почему осмысленно спрашивать, как должна выглядеть рамка категорий катастрофического риска через несколько лет, а не считать её постоянной?
  explanation: Ценность категории в том, что она отвечает на отдельный вопрос о причине и ведёт к своей мере. Как только новый класс инцидентов перестаёт попадать ни в одну категорию однозначно, рамка требует пересборки.
  kind: open
  reference: Рамка — не список законов природы, а инструмент группировки известных источников вреда, собранный под возможности и практику своего момента. С ростом возможностей моделей и накоплением опыта развёртываний появляются механизмы вреда, которые прежние категории описывают плохо или размазывают по нескольким сразу, а какие-то категории теряют различительную силу. Пересмотр — это переразбиение по причинам, чтобы каждая категория продолжала указывать на свой рычаг вмешательства.
  id: 039-final-quiz-3
