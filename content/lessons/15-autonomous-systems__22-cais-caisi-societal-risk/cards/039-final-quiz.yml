- concept: 'нормативный текст разбирается по отдельным положениям: один и тот же закон содержит и усиливающие, и ослабляющие защиту нормы'
  question: При разборе законопроекта о безопасности передовых моделей от тебя требуют назвать положение, усиливающее защиту от катастрофического риска, и положение, её ослабляющее. Что стоит за такой постановкой задачи?
  explanation: Порог включения обязанностей, защита сообщающего о риске и обязательное уведомление об инциденте работают в разные стороны с исключениями, отсрочками и узкими определениями. Единый ярлык на весь документ скрывает, какое именно положение меняет практику.
  kind: choice
  options:
    - Документ оценивается по отдельным положениям, а не как единый вердикт «хороший или плохой закон»
    - Любой законопроект по определению содержит равное число сильных и слабых норм
    - Ослабляющие положения появляются только в неподписанных редакциях
    - Такая формулировка нужна, чтобы избежать оценки статуса документа
