- concept: рычаги ранжируются по фактам конкретной выкатки, а не по универсальной шкале важности
  question: Почему нельзя раз и навсегда назвать «самый важный организационный рычаг» и применять этот ответ ко всем выкаткам? Объясни, что заменяет такой универсальный список.
  explanation: Диагноз ставится по конкретной выкатке. Универсальный рейтинг рычагов заставляет усиливать то, что уже сильно, и пропускать реальный разрыв.
  kind: open
  reference: 'Рычаги описывают разные условия, и в каждой организации они выполнены по-разному: там, где инженеры свободно останавливают релиз, слабым местом может быть отсутствие внешнего взгляда, а там, где аудит независим и строг, — незащищённые веса или слои, которые никто не проверял на отказ. Поэтому вместо фиксированного рейтинга берут факты конкретной выкатки и по каждому рычагу ищут работающее подтверждение: кто фактически останавливал релиз, кто проводил проверку и был ли он подчинён проверяемым, проверяли ли слои на отказ, кто имеет доступ к весам и данным оценивания. Слабейший — тот, по которому подтверждения нет; вывод меняется вместе со сценарием.'
  id: 028-org-risk-check-2
  fingerprint: 9716d1b1
