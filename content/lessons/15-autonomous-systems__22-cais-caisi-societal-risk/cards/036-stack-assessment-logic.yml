- concept: 'операциональный признак независимости слоя: способность обнаружить проблему и заявить о ней, когда другой слой ошибся или промолчал'
  question: Сформулируй своими словами, по какому наблюдаемому признаку слой защиты считается независимым, и почему обмен данными между слоями этому не противоречит.
  explanation: 'Независимость — свойство про способность возразить, а не про изоляцию. Практический тест: если убрать доступ к чужому заключению, останется ли у слоя основание для собственного вывода.'
  kind: open
  reference: 'Слой независим, если он способен сам обнаружить проблему и публично о ней заявить даже в ситуации, когда другой слой ошибся или предпочёл промолчать: у него собственный источник доказательств и собственное право на вывод, не требующее разрешения проверяемой стороны. Обмен данными этому не мешает — участники могут делиться результатами и запросами. Граница проходит там, где слой перестаёт иметь любые собственные основания и целиком зависит от одного решения, одного разрешения или одного чужого отчёта.'
  id: 036-stack-assessment-logic-2
  fingerprint: 394169fe
- concept: несколько слоёв, опирающихся на один внутренний отчёт, образуют одну точку отказа, и стек считается неполным
  question: В отчёте о готовности к выпуску четыре слоя ссылаются на выводы одного и того же внутреннего исследования лаборатории. Какой вывод верен?
  explanation: 'Разные названия скрывают общий источник доказательств: отказы полностью коррелируют, и произведение вероятностей пропуска перестаёт работать. Именно поэтому согласованность выводов сама по себе не аргумент — ценность даёт способность слоя прийти к другому выводу по своим данным.'
  kind: choice
  options:
    - 'Фактически работает один слой: ошибка в общем источнике проходит все четыре пункта одновременно'
    - Слоёв четыре, поскольку у каждого свой владелец и своя формулировка вывода
    - 'Это признак хорошей координации: единый источник исключает противоречия между слоями'
    - Полноту стека нельзя оценить, пока не известна точность исходного исследования
