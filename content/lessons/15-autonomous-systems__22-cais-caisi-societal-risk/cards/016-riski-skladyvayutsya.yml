- concept: 'несколько меток остаются описанием одного инцидента: учётная единица не размножается по числу категорий'
  question: Инцидент получил метки AI races, organizational risk, malicious use и rogue AI. Как это должно отразиться в реестре инцидентов?
  explanation: Если размножить запись, один случай будет посчитан четыре раза, и любая агрегированная статистика испортится. Множественная разметка сохраняет несколько фактов о событии, но само событие остаётся одно.
  kind: choice
  options:
    - Четырьмя записями — по одной на категорию, чтобы статистика по категориям была честной
    - 'Одной записью с несколькими метками: категории описывают разные факты об одном случае'
    - Одной записью и одной меткой, а остальные категории вынести в комментарий
    - 'Двумя записями: одна для человеческих причин, другая для технических'
  correct: 1
