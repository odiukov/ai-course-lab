  question: Почему внешний аудит не заменяет внутренний, и как трактовать расхождение их выводов перед выпуском?
  explanation: Два источника с разными слепыми зонами дают больше, чем один самый тщательный. Совпадение — подтверждение, расхождение — указатель, где искать невысказанное допущение.
  kind: open
  reference: 'Внутренняя команда знает устройство модели, историю решений, известные слабые места и может проверить то, до чего снаружи не добраться. Внешние проверяющие не участвовали в разработке и приносят другие сценарии, другие трактовки спорных ответов и другие предположения о том, что считать сбоем; ошибаться они тоже могут. Ценность внешнего аудита не в большей правильности, а в несовпадении интересов и допущений с внутренним. Если оба воспроизводимо приходят к одному выводу, уверенность растёт. Расхождение — не помеха выпуску, а самый информативный результат: оно указывает, что стороны опираются на разные скрытые допущения, и их нужно найти и разрешить до выпуска, а не усреднять оценки.'
