  question: Модель показала рекордный балл в тестах на рассуждение. Почему одного этого недостаточно, чтобы судить о её влиянии на рынок труда?
  explanation: 'Поэтому оценки возможностей и индексы по области применения дополняют друг друга: первое отвечает «что модель умеет в тесте», второе — «как это сдвигает конкретную сферу».'
  kind: open
  reference: 'Бенчмарк измеряет способность решать задачи теста, а не выполнять работу целиком: реальная задача включает контекст, неполные условия, инструменты, взаимодействие с людьми и требование доводить результат до приемлемого качества. Чтобы говорить о влиянии на труд, нужен замер на выборке реальных оплачиваемых задач и наблюдение за динамикой показателя, а не единичный балл.'
