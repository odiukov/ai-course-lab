- concept: 'культура безопасности состоит из двух частей: сообщить о риске без карьерного ущерба и возможность этого сообщения фактически приостановить выпуск'
  question: В лаборатории объявлено, что сообщать о рисках безопасно и никого за это не наказывают. Сообщения инженеров регулярно приходят руководителю выпуска, он их читает и продолжает запуск по графику без объяснений. Что здесь не сделано для культуры безопасности?
  explanation: 'Отсутствие наказания снимает только цену сигнала. Нужен ещё маршрут: кто обязан сигнал рассмотреть, по каким признакам запуск ставится на паузу и что фиксируется при решении продолжить. Иначе процесс существует на бумаге: сообщать можно, но ничего не происходит.'
  kind: choice
  options:
    - 'Нет второй половины: сигнал не имеет силы приостановить выпуск и его можно оставить без рассмотрения'
    - 'Всё сделано: отсутствие наказания за сигнал и есть культура безопасности'
    - Не хватает анонимности сообщений — без неё сигналы не считаются
    - Проблема в том, что сигналы поступают одному человеку, а не всей команде
  correct: 0
  id: 023-safety-culture-1
  fingerprint: e1f2cb84
- concept: порог для сигнала — обоснованное основание для дополнительной проверки, а не доказанная катастрофа
  question: 'В команде принято правило: приостанавливать выпуск только при доказанном серьёзном вреде. Инженер видит, что модель в одном сценарии обошла ограничение, но доказать вред не может. К чему ведёт такое правило?'
  explanation: 'Требование доказательства переносит порог за момент вреда: до инцидента данных на доказательство обычно нет. Рабочий порог другой — достаточно серьёзное основание для дополнительной проверки, а бремя разобраться лежит на процессе, а не на том, кто заметил признак.'
  kind: choice
  options:
    - Пауза становится возможной в основном после того, как вред уже случился, потому что полная уверенность обычно приходит задним числом
    - 'К здоровой экономии: команда не тратит время на непроверенные подозрения'
    - К росту числа ложных тревог, так как инженеры начнут сообщать обо всём подряд
    - 'Ни к чему: правило равносильно требованию обоснованного подозрения'
  correct: 0
  id: 023-safety-culture-2
  fingerprint: 4ef64e4f
- concept: 'культура безопасности предсказывает остальные организационные рычаги: при слабой культуре аудит, слоистая защита и инфобезопасность вырождаются в пункты чек-листа'
  question: Почему культуру безопасности считают сильным предсказателем остальных рычагов организационного риска, а не просто ещё одним пунктом рядом с ними?
  explanation: Опросы CAIS фиксируют именно эту связь. Остальные рычаги — процедуры; культура определяет, исполняются ли они, когда исполнение стоит кому-то срока или репутации.
  kind: open
  reference: 'Аудит, многослойная защита и информационная безопасность существуют не как документы, а как действия людей: кто-то должен зафиксировать неудобный результат проверки, отказаться считать слой рабочим, сообщить о нарушении режима доступа, признать, что срок придётся сдвинуть. Все эти действия несут для сотрудника личную цену. Если за плохую новость наказывают или её можно молча проигнорировать, отчёты становятся оптимистичными, слои защиты помечаются исправными без проверки, а нарушения режима не всплывают. Механизмы формально остаются, но перестают что-либо измерять и останавливать. Поэтому культура тянет за собой остальные три рычага: она определяет, доходит ли неприятный сигнал до решения.'
  id: 023-safety-culture-3
  fingerprint: 6b1ee41b
