- concept: некоммерческий налоговый статус описывает тип организации и режим налогообложения, а не объём властных полномочий
  question: В карточке организации указано, что она зарегистрирована как некоммерческая по налоговому законодательству США. Что этот статус сообщает о её полномочиях?
  explanation: Налоговый статус отвечает на вопрос «как организация устроена и как облагается налогом», а не «что она вправе предписывать другим». Впечатляющее название и государственно звучащий статус легко перепутать с мандатом — проверять надо источник полномочий.
  kind: choice
  options:
    - Он подтверждает право проводить обязательный надзор за отраслью
    - Он означает, что организация действует по поручению правительства
    - Он описывает организационно-правовую форму и налоговый режим и ничего не говорит о властных полномочиях
    - Он даёт право выписывать штрафы, но не право издавать нормы
