- concept: источник влияния исследовательской организации — убедительность и репутация, источник власти регулятора — закон
  question: 'Объясни своими словами: чем источник влияния независимого исследовательского центра по безопасности ИИ отличается от источника власти государственного регулятора?'
  explanation: 'Отсюда практическое правило чтения новостей: формулировка «центр требует» описывает силу публичного призыва, а не юридическое предписание.'
  kind: open
  reference: 'Регулятор получает полномочия из закона: он может устанавливать обязательные требования, проверять их исполнение и применять предусмотренные санкции. Влияние исследовательского центра держится на качестве работы, репутации и внимании, которое его аргументы получают у исследователей, компаний и властей. Центр может изменить повестку и язык обсуждения, но не может приказать; его выводы становятся обязательными только тогда, когда их подхватывает орган с законными полномочиями.'
