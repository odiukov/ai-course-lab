- concept: организационный риск приоритетен для практика по управляемости, а не потому, что он опаснее остальных категорий
  question: Почему из категорий катастрофического риска инженеру-практику рекомендуют вкладывать основное внимание в организационный риск?
  explanation: Приоритет здесь про рычаг, а не про величину угрозы. Отдельный инженер не остановит конкурентную гонку разработчиков и не отменит чужой злой умысел, но может потребовать записать исключение из правил, сохранить результаты проверки, ограничить доступ к весам или не подтвердить готовность выпуска.
  kind: choice
  options:
    - 'Он находится в зоне его прямых решений: доступ, аудит, фиксация исключений, подтверждение готовности релиза'
    - Он статистически чаще остальных приводит к катастрофическим последствиям
    - Остальные категории уже закрыты регуляторами и не требуют внимания команд
    - Он единственный поддаётся количественному измерению
  correct: 0
  id: 022-actionable-risk-1
  fingerprint: 4c1aeba7
- concept: информационная безопасность как рычаг покрывает не только веса модели, но и данные оценок и техники обхода мониторинга
  question: Лаборатория надёжно защитила веса модели, но её набор оценочных сценариев оказался в открытом доступе. Почему это тоже провал рычага информационной безопасности?
  explanation: 'Рычаг информационной безопасности покрывает три вида утечек: веса модели, данные оценок и техники обхода монитора. Утёкший оценочный набор обесценивает саму процедуру измерения — результат начинает отражать знакомство с тестом, а не безопасность модели.'
  kind: choice
  options:
    - Утёкшие сценарии оценки могут попасть в обучение и подгонку, после чего высокий балл перестаёт свидетельствовать о безопасности
    - Утечка сценариев автоматически означает, что утекли и веса модели
    - Оценочные сценарии считаются интеллектуальной собственностью, и их публикация нарушает договор с аудитором
    - 'Ничего страшного: публичные сценарии оценки повышают прозрачность и укрепляют безопасность'
  correct: 0
  id: 022-actionable-risk-2
  fingerprint: 0fed9e89
- concept: 'многослойная защита: ни один слой не достаточен сам по себе, ценность даёт независимость отказов слоёв'
  question: Что означает требование многослойной защиты при выпуске модели и когда несколько слоёв перестают быть настоящими слоями?
  explanation: Ключ — независимость отказов, а не количество проверок. Считать слои полезно только вместе с вопросом «какая единая причина выключает их все сразу».
  kind: open
  reference: 'Многослойная защита означает, что между вредным запросом и вредным результатом стоит несколько независимых барьеров — например, фильтрация входа, поведение самой модели, мониторинг выхода и ограничение доступа к возможностям, — и ни один из них не считается достаточным сам по себе. Смысл в том, что отказ одного слоя не открывает весь путь. Слои перестают работать как слои, когда они отказывают по одной и той же причине: построены на одном классификаторе, обучены на одних данных, обходятся одной техникой или отключаются одним решением ради скорости. Тогда набор барьеров лишь выглядит как глубина, а на деле это один барьер в нескольких копиях.'
  id: 022-actionable-risk-3
  fingerprint: 6801c406
