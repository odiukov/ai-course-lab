- concept: таксономия группирует источники катастрофического риска, но не оценивает вероятность и не назначает меры защиты
  question: Команда хочет использовать рамку катастрофических рисков CAIS, чтобы решить, какие меры внедрять и насколько вероятна катастрофа. Что рамка даёт, а что нет?
  explanation: Полезность рамки — в полноте разбора причин. Оценка вероятности и выбор мер — отдельные слои работы; ожидание готовых решений от таксономии ведёт к формальным галочкам вместо анализа.
  kind: open
  reference: 'Рамка даёт верхнеуровневую карту причин: она помогает назвать источники вреда — злонамеренное использование, конкурентное давление, организационные провалы, выход ИИ из-под контроля — и не свести инцидент к одной удобной версии. Она не считает вероятности, не ранжирует риски по величине ущерба и не предписывает конкретные меры; это классификация, а не модель риска и не список требований. Она также не единственная таксономия, просто самая цитируемая.'
