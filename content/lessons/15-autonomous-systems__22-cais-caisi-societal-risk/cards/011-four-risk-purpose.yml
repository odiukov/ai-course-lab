- concept: каждая категория отвечает на свой вопрос о причине, и признаки инцидента сопоставляются с этими вопросами
  question: 'Разбор релиза показал: команда безопасности недофинансирована, аудит проведён формально, выпуск одобрен без учёта замечаний. Внешнего давления конкурентов не было, модель вела себя по спецификации. К какой категории относится причина?'
  explanation: 'Organizational risks отвечает на вопрос «где сломался процесс внутри организации»: аудит, культура безопасности, финансирование, контроль выпуска. Гонка требует внешнего конкурентного давления, rogue AI — расхождения целей самой системы; ни того, ни другого в описании нет.'
  kind: choice
  options:
    - Organizational risks — сломались процессы и культура безопасности внутри организации
    - AI races — любой ускоренный выпуск объясняется конкуренцией
    - Rogue AIs — плохой аудит означает, что модель преследовала свои цели
