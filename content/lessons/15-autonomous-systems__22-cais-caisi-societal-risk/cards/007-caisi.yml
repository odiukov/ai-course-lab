- concept: «несекретная» публикация означает доступность результатов публике, а не полное раскрытие всех деталей испытаний
  question: Центр обещает выпустить несекретный отчёт об оценке модели. Что из этого следует?
  explanation: 'Несекретность — про категорию доступа: материал не закрыт грифом и публикуется для широкой аудитории. Часть деталей всё равно может быть опущена по соображениям безопасности или по договорённости с лабораторией.'
  kind: choice
  options:
    - Отчёт сможет прочитать любой желающий, но не обязательно с полными деталями протоколов и промптов
    - В отчёте будут опубликованы все материалы испытаний без изъятий
    - Отчёт станет доступен только лаборатории и профильному ведомству
  correct: 0
