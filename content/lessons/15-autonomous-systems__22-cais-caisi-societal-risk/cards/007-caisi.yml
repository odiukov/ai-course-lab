- concept: публичные несекретные оценки государственного центра и закрытые по NDA частные оценки дают дополняющие друг друга источники
  question: Практик читает и открытые отчёты государственного центра оценок, и материалы частной оценочной организации, работающей по соглашениям о неразглашении. Объясни, почему один источник не заменяет другой.
  explanation: 'Именно это соотношение делает CAISI публичным аналогом приватных проектов METR: сравнение двух типов отчётов даёт более полную картину возможностей моделей, особенно по кибер-, био- и химическим рискам.'
  kind: open
  reference: 'Частный оценщик обычно получает глубокий доступ к модели, но публикует мало: значительная часть результатов закрыта NDA. Государственный центр вроде CAISI получает доступ по добровольному соглашению и видит, как правило, меньше, зато выпускает несекретные отчёты, доступные всем. Первый источник даёт глубину без публичности, второй — публичность без полноты; вместе они закрывают слепые пятна друг друга.'
  id: 007-caisi-3
