- concept: метки держатся на разных фрагментах свидетельств, поэтому изменение одной детали сценария снимает ровно одну метку и не трогает остальные
  question: Инцидент размечен как злонамеренное использование, организационный риск и выход ИИ из-под контроля. Затем выясняется, что группа, отдававшая системе вредное поручение, действовала не со злым умыслом, а по ошибке в постановке задачи. Что происходит с разметкой?
  explanation: Каждая метка опирается на собственный фрагмент свидетельств. Убрали умысел — исчезло основание для malicious use; провалы процедур в лаборатории и поведение системы вопреки командам людей от этого никуда не делись.
  kind: choice
  options:
    - Снимается только метка злонамеренного использования, две другие держатся на своих свидетельствах
    - 'Разметка обнуляется целиком: без злого умысла остальные признаки теряют силу'
    - Остаётся только организационный риск, потому что выход из-под контроля был следствием поручения
    - Метки сохраняются все, но их приоритет перераспределяется
