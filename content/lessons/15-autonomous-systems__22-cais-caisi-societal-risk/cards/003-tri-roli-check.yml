- concept: внутреннее обязательство связывает только саму организацию и не влечёт внешнего принуждения
  question: 'Компания записала во внутреннем документе: приостановить обучение следующей модели при достижении заданного порога опасных возможностей. Порог достигнут, обучение не приостановлено. Что верно, если в юрисдикции нет закона на эту тему?'
  explanation: Внутренняя политика — самоназначенное правило. Последствия её нарушения репутационные и организационные; юридическое принуждение появляется только когда аналогичное требование закреплено публичной нормой.
  kind: choice
  options:
    - 'Внешнего юридического принуждения нет: обязательство добровольное и действует только внутри организации'
    - Обучение автоматически приостанавливается надзорным органом
    - Компания обязана оплатить штраф, предусмотренный для нарушителей таких обязательств
  correct: 0
  id: 003-tri-roli-check-1
  fingerprint: 0381f093
- concept: независимость оценки определяется тем, что проверяющая сторона не подчинена проверяемой
  question: Что делает оценку модели именно независимой?
  explanation: 'Независимость — про субъекта проверки, а не про содержание выводов. Независимая оценка при этом остаётся измерением: требования к участникам рынка задаёт общественное регулирование, а не сам отчёт.'
  kind: choice
  options:
    - Оценка опубликована после релиза модели
    - Оценку проводит сторона, не подчинённая разработчику и не заинтересованная в его результате
    - Оценка выполнена по методике, разработанной самим разработчиком
    - Оценка содержит требования к разработчику
  correct: 1
  id: 003-tri-roli-check-2
  fingerprint: a00345ed
