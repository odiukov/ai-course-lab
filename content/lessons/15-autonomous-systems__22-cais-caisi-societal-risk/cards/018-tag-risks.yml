- concept: цепочка взаимоисключающих ветвей в функции разметки теряет комбинации признаков, потому что после первого совпадения остальные признаки не проверяются
  question: Функция разметки написана как if / elif / elif / elif по четырём признакам. Сценарий содержит и конкурентное давление, и сбой аудита, и применение злоумышленником. Что вернёт функция и почему это ошибка?
  explanation: elif выполняется только при ложности предыдущих условий, то есть кодирует «выбери одну категорию». Разметка требует ответа на отдельный вопрос по каждому признаку, поэтому нужны независимые if и накопитель меток.
  kind: choice
  options:
    - 'Все три метки: elif проверяет каждое условие по очереди'
    - Только метку первого сработавшего условия — остальные ветви не выполняются, и обоснованные категории теряются
    - Пустой список, потому что условия конфликтуют между собой
    - Метку последнего сработавшего условия, так как каждая ветвь перезаписывает результат
  correct: 1
  id: 018-tag-risks-2
  fingerprint: 22526abd
- concept: сценарий без активных признаков даёт пустой результат разметки, а не метку по умолчанию
  question: В функцию разметки передан сценарий, где ни один признак не выставлен. Что она должна вернуть?
  explanation: 'Метка ставится только при наличии признака. Дефолтная категория или полный набор «для страховки» превратили бы разметку в шум: по такому реестру нельзя было бы отличить случаи с реальными признаками от случаев без описания.'
  kind: choice
  options:
    - 'Пустой список: без признаков нет обоснованных меток'
    - Список со всеми четырьмя категориями — на случай, если признаки просто не описаны
    - Метку organizational_risk как наиболее частую по умолчанию
    - 'Ошибку: сценарий без риска считается некорректным входом'
  correct: 0
  id: 018-tag-risks-3
