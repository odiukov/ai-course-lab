- concept: свёрнутый общий уровень публикуется вместе с исходными оценками по категориям, потому что одинаковый итог получается из разных наборов причин
  question: Почему недостаточно вернуть только общий уровень риска («высокий») и не показывать оценки по отдельным категориям?
  explanation: Свёртка — это сжатие с потерями. Если исходные оценки не сохранены, команда узнаёт, что выпускать нельзя, но не узнаёт, какое именно место в цепочке исправлять.
  kind: open
  reference: 'Общий уровень говорит только о срочности решения (выпускать, задержать, перепроверить), но не о том, что чинить. Один и тот же высокий итог может получиться из злонамеренного применения, из конкурентного давления на сроки, из провала внутреннего процесса или из поведения самой системы, и меры в этих случаях разные: усиление фильтров, пересмотр графика выпуска, починка процедуры аудита, работа над поведением модели. Поэтому свёртка добавляет верхний индикатор поверх разметки, а не заменяет её: детали остаются доступны для диагностики.'
  id: 019-agregaciya-2
  fingerprint: 82ac2464
- concept: общий уровень — сигнал срочности для решения, а не новая категория риска и не оценка вероятности
  question: Что означает общий уровень риска, полученный свёрткой оценок по категориям?
  explanation: Свёртка не добавляет новой категории и не измеряет вероятность — она отвечает на вопрос «насколько срочно?». На вопрос «почему?» отвечают исходные метки и оценки, лежащие под индикатором.
  kind: choice
  options:
    - Короткий сигнал срочности для решения о выпуске, задержке или дополнительной проверке
    - Дополнительную, пятую категорию риска, куда попадают смешанные случаи
    - Оценку вероятности того, что вред действительно произойдёт
    - Утверждение, что все сработавшие категории одинаково опасны
  correct: 0
