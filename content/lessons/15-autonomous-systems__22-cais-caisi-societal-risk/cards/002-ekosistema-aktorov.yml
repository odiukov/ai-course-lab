- concept: при чисто добровольной безопасности осторожность становится конкурентным минусом, и хорошая политика одной компании не защищает общество от менее осторожного конкурента
  question: Почему набор сильных внутренних политик у отдельных лабораторий не решает задачу общественной безопасности? Объясни своими словами.
  explanation: 'Разные акторы двигают планку по-разному: лаборатории показывают, какие меры выполнимы; оценщики дают факты; организации гражданского общества выносят проблему в публичную дискуссию; но обязательной планка становится только там, где появляется публичное правило.'
  kind: open
  reference: Внутренняя политика действует только внутри своей организации. Пока минимум добровольный, дополнительные проверки стоят времени и денег, поэтому осторожность превращается в конкурентный минус, а менее осторожный участник получает преимущество по скорости выпуска. Общество страдает от действий наименее осторожного игрока, а не наиболее осторожного, поэтому нужен минимум, обязательный для всех участников рынка в юрисдикции.
