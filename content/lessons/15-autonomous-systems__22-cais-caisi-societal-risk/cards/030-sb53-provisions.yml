- concept: порог возможностей — юридический переключатель включения обязанностей, а не утверждение о безопасности всего, что ниже него
  question: Модель по замерам не дотягивает до порога возможностей, при котором законопроект включает дополнительные обязанности разработчика. Какой вывод верен?
  explanation: 'Порог задаёт момент, с которого требование перестаёт быть добровольной практикой и становится обязанностью. Он проводит административную границу применения, а не границу безопасного и опасного: ниже порога риск может быть значимым, просто закон адресует его иначе или не адресует вовсе.'
  kind: choice
  options:
    - 'Модель признана безопасной: порог удостоверяет отсутствие риска'
    - Конкретные обязанности пока не применяются; о безопасности модели порог ничего не утверждает
    - Обязанности применяются частично, пропорционально близости к порогу
    - Порог означает запрет выпускать модели выше него
  correct: 1
  id: 030-sb53-provisions-1
  fingerprint: d2d9e9ce
- concept: правовая защита сообщающего о риске закрывает разрыв, когда внутренний канал подконтролен тому, о чьём решении сообщают
  question: Почему защита информаторов вынесена в закон, если у лаборатории есть внутренний канал сообщений о рисках?
  explanation: Внутренний канал работает, пока руководство само заинтересовано слышать плохие новости. Ровно в спорном случае эта предпосылка отказывает, и сотрудник рискует работой. Правовая защита от увольнения и преследования делает сигнал возможным вопреки интересу работодателя; внутренний канал она не отменяет, а подпирает.
  kind: choice
  options:
    - Закон обязывает сотрудников сообщать обо всех замеченных проблемах
    - Внутренним каналом распоряжается то же руководство, чьё решение о выпуске оспаривается; внешняя защита от преследования не зависит от доброй воли работодателя
    - Внутренние каналы технически не защищают анонимность
    - 'Закон заменяет внутренний канал: после его принятия внутренние сообщения теряют смысл'
  correct: 1
  id: 030-sb53-provisions-2
  fingerprint: '39206e58'
- concept: 'обязательное сообщение об инциденте выводит информацию за пределы компании: внутренний постмортем его не заменяет'
  question: После серьёзного отказа модели компания провела разбор, исправила причину и приложила отчёт к внутренней документации. Требование сообщать об инцидентах при этом выполнено?
  explanation: Постмортем чинит систему; уведомление делает случившееся видимым снаружи. Без него надзорный орган и другие разработчики не узнают о классе отказа, а решение о том, считать ли инцидент значимым, остаётся у стороны, заинтересованной в тишине.
  kind: choice
  options:
    - 'Да: причина устранена, цель требования достигнута'
    - Да, если разбор проводило независимое подразделение
    - 'Нет: требование адресует передачу сведений государству, а разбор остаётся внутри компании — это разные вещи'
    - Нет, но только если инцидент затронул пользователей за пределами штата
  correct: 2
  id: 030-sb53-provisions-3
  fingerprint: 3c0219ca
