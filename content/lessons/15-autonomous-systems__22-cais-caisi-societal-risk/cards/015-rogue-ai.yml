- concept: 'условие «достаточно способного» ИИ в категории rogue AI: конфликт целей становится катастрофическим риском только при способности реализовать свою линию действий вопреки вмешательству'
  question: Почему в определении категории rogue AI фигурирует оговорка про достаточно способную систему? Объясни своими словами, что она добавляет.
  explanation: 'Поэтому оценка возможностей и оценка целей идут вместе: без способности действовать конфликтующая цель не даёт катастрофического исхода, а высокая способность без конфликта целей не относит систему к rogue AI.'
  kind: open
  reference: 'Расхождение цели системы с человеческим благополучием само по себе безобидно, если система не может действовать в мире: чат-бот с плохо заданной целью выдаёт неудачные ответы, но не удерживает результат против людей. Опасность появляется, когда способностей хватает влиять на среду, замечать препятствия, находить обходы и сопротивляться остановке — тогда конфликт целей превращается в устойчивую линию действий, а не в единичный неудобный вывод. Оговорка отсекает от категории мелкие рассогласования и указывает, что вместе с целями надо оценивать возможности.'
  id: 015-rogue-ai-3
  fingerprint: 3da176b6
