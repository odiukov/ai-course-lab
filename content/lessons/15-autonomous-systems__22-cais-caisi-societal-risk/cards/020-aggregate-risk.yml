- concept: ошибка строгого/нестрогого сравнения на пороге проявляется только на граничных значениях, поэтому тесты берут значения ровно на пороге
  question: В свёртке уровень назначается по числу активных категорий через сравнение с порогом. Какой набор тестов надёжнее всего ловит путаницу `<` и `<=`?
  explanation: Строгое и нестрогое сравнение дают одинаковый ответ везде, кроме самого порогового значения, поэтому случайные и крайние входы такую ошибку пропускают. Пустой и полный наборы полезны как отдельные случаи, но границу они не проверяют.
  kind: choice
  options:
