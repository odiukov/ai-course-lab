- concept: кража весов снимает слои защиты, реализованные в контуре обслуживания, а не в самой модели
  question: У лаборатории работают входной фильтр запросов, монитор ответов, урезанные права инструментов и изолированная среда исполнения. Атакующий копирует веса модели и запускает её на своей инфраструктуре. Что происходит с этими слоями?
  explanation: Фильтры, мониторы, ограничения прав и песочница — свойства развёртывания, а не файла весов. Обучение на отказах даёт лишь склонность модели, которую атакующий снимает дообучением или подсказкой. Поэтому утечка весов обнуляет всю глубину защиты сразу, и защита весов — не «ещё один пункт безопасности», а условие работоспособности остальных слоёв.
  kind: choice
  options:
    - Слои сохраняются, потому что закреплены в самих весах модели
    - 'Слои перестают действовать: они живут в контуре обслуживания, а копия запускается вне него'
    - Сохраняется только монитор ответов, остальные слои отпадают
    - Слои сохраняются, если модель дообучали на отказах от вредных запросов
  correct: 1
  id: 025-defense-infosec-1
  fingerprint: cf28f889
- concept: утечка заданий оценивания обесценивает оценку как свидетельство безопасности, не меняя саму модель
  question: Набор проверок на опасные возможности утёк в открытый доступ, и следующая модель проходит его без единого срабатывания. Объясни, почему такой результат нельзя считать свидетельством того, что модель стала безопаснее.
  explanation: Утечка тестов ломает не модель, а измерительный прибор. Отчёт «ноль срабатываний» после утечки нельзя предъявлять как доказательство безопасности — он не отличает безопасную модель от натренированной на этот конкретный список.
  kind: open
  reference: 'Ценность оценки в том, что задания для модели новые: тогда результат говорит о её общем поведении, а не о конкретном списке. После утечки задания могли попасть в обучающие данные или в подготовку к запуску, и высокий результат объясняется знакомством с тестом, а не изменением возможностей. Свидетельство исчезает, хотя модель могла остаться ровно такой же опасной; чтобы вернуть измерение, нужен закрытый или заново составленный набор заданий. Отсюда и вывод: данные оценивания — защищаемый актив, наравне с весами.'
  id: 025-defense-infosec-2
  fingerprint: b39a6790
- concept: 'слои перехватывают разные точки пути: содержание запроса, содержание ответа, полномочия действия, последствия исполнения'
  question: Агент получает безобидно сформулированную задачу «наведи порядок в хранилище» и в ходе выполнения пытается удалить рабочие данные заказчика. Какой слой перехватит вред в этом случае?
  explanation: 'Содержание запроса здесь безвредно, поэтому входной фильтр молчит. Вред возникает на уровне последствий действия, и перехватывает его слой, работающий с полномочиями и средой исполнения. Слои не дублируют друг друга: они стоят в разных точках пути — формулировка, ответ, право на действие, эффект действия — и разрыв в одной точке не закрывается усилением соседней.'
  kind: choice
  options:
    - Фильтр входящих запросов — он отклонит опасную формулировку
    - Ограничение прав инструментов и изоляция исполнения — у агента просто нет доступа на удаление рабочих данных
    - Проверка стиля ответа на грубость и оскорбления
    - 'Никакой: если запрос прошёл фильтр, действие считается разрешённым'
  correct: 1
  id: 025-defense-infosec-3
  fingerprint: bbe38cb9
