- concept: 'порядок атрибуции источника: сначала статус организации, затем задача материала, домен — подтверждающий признак'
  question: Расставь шаги определения организации, стоящей за материалом с похожей на другую аббревиатурой.
  explanation: Статус и задачи — содержательные признаки, они и различают организации. Домен идёт последним, потому что он подтверждает вывод, а не заменяет его.
  kind: order
  items:
    - 'Определить статус организации: некоммерческий исследовательский центр или подразделение внутри государственного ведомства'
    - 'Сопоставить задачу материала: исследования общественных рисков и индексы против добровольных соглашений с лабораториями и оценок оружейных возможностей'
    - Проверить домен источника и использовать его как подтверждение уже сделанного вывода
  id: 008-organizacii-priznaki-1
  fingerprint: 2da8952e
- concept: домен ненадёжен как единственный признак, потому что сторонняя площадка может цитировать чужой отчёт, а официальный домен — публиковать материал соседней программы
  question: Материал об оценке возможностей модели найден на отраслевом блоге, но целиком пересказывает государственный отчёт. Почему нельзя атрибутировать организацию только по домену страницы?
  explanation: Домен — сильный, но подтверждающий признак. Он работает вместе со статусом организации и характером задач; в одиночку он путает автора оценки с площадкой публикации.
  kind: choice
  options:
    - 'Домен показывает, кто разместил текст, а не кто провёл оценку: цитирование и перепечатка разрывают связь между адресом и автором'
    - Домены отраслевых блогов всегда указывают на некоммерческие исследовательские центры
    - 'Домен вообще бесполезен: атрибуция делается только по названию организации'
  correct: 0
  id: 008-organizacii-priznaki-2
  fingerprint: 965e263c
- concept: 'различительная сила признака зависит от того, скольким организациям он свойственен: общие признаки не годятся для атрибуции'
  question: 'В описании организации сказано: «занимается безопасностью ИИ, публикует оценки передовых моделей». Что даёт этот признак для различения двух организаций с похожими аббревиатурами?'
  explanation: Признак различает, только если он есть у одной организации и отсутствует у другой. «Безопасность» и «оценки моделей» описывают и CAIS, и CAISI, поэтому вывод строится на специфичных чертах.
  kind: choice
  options:
    - 'Почти ничего: признак свойствен обеим, различают только специфичные детали вроде статуса и типа соглашений с лабораториями'
    - Он однозначно указывает на государственный центр, потому что оценки моделей делает государство
    - Он однозначно указывает на некоммерческий центр, потому что публикация — признак независимости
  correct: 0
  id: 008-organizacii-priznaki-3
