- concept: 'порядок уровней при разметке описания инцидента: сначала наблюдаемые фрагменты текста, затем механизм, затем верхнеуровневая категория'
  question: Расположи шаги воспроизводимой разметки описания выкатки в правильном порядке.
  explanation: Прыжок из абзаца сразу в категорию даёт метку без обоснования, и спор между разметчиками становится вкусовым. Промежуточный слой механизмов делает вывод проверяемым, а сохранённый путь позволяет другому человеку повторить разметку.
  kind: order
  items:
    - Выделить в описании наблюдаемые фрагменты, не дополняя их догадками
    - Для каждого фрагмента назвать механизм, который он показывает
    - Сопоставить механизмы с верхнеуровневыми категориями рамки катастрофического риска
    - Сохранить вместе с итоговыми метками путь от фрагмента через механизм к категории
  id: 017-razmetka-riskov-1
  fingerprint: e04a76b9
- concept: разногласие разметчиков разрешается возвратом к фрагментам исходного описания, а не выбором «самой подходящей» метки
  question: Два разметчика проставили разные наборы категорий одному и тому же отчёту о выкатке. Что должна предписывать процедура разметки?
  explanation: 'Смысл многоуровневой разметки в том, что каждая метка привязана к цитируемому фрагменту. Тогда спор решается фактом: либо фрагмент с механизмом есть, либо метка не обоснована. Пересечение наборов и голосование теряют обоснованные метки, встреченные лишь одним разметчиком.'
  kind: choice
  options:
    - Взять набор более опытного разметчика
    - Оставить только те метки, которые совпали у обоих
    - Вернуться к тексту и проверить для каждой спорной метки, какой фрагмент и какой механизм её обосновывают
    - Проголосовать, привлекая третьего разметчика для большинства
  correct: 2
  id: 017-razmetka-riskov-2
  fingerprint: 72ad2e65
- concept: 'отсутствие признака запрещает метку: способность модели выполнить вредное действие не является свидетельством rogue AI'
  question: 'В отчёте сказано: лаборатория выпустила модель, способную писать рабочий эксплойт, злоумышленник воспользовался ею для атаки. Про поведение самой модели в отчёте ничего больше нет. Можно ли ставить метку rogue AI?'
  explanation: Здесь направление вреда задал человек, поэтому обоснована metка malicious use. Rogue AI требует признака собственной линии действий системы вопреки людям; способность выполнить атаку такого признака не даёт. Метки «для полноты» разрушают воспроизводимость разметки.
  kind: choice
  options:
    - 'Да: модель нанесла вред, а вред — признак выхода из-под контроля'
    - 'Да: наличие опасной возможности достаточно для метки'
    - 'Нет: нет фрагмента, показывающего, что система преследовала собственную цель, конфликтующую с людьми'
    - 'Нет: rogue AI ставится только вместе с organizational risk'
  correct: 2
  id: 017-razmetka-riskov-3
  fingerprint: ae1ba754
