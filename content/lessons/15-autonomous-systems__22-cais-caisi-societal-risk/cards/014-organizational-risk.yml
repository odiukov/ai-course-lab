- concept: 'написанный регламент не снимает организационный риск: значение имеет исполнимость процедуры — кто читает сигналы и у кого есть работающее право остановить выпуск'
  question: Две лаборатории имеют одинаковый документ «Политика безопасной выкатки». В первой сотрудники избегают сообщать о находках, а право остановки прописано, но ни разу не применялось и требует согласия того же руководителя, что отвечает за срок. Во второй документ короче, но у дежурного инженера есть исполненная процедура остановки и назначенный читатель журнала инцидентов. Что корректнее сказать об организационном риске?
  explanation: Организационный риск оценивают по работающему процессу, а не по наличию текста. Право остановки, подчинённое владельцу срока, и канал сообщений без адресата — это регламент на бумаге; вред возникает именно в разрыве между записанной и исполняемой процедурой.
  kind: choice
  options:
