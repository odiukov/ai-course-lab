- concept: организационный риск не требует внешнего конкурента — источник внутри организации, в отличие от давления гонки
  question: Чем источник организационного риска отличается от источника риска в категории AI races? Ответь своими словами и приведи пример организационного провала, где конкурента нет вообще.
  explanation: Категории отделяются по источнику причины, а не по последствиям. Одна и та же плохая выкатка может нести обе метки, но каждая отвечает за свою часть цепочки.
  kind: open
  reference: 'В AI races давление приходит извне: решение о темпе меняет чужой релиз или чужое преимущество. Организационный риск возникает внутри и не нуждается в сопернике: размытые обязанности, экономия на команде безопасности, слабая культура сообщений о проблемах, аудит, который никто не читает, привычка считать безопасность чужой задачей. Пример: единственная лаборатория в области, без конкурентов, выкатывает модель по регламенту, где ответственный за проверку журнала инцидентов не назначен, — предупреждения фиксируются и не доходят ни до кого.'
