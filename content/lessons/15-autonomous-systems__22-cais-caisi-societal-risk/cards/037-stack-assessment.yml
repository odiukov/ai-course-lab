- concept: функция возвращает раздельный диагноз, потому что отсутствующий и зависимый слой лечатся разными действиями
  question: Почему такая функция возвращает раздельные списки отсутствующих и зависимых слоёв, а не одно булево значение «стек неполон»?
  explanation: Диагностический вывод сохраняет причину дефекта. Слив обеих причин в одно «плохо» заставляет заново разбирать выкатку руками, чтобы понять, какое действие назначить.
  kind: open
  reference: 'Булево значение говорит только о факте дефекта, но не о том, что делать. Отсутствующий слой требует его создать — найти оценщика, завести процедуру, поставить технический ограничитель. Зависимый слой уже существует, и работа другая: сменить подчинённость, дать право зафиксировать неудобный вывод или привлечь стороннюю организацию. Два разных ремонта нельзя выбрать по одному биту, поэтому вывод функции — диагноз, а не только вердикт.'
