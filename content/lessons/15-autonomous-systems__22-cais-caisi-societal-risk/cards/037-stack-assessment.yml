- concept: 'полнота стека — конъюнкция: пусты одновременно список пропусков и список зависимых слоёв'
  question: 'Заполни пропуск в вычислении итоговой полноты стека, если функция накопила два списка: `missing_layers` (слой отсутствует) и `dependent_layers` (слой есть, но независимость нарушена).'
  explanation: Оба списка должны быть пусты. Дизъюнкция объявила бы стек полным при наличии пропусков, лишь бы зависимых не было (и наоборот) — а любой из двух дефектов уже отключает линию защиты.
