- concept: риск в масштабе общества — ущерб выходит за пределы организации и затрагивает людей, не участвовавших в решении
  question: Чем риск в масштабе общества отличается от обычного корпоративного риска при выпуске ИИ-системы? Объясни своими словами.
  explanation: Ключ — кто несёт последствия. Если их несут посторонние, добровольная осторожность одного актора перестаёт быть достаточным ответом, и появляется основание для публичных требований.
  kind: open
  reference: 'Корпоративный риск ложится на саму компанию: деньги, репутация, клиенты. Риск в масштабе общества означает, что последствия ошибки выходят за границы организации — затрагивают инфраструктуру, экономику, безопасность людей, которые не участвовали в решении и не давали на него согласия. Поэтому вопрос перестаёт быть «насколько осторожна эта компания» и становится вопросом о минимальной осторожности, обязательной для всех, кто способен создать такой риск.'
  id: 001-tretiy-vzglyad-2
