- concept: усиление в malicious use проявляется как снижение порога требуемых навыков, сокращение времени и рост масштаба действия
  question: Человек без специальной подготовки и без бюджета раньше не мог провести серьёзную атаку. Как способная модель меняет картину риска в категории malicious use?
  explanation: 'Именно эти три оси и составляют усиление: навык, время, масштаб. Намерение остаётся прежним, но переходит из разряда невыполнимого в выполнимое, а возможный ущерб растёт.'
  kind: choice
  options:
    - Снижает порог необходимых навыков, сокращает время подготовки и позволяет действовать в прежде недоступном масштабе
    - Меняет намерения человека, делая их более враждебными
    - 'Не меняет ничего: намерение было и раньше, значит риск тот же'
