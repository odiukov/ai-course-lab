- concept: 'двойное назначение возможностей: одни и те же способности модели полезны добросовестному пользователю, поэтому категория определяется применением, а не наличием возможности'
  question: Модель хорошо переводит, анализирует данные и пишет убедительные тексты. Достаточно ли этого набора возможностей, чтобы отнести случай к malicious use?
  explanation: 'Возможности двойного назначения нейтральны сами по себе. Катастрофический потенциал даёт связка: опасная цель встречается с инструментом, делающим её осуществимой или резко увеличивающим ущерб.'
  kind: choice
  options:
    - 'Нет: те же возможности нужны добросовестным пользователям; категория возникает при их применении для намеренного вреда'
    - 'Да: перечисленные возможности сами по себе относятся к оружейным'
    - Нет, и такие возможности вообще не относятся к malicious use ни при каком применении
