- concept: 'порядок ветвей классификатора: применимость, затем факт отправки, затем сравнение с дедлайном'
  question: Расставь проверки внутри функции, возвращающей статус уведомления об инциденте.
  explanation: Порядок несёт смысл, а не косметику. Если начать с дедлайна, отправленный вовремя отчёт и вовсе не подпадающий под требование случай оба попадут в «просрочено». Проверка отправки перед сроком гарантирует, что закрытое обязательство не переоткрывается по часам.
  kind: order
  items:
    - 'Проверить применимость обязанности: подпадает ли случай под требование уведомления'
    - Проверить, отправлен ли отчёт, и вернуть статус «сообщено» без обращения к дедлайну
    - Сравнить текущий момент с дедлайном для обязательного, но не отправленного отчёта
    - Вернуть «ожидает сообщения» или «просрочено» по результату сравнения
  id: 034-incident-report-status-1
  fingerprint: dc09312c
- concept: 'применимость требования приходит во входных данных, а не зашивается в код: функция классифицирует случай, а не решает за законодателя'
  question: Разработчик пишет внутри функции статуса константу «требование действует всегда», ссылаясь на то, что законопроект скоро подпишут. Чем это плохо?
  explanation: 'Статус законопроекта условен и различается по юрисдикциям. Применимость — это входной факт о конкретном случае. Зашитая константа делает вывод функции неверным молча: те же данные в другой юрисдикции дадут «просрочено» там, где обязанности нет.'
  kind: choice
  options:
    - 'Функция перестаёт классифицировать случай и начинает утверждать правовой факт: при изменении статуса или юрисдикции придётся править код, а не данные'
    - Константы вообще нельзя объявлять внутри функций
    - Это замедлит функцию, потому что проверка выполняется на каждом вызове
    - 'Ничем: пока требование действует, поведение функции верное'
  correct: 0
  id: 034-incident-report-status-2
  fingerprint: 6abb8838
- concept: 'набор возвращаемых меток — контракт функции: вызывающий код ветвится по точным строкам'
  question: Логика функции статуса верна, но вместо оговорённого значения она возвращает вариант с другим написанием — иным регистром и пробелом вместо подчёркивания. Что произойдёт?
  explanation: 'Возвращаемые метки — часть интерфейса. Ошибка написания даёт худший класс дефекта: внутренняя логика верна, тесты красные или, хуже, потребитель молча уходит в ветку «неизвестно» и обязательный случай не попадает в отчёт.'
  kind: choice
  options:
    - 'Вызывающий код и тесты не узнают статус: сравнение со строкой не совпадёт, и случай выпадет из обработки, хотя логика правильная'
    - Ничего, сравнение строк в Python нечувствительно к регистру
    - Функция упадёт с исключением на возврате значения
    - Статус будет распознан, но потеряет привязку к дедлайну
  correct: 0
