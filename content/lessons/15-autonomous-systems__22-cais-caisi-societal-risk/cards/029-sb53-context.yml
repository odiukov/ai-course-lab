- concept: 'неподписанный текст полезен как прогноз: он показывает, какие добровольные практики законодатели готовы превратить в обязанности и что скопируют другие юрисдикции'
  question: Организация работает вне того штата, где обсуждается законопроект о катастрофическом риске, и подписан он ещё не будет. Зачем ей читать текст?
  explanation: Обязательность и информативность — разные свойства документа. Неподписанный текст не создаёт обязанности, но заранее показывает форму, в которой требования, вероятно, придут.
  kind: open
  reference: Текст показывает, какие сегодня добровольные практики — пороги возможностей, защита сообщающих о риске сотрудников, отчёты об инцидентах — законодатели считают пригодными для превращения в публичную обязанность, и в каких формулировках. Формулировки первого проработанного законопроекта обычно копируются другими юрисдикциями и служат черновиком для более высокого уровня регулирования, поэтому чтение даёт прогноз будущих требований и время подготовить процессы заранее. Прогностическая ценность не зависит от исхода голосования; от исхода зависит только обязательность.
  id: 029-sb53-context-3
  fingerprint: 3360ed3b
