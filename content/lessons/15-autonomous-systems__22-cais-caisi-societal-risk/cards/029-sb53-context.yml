- concept: статус документа отвечает на вопрос об обязательности сейчас, редакция — на вопрос о содержании обсуждаемого требования
  question: Инженер строит процесс соответствия требованиям по заметке о законопроекте штата, который ещё проходит законодательный процесс. Какое утверждение о таком документе корректно?
  explanation: 'Внесение и публикация не создают обязанности — её создаёт принятие уполномоченным органом. При этом текст остаётся содержательным источником: он показывает, какие требования обсуждаются. Два вопроса разделены: «обязательно ли сейчас» отвечает статус, «что именно» — редакция.'
  kind: choice
  options:
    - Требования уже обязательны, раз законопроект внесён и опубликован
    - Требования пока необязательны; корректная формулировка — «законопроект предусматривает», а не «закон требует»
    - Документ не имеет содержательной ценности, пока не подписан
    - Обязательность определяется тем, насколько подробно прописаны пороги
  correct: 1
  id: 029-sb53-context-1
  fingerprint: 7917525b
- concept: 'номер законопроекта не идентифицирует текст: по ходу процесса редакции меняются, поэтому ссылка требует версии и даты'
  question: Две записки ссылаются на один и тот же номер законопроекта, но в одной порог возможностей выше и есть исключение для небольших разработчиков, а в другой — нет. Что это, скорее всего, значит?
  explanation: 'Номер — это идентификатор дела, а не версии текста. Ссылка без редакции и даты равнозначна ссылке на документ без номера версии: проектировать по ней процесс соответствия нельзя, потому что именно правки исключений и порогов решают, попадает ли ваша организация под требование.'
  kind: choice
  options:
    - 'Одна из записок содержит ошибку: у номера один текст'
    - 'Записки описывают разные редакции: номер сохраняется, а текст по ходу процесса правится — уточняются формулировки, добавляются исключения, двигаются пороги'
    - Речь о двух разных законопроектах с совпавшими номерами
    - Порог не относится к тексту законопроекта и задаётся отдельным актом
  correct: 1
