- concept: владелец меры — конкретная роль с полномочием принять решение, иначе в момент срабатывания меры никто не действует
  question: В чек-листе у меры «остановить выпуск при непройденном пороге» владельцем записана «команда разработки». В чём главный дефект такой записи?
  explanation: 'Владелец нужен ровно в тот момент, когда меру надо применить против давления. Коллектив без имени роли даёт диффузию ответственности: каждый ждёт другого, и мера не срабатывает. Роль называют так, чтобы она одновременно имела право решения и несла последствия его неисполнения.'
  kind: choice
  options:
    - Название слишком длинное для отчёта
    - Команда может смениться до релиза
    - 'У записи нет носителя полномочия: коллективная метка не указывает, кто именно вправе остановить релиз и с кого спрашивать, если он не остановлен'
    - Разработчики технически не смогут выполнить остановку
  correct: 2
  id: 026-match-mitigations-2
  fingerprint: cbfce504
- concept: проверяемый результат — наблюдаемый артефакт с моментом «выполнено/нет», проверяемый не автором меры
  question: Чем проверяемый результат меры отличается от обещания вроде «будем внимательнее к безопасности»? Назови признаки, по которым это различают.
  explanation: 'Триада «мера — владелец — результат» держится на последнем звене: без наблюдаемого артефакта чек-лист превращается в декларацию о намерениях, а её выполнение нельзя ни подтвердить, ни оспорить.'
  kind: open
  reference: 'Проверяемый результат — наблюдаемый факт, который оставляет артефакт: журнал прогона заранее заданных атак, отчёт с подписью независимого проверяющего, запись о заблокированном релизе, подтверждённая настройка доступа. У него есть фиксированный момент, когда можно сказать «да» или «нет», и проверить его может кто-то, кроме автора меры. Обещание не имеет ни артефакта, ни момента проверки: его нельзя опровергнуть, поэтому оно не меняет поведение в день релиза.'
  id: 026-match-mitigations-3
  fingerprint: f935a298
