<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracked и Research — две операционные корзины</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f5f7fb;
  --surface: #ffffff;
  --ink: #172033;
  --muted: #5c667a;
  --line: #9ba7ba;
  --tracked: #2764d8;
  --tracked-soft: #e9f0ff;
  --tracked-card: #f7f9ff;
  --research: #7a4cc7;
  --research-soft: #f1eaff;
  --research-card: #fbf8ff;
  --route: #c64040;
  --route-soft: #fff0ef;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #101521;
    --surface: #171e2c;
    --ink: #edf2ff;
    --muted: #aeb8cb;
    --line: #667289;
    --tracked: #79a6ff;
    --tracked-soft: #1b3159;
    --tracked-card: #182640;
    --research: #c3a0ff;
    --research-soft: #352654;
    --research-card: #29213d;
    --route: #ff9292;
    --route-soft: #44272b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--ink); }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
main {
  max-width: 960px;
  margin: auto;
  background: var(--surface);
}
h1 {
  margin: 0;
  padding: 12px 18px;
  font-size: 22px;
  text-align: center;
  background: var(--surface);
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 462px;
  background: var(--surface);
}
.folder {
  stroke-width: 2px;
  stroke-linejoin: round;
}
.tracked-folder { fill: var(--tracked-soft); stroke: var(--tracked); }
.research-folder { fill: var(--research-soft); stroke: var(--research); }
.card {
  stroke-width: 2px;
}
.tracked-card { fill: var(--tracked-card); stroke: var(--tracked); }
.research-card { fill: var(--research-card); stroke: var(--research); }
.count-tracked { fill: var(--tracked); }
.count-research { fill: var(--research); }
.folder-title {
  fill: var(--ink);
  font-size: 20px;
  font-weight: bold;
}
.count {
  fill: #ffffff;
  font-size: 13px;
  font-weight: bold;
}
.card-text {
  fill: var(--ink);
  font-size: 14px;
  font-weight: bold;
}
.note {
  fill: var(--muted);
  font-size: 13px;
}
.route-heading {
  fill: var(--route);
  font-size: 14px;
  font-weight: bold;
}
.route-box {
  fill: var(--route-soft);
  stroke: var(--route);
  stroke-width: 2px;
}
.route-text {
  fill: var(--ink);
  font-size: 12px;
  font-weight: bold;
}
.route-line {
  stroke: var(--route);
  stroke-width: 2px;
  stroke-linecap: round;
}
.route-head { fill: var(--route); }
.research-action {
  fill: var(--surface);
  stroke: var(--research);
  stroke-width: 2px;
}
.research-action-text {
  fill: var(--research);
  font-size: 14px;
  font-weight: bold;
}
.transfer-line {
  stroke: var(--line);
  stroke-width: 2px;
  stroke-linecap: round;
}
.transfer-head { fill: var(--line); }
.transfer-text {
  fill: var(--muted);
  font-size: 12px;
  font-weight: bold;
}
.footer-text {
  fill: var(--ink);
  font-size: 14px;
  font-weight: bold;
}
.fallback {
  fill: var(--ink);
  font-size: 16px;
}
</style>
</head>
<body>
<main>
  <h1 id="diagram-heading">Tracked и Research — две операционные корзины</h1>
  <svg id="diagram" width="960" height="462" viewBox="0 0 960 462"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-heading diagram-description">
    <desc id="diagram-description">Сравнение трёх отслеживаемых возможностей с обязательным маршрутом отчётности и четырёх исследовательских возможностей с возможными мерами.</desc>
  </svg>
</main>
<script>
const data = [
  {
    kind: "meta",
    canvas: { w: 960, h: 462 },
    zero: { x: 0, y: 0 },
    radius: 10,
    fallback: { x: 480, y: 230 },
    footer: {
      line: { x1: 40, y1: 424, x2: 920, y2: 424 },
      text: {
        x: 480, y: 449,
        value: "Корзина определяет обязательства политики, а не уровень опасности"
      }
    }
  },
  {
    kind: "folder",
    theme: "tracked",
    title: "Tracked",
    count: "3 возможности",
    outline: [
      { x: 40, y: 52 }, { x: 40, y: 36 }, { x: 198, y: 36 },
      { x: 220, y: 56 }, { x: 455, y: 56 }, { x: 455, y: 410 },
      { x: 40, y: 410 }
    ],
    titleAt: { x: 62, y: 62 },
    countBox: { x: 292, y: 70, w: 140, h: 28 },
    countAt: { x: 362, y: 89 },
    cards: [
      {
        box: { x: 62, y: 112, w: 370, h: 42 },
        lines: [
          { x: 247, y: 138, value: "Автоматизация исследований и разработок ИИ" }
        ]
      },
      {
        box: { x: 62, y: 164, w: 370, h: 42 },
        lines: [
          { x: 247, y: 190, value: "Усиление кибервозможностей" }
        ]
      },
      {
        box: { x: 62, y: 216, w: 370, h: 42 },
        lines: [
          { x: 247, y: 242, value: "Усиление биологических возможностей" }
        ]
      }
    ],
    routeHeading: {
      x: 247, y: 284,
      value: "ОБЯЗАТЕЛЬНЫЙ МАРШРУТ ДО ДЕПЛОЯ"
    },
    routeBoxes: [
      {
        box: { x: 58, y: 302, w: 108, h: 58 },
        lines: [
          { x: 112, y: 326, value: "Отчёт о" },
          { x: 112, y: 344, value: "возможностях" }
        ]
      },
      {
        box: { x: 194, y: 302, w: 108, h: 58 },
        lines: [
          { x: 248, y: 326, value: "Отчёт о" },
          { x: 248, y: 344, value: "защитах" }
        ]
      },
      {
        box: { x: 330, y: 302, w: 108, h: 58 },
        lines: [
          { x: 384, y: 319, value: "Консультативная" },
          { x: 384, y: 337, value: "группа по" },
          { x: 384, y: 353, value: "безопасности" }
        ]
      }
    ],
    routeArrows: [
      {
        line: { x1: 168, y1: 331, x2: 190, y2: 331 },
        head: [
          { x: 190, y: 331 }, { x: 181, y: 325 }, { x: 181, y: 337 }
        ]
      },
      {
        line: { x1: 304, y1: 331, x2: 326, y2: 331 },
        head: [
          { x: 326, y: 331 }, { x: 317, y: 325 }, { x: 317, y: 337 }
        ]
      }
    ],
    routeNote: {
      x: 247, y: 388,
      value: "Отчёты и рассмотрение запускаются самой категорией"
    }
  },
  {
    kind: "folder",
    theme: "research",
    title: "Research",
    count: "4 возможности",
    outline: [
      { x: 505, y: 52 }, { x: 505, y: 36 }, { x: 663, y: 36 },
      { x: 685, y: 56 }, { x: 920, y: 56 }, { x: 920, y: 410 },
      { x: 505, y: 410 }
    ],
    titleAt: { x: 527, y: 62 },
    countBox: { x: 757, y: 70, w: 140, h: 28 },
    countAt: { x: 827, y: 89 },
    cards: [
      {
        box: { x: 527, y: 112, w: 370, h: 42 },
        lines: [
          { x: 712, y: 138, value: "Долгосрочная автономность" }
        ]
      },
      {
        box: { x: 527, y: 164, w: 370, h: 42 },
        lines: [
          { x: 712, y: 190, value: "Сокрытие возможностей — sandbagging" }
        ]
      },
      {
        box: { x: 527, y: 216, w: 370, h: 58 },
        lines: [
          { x: 712, y: 240, value: "Автономное воспроизведение" },
          { x: 712, y: 258, value: "и адаптация" }
        ]
      },
      {
        box: { x: 527, y: 284, w: 370, h: 42 },
        lines: [
          { x: 712, y: 310, value: "Подрыв защитных мер" }
        ]
      }
    ],
    actionBox: { x: 560, y: 346, w: 304, h: 42 },
    actionAt: {
      x: 712, y: 372,
      value: "возможные меры — potential mitigations"
    },
    routeNote: {
      x: 712, y: 404,
      value: "Наблюдение не запускает обязательный гейт"
    }
  },
  {
    kind: "transfer",
    label: [
      { x: 480, y: 178, value: "ПЕРЕНОС" },
      { x: 480, y: 194, value: "МЕНЯЕТ РЕЖИМ" }
    ],
    arrows: [
      {
        line: { x1: 465, y1: 217, x2: 495, y2: 217 },
        head: [
          { x: 495, y: 217 }, { x: 486, y: 211 }, { x: 486, y: 223 }
        ]
      },
      {
        line: { x1: 495, y1: 239, x2: 465, y2: 239 },
        head: [
          { x: 465, y: 239 }, { x: 474, y: 233 }, { x: 474, y: 245 }
        ]
      }
    ]
  }
];
const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const meta = data.find(item => item.kind === "meta");
  const folders = data.filter(item => item.kind === "folder");
  const transfer = data.find(item => item.kind === "transfer");
  const namespace = "http://www.w3.org/2000/svg";

  function make(name, attributes, value) {
    const element = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, item]) => {
      element.setAttribute(key, item);
    });
    if (value) element.textContent = value;
    return element;
  }

  function add(parent, child) {
    parent.appendChild(child);
    return child;
  }

  function points(items) {
    return items.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");
  }

  function drawRect(parent, box, className) {
    add(parent, make("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.w),
      height: sy(box.h),
      rx: sx(meta.radius),
      class: className
    }));
  }

  function drawText(parent, item, className, anchor) {
    add(parent, make("text", {
      x: sx(item.x),
      y: sy(item.y),
      class: className,
      "text-anchor": anchor
    }, item.value));
  }

  function drawArrow(parent, arrow, lineClass, headClass) {
    add(parent, make("line", {
      x1: sx(arrow.line.x1),
      y1: sy(arrow.line.y1),
      x2: sx(arrow.line.x2),
      y2: sy(arrow.line.y2),
      class: lineClass
    }));
    add(parent, make("polygon", {
      points: points(arrow.head),
      class: headClass
    }));
  }

  function drawCard(parent, card, theme) {
    drawRect(parent, card.box, `card ${theme}-card`);
    card.lines.forEach(line => {
      drawText(parent, line, "card-text", "middle");
    });
  }

  add(svg, make("rect", {
    x: sx(meta.zero.x),
    y: sy(meta.zero.y),
    width: sx(meta.canvas.w),
    height: sy(meta.canvas.h),
    fill: "var(--surface)"
  }));

  folders.forEach(folder => {
    const group = add(svg, make("g", {
      "aria-label": `${folder.title}: ${folder.count}`
    }));

    add(group, make("polygon", {
      points: points(folder.outline),
      class: `folder ${folder.theme}-folder`
    }));

    drawText(group, folder.titleAt, "folder-title", "start");
    drawRect(group, folder.countBox, `count-${folder.theme}`);
    drawText(group, folder.countAt, "count", "middle");

    folder.cards.forEach(card => drawCard(group, card, folder.theme));

    if (folder.theme === "tracked") {
      drawText(group, folder.routeHeading, "route-heading", "middle");
      folder.routeArrows.forEach(arrow => {
        drawArrow(group, arrow, "route-line", "route-head");
      });
      folder.routeBoxes.forEach(box => {
        drawRect(group, box.box, "route-box");
        box.lines.forEach(line => {
          drawText(group, line, "route-text", "middle");
        });
      });
      drawText(group, folder.routeNote, "note", "middle");
    }

    if (folder.theme === "research") {
      drawRect(group, folder.actionBox, "research-action");
      drawText(group, folder.actionAt, "research-action-text", "middle");
      drawText(group, folder.routeNote, "note", "middle");
    }
  });

  transfer.label.forEach(line => {
    drawText(svg, line, "transfer-text", "middle");
  });
  transfer.arrows.forEach(arrow => {
    drawArrow(svg, arrow, "transfer-line", "transfer-head");
  });

  add(svg, make("line", {
    x1: sx(meta.footer.line.x1),
    y1: sy(meta.footer.line.y1),
    x2: sx(meta.footer.line.x2),
    y2: sy(meta.footer.line.y2),
    class: "transfer-line"
  }));
  drawText(svg, meta.footer.text, "footer-text", "middle");
} catch (error) {
  const svg = document.getElementById("diagram");
  const meta = data.find(item => item.kind === "meta");
  const namespace = "http://www.w3.org/2000/svg";
  const message = document.createElementNS(namespace, "text");
  message.setAttribute("x", sx(meta.fallback.x));
  message.setAttribute("y", sy(meta.fallback.y));
  message.setAttribute("text-anchor", "middle");
  message.setAttribute("class", "fallback");
  message.textContent = "Схема: Tracked запускает обязательные отчёты, Research — только возможные меры.";
  svg.replaceChildren(message);
}
</script>
</body>
</html>
