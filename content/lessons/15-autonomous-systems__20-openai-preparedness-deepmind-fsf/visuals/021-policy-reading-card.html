<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карточка быстрого чтения политики</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f0f4fa;
      --ink: #172033;
      --muted: #5f6b7e;
      --line: #cbd4e1;
      --line-strong: #8795aa;
      --good: #18794e;
      --good-soft: #daf3e6;
      --good-ink: #0c5b39;
      --weak: #a45c00;
      --weak-soft: #fff0ce;
      --weak-ink: #754000;
      --accent: #315fa8;
      --accent-soft: #e4edfb;
      --shadow: #dce3ed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #192231;
        --surface-soft: #222e40;
        --ink: #f1f5fb;
        --muted: #acb8ca;
        --line: #3c4b61;
        --line-strong: #65758c;
        --good: #68d6a0;
        --good-soft: #173c2c;
        --good-ink: #a0edc4;
        --weak: #f1b85b;
        --weak-soft: #46351d;
        --weak-ink: #ffd992;
        --accent: #8bb6f2;
        --accent-soft: #243c60;
        --shadow: #0c111a;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 20px;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .card-shadow {
      fill: var(--shadow);
    }

    .card,
    .score-card {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .soft-panel {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .weak-panel {
      fill: var(--weak-soft);
      stroke: var(--weak);
      stroke-width: 1.5px;
    }

    .divider,
    .connector {
      stroke: var(--line);
      stroke-width: 1px;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .connector {
      stroke: var(--weak);
      stroke-width: 2px;
    }

    .heading {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .eyebrow {
      fill: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    .column-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .row-name {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .row-description {
      fill: var(--muted);
      font-size: 13px;
    }

    .status-good {
      fill: var(--good-soft);
      stroke: var(--good);
      stroke-width: 2px;
    }

    .status-weak {
      fill: var(--weak-soft);
      stroke: var(--weak);
      stroke-width: 2px;
    }

    .check {
      stroke: var(--good-ink);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .question {
      fill: var(--weak-ink);
      font-size: 17px;
      font-weight: bold;
    }

    .status-word-good {
      fill: var(--good-ink);
      font-size: 12px;
      font-weight: bold;
    }

    .status-word-weak {
      fill: var(--weak-ink);
      font-size: 12px;
      font-weight: bold;
    }

    .score {
      fill: var(--ink);
      font-size: 35px;
      font-weight: bold;
    }

    .score-caption {
      fill: var(--muted);
      font-size: 13px;
    }

    .dot-good {
      fill: var(--good);
      stroke: var(--good);
      stroke-width: 1px;
    }

    .dot-weak {
      fill: var(--surface);
      stroke: var(--weak);
      stroke-width: 2px;
    }

    .panel-label {
      fill: var(--weak-ink);
      font-size: 12px;
      font-weight: bold;
    }

    .panel-title {
      fill: var(--weak-ink);
      font-size: 17px;
      font-weight: bold;
    }

    .panel-text {
      fill: var(--weak-ink);
      font-size: 13px;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 13px;
    }

    .legend-good {
      fill: var(--good-soft);
      stroke: var(--good);
      stroke-width: 1.5px;
    }

    .legend-weak {
      fill: var(--weak-soft);
      stroke: var(--weak);
      stroke-width: 1.5px;
    }

    .legend-mark-good {
      fill: var(--good-ink);
      font-size: 12px;
      font-weight: bold;
    }

    .legend-mark-weak {
      fill: var(--weak-ink);
      font-size: 13px;
      font-weight: bold;
    }

    #fallback {
      color: var(--ink);
      background: var(--surface);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Карточка быстрого чтения политики</h1>

    <svg id="diagram"
         viewBox="0 0 960 440"
         width="960"
         height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-heading diagram-description">
      <desc id="diagram-description">
        Профиль политики DeepMind: Locate, Classify и Cadence подтверждены,
        а Independence требует проверки из-за преимущественно внутренней SAG.
        Итог быстрого чтения — 3 из 4.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden>
      DeepMind — 3 из 4: Locate, Classify и Cadence подтверждены.
      Independence требует проверки, потому что преимущественно внутренняя
      SAG не равна обязательной независимой внешней оценке.
    </p>
  </main>

  <script>
    const diagramData = [
      {
        kind: "layout",
        canvasWidth: 960,
        canvasHeight: 440,
        shadowShift: 6,
        radius: 14,
        smallRadius: 8,
        cardX: 35,
        cardY: 24,
        cardW: 620,
        cardH: 350,
        scoreX: 680,
        scoreY: 24,
        scoreW: 245,
        scoreH: 350,
        headerLeftX: 62,
        headerTopY: 50,
        headerMainY: 70,
        headerRightX: 625,
        headerDividerY: 84,
        columnY: 108,
        nameX: 62,
        detailX: 228,
        statusX: 585,
        statusWordX: 620,
        statusRadius: 15,
        checkLeft: 578,
        checkMiddle: 584,
        checkRight: 594,
        checkTop: 150,
        checkMiddleY: 157,
        checkBottom: 144,
        connectorStartX: 655,
        connectorEndX: 680,
        scoreLeftX: 706,
        scoreTopY: 52,
        scoreMainY: 112,
        scoreCaptionY: 137,
        dotY: 166,
        dotRadius: 7,
        panelX: 700,
        panelY: 195,
        panelW: 205,
        panelH: 155,
        panelLabelY: 219,
        panelTitleY: 247,
        panelLineOneY: 276,
        panelLineTwoY: 296,
        panelLineThreeY: 325,
        panelLineFourY: 343,
        legendY: 412,
        legendGoodX: 47,
        legendGoodTextX: 68,
        legendWeakX: 514,
        legendWeakTextX: 535,
        legendRadius: 11,
        lineThin: 1,
        lineStrong: 2,
        labelPad: 8,
        fontSmall: 12,
        fontBody: 13,
        fontRow: 17,
        fontHeading: 18,
        fontScore: 35
      },
      {
        kind: "row",
        key: "Locate",
        description: "возможность найдена в тексте",
        anchorY: 143,
        detailY: 163,
        status: "yes",
        statusWord: "ДА",
        dividerY: 177
      },
      {
        kind: "row",
        key: "Classify",
        description: "возможности назначен класс",
        anchorY: 199,
        detailY: 219,
        status: "yes",
        statusWord: "ДА",
        dividerY: 233
      },
      {
        kind: "row",
        key: "Cadence",
        description: "предусмотрен периодический пересмотр",
        anchorY: 255,
        detailY: 275,
        status: "yes",
        statusWord: "ДА",
        dividerY: 289
      },
      {
        kind: "row",
        key: "Independence",
        description: "обязательная внешняя проверка не подтверждена",
        anchorY: 311,
        detailY: 331,
        status: "weak",
        statusWord: "ПРОВЕРИТЬ",
        dividerY: 353
      },
      {
        kind: "dot",
        x: 716,
        status: "yes"
      },
      {
        kind: "dot",
        x: 748,
        status: "yes"
      },
      {
        kind: "dot",
        x: 780,
        status: "yes"
      },
      {
        kind: "dot",
        x: 812,
        status: "weak"
      }
    ];

    const origin = Object.freeze([0, 0]);
    const scale = Object.freeze([1, 1]);
    const [originX, originY] = origin;
    const [scaleX, scaleY] = scale;
    const sx = x => originX + x * scaleX;
    const sy = y => originY + y * scaleY;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const layout = diagramData.find(item => item.kind === "layout");
      const rows = diagramData.filter(item => item.kind === "row");
      const dots = diagramData.filter(item => item.kind === "dot");

      const node = (tag, attributes, content) => {
        const element = document.createElementNS(svg.namespaceURI, tag);
        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, String(value));
        }
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const addRect = (parent, x, y, width, height, className, radius) => {
        const element = node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(x + radius) - sx(x),
          ry: sy(y + radius) - sy(y),
          class: className
        });
        parent.appendChild(element);
        return element;
      };

      const addLine = (parent, xOne, yOne, xTwo, yTwo, className) => {
        const element = node("line", {
          x1: sx(xOne),
          y1: sy(yOne),
          x2: sx(xTwo),
          y2: sy(yTwo),
          class: className
        });
        parent.appendChild(element);
        return element;
      };

      const addCircle = (parent, x, y, radius, className) => {
        const element = node("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(x + radius) - sx(x),
          class: className
        });
        parent.appendChild(element);
        return element;
      };

      const addText = (parent, x, y, content, className, anchor) => {
        const element = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "alphabetic"
        }, content);
        parent.appendChild(element);
        return element;
      };

      addRect(
        drawing,
        originX,
        originY,
        layout.canvasWidth,
        layout.canvasHeight,
        "canvas-background",
        originX
      ).setAttribute("fill", "var(--page)");

      addRect(
        drawing,
        layout.cardX + layout.shadowShift,
        layout.cardY + layout.shadowShift,
        layout.cardW,
        layout.cardH,
        "card-shadow",
        layout.radius
      );

      addRect(
        drawing,
        layout.scoreX + layout.shadowShift,
        layout.scoreY + layout.shadowShift,
        layout.scoreW,
        layout.scoreH,
        "card-shadow",
        layout.radius
      );

      addRect(
        drawing,
        layout.cardX,
        layout.cardY,
        layout.cardW,
        layout.cardH,
        "card",
        layout.radius
      );

      addRect(
        drawing,
        layout.scoreX,
        layout.scoreY,
        layout.scoreW,
        layout.scoreH,
        "score-card",
        layout.radius
      );

      addText(
        drawing,
        layout.headerLeftX,
        layout.headerTopY,
        "БЫСТРЫЙ ПРОФИЛЬ",
        "eyebrow",
        "start"
      );

      addText(
        drawing,
        layout.headerLeftX,
        layout.headerMainY,
        "Четыре строки проверки",
        "heading",
        "start"
      );

      addText(
        drawing,
        layout.headerRightX,
        layout.headerMainY,
        "DeepMind",
        "heading",
        "end"
      );

      addLine(
        drawing,
        layout.cardX,
        layout.headerDividerY,
        layout.cardX + layout.cardW,
        layout.headerDividerY,
        "divider"
      );

      addText(
        drawing,
        layout.nameX,
        layout.columnY,
        "СТРОКА",
        "column-label",
        "start"
      );

      addText(
        drawing,
        layout.detailX,
        layout.columnY,
        "ПРЯМОЕ ОСНОВАНИЕ В ПОЛИТИКЕ",
        "column-label",
        "start"
      );

      addText(
        drawing,
        layout.statusWordX,
        layout.columnY,
        "ОТМЕТКА",
        "column-label",
        "end"
      );

      for (const row of rows) {
        addText(
          drawing,
          layout.nameX,
          row.anchorY,
          row.key,
          "row-name",
          "start"
        );

        addText(
          drawing,
          layout.detailX,
          row.detailY,
          row.description,
          "row-description",
          "start"
        );

        if (row.status === "yes") {
          addCircle(
            drawing,
            layout.statusX,
            row.anchorY,
            layout.statusRadius,
            "status-good"
          );

          addLine(
            drawing,
            layout.checkLeft,
            row.anchorY,
            layout.checkMiddle,
            row.anchorY + layout.labelPad,
            "check"
          );

          addLine(
            drawing,
            layout.checkMiddle,
            row.anchorY + layout.labelPad,
            layout.checkRight,
            row.anchorY - layout.labelPad,
            "check"
          );

          addText(
            drawing,
            layout.statusWordX,
            row.anchorY + layout.labelPad,
            row.statusWord,
            "status-word-good",
            "end"
          );
        } else {
          addCircle(
            drawing,
            layout.statusX,
            row.anchorY,
            layout.statusRadius,
            "status-weak"
          );

          addText(
            drawing,
            layout.statusX,
            row.anchorY + layout.labelPad,
            "?",
            "question",
            "middle"
          );

          addText(
            drawing,
            layout.statusWordX,
            row.anchorY + layout.labelPad,
            row.statusWord,
            "status-word-weak",
            "end"
          );

          addLine(
            drawing,
            layout.connectorStartX,
            row.anchorY,
            layout.connectorEndX,
            row.anchorY,
            "connector"
          );
        }

        addLine(
          drawing,
          layout.cardX + layout.labelPad,
          row.dividerY,
          layout.cardX + layout.cardW - layout.labelPad,
          row.dividerY,
          "divider"
        );
      }

      addText(
        drawing,
        layout.scoreLeftX,
        layout.scoreTopY,
        "DEEPMIND",
        "eyebrow",
        "start"
      );

      addText(
        drawing,
        layout.scoreLeftX,
        layout.scoreMainY,
        "3 из 4",
        "score",
        "start"
      );

      addText(
        drawing,
        layout.scoreLeftX,
        layout.scoreCaptionY,
        "уверенных отметки",
        "score-caption",
        "start"
      );

      for (const dot of dots) {
        addCircle(
          drawing,
          dot.x,
          layout.dotY,
          layout.dotRadius,
          dot.status === "yes" ? "dot-good" : "dot-weak"
        );
      }

      addRect(
        drawing,
        layout.panelX,
        layout.panelY,
        layout.panelW,
        layout.panelH,
        "weak-panel",
        layout.smallRadius
      );

      addText(
        drawing,
        layout.panelX + layout.labelPad,
        layout.panelLabelY,
        "СТРОКА ДЛЯ ПРОВЕРКИ",
        "panel-label",
        "start"
      );

      addText(
        drawing,
        layout.panelX + layout.labelPad,
        layout.panelTitleY,
        "Independence",
        "panel-title",
        "start"
      );

      addText(
        drawing,
        layout.panelX + layout.labelPad,
        layout.panelLineOneY,
        "SAG — преимущественно",
        "panel-text",
        "start"
      );

      addText(
        drawing,
        layout.panelX + layout.labelPad,
        layout.panelLineTwoY,
        "внутренняя проверка.",
        "panel-text",
        "start"
      );

      addText(
        drawing,
        layout.panelX + layout.labelPad,
        layout.panelLineThreeY,
        "Это не обязательная",
        "panel-text",
        "start"
      );

      addText(
        drawing,
        layout.panelX + layout.labelPad,
        layout.panelLineFourY,
        "независимая внешняя оценка.",
        "panel-text",
        "start"
      );

      addCircle(
        drawing,
        layout.legendGoodX,
        layout.legendY - layout.labelPad,
        layout.legendRadius,
        "legend-good"
      );

      addText(
        drawing,
        layout.legendGoodX,
        layout.legendY - layout.labelPad + layout.labelPad,
        "✓",
        "legend-mark-good",
        "middle"
      );

      addText(
        drawing,
        layout.legendGoodTextX,
        layout.legendY,
        "«да» — найдено прямое основание в тексте",
        "legend-text",
        "start"
      );

      addCircle(
        drawing,
        layout.legendWeakX,
        layout.legendY - layout.labelPad,
        layout.legendRadius,
        "legend-weak"
      );

      addText(
        drawing,
        layout.legendWeakX,
        layout.legendY,
        "?",
        "legend-mark-weak",
        "middle"
      );

      addText(
        drawing,
        layout.legendWeakTextX,
        layout.legendY,
        "«?» — ответ пока не подтверждён",
        "legend-text",
        "start"
      );

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
