- concept: сравнение политик ведётся по действующей редакции документа, а не по правилу из прежней версии
  question: 'Аналитик сравнивает политики трёх лабораторий и пишет: «здесь при опасном уровне возможностей обучение обязаны остановить», опираясь на редакцию политики прошлых лет. В чём главная методологическая ошибка?'
  explanation: Обязательства политик переписываются между версиями. Сопоставимой единицей служит правило, действующее сейчас; ссылка на снятое обязательство даёт аккуратную, но ложную таблицу.
  kind: choice
  options:
    - Он сравнивает исторический след правила, а не обязательство действующей редакции
    - Он использует термин другой лаборатории вместо оригинального
    - Он не учитывает, что политики вообще нельзя сравнивать между собой
    - Он опирается на текст политики вместо результатов оценок
  correct: 0
  id: 015-anthropic-known-baseline-1
  fingerprint: 93c72e4e
- concept: разные конструкции политик приводят к одному итогу — отсутствию обязательного действия по одной и той же возможности
  question: Возможность долгосрочной автономности прогоняют через три актуальные политики. Каждая оформляет её по-своему, но обязательного действия не возникает нигде. Что это показывает?
  explanation: Риск нигде не отрицается — различаются механизмы, которые не доводят его до обязательного шага. Совпадение исхода не означает совпадения устройства политик, поэтому читать надо конструкцию, а не итоговую строку.
  kind: choice
  options:
    - 'Отсутствие обязательства достигается разными конструкциями: снятым обязательством, некритичным режимом отслеживания, отсутствием собственной строки в перечне доменов'
    - Все три лаборатории считают эту возможность безопасной и исключили её из политик
    - Три политики используют одинаковую классификацию и потому дают одинаковый исход
    - Одинаковый исход означает, что классификации взаимозаменяемы
  correct: 0
