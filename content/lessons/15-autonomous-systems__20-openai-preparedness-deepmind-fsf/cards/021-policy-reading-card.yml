- concept: добровольное сотрудничество с внешними оценщиками не засчитывается как обязательная независимая проверка
  question: Лаборатория публично привлекала внешних оценщиков к прошлым релизам, но политика нигде не обязывает делать это перед выпуском. Как отметить критерий Independence в профиле политики?
  explanation: 'Independence спрашивает про обязательность, а не про наличие прецедентов: добровольную практику можно прекратить без изменения политики. Пометка «не подтверждено» — не «скорее да»; она указывает, где нужна цитата с обязывающей формулировкой. Дробные баллы разрушают смысл счёта: он считает подтверждённые обязательства, а не впечатления.'
  kind: choice
  options:
    - 'Не засчитывать: обязательства нет, есть добровольная практика'
    - 'Засчитывать: практика подтверждена публично, значит критерий выполнен'
    - Засчитывать наполовину и добавить 0.5 к счёту покрытия
    - 'Не оценивать критерий вовсе: он применим только к политикам с внутренним органом проверки'
  correct: 0
