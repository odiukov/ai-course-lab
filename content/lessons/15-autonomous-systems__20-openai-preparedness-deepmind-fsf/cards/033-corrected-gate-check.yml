- concept: исход сравнения с порогом меняет исправление ненадёжного измерения, а не изменение самого порога
  question: Исходный балл 58 не дотягивал до гейта 65, но после независимой проверки консервативная оценка составила 73, и политика сравнивает с порогом именно её. Почему решение изменилось?
  explanation: 'Ни правило, ни категория не менялись. Менялось качество входного числа: заниженный балл держал возможность под гейтом искусственно, скорректированный показывает реальное положение относительно того же порога 65.'
  kind: choice
  options:
    - Порог был снижен под новый результат
    - Возможность переведена в более строгую категорию политики
    - 'Исправлено измеряемое значение: порог остался прежним, а с ним сравнивают более достоверную оценку возможностей'
  correct: 2
  id: 033-corrected-gate-check-1
  fingerprint: ff5e4421
- concept: применение консервативной поправки не предопределяет пересечение гейта
  question: Гейт равен 90. Внутренняя оценка дала 61, независимая adversarial-проверка — 84. Каков исход проверки порога?
  explanation: Коррекция даёт более достоверное число, а не автоматическое срабатывание гейта. 84 < 90, значит порог не пересечён — но уже на основании верхней наблюдавшейся границы, а не подозрительного 61.
  kind: choice
  options:
    - 'Гейт пересечён: коррекция всегда переводит возможность через порог'
    - 'Гейт не пересечён: скорректированное значение 84 ниже 90'
    - 'Исход не определён: при расхождении измерений порог не проверяется'
  correct: 1
  id: 033-corrected-gate-check-2
  fingerprint: 0cec7b9a
