- concept: два отчёта отвечают на разные вопросы и не заменяют друг друга
  question: 'Команда подготовила к деплою исчерпывающий документ: подробные замеры того, насколько далеко модель продвинулась в опасной области, с графиками и сравнением с предыдущими версиями. Достаточно ли этого пакета для Tracked Category?'
  explanation: Замеры отвечают на вопрос «что модель умеет». Второй отчёт отвечает на другой вопрос — «какая защита стоит и хватает ли её именно против этих возможностей». Подробное измерение опасности не доказывает наличие защиты.
  kind: choice
  options:
    - Да, измерение возможности — самое трудное, остальное формальность
    - Нет, не хватает описания установленных мер защиты и их достаточности
    - Нет, нужен ещё один такой же документ от независимой команды
    - Да, если замеры показали уровень ниже критического порога
  correct: 1
  id: 008-artifacts-before-deploy-1
  fingerprint: e9ae12ad
- concept: 'порядок обязательного маршрута: сначала измерение возможностей, затем описание защиты, затем сопоставление внешним органом, затем деплой'
  question: Расставь в правильном порядке этапы обязательного маршрута перед выпуском модели, попавшей в отслеживаемую категорию.
  explanation: Защиту нельзя обосновать раньше, чем известно, чему она противостоит, а сопоставлять орган может только готовую пару документов. Отсюда фиксированный порядок.
  kind: order
  items:
    - Зафиксировать, что именно умеет модель и насколько серьёзна обнаруженная возможность
    - Описать установленные меры защиты и обосновать их достаточность против этих возможностей
    - Передать оба документа консультативному органу по безопасности для сопоставления возможностей с мерами
    - Выпустить модель после решения этого органа
  id: 008-artifacts-before-deploy-2
  fingerprint: cd06faad
- concept: рассмотрение органом — содержательное сопоставление, а не проверка комплектности
  question: Секретарь проверил, что оба обязательных отчёта загружены, подписаны и лежат в нужной папке, и поставил отметку «рассмотрено». Объясни, почему это не заменяет рассмотрение консультативным органом по безопасности.
  explanation: 'Гейт содержателен: два существующих файла не означают, что защита адекватна возможностям. Смысл проверки — именно в сопоставлении двух документов друг с другом.'
  kind: open
  reference: 'Орган не проверяет наличие файлов, а сопоставляет содержание: соответствуют ли заявленные меры защиты тому уровню возможностей, который зафиксирован в первом отчёте. Комплектный пакет с недостаточными мерами обязан получить отрицательное решение, а формальная проверка комплектности такой случай пропустит.'
  id: 008-artifacts-before-deploy-3
  fingerprint: 09100b9f
