- concept: 'срабатывание монитора информативно, молчание монитора — нет: асимметрия свидетельства'
  question: За месяц мониторинг рассуждений не поднял ни одной тревоги о попытке обойти контроль. Почему из этого не следует, что модель безопасна?
  explanation: 'Классическая асимметрия детектора: находка подтверждает наличие, отсутствие находки не подтверждает отсутствие, пока не измерена чувствительность самого детектора.'
  kind: open
  reference: 'Монитор наблюдает только тот след рассуждения, который выражен и понятен. Тревога означает, что опасная цепочка была и была видна — это положительное свидетельство. Молчание совместимо сразу с несколькими объяснениями: опасного намерения не было, оно было выражено нейтральными словами, оно разбито на безобидные части, или оно вообще не оставило читаемого следа. Монитор к тому же сам ошибается и пропускает случаи. Поэтому отсутствие сигнала — это отсутствие данных, а не доказательство отсутствия.'
  id: 029-monitoring-limit-2
  fingerprint: 4f3b2943
- concept: надёжность мониторинга падает с ростом способностей модели, поэтому защита только на мониторинге ограничена во времени
  question: Почему в политиках прямо признаётся, что автоматический мониторинг не останется достаточным в долгую?
  explanation: Мониторинг опирается на предположение, что опасное намерение будет честно и разборчиво выражено. Это предположение слабеет ровно там, где возможности растут, поэтому метод хорош как ранний датчик, а не как несущая опора защиты.
  kind: choice
  options:
    - Потому что мониторинг слишком дорого масштабировать на большое число запусков
    - Потому что более способная модель может выражать тот же план так, что читаемого следа для монитора не остаётся
    - Потому что мониторинг применяется только после деплоя
    - Потому что монитор нельзя обучать на данных модели, за которой он следит
  correct: 1
