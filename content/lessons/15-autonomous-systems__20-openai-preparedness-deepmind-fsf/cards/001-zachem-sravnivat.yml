- concept: названия категорий политик несопоставимы между лабораториями напрямую, сопоставимы предписанные действия
  question: Почему сравнение политик фронтир-лабораторий по названиям категорий («Tracked», «Research», «Critical», «Moderate», «Tier-1») ненадёжно? Объясни своими словами, что нужно сравнивать вместо названий.
  explanation: Одна и та же возможность бывает загейчена у одной лаборатории и просто наблюдаема у другой при похожих названиях категорий. Ярлык на папке не говорит о том, какие решения эта папка запускает.
  kind: open
  reference: 'Названия — внутренние ярлыки каждой лаборатории, и одинаковое слово у разных документов может запускать разные процедуры, а разные слова — похожие. Сопоставимы только операционные последствия попадания возможности в корзину: требуется ли отчёт и проверка перед деплоем, обязательны ли меры защиты, разрешено ли продолжать обучение и выпуск, кто вправе остановить процесс. Поэтому вопрос при чтении звучит не «есть ли этот риск в списке», а «что лаборатория теперь обязана сделать».'
  id: 001-zachem-sravnivat-2
