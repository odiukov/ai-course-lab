- concept: путь от результата оценки к решению лаборатории проходит через промежуточный узел — категорию политики
  question: Расставь по порядку путь, который проходит опасная возможность модели в политике безопасности лаборатории.
  explanation: Технический результат сам по себе не является командой. Между «обнаружено» и «остановить» всегда стоит правило категоризации, превращающее результат оценки в организационное решение.
  kind: order
  items:
    - Оценка фиксирует наличие возможности у модели
    - Политика относит эту возможность к своей категории или домену риска
    - 'Категория предписывает действие: обязательные меры защиты, запрет деплоя или наблюдение'
  id: 003-policy-pipelines-1
  fingerprint: b0ecf587
- concept: наличие внутреннего органа проверки у всех трёх лабораторий не выравнивает их реакции на одну возможность
  question: У всех трёх фронтир-лабораторий есть внутренний орган проверки моделей перед выпуском. Что из этого следует?
  explanation: Общий элемент структуры — не общий исход. Орган проверки работает по правилам своего документа, а эти правила по-разному связывают категорию с действием.
  kind: choice
  options:
    - Реакция на одну и ту же обнаруженную возможность у них будет совпадать
    - Орган действует внутри своей политики, поэтому предписанные действия по одной возможности всё равно могут различаться
    - Наличие органа заменяет необходимость категоризации возможностей
  correct: 1
  id: 003-policy-pipelines-2
  fingerprint: 288a2492
