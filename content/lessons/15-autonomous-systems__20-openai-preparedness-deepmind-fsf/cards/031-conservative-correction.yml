- concept: задача adversarial-оценки — добиться максимального проявления способности, а не воспроизвести прежний протокол
  question: Внутренний прогон дал 35 баллов, и есть подозрение, что модель занижает результат. Что должна делать независимая adversarial-оценка той же способности?
  explanation: 'Повтор того же протокола повторит и условия, в которых модель занижает результат. Adversarial-оценка атакует сам способ измерения: ищет условия, где способность проявляется полностью. Ответом становится верхняя достигнутая граница, а не средний балл.'
  kind: choice
  options:
    - Повторить исходный протокол без изменений и усреднить результаты прогонов
    - Целенаправленно варьировать формулировки, контекст и стратегии взаимодействия, чтобы вызвать максимально сильное поведение
    - Подтвердить исходный балл, если он воспроизводится в двух прогонах из трёх
  correct: 1
  id: 031-conservative-correction-1
  fingerprint: 68da914c
- concept: независимость проверяющего и adversarial-метод устраняют разные дефекты измерения
  question: Лаборатория поручает adversarial-проверку своей же команде оценки, которая отвечает за срок выпуска модели. Что остаётся незакрытым?
  explanation: Это две разные функции. Adversarial-подход бьёт по слабости протокола измерения, независимость — по конфликту интересов оценщика. Сильный метод в руках заинтересованной стороны всё ещё может остановиться на удобном числе.
  kind: choice
  options:
    - 'Ничего: метод проверки важнее того, кто её проводит'
    - Заинтересованность проверяющего в удобном результате — её убирает независимость, а не сам метод
    - 'Только полнота протокола: нужно больше прогонов'
  correct: 1
  id: 031-conservative-correction-2
  fingerprint: 3f4f8b1b
- concept: порядок действий при подозрительно низком результате оценки способности
  question: Расположи шаги реакции на подозрительно низкий балл внутренней оценки в правильном порядке.
  explanation: 'Пока расхождение не объяснено, низкое число не равноценно высокому: оно может быть следствием занижения. Поэтому сначала снимается статус «ответа», затем убирается заинтересованность, затем атакуется протокол, и только потом фиксируется граница.'
  kind: order
  items:
    - Трактовать низкий балл как гипотезу, а не как итоговое измерение способности
    - Передать проверку той же способности команде, не заинтересованной в исходе
    - Варьировать формулировки, контекст и стратегии взаимодействия ради максимального проявления способности
    - Зафиксировать наибольший достигнутый результат как наблюдаемую верхнюю границу возможностей
  id: 031-conservative-correction-3
  fingerprint: 4f3a5112
