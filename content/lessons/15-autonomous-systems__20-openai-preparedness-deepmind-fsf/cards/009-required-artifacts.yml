- concept: функция артефактов не переоценивает опасность, а выдаёт следствия уже принятого решения
  question: 'Ревьюер предлагает добавить внутрь функции обязательных артефактов проверку: «если в описании возможности встречается слово „биологический“, всегда возвращать полный пакет документов». Объясни, почему это неверно.'
  explanation: 'Границы ответственности: классификация решает «какой режим», гейт — «обязательно ли», список артефактов — «что именно предъявить». Смешивать слои нельзя.'
  kind: open
  reference: 'Функция отвечает на узкий вопрос: какие подтверждения обязательны после решения, уже принятого политикой. Оценка опасности возможности — работа классификации, и решение о гейте принимается там. Проверка по ключевому слову подменяет режим политики собственной эвристикой: возможность из наблюдаемой категории получит обязательный пакет, которого политика не требует, а страшное название начнёт само создавать документы.'
  id: 009-required-artifacts-3
  fingerprint: b939d3cb
