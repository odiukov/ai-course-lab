- concept: срабатывание гейта означает обязательную процедуру решения, а не автоматический запрет выпуска
  question: Возможность попала в отслеживаемую категорию, обязательные отчёты подготовлены и рассмотрены. Что означает срабатывание такого гейта для судьбы модели?
  explanation: Гейт — обязательный порядок принятия решения, а не блокировка. Частая ошибка — читать попадание в отслеживаемую категорию как запрет; на деле это требование пройти процедуру, исход которой может быть любым.
  kind: choice
  options:
    - Выпуск модели автоматически запрещён до следующей версии политики
    - Выпуск возможен, но только после обязательной процедуры подготовки отчётов и их рассмотрения
    - Выпуск разрешён сразу, отчёты нужны лишь для внешней отчётности
    - Выпуск разрешён, если хотя бы один из двух отчётов положительный
  correct: 1
  id: 010-openai-trigger-check-1
  fingerprint: 087d5876
- concept: внимание лаборатории к возможности и обязательное действие — разные вещи
  question: 'Журналист пишет: «Лаборатория официально перечисляет риск потери контроля в своей политике безопасности — значит, перед каждым выпуском она обязана применять против него защитные меры». Объясни, в чём ошибка вывода.'
  explanation: Наличие строки в документе и наличие обязательства — разные уровни. Читать надо не список рисков, а глаголы рядом с ним.
  kind: open
  reference: 'Перечисление возможности говорит лишь о том, что лаборатория за ней следит. Обязанность создаёт режим, в который возможность помещена: только категории с обязательствами запускают подготовку отчётов и рассмотрение перед деплоем. Возможность в исследовательском режиме отслеживается, меры для неё описаны как возможные, и автоматической обязанности применить их перед выпуском нет.'
  id: 010-openai-trigger-check-2
  fingerprint: 6ee72619
