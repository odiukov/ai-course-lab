- concept: 'вывод о строгости из cross-policy diff локален: он держится на одной возможности и одном признаке сравнения'
  question: Сравнение трёх политик по одной возможности показало, что обязательное действие до деплоя требует только одна из них. Какой вывод корректен?
  explanation: Diff собран по одной возможности и одному признаку, поэтому и вывод действует в этих границах. По другой возможности порядок политик может оказаться обратным, а общий рейтинг документов из одной строки не выводится.
  kind: choice
  options:
    - Эта политика строже двух остальных в целом
    - Эта политика строже остальных по данной возможности и по выбранному признаку — наличию обязательного действия
    - Две остальные политики не покрывают эту область риска
  correct: 1
  id: 034-cross-policy-workflow-1
  fingerprint: 566b1afb
- concept: строки cross-policy diff должны содержать одинаковый набор признаков, иначе различие отражает неполноту разбора
  question: В сравнительной таблице для одной политики заполнены категория, гейт, действие и артефакты, а для другой — только категория. Что означает получившееся различие?
  explanation: Пустое поле — это отсутствие разбора, а не отсутствие требования в документе. Сравнивать можно только строки с одинаковым набором признаков; иначе diff измеряет качество собственной работы, а не расхождение политик.
  kind: choice
  options:
    - 'Вторая политика мягче: у неё нет обязательных последствий'
    - 'Различие пока ничего не говорит о политиках: не заполнен одинаковый набор признаков'
    - Строки сравнимы, если совпадает хотя бы категория
  correct: 1
  id: 034-cross-policy-workflow-2
  fingerprint: 10c0ab20
