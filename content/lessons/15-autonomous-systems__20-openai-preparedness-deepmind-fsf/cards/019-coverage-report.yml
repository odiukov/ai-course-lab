- concept: счёт покрытия считается по фиксированному перечню осей, а не по всем истинным полям входного объекта
  question: Функция агрегирует результаты проверки политики. На вход приходит словарь результатов, куда вызывающий код иногда кладёт служебные пометки вроде `parsed_ok`. Чем заполнить пропуск, чтобы служебное поле не завысило счёт?
  explanation: 'Итерация по `results` считает любое истинное поле, поэтому лишняя пометка даёт счёт больше числа осей. Итерация по заранее объявленному перечню осей задаёт и знаменатель, и состав проверки: неизвестные поля игнорируются, отсутствующая ось видна как непройденная.'
  kind: cloze
  template: passed = sum(1 for axis in ___ if results[axis])
  answer: AXES
  accept:
    - AXES
    - EXPECTED_AXES
    - COVERAGE_AXES
    - фиксированный список осей
    - список ожидаемых осей
  id: 019-coverage-report-1
  fingerprint: e181b0a1
- concept: число пройденных осей не восстанавливает состав пробелов, поэтому список непройденных осей — отдельная обязательная часть отчёта
  question: Две политики получили одинаковый счёт покрытия. Объясни своими словами, почему одного счёта недостаточно и зачем отчёт отдельно перечисляет непройденные оси.
  explanation: Агрегация без перечня пробелов превращает отчёт в рейтинг. В уроке DeepMind получает 3 из 4 с провалом по Independence — другая политика с тем же счётом может проваливать Cadence, и продолжать чтение придётся в другом месте.
  kind: open
  reference: 'Счёт — сумма, она теряет информацию о слагаемых. Одинаковое число может означать провал совсем разных осей: у одной политики не подтверждена обязательная внешняя проверка, у другой возможность вообще не находится в документе. Последствия разные: в первом случае нужен вопрос про статус аудитора, во втором политика просто не покрывает интересующую возможность. Список пробелов называет, какую именно строку читать дальше, поэтому агрегирующая функция обязана возвращать и число, и перечень непройденных осей.'
  id: 019-coverage-report-2
  fingerprint: d4910188
- concept: нулевое покрытие — валидный отчёт со счётом 0 и полным перечнем пробелов, а не ошибка или пустой результат
  question: Чек-лист покрытия состоит из шести осей. По проверяемой политике не пройдена ни одна. Что должна вернуть агрегирующая функция?
  explanation: 'Граничные случаи (все оси пройдены и ни одной) должны давать такой же по форме отчёт, как и промежуточные. Исключение или пустой результат ломает единообразие: потребитель отчёта вынужден писать отдельную ветку. Список пробелов при нулевом счёте не избыточен — он показывает, по какому перечню осей велась проверка.'
  kind: choice
  options:
    - Отчёт со счётом 0 из 6, где все шесть осей перечислены как непройденные
    - 'Исключение: политика без единой пройденной оси не поддаётся оценке'
    - Пустой отчёт без списка осей — считать нечего
    - Отчёт только со счётом 0, список пробелов при нулевом счёте избыточен
  correct: 0
