- concept: требование полной автоматизации не выполняется, пока человек остаётся необходимым звеном пайплайна
  question: Система дешевле человеческой команды с AI-инструментами и проходит почти все этапы исследовательского пайплайна, но выбор гипотез и перезапуск неудачных экспериментов остаются за человеком. Как трактуется порог автономности ML R&D?
  explanation: В формулировке порога стоит требование полной автоматизации пайплайна AI-исследований. Пока без человека процесс не идёт, условие не выполнено — независимо от того, насколько выгодна система по стоимости.
  kind: choice
  options:
    - 'Порог достигнут: экономическое условие выполнено, а остаток ручной работы невелик'
    - 'Порог не достигнут: пайплайн автоматизирован не полностью, человек необходим для работы'
    - Порог достигнут условно, а окончательный ответ откладывается до следующей оценки
  correct: 1
  id: 023-ccl-threshold-rule-1
  fingerprint: 1a0940cf
- concept: 'порог становится проверяемым только после фиксации границ сравнения: состава пайплайна, статьи затрат и эталонной команды'
  question: Какие границы нужно зафиксировать заранее, чтобы описание порога автономности превратилось в правило с однозначным ответом, и что произойдёт без этого?
  explanation: Составной порог проверяем ровно настолько, насколько зафиксированы его границы. Именно свобода в определении объёма теста и состава затрат позволяет «достичь» порога или избежать его без изменения самой модели.
  kind: open
  reference: 'Нужно заранее определить: где пайплайн начинается и заканчивается, какие действия считаются необходимыми для его прохождения, что входит в стоимость (вычисления, инфраструктура, сопровождение) и с какой именно человеческой командой с AI-инструментами идёт сравнение. Без этих границ результат подстраивается: сложный этап выносится за пределы теста, ручная помощь не засчитывается как необходимое действие, часть затрат не попадает в расчёт. Порог тогда перестаёт быть проверяемым и превращается в вопрос интерпретации.'
  id: 023-ccl-threshold-rule-2
  fingerprint: 1ec22bf8
