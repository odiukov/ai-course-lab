- concept: Tracked Categories требуют Capabilities Report, Safeguards Report и рассмотрения Safety Advisory Group до деплоя
  question: Что именно запускает попадание возможности в Tracked Categories у OpenAI?
  explanation: Tracked — это отчёты о том, что модель умеет и какие меры защиты стоят, плюс рассмотрение консультативной группой по безопасности до выпуска. Именно эта цепочка и делает категорию гейтом.
  kind: choice
  options:
    - Только внутреннюю заметку о наблюдении за возможностью
    - Capabilities Report и Safeguards Report, которые до деплоя рассматривает Safety Advisory Group
    - Автоматический отказ от обучения модели с такой возможностью
  correct: 1
  id: 006-class-ne-raven-gate-2
  fingerprint: ddc57ffe
- concept: формулировка «potential mitigations» фиксирует возможность мер, а не обязанность их применить
  question: В политике напротив категории риска стоит формулировка вида «observed; potential mitigations». Почему такая запись не создаёт гейта, и чем она отличается от записи, создающей гейт?
  explanation: У всех Research-строк OpenAI действие одинаковое — наблюдение с возможными мерами. Список опасностей ещё не список команд.
  kind: open
  reference: '«Potential» означает возможные меры: лаборатория отслеживает возможность и может применить меры защиты, но не берёт на себя обязательства сделать это при обнаружении. Гейт создаёт формулировка, жёстко связывающая находку с действием — обязательные отчёты и проверка до деплоя, требование мер защиты или отказ обучать и деплоить. Присутствие риска в документе говорит лишь о том, что его заметили; обязательным действие делает предписание, а не тревожность названия.'
  id: 006-class-ne-raven-gate-3
  fingerprint: 0ddcba50
