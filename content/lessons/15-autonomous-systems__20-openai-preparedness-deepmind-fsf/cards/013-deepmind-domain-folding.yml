- concept: FSF v3 содержит прямое обязательство вести автоматический мониторинг deceptive alignment помимо порогов возможностей
  question: Помимо порогов возможностей по доменам, какое прямое обязательство закреплено в Frontier Safety Framework?
  explanation: 'Deceptive alignment monitoring — отдельное обязательство: следить за тем, что модель использует инструментальные рассуждения во вред, а не только измерять уровни возможностей. Это мониторинг поведения, а не порог домена.'
  kind: choice
  options:
    - Автоматический мониторинг злоупотреблений instrumental reasoning (deceptive alignment)
    - Обязательный внешний аудит независимой организацией перед каждым релизом
    - Публикация весов модели после прохождения оценок
    - Остановка обучения при любом достигнутом пороге
