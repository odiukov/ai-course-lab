- concept: Tracked Capability Levels добавляют операционную детализацию внутрь уже существующих порогов домена
  question: Зачем в фреймворк с уже описанными критическими порогами возможностей добавляют дополнительный слой уровней (Tracked Capability Levels)?
  explanation: Слой уровней добавили отдельно и позже основного документа — признак того, что он уточняет измерение, а не меняет структуру доменов.
  kind: open
  reference: 'Критический порог задаёт красную черту, но сам по себе слишком крупен для измерения: непонятно, что именно замерять и какой результат считать приближением к черте. Дополнительные уровни разбивают домен на проверяемые ступени с конкретной формулировкой (например, полная автоматизация исследовательского пайплайна по конкурентной стоимости), поэтому оценку можно проводить и до достижения самой черты. Это детализация внутри домена, а не новый домен и не новое обязательство.'
  id: 013-deepmind-domain-folding-3
