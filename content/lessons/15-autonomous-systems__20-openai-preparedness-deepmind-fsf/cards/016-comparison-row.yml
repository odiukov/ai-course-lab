- concept: строка сравнения строится как цепочка от наименования возможности к обоснованию решения
  question: Расставь части строки сравнения решений в порядке, в котором они выводятся друг из друга.
  explanation: 'Каждая следующая часть опирается на предыдущую: класс определяет наличие гейта, гейт — обязательность действия, действие — состав подтверждающих документов. Порядок и есть проверяемая цепочка вывода.'
  kind: order
  items:
    - 'Класс: как политика назвала возможность'
    - 'Гейт: запускает ли этот класс обязательную контрольную точку'
    - 'Действие: что лаборатория делает с моделью'
    - 'Артефакты: чем это решение должно быть подтверждено'
  id: 016-comparison-row-1
  fingerprint: 8a80db32
- concept: гейт и действие лаборатории отвечают на разные вопросы, поэтому пара «класс + гейт» неполна
  question: Строка сравнения содержит только класс возможности и признак обязательного гейта. Что именно остаётся неизвестным читателю?
  explanation: Гейт отвечает «обязана ли пройти контрольную точку», но не «остановила выпуск, ограничила или просто наблюдает». Без действия и артефактов строка остаётся ярлыком без последствия и без следа обоснования.
  kind: choice
  options:
    - Что лаборатория практически делает с моделью и чем обосновывает это решение
    - К какому домену риска относится возможность
    - Как называется категория в оригинальном тексте политики
    - Запускает ли класс обязательную процедуру
  correct: 0
