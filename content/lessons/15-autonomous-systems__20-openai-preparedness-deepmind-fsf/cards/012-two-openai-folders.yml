- concept: два одинаково грозно звучащих названия могут вести к разным действиям только из-за режима
  question: Две возможности в политике описаны почти одинаково тревожными формулировками, но лежат в разных режимах. Что можно сказать об их обработке перед выпуском модели?
  explanation: 'Сравнивать надо не тревожность текста, а сторону, на которой лежит карточка. Отсюда практический навык чтения политик: смотреть на режим, а не на риторику описания.'
  kind: choice
  options:
    - Обе получат одинаковый набор обязательных проверок, раз описания схожи
    - 'Действия будут разными: обязательную процедуру запускает режим, а не формулировка'
    - Более длинное описание всегда даёт более строгий режим
    - Обе будут только наблюдаться, пока формулировки не разведут
