- concept: нормализация возможностей делается по описанному поведению модели, а не по сходству терминов
  question: В одной политике возможность названа «long-range autonomy», в другой — «автоматизация R&D». Как правильно свести их в общую таблицу сравнения?
  explanation: 'Сопоставление идёт по смыслу описанной способности. Автономность и автоматизация исследований пересекаются, но не совпадают: слияние по похожим словам искажает сравнение исходов.'
  kind: choice
  options:
    - Считать синонимами, поскольку обе про самостоятельную работу модели
    - Сначала определить, какое поведение модели описано, и только затем назначить общий класс — термины могут пересекаться, но не эквивалентны автоматически
    - Оставить каждое название отдельной строкой и не сравнивать политики между собой
  correct: 1
  id: 004-normalized-classification-1
  fingerprint: dfcdea1c
- concept: в сравнительной таблице сохраняются оба слоя — оригинальная формулировка политики и нормализованный класс
  question: Зачем в сравнительной таблице политик хранить одновременно исходную формулировку документа и общий нормализованный класс возможности?
  explanation: 'Два слоя защищают от подмены: класс даёт сравнимость, оригинал — проверяемость. Инструмент остаётся помощником для чтения документов, а не заменой документам.'
  kind: open
  reference: 'Нормализованный класс нужен, чтобы поставить три разных словаря рядом и сравнивать строки. Оригинальная формулировка нужна, чтобы не выдать перевод за оригинал: она показывает, что именно написано в документе, и позволяет проверить, корректно ли сделано сопоставление. Без исходного термина легко забыть, что у каждой политики свои границы категорий и свои последствия для одной и той же способности.'
  id: 004-normalized-classification-2
  fingerprint: 604bec32
