- concept: достижение Tracked Capability Level сообщает положение возможности, но не запускает обязательные меры, привязанные к CCL
  question: Оценка показала, что модель достигла заявленного Tracked Capability Level в домене ML R&D. Что из этого следует напрямую?
  explanation: 'Critical Capability Level — политический порог: его пересечение связано с мерами защиты и решением о деплое. Tracked-отметка служит наблюдению за продвижением возможности между оценками. Название отметки не переносит на неё обязательства CCL.'
  kind: choice
  options:
    - Пересечён критический порог, поэтому выпуск модели должен быть остановлен
    - Зафиксировано положение возможности; связь с обязательными мерами устанавливается только через порог критической возможности
    - Уровень автоматически становится CCL, так как содержит слово Tracked
  correct: 1
  id: 022-ccl-and-tracked-levels-1
  fingerprint: c83e0be5
- concept: Tracked Capability Levels появились как более поздняя надстройка над опубликованной редакцией FSF
  question: Frontier Safety Framework v3 опубликован в сентябре 2025 года, Tracked Capability Levels добавлены 17 апреля 2026 года. Сколько примерно месяцев прошло между публикацией самой редакции и добавлением этой детализации?
  explanation: 'Сентябрь 2025 — апрель 2026 даёт около семи месяцев. Отсюда практическое следствие: сравнивать политики надо по действующей редакции с её более поздними дополнениями, а не по первоначальному тексту документа.'
  kind: numeric
  answer: 7
