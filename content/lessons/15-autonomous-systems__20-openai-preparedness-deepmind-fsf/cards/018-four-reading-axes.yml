- concept: 'оси проверки покрытия политики применяются в фиксированном порядке: найти возможность, определить её операционную категорию, узнать регулярность пересмотра, узнать обязательность внешней проверки'
  question: Инженер оценивает, насколько политика безопасности лаборатории реально покрывает интересующую его возможность. Расставь оси проверки в порядке, при котором каждая следующая имеет смысл только после предыдущей.
  explanation: 'Классифицировать нечего, пока возможность не найдена; спрашивать про периодичность пересмотра и про внешнюю проверку осмысленно только для уже классифицированной возможности. Провал на Locate закрывает вопрос сразу: политика её не покрывает.'
  kind: order
  items:
    - 'Locate: найти место, где возможность вообще рассматривается'
    - 'Classify: определить операционную категорию, в которую она попадает'
    - 'Cadence: выяснить, обещан ли пересмотр по объявленному расписанию'
    - 'Independence: выяснить, обязательна ли внешняя проверка'
  id: 018-four-reading-axes-1
  fingerprint: cbd4f6aa
- concept: объявленное расписание пересмотра сильнее обновления по факту происшествия
  question: Политика A обещает пересмотр раз в полгода независимо от событий. Политика B обещает пересмотр после каждого серьёзного инцидента. По оси Cadence какая формулировка считается более сильной и почему?
  explanation: Инцидентная модель включается только после того, как что-то уже пошло не так, и молчит, пока сбоя нет. Объявленная периодичность даёт гарантированную точку пересмотра до происшествия — поэтому по оси Cadence она сильнее.
  kind: choice
  options:
    - 'A: регулярный цикл не требует сначала дождаться сбоя, чтобы политика обновилась'
    - 'B: реакция на инцидент точнее адресует реальные проблемы, чем календарь'
    - 'Обе равны: любое обещание пересмотра одинаково обязывает лабораторию'
    - 'B: обновление после происшествия всегда происходит быстрее планового'
  correct: 0
  id: 018-four-reading-axes-2
  fingerprint: 69da593c
- concept: счёт по осям указывает место пробела в политике, а не измеряет уровень безопасности лаборатории
  question: Политика проходит Locate, Classify и Cadence, но заключение о безопасности выносит только внутренний орган самой лаборатории. Объясни своими словами, почему такой результат нельзя читать как «политика безопасна на большую часть» и что он на самом деле сообщает.
  explanation: 'Оси качественно разнородны, поэтому доля пройденных не переводится в процент безопасности. Ценность проверки — адресность: она называет конкретную ось, по которой политика не даёт обязательства.'
  kind: open
  reference: 'Оси не складываются в шкалу безопасности: это не доли риска, а разные типы операционной опоры. Результат говорит только одно — где именно в конструкции политики есть опора, а где пробел. Здесь пробел точно локализован на оси Independence: возможность найдена, отнесена к категории с последствиями и попадает под расписание пересмотра, но подтверждение адекватности мер не проверяется никем, кроме самой лаборатории. Это единственный конкретный вывод; арифметическая доля пройденных осей ничего не говорит ни о том, насколько опасна возможность, ни о том, насколько хороши сами меры защиты.'
  id: 018-four-reading-axes-3
  fingerprint: 09f8347b
