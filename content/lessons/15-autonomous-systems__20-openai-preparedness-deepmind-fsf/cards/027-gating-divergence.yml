- concept: 'неизвестное значение гейта не сводится к «гейта нет»: пропуск данных должен оставаться отдельным исходом'
  question: В строке сравнения для одной политики поле гейта отсутствует — данные не собраны. Почему подставлять вместо него False опасно и что делать вместо этого?
  explanation: 'Та же дисциплина, что и в проверке порога: отсутствующее измерение отражается явно, а не заменяется удобным значением по умолчанию.'
  kind: open
  reference: 'False означает содержательное утверждение: политика рассмотрела возможность и обязательного действия не требует. Пропуск данных означает другое: мы не знаем, требует ли. Подстановка превращает незнание в осознанное разрешение, и функция может либо объявить расхождение с политикой, у которой гейт есть, либо, наоборот, скрыть его. Правильно вернуть третий исход — «неизвестно» — и сообщить, по какой политике не хватает данных, чтобы результат сравнения нельзя было прочитать как вывод о её мягкости.'
  id: 027-gating-divergence-3
  fingerprint: e39d3c72
