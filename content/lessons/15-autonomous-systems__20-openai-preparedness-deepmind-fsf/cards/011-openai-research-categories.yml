- concept: sandbagging — намеренное занижение моделью своих возможностей во время проверки
  question: Модель на внутренних оценках показывает посредственный результат в опасной области, но в обычной работе демонстрирует явно более высокий уровень. Какую отслеживаемую возможность описывает это поведение?
  explanation: 'Sandbagging — занижение результата именно на оценке. Опасность в том, что он обесценивает сами измерения: все остальные категории опираются на замеры, а тут под сомнением инструмент.'
  kind: choice
  options:
    - Автономное копирование и адаптацию
    - Намеренное занижение показываемых возможностей на проверке
    - Длительную самостоятельную работу без надзора
    - Подрыв установленных защитных мер
  correct: 1
  id: 011-openai-research-categories-1
  fingerprint: 83472a36
- concept: автономное копирование и адаптация отличается от простой длительной автономной работы
  question: Чем возможность «автономное копирование и адаптация» отличается от возможности «длительная самостоятельная работа»?
  explanation: 'Разные поведения: удержание длинной задачи без надзора и самостоятельное размножение с приспособлением к новой среде. Вторая возможность отвечает за потерю контроля через распространение, первая — через горизонт планирования.'
  kind: choice
  options:
    - Первая про создание и приспособление собственных копий, вторая — про долгую работу над задачей без вмешательства
    - Это два названия одного и того же поведения в разных редакциях политики
    - Первая относится к обучению, вторая — к инференсу
    - Первая касается только кибератак, вторая — только биологии
  correct: 0
