- concept: модальный глагол в тексте политики определяет силу обязательства сильнее, чем название риска
  question: Две строки политики безопасности описывают одинаково страшные возможности. В одной сказано «меры защиты могут быть применены», в другой — «меры защиты должны быть применены до выпуска». Объясни, почему для оценки строгости политики важнее эти глаголы, чем сами названия возможностей.
  explanation: Читать политику надо по глаголам. Одно слово меняет строку из обязательства в намерение при полностью совпадающем названии риска.
  kind: open
  reference: 'Название описывает, чего лаборатория опасается, а глагол — что она обязалась сделать. «Могут» оставляет применение мер на усмотрение: их допустимо исследовать, обсуждать или отложить, и выпуск при этом не блокируется. «Должны до выпуска» создаёт условие, без выполнения которого деплой невозможен. Поэтому строгость измеряется по модальности обязательств, а грозный список рисков сам по себе ничего не гарантирует.'
  id: 011-openai-research-categories-3
  fingerprint: 219a8421
