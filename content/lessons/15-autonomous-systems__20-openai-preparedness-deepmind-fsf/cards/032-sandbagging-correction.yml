- concept: 'поправка асимметрична: она не понижает исходный балл, если независимая проверка оказалась слабее'
  question: Внутренняя оценка дала 84 балла, независимая adversarial-проверка той же способности — 70. Что вернёт консервативная поправка?
  explanation: 'Поправка работает в одну сторону: она не даёт низкому измерению скрыть возможность, но и не отменяет уже наблюдавшуюся высокую. Слабый результат независимой проверки означает лишь, что там способность не воспроизвели, а не что её нет.'
  kind: choice
  options:
    - 70 — приоритет у независимой проверки
    - 77 — среднее двух измерений
    - 84 — наибольший наблюдавшийся результат
