- concept: сравнение двух баллов допустимо только при одной способности и одной шкале
  question: Один балл получен на оценке навыков киберопераций, другой — на оценке автономности, шкалы у них разные. Можно ли подать их в функцию консервативной поправки?
  explanation: Выбор большего числа осмыслен, только когда числа означают одно и то же. Иначе поправка переносит в решение результат чужой шкалы и создаёт видимость измерения там, где его не было.
  kind: choice
  options:
    - Да, функция всё равно выберет более осторожное число
    - 'Нет: сравнивать напрямую можно только два измерения одной способности по одной шкале'
    - Да, если оба балла получены на одной версии модели
  correct: 1
