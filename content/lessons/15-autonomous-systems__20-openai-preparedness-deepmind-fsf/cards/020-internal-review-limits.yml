- concept: внутренний орган проверки перед деплоем подтверждает наличие процедуры, но не закрывает вопрос о независимости оценки
  question: 'В отчёте сказано: решение о деплое модели с высокими возможностями рассмотрела внутренняя группа безопасности лаборатории. Что из этого следует?'
  explanation: Внутренняя группа входит в ту же организацию, которая обучала модель и заинтересована в выпуске. Она даёт предрелизный контроль, но факт её рассмотрения не отвечает на вопрос, кто проверял принимающего риск и на каких условиях.
  kind: choice
  options:
    - Оценка независима, поскольку рассмотрение проведено до выпуска модели
    - Оценка независима, если участники группы обладают достаточной квалификацией
    - Подтверждена процедура предрелизного контроля, но вопрос о независимой внешней оценке остаётся открытым
  correct: 2
  id: 020-internal-review-limits-1
  fingerprint: eaf0a406
- concept: независимость определяется условиями работы проверяющего, а не его внешним статусом
  question: 'Лаборатория наняла стороннюю организацию для оценки модели: она сама выбрала подрядчика, выдала ограниченный набор материалов и запретила публиковать выводы без согласования. Как оценить ось независимости?'
  explanation: 'Независимость проверяется условиями: может ли оценщик запросить исходные данные, выбрать собственные тесты, не согласиться с лабораторией и опубликовать неудобный вывод, и не зависит ли его доступ и оплата от решения разработчика. Внешняя вывеска сама по себе ничего не меняет.'
  kind: choice
  options:
    - 'Независимость обеспечена: оценщик формально не входит в лабораторию'
    - 'Независимость не обеспечена: доступ, выбор тестов и право публикации контролирует проверяемая сторона'
    - Независимость обеспечена частично, так как решающим признаком служит квалификация подрядчика
  correct: 1
  id: 020-internal-review-limits-2
  fingerprint: a2b4a1bb
- concept: утверждения «есть предрелизный контроль» и «есть независимая внешняя оценка» фиксируются в отчёте раздельно
  question: Почему в сравнении политик безопасности эти два утверждения нельзя объединять в одну отметку «проверено»?
  explanation: 'Слитная отметка завышает покрытие: пробел по независимости исчезает из отчёта, хотя именно он определяет, можно ли доверять выводу об уровне риска.'
  kind: open
  reference: 'Первое утверждение говорит только о существовании процедуры внутри организации: комитет собирается и рассматривает решение перед выпуском. Второе — о том, что оценку ведёт сторона, чьи доступ, выбор методов и право на публикацию не контролируются разработчиком. Первое встречается у всех рассматриваемых лабораторий и потому не различает их; второе требует отдельных доказательств. Слово «проверено» скрывает вопрос «кем и на каких условиях» и позволяет засчитать внутренний контроль как независимость.'
  id: 020-internal-review-limits-3
  fingerprint: e89b4ee2
