- concept: формулировка «не больше» кодируется нестрогим сравнением, поэтому значение ровно на границе засчитывается
  question: Критерий порога звучит как «стоимость прогона не больше конкурентной границы». Прогон стоит ровно столько же, сколько граница, и должен считаться достигшим порога. Заполни пропуск.
  explanation: '«Не больше» включает равенство, «не меньше» — тоже. Строгое `<` молча сдвигает красную черту и выводит из-под порога ровно граничный случай, который проверять важнее всего. Отсюда обязательный тест: значение точно на пределе.'
  kind: cloze
  template: cost_ok = run_cost ___ cost_limit
  answer: <=
  accept:
    - <=
    - ≤
    - run_cost <= cost_limit
