- concept: 'отсутствующее обязательное измерение не заменяется догадкой: проверка порога либо даёт отрицательный ответ, либо явно сообщает о нехватке данных'
  question: Порог требует двух измерений. Одно получено и критерий по нему выполнен, второе в результатах оценки отсутствует. Как должна повести себя проверка достижения порога?
  explanation: Пропуск в данных — не наблюдение. Оптимистичная подстановка даёт ложный «порог не достигнут» по причине незнания, подстановка среднего выдумывает измерение. Отрицательный ответ или явный сигнал «данных нет» сохраняет различие между «измерили и не дотянуло» и «не измерили»; второе означает, что оценку надо доделать, а не что вопрос закрыт.
  kind: choice
  options:
    - Вернуть отрицательный ответ или явно сообщить о нехватке данных — по контракту функции
    - Считать недостающий критерий выполненным, раз обратное не доказано
    - Считать недостающий критерий проваленным и на этом остановить оценку модели
    - Подставить среднее по предыдущим прогонам модели
