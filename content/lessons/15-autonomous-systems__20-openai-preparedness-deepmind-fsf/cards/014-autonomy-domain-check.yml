- concept: равномерно распределённая междоменная автономность может не пересечь ни один доменный порог и остаться вне оценки
  question: Объясни, при каком профиле возможностей модели политика с доменными порогами автономности покажет «порогов не достигнуто», хотя суммарная автономность высока.
  explanation: Точность внутри домена и полнота покрытия — разные свойства. Доменная привязка выигрывает в первом и проигрывает во втором.
  kind: open
  reference: 'Если модель умеренно автономна сразу во многих доменах — исследованиях, кибероперациях, прочих областях — но ни в одном не дотягивает до собственного порога домена, каждая доменная оценка вернёт отрицательный результат. Совокупная способность действовать самостоятельно поперёк доменов при этом нигде не суммируется: собственной строки и собственного порога у неё нет. Это слепая зона адресного подхода — междоменный мета-риск остаётся невидимым для процедуры.'
  id: 014-autonomy-domain-check-2
