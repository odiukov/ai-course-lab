- concept: вычисление класса один раз до цикла уничтожает предмет сравнения
  question: Разработчик выносит вызов classify за пределы цикла и переиспользует полученный класс для всех политик. Какой будет результат работы функции сопоставления?
  explanation: Именно классификация различается между политиками, а гейт и артефакты выводятся из неё. Общий класс тянет за собой общий гейт и общий список артефактов — сравнивать становится нечего.
  kind: choice
  options:
    - Строки станут внешне корректными, но расхождение политик исчезнет — таблица покажет одно решение, размноженное трижды
    - Функция упадёт с ошибкой, потому что класс не определён вне цикла
    - Артефакты останутся верными, ошибочным будет только признак гейта
    - Результат не изменится, поскольку класс возможности объективен
  correct: 0
