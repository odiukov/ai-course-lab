- concept: функция сопоставления ставит независимые решения рядом и не выносит собственного вердикта
  question: Какие требования к выходу должна соблюдать функция, сопоставляющая ответы нескольких политик на одну возможность?
  explanation: 'Это инструмент чтения, а не инструмент политики: любое усреднение или ранжирование внутри функции скрывает ровно ту разницу, ради которой её вызывают.'
  kind: open
  reference: 'На входе одна возможность — на выходе по одной полной строке решения на каждую политику, в стабильном порядке, чтобы строки можно было сопоставлять между запусками. Каждая строка собрана независимо: класс, гейт и артефакты вычисляются по правилам своей политики. Функция не агрегирует ответы, не выбирает «более безопасную» политику и не сглаживает расхождения — расхождение и есть полезный результат.'
  id: 017-compare-3
  fingerprint: 7838a719
