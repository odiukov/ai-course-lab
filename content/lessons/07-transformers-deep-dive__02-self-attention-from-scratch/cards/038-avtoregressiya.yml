- concept: причинная маска зануляет веса будущих позиций добавлением минус бесконечности к их логитам до softmax
  question: 'Заполни пропуск в формуле причинного маскирования будущей позиции:'
  explanation: Маска применяется к оценкам до softmax. После добавления минус бесконечности экспонента соответствующего логита становится нулевой, поэтому будущая позиция не вносит вклад в результат attention.
