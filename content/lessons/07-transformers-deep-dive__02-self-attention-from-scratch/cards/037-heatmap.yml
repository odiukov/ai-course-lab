- concept: квантование весов в конечный набор символов теряет точные численные значения
  question: Почему по готовой ASCII-теплокарте с конечным набором символов обычно нельзя восстановить исходную матрицу весов attention?
  explanation: 'Пять уровней яркости — это грубое квантование: множеству разных весов соответствует один символ. Теплокарта сохраняет общую картину контраста, но не все данные исходной матрицы.'
  kind: open
  reference: Каждый символ обозначает целый диапазон нормализованных весов, поэтому разные численные значения могут выглядеть одинаково. Кроме того, деление на максимум скрывает исходный абсолютный масштаб матрицы.
