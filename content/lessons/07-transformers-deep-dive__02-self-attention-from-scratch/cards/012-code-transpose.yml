- concept: двойное транспонирование возвращает исходную матрицу
  question: Объясни своими словами, почему для любой матрицы A выполняется (Aᵀ)ᵀ = A.
  explanation: Транспонирование переводит элемент с позиции (i, j) на позицию (j, i). Повторная операция отправляет его обратно на (i, j), поэтому двойное транспонирование удобно использовать для проверки реализации.
  kind: open
  reference: Первое транспонирование меняет местами индексы каждого элемента, а второе меняет их местами ещё раз. Каждый элемент возвращается на исходную позицию, поэтому восстанавливаются и значения, и форма матрицы.
  id: 012-code-transpose-3
  fingerprint: bdbe9968
