  fingerprint: b73d3e24
- concept: общая для всех позиций матрица проекции даёт разные результаты из-за различий входных эмбеддингов
  question: Одну и ту же матрицу Wq применяют ко всем токенам последовательности. Объясни, почему запросы разных токенов при этом обычно не совпадают.
  explanation: Матрица весов задаёт общее обучаемое преобразование, а не готовый запрос для каждой позиции. Разные эмбеддинги, пропущенные через одно преобразование, обычно дают разные векторы запросов.
  kind: open
  reference: 'Запрос каждого токена вычисляется из его собственного эмбеддинга: q_i = x_i @ Wq. Матрица Wq общая, но входные векторы x_i различаются, поэтому различаются и результаты проекции.'
  id: 007-proekcii-2
  fingerprint: a7a92ea1
