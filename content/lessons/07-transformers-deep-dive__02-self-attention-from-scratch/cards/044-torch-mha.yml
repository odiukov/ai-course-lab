- concept: nn.MultiheadAttention по умолчанию усредняет возвращаемые веса внимания по головам
  question: Что содержит attn_weights, возвращаемый nn.MultiheadAttention с настройками по умолчанию?
  explanation: Каждая голова вычисляет собственную карту внимания, но по умолчанию PyTorch усредняет эти карты по головам. Поэтому отдельной оси голов в attn_weights нет.
  kind: choice
  options:
    - Отдельную матрицу весов для каждой головы
    - Матрицу весов для каждого объекта батча, усреднённую по головам
    - Проекции значений после их конкатенации
    - Одно распределение весов, общее для всех запросов и объектов батча
  correct: 1
  id: 044-torch-mha-1
  fingerprint: 13fc2d50
- concept: batch_first задаёт расположение оси батча во входе и выходе nn.MultiheadAttention
  question: Заполни обозначение первой оси батчевого входа nn.MultiheadAttention при batch_first=True.
  explanation: При batch_first=True вход и выход имеют порядок осей «батч, последовательность, представление». Без этого режима слой ожидает сначала ось последовательности.
  kind: cloze
  template: 'Форма входа: (___, L, E), где L — длина последовательности, а E — размерность представления.'
  answer: B
  accept:
    - B
    - batch
    - размер батча
    - 'N'
  id: 044-torch-mha-2
