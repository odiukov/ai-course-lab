- concept: строка матрицы оценок показывает соответствие одного query всем keys последовательности
  question: Что представляет одна строка матрицы оценок S = QKᵀ в self-attention?
  explanation: Индекс строки выбирает query-токен, а движение по столбцам перебирает key-токены. Поэтому строка целиком описывает, какие позиции последовательности релевантны выбранному query.
  kind: choice
  options:
    - Оценки соответствия одного query всем keys последовательности
    - Все компоненты value-вектора одного токена
    - Оценки одного key относительно всех values
    - Итоговый контекстный вектор после смешивания values
  correct: 0
  id: 014-diagonal-1
  fingerprint: 8da7c8f0
- concept: высокие диагональные оценки возникают из-за сходства query и key, полученных из представления одного токена
  question: Почему в матрице сырых оценок self-attention максимумы часто образуют яркую диагональ?
  explanation: Диагональная ячейка сравнивает query и key одной позиции. Поскольку обе проекции построены из одного исходного представления, такое соответствие часто сильнее межпозиционных, хотя архитектура не гарантирует этого для каждой обученной модели.
  kind: choice
  options:
    - Query и key на одной позиции получены из представления одного токена и часто сильнее похожи друг на друга
    - Softmax принудительно делает диагональные элементы максимальными
    - Каузальная маска оставляет ненулевыми только диагональные элементы
    - Value-векторы напрямую копируются в матрицу оценок
  correct: 0
  id: 014-diagonal-2
  fingerprint: 8626ba4a
