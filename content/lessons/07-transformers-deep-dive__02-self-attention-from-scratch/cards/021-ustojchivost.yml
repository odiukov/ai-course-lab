- concept: softmax инвариантен к одинаковому аддитивному сдвигу всех логитов
  question: Почему вычитание одной и той же константы из всех логитов не меняет результат softmax?
  explanation: Softmax зависит от разностей между логитами, а не от их общего уровня. Например, вычитание максимума сохраняет отношения весов, но переводит вычисления в безопасный числовой диапазон.
  kind: open
  reference: Каждая экспонента приобретает общий множитель exp(-c). Такой же множитель появляется в сумме экспонент в знаменателе и сокращается, поэтому все вероятности остаются прежними.
