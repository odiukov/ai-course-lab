- concept: инициализация Xavier учитывает входную и выходную ширину для устойчивости прямого и обратного проходов
  question: Почему масштаб весов при инициализации Xavier зависит и от входной, и от выходной ширины линейной проекции?
  explanation: 'Учет обеих ширин представляет компромисс: стартовые веса не должны приводить к систематическому росту или затуханию ни активаций при прямом проходе, ни градиентов при обратном.'
  kind: choice
  options:
    - Входная ширина определяет длину последовательности, а выходная — размер батча
    - Входная ширина влияет на разброс активаций в прямом проходе, а выходная — на разброс градиентов в обратном
    - Это гарантирует ортогональность всех столбцов матрицы весов
    - Это делает выходы линейной проекции неотрицательными
  correct: 1
  id: 033-xavier-1
  fingerprint: b9aae543
- concept: вычисление стандартного отклонения весов по правилу Xavier
  question: Для линейной проекции входная ширина равна 18, а выходная — 14. Стандартное отклонение весов задают как квадратный корень из величины, обратной среднему арифметическому этих ширин. Чему оно равно?
  explanation: Среднее арифметическое ширин равно 16. Обратная величина равна 0,0625, а её квадратный корень — 0,25.
  kind: numeric
  answer: 0.25
  tolerance: 0.005
  id: 033-xavier-2
  fingerprint: b88a3047
- concept: для каждой проекционной матрицы в Xavier используется её собственная выходная размерность
  question: Почему при инициализации матрицы Wv вместе с d_model нужно учитывать dv, а не dk?
  explanation: Форма Wv — (d_model, dv), поэтому её fan-in равен d_model, а fan-out равен dv. Размерность dk относится к Wq и Wk и не определяет разброс выхода проекции значений.
  kind: open
  reference: Потому что Wv отображает векторы из пространства размерности d_model в пространство размерности dv. В правиле Xavier учитываются фактические входная и выходная ширины именно инициализируемой матрицы; dk является выходной шириной других проекций.
  id: 033-xavier-3
  fingerprint: '68796167'
