- concept: softmax даёт строго положительный вес даже отрицательной оценке
  question: Как softmax обработает отрицательную оценку внимания?
  explanation: Экспонента любого конечного числа строго положительна. Деление на положительную сумму экспонент сохраняет знак, поэтому даже отрицательная оценка получает положительный ненулевой вес.
  kind: choice
  options:
    - Превратит её в отрицательный вес
    - Автоматически обнулит её
    - Превратит её в положительный ненулевой вес
    - Не сможет нормализовать строку
  correct: 2
  id: 020-softmax-ideya-1
  fingerprint: 34dfd252
- concept: отношение двух весов softmax равно экспоненте разности соответствующих оценок
  question: Пусть s_i и s_j — две оценки, а w_i и w_j — полученные из них веса softmax. Заполни пропуск.
  explanation: 'Общий знаменатель softmax сокращается: exp(s_i) / exp(s_j) = exp(s_i - s_j). Поэтому аддитивная разница оценок превращается в мультипликативный перевес весов.'
  kind: cloze
  template: w_i / w_j = ___
  answer: exp(s_i - s_j)
  accept:
    - e^(s_i - s_j)
    - exp(s_i-s_j)
    - e^(s_i-s_j)
  id: 020-softmax-ideya-2
  fingerprint: 8c6f77be
