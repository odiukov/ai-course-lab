- concept: элемент произведения матриц вычисляется как скалярное произведение строки левой матрицы и столбца правой
  question: Расположите действия для вычисления элемента C[i,j] произведения C = A @ B в правильном порядке.
  explanation: Элемент C[i,j] — это скалярное произведение строки i матрицы A и столбца j матрицы B. Поэтому длина строки должна совпадать с высотой столбца.
  kind: order
  items:
    - Взять строку i матрицы A
    - Взять столбец j матрицы B
    - Перемножить соответствующие элементы выбранной строки и столбца
    - Сложить полученные произведения
