- concept: self-attention без позиционной информации эквивариантен перестановке токенов
  question: Все строки входной матрицы X переставили одной перестановкой. Как при отсутствии позиционной информации изменятся выход SelfAttention и матрица весов?
  explanation: Перестановка строк X одинаково переставляет строки Q, K и V. Поэтому у весов attention переставляются и строки, и столбцы, а взвешенные суммы на выходе просто получают новый порядок строк. Само соответствие между токенами сохраняется.
  kind: open
  reference: 'Строки выхода переставятся так же, как строки X. У матрицы весов той же перестановке подвергнутся обе оси: строки запросов и столбцы ключей.'
