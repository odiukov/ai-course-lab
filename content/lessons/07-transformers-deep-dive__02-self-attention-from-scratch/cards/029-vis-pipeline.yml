- concept: столбец весов attention и строка V с одинаковым индексом должны относиться к одному токену
  question: В реализации self-attention строки матрицы V случайно переставили, а Q и K оставили без изменений. Что произойдёт?
  explanation: Scores и веса зависят только от Q и K, поэтому перестановка V их не изменит. Однако вес в столбце j предназначен для value того же токена j. Если строки V переставить отдельно, сохранится форма вычисления, но нарушится соответствие между выбранным ключом и получаемым содержимым.
  kind: choice
  options:
    - Веса attention останутся прежними, но будут извлекать содержимое не тех токенов
    - Веса и выход останутся прежними, поскольку V не участвует в вычислении scores
    - Строки весов автоматически переставятся так же, как строки V
    - Матричное умножение обязательно завершится ошибкой размерностей
  correct: 0
  id: 029-vis-pipeline-1
  fingerprint: e54559e9
- concept: каждая координата выхода attention является выпуклой комбинацией соответствующих координат value-векторов
  question: Объясни, почему при обычных softmax-весах каждая координата выходного вектора attention остаётся между минимальной и максимальной соответствующей координатой среди всех value-векторов.
  explanation: После softmax строка весов состоит из положительных долей с суммой, равной единице. Умножение этой строки на V отдельно усредняет каждую координату value-векторов, поэтому результат лежит в покоординатном диапазоне исходных значений.
  kind: open
  reference: Softmax-веса неотрицательны и в каждой строке дают в сумме единицу. Поэтому каждая координата выхода — взвешенное среднее соответствующих координат value-векторов, то есть выпуклая комбинация, которая не может выйти за их минимальное и максимальное значения.
  id: 029-vis-pipeline-2
  fingerprint: 73d945fc
