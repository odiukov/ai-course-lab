- concept: в self-attention запросы, ключи и значения относятся к одной и той же последовательности
  question: Какое свойство делает механизм внимания именно self-attention?
  explanation: В self-attention получателями и источниками информации служат позиции одной последовательности. Если запросы относятся к одной последовательности, а ключи и значения — к другой, это cross-attention.
  kind: choice
  options:
    - Каждая позиция обращается только к предыдущей позиции
    - Позиции одной последовательности обращаются к позициям этой же последовательности
    - Декодер обращается к состояниям отдельной входной последовательности
  correct: 1
  id: 002-self-znachit-1
  fingerprint: 4df2b533
- concept: self-attention создаёт прямой путь обмена информацией между удалёнными позициями
  question: Объясни своими словами, почему расстояние между словами в последовательности не увеличивает число последовательных передач информации между ними в self-attention.
  explanation: В рекуррентной модели информация движется по последовательной цепочке состояний. В self-attention любая пара позиций соединена напрямую внутри одного слоя, поэтому слово «коврике» может обратиться к слову «кот» без пяти промежуточных пересказов.
  kind: open
  reference: Каждая позиция напрямую вычисляет внимание к остальным позициям той же последовательности и может получить от них информацию в одном слое. Поэтому удалённым словам не требуется передавать сведения через цепочку промежуточных позиций.
  id: 002-self-znachit-2
  fingerprint: 276b78c8
