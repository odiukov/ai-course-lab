- concept: attention ослабляет рекуррентное бутылочное горлышко прямым доступом ко всем состояниям энкодера
  question: Объясни своими словами, как attention в модели энкодер–декодер помогает восстановить информацию из далёкой части входной последовательности.
  explanation: Без attention декодер вынужден опираться на сжатое представление всей последовательности. Attention позволяет заново обращаться ко всем позициям входа и выбирать релевантные текущему шагу, хотя исходная модель всё ещё использует рекуррентность.
  kind: open
  reference: На каждом шаге декодер вычисляет веса важности для состояний всех позиций энкодера и формирует из них контекст. Поэтому нужная ранняя позиция доступна напрямую, а не только через единственный итоговый сжатый вектор.
  id: 001-uzkoe-gorlo-2
  fingerprint: 7496b754
