- concept: обучаемые матрицы проекций создаются один раз и сохраняются как состояние модуля
  question: Где следует создавать обучаемые матрицы Wq, Wk и Wv в классе self-attention?
  explanation: Обучение обновляет одни и те же параметры на протяжении множества вызовов. Поэтому Wq, Wk и Wv инициализируют в конструкторе, сохраняют в объекте и повторно используют в forward.
  kind: choice
  options:
    - В конструкторе и сохранить как поля объекта
    - Заново внутри forward при каждом вызове
    - Внутри функции softmax после вычисления оценок
  correct: 0
  id: 034-code-self-attention-1
  fingerprint: 48f231f3
- concept: фиксированный seed обеспечивает воспроизводимость случайной инициализации параметров
  question: Объясни своими словами, зачем при случайной инициализации self-attention задают фиксированный seed.
  explanation: Seed фиксирует последовательность случайных чисел, поэтому начальная инициализация воспроизводится. После создания модуля forward использует уже сохранённые матрицы, а алгоритм обучения может их обновлять.
  kind: open
  reference: Фиксированный seed позволяет при повторном создании одинаково настроенного модуля получить те же начальные матрицы весов и воспроизводимые результаты. Он не требует заново инициализировать веса при каждом forward и не мешает обучению впоследствии изменять параметры.
  id: 034-code-self-attention-2
  fingerprint: b2e9d4f5
