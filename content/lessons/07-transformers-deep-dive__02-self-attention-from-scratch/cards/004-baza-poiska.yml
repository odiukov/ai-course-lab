- concept: attention вычисляет выход как взвешенную сумму значений на основе соответствия запроса ключам
  question: Расположите операции вычисления выхода attention для одного query в правильном порядке.
  explanation: Сначала query сравнивается со всеми key. Полученные оценки задают вклад соответствующих value, после чего взвешенные векторы складываются в выход attention.
  kind: order
  items:
    - Вычислить скалярное произведение query с каждым key
    - Определить по полученным оценкам вес каждого value
    - Умножить каждый value на его вес
    - Сложить взвешенные value
