- concept: выходы голов конкатенируются перед общей выходной проекцией
  question: Заполни пропуск в формуле multi-head attention.
  explanation: Результаты голов складываются рядом по признаковому измерению, а выходная проекция W^O смешивает собранную информацию. При усреднении различия между представлениями голов могли бы потеряться.
