- concept: диагональный элемент матрицы оценок сопоставляет query и key одной позиции
  question: Заполни формулу для диагонального элемента матрицы оценок self-attention.
  explanation: На диагонали находятся оценки, в которых query позиции сопоставляется с key той же позиции. В таблице урока эти оценки велики, но self-attention не гарантирует, что диагональный элемент всегда будет максимальным.
  kind: cloze
  template: Sᵢᵢ = ___
  answer: qᵢ · kᵢ
  accept:
    - qᵢᵀkᵢ
    - dot(qᵢ, kᵢ)
  id: 013-matrica-attention-1
  fingerprint: '89534536'
- concept: softmax нормализует каждую строку матрицы оценок отдельно
  question: Почему softmax в self-attention применяют отдельно к каждой строке матрицы оценок, а не ко всей матрице сразу?
  explanation: Строка отвечает одному query и описывает его выбор среди всех keys. Отдельная нормализация строк позволяет каждому токену получить собственный набор весов для последующего смешивания values.
  kind: open
  reference: Каждая строка содержит оценки одного query относительно всех keys. Поэтому её нужно превратить в отдельное распределение весов по позициям последовательности; веса внутри каждой строки в сумме дают единицу.
  id: 013-matrica-attention-2
  fingerprint: 90b2b855
