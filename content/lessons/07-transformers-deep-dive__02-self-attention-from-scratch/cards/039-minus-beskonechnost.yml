- concept: обнуление весов после softmax без повторной нормализации уменьшает масштаб выхода attention
  question: После softmax запрещённые веса обнулили, и сумма оставшихся весов стала равна 0.68. Что произойдёт, если сразу умножить эти веса на V без повторной нормализации?
  explanation: После простого обнуления сумма разрешённых весов меньше единицы, поэтому их взвешенная сумма дополнительно уменьшается в 0.68 раза. Чтобы получить настоящее взвешенное среднее, оставшиеся веса нужно разделить на их сумму.
  kind: choice
  options:
    - Получится тот же контекстный вектор, что и при корректной нормализации
    - Контекстный вектор будет умножен на 0.68 относительно взвешенного среднего по разрешённым позициям
    - У разрешённых позиций появятся отрицательные веса
    - При умножении на V сумма весов автоматически восстановится
