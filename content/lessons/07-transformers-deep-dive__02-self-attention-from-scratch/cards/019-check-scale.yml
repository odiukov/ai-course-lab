- concept: насыщение softmax на больших логитах ослабляет градиенты
  question: Почему слишком большие различия между оценками перед softmax могут замедлить обучение механизма attention?
  explanation: Производные softmax содержат множители вида p(1 − p). Когда p почти равно нулю или единице, эти множители близки к нулю и градиент почти исчезает.
  kind: open
  reference: 'Softmax становится почти однозначным: один вес приближается к единице, остальные — к нулю. В этой насыщенной области производные очень малы, поэтому параметры Q и K получают слабый обучающий сигнал.'
  id: 019-check-scale-1
  fingerprint: 81fce839
- concept: положительное масштабирование оценок сохраняет их порядок, но меняет резкость softmax
  question: Все оценки attention разделили на один и тот же положительный коэффициент больше единицы. Что изменится?
  explanation: Деление на общий положительный коэффициент не меняет отношения «больше — меньше». Однако разрывы между оценками сокращаются, поэтому softmax распределяет вес менее экстремально.
  kind: choice
  options:
    - Максимальная оценка обязательно окажется минимальной
    - Порядок оценок сохранится, но распределение softmax станет менее резким
    - Все веса softmax станут строго одинаковыми
  correct: 1
