- concept: главная диагональ причинной маски должна оставаться разрешённой
  question: Какое условие для индексов строки i и столбца j определяет запрещённые позиции в стандартной причинной маске?
  explanation: Запрещаются только будущие позиции, поэтому маскируются элементы строго выше главной диагонали. При условии j >= i диагональ тоже получила бы −∞, а первая строка оказалась бы полностью замаскирована, что привело бы к неопределённому softmax.
  kind: choice
  options:
    - j > i
    - j >= i
    - j < i
    - j == i
  correct: 0
  id: 040-code-causal-mask-1
  fingerprint: 2fee05d7
- concept: причинная маска зависит от длины последовательности, а не от её содержимого
  question: Можно ли использовать одну и ту же причинную маску для разных последовательностей одинаковой длины? Объясни почему.
  explanation: Маска описывает отношения между индексами позиций, а не свойства входных данных. Для последовательностей одинаковой длины расположение разрешённых и запрещённых ячеек совпадает.
  kind: open
  reference: 'Да. Причинная маска кодирует только допустимое направление внимания между позициями: каждая позиция видит себя и предшествующие позиции. Поэтому при одинаковой длине она не зависит от токенов, эмбеддингов, Q, K или V.'
  id: 040-code-causal-mask-2
  fingerprint: d39452a2
