<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Формы матриц на числах</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5a6472;
    --x:#2563eb; --w:#b45309; --q:#0f766e;
    --xf:#dbeafe; --wf:#fef3c7; --qf:#ccfbf1;
    --line:#94a3b8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --fg:#e8ecf1; --muted:#9aa7b8;
      --x:#7aa7ff; --w:#e0a83a; --q:#4fd1c5;
      --xf:#1c2b45; --wf:#3a2e12; --qf:#11342f;
      --line:#5b6675;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:100%;}
  h2{font-size:15px;margin:8px 10px 2px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{margin:10px;font-size:14px;line-height:1.5;color:var(--fg);}
  text{font-family:inherit;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Формы матриц: X 6×8 · Wq 8×4 = Q 6×4</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (в своих единицах: 1 юнит = 1 строка/столбец матрицы)
    var D = {
      mats: [
        {id:'X',  x:0,  y:0, cols:8, rows:6, fill:'var(--xf)', stroke:'var(--x)',
         title:'X — 6 × 8', sub:'6 слов × 8 чисел'},
        {id:'Wq', x:11, y:1, cols:4, rows:8, fill:'var(--wf)', stroke:'var(--w)',
         title:'Wq — 8 × 4', sub:'одна на всё предложение'},
        {id:'Q',  x:19, y:0, cols:4, rows:6, fill:'var(--qf)', stroke:'var(--q)',
         title:'Q — 6 × 4', sub:'6 запросов × 4 числа'}
      ],
      arrows: [
        {x1:8.6, y1:3, x2:10.6, y2:3, label:'@'},
        {x1:15.4, y1:3, x2:18.6, y2:3, label:'='}
      ],
      // подпись «6 строк» слева от X, «4 числа» под Q
      rowsTick: {x:-0.4, y1:0, y2:6},
      colsTick: {y:6.5, x1:19, x2:23},
      note: {x:13, y:10.4}
    };

    // ---- единственный origin + scale + единственная пара sx/sy
    var SCALE = 26;
    var ORIGIN = {x:78, y:52};
    function sx(x){ return ORIGIN.x + x * SCALE; }
    function sy(y){ return ORIGIN.y + y * SCALE; }

    var W = 700, H = 400;
    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){
      var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); }
      return e;
    }
    function txt(x, y, s, anchor, cls, size){
      var t = el('text', {x:x, y:y, 'text-anchor':anchor,
        'font-size':size||13, fill: cls || 'var(--fg)'});
      t.textContent = s;
      return t;
    }

    var svg = el('svg', {viewBox:'0 0 '+W+' '+H,
      preserveAspectRatio:'xMidYMid meet', role:'img',
      'aria-label':'X 6 на 8, умноженная на Wq 8 на 4, даёт Q 6 на 4'});

    var defs = el('defs', {});
    var mk = el('marker', {id:'ah', viewBox:'0 0 10 10', refX:'9', refY:'5',
      markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse'});
    mk.appendChild(el('path', {d:'M0,0 L10,5 L0,10 z', fill:'var(--line)'}));
    defs.appendChild(mk);
    svg.appendChild(defs);

    // ---- матрицы: сетка ячеек, всё через sx/sy
    D.mats.forEach(function(m){
      var g = el('g', {});
      g.appendChild(el('rect', {
        x:sx(m.x), y:sy(m.y),
        width:sx(m.x + m.cols) - sx(m.x),
        height:sy(m.y + m.rows) - sy(m.y),
        fill:m.fill, stroke:m.stroke, 'stroke-width':2, rx:3}));
      var i;
      for(i = 1; i < m.cols; i++){
        g.appendChild(el('line', {x1:sx(m.x+i), y1:sy(m.y),
          x2:sx(m.x+i), y2:sy(m.y+m.rows),
          stroke:m.stroke, 'stroke-width':0.6, opacity:0.5}));
      }
      for(i = 1; i < m.rows; i++){
        g.appendChild(el('line', {x1:sx(m.x), y1:sy(m.y+i),
          x2:sx(m.x+m.cols), y2:sy(m.y+i),
          stroke:m.stroke, 'stroke-width':0.6, opacity:0.5}));
      }
      // заголовок — сверху по центру
      g.appendChild(txt(sx(m.x + m.cols/2), sy(m.y) - 22,
        m.title, 'middle', m.stroke, 15));
      // подзаголовок — тоже сверху, но своей строкой ниже заголовка
      g.appendChild(txt(sx(m.x + m.cols/2), sy(m.y) - 7,
        m.sub, 'middle', 'var(--muted)', 12));
      svg.appendChild(g);
    });

    // ---- стрелки, подпись у хвоста
    D.arrows.forEach(function(a){
      svg.appendChild(el('line', {x1:sx(a.x1), y1:sy(a.y1),
        x2:sx(a.x2), y2:sy(a.y2),
        stroke:'var(--line)', 'stroke-width':2, 'marker-end':'url(#ah)'}));
      svg.appendChild(txt(sx(a.x1) + 4, sy(a.y1) - 10, a.label, 'start',
        'var(--muted)', 15));
    });

    // ---- «6 строк» слева от X (text-anchor end, чтобы не вылезти за край)
    var rt = D.rowsTick;
    svg.appendChild(el('line', {x1:sx(rt.x), y1:sy(rt.y1),
      x2:sx(rt.x), y2:sy(rt.y2), stroke:'var(--x)', 'stroke-width':1.5}));
    svg.appendChild(txt(sx(rt.x) - 6, sy((rt.y1+rt.y2)/2) - 6,
      '6 строк', 'end', 'var(--x)', 12));
    svg.appendChild(txt(sx(rt.x) - 6, sy((rt.y1+rt.y2)/2) + 9,
      'по слову', 'end', 'var(--muted)', 12));

    // ---- «4 числа в строке» под Q
    var ct = D.colsTick;
    svg.appendChild(el('line', {x1:sx(ct.x1), y1:sy(ct.y),
      x2:sx(ct.x2), y2:sy(ct.y), stroke:'var(--q)', 'stroke-width':1.5}));
    svg.appendChild(txt(sx((ct.x1+ct.x2)/2), sy(ct.y) + 18,
      '4 числа в строке', 'middle', 'var(--q)', 12));

    // ---- ключевая мысль про Wq, отдельной строкой снизу по центру
    svg.appendChild(txt(sx(D.note.x), sy(D.note.y),
      'В Wq шестёрки нет: та же Wq работает и для 6 слов, и для 200.',
      'middle', 'var(--fg)', 13));
    svg.appendChild(txt(sx(D.note.x), sy(D.note.y) + 18,
      'Число слов не меняется — меняется длина строки: 8 → 4.',
      'middle', 'var(--muted)', 12));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fail"><b>Схема не построилась.</b> ' +
      'Она должна показывать: X формы 6 × 8 (шесть строк — слова, восемь чисел в строке), ' +
      'Wq формы 8 × 4 (строки на слово в ней нет — одна матрица на всё предложение), ' +
      'и результат Q = X @ Wq формы 6 × 4: шесть строк остались, длина строки стала 4.</div>';
  }
})();
</script>
</body>
</html>
