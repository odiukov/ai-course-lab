- concept: порядок обучения MAE через маскирование патчей и восстановление исходных пикселей
  question: Расположите этапы обучения MAE в правильном порядке.
  explanation: MAE сначала маскирует патчи, затем кодировщик обрабатывает только видимую часть. Декодер восстанавливает скрытое содержимое, а ошибка относительно исходной картинки служит сигналом обучения.
  kind: order
  items:
    - Случайно скрыть часть патчей изображения
    - Передать видимые патчи в кодировщик
    - Дать декодеру восстановить скрытые пиксели
    - Сравнить восстановление с исходным изображением и обновить параметры
