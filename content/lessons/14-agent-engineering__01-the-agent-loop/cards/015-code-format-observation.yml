- concept: наблюдение подписывается именем инструмента, потому что за один ход модель может сделать несколько вызовов и результаты без атрибуции неразличимы
  question: За один ход модель вызвала три инструмента. Зачем каждое наблюдение начинать с имени вызванного инструмента?
  explanation: 'Наблюдения приходят в буфер как плоский текст. Голое «41» рядом с «найдено 8 файлов» модель может приписать не тому вызову и связать число с чужим планом. Подпись `get_temperature: 41` снимает неоднозначность. К поиску в реестре и к схеме аргументов это отношения не имеет — они работают на входе вызова, а не на выходе.'
  kind: choice
  options:
