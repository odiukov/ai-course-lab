  question: Поиск отработал штатно и не нашёл ни одного совпадения. Почему форматтер наблюдений не должен возвращать пустую строку и что он возвращает вместо неё?
  explanation: 'Отрицательный результат так же информативен, как положительный, но донести его можно только строкой. Тот же принцип покрывает None и 0: значение, не превращённое в текст, для модели не существует.'
  kind: open
  reference: 'Пустой результат — это тоже факт о мире, и его надо сообщить словами: «search_files: совпадений не найдено». Пустая строка в буфере неотличима от того, что вызов не состоялся или что наблюдение потерялось. Модель, не увидев информации о результате, трактует ход как несостоявшийся и повторяет тот же самый вызов, сжигая ходы бюджета вместо того, чтобы сделать вывод «здесь ничего нет» и сменить стратегию поиска.'
