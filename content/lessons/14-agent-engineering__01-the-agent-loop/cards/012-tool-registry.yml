- concept: схема аргументов задаёт семантику параметра (формат, единицы), а не только его тип; без этого вызов проходит по типу и неверен по смыслу
  question: 'Инструмент объявлен как `book_slot(start: int, duration: int)`, никаких пояснений к параметрам нет. Исполнитель ждёт `start` в unix-секундах, а `duration` в минутах. Модель вызывает `book_slot(start=9, duration=2)`. В чём корневая причина сбоя?'
  explanation: 'Типы совпали — вызов формально валиден и до исполнителя доедет, но смысл не тот: модель прочитала «9» как час, а «2» как часы. Всё, что исполнитель молча предполагает про формат и единицы, должно быть написано в схеме («start — unix-время в секундах, duration — длительность в минутах»), иначе контракт существует только в голове автора кода.'
  kind: choice
  options:
    - Схема объявляет типы, но не семантику аргументов, поэтому модели неоткуда узнать единицы измерения
    - Модель не умеет работать с целыми числами и должна получать строки
    - Исполнитель обязан сам угадывать единицы по величине пришедшего числа
    - 'Ошибка в цикле агента: аргументы надо передавать отдельным ходом, а не вместе с именем'
  correct: 0
