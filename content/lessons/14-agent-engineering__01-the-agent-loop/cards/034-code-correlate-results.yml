- concept: рассогласование множеств идентификаторов — результат с неизвестным id и два результата с одним id — обрабатывается явной политикой, иначе содержимое буфера зависит от порядка прибытия
  question: Корреляция получила результат с идентификатором, которого нет ни среди выданных вызовов, а также два результата с одинаковым идентификатором. Объясни своими словами, почему каждый из этих двух случаев требует явного решения в коде.
  explanation: 'Оба случая — про рассинхрон множества выданных идентификаторов и множества полученных. Тихий пропуск в первом случае даёт заражение контекста чужими данными, во втором — недетерминизм: один и тот же набор вызовов при разных задержках даст разный буфер. Проверять это надо не длиной результата, а перемешанным входом.'
  kind: open
  reference: 'Результат с неизвестным идентификатором приписать некуда: соответствующего вызова модель не делала, и любая попытка пристроить его по остаточному принципу подсунет модели данные, которых она не запрашивала. Такой результат — признак рассогласования на границе исполнителя (лишний или запоздавший ответ прошлого хода), и его место в логе, а не в буфере сообщений. Два результата с одним идентификатором — неопределённость: код обязан зафиксировать политику (берём первый и отбрасываем остальные либо считаем это ошибкой исполнителя), иначе выбранный результат определяется случайным порядком прибытия, и трасса перестаёт быть воспроизводимой при одинаковом входе. Обе ветки проверяются перемешанным входом: подача результатов в обратном порядке не должна менять итоговое сопоставление.'
