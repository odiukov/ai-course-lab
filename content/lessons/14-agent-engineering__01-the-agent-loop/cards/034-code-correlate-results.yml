- concept: 'источник истины при корреляции — список выданных вызовов: обход ведётся по нему, а результаты предварительно индексируются по идентификатору'
  question: Расставь шаги корреляции результатов параллельных вызовов с их вызовами в правильном порядке.
  explanation: Направление обхода определяет, что именно гарантировано. Обход по результатам гарантирует только то, что каждый пришедший ответ куда-то попал; обход по вызовам делает список вызовов источником истины и превращает поиск по идентификатору в единственный способ связать пару. Предварительная индексация нужна, чтобы поиск был за константу, а не квадратичным перебором по 5 вызовам × 5 результатам.
  kind: order
  items:
    - Построить отображение «идентификатор вызова → результат» по пришедшим результатам
    - Идти циклом по списку выданных вызовов, а не по списку результатов
    - Для очередного вызова искать результат в отображении по его идентификатору
    - Сформировать наблюдение и подписать его именем и идентификатором того же вызова
    - Вернуть наблюдения в порядке выданных вызовов
