- concept: детерминированная заглушка модели убирает недетерминизм генерации из числа возможных причин расхождения трасс
  question: Агентный цикл запускают 12 раз с одним и тем же входом, вместо провайдера подключён класс с заранее записанной последовательностью реплик. На седьмом прогоне трасса отличается от остальных. Какой вывод следует?
  explanation: Смысл подмены модели заглушкой — сократить множество подозреваемых до одного. Живая модель имеет право выдать разный текст на одинаковый вход, поэтому расхождение трассы с ней не различает «сломан цикл» и «модель сгенерировала иначе». Со сценарной заглушкой вход строго определяет выход, и любое расхождение локализуется в вашем коде.
  kind: choice
  options:
    - 'Дефект в коде цикла или в сборке контекста: источник текста при одинаковом входе выдаёт одну и ту же последовательность'
    - Модель на этот раз выбрала другой токен — нужно понизить температуру сэмплирования
    - Заглушка исчерпала сценарий раньше срока, что всегда означает ошибку модели
    - 'Расхождение нормально: любой прогон агента недетерминирован по определению'
  correct: 0
  id: 022-toy-llm-idea-1
  fingerprint: 12bc43ad
- concept: заглушка подменяет модель только если соблюдает тот же выходной контракт — цикл зависит от формата текста, а не от источника
  question: Что должна обеспечивать сценарная заглушка, чтобы её можно было подставить вместо провайдера без правок остального цикла?
  explanation: Цикл получает строку и разбирает её — ему безразлично, пришла она из сети или из списка в памяти. Подменяемость держится на совпадении интерфейса и формата вывода. Если заглушка берёт на себя исполнение инструментов или ведение буфера, она проверяет не тот код, который вы отлаживаете, и переход на реального провайдера потребует правок далеко за пределами одного класса.
  kind: choice
  options:
    - Выдавать текст в том же формате, который разбирает парсер цикла, через тот же метод вызова
    - Сама исполнять инструменты и подставлять их результаты в свои реплики
    - Хранить историю сообщений внутри себя, чтобы цикл не собирал буфер
    - Возвращать сразу всю трассу целиком за один вызов
  correct: 0
  id: 022-toy-llm-idea-2
  fingerprint: 77cda82e
- concept: сценарий заглушки обязан содержать шаги с зависимостью по данным, иначе цикл проверен только на независимых вызовах
  question: Учебный набор инструментов для отладки цикла включает запись значения в хранилище и последующее чтение оттуда же. Объясни своими словами, почему пара «сначала записать, потом прочитать» полезнее для проверки цикла, чем два независимых вызова калькулятора.
  explanation: Отладочный сценарий проверяет ровно те свойства цикла, которые в нём задействованы. Связка set-then-get нагружает передачу наблюдения между ходами и накопление состояния; независимые арифметические вызовы этот путь не затрагивают и потому проходят даже на цикле, теряющем результаты инструментов.
  kind: open
  reference: 'Зависимость по данным между ходами проверяет то, чего не проверяет пара независимых вызовов: что результат первого действия действительно вернулся в контекст и оказался доступен при выборе второго. Чтение отдаёт верное значение только если наблюдение от записи попало в буфер и дошло до следующей генерации. Два независимых вычисления пройдут даже при полностью потерянном наблюдении — каждое из них самодостаточно, и сломанная передача результата останется незамеченной. Заодно такой сценарий даёт ветвление: поведение второго хода зависит от исхода первого.'
  id: 022-toy-llm-idea-3
  fingerprint: '18012847'
