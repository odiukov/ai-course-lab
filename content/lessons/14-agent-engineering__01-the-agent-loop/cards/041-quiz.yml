- concept: трасса — полная запись тройок «мысль, действие, наблюдение» за один прогон, и единица разбора поведения агента — прогон целиком, а не отдельный ход
  question: Агент отработал 17 ходов и вернул неверный ответ. Что такое трасса этого прогона и почему для разбора нужна она целиком, а не только последний ход с финальным ответом?
  explanation: 'Трасса — артефакт уровня прогона, а не хода. Разбор ведут по ней: каждая тройка показывает, что агент думал, что сделал и что мир ответил, и расхождение между ожиданием в мысли и текстом наблюдения указывает точку поломки.'
  kind: open
  reference: 'Трасса — полная запись прогона: последовательность всех тройок «мысль (рассуждение) — действие (вызов инструмента с аргументами) — наблюдение (результат исполнения)» от первого хода до остановки. Последний ход показывает только вывод, но не место, где агент ушёл не туда: неверный аргумент на ходу 4, наблюдение с пустым результатом на ходу 9, ветка плана, выбранная после неудачного вызова. Ошибка одного хода дальше распространяется по контексту, поэтому причину видно только в цепочке; трасса — это то, что позволяет восстановить причину без повторного прогона.'
  id: 041-quiz-1
  fingerprint: 040e206f
- concept: 'наблюдение — строковое представление вывода инструмента: структурированный результат попадает в промпт только сериализованным, объект модели не доступен'
  question: Инструмент `search_db` возвращает исполнителю список из 12 объектов-записей со вложенными полями. Что из этого получает модель на следующем ходу?
  explanation: Модель работает с текстом промпта, а не с памятью процесса. Любой вывод инструмента — dict, список, таблица, объект — становится наблюдением только после превращения в строку, поэтому всё, что не попало в эту строку (типы, вложенность, полное число элементов), для модели просто не существует.
  kind: choice
  options:
    - Ссылку на объект списка, которую модель может обойти полем за полем
    - Строку — сериализованное представление этих записей, вставленную в промпт как наблюдение
    - 'Типизированный список: провайдер сохраняет типы полей при передаче'
    - 'Только количество найденных записей: содержимое остаётся на стороне исполнителя'
