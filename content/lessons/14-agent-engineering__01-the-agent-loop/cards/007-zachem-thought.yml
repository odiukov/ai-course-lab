- concept: без явного рассуждения выбор действия определяется набором доступных инструментов, а с ним — целью задачи
  question: Агенту дали 11 инструментов и задачу «найди отчёт за прошлый квартал и выгрузи в CSV». В одной конфигурации он выдаёт только вызовы инструментов, в другой перед каждым вызовом пишет строку рассуждения. Чем принципиально отличается первый ход этих конфигураций?
  explanation: 'Только-Action-агент опирается на список доступных вызовов: подходящая кнопка есть — значит жмём. Строка рассуждения сначала фиксирует гипотезу («отчёты обычно в папке reports, начну с листинга»), и действие выводится из неё. Это первая из работ следа рассуждения — наметить план.'
  kind: choice
  options:
    - Без строки рассуждения действие выбирается из того, что доступно вызвать, а с ней — из намеченного плана достижения цели
    - Без строки рассуждения модель вызывает инструменты медленнее, потому что каждый вызов приходится перегенерировать
    - Без строки рассуждения модель не может передать аргументы в инструмент и вынуждена звать его пустым
    - 'Разницы на первом ходу нет: расхождение накапливается только к концу траектории'
  correct: 0
  id: 007-zachem-thought-1
  fingerprint: f7d87f0a
- concept: неисполняемый текст рассуждения влияет на поведение через обусловливание следующей генерации, а не через изменение среды
  question: Строка `Thought:` не дёргает ни один инструмент и ничего не меняет в окружении. Объясни своими словами, за счёт какого механизма она вообще влияет на поведение агента.
  explanation: Ключ в том, что вывод модели на ходу N становится входом на ходу N+1. Неисполняемый текст — это способ модели записать состояние себе же в контекст. Плата за это — токены и латентность, выигрыш (в исходной статье ReAct — десятки пунктов успешности) идёт целиком из более удачного обусловливания.
  kind: open
  reference: 'Она попадает в контекст и обусловливает следующую генерацию. На каждом обороте цикла модель читает собственный ранее выданный текст как часть входа, поэтому записанная гипотеза и позиция в маршруте влияют на распределение следующих токенов — включая токены выбираемого действия. Эффект целиком внутри модели: среда не меняется, меняется вход, по которому модель условно предсказывает продолжение. Отсюда и то, что прирост даётся сменой формата вывода, без обучения.'
  id: 007-zachem-thought-2
  fingerprint: b3fce863
- concept: канал рассуждения — место, где агент признаёт провал шага и переключает ветку плана; без него исполнение продолжается по исходному сценарию
  question: Агент по плану «открыть шкаф, взять ключ, отпереть дверь» на втором шаге получает наблюдение «шкаф пуст». Он выдаёт только строки действий, без канала рассуждения. Какое поведение наиболее вероятно?
  explanation: 'Наблюдение в контексте — необходимое, но не достаточное условие смены ветки. Нужен ход, на котором агент явно сформулирует «ключа нет, план не годится» — иначе сильнее всего продолжение обусловлено уже начатым сценарием. Это третья работа следа рассуждения: обработка исключения. Отказ инструмента, пустой результат, не тот ответ поиска — все они требуют места, где решение пересматривается.'
  kind: choice
  options:
    - Он продолжит исходный сценарий и попробует отпереть дверь, хотя ключа у него нет
    - Он остановит цикл с ошибкой, потому что предусловие шага не выполнено
    - Он автоматически перестроит план, потому что наблюдение о пустом шкафе уже лежит в контексте
    - Он повторит то же действие, пока не исчерпает бюджет ходов, а затем завершится
  correct: 0
  id: 007-zachem-thought-3
