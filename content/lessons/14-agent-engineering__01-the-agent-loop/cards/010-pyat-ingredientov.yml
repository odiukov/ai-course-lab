- concept: предел ходов калибруется под класс задач; обрыв по лимиту внешне неотличим от неудачи модели, поэтому нужен разбор того, какое условие остановки сработало
  question: 'Инженер выставил один общий предел в 12 ходов для всех своих агентов. Агенты, кликающие по интерфейсу и заполняющие формы, стабильно возвращают пустой результат, и он делает вывод: модель для таких задач слабая. Объясни, где ошибка в рассуждении и как выбирать предел.'
  explanation: Ошибка в том, что единый лимит применён к классам задач с разной длиной траектории, а обрыв по бюджету принят за отказ модели. Различить эти два исхода можно только по тому, какое условие остановки закрыло цикл.
  kind: open
  reference: 'Бюджет ходов — предохранитель от бесконечного цикла, а не оценка сложности задачи. Работа с интерфейсом штатно занимает десятки, иногда сотни шагов: каждый клик — отдельный ход с наблюдением. При лимите 12 цикл обрывается на середине траектории, и снаружи это выглядит так же, как неспособность модели решить задачу, хотя причина — обрыв. Лечится двумя вещами: предел подбирается под класс задач (короткий для одиночного поиска, большой для навигации по интерфейсу), и в логах фиксируется, какое именно условие остановки сработало — терминальное действие модели или исчерпание бюджета. Без этого различия диагноз «модель слабая» ничем не подкреплён.'
  id: 010-pyat-ingredientov-3
