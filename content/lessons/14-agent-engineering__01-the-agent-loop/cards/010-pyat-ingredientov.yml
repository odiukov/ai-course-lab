- concept: штатное завершение цикла задаёт условие остановки по содержимому хода модели, а исчерпание бюджета — аварийный предохранитель
  question: Агент решил задачу, не упёршись ни в один лимит. По какому признаку цикл завершился штатно?
  explanation: 'Stop condition читает ход модели: нет вызовов или есть терминальное действие — цикл выходит. Исчерпание бюджета ходов или токенов тоже останавливает цикл, но это предохранитель, срабатывание которого означает незавершённую задачу. Успешный вызов инструмента, наоборот, требует следующего хода: результат нужно прочитать.'
  kind: choice
  options:
    - В ходе ассистента нет ни одного вызова инструмента (либо модель выдала терминальное действие «готово»)
    - Счётчик оставшихся ходов дошёл до нуля
    - Последний вызов инструмента вернулся без ошибки
    - Буфер сообщений перестал расти по объёму токенов
  correct: 0
