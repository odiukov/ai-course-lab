- concept: 'перехват ошибок инструмента живёт на границе вызова инструмента, а не в обёртке вокруг всего цикла: обработчик выше цикла делает любой сбой терминальным'
  question: Агент вызывает инструмент, который дёргает внешний API; тот отвечает HTTP 422 и клиентская библиотека кидает исключение. В каком месте кода должен стоять обработчик, чтобы агент сохранил шанс доделать задачу?
  explanation: 'Обработчик вокруг цикла ловит исключение уже после того, как итерация оборвалась: следующего хода не будет, и модель никогда не узнает про 422. Перехват внутри итерации оставляет цикл живым — результат вызова (пусть и неуспешный) попадает в буфер, и модель на следующем ходу правит аргумент. Разбор постфактум бесполезен: цикл к этому моменту уже мёртв, а слепой повтор того же вызова только жжёт бюджет ходов.'
  kind: choice
  options:
    - Вокруг всего цикла — один общий try/except на запуск агента, с записью в лог и завершением прогона
    - 'На границе исполнения вызова, внутри итерации: исключение ловится там, превращается в строку результата инструмента и уходит в буфер до следующей генерации'
    - В точке сборки финального ответа — ошибки накапливаются и разбираются, когда цикл уже остановился
    - 'Обработчик не нужен: исполнителю достаточно повторить вызов с теми же аргументами, пока API не ответит успехом'
  correct: 1
  id: 016-check-formatter-1
  fingerprint: 4802abef
- concept: 'результат исполнения существует для модели только как элемент буфера сообщений: побочные каналы (логи, метрики, stdout) не участвуют в следующей генерации'
  question: Исполнитель инструментов пишет полный ответ каждого вызова в структурированный лог и в трейсинг, а в буфер сообщений кладёт только строку «tool executed». Модель на следующем ходу строит план так, будто ничего не узнала. Почему?
  explanation: 'В следующий запрос уезжает буфер сообщений и ничего больше. Всё, что осталось в логах, метриках или stdout, для модели не происходило: она видит факт запуска инструмента и ноль данных о результате. Длина строки, асинхронность записи и реестр тут ни при чём — вопрос в том, какой канал попадает в промпт.'
  kind: choice
  options:
    - Логи и трейсинг — не часть промпта следующего запроса; модель обусловливается только содержимым буфера
    - Потому что строка «tool executed» слишком короткая, модель игнорирует наблюдения меньше определённой длины
    - Потому что запись в лог происходит асинхронно и не успевает до следующего вызова API
    - Потому что реестр инструментов не знает про логгер и не может объявить его модели
  correct: 0
