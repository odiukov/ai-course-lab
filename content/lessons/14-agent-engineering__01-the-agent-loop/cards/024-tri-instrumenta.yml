- concept: инструмент, меняющий состояние, возвращает подтверждение, а не данные, поэтому его корректность проверяется только последующим читающим вызовом
  question: Инструмент записи в хранилище на успешный вызов возвращает наблюдение `ok`. Объясните, почему одного этого наблюдения недостаточно, чтобы убедиться в работоспособности агентного цикла, и какой второй вызов нужен.
  explanation: 'Пишущий инструмент нем: его собственный результат не несёт информации о содержимом состояния. Единственный способ наблюдать эффект мутации — прочитать его отдельным вызовом позже. Поэтому минимальный диагностический набор содержит пару «записать/прочитать»: первый ход молчит, смысл появляется на втором.'
  kind: open
  reference: 'Наблюдение `ok` — подтверждение того, что вызов доехал до исполнителя и не упал; содержательных данных в нём нет. Оно не показывает, записалось ли то самое значение под тем самым ключом, и не показывает, доживёт ли эффект до следующего хода. Нужен второй, читающий вызов на следующем ходе с тем же ключом: его наблюдение либо вернёт записанное значение — тогда доказано, что аргументы подставились верно, реестр развёл имена и история ходов дожила до второй генерации, — либо вернёт пустоту или ошибку, и это видно прямо в трассе. Проверяется здесь именно связка двух ходов, а не отдельный вызов.'
  id: 024-tri-instrumenta-2
