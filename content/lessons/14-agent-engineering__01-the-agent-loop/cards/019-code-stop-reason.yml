- concept: предикат остановки совмещает решение «продолжать» и причину остановки в одном возвращаемом значении через None-сентинел
  question: Функция причины остановки возвращает либо короткую строку-метку, либо None. Что даёт цикл такой None вместо отдельного булева флага «продолжать»?
  explanation: 'Булево значение и метка причины — не два независимых факта: остановка есть тогда и только тогда, когда причина найдена. Возврат Optional[str] делает это инвариантом типа, а не соглашением между двумя функциями, которые могут разойтись. Пустой ответ модели — это отдельная причина остановки (нет вызовов инструментов), а не None.'
  kind: choice
  options:
    - 'Одно значение отвечает сразу на два вопроса: пустое — крутим следующую итерацию, непустое — останавливаемся и уже знаем, под какой причиной'
    - None экономит память по сравнению с булевым значением и строкой
    - None заставляет цикл повторить последний вызов инструмента, чтобы уточнить состояние
    - None означает, что модель вернула пустой ответ и его надо переспросить
