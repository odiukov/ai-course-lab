- concept: 'предикат остановки — чистая функция от состояния: ни инкремента счётчика, ни исключений, ни обращений к модели'
  question: Почему функция, определяющая причину остановки цикла, не должна сама увеличивать счётчик ходов и не должна бросать исключение при непонятном состоянии?
  explanation: 'Смысл функции — назвать причину, а не менять состояние. Инкремент внутри неё даёт двойной счёт с инкрементом в теле цикла и сдвигает границу бюджета. Исключение же выводит остановку из протокола причин: снаружи видно падение, а не метку, и разобрать, финиш это или лимит, уже нечем.'
  kind: choice
  options:
    - 'Иначе решение об остановке уходит в побочный эффект: счётчик получает второго владельца и сдвигается, а исключение обрывает цикл вообще без метки причины'
    - Иначе функцию нельзя будет вызывать из асинхронного кода
    - Иначе модель увидит счётчик ходов в контексте и начнёт подстраивать под него ответы
    - Иначе придётся передавать в функцию весь буфер сообщений, а не последний ход
