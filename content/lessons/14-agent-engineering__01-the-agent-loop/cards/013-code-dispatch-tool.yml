- concept: диспетчер возвращает сырой результат вызова, а форматирование наблюдения живёт вне него
  question: 'Функция-диспетчер агента находит инструмент по имени и вызывает его. Разработчик предлагает заодно сразу собирать внутри неё строку `Observation: ...` для отправки модели. Чем это плохо?'
  explanation: 'Диспетчер отвечает за одно: имя плюс аргументы превратить в фактический вызов и отдать возвращённое значение как есть. Формат наблюдений и запись в буфер меняются часто и независимо, поэтому живут выше. Смешав их, вы получаете функцию, которую нельзя переиспользовать и в которой правка формата рискует сломать вызов.'
  kind: choice
  options:
    - Формат наблюдения окажется вплавлен в точку вызова, и его нельзя будет сменить, не трогая логику маршрутизации
    - Строку `Observation` разрешено собирать только самой модели, а не коду исполнителя
    - Диспетчер потеряет возможность принимать аргументы инструмента
    - Реестр придётся хранить в виде списка вместо словаря
  correct: 0
  id: 013-code-dispatch-tool-1
  fingerprint: 1dbd4e14
- concept: 'порядок работы диспетчера: разбор запроса, поиск в реестре, вызов, возврат значения без преобразования'
  question: Расставьте действия функции-диспетчера инструментов в порядке выполнения при штатном вызове.
  explanation: Диспетчер — единственное место, где имя превращается в исполнение. Поиск обязан идти до вызова (иначе непонятно, что звать), а возврат — без обёртки, потому что решение, как показать результат модели, принимает цикл, а не диспетчер.
  kind: order
  items:
    - Принять имя инструмента и аргументы, с которыми его надо позвать
    - Найти по имени вызываемый объект в реестре инструментов
    - Позвать найденный объект с переданными аргументами
    - Вернуть полученное значение вызывающему коду без преобразований
  id: 013-code-dispatch-tool-2
  fingerprint: f6db305f
- concept: диспетчер обязан звать тот же объект, что лежит в реестре, а не создавать копию инструмента с состоянием
  question: 'Агент делает два хода: сначала `cache.put("region", "Lviv")` возвращает успех, затем `cache.get("region")` возвращает пустое значение. Оба инструмента объявлены в реестре и оба вызываются через диспетчер. Какая причина наиболее вероятна?'
  explanation: 'Пара «записать, потом прочитать тот же ключ» — прямая проверка того, что диспетчер разрешает имя в те же самые объекты, что хранит реестр. Если состояние не переносится между ходами, инструмент пересоздаётся при каждом обращении: вызов формально проходит, а эффект первого хода исчезает. Успех обоих вызовов сам по себе ничего не доказывает — доказывает совпадение прочитанного с записанным.'
  kind: choice
  options:
    - Диспетчер обращается не к живым объектам реестра, а получает свежий экземпляр хранилища на каждый вызов, поэтому запись теряется
    - Модель обязана передавать ключ одинаковым регистром, иначе диспетчер игнорирует аргументы
    - Диспетчер не умеет обрабатывать инструменты с точкой в имени
    - Бюджет ходов исчерпался между записью и чтением, и второй вызов не выполнился
  correct: 0
  id: 013-code-dispatch-tool-3
  fingerprint: 2f246bf4
