- concept: 'предохранитель — остановка по внешней политике: инициируется не моделью и не исчерпанием ресурса, а окружением, и её результат нельзя выдавать как ответ'
  question: Цикл агента остановлен в тот момент, когда агент попытался вызвать инструмент удаления продакшн-таблицы, хотя такой вызов запрещён политикой. Чем эта остановка отличается от остановки по терминальному вызову finish?
  explanation: 'Из пяти поводов остановки два означают успех (терминальный вызов finish и ход ассистента без вызовов инструментов), три — обрыв (кончились ходы, кончились токены, сработал предохранитель). Предохранитель уникален тем, что его источник — политика окружения, а не содержимое хода и не счётчик ресурса. Поэтому цикл обязан возвращать наружу именованный повод: после finish результат отдают, после предохранителя — разбирают инцидент.'
  kind: choice
  options:
    - 'Ничем: любой выход из цикла означает, что модель завершила работу'
    - Решение об остановке принял не сам ход модели и не исчерпание бюджета, а внешняя проверка окружения; траектория оборвана на середине, отдавать её результат пользователю нельзя
    - 'Отличие только в скорости: предохранитель срабатывает раньше, но ответ так же готов'
    - Предохранитель — это разновидность ошибки инструмента, и цикл должен продолжиться следующим ходом
  correct: 1
  id: 017-stop-condition-2
