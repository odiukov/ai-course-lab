- concept: финальный ответ выдаётся терминальным действием, а не свободным текстом — цикл нуждается в явном сигнале остановки в том же формате
  question: 'Траектория агента завершается строкой вида `Action: finish("ответ")`, а не обычным предложением с ответом. Объясни своими словами, зачем ответ оформлен как действие.'
  explanation: Цикл — это программа, а не читатель. Без терминального действия остановка держалась бы на угадывании по тексту; с ним признак завершения формальный, и его нельзя перепутать с очередной репликой рассуждения.
  kind: open
  reference: 'Исполнитель цикла разбирает строки Action и не понимает свободный текст: он не может отличить «модель ответила» от «модель размышляет вслух». Терминальное действие даёт формально распознаваемый сигнал остановки — цикл видит вызов finish, прекращает итерации и берёт аргумент вызова как результат. Плюс единый формат: и рабочие вызовы, и завершение проходят через один парсер, поэтому не нужно отдельной эвристики «похоже, это уже ответ».'
