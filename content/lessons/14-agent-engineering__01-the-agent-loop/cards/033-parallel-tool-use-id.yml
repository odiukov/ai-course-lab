- concept: параллельное исполнение независимых вызовов даёт время хода по максимуму задержек, а последовательные витки — по сумме
  question: Модель выдала в одном ходе пять независимых вызовов инструментов; их собственные задержки — 120, 240, 60, 430 и 90 мс. Все пять выполняются параллельно, накладные расходы диспетчера считаем нулевыми. Сколько миллисекунд займёт исполнение пачки?
  explanation: 'При параллельном исполнении ход ждёт самый медленный вызов: max(120, 240, 60, 430, 90) = 430 мс. Последовательные витки дали бы сумму 940 мс плюс четыре лишних обращения к модели. Выигрыш и появляется из-за замены суммы на максимум, но он законен лишь для вызовов без зависимости по данным: если второй вызов нуждается в результате первого, параллелить нельзя.'
  kind: numeric
  answer: 430
