- concept: 'каждый выданный идентификатор вызова обязан получить парный результат: сбой возвращается результатом с флагом ошибки, а не пропуском элемента'
  question: Модель выдала в одном ходе шесть вызовов. Четыре вернулись успешно, один упал с таймаутом, один — с отказом в доступе. Что нужно отправить обратно в следующем запросе?
  explanation: 'Провайдеры требуют полного соответствия: на каждый идентификатор вызова в ходе ассистента должен прийти ровно один парный результат, иначе запрос отклоняется как некорректный. Сбой — это тоже результат: возвращается тот же идентификатор и текст вроде «timeout» или «permission denied». Пропуск элемента ломает ход, а исключение делает частичный сбой пачки терминальным, хотя четыре вызова из шести дали пригодные данные.'
  kind: choice
  options:
    - Шесть результатов — по одному на каждый идентификатор, причём два неудачных возвращаются как результаты с текстом ошибки
    - Четыре успешных результата, а два неудачных вызова опустить как не давшие данных
    - Один сводный результат на всю пачку с перечислением того, что удалось
    - Четыре успешных результата, а на неудачные поднять исключение и прервать цикл
