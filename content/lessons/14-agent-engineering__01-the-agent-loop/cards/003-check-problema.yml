- concept: 'верность ответа о внешнем состоянии не доказывает агентность: совпасть можно из весов или догадки'
  question: Система отвечает на вопрос о том, какие файлы сейчас лежат в рабочей директории проекта. Ответ оказывается верным. В трассе нет ни одного обращения к файловой системе. Что это говорит об агентности системы?
  explanation: Агентность — свойство контрольного потока, а не качества ответа. Про типовой проект содержимое директории угадывается из распределения, выученного на обучении, и совпадает с реальностью случайно. Проверять надо не результат, а был ли между вопросом и ответом вызов инструмента с возвратом результата в контекст.
  kind: choice
  options:
    - 'Она агент: верно назвать содержимое директории без обращения к ней невозможно'
    - 'Ничего не говорит: совпадение объясняется догадкой или данными, запомненными при обучении'
    - 'Она не агент: агент дал бы менее точный ответ, потому что тратит ходы на инструменты'
    - Ответ на вопрос зависит только от размера модели
  correct: 1
  id: 003-check-problema-1
  fingerprint: 90a65335
- concept: без цикла модель не имеет способа сверить утверждение с миром, поэтому устаревшие веса выдаются с той же уверенностью, что и верные данные
  question: У модели нет инструментов. Её спрашивают про актуальную версию библиотеки, а данные в весах устарели. Объясни, что произойдёт и почему в ответе не будет сигнала о недостоверности.
  explanation: 'Ключ в том, что отсутствие проверки — не дефект формулировки ответа, а следствие устройства: без выхода за пределы разговора у модели нет объекта сравнения, поэтому ложное и верное утверждение выглядят изнутри одинаково.'
  kind: open
  reference: 'Модель сгенерирует устаревшую версию как обычное продолжение текста и остановится. Сверить утверждение с внешним состоянием нечем: единственный источник — веса, и утверждение из устаревших весов производится тем же механизмом и с тем же видом уверенности, что и верное. Отдельного канала «это могло протухнуть» нет, потому что нет наблюдения, с которым можно было бы сравнить. Сигнал появляется только когда генерация прерывается, инструмент возвращает реальное значение и модель продолжает рассуждать уже с ним в контексте.'
  id: 003-check-problema-2
  fingerprint: 14b6449a
