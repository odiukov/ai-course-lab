  question: 'Объясни своими словами: что в агентном цикле меняется, а что остаётся прежним при переходе от промптовых токенов мысли к родному каналу рассуждения?'
  explanation: 'Полезно разделять две вещи: формат обмена с провайдером и логику витка. Смена формата затрагивает сборку запроса и буфера, но не порядок шагов и не предикат остановки — цикл ReAct остаётся тем же самым.'
