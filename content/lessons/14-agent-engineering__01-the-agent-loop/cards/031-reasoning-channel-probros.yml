- concept: 'при токенах Thought: сохранение мысли было побочным эффектом обычного сообщения, при родном рассуждении оно становится отдельной обязанностью сборки буфера'
  question: Команда перевела агента с промптовых токенов `Thought:` на родное рассуждение отдельным полем. Код сборки буфера не трогали. Агент стал на каждом ходу заново перебирать варианты, уже отвергнутые им же 5 ходов назад. Что произошло?
  explanation: 'Промптовый формат `Thought:` делал сохранение мысли бесплатным: мысль была текстом ответа ассистента и попадала в историю вместе с ним. Родное рассуждение живёт в своём поле ответа, мимо тела сообщения, поэтому перенос его в следующий запрос — явная работа клиента. Не сделали её — модель каждый ход стартует без черновика и повторяет уже пройденные ветки.'
  kind: choice
  options:
    - Родное рассуждение потребляет больше входных токенов, и старые сообщения вытесняются из окна
    - Раньше мысль была обычной репликой ассистента и попадала в буфер сама; теперь она приходит отдельным полем, и её надо класть в историю явным кодом
    - Родное рассуждение по спецификации действует только внутри одного вызова API и не предназначено для передачи между ходами
    - Модель с родным рассуждением требует более подробной схемы аргументов инструментов
