- concept: отказ инструмента доставляется модели строкой наблюдения, а не исключением, роняющим цикл
  question: Инструмент внутри агентного цикла вернул HTTP 503 от внешнего сервиса. Как должна повести себя обвязка?
  explanation: 'Форматтер наблюдений — пятый ингредиент цикла и самый недооценённый. Любой отказ стека должен доехать до модели строкой, которую она может прочитать: тогда следующий Thought начнётся с несовпадения (планировал одно, получил 503) и модель сама исправит аргумент, сменит инструмент или сдастся осмысленно. Проброшенное исключение убивает цикл, пустая строка врёт модели об успехе, а немой ретрай зацикливает агента на сервисе, который может быть недоступен надолго.'
  kind: choice
  options:
    - Поймать отказ, отформатировать его как текст наблюдения и положить в буфер очередным ходом инструмента
    - Пробросить исключение наружу и завершить цикл с ошибкой
    - Молча подставить пустую строку результата, чтобы не тратить контекст на текст ошибки
    - Повторить тот же вызов до успеха, не сообщая модели о неудачах
  correct: 0
