- concept: след рассуждения намечает план и удерживает его через несколько ходов — то, чего лишён агент, выдающий только вызовы инструментов
  question: Агент решает многоходовую задачу и выдаёт на каждом ходу только вызов инструмента, без текста рассуждения. Какую способность он при этом теряет по сравнению с ReAct-агентом?
  explanation: 'Результат вызова возвращается в контекст в любом случае — это свойство цикла, а не формата. Теряется другое: текстовый след, в котором зафиксировано, зачем делается шаг и какая часть плана уже пройдена. Без него модель на каждом ходу заново реконструирует намерение из голой истории вызовов.'
  kind: choice
  options:
    - Возможность вызывать несколько инструментов за один ход
    - Возможность намечать план и удерживать своё место в нём на протяжении последовательных ходов
    - Возможность получать результат вызова обратно в контекст
    - Возможность работать с инструментами, которых не было в примерах промпта
