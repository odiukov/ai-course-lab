- concept: строка наблюдения фиксирует расхождение ожидаемого и фактического результата действия и потому даёт основание пересмотреть план
  question: Почему в формате ReAct отдельная запись фактического результата действия важнее для устойчивости агента, чем сама запись рассуждения? Объясни своими словами.
  explanation: Рассуждение и действие модель генерирует сама, наблюдение — нет. Именно асимметрия источника делает третью запись местом, где реальность способна остановить агента; без неё цикл вырождается в исполнение изначального плана вслепую.
  kind: open
  reference: 'Рассуждение — это гипотеза агента о мире, оно порождено той же моделью и потому может быть ошибочным насквозь. Результат действия приходит извне и не зависит от того, что модель ожидала: это единственная точка в ходе, где среда может возразить. Записанный результат делает расхождение между ожиданием и фактом видимым внутри контекста — ошибка инструмента, пустая выдача, не тот объект. На следующем ходу модель формулирует уже другое рассуждение, опираясь на это расхождение. Если результат не фиксируется явно, агент продолжает исполнять первоначальный сценарий, будто шаг удался. Это же объясняет, почему в Hotpot QA ReAct реже галлюцинирует: каждый шаг заземлён на том, что реально вернул поиск.'
  id: 004-react-format-3
  fingerprint: 86ba8e55
