- concept: реестр инструментов выносится за пределы цикла, потому что набор инструментов и логика витка меняются по разным причинам и с разной частотой
  question: Почему реестр инструментов делают отдельным объектом, а не словарём-полем внутри управляющего класса цикла?
  explanation: Границы модулей проводят по осям изменения. Инструменты прирастают по мере задач, а порядок «спросить модель — исполнить вызов — вернуть наблюдение — проверить остановку» стабилен. Если добавление инструмента заставляет открывать цикл, все проверки остановки и бюджета попадают под риск регрессии из-за постороннего изменения.
  kind: choice
  options:
    - 'Чтобы добавление или замена инструмента не требовали правок в теле цикла: набор инструментов меняется часто, а логика витка — почти никогда'
    - Чтобы модель могла обращаться к инструментам напрямую, минуя цикл
    - Чтобы инструменты выполнялись параллельно с генерацией модели
    - Потому что словарь внутри класса не выдерживает больше нескольких ключей
