- concept: модель — не ингредиент цикла, а внешний ответчик за единственной точкой вызова; число мест, где цикл знает о конкретной модели, задаёт цену её замены
  question: 'Объясни своими словами: почему модель не входит в список ингредиентов агентного цикла, и почему количество мест, где цикл её вызывает, — важная характеристика реализации?'
  explanation: 'Разделение «цикл — управляющая структура, модель — внешний ответчик» и есть причина, по которой на заглушке отлаживают именно цикл. Мера связности здесь операциональная: сосчитать места вызова модели. Малое число — свойство кода, а не стиля; оно означает, что стоимость перехода к продовому провайдеру ограничена одним классом.'
  kind: open
  reference: 'Ингредиенты — это части управляющей структуры: буфер истории, реестр инструментов, превращение ошибки в наблюдение, бюджет ходов, условия остановки. Модель находится по другую сторону: цикл ей задаёт вопрос и получает текст хода, а сама она про цикл ничего не знает. Точка контакта одна: отдать буфер сообщений, получить текст следующего хода, разобрать его. Если таких точек ровно одна, замена детерминированной заглушки на сетевого провайдера трогает один класс, а бюджет, остановка, реестр и обработка ошибок остаются нетронутыми — их не нужно перепроверять. Если знание о конкретной модели растекается по циклу (парсинг где-то в проверке остановки, ключи ответа в обработчике ошибок), замена превращается в переписывание цикла, и отладка на бесплатной заглушке перестаёт свидетельствовать о поведении в проде.'
