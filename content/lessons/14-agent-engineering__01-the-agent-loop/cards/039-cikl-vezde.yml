- concept: 'трассировка — слой наблюдаемости: читает витки для инспекции и не участвует в выборе следующего действия'
  question: 'Во фреймворк добавили спаны трассировки: каждый ход, каждый вызов инструмента и каждое наблюдение видны в интерфейсе. Что изменилось в поведении агента?'
  explanation: 'Наблюдаемость и управление — разные слои. Спаны читают то, что цикл уже сделал, и не попадают в контекст следующей генерации, поэтому выбор действия остаётся за моделью. Путать их опасно на отладке: красивый след не признак того, что кто-то влияет на маршрутизацию вызовов.'
  kind: choice
  options:
    - 'Поведение не изменилось: трассировка только фиксирует происходящее, решение о следующем действии по-прежнему принимает модель по содержимому буфера'
    - Агент начинает выбирать более короткие пути, потому что спаны отсекают дублирующие вызовы
    - Ошибки инструментов перестают доходить до модели, так как их перехватывает трассировка
    - Причина остановки определяется агрегатом спанов вместо проверки хода модели
  correct: 0
