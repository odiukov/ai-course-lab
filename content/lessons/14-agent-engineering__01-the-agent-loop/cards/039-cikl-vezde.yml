- concept: при переносе агента между фреймворками риск сосредоточен в обвязке (персистентность, объявление инструментов, маршрутизация между агентами, выражение условия остановки в API), а не в управляющем потоке витка
  question: Инженер уверенно написал свой агентный цикл с нуля и переносит рабочего агента в незнакомый фреймворк. Где сосредоточен риск ошибок при таком переносе и почему знание витка от него не спасает? Объясни своими словами.
  explanation: 'Практический вывод из инвариантности цикла — не «переезд бесплатный», а «читай документацию как список отличий». Отличия ровно там, где фреймворк берёт на себя обязанности: состояние, объявление инструментов, оркестрация, остановка.'
  kind: open
  reference: 'Управляющий поток переносится почти дословно: наблюдение, рассуждение, действие, возврат результата в буфер — одинаковы. Риск живёт в слое вокруг цикла, где у каждого фреймворка своя конвенция: как объявляется реестр инструментов и схема аргументов, где и как персистится состояние (и что попадает в чекпоинт, а что теряется), как выражается условие завершения и предел ходов средствами API фреймворка, как маршрутизируются передачи между несколькими агентами, как ошибка инструмента превращается в наблюдение или в исключение. Знание витка сокращает объём чтения документации, но не отвечает на вопросы этого слоя: там ошибки тихие — агент запускается и крутится, а теряет запись прошлых неудач, роняет цикл на отказе инструмента или молча обрывается не по тому условию.'
  id: 039-cikl-vezde-3
