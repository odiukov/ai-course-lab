- concept: детектор инъекций возвращает перечень найденных признаков вместе с фрагментом-уликой, а не булев вердикт
  question: Функция проверки наблюдения на попытку инъекции может вернуть либо булев вердикт «опасно / безопасно», либо список сработавших признаков с вырезкой исходного фрагмента. Объясни своими словами, почему второй контракт предпочтительнее.
  explanation: 'Детектор — эвристика, и он будет ошибаться в обе стороны. Контракт, который показывает основание, отделяет обнаружение от реакции: одна и та же метка может вести к разной политике в разных развёртываниях, и разбор инцидента возможен без повторного прогона.'
  kind: open
  reference: 'Булев вердикт схлопывает решение внутри детектора: вызывающий слой не знает, что именно сработало, не может выбрать политику (пропустить с меткой, потребовать подтверждения, оборвать ход) и не может разобрать ложное срабатывание постфактум. Список признаков вместе с усечённым фрагментом делает решение наблюдаемым: в трассе видно конкретное основание метки, порог чувствительности можно калибровать по накопленным срабатываниям, а политика остаётся за пределами детектора. Фрагмент нужен именно как улика — по одному имени признака нельзя отличить реальную атаку от совпадения слова.'
  id: 036-code-flag-injection-2
  fingerprint: bf56bfc1
- concept: детектор помечает подозрительный фрагмент, но не вырезает его молча из наблюдения
  question: Детектор сработал на фрагменте внутри вывода инструмента. Почему помеченный фрагмент оставляют в наблюдении, а не удаляют перед записью в буфер?
  explanation: 'Детектор ошибается: сработать может и на безобидной фразе вроде «см. instruction manual». Молча вырезанный кусок — это данные, пропавшие без следа, и модель не отличит их отсутствие от отсутствия в источнике. Метка плюс сохранённый текст оставляют наблюдение полным и делают вмешательство видимым; решение о реакции принимает уровень выше, а не сам детектор — и уж точно не модель, которой адресована инъекция.'
  kind: choice
  options:
    - Потому что тихое удаление отнимает у модели часть реальных данных, и она строит план на неполном наблюдении, не имея признака, что текст был изменён
    - Потому что удаление фрагмента нарушает подсчёт токенов и ломает бюджет контекста
    - Потому что модель обязана сама решить, выполнять ли встроенную инструкцию
    - Потому что фрагмент понадобится позже как обучающий пример для дообучения детектора
