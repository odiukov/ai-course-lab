- concept: наблюдение об ошибке должно нести спецификацию ожидаемого, иначе модель повторяет тот же неверный вызов до исчерпания бюджета
  question: Инструмент отклоняет вызов, и форматтер кладёт в буфер строку «tool failed». Агент повторяет тот же вызов ход за ходом и упирается в бюджет из 12 ходов. Объясни своими словами, что не так с этим наблюдением и какой информацией оно должно быть дополнено.
  explanation: 'Самопочинка агента работает только на информации, попавшей в буфер. Ошибка без указания ожидаемого формата не меняет распределение следующей генерации — модель выдаёт тот же вызов. Полезная эвристика: наблюдение об ошибке должно содержать всё, что понадобилось бы человеку для правки аргумента без чтения документации.'
  kind: open
  reference: 'Строка «tool failed» сообщает факт провала, но не его причину, поэтому у модели нет ничего, что отличало бы следующую попытку от предыдущей: контекст изменился, а основание для другого аргумента — нет. Наблюдение обязано быть диагностическим: какой параметр отвергнут, какое значение пришло, какое ожидалось (формат, единицы, допустимый диапазон, код ошибки). «date: got 20/08, expected YYYY-MM-DD» позволяет исправить аргумент за один ход; «tool failed» превращает цикл в повтор одного и того же действия до срабатывания предохранителя по бюджету.'
  id: 014-observation-formatter-2
  fingerprint: e42e47b9
- concept: форматтер не имеет права маскировать провал под успех или пустой результат — иначе модель строит план на ложной посылке о состоянии мира
  question: Инструмент `delete_records` упал по таймауту, и обёртка вернула в буфер пустую строку — так же, как выглядит успешный вызов без вывода. Чем это опаснее падения цикла с трейсбеком?
  explanation: 'Падение шумно и честно: сбой виден сразу. Молчаливое проглатывание тише и хуже — наблюдение неотличимо от успеха, и агент продолжает по плану, где записи уже удалены, хотя удаление не состоялось; при таймауте вдобавок неизвестно, прошла операция на сервере или нет. Правило «ошибка становится строкой» означает явно маркированную строку провала с причиной, а не подмену провала нейтральным выводом.'
  kind: choice
  options:
    - Падение всегда дешевле по токенам, чем продолжение цикла
    - Модель считает действие выполненным и строит следующие шаги на состоянии мира, которого нет; ошибка не видна ни ей, ни в логе
    - Пустая строка нарушает схему аргументов инструмента в реестре
    - Таймаут — единственный класс сбоя, который нельзя представить строкой
