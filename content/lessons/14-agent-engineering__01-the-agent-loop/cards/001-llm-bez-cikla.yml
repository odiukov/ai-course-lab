- concept: 'один оборот агентного цикла: пауза генерации, внешнее выполнение вызова, возврат результата в контекст, продолжение рассуждения'
  question: Агент должен ответить на вопрос о содержимом файла на диске. Расставь шаги одного оборота цикла в правильном порядке.
  explanation: 'Цикл — это остановка, действие, результат, продолжение. Ключевая деталь: сама модель ничего не выполняет, она только просит; выполняет рантайм, а результат возвращается ей тем же каналом, что и любой другой текст. Оборотов может быть сколько угодно, пока модель не выдаст финальный ответ.'
  kind: order
  items:
    - Модель прерывает генерацию и вместо финального ответа выдаёт запрос на вызов инструмента с аргументами
    - Исполнитель снаружи модели выполняет вызов и получает содержимое файла
    - Результат вызова дописывается в контекст модели как обычный текст
    - Модель продолжает рассуждение, опираясь уже на полученные данные, и выдаёт ответ или следующий вызов
  id: 001-llm-bez-cikla-1
  fingerprint: 4d2f5f72
- concept: память, планирование, субагенты и оценки — надстройки над циклом, ни одна из них не заменяет доступ к инструментам
  question: Какой компонент агентной системы способен заменить собой цикл «вызов инструмента — наблюдение результата»?
  explanation: Память хранит только то, что уже прошло через систему; планировщик расписывает шаги, но выполнять их всё равно нужно вызовами; оценки судят готовый ответ постфактум. Ни одна надстройка не открывает модели канал к файлам, запросам и сети — его открывает только цикл.
  kind: choice
  options:
    - 'Ни один: долговременная память, планировщик, субагенты и оценки — надстройки, которые крепятся к циклу и без него не дают модели доступа к внешнему миру'
    - 'Долговременная память: она хранит все нужные факты, поэтому обращаться наружу больше не требуется'
    - 'Планировщик: он заранее расписывает шаги задачи, что снимает необходимость в вызовах инструментов'
    - 'Оценки (evals): они отсеивают неверные ответы, поэтому проверка фактов действием не нужна'
  correct: 0
  id: 001-llm-bez-cikla-2
  fingerprint: ab722be9
- concept: галлюцинацию о состоянии внешнего мира устраняет изменение окружения модели, а не формулировка промпта или настройки сэмплинга
  question: Модель уверенно перечисляет параметры из файла настроек, который она никогда не открывала. Что действительно устраняет такую выдумку?
  explanation: 'Проблема не в характере модели, а в отсутствии доступа: нужных байт просто нет ни в весах, ни в контексте. Промпт, температура и дообучение меняют распределение над продолжениями, но не приносят реальных данных. Меняется не модель, а окружение вокруг неё.'
  kind: choice
  options:
    - 'Инструкция в системном промпте: «не выдумывай, при незнании прямо признавайся»'
    - Возможность приостановить генерацию, получить содержимое файла извне и продолжить рассуждение с ним в контексте
    - Понижение температуры сэмплинга до нуля, чтобы ответ стал детерминированным
    - Дообучение модели на большом корпусе типовых файлов настроек
