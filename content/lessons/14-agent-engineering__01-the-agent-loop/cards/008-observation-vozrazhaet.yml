- concept: заземление ответа проверяется выводимостью ответа из содержимого наблюдения, а не наличием строки Observation в трассе
  question: 'Агент отчитался: «в таблице orders_archive суммарная выручка — восемь миллионов двести тысяч». В трассе присутствуют все три строки, включая Observation. Что нужно проверить, чтобы понять, заземлён ли этот ответ на внешних данных?'
  explanation: Строку Observation модель не порождает, поэтому подделать её содержимое она не может — но проигнорировать может. Отказ инструмента или пустая выборка приходят в контекст исправно, а следующий ход всё равно доигрывает исходный план и выдаёт правдоподобное число. Поэтому наличие строки в трассе — не доказательство заземления; доказательство — прослеживаемая связь между содержимым наблюдения и цифрой в ответе.
  kind: choice
  options:
    - Что число из ответа выводимо из данных, которые пришли в строке Observation, а не только что эта строка есть в трассе
    - Что модель выдала Thought перед Action — иначе действие выбрано без плана
    - 'Что строка Observation достаточно длинная: короткие ответы инструментов не считаются данными'
    - Что температура сэмплирования была низкой — при высокой числа сочиняются
  correct: 0
  id: 008-observation-vozrazhaet-1
  fingerprint: 3cd02038
- concept: 'восстановление после отказа инструмента занимает дополнительные ходы цикла: аргумент нельзя исправить внутри того же хода, нужен новый разведочный вызов и новое наблюдение'
  question: Агент вызвал read_file с неверным именем. Расставь события корректного восстановления в порядке их появления в трассе.
  explanation: 'Ошибка не правится внутри хода, в котором она возникла: этот ход уже закончился на Action. Модель узнаёт об отказе только следующим наблюдением, а фактическое имя — ещё одним. Отсюда практический вывод: обработка исключений съедает итерации, и бюджет ходов надо считать с запасом на разведку, а не по числу шагов «счастливого пути».'
  kind: order
  items:
    - Исполнитель возвращает строку Observation с текстом ошибки доступа к файлу
    - Модель обусловливает следующий Thought на этой строке и отбрасывает гипотезу об имени файла
    - 'Модель выдаёт разведочный Action: перечислить содержимое каталога'
    - Новая строка Observation приносит фактические имена файлов
    - Модель повторяет чтение — Action с исправленным аргументом
  id: 008-observation-vozrazhaet-2
  fingerprint: a1cfc659
- concept: заземление держится не на факте успешного выполнения вызова, а на присутствии его результата в контексте следующей генерации
  question: Инструменты в агенте работают исправно и возвращают верные данные, но при сжатии контекста старые результаты вызовов выбрасываются, а строки Thought и Action остаются. Объясни, почему ответы агента при этом начинают расходиться с реальностью.
  explanation: 'Строка наблюдения — единственный участок цикла, куда попадает то, чего в модели не было. Выбросить её из контекста и оставить план — значит вернуть систему в режим автодополнения при формально рабочих инструментах: трасса выглядит агентной, заземления в ней уже нет.'
  kind: open
  reference: 'Наблюдение влияет на поведение только через обусловливание следующей генерации: физически вызов состоялся, но если его результат отсутствует в контексте очередного хода, для модели этих данных не существует. Остаются собственные строки модели — план и намерения, то есть переработка того, что уже было в весах и в промпте. Модель видит «я собирался прочитать файл и просуммировать колонку» и достраивает недостающий результат правдоподобным числом, причём с той же уверенностью, как если бы прочитала его. Отсюда правило: при сжатии контекста результаты вызовов, на которые опирается текущий вывод, нужно сохранять (полностью или в виде выжимки с цифрами), а не считать вызов «уже выполненным» и потому ненужным.'
  id: 008-observation-vozrazhaet-3
  fingerprint: 3e8c8eb3
