- concept: 'растущий буфер даёт квадратичный суммарный расход входных токенов: длина промпта увеличивается с каждой итерацией'
  question: Агентный цикл начинает с промпта в 800 входных токенов. Каждая последующая итерация дописывает в буфер ход ассистента и ход инструмента общим объёмом 200 токенов, и буфер целиком уходит в модель. Задача решается за 7 вызовов модели. Сколько всего входных токенов будет отправлено за все 7 вызовов?
  explanation: Промпт k-го вызова = 800 + 200·(k−1). Сумма за 7 вызовов = 7·800 + 200·(0+1+...+6) = 5600 + 4200 = 9800. Суммарный расход растёт квадратично по числу ходов, хотя новых токенов на ход всего 200 — отсюда и кэширование префикса, и сжатие истории в долгих циклах.
  kind: numeric
  answer: 9800
  tolerance: 1
