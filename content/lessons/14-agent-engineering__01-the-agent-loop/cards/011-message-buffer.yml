- concept: усечение старых сообщений буфера отнимает у агента запись о прошлых неудачных вызовах и возвращает его к уже опровергнутым действиям
  question: Чтобы не упереться в лимит контекста, инженер выбрасывает из буфера самые старые сообщения, оставляя только последние несколько ходов. Объясни своими словами, какой сбой поведения агента это вызывает и почему.
  explanation: 'Буфер — единственный носитель истории. Усечение выглядит как экономия токенов, но по смыслу это амнезия: пропадают именно те записи, из-за которых агент не повторяет неудачную попытку.'
  kind: open
  reference: 'Модель видит только хвост истории, поэтому раннее наблюдение об отказе инструмента и сформулированный вначале план в промпт не попадают. Для модели этих событий не было — и она снова выдаёт тот же вызов с теми же аргументами, получает то же наблюдение, и цикл ходит по кругу до исчерпания бюджета ходов. Признание неудачи и смена ветки плана возможны только если запись о неудаче лежит в контексте следующей генерации; выбросив её, инженер выбросил единственную память агента. Отсюда безопасные варианты: сжимать выброшенное в резюме, а не удалять молча, и удерживать в буфере ходы с ошибками и с исходной задачей.'
