- concept: 'нормальный выход из цикла без исключений не является сигналом успеха: наблюдаемая величина успеха — метка причины остановки, а не факт возврата текста'
  question: Агентный цикл всегда возвращает строку и никогда не бросает исключений. Почему по одному факту «функция вернула ответ» нельзя судить, решена ли задача, и что нужно логировать вместо этого?
  explanation: Отсутствие исключений говорит только о том, что рантайм не сломался. Бюджет ходов не сообщает, что задача решена, — он сообщает, что вы перестали платить за попытку. Без метки причины любой мониторинг успеха меряет живучесть кода, а не результат агента.
  kind: open
  reference: 'Выход из цикла — это просто ложное значение предиката продолжения, и оно ложно по любой из причин: агент выдал терминальное действие, перестал звать инструменты, упёрся в предел ходов, исчерпал токены, сработал предохранитель. Для управляющего кода все пять неразличимы — во всех случаях цикл завершился штатно и вернул текст. Только первые две означают, что работа доведена до конца; три остальные — аварийное выключение, и возвращённая строка в них — незаконченное рассуждение, а не ответ. Поэтому рантайм обязан выносить наружу метку причины остановки вместе с результатом и агрегировать её по прогонам: она единственная отличает завершение по делу от завершения по исчерпанию ресурса.'
  id: 020-stop-vs-budget-2
  fingerprint: 87a41bcf
- concept: поднятие бюджета ходов лечит только недокалиброванный предел, но не неработающее условие завершения
  question: Прогоны массово выходят по пределу ходов. Инженер поднимает бюджет с 60 до 120 ходов. В каком случае это НЕ поможет и чем обернётся?
  explanation: 'У массовых выходов по лимиту две разные причины, и лечатся они по-разному. Если предел просто занижен под класс задач — рост бюджета переводит обрывы в нормальные завершения. Если же терминальное действие никогда не срабатывает, агент будет крутиться до любого предела: 120 ходов дадут ту же аварийную остановку при двойном расходе токенов. Поэтому перед подъёмом бюджета смотрят на распределение причин остановки, а не только на её частоту.'
  kind: choice
  options:
    - Если задача действительно требует больше ходов — прогоны просто станут дороже без изменения доли успеха
    - Если условие завершения недостижимо (модель не может выбрать терминальное действие или предикат его не распознаёт) — те же обрывы наступят вдвое позже и вдвое дороже
    - Если инструменты возвращают ошибки — увеличенный бюджет всегда конвертирует их в успех
    - 'Поднятие бюджета помогает всегда: чем больше ходов, тем выше доля завершений по делу'
  correct: 1
  id: 020-stop-vs-budget-3
