- concept: на задачах с проверяемыми фактами эффект формата с наблюдениями проявляется как падение доли выдуманных утверждений, а не как большой скачок метрики успеха
  question: Агента для multi-hop QA (ответ собирается из нескольких найденных фактов) переводят с формата «сразу ответ» на формат, где каждый ход состоит из рассуждения, действия-поиска и наблюдения. Итоговая доля правильных ответов выросла слабо. Какой эффект от такой замены всё равно измерим и практически важен?
  explanation: 'В исходной статье на HotpotQA ReAct дал не столько очков, сколько заземление: агент не может утвердить факт, которого не искал, поэтому доля галлюцинаций падает даже при похожей точности. Формат с наблюдениями стоит дороже по токенам, а не дешевле, так что варианты про скорость и цену неверны. И одна агрегированная метрика точности не единственное измеримое свойство: доля выдуманных фактов — отдельная величина, и на проде она часто дороже пары пунктов точности.'
  kind: choice
  options:
    - 'Падение доли ответов с выдуманными фактами: каждое утверждение теперь опирается на возвращённый результат поиска, а не на веса'
