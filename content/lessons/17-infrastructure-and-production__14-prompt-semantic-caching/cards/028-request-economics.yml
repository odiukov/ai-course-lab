- concept: стоимость L2-ввода рассчитывают раздельным взвешиванием свежих, записываемых и читаемых из кэша токенов
  question: Свежий ввод стоит $8 за миллион токенов. Запрос содержит 130000 свежих токенов, 260000 записываемых в кэш и 610000 читаемых из кэша. Множитель записи равен 1.6, а множитель чтения — 0.15. Сколько долларов стоит вход этого запроса без учёта вывода?
  explanation: 'Взвешенный объём равен 130000 + 1.6 × 260000 + 0.15 × 610000 = 637500 токенов. Стоимость входа: 637500 / 1000000 × $8 = $5.10.'
  kind: numeric
  answer: 5.1
  tolerance: 0.01
