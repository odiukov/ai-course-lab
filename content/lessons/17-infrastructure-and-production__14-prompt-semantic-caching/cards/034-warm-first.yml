- concept: предварительный прогрев общего префикса позволяет параллельной волне читать готовую запись
  question: Расположите действия для кэш-дружественного запуска параллельных запросов с одинаковым префиксом.
  explanation: Параллельную волну следует запускать после готовности записи. Тогда последующие запросы читают общий префикс из кэша, а не создают конкурирующие записи.
  kind: order
  items:
    - Отправить один запрос с тем же кэшируемым префиксом
    - Дождаться, когда запись префикса станет доступна в кэше
    - Запустить остальные запросы параллельно
