- concept: значение обозначения оси определяется всей канонической формой и типом данных
  question: Почему ось H нельзя всегда трактовать как высоту, если тензор имеет форму (B, H, T, D)?
  explanation: 'Обозначения осей контекстны: в изображениях H обычно означает height, а в тензорах attention — heads. Поэтому форму нужно интерпретировать целиком.'
  kind: open
  reference: В канонической форме тензора attention буква H обозначает головы внимания, а не высоту изображения. Смысл оси определяется соглашением для всего типа данных и порядком остальных осей.
  id: 005-formy-dl-3
