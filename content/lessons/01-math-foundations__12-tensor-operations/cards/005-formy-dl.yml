- concept: переход от канального формата NCHW к NHWC требует перенести ось каналов в конец
  question: Заполните целевую форму при переводе батча изображений из раскладки с каналами перед пространственными осями в раскладку с каналами после них.
  explanation: При переходе из NCHW в NHWC ось батча остаётся первой, высота и ширина сдвигаются в середину, а ось каналов переносится в конец.
  kind: cloze
  template: (B, C, H, W) → ___
  answer: (B, H, W, C)
  accept:
    - (B,H,W,C)
    - BHWC
