- concept: contiguous материализует логический порядок несплошного тензора в новом сплошном размещении
  question: Объясните, что происходит с размещением и логическими значениями несплошного тензора при вызове `contiguous()` в PyTorch.
  explanation: После `transpose(0, 1)` данные ещё читаются через переставленные strides `(1, 3)`. Вызов `contiguous()` раскладывает те же логические значения подряд согласно новому порядку осей, поэтому результат становится сплошным.
  kind: open
  reference: PyTorch создаёт сплошно размещённый тензор в порядке текущих осей. Его форма и значения по логическим индексам сохраняются, но данные при необходимости копируются в новое хранилище, а strides становятся соответствующими сплошному обходу.
  id: 046-torch-2
  fingerprint: edcaa209
