- concept: strides переводят многомерный индекс в смещение внутри плоского хранилища
  question: Объясни своими словами, как с помощью strides получить плоскую позицию элемента по его многомерному индексу.
  explanation: Stride оси показывает, на сколько позиций в плоском хранилище сдвигается адрес при переходе к соседнему индексу вдоль этой оси. Сумма произведений индексов на соответствующие strides даёт общее смещение.
  kind: open
  reference: Каждый индекс оси умножают на stride этой оси, после чего полученные смещения складывают. Итоговая сумма указывает позицию элемента в плоском хранилище.
