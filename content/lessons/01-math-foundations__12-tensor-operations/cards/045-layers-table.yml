- concept: softmax состоит из поэлементной экспоненты, свёртки и нормализации
  question: Расположи операции вычисления softmax по выбранной оси в правильном порядке.
  explanation: 'Softmax вычисляется как exp(x) / sum(exp(x)): сначала выполняется поэлементная экспонента, затем свёртка по выбранной оси, после чего элементы нормализуются делением на полученную сумму.'
  kind: order
  items:
    - Вычислить экспоненту каждого элемента
    - Просуммировать экспоненты по выбранной оси
    - Разделить каждую экспоненту на соответствующую сумму
