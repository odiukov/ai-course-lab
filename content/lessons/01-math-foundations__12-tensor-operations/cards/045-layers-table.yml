- concept: attention раскладывается на последовательность стандартных тензорных операций
  question: Объясни своими словами, из каких основных тензорных операций складывается механизм attention.
  explanation: 'Attention представляет собой цепочку знакомых операций: линейные проекции, вычисление скалярных произведений Q и K, softmax оценок и взвешенную сумму V.'
  kind: open
