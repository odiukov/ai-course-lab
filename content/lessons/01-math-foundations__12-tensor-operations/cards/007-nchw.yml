- concept: несовпадение раскладок может замедлить вычисления из-за неявного переупорядочивания данных
  question: Почему передача изображения в раскладке, отличной от оптимальной для операции, иногда не вызывает ошибку и сохраняет правильный результат, но увеличивает время вычисления?
  explanation: 'Несовпадение NCHW и NHWC не всегда приводит к отказу: некоторые операции автоматически преобразуют раскладку. Такие транспонирования и копирования создают накладные расходы, поэтому проблема проявляется как молчаливое замедление.'
  kind: open
  reference: Фреймворк или библиотека может неявно переставить либо скопировать данные в раскладку, которую ожидает вычислительное ядро. Операция после преобразования даёт правильный результат, но преобразование расходует дополнительное время и память.
  id: 007-nchw-2
  fingerprint: 0a2b94e9
