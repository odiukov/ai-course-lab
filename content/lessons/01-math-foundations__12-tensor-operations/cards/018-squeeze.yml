- concept: squeeze без указания оси удаляет все и только единичные оси
  question: Форма тензора состоит из осей K, единичной оси, M и ещё одной единичной оси; K и M больше единицы. Как изменится форма после вызова squeeze() без указания оси?
  explanation: Squeeze без аргумента удаляет все оси размера 1 и не затрагивает остальные. Поэтому форма (1, 3, 1, 2) превращается в (3, 2), а значения и их порядок сохраняются.
  kind: choice
  options:
    - Останутся только оси K и M в прежнем порядке
    - Исчезнет лишь первая единичная ось
    - Исчезнут оси K и M
    - Форма и порядок элементов поменяются произвольно
  correct: 0
  id: 018-squeeze-1
  fingerprint: 7a081475
- concept: unsqueeze явно выравнивает оси вектора смещения с осями тензора для broadcasting
  question: Расположите действия для явной подготовки вектора смещения формы (D,) к сложению с тензором формы (B, T, D).
  explanation: После двух вставок единичных осей форма смещения становится (1, 1, D). При сложении его значения распространяются по батчу B и позициям T, оставаясь согласованными с осью признаков D.
  kind: order
  items:
    - Сопоставить ось D вектора смещения с последней осью большого тензора
    - Вставить перед D единичные оси, соответствующие B и T
    - Получить форму (единичная ось, единичная ось, D)
    - Выполнить сложение с broadcasting вдоль осей B и T
  id: 018-squeeze-2
  fingerprint: ed371a1e
