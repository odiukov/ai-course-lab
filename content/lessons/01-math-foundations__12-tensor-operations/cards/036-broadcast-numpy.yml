- concept: broadcasting применяет один вектор поправок ко всем строкам матрицы
  question: Матрица `x` хранит объекты по строкам и признаки по столбцам, а вектор `bias` содержит по одной поправке для каждого признака. Объясни, что произойдёт при вычислении `x + bias` в NumPy.
  explanation: Форма вектора совпадает с осью признаков матрицы, поэтому broadcasting распространяет его вдоль оси объектов. Каждый признак всех объектов получает соответствующую ему поправку.
  kind: open
  reference: NumPy сопоставит элементы `bias` со столбцами `x` и прибавит один и тот же вектор поправок к каждой строке. Материализовать отдельную копию `bias` для каждого объекта не требуется.
  id: 036-broadcast-numpy-1
  fingerprint: 99f3ce38
- concept: broadcasting позволяет построить таблицу евклидовых расстояний между всеми парами точек
  question: Расположи операции NumPy в порядке вычисления попарных евклидовых расстояний между наборами точек `X` формы `(P, D)` и `Y` формы `(Q, D)`.
  explanation: После добавления единичных осей вычитание создаёт разности для декартова произведения наборов точек. Сумма квадратов по координатам и квадратный корень превращают их в таблицу расстояний формы `(P, Q)`.
  kind: order
  items:
    - Добавить в `X` ось для точек из `Y`, а в `Y` — ось для точек из `X`
    - Вычесть преобразованные массивы с broadcasting и получить разности координат для каждой пары
    - Возвести разности координат в квадрат
    - Просуммировать квадраты по оси координат
    - Взять квадратный корень из каждой суммы
  id: 036-broadcast-numpy-2
  fingerprint: b00157ab
