- concept: матричное умножение требует совпадения внутренних размеров операндов
  question: Почему нельзя напрямую перемножить матрицы форм `(11, 17)` и `(19, 23)`?
  explanation: Для произведения матриц `(m, k) @ (k, n)` внутренний размер `k` должен совпадать. Здесь первая матрица имеет 17 столбцов, а вторая — 19 строк, поэтому операция невозможна.
  kind: choice
  options:
    - 'Не совпадают внешние размеры: 11 и 23'
    - 'Не совпадают внутренние размеры: 17 и 19'
    - Обе матрицы должны быть квадратными
    - У матриц должно быть одинаковое общее число элементов
  correct: 1
  id: 001-problem-1
  fingerprint: ee1166e0
- concept: совместимые формы не гарантируют правильную семантику тензорной операции
  question: Почему успешное выполнение тензорной операции и ожидаемая форма результата ещё не доказывают, что вычисление выполнено правильно?
  explanation: Проверка формы обнаруживает только несовместимость размеров. Если неверные оси случайно совместимы, операция завершится и может вернуть результат ожидаемой формы, поэтому нужно проверять также смысл каждой оси и ожидаемую форму после каждого преобразования.
  kind: open
  reference: Размеры могут быть формально совместимы, хотя оси имеют неверный смысл или выбрана не та ось операции. Тогда broadcasting, суммирование или усреднение выполнятся без ошибки, но дадут семантически неверные значения.
  id: 001-problem-2
  fingerprint: 272680ec
