- concept: при broadcasting формы выравниваются справа, а недостающие ведущие оси считаются единичными
  question: Как сопоставляют оси тензоров разного ранга при broadcasting?
  explanation: Формы выравниваются по правому краю. Если одна форма короче, слева к ней мысленно добавляются единичные оси, после чего совместимость проверяется попарно.
  kind: choice
  options:
    - Последнюю ось сопоставляют с последней, а недостающие оси мысленно добавляют слева
    - Первую ось сопоставляют с первой, а недостающие оси добавляют справа
    - Оси сопоставляют по их размеру независимо от позиции
  correct: 0
  id: 025-broadcast-rules-1
  fingerprint: cc849ac8
- concept: разные размеры одной выровненной оси несовместимы, если ни один из них не равен единице
  question: Почему поэлементная операция с тензорами форм (4, 9, 13) и (4, 11, 13) не поддерживает broadcasting?
  explanation: Крайние пары осей совместимы, но одной несовместимой пары достаточно для ошибки всей операции. Размеры 9 и 11 различны, и ни одна из этих осей не может растянуться.
  kind: open
  reference: После выравнивания форм средние оси имеют размеры 9 и 11. Они различаются, и ни один размер не равен единице, поэтому эту пару осей нельзя согласовать.
  id: 025-broadcast-rules-2
  fingerprint: f4ae9fd3
