- concept: границы индекса нужно проверять отдельно для каждой оси
  question: Почему для многомерного тензора недостаточно проверить только то, что вычисленная плоская позиция попадает в общий диапазон хранилища?
  explanation: Например, слишком большой индекс столбца способен сместить позицию в следующую строку. Плоская позиция останется допустимой для списка, но будет обозначать не запрошенный элемент.
  kind: open
  reference: Недопустимый индекс одной оси может после арифметики попасть в существующую позицию плоского списка, соответствующую уже другой строке или области тензора. Поэтому каждый индекс проверяют по размеру его оси.
  id: 013-code-flat-index-1
  fingerprint: f78cca26
- concept: отрицательные индексы нормализуются до проверки границ и вычисления плоской позиции
  question: Расположите действия flat_index для одной оси в правильном порядке, если функция поддерживает отрицательные индексы.
  explanation: Сначала отрицательный индекс переводят в обычный индекс оси. Затем проверяют его допустимость и лишь после этого используют в расчёте смещения.
  kind: order
  items:
    - Преобразовать отрицательный индекс относительно длины оси
    - Проверить нормализованный индекс по границам этой оси
    - Умножить индекс на stride оси и добавить результат к плоской позиции
  id: 013-code-flat-index-2
  fingerprint: 5fd29541
