- concept: выход внимания для запроса является взвешенной суммой векторов значений всех источников
  question: Заполни множитель при векторе значения источника, чтобы получить выход внимания для позиции запроса t.
  explanation: Вес w_{ts} показывает, какую долю значения V_s получает запрос t. Суммирование по всем источникам s создаёт для каждого запроса собственную смесь значений; в einsum это выражается как bhts,bhsd->bhtd.
  kind: cloze
  template: y_t = \sum_s ___ V_s
  answer: w_{ts}
  accept:
    - w_ts
    - weights[t,s]
    - weights[t, s]
  id: 043-attention-scores-2
  fingerprint: 66a4da18
- concept: масштабирование скалярных произведений стабилизирует softmax при увеличении размерности головы
  question: Почему в scaled dot-product attention скалярные произведения запросов и ключей делят на квадратный корень из размерности головы?
  explanation: Без масштабирования scores могут стать слишком большими по модулю, из-за чего softmax выдаёт почти предельное распределение. Деление на sqrt(D) стабилизирует масштаб оценок перед нормализацией.
  kind: open
  reference: При росте размерности головы дисперсия и типичный модуль скалярных произведений увеличиваются. Деление на квадратный корень из размерности удерживает оценки в сопоставимом масштабе, уменьшает насыщение softmax и помогает сохранять полезные градиенты.
  id: 043-attention-scores-3
  fingerprint: 54fd74fe
