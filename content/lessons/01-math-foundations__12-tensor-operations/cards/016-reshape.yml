- concept: reshape сохраняет линейный порядок элементов при изменении формы тензора
  question: Как изменится последовательность элементов при линейном обходе тензора после операции reshape?
  explanation: Reshape меняет форму тензора, сохраняя порядок элементов. Поэтому при последовательном обходе до и после операции будут прочитаны те же значения в той же очередности.
  kind: open
  reference: 'Последовательность не изменится: reshape по-другому группирует элементы по осям, но не переставляет их в линейном порядке.'
  id: 016-reshape-1
  fingerprint: d4843f0d
- concept: reshape допускает только одно автоматически вычисляемое измерение
  question: Почему в reshape можно указать только одно измерение, размер которого библиотека должна вычислить автоматически?
  explanation: Когда неизвестно одно измерение, его размер однозначно находится по общему числу элементов и заданным размерам остальных осей. Для нескольких неизвестных осей возможны разные сочетания размеров.
  kind: choice
  options:
    - При нескольких неизвестных размерах условие сохранения числа элементов обычно не определяет единственную форму
    - Reshape умеет изменять только последнюю ось
    - Автоматически вычисляемое измерение обязательно должно быть первой осью
    - Все остальные измерения новой формы должны иметь одинаковый размер
