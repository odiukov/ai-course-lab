- concept: повторный transpose той же пары осей является обратной операцией
  question: Почему два последовательных transpose одной и той же пары осей восстанавливают исходный тензор с прежней индексацией?
  explanation: 'Обмен пары позиций является собственной обратной операцией: повторный обмен отменяет первый. Данные при этом не требуется переставлять в хранилище.'
  kind: open
  reference: Первый transpose обменивает выбранные оси, а второй обменивает их обратно. Поэтому форма, strides и соответствие индексов элементам возвращаются к исходным.
  id: 020-transpose-2
