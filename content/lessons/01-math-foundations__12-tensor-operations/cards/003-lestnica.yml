- concept: новая внешняя ось добавляется слева от существующих размеров
  question: 'Заполните форму результата: K матриц формы (M, N) собрали в один тензор вдоль новой внешней оси.'
  explanation: Каждая копия сохраняет внутреннюю форму (M, N), а новая левая ось показывает количество копий. Поэтому итоговая форма — (K, M, N), а ранг увеличивается на единицу.
