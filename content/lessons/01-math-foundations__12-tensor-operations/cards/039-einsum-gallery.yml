  fingerprint: c72a798a
- concept: внешнее произведение сохраняет два независимых индекса и образует все попарные произведения элементов векторов
  question: Заполни спецификацию einsum, чтобы получить внешнее произведение векторов u и v.
  explanation: У операндов разные индексы, поэтому элементы сопоставляются во всех возможных парах. Оба индекса сохранены справа от стрелки, и результатом становится матрица.
  kind: cloze
  template: np.einsum("___", u, v)
  answer: i,j->ij
  accept:
    - p,q->pq
    - a,b->ab
  id: 039-einsum-gallery-2
  fingerprint: 74cf4c82
- concept: сохранённый индекс батча разделяет пакетную свёртку на независимые матричные умножения
  question: Почему в выражении np.einsum("bij,bjk->bik", A, B) результат для выбранного значения b не зависит от данных с другими значениями b?
  explanation: Суммирование выполняется только по исчезнувшему индексу j. Индекс b остаётся в выходе, поэтому элементы разных пакетов не смешиваются.
  kind: open
  reference: Индекс b присутствует в обоих операндах и сохраняется в результате, поэтому он фиксируется, а не суммируется. Для каждого b отдельно вычисляется C[b, i, k] как сумма A[b, i, j] * B[b, j, k] по j.
  id: 039-einsum-gallery-3
  fingerprint: aa5a9c6c
