- concept: несколько осей в одном вызове sum задаются относительно исходного тензора
  question: Нужно ли пересчитывать индексы осей после каждой свёртки, если в одном вызове NumPy sum указано несколько осей? Объясните своими словами.
  explanation: В sum(axis=[2, 3]) оба индекса относятся к исходной форме (2, 3, 4, 4). NumPy сворачивает обе указанные оси одновременно, поэтому промежуточная перенумерация не нужна.
  kind: open
  reference: Нет. Все перечисленные индексы относятся к осям исходного тензора, а суммирование по ним выполняется как одна операция.
  id: 037-check-reduce-1
  fingerprint: 120fdab4
- concept: keepdims сохраняет свёрнутые оси как оси единичной длины
  question: Как параметр keepdims=True влияет на форму результата суммирования по нескольким осям?
  explanation: Без keepdims оси суммирования удаляются. С keepdims=True они остаются на прежних позициях с размером 1, поэтому для исходной формы (2, 3, 4, 4) результат имел бы форму (2, 3, 1, 1).
  kind: choice
  options:
    - Сохраняет свёрнутые оси, заменяя их размеры единичными
    - Восстанавливает исходные значения после суммирования
    - Переносит свёрнутые оси в конец формы
    - Запрещает суммирование по нескольким осям
  correct: 0
