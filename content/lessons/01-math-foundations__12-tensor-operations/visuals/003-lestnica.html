<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Лестница от числа до 4D</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b1f27; --muted:#5d6673;
    --line:#8d97a6; --box:#ffffff; --boxline:#3f6fd8; --accent:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e8ecf3; --muted:#a2acbb;
      --line:#7c8798; --box:#1e222a; --boxline:#7aa2f7; --accent:#f0a066;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:10px 8px 14px;background:var(--bg)}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;background:var(--bg)}
  .fallback{color:var(--fg);font-size:13px;white-space:pre-wrap}
  text{fill:var(--fg)}
  .t-name{font-weight:600}
  .t-shape{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:var(--boxline)}
  .t-rank{fill:var(--muted)}
  .t-note{fill:var(--muted)}
  .box{fill:var(--box);stroke:var(--boxline)}
  .tread{stroke:var(--line)}
  .arw{stroke:var(--accent);fill:none}
  .arwh{fill:var(--accent);stroke:none}
</style>
<div class="wrap">
  <h2>Лестница от числа до 4D: каждый шаг — «а теперь много таких»</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---------- данные схемы ---------- */
    var steps = [
      {name:'скаляр',  rank:'ранг 0', shape:'()'},
      {name:'вектор',  rank:'ранг 1', shape:'(3,)'},
      {name:'матрица', rank:'ранг 2', shape:'(2, 3)'},
      {name:'3D',      rank:'ранг 3', shape:'(2, 2, 2)'},
      {name:'4D',      rank:'ранг 4', shape:'(B, C, H, W)'}
    ];
    var notes = [
      {y:-0.5,  text:'Каждый шаг вверх — «а теперь много таких»: новая ось приписывается слева, форма читается справа налево.'},
      {y:-0.95, text:'Всего элементов — произведение размеров: форма (2, 3, 4) содержит 2 * 3 * 4 = 24 элемента.'}
    ];
    /* шаг лестницы, размер ступени и наконечника — в единицах данных */
    var g = {dx:1.7, dy:0.65, bw:1.5, bh:0.55, over:0.1, head:0.14, gap:0.07};

    /* ---------- холст ---------- */
    var W = 860, H = 430;

    /* ---------- единственная пара функций перевода ---------- */
    var origin = {x:30, y:322};
    var scale  = 96;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    /* положение ступени i в единицах данных */
    function stepX(i){ return i * g.dx; }
    function stepY(i){ return i * g.dy; }

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Пять ступеней: скаляр, вектор, матрица, 3D, 4D');
    host.appendChild(svg);

    function add(tag,attrs,cls){
      var e=document.createElementNS(NS,tag);
      for(var k in attrs) e.setAttribute(k,attrs[k]);
      if(cls) e.setAttribute('class',cls);
      svg.appendChild(e);
      return e;
    }
    function line(x1,y1,x2,y2,cls,w){
      add('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),'stroke-width':w},cls);
    }
    /* текст: точка привязки через sx/sy, отступ — в пикселях */
    function txt(x,y,dxPx,dyPx,anchor,size,str,cls){
      var e=add('text',{x:sx(x)+dxPx,y:sy(y)+dyPx,'text-anchor':anchor,'font-size':size},cls);
      e.appendChild(document.createTextNode(str));
      return e;
    }
    /* стрелка: линия + наконечник, все вершины через sx/sy */
    function arrow(x1,y1,x2,y2){
      var dx=x2-x1, dy=y2-y1, len=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/len, uy=dy/len, px=-uy, py=ux;
      var bx=x2-ux*g.head, by=y2-uy*g.head, hw=g.head*0.5;
      line(x1,y1,bx,by,'arw',2);
      var pts=[[x2,y2],[bx+px*hw,by+py*hw],[bx-px*hw,by-py*hw]]
        .map(function(p){ return sx(p[0])+','+sy(p[1]); }).join(' ');
      add('polygon',{points:pts},'arwh');
    }

    /* ---------- ступени ---------- */
    steps.forEach(function(s,i){
      var x=stepX(i), y=stepY(i);

      /* проступь: горизонтальная линия под ступенью */
      line(x-g.over, y, x+g.bw+g.over, y, 'tread', 1.5);

      /* блок ступени */
      add('rect',{
        x:sx(x), y:sy(y+g.bh),
        width:sx(x+g.bw)-sx(x), height:sy(y)-sy(y+g.bh),
        rx:6, 'stroke-width':1.5
      },'box');

      /* три подписи внутри блока: якорь middle по центру блока,
         разведены по вертикали пиксельными отступами */
      var cx=x+g.bw/2, top=y+g.bh;
      txt(cx, top, 0, 17, 'middle', 13, s.name,  't-name');
      txt(cx, top, 0, 33, 'middle', 13, s.shape, 't-shape');
      txt(cx, top, 0, 47, 'middle', 11, s.rank,  't-rank');

      /* подъём к следующей ступени — стрелка вверх по стояку */
      if(i < steps.length-1){
        var rx=x+g.bw+g.over;
        arrow(rx, y+g.gap, rx, stepY(i+1)-g.gap);
      }
    });

    /* ---------- подписи под схемой ---------- */
    notes.forEach(function(n){
      txt(0, n.y, 0, 0, 'start', 13, n.text, 't-note');
    });
  }catch(e){
    host.innerHTML='';
    var d=document.createElement('div');
    d.className='fallback';
    d.textContent='Схема не построилась. Она должна была показать пять ступеней вверх, '+
      'на каждой — форма тензора: скаляр (), вектор (3,), матрица (2, 3), 3D (2, 2, 2), 4D (B, C, H, W). '+
      'Каждый шаг вверх добавляет одну ось слева. '+
      'Всего элементов — произведение размеров: форма (2, 3, 4) содержит 2 * 3 * 4 = 24 элемента.';
    host.appendChild(d);
  }
})();
</script>
</html>
