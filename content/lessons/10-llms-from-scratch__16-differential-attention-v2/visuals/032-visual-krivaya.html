<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Кривая SNR по lambda</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2330; --muted:#5d6675;
    --axis:#39414f; --curve:#b5471f; --mark:#1f6f8b; --grid:#d8d4cb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#161a21; --fg:#e8ecf2; --muted:#9aa5b4;
      --axis:#b9c2cf; --curve:#ff9663; --mark:#63c6e0; --grid:#2d3540;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 12px 12px;
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:490px}
  .fallback{color:var(--muted);font-size:13px;white-space:pre-line}
  text{fill:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .t-mut{fill:var(--muted)}
</style>
<div class="wrap">
  <h2>SNR как функция lambda: узкий пик около 0,8</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var DATA = {
      pts: [[0,400],[0.1,439],[0.2,488],[0.3,550],[0.4,633],
            [0.5,750],[0.6,925],[0.7,1217],[0.8,1800],[0.9,1400],[1,800]],
      yTicks: [0,500,1000,1500,2000],
      mark: 0.8, markSNR: 1800, startSNR: 400
    };
    // ---- одна система координат ----
    var origin = {x:90, y:350};
    var scale  = {x:570, y:0.145};
    function sx(x){ return origin.x + x*scale.x; }
    function sy(v){ return origin.y - v*scale.y; }

    // ---- пиксельные литералы: холст, отступы подписей, толщины, кегль ----
    var W = 720, H = 420, LW = 2, LW_THIN = 1, FS = 13, FS_S = 12, PAD = 10, R_DOT = 4;

    var NS='http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Кривая отношения сигнал/шум в зависимости от lambda');

    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,cls,dash){
      var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:'var('+cls+')','stroke-width':LW_THIN};
      if(dash)a['stroke-dasharray']=dash;
      return el('line',a);
    }
    function txt(x,y,s,anchor,size,cls){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,'font-size':size||FS});
      if(cls)t.setAttribute('class',cls);
      t.textContent=s; return t;
    }
    function num(v){ return String(v).replace('.',','); }

    el('rect',{x:0,y:0,width:W,height:H,fill:'var(--bg)'});

    // сетка + подписи оси Y
    DATA.yTicks.forEach(function(v){
      if(v>0) line(sx(0),sy(v),sx(1),sy(v),'--grid','4 4');
      line(sx(0),sy(v),sx(-0.012),sy(v),'--axis');
      txt(sx(0)-PAD, sy(v)+FS_S/3, num(v), 'end', FS_S, 't-mut');
    });

    // оси со стрелками
    line(sx(0),sy(0),sx(1.05),sy(0),'--axis').setAttribute('stroke-width',LW);
    line(sx(0),sy(0),sx(0),sy(2100),'--axis').setAttribute('stroke-width',LW);
    el('polygon',{fill:'var(--axis)',points:
      sx(1.06)+','+sy(0)+' '+sx(1.02)+','+sy(90)+' '+sx(1.02)+','+sy(-90)});
    el('polygon',{fill:'var(--axis)',points:
      sx(0)+','+sy(2160)+' '+sx(-0.016)+','+sy(2040)+' '+sx(0.016)+','+sy(2040)});

    // засечки и подписи оси X
    DATA.pts.forEach(function(p){
      line(sx(p[0]),sy(0),sx(p[0]),sy(-60),'--axis');
      txt(sx(p[0]), sy(0)+PAD+FS_S, num(p[0]), 'middle', FS_S, 't-mut');
    });

    // кривая
    var d = DATA.pts.map(function(p,i){return (i?'L':'M')+sx(p[0])+' '+sy(p[1]);}).join(' ');
    el('path',{d:d,fill:'none',stroke:'var(--curve)','stroke-width':LW+1,
               'stroke-linejoin':'round','stroke-linecap':'round'});
    DATA.pts.forEach(function(p){
      el('circle',{cx:sx(p[0]),cy:sy(p[1]),r:R_DOT-1,fill:'var(--curve)'});
    });

    // отметка lambda_init = 0.8
    line(sx(DATA.mark),sy(0),sx(DATA.mark),sy(DATA.markSNR),'--mark','6 4')
      .setAttribute('stroke-width',LW);
    el('circle',{cx:sx(DATA.mark),cy:sy(DATA.markSNR),r:R_DOT,
                 fill:'var(--bg)',stroke:'var(--mark)','stroke-width':LW});

    // подписи точек: разведены в разные стороны
    txt(sx(DATA.mark)+PAD, sy(DATA.markSNR)-PAD, 'SNR = '+DATA.markSNR, 'start', FS);
    txt(sx(DATA.mark)-PAD, sy(500), 'lambda_init = '+num(DATA.mark), 'end', FS, 't-mut');
    txt(sx(0)+PAD+2, sy(DATA.startSNR)+PAD+FS_S, 'SNR = '+DATA.startSNR+' (lambda = 0)', 'start', FS_S, 't-mut');
    txt(sx(1)-PAD, sy(800)-PAD, 'спад', 'end', FS_S, 't-mut');

    // названия осей и легенда
    txt(sx(0.03), sy(2100), 'SNR', 'start', FS);
    txt(sx(0.5), sy(0)+PAD*2+FS+8, 'lambda', 'middle', FS);
    txt(sx(0.5), sy(-400), 'шум: 0,001 − lambda · 0,001      сигнал: 0,4 − lambda · 0,05',
        'middle', FS_S, 't-mut');

    host.appendChild(svg);
  }catch(e){
    var p=document.createElement('div');
    p.className='fallback';
    p.textContent =
      'Схема не построилась. Она должна показывать: по горизонтали lambda от 0 до 1 с шагом 0,1, '+
      'по вертикали SNR от 0 до 2000. Кривая стартует в SNR = 400 при lambda = 0, медленно ползёт вверх, '+
      'резко взлетает к вершине SNR = 1800 при lambda = 0,8 (отметка lambda_init) и падает справа от пика. '+
      'Шум: 0,001 − lambda · 0,001; сигнал: 0,4 − lambda · 0,05.';
    host.appendChild(p);
  }
})();
</script>
</html>
