- concept: человеческая выверка убирает битые и двусмысленные задачи, поэтому оценка на таком подмножестве говорит только о работе при чётко поставленных требованиях
  question: 'Из бенчмарка люди отобрали подмножество из 300 задач: выкинули задачи со сломанными тестами и issue с неоднозначными требованиями. Что оценка на таком подмножестве говорит про агента и чего она не говорит?'
  explanation: Выверка меняет качество условий задачи, а не её сложность. Оценка после такой чистки — верхняя граница для случая «требования понятны, тесты рабочие»; про мутные тикеты и крупные правки она молчит.
  kind: open
  reference: 'Говорит: как часто агент доводит до проходящих тестов задачу, у которой требования сформулированы понятно, а проверка работоспособна. Это оценка при благоприятных условиях постановки. Не говорит: как агент ведёт себя на битых, недосказанных или противоречивых issue — именно такие как раз убрали; не говорит и про трудоёмкость правок, потому что выверка чистит формулировки, а не поднимает планку по объёму изменений. Поэтому высокое число на выверенном подмножестве нельзя переносить на поток реальных тикетов, где часть требований неполна.'
