- concept: распределение задач должно повторять реальную смесь работы, иначе оценка отвечает не про вашу нагрузку
  question: Твоя работа — в основном многофайловые изменения в незнакомом коде. Агент лидирует в таблице, собранной почти целиком из коротких локальных фиксов. Что даёт эта таблица для твоего выбора?
  explanation: Ранг переносится только на похожую смесь работы. На задачах с правкой в 10+ строк те же лидеры проваливаются до 23–59%, хотя на лёгком наборе выглядели почти безупречно.
  kind: choice
  options:
    - 'Почти ничего: измерено другое распределение задач, и ранг на нём не переносится на твою нагрузку'
    - 'Достаточное основание: лидер на простых задачах тем более справится со сложными'
    - Таблица применима, если её задачи взяты из настоящих репозиториев
