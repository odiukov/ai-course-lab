- concept: сквозная надёжность считает долю случаев, где весь путь закончился пригодным результатом, а не правдоподобие отдельного шага
  question: Агент почти всегда выдаёт синтаксически корректный и убедительно выглядящий патч, но часто правит не тот файл и роняет соседние тесты. Как это отражается на сквозной надёжности?
  explanation: 'Сквозная метрика режет по финишу: правильный файл, не сломанное соседнее поведение, пройденная проверка. Убедительный, но неверный патч в ней — такой же неуспех, как отсутствие патча.'
  kind: choice
  options:
    - 'Сквозная надёжность остаётся высокой: патч сгенерирован, значит шаг выполнен'
    - 'Сквозная надёжность низкая: она учитывает только прогоны, где весь путь дошёл до пригодного проверенного результата'
    - Сквозная надёжность к выбору файлов не относится, она измеряет только качество текста патча
