- concept: CodeAct заменяет перечислимый каталог инструментов на единственную точку входа «исполнить программу»
  question: Каркас переводят с JSON-вызовов инструментов на CodeAct. Что меняется в интерфейсе, который хост предоставляет модели?
  explanation: 'У JSON-архитектуры хост знает конечный список инструментов и их схемы, поэтому пространство действий выписано заранее. В CodeAct (OpenHands, ядро в стиле Jupyter) хост принимает произвольный Python-код: заранее выписать все действия нельзя, их множество равно тому, что вообще выразимо в рантайме песочницы.'
  kind: choice
  options:
    - Каталог объявленных инструментов с фиксированными схемами уступает место одной точке входа «исполни этот код», и множество возможных действий перестаёт быть перечислимым заранее
    - Каталог инструментов сохраняется полностью, меняется только таймаут на каждый вызов
    - Схемы инструментов начинают описываться Python-типами, но набор доступных действий остаётся тем же самым списком
    - Число объявленных инструментов растёт пропорционально числу поддерживаемых языков программирования
  correct: 0
  id: 025-codeact-1
  fingerprint: f5c3eaca
- concept: модели возвращается вывод исполнения программы, а не результат каждой внутренней операции
  question: Агент на CodeAct одним действием обходит 12 конфигурационных файлов и печатает только итоговую сводку по версиям. Что попадёт в контекст модели на следующем ходу?
  explanation: 'Промежуточные данные живут внутри исполняемой программы, наружу выходит её вывод. Это оборотная сторона экономии ходов: диагностику по каждому файлу приходится печатать самому, иначе следующий ход модель делает вслепую. У валидируемых вызовов каждый результат возвращается модели, но и стоит отдельного хода.'
  kind: choice
  options:
    - Содержимое всех 12 файлов целиком
    - Только то, что программа напечатала, плюс всплывшую ошибку исполнения; промежуточные значения переменных сами по себе не возвращаются
    - Отдельный структурированный результат по каждому прочитанному файлу, как при валидируемых вызовах
    - 'Ничего: результаты исполнения кода в контекст не попадают'
  correct: 1
  id: 025-codeact-2
  fingerprint: fedb0d82
