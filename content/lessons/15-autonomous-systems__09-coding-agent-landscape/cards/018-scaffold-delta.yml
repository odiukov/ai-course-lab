- concept: знаменателем относительного роста служит базовая оценка, а не новая и не сто
  question: Дополни вычисление относительного роста качества при переходе на новую обвязку.
  explanation: Относительный рост отвечает на вопрос «насколько результат вырос по сравнению со стартом», поэтому прибавка делится на базовую оценку. Деление на новую оценку отвечает на другой вопрос — какую долю нового результата составляет прирост — и даёт меньшее число.
  kind: cloze
  template: relative_gain = (new_score - baseline_score) / ___
  answer: baseline_score
  accept:
    - baseline
    - base_score
    - base
    - базовая оценка
  id: 018-scaffold-delta-2
  fingerprint: 77ea60a6
- concept: округление промежуточных величин искажает итог, округлять следует только результат по контракту
  question: Функция сначала округляет разность оценок до целого числа пунктов, затем делит её на базовую оценку и округляет относительный рост до одного знака. Чем это плохо?
  explanation: Округление промежуточного значения вносит ошибку до половины единицы, и деление на небольшую базовую оценку эту ошибку увеличивает. Считать нужно на полной точности, а округлять один раз — только возвращаемое значение и только до той точности, которую требует контракт функции.
  kind: choice
  options:
    - Ошибка первого округления попадает в делимое и умножается при делении, поэтому относительный рост уезжает сильнее допустимой погрешности
    - 'Ничем: два округления подряд взаимно компенсируют ошибку'
    - Плохо только тем, что делает функцию медленнее
    - Округление разности запрещено, потому что процентные пункты обязаны быть дробными
  correct: 0
