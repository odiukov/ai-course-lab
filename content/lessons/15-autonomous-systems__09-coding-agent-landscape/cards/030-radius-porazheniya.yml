- concept: радиус поражения — верхняя граница затрагиваемых ресурсов при выданных разрешениях, а не вероятность ошибки и не размер действия
  question: Действие A выполняется 40 секунд и почти никогда не ошибается; действие B выполняется секунду, но ошибается заметно чаще. Что говорит о радиусе поражения этих действий?
  explanation: 'Радиус поражения — граница возможного, а не прогноз. Он определяется разрешениями: заменить фрагмент в одном указанном файле или запустить произвольные команды по всему дереву проекта. Частоту сбоев и цену сбоя считают отдельно и перемножают.'
  kind: choice
  options:
    - Радиус больше у A, потому что за 40 секунд успевает произойти больше операций
    - Радиус больше у B, потому что ошибки случаются чаще
    - 'Ни длительность, ни частота ошибок радиус не задают: он равен максимуму ресурсов, которые одно действие способно изменить в пределах выданных ему разрешений'
    - Радиусы равны, поскольку оба действия исполняются одним и тем же агентом
  correct: 2
  id: 030-radius-porazheniya-1
  fingerprint: bf0dcd9b
- concept: у действия-программы границу ущерба задаёт рантайм среды, поэтому укреплённая изоляция входит в саму архитектуру, а не добавляется по желанию
  question: Почему архитектуру, где действие агента — произвольная программа, не запускают без укреплённой изоляции вроде контейнера?
  explanation: Границу ущерба задаёт то, до чего дотягивается исполнитель. У проверяемого вызова это одна операция с известными аргументами, у произвольного кода — весь доступный рантайм. Изоляция тут не удобство, а единственное, что вообще очерчивает радиус.
  kind: choice
  options:
    - Без контейнера программа выполняется медленнее и агент не укладывается в лимит ходов
    - Множество возможных сбоев здесь ограничено не контрактом отдельной операции, а всем, что рантайм вообще позволяет сделать, — вплоть до удаления данных за пределами задачи
    - Без контейнера нельзя воспроизвести прогон, поэтому результаты сравнения каркасов окажутся невоспроизводимыми
    - Контейнер требуется, чтобы модель могла ловить исключения внутри действия
  correct: 1
  id: 030-radius-porazheniya-2
  fingerprint: f8c80601
- concept: выбор формата действий на практике решает, чья это среда исполнения и кто несёт риск произвольного кода
  question: Открытые платформы для агентов чаще ставят на действия-программы, а управляемые облачные сервисы — на валидируемые вызовы инструментов. Что лучше всего объясняет этот раскол?
  explanation: Обе архитектуры живут в продакшене, и выбор диктует не эффективность, а распределение риска. Тот, кто владеет песочницей, и решает, насколько широкое действие в ней допустимо.
  kind: choice
  options:
    - Валидируемые вызовы принципиально решают больше задач, а открытые платформы жертвуют качеством ради простоты
    - Открытые платформы работают с моделями, которые не умеют выдавать структурированные вызовы
    - 'Риск исполнения несёт владелец среды: на своей машине пользователь сам выдаёт агенту код и изоляцию, а провайдер чужого облака не станет запускать произвольный код и оставляет проверяемый формат'
    - Управляемые сервисы ограничены форматом ответа модели и технически не могут исполнять код
  correct: 2
  id: 030-radius-porazheniya-3
