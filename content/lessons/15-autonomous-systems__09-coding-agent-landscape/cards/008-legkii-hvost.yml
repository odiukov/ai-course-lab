- concept: неожиданно высокий результат на собственной выборке «трудных» задач — повод проверить состав выборки, а не объявлять качество агента
  question: Ты отобрал 25 багов из своего бэклога как трудные, прогнал двух кандидатов и получил у обоих около 90% успеха. Что разумнее сделать первым?
  explanation: На задачах с крупными правками фронтирные системы дают 23–59%. Результат около 90% скорее говорит, что в выборку случайно попали лёгкие задачи, чем что агенты внезапно сильнее. Сначала проверяется состав набора, потом делаются выводы; иначе планируешь по числу, которое получено не на твоей нагрузке.
  kind: choice
  options:
    - 'Перепроверить выборку: измерить размеры эталонных правок и убедиться, что задачи действительно крупные, а не короткие однострочники'
    - Зафиксировать 90% как ожидаемую надёжность в продакшене и планировать по ней
    - Считать, что оба кандидата подходят, и выбрать любого — разницы нет
