- concept: публичная позиция в лидерборде задаёт короткий список кандидатов для собственной проверки, а не заменяет её результат
  question: Как корректно использовать публичный лидерборд при выборе кодового агента для продакшена?
  explanation: Лидерборд отвечает на вопрос про своё распределение задач и свою конфигурацию, поэтому переносится на вашу нагрузку только как гипотеза. Разумная цена вопроса — сузить список до двух кандидатов и потратить прогон на своих багах.
  kind: choice
  options:
    - 'Как итог выбора: взять первую строку и внедрять'
    - Как способ отобрать пару кандидатов, которых потом прогоняют на собственных задачах и проверяют по каркасу
    - Как аргумент, позволяющий пропустить аудит изоляции, если оценка достаточно высокая
    - 'Как бесполезный источник: чужие оценки ничего не сообщают'
