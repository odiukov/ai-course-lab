- concept: проверяемость действия до исполнения зависит от того, конечен ли набор его возможных эффектов
  question: Почему вызов инструмента с фиксированной сигнатурой можно допустить или отклонить до исполнения, а произвольную программу — практически нет? Объясни своими словами.
  explanation: Ключ — перечислимость эффектов, а не сложность разбора текста. Именно поэтому владелец исполнителя, не готовый принять непредсказуемый набор эффектов, оставляет валидируемый интерфейс.
  kind: open
  reference: 'У вызова инструмента набор эффектов перечислим заранее: известны имя операции, схема аргументов и ресурсы, которых операция касается, поэтому валидатор сверяет заявку со схемой и разрешениями и решает вопрос статически. Программа задаёт эффекты через исполнение: ветвления, циклы, значения из среды и вызовы наружу означают, что реальный набор действий известен только во время работы, а точное предсказание поведения произвольного кода недостижимо. Отсюда смена механизма защиты: вместо проверки заявки — ограничение среды исполнения (файлы, сеть, ресурсы, срок жизни).'
