- concept: сравнение рейтингов определено только при совпадающих наборах участников
  question: Почему функция сравнения двух рейтингов требует, чтобы наборы агентов в обоих списках совпадали? Что происходит, если во втором рейтинге одного агента нет?
  explanation: 'Совпадение наборов — предусловие функции. Без него разность позиций либо не определена, либо смешивает два разных вопроса: движение агента и смену состава сравниваемых участников.'
  kind: open
  reference: 'Изменение позиции — разность двух позиций одного и того же агента. Если агента нет во втором списке, его новая позиция не определена, и разность вычислить нельзя: поиск позиции либо упадёт, либо вернёт мусорное значение. Кроме того, при разном составе списков позиции остальных агентов пересчитаны на другом множестве участников, поэтому даже вычисленные разности перестают отвечать на вопрос «кто обогнал кого». Такой случай нужно либо запрещать проверкой на входе, либо оговаривать отдельно как выбывшего или нового участника.'
