- concept: постоянное начало нумерации сокращается при вычитании позиций
  question: Позиции агентов в рейтинге можно нумеровать местами (начиная с единицы) или индексами списка (начиная с нуля). Как выбор нумерации влияет на вычисленное изменение позиции?
  explanation: 'Разность позиций — величина относительная. Если к обеим позициям добавлено одно и то же смещение начала отсчёта, оно уходит при вычитании. Ошибка возникает только при смешивании нумераций: старую позицию взяли местом, новую — индексом.'
  kind: choice
  options:
    - 'Никак, если обе позиции взяты в одной нумерации: постоянное смещение начала отсчёта сокращается при вычитании'
    - Нумерация местами всегда даёт изменение на единицу больше, чем нумерация индексами
    - При нумерации с нуля изменение позиции меняет знак
    - Изменение позиции корректно считается только при нумерации местами, индексы использовать нельзя
