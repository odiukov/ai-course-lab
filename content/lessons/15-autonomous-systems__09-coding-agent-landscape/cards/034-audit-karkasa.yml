- concept: 'аудит каркаса идёт по четырём осям в порядке важности: поиск по коду, верификатор, изоляция, релевантность бенчмарка'
  question: Расставь пункты аудита предложенного каркаса кодового агента в порядке, заданном уроком.
  explanation: 'Порядок повторяет причинную цепочку прогона: без нужных файлов в контексте нечего чинить, без верификатора нечем поймать ошибку, без границ исполнения ошибка становится ущербом, и только затем имеет смысл спорить о цифрах чужой оценки.'
  kind: order
  items:
    - 'Проверить поиск по коду: логи запросов и долю случаев, где нужный файл действительно попал в контекст'
    - 'Проверить верификатор: кто оценивает патч и запускает ли провалившаяся проверка новую попытку'
    - 'Проверить изоляцию: где выполняются команды, какие каталоги и секреты доступны, возможен ли откат'
    - 'Проверить релевантность бенчмарка: похожи ли задачи оценки на собственные баги по сложности, языкам и типам репозиториев'
  id: 034-audit-karkasa-1
  fingerprint: 0e6ea3d1
- concept: аудит принимает свидетельства (логи, измеренные доли, перечисленные границы доступа), а название модели внутри каркаса свидетельством не является
  question: 'На вопрос об изоляции поставщик каркаса отвечает: «работает в безопасной песочнице, внутри фронтирная модель». Как это следует засчитать?'
  explanation: 'Изоляция проверяется перечислимыми границами, а не ярлыком. Имя модели тем более не ответ: по замерам вклад каркаса при одной и той же модели меняет результат на десятки процентных пунктов, а ущерб от неограниченной команды моделью не отменяется.'
  kind: choice
  options:
    - 'Как закрытый пункт аудита: сильная модель компенсирует слабые границы'
    - 'Как закрытый пункт: слово «песочница» и есть описание изоляции'
    - 'Как незакрытый пункт: нужны конкретные границы — каталоги, сеть, секреты, лимиты, возможность отката'
    - Как повод перейти к аудиту модели вместо аудита каркаса
  correct: 2
