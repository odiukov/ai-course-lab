- concept: исход прогона зависит от состава файлов, доставленных retrieval в контекст, при неизменной модели
  question: Один и тот же агент с одной и той же моделью дважды решает задачу «после отмены подписки пользователю приходит счёт». В одном прогоне в контекст попал серверный планировщик списаний, в другом — только компонент экрана подписки и его стили. Почему исходы прогонов расходятся?
  explanation: Модель может исправить лишь то, что видит. Retrieval определяет содержимое рабочего контекста, поэтому при одинаковых способностях модели разный набор найденных файлов даёт разный исход.
  kind: choice
  options:
    - Во втором прогоне модель рассуждала хуже, значит дело в её способностях
    - Во втором прогоне код с настоящей причиной не попал в контекст, поэтому вся дальнейшая траектория строится на догадке
    - Второй прогон был короче, а короткие траектории надёжнее
    - Разница объясняется только форматом итогового патча
  correct: 1
  id: 019-retrieval-1
  fingerprint: a80a7c15
- concept: 'ACI, файловый индекс и repo-map — разные реализации одной задачи: сузить поле поиска перед чтением'
  question: ACI в SWE-agent, файловый индекс в OpenHands и repo-map в Aider устроены по-разному. Какое узкое место они закрывают одинаково?
  explanation: 'Все три механизма работают на этапе retrieval: они сужают поле поиска и решают, какой код вообще дойдёт до модели. Откат и подсчёт долей — другие части каркаса.'
  kind: choice
  options:
    - Ускорение генерации токенов моделью
    - Отбор небольшого набора относящихся к задаче файлов вместо сплошного обхода репозитория
    - Автоматический откат репозитория после падения тестов
    - Подсчёт доли решённых задач в наборе
  correct: 1
  id: 019-retrieval-2
  fingerprint: 6201bdb4
- concept: сплошная загрузка всего репозитория не заменяет retrieval, потому что посторонний код разбавляет контекст и прячет связи
  question: 'Инженер предлагает: «Не нужен никакой отбор файлов — просто загрузим весь репозиторий в контекст». Объясни своими словами, почему это плохая замена retrieval даже для небольшого проекта.'
  explanation: Retrieval — это отбор, а не доставка максимума. Большой нерелевантный контекст снижает шанс, что нужная связь будет замечена.
  kind: open
  reference: Сплошное чтение засоряет контекст конфигурациями, документацией и соседними модулями. Существенная связь между обработчиком, моделью данных и тестом теряется среди постороннего материала, и модель тратит внимание на нерелевантное. Задача retrieval не в том, чтобы «дотянуться» до файла, а в том, чтобы отобрать небольшой связный набор, где причина ошибки различима. Плюс объём контекста ограничен и стоит денег, но главный аргумент — качество отбора, а не размер окна.
  id: 019-retrieval-3
  fingerprint: d5aa0288
