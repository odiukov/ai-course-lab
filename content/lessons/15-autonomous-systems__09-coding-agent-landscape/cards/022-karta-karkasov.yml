  fingerprint: ef2991cc
- concept: лицензия и модель исполнения отвечают на разные вопросы о каркасе
  question: Что именно сообщает лицензия каркаса, а что — его модель исполнения?
  explanation: 'Открытая лицензия даёт доступ к устройству каркаса, но ничего не говорит о рисках запуска. Модель исполнения описывает среду: контейнер, локальный репозиторий, редактор с политикой инструментов, управляемая VM или режимы разрешений.'
  kind: choice
  options:
    - Лицензия сообщает оценку на бенчмарке, модель исполнения — стоимость запуска
    - Лицензия сообщает, можешь ли ты изучать и изменять сам каркас; модель исполнения — где выполняются действия агента и что нужно подготовить вокруг него
    - Оба поля описывают одно и то же разными словами
    - Лицензия задаёт формат действий агента, модель исполнения — права на исходный код
  correct: 1
