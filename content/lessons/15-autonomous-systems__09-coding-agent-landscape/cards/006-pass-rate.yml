- concept: 'реализация pass rate: сумма булевых результатов, делённая на длину списка'
  question: Функция получает список булевых результатов прогона (решена задача или нет) и возвращает долю успехов. Заполни пропуск.
  explanation: В Python True равен единице при сложении, поэтому sum по списку булевых даёт число решённых задач. Делить надо на len(results) — общее число задач, а не на число выданных патчей.
  kind: cloze
  template: |-
    def pass_rate(results):
        if not results:
            raise ValueError('empty results')
        return ___
  answer: sum(results) / len(results)
  accept:
    - sum(results)/len(results)
    - results.count(True) / len(results)
    - len([r for r in results if r]) / len(results)
  id: 006-pass-rate-1
  fingerprint: 622d6950
- concept: пустой набор задач требует явно оговорённого поведения, иначе деление на ноль ломает вызов
  question: Почему функция подсчёта доли решённых задач обязана отдельно оговаривать пустой список результатов?
  explanation: 'Нет задач — нет ни числителя, ни знаменателя, и деление падает. Молчаливый выбор здесь опасен: вызывающий код должен знать заранее, получит он нейтральное значение или исключение.'
  kind: choice
  options:
    - Пустой список в Python нельзя передать в функцию как аргумент
    - В пустом наборе нет знаменателя, поэтому деление даёт ZeroDivisionError; поведение (нейтральное значение или явная ошибка) — часть контракта функции
    - Пустой список всегда должен трактоваться как полный успех, иначе метрика смещена вниз
  correct: 1
  id: 006-pass-rate-2
  fingerprint: b55e8483
