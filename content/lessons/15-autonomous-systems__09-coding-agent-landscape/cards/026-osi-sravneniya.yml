- concept: композиция — способность сцепить операции и отреагировать на промежуточный результат внутри одного хода, а не общее число операций
  question: Что именно измеряет ось «композиция» при сравнении архитектур действий агента?
  explanation: Композиция про сцепление и реакцию на промежуточный результат внутри хода. Формат с одним действием за ход умеет много операций суммарно, но каждая ветвь решения проходит через модель; программа ветвится сама.
  kind: choice
  options:
    - Сколько инструментов вообще объявлено в каркасе
    - Насколько подробно описан формат аргументов каждого действия
    - Можно ли внутри одного хода сцепить операции — пройти циклом, отфильтровать промежуточный результат, повторить операцию после сбоя
    - Сколько разных моделей каркас поддерживает без переписывания
