- concept: оценивать каркас нужно по наблюдаемой траектории, а не по одному финальному артефакту
  question: Ты сравниваешь два каркаса на одной пробной задаче. Оба выдали патч, проходящий тесты. Объясни своими словами, что ещё нужно посмотреть, чтобы вывод не свёлся к везению одного прогона.
  explanation: Финальный артефакт скрывает, сколько ложных маршрутов и неудачных правок было по дороге. Свойства каркаса читаются по поведению между шагами.
  kind: open
  reference: 'Смотреть надо траекторию: какие файлы каркас нашёл до первой правки и насколько точен был отбор; что он сделал после первого падения теста — прочитал ли ошибку, изменил ли решение и перепроверил ли его; что осталось в рабочей среде после неудачных действий. Один зелёный патч не отличает работающий механизм от удачной попытки, поэтому нужны повторные прогоны и случаи со сбоем.'
  id: 023-karkas-check-2
  fingerprint: cdd0584c
