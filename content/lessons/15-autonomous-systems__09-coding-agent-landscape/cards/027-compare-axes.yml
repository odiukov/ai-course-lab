- concept: число ходов сравнивается как стоимость (меньше лучше), остальные оси — как выгода (больше лучше)
  question: Функция сравнивает два профиля архитектур по осям. Для оси числа ходов направление обратное остальным. Заполни пропуск.
  explanation: 'Ходы — это затраты: три хода на ту же работу хуже одного. Композиция, проверяемость и изоляция — блага, там выигрывает большее значение. Единый оператор сравнения на все оси даёт молчаливо неверного победителя по ходам.'
  kind: cloze
  template: |-
    if axis == "turns":
        winner = name_a if profile_a[axis] ___ profile_b[axis] else ...
  answer: <
  accept:
    - <
    - profile_a[axis] < profile_b[axis]
    - меньше
  id: 027-compare-axes-1
  fingerprint: 8bd3184a
- concept: результат сравнения хранит ответ по каждой оси отдельно; свёртка в счёт выигранных осей уничтожает сам предмет сравнения
  question: Почему функция сравнения архитектур возвращает победителя по каждой оси, а не одного «абсолютного победителя» по числу выигранных осей?
  explanation: Свёртка в один балл предполагает общую единицу измерения, которой у осей нет. Пословный ответ по осям позволяет вызывающему коду спросить именно про изоляцию или проверяемость и взвесить их под свою среду.
  kind: choice
  options:
    - Потому что осей чётное число и счёт часто даёт ничью
    - 'Потому что оси несоизмеримы: суммирование приравнивает выигрыш в изоляции к выигрышу в числе ходов и стирает компромисс, ради которого сравнение и делалось'
    - Потому что подсчёт выигранных осей требует нормировать значения к одной шкале, а это вычислительно дорого
    - Потому что одна из осей всегда важнее остальных, и её достаточно вернуть отдельно
  correct: 1
