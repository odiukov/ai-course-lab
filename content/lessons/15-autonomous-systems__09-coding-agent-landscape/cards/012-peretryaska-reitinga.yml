- concept: порядок агентов может перевернуться при удалении лёгких задач, потому что доли пересчитываются на другом подмножестве
  question: Набор — 400 задач, из них 120 требуют правки в одну-две строки. Агент A решил 110 лёгких и 145 остальных. Агент B решил 85 лёгких и 165 остальных. Какова доля успеха в процентах у того агента, который выходит на первое место после удаления лёгких задач?
  explanation: 'На полном наборе A впереди: 255 против 250. После удаления лёгкого хвоста остаётся 280 задач: у A 145/280 ≈ 51.8%, у B 165/280 ≈ 58.9%. Первым становится B — порядок перевернулся, хотя ни один результат не пересчитывался заново.'
  kind: numeric
  answer: 58.9
  tolerance: 0.5
  id: 012-peretryaska-reitinga-1
  fingerprint: '17413926'
- concept: переворот порядка после смены состава набора — следствие смены вопроса, а не доказательство общего превосходства одного агента
  question: После удаления коротких задач агент, стоявший вторым, выходит на первое место. Какой вывод корректен?
  explanation: 'Оба числа верны, просто отвечают на разные вопросы: один — про весь набор, другой — про подмножество крупных правок. Ни один агент не изменился, поэтому «деградировал» неверно; и вывод «сильнее вообще» тоже не следует — он силён на том распределении, где его измерили. Выбирать нужно по тому подмножеству, которое похоже на твой бэклог.'
  kind: choice
  options:
    - На задачах с крупными правками этот агент справляется лучше конкурента; про его общее превосходство это ничего не говорит
    - Прежний лидер деградировал, и его результат на полном наборе был ошибкой измерения
    - Новый лидер сильнее вообще, а полный набор просто был замусорен
