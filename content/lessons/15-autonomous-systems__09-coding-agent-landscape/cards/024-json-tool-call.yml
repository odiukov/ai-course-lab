- concept: в JSON tool call проверка заявки предшествует исполнению инструмента
  question: Агент отправляет вызов инструмента `read_file` с полем `path`, указывающим за пределы разрешённой директории. Где архитектура JSON-вызовов останавливает такое действие?
  explanation: 'Хост знает контракт инструмента: обязательные поля, типы значений, допустимые пути. Неизвестное поле, неверный тип или запрещённый путь отклоняются до исполнения, а не разбираются по последствиям.'
  kind: choice
  options:
    - После выполнения, по результату команды
    - На стороне хоста, при проверке заявки по схеме инструмента — до запуска
    - Внутри модели, до генерации ответа
    - 'Нигде: ограничение может дать только контейнер'
  correct: 1
  id: 024-json-tool-call-1
  fingerprint: 7f53a877
- concept: 'цена валидируемого вызова — ограниченная композиция: каждое действие занимает отдельный ход'
  question: Агенту на JSON-вызовах нужно прочитать четыре файла и после этого изменить один из них. Какое утверждение верно?
  explanation: 'Одно действие — один ход: цикл по файлам или сцепка инструментов внутри одного вызова недоступны. Это добавляет переходы между моделью и хостом, но каждый переход можно рассмотреть отдельно: что запросили, прошло ли проверку, что вернулось.'
  kind: choice
  options:
    - Все чтения и правка укладываются в один ход, потому что относятся к одной задаче
    - Потребуется отдельный ход на каждое действие, зато каждый ход отдельно проверяем и наблюдаем
    - Правку можно совместить с чтениями, а чтения — нет
    - Число ходов зависит только от размера файлов
  correct: 1
  id: 024-json-tool-call-2
  fingerprint: afc04315
- concept: радиус поражения одного действия у JSON-вызова ограничен контрактом одного инструмента
  question: Объясни своими словами, почему у одного JSON-вызова инструмента радиус поражения меньше, чем у действия, выражённого произвольным кодом.
  explanation: Валидируемый вызов ограничивает последствия заранее, по контракту. Отсюда и предпочтение JSON-вызовов в управляемых сервисах, где исполнителем владеет провайдер и произвольный код в него не пускают.
  kind: open
  reference: 'JSON-вызов называет ровно один инструмент и передаёт параметры, которые хост проверяет по известной схеме. Максимум, что может случиться, — выполнение этой одной проверенной функции с допустимыми аргументами. Произвольный код в одном действии может делать всё, что позволяет рантайм: обойти файлы, вызвать сеть, удалить каталоги. Поэтому у JSON-вызова область последствий совпадает с контрактом инструмента, а у исполняемого кода — с возможностями среды, из-за чего такой подход требует укреплённой песочницы.'
  id: 024-json-tool-call-3
  fingerprint: e1fbf7a9
