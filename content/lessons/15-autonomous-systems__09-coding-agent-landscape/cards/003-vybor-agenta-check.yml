- concept: проценты от разных наборов задач и разных условий запуска несопоставимы напрямую
  question: 'Два агента оценены разными командами: 77% на одном наборе задач и 69% на другом, с разными обвязками и разными правилами зачёта. Какое действие корректно?'
  explanation: 'Числители и знаменатели относятся к разным испытаниям. Разрыв в 8 пунктов легко перекрывается влиянием обвязки: у одной модели смена обвязки давала 16,6 пункта.'
  kind: choice
  options:
    - 'Взять агента с 77%: разница слишком велика, чтобы объясняться условиями'
    - 'Взять агента с 69%: меньшая цифра обычно честнее'
    - Не выбирать по этим числам, а прогнать оба агента на одном наборе задач в одной обвязке с одним критерием зачёта
  correct: 2
