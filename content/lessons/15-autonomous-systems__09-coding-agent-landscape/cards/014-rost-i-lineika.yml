- concept: удаление битых задач из набора поднимает процент даже при неизменном числе решённых задач
  question: Набор содержит 300 задач, агент решает 100 из них. Затем 45 задач признают битыми и удаляют из набора; ни одна из них не входила в решённые. Какой процент покажет тот же агент на очищенном наборе?
  explanation: 'Числитель не изменился, а знаменатель стал 300 − 45 = 255: 100/255 ≈ 39,2% против 100/300 ≈ 33,3%. Около шести пунктов прироста дала чистка набора, а не работа агента — так же ведёт себя переход от сырого SWE-bench к выверенному подмножеству.'
  kind: numeric
  answer: 39.2
  tolerance: 0.5
  id: 014-rost-i-lineika-1
  fingerprint: c4d8d323
- concept: смена измерительного набора между точками сохраняет вывод о направлении роста, но не о его кратности
  question: Ранняя точка кривой — 5% на сыром наборе задач, поздняя — 65% на выверенном подмножестве этого набора. Какой вывод остаётся обоснованным?
  explanation: 'Направление роста читается уверенно: поздние системы решают заметно больше. Кратность — нет: часть разрыва создана сменой состава задач, поэтому 65/5 отвечает уже на другой вопрос. Обвинять в разрыве только чистку тоже нельзя: модели и каркасы за это время действительно усилились.'
  kind: choice
  options:
    - Результат заметно вырос, но множитель 13 не измеряет прирост способностей агентов
    - Агенты стали ровно в 13 раз способнее
    - Весь разрыв объясняется очисткой набора, а способности не изменились
