- concept: 'ранжирование и отбор задач по сложности — разные ответственности: функция рейтинга честно упорядочивает то, что ей передали'
  question: Функция ранжирования получает только результаты агентов и не знает ничего про размеры правок. Почему такое разделение ответственности удобно и что оно требует от вызывающего кода?
  explanation: 'Разделение ответственности переносит вопрос «на каких задачах меряем» наружу, где им и надо управлять. Плата за это — рейтинг ничего не валидирует: сопоставимость набора обеспечивает тот, кто его формирует.'
  kind: open
  reference: 'Удобно потому, что рейтинг — чистая операция: посчитать метрику каждому и отсортировать. Отбор задач по сложности — отдельное решение, у него свой порог и свой критерий, и его можно менять, не трогая ранжирование; ту же функцию рейтинга можно применить к любому подготовленному набору. Требование к вызывающему коду: сначала собрать сопоставимые данные — один и тот же набор задач для всех агентов, одинаковые условия запуска, уже отфильтрованный по нужному порогу. Функция не проверит, что агентам достались разные задачи, и выдаст порядок для несопоставимых чисел с тем же спокойствием.'
