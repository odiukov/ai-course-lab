- concept: функция ранжирования возвращает весь упорядоченный список пар, а не одно имя победителя
  question: Функция ранжирования агентов получила оценки 0.6, 0.9 и 0.3. Почему полезнее вернуть весь упорядоченный список пар «имя — оценка», а не только имя лучшего?
  explanation: 'Победитель — потеря информации: по одному имени не видно, отстал второй на сотые или в разы, и не видно ничьих. Максимум находится и без полной сортировки, а пересчитывать оценки вызывающему коду не нужно — их уже посчитала функция.'
