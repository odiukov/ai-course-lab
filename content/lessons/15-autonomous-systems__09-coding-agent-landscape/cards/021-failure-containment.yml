- concept: 'изоляция решает две разные задачи: возврат проекта к прежнему состоянию и ограничение области, которую команды агента вообще могут затронуть'
  question: Failure containment описывают через песочницу с откатом. Объясни своими словами, какие две разные функции здесь выполняет изоляция и почему одной из них недостаточно.
  explanation: 'Откат отвечает на вопрос «как вернуть проект назад», ограничение области — на вопрос «куда агент вообще может дотянуться». Это разные механизмы с разными отказами: откат бессилен против того, что он не отслеживает, а граница песочницы не мешает испортить файлы внутри неё. Смысл обоих один — сделать так, чтобы ущерб от неудачного шага не переходил в следующие шаги траектории.'
  kind: open
  reference: 'Первая функция — сохранение состояния и откат: каркас фиксирует исходное состояние проекта, а после провалившейся попытки возвращает его, чтобы следующая попытка начиналась с чистой контрольной точки, а не поверх полурабочих правок, лишних зависимостей и удалённых тестов. Вторая — ограничение области действия: команды агента выполняются в среде, где они физически не могут затронуть систему за пределами разрешённой директории или окружения. Одного отката мало, потому что часть последствий выходит за границы отслеживаемого состояния и не откатывается: изменённые глобальные настройки, установленные в систему пакеты, сетевые или внешние действия. Одного ограничения области мало, потому что внутри разрешённой зоны ущерб всё равно накапливается от попытки к попытке. Вместе они дают свойство, ради которого всё строится: цена одного промаха — ровно одна потерянная попытка.'
  id: 021-failure-containment-3
  fingerprint: '757806e1'
