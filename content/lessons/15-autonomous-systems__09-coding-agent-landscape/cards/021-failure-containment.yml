- concept: откат к контрольной точке делает повторные попытки независимыми, поэтому шанс успеха считается через произведение вероятностей промаха
  question: Каркас откатывает проект к сохранённой контрольной точке после каждой неудачной попытки, поэтому попытки независимы и стартуют в одинаковых условиях. Одна попытка решает задачу с вероятностью 0,5, агенту разрешено 4 попытки. Какова вероятность, что задача будет решена хотя бы одной из них?
  explanation: 'Все четыре попытки стартуют из одного и того же чистого состояния, значит они независимы: P(хотя бы один успех) = 1 − 0,5⁴ = 1 − 0,0625 = 0,9375. Без отката эта арифметика неприменима — вероятность успеха второй попытки уже не 0,5, потому что она работает на повреждённой версии проекта, и общий результат оказывается ниже.'
  kind: numeric
  answer: 0.9375
  tolerance: 0.005
