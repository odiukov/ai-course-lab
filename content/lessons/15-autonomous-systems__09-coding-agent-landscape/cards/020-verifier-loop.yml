- concept: цикл верификатора не повышает точность отдельного шага, а превращает пойманный сбой в новую попытку
  question: Один и тот же агент запускают с циклом верификатора и без него. Что именно меняет цикл?
  explanation: 'Цикл не делает шаги умнее. Он меняет судьбу ошибки: часть промахов превращается в дополнительный круг работы вместо обрыва траектории.'
  kind: choice
  options:
