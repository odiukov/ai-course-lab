- concept: 'качество обратной связи ограничивает цикл: зелёные тесты не доказывают правильность патча'
  question: Патч агента прошёл все тесты после третьего круга цикла верификатора. Какой вывод корректен?
  explanation: 'Верификатор силён ровно настолько, насколько полна его обратная связь: тесты могут не покрывать сценарий, а трейс — быть истолкован неверно. Зелёный прогон — свидетельство, а не доказательство.'
  kind: choice
  options:
    - Патч гарантированно правильный, раз проверка пройдена
    - Патч удовлетворяет тому, что проверяют имеющиеся тесты; непокрытые сценарии могут остаться сломанными
    - Цикл верификатора больше не нужен для этого репозитория
    - Число кругов цикла доказывает сложность задачи
