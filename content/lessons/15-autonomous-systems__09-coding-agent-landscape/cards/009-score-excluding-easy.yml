- concept: 'включающая граница порога: задача с размером ровно равным порогу остаётся в наборе'
  question: Функция оставляет задачи, размер правки которых не меньше порога. При пороге 25 строк задача ровно на 25 строк должна попасть в оценку. Заполни сравнение.
  explanation: «Не меньше порога» — это `>=`. Со строгим `>` задача ровно на 25 строк выпадет, набор станет меньше заявленного, а оценка сдвинется без причины. Границу условия проще всего проверять именно на равном значении.
  kind: cloze
  template: |-
    if size ___ threshold:
        kept.append(result)
  answer: '>='
  accept:
    - '>= '
    - size >= threshold
    - не меньше
    - '>='
  id: 009-score-excluding-easy-1
  fingerprint: 8c065447
- concept: после фильтрации знаменателем становится число оставшихся задач, а не исходный размер набора
  question: 'Результаты агента: [True, False, True, True, False]. Размеры эталонных правок в строках: [4, 15, 30, 3, 11]. Порог — 7 строк. Какова доля успеха на подмножестве, прошедшем порог?'
  explanation: Порог проходят задачи с размерами 15, 30 и 11 — их результаты False, True, False. Значит 1 успех из 3 оставшихся, то есть ≈0.33. Если поделить тот же один успех на исходные 5 задач, получится 0.2 — ошибка от старого знаменателя.
  kind: numeric
  answer: 0.33
  tolerance: 0.01
  id: 009-score-excluding-easy-2
  fingerprint: c96362ea
- concept: фильтрация идёт парами «результат — размер той же задачи», и только потом отфильтрованные результаты уходят в расчёт доли
  question: Расставь шаги функции, которая считает долю успеха только на крупных правках.
  explanation: 'Соответствие результата и размера теряется, если фильтровать списки независимо: тогда булево значение одной задачи сопоставится с размером другой. Сначала пары, потом отбор, потом единый расчёт доли — так правило успеха остаётся тем же, меняется только состав задач.'
  kind: order
  items:
    - 'Пройти по двум спискам парами: i-й результат вместе с i-м размером правки'
    - Оставить только те пары, где размер не меньше порога
    - Собрать из оставшихся пар список булевых результатов
    - Передать этот список в функцию расчёта доли успеха и вернуть её ответ
  id: 009-score-excluding-easy-3
  fingerprint: f217b0e0
