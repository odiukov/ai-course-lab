- concept: 'вывод эксперимента с заглушкой ограничен постановкой: он не переносится на порядок каркасов при сильной реальной модели'
  question: Каркас CodeAct обогнал каркас с пооперационными вызовами на игрушечном стенде с детерминированной заглушкой вместо модели. Что этот результат доказывает, а что нет? Объясни своими словами.
  explanation: 'Фиксация модели — это способ изолировать переменную, а не заявка на всеобщий вывод. Перенос результата на связку с сильной моделью требует нового прогона: заглушка не воспроизводит ни ошибки генерации кода, ни способность модели пользоваться сложной композицией.'
  kind: open
  reference: 'Доказывает узкое: при полностью зафиксированном «мозге» и одном наборе задач различие в решённых задачах и в числе ходов породил каркас — то, как он представляет задачу, сколько операций разрешает за ход и как соединяет их. Не доказывает, что тот же каркас выиграет с реальной моделью: заглушка намеренно упрощает поведение, реальная модель может по-разному пользоваться предоставленными форматами действий, ошибаться в написании кода, а на другом распределении задач и на другом наборе инструментов порядок способен перевернуться. Стенд отвечает на вопрос «что меняет каркас при неподвижном качестве модели», а не «какой каркас лучше вообще».'
  id: 028-chistyi-eksperiment-2
  fingerprint: 8e6555fa
