- concept: процентные пункты переводятся в число дополнительно решённых задач умножением на размер набора
  question: Новая обвязка дала прибавку 12 процентных пунктов на бенчмарке из 250 задач при неизменной модели. На сколько задач больше доведено до проходящих тестов?
  explanation: 'Пункты умножаются на размер набора: 0,12 × 250 = 30 задач. Такой перевод показывает, что прибавка в пунктах имеет смысл только вместе с числом задач: те же 12 пунктов на наборе из 50 задач — это всего шесть задач.'
  kind: numeric
  answer: 30
  tolerance: 0.5
  id: 017-delta-karkasa-2
