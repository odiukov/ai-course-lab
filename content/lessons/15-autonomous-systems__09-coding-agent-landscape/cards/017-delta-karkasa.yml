- concept: фиксация модели и набора задач изолирует вклад обвязки, но не указывает, какой её элемент дал прибавку
  question: Что позволяет и что не позволяет заключить сравнение, в котором один и тот же файл весов прогнали на одном бенчмарке внутри двух разных обвязок?
  explanation: Это контролируемое сравнение с одной варьируемой переменной. Оно закрывает вопрос «модель или обвязка», но для вопроса «какой элемент обвязки» нужны отдельные прогоны с поочерёдным отключением компонентов.
  kind: open
  reference: 'Позволяет приписать всю разницу обвязке: модель и распределение задач зафиксированы, значит меняется только слой вокруг модели, и прибавка не объясняется «более умной моделью». Не позволяет сказать, какой именно элемент обвязки сработал — поиск по коду, планировщик, песочница, цикл правка-проверка или формат обратной связи меняются пакетом. Также не переносит вывод на другое распределение задач и на другую базовую модель: та же обвязка на другой модели может дать другую прибавку.'
  id: 017-delta-karkasa-3
  fingerprint: 1663f8f2
