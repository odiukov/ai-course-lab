- concept: pass rate — доля задач, доведённых до проходящих тестов, от общего числа задач набора
  question: Агент прогнали на наборе из 250 задач. Он выдал патчи для 140 задач, но тесты прошли лишь в 90. Чему равен pass rate (числом от 0 до 1)?
  explanation: 'В знаменателе — все задачи набора, в числителе — только прошедшие проверку: 90/250 = 0,36. Число выданных патчей (140) в формулу не входит: активность агента метрику не повышает.'
  kind: numeric
  answer: 0.36
  tolerance: 0.005
  id: 005-procent-reshenii-1
  fingerprint: a6dd95e6
- concept: 'зачёт задачи бинарный: почти правильный патч с одним падающим тестом — неуспех'
  question: Патч агента чинит описанное в issue поведение, но один тест прежнего поведения падает. Как это учитывается в pass rate?
  explanation: 'Метрика не выдаёт частичных баллов: состояние задачи — успех или неуспех. Поэтому pass rate измеряет доведённый до конца результат, а не близость к решению.'
  kind: choice
  options:
    - 'Как неуспех: задача либо доведена до полностью проходящего набора тестов, либо нет'
    - Как частичный успех, пропорциональный доле пройденных тестов
    - Как успех, если упавший тест не относится к описанной в issue проблеме
