- concept: 'учёт ходов на границе: завершающий успешный ход считается, а неуспешная задача не выполняет действие сверх лимита'
  question: Лимит — 9 ходов на задачу. Первая задача решена на 7-м ходу, вторая не решена вовсе. Сколько действий каркас выполнил суммарно на двух задачах?
  explanation: 'Успешный завершающий ход входит в счёт: 7 действий. Неуспешная задача упирается ровно в лимит и не делает десятого действия: 9. Итого 16. Обе границы надо проверять явно, иначе один каркас получит лишний ход и разница в результатах перестанет быть разницей каркасов.'
  kind: numeric
  answer: 16
  tolerance: 0.5
