- concept: 'порядок операций внутри одного хода испытания: выбор действия, исполнение, проверка цели, решение об остановке'
  question: Расставьте операции одного хода внутри цикла испытания каркаса.
  explanation: 'Проверка цели идёт после исполнения действия: до него состояние ещё прежнее, и успех фиксировать не по чему. Останов — последний шаг хода, поэтому успешное действие успевает попасть в счётчик, а неуспешная задача обрывается ровно на лимите.'
  kind: order
  items:
    - Взять текущее состояние задачи
    - Модель-заглушка по этому состоянию выбирает действие
    - Каркас исполняет выбранное действие и обновляет состояние
    - Проверить, достигнута ли цель задачи
    - Остановить задачу при успехе либо при исчерпании лимита ходов
