- concept: CodeAct — приём каркаса, где действия агента выражаются исполняемым кодом
  question: Что означает CodeAct в устройстве кодового агента?
  explanation: 'CodeAct — приём уровня каркаса: действия описываются кодом, который исполняется, а его вывод возвращается агенту. Вместе с рефлексией и циклами с верификатором это часть обвязки, а не изменение весов модели.'
  kind: choice
  options:
    - Агент выражает свои действия исполняемым кодом вместо фиксированного набора заранее заданных действий
    - Модель дообучают на репозиториях, из которых собран бенчмарк
    - Патч агента засчитывают по сходству с эталонным исправлением
