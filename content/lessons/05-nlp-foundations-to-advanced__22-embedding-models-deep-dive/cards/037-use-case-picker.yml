- concept: стартовую embedding-модель выбирают фильтрацией по ограничениям, а затем доменным сравнением совместимых кандидатов
  question: Какой порядок выбора стартовой embedding-модели наиболее обоснован для продуктовой поисковой системы?
  explanation: Высокий средний результат не компенсирует несовместимость с языками корпуса, длиной входов или средой развёртывания. Практический выбор начинается с фильтра ограничений, после чего совместимых кандидатов оценивают на данных продукта.
  kind: choice
  options:
    - Выбрать лидера общего рейтинга, а затем подстроить под него инфраструктуру и данные
    - Отсеять несовместимые модели по языкам, длине входа, инфраструктуре и типу запросов, а оставшиеся сравнить на доменных данных
    - Сравнить все модели на случайном общедоступном датасете и выбрать модель с наибольшим числом параметров
  correct: 1
  id: 037-use-case-picker-1
  fingerprint: 6fb8d55a
- concept: требуемое контекстное окно embedding-модели определяется длиной фактических входов после разбиения документов
  question: Документы перед построением эмбеддингов делятся на фрагменты. Какую величину следует сопоставлять с контекстным окном модели?
  explanation: Модель кодирует отдельный переданный ей вход, поэтому важна длина реальных чанков после токенизации. Даже модель с окном свыше 32 000 токенов выбирают по длине таких входов, а не по размеру исходных файлов.
  kind: choice
  options:
    - Размер самого большого исходного файла
    - Длину токенизированных фрагментов, которые действительно передаются модели
    - Суммарную длину всех документов в индексе
    - Количество документов, найденных по одному запросу
  correct: 1
  id: 037-use-case-picker-2
  fingerprint: 21bfac1f
- concept: небольшой прирост качества может не окупать переиндексацию корпуса при замене embedding-модели
  question: Доменная проверка показала, что новая embedding-модель лишь немного превосходит текущую. Почему одного такого результата недостаточно для замены модели в рабочем индексе?
  explanation: 'Рекомендованный порог в материале — выигрыш больше 3 пунктов: на корпусе из 10 млн документов замена означает часы GPU-вычислений и создание нового индекса рядом со старым. Незначительное улучшение обычно не оправдывает эту стоимость.'
  kind: open
  reference: Замена embedding-модели требует заново закодировать весь корпус, построить и проверить новый индекс, а во время миграции часто хранить старую и новую версии параллельно. Поэтому небольшой прирост качества следует сопоставлять с вычислительной и операционной стоимостью перехода.
  id: 037-use-case-picker-3
  fingerprint: 2784d3c5
