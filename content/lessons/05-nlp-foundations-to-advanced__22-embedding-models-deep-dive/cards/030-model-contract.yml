- concept: роли входов, префиксы и режимы кодирования являются частью контракта векторного индекса
  question: Объясни своими словами, какие настройки кроме названия embedding-модели нужно сохранять вместе с векторным индексом и зачем.
  explanation: Размерность и тип векторов не подтверждают, что входной контракт соблюдён. Если запрос или документы закодировать с другой ролью либо префиксом, программа продолжит работать, однако векторы окажутся не в тех представительных режимах, на которых модель обучалась сопоставлять запросы с документами.
  kind: open
  reference: 'Нужно сохранять правила кодирования запросов и документов: назначенные им роли, точные префиксы или промпты и выбранные режимы кодирования. Без этих настроек после повторного запуска можно получить векторы правильной размерности, но несовместимые по назначению, из-за чего качество поиска снизится без явной ошибки.'
