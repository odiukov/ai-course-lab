- concept: повторная нормализация не компенсирует потерю информации при усечении модели без Matryoshka-обучения
  question: Объясни своими словами, почему L2-нормализация усечённого эмбеддинга не гарантирует сохранения качества поиска, если модель не обучалась по принципу Matryoshka.
  explanation: Повторная нормализация делает ненулевой обрезок единичным, но не возвращает удалённый хвост. Стабильное качество при сокращении размерности требует, чтобы модель специально обучали сохранять полезное представление в префиксах эмбеддинга.
  kind: open
  reference: Нормализация исправляет только длину вектора. Она не восстанавливает смысловую информацию из отброшенных координат. Без Matryoshka-обучения первые координаты не обязаны образовывать самостоятельное качественное представление, поэтому поиск после усечения может резко ухудшиться.
  id: 026-truncation-check-2
