- concept: RRF строит итоговый рейтинг по объединению кандидатов и не штрафует отсутствующий документ отдельным отрицательным вкладом
  question: Документ присутствует в sparse-выдаче, но отсутствует в dense-выдаче. Объясните, как RRF должен учесть такой документ.
  explanation: Итоговый набор RRF является объединением отдельных выдач. Благодаря этому один режим может вернуть релевантный документ, пропущенный другими режимами.
  kind: open
  reference: Документ включается в объединённый набор кандидатов и получает вклад за свою позицию в sparse-списке. От dense-режима он не получает никакого вклада; его не нужно исключать из итогового рейтинга или назначать ему отрицательный вклад.
  id: 020-rrf-for-modes-2
  fingerprint: ac63fab0
- concept: увеличение параметра сглаживания RRF уменьшает различие между вкладами соседних позиций
  question: Как при прочих равных влияет увеличение параметра сглаживания RRF на разницу между вкладами верхних и более низких позиций?
  explanation: Чем больше сглаживающая добавка в знаменателе вклада, тем слабее изменение позиции влияет на результат. Этот параметр регулирует вес ранних мест, но не калибрует сырые оценки режимов.
  kind: choice
  options:
    - 'Разница уменьшается: вклад становится менее чувствительным к позиции'
    - 'Разница увеличивается: лидер получает намного больший перевес'
    - Порядок документов внутри каждого списка разворачивается
    - Сырые оценки разных режимов автоматически переходят в общую шкалу
  correct: 0
