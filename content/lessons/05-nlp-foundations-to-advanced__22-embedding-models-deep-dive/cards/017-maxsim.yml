- concept: MaxSim является направленной и в общем случае несимметричной функцией
  question: Объясни, почему перестановка местами наборов токенных векторов запроса и документа обычно изменяет оценку MaxSim.
  explanation: 'MaxSim не сравнивает два набора симметрично: первый набор определяет строки, по которым берутся максимумы. Поэтому MaxSim(query, document) обычно не равен MaxSim(document, query).'
  kind: open
  reference: Максимум выбирается отдельно для каждого вектора первого набора, а затем эти максимумы суммируются. После перестановки внешний обход идёт по другому набору, поэтому меняются и число слагаемых, и пары, для которых ищутся максимумы.
  id: 017-maxsim-2
  fingerprint: 1faed542
- concept: максимум по пустому набору токенов документа не определён
  question: Как должна поступить реализация MaxSim, если запрос содержит токенные векторы, а документ не содержит ни одного?
  explanation: Каждому токену запроса требуется лучший партнёр среди токенов документа. Для пустого документа множество кандидатов пусто, поэтому локальный максимум не существует и такой контракт лучше проверять явно.
  kind: choice
  options:
    - Вернуть сумму норм векторов запроса
    - Считать лучшую близость для каждого токена нейтральной
    - Отклонить ввод явной ошибкой, поскольку выбирать максимум не из чего
    - Пропустить все токены запроса и вернуть отрицательную бесконечность
  correct: 2
