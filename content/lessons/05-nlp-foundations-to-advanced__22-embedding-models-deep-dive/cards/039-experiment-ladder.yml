- concept: доминируемый кандидат не входит в множество Парето
  question: Модель X не хуже модели Y по качеству, задержке и стоимости, причём хотя бы по одному показателю X строго лучше. Какой вывод верен?
  explanation: Кандидат доминируем, если другой кандидат не уступает ему ни по одной важной метрике и превосходит хотя бы по одной. Парето-набор может содержать несколько моделей, между которыми остаются реальные компромиссы.
  kind: choice
  options:
    - Модель Y доминируема и не входит в множество Парето
    - Модель X доминируема и не входит в множество Парето
    - Обе модели автоматически являются равноценными
    - Вывод возможен только после сведения метрик в одну среднюю оценку
  correct: 0
  id: 039-experiment-ladder-1
  fingerprint: 0fc701a5
- concept: честный эксперимент последовательно фиксирует условия и изменяет по одному фактору
  question: Расположите этапы сравнительного эксперимента с embedding-моделями в правильном порядке.
  explanation: Если одновременно менять модель, размерность, режим поиска, чанкинг или железо, причину различий установить нельзя. В упражнениях этот принцип реализован переходом от dense-baseline к сравнению режимов BGE-M3, а затем к парето-сравнению кандидатов.
  kind: order
  items:
    - Зафиксировать корпус, запросы, разбиение документов, top-k, метрику и вычислительную среду
    - Измерить контрольный dense-baseline
    - Менять по одному фактору и записывать его влияние
    - Прогнать модели-кандидаты по единому протоколу качества, задержки и стоимости
    - Исключить доминируемые варианты и сформировать множество Парето
  id: 039-experiment-ladder-2
  fingerprint: 995d6f57
- concept: стоимость моделей сравнивают после пересчёта на одинаковый объём нагрузки
  question: Сервис берёт 0.0007 условной единицы за один запрос. Сколько будет стоить обработка 240000 запросов при линейном тарифе?
  explanation: 'Стоимость равна произведению тарифа на объём: 0.0007 × 240000 = 168. Для сравнения моделей их расходы аналогично приводят к общей базе — например, к цене за 1 млн запросов.'
  kind: numeric
  answer: 168
  tolerance: 0.01
  id: 039-experiment-ladder-3
  fingerprint: b1c3ea86
