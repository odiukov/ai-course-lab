- concept: отсутствие релевантного фрагмента в выдаче указывает на проблему этапа retrieval, а не генерации ответа
  question: Известно, что нужный фрагмент проиндексирован, но среди найденных документов его нет. Какое действие наиболее уместно первым?
  explanation: 'Промпт влияет на ответ только после извлечения контекста. Если нужный фрагмент не найден, сначала следует проверить embedding-модель и качество retrieval: генератор не может использовать документ, которого нет в переданном контексте.'
  kind: choice
  options:
    - Увеличить системный промпт генеративной модели
    - Проверить, насколько embedding-модель сближает запрос с релевантным фрагментом
    - Попросить генеративную модель отвечать подробнее
  correct: 1
  id: 001-retrieval-bottleneck-1
  fingerprint: 5a4aefcb
- concept: порядок этапов в RAG определяет, на каком уровне возникает и исправляется ошибка
  question: Расположите этапы обычного RAG-конвейера в правильном порядке.
  explanation: Качество embedding-представления влияет на то, какие фрагменты попадут в контекст. Настройка промпта действует лишь на последующих этапах и не способна вернуть пропущенный при поиске документ.
  kind: order
  items:
    - Embedding-модель преобразует запрос в векторное представление
    - Векторный поиск выбирает ближайшие фрагменты
    - Найденные фрагменты передаются генеративной модели
    - Генеративная модель формирует ответ
  id: 001-retrieval-bottleneck-2
  fingerprint: f5debc56
