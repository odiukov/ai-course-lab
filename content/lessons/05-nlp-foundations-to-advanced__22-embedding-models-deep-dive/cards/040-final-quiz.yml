- concept: multi-vector представление обменивает больший размер индекса на более детальное сопоставление текста и потенциально лучший recall
  question: Почему переход от одного dense-вектора на текст к multi-vector представлению может повысить recall, но увеличить требования к индексу?
  explanation: Dense-режим сжимает весь текст в один вектор, тогда как multi-vector сохраняет токенные представления. Это даёт более детальное сопоставление и часто улучшает recall, но требует хранить и обрабатывать существенно больше векторов.
  kind: open
  reference: Multi-vector модель сохраняет отдельные представления токенов и может находить локальные соответствия между частями запроса и документа. Из-за хранения множества векторов на каждый текст индекс становится больше, а поиск — дороже.
  id: 040-final-quiz-2
  fingerprint: 8814e901
