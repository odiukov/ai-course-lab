- concept: воспроизводимый контракт индекса закрепляет неизменяемую версию embedding-модели
  question: Как следует указать hosted embedding-модель в контракте индекса, чтобы повторное кодирование давало совместимые векторы?
  explanation: Изменяемый алиас может начать указывать на другую модель. Точная версия API или checkpoint делает конфигурацию воспроизводимой и позволяет определить, каким энкодером построен индекс.
  kind: choice
  options:
    - Записать только название провайдера
    - Использовать автоматически обновляемый алиас
    - Закрепить точную версию API или неизменяемый идентификатор модели
  correct: 2
  id: 038-shipping-rule-1
  fingerprint: bff9d531
- concept: одинаковая размерность не гарантирует совместимость пространств эмбеддингов
  question: Объясни своими словами, почему в одном индексе нельзя смешивать векторы от разных версий embedding-модели, даже если у них одинаковая размерность.
  explanation: Размерность описывает только форму вектора. После изменения весов модели меняется отображение текстов в пространство, поэтому старые документы и новые запросы необходимо заново закодировать одной закреплённой версией.
  kind: open
  reference: 'Разные версии модели могут задавать разные семантические пространства: одна и та же координата в них имеет разный смысл. Совпадение длины векторов позволяет вычислить сходство технически, но не делает полученную оценку содержательно корректной.'
  id: 038-shipping-rule-2
  fingerprint: a29a568e
- concept: смена несовместимого embedding-контракта выполняется через отдельный полностью заполненный индекс
  question: Расположи действия безопасной миграции на новую несовместимую embedding-модель в правильном порядке.
  explanation: Новый индекс строят изолированно, потому что старые и новые векторы несовместимы. Трафик переключают только после полного заполнения и проверки, чтобы поиск не работал по смеси пространств или неполному корпусу.
  kind: order
  items:
    - Создать отдельный индекс и записать в его метаданные новый embedding-контракт
    - Закодировать новой моделью весь корпус и заполнить отдельный индекс
    - Проверить полноту индекса и соответствие его метаданных новому контракту
    - Переключить поисковый сервис на новый индекс
  id: 038-shipping-rule-3
  fingerprint: 54cd8e38
