- concept: смысл в dense-эмбеддинге распределён по координатам вектора
  question: Что можно заключить о координатах dense-эмбеддинга текста?
  explanation: 'Dense-модель кодирует общий смысл распределённо: значение отдельной координаты интерпретируется только вместе с остальным вектором. Такое сжатие не гарантирует сохранения каждого слова или факта.'
  kind: choice
  options:
    - Отдельную координату обычно нельзя однозначно сопоставить конкретному слову или факту
    - Каждому слову текста всегда соответствует своя координата
    - Координаты хранят слова в порядке их появления
    - Любую дату можно точно восстановить по заранее известной координате
  correct: 0
  id: 004-dense-embedding-1
  fingerprint: 23f099e0
- concept: для нормализованных эмбеддингов скалярное произведение равно косинусной близости
  question: Заполни выражение для сравнения эмбеддингов, нормализованных по евклидовой норме.
  explanation: После нормализации длины обоих векторов единичны, поэтому знаменатель формулы косинусной близости исчезает и остаётся скалярное произведение.
  kind: cloze
  template: similarity(a, b) = ___
  answer: a @ b
  accept:
    - a·b
    - np.dot(a, b)
    - a.dot(b)
  id: 004-dense-embedding-2
  fingerprint: 75499c7d
