- concept: ключ sparse-эмбеддинга обозначает координату в словаре токенизатора модели
  question: Что должен обозначать ключ в словаре, представляющем sparse-эмбеддинг текста?
  explanation: 'Sparse-вектор индексируется словарём модели, поэтому ключ — идентификатор токена. Он не равен позиции слова: одно слово может быть разбито токенизатором на несколько токенов.'
  kind: choice
  options:
    - Позицию слова в исходной строке
    - Идентификатор токена в словаре модели
    - Частоту термина в документе
    - Место термина в выдаче
  correct: 1
  id: 012-sparse-embed-1
  fingerprint: 4e37d8c7
- concept: разреженное представление хранит только координаты с ненулевыми весами
  question: Заполни условие, чтобы преобразовать полный sparse-выход модели в компактный словарь.
  explanation: Нулевые координаты не несут вклада в sparse-вектор и не должны занимать место. Приведение ключей к int, а весов к float делает формат предсказуемым для дальнейшего сопоставления.
  kind: cloze
  template: 'return {int(token_id): float(weight) for token_id, weight in sparse.items() if ___}'
  answer: weight != 0
  accept:
    - weight != 0.0
    - bool(weight)
  id: 012-sparse-embed-2
  fingerprint: 24a04058
- concept: веса sparse-эмбеддинга являются выученным выходом модели и сохраняются без пересчёта
  question: Почему при упаковке sparse-эмбеддинга не следует заменять веса модели частотами токенов или самостоятельно нормализовать их?
  explanation: В SPLADE-подобном подходе веса предсказывает трансформер. Функция упаковки должна лишь удалить нули и привести типы, сохранив ненулевые значения без изменения.
  kind: open
  reference: Потому что модель уже выучила веса координат как сигналы релевантности. Пересчёт по частоте или дополнительная нормализация изменят созданное моделью представление и могут исказить последующий скоринг.
  id: 012-sparse-embed-3
  fingerprint: f8be9e89
