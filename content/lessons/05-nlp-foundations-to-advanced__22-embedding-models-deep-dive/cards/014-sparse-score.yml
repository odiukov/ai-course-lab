- concept: скалярное произведение разреженных векторов считается только по общим координатам
  question: 'Запрос представлен словарём {41: 1.5, 58: 2.5, 97: 0.4}, а документ — словарём {41: 2.0, 58: 0.8, 73: 8.0}. Чему равен их sparse score?'
  explanation: Общими являются только координаты 41 и 58, поэтому оценка равна 1.5 × 2.0 + 2.5 × 0.8 = 5.0. Координаты 97 и 73 не имеют пары и в сумму не входят.
  kind: numeric
  answer: 5
  tolerance: 0.001
  id: 014-sparse-score-1
  fingerprint: e6f320eb
- concept: скалярное произведение разреженных словарей можно эффективно вычислить обходом меньшего набора ключей
  question: Как эффективнее всего вычислить скалярное произведение двух разреженных векторов, представленных хеш-словарями?
  explanation: Вклад дают только общие координаты. Обход меньшего словаря с поиском ключей в большем использует разреженность данных и не требует выделять память под полный вектор.
  kind: choice
  options:
    - Обойти меньший словарь и для каждого его ключа проверить наличие веса в большем
    - Восстановить два полных вектора размером со словарь токенизатора и перемножить их
    - Обойти все возможные токены модели независимо от числа сохранённых координат
    - Сложить все веса каждого словаря, а затем перемножить полученные суммы
