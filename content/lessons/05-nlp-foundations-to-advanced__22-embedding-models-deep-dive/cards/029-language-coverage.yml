- concept: межъязыковой поиск требует многоязычной модели с общим семантическим пространством
  question: В RAG-системе запросы на английском должны находить семантически подходящие документы на французском и немецком. Какой выбор embedding-модели наиболее обоснован?
  explanation: Для межъязыкового поиска модель должна размещать одинаковые смыслы на разных языках рядом в общем векторном пространстве. Поэтому нужна многоязычная модель, качество которой проверено именно на языковых парах рабочей системы.
  kind: choice
  options:
    - Специализированная английская модель, поскольку язык запросов важнее языка документов
    - Многоязычная модель, проверенная на нужных межъязыковых парах
    - Модель с максимальным контекстным окном независимо от языкового покрытия
    - Специализированная модель для самого распространённого языка документов
  correct: 1
  id: 029-language-coverage-1
  fingerprint: 978bc729
- concept: специализированная одноязычная модель может быть точнее многоязычной на одноязычных данных
  question: Почему многоязычная embedding-модель не обязательно будет лучшим выбором для корпуса и запросов на одном языке?
  explanation: 'Широкое языковое покрытие связано с компромиссом: оно улучшает работу со смешанными корпусами, но не гарантирует максимальную точность на одном языке. Для одноязычной системы сильная специализированная модель нередко выигрывает, что следует проверять собственным бенчмарком.'
  kind: open
  reference: Многоязычная модель распределяет обучающую ёмкость между многими языками и межъязыковыми соответствиями. Специализированная модель может лучше передавать оттенки одного языка и точнее ранжировать документы в чисто одноязычной задаче, поэтому обе модели нужно сравнивать на реальных данных.
  id: 029-language-coverage-2
  fingerprint: 2f88f209
