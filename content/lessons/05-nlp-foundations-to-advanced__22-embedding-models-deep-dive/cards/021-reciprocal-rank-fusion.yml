- concept: суммирование ранговых вкладов позволяет RRF поднимать кандидатов, поддержанных несколькими системами поиска
  question: Почему документ с умеренно высокой позицией в нескольких поисковых выдачах может обойти в RRF документ, лидирующий только в одной выдаче?
  explanation: RRF начисляет документу отдельный вклад за его позицию в каждой выдаче. Поэтому согласованная поддержка нескольких систем может перевесить единственное высокое место.
  kind: choice
  options:
    - RRF усредняет исходные оценки релевантности разных моделей
    - Каждое присутствие документа добавляет положительный ранговый вклад, а вклады из разных выдач суммируются
    - RRF всегда ставит выше документы из sparse-поиска
    - Отсутствие документа в выдаче добавляет ему штраф
  correct: 1
  id: 021-reciprocal-rank-fusion-1
  fingerprint: b5603a50
- concept: дорогой cross-encoder применяют к сокращённому списку после объединения результатов retrieval
  question: Почему cross-encoder обычно запускают после RRF-объединения dense- и sparse-выдач, а не для всех документов корпуса?
  explanation: Dense- и sparse-поиск быстро собирают кандидатов, RRF объединяет их сигналы, а вычислительно дорогой cross-encoder повышает точность уже на коротком списке.
  kind: open
  reference: Cross-encoder отдельно обрабатывает каждую пару запрос–документ, поэтому полный проход по корпусу слишком дорог. RRF формирует небольшой список кандидатов с высоким recall, который cross-encoder может точнее переранжировать.
  id: 021-reciprocal-rank-fusion-2
  fingerprint: 1992d0c7
