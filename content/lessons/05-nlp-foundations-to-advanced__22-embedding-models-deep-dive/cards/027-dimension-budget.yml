- concept: оценка полного размера векторного индекса должна учитывать вспомогательные структуры
  question: Инженер оценил необходимый объём хранилища как произведение числа векторов, их размерности и размера одной координаты. Почему этого недостаточно для планирования развёртывания?
  explanation: Произведение даёт объём только самих векторов. Реальный индекс дополнительно хранит структуры навигации или кластеризации, идентификаторы, метаданные и служебные данные, поэтому его полный размер обычно больше.
  kind: choice
  options:
    - Векторный индекс также хранит служебные структуры для поиска, метаданные и другие накладные данные
    - Dense-векторы невозможно хранить без исходных текстов той же длины
    - Каждая координата автоматически дублируется при добавлении в индекс
    - Размер индекса определяется только длиной поискового запроса
