- concept: меньшая размерность сокращает вычисления и чтение памяти при поиске, но ускорение зависит от всей архитектуры индекса
  question: Объясни своими словами, почему уменьшение размерности dense-векторов обычно ускоряет поиск, но не гарантирует пропорционального сокращения задержки.
  explanation: Размерность определяет объём работы над каждой парой векторов, но сравнение координат — лишь часть поискового запроса. Навигация по индексу, доступ к памяти и прочие этапы могут ограничить фактическое ускорение.
  kind: open
  reference: При сравнении векторов меньшей размерности нужно обработать меньше координат и прочитать меньше данных из памяти. Однако итоговая задержка зависит также от типа индекса, числа рассмотренных кандидатов, оборудования и постоянных накладных расходов, поэтому ускорение не обязано совпадать с коэффициентом уменьшения размерности.
  id: 027-dimension-budget-3
