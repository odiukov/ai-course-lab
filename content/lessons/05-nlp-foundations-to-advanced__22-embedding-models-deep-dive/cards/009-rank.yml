- concept: усреднение токенных векторов теряет информацию о порядке токенов
  question: Почему embedding текста, полученный простым усреднением токенных векторов, не различает перестановки одних и тех же токенов?
  explanation: Среднее определяется суммой токенных векторов и их количеством. Перестановка токенов не меняет ни сумму, ни делитель, поэтому итоговый embedding остаётся прежним.
  kind: open
  reference: Сложение и усреднение не зависят от порядка слагаемых. Если набор токенов и число их повторений не изменились, перестановка даст тот же средний вектор.
  id: 009-rank-2
  fingerprint: c326f251
