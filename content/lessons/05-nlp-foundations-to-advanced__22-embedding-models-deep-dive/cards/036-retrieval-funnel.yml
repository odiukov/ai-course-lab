- concept: полнота набора кандидатов ограничивает возможности финального reranker
  question: Релевантный документ не попал в набор кандидатов, переданный cross-encoder reranker. Сможет ли reranker поставить этот документ на первое место?
  explanation: Reranker меняет порядок только внутри полученного списка. Если нужный документ не нашли dense- и sparse-уровни, финальная модель не сможет его вернуть.
  kind: choice
  options:
    - 'Нет: reranker оценивает только переданные ему документы'
    - 'Да: cross-encoder автоматически ищет недостающие документы во всём индексе'
    - 'Да: высокая точность reranker компенсирует отсутствие документа среди кандидатов'
  correct: 0
  id: 036-retrieval-funnel-1
  fingerprint: 040b2fe9
- concept: bi-encoder масштабируется для первичного поиска благодаря независимому кодированию запросов и документов
  question: Почему dense bi-encoder подходит для первичного поиска по большому корпусу, а cross-encoder обычно используют лишь для финального reranking?
  explanation: Предвычисленный dense-индекс позволяет быстро получить широкий набор кандидатов. Cross-encoder учитывает совместные взаимодействия токенов запроса и документа, но из-за попарного инференса его вычислительная стоимость растёт вместе с числом проверяемых документов.
  kind: open
  reference: Bi-encoder независимо кодирует запрос и документы, поэтому эмбеддинги документов можно заранее вычислить и поместить в индекс. Cross-encoder совместно обрабатывает каждую пару запрос–документ, что даёт более точную оценку, но требует дорогого отдельного вычисления для каждого кандидата.
  id: 036-retrieval-funnel-2
  fingerprint: 00e753a2
