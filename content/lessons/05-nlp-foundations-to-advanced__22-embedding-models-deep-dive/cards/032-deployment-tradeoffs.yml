- concept: open-weight-развёртывание позволяет закрепить версию embedding-модели и контролировать расположение данных
  question: Компания требует, чтобы тексты не покидали её инфраструктуру, а повторная индексация тем же кодом давала эмбеддинги той же версии модели. Какой вариант лучше соответствует требованиям?
  explanation: Open-weight-модель можно запускать внутри собственной инфраструктуры и закрепить конкретную версию весов. Hosted-сервис упрощает обновления, но расположение данных и жизненный цикл версии в большей степени зависят от поставщика.
  kind: choice
  options:
    - Hosted API с автоматическим обновлением модели
    - Open-weight-модель с закреплённой версией весов
    - Любой hosted API с оплатой по запросам
  correct: 1
  id: 032-deployment-tradeoffs-1
  fingerprint: '35326748'
- concept: редкие задержки hosted-инференса зависят не только от вычислений модели, но и от внешней инфраструктуры поставщика
  question: Средняя задержка hosted embedding API остаётся низкой, но высокий перцентиль задержки заметно ухудшился. Какое объяснение наиболее правдоподобно?
  explanation: Среднее может скрывать редкие медленные запросы. В hosted-варианте к времени инференса добавляются сеть, очередь и лимиты поставщика, поэтому p99 может ухудшиться даже при хорошем среднем.
  kind: choice
  options:
    - Средняя задержка математически обязана совпадать с высоким перцентилем
    - Редкие сетевые задержки, очереди поставщика или ограничения API затронули часть запросов
    - Размерность эмбеддинга автоматически увеличилась для каждого медленного запроса
    - Косинусная близость перестала быть определена для всех документов
  correct: 1
  id: 032-deployment-tradeoffs-2
  fingerprint: e0fca6ef
- concept: экономический выбор между open-weight и hosted зависит от профиля нагрузки и доли простоя инфраструктуры
  question: Объясни своими словами, почему hosted embedding API часто выгоднее при редкой и неравномерной нагрузке, а open-weight-развёртывание может стать выгоднее при большой стабильной нагрузке.
  explanation: Hosted переносит часть фиксированных расходов и эксплуатации на поставщика. Open-weight требует серверов и специалистов независимо от текущего числа запросов, зато при высокой утилизации собственная инфраструктура может окупаться лучше.
  kind: open
  reference: Hosted API обычно оплачивается по использованию и не требует постоянно держать собственные серверы, поэтому при редкой нагрузке меньше расходов на простой и обслуживание. У open-weight-развёртывания есть фиксированные затраты на инфраструктуру, запас мощности и инженерную поддержку, но при большой устойчивой загрузке эти ресурсы используются постоянно, и стоимость одного запроса может стать ниже.
  id: 032-deployment-tradeoffs-3
  fingerprint: 1619656f
