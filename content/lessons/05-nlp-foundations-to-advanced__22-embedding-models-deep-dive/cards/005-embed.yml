- concept: коллизии hashing trick объединяют вклады разных токенов в одной координате
  question: Что происходит, если hashing trick назначает двум разным токенам одну координату embedding-вектора?
  explanation: При ограниченном числе ячеек разные токены могут получить одинаковый индекс. Их значения накапливаются в одной координате, и восстановить из неё отдельные вклады уже нельзя. В учебном примере с 1000 ячейками именно коллизии ограничивают качество такого embedding.
  kind: choice
  options:
    - Вектор автоматически расширяется новой координатой
    - Вклады токенов суммируются, поэтому часть информации об их различии теряется
    - Один из токенов удаляется из исходного текста
    - Для каждого токена создаётся отдельный вложенный вектор
  correct: 1
  id: 005-embed-1
  fingerprint: 8f8b6f74
- concept: последовательность построения нормализованного embedding методом hashing trick
  question: Расположите операции построения embedding методом hashing trick в правильном порядке.
  explanation: Сначала текст превращают в токены, затем их вклады накапливают в фиксированном массиве. После этого значения усредняют по числу токенов и нормализуют. Для пустого текста нужен отдельный ранний возврат нулевого вектора.
  kind: order
  items:
    - Привести текст к единому регистру и выделить токены
    - Создать заполненный нулями вектор фиксированной размерности
    - Для каждого токена вычислить устойчивый индекс и увеличить соответствующую координату
    - Разделить накопленные координаты на количество токенов
    - Нормализовать полученный вектор
  id: 005-embed-2
  fingerprint: 594c85f6
- concept: пустой текст требует отдельной обработки при усреднении embedding
  question: Почему функция построения усреднённого embedding должна отдельно обрабатывать текст без токенов и что ей следует вернуть?
  explanation: Фиксированная форма результата должна сохраняться даже для пустого ввода. Нулевой вектор нужной длины одновременно предотвращает деление на ноль и не приписывает отсутствующему тексту искусственный сигнал.
  kind: open
  reference: У пустого текста число токенов равно нулю, поэтому обычное усреднение привело бы к делению на ноль. Следует вернуть нулевой вектор той же фиксированной размерности, что и для любого другого текста.
  id: 005-embed-3
  fingerprint: 534fa029
