- concept: top-k выбирает заданное количество кандидатов с наибольшими оценками
  question: Какое правило описывает выборку top-k при ранжировании найденных фрагментов?
  explanation: Top-k означает выбор ровно k лидеров после сортировки по убыванию оценки, если кандидатов достаточно. Пороговая выборка решает другую задачу и может вернуть произвольное количество результатов.
  kind: choice
  options:
    - Вернуть все фрагменты, оценка которых превышает фиксированный порог
    - Упорядочить фрагменты по убыванию оценки и вернуть первые k
    - Разделить фрагменты на k групп и вернуть лидера каждой группы
    - Вернуть только фрагменты с оценкой, равной максимальной
  correct: 1
  id: 008-ranking-contract-2
