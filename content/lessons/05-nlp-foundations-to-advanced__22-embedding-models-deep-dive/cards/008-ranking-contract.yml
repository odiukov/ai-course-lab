- concept: стабильная сортировка сохраняет исходный порядок элементов с равными оценками
  question: Два фрагмента получили одинаковую оценку близости. Как должна поступить стабильная сортировка?
  explanation: Стабильная сортировка не переставляет элементы с одинаковым ключом. Поэтому равные по оценке фрагменты остаются в порядке, в котором находились в корпусе, и выдача получается воспроизводимой.
  kind: choice
  options:
    - Сохранить между ними исходный порядок корпуса
    - Поставить вперёд более длинный фрагмент
    - Выбрать их порядок случайно
    - Удалить оба фрагмента как неразличимые
  correct: 0
  id: 008-ranking-contract-3
  fingerprint: 687cd048
