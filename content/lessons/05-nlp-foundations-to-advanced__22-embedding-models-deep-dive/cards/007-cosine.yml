- concept: косинусная близость определена только для векторов одинаковой размерности
  question: Функция вычисления cosine получила векторы разной длины. Как она должна поступить?
  explanation: Скалярное произведение требует одинаковой размерности. Например, zip молча отбросит лишние координаты и может вернуть правдоподобный, но математически некорректный результат.
  kind: choice
  options:
    - Дополнить более короткий вектор его последней координатой
    - Сообщить об ошибке размерности до вычислений
    - Сравнить только координаты, для которых есть пары
    - Отбросить более короткий вектор и вернуть норму длинного
  correct: 1
  id: 007-cosine-1
  fingerprint: 8466046f
- concept: умножение вектора на отрицательный коэффициент меняет его направление на противоположное
  question: Ненулевой вектор b получен умножением ненулевого вектора a на отрицательный коэффициент. Какова косинусная близость a и b?
  explanation: Отрицательный коэффициент разворачивает направление вектора. Поэтому угол между векторами равен 180°, а cosine равен -1 независимо от модуля коэффициента.
  kind: choice
  options:
    - Она максимальна, потому что координаты пропорциональны
    - Она зависит от модуля коэффициента
    - Она минимальна, потому что направления противоположны
    - Она обязательно равна скалярному произведению
  correct: 2
  id: 007-cosine-2
  fingerprint: 2fccf87c
