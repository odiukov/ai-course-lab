- concept: embedding-модель может молча отбросить часть входа за пределами context window
  question: После индексации длинного документа поиск находит сведения из его начала, но не находит релевантные сведения из конца. Ошибок при построении эмбеддинга не было. Какова наиболее вероятная причина?
  explanation: Многие embedding-модели не сообщают об ошибке при слишком длинном входе, а просто отбрасывают хвост. Поэтому сведения за пределами context window вообще не попадают в полученный вектор.
  kind: choice
  options:
    - Модель молча обрезала вход по пределу context window
    - Косинусная близость не умеет сравнивать фрагменты одного документа
    - Embedding-модель всегда придаёт началу документа больший вес
    - Поиск автоматически исключил последние разделы из-за их положения
  correct: 0
  id: 028-context-capacity-1
  fingerprint: af46ef65
- concept: помещающийся в context window документ всё равно стоит делить на семантически цельные чанки
  question: Почему тематически неоднородный документ полезно разделить на осмысленные чанки, даже если он целиком помещается в context window модели?
  explanation: Отсутствие обрезания ещё не гарантирует качественный retrieval. Вектор большого многотемного фрагмента объединяет разные смыслы, тогда как самостоятельный тематический чанк точнее сопоставляется с запросом и при этом сохраняет необходимый контекст.
  kind: open
  reference: Context window определяет лишь допустимую длину входа. Единый embedding неоднородного документа смешивает несколько тем, поэтому хуже соответствует конкретному запросу; семантически цельные чанки дают более точные единицы поиска.
  id: 028-context-capacity-2
  fingerprint: 1b100871
