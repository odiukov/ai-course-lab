<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Три представления одного фрагмента</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #eef3f8;
    --ink: #172235;
    --muted: #59677a;
    --line: #9aa9ba;
    --dense: #2767d8;
    --dense-soft: #dce9ff;
    --sparse: #a65713;
    --sparse-soft: #ffead5;
    --multi: #23735b;
    --multi-soft: #d9f3e9;
    --source: #6750a4;
    --source-soft: #eee8ff;
    --shadow: #dbe2ea;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #192230;
      --panel-soft: #222e3d;
      --ink: #edf3fb;
      --muted: #aebccd;
      --line: #69798c;
      --dense: #80adff;
      --dense-soft: #243d67;
      --sparse: #ffb774;
      --sparse-soft: #55361f;
      --multi: #72d7b5;
      --multi-soft: #204d40;
      --source: #c4afff;
      --source-soft: #3d315f;
      --shadow: #0b1018;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 {
    margin: unset;
    font-size: 22px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--page);
  }

  .card,
  .source-card,
  .cell,
  .weight-track,
  .weight-fill,
  .token-chip {
    vector-effect: non-scaling-stroke;
  }

  .card {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 1.5px;
  }

  .source-card {
    fill: var(--source-soft);
    stroke: var(--source);
    stroke-width: 2px;
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .arrow-dense { fill: var(--dense); }
  .arrow-sparse { fill: var(--sparse); }
  .arrow-multi { fill: var(--multi); }

  .dense-accent {
    fill: var(--dense-soft);
    stroke: var(--dense);
    stroke-width: 1.5px;
  }

  .sparse-accent {
    fill: var(--sparse-soft);
    stroke: var(--sparse);
    stroke-width: 1.5px;
  }

  .multi-accent {
    fill: var(--multi-soft);
    stroke: var(--multi);
    stroke-width: 1.5px;
  }

  .cell {
    stroke-width: 1px;
  }

  .dense-cell {
    fill: var(--dense-soft);
    stroke: var(--dense);
  }

  .multi-cell {
    fill: var(--multi-soft);
    stroke: var(--multi);
  }

  .weight-track {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 1px;
  }

  .weight-fill {
    fill: var(--sparse);
  }

  .token-chip {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 1px;
  }

  text {
    fill: var(--ink);
    dominant-baseline: middle;
  }

  .eyebrow {
    font-size: 12px;
    font-weight: bold;
    fill: var(--muted);
  }

  .source-text {
    font-size: 16px;
    font-weight: bold;
  }

  .title {
    font-size: 19px;
    font-weight: bold;
  }

  .description {
    font-size: 14px;
    fill: var(--muted);
  }

  .metric {
    font-size: 15px;
    font-weight: bold;
  }

  .small {
    font-size: 12px;
    fill: var(--muted);
  }

  .token {
    font-size: 13px;
    font-weight: bold;
  }

  .dense-text { fill: var(--dense); }
  .sparse-text { fill: var(--sparse); }
  .multi-text { fill: var(--multi); }

  #fallback {
    font-size: 16px;
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
  }
</style>
</head>
<body>
<h1>Три представления одного фрагмента</h1>

<svg id="scheme" width="1100" height="430" viewBox="0 0 1100 430"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Один фрагмент расходится в dense, sparse и multi-vector представления</title>
  <desc id="svg-desc">Фрагмент из 200 токенов преобразуется в один dense-вектор из 1024 чисел, sparse-словарь ненулевых весов или 200 векторов по 1024 числа.</desc>
  <g id="diagram"></g>
</svg>

<p id="fallback" hidden>
  Один фрагмент из 200 токенов расходится в три ветки: dense — один вектор
  из 1024 чисел; sparse — словарь ненулевых весов; multi-vector —
  200 векторов по 1024 числа.
</p>

<script>
const DATA = Object.freeze({
  zero: 0,
  originX: 0,
  originY: 0,
  scale: 1,
  radius: 13,
  chipRadius: 7,
  source: [24, 142, 282, 286],
  cards: [
    {
      box: [398, 12, 1078, 130],
      accent: "dense",
      title: "Dense",
      metric: "один вектор · 1024 числа",
      description: "Общий смысл фрагмента собран в одной точке.",
      titleAt: [426, 38],
      metricAt: [426, 66],
      descriptionAt: [426, 94]
    },
    {
      box: [398, 145, 1078, 276],
      accent: "sparse",
      title: "Sparse",
      metric: "словарь ненулевых весов",
      description: "Редкие слова получают собственные позиции.",
      titleAt: [426, 171],
      metricAt: [426, 199],
      descriptionAt: [426, 227]
    },
    {
      box: [398, 291, 1078, 422],
      accent: "multi",
      title: "Multi-vector",
      metric: "200 векторов · по 1024 числа",
      description: "Отдельный вектор сохраняется для каждого токена.",
      titleAt: [426, 317],
      metricAt: [426, 345],
      descriptionAt: [426, 373]
    }
  ],
  sourceText: [
    { value: "ОДИН ФРАГМЕНТ", at: [48, 165], className: "eyebrow" },
    { value: "«Ошибка E17 возникает", at: [48, 197], className: "source-text" },
    { value: "при перегреве насоса»", at: [48, 222], className: "source-text" },
    { value: "200 токенов", at: [48, 263], className: "metric dense-text" }
  ],
  curves: [
    [[282, 214], [330, 214], [344, 72], [388, 72]],
    [[282, 214], [330, 214], [344, 210], [388, 210]],
    [[282, 214], [330, 214], [344, 356], [388, 356]]
  ],
  arrows: [
    { points: [[388, 72], [376, 65], [376, 79]], className: "arrow-dense" },
    { points: [[388, 210], [376, 203], [376, 217]], className: "arrow-sparse" },
    { points: [[388, 356], [376, 349], [376, 363]], className: "arrow-multi" }
  ],
  dense: {
    bracketLeft: [735, 72],
    bracketRight: [1034, 72],
    dotsAt: [1008, 72],
    cells: [
      [754, 55, 779, 89],
      [786, 55, 811, 89],
      [818, 55, 843, 89],
      [850, 55, 875, 89],
      [882, 55, 907, 89],
      [914, 55, 939, 89],
      [946, 55, 971, 89]
    ],
    noteAt: [884, 111]
  },
  sparse: {
    rows: [
      { token: "E17", chip: [708, 163, 770, 187], track: [788, 167, 1028, 183], fill: [788, 167, 1000, 183] },
      { token: "насос", chip: [708, 195, 770, 219], track: [788, 199, 1028, 215], fill: [788, 199, 955, 215] },
      { token: "перегрев", chip: [690, 227, 770, 251], track: [788, 231, 1028, 247], fill: [788, 231, 914, 247] }
    ],
    zeroTextAt: [1038, 239],
    noteAt: [884, 263]
  },
  multi: {
    rows: [
      {
        token: "Ошибка",
        chip: [650, 309, 714, 329],
        cells: [[732, 307, 752, 331], [758, 307, 778, 331], [784, 307, 804, 331], [810, 307, 830, 331], [836, 307, 856, 331]]
      },
      {
        token: "E17",
        chip: [650, 339, 714, 359],
        cells: [[732, 337, 752, 361], [758, 337, 778, 361], [784, 337, 804, 361], [810, 337, 830, 361], [836, 337, 856, 361]]
      },
      {
        token: "насоса",
        chip: [650, 369, 714, 389],
        cells: [[732, 367, 752, 391], [758, 367, 778, 391], [784, 367, 804, 391], [810, 367, 830, 391], [836, 367, 856, 391]]
      }
    ],
    continuationAt: [874, 349],
    brace: [908, 307, 908, 391],
    labelAt: [932, 349],
    noteAt: [884, 408]
  }
});

const origin = Object.freeze({ x: DATA.originX, y: DATA.originY });
const scale = DATA.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("scheme");
  const root = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = svg.namespaceURI;

  const make = (name, attrs = {}, content = "") => {
    const node = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (content) node.textContent = content;
    return node;
  };

  const append = node => root.appendChild(node);

  const rect = (box, className, radius = DATA.radius) => {
    const [x1, y1, x2, y2] = box;
    return make("rect", {
      x: sx(x1),
      y: sy(y1),
      width: sx(x2) - sx(x1),
      height: sy(y2) - sy(y1),
      rx: sx(radius) - sx(DATA.zero),
      ry: sy(radius) - sy(DATA.zero),
      class: className
    });
  };

  const label = (value, at, className, anchor = "start") => {
    const [x, y] = at;
    return make("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor,
      class: className
    }, value);
  };

  const polygon = (points, className) => make("polygon", {
    points: points.map(({ x, y }) => `${sx(x)},${sy(y)}`).join(" "),
    class: className
  });

  const curve = points => {
    const [start, first, second, end] = points;
    return make("path", {
      d: `M ${sx(start.x)} ${sy(start.y)} C ${sx(first.x)} ${sy(first.y)}, ${sx(second.x)} ${sy(second.y)}, ${sx(end.x)} ${sy(end.y)}`,
      class: "connector"
    });
  };

  append(rect(DATA.source, "source-card"));
  for (const item of DATA.sourceText) {
    append(label(item.value, item.at, item.className));
  }

  for (const card of DATA.cards) {
    append(rect(card.box, "card"));
    append(label(card.title, card.titleAt, `title ${card.accent}-text`));
    append(label(card.metric, card.metricAt, "metric"));
    append(label(card.description, card.descriptionAt, "description"));
  }

  for (const raw of DATA.curves) {
    append(curve(raw.map(([x, y]) => ({ x, y }))));
  }

  for (const arrow of DATA.arrows) {
    append(polygon(
      arrow.points.map(([x, y]) => ({ x, y })),
      arrow.className
    ));
  }

  for (const cell of DATA.dense.cells) append(rect(cell, "cell dense-cell", DATA.chipRadius));
  append(label("[", DATA.dense.bracketLeft, "title dense-text", "middle"));
  append(label("…", DATA.dense.dotsAt, "title dense-text", "middle"));
  append(label("]", DATA.dense.bracketRight, "title dense-text", "middle"));
  append(label("компактно · общий смысл", DATA.dense.noteAt, "small", "middle"));

  for (const row of DATA.sparse.rows) {
    append(rect(row.chip, "token-chip", DATA.chipRadius));
    const [cx1, cy1, cx2, cy2] = row.chip;
    append(label(
      row.token,
      [(cx1 + cx2) / (sx(DATA.scale) - sx(DATA.zero) + DATA.scale), (cy1 + cy2) / (sy(DATA.scale) - sy(DATA.zero) + DATA.scale)],
      "token",
      "middle"
    ));
    append(rect(row.track, "weight-track", DATA.chipRadius));
    append(rect(row.fill, "weight-fill", DATA.chipRadius));
  }
  append(label("… нули", DATA.sparse.zeroTextAt, "small", "end"));
  append(label("точные термины остаются заметными", DATA.sparse.noteAt, "small", "middle"));

  for (const row of DATA.multi.rows) {
    append(rect(row.chip, "token-chip", DATA.chipRadius));
    const [cx1, cy1, cx2, cy2] = row.chip;
    append(label(
      row.token,
      [(cx1 + cx2) / (sx(DATA.scale) - sx(DATA.zero) + DATA.scale), (cy1 + cy2) / (sy(DATA.scale) - sy(DATA.zero) + DATA.scale)],
      "token",
      "middle"
    ));
    for (const cell of row.cells) append(rect(cell, "cell multi-cell", DATA.chipRadius));
  }

  append(label("…", DATA.multi.continuationAt, "title multi-text", "middle"));

  const [bx1, by1, bx2, by2] = DATA.multi.brace;
  append(make("line", {
    x1: sx(bx1),
    y1: sy(by1),
    x2: sx(bx2),
    y2: sy(by2),
    class: "connector"
  }));
  append(label("по 1024 числа", DATA.multi.labelAt, "token multi-text"));
  append(label("больше деталей · больше хранения", DATA.multi.noteAt, "small", "middle"));

  if (!root.childNodes.length) throw new Error("Схема не построена");
} catch (error) {
  document.getElementById("scheme").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
</body>
</html>
