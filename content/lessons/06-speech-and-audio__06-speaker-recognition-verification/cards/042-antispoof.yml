- concept: совпадение голоса с эталоном не доказывает живое происхождение аудиосигнала
  question: Верификатор показал высокое сходство входной записи с голосовым эталоном пользователя. Какой вывод обоснован?
  explanation: Верификатор устанавливает сходство голосовых признаков с эталоном. Запись или синтез того же голоса тоже могут дать высокое сходство, поэтому живое присутствие из этой оценки не следует.
  kind: choice
  options:
    - Запись гарантированно произнёс живой пользователь перед микрофоном
    - Голосовые признаки записи соответствуют эталону, но запись может быть воспроизведённой или синтезированной
    - Запись гарантированно не была синтезирована
    - Микрофон не внёс искажений в сигнал
  correct: 1
  id: 042-antispoof-1
  fingerprint: 652916ff
- concept: задачи подтверждения личности и обнаружения голосового спуфинга требуют отдельных моделей
  question: Объясни, какие две проверки нужны системе голосового доступа к финансовым операциям и за что отвечает каждая из них.
  explanation: 'Эти модели отвечают на разные вопросы: верификатор проверяет личность по голосовым признакам, а анти-спуфинг — происхождение сигнала и признаки атаки. Настройка порога сходства не заменяет вторую проверку.'
  kind: open
  reference: Модель верификации должна определить, соответствует ли голос зарегистрированному пользователю, а модель анти-спуфинга — искать в сигнале признаки воспроизведения записи или синтеза. Доступ разрешают только при успешном прохождении обеих проверок.
  id: 042-antispoof-2
  fingerprint: 053a704b
