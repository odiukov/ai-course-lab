- concept: верификация использует заранее сохранённый при регистрации эталонный эмбеддинг
  question: Расположите этапы полного пайплайна регистрации и последующей проверки говорящего в правильном порядке.
  explanation: Enrollment заранее создаёт и сохраняет голосовой эталон. При verification новое высказывание кодируется той же моделью, после чего его эмбеддинг сравнивается с эталонным и оценка сопоставляется с порогом.
  kind: order
  items:
    - Получить регистрационную запись целевого говорящего
    - Вычислить эталонный эмбеддинг
    - Сохранить эталонный эмбеддинг рядом с учётной записью
    - Получить тестовое высказывание
    - Вычислить тестовый эмбеддинг той же моделью
    - Сравнить эмбеддинги и применить порог решения
  id: 009-pipeline-1
  fingerprint: 7b650b3b
- concept: эталонные и тестовые эмбеддинги должны принадлежать пространству одной версии модели
  question: Сервис заменил модель извлечения speaker embeddings, а старые регистрационные аудиозаписи не сохранил. Что необходимо сделать перед проверкой пользователей новой моделью?
  explanation: Разные модели задают разные пространства эмбеддингов, поэтому старые и новые координаты напрямую несопоставимы. Если исходное аудио не сохранено и эталоны нельзя пересчитать новой моделью, требуется повторный enrollment.
  kind: choice
  options:
    - Продолжить сравнивать новые тестовые эмбеддинги со старыми эталонами
    - Только подобрать новый порог для старых эталонов
    - Попросить пользователей повторно пройти регистрацию
    - Нормировать длину старых эмбеддингов
  correct: 2
  id: 009-pipeline-2
  fingerprint: 7a8f63aa
- concept: временной pooling преобразует записи переменной длительности в эмбеддинги фиксированной размерности
  question: Почему эмбеддинги короткой и длинной записей можно непосредственно сравнивать, хотя число аудиокадров в них различается?
  explanation: До pooling представление имеет переменную временную длину. Pooling сворачивает временную ось, сохраняя фиксированное число признаков, поэтому длительность исходной речи не меняет размер эмбеддинга.
  kind: open
  reference: Модель агрегирует переменное число кадров с помощью pooling и всегда выдаёт вектор одной фиксированной размерности. Поэтому обе записи становятся точками в одном пространстве и их можно сравнить.
  id: 009-pipeline-3
  fingerprint: 25e1ce2f
