- concept: PLDA чувствителен к несовпадению обучающего и рабочего доменов
  question: Объясни своими словами, почему PLDA, обученный на студийной речи одного языка, может плохо работать на телефонных записях другого языка.
  explanation: PLDA обучается под конкретный домен. Если условия применения отличаются, выученное разделение между вариативностью одного говорящего и различиями разных говорящих перестаёт соответствовать данным, поэтому преимущество над косинусом может исчезнуть.
  kind: open
  reference: PLDA изучает распределения внутридикторных изменений и различий между говорящими на обучающих данных. При смене языка, канала или микрофонов эти распределения меняются, поэтому модель может принимать доменные отличия за признаки личности или неверно оценивать естественную вариативность одного говорящего.
  id: 035-plda-2
