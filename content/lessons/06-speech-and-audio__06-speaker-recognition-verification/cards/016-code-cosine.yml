- concept: косинусное сходство симметрично относительно перестановки аргументов
  question: Для ненулевых эмбеддингов x и y вычислили cosine_score(x, y). Что гарантированно вернёт cosine_score(y, x)?
  explanation: Скалярное произведение не меняется при перестановке векторов, а произведение их норм также симметрично. Поэтому порядок аргументов не влияет на косинусное сходство.
  kind: choice
  options:
    - Тот же результат
    - Результат с противоположным знаком
    - Величину, обратную исходному результату
  correct: 0
  id: 016-code-cosine-1
  fingerprint: a6f959e5
- concept: косинусное самосходство любого ненулевого вектора максимально
  question: Объясни, почему сравнение ненулевого эмбеддинга с самим собой даёт максимальное косинусное сходство независимо от его длины.
  explanation: Для одного и того же ненулевого вектора числитель и знаменатель совпадают. Поэтому самосходство максимально; заметное отклонение указывает на ошибку в вычислении скалярного произведения или норм.
  kind: open
  reference: В числителе получается скалярное произведение вектора на себя, равное квадрату его нормы. Знаменатель — произведение двух одинаковых норм, то есть тот же квадрат. После деления остаётся единица.
  id: 016-code-cosine-2
  fingerprint: 73b0eb17
- concept: неравенство Коши — Буняковского ограничивает модуль косинусного сходства
  question: Заполни знак в ограничении для любых ненулевых векторов.
  explanation: Неравенство Коши — Буняковского утверждает, что модуль скалярного произведения не превосходит произведения норм. После деления на это произведение модуль косинусного сходства не может быть больше единицы.
  kind: cloze
  template: '|cos(x, y)| ___ единица'
  answer: ≤
  accept:
    - <=
