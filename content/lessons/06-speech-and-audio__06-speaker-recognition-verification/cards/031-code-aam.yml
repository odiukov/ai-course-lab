- concept: угловой отступ применяют к углу, поэтому его нельзя вычитать непосредственно из косинуса
  question: Для целевого класса cos(θ) = 0.5, угловой отступ m = 0.1 радиана, а масштаб s = 20. Чему примерно равен логит s·cos(arccos(cos(θ)) + m)?
  explanation: 'Сначала восстанавливаем угол: arccos(0.5) ≈ 1.047. После прибавления отступа получаем угол около 1.147, его косинус равен примерно 0.411. После масштабирования: 20 · 0.411 ≈ 8.22.'
  kind: numeric
  answer: 8.22
  tolerance: 0.02
  id: 031-code-aam-1
  fingerprint: 6652b227
- concept: аргумент arccos нужно ограничивать математически допустимым диапазоном косинуса
  question: Из-за погрешности вычислений значение cos_theta оказалось немного больше максимально допустимого косинуса. Что следует сделать перед вызовом arccos?
  explanation: Небольшой выход за допустимые границы обычно вызван арифметикой с плавающей точкой. Ограничение диапазона сохраняет ближайшее корректное направление и предотвращает появление NaN в arccos.
  kind: choice
  options:
    - Ограничить значение допустимым диапазоном косинуса
    - Заменить значение его модулем
    - Округлить значение до ближайшего целого
    - Пропустить угловой отступ для всего батча
