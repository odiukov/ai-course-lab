- concept: на границе углового диапазона AAM-преобразование должно сохранять монотонность штрафа
  question: Почему формула cos(arccos(cos_theta) + m) может ошибочно повысить целевой логит при cos_theta, близком к минимально возможному, и какое условие должна обеспечивать реализация?
  explanation: Косинус убывает не на всей числовой прямой, а только на основном диапазоне углов между направлениями. Поэтому слепое прибавление margin требует граничной проверки, сохраняющей смысл отступа как штрафа.
  kind: open
  reference: Если исходный угол почти максимален, прибавление положительного отступа выводит его за границу монотонного убывания косинуса. После этой границы косинус снова начинает расти, поэтому штраф может превратиться в улучшение оценки. Реализация должна обрабатывать этот участок отдельно и гарантировать, что логит с margin не превышает исходный целевой логит.
