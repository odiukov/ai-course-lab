- concept: EER находят перебором порогов в точке равенства FAR и FRR
  question: Расположите этапы вычисления EER для системы верификации говорящего в правильном порядке.
  explanation: При изменении порога FAR и FRR движутся в противоположных направлениях. EER — их общий уровень в точке пересечения; если точного равенства среди проверенных порогов нет, точку обычно оценивают интерполяцией.
  kind: order
  items:
    - Получить оценки сходства для пар записей одного говорящего и пар разных говорящих.
    - Перебирать порог решения и для каждого значения вычислять FAR и FRR.
    - Найти точку, где FAR и FRR равны или максимально близки.
    - Принять общий уровень ошибок в найденной точке за EER.
  id: 006-eer-1
  fingerprint: cbdbf805
- concept: меньший EER позволяет сравнивать модели без привязки к выбранному поставщиком рабочему порогу
  question: Для модели A получили EER 6%, а для модели B — 8%. Поставщик модели B также сообщает FAR 0.8% при выбранном им пороге, но не указывает FRR. Какой вывод обоснован?
  explanation: 'EER модели A ниже: 6% против 8%, поэтому в стандартизированной точке она лучше разделяет своих и чужих. FAR 0.8% мог быть получен ценой высокого FRR, который поставщик не показал. При этом EER не предписывает рабочий порог для эксплуатации.'
  kind: choice
  options:
    - По EER модель A лучше; отдельное значение FAR модели B не отменяет этот вывод, потому что оно зависит от порога и ничего не говорит о соответствующем FRR.
    - Модель B лучше, потому что её показанный FAR меньше EER модели A.
    - Модели нельзя сравнить по EER, пока для них не установлен одинаковый численный порог.
    - Значения EER доказывают, что в эксплуатации нужно использовать именно пороги, при которых они измерены.
  correct: 0
