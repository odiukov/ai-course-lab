- concept: идентификация должна сначала найти глобально лучшего кандидата и только затем применить порог
  question: Расположите операции функции идентификации говорящего в правильном порядке.
  explanation: Выбор первого кандидата, преодолевшего порог, делает результат зависимым от порядка обхода базы. Глобальный максимум сначала определяет ближайшего говорящего, а отдельная проверка порога решает, достаточно ли надёжно совпадение.
  kind: order
  items:
    - Вычислить сходство тестового эмбеддинга с каждым зарегистрированным якорем
    - Выбрать кандидата с максимальной оценкой сходства
    - Сравнить максимальную оценку с порогом идентификации
    - Вернуть лучшего кандидата при прохождении порога, иначе сообщить об отсутствии совпадения
  id: 029-code-identify-1
  fingerprint: '56315407'
- concept: пустая база зарегистрированных голосов требует явного результата без совпадения
  question: Функция идентификации получила тестовый эмбеддинг и пустой словарь зарегистрированных якорей. Какое поведение корректно?
  explanation: В пустой базе нет ни кандидата, ни оценки сходства, поэтому операция поиска максимума не определена. Функция должна обработать этот случай до ранжирования и безопасно вернуть отсутствие совпадения.
  kind: choice
  options:
    - Считать тестовый эмбеддинг лучшим кандидатом
    - Вернуть результат «кандидат отсутствует», не пытаясь искать максимум
    - Принять говорящего, если порог положительный
    - Создать случайный якорь и сравнить его с тестовым эмбеддингом
  correct: 1
