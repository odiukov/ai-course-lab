- concept: рабочий порог выбирают с учётом относительной стоимости ложного пропуска и ложного отказа
  question: Почему двум системам на одной и той же модели распознавания говорящего могут требоваться разные пороги принятия решения?
  explanation: Порог не устраняет ошибки модели, а меняет их соотношение. Поэтому банк может предпочесть высокий порог ради безопасности, а офисный турникет — более низкий ради удобства сотрудников.
  kind: open
  reference: Последствия ошибок зависят от применения. Если особенно опасно принять злоумышленника, выбирают более строгий порог и мирятся с ростом ложных отказов. Если важнее не задерживать настоящих пользователей, порог снижают, принимая больший риск ложных пропусков.
