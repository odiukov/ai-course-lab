- concept: attention pooling агрегирует кадры с помощью нормированных обучаемых весов
  question: Расположите операции временного attention pooling в правильном порядке.
  explanation: Механизм сначала оценивает информативность кадров, затем нормирует оценки и строит взвешенную сумму. В отличие от обычного усреднения, вклад кадров в итоговое представление неодинаков.
  kind: order
  items:
    - Получить внутреннее представление каждого временного кадра
    - Вычислить скалярную оценку важности каждого кадра
    - Нормировать оценки в распределение весов по времени
    - Сложить представления кадров с полученными весами
  id: 033-attention-pooling-1
  fingerprint: dfce5aef
- concept: attention pooling уменьшает влияние тишины и постороннего шума на эмбеддинг говорящего
  question: Модель дала высокий вес звонкому речевому фрагменту и низкий вес паузе с фоновым шумом. Какой результат этого наиболее вероятен?
  explanation: Высокие веса усиливают информативные для личности голосовые признаки, а низкие подавляют паузы и шум. Это снижает вероятность того, что сходство записей будет определяться общим фоном.
  kind: choice
  options:
    - Эмбеддинг будет сильнее отражать признаки голоса и слабее — условия записи
    - Эмбеддинг станет зависеть только от длительности записи
    - Все временные кадры внесут одинаковый вклад
    - Модель начнёт распознавать произнесённые слова вместо личности говорящего
