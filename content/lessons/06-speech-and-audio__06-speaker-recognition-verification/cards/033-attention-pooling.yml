- concept: веса attention pooling обучаются совместно с моделью по целевой задаче распознавания говорящих
  question: Почему для обучения attention pooling не требуется вручную размечать каждый кадр как полезный или бесполезный?
  explanation: 'Покадровой разметки нет: сигнал обучения приходит от итогового лосса через взвешенное объединение кадров. Поэтому механизм сам обнаруживает фрагменты, полезные для различения говорящих.'
  kind: open
  reference: Веса входят в общий вычислительный граф модели и обучаются по ошибке распознавания говорящих. Если повышение веса некоторого кадра помогает сближать записи одного человека и разделять разных людей, градиент закрепляет такое распределение весов.
