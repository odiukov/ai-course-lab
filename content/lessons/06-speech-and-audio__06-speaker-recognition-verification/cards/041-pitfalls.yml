- concept: качество верификации говорящего нужно оценивать на том же акустическом канале, где система будет работать
  question: Модель показала низкий EER на записях из веб-видео, но её хотят применять для разговоров через телефонную сеть. Как надёжнее всего оценить ожидаемое качество?
  explanation: 'Кодек, полоса частот, микрофон, эхо и шум меняют распределение оценок сходства. Поэтому EER с VoxCeleb не описывает качество на телефонной линии: нужна оценка на данных целевого канала.'
  kind: choice
  options:
    - Использовать опубликованный EER, потому что модель и задача не изменились
    - Измерить EER на размеченной выборке телефонных разговоров, соответствующей рабочим условиям
    - Сравнить размерности эмбеддингов веб-видео и телефонных разговоров
    - Усреднить опубликованные результаты нескольких моделей
  correct: 1
  id: 041-pitfalls-1
  fingerprint: ba60e1fb
- concept: порог верификации нужно заново подбирать на dev-выборке из целевого акустического домена
  question: Расположите действия для настройки порога голосовой верификации перед запуском в новом акустическом канале.
  explanation: Рабочий порог зависит от распределений оценок сходства, а они меняются вместе с каналом. Поэтому порог, подобранный на VoxCeleb или в студии, нельзя без проверки переносить на телефонную линию.
  kind: order
  items:
    - Собрать отдельную размеченную dev-выборку в условиях нового канала
    - Получить оценки сходства для попыток своего и чужого говорящего
    - Выбрать порог по требуемому компромиссу между ложными пропусками и ложными отказами
    - Зафиксировать порог и проверить систему на независимой тестовой выборке того же домена
  id: 041-pitfalls-2
  fingerprint: 36d6470e
