- concept: минимальный разрыв FA и FR нужно хранить отдельно и инициализировать бесконечностью
  question: Заполните безопасную инициализацию переменной, которая хранит минимальный найденный разрыв между FA и FR.
  explanation: Бесконечность означает, что ни один порог ещё не проверен, поэтому первый вычисленный разрыв обязательно обновит результат. Если вывести начальный разрыв из фиктивной пары равных ошибок, получится ноль, который строго меньшим разрывом уже не побить.
  kind: cloze
  template: best_gap = ___
  answer: float("inf")
  accept:
    - float('inf')
    - math.inf
    - np.inf
