- concept: угловой margin формирует компактные внутриклассовые кластеры и запас между классами
  question: Почему высокая точность обычного классификатора на обучающих говорящих не гарантирует хорошую верификацию незнакомых говорящих и как AAM-softmax исправляет эту проблему?
  explanation: Классификационная точность проверяет лишь победу правильного класса над конкурентами. Угловой margin требует победы с запасом, поэтому улучшает геометрию всего пространства эмбеддингов, важную для последующей верификации.
  kind: open
  reference: Обычному softmax достаточно небольшого преимущества правильного класса, поэтому кластеры могут оказаться близко друг к другу. AAM-softmax искусственно уменьшает логит правильного класса добавлением положительного углового margin. Чтобы компенсировать штраф, сеть уменьшает угол до центра своего класса, формируя более компактные кластеры и больший угловой зазор между ними. Такое пространство эмбеддингов лучше переносится на незнакомых говорящих.
  id: 030-aam-teoria-3
  fingerprint: d5fe14e7
