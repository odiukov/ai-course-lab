- concept: масштаб s увеличивает динамический диапазон нормированных логитов перед softmax
  question: Зачем в AAM-softmax умножать угловые логиты на масштаб s?
  explanation: После нормализации логиты основаны на косинусах и лежат в узком диапазоне. Масштаб s растягивает их, благодаря чему softmax лучше различает классы; сам угловой margin задаётся отдельно параметром m.
  kind: choice
  options:
    - Чтобы увеличить различия между ограниченными значениями косинуса и получить информативные вероятности и градиенты softmax
    - Чтобы прибавить одинаковый угловой отступ ко всем классам
    - Чтобы заменить косинусное сходство евклидовым расстоянием
    - Чтобы автоматически выбрать порог верификации
  correct: 0
