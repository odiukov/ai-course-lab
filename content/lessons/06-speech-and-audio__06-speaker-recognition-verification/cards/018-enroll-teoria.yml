- concept: усреднение нескольких регистрационных эмбеддингов уменьшает влияние случайных условий записи
  question: Как сформировать устойчивый голосовой якорь, если чистые регистрационные записи немного различаются из-за микрофона, позы и фонового шума?
  explanation: Усреднение ослабляет отклонения, специфичные для отдельных записей, тогда как устойчивые признаки голоса сохраняются. Итоговая нормализация возвращает якорю единичную длину.
  kind: choice
  options:
    - Нормировать эмбеддинг каждой записи, покомпонентно усреднить их и нормировать результат
    - Сохранить эмбеддинг первой записи и отбросить остальные
    - Выбрать эмбеддинг с наибольшей исходной нормой
    - Склеить эмбеддинги в один более длинный вектор
  correct: 0
  id: 018-enroll-teoria-1
  fingerprint: 7b574971
- concept: среднее единичных эмбеддингов обычно не имеет единичной нормы
  question: Два нормированных эмбеддинга равны (0.6, 0.8) и (0.8, 0.6). Чему примерно равна евклидова норма их покомпонентного среднего до повторной нормализации?
  explanation: Средний вектор равен (0.7, 0.7), поэтому его норма равна √(0.7² + 0.7²) = √0.98 ≈ 0.99. Даже среднее единичных векторов обычно требуется нормировать повторно.
  kind: numeric
  answer: 0.99
  tolerance: 0.01
  id: 018-enroll-teoria-2
  fingerprint: e23eccbc
- concept: загрязнённую регистрационную запись следует исключить до построения голосового якоря
  question: Почему запись с кашлем или сильным фоновым гулом лучше исключить до усреднения регистрационных эмбеддингов?
  explanation: Арифметическое среднее подавляет небольшие разнонаправленные отклонения, но не гарантирует устойчивость к заметному выбросу. Поэтому контроль качества регистрационных записей выполняют до агрегации.
  kind: open
  reference: Её эмбеддинг содержит выраженные посторонние признаки и смещает средний якорь в их сторону. Поскольку этот якорь затем используется во всех проверках, загрязнённый образец может систематически ухудшать сходство с чистой речью владельца.
  id: 018-enroll-teoria-3
  fingerprint: 5a1e497f
