- concept: перекрывающаяся речь усложняет диаризацию из-за смешения нескольких голосов в одном временном участке
  question: Объясните своими словами, почему одновременная речь нескольких людей часто увеличивает ошибку диаризации.
  explanation: 'DER измеряет долю времени с ошибками диаризации. Перекрывающаяся речь особенно трудна: один участок содержит несколько голосов, а упрощённый пайплайн может построить для него одно смешанное представление и назначить только одного говорящего.'
  kind: open
  reference: В перекрывающемся участке присутствуют признаки нескольких говорящих. Если система представляет весь участок одним эмбеддингом или допускает только одну метку, смешанное представление трудно уверенно отнести к правильному кластеру, поэтому часть времени оказывается пропущенной или назначенной неверному говорящему.
  id: 039-diarization-3
  fingerprint: 3911e60f
