- concept: пайплайн диаризации группирует речевые сегменты по эмбеддингам и уточняет их временные границы
  question: Расположите этапы классического пайплайна диаризации в правильном порядке.
  explanation: Сначала система находит речь и получает сегменты, затем представляет каждый сегмент эмбеддингом и объединяет похожие представления в кластеры говорящих. Сглаживание в конце исправляет резкие или нестабильные границы реплик.
  kind: order
  items:
    - Обнаружить участки речи с помощью VAD
    - Разделить речь на сегменты
    - Вычислить эмбеддинг каждого сегмента
    - Сгруппировать похожие эмбеддинги кластеризацией
    - Сгладить временные границы полученных реплик
  id: 039-diarization-1
  fingerprint: 55df93b3
- concept: без зарегистрированных голосов диаризация определяет анонимные группы говорящих, но не их личности
  question: Какой результат может корректно выдать диаризация записи, если образцы голосов и имена участников заранее неизвестны?
  explanation: Диаризация группирует фрагменты, принадлежащие одному голосу, и присваивает группам условные метки. Связать такую группу с именем можно лишь при наличии дополнительных сведений или зарегистрированного голосового эталона.
  kind: choice
  options:
    - Анонимные метки говорящих и интервалы речи для каждой метки
    - Настоящие имена участников и вероятность их присутствия
    - Только полную текстовую расшифровку без разделения по голосам
    - Подтверждение заявленной пользователем личности
  correct: 0
  id: 039-diarization-2
