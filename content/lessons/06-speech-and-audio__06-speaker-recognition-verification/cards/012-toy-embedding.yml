- concept: объединение среднего и стандартного отклонения удваивает размерность покоординатного представления
  question: Для каждого кадра вычисляют 24 спектральных коэффициента. По каждой координате находят среднее и стандартное отклонение, а результаты конкатенируют. Какова размерность итогового эмбеддинга?
  explanation: 'Каждая исходная координата даёт две итоговые характеристики: среднее и стандартное отклонение. Поэтому размерность удваивается. Аналогично, для 13 MFCC получаются 13 средних и 13 отклонений — всего 26 координат.'
  kind: numeric
  answer: 48
  tolerance: 0.001
  id: 012-toy-embedding-1
  fingerprint: abb9c6b1
- concept: стандартное отклонение сохраняет информацию о временной изменчивости признаков, которую теряет среднее
  question: У двух записей совпадают средние значения всех покадровых акустических признаков, но во второй записи признаки заметно сильнее меняются между кадрами. Какая статистика поможет различить записи?
  explanation: Среднее описывает центральный уровень признака, но не его разброс. Стандартное отклонение показывает, насколько значения меняются от кадра к кадру, поэтому различает записи с одинаковыми средними и разной динамикой.
  kind: choice
  options:
    - Количество координат в каждом кадре
    - Повторное вычисление тех же средних
    - Стандартное отклонение каждой координаты
  correct: 2
  id: 012-toy-embedding-2
  fingerprint: db90c59a
- concept: x-vector применяет statistics pooling к обученным представлениям, а игрушечный эмбеддинг — непосредственно к MFCC
  question: Почему эмбеддинг из средних и стандартных отклонений сырых MFCC обычно уступает x-vector, хотя обе схемы используют statistics pooling?
  explanation: Само вычисление средних и стандартных отклонений не гарантирует качественного распознавания. Ключевое преимущество x-vector — признаки перед pooling обучаются выделять различия между говорящими, тогда как игрушечные 26 координат строятся из сырых MFCC.
  kind: open
  reference: В игрушечной схеме pooling применяется прямо к заранее заданным MFCC, которые не оптимизировались для различения говорящих. В x-vector сеть сначала преобразует кадры в признаки, обученные под задачу распознавания говорящего, и только затем агрегирует их статистики.
  id: 012-toy-embedding-3
  fingerprint: 5a39a4bf
