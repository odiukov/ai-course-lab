- concept: заниженное num_speakers вынуждает кластеризацию объединять речь разных людей
  question: Объясните своими словами, что произойдёт, если передать pyannote значение `num_speakers`, которое меньше фактического количества говорящих.
  explanation: Параметр задаёт жёсткое ограничение на число кластеров. Если кластеров недостаточно, отдельного кластера для каждого реального говорящего создать нельзя, и разные голоса приходится смешивать.
  kind: open
  reference: Пайплайн будет обязан уложить все речевые сегменты в недостаточное количество кластеров, поэтому речь разных людей окажется объединена или приписана чужим меткам, что обычно увеличит DER.
