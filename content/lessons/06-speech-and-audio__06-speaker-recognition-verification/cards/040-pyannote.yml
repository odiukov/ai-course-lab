- concept: точно известное число говорящих ограничивает кластеризацию и предотвращает лишнее расщепление говорящего
  question: Встреча записана с надёжно известным составом участников. Почему полезно передать pyannote точное количество говорящих?
  explanation: Точное `num_speakers` фиксирует количество кластеров. Это помогает не принять смену интонации или манеры речи за появление нового говорящего и тем самым может снизить DER.
  kind: choice
  options:
    - Пайплайн перестанет определять временные границы речи
    - Кластеризация не сможет создать лишний кластер из-за изменения голоса участника
    - Анонимные метки автоматически заменятся настоящими именами участников
    - Все речевые сегменты получат одинаковый эмбеддинг
  correct: 1
