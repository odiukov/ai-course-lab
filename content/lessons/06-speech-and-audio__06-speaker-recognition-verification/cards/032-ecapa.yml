- concept: squeeze-excitation вычисляет зависящие от записи веса каналов и масштабирует ими признаки
  question: Расположите операции squeeze-excitation в правильном порядке.
  explanation: Сначала squeeze агрегирует активность канала по времени. Затем excitation совместно анализирует сводные значения и выдаёт веса каналов. Масштабирование этими весами усиливает полезные признаки и подавляет каналы, связанные с шумом или нерелевантными особенностями записи.
  kind: order
  items:
    - Сжать временную последовательность каждого канала в сводное значение
    - По сводным значениям всех каналов вычислить коэффициент важности каждого канала
    - Умножить временные признаки каждого канала на его коэффициент
  id: 032-ecapa-2
  fingerprint: a460531c
