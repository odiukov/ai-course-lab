- concept: нормированная оценка показывает превышение сырого сходства над фоном в единицах стандартного отклонения
  question: Сырая оценка сходства равна 0.73, среднее по когорте самозванцев — 0.41, а стандартное отклонение — 0.08. Чему равна нормированная оценка?
  explanation: 'Нужно вычесть средний фон и разделить результат на его стандартное отклонение: (0.73 − 0.41) / 0.08 = 4. Такая оценка означает, что сходство находится на четыре стандартных отклонения выше фона.'
  kind: numeric
  answer: 4
  tolerance: 0.01
  id: 036-score-norm-1
  fingerprint: 5d20eb7f
- concept: AS-norm использует наиболее релевантную часть когорты вместо всей когорты
  question: Чем AS-norm отличается от обычной S-norm при выборе оценок когорты самозванцев?
  explanation: S-norm опирается на статистики всей заданной когорты, а AS-norm адаптивно оставляет её наиболее близкую к текущей записи часть. Нормирование по среднему и стандартному отклонению при этом сохраняется.
  kind: choice
  options:
    - Заменяет косинусное сходство евклидовым расстоянием
    - Использует только оценки настоящих владельцев голосовых эталонов
    - Отбирает ближайшую к проверяемой записи часть когорты
    - Отказывается от вычисления среднего и стандартного отклонения
  correct: 2
  id: 036-score-norm-2
  fingerprint: 598c3406
- concept: нормировка по когорте повышает переносимость порога между акустическими доменами
  question: Почему один порог по сырому косинусному сходству может работать неодинаково на разных микрофонах и как когортная нормировка уменьшает эту проблему?
  explanation: Сырой косинус отражает не только личность говорящего, но и условия записи. Если те же условия влияют на сравнения с когортой, их вклад частично устраняется при вычитании среднего фона и делении на его разброс.
  kind: open
  reference: Микрофон и канал могут систематически сдвигать распределение оценок сходства. Когортная нормировка оценивает локальный фон по голосам самозванцев, вычитает его среднее и учитывает разброс, поэтому итоговые оценки становятся сопоставимее между доменами и общий порог переносится лучше.
  id: 036-score-norm-3
  fingerprint: 02b6c810
