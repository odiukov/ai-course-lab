- concept: евклидова норма вычисляется как корень из суммы квадратов компонент
  question: Чему равна евклидова норма вектора (8, 15)?
  explanation: Норма равна sqrt(8×8 + 15×15) = sqrt(289) = 17. Число компонент вектора не используется как знаменатель нормализации.
  kind: numeric
  answer: 17
  tolerance: 0.01
  id: 014-code-l2-1
  fingerprint: fd46c4d7
- concept: нулевой вектор требует отдельной обработки при нормализации
  question: Функция нормализации получила вектор, все компоненты которого равны нулю. Какое поведение предотвращает появление NaN?
  explanation: Норма нулевого вектора равна нулю, поэтому прямое деление на неё не определено. Можно вернуть нулевой вектор как есть или добавить к знаменателю малое epsilon вроде 1e-10.
  kind: choice
  options:
    - Разделить каждую компоненту на число компонент
    - Вернуть нулевой вектор без изменений
    - Разделить каждую компоненту на максимальную компоненту
    - Заменить все компоненты одинаковыми ненулевыми значениями
