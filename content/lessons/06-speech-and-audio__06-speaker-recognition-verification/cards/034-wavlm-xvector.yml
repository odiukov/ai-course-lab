- concept: ограничения среды исполнения могут сделать компактный x-vector предпочтительнее более точной тяжёлой модели
  question: Система уже удовлетворяет требованиям по точности, но должна работать на маломощном CPU с жёстким ограничением памяти. Какую архитектуру разумнее выбрать?
  explanation: x-vector заметно уступает по EER, зато содержит всего 5 M параметров и достигает 400× RT. WavLM-SV large точнее, но его 316 M параметров и скорость 20× RT могут быть неприемлемы для CPU или edge-устройства.
  kind: choice
  options:
    - Компактный x-vector с TDNN и statistics pooling
    - WavLM-SV large
    - Ансамбль из нескольких WavLM-SV
    - Увеличенную SSL-модель без оптимизации инференса
  correct: 0
  id: 034-wavlm-xvector-1
  fingerprint: 929b412b
- concept: множитель реального времени показывает, во сколько раз обработка быстрее длительности записи
  question: Модель обрабатывает аудио со скоростью 28× RT. Сколько минут займёт обработка записи длительностью 196 минут?
  explanation: 'Время обработки равно длительности записи, делённой на множитель скорости: 196 / 28 = 7 минут. Аналогично, при 20× RT час аудио обрабатывается за 3 минуты.'
  kind: numeric
  answer: 7
  tolerance: 0.05
  id: 034-wavlm-xvector-2
  fingerprint: 1029163d
- concept: высокая вычислительная цена WavLM-SV связана с использованием большого предобученного SSL-backbone
  question: Почему WavLM-SV обычно тяжелее и медленнее классического x-vector, хотя обе модели выдают эмбеддинг говорящего?
  explanation: 'WavLM-SV large переносит в систему весь крупный WavLM-backbone: это даёт EER 0.42%, но требует 316 M параметров. У x-vector компактная TDNN со statistics pooling: 5 M параметров и более высокая скорость ценой EER 3.10%.'
  kind: open
  reference: WavLM-SV сохраняет большой предобученный на речи SSL-backbone и дообучает его для распознавания говорящих. Классический x-vector использует гораздо более компактную TDNN с statistics pooling, поэтому требует меньше памяти и вычислений.
  id: 034-wavlm-xvector-3
  fingerprint: 092e27ba
