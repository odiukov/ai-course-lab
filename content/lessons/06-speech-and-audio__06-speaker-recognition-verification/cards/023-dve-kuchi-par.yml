- concept: число уникальных пар записей одного диктора равно числу сочетаний из количества записей по две
  question: Для одного диктора собрано 6 записей. Сколько уникальных пар «свой-свой» можно составить, если не сравнивать запись с самой собой и не учитывать порядок записей в паре?
  explanation: Каждую запись нужно соединить со всеми остальными ровно один раз. Число неупорядоченных пар равно n(n − 1) / 2, поэтому для 6 записей получается 6 × 5 / 2 = 15.
  kind: numeric
  answer: 15
  tolerance: 0.01
  id: 023-dve-kuchi-par-2
  fingerprint: 1d026e09
