- concept: заявленная личность превращает распознавание говорящего в верификацию по одному эталону
  question: Клиент вводит логин, а затем произносит парольную фразу. Система сравнивает его голос только с голосовым эталоном владельца этого логина. Какую задачу решает система?
  explanation: Логин заранее задаёт предполагаемую личность, поэтому голос сравнивается с единственным эталоном. Это верификация, а не поиск человека по всей базе.
  kind: choice
  options:
    - Верификацию заявленной личности
    - Идентификацию среди всех клиентов
    - Классификацию содержания фразы
    - Кластеризацию неизвестных голосов
  correct: 0
  id: 003-check-zadachi-1
  fingerprint: 7f2bda85
- concept: идентификация в открытом множестве должна уметь отклонять незнакомый голос
  question: Расположите действия системы идентификации в открытом множестве в правильном порядке.
  explanation: Лучший кандидат из базы ещё не обязательно является правильным совпадением. Система должна проверить его сходство по порогу и отклонить запись, если даже лучший результат недостаточно убедителен.
  kind: order
  items:
    - Получить эмбеддинг входного голоса
    - Сравнить его с эмбеддингами зарегистрированных пользователей
    - Найти наиболее похожий эталон
    - Проверить, превышает ли лучшее сходство порог
    - Вернуть найденную личность или результат «неизвестный голос»
  id: 003-check-zadachi-2
  fingerprint: 3f763c11
- concept: множество сравнений увеличивает совокупный риск случайного совпадения
  question: Объясните своими словами, почему при поиске говорящего по большой базе обычно нужен более строгий порог, чем при проверке одной заявленной личности.
  explanation: При верификации оценивается один заявленный эталон, а при идентификации — множество кандидатов. Дополнительные сравнения создают дополнительные возможности для ложного совпадения, поэтому прежний порог становится слишком мягким.
  kind: open
  reference: При поиске по базе выполняется много сравнений, и каждое даёт отдельный шанс случайного ложного совпадения. Совокупный риск растёт, поэтому порог повышают, хотя это может увеличить число ложных отказов.
  id: 003-check-zadachi-3
  fingerprint: 6ec133a5
