- concept: шумный оценщик мешает атрибутировать улучшение конкретному изменению
  question: Агент правит статью и отправляет новую версию на рецензирование. Отзыв оказался теплее прежнего. Почему из этого нельзя заключить, что правка была улучшением?
  explanation: При шумном сигнале изменение оценки складывается из эффекта правки и случайного разброса оценщика. Если шум сравним с эффектом, различить их по одному измерению невозможно — нужны повторы или более строгий критерий. Именно поэтому агент с шумной обратной связью плохо учится, какое действие сработало.
  kind: choice
  options:
    - Потому что рецензенты не читают исправленные версии внимательно
    - 'Потому что оценка рецензентов шумна: разброс между рецензентами может объяснить разницу без всякого вклада правки'
    - Потому что улучшение текста никогда не влияет на оценку статьи
    - Потому что оценку статьи можно получить только после публикации
  correct: 1
  id: 002-evaluator-gap-1
  fingerprint: b40845b8
- concept: разница между строгим машинно-проверяемым оценщиком и человеческим суждением по нескольким несоизмеримым осям
  question: Чем оценка результата в AlphaEvolve или в ограниченном бенчмарком DGM принципиально отличается от оценки научной статьи рецензентами?
  explanation: 'Строгий оценщик повторяем: тот же вход даёт тот же вердикт, и метрика одна. Рецензирование взвешивает несколько осей, вес которых у разных людей разный — поэтому единого победителя между «аккуратной, но знакомой» и «неожиданной, но слабо доказанной» работой не существует.'
  kind: choice
  options:
    - Строгий оценщик выдаёт воспроизводимое число по заранее зафиксированному критерию, а рецензенты выносят суждение сразу по нескольким несоизмеримым осям — новизна, качество экспериментов, значимость
    - Строгий оценщик работает быстрее, но проверяет ровно то же самое, что и рецензенты
    - Рецензенты используют более точные метрики, чем автоматические бенчмарки
    - 'Разницы нет: и там и там результат сводится к одному числу'
  correct: 0
  id: 002-evaluator-gap-2
  fingerprint: 5bac407f
- concept: 'шумный оценщик — не сломанный, а имеющий большую погрешность: сигнал полезен, но требует извлечения'
  question: Почему шумную оценку рецензентов неправильно считать бесполезной, и что с ней приходится делать исследовательскому агенту?
  explanation: 'Ключевое различие: шум ≠ отсутствие сигнала. Повторяющиеся у разных рецензентов замечания несут больше информации, чем расхождения, — именно на них разумно опираться при выборе следующего действия.'
  kind: open
  reference: 'Шумный оценщик — не сломанный, а прибор с большой погрешностью: в среднем он указывает верное направление, просто отдельное измерение ненадёжно. Замечания рецензентов содержат информацию о слабых местах работы, но не дают готового предписания: «сравнение слабое» не говорит, с чем именно сравнивать. Агенту приходится извлекать направление из содержания и несовпадений отзывов, а не читать итоговый балл, и по возможности снижать шум — повторять эксперименты, собирать несколько независимых мнений, искать замечания, которые повторяются у разных рецензентов.'
  id: 002-evaluator-gap-3
  fingerprint: 9452d778
