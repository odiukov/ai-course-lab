- concept: чем шире поверхность выхода и слабее автоматическая проверка, тем большую долю контроля берут на себя операционные и человеческие меры
  question: Почему у системы, выпускающей исследовательские статьи (текст, код и графики) при слабом автоматическом оценщике, основную работу по безопасности выполняют операционные меры — песочница и обязательный ручной просмотр каждой подачи?
  explanation: Меры контроля распределяют по остаточному риску. Там, где строгий оценщик отсекает почти всё, ручное ревью избыточно; там, где оценщик слабый и разнородный, а артефакт публичный, ручное ревью и изоляция — единственный слой, который вообще срабатывает.
  kind: open
  reference: 'Три обстоятельства складываются. Автоматический оценщик самый слабый из доступных: он не подтверждает корректность эксперимента и не отсекает ложную новизну, поэтому дефект не останавливается автоматически. Поверхность выхода самая широкая: проверять надо не одно число, а текст, код и фигуры, у каждого свой набор дефектов и свой способ выглядеть убедительно. И путь до людей самый короткий: выход не остаётся в логах, а уходит читателям и рецензентам, где ошибку уже не откатишь повторным прогоном тестов. Когда автоматика не закрывает разрыв, его закрывают тем, что не зависит от оценщика: изоляцией исполнения и ручным решением человека до того, как материал покинет систему.'
