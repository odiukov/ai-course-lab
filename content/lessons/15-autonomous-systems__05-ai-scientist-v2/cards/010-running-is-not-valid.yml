- concept: пересечение обучающей и проверочной выборок делает метрику ответом на другой вопрос при полностью исправном коде
  question: Сравнение моделей завершилось без ошибок, все файлы на месте. Позже выяснилось, что из-за неверного пути обучение и проверка шли на одном и том же наборе примеров. Что означает полученная метрика?
  explanation: Формула посчитана правильно — именно поэтому изъян и незаметен. Но величина, посчитанная на примерах, которые модель уже видела при обучении, характеризует запоминание, а не способность работать на новых данных. Исследовательский вопрос был про обобщение, и ответа на него в этом числе нет.
  kind: choice
  options:
    - Метрика верна, но её надо интерпретировать с осторожностью
    - Метрика измеряет запоминание уже виденных примеров, а не обобщение — она отвечает не на тот исследовательский вопрос
    - Метрика занижена, поскольку модель переобучилась
    - 'Метрика корректна: код исполнился и посчитал её по формуле правильно'
  correct: 1
  id: 010-running-is-not-valid-1
  fingerprint: b8d38026
- concept: 'проверка перемешиванием меток: при разрушенной связи вход—ответ качество должно упасть до случайного уровня'
  question: 'Проверка на утечку: правильные ответы случайно перемешивают между примерами и переобучают модель на задаче классификации с 5 равными по размеру классами. Какую долю правильных ответов на отложенной выборке следует ожидать, если утечки нет?'
  explanation: 'Перемешивание меток разрушает связь между входом и ответом, поэтому выучить нечего и остаётся угадывание: 1/5 = 0.20. Если после перемешивания качество осталось высоким, модель берёт ответ откуда-то помимо входных признаков — почти наверняка ответ просочился в данные или в процедуру оценки.'
  kind: numeric
  answer: 0.2
  tolerance: 0.03
  id: 010-running-is-not-valid-2
  fingerprint: df6a75c3
- concept: сравнение методов требует равенства всех прочих условий, иначе измеряется различие условий, а не методов
  question: Новый метод обучали 40 эпох на полном корпусе, базовый — 10 эпох на его половине. Новый выиграл. Какой вывод допустим?
  explanation: Сравнение осмысленно, только когда варьируется ровно то, что проверяется. Здесь одновременно менялись метод, объём данных и бюджет обучения, и приписать выигрыш методу нельзя. Равенство данных, бюджета и числа наблюдений — такое же условие корректности, как и отсутствие утечки, и проверяется до принятия результата.
  kind: choice
  options:
    - Новый метод лучше базового — эксперимент это показал
    - 'Вывод о методах невозможен: различались бюджет обучения и объём данных, поэтому измерена разница условий, а не методов'
    - Вывод допустим, если разница в качестве больше разницы в бюджете
    - Вывод допустим, поскольку обе модели обучались на одном коде и без ошибок
  correct: 1
  id: 010-running-is-not-valid-3
