- concept: ошибка компенсирующего условия обнаруживается только тестом со смешанным исходом калиток
  question: Условие выпуска по ошибке написано как «пройдена хотя бы одна калитка». Какой тест выявит эту ошибку?
  explanation: 'На случаях «обе пройдены» и «обе провалены» конъюнкция и дизъюнкция дают одинаковый ответ, поэтому такие тесты проходят и при неверном условии. Различает их только смешанный случай, где ровно одна калитка открыта. Отсутствие обоих отчётов тоже не различает: ни одна проверка не пройдена, и оба варианта возвращают blocked.'
  kind: choice
  options:
    - 'Технический отчёт положительный, содержательный отрицательный (или наоборот): корректная функция даёт blocked, ошибочная — release'
    - 'Обе калитки положительные: ожидается release'
    - 'Обе калитки отрицательные: ожидается blocked'
    - 'Оба отчёта отсутствуют: ожидается blocked'
