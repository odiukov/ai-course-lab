- concept: информированность оценщика об условиях испытания — часть протокола результата, а не этическая приписка
  question: Команда сообщила программному комитету, что поданная работа сгенерирована AI-системой, и работу приняли. Почему факт раскрытия обязан быть указан рядом с результатом, а не опущен как несущественная деталь?
  explanation: Условия оценивания входят в описание результата наравне с методикой. Отсутствие этой строки делает результат неинтерпретируемым, а не более сильным.
  kind: open
  reference: 'Потому что вердикт интерпретируется только вместе с условиями, в которых он получен. Знание комитета меняет режим проверки: рецензенты могли быть осторожнее, задать иные вопросы или иначе взвесить вклад работы. Без указания раскрытия читатель не может понять, какое именно испытание прошло: «работу приняли, зная о происхождении» и «работу приняли, считая её обычной человеческой» — разные результаты, хотя фраза «принята» одна. Раскрытие — такой же элемент протокола, как то, какие данные видел оценщик.'
  id: 020-disclosure-1
  fingerprint: e4168efb
- concept: скрытое происхождение материала превращает оценщиков в невольных участников демонстрации и лишает вердикт доказательной силы
  question: Другая команда подала сгенерированную работу на рецензирование, не раскрыв её происхождение, получила принятие и опубликовала пресс-релиз «рецензенты одобрили нашу AI-систему». Какое возражение здесь основное?
  explanation: Вердикт отвечает на тот вопрос, который считали заданным оценщики. Они отвечали на «хороша ли эта работа», а пресс-релиз выдаёт ответ за «хороша ли AI-система» — плюс людей включили в демонстрацию без их ведома. Подача с раскрытием, как у авторов v2, снимает обе проблемы.
  kind: choice
  options:
    - Рецензенты оценивали работу, считая её обычной человеческой, поэтому их вердикт не является одобрением системы и получен без их согласия участвовать в такой проверке.
    - 'Возражений нет: раз качество достаточное для принятия, способ подачи не имеет значения.'
    - Возражение только в том, что сгенерированные работы вообще нельзя подавать на рецензирование ни при каких условиях.
  correct: 0
