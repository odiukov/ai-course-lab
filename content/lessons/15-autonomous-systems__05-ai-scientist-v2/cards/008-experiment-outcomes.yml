- concept: 'отрицательный результат — это успешный эксперимент: гипотеза не подтвердилась, но вывод получен'
  question: Новая модель набрала 61 балл против 74 у базовой. Запуск дошёл до конца, метрики и параметры сохранены, проверки корректности пройдены. Как классифицировать исход?
  explanation: '«Успех» эксперимента означает пригодный для интерпретации результат, а не победу проверяемой идеи. Отрицательный результат — полноценный вывод: 61 против 74 говорит, что гипотеза не подтвердилась. Смешивать «идея проиграла» с «эксперимент не удался» опасно: тогда система начнёт считать неудачей всё, что не подтверждает её гипотезу.'
  kind: choice
  options:
    - 'Падение эксперимента: результат хуже базовой линии, значит запуск неудачен'
    - 'Успех: получен пригодный для вывода результат, просто гипотеза не подтвердилась'
    - 'Скрытый изъян: слишком низкое число указывает на ошибку в коде'
    - Исход неопределён, пока новая модель не обгонит базовую
  correct: 1
  id: 008-experiment-outcomes-1
  fingerprint: 47c6317a
- concept: критерии валидности и проверки здравого смысла фиксируются до запуска, а не подбираются после того, как увидели число
  question: Почему набор проверок корректности (диапазон метрики, ненулевой объём данных, поведение контрольного примера) следует зафиксировать до запуска эксперимента?
  explanation: Проверки, придуманные после просмотра результата, оправдывают результат, а не проверяют его. Заранее объявленный набор свидетельств (все ожидаемые артефакты, разобранные технические ошибки, пройденные проверки здравого смысла) делает вывод «результат пригоден» решением о процедуре, а не о том, понравилось ли число.
  kind: choice
  options:
    - Чтобы сократить время исполнения кода в песочнице
    - 'Чтобы критерий нельзя было подогнать под уже полученное число: увидев 0.93, легко объявить проверку излишней, а увидев низкое значение — придумать новую'
    - Чтобы можно было отказаться от журналирования ошибок
    - Потому что после завершения запуска метрики уже недоступны для проверки
  correct: 1
  id: 008-experiment-outcomes-2
  fingerprint: 115df0e8
