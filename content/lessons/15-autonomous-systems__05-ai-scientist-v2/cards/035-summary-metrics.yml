  question: 2400 запусков цикла дали 600 поданных статей, из которых 84 содержат критический изъян эксперимента. Какова доля дефектных работ среди тех, что увидит читатель? Ответ в процентах.
  explanation: 84/600 = 14%. От всех запусков те же 84 дают 3,5% и создают впечатление малой проблемы. Но читателю не достаются отброшенные прогоны — его выборка это поданные статьи, поэтому знаменателем должно быть 600. Доля от запусков отвечает на другой вопрос — о пропускной способности цикла.
