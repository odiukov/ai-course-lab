- concept: результат проверки новизны должен нести обоснование (ближайшие работы, что совпало, чего не хватило), иначе решение невозможно перепроверить
  question: Функция проверки новизны возвращает метку «явного совпадения нет». Что ещё она обязана вернуть, чтобы человек мог перепроверить это решение, и почему одной метки мало?
  explanation: Метка — сжатие решения до одного слова, а вся информация о том, насколько шатко это решение, лежит в сравнении. Трассируемая выдача превращает шаг из непрозрачного штампа в материал для ревизии.
  kind: open
  reference: 'Кроме метки нужны: список ближайших найденных работ с их идентификаторами, разбор совпадений по осям (какая часть задачи/механизма/условий совпала, какая разошлась), и указание, каких данных не хватило (отсутствующий абстракт, обрезанная выдача, ошибка поиска). Одна метка непроверяема: по ней нельзя понять, сравнивались ли механизмы или только заголовки, и на каком материале сделан вывод. С обоснованием человек может не согласиться с конкретным сопоставлением и переоценить риск, не повторяя весь поиск заново.'
  id: 007-novelty-check-2
