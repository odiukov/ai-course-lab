- concept: верхняя оценка ущерба задаётся правами того юнита, под которым запущен процесс, и не зависит от поведения модели
  question: Агент запускают на рабочей машине от вашего пользователя. Как оценить максимальный возможный ущерб такого запуска и что в этой оценке изменится при запуске в контейнере без сети с одним смонтированным каталогом?
  explanation: Оценка риска строится по возможностям процесса, а не по намерениям модели. «Агент был послушный» — свойство одного запуска; «агенту недоступен сетевой стек» — свойство, которое держится при любом поведении модели, включая ошибочное и враждебное.
  kind: open
  reference: 'Верхняя оценка ущерба равна множеству действий, доступных процессу: все файлы, читаемые и записываемые вашим пользователем; все секреты, переданные процессу через окружение; любые исходящие соединения; запуск любых программ; траты облачных ресурсов под вашими учётными данными. Модель на эту границу не влияет — она определяет лишь, какая часть возможного будет задействована, а ошибка модели или код зависимости задействуют её без всякого умысла. В контейнере без сети и с единственным смонтированным каталогом верхняя оценка сжимается до содержимого этого каталога и выделенных ресурсов: исходящая передача невозможна, домашняя папка и ключи недостижимы, даже если код попытается. Отсюда правило: безопасность проектируют изменением прав, а не формулировкой инструкции.'
  id: 026-process-rights-2
  fingerprint: 02e5e22f
