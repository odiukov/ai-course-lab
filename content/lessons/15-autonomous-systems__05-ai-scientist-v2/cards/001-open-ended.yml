- concept: у исследовательского результата нет машинно-проверяемого критерия правильности, поэтому цикл трудно замкнуть
  question: Почему автономный цикл «идея — эксперимент — вывод» в научном исследовании замкнуть труднее, чем цикл оптимизации алгоритма?
  explanation: Задача с открытым концом не даёт целевой функции. У алгоритмического поиска есть точный оценщик (быстрее/короче/точнее), а научную работу оценивают по новизне, качеству экспериментов и значимости — это суждение, а не тест. Без надёжного оценщика агент не знает, какое из своих действий было улучшением.
  kind: choice
  options:
    - Научный код требует больше вычислительных ресурсов, чем оптимизация алгоритмов
    - 'У результата исследования нет машинно-проверяемого критерия правильности: качество работы определяет суждение рецензентов, а не автоматический тест'
    - Языковые модели не умеют писать код для научных экспериментов
    - Научные статьи слишком длинные, чтобы уместиться в контекст модели
  correct: 1
  id: 001-open-ended-1
  fingerprint: a3743c2d
- concept: ценность замыкания цикла именно в исследованиях — рекурсивное накопление прогресса
  question: Исследовательский цикл автоматизировать труднее всего из-за отсутствия строгой проверки. Почему тогда его вообще пытаются автоматизировать, а не сосредотачиваются на задачах со строгими оценщиками?
  explanation: 'Ключ — рекурсивность. Именно из-за неё цикл «тем ценнее, если его всё-таки замкнули». Но ценность приза не делает оценщик надёжнее: обе стороны — высокая цена и слабая проверка — существуют одновременно.'
  kind: open
  reference: 'Потому что исследование — это то место, где прогресс накапливается сам на себя. Результат одного исследования становится входом для следующего: новый метод позволяет ставить новые эксперименты, которые дают новые методы. Автоматизация задачи со строгим оценщиком ускоряет одну конкретную задачу; автоматизация исследования ускоряет производство самих способов ускоряться. Поэтому цена замыкания цикла здесь выше, чем сложность — это и оправдывает попытки, несмотря на слабость оценщика.'
  id: 001-open-ended-2
  fingerprint: 9587dddd
- concept: одно принятое на рецензирование событие не равно статистике надёжности системы
  question: 'Про исследовательскую систему известно: три сгенерированные ею статьи прошли peer review на воркшопах, и при этом в независимой проверке 38% её экспериментов падали с ошибками кода. Какой вывод корректен?'
  explanation: Единичный успех и распределение результатов измеряют разное. Стрелок, попавший в мишень несколько раз, не обязательно точен — важна доля попаданий во всех выстрелах. Держать оба вердикта в голове одновременно и есть корректная оценка такой системы.
  kind: choice
  options:
    - Данные противоречат друг другу, одна из проверок ошиблась
    - Проходы через peer review доказывают, что 38% падений не влияют на качество
    - 'Оба факта верны одновременно: успешные публикации — это отдельные события, а доля падений — статистика по многим прогонам, и из отдельных попаданий надёжность не следует'
    - 38% падений означают, что публикации получены нечестным путём
  correct: 2
  id: 001-open-ended-3
  fingerprint: 1de2419f
