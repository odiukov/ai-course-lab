- concept: полировка фигуры меняет только представление; данные, набор серий и смысл осей — инвариант, который правке недоступен
  question: Критик замечает, что на графике две линии почти сливаются и часть точек уходит за верхний край. Какая правка допустима при полировке фигуры?
  explanation: 'Полировка работает с представлением: размер, цвета, штрих, подписи, положение легенды, пределы и масштаб отображения. Удаление точек, усреднение серий или пересчёт метрики меняют утверждение, которое несёт график, — это уже не оформление, а подмена результата под желаемую картинку.'
  kind: choice
  options:
    - Убрать выбивающиеся точки, чтобы линии уместились в поле
    - Изменить палитру и тип штриха, расширить пределы осей и подвинуть легенду, оставив те же значения и те же серии
    - Пересчитать метрику по усечённой выборке и построить график заново
    - Объединить две близкие серии в одну усреднённую линию
  correct: 1
  id: 012-polish-figures-1
  fingerprint: 71f7099d
- concept: при сбое итерации сохраняется последняя корректная версия фигуры, а не результат неудачной правки
  question: На очередном раунде полировки редактор кода визуализации выдал неработающий скрипт и новый файл изображения не появился. Что должна сделать функция?
  explanation: 'Улучшение подачи не должно уметь портить уже имеющийся результат: худший допустимый исход раунда — фигура осталась прежней. Поэтому каждая успешно построенная версия становится новой «последней корректной», а неудачная итерация её не перезаписывает. Бесконечные повторы тоже исключены — число раундов ограничено.'
  kind: choice
  options:
    - Записать в результат отсутствующий путь — раунд ведь не удался
    - Оставить последнюю корректную версию фигуры, зафиксировать причину остановки и перейти к следующему графику
    - Повторять правку, пока редактор не выдаст работающий код
    - Удалить фигуру из выдачи, раз довести её до конца не получилось
  correct: 1
  id: 012-polish-figures-2
  fingerprint: 7efde768
- concept: журнал итераций отличает выполненную полировку от тихого сбоя, при котором на выходе тоже лежит валидный файл
  question: На выходе полировки лежат корректные файлы изображений. Почему по одним только путям к файлам нельзя понять, была ли полировка выполнена, и что должен содержать журнал итераций?
  explanation: 'Тихий сбой опасен именно правдоподобным выходом: артефакты на месте, статус зелёный, а работа не сделана. Журнал делает наблюдаемым сам процесс, а не только его конечный файл, — та же логика, что и с диагностикой попыток в исполнителе экспериментов.'
  kind: open
  reference: 'Корректный файл получается и тогда, когда ни одной правки не применилось: критик вернул пустой ответ, редактор сломался, файл не перезаписался — и в выдаче оказалась исходная версия. Пути к файлам этих случаев не различают. Журнал должен содержать по каждой фигуре: какие замечания пришли на каждом раунде, какие параметры оформления пытались изменить, чем закончился раунд (новая версия принята / правка не применилась / критик не дал замечаний), номер раунда остановки и причину остановки — исчерпан лимит, критик доволен или произошёл сбой.'
  id: 012-polish-figures-3
  fingerprint: f28f043f
