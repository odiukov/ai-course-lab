- concept: утверждение должно относиться к той же величине, которая измерялась; улучшение одной характеристики не доказывает улучшение другой
  question: 'Эксперимент показал: новый метод обрабатывает батч за 40 мс против 65 мс у базового. В выводе написано «новый метод даёт более качественные предсказания». Что не так?'
  explanation: 'Обратный путь от утверждения к данным сразу упирается в подмену величины: измеряли латентность, заявляют качество. Даже безупречно полученное число подтверждает только тот вопрос, на который оно отвечает.'
  kind: choice
  options:
    - Разница в 25 мс слишком мала, чтобы считаться улучшением
    - Измерялось время обработки, а вывод сделан о качестве предсказаний — результат отвечает на другой вопрос
    - 'Вывод корректен: ускорение обычно сопровождается ростом качества'
  correct: 1
  id: 014-claim-evaluator-1
  fingerprint: b121802d
- concept: область действия вывода не может быть шире набора условий, на которых получен результат
  question: 'Метод проверен на одном наборе данных для классификации отзывов и выиграл у базового. В статье написано: «метод превосходит базовый на задачах обработки текста». Как оценить это утверждение?'
  explanation: 'Результат не исчезает, но и не растягивается: он поддерживает вывод ровно на тех условиях, где получен. Слова «на задачах», «всегда», «на всех наборах» расширяют область действия за пределы предъявленного свидетельства.'
  kind: choice
  options:
    - 'Ослабить: результат поддерживает вывод только для проверенного набора и задачи, обобщение на класс задач не проверялось'
    - 'Принять: один аккуратный набор данных — стандартное свидетельство универсальности'
    - 'Отклонить полностью: единичный набор данных не даёт никакого свидетельства'
  correct: 0
  id: 014-claim-evaluator-2
  fingerprint: cc2bd1f0
- concept: надёжность превосходства определяется величиной разницы относительно разброса между повторными запусками
  question: Средняя точность метода A — 76,2, метода B — 76,0, но между повторными запусками каждый из них колеблется в пределах примерно 1,5 пункта. Объясни, почему вывод «A превосходит B» здесь не поддержан результатами.
  explanation: 'Число само по себе ничего не доказывает, пока не сопоставлено с тем, насколько оно шатается от запуска к запуску. Отчёт читают от утверждения назад к эксперименту: какая метрика, на каких данных, сколько повторов, какой разброс.'
  kind: open
  reference: 'Разница средних (0,2) заметно меньше разброса между повторами (~1,5), то есть перестановка A и B в лидерах — обычный исход следующего запуска. Малая средняя разница на фоне большого разброса означает, что наблюдаемое преимущество неотличимо от случайной вариации: чтобы утверждать превосходство, нужно либо показать разницу, превышающую разброс, либо оценить её статистически по многим повторам. Если A вышла вперёд в одном запуске и уступала в остальных, слово «превосходит» не поддержано вовсе.'
  id: 014-claim-evaluator-3
  fingerprint: f4560c30
