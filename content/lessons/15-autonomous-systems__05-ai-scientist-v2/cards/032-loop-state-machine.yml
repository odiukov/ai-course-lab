- concept: конечный автомат задаёт реакцию на исход каждого этапа, тогда как перечень этапов описывает только их состав
  question: 'Процесс описан двумя способами: (A) перечнем этапов, которые нужно пройти, (B) набором состояний с правилами переходов по исходу. Что именно способ B выражает, а способ A — нет?'
  explanation: Перечень отвечает на вопрос «какие этапы существуют», автомат — «что делать после каждого исхода». Только второе описание позволяет корректно учитывать прогон, где один этап посещён несколько раз, а другой не посещён ни разу.
  kind: choice
  options:
    - Стоимость каждого этапа в вычислениях
    - 'Куда попадает процесс при неуспешном исходе этапа: повторное посещение того же состояния, возврат назад или остановка'
    - Названия этапов и их количество
    - Вероятность отказа на каждом этапе
  correct: 1
  id: 032-loop-state-machine-1
  fingerprint: c0c7bbbf
- concept: стохастичность симуляции сидит в исходах попыток, а правила переходов остаются фиксированными
  question: 'Один и тот же симулятор исследовательского цикла запускают дважды и получают разные маршруты: в первом прогоне эксперимент прошёл сразу, во втором понадобилось два повторения. Что различалось между прогонами?'
  explanation: Спецификация автомата — состояния, переходы и терминальные исходы — фиксирована. Случайность разыгрывает результат конкретной попытки (отказ или успех), а маршрут получается как следствие. Поэтому разброс между прогонами не свидетельствует о нестабильности самой модели процесса.
  kind: choice
  options:
    - 'Правила переходов: автомат перестроил себя под новый прогон'
    - Исходы отдельных попыток, разыгранные случайно; правила, по которым исход переводит процесс в следующее состояние, те же
    - 'Набор состояний: во втором прогоне их стало больше'
    - 'Конечные исходы: во втором прогоне добавился новый терминальный исход'
  correct: 1
  id: 032-loop-state-machine-2
  fingerprint: d0eeff00
