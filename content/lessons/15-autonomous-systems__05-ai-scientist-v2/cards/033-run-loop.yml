- concept: исчерпание общего бюджета попыток — самостоятельный терминальный исход прогона, не зависящий от того, насколько далеко процесс успел продвинуться
  question: Цикл держит общий бюджет попыток, который тратит любой повтор на любом этапе. Бюджет закончился, когда до подачи оставался последний этап. Каким должен быть результат прогона?
  explanation: Бюджет — единственный механизм, гарантирующий остановку автомата с возвратами. Если «почти дошли» позволяет доиграть, лимит перестаёт быть лимитом, и статистика выхода начнёт завышаться.
  kind: choice
  options:
    - 'Подача засчитывается: оставался всего один этап'
    - Бюджет увеличивается автоматически, раз процесс близок к завершению
    - Прогон завершается без подачи — исчерпание бюджета является терминальным исходом независимо от достигнутого состояния
    - Прогон перезапускается с самого начала с полным бюджетом
