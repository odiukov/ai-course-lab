- concept: контракт возврата цикла должен различать чистую подачу и подачу со скрытым изъяном, иначе такое различие невосстановимо ниже по потоку
  question: Цикл возвращает только булев признак `submitted`. Позже понадобилось отдельно посчитать подачи, в которых остался критический изъян эксперимента, замаскированный аккуратным оформлением. Почему агрегатор не может вычислить это сам?
  explanation: 'Агрегатор видит только то, что цикл вернул. Информация о качестве возникает и умирает внутри прогона, если её не вынести наружу. Отсюда правило: возвращать и факт подачи, и метку скрытого изъяна, причём метка не должна сбрасываться успешными последующими этапами.'
  kind: choice
  options:
    - 'Может: достаточно повторно вызвать функцию рецензии на результате'
    - Признак изъяна известен только внутри прогона, в момент оценки эксперимента; если он не вошёл в возвращаемое значение, из финального `submitted` его уже не восстановить
    - 'Может: доля дефектных подач всегда равна вероятности отказа этапа эксперимента'
    - Не может, потому что булев тип нельзя агрегировать
