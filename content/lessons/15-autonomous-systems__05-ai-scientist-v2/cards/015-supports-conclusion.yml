- concept: направление заявленного изменения проверяется с учётом того, лучше ли большее или меньшее значение метрики
  question: В проверке утверждения нужно решить, улучшился ли результат относительно базовой линии. Для метрик вроде perplexity или ошибки лучше меньшее значение, для accuracy — большее. Заполни пропуск.
  explanation: Без флага направления функция объявит рост ошибки улучшением. Поэтому сторона сравнения берётся из описания метрики, а не зашивается как «больше — лучше».
  kind: cloze
  template: improved = (value < baseline) if ___ else (value > baseline)
  answer: lower_is_better
  accept:
    - lower_is_better
    - metric["lower_is_better"]
    - claim["lower_is_better"]
    - lower_better
  id: 015-supports-conclusion-1
  fingerprint: 0a1d187e
- concept: отсутствующее поле трактуется как невозможность подтвердить вывод, а не как подтверждение по умолчанию
  question: В `evidence` нет поля с использованной метрикой, всё остальное согласуется с утверждением. Что должна вернуть функция проверки вывода?
  explanation: Пропуск — это отсутствие свидетельства, а не свидетельство в пользу. Догадка о метрике по названию восстанавливает недостающие данные из воздуха и делает вердикт непроверяемым; строгий отказ с конкретной причиной честнее.
  kind: choice
  options:
    - '`True`, поскольку ни одно из имеющихся полей утверждению не противоречит'
    - '`True` с предупреждением, догадавшись о метрике по названию эксперимента'
    - '`False` и причину «метрика в результатах не указана»'
  correct: 2
  id: 015-supports-conclusion-2
  fingerprint: 75437e3d
- concept: результат должен сравниваться именно с той базовой линией, которая названа в выводе
  question: 'Утверждение: «метод превосходит стандартный трансформер». В результатах новый метод сравнивался с моделью на LSTM и выиграл. Верен ли вывод?'
  explanation: Адрес утверждения включает и того, с кем сравнивают. Победа над LSTM — свидетельство про LSTM; про трансформер не измерялось ничего, поэтому функция возвращает `False` с причиной о несовпадении базовой линии.
  kind: choice
  options:
    - 'Нет: сравнение проведено с другой базовой линией, поэтому названное превосходство не проверено'
    - 'Да: победа над более слабой архитектурой тем более доказывает превосходство над трансформером'
    - Да, если разница больше разброса между запусками
  correct: 0
  id: 015-supports-conclusion-3
  fingerprint: 2b99bc17
