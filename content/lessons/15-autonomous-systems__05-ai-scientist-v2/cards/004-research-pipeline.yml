- concept: порядок этапов сквозного цикла AI Scientist v2 от идеи до подачи
  question: Расставь этапы конвейера AI Scientist v2 в порядке прохождения работы.
  explanation: 'Порядок важен для понимания, куда попадает ранняя ошибка: неновая идея, пропущенная на втором этапе, дальше обрастает кодом, графиками и текстом — ни один следующий этап её не отлавливает.'
  kind: order
  items:
    - Генерация исследовательских идей по теме и предшествующей литературе
    - Проверка новизны поиском по литературе
    - Составление протокола эксперимента и написание кода
    - Исполнение кода в песочнице с возвратом падений в цикл повторов
    - Генерация и перерисовка графиков vision-language моделью
    - Написание статьи и правка в диалоге с внутренним рецензентом
    - Необязательная подача статьи на площадку
  id: 004-research-pipeline-1
  fingerprint: 4e8d9ee6
- concept: 'две локальные петли возврата в конвейере: вокруг исполнения кода и вокруг текста'
  question: В конвейере AI Scientist v2 есть две локальные петли повторов. Где именно?
  explanation: 'Конвейер не прямая линия, но и не полный цикл: возвраты локальные. Ошибка кода откатывает только исполнение, замечание рецензента — только текст. Ни одна петля не возвращает работу к выбору гипотезы.'
  kind: choice
  options:
    - Вокруг генерации идей и вокруг проверки новизны
    - Вокруг исполнения кода в песочнице (падения возвращаются агенту на исправление) и вокруг написания статьи (замечания внутреннего рецензента возвращаются на правку)
    - Вокруг проверки новизны и вокруг подачи статьи на площадку
    - Петля одна — общий возврат от подачи статьи к генерации идей
  correct: 1
  id: 004-research-pipeline-2
  fingerprint: dd244dd7
- concept: цикл повторов на исполнении ловит падения кода, но пропускает бессмысленный успешно выполнившийся эксперимент
  question: Экспериментальный код исполняется в песочнице, падения возвращаются агенту на исправление. Какой класс проблем эта петля принципиально не ловит?
  explanation: 'Песочница проверяет одно: программа завершилась или упала. Некорректное сравнение, неверная метрика, утечка тестовых данных в обучение — всё это исполняется успешно и проходит дальше с аккуратным графиком.'
  kind: choice
  options:
    - Синтаксические ошибки в коде эксперимента
    - Обращения к несуществующим полям и исключения во время выполнения
    - Эксперимент, который отработал без ошибок, но поставлен так, что не отвечает на исследовательский вопрос
    - Превышение лимита времени исполнения
  correct: 2
  id: 004-research-pipeline-3
  fingerprint: 3e548a58
