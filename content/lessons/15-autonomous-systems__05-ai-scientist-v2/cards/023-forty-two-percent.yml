- concept: доля упавших запусков измеряет операционную надёжность исполнения, а не долю ошибочных гипотез
  question: 'Внешняя проверка автономного исследовательского конвейера: из 200 запущенных экспериментов 74 остановились с ошибками кода — неверные импорты, несовпадение размерностей, обращения к неопределённым переменным. Что измеряет эта доля?'
  explanation: Упавший запуск не даёт результата вообще, поэтому он не может ни подтвердить, ни опровергнуть гипотезу. У Beel et al. таких падений было 42% — это отчёт о техническом исполнении между идеей и выводом, а не о качестве идей.
  kind: choice
  options:
    - Долю исследовательских гипотез, которые оказались неверными.
    - Долю запусков, не доведённых до измерения из-за технических сбоев, то есть надёжность исполнения цикла.
    - Долю экспериментов, результаты которых противоречат литературе.
  correct: 1
  id: 023-forty-two-percent-1
  fingerprint: 579f37a5
- concept: измеренная доля сбоев — оценка в условиях конкретной проверки, а не константа системы, переносимая на другие версии и задачи
  question: Во внешнем аудите конвейера доля падающих экспериментов составила 37%. Через полгода вышла новая версия системы и её применяют к другой предметной области. Как использовать это число?
  explanation: Число получено на конкретной версии и конкретном наборе задач, поэтому переносить его как прогноз нельзя. Ценность в том, что оно локализует место обрыва цикла; проверить, сохранился ли обрыв, можно только новым замером.
  kind: choice
  options:
    - 'Как ожидаемую долю падений новой версии на новых задачах: 37%.'
    - Как указание на слабое место — техническое исполнение экспериментов, — которое нужно измерить заново в новых условиях.
    - Как окончательно устаревшую информацию, из которой ничего извлечь нельзя.
  correct: 1
  id: 023-forty-two-percent-2
  fingerprint: 5cefb210
