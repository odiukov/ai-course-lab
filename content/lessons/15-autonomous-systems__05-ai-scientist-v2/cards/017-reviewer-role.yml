- concept: замечание о валидности снимается перепроверкой по данным, коду и протоколу; переформулировка текста снимает только замечания к тексту
  question: 'Внутренний рецензент пишет: «вывод о превосходстве метода может быть следствием утечки данных». Авторская модель переписывает абзац — добавляет оговорку и смягчает формулировку — после чего рецензент снимает замечание. Объясни своими словами, почему проблема при этом может остаться неустранённой.'
  explanation: Разница между «замечание снято» и «проблема устранена» задаётся тем, к чему относилось замечание. Текстовое (непонятная подпись, спрятанное ограничение) чинится правкой текста. Содержательное — только внешней проверкой источника результата.
  kind: open
  reference: 'Замечание касалось не текста, а процедуры получения результата. Утечка либо есть в данных и коде, либо её нет; правка абзаца не меняет разбиение выборок и не меняет число в таблице. Снять такое замечание можно только отдельной проверкой источника: как формировались выборки, есть ли пересечение, воспроизводится ли результат на честном разбиении. Согласие рецензента с переписанным текстом означает лишь, что спор внутри одного контура закончился: обе роли работают с материалом, подготовленным системой, и разделяют её исходные решения. Замечание — это сигнал, куда смотреть; подтверждением служит проверка по данным, коду и протоколу.'
  id: 017-reviewer-role-2
  fingerprint: 422ed0e2
