- concept: 'достоверность проверяется раньше читаемости: качество оформления учитывается последним и не заменяет проверку'
  question: Расставь шаги оценки исследовательского отчёта в порядке, при котором качество оформления не подменяет проверку.
  explanation: 'Полировка повышает читаемость, но не повышает достоверность. Если ясность оформления учитывать первой, она начинает работать как быстрый заменитель проверки: «выглядит как статья — значит зрело». Поэтому слой оформления оценивается только после того, как подтверждено, что за графиком стоит реально проведённое измерение.'
  kind: order
  items:
    - Убедиться, что заявленный эксперимент действительно был запущен и завершился, а не заменён сохранённым или заглушечным значением
    - Проверить, что данные и измерения получены корректно (метрика, выборки, условия запуска)
    - 'Оценить ясность визуализации: читаемость осей, легенды, показанный разброс'
  id: 013-polish-masking-2
  fingerprint: 9d93447c
