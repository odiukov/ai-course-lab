- concept: 'ворота исполнения упорядочены по возрастанию стоимости: статическая проверка, прогон на минимальных данных, полный запуск'
  question: Расставь этапы запуска дорогого эксперимента так, чтобы самый дешёвый отсев шёл первым.
  explanation: Сначала отсекается то, что стоит секунды, потом то, что стоит минуты, и только затем расходуется дорогой ресурс. Ошибки уровня «неверный импорт» из внешнего аудита (42% падений) ловятся первыми двумя воротами.
  kind: order
  items:
    - 'Статическая проверка кода линтером: импорты, опечатки, неопределённые переменные'
    - Прогон того же эксперимента на минимальном подмножестве данных от загрузки до записи результата
    - Полный запуск на всём объёме данных с выделенными вычислительными ресурсами
    - Разбор полученных чисел и проверка выводов на валидность
  id: 024-cheap-preflight-1
  fingerprint: b5c416b5
- concept: часть дефектов проявляется только при исполнении с реальными данными, поэтому статическая проверка не заменяет пробный прогон
  question: Линтер прошёл по коду эксперимента без замечаний. Почему перед полным запуском всё равно нужен прогон на крошечном подмножестве данных?
  explanation: 'Статический анализ и исполнение покрывают разные классы дефектов: несовпадение форм, пустой батч, сломанный путь к данным появляются только в рантайме. Гипотезу пробный прогон не проверяет — он отвечает лишь на вопрос «может ли это вообще выполниться».'
  kind: choice
  options:
    - Линтер видит только текст программы и не проверяет, совпадут ли фактические размерности тензоров и пройдут ли данные весь путь от загрузки до результата.
    - Пробный прогон нужен, чтобы оценить, верна ли исследовательская гипотеза, до траты ресурсов.
    - Прогон на малых данных заменяет линтер, поэтому порядок неважен.
  correct: 0
  id: 024-cheap-preflight-2
  fingerprint: f25bf58e
- concept: 'цена дефекта определяется моментом его обнаружения: поздний отказ сжигает уже потраченный ресурс'
  question: Планируется 20 экспериментов, каждый полный запуск занимает 6 GPU-часов. Без предварительных проверок 30% запусков падают на тривиальной ошибке кода в среднем через 3 часа после старта. Сколько GPU-часов сгорает впустую?
  explanation: 20 × 0.30 × 3 = 18 GPU-часов. Та же ошибка, пойманная линтером или прогоном на десятке примеров, стоила бы минуты. Ошибка не меняется — меняется момент, когда ей разрешили проявиться.
  kind: numeric
  answer: 18
  tolerance: 0.1
  id: 024-cheap-preflight-3
  fingerprint: f391b5b1
