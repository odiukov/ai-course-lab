- concept: нулевая доля — содержательное утверждение об отсутствии дефектов, поэтому подставлять её вместо неопределённой величины значит фальсифицировать отчёт
  question: 'В режиме без повторов ни одна работа не дошла до выпуска. Отчёт печатает «доля дефектных среди выпущенных: 0%». Почему это хуже, чем «не определено»?'
  explanation: 'Отсутствие наблюдений и наблюдение нуля дефектов — разные состояния знания. Подстановка нуля превращает пустой знаменатель в утверждение о качестве и ломает ранжирование режимов: режим, не выпустивший ничего, оказывается в топе по надёжности.'
  kind: choice
  options:
    - 'Ничем не хуже: при нуле выпущенных дефектных работ действительно нет'
    - 0% читается как измеренное свойство режима — будто он даёт безупречный выход, — тогда как измерения не было вовсе; при сравнении режимов такой режим ложно выглядит лучшим
    - Хуже только тем, что 0% нельзя отобразить в процентах
    - Хуже, потому что доля должна считаться от числа запусков, а не от числа выпущенных
