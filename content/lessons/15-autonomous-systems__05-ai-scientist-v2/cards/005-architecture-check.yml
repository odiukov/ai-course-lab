- concept: в конвейере проверка стоит только на двух этапах из семи, остальные проверяет та же LLM или никто
  question: На скольких этапах семишагового конвейера AI Scientist v2 вообще есть проверка результата, и что происходит на остальных?
  explanation: Проверка новизны регулярно ошибается, исполнение ловит только падения. Генерация идей, план эксперимента, графики и текст не имеют внешнего фильтра — их судит та же модель, что их и произвела.
  kind: choice
  options:
    - На всех семи — каждый этап валидируется перед передачей дальше
    - Только на двух — проверке новизны и исполнении кода; остальные пять оценивает внутренний рецензент (та же LLM) либо никто
    - Только на последнем — подача статьи на площадку и есть проверка
    - На пяти из семи, кроме генерации идей и подачи статьи
  correct: 1
  id: 005-architecture-check-1
  fingerprint: 234e0368
- concept: внутренний рецензент на той же LLM не даёт независимости и не ловит ошибку, унаследованную от предыдущего этапа
  question: Почему внутренний рецензент, реализованный на той же языковой модели, что писала статью, слабо помогает поймать ошибку, допущенную ещё на этапе выбора гипотезы?
  explanation: 'Независимость проверки — не формальность, а её источник силы. Совпадение источника автора и критика делает ошибку систематической: она не отфильтровывается, а получает подтверждение. Ранняя ошибка выходит из конвейера с графиком и аккуратным текстом.'
  kind: choice
  options:
    - Потому что рецензенту недоступен полный текст статьи
    - 'Потому что он не является независимым фильтром: разделяет предпосылки и слепые пятна автора, и слабое место, невидимое при написании, останется невидимым при проверке'
    - Потому что языковые модели не умеют критиковать текст
    - Потому что он проверяет только оформление и грамматику
  correct: 1
  id: 005-architecture-check-2
  fingerprint: 39f145e9
- concept: успешное прохождение этапа конвейера не является свидетельством качества исследования
  question: 'Работа прошла все семь этапов конвейера без единого отката: код не падал, проверка новизны дала зелёный свет, рецензент замечаний не оставил. Что это доказывает про качество исследования?'
  explanation: 'Типичная ловушка: чистый прогон читают как подтверждение. Но фильтр может молчать и потому, что ошибки нет, и потому, что он её не видит — а при двух слабых проверках на семь этапов второе куда вероятнее.'
  kind: open
  reference: 'Почти ничего. Каждый этап подтверждает лишь выполнимость своей операции, а не осмысленность результата: исполнение говорит «программа не упала», проверка новизны — «автоматический поиск не нашёл совпадения», внутренний рецензент — «модель не увидела возражений против собственного текста». Ни одно из этих утверждений не касается того, отвечает ли эксперимент на поставленный вопрос и значим ли вывод. Отсутствие откатов означает отсутствие сработавших фильтров, а не отсутствие ошибок — тем более что фильтров всего два и оба слабые.'
  id: 005-architecture-check-3
  fingerprint: '96434961'
