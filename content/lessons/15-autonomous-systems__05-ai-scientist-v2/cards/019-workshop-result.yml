- concept: решение рецензентов относится к конкретной поданной работе, а не сертифицирует породивший её процесс
  question: Лаборатория прогнала автоматический конвейер и получила 30 черновиков статей. Один из них подали на воркшоп и приняли. Что именно подтверждает решение рецензентов?
  explanation: Рецензенты читают присланный текст, а не устройство генератора. Вывод распространяется на одну работу и одну процедуру отбора; про свойства процесса он не говорит ничего — для этого нужны исходы по всем поданным работам.
  kind: choice
  options:
    - Что конвейер, породивший черновик, соответствует научным стандартам площадки.
    - Что поданная работа преодолела порог отбора этой площадки при данном составе рецензентов.
    - Что остальные 29 черновиков тоже прошли бы отбор, раз они получены тем же способом.
  correct: 1
  id: 019-workshop-result-1
  fingerprint: e66fb632
- concept: порог воркшопа ниже порога основной конференции, поэтому результат нельзя переносить на более строгую площадку
  question: 'Автоматически сгенерированную работу приняли на воркшоп при конференции. Автор пишет в отчёте: «работа соответствует уровню основной программы конференции». Что не так с этим утверждением?'
  explanation: Площадки различаются высотой планки. Прохождение низкого порога совместимо и с прохождением высокого, и с непрохождением, поэтому оно не различает эти случаи. Заявление об уровне основной программы требует подачи на основную программу.
  kind: choice
  options:
    - 'Ничего: воркшоп и основная программа применяют один и тот же критерий отбора.'
    - Воркшоп обычно отбирает по более низкому порогу, поэтому прохождение его отбора не свидетельствует о прохождении более строгого.
    - 'Утверждение слишком слабое: принятие на воркшоп сильнее принятия на основную программу.'
  correct: 1
  id: 019-workshop-result-2
  fingerprint: c9f70229
- concept: публикация о системе в соавторстве с людьми не является результатом, произведённым системой
  question: 'В журнале высокого уровня вышла статья, документирующая сквозной автоматический исследовательский цикл; среди авторов — люди-исследователи, разработавшие систему. Читатель делает вывод: «система опубликовалась в этом журнале». Объясни, что здесь подменено.'
  explanation: 'Типовая ошибка чтения новостей: престиж площадки, где описан инструмент, переносится на результаты инструмента. Спрашивай, что именно рецензировали — систему-как-предмет-описания или её выход.'
  kind: open
  reference: 'Подменён объект публикации. Статья описывает систему и написана людьми-соавторами: рецензировали и приняли текст, произведённый людьми о своей разработке. Результат самой системы — это работы, которые она порождает и которые проходят отбор отдельно (в случае AI Scientist v2 — одна статья на воркшопе ICLR 2025). Статус журнала, где опубликовано описание системы, ничего не говорит о качестве продукции самой системы: это два разных объекта оценки.'
  id: 019-workshop-result-3
  fingerprint: 40c3f19c
