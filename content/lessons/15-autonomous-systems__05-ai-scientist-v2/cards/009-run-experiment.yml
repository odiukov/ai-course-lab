- concept: верхняя граница числа запусков задаётся лимитом попыток, а успех прерывает цикл досрочно
  question: Диспетчер исполнения эксперимента настроен на лимит 5 попыток. Первые три запуска падают с исправимой технической ошибкой, четвёртый завершается успешно и возвращает метрику. Сколько раз всего был запущен эксперимент?
  explanation: 'Лимит задаёт только верхнюю границу: запусков не больше 5. Успех останавливает повторы немедленно, поэтому пятый запуск не выполняется. Итого 4 запуска. Если бы успеха не случилось, цикл остановился бы ровно на пятой попытке, а не крутился бесконечно.'
  kind: numeric
  answer: 4
  tolerance: 0.5
  id: 009-run-experiment-1
  fingerprint: 5cf46e32
- concept: повтор помогает только при недетерминированных или устранимых сбоях, а при детерминированной ошибке кода тратит бюджет впустую
  question: Этап исполнения эксперимента оборачивает запуск в цикл повторов. В каком случае повтор без изменения кода и окружения даёт реальный шанс на другой исход?
  explanation: 'Таймаут — сбой недетерминированный: повтор той же команды может пройти. Остальные три — детерминированные дефекты: при неизменённом коде и конфигурации каждая новая попытка воспроизведёт ровно тот же отказ и просто сожжёт бюджет попыток. Поэтому повтор осмыслен только вместе с классификацией ошибки на исправимую и неисправимую; неисправимая должна завершать цикл сразу.'
  kind: choice
  options:
    - Скрипт падает на делении на ноль в функции подсчёта метрики при тех же входных данных
    - Запрос к внешнему сервису данных оборвался по таймауту
    - В коде опечатка в имени переменной, и запуск падает с NameError
    - Конфигурация ссылается на несуществующее имя модели
