- concept: результат исполнения должен нести историю попыток и текст последней ошибки, иначе итоговое число невозможно интерпретировать
  question: Функция исполнения эксперимента могла бы возвращать только метрику при успехе и None при провале. Объясни своими словами, что теряет вызывающий код при такой сигнатуре и какие поля нужно вернуть вместо этого.
  explanation: Смысл этапа исполнения — не вынести научный вердикт, а точно зафиксировать факт запуска и помеху. Статус отделяет провал от пустоты, счётчик попыток и текст ошибки дают происхождение результата. Без них любое расследование упирается в угадывание по пустому значению.
  kind: open
  reference: 'При «метрика или None» вызывающий код видит голое число без происхождения: непонятно, получено оно с первой попытки или после серии падений, и непонятно, почему был провал — кончился лимит попыток, случился неисправимый сбой или эксперимент вообще не стартовал. None схлопывает разные причины в одно значение, и восстановить причину можно только вручную по консоли, если логи ещё живы. Возвращать нужно структуру: статус (успех, окончательное падение, результат под дальнейшую проверку), метрики, текст последней ошибки и число выполненных попыток. Тогда провал отличается от отсутствия данных, а число попыток показывает, насколько нестабильно исполнение — метрика, полученная с седьмой попытки, требует иного доверия, чем полученная сразу.'
