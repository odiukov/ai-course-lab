- concept: ошибка в опубликованном результате размножается через производные работы, тогда как ошибка, остановленная внутри процесса, остаётся локальной
  question: Объясни своими словами, почему дефектный вывод, попавший к читателям, наносит ущерб иного рода, чем такой же дефектный вывод, остановленный внутренним тестом.
  explanation: Ключевое различие — не тяжесть ошибки, а обратимость и распространение. Внутренний дефект останавливается на месте, публичный порождает производные утверждения, которые переживают исправление оригинала.
  kind: open
  reference: 'Дефект, пойманный внутри процесса, локален: он портит один прогон, его чинят и переделывают, круг затронутых артефактов ограничен. Опубликованный дефект становится входом для чужой работы: его цитируют, на нём строят следующие эксперименты, из него выводят объяснения. Ущерб растёт со временем и распределяется по работам, которые сами по себе исправны. Отзыв исходной публикации не отменяет производные от неё выводы. Поэтому одинаковая по природе ошибка при публичном выходе требует большего числа независимых проверок до выпуска.'
