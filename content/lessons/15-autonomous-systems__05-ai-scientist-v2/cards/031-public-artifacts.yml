- concept: риск для аудитории определяется произведением коэффициентов пропуска всех проверок на пути к ней, а не точностью одного оценщика
  question: На вход поступает 200 работ с критическим изъяном. Рецензент пропускает дефектную работу с вероятностью 0.4. После него стоит независимая проверка, которая отлавливает 75% дошедших до неё дефектных работ. Сколько дефектных работ дойдёт до читателей?
  explanation: '200 × 0.4 = 80 проходят рецензента, из них отсеивается 75%, остаётся 80 × 0.25 = 20. Риск для аудитории задаёт произведение коэффициентов пропуска по всей цепочке: добавление одной независимой проверки снизило поток дефектов вчетверо, хотя сам рецензент не стал точнее.'
  kind: numeric
  answer: 20
