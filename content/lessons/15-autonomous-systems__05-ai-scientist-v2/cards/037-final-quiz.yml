- concept: масштабирование человеческого ревью строится вокруг дефицитного ресурса — времени эксперта — через триаж по риску и выборочный глубокий аудит вместо равномерного полного чтения
  question: Агент выпускает сотни работ, а полное чтение каждой экспертом не масштабируется. Объясни своими словами, вокруг какого узкого места проектируют протокол ревью и как его разгружают.
  explanation: 'Ошибочный ход — линейно наращивать рецензентов: поток агента растёт дешевле, чем нанимаются люди. Правильный — сделать человека последней инстанцией по неавтоматизируемым суждениям (обоснованность вывода, новизна) и измерять качество самого протокола выборочным аудитом.'
  kind: open
  reference: 'Узкое место — часы квалифицированного человека, а не пропускная способность агента. Протокол строят так, чтобы дорогое человеческое внимание тратилось только там, где оно незаменимо. Дешёвые машинные проверки (исполнение кода, воспроизведение чисел, проверки здравого смысла, поиск совпадений по литературе) прогоняются на всём потоке и дают триаж: работы сортируются по риску и по тому, какие утверждения остались неподтверждёнными. Дальше эксперт читает не статью целиком, а конкретное утверждение с приложенным свидетельством, отвечая на узкий вопрос. Плюс выборочный глубокий аудит случайной доли выпущенных работ — он оценивает коэффициент пропуска всей цепочки и не даёт автоматике тихо деградировать. Метрика протокола — не число прочитанных статей, а доля дефектов, дошедших до аудитории.'
