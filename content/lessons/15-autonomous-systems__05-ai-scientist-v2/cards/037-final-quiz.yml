- concept: оценщик, закрывающий разрыв между качеством подачи и качеством эксперимента, должен измерять признак, который полировка текста и графиков улучшить не может
  question: Нужно добавить оценщик, отсеивающий работы с убедительным оформлением, но негодным экспериментом. Какой сигнал для него пригоден?
  explanation: 'Проблема ровно в том, что подача и валидность разъехались. Оценщик, питающийся признаками подачи (тон, ссылки, оформление), унаследует тот же сигнал, что и полировка, и пропустит изъян. Работает только независимая ось: воспроизведение чисел из артефактов, проверка на перемешанных метках, контроль пересечения выборок — то, что нельзя поднять редактированием текста.'
  kind: choice
  options:
    - Оценка связности и academic tone текста той же моделью, что писала статью
    - Повторный прогон приложенного кода на объявленных данных и сверка полученных чисел с таблицами статьи
    - Число ссылок на литературу и полнота библиографии
    - Средняя оценка читаемости и качества оформления фигур
