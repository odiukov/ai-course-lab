- concept: систематическое смещение не проявляется в разбросе между повторами, поэтому нулевой разброс не свидетельствует о валидности измерения
  question: Почему нулевой разброс между повторными запусками не исключает систематической ошибки в эксперименте? Приведи механизм.
  explanation: Повтор — инструмент против шума, а не против смещения. Увеличение количества запусков сужает доверительный интервал вокруг смещённого значения, но не сдвигает его к правильному.
  kind: open
  reference: 'Разброс показывает только случайную составляющую: насколько результат гуляет от запуска к запуску. Систематическое смещение входит в каждый запуск одинаково и потому в разбросе не видно вообще. Пример: тестовая выборка частично попала в обучающую — все семь запусков стабильно дадут завышенное число; или метрика считается по неверной формуле — она стабильно неверна. Чтобы поймать такое, нужны проверки другого рода: перепроверка состава выборок, контроль метрики, сравнение при разрушенной связи вход—ответ, а не увеличение числа повторов.'
  id: 016-claim-check-2
  fingerprint: 61a2e303
