- concept: изоляция файлов и сети не ограничивает потребление — запуску нужны отдельные пределы времени, памяти, диска, GPU и денег
  question: Агент работает в контейнере без сети, с одним каталогом на запись и без переданных ему секретов. Какой вид ущерба такая конфигурация всё ещё не исключает?
  explanation: Файловая и сетевая изоляция ограничивают, до чего процесс дотягивается, но не то, сколько он потребляет. Бесконечный цикл обучения, разрастание временных файлов или удержание всех GPU остаются полностью «законными» действиями внутри песочницы, поэтому квоты на время, память, диск, ускорители и стоимость — отдельный слой ограничений.
  kind: choice
  options:
    - 'Исчерпание вычислительных ресурсов и бюджета: без пределов по времени, памяти, диску и числу GPU запуск способен занять машину или сжечь оплаченные вычисления'
    - Утечку ключей из переменных окружения процесса
    - Перезапись файлов домашней папки пользователя
    - Отправку содержимого рабочего каталога на внешний сервер
  correct: 0
  id: 027-isolation-layers-2
  fingerprint: 520d3c9d
- concept: порождение процессов ограничивают квотой на дочерние задачи и принудительным завершением всего дерева процессов после запуска
  question: Эксперимент завершился, артефакты собраны, контейнер отдал результат — но машина осталась загружена, а нагрузка не спадает. Какой меры изоляции не хватало?
  explanation: 'Завершение главного скрипта не завершает порождённых им детей: осиротевшие процессы продолжают жить и держать ресурсы. Поэтому ограничивают и число порождаемых задач, и завершают дерево процессов целиком, а не только тот процесс, который был запущен явно.'
  kind: choice
  options:
    - Предела на число дочерних процессов и принудительного завершения всего дерева процессов запуска по его окончании
    - Монтирования датасета в режиме только для чтения
    - Отдельного временного каталога, доступного на запись
    - Фильтрации допустимых исходящих соединений
  correct: 0
