- concept: 'неустановимое из материала не записывается ни в подтверждение, ни в дефект: корректный результат — «не удаётся проверить» с указанием недостающего свидетельства'
  question: Из черновика невозможно понять, подбирались ли гиперпараметры на отложенной части обучающих данных или на тестовой выборке. Что должен записать внутренний рецензент и чего делать не должен?
  explanation: 'Оба искажения одинаково вредны: выдуманная деталь превращает рецензию в источник ложных фактов, а «недоказуемое = дефект» заваливает авторов замечаниями, которые нечем закрыть. Корректный выход — назвать пробел и то, чем он закрывается.'
  kind: open
  reference: 'Записать: «не удаётся проверить» — с указанием, какого именно свидетельства не хватает (описания протокола подбора гиперпараметров, разделения выборок, порядка использования тестовой части) и что именно его предоставит. Не должен: придумывать отсутствующие числа или детали протокола; объявлять утечку установленным дефектом только потому, что она не исключена; и одновременно — считать умолчание подтверждением корректности. Отсутствие свидетельства не является ни доказательством нарушения, ни доказательством его отсутствия; это запрос на конкретный недостающий фрагмент.'
  id: 018-review-3
  fingerprint: 02a110d6
