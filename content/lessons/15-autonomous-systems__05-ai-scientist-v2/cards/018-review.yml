- concept: замечание полезно, когда привязано к конкретному утверждению и называет проверку, снимающую его
  question: Какое замечание рецензента даёт авторам работы понятное следующее действие?
  explanation: Полезное замечание указывает утверждение, к которому относится, и проверку, которая его снимет или подтвердит. «Мало экспериментов» и «недостаточно ясно» не называют ни того, ни другого, а «слишком хорошие результаты» — впечатление без проверяемого следствия. Третий вариант связывает конкретный вывод с конкретной недостающей процедурой.
  kind: choice
  options:
    - Экспериментов мало, нужно больше
    - Статья написана недостаточно ясно и требует доработки
    - 'Вывод о превосходстве опирается на один запуск, разброс между запусками не измерен: нужно 5 запусков с разными зёрнами и сравнение разницы с разбросом'
    - Результаты выглядят слишком хорошими для такой простой модели
  correct: 2
