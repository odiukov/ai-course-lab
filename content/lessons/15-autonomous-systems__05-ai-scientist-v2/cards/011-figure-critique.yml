- concept: часть дефектов графика существует только в отрендеренном изображении и принципиально не видна в коде построения
  question: Почему для критики научного графика недостаточно показать языковой модели код его построения?
  explanation: Код описывает намерение, изображение — результат. Легенда, честно добавленная одной строкой, может закрыть линию; заданные корректные подписи могут налезть друг на друга при конкретном размере холста. Эти свойства появляются лишь при рендере, поэтому обратная связь должна сниматься с картинки, а даёт её модель, воспринимающая изображение и текст сразу.
  kind: choice
  options:
    - Код построения обычно слишком длинный для контекстного окна
    - Наложение подписей, слияние близких цветов, обрезанные края и потеря ключевого различия из-за масштаба возникают при отрисовке и в коде отсутствуют — там подписи и цвета заданы корректно
    - Языковая модель не умеет читать код визуализации
    - Код не содержит числовых данных, поэтому по нему нельзя судить о результате
  correct: 1
  id: 011-figure-critique-1
  fingerprint: e74d0afd
- concept: 'цикл улучшения фигуры: рендер, критика по изображению, правка кода визуализации, повторный рендер и повторная проверка'
  question: Расставь шаги цикла улучшения научного графика с участием модели, воспринимающей изображения.
  explanation: 'Ключевое в цикле — замыкание: правка оценивается не по намерению, а по новой отрисовке. Без повторного показа изображения нельзя узнать, не породила ли правка новую проблему (например, увеличенный шрифт вылез за поле).'
  kind: order
  items:
    - Построить график по имеющимся данным и получить изображение
    - Показать изображение модели и собрать конкретные замечания к читаемости
    - Передать замечания в правку кода визуализации
    - Перестроить график и получить новую версию изображения
    - Снова показать новую версию на проверку и решить, останавливаться ли
  id: 011-figure-critique-2
  fingerprint: ec003692
- concept: визуальная обратная связь по фигурам — техническое добавление второй версии AI Scientist поверх сквозного конвейера первой
  question: Что было главным техническим добавлением AI Scientist v2 по сравнению с первой версией?
  explanation: Исполнение в песочнице, внутренний рецензент и подача были и раньше; отличие v2 — отказ от шаблонов в пользу агентного поиска по пространству гипотез и модель, оценивающая уже отрисованные фигуры. Показательно, что добавление касалось подачи результата, а не проверки его содержательной корректности.
  kind: choice
  options:
    - Замена шаблонов генерации идей на агентный поиск и добавление модели, которая смотрит на построенные графики и перерисовывает их
    - Автоматическая подача статьи на площадку рецензирования
    - Песочница для исполнения кода экспериментов
    - Внутренний рецензент, правящий черновик статьи
  correct: 0
  id: 011-figure-critique-3
  fingerprint: 72cc0016
