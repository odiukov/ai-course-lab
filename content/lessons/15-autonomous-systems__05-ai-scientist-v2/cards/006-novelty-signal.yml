- concept: пустая выдача поиска по литературе — утверждение о поиске, а не доказательство новизны идеи
  question: Автоматический поиск по литературе не нашёл работ, похожих на предложенную идею. Что строго следует из этого результата?
  explanation: 'Отрицательный результат поиска ограничен двумя способами: охватом (до какой части литературы поиск добрался) и распознаванием (сумел ли он опознать тот же метод под другими терминами). Оба ограничения оставляют место для известного предшественника. Именно на этом этапе AI Scientist v2 регулярно принимал известные методы за новые.'
  kind: choice
  options:
    - Идея новая и ранее не публиковалась
    - Только то, что в просмотренной части литературы не нашлось совпадения, которое система сумела распознать
    - Идея заведомо не новая, раз поиск ничего не подтвердил
    - Идею уже пробовали, но результаты оказались отрицательными и не опубликованы
  correct: 1
  id: 006-novelty-signal-1
  fingerprint: c70e1b4f
- concept: 'асимметрия информативности: найденное совпадение доказательнее, чем отсутствие совпадений'
  question: Какой из двух исходов проверки новизны несёт более сильный вывод и почему?
  explanation: 'Асимметрия та же, что между опровержением и подтверждением: одна найденная работа опровергает новизну окончательно, а ненайденность зависит от того, где и как искали. Поэтому положительная находка — вердикт, а пустая выдача — только повод искать дальше другими запросами.'
  kind: choice
  options:
    - 'Оба исхода равносильны: система выдаёт бинарный вердикт «ново / не ново»'
    - 'Найденная почти идентичная работа: она напрямую показывает предшественника, тогда как отсутствие совпадений ограничено охватом и распознаванием поиска'
    - 'Отсутствие совпадений: оно охватывает всю литературу целиком'
    - Отсутствие совпадений, поскольку оно основано на большем числе просмотренных статей
  correct: 1
  id: 006-novelty-signal-2
  fingerprint: a4b5777c
- concept: результат проверки новизны следует трактовать как сигнал для направления внимания, а не как вердикт-галочку
  question: Как правильно использовать результат автоматической проверки новизны при построении исследовательского цикла?
  explanation: Разница между сигналом и вердиктом определяет, что делает система дальше. Сигнал требует продолжения проверки, вердикт закрывает вопрос — и именно закрытие вопроса пропускает известные методы в статью как новые.
  kind: open
  reference: 'Как сигнал, направляющий внимание, а не как вердикт. Найденная почти идентичная работа — сильный повод пересмотреть идею либо точно сформулировать, чем предложение от неё отличается. Пустая выдача — повод продолжить проверку: переформулировать запросы, посмотреть связанные и цитирующие статьи, сопоставлять не названия, а сами механизмы, поскольку известный метод мог называться иначе. Опасность в том, что в конвейере этот этап выглядит как бинарная галочка: пройдено — идём дальше. Галочка сообщает лишь, что автоматический поиск не заметил предшественника, и не превращает неполный обзор в доказательство.'
  id: 006-novelty-signal-3
  fingerprint: 574e2d9f
