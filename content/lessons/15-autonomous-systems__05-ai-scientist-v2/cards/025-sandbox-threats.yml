- concept: успешное завершение эксперимента ничего не говорит о побочных действиях процесса за пределами эксперимента
  question: 'Скрипт, сгенерированный исследовательским агентом, отработал без ошибок: метрики сохранены, фигура построена, числа выглядят правдоподобно. Что отсюда следует о безопасности запуска?'
  explanation: Проверка «эксперимент завершился» отвечает только на вопрос о ходе вычисления. Чтение переменных окружения с ключами, отправка рабочего каталога наружу, порождение фоновых задач и трата облачного бюджета не мешают скрипту вернуть правильное число. Безопасность оценивают по тому, что процесс сделал по дороге, а не по итоговой метрике.
  kind: choice
  options:
    - 'Ничего: корректность результата и побочные действия процесса независимы — тот же скрипт мог поставить произвольный пакет, обратиться в сеть и оставить фоновые процессы'
    - 'Запуск безопасен: любое опасное действие проявилось бы падением или искажением метрик'
    - Запуск безопасен, если исходный код прошёл статическую проверку перед исполнением
    - Безопасность подтверждена, поскольку в задании не было ни слова про сеть и файлы
  correct: 0
  id: 025-sandbox-threats-1
  fingerprint: d73d9ff9
- concept: установленная по ходу эксперимента зависимость исполняется с теми же правами и расширяет круг авторов исполняемого кода
  question: Сгенерированный агентом скрипт загрузки данных ставит незнакомую библиотеку из публичного репозитория. Чем это опасно помимо возможной ошибки в самом скрипте?
  explanation: 'Установка пакета — это не только скачивание файлов: его установочные скрипты и импортируемый код выполняются на той же машине под теми же правами. Круг того, кому фактически доверена машина, расширяется без отдельного решения человека, и именно поэтому неконтролируемый доступ в сеть и установка произвольных зависимостей перечислены как основные риски исполнения LLM-кода.'
  kind: choice
  options:
    - Код библиотеки исполняется в том же процессе и с теми же правами — в запуск добавляется ещё один неизвестный автор исполняемого кода
    - Библиотека замедлит обучение и тем самым исказит измеренную метрику
    - Библиотека займёт место на диске, из-за чего результаты сохранятся не полностью
    - 'Ничем: пакеты из публичного репозитория проходят проверку сопровождающими'
  correct: 0
  id: 025-sandbox-threats-2
  fingerprint: 85fddba7
