- concept: команда и данные неразличимы по содержанию, поэтому граница доверия проводится по каналу поступления, а не по формулировке
  question: Объясни своими словами, почему агенту нельзя отличать команду от данных по тексту сообщения — например, по маркеру «системное сообщение» или по повелительному наклонению.
  explanation: Ключ — сдвиг вопроса с «что написано» на «откуда пришло». Содержание проверяемым признаком быть не может, поскольку полностью контролируется тем, кто пишет страницу; канал поступления контролируется системой и потому годится как основа полномочий.
  kind: open
  reference: 'Любую формулировку может воспроизвести атакующий: маркер, официальный тон, ссылка на системный уровень пишутся в любом месте страницы или PDF и попадают в модель как обычные пиксели или обычные токены — те же, что подпись на кнопке. Признака подлинности в самом содержании нет, подделка ничего не стоит. Поэтому граница проводится по происхождению: разрешением считается прямое указание того, кто запустил агента, всё полученное извне — недоверенный вход. Команды, спрятанные в таком входе, — это prompt-injection; сверху достраиваются уровни защиты: классификатор перед каждым действием, списки разрешённых и запрещённых адресов, подтверждение человеком для необратимого, вынос содержимого во внешнее хранилище со ссылками из спанов и жёсткие отказы на указания, найденные в полученном тексте.'
