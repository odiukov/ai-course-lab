- concept: подтверждение человеком ставится по признаку необратимости действия, а не на каждое действие, иначе агент теряет смысл
  question: Инженер размечает, какие действия агента требуют подтверждения человеком. По какому признаку выбирать действия?
  explanation: 'Прокрутка и наведение откатываются бесплатно, купленный билет и удалённый файл — нет. Подтверждение на каждый клик обнуляет выигрыш: человек всё равно проведёт за агентом всю сессию нажатий. Уверенность модели — самооценка, её нельзя класть в основу защиты необратимых операций.'
  kind: choice
  options:
    - 'По длительности: подтверждать всё, что занимает больше нескольких секунд'
    - 'По необратимости: подтверждать то, что нельзя откатить — вход в аккаунт, оплату, удаление данных'
    - 'По каждому действию подряд: любой клик и любая прокрутка через подтверждение'
    - 'По уверенности модели: подтверждать, когда модель сама сообщает о низкой уверенности'
  correct: 1
  id: 024-nedoverennyj-vhod-2
