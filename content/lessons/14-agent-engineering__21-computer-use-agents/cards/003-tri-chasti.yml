- concept: схема инструмента computer вшита в модель при обучении, разработчик задаёт только тип инструмента и размер экрана
  question: Разработчик подключает Claude computer use и готовит определение инструмента. Что он должен описать сам?
  explanation: У `computer` схема вшита в модель на обучении — в отличие от обычных инструментов, где имя, параметры и описание пишет разработчик. Указывается тип инструмента и размер экрана (например 1024x768). Работа разработчика — не описать инструмент, а исполнить запрошенное действие.
  kind: choice
  options:
    - Только тип инструмента и разрешение экрана — имена действий и параметры модель знает с обучения
    - Имя, JSON-схему параметров и текстовое описание каждого действия, как для обычного пользовательского инструмента
    - Список допустимых координат кликов для конкретного разрешения
    - Описание элементов интерфейса, по которым разрешено кликать
  correct: 0
  id: 003-tri-chasti-1
  fingerprint: 1a33698d
- concept: агенту нужен виртуальный дисплей, потому что headless-машина без монитора не даёт кадра для скриншота
  question: Агент запущен на облачной Linux-машине без монитора. Зачем поднимают Xvfb?
  explanation: Xvfb — рабочий стол, существующий только в памяти. Без него приложению некуда рисовать и нечего фотографировать, а вся петля computer use держится на скриншоте как входе.
  kind: choice
  options:
    - Чтобы был экран, куда браузер рисует и откуда снимается скриншот — физического кадра на сервере нет
    - Чтобы ускорить отрисовку страниц за счёт аппаратного ускорения
    - Чтобы получить доступ к дереву элементов интерфейса через API доступности
    - Чтобы переводить координаты модели в координаты реального монитора
  correct: 0
  id: 003-tri-chasti-2
  fingerprint: 5e658124
- concept: модель возвращает только описание действия, физическое исполнение и повторный съём экрана лежат на стороне разработчика
  question: Модель ответила вызовом инструмента с действием «клик по точке 512, 300», но на машине ничего не произошло. Объясни своими словами, почему это ожидаемое поведение и чья это зона ответственности.
  explanation: 'Разделение ролей: модель решает, что сделать; сторона разработчика делает это и возвращает новое состояние экрана.'
  kind: open
  reference: Ответ модели — текст (вызов инструмента), а не сам клик. Модель не имеет доступа к мыши и клавиатуре машины. Исполнение действия на целевой машине и последующий съём нового скриншота — работа обвязки, которую пишет разработчик. Без исполнителя модель не узнает результат своего действия и не сможет решить, что делать дальше.
  id: 003-tri-chasti-3
  fingerprint: 6f4ab3cc
