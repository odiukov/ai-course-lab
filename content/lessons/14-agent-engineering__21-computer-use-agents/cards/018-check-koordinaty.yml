- concept: трейс хранит каждое действие с исходом и причиной отказа, что позволяет постфактум восстановить, почему сценарий не завершился
  question: Агент выполнял сценарий оформления заказа, заказ не оформился. Что должен содержать трейс исполнения, чтобы ответить на вопрос «почему» через неделю, и почему одного финального скриншота недостаточно?
  explanation: 'Ключевое требование к трейсу — фиксировать не только исполненные действия, но и заблокированные вместе с причиной блокировки. Иначе три разных сбоя (кривая координата, срабатывание фильтра, отсутствие подтверждения) выглядят снаружи одинаково: «ничего не произошло».'
  kind: open
  reference: 'Трейс — последовательная запись всех шагов: время, запрошенное моделью действие с параметрами (координаты клика, вводимый текст), исход (исполнено / отклонено) и причина отказа (координата вне разрешённой области, сработал классификатор безопасности, не было подтверждения человека на действие с последствиями). Финальный скриншот показывает только конечное состояние и не различает причины: по нему нельзя понять, промахнулся ли агент координатой, был ли клик заблокирован политикой или покупка остановлена барьером подтверждения. Восстановление по журналу заменяет догадки: каждый отказ подписан причиной, поэтому разбор — это чтение записи, а не реконструкция по памяти.'
  id: 018-check-koordinaty-2
  fingerprint: be95e99a
