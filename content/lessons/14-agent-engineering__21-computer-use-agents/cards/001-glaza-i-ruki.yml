- concept: возможности агента ограничены тем, что доступно через пользовательский интерфейс приложения
  question: Агент управляет приложением только через экран, клавиатуру и мышь и не обращается к внутренним функциям и форматам данных программы. Объясните своими словами, какие задачи из-за этого становятся для него плохим выбором, и приведите пример такой задачи.
  explanation: 'Отсутствие привилегированного доступа — не только про надёжность, но и про потолок возможностей: у агента ровно та поверхность, что нарисована на экране. Практический вывод — экранное управление берут для коротких сценариев в приложениях без программного входа, а объёмные и транзакционные вещи выносят на любой доступный уровень ниже интерфейса.'
  kind: open
  reference: 'Агент ограничен тем, что человек может сделать руками в интерфейсе. Поэтому плохо ложатся: массовые операции (интерфейс проводит по одной записи за раз, тысяча записей — тысяча циклов «снимок, клик, проверка»); задачи, требующие данных, которых нет на экране (скрытые поля, полная таблица базы, история изменений); операции, где нужна атомарность или транзакция — прервавшийся на середине агент оставит систему в промежуточном состоянии; и всё, что чувствительно к задержке, потому что каждый шаг оплачивается снимком экрана и распознаванием. Пример: перенести десять тысяч контрагентов из старой учётной программы в новую. Через интерфейс это часы кликов и накопление ошибок; выгрузка файла или запрос к базе решает задачу за один шаг.'
  id: 001-glaza-i-ruki-3
  fingerprint: 342e4ff0
