- concept: 'слои интеграции с приложением упорядочены по надёжности: программный интерфейс надёжнее расширения, расширение надёжнее управления экраном'
  question: Агенту нужно автоматизировать работу в приложении. Расставьте способы доступа от самого надёжного и предпочтительного к последнему резервному варианту.
  explanation: 'Чем ниже спускаешься по этому списку, тем шире охват и тем слабее гарантии. API даёт стабильный контракт, плагин — частичный доступ к внутренностям, управление экраном — универсальность без всякой семантики. Поэтому экран берут не как первый выбор, а как крайний: когда программного входа нет вообще.'
  kind: order
  items:
    - 'Официальный программный интерфейс приложения (API): вызовы с документированным контрактом и стабильными именами полей'
    - 'Плагин или скриптовый движок приложения: доступ к объектам приложения, но только к тем, что автор вынес наружу'
    - 'Управление экраном, клавиатурой и мышью: работает с любым приложением, но целями служат области пикселей'
    - 'Никакого варианта нет: задачу выполняет человек вручную'
  id: 001-glaza-i-ruki-1
  fingerprint: 0e91228e
- concept: агент, работающий через экран, не имеет устойчивых идентификаторов элементов, поэтому визуальные изменения интерфейса ломают сценарий
  question: Сценарий агента, управляющего экраном, стабильно работал неделю, а после смены оформления приложения на тёмное и переноса окна на второй монитор начал промахиваться по кнопкам. Аналогичный сценарий на программном интерфейсе изменения не заметил. В чём принципиальная причина разницы?
  explanation: 'Разница не в яркости и не в драйверах. Вызов API ссылается на именованный объект, и оформление окна на него не влияет. Агент на экране опирается на признаки, которые никто ему не обещал сохранять: цвет, размер, координаты. Отсюда практика — привязываться к тексту и подписям элементов, каждый шаг подтверждать новым снимком, а не запоминать координаты.'
  kind: choice
  options:
    - Программный интерфейс адресует элементы по устойчивому идентификатору, а управление экраном — по внешнему виду и позиции, которые не являются частью контракта приложения
    - Тёмное оформление снижает контрастность настолько, что распознавание изображения физически невозможно
    - Второй монитор всегда обслуживается отдельным драйвером ввода, недоступным агенту
    - Программный интерфейс кэширует состояние окна, а управление экраном работает без кэша
  correct: 0
