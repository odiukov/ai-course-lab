- concept: абсолютный процент на бенчмарке интерпретируется только относительно опорных точек — предыдущего лучшего результата и человеческого уровня
  question: Новая агентная модель получила 24,7% на некотором GUI-бенчмарке. Что минимально необходимо, чтобы понять, прорыв это или стагнация?
  explanation: 'Процент — это доля решённых задач конкретного набора, у которого своя сложность и свой потолок. Смысл появляется только рядом с двумя мерками: что давал прошлый SOTA (для OSWorld это 12,24% годом раньше против 38,1% у CUA) и что даёт человек (72,36%). Размер модели и цена прогона ничего не говорят о качестве, а чужой бенчмарк меряет другую сложность.'
  kind: choice
  options:
    - Знать результат предыдущей лучшей модели на том же бенчмарке и уровень человека на нём
