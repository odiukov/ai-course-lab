- concept: человеческий результат на длинных GUI-бенчмарках заметно ниже полного прохождения и служит практическим потолком, к которому и меряется отставание агента
  question: На длинном GUI-бенчмарке человек-оператор набирает 68,5%, агент — 41,2%. Какой вывод корректен?
  explanation: 'Отставание меряется к человеческому уровню, а не к полному прохождению: 68,5/41,2 ≈ 1,7. Человек не берёт всё, потому что задачи длинные, из десятка шагов, и один промах рушит цепочку — на OSWorld человек держит 72,36% против 38,1% у CUA, то есть разрыв примерно вдвое. Низкий человеческий результат — характеристика сложности набора, а не его поломки.'
  kind: choice
  options:
    - Агент отстаёт примерно в 1,7 раза от практического потолка, а сам потолок ниже полного прохождения из-за длины и неоднозначности задач
    - Агент решил 41,2% задач, значит до идеала ему остаётся ровно 58,8% — человеческий результат тут не нужен
    - Раз человек не набирает полного прохождения, бенчмарк сломан и его числа использовать нельзя
