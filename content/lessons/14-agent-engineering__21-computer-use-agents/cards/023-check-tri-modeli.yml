- concept: работа за компьютером из отдельной специализированной модели превращается во встроенную способность базовой мультимодальной модели
  question: Сначала управление компьютером поставляют как отдельную специализированную модель, затем ту же способность встраивают прямо в общую мультимодальную модель. Объясни своими словами, что меняется для инженера, который строит агента.
  explanation: 'Тренд идёт от отдельной computer-use модели к встроенной способности: в Gemini 3 Flash работа за компьютером доступна сразу. Для архитектуры агента это убирает слой маршрутизации между планировщиком и исполнителем.'
  kind: open
  reference: 'Раньше приходилось держать две модели и маршрутизировать между ними: общая модель рассуждает и планирует, специализированная только выдаёт действия по скриншоту, а разработчик склеивает их, передавая контекст туда-сюда. Когда способность встроена, тот же вызов, что рассуждает над задачей, возвращает и действия в интерфейсе: нет отдельного endpoint, нет потери контекста на границе моделей, нет выбора «какой модели отдать этот шаг». Цикл «скриншот — действие — новый скриншот» остаётся прежним, упрощается только состав системы. Плата — меньше возможности подобрать под шаг более дешёвую или более быструю узкую модель.'
  id: 023-check-tri-modeli-2
