- concept: регистронезависимость достигается одноразовым приведением обоих операндов к одному регистру до сравнения, а не перебором вариантов написания
  question: Шаблоны заряда хранятся в нижнем регистре. Чем заполнить пропуск, чтобы «ИГНОРИРУЙ ПРЕДЫДУЩИЕ» и «Ignore Previous Instructions» не проскочили мимо детектора?
  explanation: 'Оператор вхождения подстроки чувствителен к регистру, поэтому регистр надо снять с обеих сторон. Шаблоны нормализуются один раз при написании кода, текст — один раз на входе функции; после этого сравнение честное. Альтернатива «перечислить все варианты написания» комбинаторно безнадёжна: атакующий свободен в оформлении. casefold() строже lower() и тоже подходит.'
  kind: cloze
  template: |-
    PATTERNS = ["ignore previous instructions", "system:", "игнорируй предыдущие"]  # хранятся в нижнем регистре

    def contains_injection(text):
        low = ___
        return any(p in low for p in PATTERNS)
  answer: text.lower()
  accept:
    - text.lower()
    - text.casefold()
    - str.lower(text)
  id: 026-code-contains-injection-2
  fingerprint: 8ad7bd7b
- concept: детектор инъекций намеренно смещён в сторону ложных срабатываний, потому что цена ложной тревоги (эскалация к человеку) на порядки ниже цены пропуска (исполнение чужого приказа)
  question: Такой детектор даёт True и на статью о prompt-injection, где фраза-заряд приведена как безобидный пример. Объясни своими словами, почему это считается приемлемым поведением, и что именно должно происходить по вердикту True.
  explanation: 'Ключ — асимметрия цены ошибок, а не точность сама по себе. Дешёвый пошаговый фильтр по подстрокам — первый и самый дешёвый из слоёв защиты; его задача поднимать флаг, а не выносить приговор. Считать True командой «удалить» — ошибка проектирования: тогда цена ложной тревоги подскакивает и смещение в сторону перебора перестаёт окупаться.'
  kind: open
  reference: 'Ошибки детектора несимметричны по цене. Ложная тревога стоит одного вопроса пользователю: работа замедляется, но ничего плохого не происходит. Пропущенный заряд стоит выполненного действия от лица пользователя — входа в аккаунт, перевода денег, удаления файла, — и у действий в интерфейсе нет отката. При такой асимметрии рационально настраивать порог с запасом в сторону перебора: лучше лишний раз спросить, чем один раз пропустить. Отсюда и трактовка вердикта: True означает «дальше без человека нельзя», то есть эскалацию и подтверждение, а не удаление содержимого и не отказ от задачи. Детектор — дешёвый первый слой фильтрации, не финальный судья; окончательное решение о содержимом принимает человек или более дорогая проверка.'
  id: 026-code-contains-injection-3
