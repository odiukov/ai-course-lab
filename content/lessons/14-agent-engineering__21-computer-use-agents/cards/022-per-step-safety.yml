- concept: проверка безопасности исполняется до отправки действия в интерфейс, потому что у операций в интерфейсе нет отката
  question: 'Команда предлагает удешевить защиту агента: пропускать все действия сразу, а классификатор запускать асинхронно на уже исполненных действиях и поднимать алерт при небезопасных. Объясни своими словами, что эта схема даёт, а что теряет.'
  explanation: Разница между «до» и «после» здесь не про скорость, а про обратимость. Асинхронный классификатор — средство аудита, он может дополнять предварительную проверку, но не заменять её.
  kind: open
  reference: 'Схема даёт наблюдаемость — журнал того, что уже произошло, и сигнал для расследования. Она не даёт защиты: действия в интерфейсе необратимы, у клика нет Ctrl+Z. Удалённая почта не возвращается, отправленный платёж не отзывается, поэтому алерт приходит после того, как ущерб нанесён. Ключевое свойство служб вроде пошаговой проверки в Gemini 2.5 Computer Use — вердикт выносится ДО того, как действие превратится в реальное событие мыши или клавиатуры: небезопасное отклоняется, и действие просто не происходит. Асинхронная проверка — это протокол случившегося, а не контроль.'
  id: 022-per-step-safety-2
  fingerprint: d4d39e92
- concept: разрешение действует только на одно действие и не наследуется следующими шагами, потому что вердикт зависит от экрана, на котором он выносился
  question: Агент выполняет сценарий из 60 действий. Первые 46 признаны безопасными. Почему 47-е действие всё равно нужно проверять с нуля, а не пропустить по уже выданному разрешению?
  explanation: 'Разрешение привязано к паре (действие, экран), на которой оно выдавалось. Экран на 47-м шаге — новый, и на нём может оказаться диалог подтверждения удаления, которого не было ни на одном из предыдущих 46. Отсюда «на каждом шаге»: проверка не кэшируется и не наследуется.'
  kind: choice
  options:
    - Потому что после нескольких десятков шагов у модели заканчивается контекст
    - Потому что вердикт по каждому шагу выносился на своём экране и ничего не знает о том, что отрисовано сейчас
    - Потому что накопленные разрешения истекают по таймауту
    - Потому что чем длиннее сценарий, тем ниже точность распознавания координат
  correct: 1
  id: 022-per-step-safety-3
