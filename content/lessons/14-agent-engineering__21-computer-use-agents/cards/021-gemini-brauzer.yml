- concept: ограничение агента одним браузером сужает класс достижимых задач, но не означает худшего качества внутри этого класса
  question: Агент управления компьютером умеет работать только в браузере. Что из этого корректно следует?
  explanation: 'Браузерная специализация — это обмен: отказ от класса задач вне браузера в пользу скорости и точности внутри него. Gemini 2.5 Computer Use даёт около 70% на Online-Mind2Web, наборе чисто браузерных задач, и при этом просто не берётся за настольные сценарии. Меньшая область ≠ худшее качество в этой области.'
  kind: choice
  options:
    - Задачи, требующие нативных приложений и файлового менеджера, ему недоступны, но внутри браузера он может быть точнее и быстрее универсального агента
    - Он заведомо менее точен, чем агент с доступом ко всему рабочему столу, потому что видит меньше
    - Его результат на браузерном наборе задач можно напрямую сравнивать с результатом настольного агента на настольном наборе
    - Он не нуждается в скриншотах, потому что браузер отдаёт структуру страницы
