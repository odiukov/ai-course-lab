- concept: 'порядок безопасной навигации: переход исполняется, затем читается фактический адрес, затем тот же предикат списка, при несовпадении остановка и запись отказа'
  question: Расставь шаги действия navigate так, чтобы белый список нельзя было обойти редиректом.
  explanation: Проверка на входе остаётся полезной — она отсекает явно чужой адрес до сетевого запроса. Но решает вторая, та же самая функция, вызванная после перехода. Ключ в том, что чтение адреса идёт после завершения всей цепочки, а не после первого ответа сервера, и что при отказе содержимое страницы не попадает в контекст модели.
  kind: order
  items:
    - Сверить запрошенный адрес со списком разрешённых домменов и отказать сразу, если его там нет
    - Исполнить переход и дать браузеру дойти до конца цепочки редиректов
    - Прочитать фактический текущий адрес страницы после остановки цепочки
    - Прогнать фактический домен через тот же предикат списка
    - При несовпадении прервать сценарий и записать отказ в трейс, не отдавая содержимое страницы модели
  id: 034-navigate-redirekt-2
  fingerprint: 9a851485
- concept: проверка только запрошенного адреса не просто пропускает чужой домен, а сама доставляет агенту недоверенный контент, то есть открывает канал инъекции
  question: Почему пропуск редиректа мимо белого списка опаснее, чем просто «агент оказался на лишнем домене»? Объясни, как это связано с инъекцией через контент.
  explanation: 'Два дефекта складываются: белый список адресов и детектор инъекций защищают от разных вещей, но список — ещё и вход в тот канал, который детектор обслуживает. Отказ по фактическому адресу закрывает канал целиком, не полагаясь на то, что детектор поймает конкретную формулировку заряда.'
  kind: open
  reference: 'Разрешённый домен — это ещё и метка доверия к содержимому: страницу с разрешённого адреса агент читает как рабочие данные. Пропустив редирект, ты подставляешь под эту метку страницу, которую выбрал атакующий, и её текст попадает в контекст модели вместе со скриншотом и DOM. Дальше работает обычная инъекция: текст вроде «ignore all instructions» модель может принять за указание пользователя, потому что команда и данные неразличимы по содержанию. То есть неверный момент проверки не только расширяет множество достижимых доменов, но и сам доставляет агенту недоверенный вход — ты своими руками привёл его к источнику инъекции. Поэтому отказ по фактическому адресу должен срабатывать до того, как содержимое страницы будет прочитано и передано модели.'
  id: 034-navigate-redirekt-3
  fingerprint: '82786e95'
