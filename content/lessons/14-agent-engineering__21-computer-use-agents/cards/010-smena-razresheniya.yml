- concept: перенос точки между кадрами разного размера идёт через нормализованную долю, отдельно по каждой оси
  question: Элемент найден в точке (400, 600) на кадре размером 1600×1200. Тот же интерфейс надо кликнуть на дисплее 1920×1080. Какая вертикальная координата (y) соответствует этой точке на целевом дисплее?
  explanation: 'Нормализация по своей оси: 600/1200 = 0.5, затем 0.5 × 1080 = 540. По горизонтали независимо: 400/1600 = 0.25, 0.25 × 1920 = 480. Каждая ось делится на свой исходный размер и умножается на свой целевой.'
  kind: numeric
  answer: 540
  tolerance: 1
  id: 010-smena-razresheniya-1
  fingerprint: 43e90ce7
- concept: один общий коэффициент масштабирования непригоден, когда отношение сторон исходного и целевого кадра различается
  question: Координаты клика переносят с кадра 1600×1200 на дисплей 1920×1080. Почему нельзя умножить обе координаты на один общий коэффициент?
  explanation: 1920/1600 = 1.2, а 1080/1200 = 0.9. Общий множитель совпал бы с обоими только при одинаковом отношении сторон. Округление до целых нужно, но это последний шаг, а не причина отказа от общего коэффициента.
  kind: choice
  options:
    - 'Потому что отношение сторон кадров различается: ширина растёт в 1.2 раза, а высота падает в 0.9 раза, и один множитель обязательно соврёт по одной из осей'
    - Потому что умножение координат на дробное число даёт нецелые пиксели, а координаты обязаны быть целыми
    - Потому что координата y всегда отсчитывается снизу, а x сверху, и знаки множителей должны быть разными
    - Потому что общий коэффициент можно применять только при увеличении кадра, но не при уменьшении
