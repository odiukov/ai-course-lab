- concept: 'порядок пересчёта точки между кадрами: нормализация по исходным размерам, умножение на целевые, округление'
  question: Расставь шаги переноса координаты клика с кадра одного размера на кадр другого размера.
  explanation: 'Доля не зависит от размера кадра, поэтому она и есть переносимая величина. Округление идёт последним: если округлить раньше, ошибка умножится на масштаб целевого кадра.'
  kind: order
  items:
    - Разделить x на ширину исходного кадра, y на высоту исходного кадра — получить доли от 0 до 1
    - Умножить долю по ширине на ширину целевого кадра, долю по высоте — на высоту целевого кадра
    - Округлить обе полученные величины до целых пикселей
  id: 010-smena-razresheniya-3
