- concept: модель возвращает координаты в системе координат переданного ей изображения, поэтому при масштабировании скриншота их нужно пересчитывать в координаты реального дисплея
  question: Дисплей 3200×1800. Перед отправкой в модель скриншот уменьшают до 1600×900. Модель возвращает клик с x = 430. Какую координату x надо подать в драйвер мыши реального дисплея?
  explanation: 'Отсчёт от опорных точек делает клик независимым от разрешения экрана, но результат модель выдаёт в пикселях именно того кадра, который увидела. Кадр уменьшен вдвое, значит обратный коэффициент 2: 430 × 2 = 860. Если пропустить пересчёт, курсор уедет в левую половину экрана — типичная ошибка при добавлении даунскейла ради экономии токенов.'
  kind: numeric
  answer: 860
  tolerance: 1
  id: 005-opornye-tochki-1
  fingerprint: f4084362
- concept: агрессивное уменьшение скриншота убирает мелкие опорные элементы из кадра и ухудшает точность попадания, то есть экономия токенов оплачивается точностью клика
  question: Чтобы сократить расход токенов, инженер уменьшает скриншоты с 1600×900 до 800×450 перед отправкой computer-use-агенту. Промахи по мелким иконкам панели инструментов резко участились. Какова наиболее вероятная причина?
  explanation: 'Модель считает пиксели от того, что различает в кадре. Уменьшение вдвое само по себе допустимо (координаты потом пересчитываются обратно), но вместе с деталями исчезают мелкие ориентиры: границы иконок, засечки полей, разделители. Опорной точки нет — отсчёт становится грубым, и ошибка в 2–3 пикселя кадра превращается в 4–6 пикселей дисплея. Разрешение картинки и её информативность — разные вещи.'
  kind: choice
  options:
    - Модель умеет работать только с одним фиксированным разрешением, зашитым при обучении
    - После сжатия мелкие элементы, служившие ориентирами, размылись и слились, так что отсчитывать пиксели стало не от чего
    - Уменьшение изображения ломает схему инструмента computer, и действие click перестаёт приниматься
    - Модель запоминает абсолютные координаты предыдущего кадра и повторяет их на новом
