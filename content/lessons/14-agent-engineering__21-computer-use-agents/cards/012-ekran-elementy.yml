- concept: проверка попадания клика требует одновременного выполнения условий по обеим осям — конъюнкция, а не дизъюнкция
  question: Заполните пропуск в проверке того, что клик (x, y) попал в область элемента с границами x1, y1, x2, y2.
  explanation: 'Точка внутри прямоугольника, только если она внутри по обеим осям сразу. С `or` клик (265, 520) при области (180,500)-(260,560) прошёл бы: по y условие выполнено, хотя по x точка вне границы. Проверка вырождается в две бесконечные полосы вместо ограниченной области.'
  kind: cloze
