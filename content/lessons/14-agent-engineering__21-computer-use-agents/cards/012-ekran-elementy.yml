- concept: проверка по списку разрешённых областей детерминирована и не использует модель, поэтому ошибка агента в координатах не может её обойти
  question: Агент, управляющий компьютером, выдаёт координаты клика. Почему проверку этих координат по списку разрешённых областей делают обычным сравнением чисел, а не поручают самой модели или второму классификатору?
  explanation: 'Это разделение обязанностей: границы области — четыре сравнения и гарантия, безопасность текста — эвристика без гарантий. Дешёвая детерминированная проверка отсекает основную массу промахов, дорогая вероятностная остаётся только там, где без неё нельзя.'
  kind: open
  reference: 'Сравнение координат с границами области детерминировано: результат зависит только от чисел и не зависит от того, что модель увидела на скриншоте, как поняла страницу или какой текст ей подсунули. Ошибка агента в координатах — хоть на пиксель, хоть на пол-экрана — не влияет на исход проверки, потому что проверяющий код не спрашивает у агента ничего. Классификатор на модели, наоборот, сам подвержен ошибкам и инъекциям и даёт вероятностный ответ, а не гарантию. Отсюда роль списка областей: он ставит жёсткую верхнюю границу урона от неверных координат (клик просто отклоняется), а вероятностные проверки нужны для того, что числами не выразить, — например для содержимого набираемого текста.'
