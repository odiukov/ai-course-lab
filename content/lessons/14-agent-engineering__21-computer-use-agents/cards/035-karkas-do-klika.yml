- concept: политика безопасности агента объявляется как данные до написания управляющего цикла, а не добавляется после
  question: Ты строишь агента, который управляет чужим интерфейсом. Расставь этапы так, чтобы проверка безопасности оказалась структурной частью контура исполнения, а не поздней заплаткой.
  explanation: Оба списка — чистые данные, они не зависят от модели и пишутся раньше любой логики. Цикл, написанный поверх готовой политики, не имеет ветки исполнения в обход проверки. Обратный порядок даёт цикл, построенный на допущении «кликать можно куда угодно», и вставка проверки превращается в переписывание контура.
  kind: order
  items:
    - 'Описать периметр как данные: допустимые области экрана и список разрешённых доменов'
    - 'Описать классы действий: что обратимо самим агентом, а что требует подтверждения человека'
    - Написать цикл так, что путь к исполнению действия проходит только через чтение этих списков
    - Подключить модель и выполнить первое настоящее действие в интерфейсе
  id: 035-karkas-do-klika-1
  fingerprint: 59b5ef18
- concept: дороговизна поздней вставки проверки — следствие отсутствия единой точки прохода для действий, а не объёма самого кода проверки
  question: Агент для работы за компьютером уже работает без проверок безопасности. Функция классификации действия готова и занимает 40 строк. Почему её встраивание всё равно оказывается дорогим?
  explanation: Цена не в самом классификаторе, а в топологии контура. Код, написанный без политики, обычно дёргает мышь и клавиатуру из нескольких мест плюс из веток обработки ошибок; гарантировать, что ни одна из них не осталась необёрнутой, нельзя без разбора всего цикла. Когда политика есть заранее, единственная точка прохода возникает сама, потому что иначе действие просто нечем параметризовать.
  kind: choice
  options:
    - Классификатор требует отдельной модели, а её вызов увеличивает задержку каждого витка
    - 'В цикле нет единственного места, через которое проходят все действия: вызовы интерфейса разбросаны, и каждый нужно найти и обернуть'
    - Списки разрешённых областей нельзя составить, пока агент уже запущен в работу
    - Проверка не может выносить вердикт, не зная всей истории предыдущих действий сценария
  correct: 1
