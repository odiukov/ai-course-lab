- concept: готовые компоненты платформы (пошаговая проверка безопасности, встроенный канал доставки пользователю) — самостоятельный критерий выбора наравне со способностями модели
  question: Две платформы одинаково дотягиваются до нужной поверхности и близки по качеству. У одной пошаговая проверка безопасности встроена в сервис, у другой её нет, но она уже стоит внутри массового потребительского продукта. Объясни своими словами, почему выбор между ними — не вопрос «кто умнее».
  explanation: Выбор — про форму задачи и готовность инфраструктуры, а не про победителя рейтинга. У Gemini пошаговая проверка безопасности идёт из коробки, OpenAI CUA даёт кратчайший путь до массового пользователя через ChatGPT, Claude computer use — самую богатую поддержку настольных систем. Три разных ответа на три разные формы задачи.
  kind: open
  reference: 'Способности модели — не единственная стоимость внедрения. Встроенный пошаговый классификатор снимает с разработчика необходимость самому строить перехват опасных действий перед их исполнением: это готовая часть обвязки, а не бонус к интеллекту. Встроенность в потребительский продукт снимает другую задачу — доставку до пользователя без собственной инфраструктуры (хостинг, виртуальный дисплей, интерфейс). Поэтому критерий выбора складывается из формы задачи (где она живёт, кто конечный пользователь, критична ли задержка) и того, сколько обвязки придётся написать самому. Одинаковые по метрике платформы дают разный объём работы.'
