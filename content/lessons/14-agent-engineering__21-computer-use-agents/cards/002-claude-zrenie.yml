- concept: 'цикл агента computer use: скриншот, вызов инструмента с действием, исполнение на виртуальном дисплее, новый скриншот как результат'
  question: Расставь шаги одной итерации цикла агента computer use на Linux-хосте без монитора.
  explanation: 'Для реализации нужны три части: цикл агента, инструмент computer (его схема вшита в модель, разработчик её не описывает) и виртуальный дисплей, на Linux обычно Xvfb. Ключевое: результат действия возвращается модели новым скриншотом — иначе она не видит, сработал ли клик.'
  kind: order
  items:
    - Снять скриншот виртуального дисплея (Xvfb) и передать его модели вместе с задачей
    - Модель возвращает вызов инструмента computer с конкретным действием ввода — координаты курсора, клик, набор текста
    - Цикл агента исполняет это действие на виртуальном дисплее
    - Снять новый скриншот и вернуть его модели как результат вызова инструмента — начинается следующая итерация
  id: 002-claude-zrenie-2
  fingerprint: 0be01939
- concept: координаты кликов не привязаны к разрешению экрана, потому что модель отсчитывает пиксели от опорных точек на самом скриншоте
  question: Агента обкатали на дисплее 1920x1080, затем перенесли на 3440x1440 — попадание по элементам интерфейса не развалилось. Объясни своими словами, за счёт чего навык переносится между разрешениями.
  explanation: 'Именно поэтому computer use не требует калибровки под каждое разрешение. Ограничение остаётся: модель видит только то, что попало в кадр, и опорные точки должны быть различимы — при сильном уменьшении скриншота точность падает.'
  kind: open
  reference: 'Модель не запоминает абсолютные координаты элементов. Она обучена отсчитывать пиксели до цели от заметных опорных точек, которые видит на текущем скриншоте (край окна, соседняя кнопка, заголовок панели). Смещение считается относительно того, что рядом, поэтому при другом разрешении та же процедура даёт корректную точку клика: меняется масштаб картинки, но не способ навигации по ней. Выход всё равно остаётся абсолютной координатой в системе координат конкретного скриншота — привязки нет именно у навыка, а не у формата действия.'
  id: 002-claude-zrenie-3
