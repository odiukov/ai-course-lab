- concept: нормализация делит на размер кадра, а не на размер минус один, поэтому крайний правый пиксель не выходит за границу целевого кадра
  question: Скриншот шириной 1024 пикселя, модель вернула точку с x = 1023 (последний столбец). Реальный дисплей шириной 4096 пикселей. Какой x получится после пересчёта?
  explanation: Доля = 1023/1024 = 0.999023..., умножаем на 4096 = 4092. Крайний пиксель исходного кадра переходит не в крайний пиксель целевого, а внутрь него — это и есть гарантия, что результат никогда не выскочит за границу дисплея. Если делить на ширину минус один, крайняя точка даст ровно 4095, и любая ошибка округления вытолкнет её за пределы кадра.
  kind: numeric
  answer: 4092
  tolerance: 0.6
  id: 011-code-rescale-1
  fingerprint: a01da47d
- concept: округление до целых пикселей выполняется один раз в конце, потому что ошибка промежуточного округления доли умножается на целевой размер
  question: Разработчик округляет нормализованную долю до трёх знаков сразу после нормализации, а уже потом умножает на размер целевого кадра. Почему на кадре шириной 3840 это хуже, чем на кадре шириной 640?
  explanation: Округление доли до трёх знаков даёт ошибку до 0.0005. На ширине 640 это 0.32 пикселя — незаметно. На 3840 это уже 1.9 пикселя, и клик может уйти мимо мелкой кнопки. Поэтому единственное округление ставится в самом конце, после умножения на целевой размер.
  kind: choice
  options:
    - Ошибка доли умножается на целевой размер, поэтому в пикселях промах тем больше, чем крупнее кадр
    - У крупных кадров обычно другое отношение сторон, и доля перестаёт быть применимой
    - Числа с плавающей точкой теряют точность при значениях больше тысячи
    - Округление доли всегда смещает точку в сторону правого нижнего угла
