- concept: 'корректность пересчёта проверяется инвариантом: прогон точки в целевой кадр и обратно должен вернуть исходные пиксели'
  question: Каким свойством можно проверить функцию пересчёта координат между кадрами разного размера, не сверяя результат с посчитанными вручную числами? Объясни своими словами и укажи, где это свойство перестаёт выполняться точно.
  explanation: 'Проверка через инвариант сильнее точечных примеров: она не требует эталонных чисел и покрывает любые пары размеров. Ограничение важно помнить: при сжатии кадра (например, 3840 в 960) четыре исходных столбца пикселей отображаются в один, и точное возвращение невозможно в принципе.'
  kind: open
  reference: 'Инвариант «туда и обратно»: перевести точку из кадра A в кадр B, затем тем же кодом из B обратно в A — должны получиться исходные пиксели. Свойство ловит перепутанные ширину и высоту, потерянные множители и неверный порядок операций. Точно оно выполняется, когда целевой кадр не меньше исходного. При уменьшении кадра округление до целых пикселей склеивает несколько исходных точек в одну, информация теряется, и обратный прогон возвращает значение с расхождением до половины шага сжатия — поэтому проверять надо с допуском, а не на строгое равенство.'
  id: 011-code-rescale-3
