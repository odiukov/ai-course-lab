- concept: 'прямоугольник разрешённой области переносится между кадрами как пара точек: оба угла прогоняются через один и тот же пересчёт координат'
  question: Скриншот снимался в кадре 960×600, разрешённая область кнопки задана углами (250, 190) и (410, 240). Тот же интерфейс теперь приходит в кадре 1920×1200. Чему равна координата x правого нижнего угла этой области в новом кадре?
  explanation: 'Прямоугольник — не отдельная сущность, а две точки. Каждый угол переносится тем же преобразованием, что и обычная точка: доля по оси × новый размер. По x кадр вырос вдвое (1920/960 = 2), значит 410 → 820. Второй угол по y: 240 → 480, первый угол → (500, 380). Порядок углов не ломается, коэффициент положительный.'
  kind: numeric
  answer: 820
  tolerance: 0.5
  id: 014-masshtab-elementov-1
  fingerprint: 4964919b
- concept: устаревшая карта разрешённых областей опасна не только ложными отказами, но и ложными пропусками — старый прямоугольник может накрыть другой элемент интерфейса
  question: Разрешение экрана изменилось, координаты кликов агент выдаёт в новом кадре, а список разрешённых областей остался в старом. Какой исход самый опасный?
  explanation: 'Ложный отказ шумный и заметный: сценарий встал, кто-то разбирается. Ложный пропуск тихий — область сдвинулась и накрыла соседнюю кнопку, охрана сказала «разрешено», агент нажал не то. Защита, которая перестала защищать, но продолжает отвечать «ок», хуже той, что явно сломалась.'
  kind: choice
  options:
    - Проверка отклонит верный клик, и агент остановится с ошибкой
    - Старый прямоугольник попадёт на другой элемент интерфейса, и опасный клик будет пропущен как разрешённый
    - Проверка выполнится медленнее из-за большего размера кадра
    - Координаты выйдут за границы кадра и вызовут исключение
  correct: 1
