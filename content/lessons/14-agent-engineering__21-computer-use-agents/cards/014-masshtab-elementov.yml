- concept: смена разрешения кадра требует пересчёта всей карты областей целиком, потому что коэффициент масштаба общий для всего скриншота
  question: При смене разрешения кадра сбой обнаружили на одной кнопке. Почему нельзя починить только её область, и что нужно сделать вместо этого?
  explanation: 'Ключевое: пересчитывают не клик, а карту, по которой его проверяют. Один коэффициент на весь скриншот означает, что чинить надо весь список разом, иначе половина карты останется от старого экрана.'
  kind: open
  reference: 'Масштаб — свойство всего кадра, а не отдельного элемента: если кадр вырос, съехали все области сразу и одинаково. Починив одну, получишь карту из смеси двух систем координат — часть областей в старом кадре, часть в новом, — и остальные проверки продолжат давать ложные отказы и ложные пропуски незаметно. Правильно пересчитать весь список областей одним проходом при смене размеров кадра: для каждой области прогнать оба угла через то же преобразование точки, что применяется к координатам клика. Инвариант: карта областей и координаты клика всегда сравниваются в одной системе координат.'
  id: 014-masshtab-elementov-3
  fingerprint: aef24bf0
