- concept: в журнал попадают и разрешённые действия, иначе нельзя локализовать виток цикла, на котором сценарий свернул не туда
  question: Инженер предлагает писать в журнал агента только отклонённые действия — «успех и так виден по результату». Объясни, что теряется при таком решении.
  explanation: 'Журнал — это трасса цикла, а не список инцидентов. Одна запись на действие: намерение, аргументы (координаты или текст), вердикт, причина отказа. Разрешённые действия задают контекст, в котором отказ вообще осмыслен.'
  kind: open
  reference: 'Теряется локализация. Сценарий из 40 шагов может провалиться не потому, что действие отклонили, а потому что разрешённое действие исполнилось не там, где ожидалось: агент нажал похожую кнопку, перешёл не на ту вкладку, и дальше весь остаток цикла шёл по чужому экрану. Без записей об исполненных действиях нет последовательности шагов, в которую можно вписать отказ, и непонятно, на каком витке ветка разошлась с ожидаемой. Отказ — это только последняя запись; чтобы понять, почему агент вообще оказался в состоянии, где действие пришлось отклонить, нужна вся цепочка. Плюс отсутствие записи об успехе делает неотличимыми «агент дошёл до шага и был остановлен» и «агент до шага не дошёл».'
  id: 030-trassa-2
  fingerprint: b172cc29
- concept: 'фиксируется попытка действия в момент проверки, а не только её результат: молчание журнала иначе неоднозначно'
  question: В журнале агента за прогон 40 шагов нет ни одной записи про отправку формы. Записи создаются только для действий, дошедших до интерфейса. Что из этого нельзя установить по журналу?
  explanation: 'Если писать только исполненное, отсутствие записи означает сразу две разные вещи: модель не предложила действие, либо предложила и предпусковая проверка его завернула. Это разные поломки — первая в промпте и рассуждении модели, вторая в карте разрешённых областей или фильтре текста. Поэтому запись создаётся на каждое предложенное действие, с вердиктом, включая отказ.'
  kind: choice
  options:
    - Сколько шагов агент выполнил до остановки
    - Пытался ли агент отправить форму и был отклонён проверкой, или вообще не сгенерировал такое действие
    - В каком порядке шли исполненные действия
    - Какие координаты использовал агент в исполненных кликах
  correct: 1
