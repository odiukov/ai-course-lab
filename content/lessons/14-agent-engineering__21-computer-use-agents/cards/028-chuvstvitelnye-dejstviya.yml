- concept: уверенность модели не служит критерием эскалации к человеку, потому что уверенно исполненное действие может быть необратимым и при этом ошибочным
  question: 'Инженер настраивает эскалацию так: агент зовёт человека, когда собственная уверенность модели в действии падает ниже 0.8. Почему такой критерий пропускает опасные случаи?'
  explanation: Критерий эскалации задаётся стоимостью отката, а не внутренним состоянием модели. Уверенность отвечает на вопрос «попаду ли я по нужной кнопке», а не «можно ли отменить нажатие». Низкая уверенность на прокрутке даёт лишний вопрос человеку, высокая уверенность на покупке даёт молчаливую необратимую ошибку — обе ветки промахиваются.
  kind: choice
  options:
    - Порог 0.8 слишком мягкий, при 0.95 схема заработает правильно
    - 'Уверенность и обратимость независимы: модель может с уверенностью 0.99 нажать «Оплатить» с неверной датой, и деньги всё равно не вернутся сами'
    - Модели не выдают числовую оценку уверенности для действий в интерфейсе
    - Уверенность падает только на скриншотах низкого разрешения, поэтому критерий срабатывает случайно
  correct: 1
