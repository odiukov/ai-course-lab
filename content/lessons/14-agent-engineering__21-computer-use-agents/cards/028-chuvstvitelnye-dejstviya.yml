- concept: обратимость определяется тем, остаётся ли эффект внутри состояния, которое агент может переиграть сам, а не тем, насколько действие звучит рискованно
  question: Агент работает в браузере. Какое из действий проходит границу необратимости?
  explanation: 'Прокрутка, вкладка и сортировка меняют только состояние экрана: агент возвращает его собственным следующим действием, внешний мир о них не узнал. Отправленное сообщение лежит в чужой системе, доступа к которой у агента нет. Граница проходит по тому, кто владеет изменённым состоянием, а не по тому, насколько действие выглядит серьёзным.'
  kind: choice
  options:
    - Прокрутка длинного списка на 5 экранов вниз
    - Открытие новой вкладки поверх текущей
    - Отправка формы обратной связи адресату
    - Переключение сортировки результатов поиска
  correct: 2
