- concept: перечисленные отказы вызваны устройством контура исполнения, а не недостаточной точностью модели, поэтому более сильная модель их не устраняет
  question: Объясни своими словами, почему замена модели агента на более точную и более сильную не устраняет ни захват через текст на странице, ни ущерб от необратимого действия, ни невозможность отладить длинный прогон.
  explanation: 'Ключевая мысль: три поломки — три разных места в системе. Ум модели влияет на долю успешных шагов, но не создаёт разделения каналов, не добавляет отката и не пишет журнал.'
  kind: open
  reference: 'Все три отказа лежат вне способностей модели. Первый: агент получает задание владельца и содержимое экрана одним потоком, различить их по смыслу нельзя — текст приказа выглядит как приказ независимо от того, кто его написал; нужна граница доверия по каналу поступления, реализованная кодом. Второй: у операций в интерфейсе нет отката, поэтому любая ненулевая вероятность ошибки на необратимом шаге даёт невосстановимый ущерб; снижение вероятности не даёт нуля, спасает только остановка и человек в контуре. Третий: отладка требует записи того, что происходило; если действия и кадры не сохранялись, восстанавливать нечего — это дефицит данных, а не рассуждения. Каждая поломка чинится своим механизмом в обвязке агента: проверкой недоверенного текста, подтверждением на необратимых действиях, журналом по шагам.'
