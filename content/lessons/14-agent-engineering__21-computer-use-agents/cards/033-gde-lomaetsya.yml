- concept: цена отсутствия пошаговой наблюдаемости растёт с длиной горизонта, тогда как риски инъекции и необратимого действия от длины прогона не зависят
  question: 'Одну и ту же схему агента запускают в двух режимах: сценарий из 6 действий и сценарий из 450 действий. Журнала по шагам нет ни там, ни там. Что меняется при переходе к длинному сценарию сильнее всего?'
  explanation: На шести действиях сбой находят перебором за минуту, на 450 — нет. Отсутствие трейса не увеличивает вероятность падения, оно делает падение неотлаживаемым, и эта цена масштабируется с числом шагов. Первые две поломки — доверие содержимому экрана и необратимое действие без человека — срабатывают и на коротком прогоне.
  kind: choice
  options:
    - 'Стоимость локализации сбоя: сообщение «не получилось» оставляет перебор всех выполненных действий вслепую'
    - Вероятность того, что страница содержит вредоносную инструкцию, падает
    - Необратимое действие становится обратимым, потому что после него есть ещё шаги
    - Подтверждение человеком перестаёт требоваться
