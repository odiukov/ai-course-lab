- concept: модели доступно только то, что отрисовано в текущем кадре, поэтому невидимые элементы требуют прокрутки или переключения окна
  question: Нужная кнопка находится ниже видимой области страницы или закрыта другим окном. Почему для агента, работающего по скриншотам, это принципиально иная ситуация, чем для инструмента, читающего структуру интерфейса от системы?
  explanation: 'Ключ — «модель видит ровно то, что видит человек». Отсюда практическое следствие: сценарий должен явно приводить цель в кадр, а не рассчитывать, что элемент адресуем всегда.'
  kind: open
  reference: 'Дерево элементов от системы доступности перечисляет узлы независимо от того, попали ли они в кадр: элемент за границей прокрутки или перекрытый окном всё равно есть в структуре, к нему можно обратиться напрямую. У агента, чей вход — скриншот, такого элемента просто не существует: его нет в пикселях. Значит, доступ к нему — отдельное действие в цикле: прокрутить, свернуть перекрывающее окно, переключить вкладку, снять новый скриншот и только потом кликать. Это цена универсальности: работает с любым приложением, но видимость становится обязательным условием действия.'
