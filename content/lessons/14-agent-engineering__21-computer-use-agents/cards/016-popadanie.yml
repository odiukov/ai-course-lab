- concept: отказ по разрешённой области блокирует исполнение, но не исправляет координату — это не механизм коррекции
  question: Клик по координате, лежащей вне разрешённого прямоугольника, отклонён проверкой. Что происходит с самой координатой?
  explanation: 'Разрешённая область — фильтр, а не корректор. Притягивание точки к ближайшей границе опасно вдвойне: неверная координата может быть ближе к чужому элементу, и «исправленный» клик исполнится по нему с полным одобрением проверки. Отказ обязан оставаться отказом.'
  kind: choice
  options:
    - 'Она остаётся неверной: проверка только не даёт действию исполниться, чинить её нужно отдельно — новым скриншотом, повтором шага или правкой карты областей'
    - Проверка подтягивает точку к ближайшей границе прямоугольника и отправляет исправленный клик
    - Координата заменяется центром ближайшей разрешённой области
    - Координата пересчитывается в систему координат целевого кадра и отправляется повторно
