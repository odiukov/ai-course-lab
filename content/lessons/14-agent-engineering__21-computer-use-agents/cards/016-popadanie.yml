- concept: границы разрешённой области включаются в неё — неравенства нестрогие, иначе край элемента интерфейса становится непрокликиваемым
  question: Кнопка занимает прямоугольник x от 512 до 648, y от 176 до 232. Агент выдал click(648, 176). Какой результат правильный и почему?
  explanation: Проверка вида 512 ≤ x ≤ 648 и 176 ≤ y ≤ 232 даёт «внутри». Строгие неравенства сузили бы область на пиксель с каждой стороны и превратили бы законные клики по краю кнопки в ложные отказы; при этом безопасности они не добавляют — соседний элемент начинается не на границе, а за ней.
  kind: choice
  options:
    - 'Клик разрешён: неравенства нестрогие, точка на границе принадлежит области'
    - 'Клик отклонён: границы — внешний контур, внутрь входят только точки строго между ними'
    - Клик разрешён по x, но отклонён по y, потому что верхняя граница задаёт начало отсчёта
    - 'Клик отклонён: угловые точки исключаются, так как лежат на пересечении двух границ'
