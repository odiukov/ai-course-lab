- concept: 'проверки перед действием упорядочены по стоимости: дешёвые детерминированные тесты идут раньше дорогих, первый отказ прекращает разбор'
  question: Расставь проверки классификатора, который выносит вердикт по предложенному действию, в порядке их выполнения — от самой дешёвой к самой дорогой.
  explanation: 'Поиск подстроки по тексту стоит доли миллисекунды, сравнение координат с границами — тоже. Поиск элемента под точкой требует карты областей и обхода, поэтому его зовут последним и только если предыдущие проверки прошли. Порядок важен не только ради скорости: если текст действия уже содержит заряд инъекции, само действие обсуждать нечего — вердикт block выносится без обращения к экрану.'
  kind: order
  items:
    - поиск шаблона инъекции в текстовом описании действия
    - проверка, что координата лежит внутри контракта нормализованных значений
    - проверка попадания координаты в разрешённую область карты
    - определение элемента интерфейса под координатой и решение о необратимости
  id: 029-code-assess-action-1
  fingerprint: 7d5ad414
- concept: вердикт предпусковой проверки троичный, потому что булев исход не выражает состояние «действие допустимо, но решение принимает человек»
  question: Классификатор перед исполнением действия возвращает три значения — allow, confirm, block — вместо булева «можно/нельзя». Что даёт именно третье значение?
  explanation: 'Покупка билета и удаление файла не запрещены — их заказал пользователь, — но они необратимы. Булев вердикт сминает эти два разных случая в один: «true» исполнит покупку молча, «false» сломает сценарий. Confirm — это отдельная ветка управления, а не оттенок уверенности: она останавливает цикл и передаёт решение владельцу задачи.'
  kind: choice
  options:
    - Отдельный исход для действий, которые не запрещены, но требуют передачи решения человеку, — при булевом ответе их пришлось бы либо тихо исполнить, либо отклонить
    - Отдельный исход для действий, по которым классификатор не уверен в своей оценке и хочет пересчитать вердикт
    - Отдельный исход для действий, координаты которых нужно пересчитать в другой кадр перед исполнением
    - Отдельный исход для действий, которые уже были исполнены ранее и повторяются
  correct: 0
