- concept: неизвестный тип действия уходит в отказ, потому что список безопасного составлен вручную и покрывает только проверенное
  question: Классификатор получает действие типа drag_and_drop, которого нет ни в списке безопасных, ни в списке необратимых. Какой вердикт правильный и почему?
  explanation: Список безопасного — не свойство мира, а перечень, который написал разработчик. Отсутствие типа в нём означает «не рассматривали», а не «безобидно». Запрет по умолчанию стоит одного ложного отказа и остановки сценария; разрешение по умолчанию стоит одного исполненного необратимого действия. Вариант с confirm выглядит мягче, но перекладывает на человека поток неизвестных действий вместо явного расширения списка в коде.
  kind: choice
  options:
    - 'block: список безопасных типов написан вручную, и всё, чего в нём нет, просто не проверялось — цена лишнего отказа ниже цены одного пропущенного необратимого действия'
    - 'allow: перетаскивание не тратит деньги и не удаляет данные, значит по смыслу обратимо'
    - 'confirm: любой неизвестный тип нужно показать человеку, потому что только человек может классифицировать новое действие'
    - 'allow с записью в трейс: отказ по неизвестному типу заблокирует развитие набора действий'
  correct: 0
  id: 029-code-assess-action-3
