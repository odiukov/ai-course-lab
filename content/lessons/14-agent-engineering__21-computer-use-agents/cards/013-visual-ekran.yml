- concept: координаты, пришедшие от модели, относятся к недоверенному входу, поэтому ограничение должно исполняться кодом, а не инструкцией в промпте
  question: Почему ограничение «не кликай в нижнюю полосу экрана» реализуют проверкой в коде исполнителя, а не просто фразой в системном промпте агента?
  explanation: 'Это тот же контракт о недоверенном входе, которого держатся все три продакшен-модели работы за компьютером: разрешением считаются только прямые указания пользователя, а всё пришедшее извне может нести заряд инъекции. Ограничение, живущее только в промпте, снимается тем же каналом, по которому пришла атака.'
  kind: open
  reference: 'Модель работает по скриншоту, а скриншот и всё прочее полученное содержимое считаются недоверенным входом: на странице может быть prompt-injection, который перебьёт инструкцию промпта. Координата, пришедшая от модели, — это результат её решения, а не гарантия. Проверка на стороне исполнителя детерминирована: она сравнивает числа с границами и не зависит ни от того, что модель прочитала на странице, ни от того, что она решила. Инструкция в промпте — просьба, проверка в коде — барьер.'
  id: 013-visual-ekran-3
  fingerprint: b7b025bd
