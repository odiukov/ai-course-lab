- concept: проверка допустимости стоит между переводом координат в пиксели и исполнением действия, отказ происходит до касания интерфейса
  question: Агент управляет экраном 1600×900. Модель вернула точку в долях кадра. Расставь шаги обработки одного действия в правильном порядке.
  explanation: 'Сверять доли напрямую с областью нельзя: область задана в пикселях, значит перевод идёт первым. Проверка обязана стоять перед исполнением, потому что клик необратим — отменить нажатие на «Удалить аккаунт» после факта уже невозможно, а отказ до касания стоит ноль.'
  kind: order
  items:
    - получить от модели нормализованную точку и целевое действие
    - перевести доли в пиксели реального дисплея
    - сверить полученные пиксели с разрешённой областью
    - выполнить движение мыши и клик, если точка прошла проверку
  id: 013-visual-ekran-1
  fingerprint: 9aad90a9
- concept: разрешённая область ограничивает клик географически и ничего не знает о том, какой элемент интерфейса там нарисован
  question: Экран 1600×900, разрешённая область задана как прямоугольник от (0, 0) до (1600, 720). Опасная кнопка «Оплатить» нарисована в правом нижнем углу. Модель прислала точку 0.30, 0.88 — это (480, 792). Что происходит и почему?
  explanation: 'Разрешённая область — чистая геометрия: она отвечает «внутри» или «снаружи» и не читает подписи элементов. Опасную зону защищают тем, что вырезают её из допустимой площади заранее, а не тем, что узнают кнопку в момент клика. Здесь x=480 проходит, y=792 не проходит — точка снаружи, действие не выполняется.'
  kind: choice
  options:
    - 'Клик отклонён: 792 больше верхней границы 720 по y, и никакой информации о самой кнопке для этого не требуется'
    - 'Клик отклонён: исполнитель распознал в этом месте подпись «Оплатить» и заблокировал опасный элемент'
    - 'Клик выполнен: точка попала в разрешённую область по x, а этого достаточно'
    - Клик выполнен, но помечен как требующий подтверждения человеком
  correct: 0
