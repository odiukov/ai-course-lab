<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Игрушечный экран и разрешённая область</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b2430; --muted:#5b6673;
    --screen:#f4f6f9; --edge:#39424e;
    --ok:#1d7a45; --okfill:#d9f0e2; --bad:#b02a2a; --badfill:#f7dcdc;
    --el:#dfe5ee; --elstroke:#8e99a8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --fg:#e7ecf3; --muted:#a3aebd;
      --screen:#1b2027; --edge:#8f9cad;
      --ok:#66d19a; --okfill:#1d3529; --bad:#ff8f8f; --badfill:#3a2020;
      --el:#252c35; --elstroke:#66717f;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{padding:10px 12px 12px}
  .title{font-weight:600;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fb{color:var(--bad);font-size:13px;white-space:pre-wrap}
  text{font:11px system-ui,sans-serif;fill:var(--fg)}
  text.dim{fill:var(--muted)}
  text.ok{fill:var(--ok)}
  text.bad{fill:var(--bad)}
  text.lg{font-size:12px}
  .paper{fill:var(--screen);stroke:var(--edge);stroke-width:1.5}
  .zone{fill:var(--okfill);stroke:var(--ok);stroke-width:1.5;stroke-dasharray:6 4}
  .el{fill:var(--el);stroke:var(--elstroke);stroke-width:1.2}
  .el.danger{fill:var(--badfill);stroke:var(--bad)}
  .brd{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:6 4;fill:none}
  .aok{stroke:var(--ok);stroke-width:2;fill:none}
  .aok.hd{fill:var(--ok);stroke:none}
  .abad{stroke:var(--bad);stroke-width:2;fill:none}
  .abad.hd{fill:var(--bad);stroke:none}
  .dotok{fill:var(--ok)}
  .dotbad{fill:var(--bad)}
</style>
<div class="wrap">
  <p class="title">Игрушечный экран 1280×800 и разрешённая область</p>
  <svg id="svg" viewBox="0 0 600 384" role="img"
       aria-label="Экран 1280 на 800 с тремя кнопками, разрешённой областью от (0,0) до (1280,600) и двумя кликами"></svg>
  <div id="fb" class="fb"></div>
</div>
<script>
(function(){
  var NS="http://www.w3.org/2000/svg";
  var DATA={
    screen:{w:1280,h:800},
    allowed:{x1:0,y1:0,x2:1280,y2:600},
    elements:[
      {t:"Поиск (100,60)–(500,100)",x1:100,y1:60,x2:500,y2:100,
       ax:300,ay:100,anc:"middle",dx:0,dy:14},
      {t:"Отправить (520,60)–(640,100)",x1:520,y1:60,x2:640,y2:100,
       ax:640,ay:80,anc:"start",dx:9,dy:4},
      {t:"Удалить аккаунт (1100,740)–(1260,780)",x1:1100,y1:740,x2:1260,y2:780,
       danger:true,ax:1100,ay:760,anc:"end",dx:-9,dy:4}
    ],
    zoneLabel:{t:"разрешённая область (0,0)–(1280,600)",ax:140,ay:300,anc:"start",dx:0,dy:0},
    brdLabel:{t:"y = 600",ax:0,ay:600,anc:"end",dx:-8,dy:4},
    sizeLabel:{t:"экран 1280×800",ax:0,ay:0,anc:"start",dx:0,dy:-10},
    clicks:[
      {p:{x:640,y:400},tail:{x:860,y:300},ok:true,
       t:"(640,400)",anc:"start",dx:9,dy:-3},
      {p:{x:1178,y:760},tail:{x:1178,y:520},ok:false,
       t:"(1178,760)",anc:"end",dx:-10,dy:4,
       stop:{x:1178,y:600},st:"отказ",sanc:"start",sdx:10,sdy:-5}
    ],
    legend:[
      {t:"✓  0.5, 0.5 → (640,400): x и y внутри границ — клик выполняется",cls:"ok",dy:34},
      {t:"✕  0.92, 0.95 → (1178,760): y = 760 больше 600 — отказ до касания мыши",cls:"bad",dy:52}
    ],
    head:{len:32,w:19},
    dot:16
  };

  var origin={x:100,y:28}, scale=0.36;
  function sx(x){ return origin.x + x*scale; }
  function sy(y){ return origin.y + y*scale; }

  var svg=document.getElementById("svg");
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function add(n,a){var e=el(n,a);svg.appendChild(e);return e;}
  function box(b,cls){
    return add("rect",{x:sx(b.x1),y:sy(b.y1),
      width:sx(b.x2)-sx(b.x1),height:sy(b.y2)-sy(b.y1),"class":cls});
  }
  function label(l,cls){
    var e=add("text",{x:sx(l.ax)+(l.dx||0),y:sy(l.ay)+(l.dy||0),
      "text-anchor":l.anc,"class":cls||""});
    e.textContent=l.t; return e;
  }
  function arrow(t,h,cls){
    var dx=h.x-t.x, dy=h.y-t.y, L=Math.hypot(dx,dy);
    var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
    var b={x:h.x-ux*DATA.head.len, y:h.y-uy*DATA.head.len};
    add("line",{x1:sx(t.x),y1:sy(t.y),x2:sx(b.x),y2:sy(b.y),"class":cls});
    var p=[[h.x,h.y],
           [b.x+nx*DATA.head.w/2, b.y+ny*DATA.head.w/2],
           [b.x-nx*DATA.head.w/2, b.y-ny*DATA.head.w/2]];
    add("polygon",{points:p.map(function(q){return sx(q[0])+","+sy(q[1]);}).join(" "),
      "class":cls+" hd"});
  }

  try{
    box({x1:0,y1:0,x2:DATA.screen.w,y2:DATA.screen.h},"paper");
    box(DATA.allowed,"zone");

    DATA.elements.forEach(function(e){
      box(e,"el"+(e.danger?" danger":""));
      label({t:e.t,ax:e.ax,ay:e.ay,anc:e.anc,dx:e.dx,dy:e.dy},"dim");
    });

    add("line",{x1:sx(DATA.allowed.x1),y1:sy(DATA.allowed.y2),
      x2:sx(DATA.allowed.x2),y2:sy(DATA.allowed.y2),"class":"brd"});
    label(DATA.brdLabel,"ok");
    label(DATA.zoneLabel,"ok");
    label(DATA.sizeLabel,"dim");

    DATA.clicks.forEach(function(c){
      var cls=c.ok?"aok":"abad";
      arrow(c.tail,c.p,cls);
      add("circle",{cx:sx(c.p.x),cy:sy(c.p.y),r:(sx(DATA.dot)-sx(0)),
        "class":c.ok?"dotok":"dotbad"});
      label({t:c.t,ax:c.p.x,ay:c.p.y===760?660:c.p.y,anc:c.anc,dx:c.dx,dy:c.dy},
        c.ok?"ok":"bad");
      if(c.stop){
        var s=c.stop, r=sx(DATA.dot)-sx(0);
        add("line",{x1:sx(s.x)-r,y1:sy(s.y)-r,x2:sx(s.x)+r,y2:sy(s.y)+r,"class":"abad"});
        add("line",{x1:sx(s.x)-r,y1:sy(s.y)+r,x2:sx(s.x)+r,y2:sy(s.y)-r,"class":"abad"});
        label({t:c.st,ax:s.x,ay:s.y,anc:c.sanc,dx:c.sdx,dy:c.sdy},"bad");
      }
    });

    DATA.legend.forEach(function(l){
      label({t:l.t,ax:0,ay:DATA.screen.h,anc:"start",dx:0,dy:l.dy},l.cls+" lg");
    });
  }catch(err){
    document.getElementById("fb").textContent=
      "Схема не построилась ("+err.message+"). Она должна показывать: экран 1280×800; "+
      "кнопки «Поиск» (100,60)–(500,100), «Отправить» (520,60)–(640,100), "+
      "«Удалить аккаунт» (1100,740)–(1260,780); разрешённую область (0,0)–(1280,600); "+
      "клик (640,400) — внутри, выполняется; клик (1178,760) — вне области по y, отказ.";
  }
})();
</script>
</html>
