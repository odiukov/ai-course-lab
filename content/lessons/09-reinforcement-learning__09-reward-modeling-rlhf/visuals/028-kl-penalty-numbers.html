<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Когда KL-штраф становится заметным</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f7f8fb;
      --surface: #ffffff;
      --panel: #f1f4f8;
      --panel-strong: #e6ebf2;
      --text: #172033;
      --muted: #58647a;
      --line: #aab4c4;
      --reward: #2f9e68;
      --reward-soft: #d9f2e5;
      --penalty: #d95858;
      --penalty-soft: #f8dddd;
      --result: #245fbd;
      --result-soft: #e0ebff;
      --white: #ffffff;
      --shadow: #17203318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #11151d;
        --surface: #171d27;
        --panel: #202836;
        --panel-strong: #2a3445;
        --text: #f0f4fb;
        --muted: #b1bdd0;
        --line: #68758a;
        --reward: #55c98c;
        --reward-soft: #203e31;
        --penalty: #f07878;
        --penalty-soft: #492a2e;
        --result: #78a9ff;
        --result-soft: #243b63;
        --white: #11151d;
        --shadow: #00000040;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
    }

    .diagram {
      max-width: 760px;
      margin: auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--panel-strong);
      box-shadow: 0 4px 18px var(--shadow);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 22px;
      line-height: 1.2;
    }

    .intro {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 15px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 390px;
      overflow: visible;
      background: var(--surface);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--panel-strong);
      stroke-width: 1px;
    }

    .track {
      fill: var(--panel-strong);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .remaining {
      fill: var(--reward);
    }

    .penalty {
      fill: var(--penalty);
    }

    .origin-rule,
    .leader,
    .boundary {
      fill: none;
      stroke: var(--line);
      stroke-width: 1px;
    }

    .boundary {
      stroke: var(--text);
      stroke-width: 2px;
    }

    .result-box {
      fill: var(--result-soft);
      stroke: var(--result);
      stroke-width: 2px;
    }

    .result-accent {
      fill: var(--result);
    }

    .heading {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .tag {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .equation {
      fill: var(--text);
      font-size: 16px;
      font-variant-numeric: tabular-nums;
    }

    .result-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .result-value {
      fill: var(--result);
      font-size: 22px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .callout {
      fill: var(--muted);
      font-size: 13px;
    }

    .inside-penalty {
      fill: var(--white);
      font-size: 14px;
      font-weight: bold;
      font-variant-numeric: tabular-nums;
    }

    .legend-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .legend-remaining {
      fill: var(--reward);
    }

    .legend-penalty {
      fill: var(--penalty);
    }

    .fallback {
      padding: 16px;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="diagram" aria-labelledby="diagram-title">
    <h1 id="diagram-title">Когда KL-штраф становится заметным</h1>
    <p class="intro">Одинаковые RM = 3,0 и β = 0,02 — разная накопленная цена отклонения</p>

    <svg id="chart"
         viewBox="0 0 760 390"
         width="760"
         height="390"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение KL-штрафа при KL равном 2 и 50</title>
      <desc id="svg-desc">
        При KL 2 штраф равен 0,04 и итоговая награда равна 2,96.
        При KL 50 штраф равен 1,0 и итоговая награда равна 2,0.
      </desc>
      <g id="plot"></g>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Схема должна была показать: при RM = 3,0 и β = 0,02 значение KL = 2
      даёт штраф 0,04 и итог 2,96, а KL = 50 даёт штраф 1,0 и итог 2,0.
    </div>
  </main>

  <script>
    const data = [
      {
        type: "layout",
        canvas: { width: 760, height: 390 },
        origin: { x: 70, y: 36 },
        scale: 100,
        panel: { x: -0.42, width: 6.82, height: 1.34, radius: 0.10 },
        bar: { x: 0, width: 3.0, height: 0.36, radius: 0.06 },
        resultBox: { x: 3.62, width: 2.43, height: 0.72, radius: 0.09 },
        resultAccent: { width: 0.07 },
        legend: {
          y: 3.28,
          swatchWidth: 0.18,
          swatchHeight: 0.18,
          radius: 0.03,
          firstX: 0,
          firstTextX: 0.27,
          secondX: 3.12,
          secondTextX: 3.39
        },
        originRule: { top: 0.46, bottom: 2.72 }
      },
      {
        type: "case",
        kl: 2,
        beta: 0.02,
        reward: 3.0,
        penalty: 0.04,
        result: 2.96,
        panelY: 0.02,
        headingY: 0.28,
        barY: 0.55,
        lowerY: 1.13,
        resultBoxY: 0.45,
        resultLabelY: 0.69,
        resultValueY: 0.94,
        leaderStart: { x: 2.98, y: 0.91 },
        leaderTurn: { x: 2.98, y: 1.00 },
        leaderEnd: { x: 2.88, y: 1.00 },
        title: "KL = 2 · почти незаметно",
        betaLabel: "β = 0,02",
        equation: "3,0 − 0,02 × 2 = 2,96",
        resultLabel: "ИТОГОВАЯ НАГРАДА",
        resultText: "2,96",
        remainingText: "остаётся 2,96",
        penaltyText: "штраф 0,04",
        penaltyAnchor: { x: 2.88, y: 1.13 }
      },
      {
        type: "case",
        kl: 50,
        beta: 0.02,
        reward: 3.0,
        penalty: 1.0,
        result: 2.0,
        panelY: 1.54,
        headingY: 1.80,
        barY: 2.07,
        lowerY: 2.65,
        resultBoxY: 1.97,
        resultLabelY: 2.21,
        resultValueY: 2.46,
        title: "KL = 50 · штраф уже заметен",
        betaLabel: "β = 0,02",
        equation: "3,0 − 0,02 × 50 = 2,0",
        resultLabel: "ИТОГОВАЯ НАГРАДА",
        resultText: "2,0",
        remainingText: "остаётся 2,0",
        penaltyText: "−1,0",
        penaltyAnchor: { x: 2.50, y: 2.25 }
      }
    ];

    const layout = data.find(item => item.type === "layout");
    const origin = layout.origin;
    const scale = layout.scale;

    function sx(x) {
      return origin.x + x * scale;
    }

    function sy(y) {
      return origin.y + y * scale;
    }

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const chart = document.getElementById("chart");
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");

      function node(tag, attributes, content) {
        const element = document.createElementNS(namespace, tag);

        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, String(value));
        }

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      }

      function rectangle(x, y, width, height, radius, className) {
        return node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(radius) - sx(0),
          ry: sy(radius) - sy(0),
          class: className
        });
      }

      function line(x1, y1, x2, y2, className) {
        return node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });
      }

      function label(x, y, value, className, anchor) {
        return node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, value);
      }

      plot.append(
        line(
          layout.bar.x,
          layout.originRule.top,
          layout.bar.x,
          layout.originRule.bottom,
          "origin-rule"
        )
      );

      for (const row of data.filter(item => item.type === "case")) {
        const group = node("g", {
          "aria-label": row.title
        });

        group.append(
          rectangle(
            layout.panel.x,
            row.panelY,
            layout.panel.width,
            layout.panel.height,
            layout.panel.radius,
            "panel"
          )
        );

        group.append(
          label(
            layout.bar.x,
            row.headingY,
            row.title,
            "heading",
            "start"
          )
        );

        group.append(
          label(
            layout.bar.x + layout.bar.width,
            row.headingY,
            row.betaLabel,
            "tag",
            "end"
          )
        );

        group.append(
          rectangle(
            layout.bar.x,
            row.barY,
            layout.bar.width,
            layout.bar.height,
            layout.bar.radius,
            "track"
          )
        );

        group.append(
          rectangle(
            layout.bar.x,
            row.barY,
            row.result,
            layout.bar.height,
            layout.bar.radius,
            "remaining"
          )
        );

        group.append(
          rectangle(
            row.result,
            row.barY,
            row.penalty,
            layout.bar.height,
            layout.bar.radius,
            "penalty"
          )
        );

        group.append(
          line(
            row.result,
            row.barY,
            row.result,
            row.barY + layout.bar.height,
            "boundary"
          )
        );

        group.append(
          label(
            row.result / row.result * row.result / 2,
            row.lowerY,
            row.remainingText,
            "callout",
            "middle"
          )
        );

        if (row.leaderStart) {
          group.append(
            line(
              row.leaderStart.x,
              row.leaderStart.y,
              row.leaderTurn.x,
              row.leaderTurn.y,
              "leader"
            )
          );

          group.append(
            line(
              row.leaderTurn.x,
              row.leaderTurn.y,
              row.leaderEnd.x,
              row.leaderEnd.y,
              "leader"
            )
          );

          group.append(
            label(
              row.penaltyAnchor.x,
              row.penaltyAnchor.y,
              row.penaltyText,
              "callout",
              "end"
            )
          );
        } else {
          group.append(
            label(
              row.penaltyAnchor.x,
              row.penaltyAnchor.y,
              row.penaltyText,
              "inside-penalty",
              "middle"
            )
          );
        }

        group.append(
          rectangle(
            layout.resultBox.x,
            row.resultBoxY,
            layout.resultBox.width,
            layout.resultBox.height,
            layout.resultBox.radius,
            "result-box"
          )
        );

        group.append(
          rectangle(
            layout.resultBox.x,
            row.resultBoxY,
            layout.resultAccent.width,
            layout.resultBox.height,
            layout.resultBox.radius,
            "result-accent"
          )
        );

        group.append(
          label(
            layout.resultBox.x + 0.22,
            row.resultLabelY,
            row.resultLabel,
            "result-label",
            "start"
          )
        );

        group.append(
          label(
            layout.resultBox.x + 0.22,
            row.resultValueY,
            row.resultText,
            "result-value",
            "start"
          )
        );

        group.append(
          label(
            layout.resultBox.x + layout.resultBox.width,
            row.resultBoxY - 0.13,
            row.equation,
            "equation",
            "end"
          )
        );

        plot.append(group);
      }

      plot.append(
        rectangle(
          layout.legend.firstX,
          layout.legend.y,
          layout.legend.swatchWidth,
          layout.legend.swatchHeight,
          layout.legend.radius,
          "legend-remaining"
        ),
        label(
          layout.legend.firstTextX,
          layout.legend.y + layout.legend.swatchHeight / 2,
          "остаётся после штрафа",
          "legend-label",
          "start"
        ),
        rectangle(
          layout.legend.secondX,
          layout.legend.y,
          layout.legend.swatchWidth,
          layout.legend.swatchHeight,
          layout.legend.radius,
          "legend-penalty"
        ),
        label(
          layout.legend.secondTextX,
          layout.legend.y + layout.legend.swatchHeight / 2,
          "цена отклонения",
          "legend-label",
          "start"
        )
      );

      chart.hidden = false;
      fallback.hidden = true;
    } catch (error) {
      document.getElementById("chart").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
