<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одно обновление модели награды в числах</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-stroke: #c7cfdd;
      --text: #172033;
      --muted: #566176;
      --good: #166534;
      --good-fill: #dcfce7;
      --good-stroke: #4ade80;
      --bad: #a12323;
      --bad-fill: #fee2e2;
      --bad-stroke: #f87171;
      --neutral-fill: #eef2f7;
      --neutral-stroke: #aab5c5;
      --formula-fill: #fff7d6;
      --formula-stroke: #d7a91f;
      --accent: #3157b7;
      --note-fill: #e8efff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #182234;
        --panel-stroke: #40506a;
        --text: #eef3fb;
        --muted: #b7c1d2;
        --good: #86efac;
        --good-fill: #173b2a;
        --good-stroke: #42b76b;
        --bad: #fca5a5;
        --bad-fill: #462323;
        --bad-stroke: #d76060;
        --neutral-fill: #253248;
        --neutral-stroke: #65758e;
        --formula-fill: #453a18;
        --formula-stroke: #d6aa2d;
        --accent: #9ab5ff;
        --note-fill: #1e315e;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h1 {
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--page);
    }

    #fallback {
      font-size: 16px;
      color: var(--text);
      background: var(--panel);
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <h1 id="diagram-title">Одно обновление модели награды в числах</h1>

  <svg
    id="diagram"
    viewBox="0 0 1200 420"
    width="1200"
    height="420"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-description"
  >
    <desc id="diagram-description">
      Два ответа начинают с нулевыми баллами. Вероятность предпочтения равна
      одной второй. При скорости обучения одна десятая вес слова «ясно»
      увеличивается, вес слова «выдумка» уменьшается, а общий токен «ответ»
      остаётся без изменения.
    </desc>
  </svg>

  <p id="fallback" hidden>
    Схема должна была показать два ответа с начальными баллами ноль,
    sigmoid от нуля равной 0,5 и обновление весов хорошего и плохого токенов
    на плюс и минус 0,05.
  </p>

  <script>
    const data = [{
      ns: "http://www.w3.org/2000/svg",
      zero: 0,
      origin: { x: 0, y: 0 },
      scale: 10,
      canvas: { width: 1200, height: 420 },
      stroke: { thin: 0.12, normal: 0.18, strong: 0.24 },
      font: {
        panel: 1.68,
        body: 1.28,
        value: 1.42,
        formula: 1.46,
        note: 1.18
      },
      padding: { text: 0.8 },
      arrow: { head: 1.25, wing: 0.62 },

      rectangles: [
        { a: { x: 3, y: 5.5 }, b: { x: 35, y: 34.2 }, cls: "panel" },
        { a: { x: 38, y: 5.5 }, b: { x: 84, y: 34.2 }, cls: "panel" },
        { a: { x: 87, y: 5.5 }, b: { x: 117, y: 34.2 }, cls: "panel" },

        { a: { x: 5, y: 7.2 }, b: { x: 33, y: 14.4 }, cls: "goodBox" },
        { a: { x: 5, y: 16.2 }, b: { x: 33, y: 23.4 }, cls: "badBox" },
        { a: { x: 5, y: 26 }, b: { x: 33, y: 32.5 }, cls: "neutralBox" },

        { a: { x: 40, y: 7.2 }, b: { x: 82, y: 10.8 }, cls: "formulaBox" },
        { a: { x: 40, y: 12.1 }, b: { x: 52, y: 16.4 }, cls: "goodBox" },
        { a: { x: 69, y: 12.1 }, b: { x: 82, y: 16.4 }, cls: "goodBox" },
        { a: { x: 40, y: 18.2 }, b: { x: 52, y: 22.5 }, cls: "badBox" },
        { a: { x: 69, y: 18.2 }, b: { x: 82, y: 22.5 }, cls: "badBox" },
        { a: { x: 40, y: 24.3 }, b: { x: 52, y: 28.6 }, cls: "neutralBox" },
        { a: { x: 63.5, y: 24.3 }, b: { x: 82, y: 28.6 }, cls: "neutralBox" },

        { a: { x: 89, y: 7.2 }, b: { x: 115, y: 14.4 }, cls: "goodBox" },
        { a: { x: 89, y: 16.2 }, b: { x: 115, y: 23.4 }, cls: "badBox" },
        { a: { x: 89, y: 26 }, b: { x: 115, y: 32.5 }, cls: "neutralBox" },

        { a: { x: 3, y: 36 }, b: { x: 117, y: 40.5 }, cls: "noteBox" }
      ],

      arrows: [
        {
          from: { x: 53.3, y: 14.25 },
          to: { x: 67.7, y: 14.25 },
          cls: "goodArrow"
        },
        {
          from: { x: 53.3, y: 20.35 },
          to: { x: 67.7, y: 20.35 },
          cls: "badArrow"
        },
        {
          from: { x: 53.3, y: 26.45 },
          to: { x: 62.2, y: 26.45 },
          cls: "neutralArrow"
        }
      ],

      texts: [
        {
          x: 19, y: 3.5, text: "До обновления",
          anchor: "middle", font: "panel", cls: "heading"
        },
        {
          x: 61, y: 3.5, text: "Шаг градиента",
          anchor: "middle", font: "panel", cls: "heading"
        },
        {
          x: 102, y: 3.5, text: "После обновления",
          anchor: "middle", font: "panel", cls: "heading"
        },

        {
          x: 19, y: 9.65, text: "выбранный: «ответ» + «ясно»",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 19, y: 12.45, text: "балл 0",
          anchor: "middle", font: "value", cls: "goodText"
        },
        {
          x: 19, y: 18.65, text: "отклонённый: «ответ» + «выдумка»",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 19, y: 21.45, text: "балл 0",
          anchor: "middle", font: "value", cls: "badText"
        },
        {
          x: 19, y: 28.25, text: "разница баллов: 0",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 19, y: 30.65, text: "sigmoid(0) = 0,5",
          anchor: "middle", font: "value", cls: "accentText"
        },

        {
          x: 61, y: 9, text: "0,1 × (1 − 0,5) = 0,05",
          anchor: "middle", font: "formula", cls: "formulaText"
        },
        {
          x: 46, y: 14.25, text: "«ясно»",
          anchor: "middle", font: "body", cls: "goodText"
        },
        {
          x: 75.5, y: 14.25, text: "вес +0,05",
          anchor: "middle", font: "value", cls: "goodText"
        },
        {
          x: 46, y: 20.35, text: "«выдумка»",
          anchor: "middle", font: "body", cls: "badText"
        },
        {
          x: 75.5, y: 20.35, text: "вес −0,05",
          anchor: "middle", font: "value", cls: "badText"
        },
        {
          x: 46, y: 26.45, text: "«ответ»",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 72.75, y: 26.45, text: "+0,05 − 0,05 = 0",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 61, y: 31.55, text: "общее слово не помогает различить ответы",
          anchor: "middle", font: "note", cls: "mutedText"
        },

        {
          x: 102, y: 9.65, text: "выбранный ответ",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 102, y: 12.45, text: "балл +0,05",
          anchor: "middle", font: "value", cls: "goodText"
        },
        {
          x: 102, y: 18.65, text: "отклонённый ответ",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 102, y: 21.45, text: "балл −0,05",
          anchor: "middle", font: "value", cls: "badText"
        },
        {
          x: 102, y: 28.25, text: "разница баллов: 0,1",
          anchor: "middle", font: "body", cls: "mainText"
        },
        {
          x: 102, y: 30.65, text: "sigmoid(0,1) ≈ 0,525",
          anchor: "middle", font: "value", cls: "accentText"
        },

        {
          x: 60, y: 38.25,
          text: "Повтор той же пары: следующая поправка 0,0475 — уже меньше.",
          anchor: "middle", font: "body", cls: "mainText"
        }
      ]
    }];

    const [d] = data;
    const origin = d.origin;
    const scale = d.scale;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const make = (tag, attributes, content) => {
        const element = document.createElementNS(d.ns, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        if (content !== undefined) element.textContent = content;
        return element;
      };

      const strokeSize = value => Math.abs(sx(value) - sx(d.zero));
      const fontSize = value => Math.abs(sy(value) - sy(d.zero));

      const classStyle = {
        panel: {
          fill: "var(--panel)",
          stroke: "var(--panel-stroke)",
          width: d.stroke.normal
        },
        goodBox: {
          fill: "var(--good-fill)",
          stroke: "var(--good-stroke)",
          width: d.stroke.normal
        },
        badBox: {
          fill: "var(--bad-fill)",
          stroke: "var(--bad-stroke)",
          width: d.stroke.normal
        },
        neutralBox: {
          fill: "var(--neutral-fill)",
          stroke: "var(--neutral-stroke)",
          width: d.stroke.thin
        },
        formulaBox: {
          fill: "var(--formula-fill)",
          stroke: "var(--formula-stroke)",
          width: d.stroke.normal
        },
        noteBox: {
          fill: "var(--note-fill)",
          stroke: "var(--accent)",
          width: d.stroke.thin
        }
      };

      d.rectangles.forEach(item => {
        const style = classStyle[item.cls];
        svg.appendChild(make("rect", {
          x: sx(item.a.x),
          y: sy(item.a.y),
          width: sx(item.b.x) - sx(item.a.x),
          height: sy(item.b.y) - sy(item.a.y),
          fill: style.fill,
          stroke: style.stroke,
          "stroke-width": strokeSize(style.width)
        }));
      });

      const arrowStyle = {
        goodArrow: "var(--good)",
        badArrow: "var(--bad)",
        neutralArrow: "var(--muted)"
      };

      d.arrows.forEach(item => {
        const color = arrowStyle[item.cls];
        const dx = item.to.x - item.from.x;
        const dy = item.to.y - item.from.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const baseX = item.to.x - ux * d.arrow.head;
        const baseY = item.to.y - uy * d.arrow.head;
        const sideX = -uy * d.arrow.wing;
        const sideY = ux * d.arrow.wing;

        svg.appendChild(make("line", {
          x1: sx(item.from.x),
          y1: sy(item.from.y),
          x2: sx(item.to.x),
          y2: sy(item.to.y),
          stroke: color,
          "stroke-width": strokeSize(d.stroke.strong),
          "stroke-linecap": "round"
        }));

        svg.appendChild(make("path", {
          d: [
            "M", sx(item.to.x), sy(item.to.y),
            "L", sx(baseX + sideX), sy(baseY + sideY),
            "L", sx(baseX - sideX), sy(baseY - sideY),
            "Z"
          ].join(" "),
          fill: color
        }));
      });

      const textColor = {
        heading: "var(--text)",
        mainText: "var(--text)",
        mutedText: "var(--muted)",
        goodText: "var(--good)",
        badText: "var(--bad)",
        accentText: "var(--accent)",
        formulaText: "var(--text)"
      };

      d.texts.forEach(item => {
        const element = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          fill: textColor[item.cls],
          "font-size": fontSize(d.font[item.font]),
          "text-anchor": item.anchor,
          "dominant-baseline": "middle",
          "font-weight": item.cls === "heading" ||
            item.cls === "goodText" ||
            item.cls === "badText" ||
            item.cls === "accentText" ||
            item.cls === "formulaText" ? "bold" : "normal"
        }, item.text);
        svg.appendChild(element);
      });
    } catch (error) {
      svg.setAttribute("hidden", "");
      fallback.hidden = false;
    }
  </script>
</body>
</html>
