<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как четыре ограничения сокращают список инструментов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #596579;
      --line: #8390a5;
      --guide: #c7ced9;
      --stage-a: #dcecff;
      --stage-b: #dff3eb;
      --stage-c: #fff0cf;
      --stage-d: #eadffd;
      --accent-a: #2467b2;
      --accent-b: #17745d;
      --accent-c: #9b6000;
      --accent-d: #6840a3;
      --reject: #a33b45;
      --reject-soft: #f6e2e4;
      --winner: #d8f1df;
      --winner-line: #24733b;
      --card: #eef1f6;
      --shadow: #d9dee7;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      background: var(--panel);
      border: 1px solid var(--guide);
      overflow: hidden;
    }

    h2 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .stage {
      width: 100%;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
    }

    .main-label {
      fill: var(--ink);
      font-size: 17px;
      font-weight: 700;
    }

    .step-count {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .small-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .section-label {
      fill: var(--reject);
      font-size: 13px;
      font-weight: 750;
    }

    .reject-label {
      fill: var(--reject);
      font-size: 14px;
      font-weight: 650;
    }

    .winner-label {
      fill: var(--winner-line);
      font-size: 17px;
      font-weight: 750;
    }

    .funnel-piece {
      stroke: var(--panel);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .funnel-outline {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .exit-line {
      stroke: var(--reject);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .exit-head {
      fill: var(--reject);
    }

    .candidate-card {
      fill: var(--card);
      stroke: var(--guide);
      stroke-width: 1px;
    }

    .candidate-mark {
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .winner-card {
      fill: var(--winner);
      stroke: var(--winner-line);
      stroke-width: 2px;
    }

    .winner-path {
      fill: none;
      stroke: var(--winner-line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .reject-chip {
      fill: var(--reject-soft);
      stroke: var(--reject);
      stroke-width: 1px;
    }

    .reject-cross {
      stroke: var(--reject);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .fallback {
      color: var(--ink);
      font-size: 16px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --ink: #f1f4f9;
        --muted: #b8c2d1;
        --line: #8491a6;
        --guide: #3d485b;
        --stage-a: #183c64;
        --stage-b: #174d42;
        --stage-c: #614715;
        --stage-d: #432b68;
        --accent-a: #8fc5ff;
        --accent-b: #79d8bd;
        --accent-c: #ffd27d;
        --accent-d: #c7a3ff;
        --reject: #ff9ca5;
        --reject-soft: #502b32;
        --winner: #173f25;
        --winner-line: #75d68d;
        --card: #252d3b;
        --shadow: #0d1118;
      }
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-heading">
    <h2 id="diagram-heading">Как четыре ограничения сокращают список инструментов</h2>
    <div id="stage" class="stage">
      <p class="fallback">
        Восемь инструментов проходят четыре обязательных фильтра:
        голый SDK, open-source лицензия, нулевой бюджет и self-host.
        В финале остаются Langfuse и Opik.
      </p>
    </div>
  </figure>

  <script>
    const diagram = [{
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      canvas: { x: 0, y: 0, width: 1200, height: 500 },
      units: { two: 2 },
      candidateTitle: {
        x: 600, y: 20,
        text: "8 исходных инструментов",
        anchor: "middle"
      },
      candidateCards: [
        { x: 310, y: 34, width: 62, height: 34, markX1: 326, markX2: 356, markY: 51 },
        { x: 384, y: 34, width: 62, height: 34, markX1: 400, markX2: 430, markY: 51 },
        { x: 458, y: 34, width: 62, height: 34, markX1: 474, markX2: 504, markY: 51 },
        { x: 532, y: 34, width: 62, height: 34, markX1: 548, markX2: 578, markY: 51 },
        { x: 606, y: 34, width: 62, height: 34, markX1: 622, markX2: 652, markY: 51 },
        { x: 680, y: 34, width: 62, height: 34, markX1: 696, markX2: 726, markY: 51 },
        { x: 754, y: 34, width: 62, height: 34, markX1: 770, markX2: 800, markY: 51 },
        { x: 828, y: 34, width: 62, height: 34, markX1: 844, markX2: 874, markY: 51 }
      ],
      rejectedTitle: {
        x: 980, y: 89,
        text: "ОТСЕЯНО",
        anchor: "start"
      },
      stages: [
        {
          points: [
            { x: 300, y: 88 },
            { x: 900, y: 88 },
            { x: 830, y: 158 },
            { x: 370, y: 158 }
          ],
          className: "stage-a",
          label: "Голый SDK",
          count: "8 → 5",
          labelX: 600, labelY: 116,
          countX: 600, countY: 140,
          exit: {
            fromX: 865, toX: 955, y: 123,
            headBackX: 943, headTopY: 116, headBottomY: 130
          },
          rejectChip: {
            x: 975, y: 107, width: 34, height: 32,
            crossLeft: 985, crossRight: 999,
            crossTop: 116, crossBottom: 130
          },
          rejectLabel: {
            x: 1020, y: 128,
            text: "стек не подходит · 3",
            anchor: "start"
          }
        },
        {
          points: [
            { x: 370, y: 158 },
            { x: 830, y: 158 },
            { x: 790, y: 228 },
            { x: 410, y: 228 }
          ],
          className: "stage-b",
          label: "Open-source лицензия",
          count: "5 → 4",
          labelX: 600, labelY: 186,
          countX: 600, countY: 210,
          exit: {
            fromX: 810, toX: 955, y: 193,
            headBackX: 943, headTopY: 186, headBottomY: 200
          },
          rejectChip: {
            x: 975, y: 177, width: 34, height: 32,
            crossLeft: 985, crossRight: 999,
            crossTop: 186, crossBottom: 200
          },
          rejectLabel: {
            x: 1020, y: 198,
            text: "закрытая лицензия · 1",
            anchor: "start"
          }
        },
        {
          points: [
            { x: 410, y: 228 },
            { x: 790, y: 228 },
            { x: 750, y: 298 },
            { x: 450, y: 298 }
          ],
          className: "stage-c",
          label: "Нулевой бюджет",
          count: "4 → 3",
          labelX: 600, labelY: 256,
          countX: 600, countY: 280,
          exit: {
            fromX: 770, toX: 955, y: 263,
            headBackX: 943, headTopY: 256, headBottomY: 270
          },
          rejectChip: {
            x: 975, y: 247, width: 34, height: 32,
            crossLeft: 985, crossRight: 999,
            crossTop: 256, crossBottom: 270
          },
          rejectLabel: {
            x: 1020, y: 268,
            text: "не укладывается в €0 · 1",
            anchor: "start"
          }
        },
        {
          points: [
            { x: 450, y: 298 },
            { x: 750, y: 298 },
            { x: 705, y: 368 },
            { x: 495, y: 368 }
          ],
          className: "stage-d",
          label: "Обязательный self-host",
          count: "3 → 2",
          labelX: 600, labelY: 326,
          countX: 600, countY: 350,
          exit: {
            fromX: 728, toX: 955, y: 333,
            headBackX: 943, headTopY: 326, headBottomY: 340
          },
          rejectChip: {
            x: 975, y: 317, width: 34, height: 32,
            crossLeft: 985, crossRight: 999,
            crossTop: 326, crossBottom: 340
          },
          rejectLabel: {
            x: 1020, y: 338,
            text: "нет self-host · 1",
            anchor: "start"
          }
        }
      ],
      outline: [
        { x: 300, y: 88 },
        { x: 900, y: 88 },
        { x: 705, y: 368 },
        { x: 495, y: 368 }
      ],
      finalTitle: {
        x: 600, y: 400,
        text: "Финал: 2 реальных кандидата",
        anchor: "middle"
      },
      branches: [
        { x1: 600, y1: 368, x2: 600, y2: 410 },
        { x1: 600, y1: 410, x2: 532, y2: 424 },
        { x1: 600, y1: 410, x2: 668, y2: 424 }
      ],
      winners: [
        { x: 460, y: 424, width: 144, height: 48, labelX: 532, labelY: 455, text: "Langfuse" },
        { x: 596, y: 424, width: 144, height: 48, labelX: 668, labelY: 455, text: "Opik" }
      ],
      footer: {
        x: 600, y: 492,
        text: "Не рейтинг функций, а пересечение обязательных условий",
        anchor: "middle"
      }
    }];

    const [data] = diagram;
    const origin = Object.freeze(data.origin);
    const scale = Object.freeze(data.scale);

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const stage = document.getElementById("stage");

      const make = (name, attributes = {}) => {
        const node = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, value);
        }
        return node;
      };

      const addText = (parent, item, className) => {
        const node = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor || "middle",
          class: className
        });
        node.textContent = item.text;
        parent.append(node);
        return node;
      };

      const addLine = (parent, item, className) => {
        parent.append(make("line", {
          x1: sx(item.x1),
          y1: sy(item.y1),
          x2: sx(item.x2),
          y2: sy(item.y2),
          class: className
        }));
      };

      const addRect = (parent, item, className) => {
        parent.append(make("rect", {
          x: sx(item.x),
          y: sy(item.y),
          width: sx(item.x + item.width) - sx(item.x),
          height: sy(item.y + item.height) - sy(item.y),
          class: className
        }));
      };

      const addPolygon = (parent, points, className) => {
        const value = points
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
        parent.append(make("polygon", {
          points: value,
          class: className
        }));
      };

      const svg = make("svg", {
        width: sx(data.canvas.width) - sx(data.canvas.x),
        height: sy(data.canvas.height) - sy(data.canvas.y),
        viewBox: [
          sx(data.canvas.x),
          sy(data.canvas.y),
          sx(data.canvas.width) - sx(data.canvas.x),
          sy(data.canvas.height) - sy(data.canvas.y)
        ].join(" "),
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "svg-title svg-description"
      });

      const title = make("title", { id: "svg-title" });
      title.textContent =
        "Воронка выбора инструментов наблюдаемости для LLM";
      svg.append(title);

      const description = make("desc", { id: "svg-description" });
      description.textContent =
        "Из восьми инструментов после фильтров голого SDK, open-source лицензии, нулевого бюджета и обязательного self-host остаются Langfuse и Opik.";
      svg.append(description);

      addText(svg, data.candidateTitle, "small-label");

      const cards = make("g", { "aria-hidden": "true" });
      for (const card of data.candidateCards) {
        addRect(cards, card, "candidate-card");
        addLine(cards, {
          x1: card.markX1,
          y1: card.markY,
          x2: card.markX2,
          y2: card.markY
        }, "candidate-mark");
      }
      svg.append(cards);

      addText(svg, data.rejectedTitle, "section-label");

      for (const item of data.stages) {
        addPolygon(svg, item.points, `funnel-piece ${item.className}`);

        addText(svg, {
          x: item.labelX,
          y: item.labelY,
          text: item.label,
          anchor: "middle"
        }, "main-label");

        addText(svg, {
          x: item.countX,
          y: item.countY,
          text: item.count,
          anchor: "middle"
        }, "step-count");

        addLine(svg, {
          x1: item.exit.fromX,
          y1: item.exit.y,
          x2: item.exit.toX,
          y2: item.exit.y
        }, "exit-line");

        addPolygon(svg, [
          { x: item.exit.toX, y: item.exit.y },
          { x: item.exit.headBackX, y: item.exit.headTopY },
          { x: item.exit.headBackX, y: item.exit.headBottomY }
        ], "exit-head");

        addRect(svg, item.rejectChip, "reject-chip");

        addLine(svg, {
          x1: item.rejectChip.crossLeft,
          y1: item.rejectChip.crossTop,
          x2: item.rejectChip.crossRight,
          y2: item.rejectChip.crossBottom
        }, "reject-cross");

        addLine(svg, {
          x1: item.rejectChip.crossRight,
          y1: item.rejectChip.crossTop,
          x2: item.rejectChip.crossLeft,
          y2: item.rejectChip.crossBottom
        }, "reject-cross");

        addText(svg, item.rejectLabel, "reject-label");
      }

      addPolygon(svg, data.outline, "funnel-outline");

      for (const branch of data.branches) {
        addLine(svg, branch, "winner-path");
      }

      addText(svg, data.finalTitle, "main-label");

      for (const winner of data.winners) {
        addRect(svg, winner, "winner-card");
        addText(svg, {
          x: winner.labelX,
          y: winner.labelY,
          text: winner.text,
          anchor: "middle"
        }, "winner-label");
      }

      addText(svg, data.footer, "small-label");
      stage.replaceChildren(svg);
    } catch (error) {
      const stage = document.getElementById("stage");
      stage.textContent =
        "Схема должна была показать, как четыре обязательных фильтра сокращают 8 инструментов до Langfuse и Opik.";
      stage.classList.add("fallback");
    }
  </script>
</body>
</html>
