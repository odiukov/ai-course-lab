- concept: порог Бонферрони для отдельного теста равен общему уровню значимости, делённому на число проверок
  question: Исследователь одновременно проводит 8 статистических тестов и применяет поправку Бонферрони к общему уровню значимости 0,04. Какой порог p-value нужно установить для каждого теста?
  explanation: 'По поправке Бонферрони порог отдельного теста равен α/m: 0,04/8 = 0,005. Нулевую гипотезу отвергают только при p-value ниже этого порога.'
  kind: numeric
  answer: 0.005
  tolerance: 0.00001
  id: 040-bonferroni-1
  fingerprint: cd371e06
- concept: строгость поправки Бонферрони снижает риск ложных открытий ценой уменьшения статистической мощности
  question: Объясни своими словами, почему поправка Бонферрони при большом числе проверок может помешать обнаружить реальный эффект.
  explanation: Бонферрони защищает весь набор проверок, ужесточая порог каждой из них. Такая консервативность уменьшает число ложноположительных решений, но одновременно повышает риск ложноотрицательных решений.
  kind: open
  reference: 'Чем больше проверок, тем меньше скорректированный порог для каждого теста. Поэтому для отклонения нулевой гипотезы требуется более сильное свидетельство: ложных открытий становится меньше, но растёт вероятность не признать значимым существующий эффект.'
  id: 040-bonferroni-2
  fingerprint: 9dd6137b
