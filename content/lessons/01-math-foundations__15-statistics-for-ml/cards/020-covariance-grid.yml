- concept: знак ковариации показывает направление линейного совместного изменения признаков
  question: |-
    Строки и столбцы ковариационной матрицы соответствуют признакам A, B и C:

    | 16 | 8 | −6 |
    | 8 | 9 | 2 |
    | −6 | 2 | 49 |

    Какой вывод корректен?
  explanation: Положительная ковариация A и B указывает на согласованное изменение, а отрицательная ковариация A и C — на изменение в противоположных направлениях. Ковариация описывает тенденцию, а не гарантированную зависимость каждого наблюдения.
  kind: choice
  options:
    - A и B склонны отклоняться в одну сторону, а A и C — в противоположные
    - B изменяется сильнее, чем A
    - A и C склонны отклоняться в одну сторону
    - A и B статистически независимы
  correct: 0
  id: 020-covariance-grid-1
  fingerprint: f9573cf9
- concept: абсолютные величины ковариаций нельзя напрямую сравнивать при разных масштабах признаков
  question: Аналитик объявил одну пару признаков более тесно связанной, потому что абсолютная величина её ковариации больше. Объясни, почему такого сравнения недостаточно и какую меру лучше использовать.
  explanation: Если изменить единицы измерения признака, ковариация изменится, хотя сама структура связи останется прежней. Корреляция устраняет влияние масштаба и позволяет сопоставлять разные пары признаков.
  kind: open
  reference: Величина ковариации зависит от единиц измерения и масштаба обоих признаков, поэтому большая абсолютная ковариация не обязательно означает более сильную линейную связь. Для сравнения следует использовать корреляцию, которая нормирует ковариацию стандартными отклонениями признаков.
  id: 020-covariance-grid-2
  fingerprint: b3f3909b
