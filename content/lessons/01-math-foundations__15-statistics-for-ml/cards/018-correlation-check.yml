- concept: для порядковых данных выбирают корреляцию Спирмена, поскольку она сравнивает ранги, а не расстояния между значениями
  question: Почему для сравнения ответов «плохо», «удовлетворительно», «хорошо» и «отлично» обычно уместнее корреляция Спирмена, даже если этим ответам присвоены числовые коды?
  explanation: Числовая запись не превращает порядковую шкалу в непрерывную. Для Спирмена важно взаимное расположение наблюдений в порядке, тогда как Пирсон опирается на величины отклонений и линейную связь.
  kind: open
  reference: Эти ответы задают порядок, но не гарантируют равные расстояния между соседними уровнями. Спирмен использует ранги и поэтому не требует интерпретировать разности между числовыми кодами как содержательные.
