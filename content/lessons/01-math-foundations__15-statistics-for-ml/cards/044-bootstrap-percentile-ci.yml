- concept: границы центрального процентильного интервала отсекают поровну суммарную вероятность двух хвостов
  question: Получены 2400 значений метрики на бутстрэп-выборках. Какие процентили нужно взять для центрального 88%-ного интервала?
  explanation: За пределами центральных 88% остаются 12%, которые делятся поровну между двумя хвостами. Поэтому границами служат 6-й и 94-й процентили. Аналогично, для показанного в уроке 95%-ного интервала используются 2,5-й и 97,5-й процентили.
  kind: choice
  options:
    - 6-й и 94-й
    - 12-й и 88-й
    - 11-й и 89-й
    - 1-й и 99-й
  correct: 0
  id: 044-bootstrap-percentile-ci-1
  fingerprint: 46d6f8b9
- concept: процентильный бутстрэп-интервал может быть несимметричен относительно точечной оценки
  question: Объясни своими словами, почему границы процентильного бутстрэп-интервала не обязаны находиться на одинаковом расстоянии от исходной оценки метрики.
  explanation: Метрики вроде F1 и AUC не обязаны иметь нормальное или симметричное выборочное распределение. Поэтому процентильный метод отдельно выбирает нижнюю и верхнюю границы из эмпирического распределения и сохраняет его возможную асимметрию.
  kind: open
  reference: Распределение бутстрэп-значений метрики может быть асимметричным. Границы берутся непосредственно как нижний и верхний процентили этого распределения, а не вычисляются по схеме «оценка плюс-минус одинаковая погрешность».
  id: 044-bootstrap-percentile-ci-2
  fingerprint: 4e9098aa
