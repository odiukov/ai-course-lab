- concept: для малой выборки парных и явно ненормальных результатов подходит критерий знаковых рангов Уилкоксона
  question: Две ML-модели оценили на одних и тех же фолдах. Выборка разностей мала, распределение сильно скошено и содержит тяжёлый выброс. Какой тест уместнее использовать для сравнения моделей?
  explanation: Результаты образуют пары, поскольку модели проверялись на одинаковых фолдах. При малой, явно ненормальной выборке с тяжёлым выбросом непараметрический критерий Уилкоксона обычно уместнее парного t-теста. Манн — Уитни предназначен для независимых групп.
  kind: choice
  options:
    - Парный t-тест
    - Критерий знаковых рангов Уилкоксона
    - Критерий Манна — Уитни
    - Однофакторную ANOVA
  correct: 1
  id: 048-parametric-1
  fingerprint: 63c5c01c
- concept: более высокая мощность параметрического теста сохраняет смысл только при выполнении его предположений
  question: Почему параметрический тест нельзя автоматически выбирать только потому, что он обычно обладает большей статистической мощностью?
  explanation: Параметрический тест использует численные расстояния между наблюдениями и благодаря этому лучше обнаруживает реальные эффекты при подходящих предположениях. Но та же зависимость от формы данных делает выводы ненадёжными, если предположения заметно нарушены.
  kind: open
  reference: Преимущество в мощности действует, когда предположения теста достаточно хорошо соответствуют данным. При сильной асимметрии, тяжёлых выбросах или нарушении других условий рассчитанное p-значение может стать ненадёжным, поэтому непараметрический тест иногда обоснованнее.
  id: 048-parametric-2
  fingerprint: ce4afd51
