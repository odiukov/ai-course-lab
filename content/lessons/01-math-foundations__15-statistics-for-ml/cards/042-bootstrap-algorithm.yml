- concept: бутстрэп-выборка формируется переотбором с возвращением и сохраняет размер исходной выборки
  question: Исходный тестовый набор содержит 480 объектов. Как правильно сформировать из него одну бутстрэп-выборку?
  explanation: При бутстрэпе выполняют столько извлечений, сколько объектов было в исходной выборке, и после каждого извлечения объект возвращают. Поэтому некоторые объекты могут повториться, а некоторые — не попасть в новую выборку.
  kind: choice
  options:
    - Случайно переставить все объекты, не допуская повторений
    - Сделать 480 случайных извлечений с возвращением
    - Выбрать только уникальные объекты, пока их не станет 480
    - Сгенерировать 480 новых объектов из нормального распределения
  correct: 1
  id: 042-bootstrap-algorithm-1
  fingerprint: e0189f4f
- concept: распределение бутстрэп-статистик строится повторным переотбором и пересчётом статистики
  question: Расположи действия построения бутстрэп-распределения статистики в правильном порядке.
  explanation: Каждый переотбор создаёт новый состав наблюдений, после чего статистику вычисляют заново. Совокупность сохранённых значений приближает распределение, которое статистика имела бы при повторном получении выборок.
  kind: order
  items:
    - Сформировать из исходных данных выборку того же размера с возвращением
    - Вычислить интересующую статистику на полученной выборке
    - Сохранить значение статистики и многократно повторить переотбор
    - Использовать распределение сохранённых значений как приближение выборочного распределения
  id: 042-bootstrap-algorithm-2
  fingerprint: 554a7573
