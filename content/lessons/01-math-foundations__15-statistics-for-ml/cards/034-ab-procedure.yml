- concept: среднее преимущество модели вычисляется как среднее знаковых разностей внутри соответствующих фолдов
  question: На общих фолдах модель A получила 61, 74, 83 и 96 процентных пунктов, а модель B — 66, 72, 90 и 93. Вычисли среднюю разность B − A в процентных пунктах.
  explanation: 'Парные разности B − A равны +5, −2, +7 и −3. Их среднее: (5 − 2 + 7 − 3) / 4 = 1.75 процентного пункта в пользу B.'
  kind: numeric
  answer: 1.75
  tolerance: 0.001
