- concept: объединённая дисперсия взвешивает дисперсии групп по числу степеней свободы
  question: Почему при вычислении объединённого стандартного отклонения для групп разного размера нельзя просто усреднить их стандартные отклонения?
  explanation: Простое среднее дало бы обеим группам одинаковый вес независимо от их размера. Объединённая дисперсия учитывает число независимых отклонений в каждой группе.
  kind: open
  reference: 'Группы содержат разное количество информации об изменчивости. Поэтому выборочные дисперсии нужно взвесить по числу степеней свободы: более крупная группа сильнее влияет на общий масштаб разброса.'
  id: 037-cohens-d-1
  fingerprint: 1769cb26
- concept: перестановка сравниваемых групп меняет знак d Коэна, но сохраняет модуль
  question: Заполни пропуск, предполагая, что объединённое стандартное отклонение положительно.
  explanation: При перестановке групп разность средних меняет знак, а объединённое стандартное отклонение остаётся прежним. Поэтому модуль эффекта сохраняется.
  kind: cloze
  template: cohens_d(group_b, group_a) == ___
  answer: -cohens_d(group_a, group_b)
  accept:
    - -(cohens_d(group_a, group_b))
  id: 037-cohens-d-2
  fingerprint: 0beb538a
- concept: d Коэна не определён при нулевом объединённом стандартном отклонении
  question: Функция получает группы [x, x, x] и [y, y, y], причём x и y различаются. Как она должна обработать этот случай?
  explanation: Обе выборочные дисперсии равны нулю, поэтому объединённое стандартное отклонение тоже равно нулю. Деление на него невозможно, и функция должна явно отклонить такой ввод.
  kind: choice
  options:
    - Вернуть положительную бесконечность
    - Вернуть разность средних без нормализации
    - Вернуть ноль, поскольку внутри групп нет разброса
    - Явно сообщить об ошибке, поскольку нормирующий разброс равен нулю
  correct: 3
  id: 037-cohens-d-3
  fingerprint: b8c57a99
