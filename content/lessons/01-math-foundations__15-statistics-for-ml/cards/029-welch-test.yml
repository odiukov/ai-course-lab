- concept: тест Уэлча сравнивает средние независимых групп без предположения о равенстве их дисперсий
  question: Результаты двух моделей получены в независимых сериях запусков. Размеры групп и выборочные дисперсии заметно различаются. Какой тест подходит для сравнения средних?
  explanation: Тест Уэлча предназначен для двух независимых выборок и не требует равенства дисперсий. Разный объём групп также не мешает его применению.
  kind: choice
  options:
    - Двухвыборочный тест Уэлча
    - Парный t-тест
    - Одновыборочный t-тест
    - t-тест Стьюдента с объединённой оценкой дисперсии
  correct: 0
  id: 029-welch-test-1
  fingerprint: 2a797c7c
- concept: статистика Уэлча равна разности средних, делённой на стандартную ошибку этой разности
  question: Для двух независимых групп известны средние 0.74 и 0.69, выборочные дисперсии 0.0025 и 0.0081, а объёмы — 25 и 36. Вычисли статистику Уэлча, вычитая среднее второй группы из среднего первой.
  explanation: Стандартная ошибка равна sqrt(0.0025/25 + 0.0081/36) ≈ 0.0180. Поэтому t = (0.74 − 0.69) / 0.0180 ≈ 2.77.
  kind: numeric
  answer: 2.77
  tolerance: 0.02
  id: 029-welch-test-2
  fingerprint: e5e40b2a
