- concept: d Коэна является безразмерной величиной и не меняется при общей смене масштаба измерений
  question: Почему смена единиц измерения у обеих групп не меняет d Коэна?
  explanation: d Коэна нормирует разность средних на типичный разброс. Например, умножение всех наблюдений на общий положительный коэффициент умножает на него и числитель, и знаменатель формулы, поэтому коэффициент сокращается.
  kind: open
  reference: При общей смене масштаба разность средних и объединённое стандартное отклонение изменяются в одинаковое число раз, поэтому их отношение остаётся прежним.
  id: 036-effect-size-2
