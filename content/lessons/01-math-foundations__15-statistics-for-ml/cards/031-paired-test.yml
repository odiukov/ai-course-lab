- concept: парный t-тест применяют при оценке моделей на одних и тех же фолдах
  question: 'Две модели оценили на одном и том же наборе фолдов кросс-валидации: для каждого фолда известна метрика обеих моделей. Какой тест соответствует такому дизайну?'
  explanation: Оценки образуют естественные пары, поскольку обе модели проверены на одинаковых фолдах. Парный тест учитывает это соответствие и отделяет различие моделей от влияния сложности конкретного фолда.
  kind: choice
  options:
    - Одновыборочный t-тест метрик каждой модели против нуля
    - t-тест Уэлча для независимых групп
    - Парный t-тест с сопоставлением результатов на одинаковых фолдах
  correct: 2
  id: 031-paired-test-1
  fingerprint: 001515db
- concept: валидная пара требует естественного соответствия измерений, а не произвольного сопоставления
  question: Почему нельзя превратить результаты двух моделей в парные данные, просто сопоставив оценки на разных фолдах в произвольном порядке?
  explanation: В корректной паре обе модели сталкиваются с одинаковыми данными. Если соединить оценки с разных фолдов, влияние сложности фолдов снова смешается с различием между моделями.
  kind: open
  reference: 'Парность должна отражать общий источник вариации: обе оценки в паре должны быть получены на одном и том же фолде или примере. Произвольное сопоставление не контролирует различия в сложности данных и лишает парный анализ смысла.'
  id: 031-paired-test-2
  fingerprint: 7cc62e9d
