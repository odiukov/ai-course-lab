- concept: из-за симметрии достаточно вычислить одну половину ковариационной матрицы вместе с диагональю
  question: Набор данных содержит 8 признаков. Сколько элементов ковариационной матрицы нужно вычислить независимо, если учитывать её симметрию и включать диагональ?
  explanation: 'Для d признаков достаточно верхнего треугольника вместе с диагональю: d(d+1)/2. Поэтому для 8 признаков получаем 8·9/2 = 36 элементов; остальные зеркально повторяются.'
  kind: numeric
  answer: 36
  tolerance: 0.001
  id: 019-covariance-matrix-1
  fingerprint: f2511a82
- concept: диагональ ковариационной матрицы содержит дисперсии, а остальные элементы — попарные ковариации
  question: Как правильно интерпретировать элементы ковариационной матрицы признаков?
  explanation: Элемент на диагонали равен ковариации признака с самим собой, то есть его дисперсии. Внедиагональный элемент описывает совместное линейное изменение пары разных признаков.
  kind: choice
  options:
    - На диагонали стоят средние значения признаков, а вне диагонали — их дисперсии
    - На диагонали стоят дисперсии признаков, а вне диагонали — ковариации соответствующих пар
    - На диагонали стоят коэффициенты корреляции, а вне диагонали — стандартные отклонения
  correct: 1
  id: 019-covariance-matrix-2
  fingerprint: eafad506
