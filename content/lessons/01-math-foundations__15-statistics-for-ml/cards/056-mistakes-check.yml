- concept: на несбалансированных данных качество модели нужно сопоставлять с тривиальным прогнозом большинства и оценивать редкий класс
  question: Классификатор редкого события получил высокую accuracy, но не превзошёл правило «всегда предсказывать обычный случай». Как следует оценить его полезность?
  explanation: При сильном дисбалансе правило большинства может иметь высокую accuracy, не находя ни одного редкого события. Метрики редкого класса показывают, есть ли у модели реальная предсказательная ценность.
  kind: open
  reference: 'Высокая accuracy сама по себе не доказывает полезность: нужно проверить precision, recall, F1 или AUC и убедиться, что модель действительно обнаруживает редкий класс лучше тривиального прогноза большинства.'
  id: 056-mistakes-check-2
  fingerprint: 868bd235
