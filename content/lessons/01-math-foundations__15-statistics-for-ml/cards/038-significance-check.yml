- concept: p-значение и размер эффекта отвечают на разные вопросы и должны сообщаться вместе
  question: Почему малого p-значения недостаточно для оценки улучшения модели? Объясни своими словами.
  explanation: P-значение характеризует убедительность свидетельства о различии, а размер эффекта — масштаб различия. Даже хорошо подтверждённый эффект может оказаться слишком малым для практического применения.
  kind: open
  reference: Малое p-значение показывает, что наблюдаемое различие трудно объяснить случайностью при верной нулевой гипотезе, но не характеризует его величину. Для этого нужен размер эффекта, а практическую пользу оценивают с учётом предметной области и затрат.
  id: 038-significance-check-2
  fingerprint: a553432e
