- concept: параметры предобработки оценивают только по обучающей части данных
  question: Исследователь сначала вычислил среднее и стандартное отклонение признаков по всему набору, затем разделил данные и стандартизовал признаки. Почему оценка модели может оказаться завышенной?
  explanation: 'Даже преобразование без целевой переменной может вызвать утечку: его параметры уже зависят от отложенных объектов. Сначала данные разделяют, затем настраивают преобразование на обучающей части и без переоценки применяют к остальным.'
  kind: choice
  options:
    - Статистики стандартизации передали обучению информацию о распределении отложенных данных
    - Стандартизация всегда увеличивает ошибку на новых данных
    - После стандартизации модель уже нельзя обучать градиентными методами
    - Разбиение данных допустимо только до сбора признаков
  correct: 0
  id: 054-data-mistakes-1
  fingerprint: af8ffa9e
- concept: связанные наблюдения разделяют по независимым группам, а не по отдельным строкам
  question: В наборе есть несколько записей для каждого пользователя. Как организовать разбиение, чтобы честно проверить работу модели на новых пользователях, и почему?
  explanation: Случайное разбиение строк может оставить одного пользователя по обе стороны границы и завысить качество. Групповое разбиение проверяет перенос модели на действительно новые независимые объекты.
  kind: open
  reference: Все записи одного пользователя нужно целиком помещать только в одну часть данных. Иначе особенности того же пользователя окажутся и в обучении, и в проверке, а строки внутри пользователя будут ошибочно восприниматься как независимые свидетельства.
  id: 054-data-mistakes-2
  fingerprint: 0fa5f608
- concept: качество на обучающих примерах не является надёжной оценкой обобщения
  question: Модель показывает почти безошибочный результат на тех же объектах, по которым подбирались её параметры. Какой вывод обоснован?
  explanation: Модель могла запомнить особенности обучающих объектов. Для оценки обобщения нужны отложенные данные, не участвовавшие в обучении.
  kind: choice
  options:
    - По этому результату нельзя надёжно судить о качестве на новых объектах
    - Модель гарантированно покажет такой же результат на новых объектах
    - Высокий результат доказывает отсутствие переобучения
    - Дополнительная проверка нужна только при дисбалансе классов
  correct: 0
  id: 054-data-mistakes-3
  fingerprint: dbc30bd9
