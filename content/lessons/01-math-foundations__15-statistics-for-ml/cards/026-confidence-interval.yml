- concept: уровень доверия описывает долю интервалов, накрывающих истинный параметр при многократном повторении процедуры
  question: Исследователь построил 90-процентный доверительный интервал для точности модели. Какова корректная частотная интерпретация?
  explanation: 'Истинный параметр считается фиксированным. Уровень доверия характеризует процедуру: при множестве повторных выборок 95% интервалов соответствующего уровня накрыли бы истинное значение, но конкретный уже построенный интервал либо накрыл его, либо нет.'
  kind: choice
  options:
    - Истинная точность с вероятностью 90% находится внутри полученного интервала
    - При многократном повторении эксперимента около 90% построенных тем же методом интервалов накроют истинную точность
    - Около 90% наблюдений тестовой выборки находятся внутри интервала
    - Вероятность ошибки модели находится внутри интервала с вероятностью 90%
  correct: 1
  id: 026-confidence-interval-1
  fingerprint: c48409b6
- concept: узкий доверительный интервал означает высокую точность оценки, но не защищает от систематического смещения данных
  question: Почему узкий доверительный интервал, полученный на нерепрезентативной тестовой выборке, не гарантирует точной оценки качества модели в реальной эксплуатации?
  explanation: Ширина интервала отражает точность оценки, а не отсутствие систематической ошибки. Даже очень узкий диапазон может быть сдвинут, если тестовые данные включают преимущественно простые или иначе нерепрезентативные примеры.
  kind: open
  reference: Узкий интервал показывает малую случайную неопределённость оценки для распределения тестовой выборки. Если эта выборка систематически отличается от реальных данных, оценка может быть воспроизводимой и точной относительно неверной целевой совокупности, но смещённой относительно эксплуатационного качества.
  id: 026-confidence-interval-2
  fingerprint: 4c58875b
