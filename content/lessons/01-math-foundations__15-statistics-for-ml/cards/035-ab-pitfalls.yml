- concept: accuracy не отражает асимметричную цену ошибок, задержку и качество для отдельных групп
  question: Модель показывает лучшую общую accuracy, но чаще пропускает опасный класс, работает медленнее и хуже обслуживает редкую языковую группу. Как корректно выбирать модель?
  explanation: Accuracy показывает общую долю верных решений, но не различает цену разных ошибок и не учитывает задержку или fairness. Поэтому преимущество B по accuracy 98,4% против 98,1% само по себе не доказывает, что её безопаснее запускать.
  kind: choice
  options:
    - Выбрать её, поскольку более высокая accuracy перекрывает остальные показатели
    - Автоматически выбрать модель с минимальной задержкой
    - Сравнить модели по метрикам, связанным с ценой ошибок, эксплуатационными ограничениями и качеством для важных групп
    - Усреднить все метрики без учёта их смысла и масштаба
  correct: 2
  id: 035-ab-pitfalls-1
  fingerprint: 1fc83d50
- concept: выбор главной метрики после просмотра результатов создаёт риск постфактум-подгонки вывода
  question: Команда сначала получила значения accuracy, recall, F1 и latency, а затем объявила главной ту метрику, по которой предпочитаемая модель оказалась лучшей. В чём проблема такого решения?
  explanation: Главную метрику и допустимые ограничения для остальных показателей задают до эксперимента. Иначе команда может непреднамеренно выбрать именно тот результат, где случайные колебания поддерживают желаемый вывод.
  kind: choice
  options:
    - Разные метрики нельзя вычислять для одной модели
    - Постфактум можно выбрать случайно выгодный показатель и завысить убедительность победы
    - Главной метрикой всегда должна быть accuracy
    - После эксперимента разрешено сравнивать только latency
  correct: 1
  id: 035-ab-pitfalls-2
  fingerprint: 65b26e0a
- concept: финальный тестовый набор должен оставаться изолированным от настройки и выбора модели
  question: Расположите этапы выбора ML-модели так, чтобы финальная оценка не была смещена утечкой данных.
  explanation: Если тестовый набор участвует в выборе архитектуры, параметров или порога, модель косвенно подстраивается под этот набор. Изолированная финальная проверка даёт менее смещённую оценку качества выбранного решения.
  kind: order
  items:
    - Заранее отделить финальный тестовый набор и не использовать сведения о нём при разработке
    - Настроить модели, выбрать архитектуру и подобрать порог на обучающих и валидационных данных
    - Зафиксировать модель и процедуру оценки
    - Один раз оценить зафиксированную модель на нетронутом финальном наборе
  id: 035-ab-pitfalls-3
  fingerprint: b7043b1b
