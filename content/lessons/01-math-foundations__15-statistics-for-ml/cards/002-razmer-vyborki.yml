- concept: большой разброс метрики на сопоставимых выборках снижает надёжность единичного преимущества
  question: Почему один более высокий результат модели не доказывает её превосходство, если её метрика сильно меняется на разных сопоставимых тестовых выборках?
  explanation: Устойчивое улучшение должно сохраняться на сопоставимых выборках. Если оценки сильно гуляют, единичная разница может быть следствием вариативности данных, а не качества модели.
  kind: open
  reference: Большой разброс означает, что результат сильно зависит от случайного состава выборки. Наблюдаемое преимущество могло возникнуть из-за удачного набора примеров и исчезнуть при следующей проверке.
