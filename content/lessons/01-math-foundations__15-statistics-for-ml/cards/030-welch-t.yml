- concept: знак t-статистики Уэлча определяется порядком вычитания средних
  question: Для независимых групп A и B статистику Уэлча вычислили с числителем mean(A) − mean(B) и получили отрицательное значение. Что из этого следует?
  explanation: Знаменатель статистики Уэлча положителен, поэтому её знак совпадает со знаком разности средних. Отрицательное t означает mean(A) < mean(B); поменяв группы местами, мы изменим только знак статистики.
  kind: choice
  options:
    - Среднее группы A меньше среднего группы B
    - Среднее группы A больше среднего группы B
    - Дисперсия группы A обязательно больше дисперсии группы B
    - Размер группы A обязательно меньше размера группы B
  correct: 0
  id: 030-welch-t-1
  fingerprint: ffc61db8
- concept: t-статистику Уэлча невозможно вычислить, если стандартная ошибка разности средних равна нулю
  question: Почему функция вычисления t-статистики Уэлча должна отдельно обрабатывать случай, когда обе независимые группы состоят из одинаковых внутри каждой группы значений?
  explanation: 'Знаменатель равен sqrt(s_A²/n_A + s_B²/n_B). Если обе дисперсии нулевые, знаменатель равен нулю: при разных средних возникло бы деление на ноль, а при одинаковых — неопределённость 0/0.'
  kind: open
  reference: В обеих группах выборочные дисперсии равны нулю, поэтому стандартная ошибка разности средних также равна нулю. Деление на неё не определено, независимо от того, равны средние групп или различаются.
  id: 030-welch-t-2
  fingerprint: 62efaece
- concept: парный t-тест сводится к одновыборочному t-тесту разностей
  question: Заполните пропуск в подготовке данных для парного t-теста результатов двух моделей, проверенных на одинаковых разбиениях.
  explanation: Для каждой пары вычисляют разность результатов, после чего применяют одновыборочный t-тест к полученным разностям относительно нуля. Попарность сохраняет соответствие результатов на одинаковых разбиениях.
  kind: cloze
  template: differences = [___ for x, y in zip(model_a, model_b)]
  answer: x - y
  accept:
    - x-y
    - (x - y)
    - (x-y)
  id: 030-welch-t-3
  fingerprint: b9f7fff7
