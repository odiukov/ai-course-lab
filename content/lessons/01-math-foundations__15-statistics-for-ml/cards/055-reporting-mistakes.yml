- concept: точечная оценка без доверительного интервала не показывает диапазон эффектов, совместимых с выборочными данными
  question: Новая модель показала более высокую F1, чем базовая. Почему одной точечной разницы метрик недостаточно, чтобы судить о величине и устойчивости преимущества?
  explanation: Одна оценка сообщает лишь наблюдаемую разницу. Без интервала нельзя понять, насколько точно она измерена и какие истинные размеры эффекта остаются правдоподобными с учётом случайности выборки.
  kind: open
  reference: Точечная разница не отражает выборочную неопределённость. Доверительный интервал для разности показывает, совместимы ли данные с полезным преимуществом, почти нулевым эффектом или даже преимуществом базовой модели.
  id: 055-reporting-mistakes-2
  fingerprint: a81fa5d9
