- concept: ковариационная матрица стандартизованных признаков является корреляционной матрицей
  question: Каждый признак набора данных центрировали и поделили на его стандартное отклонение. Какую матрицу получат, вычислив ковариации между преобразованными признаками?
  explanation: После стандартизации ковариация каждой пары признаков равна их корреляции. Диагональные элементы такой матрицы равны единице, а внедиагональные не зависят от исходных единиц измерения.
  kind: choice
  options:
    - Исходную ковариационную матрицу
    - Единичную матрицу
    - Корреляционную матрицу
    - Матрицу собственных векторов
  correct: 2
  id: 021-covariance-pca-1
  fingerprint: 4168a521
- concept: доля дисперсии главной компоненты равна её собственному значению, делённому на сумму собственных значений
  question: Собственные значения матрицы, использованной для PCA, равны 2.4, 1.3, 0.8 и 0.5. Какой процент общей дисперсии объясняет главная компонента с наибольшим собственным значением?
  explanation: Сумма собственных значений равна 5.0, а наибольшее из них — 2.4. Поэтому доля объяснённой дисперсии составляет 2.4 / 5.0 = 0.48, то есть 48%.
  kind: numeric
  answer: 48
  tolerance: 0.1
  id: 021-covariance-pca-2
  fingerprint: 01f8e2a8
