- concept: ошибка первого рода — отклонение истинной нулевой гипотезы, а ошибка второго рода — неотклонение ложной
  question: Тест проверяет нулевую гипотезу о том, что новая модель не лучше старой. Какой исход является ошибкой второго рода?
  explanation: 'Ошибка второго рода возникает, когда ложную H0 не отвергают: эффект существует, но тест его пропускает. Ошибка первого рода — отклонение истинной H0, то есть ложное обнаружение эффекта.'
  kind: choice
  options:
    - Тест объявил улучшение, хотя его нет
    - Тест не обнаружил улучшение, хотя новая модель действительно лучше
    - Тест обнаружил реальное улучшение
    - Тест не обнаружил улучшение, которого действительно нет
  correct: 1
  id: 053-errors-power-1
  fingerprint: 1c21496d
- concept: статистическая мощность равна единице минус вероятность ошибки второго рода
  question: Вероятность ошибки второго рода для теста составляет 0.18. Какова статистическая мощность теста?
  explanation: Мощность равна 1 − β, поэтому 1 − 0.18 = 0.82. Это вероятность правильно отвергнуть ложную нулевую гипотезу.
  kind: numeric
  answer: 0.82
  tolerance: 0.001
  id: 053-errors-power-2
  fingerprint: 44c721b4
- concept: при фиксированном объёме данных снижение уровня значимости обычно уменьшает мощность теста
  question: Объясните своими словами, почему более строгий уровень значимости при неизменных данных может увеличить число пропущенных реальных эффектов.
  explanation: Уменьшение α сокращает область отклонения H0. При фиксированных эффекте, разбросе и объёме выборки это обычно снижает вероятность обнаружить существующий эффект, то есть уменьшает мощность.
  kind: open
  reference: 'Более строгий уровень значимости требует более сильного статистического свидетельства для отклонения H0. Поэтому часть результатов, вызванных реальным эффектом, перестаёт пересекать порог отклонения: вероятность ошибки второго рода растёт, а мощность падает.'
  id: 053-errors-power-3
  fingerprint: da89d3af
