- concept: при фиксированной общей частоте две категории имеют одну степень свободы
  question: Объясни своими словами, почему для двух категорий с фиксированным общим числом наблюдений остаётся только одна степень свободы.
  explanation: 'Если общее количество зафиксировано, частоты категорий связаны ограничением: их сумма должна оставаться постоянной. Поэтому значение одной из двух частот полностью определяет другую.'
  kind: open
  reference: После выбора частоты первой категории частота второй уже однозначно определяется как разность между общим числом наблюдений и частотой первой категории, поэтому независимо изменяться может только одна частота.
