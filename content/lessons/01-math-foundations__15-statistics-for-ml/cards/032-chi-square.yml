- concept: статистика хи-квадрат равна сумме нормированных квадратов отклонений наблюдаемых частот от ожидаемых
  question: Для двух категорий наблюдаемые частоты равны 21 и 7, а ожидаемые — 14 и 14. Чему равна статистика хи-квадрат?
  explanation: 'Для каждой категории вклад равен квадрату отклонения, делённому на ожидаемую частоту: 7²/14 = 3,5. Два таких вклада дают χ² = 7.'
  kind: numeric
  answer: 7
  tolerance: 0.01
  id: 032-chi-square-1
  fingerprint: 0dfd52b1
- concept: деление на ожидаемую частоту делает одинаковое абсолютное отклонение более существенным для редкой категории
  question: В двух категориях наблюдаемая частота отличается от ожидаемой на 3 объекта. Для первой категории ожидалось 9 объектов, для второй — 144. Какая категория внесёт больший вклад в статистику хи-квадрат?
  explanation: 'Вклад вычисляется как квадрат отклонения, делённый на ожидаемую частоту. Поэтому 3²/9 больше, чем 3²/144: одинаковое отклонение заметнее на фоне меньшего ожидания.'
  kind: choice
  options:
    - Первая категория
    - Вторая категория
    - Обе категории внесут одинаковый вклад
