- concept: ожидаемое число ложных открытий равно сумме вероятностей ложного открытия в отдельных проверках
  question: Все нулевые гипотезы верны. Проведено 12 проверок, для каждой задан уровень значимости 0,03. Каково ожидаемое число ложных открытий?
  explanation: 'Математическое ожидание равно m × alpha: 12 × 0,03 = 0,36. Это среднее по множеству повторений, а не количество ошибок, гарантированное в отдельной серии.'
  kind: numeric
  answer: 0.36
  tolerance: 0.001
  id: 039-many-tests-1
  fingerprint: fb638304
- concept: зависимость между проверками не позволяет перемножать их вероятности как независимые
  question: Объясни своими словами, почему для сильно зависимых статистических проверок нельзя точно вычислять вероятность хотя бы одного ложного открытия простым перемножением вероятностей отсутствия ошибки.
  explanation: При независимых проверках вероятность отсутствия ошибок раскладывается в произведение. Для зависимых проверок такое разложение неверно, и точный общий риск определяется их совместным распределением.
  kind: open
  reference: Перемножать вероятности отдельных событий можно при их независимости. Если проверки используют общие данные или близкие метрики, их результаты связаны, поэтому совместная вероятность отсутствия ложных открытий зависит от структуры этой связи.
  id: 039-many-tests-2
  fingerprint: ea9937da
