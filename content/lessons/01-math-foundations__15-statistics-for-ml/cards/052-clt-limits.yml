- concept: при конечной дисперсии тяжёлые хвосты могут сильно замедлить сходимость распределения среднего к нормальному
  question: Что можно сказать о применимости ЦПТ к распределению с тяжёлыми хвостами, если его дисперсия конечна?
  explanation: Конечная дисперсия сохраняет возможность асимптотического результата, однако редкие экстремальные наблюдения долго влияют на выборочные средние. Универсального небольшого порога достаточного объёма выборки здесь нет.
  kind: open
  reference: ЦПТ может оставаться применимой асимптотически, но приближение распределения среднего к нормальному может быть очень медленным, поэтому выборка умеренного размера не гарантирует точного нормального приближения.
