- concept: универсальная bootstrap-функция вычисляет переданную пользователем статистику, а не жёстко заданную метрику
  question: Заполни пропуск так, чтобы функция работала с любой переданной статистикой.
  explanation: Вызов аргумента-функции позволяет одним и тем же кодом оценивать среднее, медиану, F1 и другие статистики.
  kind: cloze
  template: |-
    def one_bootstrap_value(data, statistic, rng):
        resample = [rng.choice(data) for _ in data]
        return ___
  answer: statistic(resample)
  accept:
    - statistic(resample)
    - statistic( resample )
