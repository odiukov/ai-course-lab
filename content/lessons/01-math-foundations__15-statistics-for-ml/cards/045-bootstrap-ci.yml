  fingerprint: 38738ca2
- concept: при bootstrap-сравнении моделей общие индексы сохраняют соответствие предсказаний на одних и тех же объектах
  question: Расположи действия одного bootstrap-повторения для сравнения двух моделей на общем тестовом наборе.
  explanation: Обе модели оценивают на одном и том же переотборе объектов. Независимый набор индексов для каждой модели разрушил бы парность сравнения и добавил лишнюю случайность.
  kind: order
  items:
    - Сгенерировать один набор тестовых индексов с возвращением
    - По этим же индексам выбрать истинные ответы и предсказания обеих моделей
    - Вычислить метрику каждой модели на полученных данных
    - Сохранить знаковую разность метрик моделей
  id: 045-bootstrap-ci-2
  fingerprint: 251a1809
- concept: bootstrap-интервал разности метрик позволяет определить направление и статистическую значимость преимущества
  question: Процентильный bootstrap-интервал для разности metric_B − metric_A целиком лежит выше нуля. Как это интерпретировать?
  explanation: Если весь интервал разности metric_B − metric_A положителен, нулевое различие с ним несовместимо, а знак указывает на преимущество модели B.
  kind: choice
  options:
    - По bootstrap-оценке модель B статистически значимо превосходит модель A
    - По bootstrap-оценке модель A статистически значимо превосходит модель B
    - Различие нельзя считать значимым, потому что интервал должен содержать ноль
    - О направлении различия можно судить только по ширине интервала
  correct: 0
