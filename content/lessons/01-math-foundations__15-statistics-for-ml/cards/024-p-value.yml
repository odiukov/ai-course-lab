- concept: большое p-значение означает недостаток оснований для отклонения нулевой гипотезы, а не её доказанность
  question: Статистический тест дал большое p-значение. Какой вывод корректен?
  explanation: Большое p-значение показывает, что наблюдение не выглядит редким при нулевой гипотезе. Поэтому её не отклоняют, но истинность гипотезы этим не доказывается.
  kind: choice
  options:
    - Данных недостаточно, чтобы отклонить нулевую гипотезу
    - Нулевая гипотеза доказана
    - Альтернативная гипотеза обязательно ложна
    - Вероятность истинности нулевой гипотезы равна p-значению
  correct: 0
  id: 024-p-value-1
  fingerprint: 5b2e61d7
- concept: p-значение является вероятностью экстремальных данных при условии истинности нулевой гипотезы
  question: Объясни своими словами, почему p-значение нельзя трактовать как вероятность истинности нулевой гипотезы.
  explanation: p-значение имеет направление условия «данные при верной нулевой гипотезе». Переставлять гипотезу и данные местами без дополнительной модели и априорных вероятностей нельзя.
  kind: open
  reference: При вычислении p-значения истинность нулевой гипотезы уже принимается как условие. Тест оценивает вероятность получить не менее экстремальные данные в этом условном мире, а не вероятность самой гипотезы после наблюдения данных.
  id: 024-p-value-2
  fingerprint: 368bd9e9
