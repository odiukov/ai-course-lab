- concept: корреляция Пирсона не определена, если одна из переменных имеет нулевое стандартное отклонение
  question: В реализации коэффициента Пирсона все наблюдения переменной y одинаковы. Как должна повести себя функция?
  explanation: 'У постоянной переменной стандартное отклонение равно нулю, поэтому знаменатель формулы обращается в ноль. Это не нулевая корреляция: коэффициент в таком случае не определён, и функция должна сообщить об ошибке.'
  kind: choice
  options:
    - Вернуть отсутствие линейной связи
    - Явно сообщить, что корреляция не определена
    - Удалить повторяющиеся значения y
    - Заменить знаменатель небольшим положительным числом
  correct: 1
  id: 014-pearson-1
  fingerprint: 82e2fdeb
- concept: коэффициент корреляции вычисляется по исходным парам наблюдений
  question: Почему перед вычислением корреляции Пирсона нельзя независимо сортировать списки x и y?
  explanation: Каждый элемент x должен оставаться связанным с соответствующим элементом y. Независимая перестановка переменных создаёт другие пары и может радикально изменить измеряемую корреляцию.
  kind: open
  reference: Независимая сортировка меняет соответствие между наблюдениями x и y. После неё произведения отклонений относятся уже к искусственно созданным парам, поэтому результат не описывает связь в исходных данных.
  id: 014-pearson-2
  fingerprint: 6755ea14
- concept: коэффициент Пирсона можно вычислить через суммы произведений и квадратов центрированных отклонений
  question: Пусть cross — сумма произведений парных отклонений, а ss_x и ss_y — суммы квадратов отклонений соответствующих переменных. Заполни знаменатель формулы.
  explanation: Множители, используемые при согласованном усреднении ковариации и обеих дисперсий, сокращаются. Поэтому знаменатель можно записать как квадратный корень из произведения двух сумм квадратов отклонений.
  kind: cloze
  template: r = cross / ___
  answer: sqrt(ss_x * ss_y)
  accept:
    - math.sqrt(ss_x * ss_y)
    - sqrt(ss_y * ss_x)
  id: 014-pearson-3
  fingerprint: 23d1f806
