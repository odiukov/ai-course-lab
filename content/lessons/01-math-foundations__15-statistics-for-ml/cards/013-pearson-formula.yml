- concept: корреляция Пирсона не меняется при положительном масштабировании переменной
  question: Задержку перевели из миллисекунд в секунды, умножив все её значения на один и тот же положительный коэффициент. Что произойдёт с корреляцией Пирсона между задержкой и нагрузкой?
  explanation: При положительном масштабировании числитель и стандартное отклонение этой переменной умножаются на один коэффициент, который сокращается в формуле. Поэтому смена единиц измерения не меняет r.
  kind: choice
  options:
    - Не изменится
    - Уменьшится по модулю
    - Поменяет знак
    - Станет нулевой
  correct: 0
  id: 013-pearson-formula-1
  fingerprint: ce30f7be
- concept: одинаковые знаки отклонений дают положительный вклад в корреляцию
  question: Заполни пропуск в формуле знака произведения центрированных значений.
  explanation: Произведение двух положительных или двух отрицательных отклонений положительно. Если такие пары преобладают, числитель формулы Пирсона и сам коэффициент r имеют положительный знак.
  kind: cloze
  template: sign((xᵢ − x̄)(yᵢ − ȳ)) = ___, если оба отклонения ненулевые и имеют одинаковый знак
  answer: +
  accept:
    - плюс
    - положительный знак
  id: 013-pearson-formula-2
  fingerprint: 2261f1d2
- concept: близкая к нулю корреляция Пирсона не исключает нелинейную связь
  question: Объясни своими словами, почему корреляция Пирсона, близкая к нулю, не доказывает отсутствие любой связи между переменными.
  explanation: Значение r около нуля означает отсутствие выраженной линейной связи. Например, при изгибающейся или симметричной зависимости линейные вклады разных участков могут погасить друг друга.
  kind: open
  reference: Пирсон измеряет именно линейное совместное движение. При нелинейной связи положительные и отрицательные произведения отклонений могут взаимно компенсироваться, поэтому r окажется близким к нулю, хотя одна переменная всё ещё зависит от другой.
  id: 013-pearson-formula-3
  fingerprint: f9b8e9ad
