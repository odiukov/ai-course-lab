- concept: идеальная положительная корреляция Спирмена требует сохранения порядка, а не равномерных приращений
  question: В каком случае коэффициент Спирмена будет максимально положительным, хотя зависимость может быть нелинейной?
  explanation: Если порядок наблюдений по обеим переменным полностью совпадает, их ранги совпадают и коэффициент Спирмена достигает максимума. Размеры отдельных приращений на результат не влияют.
  kind: choice
  options:
    - При увеличении признака отклик всегда возрастает, но на неодинаковую величину
    - При увеличении признака отклик сначала возрастает, а затем уменьшается
    - Значения отклика меняются без устойчивого порядка относительно признака
