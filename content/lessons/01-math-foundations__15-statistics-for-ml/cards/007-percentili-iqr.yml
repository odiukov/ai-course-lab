- concept: IQR устойчив к одиночным экстремальным выбросам, поскольку определяется центральной частью распределения
  question: Почему одна чрезвычайно большая ошибка обычно сильнее изменяет размах, чем IQR?
  explanation: Выброс сразу меняет максимум и тем самым размах. На квартильные границы он обычно влияет мало, поэтому IQR устойчивее описывает разброс основной массы наблюдений.
  kind: open
  reference: Размах зависит непосредственно от минимального и максимального значений, поэтому новый экстремум меняет его границу. IQR определяется квартилями центральной половины данных, и одиночное крайнее наблюдение обычно почти не сдвигает эти квартильные границы.
