- concept: критерий Уилкоксона строится по знакам и рангам абсолютных парных разностей
  question: Расположите этапы вычисления статистики критерия знаковых рангов Уилкоксона в правильном порядке.
  explanation: Уилкоксон использует величину разности только для определения ранга, а направление сохраняет в её знаке. Поэтому экстремальное значение получает наибольший ранг, но его исходный численный масштаб не входит в сумму.
  kind: order
  items:
    - Вычислить разность внутри каждой пары и исключить нулевые разности
    - Упорядочить абсолютные значения ненулевых разностей и присвоить им ранги
    - Вернуть каждому рангу знак исходной разности
    - Отдельно просуммировать ранги положительных и отрицательных разностей
  id: 049-nonparametric-1
  fingerprint: 8a8f9917
- concept: критерий Манна — Уитни служит непараметрической альтернативой t-тесту для независимых групп
  question: Оценки двух моделей получены на разных, не связанных между собой группах объектов. Оценки порядковые и сильно скошены. Какой тест подходит для сравнения групп?
  explanation: Группы независимы, поэтому парные тесты здесь неприменимы. Критерий Манна — Уитни сравнивает независимые группы по рангам и подходит для порядковых или явно ненормальных данных.
  kind: choice
  options:
    - Критерий Манна — Уитни
    - Критерий знаковых рангов Уилкоксона
    - Парный t-тест
    - Корреляция Пирсона
  correct: 0
