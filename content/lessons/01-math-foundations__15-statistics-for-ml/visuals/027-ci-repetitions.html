<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Что означает 95-процентный доверительный интервал</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #617086;
      --border: #dbe3ed;
      --guide: #7758c7;
      --guide-soft: #eee9fb;
      --hit: #238a78;
      --hit-soft: #e2f5f0;
      --miss: #d95656;
      --miss-soft: #fde9e7;
      --shadow: rgba(28, 42, 67, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151e;
        --panel: #181f2b;
        --ink: #eef3fb;
        --muted: #aab5c6;
        --border: #334052;
        --guide: #b7a1ff;
        --guide-soft: #292442;
        --hit: #61d1bc;
        --hit-soft: #173b37;
        --miss: #ff8982;
        --miss-soft: #472727;
        --shadow: rgba(0, 0, 0, 0.24);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    .diagram {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 8px 28px var(--shadow);
    }

    .diagram-header {
      padding: 15px 20px 9px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
      line-height: 1.25;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      overflow: visible;
      background: var(--panel);
    }

    .truth-line {
      stroke: var(--guide);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .truth-label {
      fill: var(--guide);
      font-size: 14px;
      font-weight: bold;
    }

    .series-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .interval-hit,
    .cap-hit {
      stroke: var(--hit);
      stroke-width: 3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .interval-miss,
    .cap-miss {
      stroke: var(--miss);
      stroke-width: 4;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .estimate-hit {
      fill: var(--panel);
      stroke: var(--hit);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .estimate-miss {
      fill: var(--miss);
      stroke: var(--panel);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .miss-halo {
      fill: var(--miss-soft);
    }

    .divider {
      stroke: var(--border);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .legend-hit,
    .legend-miss {
      font-size: 13px;
      font-weight: bold;
    }

    .legend-hit {
      fill: var(--hit);
    }

    .legend-miss {
      fill: var(--miss);
    }

    .callout {
      fill: var(--guide-soft);
      stroke: var(--border);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .callout-main {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .callout-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: var(--miss-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    [hidden] {
      display: none;
    }

    noscript p {
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: var(--miss-soft);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <header class="diagram-header">
      <h1 id="diagram-title">Что означает 95-процентный доверительный интервал</h1>
      <p class="subtitle">
        Пример одной серии: каждая строка — новая случайная выборка и новый интервал.
      </p>
    </header>

    <svg
      id="chart"
      viewBox="0 0 760 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Двадцать доверительных интервалов вокруг истинного среднего</title>
      <desc id="svg-description">
        Девятнадцать интервалов пересекают вертикальную линию истинного среднего,
        один интервал не пересекает её.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать 20 повторных экспериментов: примерно
      19 доверительных интервалов пересекают неподвижное истинное среднее,
      а 1 интервал промахивается.
    </p>

    <noscript>
      <p>
        Схема: из 20 интервалов примерно 19 накрывают истинное среднее,
        а 1 не накрывает его.
      </p>
    </noscript>
  </figure>

  <script>
    "use strict";

    const diagramData = Object.freeze({
      truth: 8,
      intervals: Object.freeze([
        { y: 0,  lo: 5.4, mid: 7.6, hi: 10.7, hit: true },
        { y: 1,  lo: 6.2, mid: 8.5, hi: 11.1, hit: true },
        { y: 2,  lo: 4.8, mid: 7.1, hi: 9.6,  hit: true },
        { y: 3,  lo: 7.0, mid: 8.6, hi: 10.2, hit: true },
        { y: 4,  lo: 5.9, mid: 7.7, hi: 9.4,  hit: true },
        { y: 5,  lo: 6.6, mid: 8.2, hi: 9.9,  hit: true },
        { y: 6,  lo: 3.9, mid: 6.9, hi: 10.1, hit: true },
        { y: 7,  lo: 7.3, mid: 8.4, hi: 9.5,  hit: true },
        { y: 8,  lo: 5.1, mid: 7.9, hi: 10.6, hit: true },
        { y: 9,  lo: 6.8, mid: 8.9, hi: 11.5, hit: true },
        { y: 10, lo: 4.4, mid: 7.4, hi: 9.8,  hit: true },
        { y: 11, lo: 7.5, mid: 8.3, hi: 9.2,  hit: true },
        { y: 12, lo: 5.7, mid: 8.1, hi: 10.8, hit: true },
        { y: 13, lo: 6.3, mid: 7.8, hi: 9.1,  hit: true },
        { y: 14, lo: 3.2, mid: 4.9, hi: 6.7,  hit: false },
        { y: 15, lo: 5.0, mid: 7.2, hi: 8.9,  hit: true },
        { y: 16, lo: 7.1, mid: 8.0, hi: 8.8,  hit: true },
        { y: 17, lo: 6.0, mid: 8.7, hi: 11.4, hit: true },
        { y: 18, lo: 4.6, mid: 6.8, hi: 8.4,  hit: true },
        { y: 19, lo: 6.9, mid: 8.5, hi: 10.3, hit: true }
      ]),
      frame: Object.freeze({
        left: -1.8,
        right: 15.4,
        top: -1.7,
        truthTop: -0.55,
        truthBottom: 19.6,
        dividerY: 21,
        legendY: 22.55,
        calloutTop: 24.1,
        calloutBottom: 27.15,
        calloutMainY: 25.15,
        calloutNoteY: 26.25,
        calloutCenterX: 6.8
      }),
      marks: Object.freeze({
        cap: 0.27,
        dot: 0.105,
        halo: 0.25,
        dash: 0.15,
        gap: 0.12,
        hitKeyStart: -1.55,
        hitKeyEnd: -0.25,
        hitTextX: 0.2,
        missKeyStart: 7.05,
        missKeyEnd: 8.35,
        missTextX: 8.8
      }),
      summary: Object.freeze({
        repeats: 20,
        covered: 19,
        missed: 1,
        coverage: 95,
        missRate: 5
      })
    });

    const origin = Object.freeze({ x: 105, y: 58 });
    const scale = Object.freeze({ x: 40, y: 13.2 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("chart");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attributes, text) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      };

      const addLine = (parent, x1, y1, x2, y2, className) => {
        parent.appendChild(make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        }));
      };

      const covered = diagramData.intervals.filter(item => item.hit).length;
      const missed = diagramData.intervals.filter(item => !item.hit).length;

      if (
        covered !== diagramData.summary.covered ||
        missed !== diagramData.summary.missed ||
        diagramData.intervals.length !== diagramData.summary.repeats
      ) {
        throw new Error("Данные серии не соответствуют подписям");
      }

      drawing.appendChild(make("text", {
        x: sx(diagramData.frame.left),
        y: sy(diagramData.frame.top),
        class: "series-label",
        "text-anchor": "start",
        "dominant-baseline": "middle"
      }, `${diagramData.summary.repeats} повторных экспериментов`));

      drawing.appendChild(make("text", {
        x: sx(diagramData.truth),
        y: sy(diagramData.frame.top),
        class: "truth-label",
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, "истинное среднее μ"));

      const truthLine = make("line", {
        x1: sx(diagramData.truth),
        y1: sy(diagramData.frame.truthTop),
        x2: sx(diagramData.truth),
        y2: sy(diagramData.frame.truthBottom),
        class: "truth-line",
        "stroke-dasharray":
          `${sx(diagramData.marks.dash) - sx(0)} ` +
          `${sx(diagramData.marks.gap) - sx(0)}`
      });
      drawing.appendChild(truthLine);

      diagramData.intervals.forEach(item => {
        const group = make("g", {
          "aria-label": item.hit
            ? "Интервал пересекает истинное среднее"
            : "Интервал не пересекает истинное среднее"
        });

        if (!item.hit) {
          group.appendChild(make("rect", {
            x: sx(item.lo - diagramData.marks.halo),
            y: sy(item.y - diagramData.marks.halo),
            width:
              sx(item.hi + diagramData.marks.halo) -
              sx(item.lo - diagramData.marks.halo),
            height:
              sy(item.y + diagramData.marks.halo) -
              sy(item.y - diagramData.marks.halo),
            class: "miss-halo"
          }));
        }

        const intervalClass = item.hit ? "interval-hit" : "interval-miss";
        const capClass = item.hit ? "cap-hit" : "cap-miss";
        const estimateClass = item.hit ? "estimate-hit" : "estimate-miss";

        addLine(group, item.lo, item.y, item.hi, item.y, intervalClass);
        addLine(
          group,
          item.lo,
          item.y - diagramData.marks.cap,
          item.lo,
          item.y + diagramData.marks.cap,
          capClass
        );
        addLine(
          group,
          item.hi,
          item.y - diagramData.marks.cap,
          item.hi,
          item.y + diagramData.marks.cap,
          capClass
        );

        group.appendChild(make("circle", {
          cx: sx(item.mid),
          cy: sy(item.y),
          r: sx(diagramData.marks.dot) - sx(0),
          class: estimateClass
        }));

        drawing.appendChild(group);
      });

      addLine(
        drawing,
        diagramData.frame.left,
        diagramData.frame.dividerY,
        diagramData.frame.right,
        diagramData.frame.dividerY,
        "divider"
      );

      addLine(
        drawing,
        diagramData.marks.hitKeyStart,
        diagramData.frame.legendY,
        diagramData.marks.hitKeyEnd,
        diagramData.frame.legendY,
        "interval-hit"
      );

      drawing.appendChild(make("circle", {
        cx: sx(
          (diagramData.marks.hitKeyStart + diagramData.marks.hitKeyEnd) /
          diagramData.marks.hitTextX
        ),
        cy: sy(diagramData.frame.legendY),
        r: sx(diagramData.marks.dot) - sx(0),
        class: "estimate-hit"
      }));

      drawing.appendChild(make("text", {
        x: sx(diagramData.marks.hitTextX),
        y: sy(diagramData.frame.legendY),
        class: "legend-hit",
        "text-anchor": "start",
        "dominant-baseline": "middle"
      }, `${diagramData.summary.covered} из ${diagramData.summary.repeats} пересекают μ (≈${diagramData.summary.coverage}%)`));

      addLine(
        drawing,
        diagramData.marks.missKeyStart,
        diagramData.frame.legendY,
        diagramData.marks.missKeyEnd,
        diagramData.frame.legendY,
        "interval-miss"
      );

      drawing.appendChild(make("circle", {
        cx: sx(
          (diagramData.marks.missKeyStart + diagramData.marks.missKeyEnd) /
          diagramData.marks.hitTextX
        ),
        cy: sy(diagramData.frame.legendY),
        r: sx(diagramData.marks.dot) - sx(0),
        class: "estimate-miss"
      }));

      drawing.appendChild(make("text", {
        x: sx(diagramData.marks.missTextX),
        y: sy(diagramData.frame.legendY),
        class: "legend-miss",
        "text-anchor": "start",
        "dominant-baseline": "middle"
      }, `${diagramData.summary.missed} из ${diagramData.summary.repeats} не пересекает μ (≈${diagramData.summary.missRate}%)`));

      drawing.appendChild(make("rect", {
        x: sx(diagramData.frame.left),
        y: sy(diagramData.frame.calloutTop),
        width: sx(diagramData.frame.right) - sx(diagramData.frame.left),
        height:
          sy(diagramData.frame.calloutBottom) -
          sy(diagramData.frame.calloutTop),
        class: "callout"
      }));

      drawing.appendChild(make("text", {
        x: sx(diagramData.frame.calloutCenterX),
        y: sy(diagramData.frame.calloutMainY),
        class: "callout-main",
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, `${diagramData.summary.coverage}% — надёжность процедуры в долгой серии повторов`));

      drawing.appendChild(make("text", {
        x: sx(diagramData.frame.calloutCenterX),
        y: sy(diagramData.frame.calloutNoteY),
        class: "callout-note",
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, "Для уже построенного интервала: он либо накрыл μ, либо нет."));

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
