- concept: block_replace требует точной подстроки old, поэтому чтению блока предшествует замена
  question: Агент должен исправить в блоке памяти устаревшую должность пользователя вызовом block_replace(label, old, new). Почему перед этим вызывают block_read(label)?
  explanation: 'block_replace ищет буквальное совпадение old. Агент правит содержимое, которое сам мог записать недели назад и не помнит дословно, — без чтения замена идёт вслепую и промахивается. id тут ни при чём: все четыре инструмента адресуют блок по label.'
  kind: choice
  options:
    - Потому что block_replace принимает точную подстроку old, а её формулировка в блоке агенту неизвестна
    - Потому что block_replace не работает, пока блок не загружен из хранилища в контекст
    - Потому что block_read сбрасывает счётчик символов и освобождает место под new
    - Потому что block_read возвращает id блока, который block_replace требует вместо label
  correct: 0
  id: 014-block-tools-1
  fingerprint: dedeb227
- concept: block_summarize переписывает содержимое компактнее, сохраняя факты, а не отбрасывает старые записи
  question: Блок памяти с лимитом 3000 символов заполнен на 2900, новая запись не влезает. Что делает block_summarize(label)?
  explanation: 'Смысл сжатия — освободить символы, не теряя знание: разрозненные формулировки схлопываются в несколько плотных. Удаление по старшинству выбросило бы факты, которые всё ещё верны; limit — заданное свойство блока, инструмент его не меняет; перенос в archival — отдельное решение, а не то, что делает block_summarize.'
  kind: choice
  options:
    - Удаляет самые старые записи, пока не освободится место
    - Переписывает содержимое блока плотнее, сохраняя факты, но сокращая объём
    - Поднимает limit блока, чтобы вместить новую запись
    - Переносит содержимое блока в archival и очищает блок
  correct: 1
  id: 014-block-tools-2
  fingerprint: 87c87463
- concept: правка core-памяти выражается только вызовами инструментов с аргументами, а не свободным редактированием текста промпта
  question: Объясни своими словами, почему для редактирования блока памяти нужен явный набор инструментов (append, replace, read, summarize), а не общая инструкция агенту «поддерживай память в актуальном состоянии».
  explanation: 'Ключ: у модели нет курсора. Набор инструментов — это перевод намерения «поправь память» в конкретные исполнимые операции над хранилищем; каждая берёт label и применяет своё изменение к value.'
  kind: open
  reference: 'Агент влияет на внешнее состояние только вызовом инструмента с аргументами — он не редактирует текст промпта напрямую. Блок живёт в хранилище и подставляется в промпт при сборке; чтобы изменение сохранилось между запросами, оно должно пройти через вызов, который хранилище применит. Поэтому каждый тип правки нужен как отдельная операция с формальной сигнатурой: дозапись, замена подстроки, чтение, сжатие. Общая инструкция без таких глаголов не даёт агенту ни одного исполнимого действия и остаётся намерением.'
  id: 014-block-tools-3
  fingerprint: e146a240
