- concept: правило поведения, положенное в core-блок, действует в каждом ходе и переживает сессию, а то же правило, сказанное репликой в диалоге, живёт только пока реплика остаётся в окне
  question: Пользователь просит агента всегда отвечать сжато и никогда не давать медицинских советов. Почему это стоит записать в Persona block, а не оставить репликой в диалоге?
  explanation: 'Persona block — самопредставление, тон и ограничения, приколоченные в core: core подставляется безусловно в каждый ход и не зависит от длины разговора. Реплика работает ровно до вытеснения из окна; по контексту блок дороже, а не дешевле — он платится каждым запросом.'
  kind: choice
  options:
    - Реплика в диалоге вообще не влияет на поведение модели
    - Блок будет виден в каждом запросе и переживёт сессию, а реплика перестанет действовать, как только уедет из окна разговора
    - Блок дешевле по контексту, чем одна реплика
    - Реплика попадёт в archival и там будет мешать поиску
