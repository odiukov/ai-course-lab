- concept: блоки тратят фиксированный бюджет контекста в каждом запросе, поэтому их объём ограничен, а редкие факты обязаны оставаться в архиве
  question: Почему нельзя просто перенести всю память агента в блоки, раз блоки надёжнее архива по попаданию в промпт?
  explanation: Разделение памяти на уровни — про распределение бюджета контекста. Блок = гарантия присутствия и постоянная плата. Архив = нулевая плата в покое и вероятностное попадание. Переносить всё в блоки — значит забить окно контекста фактами, которые в текущем запросе не нужны.
  kind: open
  reference: 'Содержимое блоков подставляется в промпт при каждом запросе, значит платится токенами и местом в окне контекста всегда, а не когда факт нужен. Бюджет блоков конечен и он же вытесняет историю диалога. Поэтому в блоки идёт только то, что действительно требуется в каждом ответе (кто пользователь, каким агент себя держит, текущая задача), а редко нужные факты остаются в архиве, где платишь за них лишь в момент попадания в выдачу поиска. Это компромисс: гарантированное присутствие против постоянной стоимости.'
  id: 003-structure-loss-3
  fingerprint: c871bea6
