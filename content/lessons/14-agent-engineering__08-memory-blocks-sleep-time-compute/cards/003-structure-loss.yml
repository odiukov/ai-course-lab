- concept: именованные блоки различаются временем жизни и заменяются независимо друг от друга, тогда как в плоском хранилище все записи однородны
  question: В агенте заданы блоки Human, Persona и Task. Что даёт именно разделение на отдельные именованные блоки, чего не даёт одна общая куча записей?
  explanation: 'Блоки — это типизированные секции с разной областью действия: Human и Persona живут через все сессии, Task — одну. Именование даёт адресуемость: пишешь и перезаписываешь конкретный блок целиком. В однородной куче записей нет способа сказать «эти три обновляются вместе, а те остаются».'
  kind: choice
  options:
    - Task можно целиком заменить при смене задачи, не задев Human и Persona, у которых другое время жизни
    - Каждый блок получает собственную векторную модель эмбеддингов
    - Блоки сжимаются лучше, чем набор отдельных записей, и экономят токены
    - Поиск по блокам работает быстрее, чем поиск по общему индексу
  correct: 0
  id: 003-structure-loss-2
