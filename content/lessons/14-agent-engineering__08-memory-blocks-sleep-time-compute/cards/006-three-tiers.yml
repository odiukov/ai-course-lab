- concept: 'recall и archival различаются механизмом записи: лог ходов пишется автоматически, архивный факт кладётся намеренным вызовом инструмента'
  question: Агент по ходу диалога намеренно сохраняет вызовом инструмента факт «клиент работает на PostgreSQL 16», а кроме того в системе лежит сообщение пользователя, сказанное 70 ходов назад. Куда попадут эти две записи в трёхуровневой схеме памяти?
  explanation: 'Recall наполняется автоматическим логированием ходов — туда сообщение попадает само, без чьего-либо решения. Archival пополняется нарочно: агент (или sleep-time агент) вызывает инструмент и кладёт произвольный факт во внешнее хранилище (вектор, KV, граф). Именно это различие происхождения и оправдывает третий уровень: в двухуровневой схеме обе записи свалились бы в одно «всё остальное».'
  kind: choice
  options:
    - Сообщение — в recall, факт про PostgreSQL — в archival
    - Обе записи — в recall, так как обе возникли в разговоре
    - Обе записи — в archival, так как обеих нет в промпте
    - Сообщение — в archival, факт про PostgreSQL — в core
  correct: 0
  id: 006-three-tiers-1
  fingerprint: b55149cb
- concept: sleep-time агент пишет в core и archival, а recall остаётся уровнем с единственным автоматическим писателем
  question: В какой из трёх уровней памяти фоновый (sleep-time) агент записи не вносит?
  explanation: 'Recall — это история ходов, она пишется автоматическим логированием, а не чьим-то решением. Core и archival имеют по два писателя: сам агент вызовом инструмента и sleep-time агент (перезаписи блоков и загрузка фактов). Двойная запись в этих двух уровнях и создаёт конфликт, из-за которого блокам нужно версионирование.'
  kind: choice
  options:
    - Core
    - Recall
    - Archival
    - Ни в один — фоновый агент только читает
  correct: 1
  id: 006-three-tiers-2
  fingerprint: 67802fc0
- concept: recall охватывает и живой буфер разговора, и уже вытесненный из окна хвост — вытеснение не переводит сообщения в archival
  question: Сообщения из начала длинного разговора уже не помещаются в окно контекста и вытеснены из буфера. Объясни своими словами, на каком уровне памяти они теперь находятся и почему они не оказываются в archival.
  explanation: 'Разница по природе записи, а не по тому, видно ли её сейчас. Recall = буфер + вытесненный хвост, один уровень с автоматическим наполнением. Archival — внешнее хранилище произвольных фактов, куда кладут осознанно. Если считать, что вытеснение переносит сообщения в archival, теряется вся идея разделения: лог снова смешивается с намеренно сохранёнными фактами, ровно как в двухуровневой схеме.'
  kind: open
  reference: 'Они остаются в recall. Recall определяется как история разговора целиком: живой буфер плюс вытесненный хвост — вытеснение из окна меняет только то, лежит ли сообщение в промпте прямо сейчас, но не меняет уровень. В archival попадает то, что кто-то положил туда намеренным вызовом инструмента как произвольный факт; автоматически накопленный лог туда сам не переезжает. Достать вытесненное сообщение можно запросом к recall, как и любую другую часть истории.'
  id: 006-three-tiers-3
  fingerprint: 88a0ce19
