  question: Фоновый агент консолидирует в core-блок содержимое входящих писем, веб-страниц и присланных документов. Какое правило записи снижает риск prompt injection сильнее всего?
  explanation: 'Core-блок подставляется в промпт при каждом обращении, поэтому подложенная фраза вида «игнорируй прежние инструкции» получает не разовое попадание, а постоянную прописку. Сокращение, расписание запуска и лимит на это не влияют. Работает разделение ролей текста: у записи должно быть происхождение, внешний фрагмент помечен как данные и виден агенту именно как чужой контент, а не как часть собственных указаний.'
  kind: choice
  options:
    - Сокращать внешний текст перед записью, чтобы он занимал меньше символов блока
    - Класть внешний фрагмент в блок с явной пометкой источника и статусом «данные», отделяя его от инструкций агента, а не растворяя в общем тексте блока
    - Запускать консолидацию только тогда, когда основной агент простаивает
    - Повышать лимит блока, чтобы внешний контент не вытеснял проверенные факты
