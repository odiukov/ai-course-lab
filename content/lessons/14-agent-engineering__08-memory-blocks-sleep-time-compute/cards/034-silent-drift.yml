- concept: при нескольких писателях в один блок журнал должен фиксировать автора и причину правки, иначе диффа недостаточно, чтобы понять природу изменения
  question: 'В блок памяти пишут два агента: отвечающий на критическом пути и фоновый консолидирующий. Объясни, почему хранить один только дифф (было/стало) недостаточно и какие ещё поля должна нести запись журнала.'
  explanation: Основной агент не наблюдает чужих записей между своими ходами — он видит только итоговый текст блока и читает его как факт. Авторство и причина восстанавливают недостающую половину картины, а без них история блока фиксирует расхождение, но не объясняет его.
  kind: open
  reference: 'Дифф говорит, что значение изменилось, но не говорит, кто и зачем его изменил. При двух писателях это принципиально разные случаи: правка отвечающего агента идёт из реплики пользователя в текущем ходе, а правка фонового — результат консолидации по всему транскрипту, где формулировка могла поехать при сжатии. Поэтому запись должна нести: прежнее value, новое value, автора (основной или фоновый агент), время и причину/повод правки. Только с автором и причиной дифф превращается в ответ на вопрос «откуда взялось это утверждение», а не в констатацию расхождения. Дополнительно это даёт адресность: видно, чей проход портит блок, и его можно чинить отдельно.'
