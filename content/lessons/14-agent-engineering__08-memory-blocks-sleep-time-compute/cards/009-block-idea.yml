- concept: 'поле description у блока памяти адресовано модели: по нему она решает, в какой блок писать новый факт'
  question: У блока памяти в Letta есть поля `id`, `label`, `value`, `limit` и `description`. Агент только что узнал новый факт и должен положить его в один из пяти блоков. Какое поле определяет этот выбор?
  explanation: '`description` пишется не для человека, а для модели: это инструкция «сюда клади факты о пользователе», «сюда — жёсткие ограничения». `label` служит адресом в вызове инструмента, `limit` — только бюджет символов, `id` — техническая ссылка. Без осмысленного `description` модель начинает сваливать факты в случайный блок.'
  kind: choice
  options:
    - '`description` — текстовое пояснение о назначении блока, которое читает сама модель'
    - '`id` — по нему блоки сортируются, факт идёт в блок с наименьшим id'
    - '`limit` — факт идёт в блок с наибольшим запасом свободных символов'
    - '`value` — модель ищет блок, где уже встречается похожая формулировка'
  correct: 0
  id: 009-block-idea-1
  fingerprint: 3755d249
- concept: limit блока задаётся в символах и определяет, сколько записей влезет до вызова block_summarize
  question: У блока памяти `limit` = 3200 символов, блок пуст. Агент дописывает в него записи ровно по 128 символов каждая. Сколько записей поместится, прежде чем придётся сжимать блок?
  explanation: 3200 / 128 = 25. Лимит блока измеряется в символах, а не в записях, потому что блок целиком уходит в промпт каждого запроса и должен занимать предсказуемый объём. При достижении лимита следующий `block_append` не пройдёт, и агент обязан сначала вызвать `block_summarize`, чтобы ужать содержимое.
  kind: numeric
  answer: 25
  tolerance: 0.5
  id: 009-block-idea-2
  fingerprint: f0bca7f5
- concept: 'выбор инструмента редактирования блока по типу правки: замена подстроки на месте против дозаписи в конец'
  question: В блоке `human` записано «работает в отделе аналитики». Роль поменялась на «отдел платежей», остальное содержимое блока трогать нельзя. Каким инструментом агент вносит правку?
  explanation: '`block_replace` меняет указанную подстроку на месте — остальной текст блока и все прочие блоки остаются нетронутыми. `block_append` только дописывает в конец, из-за чего в блоке остались бы обе взаимоисключающие версии роли. `block_read` и `block_summarize` вообще не вносят содержательных правок.'
  kind: cloze
  template: ___("human", "отдел аналитики", "отдел платежей")
  answer: block_replace
  accept:
    - block_replace
  id: 009-block-idea-3
