- concept: 'отвечающий и фоновый агент разделены по времени исполнения, а не по владению данными: одно хранилище безопасно только потому, что проходы не пересекаются'
  question: Отвечающий агент и фоновый агент-уборщик работают с одним и тем же хранилищем блоков памяти и оба имеют право на запись. Почему в этой схеме не требуется блокировок и разрешения конфликтов?
  explanation: 'Делят не данные, а моменты времени. Блоки общие именно для того, чтобы уборка была видна следующему ходу. Если запустить фоновый проход параллельно с ходом, отвечающий агент дописывает в value, которое уборщик в этот же момент переписывает целиком после сжатия, — дозапись теряется. Атомарность отдельной записи от этого не спасает: конфликт на уровне «прочитал старое value, сочинил новое, перезаписал».'
  kind: choice
  options:
    - 'Их исполнение разнесено во времени: фоновый проход стартует только после того, как ответ отправлен, и завершается до следующего хода'
    - Каждому агенту принадлежит свой набор блоков, и чужие блоки для него доступны только на чтение
    - Запись в блок атомарна на уровне хранилища, поэтому одновременные правки безопасны
    - Фоновый агент работает с копией и в конце сливает изменения через merge
