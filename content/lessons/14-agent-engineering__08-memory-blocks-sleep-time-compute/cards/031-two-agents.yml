- concept: 'порядок одного цикла с двумя агентами: правки, нужные ответу, идут до его выдачи, уборка — после, а её результат достаётся следующему ходу'
  question: Пользователь сообщает факт, который противоречит уже записанному в память. Расставь операции цикла в порядке исполнения.
  explanation: Всё, что нужно текущему ответу, помещается в ход и стоит ровно один дешёвый вызов записи. Всё, что требует обхода архива и вызова модели, ждёт закрытия хода. Результат уборки не возвращается сообщением — он просто лежит в общих блоках к моменту следующего чтения.
  kind: order
  items:
    - Отвечающий агент читает core-блоки и формирует ответ на сообщение
    - Отвечающий агент одним вызовом дописывает сырую запись о новом факте в блок
    - Ответ уходит пользователю, ход закрыт
    - Фоновый агент проверяет заполненность блока и уплотняет его содержимое
    - Фоновый агент помечает опровергнутую запись в архиве как неверную
    - Следующий ход отвечающего агента читает блоки уже в уплотнённом виде
