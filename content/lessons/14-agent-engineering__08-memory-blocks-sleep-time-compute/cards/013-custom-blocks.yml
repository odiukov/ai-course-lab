- concept: рост числа блоков повышает риск ошибки маршрутизации факта, и лечится он уточнением description, а не лимитов или ярлыков
  question: 'В core-памяти агента заведено семь блоков: human, persona, task, project, safety, tooling, style. Агент раз за разом кладёт явный запрет пользователя («не трогать биллинг») в блок task вместо safety. Что править в первую очередь?'
  explanation: 'Ошибка тут не в ёмкости и не в хранилище, а в маршрутизации: модель выбирает блок для записи по его description. Чем больше блоков с пересекающейся семантикой, тем чаще одного ярлыка не хватает. limit отвечает за переполнение и block_summarize, ярлык — только за адресацию инструментами; ни то, ни другое не подсказывает, какой факт куда класть.'
  kind: choice
  options:
    - Поднять limit блока safety, чтобы туда влезло больше записей
    - Уточнить description блоков task и safety так, чтобы граница между ними была явной
    - Переименовать ярлык safety в constraints — более понятное слово
    - Перенести запрет в archival и искать его вектором при каждом запросе
  correct: 1
  id: 013-custom-blocks-1
  fingerprint: f45ed4c0
- concept: 'пользовательские блоки не привилегированы: у них та же схема полей и тот же набор инструментов редактирования, что у Human и Persona'
  question: Инженер заводит в Letta собственный блок с ярлыком safety. Что понадобится для его чтения и правки?
  explanation: Human и Persona — не встроенные сущности с особым API, а два примера общего типа. Любой блок описывается той же схемой (id, label, value, limit, description) и правится тем же набором инструментов; создание блока task, project или safety не добавляет новых вызовов.
  kind: choice
  options:
    - Тот же набор block_append / block_replace / block_read / block_summarize, адресующий блок по label
    - Отдельные инструменты вида safety_append и safety_replace, зарегистрированные под новый блок
    - 'Ничего: пользовательские блоки доступны только на чтение, писать в них может лишь sleep-time агент'
    - Прямая запись в archival — собственный блок хранится там, а не в core
  correct: 0
  id: 013-custom-blocks-2
  fingerprint: 35b682d8
- concept: полезная description задаёт критерий отбора и границу с соседними блоками, а не пересказывает ярлык
  question: Для блока с ярлыком project нужно написать description. Объясни своими словами, чем полезная формулировка отличается от бесполезной, и приведи пример полезной.
  explanation: 'description читает модель перед правкой памяти, а не человек в интерфейсе. Значит, ценность формулировки измеряется тем, насколько она сокращает неоднозначность между блоками: критерий включения плюс явные исключения. Тавтология ярлыка эту работу не делает.'
  kind: open
  reference: 'Бесполезная description пересказывает ярлык («здесь про проект») — она не добавляет ничего к тому, что модель уже видит в label, и потому не снимает выбор между близкими блоками. Полезная задаёт критерий попадания и явную границу с соседями, включая исключения: «факты о кодовой базе и процессе — версии зависимостей, команда запуска тестов, правила миграций; текущая цель работы — в task, жёсткие запреты пользователя — в safety, предпочтения человека — в human». Такая формулировка превращает выбор блока из угадывания в проверку критерия.'
  id: 013-custom-blocks-3
  fingerprint: f237a13d
