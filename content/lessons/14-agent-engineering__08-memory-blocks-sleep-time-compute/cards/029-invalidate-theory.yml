- concept: дедупликация по порогу текстового пересечения не ловит опровержение, потому что противоречащие записи описывают один атрибут разными словами
  question: 'В архиве агента лежат две записи: «работает бэкенд-разработчиком в банке» и «с апреля работает продакт-менеджером в стартапе». Фоновый проход дедупликации сливает записи при пересечении от 80%. Что он сделает с этой парой?'
  explanation: 'Дедупликация меряет похожесть текста. Опровергнутый факт и новый почти не пересекаются словами — «бэкенд-разработчик в банке» против «продакт-менеджер в стартапе» это далеко от 80%. Для дедупликации это два полезных непохожих факта. Инвалидация — отдельный проход с другим критерием: не «насколько похожи», а «совместимы ли по одному и тому же атрибуту».'
  kind: choice
  options:
    - Сольёт их в одну запись, потому что обе про работу
    - 'Ничего: пересечение слишком мало, обе записи останутся в архиве как два разных факта'
    - Удалит более старую, потому что у неё нет даты
    - Отправит обе на суммаризацию, потому что они конфликтуют
  correct: 1
  id: 029-invalidate-theory-1
  fingerprint: 70ace8b2
- concept: критерий инвалидации — несовместимость двух записей по одному атрибуту, а не то, что одна запись новее другой
  question: 'Фоновый агент добавил запись №640: «сменил телефон на +351...». Какая старая запись подлежит инвалидации?'
  explanation: 'Инвалидируется не «старое», а несовместимое: две записи заполняют один и тот же слот (номер телефона) разными значениями, и одновременно верными быть не могут. Возраст записи сам по себе не повод: «предпочитает переписку» старше, но новому факту не противоречит и остаётся валидным. Близость по вектору тоже не критерий — она меряет похожесть формулировок.'
  kind: choice
  options:
    - Любая запись, добавленная раньше №640
    - Запись с прежним номером телефона того же человека
    - Запись «предпочитает переписку звонкам»
    - Ближайшая по вектору запись из выдачи поиска
  correct: 1
  id: 029-invalidate-theory-2
  fingerprint: 7f47397f
- concept: опровергнутая запись помечается как неверная с даты и исключается из выдачи поиска, а не стирается физически
  question: Почему при инвалидации архивной записи её помечают как неверную с определённой даты, а не удаляют физически? Объясни своими словами.
  explanation: 'Разделяй два эффекта: выключение записи из поиска и уничтожение данных. Для качества ответов нужен только первый. Пометка «неверно с такого-то числа» даёт его и вдобавок оставляет след изменения — при ошибке фонового агента запись можно вернуть.'
  kind: open
  reference: 'Цель инвалидации — убрать запись из выдачи поиска, чтобы она не спорила с актуальной и не побеждала в ранжировании. Этого достаточно достичь пометкой: помеченная запись перестаёт участвовать в извлечении. При этом сохраняется история факта — видно, что значение менялось и когда, а не что оно загадочно исчезло. Это даёт возможность откатить ошибочную инвалидацию, разобрать конфликт, если новый факт окажется неверным, и отличить «факт устарел» от «факта никогда не было». Физическое удаление необратимо и уничтожает эту информацию.'
  id: 029-invalidate-theory-3
  fingerprint: 35b1c7fc
