- concept: полный попарный поиск дублей стоит n(n-1)/2 сравнений и растёт квадратично
  question: Фоновый проход дедупликации сравнивает каждую архивную запись с каждой другой ровно один раз. В архиве 2000 записей. Сколько сравнений пар он выполнит?
  explanation: 'Число неупорядоченных пар из n элементов равно n(n-1)/2 = 2000·1999/2 = 1 999 000. Рост квадратичный: удвоение архива учетверяет работу. Именно поэтому дедупликация уходит в sleep-проход, а не в ответ пользователю.'
  kind: numeric
  answer: 1999000
  tolerance: 1
  id: 027-dedup-theory-1
  fingerprint: 54825b0d
- concept: высокий порог пересечения выбирают потому, что цена ложного слияния — безвозвратная потеря уникального факта, а цена пропуска — лишь дубль в промпте
  question: Дедупликация архива сливает две записи, если их пересечение по токенам выше порога. Инженер снижает порог с 0.95 до 0.7. Какое последствие наиболее серьёзно?
  explanation: 'Число сравнений от порога не зависит — он применяется уже к посчитанной мере. Ошибки двух видов неравноценны: пропущенный дубль лишь занимает место в промпте, а ложное слияние уничтожает факт, который был только в одной из записей. Поэтому порог держат высоким (в практике — выше 0.9).'
  kind: choice
  options:
    - Проход станет медленнее, потому что придётся сравнивать больше пар
    - Записи, отличающиеся уникальным фактом, будут слиты, и этот факт исчезнет из архива безвозвратно
    - Векторный индекс перестанет находить слитые записи по поиску
    - Часть настоящих дублей перестанет распознаваться и останется в архиве
  correct: 1
  id: 027-dedup-theory-2
  fingerprint: 5b2261e5
- concept: слияние почти-дублей объединяет их содержимое, а не удаляет одну запись как избыточную
  question: 'В архиве две записи: «Пользователь переехал в Осло в июне» и «Пользователь переехал в Осло в июне, сменил работу». Пересечение по токенам выше порога. Что должен сделать sleep-проход?'
  explanation: Порог говорит только о том, что записи почти одинаковы, а не о том, что одна лишняя. Слепое удаление любой из сторон убивает то, что было лишь в ней (здесь — смену работы). Слияние обязано сохранить объединение фактов; отметка «устарело» — это про противоречие, а не про дублирование.
  kind: choice
  options:
    - Удалить более короткую запись как полностью содержащуюся в длинной
    - Удалить более длинную запись, оставив минимальную формулировку факта
    - Заменить обе одной записью, содержащей объединение фактов обеих
    - Оставить обе, пометив младшую как устаревшую
  correct: 2
  id: 027-dedup-theory-3
