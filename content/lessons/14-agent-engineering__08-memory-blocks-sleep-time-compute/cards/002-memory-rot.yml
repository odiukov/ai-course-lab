- concept: 'порядок операций консолидации: собрать кандидатов по теме, сравнить по времени/противоречию, пометить опровергнутое, оставить одну актуальную запись'
  question: Фоновая консолидация памяти чистит архив от противоречий. Расставь шаги в правильном порядке.
  explanation: 'Инвалидация невозможна без предварительной группировки: пока записи про город лежат вперемешку с остальными 400, противоречие не видно. Сначала кластеризация по теме, потом сравнение и разрешение конфликта, и только затем запись единственной актуальной версии.'
  kind: order
  items:
    - Собрать из архива группу записей, относящихся к одному факту о пользователе
    - Сравнить их между собой и найти пары, где поздняя запись противоречит ранней
    - Пометить опровергнутые записи как недействительные, а точные дубли склеить
    - Оставить одну актуальную формулировку факта, доступную поиску
  id: 002-memory-rot-3
  fingerprint: eefb8baa
