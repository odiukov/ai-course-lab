- concept: memory rot — деградация качества памяти от накопления противоречащих и устаревших записей, лечится инвалидацией и дедупликацией вне диалога
  question: Объясни своими словами, что такое memory rot в агентной памяти и почему проблема не решается увеличением объёма хранилища или числа извлекаемых записей.
  explanation: 'Ключ: rot — проблема качества, а не ёмкости. Ни объём, ни top-k её не лечат, лечит только явная ревизия записей — дедупликация и инвалидация.'
  kind: open
  reference: 'Memory rot — накопление в долговременной памяти записей, которые когда-то были верны, но уже опровергнуты новыми, при том что удалять их некому. Агент ничего не забыл — он помнит слишком много и не отличает «было правдой» от «правда сейчас». Больше места делает только хуже: растёт доля мусора. Больше извлечённых записей тоже не помогает — увеличивается количество согласных устаревших голосов и растёт контекст. Нужна операция другого рода: пройти по хранилищу, склеить дубли, пометить опровергнутое как недействительное. Это дорогая операция над всем архивом, поэтому её выносят из диалога — в Letta её делает sleep-time-агент.'
  id: 002-memory-rot-2
