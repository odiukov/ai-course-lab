- concept: инструменты редактирования адресуют блок по label, а id остаётся техническим идентификатором на стороне хранилища
  question: Агент дозаписывает факт в блок памяти с именем `task`. Чем он идентифицирует блок в вызове инструмента?
  explanation: Модель обращается к блоку по человекочитаемому `label` — это имя, которое она видит в промпте. Поле `id` (строка вида `block-7f3a...`) нужно коду и базе для адресации записи; модель им не оперирует и в аргументы инструментов оно не идёт.
  kind: cloze
  template: block_append(___, "дедлайн сдвинут на пятницу")
  answer: '"task"'
  accept:
    - task
    - '''task'''
    - label="task"
    - label
  id: 010-block-fields-1
  fingerprint: ab408213
- concept: новые факты попадают в value, а description остаётся неизменной метаинформацией о назначении блока
  question: 'У блока `human` поле description: «факты о пользователе: имя, роль, предпочтения». Агент узнал, что пользователь перешёл с Java на Go. Что изменится в блоке?'
  explanation: '`value` — содержимое блока, оно и растёт от новых фактов. `description` описывает назначение блока и служит модели правилом маршрутизации («куда класть новый факт»); если он начнёт меняться вслед за фактами, модель потеряет стабильный признак выбора блока. `id` — неизменный технический адрес записи.'
  kind: choice
  options:
    - Изменится `value` — туда добавляется или там правится сам факт; `description` остаётся прежним
    - Изменится `description` — он должен перечислять актуальные факты о пользователе
    - 'Изменятся оба: `description` дублирует содержимое `value` в сжатом виде'
    - Изменится `id`, потому что содержимое блока стало другим
  correct: 0
  id: 010-block-fields-2
  fingerprint: d78da422
