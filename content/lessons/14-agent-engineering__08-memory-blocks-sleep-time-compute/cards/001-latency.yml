- concept: редкая дорогая операция почти не двигает среднее время ответа, но целиком задаёт хвостовой перцентиль
  question: Агент обработал 400 запросов. Обычный ответ занимает 2 секунды. В 6% запросов агент дополнительно консолидирует память прямо перед ответом, и такой запрос занимает 13 секунд. Чему равна задержка на 95-м перцентиле (в секундах)?
  explanation: '6% запросов (24 штуки) медленные, а верхние 5% распределения — это 20 самых медленных. Значит весь хвост выше 95-го перцентиля состоит из запросов с консолидацией: p95 = 13 с. Среднее при этом всего 2 + 24·11/400 = 2.66 с — почти не сдвинулось. Отсюда правило: работу с памятью на критическом пути по среднему не видно, её видно только по хвосту.'
  kind: numeric
  answer: 13
  tolerance: 0.1
  id: 001-latency-1
  fingerprint: 64292df0
- concept: критический путь — работа, обязательная до выдачи ответа; только она добавляется к задержке пользователя
  question: Что означает, что операция агента находится «на критическом пути» запроса?
  explanation: 'Критический путь определяется по обязательности до ответа, а не по цене или риску. Поэтому вопрос «сколько стоит операция» и вопрос «где она стоит» — разные: консолидация памяти полезна в любом случае, но пока она на критическом пути, каждая её секунда — секунда ожидания пользователя.'
  kind: choice
  options:
    - Она обязана завершиться до того, как пользователь увидит ответ, поэтому её время напрямую добавляется к задержке
    - Она потребляет больше всего токенов среди всех операций запроса
    - Она может упасть и уронить весь запрос, но на время ответа не влияет
    - Она выполняется на самой дорогой модели из доступных агенту
