- concept: sleep-time compute меняет момент выполнения консолидации, а не её объём; суммарные вычисления не уменьшаются
  question: 'Инженер говорит: «Мы включили sleep-time compute, значит агент стал делать меньше работы с памятью». В чём он ошибается и что на самом деле изменилось?'
  explanation: 'Типичная подмена: перенос работы принимают за её сокращение. Sleep-time compute — оптимизация расписания, а не бюджета. Платой за низкий хвост становится дополнительный фоновый расход, и именно потому, что фон не ограничен задержкой, там разумно ставить более сильную модель.'
  kind: open
  reference: 'Sleep-time compute не сокращает объём работы — он разделяет два вопроса: ЧТО делать с памятью и КОГДА. Чистка, дедупликация, разрешение противоречий («живёт в Киеве» против «переехал во Львов») выполняются в прежнем или даже большем объёме, а суммарный расход токенов и вычислений обычно растёт, потому что фоновый агент может позволить себе более тщательную (и более дорогую) обработку. Меняется только момент: консолидация уходит с критического пути в промежутки между запросами, когда никто не ждёт. Выигрыш — в воспринимаемой задержке, прежде всего в хвостовых перцентилях, а не в объёме вычислений.'
  id: 001-latency-3
  fingerprint: 8659e6fe
