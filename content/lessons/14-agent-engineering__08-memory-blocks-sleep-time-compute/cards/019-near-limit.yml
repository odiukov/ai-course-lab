- concept: порог срабатывания задаётся долей от лимита конкретного блока, а точка срабатывания равна limit × threshold
  question: Блок памяти имеет limit = 4096 символов, порог срабатывания предупреждения задан как 0.75. При какой минимальной длине value предикат вернёт True? Ответ в символах.
  explanation: 'Порог — доля от лимита самого блока, а не абсолютный запас в символах: 4096 × 0.75 = 3072. Доля важна потому, что лимит у блоков разный, и один и тот же абсолютный запас для блока в 512 символов означал бы совсем другую степень заполненности.'
  kind: numeric
  answer: 3072
  tolerance: 1
  id: 019-near-limit-2
