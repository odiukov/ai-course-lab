- concept: порог ставится строго ниже единицы, чтобы дозапись успела упереться в предупреждение раньше, чем в жёсткий лимит
  question: Почему предикат «пора сжимать блок» настраивают на срабатывание раньше полного заполнения, а не ровно по достижении лимита? Объясни своими словами.
  explanation: Смысл раннего порога — запас хода, а не точность измерения. При лимите 4096 и пороге 0.75 остаётся 1024 символа буфера на записи, которые придут до следующего прохода консолидации.
  kind: open
  reference: 'Консолидация запускается не мгновенно — она происходит между ходами, а записи в блок идут во время хода. Если ждать 100% заполнения, очередная дозапись упрётся в лимит и будет отвергнута или обрежется раньше, чем фоновый агент придёт сжимать. Порог ниже единицы оставляет запас: предупреждение зажигается, когда места ещё хватает на несколько записей, и сжатие успевает отработать до отказа. Это же и причина, по которой порог — настраиваемый аргумент: чем интенсивнее пишут в блок, тем ниже его надо ставить.'
  id: 019-near-limit-3
  fingerprint: 2746853d
