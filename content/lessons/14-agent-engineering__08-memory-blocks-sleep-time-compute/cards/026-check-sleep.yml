- concept: 'две ошибки сортировки неравноценны: лишняя работа на критическом пути стоит только задержки, а отложенная нужная запись — правильности ответа'
  question: 'Инженер разложил операции с памятью на «сейчас» и «в фон» и ошибся дважды: дедупликацию архива оставил на критическом пути, а смену активной задачи пользователя отдал фоновому агенту. Чем отличаются последствия этих двух ошибок?'
  explanation: Держать в критическом пути то, что могло подождать, — потеря секунд, качество ответа не страдает. Отправить в фон факт, нужный ближайшей реплике, — агент отвечает по устаревшему блоку. Поэтому при сомнении дешевле ошибиться в сторону немедленной записи.
  kind: choice
  options:
    - 'Ошибки симметричны: в обоих случаях цена — один лишний вызов модели'
    - Первая стоит только лишней задержки ответа, вторая даёт объективно неверные ответы, пока фоновый прогон не случился
    - Первая даёт неверные ответы, вторая — только задержку
    - 'Обе безобидны: фоновый агент в следующем прогоне исправит и то, и другое'
  correct: 1
  id: 026-check-sleep-1
  fingerprint: b0124ef9
- concept: фоновый агент передаёт свои выводы основному через запись в общие блоки памяти, а не через сообщения или перезапуск
  question: Sleep-time агент разобрал транскрипт и вывел, что пользователь переключился на другой проект. Каким путём этот вывод доходит до основного агента?
  explanation: 'Два агента не переписываются — они делят память. Фоновый пишет в общие блоки и правит архив, основной подхватывает это при обычной сборке промпта. Отсюда же берётся риск silent drift: блок под основным агентом переписали, а он этого не заметил.'
  kind: choice
  options:
    - Записью в общий блок памяти (learned_context и другие блоки), который собирается в промпт при следующем запросе
    - Отправкой сообщения основному агенту прямо в его очередь ходов
    - Перезапуском основного агента с новым системным промптом
    - Возвратом значения из вызова инструмента, который основной агент ждёт
  correct: 0
  id: 026-check-sleep-2
  fingerprint: 90ef94ae
- concept: одно событие памяти разделяется на срочную часть (минимальная правка ради ближайшего ответа) и отложенную (уборка в фоне)
  question: Пользователь сообщил новое ограничение по стилю ответов, а блок persona уже раздут и содержит два похожих старых пункта. Расставь шаги по порядку.
  explanation: Срочна только та часть, без которой следующий ответ будет неправильным, — сама запись факта. Наведение порядка (склейка дублей, сжатие, инвалидация) опоздание на десятки секунд переживает, поэтому уходит за границу критического пути.
  kind: order
  items:
    - Внести минимальную правку в блок на критическом пути — ограничение нужно уже ближайшему ответу
    - Вернуть ответ пользователю
    - После завершения хода запустить sleep-time агента на этом транскрипте
    - В фоне склеить дубли и переписать блок компактнее, пометив опровергнутые пункты
  id: 026-check-sleep-3
