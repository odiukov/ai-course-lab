  question: Реализация агента отказалась от встроенных в текст токенов `Thought:` и от пары send_message/heartbeat в пользу нативных рассуждений. Что при этом изменилось в цикле управления?
  explanation: 'Нативные рассуждения — изменение протокола, а не алгоритма: думать-действовать-наблюдать остаётся тем же ReAct-циклом. Выигрыш в том, что трассу задаёт поле ответа API, а не инструкция «пиши размышления после слова Thought», и случайная перефразировка промпта её больше не ломает; заодно рассуждение не тратится из бюджета текста, уходящего пользователю.'
