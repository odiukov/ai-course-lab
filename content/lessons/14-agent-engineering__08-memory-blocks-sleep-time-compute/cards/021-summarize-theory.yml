- concept: 'верхняя граница порога определяется требуемым запасом: свободного места должно хватить и на входящую запись, и на то, чтобы результат сжатия сел в блок'
  question: Лимит блока — 3000 символов. Чтобы сжатие оставалось выполнимым, инженер требует, чтобы в момент срабатывания проверки в блоке оставалось свободно не меньше 900 символов (на входящую запись и на посадку сжатого значения). Какое максимальное значение порога (долей от лимита) это допускает?
  explanation: 'Запас = limit − limit × threshold. Нужно 900 из 3000, значит свободная доля не меньше 0.3, а порог не больше 0.7. Смысл требования: если запаса нет, сжимать уже нечем — модель должна прочитать старое значение и вернуть новое, и это новое тоже обязано поместиться в блок.'
  kind: numeric
  answer: 0.7
  tolerance: 0.01
