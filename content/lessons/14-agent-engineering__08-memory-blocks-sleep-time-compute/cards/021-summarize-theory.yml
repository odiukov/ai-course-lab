  question: Агент дошёл до порога и запускает пересказ содержимого memory block. Чем эта операция отличается от обычного редактирования блока?
  explanation: 'Суммаризация блока раскладывается на: прочитать value, дать модели сжать текст, записать результат тем же инструментом перезаписи. Никакого отдельного механизма нет — поэтому и все ограничения перезаписи в силе, включая то, что результат должен уместиться в limit.'
  kind: choice
  options:
    - 'Ничем на уровне хранилища: это та же перезапись value блока, только новое, более компактное значение генерирует модель из старого, а не подставляет разработчик'
    - 'Это транзакция особого типа: блок временно отключается от промпта, пока идёт пересказ'
    - Пересказ пишет результат в archival, а блок очищается полностью
