- concept: 'skill в Claude Agent SDK структурно повторяет блок памяти (именованный, версионированный, подгружаемый по требованию), отличаясь содержимым: инструкции и знания вместо фактов о пользователе'
  question: Skills в Claude Agent SDK предлагают рассматривать как ту же конструкцию, что и блоки памяти. В чём именно совпадение и в чём различие?
  explanation: 'Skill — именованный кусок инструкций с версией, который агент подгружает по необходимости; ровно та же структура, что у блока памяти. Разница в наполнении: блок держит факты о пользователе и о самом агенте, skill — процедурное знание. Поэтому отдельного механизма учить не нужно.'
  kind: choice
  options:
    - Совпадает форма — именованная версионированная единица, которую агент подтягивает сам; различается содержимое — инструкции и знания вместо фактов о пользователе
    - Совпадает содержимое — оба хранят факты о пользователе; различается место хранения — skill лежит на диске, блок в базе
    - Совпадает механизм поиска — оба достаются вектором по похожести; различается только лимит на объём
    - Совпадает способ записи — оба редактируются фоновым агентом; различается то, что skill попадает в промпт безусловно
