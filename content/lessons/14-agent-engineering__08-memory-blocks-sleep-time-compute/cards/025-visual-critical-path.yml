  question: Sleep-time агент работает вне критического пути, поэтому требование «уложись в отведённые секунды» к нему не предъявляется. Какое ограничение при этом остаётся и определяет выбор модели для него?
  explanation: 'Вынос за критический путь снимает только латентное ограничение. Денежное остаётся: если консолидация в фоне идёт после каждого разговора на модели вдесятеро дороже, счёт растёт, хотя задержка нулевая. Поэтому «модель помощнее» — это торговля стоимости на качество памяти, а не бесплатный апгрейд. Окно контекста и совпадение моделей ролью не связаны: блоки — обычный текст с полями, их читает любая модель.'
