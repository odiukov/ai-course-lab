- concept: 'маршрутизация входящего факта: проверка на существующую версию идёт раньше проверки свободного места, потому что замена изменяет длину блока и может снять вопрос о переполнении'
  question: Агент получил новый факт и должен положить его в блок памяти. Расставь шаги обработки в правильном порядке.
  explanation: 'Сначала выясняется тип правки, потом вопрос ёмкости. Порядок не переставить: замена устаревшего фрагмента часто оставляет длину прежней или уменьшает её, поэтому проверять место до проверки на дубликат — значит запускать сжатие там, где оно не нужно. И наоборот: дозапись поверх существующей версии факта портит блок независимо от того, сколько в нём свободного места.'
  kind: order
  items:
    - Прочитать блок и проверить, есть ли там уже версия этого факта
    - Если версия есть — заменить её на месте и на этом остановиться
    - Если версии нет — оценить, влезает ли факт в остаток лимита блока
    - При нехватке места сжать содержимое блока
    - Дописать новый факт в конец блока
