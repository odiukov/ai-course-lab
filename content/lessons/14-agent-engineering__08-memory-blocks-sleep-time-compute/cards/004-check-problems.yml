- concept: потеря структуры — ограничение представления, а не расписания, поэтому фоновая консолидация её принципиально не лечит
  question: 'Команда добавила агенту фоновую консолидацию памяти: он в паузах вычищает противоречия и сжимает записи. Хранилище осталось плоским архивом с поиском по похожести. Почему это не решает проблему «Persona обязана быть в промпте при каждом запросе»?'
  explanation: 'Разделяй лекарства по природе беды: гниение — проблема содержимого (лечится работой в паузе), потеря структуры — проблема формы хранения (лечится типизированными блоками). Идеально вычищенный плоский архив всё ещё не умеет сказать «эта запись обязательна».'
  kind: open
  reference: 'Sleep-time compute меняет только момент и качество уборки — какие записи лежат в архиве. Но извлечение из архива всё равно условное: запись попадает в контекст лишь при совпадении по поиску. «Всегда в промпте» — это свойство представления хранилища, а не расписания работ, и никакая фоновая уборка его не создаёт. Нужен отдельный тип хранения — именованный блок, который включается в промпт безусловно.'
  id: 004-check-problems-2
  fingerprint: de3a8f06
- concept: 'имена MemGPT и Letta: MemGPT — статья и паттерн, Letta — имя платформы, взятое проектом позже, с отдельным этапом переписывания V1'
  question: Как соотносятся названия MemGPT и Letta?
  explanation: Проект MemGPT переименовался в Letta в 2024-м, но за паттерном виртуального контекста из статьи имя MemGPT сохранилось. Переписанная Letta V1 (2026) — отдельный, более поздний шаг, а не то же самое, что переименование.
  kind: choice
  options:
    - Letta — конкурирующая реализация паттерна MemGPT от другой команды
    - MemGPT — имя, оставшееся за паттерном из статьи, а Letta — имя, которое взяла себе сама платформа; переписанная V1 — более поздний отдельный этап
    - MemGPT — платформа, Letta — библиотека блоков памяти внутри неё
    - Это два названия одного релиза, выпущенного под двумя брендами одновременно
