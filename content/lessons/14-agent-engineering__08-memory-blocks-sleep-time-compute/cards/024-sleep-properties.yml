- concept: бюджет времени фонового агента задаётся паузой до следующего обращения, а не задержкой ответа
  question: Консолидация памяти вынесена в фонового агента. На быстрой модели прогон занимает 6 секунд. Память обязана быть обновлена к моменту следующего обращения пользователя, а типичная пауза между сессиями — 90 секунд. Во сколько раз более медленную модель можно поставить фоновому агенту, не нарушая это требование?
  explanation: 'Уход с критического пути снимает ограничение по задержке ответа, но не отменяет ограничение вообще: верхняя граница теперь равна длине паузы, 90 / 6 = 15. Именно поэтому фоновому агенту разрешают дорогую и медленную модель — у него бюджет в десятки секунд вместо долей секунды, а не бесконечность.'
  kind: numeric
  answer: 15
  tolerance: 0.5
  id: 024-sleep-properties-1
  fingerprint: be107e01
- concept: в фон переносима только та работа с памятью, результат которой не нужен текущему ответу
  question: Какую операцию с памятью нельзя перенести в фонового агента?
  explanation: 'Критерий переноса один: нужен ли результат операции до выдачи ответа. Дедупликация, инвалидация и обобщение транскрипта влияют на будущие ответы, поэтому ждут. Факт, без которого текущий ответ будет неверным, обязан быть записан до ответа — его отсрочка ломает сам ответ, а не только память.'
  kind: choice
  options:
    - Запись факта, который пользователь только что сообщил и на который агент обязан опереться в этом же ответе
    - Склейку дубликатов среди архивных записей об одной теме
    - Вычёркивание факта, опровергнутого вчерашней репликой
    - Вынос в блок того, что трижды повторилось в транскрипте
  correct: 0
