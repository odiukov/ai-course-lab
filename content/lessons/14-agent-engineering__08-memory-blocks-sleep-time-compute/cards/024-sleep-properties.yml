- concept: фоновый агент видит транскрипт целиком, поэтому доступны выводы по совокупности ходов, недоступные писателю, работающему по одному сообщению
  question: Основной агент решает про запись в память по каждому сообщению отдельно. Фоновый агент читает весь накопленный транскрипт. Какие выводы становятся возможны только во втором режиме? Объясни своими словами.
  explanation: 'Второе и третье следствия ухода в фон опираются не только на снятое ограничение по времени, но и на охват: фоновый прогон читает много записей сразу. Операции такого рода стоят пропорционально размеру корпуса, а не длине одного хода, поэтому на пути ответа они не помещаются ни по времени, ни по смыслу.'
  kind: open
  reference: 'Фоновому агенту доступны выводы по совокупности ходов, а не по одному ходу: факт, который повторялся в разговоре несколько раз, — значит устойчивое предпочтение, а не случайная реплика; противоречие между старой записью и более поздней — значит старую пора вычеркнуть; несколько записей об одной теме — значит их можно склеить в одну. Агент, видящий по одному сообщению за раз, не может ни сравнить запись с остальным корпусом, ни оценить частоту: у него нет второго элемента для сравнения. Дело здесь не в силе модели, а в объёме входа, который позволяет себе только работа вне критического пути.'
  id: 024-sleep-properties-3
  fingerprint: e919c110
