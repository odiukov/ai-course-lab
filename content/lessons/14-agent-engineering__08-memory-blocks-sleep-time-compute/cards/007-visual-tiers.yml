- concept: core изменяется перезаписью на месте, archival пополняется добавлением, поэтому затирание чужой правки возможно именно в core
  question: Основной агент и sleep-time агент независимо трогают память одного и того же агента. Почему риск потерять уже сохранённый факт выше в core, чем в archival?
  explanation: 'Блок core — фиксированный кусок текста в промпте: новая правка кладётся на место старой, и прежнее содержимое исчезает. Archival растёт добавлением, старая запись остаётся лежать (её потом отдельно инвалидируют при консолидации). Отсюда и требование к core-блокам иметь версию: без неё две правки на одном блоке сводятся к «победила последняя».'
  kind: choice
  options:
    - Core правят перезаписью содержимого блока, а в archival факты добавляются новыми записями рядом со старыми
    - Core хранится в оперативной памяти и стирается при перезапуске процесса, archival — на диске
    - В archival запись может делать только один из двух агентов, поэтому конкуренции там нет
    - Core не поддерживает запись инструментами, туда попадают только результаты автоматического логирования
  correct: 0
