- concept: разбиение памяти на core/recall/archival разводит по разным уровням то, что в двухуровневой схеме MemGPT лежало вперемешку
  question: MemGPT обходился двумя уровнями памяти, Letta развела их на core, recall и archival. Объясни своими словами, что именно разъехалось по разным уровням и почему это удобнее.
  explanation: 'Ключ — не количество уровней само по себе, а то, что перегруженный уровень делал две несовместимые работы. Разведя историю и факты, получаем возможность применять к ним разные политики: логирование против намеренной записи, вытеснение против инвалидации.'
  kind: open
  reference: 'В двухуровневой схеме один внешний уровень тянул сразу две разные роли: хранить историю разговора (буфер и вытесненный из окна хвост) и хранить произвольные факты, положенные туда намеренно. У этих ролей разный объём, разное время жизни и разный способ доставать данные. Letta разносит их: recall — история ходов, archival — произвольные факты во внешнем хранилище; core остаётся тем же, что и в MemGPT, — куском, который всегда виден в промпте. После разделения каждый уровень имеет один понятный режим записи и чтения, и правила (что переписывать, что инвалидировать, что держать в промпте) можно задавать для уровней по отдельности.'
  id: 007-visual-tiers-3
  fingerprint: d2c4ab61
