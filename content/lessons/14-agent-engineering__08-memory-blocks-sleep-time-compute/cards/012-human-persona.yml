- concept: правило поведения самого агента (тон, ограничения) принадлежит Persona block, а не Human block
  question: Агент получил инструкцию «не выдумываю факты, при размытой задаче задаю уточняющий вопрос». Это описание самого агента, а не пользователя. В какой из двух канонических блоков MemGPT он это дописывает?
  explanation: 'Два блока MemGPT делятся по субъекту описания: Human — факты о человеке (имя, роль, предпочтения, цели), Persona — самопредставление агента (личность, тон, ограничения). Правило «не выдумываю факты» описывает поведение агента, значит label — persona. Если такую строку положить в human, она будет описывать пользователя и при следующей правке фактов о нём попадёт под сжатие вместе с ними.'
  kind: cloze
  template: block_append("___", "не выдумываю факты, при размытой задаче задаю уточняющий вопрос")
  answer: persona
  accept:
    - persona
    - Persona
    - '"persona"'
  id: 012-human-persona-1
  fingerprint: 9591490e
- concept: у каждого блока свой value и свой limit, поэтому переполнение и сжатие одного блока не затрагивают содержимое другого
  question: Human block с лимитом 1200 символов заполнился, и агент вызвал block_summarize на нём. Persona block живёт с лимитом 700 символов и заполнен наполовину. Что произойдёт с содержимым Persona?
  explanation: 'Блок — отдельная запись со своими label, value и limit. Переполнение считается поблочно, и block_summarize работает по одному label. Именно поэтому разросшиеся факты про пользователя не съедают правила поведения агента: сжимается только Human. В едином блоке на всё сразу первым под нож ушло бы то, что реже упоминалось.'
  kind: choice
  options:
    - 'Persona останется дословно прежним: у него отдельный value и отдельный limit, сжатие Human его не касается'
    - Persona сожмётся пропорционально, потому что лимит считается по сумме всех блоков core
    - Persona будет вытеснен в archival, чтобы освободить место под сжатый Human
    - Persona обнулится, так как block_summarize пересобирает весь core-уровень заново
