- concept: 'core не постоянное хранилище: факт, переставший быть нужным каждому ответу, переносится в archival'
  question: В core-блоке агента лежит описание проекта, над которым человек работал полгода. Проект закрыт, человек начал другой. Что правильно сделать с записью о закрытом проекте?
  explanation: 'Core виден в главном промпте всегда, поэтому в нём держат только то, без чего сломается любой следующий ответ. Закрытый проект этому критерию больше не отвечает, но остаётся осмысленным фактом — его место в archival, откуда он достаётся по запросу. Recall не является местом, куда что-то кладут решением: он наполняется автоматическим логом ходов.'
  kind: choice
  options:
    - Перенести её в archival и освободить место в core под актуальный проект
    - 'Оставить в core: факт был важным, значит место в главном промпте заслужил навсегда'
    - Переложить её в recall, чтобы она хранилась как часть истории разговора
    - 'Стереть безвозвратно: то, что не нужно каждому ответу, памяти не нужно вовсе'
  correct: 0
  id: 008-check-tiers-1
  fingerprint: 901ded4c
- concept: стоимость доступа к факту растёт по мере удаления уровня от главного промпта
  question: Расставь уровни памяти Letta по возрастанию стоимости доступа к факту во время ответа — от того, за чем идти не надо вообще, к тому, за чем идти дороже всего.
  explanation: Уровни различаются не только тем, что в них лежит, но и ценой чтения. Core бесплатен на чтении, но занимает бюджет контекста в каждом запросе. Recall и archival не тратят бюджет, пока их не трогают, зато требуют отдельного шага извлечения, и у archival этот шаг самый тяжёлый.
  kind: order
  items:
    - 'Core: текст уже внутри главного промпта, отдельного обращения не требуется'
    - 'Recall: история разговора, из которой нужный кусок достаётся по запросу'
    - 'Archival: внешнее хранилище, где факт ищется по связке вектор + key-value + граф'
  id: 008-check-tiers-2
  fingerprint: 291c4598
