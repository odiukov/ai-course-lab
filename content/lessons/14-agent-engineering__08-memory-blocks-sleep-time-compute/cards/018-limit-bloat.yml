- concept: переполнение блока памяти лечится сжатием содержимого на месте, а не расширением лимита и не заведением параллельного блока
  question: Task-блок агента имеет limit 3000 символов и занят на 2940. Очередной `block_append` на 180 символов отклонён. Какое решение соответствует паттерну работы с core-памятью?
  explanation: 'Core-уровень едет в промпт целиком и в каждом запросе, поэтому увеличение лимита просто делает дороже каждый вызов, а второй блок дублирует тему и ломает маршрутизацию фактов по description. Отказ записи — сигнал, что блок пора чистить: суммаризатор ставят ровно в точку, где запись выталкивает за предел. В уроке это лимит 2000 и двадцатая запись, но правило от чисел не зависит.'
  kind: choice
  options:
    - Поднять limit блока до 9000 символов, чтобы дозапись работала ещё несколько недель
    - Прочитать блок, сжать накопленные записи в несколько актуальных фактов, вернуть результат через `block_replace` и только после этого дописать новую запись
    - Завести второй Task-блок и писать новые записи в него, оставив первый как архив
    - Отправить новую запись в archival, раз в core для неё нет места
  correct: 1
  id: 018-limit-bloat-1
  fingerprint: 8a88ec1a
- concept: 'последовательность обработки записи, выталкивающей блок за лимит: чтение целиком, сжатие, перезапись, отложенная дозапись'
  question: Агент собирается дописать в блок факт, который не влезает в оставшиеся символы. Расставь операции в порядке выполнения.
  explanation: 'Сжатие невозможно без предварительного чтения: агент не знает, какие строки дублируют друг друга и какие уже неверны. Результат сжатия — это новое содержимое целиком, поэтому он кладётся перезаписью, а не дозаписью. Новая запись выполняется последней, когда место освободилось.'
  kind: order
  items:
    - Прочитать текущее содержимое блока целиком
    - Свернуть накопленные строки в меньшее число актуальных фактов, выбросив дубли и опровергнутое
    - Положить сжатый текст в блок перезаписью (`block_replace`)
    - Выполнить отложенную дозапись нового факта (`block_append`)
  id: 018-limit-bloat-2
  fingerprint: cb604eb6
