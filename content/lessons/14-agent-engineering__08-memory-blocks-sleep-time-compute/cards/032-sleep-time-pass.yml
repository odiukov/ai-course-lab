- concept: дедупликация архива выполняется раньше инвалидации, иначе опровергнутая запись сливается со свежей и её уже не отделить
  question: Фоновый проход по архивной памяти вызывает дедупликацию похожих записей и пометку опровергнутых фактов. Почему дедупликацию ставят первой?
  explanation: 'Слияние объединяет содержимое двух записей в одну. Если опровергнутая запись ещё не убрана из выдачи, её текст попадает в объединённую запись вместе со свежим, и метка «неверно с даты» уже не относится к отдельному факту — мусор становится неотличим. Обратный порядок безопасен: сначала схлопнули дубли, потом по одному атрибуту пометили несовместимое.'
  kind: choice
  options:
    - Инвалидация дороже по числу вызовов модели, а дешёвые операции всегда идут первыми
    - Если сначала пометить запись опровергнутой, слияние может втянуть её содержимое в свежую запись, и различить факты станет нельзя
    - Дедупликация физически удаляет записи, поэтому инвалидации остаётся меньше работы
    - Инвалидация меняет эмбеддинги, и после неё поиск дублей перестаёт находить пары
  correct: 1
  id: 032-sleep-time-pass-1
  fingerprint: e9070511
- concept: 'консолидирующий проход обязан быть идемпотентным: повторный запуск по неизменённому хранилищу не даёт изменений'
  question: 'Фоновый проход отработал по хранилищу из 12 блоков. Его запускают второй раз подряд, новых сообщений между запусками не было. Отчёт: 4 блока пересказаны. О чём это говорит?'
  explanation: 'Консолидация — функция от состояния хранилища. Если вход не менялся, работы нет: отчёт пустой, блоки байт в байт прежние. Изменения на повторном проходе означают, что условие срабатывания не зависит от результата предыдущего прохода — каждый прогон суммаризации теряет детали, и потери накапливаются впустую.'
  kind: choice
  options:
    - 'Всё в порядке: сжатие всегда можно применить ещё раз и получить более компактный текст'
    - Проход не идемпотентен — память переписывается на каждом запуске без нового входа, детали теряются прогон за прогоном
    - Порог заполненности выставлен слишком высоко, поэтому блоки обрабатываются дважды
    - Второй запуск обязан затрагивать ровно те блоки, что и первый, — это проверка стабильности
  correct: 1
  id: 032-sleep-time-pass-2
  fingerprint: 5d5e27c7
- concept: проход возвращает отчёт о фактически изменённом, чтобы различать «работы не было» и «работа не сработала»
  question: Зачем фоновому проходу консолидации возвращать список фактических изменений (какие блоки пересказаны, сколько пар слито, сколько записей помечено устаревшими), а не просто отработать молча?
  explanation: Фоновый агент не отвечает пользователю, поэтому единственный его наблюдаемый выход — изменения в хранилище и отчёт о них. Без отчёта нельзя ни отладить пустой проход, ни доказать, что второй проход подряд ничего не меняет.
  kind: open
  reference: 'Снаружи пустой результат и сломанный проход выглядят одинаково: хранилище не изменилось. Отчёт разделяет эти два случая — «условия срабатывания не выполнились, трогать было нечего» против «условия выполнились, но правки не дошли до хранилища». Он же даёт проверку идемпотентности (повторный запуск обязан дать пустой отчёт) и делает видимыми правки, которые фоновый агент внёс в общие блоки под основным агентом, — то есть служит основой для диффов и версионирования, без которых правка проходит незамеченной.'
  id: 032-sleep-time-pass-3
  fingerprint: 1b29adcb
