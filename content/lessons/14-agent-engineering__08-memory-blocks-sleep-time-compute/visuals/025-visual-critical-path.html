<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Куда уходят 4 секунды консолидации</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#24211d; --muted:#6b6359;
    --ans:#2f6fb3; --con:#c8452f; --slp:#2c7a5b; --ln:#cdc6bd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e9e7e4; --muted:#9aa1a8;
      --ans:#6aa8e0; --con:#e8785f; --slp:#5ec79a; --ln:#3b4048;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 16px 10px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ttl{font-size:15px;font-weight:600;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fb{font-size:13px;line-height:1.5;color:var(--fg)}
  text{fill:var(--fg)}
  text.mut{fill:var(--muted)}
  text.cap{font-weight:600}
  .ans{fill:var(--ans)}
  .con{fill:var(--con)}
  .slp{fill:var(--slp)}
  .slpx{fill:none;stroke:var(--slp);stroke-dasharray:6 4}
  .ax{stroke:var(--ln);fill:none}
  .div{stroke:var(--ln);fill:none;stroke-dasharray:3 5}
  .arw{stroke:var(--muted);fill:none}
  .arwh{fill:var(--muted)}
</style>
<div class="wrap">
  <p class="ttl">Куда уходят 4 секунды консолидации</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var DATA = {
      origin:{x:60,y:24}, scale:{x:56,y:46},
      arrow:{len:0.2, half:0.09},
      bars:[
        {x:[0,1.2],    y:[0.75,1.55], cls:'ans'},
        {x:[1.2,5.2],  y:[0.75,1.55], cls:'con'},
        {x:[0,1.2],    y:[4.25,5.05], cls:'ans'},
        {x:[1.2,5.2],  y:[6.35,7.15], cls:'slp'},
        {x:[5.2,13.2], y:[6.35,7.15], cls:'slpx'}
      ],
      hlines:[
        {x:[0,13.2], y:2.95, cls:'div'},
        {x:[0,13.2], y:8.0,  cls:'ax'}
      ],
      ticks:[0,1.2,5.2],
      tickTop:7.85,
      labels:[
        {x:0,   y:0.0,  t:'Консолидация внутри хода — на критическом пути', a:'start',  dy:0,  s:14, c:'cap'},
        {x:0.6, y:0.75, t:'ответ 1,2 с',                                    a:'middle', dy:-8, s:12, c:'mut'},
        {x:3.2, y:1.55, t:'консолидация +4 с',                              a:'middle', dy:18, s:13, c:''},
        {x:0,   y:2.35, t:'пользователь ждёт 5,2 с · 20 обменов = 80 с у курсора', a:'start', dy:0, s:13, c:'mut'},

        {x:0,   y:3.5,  t:'Тот же ход без консолидации — sleep-time агент фоном', a:'start', dy:0, s:14, c:'cap'},
        {x:0.6, y:4.25, t:'ответ 1,2 с',                                    a:'middle', dy:-8, s:12, c:'mut'},
        {x:1.5, y:4.65, t:'+0 с к ответу основного агента',                  a:'start',  dy:4,  s:13, c:''},
        {x:1.35,y:5.45, t:'работа та же',                                    a:'start',  dy:0,  s:12, c:'mut'},
        {x:2.0, y:5.95, t:'фоном, пока ты набираешь следующий вопрос',       a:'start',  dy:0,  s:13, c:'mut'},
        {x:3.2, y:7.15, t:'консолидация 4 с',                                a:'middle', dy:18, s:13, c:''},
        {x:9.2, y:7.15, t:'или 12 с — модель помощнее, уборка внимательнее', a:'middle', dy:18, s:12, c:'mut'},
        {x:13.2,y:8.0,  t:'секунды',                                        a:'end',    dy:16, s:11, c:'mut'}
      ],
      arrows:[ {x:1.2, y:[5.15,6.25]} ]
    };

    var O = DATA.origin, S = DATA.scale;
    function sx(u){ return O.x + u * S.x; }
    function sy(u){ return O.y + u * S.y; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){
      var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); }
      return e;
    }

    var svg = el('svg', {
      viewBox:'0 0 880 420',
      preserveAspectRatio:'xMidYMid meet',
      role:'img',
      'aria-label':'Две ленты времени ответа: консолидация внутри хода и та же консолидация фоном'
    });
    svg.appendChild(el('rect', {x:0, y:0, width:880, height:420, fill:'var(--bg)'}));

    DATA.bars.forEach(function(b){
      var r = el('rect', {
        x: sx(b.x[0]),
        y: sy(b.y[0]),
        width: sx(b.x[1]) - sx(b.x[0]),
        height: sy(b.y[1]) - sy(b.y[0]),
        rx: 3,
        class: b.cls
      });
      if(b.cls === 'slpx'){ r.setAttribute('stroke-width', 2); }
      svg.appendChild(r);
    });

    DATA.hlines.forEach(function(l){
      svg.appendChild(el('line', {
        x1: sx(l.x[0]), y1: sy(l.y),
        x2: sx(l.x[1]), y2: sy(l.y),
        class: l.cls, 'stroke-width': 1
      }));
    });

    DATA.ticks.forEach(function(t){
      svg.appendChild(el('line', {
        x1: sx(t), y1: sy(8.0),
        x2: sx(t), y2: sy(DATA.tickTop),
        class:'ax', 'stroke-width': 1
      }));
      var lb = el('text', {
        x: sx(t), y: sy(8.0) + 16,
        'text-anchor':'middle', 'font-size': 11, class:'mut'
      });
      lb.textContent = String(t).replace('.', ',');
      svg.appendChild(lb);
    });

    DATA.arrows.forEach(function(a){
      var yTip = sy(a.y[1]);
      var yBase = sy(a.y[1] - DATA.arrow.len);
      svg.appendChild(el('line', {
        x1: sx(a.x), y1: sy(a.y[0]),
        x2: sx(a.x), y2: yBase,
        class:'arw', 'stroke-width': 1.5
      }));
      svg.appendChild(el('polygon', {
        points: sx(a.x) + ',' + yTip + ' ' +
                sx(a.x - DATA.arrow.half) + ',' + yBase + ' ' +
                sx(a.x + DATA.arrow.half) + ',' + yBase,
        class:'arwh'
      }));
    });

    DATA.labels.forEach(function(l){
      var t = el('text', {
        x: sx(l.x), y: sy(l.y) + l.dy,
        'text-anchor': l.a, 'font-size': l.s
      });
      if(l.c){ t.setAttribute('class', l.c); }
      t.textContent = l.t;
      svg.appendChild(t);
    });

    host.appendChild(svg);
  }catch(e){
    var p = document.createElement('div');
    p.className = 'fb';
    p.textContent = 'Схема должна показывать две ленты времени ответа. Сверху: ' +
      'ответ 1,2 с, сразу за ним консолидация +4 с на критическом пути — ' +
      'пользователь ждёт 5,2 с, а за 20 обменов набегает 80 с. Снизу: тот же ' +
      'ход без консолидации, ответ 1,2 с и +0 с к нему, а те же 4 секунды ' +
      'работы уходят в фоновый блок sleep-time агента, который считает, пока ' +
      'ты набираешь следующий вопрос, и может растянуться до 12 с ради более ' +
      'сильной модели.';
    host.appendChild(p);
  }
})();
</script>
</html>
