<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Где уходит время запроса</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1b1f24;
    --muted: #5d6873;
    --axis: #8a94a0;
    --retr: #2f7d5c;
    --gen: #b4442f;
    --grid: #dfe4ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --fg: #e8ecf1;
      --muted: #9aa5b1;
      --axis: #6b7684;
      --retr: #5fc79a;
      --gen: #ef8a6e;
      --grid: #2a313a;
    }
  }
  html, body { margin: 0; background: var(--bg); }
  .wrap { background: var(--bg); color: var(--fg); padding: 8px 10px 10px; box-sizing: border-box; }
  h2 { font: 600 15px/1.3 system-ui, sans-serif; margin: 0 0 6px; }
  svg { display: block; width: 100%; max-height: 470px; height: auto; }
  .fail { font: 13px/1.5 system-ui, sans-serif; color: var(--fg); }
  text { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Где уходит время запроса: 2 500 мс от вопроса до ответа</h2>
  <div id="host"><svg id="chart" viewBox="0 0 860 400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Полоса времени запроса"></svg></div>
</div>
<script>
(function () {
  var host = document.getElementById("host");
  try {
    // ---- данные схемы (мс) ----
    var STAGES = [
      { key: "embed",  label: "Embedding запроса", short: "30 мс",    ms: 30,   kind: "r" },
      { key: "search", label: "Поиск по 50 000 чанков", short: "15 мс", ms: 15,  kind: "r" },
      { key: "prompt", label: "Сборка промпта", short: "<1 мс",       ms: 1,    kind: "r" },
      { key: "gen",    label: "Генерация 400 токенов", short: "2 400 мс", ms: 2400, kind: "g" }
    ];
    var TOTAL = 2400 + 30 + 15 + 1;          // 2 446 мс
    var RETR  = 30 + 15 + 1;                 // 46 мс
    var HNSW  = 3;                           // ускоренный поиск

    // ---- одна система координат ----
    // x — миллисекунды (0..TOTAL), y — условные ряды (0..10)
    var origin = { x: 120, y: 40 };
    var scale  = { x: 700 / TOTAL, y: 30 };
    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y + y * scale.y; }

    var PAD = 8, THIN = 1, THICK = 2, FS = 12, FSB = 13;

    var ns = "http://www.w3.org/2000/svg";
    var svg = document.getElementById("chart");
    function el(n, a, t) {
      var e = document.createElementNS(ns, n);
      for (var k in a) e.setAttribute(k, a[k]);
      if (t != null) e.appendChild(document.createTextNode(t));
      svg.appendChild(e);
      return e;
    }
    function label(x, y, t, anchor, dx, dy, fill, size, weight) {
      el("text", {
        x: sx(x) + dx, y: sy(y) + dy, "text-anchor": anchor,
        "font-size": size || FS, "font-weight": weight || "400",
        fill: fill || "var(--fg)"
      }, t);
    }

    // ---- полоса одного запроса (ряд 1..3) ----
    var cursor = 0;
    STAGES.forEach(function (s) {
      var w = sx(cursor + s.ms) - sx(cursor);
      el("rect", {
        x: sx(cursor), y: sy(1), width: Math.max(w, 1.5), height: sy(3) - sy(1),
        fill: s.kind === "g" ? "var(--gen)" : "var(--retr)",
        stroke: "var(--bg)", "stroke-width": THIN
      });
      cursor += s.ms;
    });
    el("rect", {
      x: sx(0), y: sy(1), width: sx(TOTAL) - sx(0), height: sy(3) - sy(1),
      fill: "none", stroke: "var(--axis)", "stroke-width": THIN
    });

    label(0, 2, "1 запрос", "end", -PAD, 4, "var(--muted)", FSB, "600");

    // ---- скобка retrieval сверху (слева, разведена вверх) ----
    el("path", {
      d: "M " + sx(0) + " " + sy(0.55) + " L " + sx(0) + " " + sy(1) +
         " M " + sx(RETR) + " " + sy(0.55) + " L " + sx(RETR) + " " + sy(1) +
         " M " + sx(0) + " " + sy(0.55) + " L " + sx(RETR) + " " + sy(0.55),
      fill: "none", stroke: "var(--retr)", "stroke-width": THICK
    });
    label(RETR, 0.55, "retrieval 46 мс — 2% ожидания", "start", PAD, -4, "var(--retr)", FSB, "600");

    // ---- подпись генерации снизу полосы ----
    el("path", {
      d: "M " + sx(RETR) + " " + sy(3) + " L " + sx(RETR) + " " + sy(3.45) +
         " M " + sx(TOTAL) + " " + sy(3) + " L " + sx(TOTAL) + " " + sy(3.45) +
         " M " + sx(RETR) + " " + sy(3.45) + " L " + sx(TOTAL) + " " + sy(3.45),
      fill: "none", stroke: "var(--gen)", "stroke-width": THICK
    });
    label(RETR + (TOTAL - RETR) / 2, 3.45, "генерация 2 400 мс — 98% ожидания", "middle", 0, 16, "var(--gen)", FSB, "600");

    // ---- разбор retrieval: увеличенные доли отдельными рядами ----
    label(0, 5.2, "Внутри retrieval:", "start", 0, 0, "var(--muted)", FSB, "600");

    var rows = [
      { i: 0, y: 6.2 },
      { i: 1, y: 7.2 },
      { i: 2, y: 8.2 }
    ];
    var zoom = 700 / 200;           // растяжка шкалы retrieval до той же ширины
    rows.forEach(function (r) {
      var s = STAGES[r.i];
      var w = (sx(s.ms) - sx(0)) * zoom;
      el("rect", {
        x: sx(0), y: sy(r.y) - 9, width: Math.max(w, 2), height: 18,
        fill: "var(--retr)"
      });
      label(0, r.y, s.label, "end", -PAD, 4, "var(--fg)", FS);
      el("text", {
        x: sx(0) + w + PAD, y: sy(r.y) + 4, "text-anchor": "start",
        "font-size": FS, fill: "var(--muted)"
      }, s.short);
    });

    // ---- линия HNSW: выигрыш 12 мс ----
    var hy = 9.4;
    var wSearch = (sx(15) - sx(0)) * zoom;
    var wHnsw = (sx(HNSW) - sx(0)) * zoom;
    el("rect", {
      x: sx(0), y: sy(hy) - 9, width: Math.max(wHnsw, 2), height: 18,
      fill: "none", stroke: "var(--retr)", "stroke-width": THICK, "stroke-dasharray": "4 3"
    });
    label(0, hy, "Поиск через HNSW", "end", -PAD, 4, "var(--muted)", FS);
    el("path", {
      d: "M " + (sx(0) + wSearch) + " " + sy(hy) + " L " + (sx(0) + wHnsw + 10) + " " + sy(hy) +
         " M " + (sx(0) + wHnsw + 10) + " " + sy(hy) + " l 7 -4 M " +
         (sx(0) + wHnsw + 10) + " " + sy(hy) + " l 7 4",
      fill: "none", stroke: "var(--muted)", "stroke-width": THIN
    });
    el("text", {
      x: sx(0) + wSearch + PAD, y: sy(hy) + 4, "text-anchor": "start",
      "font-size": FS, fill: "var(--muted)"
    }, "3 мс — экономия 12 мс, 0,5% ожидания");

    // ---- итог ----
    label(0, 10.6, "Стрелку двигают токены: k = 20 × 500 = 10 000 токенов промпта против k = 5 × 500 = 2 500.",
      "start", 0, 0, "var(--fg)", FS);
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема должна показывать полосу одного запроса на 2 446 мс: ' +
      'retrieval занимает 46 мс (embedding 30 мс, поиск по 50 000 чанков 15 мс, сборка промпта менее 1 мс) — ' +
      'это меньше 2% ожидания, а генерация 400 токенов занимает 2 400 мс. ' +
      'Переход на HNSW ускоряет поиск с 15 мс до 3 мс: экономия 12 мс, пользователь её не замечает.</p>';
  }
})();
</script>
</body>
</html>
