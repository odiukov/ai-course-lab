- concept: разделение на вложенные графы даёт независимую отладку уровней вместо разбора одной сквозной цепочки
  question: Подкоманда собрала материалы, но вернула наружу слабую сводку. Почему вложенные графы с непрозрачным узлом упрощают поиск причины по сравнению с одним общим графом всех агентов?
  explanation: Уровни тестируются как две самостоятельные функции с известными входом и выходом — это и есть практический выигрыш непрозрачного узла.
  kind: open
  reference: 'Границы уровней разрезают отладку на две независимые проверки. Внутренний граф можно прошагать отдельно на его собственном входе и увидеть, где именно испортилась сводка, не прокручивая всю организацию. Отдельно проверяется внешний уровень: правильно ли supervisor выбрал подкоманду и корректную ли задачу ей отправил. В едином графе всех менеджеров и исполнителей пришлось бы разбирать одну длинную сквозную цепочку, где эти два вопроса перемешаны.'
  id: 028-langgraph-supervisors-2
  fingerprint: a69b8177
- concept: вложенность графов фиксируется на этапе сборки, поэтому новая ветка требует пересборки, а не решения менеджера
  question: Во время выполнения задачи выясняется, что нужна ещё одна подкоманда, которой в графе нет. Что придётся сделать?
  explanation: 'Это плата за проверяемость: внутренний supervisor сначала получает свой состав, потом включается во внешний. Дерево заранее собрано и удобно тестируется, но динамическую перестройку выразить сложно — в отличие от подхода, где менеджер сам решает, кому отдать работу.'
  kind: choice
  options:
    - 'Ничего: внешний supervisor создаст новую ветку своим решением на ходу'
    - 'Пересобрать граф: структура вложенности задаётся при сборке, а не на лету'
    - Добавить воркера внутрь любого существующего непрозрачного узла из внешнего графа
    - Перезапустить только внешний supervisor, оставив внутренние графы неизменными
