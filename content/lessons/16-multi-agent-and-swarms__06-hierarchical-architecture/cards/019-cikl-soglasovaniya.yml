- concept: лимит шагов ограничивает цену цикла, но не устраняет его причину, и сам становится гиперпараметром с двусторонней ценой ошибки
  question: Иерархический процесс защищён лимитом числа передач поручения. Объясни своими словами, что этот лимит решает, а что не решает, и чем плохи слишком маленькое и слишком большое значения.
  explanation: Лимит шагов действует по симптому (число передач), а не по причине (менеджер требует консенсуса). Отсюда двусторонняя цена ошибки настройки и необходимость критерия остановки по содержанию результата.
  kind: open
  reference: 'Лимит шагов — предохранитель по стоимости: он гарантирует, что переделегирование прекратится и бюджет не будет расходоваться бесконечно. Он не устраняет причину цикла — расхождение критериев у ветвей — и не даёт содержательного финала: работа обрывается на произвольном раунде, а не на осмысленном решении. Сам лимит превращается в настраиваемый параметр с ошибкой в обе стороны: слишком маленький обрывает полезное уточнение, которое сошлось бы за пару раундов; слишком большой позволяет системе долго крутить одни и те же перезапуски воркеров без новой информации. Настоящее решение — критерий остановки, допускающий зафиксированное разногласие как валидный результат.'
  id: 019-cikl-soglasovaniya-3
  fingerprint: 3866ff17
