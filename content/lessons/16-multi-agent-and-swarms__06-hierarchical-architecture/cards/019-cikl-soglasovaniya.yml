- concept: расхождение ветвей может быть содержательным результатом, поэтому условие завершения не должно требовать единой позиции
  question: Две ветви иерархии возвращают разные рекомендации, потому что оптимизируют разные критерии (стоимость против устойчивости). Какое условие завершения корректно для верхнего менеджера?
  explanation: 'Цикл согласования возникает, когда менеджер трактует любое расхождение как незавершённую работу. Но разные критерии оценки не сходятся от повторного прогона — воркеры вернут слегка другие формулировки при том же конфликте. Валидный финал: разногласие зафиксировано вместе с причиной, решение принимает уровень, у которого есть полномочия выбирать между критериями. Отбрасывание и усреднение уничтожают информацию о конфликте.'
  kind: choice
  options:
    - Переделегировать вниз, пока обе ветви не вернут совпадающий ответ
    - 'Принять расхождение как результат: зафиксировать обе позиции с причинами различия и передать выбор наверх'
    - Отбросить ветвь, которая ответила позже, и принять оставшуюся как согласованную
    - Усреднить обе рекомендации в один компромиссный ответ
