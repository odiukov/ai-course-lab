- concept: 'режимы отказа иерархии различают по месту сбоя: выбор адресата, синтез результата или повторение раундов — плохой итог сам по себе не указывает на режим'
  question: Верхний синтез дал неверный итог. Ветка, которой досталась подзадача, выполнила её качественно и пересказала свой результат точно, повторных раундов не было. Какой режим отказа это?
  explanation: 'Точный пересказ исключает искажение, отсутствие повторов — цикл. Остаётся ошибка на разбиении и маршрутизации: принимающая ветка оценивает качество исполнения, а не уместность поручения, поэтому ошибка всплывает только наверху.'
  kind: choice
  options:
    - Искажение смысла при синтезе
    - 'Ошибка назначения: подзадача ушла ветке, не отвечающей за этот участок'
    - Цикл согласования
    - Отказ инструмента у исполнителя
  correct: 1
  id: 024-diagnostika-otkazov-1
  fingerprint: aa1d8219
- concept: у каждого режима отказа свой наблюдаемый след, поэтому диагностика опирается на разные артефакты журнала
  question: Какие следы в журналах разделяют три режима отказа иерархии — ошибку назначения, искажение при синтезе и цикл согласования?
  explanation: Без разделения следов любой плохой результат списывают на искажение смысла, и ошибка маршрутизации или цикл остаются неисправленными.
  kind: open
  reference: 'Ошибку назначения видно в записях разбиения: сравниваешь подзадачи и адресатов с исходным запросом пользователя — покрывает ли разбиение запрос и попала ли подзадача в зону ответственности ветки. Искажение при синтезе видно при сверке сводки с выходами листьев по ссылкам provenance: там, где статус «не проверено» стал утверждением о факте, найден уровень. Цикл виден по счётчику раундов и повторным запускам одних и тех же исполнителей с почти неизменными результатами. Поэтому диагноз ставится по маршруту, по сверке пересказа и по истории повторов, а не по факту неверного итога.'
  id: 024-diagnostika-otkazov-2
  fingerprint: ad776e8c
