  fingerprint: 874ff97f
- concept: фиксированный набор статусов результата с обязательным полем причины сопротивляется дрейфу смысла лучше свободного пересказа
  question: Какой приём надёжнее всего снижает дрейф смысла при передаче результатов вверх по иерархии?
  explanation: Свободный пересказ сглаживает разницу между «нет данных» и «факт опровергнут». Разделённые статусы плюс причина не дают этой разнице исчезнуть при сжатии, а запрет на сокращение убивает саму выгоду локальной сводки.
  kind: choice
  options:
    - Требовать, чтобы ветви возвращали результат в виде фиксированного статуса (подтверждено / опровергнуто / не проверено) с обязательным указанием причины
    - Запретить подменеджерам сокращать отчёты исполнителей
    - Увеличить лимит шагов, чтобы у менеджеров было больше времени на пересказ
