- concept: сжатие сводки допустимо, повышение степени уверенности вывода — нет; сводка обязана сохранять причину неопределённости
  question: Подменеджер сокращает отчёты команды перед отправкой наверх. Какое сокращение допустимо, а какое считается ошибкой? Что сводка обязана сохранить?
  explanation: Это второй режим отказа — дрейф смысла. Опасно не сокращение как таковое, а усиление вывода при передаче между уровнями.
  kind: open
  reference: 'Допустимо убирать объём: черновые наблюдения, повторы, подробности, не влияющие на решение. Ошибка — менять степень уверенности или подменять причину неопределённости: превращать «не смогли проверить» в «не подтверждено», а затем в «опровергнуто». Сводка обязана сохранять три вещи: что именно проверяли, какой результат реально получен и почему проверка могла не состояться. Короткая честная формулировка вида «время отправки неизвестно: журнал был недоступен» короче исходного отчёта, но не выдаёт себя за новый факт.'
