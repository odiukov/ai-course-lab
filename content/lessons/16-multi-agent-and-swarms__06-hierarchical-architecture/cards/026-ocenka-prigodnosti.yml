- concept: оценка пригодности выдаёт рекомендованный паттерн вместе с режимами отказа, от которых надо страховаться
  question: Инженер прогоняет задачу через оценку пригодности иерархии. Что, кроме рекомендованного паттерна, должна дать такая оценка, чтобы ею можно было пользоваться?
  explanation: 'На вход идут описание задачи, структура организации и бюджет на согласование; на выходе — паттерн плюс режимы отказа. Без второго рекомендация нечего страховать: неизвестно, где именно система сломается.'
  kind: choice
  options:
    - Оценку стоимости одного вызова модели в валюте провайдера
    - Конкретные режимы отказа выбранного паттерна, от которых нужно ставить защиту
    - Готовые системные промпты для каждого менеджера
    - Точное число уровней, которое обязательно окажется оптимальным
