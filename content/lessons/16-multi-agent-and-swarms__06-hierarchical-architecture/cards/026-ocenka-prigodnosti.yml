  reference: 'Это заранее установленный предел числа обменов между уровнями — например, один запрос на уточнение от менеджера каждой ветке и один финальный ответ. Бюджет не обещает, что спор закончится согласием вовремя; он задаёт границу, после которой система обязана прекратить обсуждение и принять лучший доступный результат либо сменить паттерн. Если предел назвать невозможно, иерархию запускать рано: цикл согласований разрешён заранее и ничем не ограничен.'
