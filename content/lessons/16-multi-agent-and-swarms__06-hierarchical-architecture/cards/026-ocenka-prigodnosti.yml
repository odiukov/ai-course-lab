- concept: бюджет согласования — назначенный до запуска предел обменов, предписывающий действие при исчерпании, а не обещание сходимости
  question: Что такое бюджет на согласование в иерархической системе и что он определяет, когда исчерпан?
  explanation: Ключевая часть — предписанное действие при исчерпании. Предел без правила «что делать дальше» просто останавливает систему, не давая результата.
