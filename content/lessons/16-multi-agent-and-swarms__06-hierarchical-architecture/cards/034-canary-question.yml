- concept: несогласие канарейки — триггер перепроверки разбиения и перезапуска ветки, а не источник итогового ответа
  question: Расставьте по порядку действия менеджера при использовании канареечного воркера.
  explanation: 'Канарейка — детектор, а не арбитр: её ответ не усредняют со сводкой и не выбирают голосованием. Расхождение лишь запускает разбор — где именно потерялась часть запроса, — а исправление вносится в разбиение, после чего перезапускается одна ветка, а не весь прогон.'
  kind: order
  items:
    - Задать канареечному воркеру исходный запрос пользователя без изменений
    - Сравнить ответ канарейки со сводкой, синтезированной ветвью
    - При расхождении вернуться к разбиению и проверить, покрывает ли оно исходный запрос
    - Перезапустить только подозрительную ветку с исправленной подзадачей
  id: 034-canary-question-2
  fingerprint: b4fdf93d
- concept: канарейка чувствительна к сдвигу предмета, но не к ошибкам внутри верно поставленной подзадачи
  question: Какие сбои канареечный воркер по своей конструкции не обнаружит? Объясните своими словами.
  explanation: Канарейка закрывает один режим отказа — сдвиг предмета при делегировании — и стоит один дополнительный вызов на уровень. Фактические ошибки внутри верной подзадачи ловятся критериями приёмки ветки, а происхождение утверждений — записями об источниках.
  kind: open
  reference: 'Канарейка сравнивает предмет: она показывает, какие части исходного запроса вообще должны были отразиться в результате. Поэтому она не видит ошибок внутри правильно поставленной подзадачи — если ветка отвечает на тот вопрос, но отвечает неверно, канарейка согласится со сводкой. Кроме того, её собственный ответ тоже может быть неверным: несогласие сигнализирует о расхождении, но не доказывает, что права именно канарейка. Наконец, она ничего не говорит о происхождении отдельных утверждений — для этого нужны ссылки на источники.'
  id: 034-canary-question-3
  fingerprint: 7cb27cb3
