- concept: дополнительный уровень делегирования оправдан только когда он забирает цельный участок работы
  question: Команда хочет вставить между supervisor'ом и исполнителями ещё один управляющий уровень. Объясни своими словами, при каком условии такой уровень оправдан, а при каком он только вредит.
  explanation: Дополнительный уровень — не бесплатное улучшение. Полезен он только как граница вокруг цельного куска работы; иначе это просто удлинённая цепочка пересказов задачи.
  kind: open
  reference: 'Уровень оправдан, если он снимает с верхнего supervisor''а отдельный, самодостаточный участок работы: подгруппа получает связную часть задачи, решает её внутри себя и возвращает собранный результат, а верхний уровень перестаёт следить за деталями. Если же новый уровень просто пересылает поручения дальше и не имеет собственной цельной зоны ответственности, он не разгружает никого: добавляются лишние вызовы модели, лишняя задержка и лишняя точка, где формулировка задачи может исказиться.'
  id: 001-ot-supervisora-k-derevu-2
