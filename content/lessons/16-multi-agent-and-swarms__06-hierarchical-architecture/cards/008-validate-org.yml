- concept: 'валидатор структуры — предикат: он выдаёт вердикт и не правит входные данные'
  question: Генератор оргструктуры иногда выдаёт менеджера с пустым списком подчинённых. Почему проверяющей функции не стоит молча менять тип такого узла на исполнителя вместо возврата отрицательного вердикта?
  explanation: 'Проверка и починка — разные обязанности. Предикат отвечает только «структура соблюдает инварианты или нет», и вызывающая сторона решает, что делать. Автоправка превращает диагностическую функцию в источник новых, никем не заказанных решений: узел, задуманный как управляющий, тихо становится исполнителем, а причина сбоя генератора остаётся ненайденной.'
  kind: choice
  options:
    - Потому что менять словарь на месте в Python технически невозможно
    - Потому что тихое исправление меняет смысл организации и скрывает ошибку генератора, а сломанное место всплывёт уже во время исполнения задач
    - Потому что исправление замедляет рекурсивный обход
    - Потому что после исправления структура перестанет быть вложенной
