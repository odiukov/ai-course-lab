- concept: 'порядок рекурсивной валидации узла: локальные инварианты, разветвление по наличию детей, рекурсия по поддеревьям, общий вердикт'
  question: Расставь шаги рекурсивной проверки одного узла оргструктуры в правильном порядке.
  explanation: 'Сначала дешёвые локальные условия — без обязательных полей дальше идти бессмысленно. Затем разветвление по наличию детей: только оно говорит, какой набор требований применять. Рекурсия идёт после разветвления, а вердикт собирается в конце как конъюнкция локальной проверки и всех поддеревьев.'
  kind: order
  items:
    - Проверить у текущего узла наличие обязательных полей и допустимость его типа
    - Определить, есть ли у узла дочерние узлы
    - Для узла без дочерних узлов потребовать тип исполнителя и завершить ветвь
    - Для узла с дочерними узлами потребовать управляющий тип и запустить ту же проверку на каждом ребёнке
    - 'Вернуть вердикт узла как совокупный результат: истина только если прошли и локальные условия, и все поддеревья'
