- concept: 'алгоритм измерения глубины: остановка на узле без подчинённых, рекурсивные вызовы по ветвям, выбор наибольшего значения, прибавление текущего уровня'
  question: Расставь по порядку действия функции, вычисляющей глубину оргструктуры для управляющего узла.
  explanation: 'Сначала отсекается случай без подчинённых — иначе max получит пустую последовательность и упадёт. Дальше независимо измеряется каждая ветвь, из результатов берётся наибольший, и только в конце добавляется уровень текущего узла. Порядок «взять максимум, потом прибавить единицу» важен: прибавление внутри каждой ветви до сравнения даёт тот же максимум, но лишние операции, а сумма вместо максимума завышает глубину.'
  kind: order
  items:
    - Проверить, есть ли у узла дочерние узлы, и для бездетного вернуть единицу как готовый ответ
    - Вызвать ту же функцию на каждом непосредственном подчинённом и получить глубину каждой ветви
    - Выбрать наибольшее из полученных значений
    - Прибавить к нему единицу за уровень самого узла и вернуть результат
