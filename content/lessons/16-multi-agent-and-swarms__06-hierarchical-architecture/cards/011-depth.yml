- concept: 'рекурсивный шаг подсчёта глубины: глубина управляющего узла задаётся самой глубокой из его ветвей'
  question: Дополни рекурсивный шаг функции, измеряющей число уровней вложенности оргструктуры.
  explanation: Ветви подчинённых независимы, поэтому итог по управляющему узлу определяет только самая глубокая из них — это max. sum сложил бы параллельные ветви в одну цепочку, min выдал бы длину самой короткой ветви, а len вернул бы число подчинённых вместо числа уровней.
  kind: cloze
  template: |-
    def depth(node):
        if not node["children"]:
            return 1
        return 1 + ___(depth(child) for child in node["children"])
  answer: max
  accept:
    - max
    - max()
  id: 011-depth-1
  fingerprint: b606ad42
- concept: каждый управляющий узел добавляет к глубине ровно один уровень, поэтому итог равен длине самой длинной цепочки вложенности
  question: 'У корневого менеджера 4 прямых подчинённых: трое исполнителей и один менеджер. У этого менеджера 6 подчинённых, среди них один менеджер с 7 исполнителями, остальные — исполнители. Чему равна глубина дерева?'
  explanation: 'Самая длинная цепочка вложенности: корень, менеджер второго уровня, менеджер третьего уровня, его исполнитель — 4 уровня. Каждый управляющий узел прибавляет ровно единицу к глубине своей самой глубокой ветви; исполнители, висящие выше (например, трое под корнем), результат не понижают.'
  kind: numeric
  answer: 4
  tolerance: 0.4
  id: 011-depth-2
