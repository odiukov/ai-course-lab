  question: Под-менеджер получает отчёты своей команды и передаёт их наверх целиком, склеив в одно сообщение без сокращения. Что происходит с экономией от этого уровня иерархии?
  explanation: Выгоду даёт не наличие уровня, а сокращение объёма на нём. Ретранслятор оставляет вход верхнего узла прежним и добавляет собственные токены на чтение и генерацию, то есть уровень становится чистой стоимостью.
