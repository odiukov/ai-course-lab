- concept: 'цикл LLM-менеджера в hierarchical process: задача, распределение, оценка выхода команды, решение о судьбе результата'
  question: Расставь действия LLM-менеджера в hierarchical process по порядку одного круга работы.
  explanation: 'Последний шаг и делает управление динамическим: менеджер не обязан принимать первый полученный выход, а выбирает между приёмкой и новой итерацией.'
  kind: order
  items:
    - Получить задачу верхнего уровня
    - Распределить подзадачи по командам специалистов
    - Оценить выходы, вернувшиеся от команд
    - 'Решить: принять результат, переделегировать его другой команде или прогнать ещё раз'
  id: 027-crewai-manager-1
  fingerprint: 61a9757e
- concept: 'динамическая маршрутизация: следующий адресат выбирается по содержанию уже полученного результата, а не только по заранее заданному порядку'
  question: Специалист вернул обзор конкурентов без указания дат у цен. Что в этой ситуации делает управление LLM-менеджером «динамическим»?
  explanation: 'В динамическом управлении маршрут доопределяется по ходу: увидев пробел, менеджер может вернуть работу тому же исполнителю, отдать другому или переформулировать задание — решение зависит от того, что получилось на текущем шаге.'
  kind: choice
  options:
    - Менеджер сам дописывает недостающие даты и передаёт результат дальше
    - Следующее действие менеджер выбирает по содержанию полученного результата, а не только по заранее зафиксированному маршруту
    - Маршрут определяется случайным выбором между свободными агентами
    - Менеджер меняет состав команды в зависимости от нагрузки на провайдера
  correct: 1
