- concept: переделегирование — повторное выполнение подзадачи агентом, а не самостоятельная правка результата менеджером
  question: Менеджер отправляет результат назад. Что при этом происходит с работой?
  explanation: Возврат — это не редактура на уровне менеджера, а ещё один прогон работы командой. Поэтому право возвращать без ограничения числа попыток и превращает управление в бесконечную редактуру, а лимит итераций становится несущей деталью архитектуры.
  kind: choice
  options:
    - Менеджер редактирует полученный текст сам, не привлекая исполнителя
    - Результат отбрасывается, и задача считается проваленной
    - Запускается новая итерация выполнения подзадачи агентом с уточнённым заданием
    - Задача автоматически поднимается на уровень выше к корневому менеджеру
  correct: 2
