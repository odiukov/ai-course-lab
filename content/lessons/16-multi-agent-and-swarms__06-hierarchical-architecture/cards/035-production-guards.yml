- concept: предохранители не делают иерархию безошибочной, а ограничивают цену ошибки и делают её наблюдаемой
  question: Объясни своими словами, что именно гарантирует набор эксплуатационных предохранителей иерархии и чего он не гарантирует.
  explanation: 'Частая ошибка — читать список предохранителей как рецепт корректности. Он даёт другое: потолок расходов и след для разбора. Система без них ломается так же, но молча и дорого.'
  kind: open
  reference: 'Не гарантирует правильности результата: менеджеры остаются LLM и могут исказить задачу или сводку. Гарантирует ограниченность и наблюдаемость: лимиты глубины и раундов не дают цене прогона и числу пересказов расти неограниченно, а ссылки на источники и логирование разбиения дают артефакты, по которым ошибку можно локализовать — на каком уровне сместился смысл и какая часть запроса потерялась. То есть отказ не исключается, а становится ограниченным и видимым.'
  id: 035-production-guards-2
  fingerprint: d53309ea
