  question: Организацию можно записать плоским списком, где у каждой записи есть поле «руководитель», или вложенно. В чём главный практический плюс вложенного варианта?
  explanation: 'Плоский список подчинение выражает косвенно: чтобы собрать дерево, нужно для каждого участника искать его начальника. Во вложенной записи открыл узел — и сразу видишь его прямых подчинённых.'
