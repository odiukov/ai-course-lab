- concept: иерархия поверх линейного потока не даёт выигрыша во времени и добавляет управляющие вызовы на пересказ
  question: Линейный процесс из четырёх этапов оформили как дерево с менеджерами веток. Что получится на практике?
  explanation: Форма организации не отменяет зависимость по данным. Если этап нельзя начать без выхода предыдущего, дерево не распараллелит его, но каждый управляющий узел добавит вызов модели и ещё одну переформулировку задачи.
  kind: choice
  options:
    - Этапы начнут выполняться параллельно, потому что теперь это ветви дерева
    - Порядок сохранится, но управляющие узлы сократят объём передаваемых данных
    - Этапы всё равно пойдут по очереди, а менеджеры добавят вызовы модели и лишние пересказы задачи
    - Общее время не изменится, а число вызовов модели останется прежним
