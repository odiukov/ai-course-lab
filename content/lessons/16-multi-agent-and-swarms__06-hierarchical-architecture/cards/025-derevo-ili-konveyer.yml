- concept: ветви иерархии сходятся в заранее известной точке объединения, а звенья конвейера передают работу дальше по цепочке
  question: Две части работы можно начать одновременно, но в конце их выводы надо состыковать. Чем такой случай отличается от последовательного конвейера и почему он всё ещё может быть иерархией?
  explanation: 'Различие не в количестве точек контакта, а в том, где они стоят: ветви встречаются в конце, звенья цепи передают работу дальше.'
  kind: open
  reference: 'В иерархии ветви выполняются самостоятельно и встречаются один раз — в заранее известной точке объединения, где верхний уровень сводит их результаты. В конвейере передача происходит внутри работы: звено отдаёт свой выход следующему как вход, поэтому следующее звено не может начать раньше. Если каждая часть способна довести свою работу до осмысленного результата без данных другой, а место стыковки известно заранее, это иерархия; если стыковка нужна посреди работы и одна часть блокирует другую — конвейер.'
