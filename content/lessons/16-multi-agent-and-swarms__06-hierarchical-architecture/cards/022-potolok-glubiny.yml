- concept: ограничение на глубину — эксплуатационное требование к наблюдаемости, а не условие структурной корректности дерева
  question: 'Организация с четырьмя уровнями управления прошла структурную валидацию: один корень, у каждого узла один родитель, циклов нет, все ветви кончаются исполнителями. Но принятый предел глубины она превышает. Как это трактовать?'
  explanation: Форма связей и предел глубины — разные требования. Дерево может быть безупречно построено и всё равно прятать место искажения за лишними пересказами; поэтому предел — практический предохранитель, а не свойство корректности.
  kind: choice
  options:
    - 'Валидация ошиблась: превышение глубины делает структуру некорректной'
    - Структура корректна, но нарушает эксплуатационное ограничение на наблюдаемость и стоимость проверки результата
    - Предел глубины отменяет требование единственного корня
    - Глубина не связана с проверяемостью результата, ограничение чисто декоративное
  correct: 1
  id: 022-potolok-glubiny-2
