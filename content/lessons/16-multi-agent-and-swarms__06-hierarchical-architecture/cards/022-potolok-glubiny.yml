- concept: при нехватке разрешённой глубины наращивают не этажи, а упрощают ветви или разбивают работу на отдельные запуски
  question: Задача выглядит так, будто ей нужен ещё один уровень управляющих узлов сверх принятого предела глубины. Какие два хода стоит рассмотреть вместо добавления этажа и почему?
  explanation: Дополнительный уровень оправдан только если забирает цельный участок работы и реально сжимает вход верхнего узла; иначе он платит наблюдаемостью за ретрансляцию.
  kind: open
  reference: 'Первый ход — упростить ветви: укрупнить или перегруппировать подзадачи так, чтобы менеджеру ветки хватало прямых исполнителей. Второй — разделить работу на отдельные запуски с человеком или явным кодом между ними, вместо того чтобы прятать переход внутри дерева. Оба сохраняют короткий путь от исполнителя до итога, тогда как новый этаж добавляет ещё одно разбиение и ещё одно сжатие — больше журналов для проверки и место ошибки дальше от исходного ответа.'
  id: 022-potolok-glubiny-3
  fingerprint: 0235ac60
