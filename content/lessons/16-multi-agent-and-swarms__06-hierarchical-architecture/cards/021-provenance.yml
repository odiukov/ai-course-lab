- concept: 'порядок построения записи provenance: раскрытие вложенных сводок до листьев, отказ на неизвестных идентификаторах, дедупликация с сохранением порядка'
  question: Расставь шаги функции, которая строит запись provenance для сводки менеджера.
  explanation: 'Раскрытие идёт до дедупликации: один лист может прийти через несколько промежуточных сводок, и повтор виден только после раскрытия. Пустой список источников и неизвестный идентификатор — ошибки, а не пустой результат.'
  kind: order
  items:
    - Взять текст сводки и заявленный список её источников
    - Для источника, который сам является сводкой, подставить её собственные источники — и так до листьев
    - Отвергнуть с ошибкой идентификатор, которого нет в журнале выходов
    - Убрать повторяющиеся идентификаторы листьев, сохранив порядок первого появления
    - 'Вернуть запись: текст сводки и итоговый список идентификаторов листьев'
  id: 021-provenance-1
  fingerprint: c21460e5
- concept: в записи provenance хранят устойчивые идентификаторы выходов, а не копии самих ответов
  question: Почему запись provenance хранит идентификаторы ответов листьев, а не сами тексты этих ответов?
  explanation: Идентификатор — ссылка на единственный источник истины в журнале. Копия ответа внутри сводки дублирует данные и перестаёт быть доказательством, если исходный выход изменился или был пересобран.
  kind: choice
  options:
    - Потому что тексты ответов нельзя сериализовать вместе со сводкой
    - Потому что идентификатор позволяет найти ответ в журнале, а копия раздувает сводку и может разойтись с оригиналом
    - Потому что по идентификатору можно понять, какой менеджер писал сводку
    - Потому что тексты листьев допустимо терять после синтеза
  correct: 1
  id: 021-provenance-2
  fingerprint: eb0c4d26
- concept: детерминированный порядок списка источников нужен, чтобы сравнения записей и тесты не зависели от порядка обхода
  question: Зачем требовать от списка источников предсказуемый порядок, а не произвольный набор?
  explanation: 'Дедупликация работает и на множестве, но нестабильный порядок делает записи несравнимыми между запусками: тест падает без изменения логики, а diff журналов показывает несуществующие расхождения.'
  kind: choice
  options:
    - Порядок задаёт вес источников при синтезе сводки
    - Одинаковый вход даёт одинаковую запись, поэтому тесты и сравнение журналов не ломаются от случайной перестановки
    - Иначе дедупликация не сможет найти повторы
    - Порядок восстанавливает время выполнения листьев
  correct: 1
  id: 021-provenance-3
  fingerprint: b539dc73
