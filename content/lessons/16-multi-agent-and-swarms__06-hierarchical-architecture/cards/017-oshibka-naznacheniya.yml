- concept: маршрутизация по поверхностному совпадению формулировок вместо зоны ответственности порождает ошибку назначения
  question: Менеджер распределяет подзадачи, ориентируясь на совпадение слов из формулировки с названиями ветвей. Чем это опасно и что использовать вместо этого?
  explanation: 'Это первый режим отказа иерархии: менеджер галлюцинирует разбиение и делегирует не тому подменеджеру. Защита ставится до запуска ветви — на этапе сопоставления поручения с зоной ответственности.'
  kind: open
  reference: 'Слово в формулировке не равно зоне ответственности: задача про правила отображения цены содержит слово «показывать» и уходит в ветку интерфейсных текстов. Разбиение при этом фактически придумано менеджером, а не выведено из цели. Сопоставлять поручение нужно с ответственностью ветви и с ожидаемым результатом: какой вопрос ветвь вправе закрыть и каким артефактом она это подтвердит. Иначе иерархия ускоряет уверенное движение не туда.'
