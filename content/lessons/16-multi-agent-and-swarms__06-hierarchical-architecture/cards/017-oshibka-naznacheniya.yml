- concept: критерий приёмки ветви задаётся типом ожидаемого артефакта, иначе качественный, но не соответствующий цели результат проходит проверку
  question: Ветви поручили выяснить, допустимо ли показывать цену без налога. Ветвь вернула аккуратно оформленный локализованный текст ценника. Какая проверка поймала бы неверное назначение до финального синтеза?
  explanation: Качество исполнения ничего не говорит об уместности. Если у поручения зафиксирован ожидаемый артефакт («заключение с ссылкой на правило»), несоответствие видно сразу на выходе ветви, а не на верхнем синтезе.
