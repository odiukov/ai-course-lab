- concept: 'рекурсивная сборка дерева агентов: проверка на лист, базовый случай, создание менеджера, построение детей, возврат узла'
  question: Расставь шаги рекурсивной функции, собирающей дерево агентов из вложенного описания, в правильном порядке.
  explanation: Базовый случай останавливает углубление на листе, рекурсивный случай не может вернуть менеджера, пока не построены все его дети. Самый первый вызов поэтому возвращает корень со всей организацией под ним.
  kind: order
  items:
    - Проверить, есть ли у текущего элемента подчинённые
    - Если подчинённых нет — создать и вернуть воркера-лист
    - Иначе создать узел-менеджера
    - Вызвать функцию для каждого подчинённого и прикрепить полученные узлы к менеджеру
    - Вернуть готовый узел вызывающей стороне
  id: 006-build-org-1
  fingerprint: 0bde49f8
- concept: внутренний узел строится через вызов той же функции для каждого ребёнка
  question: Заполни пропуск так, чтобы функция собирала поддеревья для всех подчинённых узла.
  explanation: 'Функция вызывает саму себя: задача уменьшается от целой организации до отдела, затем до одного сотрудника. Ребёнок обрабатывается тем же кодом, потому что его описание устроено так же, как описание корня.'
  kind: cloze
  template: |-
    def build_org(spec):
        if not spec["children"]:
            return Worker(spec["name"])
        node = Manager(spec["name"])
        for child in spec["children"]:
            node.add(___(child))
        return node
  answer: build_org
  accept:
    - build_org
    - build_org(child)
  id: 006-build-org-2
  fingerprint: c41a5dc3
- concept: базовый случай рекурсии — узел без подчинённых, он завершает ветку без нового вызова
  question: Что именно гарантирует, что рекурсивное построение дерева агентов остановится?
  explanation: 'Остановку даёт базовый случай: на листе углубляться некуда. Если бы менеджер возвращался до построения детей, рекурсия тоже прекратилась бы, но дерево вышло бы пустым внутри.'
  kind: choice
  options:
    - Узел без подчинённых возвращается сразу и не порождает новых вызовов, поэтому каждая ветка конечна
    - Ограничение на максимальную глубину, жёстко заданное в функции
    - Менеджер возвращается сразу после создания, ещё до обработки детей
    - Каждый вызов обрабатывает только первого подчинённого, поэтому список быстро исчерпывается
  correct: 0
