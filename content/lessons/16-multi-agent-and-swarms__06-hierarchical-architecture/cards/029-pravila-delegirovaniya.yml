  question: Какой самый дешёвый постоянный контроль дрейфа разбиения стоит держать в журнале продакшен-системы?
  explanation: 'Каскад из подменённой ветки не даёт ни одной ошибки в обычном смысле: узлы безупречно делают порученное. Единственный дешёвый сигнал — положить исходный вопрос рядом с доставленным ответом: про юридические риски спрашивали, а получили финансовые.'
  kind: choice
  options:
    - Замерять длину каждой промежуточной сводки и сигналить о выбросах
    - Хранить рядом исходный запрос и финальный ответ и проверять, отвечает ли второй на первый
    - Сравнивать время выполнения веток между прогонами
    - Считать, сколько подзадач получил каждый менеджер
