  question: Почему при делегировании перекрытие двух веток допустимо, а пропущенная часть запроса — нет?
  explanation: 'Асимметрия в информации: перекрывшиеся ветки в худшем случае потратят лишнюю работу, а исполнитель, до которого тема вообще не дошла, не подозревает о её существовании и не может закрыть пробел.'
