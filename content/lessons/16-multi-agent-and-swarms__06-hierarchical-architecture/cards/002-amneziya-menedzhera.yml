- concept: каждый уровень LLM-менеджеров — дополнительная точка искажения задачи, и сдвиг наследуется нижним уровнем как исходная цель
  question: Объясни своими словами, почему увеличение числа управляющих уровней в мультиагентной системе повышает риск получить результат мимо исходной задачи.
  explanation: 'Дерево менеджеров — это цепочка пересказов задачи. Ошибки в ней не компенсируются, а накапливаются: нижестоящий агент не может отличить искажённую цель от настоящей.'
  kind: open
  reference: Каждый управляющий агент заново интерпретирует поступившую формулировку, исходя из своего контекста, и передаёт вниз уже свою версию задачи. Небольшой сдвиг смысла на верхнем уровне следующий уровень принимает не как искажение, а как исходную цель, и добавляет к нему собственный сдвиг. Чем длиннее цепочка переформулировок, тем сильнее накопленное расхождение, причём нижние уровни не имеют доступа к первоначальной постановке, чтобы его заметить.
