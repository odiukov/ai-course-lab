- concept: 'внутренний узел дерева проходит цикл: планирование ветки, делегирование детям, синтез их ответов'
  question: Расставь действия внутреннего узла иерархии в том порядке, в котором он их выполняет за один проход.
  explanation: 'Каждый внутренний узел планирует, делегирует и синтезирует. Он не может вернуть результат раньше, чем дети закончат: его собственный выход собран из их выходов.'
  kind: order
  items:
    - Составить план для своей ветки задачи
    - Раздать подзадания дочерним узлам
    - Дождаться их ответов
    - Синтезировать полученные ответы в единый результат и вернуть его наверх
  id: 004-uzly-i-listya-1
  fingerprint: 808ea911
- concept: содержательные подзадачи выполняют только листья; работа внутренних узлов — управляющая, а не исполнительская
  question: Заказчик просит собрать обзор из семи частей, а лог показывает больше семи вызовов модели. Что делают лишние вызовы?
  explanation: Управляющая работа тоже тратит время и токены, но она не производит содержательный фрагмент результата. Работу в смысле продукта делают только листья, поэтому лишний уровень дерева добавляет не исполнителей, а ещё один цикл планирования, делегирования и синтеза.
  kind: choice
  options:
    - 'Это внутренние узлы: они планируют, делегируют и склеивают чужие результаты, но не пишут собственных частей обзора'
    - Это дублирующие исполнители, которые пишут те же части повторно для надёжности
    - Это листья, которые пишут дополнительные части обзора сверх заказанных
    - Это служебные вызовы среды выполнения, не связанные с моделью
