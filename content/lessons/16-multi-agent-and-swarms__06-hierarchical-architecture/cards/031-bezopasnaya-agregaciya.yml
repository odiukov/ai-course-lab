- concept: конфликт между листьями переносится в сводку с атрибуцией к веткам, а не разрешается выбором одного варианта
  question: Две ветки дали несовместимые выводы о причине оттока пользователей. Как менеджеру корректнее оформить сводку для уровня выше?
  explanation: Конфликт веток — это содержание результата, а не помеха. Выбор «более уверенной» ветки подменяет данные интонацией, усреднение стирает обе позиции. Атрибуция сохраняет и вывод, и возможность проверить, кто его дал.
  kind: choice
  options:
    - Оставить вывод той ветки, чья формулировка звучит увереннее
    - Сохранить обе позиции с указанием, какая ветка что утверждает
    - Свести обе формулировки к одной нейтральной фразе без указания веток
    - Не включать в сводку ни один из выводов до нового прогона обеих веток
  correct: 1
