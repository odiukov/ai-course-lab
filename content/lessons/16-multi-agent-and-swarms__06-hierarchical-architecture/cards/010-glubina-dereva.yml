- concept: глубина иерархии — число уровней на пути от корня до исполнителя, считая и корень, и исполнителя
  question: 'Поручение идёт по цепочке: главный менеджер → менеджер направления → менеджер группы → координатор смены → исполнитель. Чему равна глубина этой ветви иерархии?'
  explanation: 'Глубина считается в уровнях, а не в переходах, и оба конца пути входят в счёт: корень, три промежуточных управляющих уровня и исполнитель дают 5. Поэтому дерево из единственного исполнителя имеет глубину 1: уровень существует, хотя передавать задачу некому.'
  kind: numeric
  answer: 5
  tolerance: 0.4
  id: 010-glubina-dereva-1
  fingerprint: d2a20528
- concept: рост числа узлов на одном уровне не меняет глубину — размер иерархии и её глубина независимы
  question: У подменеджера было 4 исполнителя, ему добавили ещё 12 исполнителей на тот же уровень. Как это меняет глубину иерархии?
  explanation: 'Глубина измеряет длину пути делегирования, а не размер организации. Новые соседние узлы расширяют дерево в ширину: поручение по-прежнему проходит столько же уровней. Глубина меняется только когда между управляющим и исполнителем встраивается новый управляющий уровень.'
  kind: choice
  options:
    - 'Глубина растёт на 12: узлов стало больше'
    - 'Глубина не меняется: длина самого длинного пути от корня до исполнителя осталась той же'
    - 'Глубина растёт на единицу: появилась новая группа'
    - Глубина растёт вдвое, потому что число подчинённых выросло вчетверо
