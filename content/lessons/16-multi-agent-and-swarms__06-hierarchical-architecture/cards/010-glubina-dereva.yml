- concept: число передач поручения на единицу меньше числа уровней, потому что передача происходит на переходе между уровнями
  question: Самый длинный путь от корня до исполнителя проходит через 7 уровней. Сколько раз поручение будет пересказано при спуске по этому пути?
  explanation: 'Передача — это переход между двумя соседними уровнями, поэтому передач на одну меньше, чем уровней: 7 уровней дают 6 переходов. Каждый переход — место, где формулировку задачи можно уточнить, а можно и сместить.'
