- concept: 'число адресатов заданий не равно ни числу прямых подчинённых корня, ни числу узлов дерева: их собирают обходом всех ветвей вглубь'
  question: У корневого менеджера 3 подчинённых, и все трое — менеджеры. Первый ведёт 7 исполнителей. Второй ведёт одного менеджера, у которого 6 исполнителей. Третий ведёт 3 исполнителей. Скольким узлам можно раздать конкретные задания?
  explanation: 'Задания получают только узлы без подчинённых: 7 + 6 + 3 = 16. Прямых подчинённых у корня всего 3, и ни один из них не адресат; всего узлов в дереве 21. Поэтому список приходится собирать спуском по каждой ветви до конца, а не чтением одного уровня.'
  kind: numeric
  answer: 16
  tolerance: 0.4
