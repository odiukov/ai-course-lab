- concept: список адресатов собирается конкатенацией результатов одного и того же обхода, применённого к каждому поддереву
  question: Дополни рекурсивный сбор адресатов заданий по всей оргструктуре.
  explanation: 'Управляющий узел не добавляет себя в результат, а склеивает списки, полученные тем же обходом на каждом поддереве. Такая конкатенация не зависит от формы дерева: короткая ветвь вернёт одно имя сразу, длинная — после нескольких вложенных вызовов, и оба вклада попадут в один итоговый список.'
  kind: cloze
  template: |-
    def find_workers(node):
        if not node["children"]:
            return [node["name"]]
        result = []
        for child in node["children"]:
            result += ___(child)
        return result
  answer: find_workers
  accept:
    - find_workers
    - find_workers(child)
