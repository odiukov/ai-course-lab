- concept: при сжатии сводки на верхнем уровне ссылки переносятся до исходных листьев, а не подменяются ссылкой на нижележащую сводку
  question: Менеджер ветки сделал вывод из ответов двух исполнителей. Менеджер уровнем выше сократил этот вывод в одну строку отчёта. На что должна ссылаться строка отчёта?
  explanation: Ссылка на промежуточную сводку останавливает цепочку на пересказе. Смысл provenance — дойти до выходов листьев, где данные появились; иначе искажение окажется внутри звена, к которому и ведёт ссылка.
  kind: choice
  options:
    - На сводку менеджера ветки — это её непосредственный источник
    - На ответы обоих исполнителей, унаследованные через сводку ветки
    - На запрос пользователя, из которого выросло разбиение
    - На сам верхний менеджер как автора формулировки
  correct: 1
