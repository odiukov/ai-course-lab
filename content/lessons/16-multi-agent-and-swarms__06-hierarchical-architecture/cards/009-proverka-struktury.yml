- concept: корректность оргструктуры определяется формой связей, а не правдоподобием полей узлов
  question: Все узлы орг-структуры имеют уникальные имена и осмысленные роли. Почему этого недостаточно, чтобы считать её корректной иерархией?
  explanation: 'Проверять надо форму, а не должности: уникальные имена не мешают одному воркеру попасть в команды двух менеджеров или ветке замкнуться в цикл.'
  kind: open
  reference: 'Имена и роли — содержимое узлов, а инварианты дерева касаются связей: единственный корень, ровно один родитель у каждого некорневого узла, достижимость всех узлов из корня, отсутствие циклов и соответствие типа наличию подчинённых. Структура с безупречными полями может содержать узел с двумя родителями, замкнутый цикл делегирования или несвязанную группу — все эти дефекты видны только по форме связей.'
  id: 009-proverka-struktury-2
