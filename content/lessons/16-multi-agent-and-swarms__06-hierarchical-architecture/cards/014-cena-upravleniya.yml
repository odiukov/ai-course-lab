- concept: доля вызовов модели, уходящих на управление, равна отношению числа внутренних узлов к общему числу узлов дерева
  question: 'Иерархия: корень, под ним 9 подменеджеров, у каждого подменеджера ровно 7 исполнителей. За один проход каждый узел делает один вызов модели. Какой процент вызовов уходит на управление?'
  explanation: Исполнителей 9 × 7 = 63, управляющих узлов 9 + 1 = 10, всего узлов 73. Доля управления = 10/73 ≈ 13,7%. Чем шире группы под каждым подменеджером, тем меньше эта доля.
  kind: numeric
  answer: 13.7
  tolerance: 0.5
  id: 014-cena-upravleniya-1
  fingerprint: c9a3118d
- concept: число вызовов модели, потраченных на управление, определяется количеством внутренних узлов, а не количеством уровней иерархии
  question: Что задаёт количество вызовов модели, потраченных за проход на управление, а не на выполнение подзадач?
  explanation: Планирует, делегирует и синтезирует каждый узел с подчинёнными. Уровней может быть немного, а внутренних узлов на них — десятки, и платит модель за каждый.
  kind: choice
  options:
