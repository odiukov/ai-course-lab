- concept: добавление промежуточного уровня увеличивает общее число вызовов модели при неизменном числе исполнителей
  question: Плоский супервизор координирует 12 исполнителей. Их перегруппировали под несколько подменеджеров, число исполнителей не изменилось. Что произошло с суммарным числом вызовов модели за проход и почему?
  explanation: Ключ в том, что новые узлы не производят части результата. В схеме из восьми узлов на пять исполнителей три вызова (37,5%) уходят на организацию — глубина не бесплатна.
  kind: open
  reference: Оно выросло ровно на число добавленных подменеджеров. Исполнителей столько же, но каждый новый внутренний узел — отдельный вызов на планирование ветки и синтез ответов её детей. Полезных вызовов по-прежнему 12, а обслуживающих стало больше, поэтому доля управления в общем счёте увеличилась. Уровень должен окупить эти вызовы чем-то ещё, сам по себе он только добавляет стоимость.
