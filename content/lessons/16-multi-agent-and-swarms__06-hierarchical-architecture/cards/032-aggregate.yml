- concept: сводка узла строится снизу вверх из уже готовых сводок его прямых детей
  question: Расставьте шаги рекурсивной сборки результатов в дереве агентов для одного узла.
  explanation: 'Каждый управляющий узел работает только со своими непосредственными детьми: он не спускается сразу к листьям, а получает от детей уже собранные сводки. Сводка поднимается уровень за уровнем, пока не дойдёт до корня. Порядок важен: пока ветка не собрана целиком, объединять нечего.'
  kind: order
  items:
    - 'Проверить, есть ли у узла дочерние: узел без них возвращает собственный результат'
    - Для каждого дочернего узла рекурсивно получить его готовую сводку
    - 'Собрать по каждой ветке запись: метку ветки, содержание и идентификаторы источников'
    - Объединить записи в сводку узла и вернуть её на уровень выше
  id: 032-aggregate-2
