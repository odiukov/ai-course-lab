- concept: 'единственный корень и достижимость всех узлов из него: несвязанная группа не входит в иерархию'
  question: Объясни своими словами, зачем иерархии агентов требуется единственный корень и достижимость каждого узла из него.
  explanation: Единственный корень задаёт одну точку входа и выхода; достижимость гарантирует, что каждый узел участвует в делегировании. Вместе с инвариантом «один родитель» и запретом циклов это и превращает вложенную структуру в дерево.
  kind: open
  reference: 'Корень — единственный узел без руководителя, точка входа задачи и точка сборки итогового ответа. Если корней два, это две независимые структуры: общий результат собрать некому. Если какая-то группа не достижима из корня, до неё не дойдёт ни одно поручение и её ответ никуда не попадёт — формально она есть в данных, но частью иерархии не является.'
