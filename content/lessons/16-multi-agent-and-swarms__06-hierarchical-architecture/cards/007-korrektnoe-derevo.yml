- concept: отсутствие циклов гарантирует, что спуск по делегированию заканчивается на исполнителе
  question: Менеджер A делегирует менеджеру B, B — менеджеру C, а C снова обращается к A. Почему такая структура непригодна как иерархия агентов?
  explanation: 'В дереве любое движение вниз обязано завершиться листом. Цикл делает спуск бесконечным: задача ходит по кругу между управляющими узлами и не попадает к исполнителю.'
  kind: choice
  options:
    - Спуск по цепочке делегирования никогда не достигнет узла, который реально выполняет работу
    - Задача выполнится, но результат придёт в неверном порядке
    - Появится лишний уровень глубины, зато нагрузка распределится равномернее
    - 'Ничего страшного: цикл просто означает взаимную помощь между менеджерами'
