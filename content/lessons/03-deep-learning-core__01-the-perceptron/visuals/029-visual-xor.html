<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Почему XOR не режется одной прямой</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#6b7480; --grid:#c8cfd8;
    --one:#1f6feb; --zero:#8a9199; --line:#d1440a; --err:#d1440a; --chip:#f2f4f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ecf1; --muted:#98a2b0; --grid:#39414c;
      --one:#5aa2ff; --zero:#67707c; --line:#ff8a4c; --err:#ff8a4c; --chip:#1e232a;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:10px 12px 14px}
  h2{font-size:16px;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;
    background:var(--chip);border-radius:8px;padding:8px 10px;font-size:13px}
  .ctl input{flex:1 1 200px}
  .out{font-weight:600;color:var(--err)}
  .fb{color:var(--muted);font-size:14px}
  text{font-family:inherit}
  .ax{stroke:var(--grid);fill:none}
  .axf{fill:var(--grid)}
  .sq{stroke:var(--grid);fill:none;stroke-dasharray:4 4}
  .tl{fill:var(--fg);font-size:15px;font-weight:600}
  .cap{fill:var(--muted);font-size:13px}
  .lb{fill:var(--muted);font-size:13px}
  .axl{fill:var(--muted);font-size:13px;font-style:italic}
  .cut{stroke:var(--line);fill:none}
  .d1{stroke:var(--one);fill:none;opacity:.55}
  .d0{stroke:var(--zero);fill:none;opacity:.55}
  .p1{fill:var(--one)}
  .p0{fill:var(--zero)}
  .pv{fill:#fff;font-size:13px;font-weight:700}
  .bad{stroke:var(--err)}
</style>
<div class="wrap">
  <h2>Одна прямая: AND делится, XOR — нет</h2>
  <div id="host"></div>
  <div class="ctl">
    <label for="a">Угол прямой в XOR</label>
    <input id="a" type="range" min="0" max="179" value="45" step="1">
    <span id="o" class="out"></span>
  </div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    var VW=660, VH=380, NS='http://www.w3.org/2000/svg';

    /* данные схемы */
    var CELLS=[
      {x:0,y:0,label:'[0,0]',and:0,xor:0},
      {x:1,y:0,label:'[1,0]',and:0,xor:1},
      {x:0,y:1,label:'[0,1]',and:0,xor:1},
      {x:1,y:1,label:'[1,1]',and:1,xor:0}
    ];
    var PANELS=[
      {base:0,key:'and',title:'AND',cap:'одна прямая отделяет [1,1]'},
      {base:3,key:'xor',title:'XOR',cap:'любая прямая ошибается'}
    ];

    /* единственный перевод данных в пиксели */
    var origin={x:72,y:300}, scale=120;
    function sx(x){return origin.x+x*scale;}
    function sy(y){return origin.y-y*scale;}

    var R=sx(0.09)-sx(0);
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+VW+' '+VH);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    host.appendChild(svg);

    function el(n,a,cls){var e=document.createElementNS(NS,n);
      if(cls)e.setAttribute('class',cls);
      for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,cls,w){
      return el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),'stroke-width':w||2},cls);}
    function txt(x,y,dx,dy,s,cls,anchor){
      var t=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor},cls);
      t.textContent=s;return t;}
    function poly(pts,cls){
      var d=pts.map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' ');
      return el('polygon',{points:d},cls);}

    PANELS.forEach(function(P){
      var b=P.base;
      /* оси */
      line(b-0.25,-0.25,b+1.4,-0.25,'ax',1.5);
      line(b-0.25,-0.25,b-0.25,1.4,'ax',1.5);
      poly([[b+1.45,-0.25],[b+1.37,-0.19],[b+1.37,-0.31]],'axf');
      poly([[b-0.25,1.45],[b-0.19,1.37],[b-0.31,1.37]],'axf');
      /* засечки */
      line(b,-0.25,b,-0.31,'ax',1.5); line(b+1,-0.25,b+1,-0.31,'ax',1.5);
      line(b-0.25,0,b-0.31,0,'ax',1.5); line(b-0.25,1,b-0.31,1,'ax',1.5);
      txt(b+1.45,-0.25,8,5,'x₁','axl','start');
      txt(b-0.25,1.5,0,0,'x₂','axl','middle');
      /* квадрат */
      el('rect',{x:sx(b),y:sy(1),width:sx(b+1)-sx(b),height:sy(0)-sy(1),'stroke-width':1.5},'sq');
      txt(b+0.5,1.7,0,0,P.title,'tl','middle');
      txt(b+0.5,-0.55,0,0,P.cap,'cap','middle');
    });

    /* диагонали XOR: единицы по одной, нули по другой */
    line(3,1,4,0,'d1',2); line(3,0,4,1,'d0',2);
    /* прямая, которая справляется с AND */
    line(0.15,1.35,1.35,0.15,'cut',2.5);

    /* точки */
    var dots={};
    PANELS.forEach(function(P){
      CELLS.forEach(function(c){
        var v=c[P.key], gx=P.base+c.x;
        var d=el('circle',{cx:sx(gx),cy:sy(c.y),r:R,'stroke-width':2.5},v?'p1':'p0');
        var t=txt(gx,c.y,0,5,String(v),'pv','middle');
        if(c.y===1) txt(gx,1,0,-R-8,c.label,'lb','middle');
        else txt(gx,0,(c.x===0?-R-8:R+8),5,c.label,'lb',c.x===0?'end':'start');
        if(P.key==='xor') dots[c.label]={node:d,cell:c};
        void t;
      });
    });

    /* живая прямая в XOR: любой угол — минимум одна ошибка */
    var cut=line(3.5,0.5,3.5,0.5,'cut',2.5);
    cut.setAttribute('stroke-dasharray','7 5');
    var slider=document.getElementById('a'), out=document.getElementById('o');

    function draw(){
      var th=slider.value*Math.PI/180, dx=Math.cos(th), dy=Math.sin(th);
      var cx=3.5, cy=0.5, L=0.8;
      cut.setAttribute('x1',sx(cx-dx*L)); cut.setAttribute('y1',sy(cy-dy*L));
      cut.setAttribute('x2',sx(cx+dx*L)); cut.setAttribute('y2',sy(cy+dy*L));
      var side=CELLS.map(function(c){
        return dx*(c.y-cy)-dy*((3+c.x)-cx)>=0?1:0;});
      var e1=0;
      CELLS.forEach(function(c,i){ if(side[i]!==c.xor) e1++; });
      var flip=e1>4-e1, err=flip?4-e1:e1;
      CELLS.forEach(function(c,i){
        var pred=flip?1-side[i]:side[i];
        dots[c.label].node.setAttribute('stroke',pred!==c.xor?'var(--err)':'none');
      });
      out.textContent='ошибок: '+err+' (нуля не бывает)';
    }
    slider.addEventListener('input',draw);
    draw();
  }catch(e){
    host.innerHTML='<p class="fb">Схема должна показывать квадрат из четырёх точек XOR: '+
      '[0,1] и [1,0] — ответ 1, [0,0] и [1,1] — ответ 0. Единицы стоят по одной диагонали, '+
      'нули по другой, диагонали пересекаются в центре. Рядом AND, где одна прямая отделяет '+
      '[1,1] от трёх остальных точек. В XOR прямая под любым углом ошибается хотя бы на одной точке.</p>';
  }
})();
</script>
</html>
