- concept: ложноположительная классификация уменьшает веса активных признаков и смещение
  question: Перцептрон ошибочно отнёс объект к положительному классу. Как правило обучения изменит параметры, связанные с активными бинарными признаками?
  explanation: При ложноположительном ответе истинная метка меньше предсказания, поэтому ошибка отрицательна. При положительной скорости обучения поправки активных весов и смещения тоже отрицательны, что понижает предактивацию для похожих объектов.
  kind: choice
  options:
    - Увеличит только смещение
    - Увеличит веса активных признаков и смещение
    - Уменьшит веса активных признаков и смещение
    - Не изменит параметры
  correct: 2
  id: 016-pravilo-1
  fingerprint: 51161f87
- concept: поправка смещения зависит от скорости обучения и ошибки, но не умножается на значение входа
  question: Заполни пропуск в правиле обновления смещения перцептрона.
  explanation: Смещение обновляется на η·e. В отличие от поправки веса, здесь нет множителя x_i, потому что смещение не относится к отдельному входному признаку.
  kind: cloze
  template: b ← ___
  answer: b + η·e
  accept:
    - b + η * e
    - b + learning_rate * error
    - b + eta * error
  id: 016-pravilo-2
  fingerprint: e001b41c
