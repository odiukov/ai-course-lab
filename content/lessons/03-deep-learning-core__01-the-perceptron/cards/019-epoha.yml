- concept: эпоха — полный проход по всему обучающему набору
  question: Что называют эпохой при обучении перцептрона?
  explanation: 'Эпоха охватывает весь обучающий набор: алгоритм по одному разу рассматривает каждый входящий в него пример.'
  kind: choice
  options:
    - Однократную обработку всех примеров обучающего набора
    - Обработку одного выбранного примера
    - Любое отдельное изменение веса
    - Всё обучение до окончательной остановки
  correct: 0
  id: 019-epoha-1
  fingerprint: 88b62abc
- concept: досрочная остановка выполняется после эпохи без ошибок
  question: Расположите действия, позволяющие перцептрону досрочно завершить обучение при достижении безошибочной классификации.
  explanation: Решение об остановке принимают после полного прохода. Пустой счётчик означает, что перцептрон правильно классифицировал весь обучающий набор в рамках одной эпохи.
  kind: order
  items:
    - Начать эпоху и обнулить счётчик ошибок
    - Обработать весь обучающий набор, учитывая каждую ошибку
    - После последнего примера проверить счётчик ошибок
    - Завершить обучение, если ошибок за эпоху не было
  id: 019-epoha-2
  fingerprint: 9ebfbfd5
- concept: ограничение числа эпох гарантирует завершение обучения при отсутствии сходимости
  question: Зачем задавать максимальное число эпох, если обучение уже умеет останавливаться после безошибочного прохода?
  explanation: Ранняя остановка срабатывает только при отсутствии ошибок за целую эпоху. Верхний предел нужен на случай, если это условие никогда не будет выполнено.
  kind: open
  reference: Безошибочная эпоха может так и не наступить. Максимальное число эпох ограничивает продолжительность обучения и гарантирует остановку алгоритма.
  id: 019-epoha-3
  fingerprint: e55405b9
