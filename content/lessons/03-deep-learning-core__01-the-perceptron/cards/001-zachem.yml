- concept: обучение перцептрона состоит из повторяющихся предсказаний, измерения ошибки и поправок весов
  question: Расположи действия одного цикла обучения перцептрона в правильном порядке.
  explanation: Перцептрон сначала делает прогноз, затем определяет промах и использует его для поправки весов. Повторение этого цикла на размеченных примерах и составляет обучение.
  kind: order
  items:
    - Подать на вход пример с известным правильным ответом
    - Вычислить прогноз с текущими весами
    - Сравнить прогноз с правильным ответом
    - Скорректировать веса на основе ошибки
