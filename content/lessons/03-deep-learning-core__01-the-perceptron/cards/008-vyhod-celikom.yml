- concept: положительное масштабирование всех весов и смещения не меняет решения перцептрона
  question: Заполни пропуск для положительного коэффициента c.
  explanation: Умножение предактивации на положительный коэффициент сохраняет её знак и попадание на порог. Поэтому при одновременном масштабировании весов и смещения выход перцептрона для каждого входа остаётся прежним.
