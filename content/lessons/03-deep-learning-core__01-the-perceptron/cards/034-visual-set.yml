- concept: прямой проход выполняется в порядке зависимостей между слоями
  question: Расположи этапы прямого прохода через сеть со скрытым и выходным слоями в правильном порядке.
  explanation: Выходной нейрон зависит от результатов скрытого слоя, поэтому его нельзя вычислить раньше. Исходные признаки сначала преобразуются в скрытые активации, которые становятся новым представлением входа.
  kind: order
  items:
    - Передать исходные признаки каждому нейрону скрытого слоя
    - Вычислить активации нейронов скрытого слоя
    - Составить новый вход из скрытых активаций
    - Передать новый вход выходному нейрону и вычислить результат
  id: 034-visual-set-1
  fingerprint: 5a6ac06e
- concept: нейроны одного слоя можно вычислять параллельно при отсутствии зависимостей между ними
  question: Объясни своими словами, почему нейроны одного скрытого слоя можно вычислять одновременно.
  explanation: Принадлежность к одному слою отражает одинаковую глубину в графе вычислений. Такие нейроны независимо читают выходы предыдущего слоя, а их собственные результаты потребуются лишь следующему слою.
  kind: open
  reference: Каждый нейрон слоя получает данные только от предыдущего слоя и не использует результаты соседних нейронов. Между их вычислениями нет зависимости, поэтому порядок внутри слоя не важен и работа может идти параллельно.
  id: 034-visual-set-2
  fingerprint: 46fba810
