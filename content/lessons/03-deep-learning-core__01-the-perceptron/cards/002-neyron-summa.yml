- concept: предактивационное значение равно сумме произведений входов на соответствующие веса с добавлением смещения
  question: В нейрон подали входы 4 и −6. Их веса равны 7 и 8, а смещение равно −9. Какое значение z получится до применения функции активации?
  explanation: 'Каждый вход умножается на свой вес, после чего произведения и смещение складываются: z = 4 × 7 + (−6) × 8 − 9 = 28 − 48 − 9 = −29.'
  kind: numeric
  answer: -29
  tolerance: 0.001
  id: 002-neyron-summa-1
  fingerprint: 9dacc1e1
- concept: смещение добавляется к общей взвешенной сумме и не связано с отдельным входом
  question: Как смещение b участвует в вычислении значения z нейрона?
  explanation: 'Сначала вычисляют сумму произведений соответствующих входов и весов, а затем один раз прибавляют смещение: z = Σ(wᵢxᵢ) + b. Смещение не относится к конкретному входному признаку.'
  kind: choice
  options:
    - Прибавляется к каждому входу перед умножением на вес
    - Умножается на все веса
    - Заменяет вес одного из входов
    - Прибавляется только к самому большому произведению входа на вес
    - Один раз прибавляется к сумме всех произведений входов на веса
  correct: 4
