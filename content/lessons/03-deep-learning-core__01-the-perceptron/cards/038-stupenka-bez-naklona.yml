- concept: ошибка скрытого нейрона определяется через его влияние на итоговый выход
  question: У скрытого нейрона нет собственной целевой метки. Объясни своими словами, как обратное распространение определяет направление изменения его весов.
  explanation: Скрытому нейрону нельзя напрямую сопоставить правильный ответ из обучающей выборки. Его вклад в ошибку находят по чувствительности выхода к его сигналу, последовательно применяя цепное правило.
  kind: open
  reference: Обратное распространение вычисляет, как небольшое изменение сигнала скрытого нейрона повлияло бы на итоговый выход и ошибку. По цепному правилу выходная ошибка передаётся назад через последующие веса и производные активаций.
