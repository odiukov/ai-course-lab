- concept: при верной классификации ошибка исчезает и параметры перцептрона не обновляются
  question: Почему правило обучения перцептрона не изменяет веса и смещение, когда предсказанный класс совпадает с истинным?
  explanation: Каждая поправка пропорциональна ошибке. Верное предсказание даёт нулевую ошибку, а значит, веса и смещение сохраняются.
  kind: open
  reference: При совпадении меток их разность равна нулю. Ошибка входит множителем в поправки весов и смещения, поэтому все поправки также обнуляются.
