- concept: пропуск объекта положительного класса даёт положительную ошибку и требует повысить предактивацию
  question: Перцептрон отнёс объект к отрицательному классу, хотя его истинный класс положительный. Какой будет ошибка и в какую сторону правило обучения скорректирует предактивацию для похожего активного входа?
  explanation: Истинная метка больше предсказанной, поэтому их разность положительна. Положительная поправка увеличивает смещение и веса активных признаков, повышая предактивацию.
  kind: choice
  options:
    - Ошибка отрицательная, предактивация повысится
    - Ошибка положительная, предактивация понизится
    - Ошибка нулевая, предактивация не изменится
    - Ошибка положительная, предактивация повысится
