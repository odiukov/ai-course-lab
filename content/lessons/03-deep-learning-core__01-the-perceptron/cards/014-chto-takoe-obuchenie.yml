- concept: неактивный вход не изменяет соответствующий вес даже при ошибке
  question: Перцептрон ошибся на обучающем примере, но один из признаков в этом примере не активен. Что произойдёт с весом этого признака при стандартном правиле обучения?
  explanation: Поправка веса умножается на значение соответствующего входа. Неактивный вход обнуляет это произведение, поэтому данный вес не меняется. Смещение при этом может измениться, поскольку его поправка на вход не умножается.
  kind: choice
  options:
    - Он обязательно сменит знак
    - Он изменится на ту же величину, что и смещение
    - Он останется прежним на этом обновлении
  correct: 2
  id: 014-chto-takoe-obuchenie-2
  fingerprint: 1aacc4a8
