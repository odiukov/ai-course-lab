- concept: таблица истинности преобразуется в размеченную выборку из пар входов и целевых выходов
  question: Как представить таблицу истинности логического вентиля в виде данных для обучения с учителем?
  explanation: Например, строка AND для входа [1, 1] превращается в пару ([1, 1], 1), а строка для [0, 1] — в пару ([0, 1], 0). Перцептрон получает эти пары, а не словесное описание правила.
