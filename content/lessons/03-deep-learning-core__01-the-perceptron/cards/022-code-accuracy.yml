  fingerprint: 2c501e42
- concept: пустая выборка требует явно определённого поведения метрики
  question: Что должна сделать надёжная реализация accuracy, если ей передали пустой набор данных?
  explanation: 'У пустого набора нет примеров, поэтому обычная формула приводит к делению на ноль. Поведение нужно определить явно: например, вернуть специальное значение или выбросить понятное исключение.'
  kind: choice
  options:
    - Явно обработать этот случай и вернуть предусмотренное контрактом значение либо сообщить об ошибке
    - Без проверки разделить число совпадений на длину набора
    - Обучить модель на пустом наборе и повторить вычисление
  correct: 0
