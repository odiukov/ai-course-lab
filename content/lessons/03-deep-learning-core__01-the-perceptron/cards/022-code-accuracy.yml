- concept: оценивание модели не должно изменять её обученные параметры
  question: Почему функция вычисления accuracy должна вызывать predict, но не train и не обновлять веса модели?
  explanation: Предсказание используется только для сравнения с правильной меткой. Изменение весов во время оценки смешивает обучение с измерением качества и делает результат некорректным.
  kind: open
  reference: Метрика должна измерять качество уже зафиксированной модели. Если во время проверки обучать модель или менять её параметры, результат начнёт зависеть от порядка примеров и перестанет описывать исходное состояние модели.
  id: 022-code-accuracy-3
  fingerprint: b779b1aa
