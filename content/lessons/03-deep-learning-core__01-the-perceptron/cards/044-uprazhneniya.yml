- concept: параметры перцептрона могут задать корректную разделяющую границу для NAND
  question: Перцептрон относит объект к положительному классу при неотрицательной предактивации. Какой набор весов и смещения реализует NAND — ложь только при двух истинных входах?
  explanation: С весами [−9, −9] и смещением 14 предактивация равна 14 без активных входов, 5 с одним активным входом и −4 с обоими. Поэтому только последний случай относится к отрицательному классу.
  kind: choice
  options:
    - веса [−9, −9], смещение 14
    - веса [9, 9], смещение −14
    - веса [−9, −9], смещение −14
    - веса [9, 9], смещение 14
  correct: 0
  id: 044-uprazhneniya-1
  fingerprint: 26d80a71
- concept: функция строгого большинства для нечётного числа булевых входов линейно разделима равными весами
  question: Булева функция семи входов истинна, когда активных входов больше, чем неактивных. Объясните, почему её может реализовать один перцептрон.
  explanation: При одинаковых весах предактивация зависит только от количества активных входов. Все наборы с меньшинством получают сумму ниже порога, а все наборы с большинством — не ниже порога, поэтому функция линейно разделима.
  kind: open
  reference: Нужно назначить всем входам одинаковые положительные веса и выбрать порог между наибольшей суммой для меньшинства активных входов и наименьшей суммой для большинства. Тогда одна гиперплоскость разделит эти случаи.
  id: 044-uprazhneniya-2
  fingerprint: f9a5540c
