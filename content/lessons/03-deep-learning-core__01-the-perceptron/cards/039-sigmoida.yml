- concept: чувствительность сигмоиды максимальна в середине перехода и уменьшается при насыщении
  question: Почему одинаковое небольшое изменение предактивации сильнее меняет выход сигмоиды около центра перехода, чем далеко от него?
  explanation: Сила изменения выхода определяется локальным наклоном функции. В средней области сигмоида крутая, а на краях почти горизонтальна, поэтому чувствительность там ниже.
  kind: open
  reference: Около центра график сигмоиды наиболее крутой, поэтому небольшое изменение предактивации заметно меняет выход. Далеко от центра функция насыщается возле одной из границ, её наклон становится мал, и такое же изменение предактивации почти не влияет на результат.
