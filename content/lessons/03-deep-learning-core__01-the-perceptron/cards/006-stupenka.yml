- concept: 'ступенчатая функция разрывна: пересечение порога мгновенно меняет класс'
  question: Объясните, почему сколь угодно малое изменение предактивации может изменить решение перцептрона, а другое, даже более крупное изменение — оставить решение прежним.
  explanation: Внутри каждой стороны порога ступенчатая функция постоянна. Резкое переключение происходит лишь при переходе через границу, поэтому важен не размер изменения сам по себе, а факт пересечения порога.
  kind: open
  reference: Решение меняется только при пересечении порога. Поэтому малое изменение, переводящее предактивацию через порог, переключает класс, а крупное изменение в пределах той же стороны порога не влияет на выход.
  id: 006-stupenka-2
  fingerprint: e3f0fa4e
