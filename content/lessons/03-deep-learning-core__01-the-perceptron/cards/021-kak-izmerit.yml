- concept: accuracy равна доле верных предсказаний среди всех примеров
  question: Перцептрон проверили на 37 примерах, и в 8 случаях его предсказание оказалось ошибочным. Чему равна accuracy? Ответ округли до трёх знаков после запятой.
  explanation: Верных предсказаний было 37 − 8 = 29. Поэтому accuracy = 29 / 37 ≈ 0.784.
  kind: numeric
  answer: 0.784
  tolerance: 0.001
  id: 021-kak-izmerit-1
  fingerprint: 55a8a8d9
- concept: безошибочная классификация обучающего набора не гарантирует качество на новых данных
  question: Обучение перцептрона завершилось после прохода без ошибок по training_data. Какой вывод обоснован?
  explanation: Условие errors == 0 относится только к примерам из training_data. Оно означает полную точность на обучающем наборе, но ничего не гарантирует для ранее не встречавшихся данных.
  kind: choice
  options:
    - Перцептрон будет безошибочно классифицировать любые новые объекты
    - Перцептрон нашёл единственную возможную разделяющую границу
    - Перцептрон без ошибок классифицировал обучающий набор, но качество на новых данных нужно проверять отдельно
