- concept: расстояние выхода сигмоиды от порога характеризует уверенность бинарного решения
  question: Порог классификации равен 0.6. Модель A выдаёт 0.57 для отрицательного объекта и 0.63 для положительного, а модель B — 0.14 и 0.91 соответственно. Обе модели присваивают правильные классы. Какая модель демонстрирует более уверенное разделение?
  explanation: 'Выходы модели B расположены заметно дальше от порога 0.6. Это означает больший запас до смены класса: небольшое изменение выхода с меньшей вероятностью переведёт прогноз через порог.'
  kind: choice
  options:
    - Модель B, потому что её выходы дальше от порога
    - Модель A, потому что её выходы ближе к порогу
    - Модели одинаковы, поскольку бинарные прогнозы совпадают
