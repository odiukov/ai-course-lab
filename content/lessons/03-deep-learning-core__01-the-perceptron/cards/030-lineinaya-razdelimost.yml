- concept: результат Минского и Паперта выявил фундаментальное ограничение одиночных перцептронов и вызвал спад интереса к нейросетям
  question: Почему результат Минского и Паперта восприняли как «приговор» одиночному перцептрону и как он повлиял на исследования нейросетей?
  explanation: Книга «Perceptrons» формализовала предел возможностей одиночного перцептрона. Поскольку для XOR подходящих весов не существует, проблема выглядела как тупик для тогдашнего подхода; выходом позже стали многослойные архитектуры.
  kind: open
  reference: Минский и Паперт строго показали, что одиночный перцептрон не способен представить нелинейно разделимые функции, включая XOR. Это ограничение относится к самой архитектуре, поэтому его нельзя устранить подбором весов или более долгим обучением. Результат способствовал резкому сокращению интереса и финансирования нейросетевых исследований.
  id: 030-lineinaya-razdelimost-2
