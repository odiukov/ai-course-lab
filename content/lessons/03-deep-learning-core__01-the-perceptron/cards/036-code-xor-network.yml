- concept: известные логические вентили можно собрать в сеть с вручную заданными параметрами без обучения
  question: Почему для реализации XOR через скрытые нейроны OR и NAND и выходной нейрон AND не обязательно запускать обучение?
  explanation: 'В xor_network параметры задаются вручную: OR получает веса [1.0, 1.0] и смещение −0.5, NAND — веса [−1.0, −1.0] и смещение 1.5, а AND — веса [1.0, 1.0] и смещение −1.5. Поэтому функция сразу реализует нужную таблицу истинности.'
  kind: open
  reference: Если веса и смещения заранее выбраны так, что каждый перцептрон точно реализует нужный логический вентиль, остаётся только соединить их и выполнить прямой проход. Обучение требуется для поиска параметров, а здесь они уже известны.
  id: 036-code-xor-network-2
  fingerprint: c3f39a4d
- concept: полный перебор конечной булевой области позволяет исчерпывающе проверить реализацию логической функции
  question: Какой набор тестов даёт исчерпывающую проверку программной реализации XOR для пары булевых входов?
  explanation: 'У пары булевых входов есть четыре возможные комбинации: [0, 0], [0, 1], [1, 0] и [1, 1]. Совпадение результата с таблицей истинности на всех четырёх комбинациях проверяет всю допустимую область, а не отдельные примеры.'
  kind: choice
  options:
    - Все возможные пары булевых значений
    - Только пары с одинаковыми значениями
    - Только пары, на которых XOR должен быть истинным
    - Одна случайно выбранная пара
