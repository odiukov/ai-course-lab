- concept: порог для взвешенной суммы равен смещению с обратным знаком
  question: Чему равен порог для взвешенной суммы входов перцептрона?
  explanation: Условие срабатывания wᵀx + b ≥ 0 равносильно wᵀx ≥ −b. Поэтому смещение b задаёт порог −b.
  kind: cloze
  template: Если смещение равно b, то порог для взвешенной суммы T = ___.
  answer: -b
  accept:
    - −b
    - минус b
    - смещение с обратным знаком
  id: 004-smeshenie-1
  fingerprint: f365869e
- concept: изменение смещения сдвигает разделяющую границу, не меняя её ориентацию
  question: У перцептрона зафиксирован ненулевой вектор весов. Что произойдёт с разделяющей границей при изменении только смещения?
  explanation: Граница задаётся уравнением wᵀx + b = 0. Вектор весов w определяет её ориентацию, а изменение b при неизменном w сдвигает границу параллельно.
  kind: choice
  options:
    - Граница сдвинется параллельно самой себе
    - Граница повернётся из-за изменения важности признаков
    - Граница станет нелинейной
    - Ориентация и положение границы останутся прежними
