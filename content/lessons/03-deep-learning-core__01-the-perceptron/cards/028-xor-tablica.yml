- concept: 'XOR немонотонен: увеличение одного входа при истинном другом входе может уменьшить выход'
  question: Объясни своими словами, почему XOR не является монотонной булевой функцией. Приведи случай, когда замена ложного входа на истинный уменьшает результат.
  explanation: При одном истинном входе XOR даёт истину, а при двух истинных входах — ложь. Поэтому переход входа от лжи к истине не обязательно сохраняет или повышает результат.
  kind: open
  reference: Если один вход уже истинен, то при ложном втором входе XOR истинен. После замены второго входа на истинный входы становятся одинаковыми, поэтому XOR становится ложным. Значит, увеличение входа способно уменьшить выход.
