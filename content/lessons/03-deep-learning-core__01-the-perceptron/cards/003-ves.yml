- concept: сила влияния веса определяется его модулем, а знак задаёт направление влияния
  question: У двух входов одинаковые положительные значения. Вес первого положительный, вес второго отрицательный, но модуль второго заметно больше. Какой вход сильнее влияет на взвешенную сумму и чем различается направление их влияния?
  explanation: Модуль веса показывает силу влияния входа, а знак — его направление. Поэтому большой отрицательный вес может влиять сильнее небольшого положительного, хотя и тянет сумму в противоположную сторону.
  kind: open
  reference: Сильнее влияет второй вход, потому что модуль его веса больше. Отрицательный знак означает, что он уменьшает взвешенную сумму, тогда как первый вход с положительным весом увеличивает её.
  id: 003-ves-2
  fingerprint: f4c2c476
