- concept: пересечение выпуклых оболочек классов доказывает отсутствие линейного разделителя для XOR
  question: 'В вершинах квадрата метки классов чередуются: точки одного класса занимают одну диагональ, а точки другого — вторую. Какое наблюдение доказывает, что классы нельзя разделить прямой?'
  explanation: Выпуклая полуплоскость, содержащая обе точки одного класса, должна содержать и весь отрезок между ними. Для XOR такими отрезками служат диагонали [0,1]–[1,0] и [0,0]–[1,1]. Они пересекаются в центре, поэтому разделяющая прямая не существует.
  kind: choice
  options:
    - Отрезки между точками каждого класса пересекаются, поэтому пересекаются и выпуклые оболочки классов
    - Все вершины квадрата равноудалены от его центра
    - Противоположные стороны квадрата параллельны
    - Диагонали квадрата имеют одинаковую длину
  correct: 0
  id: 029-visual-xor-1
  fingerprint: 38c0ee28
- concept: скрытый слой позволяет представить XOR комбинацией нескольких линейных границ
  question: Объясни своими словами, почему несколько перцептронов в слоях могут классифицировать XOR, хотя один перцептрон не справляется.
  explanation: Один перцептрон создаёт только одну прямую границу. Скрытые нейроны создают несколько границ, а следующий слой комбинирует их, формируя область решения, которую нельзя получить одной полуплоскостью.
  kind: open
  reference: Отдельные нейроны скрытого слоя проводят разные линейные границы и выделяют нужные области пространства. Выходной нейрон объединяет результаты этих проверок, поэтому общая граница решения получается нелинейной и может отделить диагонально расположенные точки XOR.
  id: 029-visual-xor-2
  fingerprint: 67da8624
