- concept: деление на сумму весов позволяет подавать ненормированные уверенности
  question: Агенты дебатов выдали ответы 24, 36 и 72, а их уверенности заданы как 6, 6 и 8 — эти веса в сумму единицу не складываются. Какое число вернёт корректно написанная weighted_mean?
  explanation: 'Сумма вкладов: 24×6 + 36×6 + 72×8 = 144 + 216 + 576 = 936. Общий вес: 6 + 6 + 8 = 20. Деление даёт 936 / 20 = 46.8. Без деления на сумму весов получилось бы 936 — число вне диапазона самих ответов, то есть не консенсус, а мусор. Нормировка и делает функцию пригодной для любых шкал уверенности.'
  kind: numeric
  answer: 46.8
  tolerance: 0.01
  id: 004-weighted-mean-1
  fingerprint: 96e25b58
- concept: нормированное взвешенное среднее всегда лежит между минимальным и максимальным ответом
  question: Три агента ответили 18, 44 и 91. Веса уверенности можно назначать любые положительные. Какое значение консенсуса недостижимо ни при каком наборе весов?
  explanation: 'Нормированное взвешенное среднее — выпуклая комбинация ответов: сумма нормированных весов равна единице, поэтому результат не может выйти за отрезок [18, 91]. Значения 18.4, 55.2 и 90.7 внутри отрезка и достижимы подбором весов, а 97.0 лежит выше максимума. Отсюда практический вывод: перекос весов подтягивает консенсус к чьему-то ответу, но никогда не выбрасывает его за пределы мнений группы.'
  kind: choice
