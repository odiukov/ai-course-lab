- concept: ответ и его вес сопоставляются по позиции, а не суммируются по отдельности
  question: Заполните пропуск так, чтобы каждый ответ умножался только на вес своего агента.
  explanation: 'zip склеивает два списка попарно по индексу: первый ответ с первым весом и так далее. Без попарного обхода связь «ответ — его уверенность» теряется, и функция вырождается в произведение двух независимых сумм, которое взвешенным средним не является.'
  kind: cloze
  template: sum(a * w for a, w in ___(answers, weights)) / sum(weights)
  answer: zip
