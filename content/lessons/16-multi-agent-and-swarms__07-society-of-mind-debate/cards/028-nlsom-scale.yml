- concept: 'выгода масштаба вероятностная, а расход детерминированный: оплачивается работа всех участников, включая тех, чей вклад нулевой'
  question: Сообщество из 80 агентов дало верный ответ, причём по логам видно, что решение вытянули шестеро, а остальные лишь повторили чужие выводы. Как это соотносится с ценой прогона?
  explanation: 'Полезность масштаба вероятностная — больше участников, больше шансов, что кто-то посмотрит на задачу под нужным углом. Расход детерминированный: каждый участник генерирует ответ и читает чужие сообщения независимо от того, изменил он итог или нет. Поэтому большие сообщества оправданы только там, где прирост качества стоит дороже оплаченного впустую трафика.'
  kind: choice
  options:
    - Оплачивается только вклад полезных участников, поэтому цена близка к прогону из шести агентов
    - 'Оплачивается генерация и чтение сообщений всех 80 участников: масштаб покупает шанс на полезное разделение труда, но счёт приходит за всё сообщество'
    - Бесполезные участники удешевляют прогон, потому что их ответы короче
    - Цена не зависит от числа участников, если ответ найден в первом раунде
  correct: 1
