- concept: лимит раундов выводится из соотношения падающей отдачи и не падающей цены раунда
  question: Отдача каждого следующего раунда дебатов быстро падает. Как ведёт себя при этом цена раунда, и какой вывод про лимит раундов отсюда следует?
  explanation: 'Полезность и стоимость меняются по-разному: сдвиг ответов затухает, а обновление каждого агента остаётся обязательным на любом раунде. Значит, лимит — экономическое решение об окупаемости, а не свойство алгоритма.'
  kind: choice
  options:
    - Цена не падает — обновлять надо всех агентов, — поэтому раунды режут в точке, где прирост качества перестаёт окупать постоянные расходы
    - Цена падает вместе с отдачей, потому что в поздних раундах агенты пишут более короткие ответы
    - Цена падает, так как согласившиеся агенты перестают вызываться, и лимит раундов не нужен
    - 'Цена не важна: раунды режут, потому что после определённого числа ответы перестают меняться математически'
