- concept: разброс зависит только от двух крайних значений и потому чувствителен к единственному выбросу
  question: Агенты дали ответы 30, 32, 33 и 120. Разброс равен 90. Насколько хорошо это число описывает состояние спора?
  explanation: Разброс берёт только max и min, а распределение между ними игнорирует. Один выброс задаёт всё значение. Дёшево и наглядно для наблюдения по раундам, но за детализацией нужна другая статистика — например, дисперсия.
  kind: choice
  options:
    - 'Хорошо: спор действительно далёк от согласия по всем участникам'
    - 'Плохо: три агента почти согласны, разброс раздут единственным выбросом, потому что учитывает только крайние значения'
    - 'Плохо: разброс должен считаться как среднее попарных расстояний, иначе он всегда занижен'
    - Разброс здесь неприменим — метрика работает только для трёх агентов
