- concept: разброс = максимум минус минимум по набору ответов
  question: После раунда дебатов четыре агента дали ответы 45, 62, 41 и 58. Чему равен разброс?
  explanation: max = 62, min = 41, разброс = 62 − 41 = 21. Разброс — дистанция между двумя крайними мнениями; промежуточные ответы 45 и 58 в него не входят.
  kind: numeric
  answer: 21
  tolerance: 0.01
  id: 005-razbros-otvetov-1
  fingerprint: d3c11ff2
- concept: нулевой разброс означает согласие, а не правильность
  question: После трёх раундов разброс ответов агентов упал до нуля. Что из этого следует?
  explanation: Разброс измеряет согласованность общества агентов, а не близость к истине. Если все дружно назвали 90 там, где верно 45, разброс нулевой, а ответ неверный — типичный sycophancy cascade, когда все свернулись к самому уверенному голосу.
  kind: choice
  options:
