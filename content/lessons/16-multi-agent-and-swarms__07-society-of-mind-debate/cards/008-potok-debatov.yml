- concept: расходы растут быстрее числа вызовов, потому что промпт поздних раундов содержит чужие ответы
  question: Дебаты N агентов на R раундов дают N×R вызовов модели. Почему счёт растёт сильнее, чем в N×R раз по сравнению с одним обычным вызовом?
  explanation: 'Растёт не только количество запросов, но и длина каждого: вызов раунда r несёт вопрос плюс N−1 чужих ответов. Стоимость складывается из числа вызовов и объёма контекста, и второе множитель растёт с раундами.'
  kind: choice
  options:
    - Промпт каждого следующего раунда несёт ответы соседей, поэтому входных токенов на вызов становится всё больше
    - Модель тарифицирует параллельные вызовы дороже последовательных
    - Каждый раунд требует отдельного дообучения модели под контекст спора
    - Голосование большинством выполняется отдельным платным вызовом на каждый ответ
