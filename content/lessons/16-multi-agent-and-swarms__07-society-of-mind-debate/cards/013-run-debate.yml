- concept: 'снимок состояния в истории должен быть копией: сохранение ссылки на изменяемый объект даёт алиасинг'
  question: Оркестратор дебатов кладёт в историю сам объект состояния агентов, а функция раунда обновляет этот объект на месте. Что окажется в истории после 5 раундов?
  explanation: Список — изменяемый объект. Сохранена ссылка, а не копия, поэтому мутация на месте меняет все «снимки» сразу. Лечится копированием состояния перед записью (или тем, что функция раунда возвращает новый объект).
  kind: choice
  options:
    - Все записи ссылаются на один и тот же список и показывают финальные ответы
    - Каждая запись хранит своё, отличное от других состояние
    - В истории останется только начальное состояние, обновления не запишутся
  correct: 0
  id: 013-run-debate-1
  fingerprint: f78ba6f4
- concept: 'разделение ответственности: цикл дебатов управляет последовательностью и снимками, правило обновления мнений живёт в функции одного раунда'
  question: Объясни своими словами, почему функция, прогоняющая дебаты по раундам, сама не должна содержать формулу пересчёта ответов агентов.
  explanation: 'Разделение: цикл — про последовательность и хранение траектории, раунд — про содержание одного обновления.'
  kind: open
  reference: 'Цикл дебатов отвечает только за оркестровку: взять текущее состояние, вызвать функцию одного раунда, заменить состояние результатом, сохранить снимок. Правило обновления (взвешенное среднее, голосование, любая другая стратегия) живёт в функции раунда. Тогда смена стратегии обновления не требует правок в цикле, а цикл можно тестировать на заглушке раунда, и наоборот. Смешивание двух ролей делает обе непроверяемыми по отдельности.'
  id: 013-run-debate-2
