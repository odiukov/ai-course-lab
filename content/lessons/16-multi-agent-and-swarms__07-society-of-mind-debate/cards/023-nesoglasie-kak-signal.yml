- concept: критика работает, переводя молчаливое допущение в явное утверждение, которое надо защищать
  question: Почему возражение соседа чаще всего исправляет рассуждение именно в том месте, куда сам агент не смотрел?
  explanation: Собственные предпосылки внутри цепочки не выглядят как утверждения, требующие проверки, — они выглядят как условие задачи. Чужой вывод, полученный из другой предпосылки, превращает их в вопрос, на который приходится ответить явно.
  kind: choice
  options:
    - 'Оно вскрывает неявное допущение: то, что агент принял молча, приходится сформулировать и защитить'
    - Оно указывает на арифметические ошибки, которые агент не умеет замечать сам
    - Оно повышает уверенность агента, а высокая уверенность лечит ошибки
    - Оно сдвигает финальный ответ ближе к среднему по группе
