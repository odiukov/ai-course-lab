- concept: обмен одними финальными ответами без обоснований вырождает дебаты в повторное голосование
  question: В раунде агентам передают только финальные ответы соседей, без цепочек рассуждений. Во что превращается процедура?
  explanation: Голый ответ соседа сообщает только его позицию, а не причины. Пересматривать собственную цепочку не от чего — остаётся присоединиться к большинству или упереться. Ценность обмена создают именно обоснования, поэтому в промпт раунда кладут рассуждения, а не одни итоговые значения.
  kind: choice
  options:
    - 'В голосование: у агента нет материала для пересмотра, кроме числа сторонников каждого варианта'
    - 'В self-consistency с усилением: ответы сохраняют независимость и усредняются лучше'
    - В более дешёвую, но эквивалентную по эффекту версию дебатов
