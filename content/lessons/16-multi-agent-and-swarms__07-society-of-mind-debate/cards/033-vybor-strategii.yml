- concept: 'раунд round-robin допускает параллельный запуск участников, цепочка — нет: её задержка растёт с числом звеньев'
  question: Почему один раунд round-robin можно выполнить параллельными вызовами, а дебаты-цепочку — нет?
  explanation: Round-robin читает состояние на входе раунда, поэтому вызовы независимы друг от друга и задержка раунда равна задержке одного вызова. В цепочке вход каждого участника — выход соседа, так что задержка складывается по числу звеньев. Это отдельная от денег статья расходов, о которой легко забыть при выборе схемы.
  kind: choice
  options:
    - Цепочке обязательно нужен внешний судья, а он работает последовательно
    - В раунде round-robin все агенты обновляются от одного зафиксированного набора чужих ответов, а каждое звено цепочки требует готового выхода предыдущего
    - В цепочке участники используют разные модели, и их нельзя вызывать одновременно
    - Параллельные вызовы несовместимы с голосованием большинства
  correct: 1
