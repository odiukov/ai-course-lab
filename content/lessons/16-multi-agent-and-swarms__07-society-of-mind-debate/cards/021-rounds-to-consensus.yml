- concept: индекс 0 — валидный результат функции, поэтому отсутствие сходимости проверяется сравнением с None, а не проверкой на истинность
  question: Функция возвращает индекс снимка или None. Дополните проверку «порог так и не достигнут» так, чтобы валидный нулевой индекс не был принят за отсутствие результата.
  explanation: 'Ноль — законный ответ функции: он означает, что порог был взят ещё на стартовом снимке. Но 0 ложен в булевом контексте, поэтому запись `if not rounds_to_consensus(...)` спутает «сошлись сразу» с «не сошлись никогда». Явное сравнение с None разводит эти два случая.'
