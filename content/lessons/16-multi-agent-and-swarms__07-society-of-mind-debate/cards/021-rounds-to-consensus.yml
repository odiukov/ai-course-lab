- concept: 'схема с судьёй как альтернатива round-robin: агрегирование выносится внешнему арбитру вместо голосования участников'
  question: Помимо round-robin, где каждый агент на каждом раунде читает ответы всех остальных, описывают схему дебатов с судьёй. В чём её структурное отличие?
  explanation: 'В round-robin агрегирование встроено в саму группу: каждый читает всех и сам пересматривает ответ, финал берут большинством. В судейской схеме появляется внешняя роль, которая оценивает аргументы и выбирает ответ, — это меняет и стоимость (участники не обязаны читать всех), и точку отказа: ошибка судьи не гасится голосованием. Третья известная альтернатива — chain-of-debate, где обмен идёт по цепочке, а не «все со всеми».'
  kind: choice
  options:
    - Судья — это тот же агент, которому дают вдвое больше раундов на размышление
    - Итог выносит отдельная модель-арбитр, которая читает ответы и доводы участников; решение перестаёт быть голосованием внутри группы
    - Судья заранее назначает каждому агенту температуру сэмплирования, а дальше идёт обычный round-robin
    - Судья запрещает агентам видеть исходный вопрос, оставляя им только чужие ответы
