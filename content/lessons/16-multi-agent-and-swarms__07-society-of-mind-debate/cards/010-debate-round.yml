- concept: 'стоимость раунда квадратична по числу агентов: каждый читает N−1 чужих ответов'
  question: В дебатах семь агентов. За один раунд каждый агент читает ответы всех остальных. Сколько прочтений чужих ответов происходит за раунд?
  explanation: 'Каждый из 7 агентов получает 7−1 = 6 чужих ответов: 7×6 = 42. Объём обмена растёт как N², поэтому «добавим ещё агентов» дорожает быстрее, чем кажется: удвоение состава учетверяет трафик внутри раунда.'
  kind: numeric
  answer: 42
  tolerance: 0.5
  id: 010-debate-round-2
