- concept: при коррелированных ошибках обмен доводами не проверяет ошибку, а взаимно её подкрепляет и повышает уверенность группы
  question: Объясни своими словами, почему при коррелированных ошибках обсуждение делает группу увереннее, но не точнее.
  explanation: Дебаты проверяют утверждение только столкновением с независимым основанием. Если основания общие, механизм обмена работает вхолостую и его наблюдаемый результат — единодушие — становится обманчивым сигналом.
  kind: open
  reference: 'Каждый участник приходит к ошибочному выводу по одной и той же причине — общая предпосылка, общее прочтение условия, один и тот же ложный факт. В обмене он видит у соседей не контраргумент, а свой же ход рассуждения, изложенный другими словами. Это выглядит как подтверждение: несогласия нет, значит, обосновывать нечего и исправлять нечего. Согласие растёт, вместе с ним растёт заявленная уверенность, но ни одно из оснований так и не подверглось проверке. Разбор ошибки начинается только тогда, когда в группе есть участник, чьи основания другие: другая модель, другой способ вычисления, роль, обязанная оспорить общую предпосылку.'
  id: 024-korrelirovannye-oshibki-3
