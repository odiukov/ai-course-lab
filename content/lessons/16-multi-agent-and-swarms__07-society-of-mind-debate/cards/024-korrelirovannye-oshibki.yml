- concept: разные обсуждённые точки зрения снимают корреляцию сильнее, чем технические различия вроде сида или температуры
  question: 'Что расположено по силе снятия корреляции ошибок выше: разные сиды одной модели или разные обсуждаемые точки зрения на задачу?'
  explanation: Смена сида перетасовывает выбор токенов, но модель остаётся с теми же выученными искажениями и тем же прочтением условия. Явно заданная другая точка зрения атакует саму предпосылку, поэтому декоррелирует сильнее — и это же делает дебаты полезнее простого набора сэмплов.
  kind: choice
  options:
    - 'Разные точки зрения: они меняют предпосылки рассуждения, тогда как сид меняет лишь траекторию сэмплирования внутри тех же предпосылок'
    - 'Разные сиды: они дают строго независимые сэмплы, а точки зрения задаются одним и тем же промптом'
    - Оба способа эквивалентны, потому что оба увеличивают разброс ответов
    - 'Ни один не работает: корреляция снимается только сменой семейства модели'
