  fingerprint: a4995156
- concept: общее число вызовов LLM равно произведению числа агентов на число раундов
  question: Дебаты запущены на 7 агентах и длятся 3 раунда, каждый агент в каждом раунде выдаёт новый ответ. Сколько всего вызовов LLM потребуется?
  explanation: 'N агентов × R раундов = N·R вызовов, здесь 7 × 3 = 21. Это нижняя оценка расходов: сами вызовы поздних раундов ещё и дороже, потому что обрабатывают более длинный вход.'
  kind: numeric
  answer: 21
  tolerance: 0.5
