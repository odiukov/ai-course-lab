- concept: topic drift на длинных дебатах и его лечение повторной подачей исходного вопроса в каждом раунде
  question: Дебаты идут 8 раундов. К последним раундам агенты обсуждают деталь, всплывшую в чужой реплике, а исходный вопрос уже не адресуют. Какая мера прямо противодействует этому?
  explanation: 'Это topic drift: при длинных дебатах чужие реплики вытесняют исходную задачу, и спор уползает в сторону. Прямое лекарство — повторно вставлять сам вопрос в промпт на каждом раунде, чтобы цель переформулировалась вместе с критикой. Больше агентов только усиливает объём посторонних реплик.'
  kind: choice
  options:
    - Заново подкладывать формулировку исходного вопроса в промпт каждого раунда
    - Увеличить число агентов, чтобы кто-нибудь удержал тему
    - Передавать агентам только последний ответ соседа, без остальных
    - Поднять температуру сэмплирования для разнообразия формулировок
  correct: 0
