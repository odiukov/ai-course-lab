- concept: величина допуска — предметное решение, задающее компромисс между дроблением одного лагеря и слиянием разных позиций
  question: Агенты предлагают дозировку препарата в миллиграммах. Какой довод правильнее всего описывает выбор допуска для кластеризации их ответов?
  explanation: 'Одно и то же численное расхождение бывает шумом и бывает содержательным разногласием: полкилометра в оценке маршрута — мелочь, полмиллиграмма в дозировке — нет. Допуск задаёт, что в данной задаче считается «одним и тем же ответом», и потому не выводится из самих чисел.'
  kind: choice
  options:
    - 'Допуск диктуется предметом: слишком малый разобьёт единую позицию на отдельные точки, слишком большой объединит клинически разные дозировки в один лагерь'
    - Допуск всегда берут равным стандартному отклонению ответов — это универсальное правило
    - Допуск не влияет на результат, он лишь ускоряет вычисления при большом числе агентов
    - Допуск нужно делать максимально широким, чтобы гарантировать единственный кластер и полное согласие
