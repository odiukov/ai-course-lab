- concept: усреднение бимодального набора ответов даёт значение, которого не назвал ни один агент, и скрывает существование второй группы
  question: 'Шесть агентов оценивают длину детали в сантиметрах: 2,0; 2,1; 2,2; 14,0; 14,1; 14,2. Чему равно среднее арифметическое их ответов?'
  explanation: Сумма 48,6 делится на 6 и даёт 8,1 — значение из пустой зоны между двумя лагерями, которое не поддержал никто. Среднее сплющивает бимодальный набор в одно число и стирает сам факт, что группа расколота; кластеризация вместо этого показывает две позиции, 3 голоса против 3.
  kind: numeric
  answer: 8.1
