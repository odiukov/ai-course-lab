- concept: раунд считается от зафиксированного снимка состояния, а замена мнений происходит одномоментно
  question: Расставь по порядку шаги одного раунда обмена, чтобы результат не зависел от порядка обхода агентов.
  explanation: Если писать новый ответ агента сразу в общее состояние, следующий агент получит более свежие данные, чем предыдущий. Тогда перестановка агентов в списке меняет исход дебатов — воспроизводимость теряется. Снимок уравнивает всех участников раунда в объёме доступной информации.
  kind: order
  items:
    - 'Зафиксировать снимок: ответы и уверенности всех агентов на начало раунда'
    - Для каждого агента вычислить новое мнение по данным снимка
    - Сложить все новые мнения во временную коллекцию
    - Заменить старые ответы новыми одновременно, когда пересчитаны все агенты
  id: 009-odin-raund-1
  fingerprint: 26d87dae
- concept: 'убывающая отдача раундов: основной сдвиг даёт первый обмен, поздние раунды почти не меняют ответы'
  question: В логе дебатов ответы агентов сильно сближаются после первого обмена, слабее после второго и почти не двигаются дальше. Что это значит для настройки числа раундов?
  explanation: Первый обмен приносит новую информацию — чужие рассуждения. Второй её уточняет. Дальше агенты пережёвывают уже учтённое, и прирост точности выходит на плато (тот же эффект зафиксирован у Du et al.). Платить N вызовов за доли процента невыгодно, поэтому лимит раундов ставят заранее.
  kind: choice
  options:
    - 'Раунды дают убывающую отдачу, поэтому их обычно ограничивают небольшим числом: каждый лишний стоит N вызовов, а прибавляет доли процента'
    - Значит, агенты сломались и раунды нужно наращивать, пока ответы не станут строго равны
    - Значит, число раундов не влияет на качество и достаточно одного первого ответа
    - Значит, надо увеличить уверенности агентов, чтобы сходимость растянулась подольше
