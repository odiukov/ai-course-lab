- concept: 'выигрыш от разнородного состава зависит от сопоставимости участников по силе: слабая, но уверенная модель тянет консенсус к своей ошибке'
  question: В дебатах участвуют две сильные модели разных семейств и одна заметно более слабая модель третьего семейства, которая отвечает неверно, зато развёрнуто и без признаков сомнения. Чего ждать от такого состава?
  explanation: Смешанный состав ломает общую ошибку одного семейства, но одновременно впускает участников разного качества. Тон и длина объяснения читаются другими агентами как признак качества аргумента, и слабый голос перетягивает группу — особенно если голоса взвешиваются заявленной уверенностью.
  kind: choice
  options:
    - 'Разнородность гарантирует улучшение: чем больше разных семейств, тем точнее консенсус'
    - Слабый участник безвреден, потому что его ответ всё равно окажется в меньшинстве
    - Уверенно поданный неверный ответ способен сдвинуть консенсус, поэтому разнородность помогает лишь при сопоставимом уровне участников
    - Слабая модель влияет только на скорость сходимости, но не на итоговый ответ
  correct: 2
  id: 027-heterogeneous-debate-1
  fingerprint: 19220d94
- concept: простое большинство гасит одиночный отличающийся источник, поэтому разнородность требует баланса состава или агрегации не голосованием
  question: Четыре агента построены на одной базовой модели, пятый — на другой. Пятый единственный замечает пропущенное условие задачи. Объясни своими словами, почему такой состав почти не даст выигрыша от разнородности при агрегации простым большинством и что можно изменить.
  explanation: Разнородность работает через некоррелированные слепые пятна, но выигрыш реализуется только если механизм агрегации способен услышать меньшинство. Голосование по числу голосов измеряет размер лагеря, а не качество довода.
  kind: open
  reference: 'Четыре агента одного семейства делят обучение и слепые пятна, поэтому их ошибка коррелирована и повторяется у всех четверых: голосование даёт 4 против 1 в пользу неверного ответа. Единственный носитель другого взгляда систематически остаётся в меньшинстве, и его расхождение — самый ценный сигнал в составе — подавляется правилом агрегации, а не проверяется. Лечится либо балансом состава (сопоставимое число агентов от разных семейств), либо агрегацией, которая опирается на разбор аргументов и проверку возражений, а не на подсчёт голосов — например, внешний судья или явное требование ответить на возражение меньшинства.'
  id: 027-heterogeneous-debate-2
  fingerprint: d2a8f087
