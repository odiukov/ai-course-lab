- concept: первый раунд проводят без показа чужих ответов, чтобы стартовые позиции не были заранее согласованы
  question: Почему в схеме Du et al. первый ответ каждый агент даёт независимо, не видя чужих вариантов? Объясни своими словами.
  explanation: 'Порядок «сначала независимо, потом обмен» не декоративный: он отделяет источник разнообразия от механизма его схлопывания. Ранний обмен даёт эффект якоря — все ответы стягиваются к первому озвученному.'
  kind: open
  reference: 'Польза дебатов возникает из различий между ответами: агенту показывают чужое решение как новое свидетельство. Если уже на первом шаге показать всем один готовый вариант, остальные будут отталкиваться от него, ответы окажутся похожими, и сравнивать станет нечего — ошибка первого распространится вместо того, чтобы быть замеченной. Независимый старт создаёт разброс позиций, а последующие раунды его разрешают.'
  id: 007-algoritm-du-2
  fingerprint: 26d0c60a
