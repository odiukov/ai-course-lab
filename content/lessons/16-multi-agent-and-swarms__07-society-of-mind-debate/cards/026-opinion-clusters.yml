- concept: порядок шагов последовательной группировки ответов по допуску
  question: Расставь шаги функции, группирующей числовые ответы в кластеры по допуску, в правильном порядке.
  explanation: 'Сортировка обязательна: без неё соседями в проходе окажутся случайные пары и один лагерь распадётся. Копия нужна, чтобы вызывающая сторона сохранила исходный порядок ответов. Пустой вход не заходит в цикл и даёт пустой список кластеров.'
  kind: order
  items:
    - Сделать отсортированную копию списка ответов, не меняя исходный список
    - Открыть первый кластер первым элементом отсортированной копии
    - Для каждого следующего ответа посчитать расстояние до предыдущего ответа
    - Если расстояние не превышает допуск — добавить ответ в текущий кластер, иначе начать новый кластер этим ответом
    - Вернуть накопленный список кластеров
  id: 026-opinion-clusters-1
  fingerprint: 690645f7
- concept: ответ ровно на границе допуска входит в текущий кластер, поэтому сравнение нестрогое
  question: Ответ, отстоящий от предыдущего ровно на величину допуска, обязан попасть в тот же кластер. Заполни сравнение.
  explanation: Строгое `<` выбросило бы граничный случай в новый кластер, и результат скакал бы от ошибок округления во float. Нестрогое сравнение фиксирует правило «различие до допуска включительно считается несущественным».
  kind: cloze
  template: |-
    if answer - previous ___ tolerance:
        current.append(answer)
  answer: <=
  accept:
    - <=
    - ≤
  id: 026-opinion-clusters-2
  fingerprint: 06bcd27f
- concept: 'последовательная группировка транзитивна по соседям: цепочка близких шагов объединяет крайние точки, разошедшиеся сильнее допуска'
  question: Ответы 3.0, 3.6 и 4.2 группируют с допуском 0.7, сравнивая каждый ответ с предыдущим. Что получится?
  explanation: Правило сравнивает только соседей, поэтому цепочка мелких шагов склеивает далёкие концы. Это свойство самого алгоритма, а не баг. Если такое склеивание нежелательно, сравнивать нужно с началом кластера или с его центром, а не с предыдущим элементом.
  kind: choice
  options:
    - Три отдельных кластера, потому что 4.2 − 3.0 = 1.2 больше допуска
    - 'Два кластера: {3.0, 3.6} и {4.2}'
    - 'Один кластер из всех трёх: каждый шаг равен 0.6 и укладывается в допуск, хотя крайние значения расходятся на 1.2'
    - 'Ошибка: набор нельзя сгруппировать при таком допуске'
  correct: 2
  id: 026-opinion-clusters-3
  fingerprint: 2640eea8
