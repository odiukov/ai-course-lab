- concept: порядок шагов алгоритма multi-agent debate
  question: Расставь шаги алгоритма дебатов нескольких агентов (Du et al.) в правильном порядке.
  explanation: 'Дебаты = независимый первый заход, затем циклы «прочитал соседей — обновился», в конце голосование. Ключ в том, что чужие ответы приходят из ПРЕДЫДУЩЕГО раунда: агенты обновляются по общему снимку состояния, а не по цепочке.'
  kind: order
  items:
    - Каждый из N агентов независимо выдаёт первый вариант ответа на вопрос
    - Каждому агенту показывают ответы остальных агентов из предыдущего раунда
    - Агент выдаёт обновлённый ответ с учётом чужих рассуждений
    - Обмен и обновление повторяются до раунда R
    - Итоговый ответ берут как ответ большинства после последнего раунда
  id: 001-obshchestvo-specialistov-1
  fingerprint: 485fc346
- concept: число агентов и число раундов — две ручки, работающие только вместе
  question: 'Ablation: один агент, которому 4 раунда подряд показывают его же прошлые рассуждения. Что даёт такая конфигурация по сравнению с обычным одиночным ответом?'
  explanation: 'В статье раунды в одиночку почти не помогают: агент не получает новой информации, он перечитывает себя. Число агентов в одиночку (голосование за один раунд) помогает, но выходит на плато. Большие прыжки дают обе ручки вместе.'
  kind: choice
  options:
    - 'Прирост почти такой же, как у полных дебатов: раунды — главный источник выигрыша'
    - Прирост почти нулевой — это обычная рефлексия, известная своей слабостью; выигрыш появляется, когда есть и разные агенты, и обмен между ними
    - 'Прирост отрицательный: раунды всегда портят ответ'
    - Прирост зависит только от числа раундов и растёт линейно
  correct: 1
  id: 001-obshchestvo-specialistov-2
  fingerprint: 1c7f24db
- concept: механизм exposure to disagreement — чужая цепочка рассуждений как новая информация в контексте
  question: Объясни своими словами, что именно меняется в контексте агента между раундом r и раундом r+1 в дебатах и почему это влияет на качество ответа.
  explanation: 'Это первый из двух механизмов дебатов. Второй — снижение корреляции ошибок. Заметь цену: контекст каждого вызова растёт, потому что в него вкладывают ответы соседей, поэтому N агентов × R раундов стоят дороже, чем просто N×R обычных вызовов.'
  kind: open
  reference: В раунд r+1 агент входит с контекстом, где лежат чужие цепочки рассуждений с другими выводами. Это внешняя информация, которой у него не было. Столкнувшись с несогласием, агент обязан либо обосновать свою позицию (и тогда его аргументация становится сильнее), либо признать ошибку и поправиться. В любом исходе контекст раунда r+1 богаче контекста раунда r — в отличие от рефлексии, где агент видит только собственные прошлые слова.
  id: 001-obshchestvo-specialistov-3
  fingerprint: f4d71440
