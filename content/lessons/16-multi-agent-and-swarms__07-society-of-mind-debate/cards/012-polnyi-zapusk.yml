- concept: история состояний нужна для диагностики траектории сходимости, а не только итога
  question: Дебаты можно вести, храня только текущие ответы агентов. Что даёт хранение всей истории снимков?
  explanation: Финальные три близких числа не различают «мирную сходимость» и «стадный перескок за один раунд». История делает видимым момент, где отдача от обмена вышла на плато, — это и есть аргумент для выбора числа раундов.
  kind: choice
  options:
    - 'Видно траекторию: сблизились ли агенты постепенно или один раунд резко перетянул всех, и на каком раунде прирост исчез'
    - Позволяет агентам голосовать не только за финальные, но и за прошлые версии ответов
    - Ускоряет раунд, потому что новые ответы берутся из кэша прошлых снимков
    - Гарантирует, что финальный ответ окажется правильным
