- concept: 'в каскаде поток изменений однонаправлен: позиция одного участника неподвижна, остальные смещаются к ней сразу после его реплики, а прежние возражения исчезают без ответа'
  question: У тебя есть история позиций всех агентов по раундам. Опиши своими словами, какую асимметрию в этой истории надо искать, чтобы заподозрить каскад подхалимажа.
  explanation: 'Метрики согласия и разброса измеряют только итоговую конфигурацию ответов и одинаковы в обоих сценариях. Асимметрия видна лишь в траектории: кто первым назвал итоговый ответ, кто двигался, и были ли закрыты старые возражения.'
  kind: open
  reference: 'Искать однонаправленность влияния: один участник ни разу не менял ни ответ, ни формулировку, а все остальные сместились именно к его позиции, причём в раунде сразу после его уверенного высказывания, а не постепенно. Дополнительные признаки: возражения, звучавшие в предыдущих раундах, исчезли, но ответа на них никто не дал; агенты поменяли не только число, но и объяснение, как будто их прежних доводов не существовало; новых независимых подтверждений не появилось. При содержательной сходимости изменения взаимны — влияние идёт в обе стороны, и каждый сдвиг сопровождается снятым возражением.'
  id: 029-sycophancy-cascade-2
