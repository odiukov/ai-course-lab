- concept: метрика фиксирует момент первого достижения порога, а не наибольшее или последнее наблюдавшееся согласие
  question: Зачем в дебатах искать именно первый снимок, где согласие достигло порога, а не максимальное согласие по всей истории?
  explanation: 'Это разные величины: «когда группа впервые сошлась» отвечает на вопрос о цене сходимости, «где согласие было максимальным» — нет. Если вернуть поздний индекс, лишние раунды получат заслугу раннего обмена, и вывод о нужном числе раундов будет завышен.'
  kind: choice
  options:
    - Первое достижение измеряет скорость сходимости — сколько обменов понадобилось; максимум измеряет другое и приписывает заслугу поздним раундам
    - Максимум по истории всегда равен согласию на последнем снимке
    - Максимальное согласие невозможно вычислить, не зная эталонного ответа
    - Поиск максимума требует полного прохода, а первое достижение — нет
