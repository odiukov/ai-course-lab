- concept: достижение порога на исходном снимке — диагностический сигнал, что обмен мнениями ничего не добавил
  question: Функция вернула индекс самого первого снимка истории — того, что записан до какого-либо обмена мнениями. Как это читать?
  explanation: Начальный снимок хранит стартовые позиции агентов до обновлений. Достижение порога на нём означает, что группа была единой с самого начала, — на таких задачах дебаты только тратят вызовы, и это повод отправлять их в дешёвый одноагентный путь.
  kind: choice
  options:
    - 'Агенты сошлись ещё до дебатов: обмен мнениями не понадобился, и на этой задаче он не даёт вклада'
    - Дебаты сошлись быстрее всего именно благодаря первому обмену
    - Порог был выставлен слишком высоко и его пришлось достигать в один шаг
    - 'Функция ошиблась: индексация должна начинаться после первого раунда'
