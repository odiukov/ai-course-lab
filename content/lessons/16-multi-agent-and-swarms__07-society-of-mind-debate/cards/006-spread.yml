- concept: реализация spread через встроенные max и min
  question: Дополни функцию, возвращающую разброс списка числовых ответов.
  explanation: Разброс — расстояние между крайними значениями, то есть max(values) − min(values). Два прохода по списку встроенными функциями, никакой сортировки не нужно.
  kind: cloze
  template: |-
    def spread(values):
        return ___ - min(values)
  answer: max(values)
  accept:
    - max(values)
  id: 006-spread-1
  fingerprint: 101e8043
- concept: поведение spread на списке из одного ответа
  question: Что вернёт корректная `spread`, если в списке всего один ответ?
  explanation: 'Для одного элемента max и min — это он же, разность обращается в нуль. Отдельная ветка в коде не нужна: формула max − min покрывает случай сама.'
  kind: choice
  options:
    - 'Нуль: максимум и минимум совпадают, расстояние между ними отсутствует'
    - Сам этот ответ, потому что сравнивать не с чем
    - 'Ошибку: разброс определён только для двух и более значений'
    - Бесконечность
  correct: 0
  id: 006-spread-2
  fingerprint: 6bbab9ea
- concept: пустой список — вырожденный вход, требующий явной обработки
  question: Почему пустой список ответов в `spread` требует отдельной ветки в коде?
  explanation: '`max([])` падает с `ValueError: max() arg is an empty sequence`. Что возвращать вместо этого — нуль или исключение — решает контракт функции, поэтому поведение сверяют с заготовкой и проверками в code/main.py.'
  kind: choice
  options:
    - Потому что деление на длину списка даст ZeroDivisionError
    - Потому что max() и min() на пустой последовательности бросают ValueError — крайних значений просто нет
    - Потому что Python вернёт None и результат будет тихо неверным
    - Потому что пустой список автоматически преобразуется в [0]
  correct: 1
  id: 006-spread-3
  fingerprint: 6877c3fc
