- concept: при независимых ошибках вероятность общего промаха — произведение вероятностей
  question: Три агента ошибаются каждый в 20% случаев, и их ошибки полностью независимы. С какой вероятностью (в процентах) ошибутся все трое сразу?
  explanation: '0.2 × 0.2 × 0.2 = 0.008, то есть 0.8%. Голосование большинства вытянет верный ответ почти всегда. Но три сэмпла ОДНОЙ модели так не работают: их ошибки коррелируют, и «все трое неверны» случается почти в те же 20%. Дебаты покупают независимость, а не количество.'
  kind: numeric
  answer: 0.8
  tolerance: 0.1
  id: 002-plato-self-consistency-1
  fingerprint: dc971983
- concept: голосование большинства гасит случайный шум, но не систематический перекос модели
  question: Модель решает задачу. В каком случае увеличение числа сэмплов в self-consistency реально поднимет точность?
  explanation: 'Усреднение убирает случайный разброс: редкие промахи расходятся по разным вариантам, верный ответ собирает большинство. Систематический перекос присутствует в каждом сэмпле одинаково, поэтому голосование лишь точнее измеряет устойчивое заблуждение модели.'
  kind: choice
  options:
    - Когда модель систематически неверно трактует условие задачи
    - Когда модель иногда случайно сбивается на арифметике, а в среднем понимает задачу верно
    - 'Всегда: чем больше сэмплов, тем ближе к верному ответу'
    - Когда у модели высокая температура сэмплирования — тогда систематическая ошибка исчезает
  correct: 1
  id: 002-plato-self-consistency-2
  fingerprint: 93c6ddcc
- concept: техническая независимость сэмплов не равна независимости их ошибок
  question: Сэмплы в self-consistency называют независимыми, но плато всё равно наступает. Объясни, в каком смысле они независимы, а в каком — нет.
  explanation: Ключевое слово статьи — «i.i.d.». Дебаты делают сэмплы не-i.i.d. намеренно. Разные сиды снимают часть корреляции, разные базовые модели — больше, а обсуждённые разные точки зрения — сильнее всего.
  kind: open
  reference: 'Независимы они процедурно: каждый сэмпл генерируется заново и не видит предыдущих, как новый бросок кубика. Но все они выходят из одной модели — с одними весами, одними знаниями и одними слепыми зонами. Поэтому независимы тексты ответов, а не причины ошибок: ошибки коррелируют. Голосование по коррелированным сэмплам даёт уверенно неверный ответ, отсюда плато. Дебаты снижают корреляцию, потому что агент видит чужую цепочку рассуждений — информацию извне своего распределения.'
  id: 002-plato-self-consistency-3
  fingerprint: 5d2c67a6
