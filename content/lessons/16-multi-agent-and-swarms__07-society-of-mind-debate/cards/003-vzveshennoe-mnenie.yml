- concept: средневзвешенное как сумма произведений «значение × вес»
  question: Три агента дали ответы 4, 9 и 22 с уверенностями 0.6, 0.25 и 0.15 (сумма весов равна единице). Чему равно средневзвешенное мнение?
  explanation: 4×0.6 + 9×0.25 + 22×0.15 = 2.4 + 2.25 + 3.3 = 7.95. Выброс 22 подтягивает результат вверх, но с весом 0.15 не решает за всех — его вклад 3.3 против 2.4 у самого уверенного агента.
  kind: numeric
  answer: 7.95
  tolerance: 0.01
  id: 003-vzveshennoe-mnenie-1
  fingerprint: 46971f06
- concept: уверенность задаёт влияние на консенсус, но не гарантирует правоту
  question: В дебатах один агент назначен с высокой уверенностью, но его ответ неверен. Что произойдёт при обновлении через средневзвешенное?
  explanation: 'Вес — регулятор влияния, а не доказательство правоты. Это тот же провал, что описан в «Should we be going MAD?»: слабая, но уверенно звучащая модель тянет консенсус к своему неверному ответу. Взвешивание не чинит систематическую ошибку.'
  kind: choice
  options:
    - 'Ничего: механизм взвешивания автоматически отсеивает неверные ответы'
    - Его ответ утянет консенсус к себе — вес управляет влиянием, а не истинностью
    - Остальные агенты получат больший вес в качестве компенсации
    - Средневзвешенное станет равно его ответу
  correct: 1
