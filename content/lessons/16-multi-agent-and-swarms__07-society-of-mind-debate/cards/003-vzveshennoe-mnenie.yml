- concept: средневзвешенное совпадает с обычным средним ровно при равных весах
  question: При каком условии средневзвешенное по уверенности даст ровно то же число, что и простое арифметическое среднее ответов?
  explanation: 'Простое среднее — частный случай средневзвешенного с одинаковыми весами: каждому мнению доверяют одинаково. Нормировка суммы весов на единицу к этому отношения не имеет — она нужна лишь для масштаба, а не для равенства влияний.'
  kind: choice
  options:
    - Когда все веса равны между собой
    - Когда сумма весов равна единице
    - Когда самый большой вес приходится на самый большой ответ
    - Когда все ответы положительны
