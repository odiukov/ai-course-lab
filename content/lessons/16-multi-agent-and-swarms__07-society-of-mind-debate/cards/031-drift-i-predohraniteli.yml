- concept: против преждевременного схождения работает участник с обязанностью возражать, а не добавление ещё одного обычного агента в пул
  question: Группа однотипных агентов сходится к общему ответу уже после первого обмена репликами. Объясни своими словами, почему добавление ещё одного такого же агента вряд ли изменит картину, а назначение одному участнику обязанности возражать — может.
  explanation: 'Поэтому в чеклисте выкатки одновременно стоят потолок на число агентов и отдельный adversarial slot: рост количества согласных голосов не заменяет одного обязанного спорить.'
  kind: open
  reference: 'Ещё один агент того же типа с высокой вероятностью придёт к той же позиции и просто добавит голос к уже сложившемуся большинству: он увеличивает поддержку, но не создаёт возражения, которое нужно опровергать. Участник с ролью оппонента обязан искать слабое место даже в популярной позиции, поэтому большинство вынуждено предъявить обоснование, а не принять согласие как готовый результат. Ценность слота — в гарантированном источнике сопротивления, а не в числе участников.'
