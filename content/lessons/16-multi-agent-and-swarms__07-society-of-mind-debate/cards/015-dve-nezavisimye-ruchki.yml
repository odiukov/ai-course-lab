- concept: 'рефлексия одиночного агента почти не даёт прироста: перечитывание собственной цепочки не приносит в контекст новой информации'
  question: Объясни своими словами, почему одиночный агент, много раундов перечитывающий собственные рассуждения, обычно не выходит на заметный прирост качества.
  explanation: 'Известная слабость рефлексии: сам себе рецензент не даёт новых данных, поэтому кривая по раундам у одиночного агента почти плоская.'
  kind: open
  reference: 'Новый раунд помогает только тогда, когда в контекст приходит информация, которой раньше не было. У одиночного агента источник рассуждений тот же самый: та же модель, те же априорные предположения, та же интерпретация условия. Он перечитывает свой же вывод и чаще всего подтверждает исходное допущение, а не оспаривает его — ошибка воспроизводится, потому что проверяющий и проверяемый совпадают. Заметить опечатку или пропущенный арифметический шаг так можно, а вот неверную постановку — почти нет.'
  id: 015-dve-nezavisimye-ruchki-2
