- concept: полное согласие — допустимый критерий остановки цикла дебатов, но не критерий приёмки ответа
  question: Объясни своими словами, почему полное единодушие агентов можно использовать как условие ранней остановки дебатов, но нельзя как условие приёмки ответа в продакшене.
  explanation: 'Разделяй два вопроса: «спор исчерпан?» и «ответ верен?». Первый решается метрикой согласия, второй — только внешней проверкой.'
  kind: open
  reference: 'Единодушие означает, что спорить больше не о чем: чужие ответы совпадают с собственным, поэтому следующий раунд не принесёт новой информации и деньги на вызовы тратить незачем — как условие остановки цикла это корректно. Но та же величина ничего не говорит о соответствии ответа действительности: группа могла сойтись на неверном значении и остановиться раньше. Для приёмки нужен отдельный сигнал качества, независимый от самих агентов: эталон, пересчёт, проверка внешним инструментом.'
