- concept: 'между уровнем согласия и точностью нет монотонной связи: прогон с меньшим согласием может быть точнее'
  question: 'Прогон A: согласие 0.5, ответ большинства верный. Прогон B: все агенты назвали один и тот же неверный ответ. Что отсюда следует про степень согласия как оценку качества?'
  explanation: Прогон с более высоким согласием оказался неверным, с более низким — верным. Значит, функциональной связи «выше согласие — выше точность» нет; это две независимые характеристики, и одна не заменяет другую.
  kind: choice
  options:
    - 'Согласие не упорядочивает прогоны по правильности: более высокое значение не означает более точный ответ'
    - Согласие ниже 0.5 всегда указывает на неверный ответ
    - Полное единодушие правильно лишь при чётном числе агентов
    - Согласие корректно ранжирует прогоны, если агентов не меньше пяти
