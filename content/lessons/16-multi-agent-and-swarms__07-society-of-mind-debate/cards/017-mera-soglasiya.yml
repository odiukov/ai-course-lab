- concept: 'степень согласия — доля агентов, чей ответ совпал с самым частым: A = m/n'
  question: Семь агентов вернули ответы 19, 19, 19, 19, 22, 22, 25. Чему равна степень согласия группы?
  explanation: 'Самый частый ответ 19 назвали 4 агента из 7: A = 4/7 ≈ 0,571. Считается размер крупнейшей группы одинаково ответивших, делённый на общее число агентов.'
  kind: numeric
  answer: 0.571
  tolerance: 0.01
  id: 017-mera-soglasiya-1
  fingerprint: bc075495
- concept: согласие измеряет концентрацию голосов на самом популярном ответе и не чувствует, насколько далеко ушли несогласные
  question: Группа A ответила 40, 40, 40, 40, 41; группа B — 40, 40, 40, 40, 900. Как соотносятся их степени согласия?
  explanation: 'A = 4/5 = 0,8 в обоих случаях. Метрика считает голоса, а не расстояния: величину отрыва несогласного она не видит вовсе — за это отвечают другие меры, вроде разброса.'
  kind: choice
  options:
    - 'Одинаковые: в обеих группах четверо из пяти дали один ответ'
    - У группы A выше, потому что её ответы ближе друг к другу
    - У группы B выше, потому что выброс сильнее выделяет большинство
