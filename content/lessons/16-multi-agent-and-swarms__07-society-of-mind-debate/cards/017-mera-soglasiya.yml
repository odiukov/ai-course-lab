- concept: минимально возможная степень согласия равна 1/n и достигается при попарно различных ответах
  question: Восемь агентов назвали восемь разных чисел. Какова степень согласия группы?
  explanation: 'Крупнейшая группа одинаково ответивших состоит из одного агента: A = 1/8 = 0,125. Ниже 1/n метрика опуститься не может — нулевого согласия у непустой группы не бывает.'
  kind: numeric
  answer: 0.125
  tolerance: 0.001
