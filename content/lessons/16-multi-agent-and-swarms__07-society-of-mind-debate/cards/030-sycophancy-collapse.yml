- concept: 'детектор каскада требует начального расхождения мнений: без него совпадение финальных ответов не свидетельствует, что кто-то за кем-то последовал'
  question: Детектор подхалимского коллапса дополнительно требует, чтобы исходные ответы агентов различались сильнее допуска. Зачем это условие?
  explanation: Каскад — это событие «разные мнения исчезли возле одной позиции». Если разных мнений не было с самого начала, финальное единодушие ничего не говорит о влиянии лидера, и без этой проверки детектор помечал бы как коллапс любой согласованный прогон.
  kind: choice
  options:
    - Чтобы избежать деления на ноль при вычислении разброса
    - 'Потому что при изначально совпавших ответах коллапса не было: никто не отказывался от своей позиции, и падать было некуда'
    - Потому что агенты с одинаковыми исходными ответами не могут иметь разную уверенность
    - Чтобы гарантировать, что уверенность лидера максимальна
  correct: 1
  id: 030-sycophancy-collapse-1
  fingerprint: 0b5255e2
- concept: якорем каскада служит исходный ответ самого уверенного агента, а не итоговый консенсус группы
  question: Исходные ответы 12, 40 и 55, уверенности 0.4, 0.9 и 0.5. В финале все трое отвечают около 47 при допуске 2. Что вернёт детектор подхалимского коллапса и почему?
  explanation: 'Высокая согласованность финальных ответов сама по себе не различает сценарии — она лишь говорит, что ответы совпали. Каскад распознаётся по совпадению точки схождения с прежней позицией самого уверенного участника: здесь 47 отстоит от 40 на 7, что больше допуска 2, значит признак каскада не выполнен.'
  kind: choice
  options:
    - 'True: разброс исчез, значит группа схлопнулась к одному голосу'
    - 'True: самый уверенный агент участвовал в сходимости'
    - 'False: группа сошлась к новому значению 47, а не к исходной позиции лидера 40, — это похоже на взаимное сближение, а не на следование за самым уверенным'
    - 'False: детектор требует, чтобы уверенность лидера была равна 1.0'
  correct: 2
  id: 030-sycophancy-collapse-2
  fingerprint: 71398de7
- concept: лидера каскада ищут по позиции максимума в списке уверенностей и берут его ИСХОДНЫЙ ответ
  question: 'Заполни пропуск: нужно достать исходный ответ агента с наибольшей уверенностью.'
  explanation: 'Позиция максимума в списке уверенностей — индекс лидера, и по этому же индексу берётся его ответ из списка ИСХОДНЫХ ответов. Если взять финальный ответ лидера, проверка выродится: к концу дебатов лидер и так внутри общего сгустка, и функция начнёт возвращать True для любой сходимости.'
