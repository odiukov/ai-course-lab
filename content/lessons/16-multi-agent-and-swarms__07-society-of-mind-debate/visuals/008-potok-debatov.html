<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три агента проходят три раунда дебатов</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5f6b7d;
    --grid: #d8deea;
    --soft: #eef2f8;
    --a: #2774d8;
    --a-fill: #eaf3ff;
    --b: #8b52c7;
    --b-fill: #f4ecff;
    --c: #16836f;
    --c-fill: #e7f8f3;
    --vote: #b85b08;
    --vote-fill: #fff1df;
    --flow: #8793a5;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--grid);
    overflow: hidden;
  }

  h1 {
    margin: 0;
    padding: 14px 18px 10px;
    border-bottom: 1px solid var(--grid);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--panel);
  }

  .separator {
    stroke: var(--grid);
    stroke-width: 1px;
    stroke-dasharray: 3 6;
  }

  .flow {
    fill: none;
    stroke: var(--flow);
    stroke-width: 1.5px;
  }

  .flow-a { stroke: var(--a); }
  .flow-b { stroke: var(--b); }
  .flow-c { stroke: var(--c); }

  .arrow-a { fill: var(--a); }
  .arrow-b { fill: var(--b); }
  .arrow-c { fill: var(--c); }
  .arrow-neutral { fill: var(--flow); }

  .card {
    stroke-width: 2px;
  }

  .card-a {
    fill: var(--a-fill);
    stroke: var(--a);
  }

  .card-b {
    fill: var(--b-fill);
    stroke: var(--b);
  }

  .card-c {
    fill: var(--c-fill);
    stroke: var(--c);
  }

  .agent-disc {
    stroke-width: 2px;
  }

  .disc-a {
    fill: var(--a-fill);
    stroke: var(--a);
  }

  .disc-b {
    fill: var(--b-fill);
    stroke: var(--b);
  }

  .disc-c {
    fill: var(--c-fill);
    stroke: var(--c);
  }

  .vote-box {
    fill: var(--vote-fill);
    stroke: var(--vote);
    stroke-width: 2px;
  }

  .header {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .subheader {
    fill: var(--muted);
    font-size: 13px;
  }

  .agent-letter {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .agent-name {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .agent-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .card-title {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .card-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .vote-title {
    fill: var(--vote);
    font-size: 14px;
    font-weight: bold;
  }

  .vote-note {
    fill: var(--ink);
    font-size: 13px;
  }

  .summary {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .context {
    fill: var(--muted);
    font-size: 13px;
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --panel: #171c27;
      --ink: #edf2fa;
      --muted: #aeb9ca;
      --grid: #354052;
      --soft: #222a38;
      --a: #72adff;
      --a-fill: #192d49;
      --b: #c493ff;
      --b-fill: #302247;
      --c: #62d3ba;
      --c-fill: #173b35;
      --vote: #ffad5c;
      --vote-fill: #44301d;
      --flow: #758399;
    }
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Три агента проходят три раунда дебатов</h1>
  <svg id="diagram" viewBox="0 0 1080 440" width="1080" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">Три строки агентов и три столбца раундов образуют девять вызовов. Во втором и третьем раундах каждый агент получает ответы двух остальных, после чего проводится финальное голосование.</desc>
  </svg>
</figure>

<script>
const DATA = [{
  canvas: { width: 1080, height: 440 },
  card: { width: 180, height: 70, halfWidth: 90, halfHeight: 35, radius: 12 },
  columns: [
    {
      x: 215,
      titleY: 35,
      noteY: 56,
      title: "РАУНД 1",
      note: "3 независимых ответа",
      cardTitle: "Свой ответ",
      cardNote: "не видит ответы соседей"
    },
    {
      x: 500,
      titleY: 35,
      noteY: 56,
      title: "РАУНД 2",
      note: "обмен ответами",
      cardTitle: "Обновлённый ответ",
      cardNote: "читает 2 чужих ответа"
    },
    {
      x: 785,
      titleY: 35,
      noteY: 56,
      title: "РАУНД 3",
      note: "обмен последними версиями",
      cardTitle: "Новая версия",
      cardNote: "критика тоже проверена"
    }
  ],
  agents: [
    { y: 125, letter: "А", name: "Агент А", note: "отдельная роль", tone: "a" },
    { y: 225, letter: "Б", name: "Агент Б", note: "отдельная роль", tone: "b" },
    { y: 325, letter: "В", name: "Агент В", note: "отдельная роль", tone: "c" }
  ],
  agentLabel: { discX: 38, textX: 64, titleOffset: -5, noteOffset: 16, radius: 17 },
  separators: { xs: [357, 642, 902], top: 76, bottom: 365 },
  flow: { port: 14, control: 58 },
  arrow: { length: 10, half: 5 },
  vote: {
    x: 1000,
    y: 225,
    width: 126,
    height: 118,
    halfWidth: 63,
    halfHeight: 59,
    radius: 14,
    headerY: 35,
    noteY: 56,
    header: "ФИНАЛ",
    note: "после 9 вызовов",
    ports: [195, 225, 255],
    lines: ["Финальное", "голосование", "ответ большинства"],
    lineOffsets: [-18, 5, 29]
  },
  text: { cardTitleOffset: -6, cardNoteOffset: 18 },
  summary: {
    y: 405,
    equationX: 215,
    equation: "3 агента × 3 раунда = 9 вызовов модели",
    arrowStart: 410,
    arrowEnd: 875,
    arrowY: 407,
    labelX: 642,
    labelY: 390,
    label: "контекст растёт: вопрос → 2 чужих ответа → последние версии"
  },
  fallback: {
    x: 540,
    y: 205,
    lines: [
      "Схема: 3 агента × 3 раунда = 9 вызовов.",
      "После двух обменов последними ответами проходит финальное голосование."
    ],
    gap: 28
  }
}];

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const [diagram] = DATA;
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";

  const make = (tag, attributes, className) => {
    const node = document.createElementNS(ns, tag);
    Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));
    if (className) node.setAttribute("class", className);
    return node;
  };

  const addText = (parent, x, y, value, className, anchor) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor,
      "dominant-baseline": "middle"
    }, className);
    node.textContent = value;
    parent.appendChild(node);
    return node;
  };

  const addArrowHead = (parent, x, y, tone) => {
    const points = [
      [sx(x), sy(y)],
      [sx(x - diagram.arrow.length), sy(y - diagram.arrow.half)],
      [sx(x - diagram.arrow.length), sy(y + diagram.arrow.half)]
    ].map(point => point.join(",")).join(" ");
    parent.appendChild(make("polygon", { points }, "arrow-" + tone));
  };

  const background = make("g", {}, "background-layer");
  const flows = make("g", {}, "flow-layer");
  const cards = make("g", {}, "card-layer");
  const labels = make("g", {}, "label-layer");
  svg.append(background, flows, cards, labels);

  diagram.separators.xs.forEach(x => {
    background.appendChild(make("line", {
      x1: sx(x),
      y1: sy(diagram.separators.top),
      x2: sx(x),
      y2: sy(diagram.separators.bottom)
    }, "separator"));
  });

  diagram.columns.forEach(column => {
    addText(labels, column.x, column.titleY, column.title, "header", "middle");
    addText(labels, column.x, column.noteY, column.note, "subheader", "middle");
  });

  addText(labels, diagram.vote.x, diagram.vote.headerY, diagram.vote.header, "header", "middle");
  addText(labels, diagram.vote.x, diagram.vote.noteY, diagram.vote.note, "subheader", "middle");

  diagram.agents.forEach(agent => {
    labels.appendChild(make("circle", {
      cx: sx(diagram.agentLabel.discX),
      cy: sy(agent.y),
      r: sx(diagram.agentLabel.radius) - sx(0)
    }, "agent-disc disc-" + agent.tone));

    addText(
      labels,
      diagram.agentLabel.discX,
      agent.y,
      agent.letter,
      "agent-letter",
      "middle"
    );

    addText(
      labels,
      diagram.agentLabel.textX,
      agent.y + diagram.agentLabel.titleOffset,
      agent.name,
      "agent-name",
      "start"
    );

    addText(
      labels,
      diagram.agentLabel.textX,
      agent.y + diagram.agentLabel.noteOffset,
      agent.note,
      "agent-note",
      "start"
    );
  });

  diagram.columns.slice(0, -1).forEach((column, columnIndex) => {
    const nextColumn = diagram.columns[columnIndex + scale.x];

    diagram.agents.forEach(source => {
      diagram.agents.forEach(target => {
        if (source === target) return;

        const direction = target.y > source.y ? diagram.flow.port : -diagram.flow.port;
        const startX = column.x + diagram.card.halfWidth;
        const startY = source.y + direction;
        const endX = nextColumn.x - diagram.card.halfWidth;
        const endY = target.y - direction;
        const controlStartX = startX + diagram.flow.control;
        const controlEndX = endX - diagram.flow.control;

        flows.appendChild(make("path", {
          d: [
            "M", sx(startX), sy(startY),
            "C", sx(controlStartX), sy(startY),
            sx(controlEndX), sy(endY),
            sx(endX), sy(endY)
          ].join(" ")
        }, "flow flow-" + source.tone));

        addArrowHead(flows, endX, endY, source.tone);
      });
    });
  });

  diagram.columns.forEach(column => {
    diagram.agents.forEach(agent => {
      cards.appendChild(make("rect", {
        x: sx(column.x - diagram.card.halfWidth),
        y: sy(agent.y - diagram.card.halfHeight),
        width: sx(diagram.card.width) - sx(0),
        height: sy(diagram.card.height) - sy(0),
        rx: sx(diagram.card.radius) - sx(0),
        ry: sy(diagram.card.radius) - sy(0)
      }, "card card-" + agent.tone));

      addText(
        labels,
        column.x,
        agent.y + diagram.text.cardTitleOffset,
        column.cardTitle,
        "card-title",
        "middle"
      );

      addText(
        labels,
        column.x,
        agent.y + diagram.text.cardNoteOffset,
        column.cardNote,
        "card-note",
        "middle"
      );
    });
  });

  const voteLeft = diagram.vote.x - diagram.vote.halfWidth;
  diagram.agents.forEach((agent, agentIndex) => {
    const finalColumn = diagram.columns.at(-scale.x);
    const startX = finalColumn.x + diagram.card.halfWidth;
    const startY = agent.y;
    const endY = diagram.vote.ports[agentIndex];
    const controlStartX = startX + diagram.flow.control;
    const controlEndX = voteLeft - diagram.flow.control;

    flows.appendChild(make("path", {
      d: [
        "M", sx(startX), sy(startY),
        "C", sx(controlStartX), sy(startY),
        sx(controlEndX), sy(endY),
        sx(voteLeft), sy(endY)
      ].join(" ")
    }, "flow flow-" + agent.tone));

    addArrowHead(flows, voteLeft, endY, agent.tone);
  });

  cards.appendChild(make("rect", {
    x: sx(diagram.vote.x - diagram.vote.halfWidth),
    y: sy(diagram.vote.y - diagram.vote.halfHeight),
    width: sx(diagram.vote.width) - sx(0),
    height: sy(diagram.vote.height) - sy(0),
    rx: sx(diagram.vote.radius) - sx(0),
    ry: sy(diagram.vote.radius) - sy(0)
  }, "vote-box"));

  diagram.vote.lines.forEach((line, lineIndex) => {
    addText(
      labels,
      diagram.vote.x,
      diagram.vote.y + diagram.vote.lineOffsets[lineIndex],
      line,
      lineIndex === diagram.vote.lines.length - scale.x ? "vote-note" : "vote-title",
      "middle"
    );
  });

  addText(
    labels,
    diagram.summary.equationX,
    diagram.summary.y,
    diagram.summary.equation,
    "summary",
    "middle"
  );

  flows.appendChild(make("line", {
    x1: sx(diagram.summary.arrowStart),
    y1: sy(diagram.summary.arrowY),
    x2: sx(diagram.summary.arrowEnd),
    y2: sy(diagram.summary.arrowY)
  }, "flow"));

  addArrowHead(
    flows,
    diagram.summary.arrowEnd,
    diagram.summary.arrowY,
    "neutral"
  );

  addText(
    labels,
    diagram.summary.labelX,
    diagram.summary.labelY,
    diagram.summary.label,
    "context",
    "middle"
  );
} catch (error) {
  const [diagram] = DATA;
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  svg.replaceChildren();

  diagram.fallback.lines.forEach((line, lineIndex) => {
    const node = document.createElementNS(ns, "text");
    node.setAttribute("x", sx(diagram.fallback.x));
    node.setAttribute("y", sy(diagram.fallback.y + lineIndex * diagram.fallback.gap));
    node.setAttribute("text-anchor", "middle");
    node.setAttribute("dominant-baseline", "middle");
    node.setAttribute("class", "fallback");
    node.textContent = line;
    svg.appendChild(node);
  });
}
</script>
</body>
</html>
