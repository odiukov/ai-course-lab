<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Почему стоимость растёт быстрее числа раундов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --band: #f0f4fa;
      --band-alt: #e9eff8;
      --text: #172033;
      --muted: #5c687c;
      --line: #9aa8bc;
      --arrow: #65758d;
      --early: #b8d9ff;
      --early-stroke: #5d8fc5;
      --second: #94c7ff;
      --second-stroke: #347dbd;
      --middle: #78b2f1;
      --middle-stroke: #236cae;
      --fourth: #f1b66d;
      --fourth-stroke: #b66b18;
      --late: #ee8f63;
      --late-stroke: #ad4e2a;
      --accent-box: #fff0d8;
      --accent-line: #d47a21;
      --accent-text: #713b0d;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101521;
        --surface: #171e2c;
        --band: #1d2737;
        --band-alt: #222e40;
        --text: #edf3ff;
        --muted: #b4c0d2;
        --line: #617087;
        --arrow: #9baac0;
        --early: #254c72;
        --early-stroke: #77afe2;
        --second: #285e8b;
        --second-stroke: #8ac5f5;
        --middle: #3272a5;
        --middle-stroke: #a2d2f7;
        --fourth: #87551f;
        --fourth-stroke: #efb56d;
        --late: #8f422c;
        --late-stroke: #f2a07c;
        --accent-box: #422d18;
        --accent-line: #e49a4d;
        --accent-text: #ffe1b9;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    main {
      background: var(--surface);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h1 {
      color: var(--text);
      font-size: 22px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--surface);
      font-family: inherit;
    }

    .band {
      fill: var(--band);
    }

    .band-alt {
      fill: var(--band-alt);
    }

    .separator,
    .arrow {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .arrow {
      stroke: var(--arrow);
      stroke-width: 2;
    }

    .arrow-head {
      fill: var(--arrow);
    }

    .call {
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .stage-early {
      fill: var(--early);
      stroke: var(--early-stroke);
    }

    .stage-second {
      fill: var(--second);
      stroke: var(--second-stroke);
    }

    .stage-middle {
      fill: var(--middle);
      stroke: var(--middle-stroke);
    }

    .stage-fourth {
      fill: var(--fourth);
      stroke: var(--fourth-stroke);
    }

    .stage-late {
      fill: var(--late);
      stroke: var(--late-stroke);
    }

    .accent {
      fill: var(--accent-box);
      stroke: var(--accent-line);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--text);
    }

    .legend {
      fill: var(--muted);
      font-size: 16px;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
    }

    .section-value {
      fill: var(--muted);
      font-size: 18px;
    }

    .flow-label,
    .round-label {
      fill: var(--muted);
      font-size: 15px;
    }

    .result {
      fill: var(--accent-text);
      font-size: 17px;
      font-weight: bold;
    }

    .fallback {
      color: var(--text);
      background: var(--surface);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Почему стоимость растёт быстрее числа раундов</h1>

    <svg id="diagram"
         viewBox="0 0 1200 450"
         width="1200"
         height="450"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        Сравнение одного CoT-вызова, девяти вызовов для трёх агентов
        в трёх раундах и двадцати пяти вызовов для пяти агентов
        в пяти раундах. Полоски поздних вызовов шире, потому что модель
        каждый раз читает более длинную историю.
      </desc>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Схема должна была показать: один CoT — это один вызов, дебаты
      3 × 3 требуют 9 вызовов, а дебаты 5 × 5 — 25 вызовов.
      При этом поздние вызовы читают всё более длинный контекст,
      поэтому общая стоимость может превысить 10× стоимости одного CoT.
    </div>
  </main>

  <script>
    const data = {
      canvas: { x1: -36, y1: -18, x2: 1164, y2: 432 },
      metrics: { callHeight: 18, compactHeight: 14 },
      bands: [
        { x1: -12, y1: 36, x2: 1128, y2: 100, kind: "band" },
        { x1: -12, y1: 108, x2: 1128, y2: 232, kind: "band-alt" },
        { x1: -12, y1: 240, x2: 1128, y2: 388, kind: "band" }
      ],
      separators: [
        { x1: 235, y1: 44, x2: 235, y2: 92 },
        { x1: 235, y1: 116, x2: 235, y2: 224 },
        { x1: 235, y1: 248, x2: 235, y2: 380 }
      ],
      labels: [
        {
          x: 0, y: 11,
          text: "Каждая полоска — вызов · её ширина — объём читаемого контекста",
          anchor: "start", kind: "legend"
        },
        {
          x: 0, y: 64, text: "Один CoT-вызов",
          anchor: "start", kind: "section-title"
        },
        {
          x: 0, y: 85, text: "один ответ",
          anchor: "start", kind: "section-value"
        },
        {
          x: 0, y: 148, text: "3 агента × 3 раунда",
          anchor: "start", kind: "section-title"
        },
        {
          x: 0, y: 170, text: "= 9 вызовов",
          anchor: "start", kind: "section-value"
        },
        {
          x: 270, y: 119, text: "контекст накапливается",
          anchor: "start", kind: "flow-label"
        },
        {
          x: 290, y: 219, text: "первый раунд",
          anchor: "middle", kind: "round-label"
        },
        {
          x: 525, y: 219, text: "второй раунд",
          anchor: "middle", kind: "round-label"
        },
        {
          x: 790, y: 219, text: "третий раунд",
          anchor: "middle", kind: "round-label"
        },
        {
          x: 0, y: 302, text: "5 агентов × 5 раундов",
          anchor: "start", kind: "section-title"
        },
        {
          x: 0, y: 324, text: "= 25 вызовов",
          anchor: "start", kind: "section-value"
        },
        {
          x: 270, y: 251, text: "полная история передаётся снова",
          anchor: "start", kind: "flow-label"
        },
        {
          x: 280, y: 381, text: "первый раунд",
          anchor: "middle", kind: "round-label"
        },
        {
          x: 950, y: 381, text: "пятый раунд",
          anchor: "middle", kind: "round-label"
        },
        {
          x: 564, y: 416,
          text: "25 вызовов × всё более длинный вход → стоимость может превысить 10× одного CoT",
          anchor: "middle", kind: "result"
        }
      ],
      arrows: [
        {
          x1: 260, y1: 124, x2: 1080, y2: 124,
          head: [[1080, 124], [1062, 116], [1062, 132]]
        },
        {
          x1: 260, y1: 256, x2: 1080, y2: 256,
          head: [[1080, 256], [1062, 248], [1062, 264]]
        }
      ],
      groups: [
        {
          x1: 280, x2: 400, rows: [55],
          height: 28, stage: "stage-early"
        },
        {
          x1: 260, x2: 320, rows: [134, 158, 182],
          height: 18, stage: "stage-early"
        },
        {
          x1: 475, x2: 575, rows: [134, 158, 182],
          height: 18, stage: "stage-middle"
        },
        {
          x1: 715, x2: 865, rows: [134, 158, 182],
          height: 18, stage: "stage-late"
        },
        {
          x1: 260, x2: 300, rows: [266, 286, 306, 326, 346],
          height: 14, stage: "stage-early"
        },
        {
          x1: 400, x2: 456, rows: [266, 286, 306, 326, 346],
          height: 14, stage: "stage-second"
        },
        {
          x1: 550, x2: 622, rows: [266, 286, 306, 326, 346],
          height: 14, stage: "stage-middle"
        },
        {
          x1: 710, x2: 798, rows: [266, 286, 306, 326, 346],
          height: 14, stage: "stage-fourth"
        },
        {
          x1: 890, x2: 1010, rows: [266, 286, 306, 326, 346],
          height: 14, stage: "stage-late"
        }
      ],
      resultBox: { x1: -12, y1: 394, x2: 1128, y2: 430 },
      namespace: "http://www.w3.org/2000/svg"
    };

    const origin = { x: 36, y: 18 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const element = (name, attributes, className) => {
        const node = document.createElementNS(data.namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, value);
        });
        if (className) node.setAttribute("class", className);
        return node;
      };

      const rectangle = (x1, y1, x2, y2, className) => element("rect", {
        x: sx(x1),
        y: sy(y1),
        width: sx(x2) - sx(x1),
        height: sy(y2) - sy(y1)
      }, className);

      const segment = item => element("line", {
        x1: sx(item.x1),
        y1: sy(item.y1),
        x2: sx(item.x2),
        y2: sy(item.y2)
      }, item.kind || "separator");

      const textNode = item => {
        const node = element("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor
        }, item.kind);
        node.textContent = item.text;
        return node;
      };

      svg.prepend(rectangle(
        data.canvas.x1,
        data.canvas.y1,
        data.canvas.x2,
        data.canvas.y2,
        "surface"
      ));

      data.bands.forEach(item => {
        svg.appendChild(rectangle(
          item.x1, item.y1, item.x2, item.y2, item.kind
        ));
      });

      data.separators.forEach(item => {
        svg.appendChild(segment(item));
      });

      data.arrows.forEach(item => {
        svg.appendChild(segment({
          x1: item.x1,
          y1: item.y1,
          x2: item.x2,
          y2: item.y2,
          kind: "arrow"
        }));

        const points = item.head
          .map(point => `${sx(point[0])},${sy(point[1])}`)
          .join(" ");

        svg.appendChild(element("polygon", { points }, "arrow-head"));
      });

      data.groups.forEach(group => {
        group.rows.forEach(row => {
          svg.appendChild(rectangle(
            group.x1,
            row,
            group.x2,
            row + group.height,
            `call ${group.stage}`
          ));
        });
      });

      svg.appendChild(rectangle(
        data.resultBox.x1,
        data.resultBox.y1,
        data.resultBox.x2,
        data.resultBox.y2,
        "accent"
      ));

      data.labels.forEach(item => {
        svg.appendChild(textNode(item));
      });

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
