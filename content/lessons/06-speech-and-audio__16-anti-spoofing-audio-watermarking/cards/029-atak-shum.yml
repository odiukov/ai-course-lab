- concept: SNR задаёт силу шумовой атаки относительно мощности аудиосигнала
  question: Почему для сравнения устойчивости водяного знака нельзя добавлять ко всем аудиозаписям шум одной и той же абсолютной амплитуды?
  explanation: SNR сравнивает мощности сигнала и шума. Одна абсолютная амплитуда шума почти не повлияет на громкую запись, но может сильно испортить тихую, поэтому силу атаки нормируют относительно мощности конкретного сигнала.
  kind: choice
  options:
    - Такой шум всегда создаёт одинаковый SNR, поэтому испытание получается слишком лёгким
    - Абсолютную амплитуду шума можно использовать только для записей одинаковой длительности
    - При разной мощности записей один и тот же шум создаёт разный SNR и разную силу атаки
    - Добавление шума одной амплитуды изменяет частоту дискретизации записи
  correct: 2
  id: 029-atak-shum-1
  fingerprint: 06ef2ad5
- concept: амплитуда шума масштабируется через квадратный корень из требуемого отношения мощностей
  question: Пусть R — требуемое линейное отношение мощности сигнала к мощности шума, P_signal — мощность сигнала, а P_noise — мощность исходного шума. Заполни коэффициент масштабирования шума.
  explanation: После умножения отсчётов на коэффициент мощность шума изменяется пропорционально квадрату этого коэффициента. Поэтому из требуемого отношения мощностей извлекают квадратный корень.
  kind: cloze
  template: n_scaled = n · ___
  answer: sqrt(P_signal / (R * P_noise))
  accept:
    - sqrt(P_signal/(R*P_noise))
    - (P_signal/(R*P_noise))**0.5
    - √(P_signal/(R·P_noise))
  id: 029-atak-shum-2
  fingerprint: a256aaea
- concept: кривая BRA от SNR показывает границу устойчивости водяного знака к шуму
  question: Как по результатам шумовой атаки определить SNR, после которого водяной знак уже нельзя считать надёжным?
  explanation: Восстановление знака на чистом файле не характеризует его устойчивость. Серия испытаний с контролируемым SNR показывает, успевает ли знак разрушиться при искажениях, которые ещё сохраняют полезность аудио для атакующего.
  kind: open
  reference: Нужно измерить Bit Recovery Accuracy при нескольких уровнях SNR, построить зависимость BRA от SNR и найти область, где BRA опускается ниже заранее выбранного критерия надёжного восстановления. Эту границу следует сопоставить с качеством и разборчивостью аудио.
  id: 029-atak-shum-3
  fingerprint: 5230dd89
