- concept: небольшую нагрузку водяного знака целесообразно использовать как идентификатор записи во внешнем журнале
  question: Сервис встраивает в аудио 12-битную нагрузку и хочет связать запись с моделью, пользователем, запросом и временем генерации. Как лучше организовать хранение этих данных?
  explanation: Нагрузка на 12 бит различает лишь 2¹² = 4096 значений, поэтому она подходит для компактного ключа, но не для подробного описания записи. Метаданные хранят во внешнем журнале, а извлечённый из аудио идентификатор указывает на нужную запись.
  kind: choice
  options:
    - Записывать в водяной знак компактный идентификатор, по которому все данные находятся во внешнем журнале
    - Пытаться поместить в водяной знак полный текст запроса и все метаданные
    - Хранить во внешнем журнале только сам идентификатор без связи с данными записи
    - Отказаться от журнала и восстанавливать метаданные по спектру аудио
