- concept: центрированная биполярная chip-последовательность не создаёт постоянного смещения в корреляции
  question: Почему для корреляционного аудиоводяного знака предпочтительна псевдослучайная chip-последовательность с примерно равным количеством положительных и отрицательных значений?
  explanation: Центрирование около нуля подавляет постоянную составляющую и ложную корреляцию. Это повышает различимость своей опорной последовательности на фоне чужих последовательностей и аудиосигнала.
  kind: open
  reference: У такой последовательности среднее близко к нулю, поэтому несогласованные компоненты взаимно компенсируются и не создают систематического смещения. Согласованный с опорной последовательностью сигнал, напротив, накапливается в корреляции.
