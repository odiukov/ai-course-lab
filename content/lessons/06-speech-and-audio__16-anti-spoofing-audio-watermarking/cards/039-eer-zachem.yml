- concept: инициализация поиска через None гарантирует фиксацию первого рассчитанного кандидата
  question: В переборе порогов результат обновляется только при уменьшении расхождения между FAR и FRR. Почему best_gap безопаснее сначала присвоить None, а не заранее выбранную числовую верхнюю границу?
  explanation: Числовая заглушка может оказаться равной минимально достижимому расхождению. При строгом сравнении обновления тогда не произойдёт, а заранее заданный EER будет ошибочно выдан за результат. Проверка best_gap is None заставляет обработать первый порог.
  kind: open
  reference: None позволяет отдельно распознать первую итерацию и обязательно сохранить первый рассчитанный результат. Если числовая заглушка совпадёт с расхождением на всех порогах, строгое сравнение не выполнится ни разу и функция может вернуть оставшееся значение по умолчанию как будто оно было вычислено.
