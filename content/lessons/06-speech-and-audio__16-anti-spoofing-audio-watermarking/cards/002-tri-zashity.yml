- concept: детекция и водяные знаки дополняют друг друга при разных моделях поведения источника аудио
  question: Объясните своими словами, почему водяной знак в сгенерированном аудио не устраняет потребность в anti-spoofing-детекторе.
  explanation: Водяной знак подходит для маркировки аудио, выпускаемого контролируемой системой. Детекция нужна для аудио из неконтролируемых источников, где нельзя рассчитывать на наличие корректной метки.
  kind: open
  reference: Водяной знак появляется только тогда, когда генератор намеренно встраивает его в своё аудио. Сторонний или злоумышленный генератор может не добавлять такую метку либо попытаться удалить её. Anti-spoofing-детектор анализирует поступивший сигнал независимо от сотрудничества его создателя, поэтому нужен для проверки чужих и потенциально враждебных записей.
  id: 002-tri-zashity-2
  fingerprint: afc10c44
