- concept: небольшое превышение случайной BRA на короткой нагрузке может возникнуть без сохранившегося водяного знака
  question: При единственной проверке случайный декодер угадал 15 из 24 битов. Как корректнее интерпретировать этот результат?
  explanation: Для независимых случайных битов вероятность угадать не менее 15 из 24 составляет примерно 15.4%. Такой результат вполне может возникнуть случайно, поэтому одного превышения половины недостаточно для вывода о сохранности знака.
  kind: choice
  options:
