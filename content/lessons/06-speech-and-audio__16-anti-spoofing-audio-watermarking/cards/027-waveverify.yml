- concept: архитектура WaveVerify сочетает FiLM-генератор и детектор Mixture-of-Experts
  question: Как правильно распределены архитектурные роли в WaveVerify?
  explanation: В WaveVerify FiLM применяется в генераторе водяного знака, а детектор использует Mixture-of-Experts. Такое сочетание ориентировано в том числе на устойчивую проверку после временного монтажа.
  kind: choice
  options:
    - Генератор использует FiLM, а детектор построен как смесь экспертов
    - Детектор использует FiLM, а генератор построен как смесь экспертов
    - И генератор, и детектор состоят только из одного свёрточного классификатора
    - Генератор шифрует метаданные, а детектор проверяет цифровую подпись
  correct: 0
