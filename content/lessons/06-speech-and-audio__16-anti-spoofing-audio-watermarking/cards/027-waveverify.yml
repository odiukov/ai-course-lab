- concept: временные преобразования нарушают признаки водяного знака, зависящие от позиции и масштаба времени
  question: Объясни своими словами, почему детектор с жёсткой покадровой привязкой может потерять водяной знак после реверса или изменения скорости, даже если помеченный сигнал не был удалён.
  explanation: 'Наличие внедрённого сигнала ещё не гарантирует его обнаружение: детектор должен быть устойчив к преобразованиям его временного порядка и масштаба.'
  kind: open
  reference: Реверс меняет временной порядок структуры знака, а изменение скорости растягивает или сжимает её и переносит элементы в другие временные позиции. Поэтому шаблон перестаёт совпадать с тем, который ожидает позиционно-зависимый детектор, хотя изменения сигнала, несущие знак, сохраняются.
