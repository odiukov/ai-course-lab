- concept: мощность конечной реализации случайного шума необходимо измерять для точной калибровки
  question: Почему при добавлении белого шума недостаточно считать, что результат генератора стандартного нормального распределения имеет ровно единичную мощность?
  explanation: Конечная случайная выборка лишь приближённо обладает параметрами исходного распределения. Масштабирование по измеренному mean(noise²) позволяет получить требуемую мощность для конкретного сгенерированного массива.
  kind: open
  reference: Единичная дисперсия является теоретическим свойством распределения, а средний квадрат конкретного конечного массива случайных отсчётов обычно немного отличается от единицы. Поэтому нужно измерить его фактическую мощность и откалибровать реализацию.
