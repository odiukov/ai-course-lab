- concept: повторение одной полезной нагрузки по кадрам повышает локализуемость и устойчивость, но не увеличивает её ёмкость
  question: В локализованном аудиоводяном знаке одна и та же фиксированная нагрузка повторяется в каждом кадре. Почему увеличение длительности записи не позволяет сохранить в ней более длинное сообщение?
  explanation: Покадровое встраивание не превращает запись в канал, где каждый следующий кадр несёт новые биты. В AudioSeal во всех кадрах повторяется одна 16-битная нагрузка, поэтому длительность повышает устойчивость, но не расширяет предел в 65 536 значений.
  kind: open
  reference: Кадры содержат повторения одной и той же нагрузки, а не последовательные фрагменты сообщения. Дополнительные кадры дают больше возможностей обнаружить и восстановить знак после обрезки или искажений, но число кодируемых значений остаётся ограничено разрядностью нагрузки.
  id: 020-check-16-bit-2
  fingerprint: 5600276e
