- concept: представления битов необходимо привести к общему алфавиту до сравнения
  question: Эталонная нагрузка записана в бинарном алфавите, а детектор выдаёт биполярные метки. Что нужно сделать перед вычислением точности восстановления?
  explanation: Метки −1/+1 и биты 0/1 кодируют одни и те же два состояния по-разному. Перед позиционным сравнением нужна согласованная замена, например −1 → 0 и +1 → 1.
  kind: choice
  options:
    - Отсортировать обе последовательности
    - Сравнить только количество положительных меток
    - Взять модуль каждого значения детектора
    - Однозначно преобразовать обе последовательности в общий алфавит
  correct: 3
  id: 034-code-bra-1
  fingerprint: 5bd74663
- concept: несовпадение длин полезных нагрузок должно приводить к явной ошибке метрики
  question: Почему функция оценки восстановления битов должна отклонять последовательности разной длины, а не сравнивать их до конца более короткой?
  explanation: Если было вложено 16 бит, а получено 14, сравнение только первых 14 может дать завышенную оценку и скрыть сбой декодирования. Равенство длин — предусловие корректного позиционного сравнения.
  kind: open
  reference: Молчаливое усечение скрывает потерянные или лишние биты и меняет смысл знаменателя. Результат перестаёт характеризовать восстановление всей вложенной нагрузки, поэтому несовпадение длин следует считать ошибкой входных данных.
  id: 034-code-bra-2
  fingerprint: b013def4
