- concept: доменная калибровка настраивает порог фиксированного детектора по размеченным данным рабочего канала
  question: Расположите действия для калибровки уже обученного детектора спуфинга в новом телефонном канале.
  explanation: Калибровка не требует обязательно менять архитектуру или переобучать модель. Сначала нужен репрезентативный набор из целевого домена, затем оценки модели и только после этого — подходящий рабочий порог.
  kind: order
  items:
    - Собрать размеченные естественные и синтезированные записи, прошедшие через рабочий кодек и канал
    - Получить для этих записей оценки фиксированного детектора
    - Выбрать по распределению оценок порог с приемлемым соотношением ложных допусков и отклонений
  id: 045-pitfalls-kalibrovka-1
  fingerprint: 229e3525
- concept: challenge-response liveness защищает от повтора готовой записи, но не от клонирования голоса в реальном времени
  question: Система просит звонящего произнести случайно выбранную фразу. Атакующий получает эту фразу и сразу синтезирует её голосом жертвы. Какое ограничение проверки проявляется в этом случае?
  explanation: Случайный запрос делает заранее записанный ответ бесполезным, однако интерактивный синтезатор может сформировать новый ответ после получения запроса. Поэтому liveness проверяет отсутствие простого повтора, а не естественное происхождение голоса.
  kind: choice
  options:
    - Случайная фраза гарантирует, что синтезированное аудио будет отклонено
    - Проверка может подтвердить свежесть ответа, но пропустить голосовой клон, созданный в реальном времени
    - Такая проверка обнаруживает клонирование, но не способна обнаружить повтор старой записи
  correct: 1
  id: 045-pitfalls-kalibrovka-2
  fingerprint: 4ce4543c
