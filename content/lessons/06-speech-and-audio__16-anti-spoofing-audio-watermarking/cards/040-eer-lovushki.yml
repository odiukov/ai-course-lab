- concept: строгое сравнение разрывов сохраняет первый порог при равенстве лучших кандидатов
  question: Пороги перебираются по возрастанию. Несколько порогов дают одинаковый минимальный разрыв между FAR и FRR, а лучший результат обновляется только при условии gap < best_gap. Какой порог будет сохранён?
  explanation: При строгом сравнении равный разрыв не заменяет уже сохранённый результат. Поскольку обход идёт по возрастанию, остаётся первый, то есть наименьший из связанных порогов.
  kind: choice
  options:
