- concept: разнообразие дикторов снижает риск запоминания голосов вместо признаков спуфинга
  question: Объясни своими словами, почему антиспуфинг-детектор следует проверять на большом разнообразии дикторов.
  explanation: В ASVspoof 5 около 2000 дикторов вместо примерно 100 в прежних наборах. Это затрудняет запоминание конкретных голосов и делает проверку обобщения реалистичнее.
  kind: open
  reference: При малом числе дикторов модель может запомнить их голоса или особенности записи и использовать эти признаки как короткий путь. Разнообразие дикторов заставляет её опираться на более общие признаки синтеза и преобразования голоса и лучше показывает качество на незнакомых людях.
