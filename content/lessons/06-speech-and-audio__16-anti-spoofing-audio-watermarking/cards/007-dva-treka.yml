- concept: CM оценивает детекцию спуфинга независимо от личности говорящего
  question: Система получает аудиозапись без заявленной личности и должна определить только то, является ли запись настоящей или поддельной. Какой трек соответствует этой задаче?
  explanation: В треке CM модель различает настоящие и поддельные записи, не устанавливая личность говорящего. SASV нужен, когда антиспуфинг работает вместе с голосовой биометрией.
  kind: choice
  options:
    - CM — автономная оценка контрмеры
    - SASV — совместная оценка контрмеры и верификации говорящего
    - Обычная верификация говорящего без защиты от спуфинга
  correct: 0
  id: 007-dva-treka-1
  fingerprint: 1a2db584
- concept: качество автономного детектора спуфинга не определяет качество объединённой системы SASV
  question: Объясните, почему низкая ошибка автономного детектора подделок не гарантирует низкую ошибку системы голосового доступа, где этот детектор работает вместе с верификацией говорящего.
  explanation: 'CM измеряет только распознавание подделок. SASV учитывает итоговые решения всей связки: отказ настоящему целевому пользователю, пропуск его клона и принятие постороннего за целевого пользователя.'
  kind: open
  reference: Объединённая система должна не только отсеивать подделки, но и принимать настоящего целевого пользователя и отклонять настоящих посторонних. Детектор может хорошо распознавать синтез, но часто отклонять живую речь целевого пользователя; биометрия, в свою очередь, может принять голос постороннего. Поэтому связку нужно оценивать целиком в треке SASV.
  id: 007-dva-treka-2
  fingerprint: 04519c49
