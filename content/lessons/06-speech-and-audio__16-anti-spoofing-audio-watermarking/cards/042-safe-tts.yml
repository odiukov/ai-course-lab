- concept: согласие на клонирование голоса проверяется до запуска синтеза
  question: Сервис получил образец голоса для клонирования. Как должна вести себя функция генерации, если согласие владельца образца не подтверждено?
  explanation: Проверка согласия должна предшествовать синтезу. Тогда при отсутствии разрешения запрещённый голосовой клон вообще не создаётся, а вычислительные ресурсы модели не расходуются.
  kind: choice
  options:
    - Завершить запрос с ошибкой до запуска модели синтеза
    - Синтезировать аудио, но не возвращать его пользователю
    - Синтезировать аудио и ограничиться добавлением водяного знака
    - Создать аудио и зафиксировать отсутствие согласия только в журнале аудита
  correct: 0
  id: 042-safe-tts-1
  fingerprint: 4828a6fa
- concept: подписанный манифест создаётся для окончательной версии аудио после встраивания водяного знака
  question: Расположите операции обработки запроса в правильном порядке после успешной проверки согласия.
  explanation: Сначала модель создаёт аудио, затем в результат встраивается водяной знак, и только окончательный помеченный файл подписывается. Если изменить аудио после создания манифеста, манифест уже не будет соответствовать выдаваемому файлу.
  kind: order
  items:
    - Синтезировать аудио
    - Встроить в аудио водяной знак с полезной нагрузкой
    - Подписать водяное аудио и создать манифест
  id: 042-safe-tts-2
  fingerprint: fbcf4d22
