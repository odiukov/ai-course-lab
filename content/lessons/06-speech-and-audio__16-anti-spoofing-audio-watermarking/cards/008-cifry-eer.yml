- concept: EER измеряется при пороге, где доли ложных допусков и ложных отклонений равны
  question: Что означает метрика EER для детектора синтетической речи?
  explanation: Сдвиг порога уменьшает один тип ошибки ценой роста другого. EER фиксирует точку их равенства. Поэтому 7,23% и 0,42% описывают ошибки именно при таком пороге, а не при любой настройке детектора.
  kind: choice
  options:
    - Среднюю ошибку детектора по всем возможным порогам
    - Долю ошибок при пороге, где ложные допуски и ложные отклонения происходят с одинаковой частотой
    - Минимальную из двух ошибок при любом пороге
    - Долю синтетических записей в тестовом наборе
  correct: 1
  id: 008-cifry-eer-1
  fingerprint: c7ecd5de
- concept: бенчмарковый EER нельзя переносить в прод без проверки на репрезентативных данных
  question: Объясни своими словами, почему низкий EER на чистых лабораторных записях нельзя сразу включать в SLA для телефонного сервиса.
  explanation: 'На ASVspoof 2019 LA получили 0,42% EER, тогда как в более реалистичных условиях ASVspoof 5 результат составляет около 7,23%. В проде материал ожидает 5–10% EER: смена условий оценки способна изменить метрику даже без смены модели.'
  kind: open
  reference: 'EER зависит не только от модели, но и от распределения данных: микрофонов, шума, каналов связи, дикторов и атак. Для обоснования SLA детектор нужно проверить на записях, представляющих реальный производственный трафик.'
  id: 008-cifry-eer-2
  fingerprint: bbbbbb85
