- concept: набор аугментаций при обучении задаёт ожидаемые преобразования канала передачи
  question: Объясни своими словами, зачем при обучении системы аудиоводяных знаков искусственно искажать помеченный звук перед передачей его детектору.
  explanation: Без моделирования канала система может безошибочно работать на чистом аудио, но потерять метку после кодирования или другой обработки. AudioSeal поэтому включает в обучение сжатие, эквализацию, изменение скорости и добавление шума.
  kind: open
  reference: Искажения моделируют обработку звука реальными каналами передачи. Требование обнаруживать метку после них учит детектор распознавать изменённый знак, а генератор — встраивать знак в устойчивую к таким преобразованиям форму.
  id: 018-audioseal-obuchenie-2
