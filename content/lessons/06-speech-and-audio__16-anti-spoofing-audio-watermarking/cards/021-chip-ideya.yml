- concept: детектору нужна воспроизводимая из ключа опорная псевдослучайная последовательность
  question: Почему для водяного знака удобна псевдослучайная последовательность, воспроизводимая из ключа, а не новый несохранённый случайный узор при каждом встраивании?
  explanation: Случайный на вид узор полезен лишь тогда, когда встраиватель и детектор могут получить одинаковую последовательность. Детерминированная генерация из ключа обеспечивает это совпадение; сам факт использования ключа при этом ещё не является полной криптографической защитой.
  kind: open
  reference: Детектор должен получить точно ту же опорную последовательность, чтобы вычислить согласованную корреляцию. Ключ позволяет независимо воспроизвести узор без хранения всего списка его элементов. Несохранённый случайный узор детектору неизвестен, поэтому согласованное накопление сигнала невозможно.
