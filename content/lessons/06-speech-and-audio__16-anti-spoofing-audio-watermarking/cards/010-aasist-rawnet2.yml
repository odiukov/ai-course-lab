- concept: graph-attention в AASIST моделирует связи между спектральными областями
  question: Какое свойство graph-attention в AASIST помогает обнаруживать подделки, проявляющиеся не в одной точке спектра, а в согласованности нескольких участков записи?
  explanation: AASIST рассматривает взаимосвязи между спектрально-временными областями. Поэтому модель может находить сочетания артефактов, которые были бы слабо заметны при независимой проверке отдельных точек.
  kind: choice
  options:
    - Совместный анализ связей между областями спектра в разные моменты времени
    - Восстановление исходной волны из спектральных признаков
    - Проверка каждого частотного отсчёта независимо от остальных
  correct: 0
