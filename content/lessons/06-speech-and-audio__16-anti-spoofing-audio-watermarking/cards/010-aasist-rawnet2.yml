- concept: выбор входного представления определяет объём признаков, которые детектор должен выучить самостоятельно
  question: Объясни своими словами, почему детектор на сырой волне обычно сильнее зависит от объёма обучающих данных, чем детектор, получающий заранее вычисленные спектральные признаки.
  explanation: RawNet2 получает больше свободы, но его фронтенд должен самостоятельно открыть подходящие признаки. AASIST начинает со спектрального представления, в котором частотная структура уже выделена, что снижает объём работы, выполняемой только по размеченным данным детекции.
  kind: open
  reference: При работе с сырой волной модель должна сама научиться выделять полезные частотные и временные признаки. Спектральное представление уже явно раскрывает часть структуры сигнала, поэтому детектору остаётся выучить более узкую задачу различения настоящего и поддельного аудио.
