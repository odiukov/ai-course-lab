- concept: доля ложных пропусков нормируется по числу подделок, а не по размеру всей выборки
  question: В выборке есть 23 подделки и 37 настоящих записей. При выбранном пороге детектор пропустил 8 подделок и ошибочно отклонил 9 настоящих записей. Чему равна доля ложных пропусков в долях единицы?
  explanation: 'Для ложных пропусков знаменателем служит только число подделок: 8 / 23 ≈ 0.3478. Количество настоящих записей и число их ложных отклонений в этот показатель не входят.'
  kind: numeric
  answer: 0.3478
