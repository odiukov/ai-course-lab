- concept: встраиватель должен возвращать независимый результат без изменения исходного аудиомассива
  question: Почему функция встраивания водяного знака должна сначала копировать аудиомассив, а не добавлять сигнал непосредственно во входной массив?
  explanation: Операция сложения может быть выполнена над копией с теми же формой и типом данных. Тогда вызывающий код получает новый помеченный сигнал, а исходная запись остаётся доступной для измерения и повторного использования.
  kind: open
  reference: Изменение на месте уничтожает исходную версию аудио, создаёт неожиданный побочный эффект для вызывающего кода и мешает корректно сравнивать оригинал с помеченным результатом. Копия сохраняет вход неизменным и делает поведение функции предсказуемым.
  id: 024-code-embed-2
  fingerprint: 4985601b
- concept: амплитуду помеченного аудио необходимо контролировать после добавления водяного знака
  question: Расположите действия безопасного встраивания добавочного водяного знака в правильном порядке.
  explanation: 'Контроль выполняют над уже помеченным сигналом: сложение может вывести пики за допустимый диапазон даже при корректном исходнике. Превышение диапазона приводит к клиппингу, искажению аудио и повышению заметности знака.'
  kind: order
  items:
    - Создать копию исходного аудиомассива
    - Добавить в выбранные блоки слабые псевдослучайные сигналы
    - Вычислить максимальную абсолютную амплитуду результата
    - Убедиться, что результат остаётся в допустимом диапазоне, либо уменьшить силу знака
  id: 024-code-embed-3
