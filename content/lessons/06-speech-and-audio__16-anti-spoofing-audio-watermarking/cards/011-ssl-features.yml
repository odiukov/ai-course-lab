- concept: focal loss уменьшает вклад лёгких примеров и сосредоточивает обучение на трудных пограничных случаях
  question: Объясни своими словами, зачем применять focal loss при обучении детектора аудиоспуфинга, если большинство записей он уже классифицирует уверенно.
  explanation: Обычная кросс-энтропия позволяет многочисленным лёгким примерам заметно влиять на суммарную функцию потерь. Focal loss подавляет их вклад и направляет обучение на случаи, в которых модель пока не уверена; именно так она используется в варианте NeXt-TDNN с признаками WavLM.
  kind: open
  reference: Focal loss понижает вес уверенно классифицированных примеров и сохраняет больший вклад ошибок на трудных или пограничных записях. Благодаря этому градиент не расходуется преимущественно на множество очевидных случаев, а модель лучше уточняет границу между настоящим и синтезированным аудио.
  id: 011-ssl-features-2
  fingerprint: b8cd7f8b
