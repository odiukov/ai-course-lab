- concept: частота дискретизации должна одинаково интерпретироваться генератором и детектором
  question: Почему генератору и детектору AudioSeal необходимо передавать правильную и согласованную частоту дискретизации аудио?
  explanation: В материале аудио загружается с частотой 16000 Гц, и это же значение получают генератор и детектор. Так оба компонента одинаково переводят отсчёты во временные интервалы.
