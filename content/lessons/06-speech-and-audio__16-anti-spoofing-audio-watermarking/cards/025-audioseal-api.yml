- concept: детектор AudioSeal отдельно сообщает наличие знака и декодированное сообщение
  question: Что представляют возвращаемые значения result и decoded_payload после вызова detect_watermark?
  explanation: 'Детектор решает две связанные задачи: оценивает присутствие знака и восстанавливает его сообщение. В материале decoded_payload сопоставляется с исходной 16-битной нагрузкой.'
  kind: choice
  options:
    - result содержит частоту дискретизации, а decoded_payload — число аудиоканалов
    - result содержит восстановленное аудио, а decoded_payload — извлечённую добавку к сигналу
    - result содержит функцию потерь, а decoded_payload — параметры детектора
    - result сообщает о наличии водяного знака, а decoded_payload содержит извлечённую битовую нагрузку
