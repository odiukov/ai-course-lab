- concept: для спектра с нулевой полной энергией spectral rolloff не определён и требует явного соглашения
  question: Как функции spectral_rolloff следует обрабатывать спектр тишины и почему этот случай нельзя оставлять обычному расчёту?
  explanation: Для тишины и полная энергия, и порог накопления равны нулю. Без отдельной ветки алгоритм способен выбрать первый бин, хотя это не характеризует спектральный хвост. Явное соглашение делает пограничный случай предсказуемым для вызывающего кода.
  kind: open
  reference: Если полная энергия равна нулю, функция должна вернуть заранее оговорённый маркер вроде None или NaN либо выбросить явное исключение. У тишины нет частоты, на которой накапливается содержательная доля энергии, поэтому обычное сравнение с порогом может дать формально допустимый, но бессмысленный результат.
