- concept: вердикт по записи определяется долей превышений среди кадров, а не единичным спектральным выбросом
  question: Какой показатель следует сравнивать с `min_share`, чтобы отдельный кадр с высоким spectral rolloff не делал подозрительной всю запись?
  explanation: Для каждого информативного кадра проверяют превышение `rolloff_hz`, а затем усредняют получившиеся индикаторы. Поэтому редкий выброс почти не влияет на вердикт, тогда как устойчивые превышения увеличивают долю.
  kind: choice
  options:
    - Максимальный rolloff среди кадров
    - Долю информативных кадров, у которых rolloff выше `rolloff_hz`
    - Rolloff первого информативного кадра
    - Сумму rolloff по всем кадрам
  correct: 1
  id: 015-code-suspicious-1
  fingerprint: 4c0e0aff
- concept: низкоэнергетические кадры исключаются из знаменателя при расчёте доли подозрительных кадров
  question: Запись разбита на 90 кадров. У 18 кадров энергия ниже порога, поэтому их отбрасывают. Среди оставшихся кадров rolloff выше порога у 27. Какова доля подозрительных кадров?
  explanation: После удаления тишины остаётся 72 информативных кадра. Доля равна 27 / 72 = 0.375. Если оставить тишину в знаменателе, оценка будет искусственно занижена.
  kind: numeric
  answer: 0.375
  tolerance: 0.001
  id: 015-code-suspicious-2
  fingerprint: 4e21b436
- concept: детектор возвращает непрерывную оценку вместе с пороговым вердиктом
  question: Заполни возврат функции так, чтобы вызывающий код получил и логический вердикт, и долю подозрительных кадров.
  explanation: Логический результат удобен для автоматического решения, а `share` позволяет оценить запас до порога, отлаживать ошибки и калибровать `min_share` без потери диагностической информации.
  kind: cloze
  template: return ___
  answer: share > min_share, share
  accept:
    - (share > min_share, share)
  id: 015-code-suspicious-3
  fingerprint: 61244a25
