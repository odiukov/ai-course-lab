- concept: порог срабатывания следует выбирать ниже percentile, иначе условие детектора становится недостижимым
  question: Детектор настроен с percentile=0.88 и условием rolloff / len(spec) > 0.91. Почему он не срабатывает даже на плоском спектре?
  explanation: Для плоского спектра нормализованный rolloff стремится к percentile. Если max_rolloff_ratio расположен выше него, сравнение не выполнится. Именно поэтому пару percentile=0.85 и max_rolloff_ratio=0.92 из урока называют мёртвой.
  kind: choice
  options:
    - На плоском спектре отношение достигает примерно 0.88, поэтому порог 0.91 недостижим; порог нужно опустить ниже percentile
    - Percentile слишком мал; нужно одновременно увеличить percentile и порог
    - Плоский спектр всегда классифицируется как живая речь независимо от порогов
    - Число частотных бинов недостаточно велико; увеличение FFT обязательно устранит проблему
