- concept: защитные слои различаются объёмом сообщаемой информации и устойчивостью связи с аудио
  question: Сравните водяной знак, anti-spoofing-детектор и provenance по тому, какую информацию они могут сообщить и насколько эта информация связана с самим аудиосигналом.
  explanation: Более богатые метаданные не обязательно устойчивее. Водяной знак ограничен по ёмкости, зато связан с волной; provenance информативен, но отделим; детектор выдаёт решение, не извлекая вложенное сообщение.
  kind: open
  reference: 'Provenance может содержать подробные сведения об авторе, времени и истории файла, но отделимые метаданные легко потерять при пересохранении. Водяной знак несёт небольшую полезную нагрузку внутри сигнала и способен переживать некоторые преобразования аудио. Anti-spoofing-детектор не переносит сведения о происхождении: он вычисляет оценку подлинности по самому звуку.'
