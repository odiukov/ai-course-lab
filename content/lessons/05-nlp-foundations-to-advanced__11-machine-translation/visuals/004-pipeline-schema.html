<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь предложения через систему перевода</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f7f8fc;
    --panel:#ffffff;
    --ink:#172033;
    --muted:#59647a;
    --line:#9ba7bd;
    --blue:#316bd6;
    --blue-soft:#e8f0ff;
    --violet:#7552c7;
    --violet-soft:#f0eaff;
    --green:#168164;
    --green-soft:#e2f5ee;
    --amber:#a95d08;
    --amber-soft:#fff0d5;
    --token:#eef2f8;
    --token-line:#aab6ca;
  }
  *{box-sizing:border-box}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:10px;
  }
  .figure{
    background:var(--panel);
    border:2px solid var(--line);
  }
  .title{
    font-size:22px;
    font-weight:bold;
    padding:16px 20px 8px;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    padding:0 20px 8px;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:430px;
    background:var(--panel);
  }
  .node{
    fill:var(--panel);
    stroke:var(--line);
    stroke-width:2;
  }
  .source{fill:var(--blue-soft);stroke:var(--blue)}
  .tokens{fill:var(--panel);stroke:var(--blue)}
  .encoder{fill:var(--violet-soft);stroke:var(--violet)}
  .decoder{fill:var(--amber-soft);stroke:var(--amber)}
  .result{fill:var(--green-soft);stroke:var(--green)}
  .token{
    fill:var(--token);
    stroke:var(--token-line);
    stroke-width:1.5;
  }
  .attention{
    fill:var(--panel);
    stroke:var(--amber);
    stroke-width:2;
  }
  .candidate{
    fill:var(--panel);
    stroke:var(--line);
    stroke-width:1.5;
  }
  .arrow,.bridge,.branch{
    fill:none;
    stroke:var(--line);
    stroke-width:3;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .bridge{stroke:var(--violet)}
  .branch{stroke:var(--amber);stroke-width:2}
  .arrowhead{fill:var(--line)}
  .bridgehead{fill:var(--violet)}
  .kicker{
    fill:var(--muted);
    font-size:12px;
    font-weight:bold;
    letter-spacing:.08em;
  }
  .heading{fill:var(--ink);font-size:17px;font-weight:bold}
  .bodytext{fill:var(--ink);font-size:15px}
  .small{fill:var(--muted);font-size:12px}
  .token-text{fill:var(--ink);font-size:13px;font-weight:bold}
  .arrow-label{fill:var(--muted);font-size:12px;font-weight:bold}
  .attention-text{fill:var(--amber);font-size:13px;font-weight:bold}
  .candidate-text{fill:var(--ink);font-size:13px}
  .result-text{fill:var(--green);font-size:18px;font-weight:bold}
  .caption{fill:var(--muted);font-size:14px;font-weight:bold}
  #fallback{color:var(--ink);font-size:16px;padding:18px 20px}
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#10141d;
      --panel:#171d29;
      --ink:#eef3ff;
      --muted:#aeb9ce;
      --line:#647089;
      --blue:#77a5ff;
      --blue-soft:#1b2b49;
      --violet:#b39aff;
      --violet-soft:#2b2347;
      --green:#65d4ad;
      --green-soft:#173c34;
      --amber:#ffb45c;
      --amber-soft:#402d18;
      --token:#252e3e;
      --token-line:#71809a;
    }
  }
</style>
</head>
<body>
<main class="figure" aria-labelledby="diagram-title">
  <div class="title" id="diagram-title">Путь предложения через систему перевода</div>
  <div class="subtitle">На каждой остановке меняется представление фразы</div>
  <svg id="diagram" viewBox="0 0 1280 430" width="1280" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Конвейер машинного перевода из пяти блоков"></svg>
  <p id="fallback" hidden></p>
</main>

<script>
const DATA=[{
  origin:{x:0,y:0},
  scale:{x:1,y:1},
  arrow:{head:10,wing:6},
  nodes:[
    {x:25,y:72,w:205,h:188,kind:"source",kicker:"ИСХОДНЫЙ ТЕКСТ",
     title:["Фраза на английском"],lines:["The keys are","on the table"],
     tx:45,ky:100,ty:130,by:177,gap:25},
    {x:270,y:72,w:215,h:188,kind:"tokens",kicker:"SUBWORD-ТОКЕНЫ",
     title:["Знакомые модели части"],tx:290,ky:100,ty:130},
    {x:525,y:72,w:170,h:188,kind:"encoder",kicker:"ЭНКОДЕР",
     title:["Смысл","с контекстом"],lines:["Все части учтены","вместе с окружением"],
     tx:545,ky:100,ty:130,by:193,gap:22},
    {x:735,y:47,w:275,h:263,kind:"decoder",kicker:"ДЕКОДЕР",
     title:["Собирает перевод"],tx:755,ky:75,ty:105},
    {x:1050,y:72,w:205,h:188,kind:"result",kicker:"ДЕТОКЕНИЗАЦИЯ",
     title:["Готовый перевод"],lines:["Ключи лежат","на столе"],
     tx:1070,ky:100,ty:130,by:181,gap:27}
  ],
  tokens:[
    {x:289,y:158,w:48,h:30,t:"▁The"},
    {x:345,y:158,w:48,h:30,t:"▁key"},
    {x:401,y:158,w:29,h:30,t:"s"},
    {x:289,y:198,w:48,h:30,t:"▁are"},
    {x:345,y:198,w:39,h:30,t:"▁on"},
    {x:392,y:198,w:68,h:30,t:"▁the"},
    {x:337,y:233,w:74,h:30,t:"▁table"}
  ],
  arrows:[
    {x1:230,y1:166,x2:270,y2:166,label:"делит",lx:250,ly:149},
    {x1:485,y1:166,x2:525,y2:166,label:"читает",lx:505,ly:190},
    {x1:695,y1:166,x2:735,y2:166,label:"порождает",lx:715,ly:149},
    {x1:1010,y1:166,x2:1050,y2:166,label:"склеивает",lx:1030,ly:190}
  ],
  attention:{x:755,y:138,w:235,h:43,cx:872,cy:165,
             text:"перекрёстное внимание"},
  candidates:[
    {x:765,y:215,w:215,h:32,text:"Ключи лежат…"},
    {x:765,y:254,w:215,h:32,text:"Ключи находятся…"}
  ],
  beam:{x:872,y:203,text:"beam search: несколько черновиков"},
  bridge:{
    points:[{x:610,y:260},{x:610,y:346},{x:872,y:346},{x:872,y:310}],
    label:"выход энкодера: смысл исходной фразы",lx:626,ly:369
  },
  inside:[
    {x1:872,y1:181,x2:872,y2:203},
    {x1:872,y1:203,x2:872,y2:215},
    {x1:872,y1:203,x2:872,y2:254}
  ],
  caption:{x:640,y:408,text:"текст → части → контекстный смысл → варианты перевода → цельная фраза"}
}];

const spec=DATA.find(Boolean);
const origin=spec.origin;
const scale=spec.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const svg=document.getElementById("diagram");
const fallback=document.getElementById("fallback");
const ns=svg.namespaceURI;

function make(name,attrs,text){
  const node=document.createElementNS(ns,name);
  Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
  if(text!==undefined) node.textContent=text;
  return node;
}
function add(node){svg.appendChild(node);return node}
function width(value){return sx(value)-sx(origin.x)}
function height(value){return sy(value)-sy(origin.y)}

function rect(item,className){
  return make("rect",{
    x:sx(item.x),y:sy(item.y),width:width(item.w),height:height(item.h),
    class:className
  });
}
function textLine(value,x,y,className,anchor){
  return make("text",{
    x:sx(x),y:sy(y),class:className,"text-anchor":anchor
  },value);
}
function multiline(lines,x,y,gap,className,anchor){
  const text=make("text",{
    x:sx(x),y:sy(y),class:className,"text-anchor":anchor
  });
  lines.forEach((line)=>{
    const span=make("tspan",{x:sx(x),dy:height(gap)},line);
    text.appendChild(span);
  });
  return text;
}
function arrowHead(x,y,className){
  const h=spec.arrow.head;
  const w=spec.arrow.wing;
  return make("polygon",{
    points:[
      [sx(x),sy(y)],
      [sx(x-h),sy(y-w)],
      [sx(x-h),sy(y+w)]
    ].map(point=>point.join(",")).join(" "),
    class:className
  });
}
function lineArrow(item){
  add(make("line",{
    x1:sx(item.x1),y1:sy(item.y1),x2:sx(item.x2),y2:sy(item.y2),
    class:"arrow"
  }));
  add(arrowHead(item.x2,item.y2,"arrowhead"));
  add(textLine(item.label,item.lx,item.ly,"arrow-label","middle"));
}

try{
  spec.nodes.forEach((node)=>{
    add(rect(node,"node "+node.kind));
    add(textLine(node.kicker,node.tx,node.ky,"kicker","start"));
    add(multiline(node.title,node.tx,node.ty,node.gap||spec.arrow.head,
                  "heading","start"));
    if(node.lines){
      const bodyClass=node.kind==="result"?"result-text":"bodytext";
      add(multiline(node.lines,node.tx,node.by,node.gap,bodyClass,"start"));
    }
  });

  spec.tokens.forEach((token)=>{
    add(rect(token,"token"));
    add(textLine(token.t,token.x+token.w/spec.arrow.wing,
                 token.y+token.h/spec.arrow.wing,
                 "token-text","middle"));
  });

  spec.arrows.forEach(lineArrow);

  add(rect(spec.attention,"attention"));
  add(textLine(spec.attention.text,spec.attention.cx,spec.attention.cy,
               "attention-text","middle"));

  add(textLine(spec.beam.text,spec.beam.x,spec.beam.y,
               "small","middle"));

  spec.candidates.forEach((candidate)=>{
    add(rect(candidate,"candidate"));
    add(textLine(candidate.text,
                 candidate.x+spec.arrow.head,
                 candidate.y+candidate.h/spec.arrow.wing,
                 "candidate-text","start"));
  });

  spec.inside.forEach((segment)=>{
    add(make("line",{
      x1:sx(segment.x1),y1:sy(segment.y1),
      x2:sx(segment.x2),y2:sy(segment.y2),
      class:"branch"
    }));
  });

  const bridgePoints=spec.bridge.points
    .map(point=>sx(point.x)+","+sy(point.y)).join(" ");
  add(make("polyline",{points:bridgePoints,class:"bridge"}));
  const bridgeEnd=spec.bridge.points.find(point=>point.y===spec.nodes.find(node=>node.kind==="decoder").y+spec.nodes.find(node=>node.kind==="decoder").h);
  add(make("polygon",{
    points:[
      [sx(bridgeEnd.x),sy(bridgeEnd.y)],
      [sx(bridgeEnd.x-spec.arrow.wing),sy(bridgeEnd.y+spec.arrow.head)],
      [sx(bridgeEnd.x+spec.arrow.wing),sy(bridgeEnd.y+spec.arrow.head)]
    ].map(point=>point.join(",")).join(" "),
    class:"bridgehead"
  }));
  add(textLine(spec.bridge.label,spec.bridge.lx,spec.bridge.ly,
               "arrow-label","start"));

  add(textLine(spec.caption.text,spec.caption.x,spec.caption.y,
               "caption","middle"));
}catch(error){
  svg.hidden=true;
  fallback.hidden=false;
  fallback.textContent="Схема должна была показать путь фразы: исходный текст → subword-токены → энкодер → декодер с перекрёстным вниманием → детокенизированный перевод.";
}
</script>
</body>
</html>
