- concept: аномальное отношение длин служит сигналом для проверки, но не доказывает ошибку перевода
  question: Перевод заметно длиннее исходного текста и превысил установленный порог отношения длин. Как правильно интерпретировать этот результат?
  explanation: Различия между языками и особенности коротких фраз иногда естественно увеличивают длину. Поэтому порог выявляет подозрительные результаты, но окончательный вывод требует проверки содержания.
  kind: choice
  options:
    - Перевод следует автоматически признать галлюцинацией
    - Перевод нужно отправить на проверку, поскольку отношение длин является эвристическим сигналом
    - Перевод гарантированно точен, если он грамматически гладкий
    - Исходный текст следует считать ошибочным
  correct: 1
  id: 032-length-explosion-rule-2
  fingerprint: e4f7a5f6
- concept: длины источника и перевода нужно измерять совместимым способом
  question: Почему нельзя вычислять отношение длин, считая во входном тексте слова, а в переводе — subword-токены?
  explanation: Числитель и знаменатель должны быть получены одной политикой подсчёта — например, совместимой токенизацией. Иначе порог будет срабатывать из-за различий единиц измерения.
  kind: choice
  options:
    - Такое отношение сравнивает разные единицы и не отражает реальную несоразмерность текстов
    - Subword-токены существуют только в исходном языке
    - Число слов всегда совпадает с числом символов
    - Определитель языка не принимает количество слов
  correct: 0
  id: 032-length-explosion-rule-3
  fingerprint: 7a2b4aa2
