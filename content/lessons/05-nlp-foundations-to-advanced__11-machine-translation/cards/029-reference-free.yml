  fingerprint: 65d115b1
- concept: калибровка превращает непрерывную оценку метрики в решение о пригодности перевода
  question: Расположи этапы калибровки порога метрики без эталона в правильном порядке.
  explanation: Порог нельзя осмысленно выбрать только по распределению баллов. Сначала нужны человеческие решения, затем с ними сопоставляют оценки метрики и проверяют полученную границу на отдельных данных.
  kind: order
  items:
    - Собрать репрезентативную выборку переводов из целевого потока
    - Получить для переводов человеческие метки «годен» и «не годен»
    - Вычислить оценки выбранной метрики для размеченных переводов
    - Сопоставить оценки с метками и выбрать подходящую границу
    - Проверить работу выбранного порога на отложенных данных
  id: 029-reference-free-2
  fingerprint: b36a12ce
- concept: порог качества выбирают с учётом различной стоимости ложного принятия и ложного отклонения
  question: Метрика устроена так, что более высокий балл означает лучшее качество. Ошибочный автоматический допуск плохого медицинского перевода гораздо опаснее, чем лишняя ручная проверка хорошего. Как следует изменить порог автоматического допуска?
  explanation: Повышение порога уменьшает риск автоматически пропустить плохой перевод, хотя увеличивает число хороших переводов, отправленных человеку. Такой компромисс оправдан, когда ложный допуск особенно дорог.
  kind: choice
  options:
    - Понизить порог, чтобы автоматически принимать больше переводов
    - Убрать порог и принимать решение по среднему баллу потока
    - Повысить порог, допуская больше отправок на ручную проверку
    - Оставить порог неизменным, поскольку цена ошибок не относится к калибровке
  correct: 2
  id: 029-reference-free-3
  fingerprint: df008d81
