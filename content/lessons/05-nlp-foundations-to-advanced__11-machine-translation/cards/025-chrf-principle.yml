- concept: символьные n-граммы дают частичное совпадение близким словоформам
  question: Эталон содержит «умная система», а перевод — «умной системы». Почему chrF обычно обнаружит между ними заметное сходство, несмотря на отсутствие точных совпадений слов?
  explanation: 'chrF не выполняет морфологический разбор и не удаляет окончания. Она сопоставляет цепочки символов: общие фрагменты основ дают частичное совпадение, а различающиеся окончания снижают оценку.'
  kind: choice
  options:
    - chrF считает слова совпавшими, если у них одинаковая часть речи
    - chrF сравнивает символьные n-граммы, поэтому общие основы создают множество совпадений
    - chrF автоматически приводит все слова к начальной форме
    - chrF игнорирует окончания и сравнивает только первые буквы слов
  correct: 1
  id: 025-chrf-principle-1
  fingerprint: 9c298868
- concept: F-мера chrF уравновешивает точность и полноту символьных совпадений
  question: Почему для chrF недостаточно учитывать только долю символьных n-грамм перевода, найденных в эталоне?
  explanation: F-мера учитывает обе стороны сравнения. Благодаря этому короткий перевод из нескольких подходящих фрагментов не получает неоправданно высокую оценку за счёт одной лишь точности.
  kind: open
  reference: 'Одна точность не показывает, насколько полно перевод покрывает эталон. chrF объединяет точность и полноту: лишние фрагменты ухудшают точность, а пропущенные — полноту, поэтому высокая оценка требует избегать и добавлений, и потерь.'
  id: 025-chrf-principle-2
  fingerprint: 0f64e090
