- concept: галлюцинацию распознают по утверждениям, не подтверждённым исходным текстом
  question: Исходный текст сообщает, что поставка не прибыла из-за непогоды. Перевод написан на нужном языке и утверждает, что груз уже доставлен клиенту. Как классифицировать ошибку?
  explanation: Правильный язык и беглый стиль не гарантируют верности содержания. Перевод противоречит источнику и добавляет факт доставки, поэтому это галлюцинация.
  kind: choice
  options:
    - 'Галлюцинация: перевод содержит не подтверждённый источником факт'
    - 'Off-target generation: выбран неверный язык'
    - 'Terminology drift: один термин переведён разными способами'
    - 'Formality mismatch: выбран неверный уровень вежливости'
  correct: 0
  id: 031-silent-failures-1
  fingerprint: 581549dd
- concept: неуверенный результат определения языка требует отдельной обработки
  question: Определитель языка получил очень короткую строку с названием бренда и вернул ожидаемый язык с низкой уверенностью. Как поступить надёжнее всего?
  explanation: На коротких и смешанных строках определитель языка может ошибаться. Порог уверенности позволяет автоматически принимать или отклонять надёжные случаи, а сомнительные направлять на проверку.
  kind: choice
  options:
    - Принять перевод, потому что метка языка формально совпала
    - Отправить сомнительный результат на дополнительную или ручную проверку
    - Считать низкую уверенность доказательством галлюцинации
    - Увеличить beam width и не проверять язык повторно
  correct: 1
  id: 031-silent-failures-2
  fingerprint: 6f50f7c3
