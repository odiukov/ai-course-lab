- concept: нулевая длина гипотезы требует отдельной обработки до вычисления brevity penalty
  question: Как реализация BLEU brevity penalty должна обработать пустую гипотезу?
  explanation: При пустой гипотезе её длина оказалась бы в знаменателе общей формулы. Поэтому функция должна сразу вернуть нулевое значение и не выполнять деление.
  kind: choice
  options:
    - Вычислить экспоненту по общей формуле
    - Считать её не короче эталона
    - Сразу вернуть нулевой штраф, не вычисляя отношение длин
  correct: 2
  id: 018-code-brevity-penalty-1
  fingerprint: 7e170d1e
- concept: промежуточное значение brevity penalty не округляют до вычисления итогового BLEU
  question: Почему функцию brevity penalty следует возвращать с полной доступной точностью, откладывая округление?
  explanation: Штраф за краткость — промежуточный множитель. Если округлить его внутри функции, потерянная точность перейдёт в итоговый BLEU; округлять лучше только результат, предназначенный для отображения.
  kind: open
  reference: Потому что brevity penalty участвует в дальнейшем вычислении BLEU, а преждевременное округление вносит дополнительную погрешность в итоговую оценку.
  id: 018-code-brevity-penalty-2
  fingerprint: e7329376
