- concept: увеличение beam width повышает вычислительную стоимость и не гарантирует дальнейшего роста качества
  question: Что обычно происходит при значительном увеличении beam width при неизменных модели и входном тексте?
  explanation: Широкий beam сохраняет больше кандидатов, поэтому декодирование дорожает. Однако дополнительные гипотезы часто мало отличаются друг от друга, и улучшение качества не гарантировано.
  kind: choice
  options:
    - Декодер рассматривает больше гипотез и тратит больше вычислений, но качество может перестать расти
    - Перевод обязательно становится длиннее и точнее
    - Модель автоматически исправляет ошибки, допущенные при обучении
  correct: 0
  id: 009-decoding-settings-1
  fingerprint: 28837f9a
- concept: сумма логарифмов вероятностей без поправки на длину смещает выбор в пользу коротких последовательностей
  question: Почему ранжирование переводов только по сумме логарифмов условных вероятностей может систематически предпочитать слишком короткие варианты?
  explanation: Каждый дополнительный токен обычно добавляет отрицательный вклад к общей log-probability. Без нормализации или штрафа за длину короткая гипотеза получает преимущество просто потому, что содержит меньше слагаемых.
  kind: open
  reference: Вероятность каждого следующего токена не превышает единицу, поэтому её логарифм неположителен. Чем больше токенов в последовательности, тем больше таких слагаемых накапливается и тем ниже может оказаться суммарная оценка, даже если длинный перевод содержательно полнее.
  id: 009-decoding-settings-2
  fingerprint: dfff1054
- concept: length penalty регулирует относительную оценку переводов разной длины
  question: Система регулярно выдаёт грамматически завершённые, но слишком короткие переводы с пропущенными уточнениями. Что стоит проверить в типичной схеме, где увеличение length penalty поддерживает более длинные гипотезы?
  explanation: 'Увеличение length penalty может сделать более длинные и полные варианты конкурентоспособнее. Настраивать его нужно умеренно: чрезмерное значение способно вызвать многословие и повторы.'
  kind: choice
  options:
    - Умеренно увеличить length penalty и проверить, сохранились ли пропущенные детали
    - Уменьшить length penalty, чтобы дополнительно поощрить краткость
    - Заменить cross-attention на жадное декодирование
  correct: 0
  id: 009-decoding-settings-3
  fingerprint: ced71313
