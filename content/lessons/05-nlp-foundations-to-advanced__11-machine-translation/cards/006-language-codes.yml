- concept: src_lang задаёт языковой и письменностный контекст исходного текста для токенизатора NLLB
  question: Токенизатор NLLB должен подготовить немецкий текст, записанный латиницей. Какая настройка описывает именно язык и письменность входа?
  explanation: Параметр src_lang сообщает токенизатору язык и письменность исходного текста. forced_bos_token_id относится к языку результата при декодировании, а параметры поиска и длины не выбирают языковой контекст входа.
  kind: choice
  options:
    - src_lang="deu_Latn"
    - forced_bos_token_id для немецкого языкового токена
    - num_beams для выбора немецкой сегментации
    - max_new_tokens для указания письменности
  correct: 0
  id: 006-language-codes-1
  fingerprint: 713c1a72
- concept: код NLLB различает язык и письменность как независимые характеристики
  question: Объясни своими словами, зачем в коде языка NLLB наряду с языком указывать письменность.
  explanation: Языка самого по себе недостаточно, если он допускает несколько систем письма. Например, разные коды для сербского на кириллице и латинице обозначают один язык, но разные ожидаемые алфавиты.
  kind: open
  reference: Один язык может записываться разными письменностями, а одна письменность используется разными языками. Поэтому отдельная часть кода позволяет точно задать ожидаемую систему записи и связанный с ней способ обработки текста.
  id: 006-language-codes-2
  fingerprint: 09f224dc
- concept: соглашения о задании языков нельзя переносить между разными семействами моделей машинного перевода
  question: Инженер переносит код перевода с NLLB на mBART. Можно ли без проверки сохранить те же языковые коды и способ задания исходного и целевого языков?
  explanation: NLLB, mBART и M2M-100 по-разному кодируют и передают языковую информацию. Совпадение общей архитектуры или способа токенизации не делает их специальные токены и параметры взаимозаменяемыми.
  kind: choice
  options:
    - Нет, у семейств моделей разные соглашения о языковых кодах и управляющих токенах
    - Да, все многоязычные encoder-decoder-модели используют единый стандарт
    - Да, если обе модели используют subword-токенизацию
    - Нет, потому что mBART вообще не поддерживает выбор языка
  correct: 0
  id: 006-language-codes-3
  fingerprint: a174b3e5
