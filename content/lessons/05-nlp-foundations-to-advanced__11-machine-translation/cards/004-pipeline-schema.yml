- concept: последовательность преобразований в нейронной системе машинного перевода
  question: Расположите этапы машинного перевода в порядке обработки исходного предложения.
  explanation: 'Стандартный путь имеет вид: токенизация → кодирование → декодирование → детокенизация. На входе и выходе находится обычный текст, а внутри система работает с токенами и их представлениями.'
  kind: order
  items:
    - Токенизатор разбивает исходный текст на subword-токены
    - Энкодер преобразует исходные токены во внутренние представления
    - Декодер порождает токены перевода
    - Детокенизатор собирает целевые токены в читаемый текст
  id: 004-pipeline-schema-1
  fingerprint: c43c2e72
- concept: beam search сравнивает несколько вариантов перевода как целые последовательности
  question: Почему при машинном переводе beam search может дать лучший результат, чем жадное декодирование?
  explanation: Жадное декодирование оставляет только самый вероятный текущий вариант, поэтому ранний неудачный выбор уже нельзя исправить. Beam search временно сохраняет несколько гипотез и выбирает более удачную последовательность целиком.
  kind: choice
  options:
    - Он сохраняет несколько вероятных продолжений и позже сравнивает получившиеся последовательности целиком
    - Он заменяет subword-токены полными словами до запуска декодера
    - Он обучает энкодер заново для каждого переводимого предложения
    - Он гарантирует дословное соответствие каждого исходного токена одному целевому
  correct: 0
  id: 004-pipeline-schema-2
  fingerprint: 78f481c0
- concept: subword-токенизация позволяет обрабатывать редкие и ранее не встречавшиеся слова
  question: Объясните своими словами, зачем токенизатор машинного перевода умеет разбивать редкое слово на subword-части.
  explanation: Словарь полного набора слов был бы огромным и всё равно не покрывал бы новые имена и словоформы. Subword-токены позволяют составлять такие слова из более частых фрагментов.
  kind: open
  reference: Так модель может представить редкое или незнакомое слово с помощью известных частей, не добавляя отдельный элемент словаря для каждой возможной словоформы.
  id: 004-pipeline-schema-3
  fingerprint: 14c9c5fa
