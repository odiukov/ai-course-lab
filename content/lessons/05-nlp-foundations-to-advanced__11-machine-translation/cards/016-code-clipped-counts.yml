- concept: знаменатель modified n-gram precision учитывает все n-граммы перевода без ограничения
  question: Почему при вычислении modified n-gram precision общее количество n-грамм перевода нельзя заменять количеством ограниченных совпадений?
  explanation: В числителе находятся подтверждённые совпадения, а в знаменателе — все n-граммы перевода. Поэтому лишние или не совпавшие с эталоном n-граммы действительно снижают точность.
  kind: open
  reference: Знаменатель должен отражать все n-граммы, предложенные системой. Ограничение применяется только к числу подтверждённых эталоном совпадений; иначе ошибочные и лишние n-граммы исчезнут из знаменателя, а точность окажется завышенной.
