- concept: лексическое сходство по BLEU не гарантирует смысловую точность перевода
  question: Один перевод повторяет лексику эталона, но искажает отрицание. Другой точно передаёт смысл с помощью перефразировки. Как BLEU может оценить эти варианты?
  explanation: BLEU сопоставляет формы по n-граммам и не проверяет смысл, логические отношения или отрицание. Поэтому перевод с большим лексическим пересечением иногда получает более высокий балл, даже если он хуже передаёт содержание.
  kind: choice
  options:
    - Обязательно предпочесть смыслово точный перевод
    - Предпочесть перевод с искажённым смыслом из-за большего совпадения n-грамм
    - Присвоить обоим переводам одинаковую оценку
    - Отказаться от оценки, поскольку BLEU анализирует исходный текст
  correct: 1
  id: 012-bleu-purpose-1
  fingerprint: 392e5ead
- concept: геометрическое среднее снижает BLEU при слабом совпадении n-грамм одного из размеров
  question: У перевода хорошо совпадают с эталоном короткие n-граммы, но почти не совпадают более длинные. Почему итоговый BLEU заметно снижается?
  explanation: BLEU объединяет точности для n-грамм размеров 1–4 геометрическим средним. Поэтому очень низкое совпадение по длинным фрагментам существенно тянет общий результат вниз.
  kind: choice
  options:
    - Штраф за краткость применяется при отсутствии длинных n-грамм
    - BLEU учитывает только совпадения самых длинных n-грамм
    - Геометрическое среднее чувствительно к низкой точности одной из составляющих
    - Совпадения коротких n-грамм полностью исключаются из расчёта
  correct: 2
  id: 012-bleu-purpose-2
  fingerprint: bc26627b
- concept: абсолютные значения BLEU зависят от языка, тестового корпуса и набора эталонов
  question: Почему один порог BLEU нельзя считать универсальной границей хорошего машинного перевода?
  explanation: Ориентиры вроде 30, 40 и 50 BLEU дают лишь грубую интуицию. Между разными корпусами и языками они несопоставимы напрямую, а разница меньше 1 BLEU часто оказывается шумом.
  kind: open
  reference: Значение BLEU зависит от языковой пары, характера тестовых текстов и используемых эталонов. Надёжнее сравнивать системы на одном наборе данных, а небольшие различия проверять статистически и дополнять анализом переводов.
  id: 012-bleu-purpose-3
  fingerprint: 7e88c79e
