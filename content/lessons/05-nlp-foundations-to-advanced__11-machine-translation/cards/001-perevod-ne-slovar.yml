- concept: при переводе синтаксические роли участников могут изменяться
  question: Почему корректный перевод иногда нельзя получить, просто заменив каждое исходное слово словарным эквивалентом и сохранив порядок?
  explanation: 'Языки по-разному кодируют одну и ту же ситуацию: меняются порядок слов, синтаксическая конструкция и роли участников. Поэтому перевод должен учитывать структуру и смысл предложения целиком.'
  kind: choice
  options:
    - В другом языке та же ситуация может выражаться иной структурой предложения и другим распределением грамматических ролей
    - Словари содержат только существительные и не содержат глаголов
    - Все языки используют одинаковую грамматику, но разные алфавиты
    - Перевод обязательно должен быть длиннее исходного предложения
  correct: 0
  id: 001-perevod-ne-slovar-1
  fingerprint: 46043efa
- concept: значение идиомы не складывается из словарных значений её отдельных слов
  question: Объясни своими словами, почему устойчивое выражение обычно нельзя переводить по одному слову.
  explanation: Пословная замена сохраняет отдельные слова, но может уничтожить переносный смысл. Для идиом важен функциональный эквивалент всего выражения, а не соответствие его частей.
  kind: open
  reference: Идиома передаёт закреплённый целостный смысл, который может не следовать из значений составляющих её слов. Переводчик должен подобрать выражение с тем же смыслом и уместным оттенком в целевом языке, даже если его слова и структура отличаются.
  id: 001-perevod-ne-slovar-2
  fingerprint: 9d11d00b
