- concept: токенизатор должен соответствовать словарю и служебным токенам загруженной модели
  question: Почему токенизатор и модель NLLB обычно загружают из одного и того же checkpoint?
  explanation: Модель интерпретирует каждый идентификатор согласно словарю своего checkpoint. Несовместимый токенизатор может присвоить фрагментам текста другие идентификаторы, из-за чего вход потеряет ожидаемый моделью смысл.
  kind: choice
  options:
    - Чтобы идентификаторы токенов и служебные обозначения имели тот смысл, на котором обучалась модель
    - Чтобы токенизатор выполнял beam search вместо модели
    - Чтобы исходный и целевой тексты обязательно имели одинаковую длину
  correct: 0
  id: 010-first-nllb-call-1
  fingerprint: 298be2bd
- concept: generate возвращает последовательности идентификаторов токенов, которые нужно декодировать в текст
  question: Почему результат вызова generate у seq2seq-модели нельзя сразу использовать как готовую строку перевода и какую роль играет skip_special_tokens при декодировании?
  explanation: Генерация работает в пространстве токенов, поэтому её выход остаётся числовой последовательностью. batch_decode восстанавливает строки, а skip_special_tokens скрывает управляющие токены, которые нужны модели, но не должны попадать в перевод.
  kind: open
  reference: generate возвращает тензор с идентификаторами порождённых токенов. Токенизатор преобразует эти идентификаторы обратно в текст, а skip_special_tokens удаляет языковые, начальные, конечные и другие служебные маркеры из отображаемой строки.
  id: 010-first-nllb-call-2
  fingerprint: 72ed8d34
- concept: max_new_tokens задаёт верхнюю границу длины сгенерированного продолжения
  question: Что означает параметр max_new_tokens при вызове generate?
  explanation: Параметр ограничивает число новых токенов декодера, а не задаёт обязательную длину ответа. Генерация может закончиться раньше при появлении токена завершения.
  kind: choice
  options:
    - Модель обязана породить ровно указанное количество токенов
    - Модель может породить не больше указанного количества новых токенов и завершиться раньше
    - Входной текст будет обрезан до указанного количества слов
  correct: 1
