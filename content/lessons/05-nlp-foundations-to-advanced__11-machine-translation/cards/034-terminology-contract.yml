  fingerprint: 590a2ee0
- concept: плейсхолдеры защищают с помощью временной замены, восстановления и последующей проверки
  question: Расположите этапы безопасного перевода строки с программными плейсхолдерами в правильном порядке.
  explanation: 'Плейсхолдеры не передают модели как обычные слова: их защищают метками, после перевода восстанавливают и валидируют. Проверка должна подтвердить, что ни одна служебная вставка не была изменена, потеряна или добавлена.'
  kind: order
  items:
    - Найти плейсхолдеры и временно заменить их безопасными метками
    - Перевести окружающий текст
    - Вернуть исходные плейсхолдеры вместо безопасных меток
    - Проверить точное написание и количество плейсхолдеров
  id: 034-terminology-contract-2
  fingerprint: 819c868a
- concept: целостность плейсхолдеров определяется точным совпадением их значений и количества
  question: Какое условие должна проверять автоматическая валидация плейсхолдеров после машинного перевода?
  explanation: Для работоспособности приложения важны точные служебные фрагменты и кратность каждого из них. Порядок может измениться вместе с грамматикой целевого языка, но переименование, исчезновение или лишнее появление плейсхолдера считается ошибкой.
  kind: choice
  options:
    - Перевод содержит плейсхолдеры того же типа, даже если их имена изменились
    - Множество плейсхолдеров совпадает с исходным по точному написанию и числу вхождений
    - Каждый плейсхолдер расположен на той же позиции среди слов
    - Перевод имеет примерно ту же длину, что и исходная строка
  correct: 1
  id: 034-terminology-contract-3
  fingerprint: 2ce0ff4d
