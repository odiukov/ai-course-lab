- concept: reference-free оценивание требует явного согласия пользователя
  question: У оценщика есть исходный текст и перевод, но нет эталонного перевода. Пользователь не разрешал reference-free оценивание. Как следует поступить?
  explanation: BLEU и chrF сравнивают перевод с эталоном, поэтому без него их корректно вычислить нельзя. COMET-QE или BLEURT-QE могут работать без эталона, но такой режим должен быть явно согласован.
  kind: choice
  options:
    - Оценить BLEU по исходному тексту
    - Запросить эталон либо явное согласие на использование QE-метрики
    - Выдать высокий confidence, если перевод звучит естественно
  correct: 1
  id: 041-shipping-gate-1
  fingerprint: 40b5792d
- concept: шлюз публикации должен включать проверку риска, специфичного для предметной области
  question: Какую дополнительную проверку стоит включить в шлюз публикации юридического перевода помимо общих проверок смысла, языка и стиля?
  explanation: Общая оценка качества может не заметить критическую ошибку в юридически значимом реквизите. Поэтому шлюз дополняют проверкой инвариантов конкретного домена, например имён и ссылок на нормы права.
  kind: open
  reference: Проверить точность имён собственных, реквизитов документов, номеров статей и ссылок на нормативные акты.
  id: 041-shipping-gate-2
  fingerprint: b17d25b0
- concept: определение языка результата является обязательным условием публикации перевода
  question: Заполни пропуск в правиле обязательного шлюза машинного перевода.
  explanation: 'Даже естественно звучащий текст нельзя выпускать без проверки языка результата: многоязычная модель может сгенерировать перевод не на запрошенном языке.'
  kind: cloze
  template: До решения о публикации необходимо выполнить ___ результата перевода.
  answer: проверку языка
  accept:
    - language-ID проверку
    - определение языка
    - идентификацию языка
