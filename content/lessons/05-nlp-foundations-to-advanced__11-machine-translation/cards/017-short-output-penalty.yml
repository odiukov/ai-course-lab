- concept: штраф за краткость экспоненциально снижает BLEU, когда перевод короче эталона
  question: Кандидат перевода содержит 8 токенов, а эталон — 10 токенов. Чему примерно равен brevity penalty?
  explanation: 'Для короткого кандидата показатель экспоненты равен единице минус отношение длины эталона к длине кандидата: exp(−0.25) ≈ 0.78. Этот коэффициент уменьшает итоговый BLEU, даже если оставшиеся слова совпали с эталоном.'
  kind: numeric
  answer: 0.78
  tolerance: 0.02
  id: 017-short-output-penalty-1
  fingerprint: 065d0c12
- concept: brevity penalty не наказывает перевод за превышение длины эталона
  question: Что происходит с brevity penalty, если перевод длиннее эталона?
  explanation: Brevity penalty предназначен только для слишком коротких переводов. Многословный кандидат получает нейтральный коэффициент, но лишние n-граммы увеличивают знаменатель точности и тем самым могут снизить BLEU.
  kind: choice
  options:
    - Он становится нейтральным, а лишние слова могут снизить точность n-грамм
    - Он усиливается пропорционально числу лишних слов
    - Он полностью обнуляет итоговый BLEU
    - Он повышает BLEU за более подробный перевод
  correct: 0
  id: 017-short-output-penalty-2
  fingerprint: 087702d8
