- concept: итоговый BLEU равен произведению brevity penalty и геометрического среднего точностей выбранных n-грамм
  question: Модифицированные точности по четырём порядкам n-грамм равны 0,81; 0,64; 0,49 и 0,16, а brevity penalty равен 0,75. Чему равен BLEU до перевода на шкалу от нуля до ста? Округли до тысячных.
  explanation: 'Геометрическое среднее равно корню четвёртой степени из произведения точностей: (0,81 · 0,64 · 0,49 · 0,16)^(1/4) ≈ 0,449. После применения штрафа получаем 0,75 · 0,449 ≈ 0,337.'
  kind: numeric
  answer: 0.337
  tolerance: 0.002
  id: 019-sentence-bleu-formula-1
  fingerprint: a73a4a33
- concept: сглаживание BLEU предложения предотвращает полное обнуление оценки из-за отсутствия совпадений одного порядка
  question: Зачем при вычислении BLEU для отдельного короткого предложения часто применяют сглаживание?
  explanation: В базовой формуле точности перемножаются, поэтому нулевая точность для любого порядка делает весь BLEU равным нулю. Сглаживание добавляет небольшой ненулевой вклад, что особенно полезно для коротких предложений, где совпадения длинных n-грамм редки.
  kind: choice
  options:
    - Чтобы полностью отменить штраф за краткость
    - Чтобы заменить геометрическое среднее арифметическим
    - Чтобы отсутствие совпадений n-грамм одного порядка не обнуляло всю оценку
    - Чтобы учитывать только совпадения отдельных слов
  correct: 2
  id: 019-sentence-bleu-formula-2
  fingerprint: 4fef2694
