- concept: требуемую формальность перевода задают явным управляющим сигналом или специализированным дообучением
  question: Объясни своими словами, как в производственной системе снизить риск неформального обращения к клиентам при машинном переводе.
  explanation: Одна лишь беглость не гарантирует соответствия корпоративному регистру. Формальность следует задавать явно, а затем проверять языковые признаки вежливости и устойчивость стиля во всём документе.
  kind: open
  reference: Если модель поддерживает управление формальностью, при генерации ей передают явный токен или префикс требуемого регистра. Если такого механизма нет, модель можно дообучить на корпусе формальных текстов. Результат дополнительно проверяют по обращениям, формам глаголов и единообразию стиля.
  id: 037-register-and-formality-2
