- concept: энкодер формирует контекстные представления исходных токенов
  question: Что обычно передаёт энкодер декодеру в трансформере для машинного перевода?
  explanation: Представление каждого токена зависит от окружающего контекста. Благодаря этому декодер получает сведения не только о словах, но и об их значении и роли в конкретном предложении.
  kind: choice
  options:
    - Готовый перевод, который декодеру остаётся только вывести
    - Независимые словарные эквиваленты каждого исходного токена
    - Контекстные представления исходных токенов с учётом всего предложения
  correct: 2
  id: 003-mt-pipeline-1
  fingerprint: e1fa3084
- concept: cross-attention связывает очередной шаг декодирования с представлениями исходного текста
  question: Объясни своими словами, зачем декодеру машинного перевода нужен cross-attention.
  explanation: Декодер учитывает уже созданный перевод, но одного целевого контекста недостаточно. Cross-attention даёт ему доступ к представлениям исходной фразы и помогает сохранить её смысл при генерации.
  kind: open
  reference: Cross-attention позволяет декодеру при выборе следующего целевого токена обращаться к выходам энкодера и сильнее учитывать релевантные части исходного предложения.
  id: 003-mt-pipeline-2
  fingerprint: 3dbfe878
- concept: encoder-decoder обучается переводу на параллельных парах через предсказание целевых токенов
  question: Расположи этапы обучения encoder-decoder модели машинного перевода в правильном порядке.
  explanation: Параллельная пара предоставляет исходный текст и эталонный перевод. Ошибка предсказания следующего целевого токена обучает энкодер сохранять полезный смысл, а декодер — выражать его на целевом языке.
  kind: order
  items:
    - Энкодер строит контекстные представления исходного предложения
    - Декодер предсказывает следующий токен человеческого перевода
    - Предсказание сравнивается с правильным целевым токеном
    - Ошибка используется для обновления параметров модели
  id: 003-mt-pipeline-3
  fingerprint: 1cb9902d
