- concept: корпусная modified n-gram precision вычисляется как отношение суммарных совпадений к суммарному числу n-грамм
  question: Для одного перевода после ограничения частот осталось 6 совпавших биграмм из 13, для другого — 7 из 14. Чему равна корпусная modified bigram precision?
  explanation: 'Нужно сложить счётчики, а не усреднять две точности: (6 + 7) / (13 + 14) = 13 / 27 ≈ 0.4815. Поэтому строки с разным числом биграмм влияют на результат пропорционально числу проверок.'
  kind: numeric
  answer: 0.4815
  tolerance: 0.001
  id: 021-corpus-aggregation-1
  fingerprint: 3a476177
- concept: при корпусном BLEU n-граммы извлекаются отдельно из каждого предложения и не пересекают границы строк
  question: Почему при вычислении корпусного BLEU нельзя сначала склеить все переводы в одну строку, а затем извлечь из неё n-граммы?
  explanation: Корпусная агрегация объединяет количества совпадений и попыток, но не сами тексты. Иначе в оценке появятся последовательности, которых модель ни в одном переводе не выдавала.
  kind: open
  reference: Склеивание создаст искусственные n-граммы, начинающиеся в одном предложении и заканчивающиеся в другом. Нужно отдельно подсчитать n-граммы внутри каждой строки и суммировать только полученные счётчики.
  id: 021-corpus-aggregation-2
  fingerprint: 463934d3
- concept: корпусный brevity penalty вычисляется один раз по суммарным длинам гипотез и эталонов
  question: Как правильно вычислить штраф за краткость для корпусного BLEU?
  explanation: Сначала суммируют длины гипотез и соответствующих эталонов по корпусу. Штраф за краткость вычисляют один раз из этих суммарных длин, поэтому отдельные предложения не получают равного веса независимо от своего размера.
  kind: choice
  options:
    - Вычислить штраф для каждой строки и взять их невзвешенное среднее
    - Сложить длины всех гипотез и эталонов, а затем один раз вычислить штраф
    - Применить штраф только к самой короткой гипотезе
    - Вычислить штраф отдельно для каждого порядка n-грамм
  correct: 1
  id: 021-corpus-aggregation-3
  fingerprint: 459c953c
