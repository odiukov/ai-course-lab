- concept: learned-метрики приближают человеческую оценку смысла, но требуют более тяжёлого запуска и хуже интерпретируются
  question: Объясни своими словами, почему learned-метрика способна высоко оценить корректный перевод-перефразирование и в чём её недостаток по сравнению с эвристической метрикой.
  explanation: COMET, BLEURT и BERTScore используют нейросетевые представления и лучше распознают смысловую близость. Обратная сторона — дополнительные вычисления и менее прозрачная интерпретация результата.
  kind: open
  reference: Learned-метрика обучена на человеческих оценках и сопоставляет смысл перевода с источником и эталоном, поэтому не требует буквального совпадения формулировок. При этом её вычисление тяжелее, а происхождение конкретного значения труднее объяснить, чем у метрики совпадений.
  id: 028-three-tier-evaluation-2
  fingerprint: 32b89c53
- concept: эвристические метрики удобны для быстрого мониторинга регрессий и сравнения с прежними результатами
  question: Команде нужна быстрая и воспроизводимая метрика для регулярного поиска регрессий и сопоставления новой версии переводчика со старыми экспериментами. Эталонные переводы доступны. Какое семейство выбрать для этого сигнала?
  explanation: BLEU и chrF быстро вычисляются по эталону, воспроизводимы и удобны для отслеживания изменений между версиями. Однако для решения о качестве продукта их следует дополнять смысловой метрикой или LLM-судьёй.
  kind: choice
  options:
    - Только ручную экспертную оценку
    - LLM-судью без рубрики
    - Эвристические метрики BLEU или chrF
    - Оценку по длине исходного текста
  correct: 2
