- concept: соответствие между исходными и целевыми словами не обязано быть взаимно однозначным
  question: Почему перевод нельзя всегда представить как пары «одно исходное слово — одно целевое слово»?
  explanation: 'В машинном переводе границы смысловых единиц между языками часто не совпадают: одному слову может соответствовать целая конструкция и наоборот.'
  kind: open
  reference: Одно слово может переводиться несколькими словами, несколько исходных слов — одним выражением, а длины предложений могут различаться. Поэтому соответствия нужно определять с учётом контекста всей фразы.
