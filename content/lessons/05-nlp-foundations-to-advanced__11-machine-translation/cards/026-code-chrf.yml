- concept: chrF зависит от политики нормализации сравниваемых строк
  question: Как должна вести себя реализация chrF, если её контракт не предусматривает нормализацию текста?
  explanation: Символьные метрики зависят от подготовки текста. Скрытая нормализация меняет набор символьных n-грамм и делает результат несовместимым с заявленным контрактом.
  kind: choice
  options:
    - Автоматически приводить буквы к нижнему регистру
    - Удалять всю пунктуацию
    - Заменять последовательности пробелов одним пробелом
    - Сравнивать строки в переданном виде, учитывая регистр, пунктуацию и пробелы
  correct: 3
  id: 026-code-chrf-1
  fingerprint: 7e4f7ea2
- concept: отсутствующие порядки символьных n-грамм требуют явно определённой обработки
  question: Объясни, как при вычислении chrF обработать порядок n-грамм, для которого короткая строка не содержит ни одного фрагмента.
  explanation: Если n-грамм данного порядка нет, точность или полнота для него математически не определена. Явная обработка таких порядков предотвращает деление на ноль и необоснованный штраф за малую длину строки.
  kind: open
  reference: Нельзя вычислять отношение с нулевым знаменателем. Такой недоступный порядок следует исключить из соответствующего усреднения согласно контракту метрики; пустые входы необходимо обработать отдельно. Иначе короткие одинаковые строки могут получить заниженную оценку или вычисление завершится ошибкой.
  id: 026-code-chrf-2
