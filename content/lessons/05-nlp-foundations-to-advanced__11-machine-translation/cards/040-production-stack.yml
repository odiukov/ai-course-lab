- concept: квантованный Marian подходит для перевода непосредственно в браузере
  question: Переводчик для одной популярной языковой пары должен работать на устройстве пользователя с минимальной задержкой и без отправки текста на сервер. Какой вариант наиболее уместен?
  explanation: Квантованный Marian можно уменьшить примерно до 50 МБ и запускать через ONNX прямо в браузере. После загрузки модели перевод не требует сетевого запроса, поэтому снижаются задержка и нагрузка на сервер.
  kind: choice
  options:
    - Квантованный Marian в формате ONNX
    - Серверная NLLB
