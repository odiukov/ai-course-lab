- concept: mBART предпочтителен для ограниченного набора направлений перевода с английским в центре
  question: Объясни своими словами, при каких требованиях к языковым направлениям стоит сначала попробовать mBART, а не NLLB.
  explanation: mBART-50 ориентирован на качественный перевод примерно для 50 языков с английским в центре. NLLB-200 уместнее, если ключевым требованием становится значительно более широкий языковой охват.
  kind: open
  reference: mBART стоит рассматривать, когда большинство направлений перевода связано с английским, требуется поддержка ограниченного набора распространённых языков и широкий охват редких языков NLLB не нужен.
