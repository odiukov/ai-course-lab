- concept: размер модели выбирают как минимальный вариант, удовлетворяющий ограничениям памяти и требованиям к качеству
  question: Объясни своими словами, почему для машинного перевода не следует автоматически выбирать самую большую доступную модель.
  explanation: NLLB 600M может быть достаточной для нужной языковой пары и помещаться на ноутбуке, тогда как 3.3B требует около 13 ГБ только для весов в float32, а 54.5B — около 218 ГБ. Увеличивать модель разумно лишь при подтверждённой нехватке качества.
