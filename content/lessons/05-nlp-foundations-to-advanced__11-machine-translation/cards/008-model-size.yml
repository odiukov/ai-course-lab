- concept: обычная оперативная память не компенсирует нехватку видеопамяти при выполнении модели на GPU
  question: Модель должна полностью выполняться на видеокарте, но её веса и рабочие данные не помещаются в VRAM. Какое утверждение верно?
  explanation: Для выполнения на GPU критична именно его видеопамять. Например, 16 ГБ системной RAM не добавляют видеокарте недостающую VRAM; перенос части вычислений в RAM требует отдельного механизма и обычно замедляет работу.
  kind: choice
  options:
    - Избыток обычной RAM сам по себе не увеличивает доступную модели VRAM
    - Можно сложить объёмы RAM и VRAM и сравнить сумму с потребностью модели
    - Если файл модели помещается на диске, объёма VRAM всегда достаточно
