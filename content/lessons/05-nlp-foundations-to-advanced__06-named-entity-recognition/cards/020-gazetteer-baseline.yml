- concept: газетир распознаёт сущность только при точном совпадении токена с записью
  question: В газетире организаций есть запись «OpenAI», но нет записи «openai». Какую метку поставит регистрозависимый поиск токену «openai»?
  explanation: Проверка принадлежности множеству сравнивает строки точно, включая регистр. Поэтому «openai» не совпадает с «OpenAI» и получает метку O.
  kind: choice
  options:
    - B-ORG
    - B-PRODUCT
    - O
    - I-ORG
  correct: 2
  id: 020-gazetteer-baseline-1
  fingerprint: '60710704'
- concept: газетир служит детерминированным baseline без обучения для известных однословных сущностей
  question: Объясни своими словами, почему газетир подходит в качестве простого baseline для распознавания известных однословных сущностей.
  explanation: Газетир выполняет фиксированный словарный поиск. Одинаковый известный токен всегда получает одну и ту же метку, а качество более сложной системы можно сравнить с этим простым воспроизводимым решением.
  kind: open
  reference: 'Газетир не требует обучения: он сопоставляет каждый токен с заранее заданной записью и её типом. Для известного однословного названия точное совпадение сразу даёт стабильную метку, поэтому такой метод удобно использовать как стартовый результат для сравнения с более сложными моделями.'
  id: 020-gazetteer-baseline-2
  fingerprint: dc1eec37
