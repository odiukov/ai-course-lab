- concept: span-based NER независимо типизирует и оценивает интервалы, поэтому может сохранять вложенные сущности
  question: Объясните своими словами, как span-based NER может представить вложенные сущности, занимающие перекрывающиеся участки текста.
  explanation: В потокеновой схеме каждой позиции назначается одна метка, что не позволяет одновременно включить её в разные сущности. В span-based представлении типы относятся к интервалам целиком, поэтому вложенные кандидаты могут сосуществовать.
  kind: open
  reference: Модель рассматривает каждый кандидатный интервал как отдельный объект и независимо назначает ему тип и оценку. Поэтому внешний интервал может быть сущностью одного типа, а вложенный в него интервал — сущностью другого типа.
  id: 042-bilou-and-spans-2
  fingerprint: 95d78678
