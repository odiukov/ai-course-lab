- concept: тип сущности в метке BIO не может быть пустым
  question: Какую метку валидатор BIO должен отклонить независимо от соседних меток?
  explanation: После префикса B- или I- должен быть указан непустой тип сущности. Поэтому B- — некорректная метка, тогда как B-ORG и O имеют допустимую форму.
  kind: choice
  options:
    - B-ORG
    - O
    - B-
  correct: 2
  id: 012-is-valid-bio-1
  fingerprint: 20aba9d2
- concept: пустая BIO-последовательность считается валидной
  question: Должен ли валидатор BIO считать пустой список меток корректной последовательностью? Объясни почему.
  explanation: Валидность нарушается только конкретной ошибочной меткой или переходом. Если элементов нет, нарушить правила BIO нечему.
  kind: open
  reference: Да. В пустой последовательности нет ни некорректных меток, ни запрещённых переходов, поэтому проверка должна вернуть True.
  id: 012-is-valid-bio-2
  fingerprint: 7787f6e9
