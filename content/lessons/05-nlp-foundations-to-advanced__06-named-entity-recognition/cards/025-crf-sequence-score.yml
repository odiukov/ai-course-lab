- concept: L1-регуляризация обнуляет часть весов признаков, а L2-регуляризация плавно уменьшает веса
  question: Как различаются роли L1- и L2-регуляризации при обучении CRF с большим числом признаков?
  explanation: 'L1 способствует разреженности: часть весов становится равной нулю, поэтому модель получается компактнее. L2 штрафует большие веса более плавно, снижая переобучение и чувствительность модели к отдельным примерам.'
  kind: choice
  options:
    - L1 может полностью обнулить бесполезные веса, а L2 обычно уменьшает веса и делает модель стабильнее
    - L1 уменьшает только веса переходов, а L2 удаляет редкие BIO-метки
    - L1 обычно увеличивает все веса, а L2 фиксирует их значения
    - Обе регуляризации действуют только на длину предложений
