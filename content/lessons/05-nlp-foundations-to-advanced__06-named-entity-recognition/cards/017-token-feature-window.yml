- concept: нормализованное написание и признаки регистра сохраняют разные сведения о токене
  question: Объясни своими словами, зачем в классическом NER одновременно использовать token.lower() и признаки регистра вроде is_upper или is_title.
  explanation: Приведение к нижнему регистру уменьшает различия между вариантами написания, но стирает капитализацию. Отдельные флаги регистра возвращают этот сильный для NER сигнал, поэтому признаки дополняют друг друга.
  kind: open
  reference: token.lower() даёт модели нормализованную лексическую форму и объединяет варианты написания одного слова, а is_upper и is_title отдельно сохраняют сведения о капитализации, полезные для распознавания имён собственных и аббревиатур.
  id: 017-token-feature-window-2
  fingerprint: f9e21a9f
