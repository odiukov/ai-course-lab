- concept: однословная сущность получает метку B и не нуждается в метке I
  question: Объясните своими словами, почему однословную сущность «Осло» следует пометить B-GPE, хотя после неё нет I-GPE.
  explanation: 'Метка B одновременно открывает сущность и задаёт её тип. Метка I не обязательна: она появляется только тогда, когда сущность продолжается следующим токеном.'
  kind: open
  reference: B-GPE обозначает начало сущности и поэтому требуется даже для сущности из одного токена. I-GPE ставится только на последующие токены той же сущности, которых у однословного названия нет.
  id: 006-begin-inside-2
  fingerprint: f101b2e4
