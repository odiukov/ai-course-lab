- concept: spans_to_bio отклоняет span, если хотя бы одна его позиция уже размечена
  question: Заполните условие, которое обнаруживает пересечение нового span с ранее обработанными сущностями.
  explanation: Проверяется весь полуинтервал от start до end. Любая метка, отличная от O, означает, что соответствующий токен уже принадлежит сущности и новый span пересекается с ней.
  kind: cloze
  template: |-
    if ___:
        raise ValueError("overlapping spans")
  answer: any(labels[i] != "O" for i in range(start, end))
  accept:
    - any(labels[pos] != "O" for pos in range(start, end))
    - any(value != "O" for value in labels[start:end])
  id: 008-spans-to-bio-1
  fingerprint: f2a458bc
- concept: полуинтервал span преобразуется в B-метку на start и I-метки до исключённой границы end
  question: Объясните своими словами, какие BIO-метки получает диапазон (start, end, label) и почему позиция end не изменяется.
  explanation: 'Такие границы совпадают с семантикой срезов Python: start включён, end исключён. Поэтому B ставится в начале сущности, а I — только на её оставшихся токенах.'
  kind: open
  reference: Позиция start получает B-label, позиции после start и до end получают I-label, а сама позиция end не входит в сущность, поскольку границы span задаются полуинтервалом.
  id: 008-spans-to-bio-2
  fingerprint: e6830c95
