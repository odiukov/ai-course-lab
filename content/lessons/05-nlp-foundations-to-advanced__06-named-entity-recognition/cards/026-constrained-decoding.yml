- concept: корректность BIO-формы не гарантирует семантически правильное распознавание сущности
  question: Объясни своими словами, что гарантирует ограниченное BIO-декодирование и какую ошибку оно всё ещё может допустить.
  explanation: Ограничения устраняют структурно невозможные цепочки, но не проверяют соответствие меток смыслу текста. Поэтому допустимая последовательность всё равно может описывать сущность неправильно.
  kind: open
  reference: Оно гарантирует, что выбранная последовательность меток соблюдает структуру BIO, но модель всё ещё может поставить допустимые метки с неверным типом сущности или выбрать неверные границы.
  id: 026-constrained-decoding-2
  fingerprint: c8f8e2c3
