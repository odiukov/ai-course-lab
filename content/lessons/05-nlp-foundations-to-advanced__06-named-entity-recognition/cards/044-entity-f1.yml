- concept: преобразование spans в множества устраняет повторяющиеся записи
  question: Как повтор одного и того же предсказанного span повлияет на entity-level F1, если перед сравнением коллекции spans преобразуются в множества?
  explanation: Элементы множества уникальны, поэтому идентичные spans схлопываются. Пересечение и разности множеств учитывают такой span только один раз.
  kind: open
  reference: 'Повтор не повлияет на результат: множество сохранит только одну копию одинаковой тройки границ и типа.'
