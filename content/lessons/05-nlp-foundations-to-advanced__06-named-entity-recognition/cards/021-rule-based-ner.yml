- concept: потокеновый поиск не способен сопоставить многословную запись газетира
  question: Почему запись `San Francisco` в газетире не найдётся при поочерёдной проверке отдельных токенов `San` и `Francisco`? Какой подход устраняет это ограничение?
  explanation: Потокеновый цикл сравнивает со словарём только один токен за раз и потому не видит фраз. Фразовый поиск с выбором самого длинного совпадения позволяет распознавать многословные сущности и корректно определять их границы.
  kind: open
  reference: Ни один отдельный токен не равен строке `San Francisco`, поэтому совпадения не будет. Нужно сопоставлять последовательности токенов с фразами газетира, обычно выбирая самое длинное найденное совпадение.
  id: 021-rule-based-ner-2
  fingerprint: 5afdc8e8
