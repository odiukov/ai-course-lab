- concept: редкие типы сущностей требуют целевого сбора и разметки собственных примеров
  question: В обучающем корпусе много упоминаний людей, но почти нет примеров нежелательных реакций на лекарства. Какое действие наиболее непосредственно поможет модели распознавать редкий тип ADVERSE_EVENT?
  explanation: Само наличие метки в выходной схеме не обучает модель распознавать её. Для редкого типа нужны размеченные примеры с характерным контекстом, вариантами формулировок и согласованными границами.
  kind: choice
  options:
    - Собрать и разметить репрезентативные упоминания ADVERSE_EVENT из целевого домена
    - Добавить название ADVERSE_EVENT в список меток без изменения корпуса
    - Увеличить долю примеров с именами людей
    - Применить более длинный список известных персон
