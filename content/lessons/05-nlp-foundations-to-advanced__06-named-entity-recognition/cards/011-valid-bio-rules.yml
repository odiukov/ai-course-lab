  fingerprint: 7ce1f4d9
- concept: после O нельзя непосредственно ставить I-метку
  question: Предыдущий токен имеет метку O. Какая следующая метка образует некорректный BIO-переход?
  explanation: O означает, что открытой сущности нет. Поэтому I-PER нечего продолжать; сначала сущность должна быть открыта меткой B-PER. Переходы O → O и O → B-PER корректны.
  kind: choice
  options:
    - I-PER
    - B-PER
    - O
  correct: 0
