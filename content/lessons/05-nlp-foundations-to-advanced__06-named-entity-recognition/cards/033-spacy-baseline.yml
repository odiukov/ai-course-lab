- concept: универсальная схема типов сущностей может не соответствовать прикладной онтологии
  question: Почему даже правильно найденные и правдоподобно типизированные сущности готовой NER-модели могут оказаться бесполезными для прикладной системы?
  explanation: Качество NER зависит не только от обнаружения фрагментов. Если приложению нужны специальные категории, универсальные типы вроде ORG или PRODUCT могут быть слишком грубыми, а редкие доменные типы потребуют другой модели, настройки схемы или дообучения.
  kind: open
  reference: 'Схема типов готовой модели может не совпадать с прикладной онтологией: слишком общие метки не разделяют нужные категории, а некоторых доменных типов в модели может вообще не быть.'
  id: 033-spacy-baseline-2
  fingerprint: b4ed6262
- concept: готовая NER-модель служит быстрой точкой отсчёта, а не доказательством готовности к продакшену
  question: Какова основная инженерная ценность быстрого запуска предобученной NER-модели в новом проекте?
  explanation: Готовая модель быстро показывает стартовое качество и характер ошибок. Такой baseline полезен для сравнения решений, но сам по себе не подтверждает достаточную точность или соответствие доменной схеме типов.
  kind: choice
  options:
    - Она сразу заменяет разметку и проверку качества
    - Она гарантирует совместимость своих типов с бизнес-задачей
    - Она даёт исходный уровень качества, с которым можно сравнивать последующие модели и улучшения
  correct: 2
  id: 033-spacy-baseline-3
