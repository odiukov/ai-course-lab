- concept: для обучения контекстных признаков BiLSTM требуется достаточно большой размеченный корпус
  question: Почему на небольшом размеченном корпусе BiLSTM-CRF может лишь умеренно превосходить CRF с качественными ручными признаками?
  explanation: BiLSTM должна по разметке научиться извлекать полезные контекстные признаки. При малом корпусе сильные ручные признаки могут оставаться конкурентоспособными; заметное преимущество обычно требует значительно больше размеченных предложений.
  kind: choice
  options:
    - CRF отключает обучение эмбеддингов, если данных мало
    - Выученным контекстным признакам нужны размеченные примеры, тогда как ручные признаки заранее задают полезные закономерности
    - Двунаправленная LSTM работает только с очень большими пакетами данных
