- concept: при малом объёме разметки дообучение трансформера допустимо только при наличии предобученной доменной модели
  question: Для узкой клинической задачи собрано 240 размеченных документов, но предобученной модели медицинского домена нет. Что должен сказать советчик о дообучении трансформера и почему?
  explanation: Контракт запрещает рекомендовать fine-tuning трансформера при объёме менее 500 размеченных примеров, если у команды уже нет предобученной модели нужного домена.
  kind: open
  reference: 'Советчик должен отказаться рекомендовать дообучение трансформера: данных слишком мало, а подходящего доменного предобучения нет. Следует рассмотреть менее требовательный к данным подход, например CRF или правила с газетиром.'
