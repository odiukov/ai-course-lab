- concept: склеивание соседних срабатываний одного типа может объединить разные сущности
  question: Газетир пометил соседние токены «Sony Samsung» как B-ORG, B-ORG. Почему нельзя безусловно заменить вторую метку на I-ORG?
  explanation: Одинаковый тип и соседство токенов ещё не доказывают, что они образуют одну сущность. Поэтому механическое преобразование соседних B-ORG в цепочку B-ORG/I-ORG способно испортить правильные границы.
  kind: open
  reference: Токены могут обозначать две разные организации, стоящие рядом. Безусловная замена создаст один ложный span «Sony Samsung» вместо двух самостоятельных сущностей.
  id: 022-gazetteer-limits-2
  fingerprint: 1ea031ec
