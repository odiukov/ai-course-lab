- concept: NER представляет найденную сущность как типизированный фрагмент с координатами в исходном документе
  question: Какая запись лучше всего подходит для передачи результата NER в систему обработки документов?
  explanation: 'NER превращает сущность в структурированную запись: сохраняет её значение, тип и границы исходного фрагмента. Так результат можно обрабатывать программно и при необходимости связывать с точным местом в документе.'
  kind: choice
  options:
    - Название сущности, её тип и начальная и конечная позиции в документе
    - Полный документ и число найденных слов
    - Только название сущности без типа и позиции
    - Список всех слов документа в алфавитном порядке
  correct: 0
  id: 002-ner-usecases-1
  fingerprint: f71658a9
- concept: координаты сущности позволяют находить каждое конкретное упоминание в исходном документе
  question: Объясните своими словами, зачем результат NER должен хранить позиции каждого упоминания сущности, даже если её название уже известно.
  explanation: Одно название может встречаться многократно и в разных контекстах. Координаты позволяют обратиться к конкретному упоминанию, а не только установить факт присутствия сущности в документе.
  kind: open
  reference: Позиции связывают каждое извлечённое упоминание с конкретным фрагментом исходного документа. Они позволяют открыть нужный контекст, различать повторные упоминания и выполнять над ними отдельные действия, например обезличивание или разметку.
  id: 002-ner-usecases-2
  fingerprint: fd3560f6
