- concept: subword-предсказания относятся к частям одного исходного слова, а не обязательно к разным сущностям
  question: В сыром выводе трансформерного NER подряд появились `Bio` с меткой `B-ORG` и `##Nex` с меткой `I-ORG`. Как это следует интерпретировать?
  explanation: Префикс `##` обозначает продолжение исходного слова в BERT-подобной токенизации. Совместимые метки `B-ORG` и `I-ORG` позволяют восстановить единое упоминание `BioNex`.
  kind: choice
  options:
    - Как одно упоминание организации `BioNex`, разбитое токенизатором на subword-токены
    - Как независимые сущности `Bio` и `Nex`
    - Как ошибку BIO, потому что метка `I-ORG` запрещена для частей слова
  correct: 0
  id: 034-hf-aggregation-1
  fingerprint: 3bc4a8ce
- concept: агрегация NER является постобработкой и не исправляет ошибочно предсказанный тип сущности
  question: Все subword-токены названия лекарства получили метки `B-MISC` и `I-MISC`. Объясни, почему агрегация не вернёт тип `DRUG` и что нужно менять для получения правильного типа.
  explanation: Постобработка восстанавливает границы и текст сущности по готовым предсказаниям, но не выполняет повторную классификацию. Ошибку типа исправляют выбором или обучением модели, а не стратегией склейки.
  kind: open
  reference: Агрегация только объединяет совместимые токенные метки в цельный span и сохраняет предсказанный моделью тип `MISC`. Для типа `DRUG` нужна модель, поддерживающая такую онтологию, либо дообучение на подходящей разметке.
  id: 034-hf-aggregation-2
  fingerprint: 4c8aedb0
