- concept: схема типов ограничивает семантику меток, а схема ответа — форму представления результата
  question: Почему требование вернуть корректный JSON само по себе не гарантирует, что LLM будет использовать единообразные типы сущностей? Что нужно добавить в запрос?
  explanation: Структурированный формат делает ответ удобным для программного разбора, но не устраняет семантический дрейф меток. За единообразие категорий отвечает отдельная схема типов, а за стабильную запись полей — схема ответа.
  kind: open
  reference: 'JSON ограничивает синтаксис ответа, но не определяет допустимую онтологию: модель всё ещё может обозначать близкие сущности разными типами. В запрос нужно добавить закрытый список типов с краткими определениями и потребовать выбирать метки только из него.'
  id: 035-llm-zero-shot-2
