- concept: RAG в динамическом NER извлекает демонстрации разметки, а не готовый ответ
  question: Объясните своими словами, какую информацию извлекает RAG при формировании динамического few-shot промпта для NER и как LLM её использует.
  explanation: В таком варианте RAG служит механизмом подбора релевантных образцов. Извлечённые примеры показывают модели, какие фрагменты считать сущностями и какие типы им назначать.
  kind: open
  reference: RAG находит в затравочной коллекции похожие размеченные тексты с границами и типами сущностей. Эти случаи добавляются в промпт как демонстрации, по которым LLM выполняет разметку нового текста; сам поиск не выдаёт готовую разметку нового текста.
  id: 036-dynamic-rag-2
  fingerprint: 9e10bbf1
- concept: качество и покрытие затравочной коллекции ограничивают пользу динамического few-shot
  question: В коллекции для динамического few-shot названия лекарств систематически размечены как организации, а примеров типа «лабораторный показатель» нет. Как это повлияет на NER?
  explanation: Динамический подбор повышает релевантность примеров, но не исправляет их содержание и не создаёт отсутствующее покрытие. Ошибки и пробелы затравочной коллекции переходят в промпт.
  kind: choice
  options:
    - Ошибочные демонстрации могут закрепить неверный тип, а для отсутствующего типа поиск не найдёт подходящих образцов
    - LLM гарантированно исправит разметку коллекции благодаря сходству текстов
    - Поиск автоматически создаст корректные примеры отсутствующего типа
    - Недостатки коллекции повлияют только на формат JSON, но не на распознавание сущностей
  correct: 0
  id: 036-dynamic-rag-3
  fingerprint: 60e345b5
