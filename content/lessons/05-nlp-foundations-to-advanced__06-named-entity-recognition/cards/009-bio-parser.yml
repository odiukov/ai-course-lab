- concept: I-метка продолжает только открытую сущность того же типа
  question: Заполни условие, при котором BIO-декодер может продлить текущий span.
  explanation: Метка I-PER может продлить открытый PER-span, но не span другого типа. В приведённом bio_to_spans несовместимая I-метка попадает в ветку else и закрывает текущий span.
  kind: cloze
  template: 'if tag_is_I and open_span and tag_type == ___: extend_span()'
  answer: open_span_type
  accept:
    - current_type
    - тип открытого span
    - тип текущей сущности
  id: 009-bio-parser-1
  fingerprint: 5606d332
- concept: B-метка закрывает текущий span перед открытием новой сущности
  question: Расставь действия BIO-декодера при встрече B-метки, когда один span уже открыт.
  explanation: B означает начало новой сущности. Поэтому предыдущий span сначала сохраняется, даже если между сущностями нет O, а затем открывается новый.
  kind: order
  items:
    - Сохранить ранее открытый span
    - Создать новый текущий span с типом B-метки
    - Продолжить проход со вновь открытым span
  id: 009-bio-parser-2
  fingerprint: 86c2cb04
- concept: открытый span нужно сохранить после завершения BIO-цепочки
  question: Объясни своими словами, зачем BIO-декодеру нужна отдельная проверка открытого span после окончания цикла по меткам.
  explanation: Внутри цикла span обычно сохраняется при B, O или несовместимой метке. Конец входа сам по себе не выполняет ни одну из этих веток, поэтому последнюю незакрытую сущность сохраняют после цикла.
  kind: open
  reference: Если последовательность закончилась на B- или совместимой I-метке, закрывающей O-метки уже не будет. Поэтому оставшийся текущий span нужно явно добавить в результат, иначе последняя сущность потеряется.
  id: 009-bio-parser-3
  fingerprint: f736c329
