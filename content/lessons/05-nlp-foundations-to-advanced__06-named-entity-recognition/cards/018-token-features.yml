- concept: наличие цифры в токене вычисляется как логический признак по всем его символам
  question: Заполни выражение для логического признака, который сообщает, содержит ли токен хотя бы одну цифру.
  explanation: Генератор проверяет каждый символ, а any возвращает True, если хотя бы одна проверка успешна. Поэтому модель получает логическое значение, а не строку.
  kind: cloze
  template: '"has_digit": ___'
  answer: any(c.isdigit() for c in token)
  accept:
    - any(ch.isdigit() for ch in token)
    - any(char.isdigit() for char in token)
  id: 018-token-features-1
  fingerprint: 51a525cb
