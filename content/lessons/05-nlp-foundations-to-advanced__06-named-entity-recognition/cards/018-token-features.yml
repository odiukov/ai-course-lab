- concept: наличие цифры в токене вычисляется как логический признак по всем его символам
  question: Заполни выражение для логического признака, который сообщает, содержит ли токен хотя бы одну цифру.
  explanation: Генератор проверяет каждый символ, а any возвращает True, если хотя бы одна проверка успешна. Поэтому модель получает логическое значение, а не строку.
  kind: cloze
  template: '"has_digit": ___'
  answer: any(c.isdigit() for c in token)
  accept:
    - any(ch.isdigit() for ch in token)
    - any(char.isdigit() for char in token)
  id: 018-token-features-1
  fingerprint: 51a525cb
- concept: суффиксный признак помогает обобщать морфологические закономерности на незнакомые слова
  question: Почему признак, содержащий окончание токена в нижнем регистре, может быть полезен классической модели NER?
  explanation: Одинаковые окончания часто связаны с похожими морфологическими классами, например с географическими названиями. Это полезный статистический сигнал, но он не определяет тип сущности сам по себе.
  kind: choice
  options:
    - Он позволяет замечать общие окончания у слов, которых модель раньше не встречала
    - Он однозначно определяет тип любой именованной сущности
    - Он восстанавливает полный токен независимо от его длины
    - Он заменяет необходимость учитывать остальные признаки
  correct: 0
  id: 018-token-features-2
  fingerprint: 98f1d0f6
- concept: единая схема признаков необходима для стабильного преобразования токенов в входные данные модели
  question: Почему token_features должна возвращать одинаковый набор ключей для каждого токена, включая токены на границах предложения?
  explanation: Классическая модель ожидает согласованное пространство признаков. Если ключи появляются и исчезают в зависимости от позиции токена, подготовка данных становится неоднозначной и может по-разному кодировать сходные наблюдения.
  kind: open
  reference: Одинаковые ключи задают стабильную схему признаков, которую можно последовательно преобразовать в векторы для обучения и предсказания. На границах меняются значения признаков, но не сама структура записи.
  id: 018-token-features-3
  fingerprint: 5f59a4c7
