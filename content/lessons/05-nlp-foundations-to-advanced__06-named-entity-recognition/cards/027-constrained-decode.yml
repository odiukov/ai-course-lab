- concept: значение состояния динамической программы равно локальной оценке плюс лучший накопленный балл среди допустимых предшественников
  question: Для текущего тега B-LOC накопленные баллы допустимых предшественников O, B-PER и I-PER равны 2.4, -0.7 и 3.1. Локальная оценка B-LOC равна 0.6, переходных штрафов нет. Какой балл нужно сохранить для B-LOC?
  explanation: 'Нужно выбрать лучший допустимый предшествующий балл и прибавить локальную оценку: max(2.4, -0.7, 3.1) + 0.6 = 3.7.'
  kind: numeric
  answer: 3.7
  tolerance: 0.001
  id: 027-constrained-decode-1
  fingerprint: 74e13414
- concept: оптимальная цепочка восстанавливается обратным проходом по сохранённым указателям
  question: Расположи действия constrained-декодера в правильном порядке.
  explanation: Прямой проход вычисляет лучшие баллы и сохраняет предшественников. После выбора лучшего конечного состояния указатели дают цепочку в обратном порядке, поэтому результат разворачивают.
  kind: order
  items:
    - Инициализировать баллы допустимых начальных тегов
    - Для каждой следующей позиции сохранить лучший допустимый предшествующий тег каждого состояния
    - Выбрать конечный тег с наибольшим накопленным баллом
    - Пройти по указателям от конечного тега к началу
    - Развернуть восстановленную последовательность
  id: 027-constrained-decode-2
  fingerprint: e504887d
- concept: плотное динамическое декодирование по всем парам соседних тегов имеет сложность O(n·k²)
  question: Есть n токенов и k возможных тегов. Для каждого текущего тега constrained-декодер проверяет все предыдущие теги, а допустимость перехода проверяется за константное время. Какова временная сложность алгоритма?
  explanation: На каждой из n позиций обрабатываются k текущих тегов, и для каждого рассматриваются k предшественников. Поэтому требуется O(n·k²) операций.
  kind: choice
  options:
    - O(k^n)
    - O(n·k²)
    - O(n·k)
    - O(n²·k)
  correct: 1
