- concept: Витерби выбирает глобально наиболее вероятную цепочку тегов, а не лучшие локальные теги по отдельности
  question: Почему в HMM тег с не самой высокой эмиссионной вероятностью для отдельного токена всё же может войти в итоговую разметку?
  explanation: Независимый выбор тегов по эмиссиям игнорировал бы структуру последовательности. Витерби учитывает оба источника вероятности и оптимизирует общий балл всей цепочки.
  kind: open
  reference: HMM оценивает полную цепочку по эмиссиям и переходам между тегами. Более естественные переходы могут перевесить слабую локальную эмиссию, а алгоритм Витерби выберет цепочку с наибольшей общей вероятностью.
  id: 024-hmm-sequence-2
  fingerprint: dc678b37
