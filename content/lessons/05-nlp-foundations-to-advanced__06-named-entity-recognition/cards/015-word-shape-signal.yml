- concept: форма слова заменяет буквы и цифры маркерами их классов, сохраняя знаки и позиции
  question: Какую форму слова вернёт функция, заменяющая заглавные буквы на X, строчные на x, цифры на d, а остальные символы оставляющая без изменений, для токена «eBay-R8»?
  explanation: В «eBay-R8» строчная e превращается в x, заглавные B и R — в X, строчные a и y — в x, цифра — в d, а дефис сохраняется. Получается xXxx-Xd.
  kind: choice
  options:
    - xXxx-Xd
    - Xxxx-Xd
    - xXxx-XX
    - xxxx-xd
  correct: 0
  id: 015-word-shape-signal-1
  fingerprint: eaa2623b
- concept: одинаковая форма помогает обобщать на незнакомые токены, но не позволяет восстановить конкретное слово
  question: Объясните своими словами, почему признак формы слова может помочь NER распознать ранее не встречавшуюся сущность, но не может сам по себе определить, какое именно слово было во входе.
  explanation: Например, «USA-2024» и «IBM-1401» имеют одну форму XXX-dddd. Это позволяет переносить выученный сигнал на новое название, но форма остаётся неоднозначным признаком и не хранит само название.
  kind: open
  reference: Форма слова сохраняет шаблон регистра, цифр, длины и знаков, поэтому модель может сопоставить незнакомый токен с уже изученным структурным паттерном. При этом буквы заменяются общими маркерами, и одной форме соответствует множество разных токенов, поэтому исходное слово восстановить нельзя.
  id: 015-word-shape-signal-2
  fingerprint: 4b966349
