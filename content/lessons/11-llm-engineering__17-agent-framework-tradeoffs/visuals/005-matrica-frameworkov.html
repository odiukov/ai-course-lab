<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Матрица фреймворков</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#22201d; --muted:#6b6560;
    --axis:#8a8378; --grid:#e2ded6; --card:#ffffff;
    --lg:#2f6f4f; --crew:#8a5a1f; --auto:#1f5f8a; --agno:#7a2f5f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e8e6e1; --muted:#9b958d;
      --axis:#6f6a62; --grid:#2c3037; --card:#1e2127;
      --lg:#79c99a; --crew:#d8a75c; --auto:#79b6d8; --agno:#d68fbb;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:8px 10px 12px}
  h2{margin:0 0 2px;font-size:15px;letter-spacing:.01em}
  p.sub{margin:0 0 6px;font-size:12px;color:var(--muted)}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{padding:10px;border:1px solid var(--grid);border-radius:6px;
    background:var(--card);font-size:13px;color:var(--fg)}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
<div class="wrap">
  <h2>Матрица фреймворков: главная абстракция против формы задачи</h2>
  <p class="sub">Сужает выбор колонка Worst fit — то, что запрещено, а не то, что обещано.</p>
  <div id="slot"><noscript class="fail">Схема: четыре фреймворка по двум осям. Ось X — главная абстракция: граф → роли → чат → одиночный агент. Ось Y — форма задачи: от короткого линейного плана до долгого ветвящегося процесса с остановками. LangGraph — граф + долгий ветвящийся процесс. CrewAI — роли + короткий линейный или иерархический план. AutoGen — чат + диалог без заранее известной топологии. Agno — одиночный агент + быстрая сборка без глубокого ветвления.</noscript></div>
</div>
<script>
(function(){
  var slot=document.getElementById('slot');
  try{
    // ---- данные схемы ----
    var ABS=[{x:1,t:'граф'},{x:2,t:'роли'},{x:3,t:'чат'},{x:4,t:'одиночный агент'}];
    var SHAPE=[{y:1,t:'короткий линейный план'},{y:2,t:'диалог, топология по ходу'},
               {y:3,t:'ветвление'},{y:4,t:'долгий процесс с остановками'}];
    var FW=[
      {x:1,y:4,k:'LG',n:'LangGraph',c:'var(--lg)',
       w:'плохо: свободный ролевой брейнсторм',dx:1,dy:0},
      {x:2,y:1,k:'CR',n:'CrewAI',c:'var(--crew)',
       w:'плохо: состояние дольше истории ходов',dx:1,dy:0},
      {x:3,y:2,k:'AG',n:'AutoGen',c:'var(--auto)',
       w:'плохо: состояние через перезапуск',dx:1,dy:0},
      {x:4,y:1,k:'AN',n:'Agno',c:'var(--agno)',
       w:'плохо: глубокие графы с ветвлением',dx:-1,dy:0}
    ];
    var VB_W=960, VB_H=430, LINE=1.6, DOT=7, PAD=6, FS=12.5, FSS=11.5;

    // ---- единственный перевод координат ----
    var origin={x:196,y:330}, scale={x:158,y:66};
    function sx(x){return origin.x + x*scale.x;}
    function sy(y){return origin.y - y*scale.y;}

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]);return e;}
    function txt(x,y,s,a,cls,fs,col){
      var t=el('text',{x:x,y:y,'text-anchor':a,'font-size':fs||FS,
        fill:col||'var(--fg)'});
      if(cls)t.setAttribute('class',cls);
      t.appendChild(document.createTextNode(s));return t;}

    var svg=el('svg',{viewBox:'0 0 '+VB_W+' '+VB_H,
      preserveAspectRatio:'xMidYMid meet',role:'img'});
    svg.appendChild(el('rect',{x:0,y:0,width:VB_W,height:VB_H,fill:'var(--bg)'}));

    var d=el('defs');
    var m=el('marker',{id:'ah',viewBox:'0 0 10 10',refX:9,refY:5,
      markerWidth:7,markerHeight:7,orient:'auto-start-reverse'});
    m.appendChild(el('path',{d:'M0 0 L10 5 L0 10 z',fill:'var(--axis)'}));
    d.appendChild(m);svg.appendChild(d);

    var X0=0.35, X1=4.7, Y0=0.35, Y1=4.7;

    // сетка по засечкам
    ABS.forEach(function(a){
      svg.appendChild(el('line',{x1:sx(a.x),y1:sy(Y0),x2:sx(a.x),y2:sy(Y1),
        stroke:'var(--grid)','stroke-width':LINE,'stroke-dasharray':'3 5'}));
    });
    SHAPE.forEach(function(s){
      svg.appendChild(el('line',{x1:sx(X0),y1:sy(s.y),x2:sx(X1),y2:sy(s.y),
        stroke:'var(--grid)','stroke-width':LINE,'stroke-dasharray':'3 5'}));
    });

    // оси из sx(0)/sy(0)
    svg.appendChild(el('line',{x1:sx(0),y1:sy(0),x2:sx(X1),y2:sy(0),
      stroke:'var(--axis)','stroke-width':LINE,'marker-end':'url(#ah)'}));
    svg.appendChild(el('line',{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(Y1),
      stroke:'var(--axis)','stroke-width':LINE,'marker-end':'url(#ah)'}));

    // засечки оси X + подписи снизу
    ABS.forEach(function(a){
      svg.appendChild(el('line',{x1:sx(a.x),y1:sy(0),x2:sx(a.x),y2:sy(-0.12),
        stroke:'var(--axis)','stroke-width':LINE}));
      svg.appendChild(txt(sx(a.x),sy(-0.12)+FS+PAD,a.t,'middle',null,FS,'var(--muted)'));
    });
    // засечки оси Y + подписи слева
    SHAPE.forEach(function(s){
      svg.appendChild(el('line',{x1:sx(0),y1:sy(s.y),x2:sx(-0.06),y2:sy(s.y),
        stroke:'var(--axis)','stroke-width':LINE}));
      svg.appendChild(txt(sx(-0.06)-PAD,sy(s.y)+FS*0.34,s.t,'end',null,FS,'var(--muted)'));
    });

    // названия осей: у хвоста каждой стрелки
    svg.appendChild(txt(sx(0),sy(-0.12)+FS*2+PAD*2.4,
      'главная абстракция \u2192','start',null,FS,'var(--fg)'));
    svg.appendChild(txt(sx(0)+PAD,sy(Y1)-PAD,
      '\u2191 форма задачи','start',null,FS,'var(--fg)'));

    // точки фреймворков
    FW.forEach(function(f){
      var px=sx(f.x), py=sy(f.y);
      svg.appendChild(el('circle',{cx:px,cy:py,r:DOT,fill:f.c}));
      var right=f.dx>0, anc=right?'start':'end', off=right?PAD*2:-PAD*2;
      svg.appendChild(txt(px+off,py-PAD*0.6,f.n,anc,null,FS,f.c));
      svg.appendChild(txt(px+off,py+FS+PAD*0.2,f.w,anc,null,FSS,'var(--muted)'));
    });

    // легенда одной строкой под схемой
    var ly=sy(-0.95);
    svg.appendChild(txt(sx(0),ly,
      'Точка \u2014 квадрант, где фреймворк дома. Серым \u2014 строка Worst fit: '+
      'ею выбор и сужается.','start',null,FSS,'var(--muted)'));

    slot.innerHTML='';slot.appendChild(svg);
  }catch(e){
    slot.innerHTML='<div class="fail"><b>Схема не построилась.</b> Она должна '+
      'показывать две оси: главная абстракция (граф \u2192 роли \u2192 чат \u2192 '+
      'одиночный агент) против формы задачи (от короткого линейного плана до '+
      'долгого процесса с остановками). LangGraph \u2014 граф + долгий процесс с '+
      'остановками. CrewAI \u2014 роли + короткий линейный план. AutoGen \u2014 чат '+
      '+ диалог с неизвестной заранее топологией. Agno \u2014 одиночный агент + '+
      'быстрая сборка. У каждой точки \u2014 её строка Worst fit.</div>';
  }
})();
</script>
</html>
