- concept: выученные BPE-токены отражают частые последовательности символов, а не гарантированный морфемный разбор
  question: BPE-токенизатор разделил незнакомое слово на две части, внешне похожие на корень и суффикс. Почему нельзя утверждать, что токенизатор выполнил морфологический разбор?
  explanation: BPE обучается на статистике соседства символов. Частый фрагмент может стать токеном независимо от того, является ли он корнем, суффиксом или частью нескольких морфем.
  kind: open
  reference: BPE выбирает слияния по частоте соседних токенов в обучающем корпусе и не использует сведения о грамматике или морфемах. Поэтому границы BPE-токенов могут случайно совпадать с границами морфем, но такое совпадение не гарантировано.
  id: 031-lowest-iz-kusochkov-1
  fingerprint: c2aa7bb7
- concept: маркер конца слова делает BPE-токен привязанным к конечной позиции
  question: В словаре BPE есть токен ing</w>. Для какой позиции он предназначен?
  explanation: Маркер </w> обозначает границу слова. Поэтому ing</w> соответствует фрагменту ing, после которого слово заканчивается, и отличается от внутреннего токена ing.
  kind: choice
  options:
    - Для фрагмента ing в конце слова
    - Для любого вхождения ing независимо от позиции
    - Только для отдельного слова ing
  correct: 0
  id: 031-lowest-iz-kusochkov-2
  fingerprint: f9aead9c
