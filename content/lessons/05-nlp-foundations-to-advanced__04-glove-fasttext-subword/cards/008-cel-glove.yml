- concept: целевая функция GloVe определена для пар с положительной совместной частотой
  question: Почему стандартная обучающая сумма GloVe не подгоняет модель напрямую под пары слов, которые ни разу не встретились вместе?
  explanation: Правая часть цели содержит log(Xᵢⱼ). Она имеет конечное значение лишь при положительном Xᵢⱼ, поэтому обучение перебирает записи матрицы совместной встречаемости с ненулевыми счётчиками.
  kind: open
  reference: Для отсутствующей пары счётчик равен нулю, а логарифм нуля не определён. Поэтому целевое значение GloVe задаётся только для наблюдаемых пар с положительным счётчиком.
