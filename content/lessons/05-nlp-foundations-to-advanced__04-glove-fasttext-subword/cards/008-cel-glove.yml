- concept: смещения центра и контекста моделируют их отдельную базовую частотность
  question: Какую роль выполняют смещения bᵢ и b̃ⱼ в модели GloVe?
  explanation: Смещения забирают на себя базовую популярность слов в ролях центра и контекста. Скалярному произведению остаётся моделировать специфичность конкретной пары.
  kind: choice
  options:
