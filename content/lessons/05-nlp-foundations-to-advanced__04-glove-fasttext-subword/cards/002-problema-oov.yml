- concept: словные эмбеддинги поддерживают только токены, присутствующие в обучающем словаре
  question: Модель хранит отдельный обученный вектор для каждого слова из фиксированного словаря. Что произойдёт при точном поиске вектора для нового слова, отсутствовавшего при обучении?
  explanation: В Word2Vec и GloVe вектор связан с конкретной записью словаря. Если слова не было при обучении, соответствующая строка не создавалась, поэтому точный поиск не может вернуть его вектор.
  kind: choice
  options:
    - Модель автоматически выведет вектор из написания слова
    - В таблице не окажется строки с таким ключом
    - Будет выбран вектор наиболее похожего по смыслу слова
    - Вектор восстановится из текущего контекста до поиска в таблице
  correct: 1
  id: 002-problema-oov-1
  fingerprint: 059a16d2
- concept: единый вектор неизвестного токена стирает различия между разными OOV-словами
  question: Почему замена всех отсутствующих в словаре слов одним токеном <UNK> приводит к потере информации? Объясни своими словами.
  explanation: Общий <UNK> позволяет продолжить вычисления, но отображает множество разных слов в одну точку пространства эмбеддингов. Их индивидуальные признаки теряются ещё до дальнейшей обработки.
  kind: open
  reference: Разные незнакомые слова получают один и тот же вектор, поэтому последующие компоненты модели не могут различить их по входному представлению, даже если их написание и значения различаются.
  id: 002-problema-oov-2
  fingerprint: 4c374421
