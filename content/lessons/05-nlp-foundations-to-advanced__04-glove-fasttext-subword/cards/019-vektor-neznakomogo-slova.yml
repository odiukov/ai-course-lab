- concept: поэлементное сложение сохраняет размерность FastText-вектора независимо от количества найденных n-грамм
  question: Объясни, почему количество известных n-грамм OOV-слова не меняет размерность полученного FastText-вектора.
  explanation: Векторная сумма имеет столько же координат, сколько каждое слагаемое. Число найденных n-грамм влияет на значения координат, но не на форму результата.
  kind: open
  reference: Все векторы n-грамм имеют одинаковую размерность и складываются по соответствующим координатам, поэтому сумма остаётся в том же векторном пространстве. При конкатенации размерность зависела бы от количества частей.
