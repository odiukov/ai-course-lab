- concept: лексикографическое разрешение ничьих делает обучение BPE воспроизводимым
  question: Две соседние пары имеют одинаковую максимальную частоту в корпусе. Как следует выбрать слияние, чтобы результат BPE не зависел от порядка обхода слов?
  explanation: Явное лексикографическое правило однозначно разрешает ничью. Выбор по порядку вставки сделал бы список слияний зависимым от порядка чтения корпуса.
  kind: choice
  options:
    - Выбрать пару, которая первой попала в счётчик
    - Выбрать случайную пару среди лидеров
    - Выбрать лексикографически меньшую пару
    - Выбрать пару с более длинным первым токеном
  correct: 2
  id: 028-learn-bpe-2
  fingerprint: 29512e0c
- concept: число выученных BPE-слияний ограничено сверху, но может быть меньше заданного
  question: Почему learn_bpe может корректно вернуть меньше слияний, чем запросил вызывающий код?
  explanation: Пара существует только в последовательности как минимум из двух токенов. Когда каждая последовательность уже стала одним токеном, новых кандидатов на слияние нет и цикл должен остановиться.
  kind: open
  reference: Если в текущей токенизации не осталось последовательностей с соседними токенами, счётчик пар будет пуст. Выбирать следующую пару невозможно, поэтому обучение завершается досрочно и возвращает уже накопленный список слияний.
  id: 028-learn-bpe-3
  fingerprint: 3c8c2196
