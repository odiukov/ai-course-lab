- concept: множество устраняет дубликаты одинаковых символьных n-грамм из разных позиций
  question: Объясни, что произойдёт, если одинаковая символьная n-грамма встретится в слове в нескольких позициях.
  explanation: Операция добавления в множество не создаёт повторную запись для уже присутствующей строки. Поэтому результат описывает набор уникальных n-грамм, а не список всех их появлений.
