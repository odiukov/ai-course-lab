- concept: число n-грамм фиксированной длины определяется количеством допустимых положений скользящего окна
  question: Слово состоит из 16 символов. После добавления граничных меток слева и справа по полученной строке проводят окно длины 8. Сколько n-грамм оно создаст?
  explanation: 'После добавления границ строка имеет длину 18. Окно длины 8 можно поставить в 11 последовательных начальных позиций: число позиций равно длине строки минус длина окна плюс единица.'
  kind: numeric
  answer: 11
