- concept: уменьшение словаря subword-токенов оплачивается увеличением и переменностью длины входной последовательности
  question: Объясни своими словами, какой компромисс возникает при замене словного словаря словарём subword-токенов.
  explanation: Повторное использование subword-единиц ограничивает размер словаря и расширяет покрытие текста. Обратная сторона — более длинные последовательности для редких слов, что увеличивает вычисления и расход контекстного окна.
  kind: open
  reference: 'Не нужно хранить отдельный токен для каждого слова, но слова приходится представлять последовательностями разной длины: частые слова обычно кодируются короче, а редкие или необычные — большим количеством токенов.'
