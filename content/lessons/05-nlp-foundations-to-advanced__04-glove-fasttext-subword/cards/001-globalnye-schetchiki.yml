  fingerprint: 6bb59e52
- concept: GloVe и Word2Vec извлекают общий дистрибутивный сигнал разными способами
  question: Объясните своими словами, почему обучение на глобальной матрице совместной встречаемости может давать эмбеддинги, сопоставимые с Word2Vec, хотя Word2Vec обновляет векторы по отдельным контекстным парам.
  explanation: Матрица совместной встречаемости содержит агрегированный контекстный сигнал всего корпуса. Если сжать диапазон счётчиков и корректно ограничить вклад ненадёжных и сверхчастых пар, прямое обучение по этой матрице не обязано уступать локальным обновлениям Word2Vec.
  kind: open
  reference: 'Оба метода используют дистрибутивный сигнал: слова, встречающиеся в похожих контекстах, должны получать похожие представления. Word2Vec извлекает его через последовательные локальные обновления, а GloVe — из агрегированных по корпусу счётчиков. Поэтому преимущество определяется не самой формой данных, а тем, насколько удачно функция потерь преобразует и взвешивает эти счётчики.'
  id: 001-globalnye-schetchiki-2
  fingerprint: 495702ef
