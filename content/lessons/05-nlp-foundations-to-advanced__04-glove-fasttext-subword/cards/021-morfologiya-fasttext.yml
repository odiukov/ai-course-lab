- concept: субсловная композиция уменьшает разреженность данных внутри морфологической парадигмы
  question: В корпусе много форм одного слова, но каждая отдельная форма встречается редко. Почему FastText может получить для них более надёжные представления?
  explanation: В морфологически богатом языке наблюдения распределены между множеством форм. Общие символьные фрагменты обучаются на нескольких формах, поэтому редкая форма получает пользу от статистики родственных слов.
  kind: choice
  options:
    - Он объединяет все словоформы в один и тот же токен
    - Повторяющиеся символьные фрагменты позволяют формам использовать общий обучающий сигнал
    - Он полностью игнорирует частоту появления слов
    - Он назначает редким формам случайные векторы, близкие к частым словам
  correct: 1
  id: 021-morfologiya-fasttext-1
  fingerprint: 87b31c85
- concept: общая основа сближает словоформы, но не делает их представления тождественными
  question: Объясни своими словами, почему две словоформы с общей основой в FastText могут оказаться близкими, но не обязаны иметь одинаковые векторы.
  explanation: FastText сочетает общий сигнал от совпадающих частей с отдельным сигналом от несовпадающих частей и контекстов. Поэтому морфологическое родство отражается как близость, а не как полное совпадение.
  kind: open
  reference: Общие символьные фрагменты вносят одинаковые компоненты и сближают векторы. Различающиеся окончания и другие фрагменты добавляют разные компоненты, а различия в контекстах употребления дополнительно разделяют представления.
  id: 021-morfologiya-fasttext-2
  fingerprint: 4dcb5c56
