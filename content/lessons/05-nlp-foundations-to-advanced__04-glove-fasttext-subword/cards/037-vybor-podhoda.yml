- concept: субсловный токенизатор для новой языковой модели обучают до самой модели на целевом корпусе
  question: Расположите этапы подготовки собственной языковой модели с нуля в правильном порядке.
  explanation: 'Словарь и правила разбиения должны быть определены до обучения языковой модели: именно для полученных токенов модель создаёт и обучает параметры.'
  kind: order
  items:
    - Подготовить корпус целевого домена
    - Обучить на корпусе токенизатор BPE или SentencePiece
    - Преобразовать корпус с помощью обученного токенизатора
    - Обучать языковую модель на полученных последовательностях токенов
