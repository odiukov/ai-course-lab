- concept: глобальный контекст образуется агрегированием совместных встречаемостей по всему корпусу
  question: Почему контекст, представленный матрицей совместной встречаемости, называют глобальным?
  explanation: Каждая ячейка накапливает совместные появления пары во всём корпусе. Поэтому матрица обобщает множество локальных окон, а не описывает один фрагмент текста.
  kind: choice
  options:
    - Матрица хранит порядок всех слов в каждом предложении
    - Для каждого слова выбирается единственный самый характерный контекст
    - Совместные появления слов суммируются по всему корпусу
    - Контекст строится только по самому длинному документу
  correct: 2
  id: 005-matrica-sovmestimosti-1
  fingerprint: 2136744b
- concept: сходство строк матрицы совместной встречаемости отражает сходство контекстных распределений слов
  question: Почему слова с похожими строками в матрице совместной встречаемости могут считаться близкими по употреблению, даже если редко встречаются рядом друг с другом?
  explanation: Строка задаёт полный профиль контекстов слова. Например, профиль «банк» одновременно содержит частоты соседства с «кредитом», «деньгами», «рекой» и «берегом»; сравнивать нужно распределение по столбцам, а не одну пару.
  kind: open
  reference: Похожие строки означают, что слова с сопоставимой частотой появляются рядом с одними и теми же контекстными словами. Поэтому их роли и условия употребления могут быть похожи без непосредственного соседства.
  id: 005-matrica-sovmestimosti-2
  fingerprint: 5922dc26
