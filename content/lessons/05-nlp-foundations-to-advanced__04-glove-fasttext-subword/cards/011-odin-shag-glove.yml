- concept: локальное SGD-обновление затрагивает только параметры, участвовавшие в предсказании выбранной пары GloVe
  question: Какие параметры GloVe изменяются при обработке наблюдаемой пары с центральным словом i и контекстным словом j?
  explanation: Предсказание для пары (i, j) зависит от W[i] @ W_tilde[j] + b[i] + b_tilde[j]. Поэтому градиент этой пары изменяет именно эти параметры, а остальные строки таблиц не затрагивает.
  kind: choice
  options:
    - W[i], W_tilde[j], b[i] и b_tilde[j]
    - Все строки W и W_tilde, но никакие смещения
    - Только W[i] и b[i]
    - Только W_tilde[j] и b_tilde[j]
  correct: 0
  id: 011-odin-shag-glove-1
  fingerprint: 954c0223
- concept: градиенты обоих векторов пары GloVe вычисляются из одного состояния параметров
  question: Почему при SGD-обновлении пары GloVe нужно сначала вычислить поправки для W[i] и W_tilde[j], а уже затем изменять оба вектора?
  explanation: Градиент по W[i] использует прежний W_tilde[j], а градиент по W_tilde[j] — прежний W[i]. Сохранение исходных значений обеспечивает согласованное обновление параметров по одной вычисленной ошибке.
  kind: open
  reference: Обе поправки должны быть градиентами одной и той же ошибки при одном состоянии параметров. Если сначала изменить W[i], а затем использовать его новое значение для вычисления поправки W_tilde[j], второй градиент уже не будет соответствовать исходной ошибке пары и результат станет зависеть от порядка обновлений.
  id: 011-odin-shag-glove-2
  fingerprint: ac5fb243
