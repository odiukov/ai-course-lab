- concept: вычисление веса пары ниже порога насыщения по степенной функции GloVe
  question: В GloVe заданы x_max = 49 и alpha = 0,5. Какой вес получит пара с частотой x = 7?
  explanation: 'Поскольку частота ниже порога, применяется степенная ветвь: f(x) = (7/49)^0,5 ≈ 0,378. Вес положителен, поэтому редкая пара продолжает участвовать в обучении.'
  kind: numeric
  answer: 0.378
  tolerance: 0.005
  id: 009-ves-pary-1
  fingerprint: a436e06b
- concept: увеличение показателя alpha сильнее подавляет веса пар ниже порога насыщения
  question: Объясни своими словами, как увеличение alpha повлияет на вес фиксированной пары, частота которой ниже x_max.
  explanation: Для пары ниже порога основание x/x_max меньше единицы. Чем больше alpha, тем меньше значение этого основания в степени alpha и тем сильнее ослабляется вклад редкой пары.
  kind: open
  reference: 'Вес уменьшится: отношение x/x_max меньше единицы, а увеличение показателя степени делает результат меньше. Поэтому модель будет слабее учитывать низкочастотную пару.'
  id: 009-ves-pary-2
  fingerprint: 1be4bf79
