- concept: частичное извлечение векторов требует проверки наличия ключа до обращения к словарю
  question: Как безопасно собрать список векторов n-грамм, если часть ключей может отсутствовать в `ngram_table`?
  explanation: Проверка наличия ключа перед индексированием предотвращает `KeyError` и позволяет использовать остальные известные части слова. Отсутствие отдельной n-граммы не должно прерывать всю композицию.
  kind: choice
  options:
    - Обращаться к `ngram_table[g]` только после проверки `g in ngram_table`
    - Сначала обратиться ко всем ключам, а затем удалить отсутствующие результаты
    - Заменить множество n-грамм одной строкой и искать её целиком
    - Прекратить обработку слова при первом отсутствующем ключе
  correct: 0
