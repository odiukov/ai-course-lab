- concept: знак ошибки GloVe определяет направление градиентного обновления смещений
  question: Для наблюдаемой пары предсказание GloVe оказалось больше целевого значения ln(x_ij). Вес пары и скорость обучения положительны. Как один шаг градиентного спуска изменит смещения центра и контекста?
  explanation: Завышенное предсказание даёт положительные diff и coef. Обновление вычитает lr * coef из каждого смещения, поэтому оба уменьшаются и следующее предсказание становится ниже.
  kind: choice
  options:
    - Оба смещения уменьшатся
    - Оба смещения увеличатся
    - Смещение центра увеличится, а контекста уменьшится
    - Смещения не изменятся
  correct: 0
  id: 012-glove-step-1
  fingerprint: 7fa7649e
- concept: постоянный множитель производной квадратичной ошибки можно включить в скорость обучения
  question: Объясните своими словами, почему в простой реализации SGD для GloVe допустимо не записывать отдельно постоянный множитель, возникающий при дифференцировании квадрата ошибки.
  explanation: Точная производная f(x) * diff² содержит множитель 2. Если использовать coef = f(x) * diff, эквивалентный масштаб обновления можно получить соответствующим выбором lr.
  kind: open
  reference: Этот множитель одинаков для всех обновлений, поэтому его можно поглотить в значение скорости обучения. Это меняет масштаб шага, но не направление градиента.
  id: 012-glove-step-2
  fingerprint: 0fc5575a
