- concept: воспроизводимая рекомендация токенизатора должна содержать исполнимую конфигурацию и явно названную совместимую пару токенизатора с моделью
  question: 'Советчик ответил команде: «Используйте BPE». Объясни, почему этого недостаточно для воспроизводимого инженерного решения и что необходимо добавить в ответ.'
  explanation: Название алгоритма не фиксирует реализацию и параметры обучения. Точная команда делает решение повторяемым, а явная фиксация пары «токенизатор — модель» предотвращает тихую несовместимость идентификаторов токенов и таблицы эмбеддингов.
  kind: open
  reference: Нужно указать причину выбора стратегии, целевой размер словаря, название библиотеки и точную команду обучения с зафиксированными аргументами. Также следует назвать риск воспроизводимости и явно указать, какой токенизатор должен использоваться вместе с какой моделью.
