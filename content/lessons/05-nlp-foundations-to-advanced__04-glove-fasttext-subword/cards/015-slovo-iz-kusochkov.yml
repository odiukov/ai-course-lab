- concept: эмбеддинг слова в FastText равен сумме эмбеддингов его символьных n-грамм
  question: Дополните формулу представления слова в FastText.
  explanation: FastText хранит обучаемый вектор z_g для каждого символьного фрагмента g и складывает векторы всех фрагментов слова. Полученная сумма используется как единый вектор слова.
  kind: cloze
  template: v(w) = ___
  answer: sum_{g in G(w)} z_g
  accept:
    - Σ_{g∈G(w)} z_g
    - сумма z_g по всем g из G(w)
  id: 015-slovo-iz-kusochkov-1
  fingerprint: f7f6379d
- concept: отдельный вектор целого слова дополняет композицию из символьных частей
  question: Зачем FastText наряду с символьными n-граммами включает в представление отдельную запись для слова целиком?
  explanation: Общие n-граммы обеспечивают перенос информации между похожими словами, а отдельный параметр целого слова позволяет учитывать его собственные особенности. Это самостоятельная запись, отличная от совпадающей по символам внутренней n-граммы.
  kind: choice
  options:
    - Чтобы запоминать свойства слова, которые не выражаются только через общие символьные части
    - Чтобы заменить сумму n-грамм одним вектором при обучении
    - Чтобы все словоформы с общим корнем получили строго одинаковые векторы
  correct: 0
  id: 015-slovo-iz-kusochkov-2
  fingerprint: 45cf4a83
- concept: общие n-граммы создают совместно используемые параметры для разных слов
  question: Объясните, почему обновление эмбеддинга одной символьной n-граммы во время обучения FastText может одновременно изменить представления нескольких слов.
  explanation: FastText не создаёт отдельную копию вектора фрагмента для каждого слова. Один параметр n-граммы повторно используется во всех словах, содержащих этот фрагмент, и связывает их представления.
  kind: open
  reference: Эмбеддинг каждого слова является суммой векторов его n-грамм. Если одна и та же n-грамма входит в несколько слов, они используют общий обучаемый параметр, поэтому его обновление меняет каждую из соответствующих сумм.
  id: 015-slovo-iz-kusochkov-3
  fingerprint: 8087d25f
