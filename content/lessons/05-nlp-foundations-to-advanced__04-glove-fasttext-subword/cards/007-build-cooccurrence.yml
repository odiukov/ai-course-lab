- concept: центральную позицию исключают из её собственного контекстного окна
  question: Заполни условие, которое исключает центральную позицию из контекста.
  explanation: Центр не должен образовывать контекстную пару с самим собой. Кроме того, при совпадении позиций расстояние равно нулю, поэтому вычисление обратного расстояния привело бы к делению на ноль.
  kind: cloze
  template: |-
    for j in context_positions:
        if ___:
            distance = abs(i - j)
            pair_counts[(center, indexed[j])] += unit_weight / distance
  answer: i != j
  accept:
    - j != i
  id: 007-build-cooccurrence-1
  fingerprint: b24101eb
- concept: повторные появления одной контекстной пары суммируются в одном счётчике
  question: Одна и та же пара индексов встретилась в корпусе несколько раз и каждый раз получила некоторый вес. Как её следует хранить в матрице совместной встречаемости?
  explanation: 'Counter накапливает сумму по ключу пары. Поэтому повторная встреча не создаёт новую запись: её взвешенный вклад прибавляется к уже накопленной совместной встречаемости.'
  kind: choice
  options:
    - Оставить только вес последнего появления
    - Создать отдельный ключ для каждого появления
    - Сложить веса всех появлений в значении одного ключа
    - Сохранить только наибольший из весов
  correct: 2
  id: 007-build-cooccurrence-2
  fingerprint: a7251197
