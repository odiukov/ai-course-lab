- concept: смещения GloVe не входят в итоговый семантический вектор слова
  question: Объясни своими словами, почему при построении итогового GloVe-вектора складывают строки W[t] и W_tilde[t], но не добавляют смещения b[t] и b_tilde[t].
  explanation: Векторы W и W_tilde участвуют в скалярных произведениях и формируют геометрию эмбеддингов. Смещения компенсируют частотные эффекты при обучении, поэтому после обучения их не включают в представление слова.
  kind: open
  reference: Строки двух таблиц кодируют слово в центральной и контекстной ролях, поэтому их объединение сохраняет оба обученных представления. Смещения служат скалярными параметрами для подгонки базовой частотности в уравнении совместной встречаемости и не являются координатами семантического пространства.
  id: 013-dve-tablicy-glove-2
