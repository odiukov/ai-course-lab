- concept: вклад контекстной пары обратно пропорционален расстоянию между словами
  question: 'Упорядоченная пара «центр — контекст» встретилась дважды: на расстояниях 3 и 7. Вклад каждого наблюдения равен обратной величине расстояния. Какой суммарный вес накопит пара?'
  explanation: Вклады равны трети и одной седьмой. Их сумма составляет десять двадцать первых, то есть примерно 0.476. Поэтому близкие соседства увеличивают счётчик сильнее дальних.
  kind: numeric
  answer: 0.476
  tolerance: 0.001
  id: 006-okno-i-rasstoyanie-1
  fingerprint: 3a000a8e
- concept: словарь назначает каждому уникальному токену произвольный целочисленный идентификатор
  question: Какое выражение назначает новому токену следующий свободный индекс при последовательном построении словаря?
  explanation: Текущий размер словаря совпадает со следующим свободным индексом. Такой индекс нужен для хранения и обращения к параметрам; он не кодирует частоту, важность или смысл слова.
  kind: cloze
  template: |-
    if token not in vocab:
        vocab[token] = ___
  answer: len(vocab)
  accept:
    - len(vocab)
  id: 006-okno-i-rasstoyanie-2
  fingerprint: 344df19a
- concept: пары совместной встречаемости направлены от центрального слова к контекстному
  question: Почему при симметричном контекстном окне соседние слова обычно порождают две разные записи в счётчике совместной встречаемости?
  explanation: Пары «слово A — слово B» и «слово B — слово A» имеют разные ключи. Оба направления появляются потому, что алгоритм по очереди рассматривает центром каждый токен документа.
  kind: open
  reference: Счётчик хранит упорядоченные пары «центр — контекст». Когда центром служит первое слово, записывается одно направление, а когда центром становится второе — обратное.
  id: 006-okno-i-rasstoyanie-3
  fingerprint: 34b84d77
