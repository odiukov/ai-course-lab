- concept: один Unicode-символ может соответствовать нескольким базовым токенам byte-level BPE
  question: Byte-level BPE не выучил ни одного слияния для редкого Unicode-символа. Что может произойти при его токенизации?
  explanation: Базовая единица такого токенизатора — байт, а не Unicode-символ. Один символ может кодироваться несколькими байтами и при отсутствии подходящих слияний останется последовательностью базовых токенов.
  kind: choice
  options:
    - Символ обязательно заменится на токен неизвестного слова
    - Символ всегда станет ровно одним токеном
    - Символ будет удалён из входной последовательности
    - Символ будет представлен несколькими токенами, соответствующими байтам его кодировки
  correct: 3
  id: 032-byte-level-garantiya-1
  fingerprint: '63281315'
- concept: полное токенизационное покрытие не гарантирует семантического понимания ввода
  question: Объясни своими словами, почему отсутствие OOV у byte-level BPE не означает, что модель хорошо понимает любое редкое имя или новый термин.
  explanation: Полный стартовый набор байтов решает техническую проблему представимости текста. Он не создаёт знания о значении незнакомой последовательности и не гарантирует качественного представления её смысла.
  kind: open
  reference: Токенизатор гарантирует только возможность представить ввод последовательностью известных байтовых токенов. Качество понимания зависит от обучения модели и наличия подходящего контекста; редкий ввод может быть разбит на мелкие части, семантика которых моделью почти не изучена.
  id: 032-byte-level-garantiya-2
  fingerprint: 30de4155
