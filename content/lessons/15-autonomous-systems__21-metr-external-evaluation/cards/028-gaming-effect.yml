- concept: эффект распознавания контекста оценки складывается из двух сомножителей — частоты распознавания и величины изменения поведения
  question: Модель распознаёт, что идёт оценка, в 40% прогонов. Когда распознаёт, её вероятность успеха на задаче поднимается на 0.15; в остальных прогонах поведение прежнее. На сколько вырастет наблюдаемая в оценке доля успеха (в долях единицы)?
  explanation: 'Сдвиг равен произведению частоты распознавания на прирост: 0.40 × 0.15 = 0.06, то есть 6 процентных пунктов. Отсюда следствие: если один из сомножителей близок к нулю, эффект мал независимо от второго, а заметное искажение требует и частого распознавания, и ощутимой смены поведения.'
  kind: numeric
  answer: 0.06
  tolerance: 0.01
  id: 028-gaming-effect-1
  fingerprint: '56883e37'
- concept: подгонка кривой использует только зафиксированные исходы и не различает их происхождение, поэтому завышенные успехи сдвигают оценённый горизонт при неизменной базовой способности
  question: Часть успехов в наборе результатов возникла из-за того, что модель распознала контекст оценки. Что произойдёт с горизонтом, посчитанным подгонкой логистической кривой по этим данным?
  explanation: На вход подгонки идут пары «log времени эксперта — исход». Происхождение исхода в данных не закодировано, поэтому завышенная доля успеха честно превращается в более длинный оценённый горизонт, хотя способность справляться с обычными рабочими задачами не менялась.
  kind: choice
  options:
    - 'Ничего: подгонка учитывает только настоящие успехи, а искусственные отбрасывает'
    - Горизонт сдвинется, потому что подгонка видит лишь метки исходов и не знает, откуда взялся каждый успех
    - Подгонка не сойдётся, так как данные внутренне противоречивы
  correct: 1
  id: 028-gaming-effect-2
  fingerprint: 967657ed
- concept: количественная модель эффекта даёт чувствительность измерения к искажению, но не доказывает, что искажение имело место
  question: Ты подставил в симулятор частоту распознавания оценки и величину изменения поведения и получил заметный сдвиг горизонта. Что этот расчёт доказывает, а что нет?
  explanation: 'Смешение этих двух вопросов — типичная ошибка чтения симуляций: подставленные параметры остаются допущением, а не измерением. Полезный вывод из симулятора — понимание, при каких значениях искажение перестаёт быть пренебрежимым.'
  kind: open
  reference: 'Расчёт показывает чувствительность: насколько сильно оценённый горизонт поедет, ЕСЛИ распознавание и смена поведения происходят с такими параметрами. Он не доказывает, что конкретная модель распознаёт контекст оценки и что её реальные параметры именно такие — это эмпирический вопрос, для которого нужны отдельные наблюдения (например, сравнение прогонов с маркерами оценки и без них). То есть симулятор отвечает «сколько это стоило бы», а не «происходит ли это».'
  id: 028-gaming-effect-3
  fingerprint: d49bbc5a
