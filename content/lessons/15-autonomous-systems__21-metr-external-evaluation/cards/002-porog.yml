- concept: число сравнимо с порогом только при той надёжности и тех условиях, которые задал порог
  question: 'Политика включает усиленные меры, если временной горизонт модели достигает 12 часов при надёжности 70%. Оценщик сообщает: горизонт 15 часов при надёжности 40%. Какой вывод корректен?'
  explanation: Горизонт — это длительность задачи, на которой успех держится с заданной надёжностью. Снижаешь требование к надёжности — та же модель показывает больший горизонт. Сравнивать с порогом можно только величину, измеренную при указанной в политике надёжности и в указанных условиях; 15 часов при 40% ни подтверждают, ни опровергают порог 12 часов при 70%.
  kind: choice
  options:
    - 'Порог пройден: 15 больше 12'
    - 'Числа несопоставимы: горизонт при более низкой надёжности систематически больше, нужна оценка при надёжности 70%'
    - Порог не пройден, потому что надёжность оказалась ниже требуемой
    - Надёжность не влияет на величину горизонта, сравнение законно
  correct: 1
  id: 002-porog-1
  fingerprint: 9d58b9ce
- concept: численный критерий переносит разногласие с впечатлений на методику измерения
  question: 'Порог политики сформулирован словами: «модель способна к долгой автономной работе». Его заменяют численным критерием на измеряемой величине. Объясни своими словами, что меняется в характере возможных разногласий.'
  explanation: Операционализация не делает порог «объективно правильным» — она делает момент его срабатывания оспоримым по существу и воспроизводимым. Именно поэтому претензии к внешним оценкам обычно адресуются методике (набор задач, условия, надёжность), а не тому, кому какая модель кажется способной.
  kind: open
  reference: 'Спор перестаёт быть спором впечатлений и авторитетов. Предметом становятся проверяемые вещи: какой набор задач взят, какие лимиты и инструменты, какая требуемая надёжность, корректно ли проведено измерение и посчитан результат. Такое возражение можно предъявить на конкретных основаниях, измерение — повторить, а критерий — применить одинаково к следующей модели. При этом сам смысл требования по-прежнему задаёт словесное определение: число не говорит, какую способность мерили.'
  id: 002-porog-2
  fingerprint: 5de366a1
