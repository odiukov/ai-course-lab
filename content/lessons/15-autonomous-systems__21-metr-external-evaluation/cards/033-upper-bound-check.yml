- concept: собственный горизонт получают прогоном на своём распределении задач с проставленным экспертным временем, а не поправкой к публичному числу
  question: Расставь шаги, которыми команда получает собственный горизонт вместо публичного.
  explanation: 'Публичное число нельзя «поправить в уме»: нужен свой набор задач с экспертным временем и свои условия прогона. Только после этого сравнение с публичным горизонтом что-то значит.'
  kind: order
  items:
    - Собрать около 80 своих реальных задач и проставить каждой время своего эксперта
    - Прогнать агента на этих задачах в своих инструментах и при своём способе формулировать запросы
    - Сгруппировать задачи по экспертной длительности и посчитать долю успеха в каждой группе
    - Сопоставить полученный собственный горизонт с публичным числом
