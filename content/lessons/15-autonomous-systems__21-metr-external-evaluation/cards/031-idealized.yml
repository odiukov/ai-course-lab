- concept: одинаковые аккуратные условия повышают сравнимость прогонов и одновременно сужают перенос результата на рабочие запросы
  question: Аккуратные инструменты и жёстко структурированные промпты одновременно помогают оценке и мешают ей. Объясни своими словами, чему они помогают и что при этом теряется.
  explanation: 'Это две разные цели: внутренняя сравнимость прогонов и внешний перенос на продакшен. Фиксация условий улучшает первую и ухудшает вторую — противоречия здесь нет, есть два разных вопроса.'
  kind: open
  reference: 'Помогают сравнимости: помехи убраны и одинаковы для всех прогонов, поэтому разницу результатов можно приписать модели, а не случайному шуму среды. Теряется перенос: вместе с шумом убрана часть настоящей работы (понять намерение, добрать контекст, выбрать инструмент, справиться с неполными данными). Поэтому результат корректно относить к очищенной постановке задачи, а на рабочие запросы его переносят с понижением.'
  id: 031-idealized-2
  fingerprint: 294411f5
- concept: объём предварительной подготовки задачи задаёт, насколько узко переносится полученный горизонт
  question: Команда берёт представительную выборку своих реальных задач, но перед прогоном инженер переписывает каждую в идеально оформленную инструкцию с готовыми путями и командами. Что даст такой прогон?
  explanation: 'Представительность отвечает за состав задач, а не за форму их подачи. Переписав постановки, ты сменил измеряемое свойство: агент больше не выполняет распознавание намерения и сбор контекста.'
  kind: choice
  options:
    - Горизонт, переносимый на рабочие запросы, потому что выборка была представительной
    - 'Горизонт на переписанных задачах: представительность выборки не компенсирует того, что подготовку сделал человек'
    - Заниженную оценку возможностей модели
    - Тот же результат, что и прогон на исходных формулировках
  correct: 1
