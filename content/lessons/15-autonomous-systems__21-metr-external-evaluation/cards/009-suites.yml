- concept: набор с эталоном человека-эксперта позволяет судить об уровне относительно специалиста, а не только о факте успеха
  question: Нужно понять, насколько работа модели в исследовательской ML-инженерии конкурентоспособна относительно специалиста. Какое свойство набора задач для этого необходимо?
  explanation: Без человеческого эталона результат кодируется только как «решила / не решила». Эталон эксперта превращает его в сравнение уровня — именно это нужно для порога вроде AI R&D-4, где вопрос стоит об ускорении разработки следующих систем.
  kind: choice
  options:
    - Наличие результата человека-эксперта на тех же задачах как эталона для сравнения
    - Максимально большое число задач в наборе
    - Равномерное покрытие задач по всем предметным категориям
  correct: 0
  id: 009-suites-1
  fingerprint: 21fab741
- concept: короткие задачи нужны для калибровки нижнего конца кривой горизонта
  question: В наборе для оценки временного горизонта есть задачи от получаса до многочасовых, но нет заданий на несколько минут. Что при этом теряется?
  explanation: Кривая P(успеха) от длительности подгоняется по всему диапазону. Без коротких задач верхняя часть кривой не закреплена данными, и оценка горизонта опирается на экстраполяцию. Роль коротких наборов (SWAA) — именно калибровка этого конца.
  kind: choice
  options:
    - Невозможно посчитать общий процент успешных задач
    - 'Нижний участок кривой не на что опереть: неизвестно, где модель ещё уверенно справляется и откуда начинается спад'
    - Результаты нельзя сравнивать между разными предметными категориями
  correct: 1
  id: 009-suites-2
  fingerprint: 9499b5d5
- concept: разные наборы задач измеряют разные свойства и не заменяют друг друга
  question: Модель уверенно проходит набор коротких заданий, но проваливает многочасовую исследовательскую ML-разработку. Объясни своими словами, почему из этого нельзя сделать вывод «модель сильная» или «модель слабая» и что нужно уточнить.
  explanation: Три набора — не три версии одного экзамена, а три прибора. Высокий результат на коротких задачах не заменяет измерение на длинных, а сравнение с экспертом не покрывает весь диапазон длительностей.
  kind: open
  reference: 'Наборы отвечают на разные вопросы. Короткие задания говорят о базовой компетентности на коротком горизонте, широкодиапазонный набор (HCAST) — о том, какую длительность автономной работы модель выдерживает, набор с эталоном эксперта (RE-Bench) — насколько её исследовательская работа сопоставима с работой специалиста. Поэтому сначала нужно назвать измеряемую способность: горизонт автономной работы, уровень относительно эксперта или успех в конкретной категории. Успех на одном наборе не переносится на вопросы, которые задают другие.'
  id: 009-suites-3
  fingerprint: 72a493ae
