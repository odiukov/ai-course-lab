- concept: порядок вычисления времени удвоения по списку датированных горизонтов
  question: Расставь по порядку шаги функции, которая по датированным горизонтам возвращает время удвоения в днях.
  explanation: Логарифм требует положительных горизонтов, а наклон — хотя бы двух разных дат, поэтому валидация идёт первой. Обратная величина наклона осмысленна только при положительном наклоне.
  kind: order
  items:
    - 'Проверить вход: все горизонты строго положительны, различных дат не меньше двух'
    - Перевести каждую дату в число дней от самого раннего замера
    - Взять логарифм по основанию два от каждого горизонта — тогда удвоение становится шагом на единицу
    - Подогнать прямую по всем точкам и взять наклон — прирост числа удвоений за день
    - Убедиться, что наклон положителен, и вернуть обратную ему величину как время удвоения в днях
  id: 023-doubling-time-1
  fingerprint: 1b548ebf
- concept: неположительный наклон означает отсутствие конечного времени удвоения по этим данным, а не результат, который надо спасать преобразованием
  question: Подгонка по датированным горизонтам дала нулевой (или отрицательный) наклон. Как должна повести себя функция времени удвоения?
  explanation: Нулевой наклон означает отсутствие роста — удвоение не наступает никогда; отрицательный означает падение. Модуль или отбрасывание точек подменяют данные и выдают число там, где ответа нет.
  kind: choice
  options:
    - Вернуть модуль обратной величины наклона
    - 'Сообщить об ошибке: по этим данным конечного времени удвоения не существует'
    - Вернуть нуль дней как признак мгновенного удвоения
    - Отбросить самую раннюю точку и пересчитать, пока наклон не станет положительным
  correct: 1
  id: 023-doubling-time-2
  fingerprint: fc3f6439
- concept: оценка темпа по всем точкам устойчивее оценки по крайней паре замеров при неравномерных интервалах
  question: Замеры горизонта сделаны через неравные промежутки. Почему время удвоения считают регрессией по всем точкам, а не по первому и последнему замеру?
  explanation: Пара крайних точек — это оценка с двумя степенями влияния и нулевым усреднением шума. Регрессия по всем точкам использует весь интервал; приводить разные уровни надёжности к общей шкале она при этом не умеет — сопоставимость входа обеспечивает вызывающий.
  kind: choice
  options:
    - Регрессия позволяет обойтись без логарифмической шкалы
    - Крайние точки определяют результат целиком, и один нетипичный замер сдвигает оценку; регрессия распределяет влияние по всем наблюдениям
    - По двум точкам наклон вычислить математически невозможно
    - Регрессия автоматически приводит замеры с разными уровнями надёжности к общей шкале
  correct: 1
  id: 023-doubling-time-3
