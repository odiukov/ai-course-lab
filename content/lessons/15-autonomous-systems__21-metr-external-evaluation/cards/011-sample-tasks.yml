- concept: 'порядок шагов стратифицированной выборки: валидация, разбиение на страты, квоты, отбор без повторов'
  question: Расставь шаги функции стратифицированного отбора задач в правильном порядке.
  explanation: Случайность работает внутри страт, а не вместо них. Если отобрать сначала, а разложить потом, состав групп определяет случай, и целые диапазоны длительности могут выпасть.
  kind: order
  items:
    - Проверить, что у каждой задачи есть идентификатор, категория и время эксперта
    - 'Разложить задачи по стратам: диапазон времени × категория (и набор, из которого задача взята)'
    - Вычислить квоту для каждой страты исходя из нужного размера выборки
    - Выбрать задачи внутри каждой страты без повторов и вернуть их идентификаторы
  id: 011-sample-tasks-1
  fingerprint: 7341ad43
- concept: недобор в страте нужно сообщать явно, а не добирать соседней категорией
  question: 'Квоту для одной страты нечем заполнить: подходящих задач меньше, чем требуется. Как должна повести себя функция отбора?'
  explanation: 'Тихая подмена соседней категорией сохраняет размер, но скрывает перекос: потребитель результата будет думать, что страта покрыта. Дублирование задач вдобавок ломает независимость наблюдений при подгонке кривой.'
  kind: choice
  options:
    - Добрать недостающие задачи из ближайшей категории, сохранив итоговый размер выборки
    - Явно сообщить о недоборе — ошибкой или предупреждением рядом с выборкой — согласно контракту функции
    - Продублировать уже выбранные задачи этой страты до нужного числа
  correct: 1
  id: 011-sample-tasks-2
  fingerprint: 3bb16fef
- concept: представительность выборки проверяют по покрытию страт и уникальности идентификаторов, а не по её размеру
  question: Функция вернула выборку требуемого размера. Какая проверка показывает, что выборка действительно представительна?
  explanation: 'Совпадение размера ничего не говорит о составе: выборка нужного объёма может целиком состоять из коротких задач одной категории. Представительность — это свойство покрытия страт плюс отсутствие дублей, раздувающих вес отдельных задач.'
  kind: choice
  options:
    - Сравнить размер выборки с запрошенным числом задач
    - Проверить, что все идентификаторы существуют в исходном наборе
    - Проверить покрытие временных диапазонов, категорий и наборов задач и отсутствие повторяющихся идентификаторов
  correct: 2
  id: 011-sample-tasks-3
  fingerprint: fb556d49
