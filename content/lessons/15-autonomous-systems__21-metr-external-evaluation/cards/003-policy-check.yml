- concept: пороговое правило применяется цепочкой определение — измерение — сравнение — режим мер
  question: Расставь шаги честного применения порогового правила политики масштабирования в правильном порядке.
  explanation: 'Выпадение любого звена ломает вывод: без определения непонятно, что мерить; без измерения нечего сравнивать; без сравнения решение опирается на впечатление, а не на порог.'
  kind: order
  items:
    - Политика фиксирует, какую способность, при какой надёжности и в каких условиях считать порогом
    - Оценщик проводит измерение по этой методике и получает конкретное число
    - Полученное число сравнивают с пороговой границей
    - По результату сравнения включают соответствующий режим мер и фиксируют основание решения
  id: 003-policy-check-1
  fingerprint: cf0e886b
- concept: предосторожное решение без измерения нельзя описывать как срабатывание порогового условия
  question: 'Инженер по безопасности без всяких измерений настоял отложить релиз: модель показалась ему слишком автономной. Как корректно описать это решение в отчёте?'
  explanation: Перестраховаться можно и без числа — это законное управленческое решение. Но записать его как срабатывание порога значит выдать ощущение за проверенное условие; в следующий раз такую запись нельзя ни воспроизвести, ни оспорить по существу.
  kind: choice
  options:
    - Как срабатывание порогового условия политики
    - Как предосторожное решение, принятое без проверки порогового условия
    - Как формальное доказательство того, что порог пересечён
    - Как отмену действия порогового правила для этой модели
  correct: 1
  id: 003-policy-check-2
  fingerprint: 1423e0f2
