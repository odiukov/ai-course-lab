- concept: понижающие факторы не независимы, поэтому отдельные скидки нельзя перемножать или складывать без проверки совместных комбинаций
  question: Команда измерила отдельно фактор грязных данных и отдельно фактор двусмысленных запросов и собирается просто перемножить их, чтобы предсказать продакшен. В чём риск и что делать вместо этого?
  explanation: Разложение на факторы — способ сделать разрыв проверяемым, а не арифметическое правило. Числа складываются и умножаются только после того, как совместные комбинации измерены.
  kind: open
  reference: 'Перемножение предполагает независимость условий, а её никто не проверял. Двусмысленный запрос особенно вреден именно на неполных данных: агент не может добрать недостающий контекст, поэтому совместное падение бывает глубже произведения отдельных скидок (иногда — мельче). Вместо перемножения: либо вводить условия по одному в фиксированном порядке и мерить фактор каждого перехода, либо прогнать сами комбинации условий и измерить совместный результат.'
