- concept: понижающий фактор — доля прежних успехов, сохранившаяся после одного изменённого условия
  question: На одном и том же наборе из 90 задач агент даёт 60 успехов в чистом тесте и 45 успехов после подключения настоящей базы с неполными полями. Чему равен понижающий фактор качества данных на этом переходе?
  explanation: 'Фактор считается от предыдущего результата, а не от общего числа задач: 45/60 = 0.75, то есть сохранилось 75% успехов. Знаменатель — успехи до изменения условия, иначе фактор нельзя приписать этому переходу.'
  kind: numeric
  answer: 0.75
  tolerance: 0.01
  id: 034-gap-factors-1
  fingerprint: 3a9ec034
- concept: фактор атрибутируем только парой сопоставимых прогонов, где изменено ровно одно условие при тех же задачах и критериях успеха
  question: Команда хочет получить понижающий фактор пользовательских формулировок. Какая пара прогонов даёт этот фактор?
  explanation: Если между прогонами меняется больше одного условия (или сами задачи), падение нельзя честно приписать выбранной причине. Реальный трафик меняет и формулировки, и данные, и последствия одновременно.
  kind: choice
  options:
    - Прогон на чистом бенчмарке и прогон на реальном трафике продукта за месяц
    - Те же задачи и тот же критерий успеха, но в одном прогоне структурированные промпты, а в другом — формулировки пользователей; всё остальное неизменно
    - Два прогона на разных наборах задач, отобранных случайно
    - Один прогон с усреднением результата по всем условиям сразу
