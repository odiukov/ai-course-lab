  question: Для уровня 95% подогнанная вероятность нигде не достигает такого значения на длительностях проверенных задач. Как правильно отчитаться?
  explanation: Кривая обоснована только там, где есть наблюдения. Продолжение её за границы диапазона даёт формальное число без опоры на измерения, а подмена уровня превращает отчёт в неверное утверждение о надёжности.
