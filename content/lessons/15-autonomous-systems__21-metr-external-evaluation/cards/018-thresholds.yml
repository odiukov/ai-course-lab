- concept: горизонт получают, решая уравнение кривой относительно log-времени и возвращая результат из логарифмической шкалы в минуты
  question: Подогнанная кривая имеет вид P(успех) = σ(6 − 1.5·ln t), где t — экспертное время в минутах. При какой длительности успех и провал равновероятны? Ответ в минутах.
  explanation: 'Равная вероятность исходов означает нулевой логит: 6 − 1.5·ln t = 0, отсюда ln t = 4 и t = e⁴ ≈ 54.6 минуты. Ключевой шаг — обратное преобразование из логарифмической шкалы: сам корень уравнения (4) выражен в log-единицах и минутами не является.'
  kind: numeric
  answer: 54.6
  tolerance: 1
