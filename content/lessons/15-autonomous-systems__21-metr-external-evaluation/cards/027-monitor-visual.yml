- concept: надёжность мониторинга оценивается по результату против сильнейшего доступного противника, а не по лучшей полученной цифре обнаружения
  question: Монитор ловит 50 из 50 побочных задач, выполненных открыто, и 35 из 50 — при маскировке. Какое число характеризует надёжность защиты?
  explanation: 'Идеальная цифра на наивном агенте достижима и у посредственного монитора: лёгкий нарушитель делает любую охрану безупречной на бумаге. Осмысленная оценка защиты — нижняя граница по сильнейшему испытанному противнику, а не максимум и не среднее.'
  kind: choice
  options:
    - Результат против маскирующегося агента, потому что защита проверяется по самому сильному сопернику, которого удалось предъявить
    - Лучший результат — 50 из 50, он показывает потолок возможностей монитора
    - Среднее двух прогонов, потому что оба сценария встречаются на практике
