- concept: разницу между прогонами нельзя приписать модели, пока не зафиксированы условия обоих прогонов
  question: Два прогона на одной выборке дали 38% и 52% успешных задач. Что нужно, чтобы приписать разницу самой модели?
  explanation: Процент — функция не только модели, но и условий запуска. Пока не показано, что условия совпадают, разница 38% против 52% объясняется, например, добавленным инструментом или другим лимитом попыток. Больше задач уменьшит шум, но не разберёт конфаундинг.
  kind: choice
  options:
    - Увеличить число задач в выборке и повторить оба прогона
    - 'Убедиться, что записанные условия прогонов совпадают: версия модели, доступные инструменты, промпт, лимиты времени и попыток'
    - Взять среднее двух значений как более устойчивую оценку
  correct: 1
  id: 012-manifest-1
  fingerprint: '07832078'
- concept: конфигурация обвязки вокруг модели входит в условия прогона наравне с самой моделью
  question: Что из перечисленного обязано попасть в манифест прогона, потому что напрямую меняет результат?
  explanation: 'Оценивают не «модель вообще», а модель вместе с обвязкой: те же веса с терминалом и без него дают разные проценты. Дата и авторство полезны для учёта, но сами по себе не объясняют результат; средняя длительность — уже итог, а не условие.'
  kind: choice
  options:
    - Системный промпт, набор доступных инструментов, право исполнять код, лимиты времени и числа попыток
    - Календарная дата прогона и имя запустившего его инженера
    - Средняя длительность одной задачи в минутах по итогам прогона
  correct: 0
  id: 012-manifest-2
  fingerprint: a021599a
- concept: манифест не выравнивает условия, а делает различия видимыми и потому сравнимыми
  question: 'Коллега говорит: «Манифест прогона нужен, чтобы все прогоны шли в одинаковых условиях». Объясни своими словами, в чём он неправ и какова настоящая функция манифеста.'
  explanation: 'Одинаковые условия — отдельное требование протокола, а не свойство манифеста. Манифест обеспечивает атрибуцию: он превращает скрытые различия в явные, поэтому по нему можно решить, сравнимы две точки или нет.'
  kind: open
  reference: 'Манифест ничего не выравнивает: он не запрещает менять версию модели, инструменты или лимиты. Его функция — записать, что именно и в каких условиях проверялось, чтобы результат был привязан к конфигурации. Тогда различие между прогонами видно и его можно учесть: точка, полученная с другим набором инструментов или другой версией модели, относится к другому эксперименту и не кладётся на ту же кривую как продолжение. Без манифеста незаметная смена условий выглядит как изменение возможностей модели.'
  id: 012-manifest-3
  fingerprint: 7179e79c
