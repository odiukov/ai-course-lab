- concept: продолжение тренда умножает горизонт на 2^(прошедшее время / время удвоения)
  question: Время удвоения горизонта — 150 дней, текущий горизонт при фиксированном уровне надёжности — 3 часа. Какой горизонт даёт продолжение того же тренда через 600 дней (в часах)?
  explanation: '600 / 150 = 4 удвоения, множитель 2⁴ = 16, значит 3 × 16 = 48 часов. Так же считается годовой множитель: при времени удвоения 130,8 дня за год проходит ≈2,8 удвоения, то есть примерно ×7.'
  kind: numeric
  answer: 48
  tolerance: 0.5
  id: 022-doubling-window-2
  fingerprint: 1a3aae9b
- concept: экстраполяция по наклону тренда — прогноз, наследующий допущение о сохранении наклона, а не новое измерение возможностей
  question: Инженер берёт время удвоения и считает горизонт модели на год вперёд. Почему это число нельзя ставить в отчёт наравне с измеренными горизонтами?
  explanation: 'Разница между «14 часов измерено в январе 2026» и «~97 часов через год» — не в точности, а в статусе утверждения: второе число зависит от того, останется ли темп прежним.'
  kind: open
  reference: 'Измеренный горизонт — результат прогонов конкретной модели по набору задач в зафиксированных условиях. Число «через год» никто не прогонял: оно получено продолжением подогнанной прямой и держится на допущении, что наклон сохранится и что метрика останется той же. Такое число помечают как прогноз и приводят вместе с окном подгонки и наклоном, иначе допущение исчезает, а цифра начинает выглядеть как факт об измеренной возможности.'
