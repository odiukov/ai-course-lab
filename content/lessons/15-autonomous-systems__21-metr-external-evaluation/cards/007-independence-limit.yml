- concept: самоотчётность метрик создаёт стимул оптимизировать именно ту метрику, о которой отчитываешься
  question: Лаборатория сама проводит оценки опасных возможностей своей модели и сама публикует их результаты. Какой структурный риск это создаёт, даже если сотрудники добросовестны?
  explanation: 'Проблема не в честности людей, а в совмещении ролей: тот, кого измеряют, задаёт и метрику, и способ её подсчёта, и форму отчёта. Внешний оценщик — структурный ответ на этот конфликт интересов, а не проверка добросовестности.'
  kind: choice
  options:
    - Оценка становится технически невозможной без внешних вычислительных ресурсов
    - У организации появляется интерес к тому, чтобы отчётная метрика выглядела благополучно, и работа смещается в сторону улучшения именно этой метрики
    - Результаты оценки перестают быть воспроизводимыми на других наборах задач
  correct: 1
  id: 007-independence-limit-1
  fingerprint: 63aae19a
- concept: независимость оценщика подтверждается проверяемыми структурными признаками, а не декларацией беспристрастности
  question: Организация называет себя независимым оценщиком ИИ-моделей. Что даёт основание считать эту независимость структурной, а не декларативной?
  explanation: 'Независимость проверяется по устройству организации и по открытости процедуры: отдельный некоммерческий статус (у METR — 501(c)(3)), опубликованная методология, рецензирование. Заявление о непредвзятости ничем не подкреплено, а широкий доступ — это про охват проверки, а не про то, кто выносит суждение.'
  kind: choice
  options:
    - Организация не входит в структуру лаборатории, имеет отдельный юридический статус, публикует методологию и проводит работы через рецензируемые публикации
    - Организация заявляет в отчёте, что не имела давления со стороны разработчика модели
    - Организация получила от лаборатории самый широкий из возможных режимов доступа к модели
  correct: 0
  id: 007-independence-limit-2
  fingerprint: 8fd2c988
