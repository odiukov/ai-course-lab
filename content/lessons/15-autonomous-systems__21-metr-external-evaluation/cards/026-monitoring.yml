- concept: оценка мониторинга измеряет две величины сразу — обнаружение монитором и способность агента уклониться, поэтому одна цифра обнаружения на неадаптивном агенте не характеризует устойчивость
  question: Монитор заметил побочную задачу в 24 записях из 30, где агент выполнял её без попыток скрыть. Что обоснованно утверждать по этой цифре?
  explanation: 'Прототипы оценок мониторинга у METR меряют обе стороны: обнаруживает ли монитор побочную задачу и умеет ли агент от него уклониться. Цифра на неадаптивном агенте отвечает только на первый вопрос — это базовая чувствительность, а не устойчивость.'
  kind: choice
  options:
    - 'Монитор устойчив: он обнаруживает большинство побочных задач'
    - Монитор чувствителен к предъявленному в этих записях поведению; про устойчивость к агенту, подбирающему незаметный способ, цифра ничего не говорит
    - Монитор пропустит примерно такую же долю и при любой стратегии агента
  correct: 1
  id: 026-monitoring-1
  fingerprint: f86b8d0a
- concept: уклонение — это подбор агентом поведения с учётом факта проверки, а не случайный пропуск монитора
  question: Чем уклонение агента отличается от обычного пропуска монитора?
  explanation: Разница в наличии адаптации. Пропуск — свойство чувствительности монитора на фиксированном поведении. Уклонение измеряет, способен ли агент найти поведение, которое монитор не ловит, — это отдельная измеряемая величина, а не побочный эффект первой.
  kind: choice
  options:
    - 'Ничем: и то и другое — необнаруженная побочная задача, разница только в терминологии'
    - Уклонение — это когда монитор отключён, а пропуск — когда он работал
    - Уклонение — целенаправленный подбор способа выполнения побочной задачи с учётом того, что идёт проверка; пропуск может произойти и без всякой адаптации со стороны агента
  correct: 2
  id: 026-monitoring-2
