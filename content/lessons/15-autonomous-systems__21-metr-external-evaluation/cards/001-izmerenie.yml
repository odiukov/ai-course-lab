- concept: внешний оценщик измеряет возможности, но не задаёт порог и не принимает решение о выпуске
  question: Независимая организация внешней оценки измерила возможности передовой модели и передала результат лаборатории. Что НЕ входит в её роль?
  explanation: 'Роли разделены: разработчик строит модель, политика масштабирования задаёт границу допустимого риска, внешний оценщик поставляет свидетельство о возможностях. Решение остаётся за организацией — оценщик не пишет политику и не выдаёт разрешение на релиз. Поэтому фраза «METR разрешил выпуск» бессмысленна, а «METR измерил горизонт при таких-то условиях» — нет.'
  kind: choice
  options:
    - Измерять возможности модели по заранее заданной методике
    - Решать, выпускать ли модель и какие меры безопасности включить
    - Фиксировать условия, в которых проводилось измерение
    - Публиковать методологию, по которой получено число
  correct: 1
  id: 001-izmerenie-1
  fingerprint: 6b4f7de8
- concept: общая шкала возможностей требует одинакового набора задач и условий для всех моделей
  question: 'Две лаборатории заявляют: «наша модель прошла внутреннюю проверку на автономность». Почему это слабая опора для порогового правила политики масштабирования?'
  explanation: Пороговое правило работает, только если результаты сопоставимы между моделями. Сопоставимость даёт фиксированный набор задач, лимиты и требуемая надёжность, одинаковые для всех прогонов — как в Time Horizon. Два «прошёл проверку» из разных протоколов не сравниваются, даже если оба честны.
  kind: choice
  options:
    - Внутренние проверки всегда занижают возможности модели
    - Проверки шли по разным задачам и условиям, поэтому их итоги не образуют общей шкалы для сравнения моделей
    - Внутренняя оценка возможностей запрещена регуляторами
    - Внутренняя проверка не даёт числа, а любое число надёжнее словесного описания
  correct: 1
  id: 001-izmerenie-2
  fingerprint: eb20535b
- concept: измерение возможностей должно предшествовать релизу, а публикация методологии может идти позже
  question: Расставь порядок событий при внешней оценке передовой модели, при которой политика масштабирования реально влияет на решение.
  explanation: 'Измерение бесполезно для политики, если приходит после релиза: решение уже принято. Поэтому доступ дают заранее и под NDA, а публикация методологии сдвигается назад. Отсюда же и типичная асимметрия во времени: числа обсуждают публично уже после того, как модель вышла.'
  kind: order
  items:
    - Лаборатория даёт внешнему оценщику доступ к модели под соглашением о неразглашении, до публичного релиза
    - Оценщик проводит измерение возможностей по заданной методике и передаёт результат
    - Лаборатория сравнивает результат с порогом политики и решает, выпускать модель и с какими мерами
    - Оценщик публикует методологию и результаты оценки
  id: 001-izmerenie-3
  fingerprint: 35f8bfe0
