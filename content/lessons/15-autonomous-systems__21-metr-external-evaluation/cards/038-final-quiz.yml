- concept: надёжность неоднородна по задачам одной длительности, поэтому средний горизонт скрывает категорию с систематическим провалом
  question: Внутри набора задач одной экспертной длительности агент почти всегда решает задачи одной категории и почти никогда — другой. Как правильно отчитаться?
  explanation: Длительность — не единственный признак задачи. Систематический, а не случайный провал целой категории означает, что средняя кривая описывает смесь двух режимов; для решения о допуске важно знать, в какой из них попадает твоя задача. Удаление неудобной категории просто подгоняет результат.
  kind: choice
  options:
    - 'Дать надёжность по категориям отдельно: единый горизонт усредняет два разных поведения и скрывает систематически проваленный класс'
    - 'Дать только средний горизонт: он и есть сводная характеристика набора'
    - Выбросить проваленную категорию как выброс и пересчитать кривую
    - 'Считать разброс шумом выборки: при одинаковой длительности надёжность обязана совпадать'
  correct: 0
