- concept: густота сетки экспертных длительностей влияет на неопределённость оценки горизонта, а не сдвигает её систематически
  question: Ты урезал сетку экспертных длительностей задач с 24 значений до 12, сохранив тот же диапазон от самых коротких до самых длинных задач. Чего ждать от оценки горизонта?
  explanation: 'Число наблюдений задаёт устойчивость подгонки, а не её систематический уровень: пока диапазон длительностей сохранён, наклон и сдвиг оцениваются вокруг тех же значений, но шире разбросаны. Систематический сдвиг оценки даёт как раз обрезание диапазона — когда исчезают самые длинные или самые короткие задачи.'
  kind: choice
  options:
    - 'Точечная оценка сместится слабо, но неопределённость вырастет: кривая опирается на меньше наблюдений'
    - Горизонт систематически удвоится, потому что задач стало вдвое меньше
    - Горизонт станет ровно вдвое короче пропорционально числу точек
    - 'Оценка вообще не изменится: подгонке важен только диапазон, а не число точек в нём'
  correct: 0
