- concept: 'подгонка невозможна при вырожденных метках: в данных должны присутствовать оба исхода'
  question: Модель решила все задачи прогона без единого провала. Почему логистическую регрессию по таким данным нельзя использовать для оценки горизонта?
  explanation: Горизонт — это точка, где вероятность успеха проходит заданный уровень. Если в выборке один класс, данные не содержат информации о том, где происходит спад, и надо расширять диапазон задач вверх по длительности. Равного числа классов при этом не требуется, нужен лишь второй класс.
  kind: choice
  options:
    - Потому что модель слишком сильна и её горизонт заведомо бесконечен
    - 'Потому что в данных нет перехода между исходами: положение спада не определено, а подгонка выродится или не сойдётся'
    - Потому что логистическая регрессия требует равного числа успехов и провалов
  correct: 1
  id: 016-success-curve-1
  fingerprint: 3d6b7c5b
- concept: столбец вероятности успеха в predict_proba находят по порядку классов обученной модели, а не по фиксированному индексу
  question: 'Заполни пропуск: как безопасно выбрать столбец вероятности класса «успех»?'
  explanation: '`predict_proba` возвращает столбцы в порядке `classes_`. Жёстко взятый первый столбец обычно соответствует провалу, и кривая получится перевёрнутой — вероятность будет расти с длительностью.'
  kind: cloze
  template: |-
    success_column = list(___).index(SUCCESS_LABEL)
    probabilities = model.predict_proba(features)[:, success_column]
  answer: model.classes_
  accept:
    - clf.classes_
    - model.classes_.tolist()
    - classes_
  id: 016-success-curve-2
  fingerprint: 9713a671
- concept: положительный коэффициент при log-времени — диагностический сигнал об ошибке в метках или выборке, а не повод перевернуть знак
  question: 'После подгонки коэффициент при log-времени оказался положительным: чем длиннее задача, тем выше подогнанная вероятность успеха. Как поступить?'
  explanation: Убывание — ожидаемое свойство, а не то, что надо навязывать руками. Молчаливая смена знака спрячет реальную ошибку и даст правдоподобное, но неверное число горизонта.
  kind: choice
  options:
    - Умножить коэффициент на минус единицу, чтобы кривая убывала как положено
    - 'Разобраться в причине: чаще всего перепутаны метки исхода, взят столбец не того класса или выборка не покрывает длинные задачи'
    - 'Принять результат как есть: у сильных моделей вероятность успеха и должна расти с длительностью'
  correct: 1
  id: 016-success-curve-3
  fingerprint: be053cb7
