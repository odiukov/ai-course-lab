- concept: число времени удвоения цитируется вместе с границами окна подгонки, иначе теряется вопрос, на который оно отвечает
  question: Почему время удвоения нельзя приводить без указания отрезка данных, по которому сделана подгонка?
  explanation: Именно поэтому TH1.1 приводит 130,8 дня с пометкой «по данным после 2023 года» и рядом ставит оценку по интервалу 2019–2025 — подпись окна и делает два числа совместимыми.
  kind: open
  reference: 'Наклон — свойство выбранного отрезка, а не константа ряда: ранние медленные годы занижают темп, недавний рывок завышает его относительно всей истории. Без границ окна читатель не знает, о каком режиме идёт речь, не может воспроизвести подгонку и не может корректно сопоставить число с чужой оценкой. Поэтому рядом со временем удвоения держат даты начала и конца окна (и уровень надёжности, при котором сняты горизонты).'
