- concept: оценки из разных окон нельзя усреднять или комбинировать — окно выбирается под вопрос, на который отвечаешь
  question: Нужен темп роста для суждения о ближайших месяцах. Есть оценка по недавнему отрезку и оценка по всей истории наблюдений. Что делать?
  explanation: Среднее двух наклонов не является наклоном ни одного отрезка и не отвечает ни на один вопрос. Длинное окно точнее описывает весь период, а не ближайшее будущее.
  kind: choice
  options:
    - Взять среднее двух оценок — так надёжнее
    - Взять оценку по недавнему отрезку и указать её окно; усреднение смешивает два разных вопроса
    - 'Взять оценку по всей истории: чем больше данных, тем точнее'
    - Взять большее из чисел как консервативную оценку
  correct: 1
