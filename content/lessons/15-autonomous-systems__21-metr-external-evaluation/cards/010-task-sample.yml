- concept: ступени по времени задают по кратности (логарифмическая шкала), а не равными интервалами
  question: Как разумнее разбить задачи на группы по времени эксперта при построении кривой горизонта?
  explanation: 'Сложность растёт по масштабу, а не по разности: шаг с 3 минут на 6 по смыслу такой же, как с 4 часов на 8. Равные интервалы сжимают весь короткий конец в одну корзину и растягивают длинный, поэтому кривую строят по логарифму времени.'
  kind: choice
  options:
    - 'Равными интервалами: 0–90 минут, 90–180 минут, 180–270 минут'
    - 'Ступенями по кратности: около 5 минут, около 30 минут, около 3 часов, около суток'
    - 'По числу задач: три группы одинакового размера независимо от времени'
  correct: 1
  id: 010-task-sample-1
  fingerprint: cf934b0a
- concept: если категория задач совпадает с длительностью, причину провала нельзя атрибутировать
  question: В выборке все короткие задачи — по разработке ПО, а все многочасовые — по кибербезопасности. Модель проваливает многочасовые. Что мешает интерпретировать этот результат?
  explanation: Два признака сцеплены, и данные не различают гипотезы «не тянет длинную работу» и «слаба в кибербезопасности». Поэтому разнообразие категорий стараются сохранять внутри каждой временной ступени.
  kind: choice
  options:
    - 'Ничего: результат прямо показывает предел горизонта модели'
    - Длительность и предметная категория меняются вместе, поэтому непонятно, что именно вызвало провал
    - Выборка слишком мала для подгонки логистической кривой
  correct: 1
  id: 010-task-sample-2
  fingerprint: 4ea70259
- concept: квоты выбирают заранее и фиксируют непокрытые сочетания, а не выравнивают все группы поровну
  question: В доступном наборе редкая категория представлена десятком задач. Как корректно поступить при формировании выборки на 45 задач?
  explanation: 'Равные доли — такой же перекос, как и случайный набор: редкая категория начинает определять итоговую кривую. Задача не в равенстве, а в осознанных долях плюс честной пометке о непокрытых сочетаниях, чтобы читатель результата видел границы выборки.'
  kind: choice
  options:
    - Отдать редкой категории равную с остальными долю, чтобы выборка была сбалансированной
    - Исключить редкую категорию, чтобы не искажать пропорции
    - Заранее назначить ей осознанную небольшую долю, не дать самой многочисленной группе вытеснить остальных и явно записать, какие сочетания почти не покрыты
  correct: 2
  id: 010-task-sample-3
