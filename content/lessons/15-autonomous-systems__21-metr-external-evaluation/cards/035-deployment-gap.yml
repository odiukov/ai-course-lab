- concept: разрыв считается только по задачам, сопоставленным по идентификатору, поэтому валидация и сопоставление идут до подсчёта долей
  question: Расставь шаги функции, считающей разрыв между бенчмарком и рабочими условиями.
  explanation: Без сопоставления по идентификатору число смешивает разницу условий с разницей сложности выборок. Доли имеют смысл только на общем множестве задач, а количество сопоставленных задач возвращается вместе с разрывом, чтобы читатель видел базу расчёта.
  kind: order
  items:
    - 'Проверить обе выборки: непустота, отсутствие дубликатов идентификаторов'
    - Сопоставить записи по идентификатору задачи и явно сообщить о несовпавших
    - Посчитать долю успеха отдельно по каждому режиму на сопоставленном множестве
    - Вычесть рабочую долю из бенчмарочной и вернуть обе доли, разрыв и число сопоставленных задач
