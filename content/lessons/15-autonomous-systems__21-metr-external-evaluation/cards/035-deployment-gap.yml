- concept: разрыв внедрения выражается в процентных пунктах как разность двух долей успеха, а не в процентах от бенчмарочного результата
  question: 'После сопоставления по идентификатору задачи осталось 60 общих задач: в бенчмарке успешны 48, в рабочих условиях — 33. Чему равен разрыв внедрения в процентных пунктах?'
  explanation: '48/60 = 80%, 33/60 = 55%, разрыв = 80 − 55 = 25 процентных пунктов. Это не «25 процентов»: относительное падение здесь другое (25/80 ≈ 31%), и путать шкалы нельзя.'
  kind: numeric
  answer: 25
  tolerance: 0.5
  id: 035-deployment-gap-1
  fingerprint: 9975501b
- concept: отрицательный разрыв не обрезают до нуля — знак диагностичен и указывает на шум, малую выборку или благоприятную рабочую среду
  question: Функция расчёта разрыва получила, что в рабочих условиях успехов больше, чем в бенчмарке. Как правильно поступить?
  explanation: 'Обрезка прячет диагностику: по знаку видно, что с измерением что-то не так или что рабочие условия действительно легче. Честный знак важнее удобного вывода.'
  kind: choice
  options:
    - 'Обрезать результат до нуля: разрыв не может быть отрицательным по смыслу'
    - Вернуть отрицательное значение как есть — это сигнал о шуме, слишком малой сопоставленной выборке или неожиданно удачной рабочей среде
    - Поменять местами доли, чтобы разрыв стал положительным
    - Взять модуль разрыва, поскольку важна только величина
  correct: 1
