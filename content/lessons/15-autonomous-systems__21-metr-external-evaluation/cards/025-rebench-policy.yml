- concept: свидетельство для порога об автоматизации AI R&D даёт набор задач из той же предметной области, а не равный горизонт на посторонних задачах
  question: Две модели показали одинаковый горизонт — 11 часов при одной дате и одном уровне надёжности. Первая набрала его на общих программных и логических задачах, вторая — на задачах исследовательской ML-инженерии. Решается вопрос, достигнут ли порог автоматизации AI R&D. Как соотносятся эти два свидетельства?
  explanation: Горизонт говорит о длительности задач, которые модель обычно доводит до конца, но не о том, какого рода это задачи. Порог AI R&D сформулирован про исследовательскую ML-разработку, поэтому набор из этой области (RE-Bench, 71 задача) прикладывает линейку к нужному предмету, а равный горизонт на посторонних задачах — нет.
  kind: choice
  options:
    - 'Свидетельства равноценны: горизонт одинаковый, значит и вывод о пороге одинаковый'
    - Свидетельство второй модели ближе к порогу, потому что её задачи лежат в той деятельности, о которой говорит порог
    - 'Свидетельство первой модели сильнее: широкий разброс задач всегда надёжнее узкого набора'
  correct: 1
  id: 025-rebench-policy-1
  fingerprint: 5036c91a
- concept: высокий балл на предметно подходящем наборе не доказывает автоматизацию всей области, потому что набор — конечная выборка из неё
  question: Модель показала сильный результат на наборе из 40 задач по исследовательской ML-инженерии. Объясни, почему из этого ещё не следует, что AI R&D автоматизирована, — и что этот результат всё-таки даёт.
  explanation: Вывод «набор пройден, значит область автоматизирована» переносит утверждение с выборки на генеральную совокупность без обоснования. Правильная формулировка результата — утверждение об этом классе задач в этих условиях.
  kind: open
  reference: 'Набор задач — конечная выборка из области, а реальная исследовательская работа шире: включает постановку задач, длинные проекты, взаимодействие с людьми и неоформленные цели, которых в наборе нет. Поэтому балл характеризует способность на задачах такого типа и такой длительности, а не покрытие всей деятельности. Ценность результата в другом: предметная область набора совпадает с формулировкой порога, поэтому измерение относится к нужной деятельности, а не к смежной.'
  id: 025-rebench-policy-2
  fingerprint: f1413617
