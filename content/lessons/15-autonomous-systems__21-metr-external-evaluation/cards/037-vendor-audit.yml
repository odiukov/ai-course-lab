- concept: неуказанное условие заявления фиксируется как неизвестное, а не заменяется удобным умолчанием
  question: Вендор заявляет горизонт 9 часов. В заявлении есть версия модели и порог надёжности, но ничего не сказано о том, какая помощь человека допускалась при прогоне. Как обойтись с этим условием при подготовке своей проверки?
  explanation: 'Заявление превращают в запись условий: версия, дата, порог надёжности, набор задач, инструменты, помощь человека. Достроенное умолчание выглядит как измеренное условие и делает последующее сравнение неатрибутируемым, а выброс заявления теряет полезный ориентир. Неизвестное условие остаётся помеченным неизвестным.'
  kind: choice
  options:
    - Пометить условие как неизвестное и учитывать этот пробел при трактовке результата
    - Принять «без помощи человека» как разумное умолчание для современных агентов
    - Принять «с полной помощью человека», чтобы получить консервативную оценку
    - 'Отбросить заявление целиком: неполная запись условий не годится ни для чего'
  correct: 0
  id: 037-vendor-audit-1
  fingerprint: d85b7ff1
- concept: правило решения с тремя исходами, включая «не определено», записывается до прогона
  question: Расставь шаги аудита заявления вендора о горизонте в правильном порядке.
  explanation: 'Правило пишут до того, как увидены числа: иначе граница «заметно ниже» подгоняется под полученный результат. Исход «не определено» обязателен — выборка в десятки задач даёт сигнал, но при большом разбросе не даёт права ни подтвердить, ни опровергнуть заявку.'
  kind: order
  items:
    - 'Записать заявление как набор условий: версия модели, дата, порог надёжности, набор задач, инструменты, помощь человека'
    - Собрать выборку задач с экспертными длительностями ниже заявленного горизонта, рядом с ним и выше него
    - Зафиксировать условия своего прогона в манифесте
    - Записать правило решения с исходами «поддержано», «опровергнуто», «не определено»
    - Выполнить прогон и подогнать кривую успеха при том же пороге надёжности
    - Вынести вердикт по заранее записанному правилу
  id: 037-vendor-audit-2
  fingerprint: cbf32563
- concept: воспроизведение заявления и проверка применимости у себя — два отдельных прогона, которые нельзя смешивать в один набор
  question: Ты проверяешь заявку вендора о горизонте и одновременно хочешь понять, годится ли агент для твоих задач. Объясни своими словами, почему задачи из твоей рабочей среды нельзя добавить в тот же набор, на котором ты воспроизводишь заявку.
  explanation: 'Правило одного изменённого условия: атрибуция возможна, когда между сопоставимыми прогонами меняется ровно одна вещь. Смешение даёт одно число на два вопроса и не отвечает ни на один.'
  kind: open
  reference: 'Это два разных вопроса с разными условиями. Воспроизведение требует условий, максимально близких к заявленным (тот же тип задач, те же инструменты, тот же порог надёжности): только тогда расхождение можно приписать заявке. Проверка применимости требует твоего распределения задач и твоей обвязки. В смешанном наборе изменены сразу два условия — состав задач и среда, — поэтому по итоговому числу нельзя сказать, что именно не сошлось: вендор завысил цифру или твои задачи просто другие. Прогоны держат раздельно и отчитываются двумя числами.'
  id: 037-vendor-audit-3
  fingerprint: 3b325bc6
