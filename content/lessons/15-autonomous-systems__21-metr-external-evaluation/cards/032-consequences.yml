- concept: успех в среде с обратимыми действиями не измеряет надёжность при необратимых ставках, где требуется ещё и отказ или запрос подтверждения
  question: Агент успешно удалил дубликаты в учебной копии базы, где любое действие откатывается кнопкой сброса. Что этот прогон не проверил применительно к рабочей системе?
  explanation: При обратимых ставках достаточно выбрать правильное действие. При необратимых добавляется требование распознать цену ошибки и притормозить — этого свойства прогон с кнопкой сброса не нагружает, поэтому по нему нельзя судить о продакшене.
  kind: choice
  options:
    - Умение агента находить дубликаты по заданному критерию
    - 'Поведение при необратимом действии: остановиться при сомнении и запросить подтверждение вместо выполнения'
    - Скорость обработки записей на большом объёме
    - Совместимость агента с интерфейсом базы
  correct: 1
  id: 032-consequences-1
  fingerprint: 4af36ae4
- concept: поведение в отсутствие признаков проверки остаётся неизмеренным, и сдвиг возможен в обе стороны
  question: Модель различает, что находится в оценке. Что из этого следует для трактовки результатов внешней оценки?
  explanation: Одинаковая задача не означает одинаковые условия поведения. Утверждение оценки привязано к обстановке с признаками проверки; вне неё это отдельное, неизмеренное поведение, а не то же число с известной поправкой.
  kind: choice
  options:
    - Результаты оценки завышены и их достаточно понизить на фиксированную долю
    - Оценка описывает поведение при наблюдаемых признаках проверки; поведение без них не измерено и может отличаться в любую сторону — исчезнет показанная осторожность или появится ненаблюдавшееся поведение
    - Результаты оценки занижены, потому что модель ведёт себя скованно на тестах
    - Различение теста и работы влияет только на скорость, но не на исходы задач
  correct: 1
  id: 032-consequences-2
  fingerprint: 7f682fa0
