- concept: время удвоения задаёт срок годности принятого решения о безопасности, а не дату, когда модель справится с конкретной задачей
  question: Оценка времени удвоения горизонта — 6 месяцев. Что это число говорит о принятом сегодня решении «эту задачу автономно не отдаём»?
  explanation: Темп роста — про календарь перепроверки, а не про судьбу конкретной задачи. Он говорит, как долго нынешняя практика остаётся оправданной без новых мер, и когда нужно повторить измерение.
  kind: choice
  options:
