- concept: публичный горизонт работает как prior — стартовая граница, корректируемая вниз под свои условия, и не выдаёт разрешения на автономию
  question: Почему опубликованный горизонт называют prior, и в какую сторону его корректируют перед внедрением? Ответь своими словами.
  explanation: 'Три роли горизонта отвечают на три разных вопроса: допустимо ли отдавать задачу автономно, когда перепроверять решение, с какого числа начинать собственную оценку. Prior — третья роль, и поправка к нему всегда в понижающую сторону.'
  kind: open
  reference: 'Prior — черновая стартовая оценка до появления собственных данных. Корректировка идёт вниз: в продакшене инструменты и данные хуже, задачи и запросы запутаннее, последствия необратимы, признаки проверки слабее — все эти факторы понижающие. Поэтому горизонт даёт первую границу и дату её пересмотра, а не разрешение на автономный режим; разрешение появляется только после измерения на своём распределении задач.'
