- concept: требуемый уровень надёжности выбирается из условий эксплуатации, а не из витринного показателя отчёта
  question: Агента допускают в эксплуатацию, только если он доводит задачу до конца примерно в 95 прогонах из 100. Отчёт приводит горизонты при уровнях надёжности 25%, 60% и 95%. Какой горизонт служит ориентиром для допуска?
  explanation: Уровень надёжности горизонта задаёт долю успешных прогонов. Эксплуатация требует 95 успехов из 100, значит и горизонт берут при уровне 95%. Более длинные горизонты при мягких уровнях описывают режим, в котором агент регулярно проваливается.
  kind: choice
  options:
    - Горизонт при 25% — он самый длинный и показывает потолок возможностей
    - Горизонт при 95% — он соответствует требуемой доле успешных прогонов
    - Среднее арифметическое трёх горизонтов
    - Горизонт при 60% — середина отчётной шкалы
  correct: 1
  id: 020-threshold-check-1
  fingerprint: ae3293f1
- concept: уровень надёжности горизонта читается как ожидаемая доля успешных прогонов на задачах такой экспертной длительности
  question: Горизонт модели при уровне надёжности 60% равен четырём часам экспертного времени. Модели дают 25 независимых задач того же класса с экспертным временем ровно четыре часа. Сколько успехов ожидать?
  explanation: 'Горизонт при уровне p означает: на задачах такой экспертной длительности доля успеха ≈ p. 0,6 × 25 = 15. Именно поэтому мягкий уровень даёт эффектно длинный горизонт ценой частых провалов.'
  kind: numeric
  answer: 15
  tolerance: 1
