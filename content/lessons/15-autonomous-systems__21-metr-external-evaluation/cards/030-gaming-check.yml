- concept: доля переворачиваемых исходов берётся от числа провалов, а не от общего числа задач
  question: Модель решила 70 задач из 200. Затем 30% её провалов превратились в успехи. Какой станет доля успеха, в процентах?
  explanation: Провалов 200 − 70 = 130, переворачивается 130 × 0.3 = 39. Успехов становится 70 + 39 = 109, то есть 109/200 = 54.5%. Если ошибочно взять 30% от всех 200 задач, получится 60 переворотов и завышенный ответ 65% — база процента здесь решает всё.
  kind: numeric
  answer: 54.5
  tolerance: 0.5
  id: 030-gaming-check-1
  fingerprint: 6fbc06d6
- concept: отличить рост способности от артефакта оценки позволяет прогон того же набора задач без маркеров оценки, а не пересчёт самой метрики
  question: Доля успеха модели на наборе выросла. Какой шаг позволяет отличить настоящий рост способности от эффекта распознавания контекста оценки?
  explanation: 'Артефакт возникает из-за различия условий подачи, поэтому и проверяется сравнением условий: набор и модель те же, меняются только маркеры оценки. Ни строгость уровня надёжности, ни размер выборки не устраняют систематический сдвиг — он одинаково присутствует во всех наблюдениях.'
  kind: choice
  options:
    - Пересчитать горизонт с более строгим уровнем надёжности
    - Прогнать тот же набор задач ещё раз, убрав из подачи признаки того, что идёт оценка, и сравнить исходы
    - Увеличить число задач в наборе — на большой выборке артефакт усреднится
  correct: 1
