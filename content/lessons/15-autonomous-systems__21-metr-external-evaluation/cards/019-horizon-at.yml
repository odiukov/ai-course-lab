- concept: обратную функцию проверяют круговым прогоном через прямую кривую с допуском на численную погрешность
  question: Как надёжнее всего проверить реализацию функции, которая по требуемой надёжности возвращает длительность задачи?
  explanation: 'Круговой прогон проверяет связку прямого и обратного преобразования целиком, включая знак наклона и работу с логарифмом. Точного равенства требовать нельзя: экспоненцирование и логит дают накопленную погрешность плавающей точки, поэтому сравнение идёт с допуском.'
  kind: choice
  options:
    - Подставить полученную длительность в прямую кривую и сравнить полученную вероятность с запрошенной с небольшим допуском
    - Сравнить результат с длительностью задачи, на которой модель фактически провалилась
    - Потребовать точного побитового равенства запрошенной и восстановленной вероятности
