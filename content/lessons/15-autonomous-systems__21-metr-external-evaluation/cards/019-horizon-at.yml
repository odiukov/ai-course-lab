  question: Кривая подогнана на экспертных длительностях, записанных в секундах. Функция вернула 5400. Как читать этот результат?
  explanation: Подгонка знает только числа, которые ей дали. Если под логарифмом были секунды, обратное преобразование возвращает секунды. Единицу нельзя вывести из самой модели — её надо фиксировать вместе с данными и переводить уже на уровне вызывающего кода.
  kind: choice
  options:
