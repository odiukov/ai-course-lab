- concept: логистическая форма даёт монотонное снижение с выходом на плато, поэтому вероятность зажата между нулём и единицей
  question: Почему для зависимости вероятности успеха от log-времени берут логистическую форму, а не прямую?
  explanation: 'Возможности связаны со сложностью монотонно и с насыщением: на очень коротких задачах успех почти всегда, на очень длинных почти никогда. Прямая продолжила бы падение за ноль и подъём за единицу, что бессмысленно для вероятности.'
  kind: choice
  options:
    - Логистическая кривая монотонно убывает и выходит на плато с обоих концов, оставаясь между нулём и единицей, тогда как прямая уходит за границы вероятности
    - Логистическая кривая проходит ближе к каждому наблюдению, чем прямая
    - Прямая непригодна только потому, что ось времени логарифмическая
