- concept: методология оценки версионируется, поэтому число цитируется вместе с версией, а результаты разных версий не сравниваются напрямую
  question: 'Бенчмарк автономных возможностей вышел в новой версии: набор задач и способ подгонки изменились. Как корректно обращаться с числами, полученными по прежней версии?'
  explanation: Time Horizon 1.0 (март 2025) и 1.1 (январь 2026) — разные измерительные инструменты, а не одна шкала. Число без версии методики нельзя ни воспроизвести, ни сопоставить с более поздней оценкой.
  kind: choice
  options:
    - 'Сравнивать их напрямую с новыми: версия методики на числа не влияет'
    - Указывать версию методики рядом с числом и не сравнивать результаты разных версий напрямую
    - Считать прежние числа недействительными и исключать их из отчётов
    - Пересчитывать прежние числа через единый коэффициент обновления
