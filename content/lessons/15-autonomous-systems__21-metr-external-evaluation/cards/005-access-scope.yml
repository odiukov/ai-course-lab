- concept: результат внешней оценки — утверждение о конкретной конфигурации доступа, а не о «модели вообще»
  question: Отчёт внешнего оценщика сообщает, что модель справляется с задачами длиной до нескольких часов. Что обязательно нужно прочитать рядом с этим числом, чтобы вывод остался корректным?
  explanation: 'Оценивают не абстрактную модель, а модель при выданном доступе. Область действия вывода задаётся конфигурацией: версия, интерфейс, инструменты, лимиты времени и прочие разрешённые условия работы.'
  kind: choice
  options:
    - Только дату публикации отчёта
    - Какую версию модели дали оценщику, через какой интерфейс, с какими инструментами и лимитами времени
    - Стоимость обращения к модели через API
    - Численность команды оценщика
  correct: 1
  id: 005-access-scope-1
  fingerprint: cf791f92
- concept: 'выводы из результата асимметричны: слабый результат при узком доступе не доказывает неспособность, сильный результат с инструментами не переносится на ограниченный продукт'
  question: Оценщику дали только текстовый чат без инструментов, и результат вышел низким. Что из этого следует?
  explanation: 'Узкий доступ ограничивает вывод в обе стороны: низкий результат не доказывает неспособность модели, а высокий результат с богатым набором инструментов нельзя автоматически приписывать более ограниченному продукту.'
  kind: choice
  options:
    - Модель не способна на большее ни в какой конфигурации доступа
    - 'Вывод ограничен этой конфигурацией: с доступом к коду и файлам результат может оказаться выше'
    - Оценка недействительна и её нельзя использовать
    - Модель наверняка справится с любой задачей, если дать ей инструменты
  correct: 1
  id: 005-access-scope-2
  fingerprint: f712a14d
- concept: независимость оценщика недостаточна, потому что лаборатория решает, что и в каком виде отдать на проверку
  question: Почему независимая внешняя оценка поднимает планку, но не закрывает вопрос о возможностях модели?
  explanation: Внешняя оценка лечит стимул оптимизировать самостоятельно отчитываемые метрики, но объём проверки задаёт тот, кто выдаёт доступ. Поэтому вопрос «какую модель и с какими возможностями разрешили проверить» остаётся частью чтения любого отчёта.
  kind: choice
  options:
    - Потому что независимые оценщики заинтересованы занижать результаты
    - Потому что лаборатория сама решает, какие модели и в каком виде передать на проверку
    - Потому что результаты внешних оценок не публикуются
    - Потому что внутренние метрики лаборатории по определению точнее
  correct: 1
  id: 005-access-scope-3
