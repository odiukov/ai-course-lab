- concept: горизонт задан экспертным временем класса задач и вероятностью успеха, а не обещанием выполнить конкретную задачу такой длины
  question: Менеджер читает «горизонт 5 часов при надёжности 75%» и планирует отдать модели пятичасовую задачу как гарантированно выполнимую. Объясни своими словами, что в этом чтении неверно.
  explanation: 'Две частые подмены: вероятность читают как гарантию, а экспертное время задачи — как время работы модели. В отчётах METR горизонт при надёжности 50% (например, около 14 часов) означает буквально «успех через раз» на задачах такой экспертной длительности.'
  kind: open
  reference: 'Число описывает класс задач, на которые эксперт-человек тратит около пяти часов, и оценённую вероятность успеха модели на таких задачах — примерно три успеха из четырёх попыток. Это не гарантия для конкретной задачи: примерно каждая четвёртая попытка проваливается, и провал не обязан быть предсказуемым заранее. Пять часов — это экспертное время задачи, а не время работы модели и не длительность её непрерывной автономности. Наконец, оценка привязана к конкретному набору задач и условиям прогона, поэтому переносить её на произвольную «пятичасовую работу» нельзя.'
  id: 021-january-numbers-2
