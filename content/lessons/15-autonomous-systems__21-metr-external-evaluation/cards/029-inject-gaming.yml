- concept: воспроизводимость прогона обеспечивается переданным генератором с фиксированным начальным состоянием, а не глобальным источником случайности
  question: Тест должен получать один и тот же результат `inject_gaming` при каждом запуске. Что для этого нужно?
  explanation: 'Глобальный генератор делит состояние со всем остальным кодом: любой посторонний вызов сдвинет последовательность и сломает воспроизводимость. Явный генератор с заданным начальным состоянием привязывает случайность к прогону функции. Сортировка на детерминизм бросков не влияет.'
  kind: choice
  options:
    - Использовать переданный в функцию генератор с фиксированным seed
    - Вызывать глобальный `random.random()` — он и так детерминирован внутри процесса
    - Отсортировать список результатов перед проходом
  correct: 0
