- concept: вероятность переворота задаёт поведение на серии, а не точную квоту в конкретном коротком списке
  question: В списке 16 провалов, gaming_rate = 0.5. Сколько провалов станет успехами при одном запуске?
  explanation: Для каждого провала бросок независим, поэтому количество переворотов — биномиальная величина со средним 16 × 0.5 = 8 и разбросом вокруг него. Крайние значения возможны, но не равновероятны. Точное совпадение с квотой дало бы другую функцию — выбор фиксированного числа элементов без повторов.
  kind: choice
  options:
    - 'Ровно 8: половина от 16'
    - Ожидаемо около 8, но конкретное число колеблется от запуска к запуску
    - Любое число от 0 до 16 равновероятно
