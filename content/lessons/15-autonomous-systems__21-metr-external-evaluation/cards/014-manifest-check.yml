- concept: совпадение итоговых баллов не свидетельствует о сопоставимости прогонов — сначала сверяют условия, потом трактуют числа
  question: 'Два прогона дали одинаковый итог: по 55 решённых задач. Что из этого следует?'
  explanation: Балл — следствие и модели, и условий. Более лёгкая выборка при слабой модели даёт то же число, что тяжёлая выборка при сильной. Поэтому сравнение начинается со сверки полей манифеста, а не с итоговых чисел.
  kind: choice
  options:
    - 'Ничего о равенстве возможностей: одинаковое число могло получиться на разных наборах задач и при разных лимитах'
    - 'Конфигурации равносильны: совпадение итога и есть доказательство одинаковых условий'
    - Прогоны сопоставимы, если хотя бы версия модели в них различалась
  correct: 0
  id: 014-manifest-check-1
  fingerprint: 41323e8d
- concept: 'правило подсчёта успеха и число попыток — часть условий измерения: их изменение меняет метрику, а не измеряемую способность'
  question: В новом прогоне задача засчитывается, если решена хотя бы с третьей попытки; раньше засчитывалась только первая попытка. Результат вырос. О чём это говорит?
  explanation: Критерий успеха задаёт саму измеряемую величину. Смена правила переопределяет, что называется «решённой задачей», поэтому два числа отвечают на разные вопросы, даже если модель и набор задач одни и те же.
  kind: choice
  options:
    - Модель стала способнее ровно на величину прироста
    - Прирост частично или полностью объясняется смягчённым правилом зачёта — величины измерены разными метриками и напрямую не сравнимы
    - Правило зачёта относится к отчётности и на сопоставимость чисел не влияет
  correct: 1
