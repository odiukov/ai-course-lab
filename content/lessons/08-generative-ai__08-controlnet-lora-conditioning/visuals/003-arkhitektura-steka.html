<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Где ControlNet и LoRA подключаются к базовой модели</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fb;
    --panel: #ffffff;
    --panel-soft: #eef2f7;
    --ink: #172033;
    --muted: #526079;
    --base: #63748f;
    --base-fill: #e7ebf1;
    --control: #1678b8;
    --control-fill: #d9effc;
    --lora: #b53d85;
    --lora-fill: #f8dced;
    --zero: #198d72;
    --zero-fill: #d8f3ea;
    --line: #8d99aa;
    --frame: #cbd3df;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --panel: #182235;
      --panel-soft: #202c42;
      --ink: #f3f6fb;
      --muted: #b8c3d5;
      --base: #aab7cb;
      --base-fill: #29364c;
      --control: #66c7ff;
      --control-fill: #173d56;
      --lora: #ff8dcc;
      --lora-fill: #512341;
      --zero: #61d8b7;
      --zero-fill: #16483e;
      --line: #8190a8;
      --frame: #40506a;
    }
  }

  html, body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  h1 {
    font-size: 20px;
    font-weight: bold;
  }

  #stage {
    background: var(--panel);
    border: 1px solid var(--frame);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
  }

  .box {
    fill: var(--panel-soft);
    stroke: var(--frame);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .base-shell {
    fill: var(--base-fill);
    stroke: var(--base);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .base-block {
    fill: var(--panel);
    stroke: var(--base);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .control-shell, .control-block {
    fill: var(--control-fill);
    stroke: var(--control);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .attention {
    fill: var(--panel);
    stroke: var(--lora);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .matrix {
    fill: var(--lora-fill);
    stroke: var(--lora);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .weight {
    fill: var(--base-fill);
    stroke: var(--base);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .zero {
    fill: var(--zero-fill);
    stroke: var(--zero);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .control-flow {
    fill: none;
    stroke: var(--control);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .zero-flow {
    fill: none;
    stroke: var(--zero);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .lora-flow {
    fill: none;
    stroke: var(--lora);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .arrow-head {
    stroke: none;
  }

  .head-flow { fill: var(--line); }
  .head-control { fill: var(--control); }
  .head-zero { fill: var(--zero); }

  text {
    fill: var(--ink);
    font-size: 13px;
  }

  .title-label {
    font-size: 15px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .strong {
    font-weight: bold;
  }

  .control-text { fill: var(--control); }
  .lora-text { fill: var(--lora); }
  .zero-text { fill: var(--zero); }

  .fallback {
    color: var(--ink);
    background: var(--panel);
    font-size: 15px;
  }
</style>
</head>
<body>
<h1>Где ControlNet и LoRA подключаются к базовой модели</h1>
<div id="stage">
  <svg id="diagram" viewBox="0 0 1040 470" width="1040" height="470"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Подключение ControlNet и LoRA к SDXL</title>
    <desc id="diagram-desc">ControlNet идёт параллельной ветвью и передаёт сигналы через нулевые свёртки, а матрицы LoRA встроены внутрь слоя внимания замороженной SDXL.</desc>
  </svg>
</div>

<script>
(() => {
  const data = Object.freeze({
    corner: 10,
    arrow: { size: 12, wing: 6 },
    base: { x: 170, y: 45, w: 830, h: 155 },
    baseBlocks: [
      { x: 210, y: 100, w: 95, h: 65, label: "энкодер", note: "крупная структура" },
      { x: 340, y: 100, w: 95, h: 65, label: "энкодер", note: "детали" },
      { x: 470, y: 100, w: 95, h: 65, label: "середина", note: "U-Net" },
      { x: 600, y: 100, w: 95, h: 65, label: "декодер", note: "сборка" }
    ],
    baseArrows: [
      { x1: 305, y1: 132, x2: 340, y2: 132 },
      { x1: 435, y1: 132, x2: 470, y2: 132 },
      { x1: 565, y1: 132, x2: 600, y2: 132 },
      { x1: 695, y1: 132, x2: 730, y2: 132 }
    ],
    attention: { x: 730, y: 88, w: 245, h: 94 },
    weight: { x: 750, y: 122, w: 40, h: 42 },
    matrixB: { x: 816, y: 120, w: 18, h: 46 },
    matrixA: { x: 860, y: 133, w: 72, h: 20 },
    symbols: [
      { x: 803, y: 143, value: "+", className: "lora-text strong" },
      { x: 847, y: 143, value: "×", className: "lora-text strong" }
    ],
    input: { x: 20, y: 273, w: 120, h: 92 },
    pose: {
      head: { x: 80, y: 307, r: 8 },
      lines: [
        { x1: 80, y1: 315, x2: 80, y2: 337 },
        { x1: 80, y1: 322, x2: 62, y2: 332 },
        { x1: 80, y1: 322, x2: 99, y2: 328 },
        { x1: 80, y1: 337, x2: 66, y2: 354 },
        { x1: 80, y1: 337, x2: 96, y2: 353 }
      ]
    },
    inputArrow: { x1: 140, y1: 319, x2: 170, y2: 319 },
    control: { x: 170, y: 263, w: 470, h: 117 },
    controlBlocks: [
      { x: 210, y: 305, w: 95, h: 48, label: "энкодер" },
      { x: 340, y: 305, w: 95, h: 48, label: "энкодер" },
      { x: 470, y: 305, w: 95, h: 48, label: "энкодер" }
    ],
    controlArrows: [
      { x1: 305, y1: 329, x2: 340, y2: 329 },
      { x1: 435, y1: 329, x2: 470, y2: 329 }
    ],
    zeroConvs: [
      { x: 228, y: 220, w: 59, h: 30, cx: 257, top: 165, bottom: 305 },
      { x: 358, y: 220, w: 59, h: 30, cx: 387, top: 165, bottom: 305 },
      { x: 488, y: 220, w: 59, h: 30, cx: 517, top: 165, bottom: 305 }
    ],
    labels: [
      { x: 190, y: 70, dx: 0, dy: 0, anchor: "start", value: "❄  ЗАМОРОЖЕННАЯ БАЗА SDXL • 2.6B ПАРАМЕТРОВ", className: "title-label" },
      { x: 745, y: 105, dx: 0, dy: 0, anchor: "start", value: "ВНИМАНИЕ: LoRA ВНУТРИ", className: "small lora-text strong" },
      { x: 770, y: 143, dx: 0, dy: 0, anchor: "middle", value: "W", className: "strong" },
      { x: 825, y: 143, dx: 0, dy: 0, anchor: "middle", value: "B", className: "lora-text strong" },
      { x: 896, y: 143, dx: 0, dy: 0, anchor: "middle", value: "A", className: "lora-text strong" },
      { x: 952, y: 169, dx: 0, dy: 0, anchor: "end", value: "узкие матрицы LoRA", className: "small lora-text" },
      { x: 190, y: 285, dx: 0, dy: 0, anchor: "start", value: "ПАРАЛЛЕЛЬНЫЙ ЭНКОДЕР CONTROLNET", className: "title-label control-text" },
      { x: 80, y: 289, dx: 0, dy: 0, anchor: "middle", value: "карта позы", className: "small control-text strong" },
      { x: 190, y: 241, dx: 0, dy: 0, anchor: "end", value: "сигналы сбоку", className: "small zero-text" }
    ],
    legend: [
      { x1: 170, x2: 210, y: 407, tx: 225, value: "ControlNet: пространственные сигналы входят в U-Net на нескольких уровнях", lineClass: "control-flow", headClass: "head-control", textClass: "control-text" },
      { x1: 170, x2: 210, y: 435, tx: 225, value: "LoRA: поправка B × A встроена в существующий слой внимания", lineClass: "lora-flow", headClass: "head-flow", textClass: "lora-text" }
    ]
  });

  const origin = Object.freeze({ x: 20, y: 18 });
  const scale = Object.freeze({ x: 1, y: 1 });

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("diagram");
  const stage = document.getElementById("stage");

  const setAttrs = (element, attrs) => {
    Object.entries(attrs).forEach(([name, value]) => element.setAttribute(name, value));
    return element;
  };

  const make = (tag, attrs, parent = svg) => {
    const element = document.createElementNS(svg.namespaceURI, tag);
    setAttrs(element, attrs);
    parent.appendChild(element);
    return element;
  };

  const group = className => make("g", { class: className });

  const rect = (item, className, parent = svg) => make("rect", {
    x: sx(item.x),
    y: sy(item.y),
    width: sx(item.x + item.w) - sx(item.x),
    height: sy(item.y + item.h) - sy(item.y),
    rx: sx(data.corner) - sx(0),
    ry: sy(data.corner) - sy(0),
    class: className
  }, parent);

  const line = (item, className, parent = svg) => make("line", {
    x1: sx(item.x1),
    y1: sy(item.y1),
    x2: sx(item.x2),
    y2: sy(item.y2),
    class: className
  }, parent);

  const circle = (item, className, parent = svg) => make("circle", {
    cx: sx(item.x),
    cy: sy(item.y),
    r: sx(item.r) - sx(0),
    class: className
  }, parent);

  const label = (item, parent = svg) => {
    const text = make("text", {
      x: sx(item.x) + item.dx,
      y: sy(item.y) + item.dy,
      "text-anchor": item.anchor,
      "dominant-baseline": "middle",
      class: item.className
    }, parent);
    text.textContent = item.value;
    return text;
  };

  const centered = (item, value, className, dy, parent = svg) => label({
    x: item.x + item.w / scale.x / (scale.x + scale.x),
    y: item.y + item.h / scale.y / (scale.y + scale.y),
    dx: data.labels.at(scale.x - scale.x).dx,
    dy,
    anchor: "middle",
    value,
    className
  }, parent);

  const arrow = (item, lineClass, headClass, parent = svg) => {
    line(item, lineClass, parent);
    const dx = item.x2 - item.x1;
    const dy = item.y2 - item.y1;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const backX = item.x2 - data.arrow.size * ux;
    const backY = item.y2 - data.arrow.size * uy;
    const points = [
      { x: item.x2, y: item.y2 },
      { x: backX + data.arrow.wing * uy, y: backY - data.arrow.wing * ux },
      { x: backX - data.arrow.wing * uy, y: backY + data.arrow.wing * ux }
    ];
    const [tip, left, right] = points;
    make("polygon", {
      points: [
        `${sx(tip.x)},${sy(tip.y)}`,
        `${sx(left.x)},${sy(left.y)}`,
        `${sx(right.x)},${sy(right.y)}`
      ].join(" "),
      class: `arrow-head ${headClass}`
    }, parent);
  };

  const draw = () => {
    const baseLayer = group("base-layer");
    rect(data.base, "base-shell", baseLayer);

    data.baseBlocks.forEach(block => {
      rect(block, "base-block", baseLayer);
      centered(block, block.label, "strong", -data.arrow.wing, baseLayer);
      centered(block, block.note, "small", data.arrow.size, baseLayer);
    });

    data.baseArrows.forEach(item => arrow(item, "flow", "head-flow", baseLayer));

    rect(data.attention, "attention", baseLayer);
    rect(data.weight, "weight", baseLayer);
    rect(data.matrixB, "matrix", baseLayer);
    rect(data.matrixA, "matrix", baseLayer);

    data.symbols.forEach(item => label({
      x: item.x,
      y: item.y,
      dx: data.labels.at(scale.x - scale.x).dx,
      dy: data.labels.at(scale.x - scale.x).dy,
      anchor: "middle",
      value: item.value,
      className: item.className
    }, baseLayer));

    const inputLayer = group("condition-layer");
    rect(data.input, "box", inputLayer);
    circle(data.pose.head, "control-block", inputLayer);
    data.pose.lines.forEach(item => line(item, "control-flow", inputLayer));
    arrow(data.inputArrow, "control-flow", "head-control", inputLayer);

    const controlLayer = group("control-layer");
    rect(data.control, "control-shell", controlLayer);

    data.controlBlocks.forEach(block => {
      rect(block, "control-block", controlLayer);
      centered(block, block.label, "control-text strong", data.labels.at(scale.x - scale.x).dy, controlLayer);
    });

    data.controlArrows.forEach(item => arrow(item, "control-flow", "head-control", controlLayer));

    const bridgeLayer = group("zero-convolution-layer");
    data.zeroConvs.forEach(item => {
      arrow(
        { x1: item.cx, y1: item.bottom, x2: item.cx, y2: item.top },
        "zero-flow",
        "head-zero",
        bridgeLayer
      );
      rect(item, "zero", bridgeLayer);
      centered(item, "нулевая 1×1", "small zero-text strong", data.labels.at(scale.x - scale.x).dy, bridgeLayer);
    });

    const labelLayer = group("labels");
    data.labels.forEach(item => label(item, labelLayer));

    const legendLayer = group("legend");
    data.legend.forEach(item => {
      arrow(
        { x1: item.x1, y1: item.y, x2: item.x2, y2: item.y },
        item.lineClass,
        item.headClass,
        legendLayer
      );
      label({
        x: item.tx,
        y: item.y,
        dx: data.labels.at(scale.x - scale.x).dx,
        dy: data.labels.at(scale.x - scale.x).dy,
        anchor: "start",
        value: item.value,
        className: item.textClass
      }, legendLayer);
    });
  };

  try {
    draw();
  } catch (error) {
    stage.className = "fallback";
    stage.textContent = "Схема должна была показать замороженную базу SDXL на 2.6B параметров, параллельный энкодер ControlNet с нулевыми свёртками 1×1 и узкие матрицы LoRA A и B внутри слоёв внимания.";
  }
})();
</script>
</body>
</html>
