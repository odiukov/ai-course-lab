- concept: DreamBooth хранит существенно более объёмное изменение модели, чем Textual Inversion, ради более сильного сходства с объектом
  question: Объясни своими словами, почему DreamBooth обычно требует больше памяти и вычислений, чем Textual Inversion, и в каком случае эти затраты оправданы.
  explanation: 'Размер результата отражает масштаб сохраняемых изменений: Textual Inversion добавляет небольшой вектор-понятие, а DreamBooth глубоко адаптирует модель. За более сильное сходство приходится платить памятью и вычислениями.'
  kind: open
  reference: Textual Inversion обучает компактное представление одного понятия в виде нового токена, тогда как DreamBooth дообучает значительно большую часть генеративной модели под конкретный объект. DreamBooth оправдан, когда особенно важно сильное и устойчивое сходство с этим объектом.
