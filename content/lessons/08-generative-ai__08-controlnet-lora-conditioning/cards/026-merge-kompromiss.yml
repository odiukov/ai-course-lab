- concept: вплавление LoRA заменяет базовые веса суммой базы и масштабированной низкоранговой поправки
  question: Заполни формулу весов модели после вплавления LoRA.
  explanation: При вплавлении заранее вычисляют масштабированную LoRA-поправку и записывают её сумму с базовыми весами. Поэтому во время инференса отдельное вычисление и добавление ветви LoRA уже не требуется.
  kind: cloze
  template: W_merged = ___
  answer: W + α · B @ A
  accept:
    - W + alpha * (B @ A)
    - W + α(B @ A)
    - W + alpha(B @ A)
  id: 026-merge-kompromiss-1
  fingerprint: f0a7e283
- concept: регулирование масштаба LoRA после вплавления требует сохранённых раздельных весов базы и адаптера
  question: Команда вплавила LoRA в базовую модель, а позднее захотела изменить силу её воздействия. Что позволит сделать это корректно?
  explanation: Во вплавленном чекпойнте сохранена уже готовая сумма базовых весов и LoRA-поправки при выбранном α. Отдельного адаптера в нём нет, поэтому для нового масштаба нужны исходная база и сохранённый файл LoRA.
  kind: choice
  options:
    - Изменить параметр α непосредственно у вплавленного чекпойнта
    - Загрузить сохранённую исходную базу и отдельную LoRA, а затем задать новый α
    - Переименовать вплавленный чекпойнт и повторно загрузить его
    - Изменить только вес ControlNet при генерации
  correct: 1
