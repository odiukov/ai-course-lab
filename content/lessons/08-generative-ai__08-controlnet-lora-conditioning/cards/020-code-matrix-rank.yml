- concept: ранг ступенчатой матрицы равен числу её ненулевых строк
  question: После приведения матрицы к ступенчатому виду в ней осталось 5 ненулевых строк. Каков ранг исходной матрицы?
  explanation: Элементарные преобразования строк сохраняют ранг. Каждая ненулевая строка ступенчатой матрицы содержит опорный элемент и представляет независимое направление, поэтому ранг равен числу таких строк.
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 020-code-matrix-rank-1
  fingerprint: f4a269cf
- concept: опорную строку выбирают и устанавливают на нужное место до исключения элементов опорного столбца
  question: Расположите действия одной итерации метода Гаусса для столбца, в котором среди необработанных строк существует допустимый опорный элемент.
  explanation: Сначала выбирают пригодный опорный элемент и помещают его в текущую опорную строку. Только после этого строку используют для исключения зависимых компонентов, а найденный опорный элемент учитывают при вычислении ранга.
  kind: order
  items:
    - Найти среди необработанных строк элемент, модуль которого не меньше порога.
    - При необходимости поменять найденную строку местами с текущей опорной строкой.
    - Вычесть подходящие кратные опорной строки из остальных строк, обнуляя элементы опорного столбца.
    - Засчитать опорный элемент и перейти к следующей опорной строке.
  id: 020-code-matrix-rank-2
  fingerprint: a6da32e0
- concept: порог сравнения с нулём предотвращает ошибочный подсчёт численного шума как независимого направления
  question: Объясните, почему при вычислении ранга матрицы с числами с плавающей точкой нельзя считать любой ненулевой остаток новым опорным элементом. Что произойдёт при слишком маленьком или слишком большом пороге?
  explanation: 'Остаток вроде 0.00000000003 может быть следствием округления, а не новым направлением. Порог отделяет такие остатки от значимых элементов: неудачно выбранный порог приводит соответственно к завышению или занижению ранга.'
  kind: open
  reference: После арифметических операций точный ноль может превратиться в очень малый остаток из-за погрешности представления чисел. Слишком маленький порог может завысить ранг, приняв такой шум за опорный элемент, а слишком большой — занизить ранг, отбросив настоящее независимое направление.
  id: 020-code-matrix-rank-3
  fingerprint: 8b15f4c3
