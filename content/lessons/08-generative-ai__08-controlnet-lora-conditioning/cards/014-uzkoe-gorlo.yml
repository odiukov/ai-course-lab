- concept: ранг произведения B @ A не превосходит размерность промежуточного пространства
  question: Пусть ΔW = B @ A, где A ∈ R^{7×300}, а B ∈ R^{300×7}. Объясни, почему такая факторизация не может представить произвольную матрицу поправки размера 300×300.
  explanation: Узкое промежуточное пространство ограничивает число независимых направлений изменения. Именно это ограничение делает дельту низкоранговой и уменьшает её выразительность по сравнению с произвольной полной матрицей.
  kind: open
  reference: Ранг произведения B @ A не может превышать 7. Все выходные поправки лежат в пространстве, натянутом не более чем на 7 столбцов B, тогда как произвольная матрица 300×300 может иметь ранг до 300.
  id: 014-uzkoe-gorlo-2
