- concept: линейное изменение весов LoRA не гарантирует линейного изменения результата всей сети
  question: Почему пропорциональное увеличение коэффициента одной LoRA не обязано вызывать такое же пропорциональное усиление её видимого эффекта при генерации?
  explanation: Линейность относится к сборке рабочих весов слоя, а не ко всей функции генеративной модели. Нелинейные преобразования и взаимодействие адаптеров нарушают пропорциональность между коэффициентом LoRA и воспринимаемым изменением изображения.
  kind: open
  reference: Коэффициент линейно масштабирует дельту весов, но далее сигнал проходит через нелинейные функции, внимание и последовательные этапы генерации. Поэтому изменение внутренних весов может непропорционально усилить, ослабить или изменить итоговый эффект.
