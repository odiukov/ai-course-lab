- concept: нулевой выход управляющего слоя не мешает обучению его весов по градиенту
  question: Объясни своими словами, почему слой с нулевыми начальными весами может начать обучаться, хотя при первом прямом проходе его выход равен нулю.
  explanation: Веса участвуют в вычислении выхода, поэтому функция потерь может иметь ненулевую производную по ним даже при их нулевом текущем значении. Сначала обновляется слой подключения, а затем управляющее воздействие и обучение предшествующей ветви постепенно усиливаются.
  kind: open
  reference: Нулевой выход не означает нулевой градиент по весам слоя. Если входные признаки и градиент функции потерь ненулевые, обратное распространение вычисляет ненулевую поправку к весам. После обновления слой начинает пропускать выученную дельту; градиент к более ранним частям управляющей ветви также появляется по мере выхода его весов из нуля.
