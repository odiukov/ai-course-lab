- concept: IP-Adapter добавляет преобразованные токены изображения к текстовым токенам в cross-attention
  question: Как IP-Adapter позволяет U-Net одновременно учитывать текстовый промпт и референсное изображение?
  explanation: CLIP кодирует визуальные особенности референса, а обучаемый адаптер переводит это представление в токены, совместимые с cross-attention U-Net. Поэтому механизм внимания может учитывать их наряду с текстовыми токенами.
  kind: choice
  options:
    - Передаёт необработанные пиксели референса в текстовый энкодер
    - Преобразует представление изображения из CLIP в токены для cross-attention и подаёт их вместе с текстовыми токенами
    - Заменяет U-Net энкодером изображений CLIP
    - Добавляет готовое референсное изображение к результату после генерации
  correct: 1
  id: 030-ip-adapter-1
  fingerprint: 07fd9c9a
- concept: компактность IP-Adapter обеспечивается обучением только преобразователя визуального представления без переобучения базовой генеративной модели
  question: Почему для добавления обусловливания по референсному изображению IP-Adapter не требуется переобучать всю генеративную модель?
  explanation: 'IP-Adapter не обучает генеративную модель заново: он обучает только небольшой переводчик между представлением CLIP и входом cross-attention. Поэтому адаптер занимает порядка 20 МБ.'
  kind: open
  reference: Базовая модель уже умеет принимать токены обусловливания через cross-attention. Достаточно обучить небольшой адаптер, который преобразует представление изображения из CLIP в совместимые с этим механизмом токены, оставляя веса базовой модели неизменными.
  id: 030-ip-adapter-2
  fingerprint: 18d8380a
