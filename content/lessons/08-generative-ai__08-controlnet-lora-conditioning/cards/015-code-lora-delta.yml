  fingerprint: eaad5ccd
- concept: при вычислении B @ A общий индекс выбирает столбец B и соответствующую строку A
  question: Заполни пропуск в коде вычисления одного элемента низкоранговой поправки ΔW = B @ A.
  explanation: 'Для позиции [i][j] индекс k проходит по общей размерности матриц: из B берётся элемент строки i и столбца k, а из A — элемент строки k и столбца j.'
  kind: cloze
  template: delta[i][j] = sum(B[i][k] * ___ for k in range(len(A)))
  answer: A[k][j]
  accept:
    - A[k, j]
    - A[k][j]
