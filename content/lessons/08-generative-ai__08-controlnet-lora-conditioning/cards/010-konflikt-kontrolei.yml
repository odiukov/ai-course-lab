- concept: конфликт нескольких ControlNet выявляется сравнением раздельной и совместной генерации
  question: ControlNet позы и ControlNet глубины по отдельности улучшают изображение, но при совместном включении появляются сломанная анатомия и смещения объектов. Какой вывод наиболее обоснован?
  explanation: Если обе карты полезны по отдельности, а дефекты возникают только вместе, вероятная причина — конфликт условий или чрезмерное суммарное давление. Типичный случай — поза и глубина с весами 1,0 каждая; начинать настройку безопаснее с уменьшения общей суммы весов.
  kind: choice
  options:
    - Один из управляющих сигналов обязательно построен неверно
    - Совместное воздействие условий чрезмерно или пространственные требования конфликтуют
    - Базовая модель не поддерживает одновременное подключение нескольких ControlNet
    - Нужно одинаково увеличить веса обеих управляющих ветвей
  correct: 1
  id: 010-konflikt-kontrolei-1
  fingerprint: ced69974
- concept: при конфликте ControlNet приоритетное условие усиливают относительно остальных при ограничении общего воздействия
  question: Для сцены точность жеста важнее точности глубины, но совместная генерация по этим условиям искажает изображение. Объясни, как следует перенастроить веса.
  explanation: Весами задают относительную настойчивость условий. Если критичен жест, позе можно отдать большую часть общего веса, например 0,6, а глубине — 0,4. Одновременно снижать одно условие при усилении другого полезнее, чем повышать оба.
  kind: open
  reference: Нужно уменьшить суммарное воздействие ControlNet, оставить вес позы относительно выше веса глубины и затем изменять их небольшими шагами, каждый раз проверяя результат.
  id: 010-konflikt-kontrolei-2
