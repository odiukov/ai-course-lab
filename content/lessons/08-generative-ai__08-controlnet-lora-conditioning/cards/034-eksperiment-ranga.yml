- concept: достаточный ранг LoRA устраняет теоретический предел представимости, но не гарантирует успешную оптимизацию
  question: Целевая поправка имеет известный ранг k, а LoRA обучается с рангом r ≥ k, но после обучения сохраняется заметная ошибка. Что из этого можно заключить и чего заключать нельзя?
  explanation: В эксперименте целевая дельта ранга 2 точно помещается в LoRA такого же или большего ранга. Если ошибка остаётся, это свидетельствует не о математической невозможности представления, а о проблеме поиска решения или постановки обучения.
  kind: open
  reference: 'Такую ошибку нельзя объяснить обязательной нехваткой ранга: адаптер в принципе способен представить целевую поправку. Однако достаточная ёмкость не гарантирует, что обучение найдёт нужные матрицы, поэтому следует проверять оптимизацию, длительность обучения, данные и реализацию.'
