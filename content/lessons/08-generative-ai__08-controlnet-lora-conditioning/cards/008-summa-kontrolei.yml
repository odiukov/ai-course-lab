- concept: поправки нескольких ControlNet независимо масштабируются и поэлементно складываются с базовыми признаками
  question: В одном элементе тензора базовый признак равен 11. Одна ветвь ControlNet выдаёт поправку 16 с весом 0.25, другая — поправку −3 с весом 0.75. Чему равен итоговый элемент признаков?
  explanation: 'Каждую поправку сначала умножают на её вес, а затем результаты прибавляют к базовому признаку: 11 + 0.25 × 16 + 0.75 × (−3) = 12.75.'
  kind: numeric
  answer: 12.75
  tolerance: 0.01
  id: 008-summa-kontrolei-1
  fingerprint: 67d9c373
- concept: вес ControlNet является коэффициентом масштаба поправки, а не вероятностью выбора ветви или долей изображения
  question: Что в композиции нескольких ControlNet означает вес отдельной управляющей ветви?
  explanation: Вес масштабирует весь тензор поправки, созданный ветвью ControlNet. После масштабирования поправки ветвей складываются с признаками базовой модели; разделения изображения между ветвями или случайного выбора одной из них не происходит.
  kind: choice
  options:
    - Долю пикселей изображения, которые генерирует эта ветвь
    - Вероятность того, что модель выберет эту ветвь вместо остальных
    - Коэффициент смешивания исходных управляющих карт до подачи в сеть
    - Коэффициент, на который умножается поправка ветви к внутренним признакам
  correct: 3
