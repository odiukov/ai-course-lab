- concept: чрезмерный масштаб LoRA выводит веса за область, для которой обучалась поправка
  question: После сильного увеличения коэффициента LoRA изображения стали перестилизованными и покрылись артефактами. Какое объяснение наиболее вероятно?
  explanation: В объединённом весе W + α · B @ A коэффициент α умножает всю обученную поправку. При чрезмерном α веса уходят за пределы освоенной моделью области, поэтому результат обычно не усиливается аккуратно, а деградирует. На практике рекомендуется держать α не выше 1.5.
  kind: choice
  options:
    - Масштабированная дельта слишком далеко сместила веса от режима, в котором обучалась LoRA
    - Увеличение коэффициента автоматически повысило ранг матриц адаптера
    - Базовая матрица перестала участвовать в прямом проходе
    - Масштабирование поменяло порядок матричного умножения
  correct: 0
  id: 027-code-merge-lora-1
  fingerprint: 6ddb9ed7
- concept: совместимость LoRA с базовой моделью определяется размерностями слоёв, к которым применяется дельта
  question: Объясни своими словами, почему LoRA, обученную для одной архитектуры диффузионной модели, нельзя произвольно объединить с весами другой архитектуры.
  explanation: LoRA привязана к формам целевых слоёв. Например, адаптер SDXL не подходит слоям SD 1.5 с другими размерностями внимания. Diffusers начиная с версии 0.30 предупреждает о такой несовместимости.
  kind: open
  reference: Матрицы LoRA создают дельту конкретной формы для конкретного слоя. Если входные или выходные размерности слоя другой базовой модели отличаются, произведение матриц адаптера не совпадёт по форме с базовыми весами, поэтому сложение невозможно или адаптер не будет применён корректно.
  id: 027-code-merge-lora-2
  fingerprint: 198fc112
