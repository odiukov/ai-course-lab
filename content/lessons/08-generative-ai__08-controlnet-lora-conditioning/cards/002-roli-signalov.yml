- concept: LoRA обучает компактную низкоранговую поправку к весам модели для добавления нового понятия
  question: Объясни своими словами, почему LoRA подходит для обучения модели конкретному персонажу или стилю, но не заменяет ControlNet при управлении позой и композицией.
  explanation: 'LoRA меняет знания модели о том, что или в каком стиле изображать, через низкоранговые адаптеры. ControlNet решает другую задачу: принимает пространственный управляющий вход и направляет построение позы, глубины или границ.'
  kind: open
  reference: LoRA сохраняет компактные низкоранговые изменения существующих весов и тем самым добавляет модели выученное понятие, например персонажа, товар или стиль. Однако она не получает отдельную карту позы, глубины или контуров, поэтому не задаёт точную пространственную структуру кадра; для этого применяется ControlNet.
