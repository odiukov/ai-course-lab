- concept: каждый активный ControlNet добавляет отдельный прямой проход на каждом шаге генерации
  question: Как следует учитывать несколько одновременно активных ControlNet при планировании вычислительной нагрузки сервера?
  explanation: 'ControlNet не сводятся автоматически в одну бесплатную ветвь: каждый из них обрабатывает свой управляющий сигнал на каждом шаге генерации. Поэтому их вычислительную стоимость и влияние на доступный размер батча учитывают поштучно.'
  kind: choice
  options:
    - Закладывать отдельный дополнительный прямой проход на каждом шаге для каждой управляющей ветви
    - Считать все управляющие ветви одним общим проходом независимо от их количества
    - Учитывать только разовую стоимость загрузки весов перед генерацией
    - Считать, что ветви влияют лишь на объём хранилища, но не на время генерации
