- concept: правило цепочки даёт разные градиенты для двух матриц LoRA
  question: Пусть y = Wx + B(Ax), а g = ∂L/∂y. Какие выражения задают градиенты обучаемых матриц?
  explanation: Матрица B получает на вход Ax, поэтому её градиент равен внешнему произведению g(Ax)ᵀ. Чтобы получить градиент A, сигнал g сначала проводят назад через B, получая Bᵀg, а затем умножают на xᵀ.
  kind: choice
  options:
    - ∂L/∂B = g(Ax)ᵀ, а ∂L/∂A = Bᵀgxᵀ
    - ∂L/∂B = Bᵀg, а ∂L/∂A = gxᵀ
    - ∂L/∂B = gxᵀ, а ∂L/∂A = g(Ax)ᵀ
  correct: 0
  id: 024-grady-lora-1
  fingerprint: 342b83ba
- concept: замороженный параметр участвует в прямом проходе, но не обновляется оптимизатором
  question: Почему матрица W в выражении y = Wx + B(Ax) может влиять на ошибку и обратное распространение, но оставаться неизменной при обучении LoRA?
  explanation: Участие параметра в прямом вычислении не означает, что оптимизатор обязан его обновлять. Заморозка W сохраняет базовый слой, а исправление его ответа происходит через обучаемую добавку BA.
  kind: open
  reference: W участвует в вычислении y, поэтому влияет на значение ошибки и проходящий через граф градиентный сигнал. Однако W помечена как замороженная или исключена из параметров оптимизатора, поэтому шаг оптимизации изменяет только A и B.
  id: 024-grady-lora-2
  fingerprint: 7247d7fd
