- concept: каждая координата произведения матрицы на вектор является скалярным произведением строки матрицы и вектора
  question: Заполни формулу для координаты результата умножения матрицы M на вектор x.
  explanation: Для строки с индексом i попарно перемножаются её элементы и координаты вектора, после чего произведения складываются. Полученная сумма становится координатой y_i.
  kind: cloze
  template: y_i = ___
  answer: \sum_j M_{ij}x_j
  accept:
    - sum_j M_ij*x_j
    - скалярное произведение строки M_i и вектора x
  id: 013-code-matvec-1
  fingerprint: fe6b5273
- concept: накопитель суммы при матрично-векторном умножении создаётся заново для каждой строки
  question: Расположи действия алгоритма матрично-векторного умножения в правильном порядке.
  explanation: Каждая строка формирует отдельную координату результата, поэтому её сумма не должна включать вклад предыдущей строки.
  kind: order
  items:
    - Для очередной строки матрицы создать новый накопитель суммы
    - Добавить в накопитель произведения соответствующих элементов строки и вектора
    - Записать завершённую сумму в список результатов
    - После обработки всех строк вернуть список результатов
  id: 013-code-matvec-2
  fingerprint: 8b872548
- concept: умножение матрицы на вектор требует совпадения длины каждой строки с длиной вектора
  question: Почему функция матрично-векторного умножения должна явно проверять длины строк матрицы и вектора?
  explanation: Каждому элементу строки должен соответствовать элемент вектора. Если размеры несовместимы, вычисление следует остановить с ошибкой, а не обрезать данные.
  kind: open
  reference: Скалярное произведение определено только для последовательностей одинаковой длины. Без проверки попарный обход может проигнорировать лишние элементы и вернуть правдоподобный, но неверный результат.
  id: 013-code-matvec-3
  fingerprint: 23b80d61
