- concept: скалярный затвор менее выразителен, чем обучаемая нулевая свёртка
  question: Объясни своими словами, почему обучаемый скалярный затвор не может полностью заменить нулевую свёртку в ControlNet.
  explanation: Один коэффициент регулирует только общую силу поправки. Свёрточный слой содержит набор весов и потому может обучить разные воздействия для разных признаков и пространственных областей.
  kind: open
  reference: Скалярный затвор одинаково масштабирует весь выход управляющей ветви. Он не умеет по-разному преобразовывать каналы или пространственные позиции и не смешивает признаки, тогда как обучаемая свёртка способна освоить такое более гибкое преобразование.
