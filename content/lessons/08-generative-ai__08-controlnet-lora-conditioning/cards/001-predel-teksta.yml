- concept: пространственные слова в промпте повышают вероятность нужной компоновки, но не служат точным геометрическим ограничением
  question: Почему указания вроде «объект у края кадра», «камера снизу» и «персонаж вполоборота» не гарантируют воспроизведение одной и той же композиции при каждой генерации?
  explanation: Более подробный промпт сужает множество подходящих изображений, но не превращается в жёсткую пространственную разметку. Для точного контроля геометрии нужен отдельный визуальный или структурный управляющий сигнал.
  kind: open
  reference: Такие выражения обозначают широкие смысловые категории, а не точные координаты, углы, расстояния или карту глубины. Модель может реализовать каждое условие множеством способов и при каждой генерации выбрать новый допустимый вариант.
  id: 001-predel-teksta-2
  fingerprint: 6668bf78
