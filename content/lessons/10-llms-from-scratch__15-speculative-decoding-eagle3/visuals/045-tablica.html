<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Прайс-лист черновиков</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a6472;
    --line: #b8c0cc;
    --head: #eef1f6;
    --row: #f8fafc;
    --bar: #3b6fd4;
    --bar2: #d47a1e;
    --free: #2f8a5b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #e8ecf2;
      --muted: #9aa5b4;
      --line: #3a424f;
      --head: #1e232b;
      --row: #191d24;
      --bar: #6fa0ff;
      --bar2: #f0a martin;
      --bar2: #f0a44e;
      --free: #56c88c;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  .wrap { background: var(--bg); padding: 6px 0 2px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  h2 { font-size: 15px; margin: 0 0 4px 10px; font-weight: 600; color: var(--fg); }
  svg { display: block; width: 100%; height: auto; max-height: 520px; background: var(--bg); }
  .fail { padding: 10px; font-size: 13px; color: var(--fg); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Прайс-лист черновиков: токены обучения за десятые доли α</h2>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById("host");
  try {
    // ---- данные схемы -------------------------------------------------
    var ROWS = [
      { name: "Vanilla",    a0: 0.55, a1: 0.70, aTxt: "0.55–0.70", spd: "×1.5–2",   cost: "0",         costW: 0 },
      { name: "Medusa",     a0: 0.60, a1: 0.75, aTxt: "0.60–0.75", spd: "×2–2.5",   cost: "~1B",       costW: 1 },
      { name: "EAGLE-1",    a0: 0.75, a1: 0.82, aTxt: "0.75–0.82", spd: "×2.5–3",   cost: "~60B",      costW: 60 },
      { name: "EAGLE-2",    a0: 0.80, a1: 0.88, aTxt: "0.80–0.88", spd: "×3–4",     cost: "~60B",      costW: 60 },
      { name: "EAGLE-3",    a0: 0.88, a1: 0.92, aTxt: "0.88–0.92", spd: "×3–6.5",   cost: "~60–200B",  costW: 200 },
      { name: "Lookahead",  a0: 0.55, a1: 0.70, aTxt: "0.55–0.70", spd: "×1.5–2",   cost: "0",         costW: 0 }
    ];

    // ---- ЕДИНАЯ система координат -------------------------------------
    // логическая единица X = 0.01 доли α по шкале колонки α
    // логическая единица Y = 1 строка таблицы
    var ORIGIN = { x: 150, y: 74 };
    var SCALE  = { x: 3.6, y: 34 };
    function sx(x) { return ORIGIN.x + x * SCALE.x; }
    function sy(y) { return ORIGIN.y + y * SCALE.y; }

    // логические границы содержимого
    var X_ALPHA0 = 0, X_ALPHA1 = 45;   // шкала α: 0.50 .. 0.95
    var X_LEFT   = -40;                 // левый край таблицы (колонка имени)
    var X_SPD    = 52;                  // колонка ускорения
    var X_COST0  = 68, X_COST1 = 110;   // колонка стоимости обучения
    var X_RIGHT  = 116;
    var Y_HEAD   = -1.6, Y_TOP = -0.6, Y_BOT = ROWS.length - 0.4;

    function aToX(alpha) { return (alpha - 0.50) * 100; }        // α в логический X
    function costToX(b)  { return X_COST0 + Math.sqrt(b / 200) * (X_COST1 - X_COST0); }

    var PAD = 6, FS = 12, FSH = 12, LW = 1;

    var W = 900, H = 300;
    var s = ['<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Таблица черновиков">'];
    s.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--bg)"/>');

    // шапка
    s.push('<rect x="' + sx(X_LEFT) + '" y="' + sy(Y_HEAD - 0.55) + '" width="' + (sx(X_RIGHT) - sx(X_LEFT)) + '" height="' + (sy(Y_TOP) - sy(Y_HEAD - 0.55)) + '" fill="var(--head)"/>');
    s.push('<text x="' + sx(X_LEFT) + PAD + '" y="' + sy(Y_HEAD) + '" text-anchor="start" font-size="' + FSH + '" font-weight="600" fill="var(--fg)">Черновик</text>');
    s.push('<text x="' + sx((X_ALPHA0 + X_ALPHA1) / 2) + '" y="' + sy(Y_HEAD) + '" text-anchor="middle" font-size="' + FSH + '" font-weight="600" fill="var(--fg)">доля принятия α</text>');
    s.push('<text x="' + sx(X_SPD) + '" y="' + sy(Y_HEAD) + '" text-anchor="middle" font-size="' + FSH + '" font-weight="600" fill="var(--fg)">ускорение</text>');
    s.push('<text x="' + sx(X_COST0) + '" y="' + sy(Y_HEAD) + '" text-anchor="start" font-size="' + FSH + '" font-weight="600" fill="var(--fg)">стоимость обучения, токенов</text>');

    // засечки шкалы α
    [0.5, 0.6, 0.7, 0.8, 0.9].forEach(function (a) {
      var X = aToX(a);
      s.push('<line x1="' + sx(X) + '" y1="' + sy(Y_TOP) + '" x2="' + sx(X) + '" y2="' + sy(Y_BOT) + '" stroke="var(--line)" stroke-width="' + LW + '" stroke-dasharray="2 4" opacity="0.7"/>');
      s.push('<text x="' + sx(X) + '" y="' + (sy(Y_BOT) + PAD + FS) + '" text-anchor="middle" font-size="' + FS + '" fill="var(--muted)">' + a.toFixed(1) + '</text>');
    });

    // строки
    ROWS.forEach(function (r, i) {
      var yc = sy(i);
      if (i % 2 === 1) {
        s.push('<rect x="' + sx(X_LEFT) + '" y="' + sy(i - 0.45) + '" width="' + (sx(X_RIGHT) - sx(X_LEFT)) + '" height="' + (sy(i + 0.45) - sy(i - 0.45)) + '" fill="var(--row)"/>');
      }
      s.push('<text x="' + (sx(X_LEFT) + PAD) + '" y="' + (yc + FS * 0.35) + '" text-anchor="start" font-size="' + FS + '" fill="var(--fg)">' + r.name + '</text>');

      // полоса диапазона α
      var x0 = sx(aToX(r.a0)), x1 = sx(aToX(r.a1));
      s.push('<line x1="' + x0 + '" y1="' + yc + '" x2="' + x1 + '" y2="' + yc + '" stroke="var(--bar)" stroke-width="' + (LW * 7) + '" stroke-linecap="round" opacity="0.85"/>');
      s.push('<text x="' + (x1 + PAD) + '" y="' + (yc + FS * 0.35) + '" text-anchor="start" font-size="' + FS + '" fill="var(--muted)">' + r.aTxt + '</text>');

      // ускорение
      s.push('<text x="' + sx(X_SPD) + '" y="' + (yc + FS * 0.35) + '" text-anchor="middle" font-size="' + FS + '" fill="var(--fg)">' + r.spd + '</text>');

      // стоимость обучения
      if (r.costW === 0) {
        s.push('<text x="' + (sx(X_COST0) + PAD) + '" y="' + (yc + FS * 0.35) + '" text-anchor="start" font-size="' + FS + '" fill="var(--free)">' + r.cost + ' — готовые веса</text>');
      } else {
        var cx = sx(costToX(r.costW));
        s.push('<line x1="' + sx(X_COST0) + '" y1="' + yc + '" x2="' + cx + '" y2="' + yc + '" stroke="var(--bar2)" stroke-width="' + (LW * 7) + '" stroke-linecap="round" opacity="0.85"/>');
        s.push('<text x="' + (cx + PAD) + '" y="' + (yc + FS * 0.35) + '" text-anchor="start" font-size="' + FS + '" fill="var(--fg)">' + r.cost + '</text>');
      }
    });

    // разделители колонок
    [X_ALPHA0 - 4, X_SPD - 6, X_COST0 - 4].forEach(function (X) {
      s.push('<line x1="' + sx(X) + '" y1="' + sy(Y_HEAD - 0.55) + '" x2="' + sx(X) + '" y2="' + sy(Y_BOT) + '" stroke="var(--line)" stroke-width="' + LW + '"/>');
    });
    s.push('<line x1="' + sx(X_LEFT) + '" y1="' + sy(Y_TOP) + '" x2="' + sx(X_RIGHT) + '" y2="' + sy(Y_TOP) + '" stroke="var(--line)" stroke-width="' + LW + '"/>');
    s.push('<line x1="' + sx(X_LEFT) + '" y1="' + sy(Y_BOT) + '" x2="' + sx(X_RIGHT) + '" y2="' + sy(Y_BOT) + '" stroke="var(--line)" stroke-width="' + LW + '"/>');

    // подпись-вывод под таблицей
    s.push('<text x="' + sx(X_LEFT) + '" y="' + (sy(Y_BOT) + PAD * 2 + FS * 2.2) + '" text-anchor="start" font-size="' + FS + '" fill="var(--muted)">α растёт по десятой доле за строку, счёт за обучение — в десятки раз. N=5: α 0.6 даёт 2.38 токена, α 0.9 — 4.69.</text>');

    s.push('</svg>');
    host.innerHTML = s.join("");
  } catch (e) {
    host.innerHTML = '<div class="fail"><b>Схема не построилась.</b> Она показывала таблицу черновиков: Vanilla α 0.55–0.70 при нулевой стоимости обучения, Medusa 0.60–0.75 за ~1B токенов, EAGLE-1 0.75–0.82 и EAGLE-2 0.80–0.88 за ~60B, EAGLE-3 0.88–0.92 за ~60–200B, Lookahead 0.55–0.70 за 0. Ускорение растёт с ×1.5–2 до ×3–6.5. Шаг по α везде одна-две десятые, а ценник между строками растёт на порядки.</div>';
  }
})();
</script>
</body>
</html>
