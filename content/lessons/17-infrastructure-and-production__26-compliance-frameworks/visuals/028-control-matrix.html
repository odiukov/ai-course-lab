<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Матрица повторного использования четырёх контролей</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef2f7;
      --surface: #ffffff;
      --surface-alt: #f5f7fa;
      --cell: #fbfcfe;
      --ink: #172033;
      --muted: #657087;
      --line: #c9d1df;
      --line-strong: #8d99ad;
      --accent: #176b5b;
      --accent-soft: #d9f2e9;
      --accent-ink: #ffffff;
      --summary: #e8f0ff;
      --summary-line: #7d9bd1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      padding: 16px;
    }

    .frame {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      padding: 16px 24px 13px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface);
      color: var(--ink);
    }

    .column-label {
      fill: var(--muted);
      font-weight: bold;
    }

    .row-label {
      fill: var(--ink);
      font-weight: bold;
    }

    .cell {
      fill: var(--cell);
      stroke: var(--line);
    }

    .cell-active {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .mark {
      fill: var(--accent);
    }

    .check {
      fill: var(--accent-ink);
      font-weight: bold;
    }

    .legend-mark {
      fill: var(--accent);
      font-weight: bold;
    }

    .legend-text {
      fill: var(--muted);
    }

    .summary-box {
      fill: var(--summary);
      stroke: var(--summary-line);
    }

    .summary-text {
      fill: var(--ink);
      font-weight: bold;
    }

    .rule {
      stroke: var(--line-strong);
    }

    .fallback {
      margin: 0;
      padding: 18px 24px;
      background: var(--surface-alt);
      color: var(--ink);
      border-top: 1px solid var(--line);
      font-size: 16px;
      line-height: normal;
    }

    [hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151e;
        --surface: #171d28;
        --surface-alt: #202735;
        --cell: #1c2330;
        --ink: #edf2fa;
        --muted: #aeb9ca;
        --line: #3b4658;
        --line-strong: #738096;
        --accent: #63d6bd;
        --accent-soft: #183f39;
        --accent-ink: #10221e;
        --summary: #23324c;
        --summary-line: #7898cf;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Матрица повторного использования: 4 контроля → 12 соответствий</h1>

    <svg
      id="matrix"
      width="960"
      height="380"
      viewBox="0 0 960 380"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Матрица повторного использования четырёх контролей</title>
      <desc id="svg-description">
        Четыре строки контролей и пять столбцов фреймворков образуют двенадцать
        отмеченных соответствий.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback">
      Схема должна показать 4 общих контроля в строках, 5 фреймворков в столбцах
      и 12 отмеченных пересечений, где результаты контроля можно использовать повторно.
    </p>
  </main>

  <script>
    const data = {
      origin: [0, 0],
      scale: [10, 10],
      canvas: [96, 38],
      geometry: {
        zero: 0,
        half: 0.5,
        gridX: 32,
        gridY: 4.7,
        columnWidth: 12,
        rowHeight: 6.5,
        rowLabelX: 29.6,
        columnLabelY: 2.5,
        headerRuleY: 4.15,
        legendX: 32,
        legendY: 35.1,
        legendCheckX: 32,
        legendTextX: 34.3,
        summaryX: 76,
        summaryY: 32.9,
        summaryWidth: 16,
        summaryHeight: 4.2,
        summaryTextX: 84,
        summaryTextY: 35,
        markRadius: 1.35,
        checkOffsetY: 0.08,
        expectedMatches: 12
      },
      appearance: {
        gridLineWidth: 1,
        activeLineWidth: 2,
        ruleLineWidth: 1,
        headingFontSize: 15,
        rowFontSize: 16,
        checkFontSize: 18,
        legendFontSize: 14,
        summaryFontSize: 15,
        labelPadding: 8
      },
      labels: {
        control: "Работающий контроль",
        legend: "результат контроля можно предъявить во фреймворке",
        summary: "12 соответствий",
        fallback:
          "Схема должна показать матрицу из 4 контролей и 5 фреймворков с 12 отмеченными соответствиями."
      },
      frameworks: [
        { id: "iso", label: "ISO 27001" },
        { id: "gdpr", label: "GDPR" },
        { id: "hipaa", label: "HIPAA" },
        { id: "pci", label: "PCI-DSS" },
        { id: "soc", label: "SOC 2" }
      ],
      controls: [
        {
          label: "Логирование доступа",
          matches: ["iso", "gdpr", "hipaa"]
        },
        {
          label: "Управление изменениями",
          matches: ["iso", "hipaa", "pci"]
        },
        {
          label: "Шифрование при передаче",
          matches: ["iso", "gdpr", "hipaa"]
        },
        {
          label: "Управление секретами",
          matches: ["iso", "pci", "soc"]
        }
      ]
    };

    const [originX, originY] = data.origin;
    const [scaleX, scaleY] = data.scale;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    (() => {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const g = data.geometry;
      const a = data.appearance;

      const make = (name, attributes, className) => {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });

        if (className) {
          element.setAttribute("class", className);
        }

        return element;
      };

      const addText = ({
        x,
        y,
        value,
        className,
        anchor,
        size,
        baseline
      }) => {
        const node = make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor,
            "dominant-baseline": baseline,
            "font-size": size
          },
          className
        );

        node.textContent = value;
        drawing.appendChild(node);
        return node;
      };

      const addRect = ({
        x,
        y,
        width,
        height,
        className,
        lineWidth
      }) => {
        const node = make(
          "rect",
          {
            x: sx(x),
            y: sy(y),
            width: sx(width) - sx(g.zero),
            height: sy(height) - sy(g.zero),
            "stroke-width": lineWidth,
            "vector-effect": "non-scaling-stroke"
          },
          className
        );

        drawing.appendChild(node);
        return node;
      };

      const addLine = ({ x1, y1, x2, y2, className, lineWidth }) => {
        const node = make(
          "line",
          {
            x1: sx(x1),
            y1: sy(y1),
            x2: sx(x2),
            y2: sy(y2),
            "stroke-width": lineWidth,
            "vector-effect": "non-scaling-stroke"
          },
          className
        );

        drawing.appendChild(node);
        return node;
      };

      const addCircle = ({ x, y, radius, className }) => {
        const node = make(
          "circle",
          {
            cx: sx(x),
            cy: sy(y),
            r: sx(radius) - sx(g.zero)
          },
          className
        );

        drawing.appendChild(node);
        return node;
      };

      try {
        addText({
          x: g.rowLabelX,
          y: g.columnLabelY,
          value: data.labels.control,
          className: "column-label",
          anchor: "end",
          size: a.headingFontSize,
          baseline: "middle"
        });

        addLine({
          x1: g.gridX,
          y1: g.headerRuleY,
          x2: g.gridX + g.columnWidth * data.frameworks.length,
          y2: g.headerRuleY,
          className: "rule",
          lineWidth: a.ruleLineWidth
        });

        data.frameworks.forEach((framework, columnIndex) => {
          const columnCenter =
            g.gridX + g.columnWidth * (columnIndex + g.half);

          addText({
            x: columnCenter,
            y: g.columnLabelY,
            value: framework.label,
            className: "column-label",
            anchor: "middle",
            size: a.headingFontSize,
            baseline: "middle"
          });
        });

        let matchCount = g.zero;

        data.controls.forEach((control, rowIndex) => {
          const rowTop = g.gridY + g.rowHeight * rowIndex;
          const rowCenter = rowTop + g.rowHeight * g.half;

          addText({
            x: g.rowLabelX,
            y: rowCenter,
            value: control.label,
            className: "row-label",
            anchor: "end",
            size: a.rowFontSize,
            baseline: "middle"
          });

          data.frameworks.forEach((framework, columnIndex) => {
            const cellX = g.gridX + g.columnWidth * columnIndex;
            const cellCenterX = cellX + g.columnWidth * g.half;
            const isMatch = control.matches.includes(framework.id);

            const cell = addRect({
              x: cellX,
              y: rowTop,
              width: g.columnWidth,
              height: g.rowHeight,
              className: isMatch ? "cell-active" : "cell",
              lineWidth: isMatch
                ? a.activeLineWidth
                : a.gridLineWidth
            });

            cell.setAttribute(
              "aria-label",
              isMatch
                ? `${control.label}: соответствует ${framework.label}`
                : `${control.label}: соответствие ${framework.label} не отмечено`
            );

            if (isMatch) {
              matchCount += g.half + g.half;

              addCircle({
                x: cellCenterX,
                y: rowCenter,
                radius: g.markRadius,
                className: "mark"
              });

              addText({
                x: cellCenterX,
                y: rowCenter + g.checkOffsetY,
                value: "✓",
                className: "check",
                anchor: "middle",
                size: a.checkFontSize,
                baseline: "middle"
              });
            }
          });
        });

        if (matchCount !== g.expectedMatches) {
          throw new Error("Количество соответствий не совпало с данными шага.");
        }

        addText({
          x: g.legendCheckX,
          y: g.legendY,
          value: "✓",
          className: "legend-mark",
          anchor: "start",
          size: a.legendFontSize,
          baseline: "middle"
        });

        addText({
          x: g.legendTextX,
          y: g.legendY,
          value: data.labels.legend,
          className: "legend-text",
          anchor: "start",
          size: a.legendFontSize,
          baseline: "middle"
        });

        addRect({
          x: g.summaryX,
          y: g.summaryY,
          width: g.summaryWidth,
          height: g.summaryHeight,
          className: "summary-box",
          lineWidth: a.activeLineWidth
        });

        addText({
          x: g.summaryTextX,
          y: g.summaryTextY,
          value: data.labels.summary,
          className: "summary-text",
          anchor: "middle",
          size: a.summaryFontSize,
          baseline: "middle"
        });

        fallback.hidden = true;
      } catch (error) {
        drawing.replaceChildren();
        fallback.textContent = data.labels.fallback;
        fallback.hidden = false;
      }
    })();
  </script>
</body>
</html>
