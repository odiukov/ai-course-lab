- concept: ненулевая величина активации не гарантирует сохранение различий между входами
  question: Объясни своими словами, почему заметные ненулевые выходы sigmoid после многих слоёв ещё не означают, что сеть сохранила информацию о входе.
  explanation: Sigmoid может стабильно выдавать значения около 0,5–0,67, хотя различия между исходными входами уже исчезли. Поэтому вместе с величиной активаций полезно исследовать их разброс и различимость для разных входов.
  kind: open
  reference: Если разные входы отображаются почти в одно и то же значение, представление перестаёт различать эти входы. Ненулевая величина выхода показывает лишь наличие сигнала, но не его информативность.
  id: 052-aktivatsiya-ne-gradient-2
