- concept: значения активации и её производной описывают соответственно выход функции и локальный наклон
  question: Функция max_derivative оценивает на сетке наибольшую силу локального градиента активации. Почему ей нужно передавать функцию производной, а не саму активацию?
  explanation: Активация и её производная могут иметь совершенно разные значения. Множитель обратного градиента задаёт именно производная, поэтому вызов самой активации не измеряет локальную чувствительность.
  kind: open
  reference: Значение активации показывает выход функции, а распространение градиента определяется её локальной производной. Поэтому сравнивать нужно результаты функции производной.
  id: 047-pishem-max-derivative-1
  fingerprint: 808f0549
- concept: агрегирующая функция возвращает скалярный результат без изменения входной сетки
  question: Какой контракт должен выполнять корректный вызов result = max_derivative(grid, derivative)?
  explanation: Функция сводит результаты вычислений на всей сетке к одному максимуму. Для этого не требуется перезаписывать входные значения, поэтому результат должен быть скаляром, а сетка — сохраниться.
  kind: choice
  options:
    - result — одно скалярное значение, а grid остаётся без изменений
    - result — массив той же формы, что и grid, а grid остаётся без изменений
    - result — одно скалярное значение, а элементы grid заменяются производными
