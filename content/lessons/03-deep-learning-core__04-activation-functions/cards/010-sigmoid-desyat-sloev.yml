- concept: оценка потока градиента по производным активаций не учитывает влияние весов слоёв
  question: Почему произведение производных sigmoid-активаций само по себе не даёт точного значения градиента в раннем слое реальной нейросети?
  explanation: Полный градиент образуется произведением якобианов всех операций. Оценка 0.25^10 показывает вклад sigmoid, но веса слоёв могут дополнительно усиливать, ослаблять или перераспределять сигнал.
  kind: choice
  options:
