- concept: измеренная доля мёртвой зоны зависит от порога близости производной к нулю
  question: Для фиксированного набора значений производной увеличили порог, ниже которого градиент считают почти нулевым. Как может измениться доля мёртвой зоны?
  explanation: При большем пороге все ранее отмеченные точки остаются мёртвыми, а некоторые дополнительные точки могут перейти в эту категорию.
