- concept: доля мёртвой зоны характеризует выбранное сканирование, а не является неизменным свойством активации
  question: Для одной и той же функции активации сканирование на двух разных интервалах дало разные доли мёртвой зоны. Объясни, почему это не противоречие и что именно измеряет эта метрика.
  explanation: Доля мёртвой зоны зависит от интервала, сетки точек и порога. Она кратко описывает конкретное исследование производной и имеет практический смысл лишь с учётом того, где располагаются реальные входы модели.
  kind: open
  reference: Метрика показывает долю выбранных точек, где модуль производной ниже заданного порога. При смене интервала или расположения точек исследуются другие входы, поэтому результат может измениться. Это не вероятность необратимой смерти нейрона и не абсолютная характеристика функции.
