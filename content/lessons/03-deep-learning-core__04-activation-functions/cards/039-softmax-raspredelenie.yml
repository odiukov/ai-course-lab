- concept: равные логиты дают равномерное распределение вероятностей
  question: У классификатора пять классов, и все логиты равны шести. Какую вероятность softmax присвоит каждому классу?
  explanation: Экспоненциальные веса равных логитов совпадают, поэтому общий вес делится поровну между пятью классами. Вероятность каждого класса равна 0,2.
  kind: numeric
  answer: 0.2
  tolerance: 0.001
  id: 039-softmax-raspredelenie-1
  fingerprint: f526e8de
- concept: softmax не изменяется при одинаковом сдвиге всех логитов
  question: Заполни пропуск в тождестве для softmax.
  explanation: Общий множитель e^c появляется и в каждом числителе, и в знаменателе, поэтому сокращается. Для softmax важны разности между логитами, а не их общий уровень.
  kind: cloze
  template: Если к каждому компоненту вектора логитов z прибавить одну и ту же константу c, то softmax(z + c) = ___.
  answer: softmax(z)
  accept:
    - тот же вектор вероятностей
    - исходный softmax(z)
  id: 039-softmax-raspredelenie-2
  fingerprint: 0fea26a5
- concept: общий знаменатель softmax связывает вероятности всех классов
  question: Почему вероятности классов после softmax нельзя считать результатами независимых преобразований отдельных логитов?
  explanation: Softmax нормализует весь вектор одновременно. Если увеличивается вес одного класса, его доля растёт, а доли остальных классов уменьшаются из-за общей суммы в знаменателе.
  kind: open
  reference: В знаменателе вероятности каждого класса находится сумма экспоненциальных весов всех классов. Поэтому изменение одного логита меняет общий знаменатель и влияет на остальные вероятности.
  id: 039-softmax-raspredelenie-3
  fingerprint: b6235ea8
