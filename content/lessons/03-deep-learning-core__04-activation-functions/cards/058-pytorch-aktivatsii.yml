  question: Тензор логитов организован по осям «объекты × позиции последовательности × классы». По какой оси следует применять softmax и почему?
  explanation: 'Параметр dim выбирают по смыслу осей, а не только по форме тензора: сумма вероятностей должна быть единицей именно среди классов для каждого отдельного предсказания.'
