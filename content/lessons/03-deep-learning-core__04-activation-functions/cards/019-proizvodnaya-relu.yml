- concept: в точке излома ReLU не имеет обычной производной, поэтому для обучения задают условное значение
  question: Почему обычная производная ReLU в точке смены знака входа не существует и как эту точку обрабатывают при обучении?
  explanation: 'В нуле встречаются горизонтальный и наклонный участки: их односторонние производные не совпадают. Принятое в обучении значение 0 является вычислительным соглашением.'
  kind: open
  reference: Слева и справа от точки излома наклоны ReLU различаются, поэтому единой производной там нет. В реализациях для обратного распространения обычно договариваются считать производную в этой точке нулевой.
