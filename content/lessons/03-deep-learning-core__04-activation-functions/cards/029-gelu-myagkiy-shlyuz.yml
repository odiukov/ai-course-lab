- concept: GELU умножает вход на зависящий от него вес из функции распределения стандартного нормального закона
  question: Восстановите определение активации GELU.
  explanation: Значение Φ(x) служит плавным коэффициентом пропускания, который меняется вместе со входом. Поэтому GELU не использует ни жёсткий порог, ни постоянный коэффициент для целой ветви.
  kind: cloze
  template: GELU(x) = ___
  answer: x · Φ(x)
  accept:
    - x * Φ(x)
    - xΦ(x)
    - x * Phi(x)
    - x·Phi(x)
  id: 029-gelu-myagkiy-shlyuz-1
  fingerprint: 34880e3e
- concept: предельное поведение GELU на разных хвостах определяется значением гауссовой функции распределения
  question: Как ведёт себя GELU для входов, всё сильнее удаляющихся от центра распределения?
  explanation: Для больших положительных входов Φ(x) приближается к верхней границе вероятности, поэтому множитель почти не ослабляет сигнал. Для больших отрицательных входов Φ(x) приближается к нижней границе, поэтому отрицательный выход плавно затухает к нулю.
  kind: choice
  options:
    - На обоих хвостах выход становится близок к самому входу
    - На положительном хвосте выход стремится к нулю, а на отрицательном — к входу
    - На положительном хвосте выход становится близок к входу, а на отрицательном — к нулю с отрицательной стороны
    - На обоих хвостах выход стремится к нулю
  correct: 2
