- concept: разные активации закономерно разводят траектории обучения сетей с одинаковыми начальными весами
  question: Расположи события в порядке, объясняющем, почему одинаково инициализированные сети с разными скрытыми активациями начинают обучаться по-разному.
  explanation: Совпадающая инициализация нужна только для честной стартовой точки. После прямого и обратного проходов различие активаций закономерно создаёт разные сигналы и градиенты, поэтому веса расходятся.
  kind: order
  items:
    - Одинаковые вход и параметры дают одинаковые предактивации скрытого слоя
    - Разные функции активации преобразуют эти предактивации по-разному
    - Скрытые представления и предсказания сетей начинают различаться
    - Соответствующие производные формируют разные градиенты
    - Обновления параметров разводят веса сетей по разным траекториям
