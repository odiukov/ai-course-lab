- concept: для сравнения активности на выборках разного размера счётчик срабатываний нормируют по числу входов
  question: Два набора входов имеют разный размер. Как корректно сравнить активность ReLU-нейрона на этих наборах?
  explanation: Одинаковое число срабатываний имеет разный смысл при разном числе входов. Частота срабатывания приводит результаты к общей шкале и позволяет применять единый порог слабой активности.
  kind: open
  reference: Для каждого набора нужно разделить число положительных выходов нейрона на общее число проверенных входов и сравнить полученные частоты, а не абсолютные счётчики.
  id: 053-detektor-zdorovya-1
  fingerprint: 9b128e59
- concept: частота срабатывания нейрона не измеряет полезность создаваемого им признака
  question: Что можно обоснованно заключить, если ReLU-нейрон выдаёт положительный результат для большей части проверочных входов?
  explanation: Счётчик фиксирует только наличие положительного выхода. Часто активный нейрон может быть малоинформативным или дублировать другие нейроны, поэтому его вклад в качество нужно оценивать отдельно.
  kind: choice
  options:
    - Нейрон обязательно улучшает качество предсказаний сети
    - Нейрон кодирует признак, которого нет у других нейронов
    - Нейрон часто участвует в прямом проходе, но его полезность ещё не установлена
  correct: 2
  id: 053-detektor-zdorovya-2
  fingerprint: 1cb3601d
