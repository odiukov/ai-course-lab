- concept: сильно отрицательное смещение сдвигает предактивации ReLU и снижает частоту срабатываний
  question: У ReLU-нейрона предактивация равна z = s + b, где s — взвешенная сумма входов. Веса и распределение входов фиксированы. Что обычно произойдёт, если смещение b сделать сильно отрицательным?
  explanation: Смещение прибавляется к каждой взвешенной сумме. При смещении −5 всей предактивации труднее стать положительной, поэтому ReLU чаще возвращает ноль, хотя веса и входы не изменились.
  kind: choice
  options:
    - Постоянный коэффициент умножит только положительные выходы
    - Автоматически изменятся веса, поэтому разброс взвешенной суммы уменьшится
    - Распределение предактивации сдвинется в отрицательную сторону, и нейрон будет реже пересекать порог ReLU
  correct: 2
  id: 022-smeshchenie-minus-pyat-1
  fingerprint: 347e3c05
- concept: мёртвые ReLU-нейроны обнаруживаются по счётчикам положительных выходов на выборке
  question: Расположите действия детектора не срабатывающих ReLU-нейронов в правильном порядке.
  explanation: Детектор накапливает число положительных выходов по всей выборке. В опыте с 1000 входами нейрон со счётчиком, оставшимся на нуле, получает статус DEAD.
  kind: order
  items:
    - Создать отдельный нулевой счётчик для каждого нейрона
    - Для каждого входа вычислить предактивацию каждого нейрона и применить ReLU
    - Увеличить счётчик нейрона, если его выход положителен
    - После обработки всей выборки отметить нейроны с нулевыми счётчиками как не сработавшие ни разу
  id: 022-smeshchenie-minus-pyat-2
  fingerprint: 9c8bfe3b
