- concept: архитектурная рекомендация по активации является исходной гипотезой, а не универсальным правилом
  question: Объясни своими словами, почему рекомендация использовать GELU в трансформере не означает, что другая скрытая активация всегда будет хуже.
  explanation: Связка архитектуры и активации задаёт надёжную отправную точку. Окончательный выбор зависит от конкретной задачи и подтверждается результатами экспериментов.
  kind: open
  reference: Это практический исходный выбор, основанный на типичном устройстве трансформеров, а не математический запрет. На конкретной задаче другая активация может дать лучший результат, но замену следует обосновать измеренным улучшением.
