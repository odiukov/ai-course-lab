- concept: отрицательная ветвь ELU имеет конечную нижнюю границу
  question: ELU задана как α(e^x − 1) при x ≤ 0, где α > 0. К какому значению стремится её выход при x → −∞?
  explanation: При x → −∞ экспонента e^x стремится к нулю, поэтому α(e^x − 1) стремится к −α. Отрицательная ветвь ELU ограничена снизу.
  kind: choice
  options:
    - К −α
    - К нулю
    - К −∞
    - К α
