- concept: монитор градиентов должен учитывать модуль или норму, чтобы знаки не маскировали величину
  question: Почему для монитора здоровья градиентов опасно усреднять подписанные компоненты градиента слоя без взятия модуля или нормы?
  explanation: Обычное среднее измеряет ещё и баланс знаков. Средний модуль или норма лучше отражают реальный масштаб сигнала и позволяют обнаруживать затухание и взрыв градиентов.
  kind: open
  reference: Положительные и отрицательные компоненты могут взаимно сократиться, и среднее окажется близким к нулю даже при больших градиентах. Поэтому следует агрегировать абсолютные значения или использовать норму.
