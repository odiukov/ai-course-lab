- concept: для взаимоисключающих классов выходной вектор логитов преобразуют softmax
  question: Модель должна выбрать категорию из полного списка взаимоисключающих классов. Какую активацию следует применить к выходным логитам и почему?
  explanation: Softmax обрабатывает логиты совместно, поэтому увеличение вероятности одного класса уменьшает долю, доступную остальным.
  kind: open
  reference: 'Следует применить softmax: он преобразует весь вектор логитов в конкурирующие вероятности классов, сумма которых равна единице.'
  id: 056-vyhodnoy-sloy-2
