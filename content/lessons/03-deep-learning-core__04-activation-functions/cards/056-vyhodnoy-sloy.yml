- concept: для регрессии с неограниченным диапазоном целевой величины используют линейный выход
  question: Сеть прогнозирует величину, которая может иметь любой знак и не ограничена заранее заданным диапазоном. Как оформить её выходной слой?
  explanation: Линейный выход не зажимает прогноз в ограниченный диапазон. Нелинейные активации при этом могут оставаться в скрытых слоях сети.
  kind: choice
  options:
    - Применить softmax
    - Применить sigmoid
    - Оставить линейный выход без активации
