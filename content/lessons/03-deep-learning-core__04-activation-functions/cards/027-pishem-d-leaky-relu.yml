- concept: производная параметризованной активации должна использовать переданный коэффициент утечки
  question: Почему в `d_leaky_relu` нужно использовать аргумент `alpha`, а не фиксированный коэффициент, записанный внутри функции?
  explanation: Аргумент `alpha` позволяет настраивать наклон утечки. Если зашить коэффициент в производную, прямой и обратный проходы могут описывать разные функции.
  kind: open
  reference: Производная должна соответствовать той же параметризации, что и прямой проход Leaky ReLU. Если вызывающий код изменит `alpha`, наклон и множитель обратного градиента должны измениться вместе с ним; фиксированное значение нарушит это соответствие.
  id: 027-pishem-d-leaky-relu-2
