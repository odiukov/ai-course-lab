- concept: производная tanh вычисляется по выходу активации, а не непосредственно по её входу
  question: Расположите действия для реализации функции d_tanh(x) в правильном порядке.
  explanation: Для производной используется формула 1 − tanh(x)². Поэтому сначала нужен выход активации t = tanh_act(x), после чего функция возвращает 1 − t · t.
  kind: order
  items:
    - Вызвать tanh_act(x) и сохранить результат в переменную t
    - Вычислить квадрат значения t
    - Вычесть полученный квадрат из единицы и вернуть результат
  id: 015-pishem-d-tanh-1
  fingerprint: 88a69191
- concept: производная tanh неотрицательна для любого конечного вещественного входа
  question: Реализация d_tanh возвращает отрицательное значение для некоторого конечного вещественного аргумента. Какой вывод верен?
  explanation: Значение tanh(x) лежит между −1 и 1, поэтому его квадрат не превосходит 1, а выражение 1 − tanh(x)² неотрицательно. Отрицательный результат часто означает, что в квадрат ошибочно возвели сам x.
  kind: choice
  options:
    - Это нормальное поведение tanh в области насыщения
    - 'В реализации есть ошибка: производная tanh не может быть отрицательной'
    - Отрицательный результат допустим только для отрицательного аргумента
  correct: 1
  id: 015-pishem-d-tanh-2
