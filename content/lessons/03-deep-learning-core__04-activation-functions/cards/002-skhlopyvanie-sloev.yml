- concept: глубина без нелинейных активаций не увеличивает выразительную силу сети
  question: Какое утверждение верно для сети, в которой между аффинными слоями нет функций активации?
  explanation: Композиция аффинных преобразований остаётся аффинным преобразованием. Матрицы перемножаются, а смещения преобразуются и складываются, поэтому без нелинейности глубина не создаёт новый класс функций.
  kind: choice
  options:
    - Количество слоёв само по себе позволяет представить любую нелинейную функцию
    - Всю сеть можно заменить одним аффинным преобразованием с тем же результатом для любого входа
    - Схлопывание слоёв возможно только при нулевых смещениях
    - При перемножении матриц все смещения исчезают
