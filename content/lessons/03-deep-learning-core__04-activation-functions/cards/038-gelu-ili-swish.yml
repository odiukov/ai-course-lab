- concept: Swish и GELU имеют разное методологическое происхождение
  question: Объясни своими словами, чем способ появления Swish отличался от концептуального происхождения GELU.
  explanation: 'Swish нашли экспериментальным автоматическим поиском удачных конструкций. GELU возникла из вероятностной идеи: вход взвешивается по гауссовой функции распределения. Похожая форма функций не означает одинакового происхождения.'
  kind: open
  reference: Swish была обнаружена автоматическим поиском по пространству функций активации, тогда как GELU была мотивирована вероятностным взвешиванием входа через гауссово распределение.
