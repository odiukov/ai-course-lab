- concept: однократное вычисление sigmoid позволяет переиспользовать общий промежуточный результат
  question: В реализации производной Swish сначала вычислили `s = sigmoid(x)`. Зачем затем использовать `s`, а не вызывать `sigmoid(x)` заново в каждой части выражения?
  explanation: Все нужные в производной значения sigmoid относятся к одному входу x, поэтому достаточно вычислить sigmoid один раз. Переиспользование `s` сокращает лишнюю работу и делает код понятнее.
  kind: choice
  options:
    - Чтобы производная стала определена только для положительных входов
    - Чтобы заменить точную производную численным приближением
    - Чтобы избежать повторного вычисления и явно переиспользовать одно и то же промежуточное значение
    - Чтобы ограничить результат производной диапазоном sigmoid
  correct: 2
