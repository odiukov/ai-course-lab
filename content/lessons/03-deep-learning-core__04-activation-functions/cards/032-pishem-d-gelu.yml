- concept: производная точной GELU получается из правила произведения и включает CDF и PDF
  question: Пусть Φ — функция распределения, а φ — плотность стандартного нормального закона. Известно, что GELU(x) = xΦ(x). Заполни пропуск в формуле производной.
  explanation: По правилу произведения производная xΦ(x) равна Φ(x) + xΦ′(x). Производная функции распределения Φ — это плотность φ, поэтому получается Φ(x) + xφ(x).
  kind: cloze
  template: d_gelu(x) = ___
  answer: Φ(x) + x * φ(x)
  accept:
    - Phi(x) + x * phi(x)
    - cdf + x * pdf
    - cdf(x) + x * pdf(x)
  id: 032-pishem-d-gelu-1
  fingerprint: 44c79e60
- concept: точная производная GELU может немного расходиться с численным наклоном tanh-аппроксимации
  question: В прямом проходе GELU реализована приближением через tanh, а d_gelu — точной формулой через нормальные CDF и PDF. Что следует ожидать при сравнении d_gelu с численной производной прямого прохода?
  explanation: Прямой проход через tanh лишь приближает GELU, тогда как формула через CDF и PDF относится к точной функции xΦ(x). Поэтому небольшая разница с численным наклоном аппроксимации не обязательно означает ошибку.
  kind: choice
  options:
    - Значения обязаны совпадать до последнего машинного разряда
    - Знаки производных всегда будут противоположными
    - Небольшое расхождение допустимо, потому что дифференцируются разные формулы
    - Такое сравнение невозможно провести численно
  correct: 2
  id: 032-pishem-d-gelu-2
  fingerprint: 5e4bd6ff
- concept: GELU не является монотонной на всей отрицательной полуоси
  question: Может ли производная GELU быть отрицательной для некоторых отрицательных входов? Объясни ответ через формулу с нормальными CDF и PDF.
  explanation: Плотность φ(x) положительна, но умножение на отрицательный x делает поправку xφ(x) отрицательной. Если она перевешивает CDF, производная оказывается ниже нуля; это отражает небольшой немонотонный участок GELU.
  kind: open
  reference: Да. Производная равна Φ(x) + xφ(x). При отрицательном x слагаемое xφ(x) отрицательно и на некотором участке может по модулю превысить положительное Φ(x), поэтому локальный наклон становится отрицательным.
  id: 032-pishem-d-gelu-3
  fingerprint: f2ce505a
