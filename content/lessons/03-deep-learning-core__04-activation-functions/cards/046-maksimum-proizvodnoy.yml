- concept: одинаковый максимум производной не означает одинакового типичного потока градиента
  question: Две активации имеют одинаковое значение maxₓ |f′(x)|. Почему по одному этому значению нельзя определить, какая из них обычно лучше сохраняет градиент при обучении?
  explanation: Одна функция может достигать максимального наклона на широкой области, а другая — лишь на узкой. Поэтому одинаковая верхняя граница совместима с разным фактическим ослаблением градиентов.
  kind: open
  reference: Максимум описывает только лучший возможный локальный случай. Для типичного потока градиента важно, какие входы реально получает активация и какие значения модуля производной встречаются на этих входах.
  id: 046-maksimum-proizvodnoy-2
