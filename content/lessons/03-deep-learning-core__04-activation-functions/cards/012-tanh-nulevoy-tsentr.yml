- concept: выходы tanh обоих знаков снижают склонность обновлений параметров к зигзагообразной траектории
  question: Почему центрированные около нуля активации tanh могут упростить оптимизацию по сравнению с активациями, имеющими только положительные значения?
  explanation: 'Симметричный диапазон tanh позволяет положительным и отрицательным активациям уравновешивать направления обновлений. Строго нулевое среднее при этом не гарантировано: оно зависит от распределения входов.'
