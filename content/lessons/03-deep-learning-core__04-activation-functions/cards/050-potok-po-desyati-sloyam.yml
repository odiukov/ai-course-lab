- concept: отношение градиента раннего слоя к выходному градиенту показывает сохранившуюся долю сигнала коррекции
  question: Модуль градиента на выходе равен 2.4, а у раннего слоя — 0.006. Какой процент исходного градиентного сигнала дошёл до раннего слоя?
  explanation: Сохранившаяся доля равна 0.006 / 2.4 = 0.0025. После умножения на сто получаем 0.25%. Это характеризует ослабление сигнала коррекции, а не качество предсказания сети.
  kind: numeric
  answer: 0.25
  tolerance: 0.01
