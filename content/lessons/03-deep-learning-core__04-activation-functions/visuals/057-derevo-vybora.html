<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дерево выбора функции активации</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #58657a;
      --line: #718096;
      --root-fill: #e8eef8;
      --root-stroke: #41536f;
      --hidden-fill: #e2f5f0;
      --hidden-soft: #f2fbf8;
      --hidden-strong: #087f6d;
      --output-fill: #f1eaff;
      --output-soft: #faf7ff;
      --output-strong: #7446b8;
      --card-stroke: #a4adbb;
      --arrow: #526176;
      --shadow: #dbe2ec;
      --error: #9f1d35;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182131;
        --text: #edf2fa;
        --muted: #b7c1d1;
        --line: #8491a5;
        --root-fill: #26344a;
        --root-stroke: #9fb3cf;
        --hidden-fill: #173e3a;
        --hidden-soft: #1a302f;
        --hidden-strong: #69d8c4;
        --output-fill: #35284d;
        --output-soft: #2b2638;
        --output-strong: #c6a4ff;
        --card-stroke: #69778b;
        --arrow: #aab6c8;
        --shadow: #0c111a;
        --error: #ff9aae;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      max-width: 1040px;
      margin: auto;
    }

    h2 {
      font-size: 22px;
      text-align: center;
      color: var(--text);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--card-stroke);
      box-shadow: 0 2px 0 var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
    }

    .connector,
    .bus {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bus {
      stroke: var(--card-stroke);
    }

    .arrowhead {
      fill: var(--arrow);
      stroke: none;
    }

    .root-node {
      fill: var(--root-fill);
      stroke: var(--root-stroke);
      stroke-width: 2px;
    }

    .hidden-node {
      fill: var(--hidden-fill);
      stroke: var(--hidden-strong);
      stroke-width: 2px;
    }

    .output-node {
      fill: var(--output-fill);
      stroke: var(--output-strong);
      stroke-width: 2px;
    }

    .hidden-stage {
      fill: var(--hidden-soft);
      stroke: var(--hidden-strong);
      stroke-width: 2px;
    }

    .output-stage {
      fill: var(--output-soft);
      stroke: var(--output-strong);
      stroke-width: 2px;
    }

    .hidden-leaf {
      fill: var(--hidden-soft);
      stroke: var(--hidden-strong);
      stroke-width: 2px;
    }

    .output-leaf {
      fill: var(--output-soft);
      stroke: var(--output-strong);
      stroke-width: 2px;
    }

    text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      pointer-events: none;
    }

    .root-label {
      fill: var(--text);
      font-size: 20px;
      font-weight: bold;
    }

    .decision-label {
      fill: var(--text);
      font-size: 16px;
      font-weight: bold;
    }

    .stage-label {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .leaf-context {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .hidden-result {
      fill: var(--hidden-strong);
      font-size: 17px;
      font-weight: bold;
    }

    .output-result {
      fill: var(--output-strong);
      font-size: 17px;
      font-weight: bold;
    }

    .guide-label {
      fill: var(--muted);
      font-size: 13px;
    }

    #fallback {
      color: var(--error);
      font-size: 16px;
      font-weight: bold;
      background: var(--panel);
    }
  </style>
</head>
<body>
  <main>
    <h2>Дерево выбора функции активации</h2>

    <section class="panel" aria-label="Схема выбора функции активации">
      <svg
        id="diagram"
        viewBox="0 0 1040 445"
        width="1040"
        height="445"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="diagram-title diagram-description"
      >
        <title id="diagram-title">Дерево выбора функции активации</title>
        <desc id="diagram-description">
          Сначала выбирают скрытый или выходной слой. В скрытом слое выбор
          зависит от архитектуры, а в выходном — от типа задачи.
        </desc>
        <g id="drawing"></g>
      </svg>

      <p id="fallback" hidden>
        Схема должна была показать: для скрытых слоёв Transformer ведёт к
        GELU, CNN — к ReLU или Swish, RNN или LSTM — к tanh, MLP — к ReLU;
        на выходе бинарная классификация ведёт к sigmoid, многоклассовая —
        к softmax, регрессия — к линейному выходу.
      </p>
    </section>
  </main>

  <script>
    const data = {
      canvas: { left: 0, top: 0, width: 1040, height: 445 },
      arrow: { depth: 11, half: 6 },
      math: { last: -1, previous: -2 },
      root: {
        kind: "root-node",
        points: [
          { x: 365, y: 18 },
          { x: 675, y: 18 },
          { x: 675, y: 78 },
          { x: 365, y: 78 }
        ],
        labels: [
          { text: "Где стоит активация?", x: 520, y: 56, kind: "root-label" }
        ]
      },
      decisions: [
        {
          kind: "hidden-node",
          points: [
            { x: 270, y: 101 },
            { x: 394, y: 150 },
            { x: 270, y: 199 },
            { x: 146, y: 150 }
          ],
          labels: [
            { text: "СКРЫТЫЙ", x: 270, y: 146, kind: "decision-label" },
            { text: "СЛОЙ", x: 270, y: 168, kind: "decision-label" }
          ]
        },
        {
          kind: "output-node",
          points: [
            { x: 770, y: 101 },
            { x: 894, y: 150 },
            { x: 770, y: 199 },
            { x: 646, y: 150 }
          ],
          labels: [
            { text: "ВЫХОДНОЙ", x: 770, y: 146, kind: "decision-label" },
            { text: "СЛОЙ", x: 770, y: 168, kind: "decision-label" }
          ]
        }
      ],
      stages: [
        {
          kind: "hidden-stage",
          points: [
            { x: 185, y: 224 },
            { x: 355, y: 224 },
            { x: 355, y: 278 },
            { x: 185, y: 278 }
          ],
          labels: [
            { text: "Архитектура?", x: 270, y: 258, kind: "stage-label" }
          ]
        },
        {
          kind: "output-stage",
          points: [
            { x: 685, y: 224 },
            { x: 855, y: 224 },
            { x: 855, y: 278 },
            { x: 685, y: 278 }
          ],
          labels: [
            { text: "Тип задачи?", x: 770, y: 258, kind: "stage-label" }
          ]
        }
      ],
      leaves: [
        {
          kind: "hidden-leaf",
          points: [
            { x: 15, y: 340 },
            { x: 140, y: 340 },
            { x: 140, y: 428 },
            { x: 15, y: 428 }
          ],
          labels: [
            { text: "Transformer", x: 77.5, y: 374, kind: "leaf-context" },
            { text: "GELU", x: 77.5, y: 402, kind: "hidden-result" }
          ]
        },
        {
          kind: "hidden-leaf",
          points: [
            { x: 155, y: 340 },
            { x: 280, y: 340 },
            { x: 280, y: 428 },
            { x: 155, y: 428 }
          ],
          labels: [
            { text: "CNN", x: 217.5, y: 366, kind: "leaf-context" },
            { text: "ReLU или", x: 217.5, y: 392, kind: "hidden-result" },
            { text: "Swish", x: 217.5, y: 414, kind: "hidden-result" }
          ]
        },
        {
          kind: "hidden-leaf",
          points: [
            { x: 295, y: 340 },
            { x: 420, y: 340 },
            { x: 420, y: 428 },
            { x: 295, y: 428 }
          ],
          labels: [
            { text: "RNN / LSTM", x: 357.5, y: 374, kind: "leaf-context" },
            { text: "tanh", x: 357.5, y: 402, kind: "hidden-result" }
          ]
        },
        {
          kind: "hidden-leaf",
          points: [
            { x: 435, y: 340 },
            { x: 560, y: 340 },
            { x: 560, y: 428 },
            { x: 435, y: 428 }
          ],
          labels: [
            { text: "MLP", x: 497.5, y: 374, kind: "leaf-context" },
            { text: "ReLU", x: 497.5, y: 402, kind: "hidden-result" }
          ]
        },
        {
          kind: "output-leaf",
          points: [
            { x: 585, y: 340 },
            { x: 715, y: 340 },
            { x: 715, y: 428 },
            { x: 585, y: 428 }
          ],
          labels: [
            { text: "Бинарная", x: 650, y: 365, kind: "leaf-context" },
            { text: "классификация", x: 650, y: 385, kind: "leaf-context" },
            { text: "sigmoid", x: 650, y: 414, kind: "output-result" }
          ]
        },
        {
          kind: "output-leaf",
          points: [
            { x: 740, y: 340 },
            { x: 870, y: 340 },
            { x: 870, y: 428 },
            { x: 740, y: 428 }
          ],
          labels: [
            { text: "Многоклассовая", x: 805, y: 365, kind: "leaf-context" },
            { text: "классификация", x: 805, y: 385, kind: "leaf-context" },
            { text: "softmax", x: 805, y: 414, kind: "output-result" }
          ]
        },
        {
          kind: "output-leaf",
          points: [
            { x: 895, y: 340 },
            { x: 1025, y: 340 },
            { x: 1025, y: 428 },
            { x: 895, y: 428 }
          ],
          labels: [
            { text: "Регрессия", x: 960, y: 365, kind: "leaf-context" },
            { text: "Линейный", x: 960, y: 392, kind: "output-result" },
            { text: "выход", x: 960, y: 414, kind: "output-result" }
          ]
        }
      ],
      arrowRoutes: [
        [
          { x: 520, y: 78 },
          { x: 270, y: 101 }
        ],
        [
          { x: 520, y: 78 },
          { x: 770, y: 101 }
        ],
        [
          { x: 270, y: 199 },
          { x: 270, y: 224 }
        ],
        [
          { x: 770, y: 199 },
          { x: 770, y: 224 }
        ],
        [
          { x: 77.5, y: 310 },
          { x: 77.5, y: 340 }
        ],
        [
          { x: 217.5, y: 310 },
          { x: 217.5, y: 340 }
        ],
        [
          { x: 357.5, y: 310 },
          { x: 357.5, y: 340 }
        ],
        [
          { x: 497.5, y: 310 },
          { x: 497.5, y: 340 }
        ],
        [
          { x: 650, y: 310 },
          { x: 650, y: 340 }
        ],
        [
          { x: 805, y: 310 },
          { x: 805, y: 340 }
        ],
        [
          { x: 960, y: 310 },
          { x: 960, y: 340 }
        ]
      ],
      buses: [
        [
          { x: 270, y: 278 },
          { x: 270, y: 310 },
          { x: 77.5, y: 310 },
          { x: 497.5, y: 310 }
        ],
        [
          { x: 770, y: 278 },
          { x: 770, y: 310 },
          { x: 650, y: 310 },
          { x: 960, y: 310 }
        ]
      ]
    };

    const origin = { x: 0, y: 0 };
    const scale = 1;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      };

      const mappedPoints = points =>
        points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

      const mappedPath = points =>
        points
          .map((point, index) => {
            const command = index === data.canvas.left ? "M" : "L";
            return `${command} ${sx(point.x)} ${sy(point.y)}`;
          })
          .join(" ");

      const appendArrowhead = route => {
        const tip = route.at(data.math.last);
        const previous = route.at(data.math.previous);
        const dx = tip.x - previous.x;
        const dy = tip.y - previous.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const base = {
          x: tip.x - ux * data.arrow.depth,
          y: tip.y - uy * data.arrow.depth
        };
        const left = {
          x: base.x - uy * data.arrow.half,
          y: base.y + ux * data.arrow.half
        };
        const right = {
          x: base.x + uy * data.arrow.half,
          y: base.y - ux * data.arrow.half
        };

        drawing.append(
          make("polygon", {
            points: mappedPoints([tip, left, right]),
            class: "arrowhead"
          })
        );
      };

      const appendRoute = (route, kind, arrow) => {
        drawing.append(
          make("path", {
            d: mappedPath(route),
            class: kind
          })
        );

        if (arrow) {
          appendArrowhead(route);
        }
      };

      const appendNode = node => {
        const group = make("g", {});

        group.append(
          make("polygon", {
            points: mappedPoints(node.points),
            class: node.kind
          })
        );

        node.labels.forEach(label => {
          group.append(
            make(
              "text",
              {
                x: sx(label.x),
                y: sy(label.y),
                class: label.kind,
                "text-anchor": "middle"
              },
              label.text
            )
          );
        });

        drawing.append(group);
      };

      drawing.replaceChildren();

      data.arrowRoutes.forEach(route => {
        appendRoute(route, "connector", true);
      });

      data.buses.forEach(route => {
        appendRoute(route, "bus", false);
      });

      appendNode(data.root);
      data.decisions.forEach(appendNode);
      data.stages.forEach(appendNode);
      data.leaves.forEach(appendNode);

      fallback.hidden = true;
    } catch (error) {
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      if (drawing) {
        drawing.replaceChildren();
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
</body>
</html>
