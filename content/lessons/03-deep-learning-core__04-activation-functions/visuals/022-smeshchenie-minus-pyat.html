<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как смещение −5 выключает ReLU-нейроны</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --panel-dead:#f3f5f8;
  --ink:#172033;
  --muted:#68748a;
  --line:#aeb8c8;
  --grid:#dce2eb;
  --hot:#f59e0b;
  --hot2:#ef6c57;
  --cool:#2563eb;
  --dead:#8993a5;
  --zero:#c7ced9;
  --good-bg:#eaf3ff;
  --dead-bg:#e9edf3;
  --accent:#7c3aed;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111722;
    --panel:#192230;
    --panel-dead:#171e29;
    --ink:#eef3fb;
    --muted:#aeb9ca;
    --line:#657187;
    --grid:#354155;
    --hot:#fbbf24;
    --hot2:#fb806d;
    --cool:#66a3ff;
    --dead:#7f8a9e;
    --zero:#3d485b;
    --good-bg:#182c46;
    --dead-bg:#222b39;
    --accent:#b99cff;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:12px;
}
figure{
  width:100%;
  max-width:1200px;
  margin:0 auto;
  border:1px solid var(--grid);
  border-radius:14px;
  overflow:hidden;
  background:var(--bg);
}
h1{
  margin:0;
  padding:14px 18px 10px;
  font-size:22px;
  line-height:1.2;
  text-align:center;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:480px;
  background:var(--bg);
}
text{
  fill:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
.panel-title{font-size:19px;font-weight:750}
.section-title{font-size:15px;font-weight:700}
.label{font-size:14px}
.small{font-size:12px;fill:var(--muted)}
.node-text{font-size:12px;font-weight:800}
.summary{font-size:15px;font-weight:700}
.fallback{
  display:none;
  margin:14px;
  padding:18px;
  font-size:16px;
  line-height:1.45;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--panel);
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Как смещение −5 выключает ReLU-нейроны</h1>
  <svg id="diagram" viewBox="0 0 1200 500" width="1200" height="500"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Двадцать ReLU-нейронов до и после установки смещений минус пять"></svg>
  <div id="fallback" class="fallback">
    Схема должна была показать: смещение −5 переносит взвешенные входы левее нуля, поэтому выходы ReLU и градиенты становятся нулевыми.
  </div>
</figure>
<script>
const data={
  frame:{left:-5.86,right:5.86,top:6.08,bottom:-6.08},
  panels:[
    {left:-5.68,right:-.28,top:5.82,bottom:-4.18,cx:-2.98,
     title:"До: обычные смещения",fill:"var(--panel)"},
    {left:.28,right:5.68,top:5.82,bottom:-4.18,cx:2.98,
     title:"После: biases = [−5.0] × 20",fill:"var(--panel-dead)"}
  ],
  axis:{
    y:3.02,leftA:-5.12,leftB:-.82,leftZero:-2.78,
    rightA:.82,rightB:5.12,rightZero:3.28,
    tickTop:3.68,tickBottom:2.58
  },
  shift:{tail:4.92,head:1.34,y:4.18,labelY:4.56,wing:.16},
  clouds:{
    before:[
      [-4.82,3.18],[-4.52,2.82],[-4.24,3.42],[-3.96,3.05],
      [-3.66,2.72],[-3.36,3.28],[-3.06,2.91],[-2.74,3.48],
      [-2.46,2.75],[-2.18,3.22],[-1.88,2.94],[-1.58,3.39],
      [-1.28,2.78],[-1.02,3.16]
    ],
    after:[
      [1.02,3.18],[1.26,2.82],[1.48,3.42],[1.72,3.05],
      [1.94,2.72],[2.16,3.28],[2.38,2.91],[2.58,3.48],
      [2.76,2.75],[2.92,3.22],[3.04,2.94],[3.13,3.39]
    ]
  },
  input:{y:1.93,left:-2.98,right:2.98},
  grid:{leftStart:-5.02,rightStart:.98,gap:.47,cols:10,
        topY:.72,bottomY:-.48,r:.16,stem:.28},
  neurons:[
    "hot","cool","hot2","cool","hot","hot2","cool","hot","cool","hot2",
    "cool","hot","hot2","cool","hot","cool","hot2","hot","cool","hot2"
  ],
  summaries:{
    boxTop:-1.25,boxBottom:-3.75,
    leftL:-5.2,leftR:-.76,rightL:.76,rightR:5.2,
    line1:-1.82,line2:-2.48,line3:-3.14
  },
  footer:{left:-5.2,right:5.2,top:-4.52,bottom:-5.62,y1:-4.91,y2:-5.32},
  radius:{panel:.13,pill:.18,dot:.075,arrow:.04}
};
const origin=Object.freeze({x:600,y:250});
const scale=Object.freeze({x:100,y:40});
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y-y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";

  function add(name,attrs,parent=svg){
    const node=document.createElementNS(ns,name);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));
    parent.appendChild(node);
    return node;
  }
  function textAt(value,x,y,cls,anchor="middle",parent=svg){
    const node=add("text",{
      x:sx(x),y:sy(y),class:cls,"text-anchor":anchor,
      "dominant-baseline":"middle"
    },parent);
    node.textContent=value;
    return node;
  }
  function rect(x1,y1,x2,y2,fill,stroke,round,parent=svg){
    return add("rect",{
      x:sx(x1),y:sy(y1),
      width:sx(x2)-sx(x1),height:sy(y2)-sy(y1),
      rx:sx(round)-sx(0),
      fill:fill,stroke:stroke,"stroke-width":1.5
    },parent);
  }
  function line(x1,y1,x2,y2,stroke,width,parent=svg){
    return add("line",{
      x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
      stroke:stroke,"stroke-width":width,"stroke-linecap":"round"
    },parent);
  }
  function circle(x,y,r,fill,stroke,width,parent=svg){
    return add("circle",{
      cx:sx(x),cy:sy(y),r:sx(r)-sx(0),
      fill:fill,stroke:stroke,"stroke-width":width
    },parent);
  }
  function arrowLeft(tail,head,y,color,label,labelY,parent=svg){
    line(tail,y,head,y,color,3,parent);
    add("polygon",{
      points:[
        [head,y],[head+data.shift.wing,y+data.shift.wing],
        [head+data.shift.wing,y-data.shift.wing]
      ].map(point=>sx(point[0])+","+sy(point[1])).join(" "),
      fill:color
    },parent);
    textAt(label,(tail+head)/2,labelY,"section-title","middle",parent);
  }

  rect(data.frame.left,data.frame.top,data.frame.right,data.frame.bottom,
       "var(--bg)","none",data.radius.panel);

  data.panels.forEach(panel=>{
    rect(panel.left,panel.top,panel.right,panel.bottom,
         panel.fill,"var(--grid)",data.radius.panel);
    textAt(panel.title,panel.cx,5.25,"panel-title");
  });

  textAt("взвешенный вход z",data.axis.leftA,3.88,"small","start");
  textAt("облако z после сдвига",data.axis.rightA,3.88,"small","start");

  line(data.axis.leftA,data.axis.y,data.axis.leftB,data.axis.y,"var(--line)",2);
  line(data.axis.rightA,data.axis.y,data.axis.rightB,data.axis.y,"var(--line)",2);
  line(data.axis.leftZero,data.axis.tickTop,data.axis.leftZero,
       data.axis.tickBottom,"var(--accent)",3);
  line(data.axis.rightZero,data.axis.tickTop,data.axis.rightZero,
       data.axis.tickBottom,"var(--accent)",3);

  textAt("0",data.axis.leftZero,2.38,"label");
  textAt("0",data.axis.rightZero,2.38,"label");
  textAt("граница ReLU",data.axis.leftZero,3.84,"small");
  textAt("граница ReLU",data.axis.rightZero,3.84,"small");

  data.clouds.before.forEach((point,index)=>{
    const positive=point[0]>data.axis.leftZero;
    circle(point[0],point[1],data.radius.dot,
      positive?"var(--hot)":"var(--cool)","var(--panel)",1.5);
  });
  data.clouds.after.forEach(point=>{
    circle(point[0],point[1],data.radius.dot,
      "var(--dead)","var(--panel-dead)",1.5);
  });

  arrowLeft(data.shift.tail,data.shift.head,data.shift.y,
            "var(--accent)","смещение −5",data.shift.labelY);

  textAt("те же 1000 случайных входов",data.input.left,data.input.y,
         "section-title");
  textAt("те же 1000 случайных входов",data.input.right,data.input.y,
         "section-title");
  textAt("20 ReLU-нейронов",data.input.left,1.47,"small");
  textAt("20 ReLU-нейронов",data.input.right,1.47,"small");

  data.neurons.forEach((tone,index)=>{
    const column=index%data.grid.cols;
    const row=Math.floor(index/data.grid.cols);
    const y=row===0?data.grid.topY:data.grid.bottomY;
    const lx=data.grid.leftStart+column*data.grid.gap;
    const rx=data.grid.rightStart+column*data.grid.gap;
    const live=tone==="hot"?"var(--hot)":
               tone==="hot2"?"var(--hot2)":"var(--cool)";

    circle(lx,y,data.grid.r,live,live,2);
    textAt("↑",lx,y,"node-text");

    circle(rx,y,data.grid.r,"var(--zero)","var(--dead)",2);
    textAt("0",rx,y,"node-text");

    line(lx,y-data.grid.r,lx,y-data.grid.r-data.grid.stem,live,2);
    line(rx,y-data.grid.r,rx,y-data.grid.r-data.grid.stem,
         "var(--dead)",2);
  });

  rect(data.summaries.leftL,data.summaries.boxTop,
       data.summaries.leftR,data.summaries.boxBottom,
       "var(--good-bg)","var(--grid)",data.radius.pill);
  rect(data.summaries.rightL,data.summaries.boxTop,
       data.summaries.rightR,data.summaries.boxBottom,
       "var(--dead-bg)","var(--grid)",data.radius.pill);

  textAt("z бывает по обе стороны от 0",-2.98,
         data.summaries.line1,"summary");
  textAt("ReLU иногда выдаёт больше 0",-2.98,
         data.summaries.line2,"label");
  textAt("градиент проходит",-2.98,
         data.summaries.line3,"label");

  textAt("z < 0",2.98,data.summaries.line1,"summary");
  textAt("выход ReLU = 0",2.98,
         data.summaries.line2,"label");
  textAt("градиент = 0",2.98,
         data.summaries.line3,"label");

  rect(data.footer.left,data.footer.top,data.footer.right,data.footer.bottom,
       "var(--panel)","var(--accent)",data.radius.pill);
  textAt("Веса и входы не изменились",0,data.footer.y1,"section-title");
  textAt("bias = −5  →  z < 0  →  ReLU(z) = 0  →  градиент = 0",
         0,data.footer.y2,"summary");
}catch(error){
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  if(svg)svg.style.display="none";
  if(fallback)fallback.style.display="block";
}
</script>
</body>
</html>
