- concept: в оценку входит размер выходной карты, поэтому увеличение шага свёртки снижает стоимость квадратично по шагу
  question: Слой с ядром 5×5, 96 входными и 96 выходными каналами применяют к тому же входу, но с шагом (stride) 5 вместо 1. Число каналов и ядро не меняются. Как изменится оценка FLOPs?
  explanation: 'Шаг влияет на цену не напрямую, а через размер выходной карты: при stride 5 и высота, и ширина выхода падают примерно в 5 раз, значит множитель H_out·W_out — в 25 раз. Именно выходная карта, а не входная, стоит в формуле: она задаёт число позиций, где ядро применяется.'
  kind: choice
  options:
