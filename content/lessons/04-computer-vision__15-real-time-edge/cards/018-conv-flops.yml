- concept: эффекты нескольких множителей в оценке FLOPs перемножаются, поэтому рост по каналам и сжатие карты могут взаимно компенсироваться
  question: В архитектуре число входных и выходных каналов слоя увеличили в пять раз каждое, а высоту и ширину выходной карты уменьшили в пять раз каждую. Ядро прежнее. Как изменится оценка FLOPs слоя?
  explanation: 'Каналы дают множитель C_in·C_out — рост в 5·5 = 25 раз. Карта даёт множитель H_out·W_out — падение в 5·5 = 25 раз. Произведение не меняется. Это типовой приём: на каждой стадии сети разрешение падает, а ширина растёт, удерживая стоимость стадий сопоставимой.'
  kind: choice
  options:
    - Останется примерно прежней
    - Вырастет примерно в пять раз
    - Уменьшится примерно в пять раз
    - Вырастет примерно в двадцать пять раз
