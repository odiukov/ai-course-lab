- concept: целочисленное квантование выполняется до экспорта в переносимый формат, а не на стороне конечного мобильного конвертера
  question: Модель для Android должна уйти в TFLite в целочисленном виде. Расставь шаги в правильном порядке.
  explanation: 'Квантование меняет состав операций графа. Если экспортировать вещественную модель и искать квантование уже на стороне мобильного конвертера, получишь другой набор поддерживаемых операций и отладку совместимости вместо результата. Порядок: квантование, экспорт, замер на целевом устройстве.'
  kind: order
  items:
    - Квантовать модель в исходном фреймворке
    - Экспортировать квантованную модель в ONNX
    - Сконвертировать ONNX в TFLite
    - Замерить latency и качество на самом телефоне
  id: 041-production-paths-1
  fingerprint: 8d6d9659
- concept: выбор ветки после переносимого формата — компромисс между достижимой задержкой и стоимостью интеграции, а не единая шкала «лучше-хуже»
  question: Команда деплоит детектор в serverless-функцию. Прототип на ONNX Runtime с CUDA-провайдером укладывается в требования по задержке. Инженер предлагает сразу перевести всё на TensorRT. Что верно про такое предложение?
  explanation: 'ONNX Runtime — самый прямой маршрут и хороший вариант по умолчанию для web и serverless. TensorRT даёт лучшую latency на NVIDIA, но требует заметно больше инженерных усилий: не каждая операция поддерживается одинаково, режим точности проверяют на целевом железе. Ветку выбирают под требования и цену интеграции, а не по репутации рантайма.'
  kind: choice
  options:
    - TensorRT строго лучше во всех сценариях, поэтому переход оправдан всегда
    - Выигрыш TensorRT по задержке покупается настройкой сборки, проверкой поддержки операций и режима точности; если требования уже выполнены, эти затраты не окупаются
    - TensorRT нельзя применять в serverless в принципе, потому что он работает только с вещественной точностью
    - Переход обязателен, иначе модель не запустится на GPU
  correct: 1
  id: 041-production-paths-2
  fingerprint: 8a856a41
- concept: инструменты измерения делятся на дающие разбивку по слоям и дающие единое агрегированное число, и выбор определяется поставленным вопросом
  question: Модель на Jetson не укладывается в бюджет кадра. Чем отличаются инструменты вроде `trtexec` и `benchmark_app` от профайлеров вроде `nsys`, torch-tb-profiler или Instruments, и что брать, чтобы найти виновный слой?
  explanation: Два класса инструментов отвечают на разные вопросы. Единое число фиксирует факт нарушения бюджета, разбивка по слоям указывает причину. Оптимизировать по одному агрегированному числу — угадывать вслепую.
  kind: open
  reference: '`trtexec` (TensorRT) и `benchmark_app` (OpenVINO) — командные утилиты, которые выдают агрегированные числа по всему проходу: пропускная способность и задержка. Они отвечают на вопрос «укладываемся или нет» и удобны для сравнения сборок и режимов точности, но не показывают, где именно уходит время. Профайлеры (`nsys`/`nvprof` на NVIDIA, torch-tb-profiler, Instruments на macOS) дают разбивку по слоям и ядрам. Чтобы найти виновный слой, нужен профайлер; агрегированные утилиты берут для подтверждения, что после правки общее число улучшилось.'
  id: 041-production-paths-3
  fingerprint: caad0a56
