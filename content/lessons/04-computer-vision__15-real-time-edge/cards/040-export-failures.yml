- concept: ошибка формы входа возникает и при совпадении общего числа элементов, если порядок осей не совпадает с ожидаемым моделью layout
  question: Граф ONNX ожидает вход формы (2, 5, 160, 160). Приложение подаёт буфер формы (2, 160, 160, 5). Число элементов одинаковое. Что произойдёт?
  explanation: Контракт входа задаётся длиной каждой оси, а не произведением длин. Перестановка каналов и пространственных осей — типичный конфликт между layout обучающего фреймворка и layout источника кадров. Динамическая нулевая ось разрешает менять только батч и не помогает ни при другом разрешении, ни при другом порядке осей. Перекладывать данные нужно на стороне приложения.
  kind: choice
  options:
    - 'Рантайм отвергнет вход: формы сравниваются поосно, а не по общему числу элементов, и каналы окажутся не на своей оси'
    - Рантайм автоматически переставит оси, так как объём данных совпадает
    - Модель отработает, но результат будет чуть менее точным
    - Ошибки не будет, если при экспорте была объявлена динамической нулевая ось
