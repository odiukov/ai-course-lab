- concept: совместимость квантованной модели с ускорителем определяется структурой полученного графа, а не самим фактом целочисленного представления весов
  question: 'Инженер сообщает: «модель квантована в целочисленный формат, значит она пойдёт на нашем NPU». Объясни своими словами, почему этого утверждения недостаточно и что именно надо проверить.'
  explanation: 'Разрядность весов — лишь одна характеристика. Способ квантования (только веса против весов и активаций, потензорные против поканальных масштабов, статическая калибровка против динамической) определяет структуру графа, а именно она сопоставляется с возможностями ускорителя. Отсюда правило диагностики: смотреть первый отказавший узел — его операцию, форму и тип данных, а не общий текст ошибки.'
  kind: open
  reference: 'Целочисленное представление весов — не единый формат, а семейство разных графов. Ускоритель реализует конкретный набор квантованных операций: если использованная операция или её вариант не реализованы, узел не исполнится. Дальше важна схема масштабов: поканальные масштабы могут не поддерживаться там, где реализованы только потензорные, и наоборот. Наконец, разные методы квантования оставляют в графе разное соотношение целочисленных и вещественных узлов: смешанный граф требует вставки узлов преобразования на границах, и ускоритель может не поддерживать такое сочетание — тогда часть графа уйдёт обратно на CPU или сессия упадёт. Проверять надо получившийся после квантования граф: какие операции стали квантованными, какая схема масштабов выбрана, где проходят границы между целочисленными и вещественными участками, и сверять это со списком поддерживаемых ускорителем операций.'
  id: 040-export-failures-3
