- concept: оценка, учитывающая только Conv2d и Linear, описывает лишь охваченное подмножество слоёв и систематически занижает истинное число операций
  question: Инструмент оценки FLOPs вешает хуки только на Conv2d и Linear. Что именно означает полученное число и в какую сторону оно смещено относительно всех операций, выполненных моделью?
  explanation: Оценка описывает учтённые слои, а не модель целиком, и всегда даёт нижнюю границу. Сравнивать по ней можно только модели, посчитанные одним и тем же способом — иначе разница будет отражать разный охват, а не разную стоимость.
  kind: open
  reference: 'Число — сумма операций только по охваченным типам слоёв. Активации, нормализации, пулинг, поэлементные сложения residual-связей, softmax и прочие модули в сумму не попадают, поэтому оценка систематически занижена относительно всех выполненных операций. Для conv-сетей смещение обычно невелико, так как основная арифметика сосредоточена в свёртках, но для архитектур с большой долей поэлементных и нормализующих операций разрыв заметен. Практический вывод: число годится для сравнения однотипных архитектур при одинаковом охвате, а не как буквальный счёт всех действий модели; для точной оценки берут инструменты, покрывающие все типы модулей.'
  id: 022-model-cost-3
  fingerprint: aee83c33
