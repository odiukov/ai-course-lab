- concept: FLOPs всей модели — сумма FLOPs всех сработавших вычислительных слоёв, а не стоимость самого дорогого из них
  question: Модель за один прямой проход выполняет три свёртки стоимостью 120, 85 и 45 миллионов операций и один Linear-слой стоимостью 8 миллионов операций. Сколько миллионов операций даёт оценка FLOPs всей модели?
  explanation: '120 + 85 + 45 + 8 = 258 млн. Устройство выполняет слои последовательно, поэтому счёт за кадр — сумма по всем слоям. Ориентироваться на самый дорогой слой (120 млн) значит занизить оценку более чем вдвое: архитектура из многих дешёвых слоёв легко обгоняет по общей стоимости архитектуру с одним тяжёлым.'
  kind: numeric
  answer: 258
  tolerance: 0.5
  id: 022-model-cost-1
  fingerprint: 34a9446d
- concept: повторный вызов одного и того же слоя в проходе добавляет его стоимость столько раз, сколько раз он сработал
  question: 'В модели один свёрточный блок стоимостью 30 миллионов операций переиспользуется: за прямой проход он вызывается четырежды с одинаковым размером входа. Дальше идёт голова стоимостью 12 миллионов операций. Какова оценка FLOPs модели за проход?'
  explanation: '4 × 30 + 12 = 132 млн. FLOPs считают по фактическому проходу данных, а не по числу уникальных модулей: если блок отработал четыре раза, железо действительно выполнило эту работу четырежды. Переиспользование весов экономит память, но не вычисления — это разные бюджеты.'
  kind: choice
  options:
    - '42 млн: веса блока хранятся один раз, поэтому и считается он один раз'
    - '132 млн: стоимость блока входит в сумму четыре раза'
    - '30 млн: итог определяет самый дорогой участок вычислений'
    - '120 млн: голова не имеет обучаемых свёрток и в счёт FLOPs не входит'
  correct: 1
  id: 022-model-cost-2
