- concept: стоимость Linear-слоя для одного объекта равна удвоенному произведению числа входных и выходных признаков
  question: Полносвязный слой принимает 300 признаков и выдаёт 40 признаков. Сколько примерно FLOPs он тратит на один объект (операции со смещением не учитывать)?
  explanation: 'Каждый выходной признак связан с каждым входным, и на каждую связь приходятся умножение и сложение: FLOPs ≈ 2·F_in·F_out = 2·300·40 = 24000. Оценка на один объект; для батча её умножают на размер батча.'
  kind: numeric
  answer: 24000
  tolerance: 100
  id: 020-linear-cost-1
  fingerprint: 0a2418a7
- concept: стоимость Linear-слоя зависит от произведения размеров, а не от каждого из них по отдельности
  question: Полносвязный слой с 640 входными и 50 выходными признаками заменяют другим. Какая замена оставит его вычислительную стоимость примерно той же?
  explanation: 'FLOPs ≈ 2·F_in·F_out, значит важно произведение: 640·50 = 32000 и 320·100 = 32000 — стоимость совпадает. Вариант 640×25 и 320×50 дешевле вдвое, 1000×50 — дороже. Поэтому «мало выходов» само по себе не означает дешёвый слой: широкое входное представление повышает цену пропорционально.'
  kind: choice
  options:
    - 640 входных и 25 выходных признаков
    - 1000 входных и 50 выходных признаков
    - 320 входных и 100 выходных признаков
    - 320 входных и 50 выходных признаков
  correct: 2
  id: 020-linear-cost-2
  fingerprint: fc227711
- concept: смещения опускают в оценке FLOPs, потому что их число порядка F_out против F_in·F_out операций на связях
  question: Почему в оценке FLOPs полносвязного слоя обычно игнорируют операции со смещением? Объясни своими словами.
  explanation: Оценка FLOPs — грубая величина для сравнения кандидатов, а не точный счёт инструкций. Слагаемое порядка F_out теряется на фоне произведения F_in·F_out, поэтому его отбрасывают; по той же причине в оценках обычно опускают активации и нормализации.
  kind: open
  reference: 'Смещение добавляет по одному сложению на каждый выходной признак, то есть порядка F_out операций, тогда как связи вход-выход дают 2·F_in·F_out. Отношение примерно 1/(2·F_in): при сколько-нибудь большом числе входов вклад смещений — доли процента, и приближение их отбрасывает. Учитывать их пришлось бы только при очень малом F_in, где сама оценка FLOPs и так мало что решает.'
  id: 020-linear-cost-3
  fingerprint: 25ba6552
