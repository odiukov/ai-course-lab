- concept: без синхронизации таймер измеряет отправку ядер в очередь, а не их выполнение на GPU
  question: 'Замер на GPU сделан обычным таймером хоста без вызовов синхронизации: время старта берётся перед прямым проходом, время финиша — сразу после возврата из него. Таймер показывает 0,05 мс, хотя реальный прямой проход занимает 14 мс. Что именно измерил такой таймер?'
  explanation: 'Запуск ядер CUDA асинхронен: хост ставит работу в очередь и сразу идёт дальше, не дожидаясь GPU. Поэтому таймер хоста фиксирует стоимость диспетчеризации (доли миллисекунды), а не 14 мс счёта. Отсюда фантомный запас по кадровому бюджету, который исчезает на устройстве.'
  kind: choice
  options:
    - Время, за которое хост поставил вычисления в очередь GPU и вернул управление, — само выполнение ядер ещё продолжалось
    - 'Время выполнения ядер, но только первого слоя сети: остальные слои таймер не покрывает'
    - Время выполнения всей сети, просто в других единицах — таймер хоста считает в тактах, а не в миллисекундах
    - Время копирования входного тензора в память GPU без учёта самих вычислений
  correct: 0
  id: 010-gpu-sync-1
  fingerprint: 4d152fd5
- concept: корректный замер latency на GPU требует барьера синхронизации на обеих границах измеряемого блока
  question: Расставь шаги корректного измерения времени одного прямого прохода на GPU (после прогрева) в правильном порядке.
  explanation: 'Первый барьер очищает границу старта: незавершённые ядра прошлой итерации не попадут в новый интервал. Второй барьер удерживает хост до фактического конца вычислений, иначе финиш засекается сразу после диспетчеризации. Без любого из двух барьеров число получается заниженным или загрязнённым чужой работой.'
  kind: order
  items:
    - Дождаться завершения всей ранее отправленной GPU-работы (барьер синхронизации)
    - Считать время начала замера
    - Запустить прямой проход модели
    - Снова дождаться завершения GPU-работы (барьер синхронизации)
    - Считать время окончания замера и взять разность
  id: 010-gpu-sync-2
  fingerprint: aa0dced3
- concept: синхронизация меняет только измеряемую величину, а не производительность модели
  question: Инженер добавил барьеры синхронизации GPU вокруг замеряемого блока. Число на таймере выросло с 0,05 мс до 14 мс. Какой вывод верен?
  explanation: 'Барьер не ускоряет и не замедляет вычисления — он лишь заставляет хост дождаться их конца. 14 мс были потрачены GPU и без него, просто не попадали в интервал. Стоимость самого барьера — микросекунды. Вывод: 0,05 мс были иллюзией, а 14 мс — честная величина, с которой и надо сверять кадровый бюджет.'
  kind: choice
  options:
    - 'Модель стала работать медленнее: барьеры добавили накладные расходы порядка 14 мс на итерацию'
    - Модель работает как и раньше; изменилось лишь то, что таймер теперь охватывает выполнение ядер, а не их постановку в очередь
    - Барьеры отключили асинхронный режим GPU, поэтому в продакшене такой код давать 60 fps уже не сможет
    - 'Число выросло из-за прогрева: барьеры вынуждают перекомпилировать ядра на каждой итерации'
  correct: 1
  id: 010-gpu-sync-3
  fingerprint: c371308f
