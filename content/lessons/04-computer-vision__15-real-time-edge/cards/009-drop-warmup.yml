- concept: граница прогрева задаётся фиксированным числом первых запусков заранее, а не отбором замеров по их величине
  question: Почему прогрев отрезают фиксированным числом первых запусков, а не выбрасывают из серии все замеры, оказавшиеся заметно медленнее остальных?
  explanation: 'Холодный запуск отличается от рабочего режима не величиной, а позицией: он всегда в начале. Поэтому корректный критерий — порядковый (первые N запусков), а не пороговый. Правило «выбросить всё, что медленнее X» подгоняет данные под ожидания и стирает хвост, ради которого перцентили и считают.'
  kind: open
  reference: 'Фиксированное число — детерминированное правило: оно задано до измерения, не зависит от полученных значений, и повторный прогон на тех же данных даёт ту же выборку, поэтому benchmark воспроизводим и сравним с чужим. Отбор по величине зависит от самих результатов и удаляет не только холодный запуск, но и настоящие редкие всплески задержки — а именно они формируют хвост распределения и решают, годится ли модель для реального времени. Медленный замер в середине серии — это реальное поведение системы, а не артефакт разогрева; вычистив его, получаешь оптимистично заниженные p95/p99.'
  id: 009-drop-warmup-3
  fingerprint: d8bea601
