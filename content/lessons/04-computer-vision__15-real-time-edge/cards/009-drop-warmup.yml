- concept: отбрасывание прогрева — срез последовательности начиная с индекса, равного числу прогревочных запусков
  question: Функция получает серию замеров и число прогревочных запусков и должна вернуть только рабочую часть серии в исходном порядке. Заполни пропуск.
  explanation: Прогревочными считаются ровно первые `warmup` элементов, поэтому рабочая серия начинается с индекса `warmup`. Срез не трогает исходную последовательность, а `list(...)` возвращает новый объект — вход остаётся пригодным для отдельного анализа холодного запуска.
  kind: cloze
  template: |-
    def drop_warmup(times, warmup):
        return list(times[___:])
  answer: warmup
  accept:
    - warmup
    - int(warmup)
  id: 009-drop-warmup-1
  fingerprint: 8627bf3e
- concept: запрошенное число прогревочных запусков, превышающее длину серии, даёт пустой результат, а не ошибку и не выдуманные значения
  question: В серии 7 замеров, а функции отбрасывания прогрева передали warmup=12. Каким должно быть корректное поведение?
  explanation: После удаления всего доступного начала не остаётся ни одного замера — значит, рабочих данных нет. Дополнение нулями создало бы измерения, которых не было, а возврат всей серии молча оставил бы холодный запуск внутри выборки. Срез в Python даёт пустой результат сам по себе, без падения по индексу.
  kind: choice
  options:
    - Вернуть пустую последовательность
    - Вернуть последние 12 замеров, дополнив недостающие нулями
    - Вернуть всю серию целиком, так как отбросить 12 элементов невозможно
    - Вернуть последний замер как единственный рабочий
