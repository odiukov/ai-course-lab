- concept: execution provider меняет исполняющее устройство для одного и того же файла модели через конфигурацию сессии, а не через новый экспорт
  question: Объясни своими словами, что даёт механизм execution provider в нейтральном рантайме и почему переход с CPU на CUDA или на Core ML не требует заново экспортировать модель.
  explanation: 'Разделение «граф отдельно, исполнитель отдельно» и есть причина, по которой нейтральный формат берут отправной точкой: стоимость проверки ещё одного бэкенда падает до смены настройки сессии. Важная оговорка — частичная поддержка операций: провайдер берёт те узлы, что умеет, остальные уходят на CPU, и реальное ускорение оказывается меньше ожидаемого.'
  kind: open
  reference: 'Файл модели описывает граф вычислений в нейтральном формате и ничего не знает про железо. Execution provider — сменный модуль-исполнитель, которому рантайм отдаёт узлы графа: CPU-провайдер считает их на процессоре, CUDA- и TensorRT-провайдеры на NVIDIA GPU, Core ML — на ускорителях Apple, OpenVINO — на Intel CPU/VPU. Провайдер выбирается при создании сессии инференса, то есть это параметр запуска, а не свойство файла. Поэтому один и тот же экспортированный файл переносится между бэкендами без повторного экспорта. Ограничения остаются два: провайдер может не поддерживать часть операций графа (тогда неподдержанные узлы падают обратно на CPU и выигрыш сокращается), и сам факт смены провайдера ничего не обещает по скорости — разницу подтверждают замером на целевом устройстве.'
  id: 038-runtime-map-3
