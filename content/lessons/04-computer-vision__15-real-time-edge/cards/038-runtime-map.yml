- concept: нейтральное представление стоит между обучающим фреймворком и рантаймом устройства, а специализированный рантайм подключают после рабочего нейтрального варианта
  question: Расставь шаги вывода обученной PyTorch-модели на конкретное edge-устройство в правильном порядке.
  explanation: 'Нейтральное представление — общий вход для всех рантаймов, поэтому экспорт идёт первым: если операция туда не отображается, вопрос про TensorRT или Core ML вообще не встаёт. Дальше нужен рабочий и измеренный вариант — без него ускорение не с чем сравнивать. Специализированный рантайм подключают последним, потому что он стоит времени и привязывает к вендору, а выигрыш от него не гарантирован и подтверждается только замером на целевом железе.'
  kind: order
  items:
    - Экспортировать обученную PyTorch-модель в нейтральное представление (ONNX), проверив, что все операции модели туда отображаются
    - Запустить полученный файл нейтральным рантаймом (ONNX Runtime) на целевом устройстве и убедиться, что выходы совпадают с исходной моделью
    - Замерить latency этого нейтрального варианта на целевом устройстве — получить базовую точку отсчёта
    - Подключить специализированный под железо путь (провайдер или отдельный рантайм вендора) и сравнить его замеры с базовой точкой
