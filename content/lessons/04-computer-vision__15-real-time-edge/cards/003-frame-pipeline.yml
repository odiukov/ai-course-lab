- concept: ускорение одной стадии конвейера ограничено её долей в полном времени кадра (закон Амдала)
  question: Полная обработка кадра занимает 45 мс, из них инференс модели — 27 мс, остальные стадии — 18 мс. Квантование ускорило модель ровно в 5 раз, остальные стадии не изменились. Сколько миллисекунд теперь занимает обработка кадра целиком?
  explanation: '27 / 5 = 5.4 мс на модель, плюс неизменные 18 мс = 23.4 мс. Пятикратное ускорение модели дало ускорение кадра лишь 45 / 23.4 ≈ 1.9×: выигрыш ограничен долей стадии в общем времени. Поэтому оптимизировать надо ту стадию, которая реально доминирует, и мерить сквозное время, а не время модели.'
  kind: numeric
  answer: 23.4
  tolerance: 0.3
  id: 003-frame-pipeline-1
  fingerprint: a444fe3e
- concept: 'пропускная способность и сквозная задержка — разные величины: конвейеризация стадий по разным кадрам позволяет держать fps выше, чем 1 / latency'
  question: Система устойчиво выдаёт 60 кадров в секунду, но сквозная задержка от захвата кадра до появления результата измерена как 48 мс. Как это возможно?
  explanation: Пропускная способность определяется самой медленной стадией конвейера, а сквозная задержка — суммой всех стадий. При конвейеризации 60 fps требует, чтобы каждая стадия укладывалась в 16.7 мс, но кадр всё равно проходит через них последовательно и живёт в системе 48 мс. Для интерактивных задач (управление, AR) критична задержка, для офлайн-обработки видео — пропускная способность; путать их нельзя.
  kind: choice
  options:
    - 'Измерение задержки ошибочно: при 60 fps она физически не может превышать 16.7 мс'
    - 'Стадии выполняются на разных вычислительных блоках и обрабатывают разные кадры одновременно: пока модель считает кадр N, камера уже захватывает кадр N+1, поэтому такт конвейера равен самой длинной стадии, а не их сумме'
    - Часть кадров отбрасывается, и реальный fps ниже заявленного
    - Задержка включает время загрузки весов модели, которое происходит один раз
