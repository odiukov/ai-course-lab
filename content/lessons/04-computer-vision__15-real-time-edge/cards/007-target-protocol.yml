- concept: результаты двух замеров сопоставимы только при совпадении устройства, режима модели и размера входа; иначе это разные эксперименты
  question: 'Команда сравнивает два детектора. Отчёт по модели A: 9 мс на кадр. Отчёт по модели B: 15 мс на кадр. A замеряли на десктопной видеокарте при входе 320×320, B — на мобильном чипе при входе 640×640. Какой вывод корректен?'
  explanation: 'Latency — свойство пары «модель + условия», а не модели. Различаются устройство и размер входа сразу, поэтому разница 9 против 15 мс отражает условия, а не модели. Пересчёт по отношению разрешений тоже не спасает: связь времени с числом пикселей не линейна и зависит от архитектуры и железа. Единственный корректный ход — переизмерить обе модели при одинаковом устройстве, режиме и входе.'
  kind: choice
  options:
    - A быстрее B в 1,7 раза
    - 'Сравнение невозможно: замеры сделаны в разных условиях, нужен новый прогон обеих моделей на одном устройстве с одинаковым входом'
    - Нужно домножить время B на отношение разрешений и после этого сравнивать
    - B быстрее, потому что обрабатывала более крупный кадр
  correct: 1
  id: 007-target-protocol-1
  fingerprint: 74c98df8
- concept: объём входных данных растёт как квадрат линейного разрешения, поэтому latency с одного разрешения не переносится на другое
  question: Модель профилировали при входном кадре 320×320. В продакшене устройство подаёт кадр 640×640. Во сколько раз больше пикселей содержит продакшен-кадр?
  explanation: '(640·640)/(320·320) = 4. Удвоение линейного размера даёт четырёхкратный рост числа пикселей, а значит и объёма работы свёрточных слоёв. Поэтому измеренное на уменьшенном входе время не описывает продакшен: фиксировать размер входа надо на том разрешении, которое реально увидит устройство.'
  kind: numeric
  answer: 4
  tolerance: 0.01
  id: 007-target-protocol-2
