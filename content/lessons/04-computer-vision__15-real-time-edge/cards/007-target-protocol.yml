- concept: 'профилировать надо в режиме инференса: обучающий режим добавляет вычисления градиентов и меняет поведение части слоёв'
  question: Почему при замере скорости модели её обязательно переводят в режим инференса, а не оставляют в обучающем режиме?
  explanation: Режим модели — обязательный пункт паспорта замера наравне с устройством и размером входа. Обучающий режим завышает время и пиковую память из-за хранения активаций и графа, а поведение dropout и batch normalization отличается от продакшена, из-за чего числа нельзя переносить на реальную эксплуатацию.
  kind: open
  reference: 'В обучающем режиме выполняется лишняя работа и меняется семантика слоёв. Во-первых, сохраняются промежуточные активации и строится граф для обратного прохода — это тратит время и память, которых в продакшене не будет. Во-вторых, часть слоёв ведёт себя по-разному: dropout при обучении зануляет активации, а при инференсе выключен; batch normalization при обучении считает статистики по текущему батчу, а при инференсе использует накопленные бегущие оценки. Итог: обучающий режим даёт и другую скорость, и другие предсказания, поэтому такой замер отвечает не на тот вопрос, который проверяет продукт.'
  id: 007-target-protocol-3
  fingerprint: ba9c413f
