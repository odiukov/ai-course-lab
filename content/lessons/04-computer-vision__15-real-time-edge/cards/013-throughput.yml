- concept: 'связь fps и времени кадра гиперболическая: одинаковая экономия миллисекунд даёт разный прирост fps в зависимости от исходного времени'
  question: Кадры обрабатываются строго по одному, без перекрытия. Оптимизация сократила время обработки кадра с 16 мс до 12.5 мс. На сколько кадров в секунду вырастет пропускная способность?
  explanation: '1000/16 = 62.5 fps, 1000/12.5 = 80 fps, прирост 17.5 fps. Та же экономия 3.5 мс на медленной модели даёт куда меньше: например, с 50 мс до 46.5 мс это 20 fps против 21.5 fps, то есть всего +1.5. Зависимость fps = 1000 / t обратная, а не линейная, поэтому «сэкономили N мс» само по себе ничего не говорит о приросте fps — важно, от какого времени кадра считать.'
  kind: numeric
  answer: 17.5
  tolerance: 0.1
  id: 013-throughput-1
  fingerprint: fa1ebd6d
- concept: 'перевод времени кадра в fps — монотонно убывающее преобразование: смена единиц не меняет, какая модель быстрее'
  question: Три модели обрабатывают кадр за 6.4 мс, 8 мс и 12.5 мс при последовательной обработке. Что верно про их пропускную способность в fps?
  explanation: 'fps = 1000 / t — строго убывающая функция от t, значит она переворачивает порядок и ничего к измерению не добавляет: 156.25, 125 и 80 fps. Вариант 3 неверен, потому что преобразование не линейное: разрыв 6.4→8 мс даёт 31.25 fps, а 8→12.5 мс — 45 fps. Вариант 4 неверен, потому что формула как раз предполагает обработку по одному кадру, без перекрытия.'
  kind: choice
  options:
    - 'Порядок по fps обратен порядку по времени кадра: самая быстрая по миллисекундам остаётся самой быстрой и в fps'
    - 'Порядок по fps совпадает с порядком по времени кадра: у модели с 12.5 мс будет наибольший fps'
    - Разница в fps пропорциональна разнице в миллисекундах, поэтому пары 6.4/8 и 8/12.5 разойдутся по fps одинаково
    - Сравнение в fps может изменить, какая модель быстрее, потому что fps учитывает параллельную обработку кадров
