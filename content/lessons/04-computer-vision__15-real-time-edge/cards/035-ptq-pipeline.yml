- concept: после prepare модель остаётся в плавающей запятой, а observers — пассивные измерители, поэтому калибровочный прогон не является обучением
  question: Что происходит с моделью в момент прогона калибровочных примеров после prepare?
  explanation: 'prepare вставляет observers — пассивные измерители на пути данных. Они прозрачны для значений и только копят статистику, поэтому прогон идёт под no_grad и калибровочные данные не нуждаются в разметке. Переход в целочисленное представление случается позже, в convert. Отсюда и дешевизна static PTQ по сравнению с QAT: ни градиентов, ни меток, ни оптимизатора.'
  kind: choice
  options:
    - Модель уже целочисленная, и прогон подстраивает её веса под целочисленную сетку
    - Модель остаётся в плавающей запятой, веса не меняются, observers пропускают значения без изменений и лишь записывают их размах
    - Observers масштабируют активации на лету, поэтому выходы прогона отличаются от выходов исходной модели
    - Считаются градиенты по калибровочной ошибке, но шаг оптимизатора не делается
  correct: 1
