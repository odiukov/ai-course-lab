- concept: 'порядок static PTQ: слияние совместимых цепочек предшествует вставке observers, а сбор статистики активаций — замене операций на квантованные'
  question: Расставь шаги post-training static quantisation в правильном порядке.
  explanation: 'Порядок не формальность. Слияние делают до prepare: наблюдать надо выход того блока, который реально окажется одной квантованной операцией, иначе диапазоны собраны для промежуточных тензоров, которых после слияния не будет. Калибровка идёт до convert: convert потребляет собранную статистику как параметры масштаба. Вызов convert сразу по обученной FP32-модели формально отработает, но диапазоны будут подобраны вслепую и точность просядет.'
  kind: order
  items:
    - Перевести модель в режим инференса и слить совместимые цепочки слоёв (свёртка + батч-норм + активация) в единые блоки
    - Задать конфигурацию квантования для целевого backend
    - 'Вызвать prepare: вставить observers в точки, где нужны диапазоны активаций'
    - Прогнать без градиентов набор характерных примеров, чтобы observers записали фактические min/max активаций
    - 'Вызвать convert: заменить подготовленные блоки целочисленными реализациями и убрать observers'
  id: 035-ptq-pipeline-1
  fingerprint: ef86cb3b
- concept: калибровочная выборка задаёт границы диапазона активаций, поэтому сдвиг её распределения относительно рабочего вызывает насыщение активаций на инференсе
  question: Детектор для круглосуточной уличной камеры калибруют перед статическим квантованием на 2000 кадрах, снятых в ясный день. В проде ночью точность падает заметно сильнее, чем днём. Что произошло?
  explanation: 'Калибровка фиксирует масштаб и точку нуля по наблюдённому размаху активаций. Значения вне этого размаха на инференсе не расширяют диапазон, а клиппируются — ошибка от насыщения не ограничена шагом сетки и растёт с выходом за границу. Веса при калибровке не трогаются (вариант 2 и 3 неверны), поэтому лечится это не дообучением, а калибровочным набором из реального рабочего распределения: 100-500 примеров хватает, но они должны покрывать и ночные условия.'
  kind: choice
  options:
    - Observers записали диапазоны только дневных активаций; ночные активации выходят за эти границы и обрезаются насыщением
    - Ночные кадры требуют пересчёта весов, а калибровка веса не обновила
    - Калибровка переобучила модель на дневное распределение, так как прогон данных через сеть меняет параметры
    - Слияние свёртки с батч-нормом невалидно при низкой освещённости входа
  correct: 0
