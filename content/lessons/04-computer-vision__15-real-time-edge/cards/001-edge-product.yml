- concept: результат на рабочей станции не переносится на целевое железо — проверять надо на нём
  question: Прототип уверенно работает с веб-камеры на ноутбуке разработчика. Объясни своими словами, почему это не доказывает работоспособность на целевом устройстве, и что нужно измерить на самом устройстве.
  explanation: 'Главная ошибка — переносить цифры рабочей станции на устройство. Разница возникает по всем осям сразу: другой процессор и другой рантайм дают другую задержку, ограниченная память приводит к падению, тепловой бюджет срезает частоту через минуты работы, а другая камера меняет распределение входных данных и точность.'
  kind: open
  reference: 'Ноутбук скрывает ограничения: мощный процессор, дискретная видеокарта, много оперативной памяти, полный набор привычных библиотек, активное охлаждение и питание от сети. Целевое устройство (телефон, промышленная камера, дрон) имеет иной процессор и меньше памяти, делит ресурсы с остальной системой, ограничено по энергопотреблению и охлаждению — при длительной нагрузке уходит в троттлинг, поэтому первые кадры выглядят лучше устоявшегося режима. Запуск на ноутбуке отвечает лишь на вопрос «модель в принципе работает». Измерять на целевом железе нужно: пиковое потребление памяти, реальную задержку и пропускную способность в устоявшемся тепловом режиме, потребляемую мощность, а также качество предсказаний на входных данных этого устройства — с его оптикой, разрешением и условиями освещения.'
  id: 001-edge-product-3
  fingerprint: 3d37f865
