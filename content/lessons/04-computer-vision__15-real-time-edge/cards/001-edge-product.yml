- concept: edge-инференс определяется местом вычисления — рядом с источником данных, а не размером модели
  question: Какая характеристика делает развёртывание edge-развёртыванием?
  explanation: 'Edge — про место вычисления, а не про размер или скорость. Маленькая быстрая модель, которая шлёт кадры в облако, edge-решением не является; крупная модель на промышленном компьютере рядом с камерой — является. Отсюда и свойства: работа без сети и отсутствие пересылки видеопотока наружу, но плата — жёсткий бюджет памяти, вычислений и энергии устройства.'
  kind: choice
  options:
    - Модель занимает менее 20 МБ после квантизации
    - Вычисления выполняются на устройстве рядом с источником данных, без отправки на удалённый сервер
    - Модель обучалась на данных, собранных с датчиков устройства
    - Инференс идёт в реальном времени с частотой не ниже 25 кадров в секунду
  correct: 1
  id: 001-edge-product-1
  fingerprint: '80327517'
- concept: поддержка операций рантаймом устройства — ограничение, независимое от объёма памяти
  question: Детектор квантизован до INT8, весит 6 МБ и спокойно помещается в память целевой камеры, но при запуске на ней падает с ошибкой о неподдерживаемой операции. Что это означает?
  explanation: 'Пригодность к edge проверяется по нескольким независимым осям: объём памяти, поддержка операций процессором и программной средой, энергопотребление и тепловой режим, качество предсказаний на реальных входах. Модель может пройти по памяти и упереться в набор операций — например, использовать слой, которого нет в TFLite или в наборе ускорителя. Лечится заменой операции или сборкой рантайма с нужным ядром, а не откатом квантизации.'
  kind: choice
  options:
    - Квантизация выполнена неверно, нужно вернуться к FP32
    - Памяти на самом деле не хватает, ошибка вводит в заблуждение
    - 'Ограничения устройства не сводятся к памяти: набор операций, поддерживаемых процессором и рантаймом устройства, — отдельное требование'
    - Модель слишком велика по числу параметров для встраиваемого класса устройств
  correct: 2
  id: 001-edge-product-2
