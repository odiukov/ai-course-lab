- concept: среднее время инференса скрывает хвост распределения, который и определяет годность для реального времени
  question: 'Профилировщик записал 100 инференсов: 95 из них заняли по 10 мс, оставшиеся 5 — по 210 мс. Чему равно среднее время одного инференса в миллисекундах?'
  explanation: (95·10 + 5·210)/100 = (950 + 1050)/100 = 20 мс. Среднее выглядит отличным, но p95 здесь 210 мс — в 10 раз хуже. Именно эти редкие срывы пользователь видит как рывки картинки, поэтому latency отчитывают перцентилями (p50/p95/p99), а не средним.
  kind: numeric
  answer: 20
  tolerance: 0.5
  id: 004-three-budgets-1
  fingerprint: '93713233'
- concept: ограничение по памяти проверяется по мгновенному пику потребления, а не по размеру весов или среднему потреблению
  question: Файл весов модели — 40 МБ. Средний расход памяти при инференсе — 120 МБ, но на одном слое с большими промежуточными активациями расход кратковременно доходит до 512 МБ. У платы 256 МБ доступной памяти. Что произойдёт?
  explanation: Ограничение проверяется по пику одновременно занятой памяти. 512 МБ > 256 МБ, значит аллокация не пройдёт и процесс будет убит — краткости превышения достаточно. Ни размер файла весов (40 МБ), ни среднее (120 МБ) на этот вопрос не отвечают, а снижение частоты кадров не уменьшает пик внутри одного кадра.
  kind: choice
  options:
    - 'Модель запустится: и веса, и средний расход укладываются в 256 МБ'
    - Модель упадёт с ошибкой нехватки памяти в момент прохода через тяжёлый слой
    - Модель запустится, но будет работать медленнее из-за подкачки активаций
    - Модель запустится, если снизить частоту кадров и дать памяти освободиться между кадрами
  correct: 1
  id: 004-three-budgets-2
  fingerprint: f3e163c4
- concept: 'latency, пиковая память и энергия на инференс — независимые критерии допуска: прохождение одного не выводится из остальных'
  question: Инженер измерил задержку модели и убедился, что она укладывается в бюджет кадра. Почему этого недостаточно, чтобы выпустить модель на устройство с батареей? Объясни своими словами.
  explanation: Три бюджета — задержка, пиковая память, энергия — независимые проверки. Прохождение одной ничего не говорит про остальные, а оптимизация под одну регулярно ухудшает другую. Решение по edge принимают по таблице (модель, latency, память, энергия, точность), где каждая клетка измерена отдельно.
  kind: open
  reference: 'Задержка — только один из трёх критериев допуска. Второй — пиковая память: модель, которая считает быстро, всё равно не запустится, если в какой-то момент запросит больше памяти, чем есть на устройстве, и процесс будет убит по OOM. Третий — энергия на один инференс (миллиджоули): модель может отвечать вовремя и помещаться в память, но держать CPU/GPU под такой нагрузкой, что устройство перегревается или быстро разряжает батарею. Эти критерии не выводятся один из другого и часто конфликтуют: приём, снижающий задержку (например, более агрессивная загрузка ускорителя), может увеличить расход энергии, а сокращение памяти — увеличить задержку. Поэтому каждую величину измеряют отдельно, и решение о выпуске принимают по всем трём сразу.'
  id: 004-three-budgets-3
  fingerprint: ca5cf3ec
