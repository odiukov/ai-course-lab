- concept: для измерения коротких интервалов нужен монотонный высокоточный таймер
  question: Почему задержку инференса в Python обычно измеряют с помощью time.perf_counter(), а не календарного времени?
  explanation: 'time.perf_counter() предназначен для измерения длительности: обладает высокой точностью и не зависит от коррекции системных часов. Синхронизацию GPU и отделение прогрева всё равно нужно выполнять явно.'
  kind: choice
  options:
    - Он автоматически синхронизирует операции CUDA
    - Он является монотонным высокоточным таймером и подходит для коротких интервалов
    - Он исключает время подготовки входного тензора
    - Он сам отбрасывает результаты прогрева
  correct: 1
  id: 015-measurement-check-1
  fingerprint: 6b3ca55d
- concept: benchmark инференса должен отключать обучающее поведение модели и построение графа градиентов
  question: Объясни, зачем перед измерением задержки PyTorch-модель переводят в режим eval и запускают внутри torch.no_grad().
  explanation: Без eval измеряется обучающее поведение некоторых слоёв, а без no_grad PyTorch может создавать ненужный граф вычислений. В обоих случаях benchmark перестаёт точно представлять реальную нагрузку инференса.
  kind: open
  reference: eval включает поведение слоёв, соответствующее инференсу, например отключает dropout и переводит batch normalization в режим использования накопленной статистики. torch.no_grad() запрещает построение графа градиентов и убирает ненужные для инференса расходы памяти и времени.
  id: 015-measurement-check-2
  fingerprint: d525295e
