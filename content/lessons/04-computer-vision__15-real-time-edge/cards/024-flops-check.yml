- concept: число параметров и число FLOPs измеряют разные величины и не выводятся одно из другого
  question: У модели A 3 млн параметров, у модели B 9 млн. Может ли модель A выполнять больше операций с плавающей точкой за один инференс, чем модель B?
  explanation: Параметры измеряют объём весов (сколько места они занимают), FLOPs — вычислительную работу за один проход. Свёрточный слой с крошечным ядром, прогоняемый по карте высокого разрешения или вызываемый несколько раз за проход, даёт мало параметров и много операций. Числовой формат весов на счётчик FLOPs не влияет.
  kind: choice
  options:
    - 'Да: одни и те же веса могут применяться к большим картам признаков и многократно за проход, поэтому объём весов не задаёт объём вычислений'
    - 'Нет: FLOPs пропорциональны числу параметров, поэтому у модели с меньшим числом весов их всегда меньше'
    - Да, но только если у модели A веса хранятся в более широком числовом формате
  correct: 0
  id: 024-flops-check-1
  fingerprint: ef54ba3c
- concept: FLOPs служат для отбора архитектур-кандидатов, а решение о деплое принимается по замеренной на целевом устройстве latency
  question: Расставь шаги выбора модели под целевое устройство в правильном порядке.
  explanation: 'FLOPs дёшевы и считаются без железа, поэтому ими удобно сужать пространство поиска. Но FLOPs — это километраж, а не время в пути: реализация операции, пропускная способность памяти и накладные расходы на запуск ядер меняют итог. Годность по дедлайну подтверждает только замер на том железе, где модель будет работать.'
  kind: order
  items:
    - Отсеять по объёму весов и требованиям к памяти те архитектуры, которые заведомо не помещаются на устройство
    - Сравнить оставшихся кандидатов по FLOPs как дешёвой аппаратно-независимой оценке и оставить шортлист
    - Замерить latency каждого кандидата из шортлиста на самом целевом устройстве
    - Принять решение о деплое по замеренному времени, а не по расчётным оценкам
  id: 024-flops-check-2
  fingerprint: 4f981ab7
