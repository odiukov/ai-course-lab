- concept: процентиль p_k — граница, ниже которой лежит k% отсортированных измерений
  question: Собрано 500 замеров времени инференса. Сколько из них не превышают значение p90?
  explanation: 'p90 — значение, ниже или равное которому лежат 90% замеров: 0.90 × 500 = 450. Процентиль всегда читается как доля выборки, уложившаяся в границу, а не как «типичное» время.'
  kind: numeric
  answer: 450
  tolerance: 1
  id: 005-tail-latency-1
  fingerprint: ee25302a
- concept: 'высокий процентиль не задаёт верхнюю границу задержки: худшая доля замеров остаётся без оценки сверху'
  question: Замеры на целевом устройстве дали p97 = 28 мс при бюджете кадра 33 мс. Какой вывод из этого НЕ следует?
  explanation: Процентиль отсекает долю выборки, но ничего не говорит о том, как далеко уходит остаток. При p97 = 28 мс худшие 3% замеров могут быть и 40 мс, и 400 мс. Верхнюю границу даёт только максимум, а близость к ней оценивают, добавляя более высокие процентили.
  kind: choice
  options:
    - 97% кадров обработаны за 28 мс или быстрее
    - Максимальная задержка не превышает 28 мс
    - Оставшиеся 3% кадров могут выйти за 33 мс, и насколько — этот замер не показывает
  correct: 1
  id: 005-tail-latency-2
  fingerprint: cad3b6c9
- concept: уровень процентиля выбирают по допустимой доле кадров, просрочивших дедлайн
  question: 'Продуктовое требование: не более одного просроченного кадра из 40. С каким процентилем задержки нужно сравнивать дедлайн кадра и почему именно с ним?'
  explanation: 'Допустимая доля промахов f задаёт уровень процентиля (1 − f): 1/40 = 2.5% даёт p97.5. Требование «не тормозить» всегда неявно содержит долю — её и надо сделать явной, иначе непонятно, какой процентиль считать критерием допуска.'
  kind: open
  reference: 'Один промах из 40 — это 2.5% кадров, значит укладываться в дедлайн должны 97.5% замеров, и сравнивать надо p97.5: если p97.5 ≤ дедлайна, доля просрочек не выше допустимой. Уровень процентиля — это перевод требования к надёжности в точку распределения: более мягкое требование сдвигает проверку вниз (p90), более жёсткое — вверх (p99 и выше). Средняя задержка для такой проверки бесполезна: она не соответствует никакой доле кадров.'
  id: 005-tail-latency-3
  fingerprint: 0cf325f5
