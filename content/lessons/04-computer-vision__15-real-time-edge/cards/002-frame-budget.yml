- concept: крайний срок обработки кадра равен обратной величине частоты кадров
  question: Видеопоток идёт с частотой 60 кадров в секунду. Сколько миллисекунд проходит между приходом соседних кадров — то есть каков крайний срок полной обработки одного кадра?
  explanation: 'Интервал между кадрами = 1 секунда / частота кадров. Для 60 fps это 1000 мс / 60 ≈ 16.7 мс. Чем выше целевая частота, тем жёстче дедлайн: у 60 fps бюджет вдвое меньше, чем у 30 fps (≈33 мс).'
  kind: numeric
  answer: 16.67
  tolerance: 0.5
  id: 002-frame-budget-1
  fingerprint: 6c1af925
- concept: превышение кадрового бюджета накапливает отставание линейно по числу кадров
  question: Камера отдаёт 15 кадров в секунду, а полный конвейер обработки тратит 80 мс на кадр. На сколько миллисекунд результат отстанет от реальности после 60 кадров?
  explanation: 'Интервал кадров = 1000/15 ≈ 66.7 мс. Перерасход = 80 − 66.7 ≈ 13.3 мс на кадр, и он копится: 13.3 × 60 ≈ 800 мс. Отставание растёт линейно, поэтому «немного медленнее бюджета» через минуту превращается в секунды задержки.'
  kind: numeric
  answer: 800
  tolerance: 10
  id: 002-frame-budget-2
  fingerprint: c4d67da8
- concept: кадровый бюджет делится между всеми стадиями конвейера, а не отдаётся инференсу целиком
  question: Кадровый бюджет системы — 50 мс. Инференс модели измерен и стабильно укладывается в 45 мс, но подсказки на экране всё равно отстают от происходящего. Что наиболее вероятно?
  explanation: 'Дедлайн относится ко всему пути кадра: захват, препроцессинг, инференс, постобработка. Если инференс съел 45 из 50 мс, остальным стадиям остаётся 5 мс — этого обычно не хватает. Поэтому на модель закладывают заметно меньше полного бюджета.'
  kind: choice
  options:
    - 'Измерение latency неверно: инференс нельзя измерять отдельно от обучения'
    - Захват кадра, препроцессинг и постобработка тоже расходуют бюджет, и суммарно конвейер выходит за 50 мс
    - Модель слишком мала по числу параметров, поэтому качество предсказаний падает
    - Частота кадров камеры не влияет на дедлайн, если модель быстрее 50 мс
  correct: 1
  id: 002-frame-budget-3
  fingerprint: d4a09e4e
