- concept: пустой вход — нарушение предусловия статистик, функция обязана явно его отвергнуть, а не вернуть подставное значение
  question: Функция считает среднее и перцентили по последовательности замеров задержки. Что она должна делать при пустом входе?
  explanation: 'На пустой выборке среднее не определено (деление на ноль), а перцентиля нет ни на какой позиции. Нули и None — подставные данные: они пройдут дальше по конвейеру и превратятся в отчёт «задержка 0 мс» или в падение через несколько шагов, где причину уже не видно. Явная ошибка на границе функции ловит проблему там, где она возникла — например, при пустом списке после отрезания прогрева.'
  kind: choice
  options:
    - Явно возбуждать исключение с понятным сообщением
    - Возвращать нули по всем ключам
    - Возвращать None без сообщения
    - Возвращать NaN по всем ключам и продолжать работу
