- concept: среднее — симметричная функция от набора, перцентиль — порядковая статистика и определён только на упорядоченной выборке
  question: Какую из статистик набора замеров можно вычислить, не упорядочивая значения?
  explanation: 'Среднее — сумма, делённая на количество; сумма не зависит от порядка слагаемых. Перцентиль (включая медиану) — порядковая статистика: он определяется как элемент на заданной позиции упорядоченной выборки, поэтому без сортировки позиция не имеет смысла. Отсюда и порядок действий в benchmark: сначала отсортированная копия, потом индексы.'
  kind: choice
  options:
    - Среднее
    - p90
    - p75
    - Медиану
