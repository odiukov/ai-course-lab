- concept: память под веса выводится из числа параметров и числа байт на параметр, поэтому один и тот же бэкбон имеет разный вес в разных форматах
  question: Бэкбон содержит 45 миллионов параметров и хранится в формате с четырьмя байтами на параметр. Сколько мегабайт занимают только веса? (1 МБ = миллион байт)
  explanation: 45e6 × 4 байта = 180e6 байт ≈ 180 МБ. Перевод в однобайтовый целочисленный формат даёт ≈45 МБ — вчетверо меньше. Именно поэтому бюджет параметров устройства осмысленно переводить в мегабайты только вместе с форматом хранения; сами по себе параметры единиц памяти не задают.
  kind: numeric
  answer: 180
  tolerance: 1
  id: 026-picker-constraints-1
  fingerprint: 2f994501
- concept: 'порядок отбора архитектуры: сначала жёсткие границы устройства как фильтр допуска, затем точность среди допустимых, затем замер на целевом железе'
  question: Расположи шаги выбора бэкбона для встраиваемого устройства в правильном порядке.
  explanation: 'Рейтинг точности упорядочивает кандидатов, но не отвечает, кто вообще допустим. Ограничения устройства работают фильтром: модель, не влезающая в память или дедлайн, не становится пригодной от высокой точности. Обратный порядок (сначала лучшая по точности, потом подгонка под железо) регулярно кончается моделью, которая не собирается или пропускает кадры.'
  kind: order
  items:
    - Зафиксировать допустимые для устройства значения latency, пиковой памяти и энергии на инференс
    - Отбросить архитектуры, чей бюджет параметров и операций заведомо не укладывается в эти границы
    - Сравнить по точности только оставшихся допустимых кандидатов
    - Замерить победителя на самом целевом устройстве и подтвердить, что границы выдержаны
  id: 026-picker-constraints-2
  fingerprint: 83d7cf11
- concept: целочисленное квантование — режим по умолчанию для edge-развёртывания, а отказ от него требует отдельного обоснования
  question: Почему для развёртывания на устройстве однобайтовое целочисленное представление весов берут по умолчанию, а более широкий формат — только с обоснованием?
  explanation: Квантование меняет не одну метрику, а сразу три ограничения допуска. Поэтому дефолт — квантовать, а сохранение широкого формата надо доказывать замером, а не осторожностью.
  kind: open
  reference: 'Однобайтовое представление сокращает память под веса вчетверо относительно четырёхбайтового, уменьшает трафик памяти и позволяет использовать целочисленные ядра ускорителей, которые на мобильном железе быстрее и энергоэффективнее вещественных. Для типичных свёрточных классификаторов с калиброванным квантованием потеря точности мала (доли процентного пункта), поэтому выигрыш по трём ограничениям сразу — память, latency, энергия — почти всегда перевешивает. Отказ оправдан только конкретной причиной: слой с большим динамическим диапазоном, чувствительная к точности голова, отсутствие целочисленной поддержки нужной операции в рантайме или подтверждённое замером падение качества ниже допустимого. Обоснование требуется именно от отказа, а не от квантования.'
  id: 026-picker-constraints-3
  fingerprint: 7e793689
