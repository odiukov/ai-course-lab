- concept: перевод задержки в fps возвращает дробное значение; округление — задача вывода, а не расчёта, иначе близкие модели становятся неразличимыми
  question: Функция перевода задержки в кадры за секунду округляет результат до целого перед возвратом. Модель A обрабатывает кадр за 12.3 мс, модель B — за 12.4 мс. Чем это округление вредит сравнению?
  explanation: '81.30 fps и 80.65 fps округляются к одному целому — 81. Информация о разнице стёрта внутри расчёта, и восстановить её вызывающий код уже не может. Порядок при этом не переворачивается (вариант 2): перевод монотонен. Округлять стоит только при печати отчёта, возвращать — float.'
  kind: choice
  options:
    - Обе модели дадут 81 fps, и разница в скорости исчезнет из результата, хотя в задержках она есть
    - 'Округление изменит порядок моделей: более медленная B получит больше кадров в секунду'
    - Округление сделает результат отрицательным при задержках меньше миллисекунды
    - Округление ломает только вывод на экран, на численном сравнении моделей оно не сказывается
