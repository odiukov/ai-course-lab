  fingerprint: 4a56cff1
- concept: 'выигрыш pruning определяется избыточностью модели: у компактной архитектуры резерва связей нет, и обрезка сразу режет полезную ёмкость'
  question: 'У вас два кандидата: тяжёлый серверный бэкбон и компактная мобильная архитектура на 1.8M параметров. Обе надо ужать. Почему pruning разумно пробовать на первой и почти бессмысленно на второй?'
  explanation: Pruning не создаёт качество, а лишь удаляет то, что модель и так не использует. Поэтому перед обрезкой стоит проверить, есть ли избыточность (например, оценить чувствительность метрики к занулению доли весов). Нет избыточности — нет и выигрыша, только деградация.
  kind: open
  reference: 'Pruning убирает избыточность. Крупная переразмеренная сеть обучалась с большим запасом связей: значительная часть весов вносит малый вклад, их удаление почти не меняет функцию, которую модель реализует. Компактная архитектура уже спроектирована под жёсткий бюджет — её ёмкость близка к минимально необходимой для задачи, лишних весов там нет, и любое удаление снимает не запас, а рабочую ёмкость, что сразу видно по падению метрики. Для второй модели правильный ход — не резать её дальше, а переносить в неё знание большей модели через distillation.'
  id: 037-pruning-distillation-2
  fingerprint: 3544aa50
- concept: distillation переносит поведение через мягкие цели учителя, обучая ученика; на устройство уходит только ученик
  question: Расставьте шаги дистилляции в правильном порядке.
  explanation: 'Ученик копирует не веса учителя (архитектуры разные), а его способ распределять уверенность между классами: мягкие цели несут информацию о близости классов, которой в one-hot метке нет. Учитель нужен только на этапе обучения — в рантайме на edge остаётся одна маленькая модель.'
  kind: order
  items:
    - Обучить (или взять готовую) большую модель-учителя до нужной точности
    - Прогнать обучающие данные через учителя и получить его логиты/мягкие распределения
    - Обучить компактную модель-ученика на комбинации истинных меток и мягких целей учителя
    - Развернуть на устройстве только ученика, учитель в инференсе не участвует
  id: 037-pruning-distillation-3
  fingerprint: 6500326d
