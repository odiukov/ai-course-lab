- concept: 'жёсткое ограничение по ресурсу работает как фильтр допуска, а не как слагаемое в общей оценке: модель, нарушающая его, не компенсирует это лучшими значениями других метрик'
  question: Модель для встраиваемой платформы должна укладываться в жёсткий бюджет по задержке. Модель X бюджет нарушает, но заметно точнее и экономичнее по энергии, чем модель Y, которая в бюджет укладывается. Как правильно построить сравнение?
  explanation: Бюджет по ресурсу — условие допуска, а не одна из складываемых оценок. Нарушение означает, что система не работает как заявлено (просроченные кадры, OOM, разряд), и никакая точность этого не отменяет. Сначала фильтр «проходит / не проходит» по каждому жёсткому ограничению, затем сравнение оставшихся кандидатов по качеству.
  kind: choice
  options:
    - 'Сложить метрики во взвешенную сумму: выигрыш X по точности и энергии перевесит нарушение бюджета'
    - Отсеять X как недопустимую и сравнивать по точности и энергии только модели, прошедшие бюджет
    - Взять X и компенсировать нарушение бюджета, снизив частоту опроса метрик на устройстве
  correct: 1
