- concept: выигрыш графового рантайма над eager-исполнением создаётся слиянием операций и отсутствием пооперационных накладных расходов, поэтому он тем больше, чем мельче и многочисленнее операции
  question: На одном CPU ONNX Runtime обгоняет PyTorch eager на модели из 60 мелких свёрточных блоков, но даёт почти нулевой выигрыш на модели, время которой почти целиком занято одним большим матричным умножением. Чем это лучше всего объясняется?
  explanation: Eager платит фиксированную цену за каждую операцию (диспетчеризация, аллокация промежуточных тензоров), и на мелких слоях эта цена сопоставима с самим вычислением. Статический граф позволяет слить conv+bn+activation и переиспользовать буферы. Когда одно ядро съедает почти всё время кадра, обе реализации упираются в одну и ту же арифметику — по закону Амдала выигрывать нечего.
  kind: choice
  options:
    - ONNX хранит веса в более компактном формате, поэтому мелкие слои занимают меньше памяти
    - Графовый рантайм убирает пооперационные накладные расходы и сливает цепочки мелких операций; там, где время уходит в одно крупное арифметическое ядро, убирать нечего
    - ONNX Runtime автоматически квантует мелкие слои в INT8, а крупные оставляет в FP32
    - Eager-режим считает градиенты, а ONNX Runtime — нет
  correct: 1
