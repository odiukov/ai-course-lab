- concept: потерю точности от квантования измеряют на отложенных данных, не участвовавших в калибровке, иначе оценка оптимистично смещена
  question: Инженер откалибровал static PTQ на 256 изображениях и на этих же 256 изображениях измерил точность INT8-модели против FP32. Объясни, почему полученная потеря точности не годится как оценка, и как измерять правильно.
  explanation: Калибровка — подгонка параметров квантования под распределение данных. Проверка на тех же данных измеряет качество подгонки, а не обобщение. Типичная корректно измеренная потеря PTQ на vision-моделях — доли процентного пункта; смещённая оценка легко покажет ноль и пропустит реальную деградацию.
  kind: open
  reference: Калибровочная выборка задала диапазоны активаций именно под эти примеры, поэтому на них насыщения и ошибки округления минимальны — оценка смещена в оптимистичную сторону и не переносится на рабочий поток. Точность обеих версий надо мерить на отложенном наборе, не пересекающемся с калибровочным, причём одним и тем же протоколом (та же предобработка, тот же вход, режим инференса) для FP32 и INT8, а сравнивать разницу метрик, а не абсолютное число одной из них.
  id: 043-final-quiz-2
