  reference: Бюджет в таблице — на одну работающую модель. Четыре потока делят одну и ту же память и один вычислитель, поэтому доступные на экземпляр память и доля вычислителя падают примерно вчетверо, а кадровый дедлайн у каждого потока прежний. Значит нужно спуститься на строку-другую вниз (например, к ConvNeXt-Tiny или EfficientNet-Lite-B0), зафиксировать разрешение входа, квантовать в INT8 и перемерить задержку на самой плате при всех четырёх запущенных потоках — одиночный замер одной модели больше ничего не доказывает.
