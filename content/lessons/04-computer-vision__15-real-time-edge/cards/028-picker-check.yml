  question: Jetson с питанием от сети тянет строку Swin-V2-Tiny для одной камеры. На плату вешают четыре камеры, каждая со своим экземпляром модели. Объясни своими словами, как меняется подбор бэкбона.
  explanation: Класс железа задаёт верхнюю границу суммарного бюджета, а не бюджет каждой модели. Пока потоки не запущены вместе, о годности верхней строки судить нельзя.
