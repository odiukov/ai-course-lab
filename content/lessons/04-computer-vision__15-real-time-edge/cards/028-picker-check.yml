- concept: внутри одного бюджетного класса кандидата выбирают по точности на параметр в целевом рантайме, а не по репутации архитектуры на сервере
  question: Модель нужно экспортировать в TFLite и запускать на CPU телефона, бюджет около 6-8 миллионов параметров. Почему EfficientNet-Lite-B0 — разумный кандидат этой строки, а не серверная архитектура того же размера?
  explanation: 'Столбец «why» в таблице подбора — не украшение: EfficientNet-Lite-B0 стоит в строке 3-10M именно как лучшая точность на параметр в TFLite. Совпадение по числу параметров ставит кандидатов в одну строку, а решает совместимость с целевым тулчейном и вычислителем.'
  kind: choice
  options:
    - У неё заведомо меньше FLOPs, а FLOPs напрямую задают задержку
    - Серия Lite спроектирована под операции, которые чисто компилируются в TFLite, и даёт лучшую точность на параметр именно в этом рантайме; равный размер не гарантирует, что серверная архитектура вообще соберётся
    - Только она поддерживает INT8-квантование
    - Она обучена на большем числе эпох
