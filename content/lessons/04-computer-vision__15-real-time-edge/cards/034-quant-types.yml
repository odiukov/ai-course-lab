- concept: dynamic-квантизация переводит в INT8 только веса, активации остаются в плавающей запятой, поэтому ускорение мало
  question: 'Инженер применил dynamic-квантизацию к свёрточной сети зрения: размер файла упал, но время инференса почти не изменилось. Что объясняет это лучше всего?'
  explanation: Dynamic квантует веса в INT8, но активации считаются в плавающей запятой. Выигрыш идёт в основном от объёма памяти под веса, а вычисления не переходят целиком на INT8-ядра. Заметное ускорение даёт static PTQ, где квантованы и веса, и активации.
  kind: choice
  options:
    - Активации остаются в плавающей запятой, поэтому основная часть матричных умножений не идёт по целочисленному пути
    - Веса при dynamic-квантизации не квантуются, меняется только формат хранения файла
    - Dynamic-квантизация требует калибровочного набора, а без него ускорение отключается
    - Размер модели и скорость инференса вообще не связаны ни при каком типе квантизации
  correct: 0
  id: 034-quant-types-1
  fingerprint: ceed54b7
- concept: static PTQ требует небольшого неразмеченного калибровочного набора, QAT — размеченных данных и запуска обучения
  question: Чем отличаются требования к данным у static post-training quantisation и у quantisation-aware training? Объясни своими словами.
  explanation: Ключ — калибровка это не обучение. Прогоняются только прямые проходы для сбора статистики диапазонов активаций, градиенты не считаются и метки не нужны. QAT же меняет веса, а значит требует полного обучающего конвейера с разметкой.
  kind: open
  reference: 'Static PTQ нужен небольшой калибровочный набор — примеры, похожие на реальные входы, только для прямых проходов, чтобы оценить рабочие диапазоны активаций; разметка не требуется, обучение не запускается. QAT требует полноценного обучающего цикла: размеченных данных, функции потерь и обратного распространения, потому что модель дообучается с симуляцией округления внутри графа. Отсюда и разница в стоимости: PTQ — часы и десятки-сотни неразмеченных примеров, QAT — тот же ресурс, что и обычное обучение.'
  id: 034-quant-types-2
  fingerprint: b4dbb45c
- concept: 'выбор метода квантизации — эскалация по стоимости: следующий уровень оправдан только измеренной неприемлемой потерей качества'
  question: Расставь шаги подбора режима квантизации для модели зрения на устройстве в порядке возрастания затрат усилий.
  explanation: 'Для задач зрения static PTQ забирает подавляющую часть выигрыша за малую долю усилий, поэтому по умолчанию идут туда. QAT — не «лучший режим по умолчанию», а дорогой запасной путь: его оправдывает только измеренная неприемлемая потеря точности, а не общее ожидание, что будет лучше.'
  kind: order
  items:
    - Применить самый дешёвый режим квантизации, не требующий данных, и померить качество и скорость
    - Если выигрыш или качество не устраивают — собрать небольшой неразмеченный калибровочный набор и сделать static post-training quantisation
    - Замерить падение метрики после PTQ на отложенной выборке и сопоставить его с допустимым порогом
    - Только если потеря качества неприемлема — запустить quantisation-aware training с размеченными данными и полным циклом обучения
  id: 034-quant-types-3
  fingerprint: eeb80d35
