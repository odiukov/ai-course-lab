- concept: одинаковый размер весов не гарантирует одинаковую пиковую память инференса
  question: У двух моделей одинаковое число параметров и одинаковый формат весов. Почему одна из них может превысить лимит памяти устройства, а другая — нет?
  explanation: Число параметров позволяет оценить память весов, но в пиковое потребление также входят вход, выход, одновременно существующие активации, служебные буферы и рабочая память операций.
  kind: choice
  options:
    - Модели могут создавать активации разного размера и запрашивать разный объём временной рабочей памяти
    - Число параметров одной модели обязательно увеличивается после загрузки входа
    - При инференсе среда всегда создаёт полную копию всех весов только для одной из моделей
    - Одинаковое число параметров означает одинаковую пиковую память, поэтому такая ситуация невозможна
