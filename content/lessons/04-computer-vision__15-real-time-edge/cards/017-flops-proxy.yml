- concept: различие FLOPs в разы — основание для отсева кандидата, различие в проценты — нет
  question: Команда отбирает backbone по числу FLOPs на кадр, замеров на целевом устройстве пока нет. Какой вывод из счётчика FLOPs обоснован?
  explanation: FLOPs — аппаратно-независимый счётчик арифметики, он не знает, какие операции железо выполняет эффективно. Разрыв в десятки раз переживёт любую разницу в эффективности реализации, поэтому годится для отсева. Разрыв в 4% (250 против 260) легко переворачивается на реальном железе. Пересчёт FLOPs в миллисекунды по частоте игнорирует загрузку вычислителя, ожидание данных из памяти и накладные расходы на запуск ядер.
  kind: choice
  options:
    - Кандидат с 250 миллионами FLOPs гарантированно быстрее кандидата с 260 миллионами
    - Кандидат, требующий в двадцать раз больше операций, чем остальные, почти наверняка не уложится в тот же бюджет и его можно отсеять до сборки
    - Из числа FLOPs можно пересчитать время инференса в миллисекундах, зная только тактовую частоту чипа
    - Одинаковое число FLOPs означает одинаковую latency на любом устройстве
  correct: 1
  id: 017-flops-proxy-1
  fingerprint: 9ae037fa
- concept: модель с большим числом FLOPs бывает быстрее, потому что железо выполняет разные операции с разной эффективностью
  question: Две модели различаются по числу FLOPs на кадр на 15%, но более «тяжёлая» по счётчику модель на устройстве работает втрое быстрее. Объясни своими словами, как такое возможно.
  explanation: 'FLOPs — это объём работы, latency — время выполнения этой работы. Между ними стоит коэффициент эффективности, свой у каждой пары «операция + устройство»; он и растягивается в разы. Классический пример: удачно реализованные depthwise-свёртки обгоняют крупные свёртки 7×7 вопреки счёту операций.'
  kind: open
  reference: 'FLOPs считают только количество арифметических операций и молчат о том, с какой скоростью устройство их выполняет. Реальное время определяется тем, насколько операции дружественны железу: хорошо ли они распараллеливаются, есть ли под них быстрая реализация в компиляторе/рантайме, приходится ли вычислителю простаивать в ожидании данных из памяти, сколько ядер запускается. Операция, под которую есть оптимизированное ядро и высокая загрузка вычислителя, даёт больше сделанных операций в секунду, чем формально более дешёвая, но упирающаяся в пропускную способность памяти. Поэтому счётчик операций и время у станка не пропорциональны.'
  id: 017-flops-proxy-2
  fingerprint: 5825de94
- concept: фактическая пропускная способность вычислителя выводится из FLOPs и измеренной latency и показывает, насколько модель использует железо
  question: Модель выполняет 640 миллионов операций с плавающей точкой на один кадр. Честный замер на устройстве даёт latency 16 мс. Какова фактическая пропускная способность в GFLOP/s?
  explanation: '640·10⁶ / 0,016 с = 40·10⁹ операций в секунду = 40 GFLOP/s. Эта величина и есть недостающее звено между FLOPs и временем: если пиковая пропускная способность чипа, скажем, 400 GFLOP/s, модель использует 10% железа и упирается не в арифметику, а в память или запуск ядер. Сравнивать модели по FLOPs корректно только при близкой фактической пропускной способности.'
  kind: numeric
  answer: 40
  tolerance: 1
