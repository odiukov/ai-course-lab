- concept: 'имена входов и выходов образуют адресный контракт файла: рантайм связывает тензоры по именам, при этом вычисления не меняются'
  question: Зачем при экспорте в ONNX явно задавать имена входов и выходов, если на численный результат модели они не влияют? Объясни своими словами.
  explanation: Имена — часть внешнего контракта ONNX-файла наравне с формами осей и opset. Вычислений они не меняют, но именно по ним обвязка связывает свои буферы с графом, поэтому автогенерируемые имена — источник хрупкости.
  kind: open
  reference: 'Рантайм подаёт данные и забирает результат по именам тензоров графа: сессия инференса адресует буферы строковыми ключами. Без явного указания имена генерируются автоматически и могут отличаться от экспорта к экспорту, из-за чего код обвязки ломается при переэкспорте модели. Явные имена делают интерфейс файла стабильным и читаемым: сам граф вычисляет то же самое, но контракт «куда положить вход, откуда взять выход» становится предсказуемым и не зависит от внутренних деталей трассировки.'
