- concept: динамическими остаются только явно объявленные при экспорте оси, остальные размерности жёстко зашиты формой примера-образца
  question: Классификатор экспортирован в ONNX с образцом формы (N, C, 512, 512); изменяемой объявлена только ось батча. В продакшене на вход подают картинки 640×640. Что произойдёт?
  explanation: 'Экспорт трассирует граф на конкретном примере, и все оси, не перечисленные в dynamic_axes, запекаются как константы. Динамический батч не делает динамическим разрешение: пространственные оси остаются такими, какими были в образце. Нужен новый экспорт с объявлением соответствующих осей.'
  kind: choice
  options:
    - Рантайм отвергнет вход по несовпадению формы; чтобы принимать другое разрешение, нужно переэкспортировать модель, объявив оси высоты и ширины изменяемыми
    - Рантайм автоматически растянет граф под новое разрешение, потому что свёртки не зависят от размера карты
    - Модель отработает, но с потерей точности — размерности будут дополнены нулями
    - 'Хватит поднять opset до более свежей версии: свежие opset снимают ограничение на пространственные оси'
  correct: 0
