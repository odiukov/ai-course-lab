- concept: деквантование восстанавливает значение как произведение сохранённого целого на масштаб, а не исходное число
  question: 'Вес 0,72 квантовали с масштабом 0,05: целое получено округлением частного к ближайшему. Какое вещественное значение вернёт обратное преобразование?'
  explanation: '0,72 / 0,05 = 14,4, округление даёт целое 14. Обратное преобразование x̂ = q · s = 14 · 0,05 = 0,70. Исходные 0,72 не восстанавливаются: разница 0,02 — ошибка квантования, шляпка над x и означает приближение.'
  kind: numeric
  answer: 0.7
  tolerance: 0.001
  id: 031-dequant-error-1
  fingerprint: 094de467
- concept: уменьшение масштаба снижает ошибку восстановления ценой сужения представимого диапазона вещественных значений
  question: Инженер уменьшает масштаб квантования вдвое, чтобы восстановленные веса были ближе к исходным. Что он получает в довесок?
  explanation: 'Число целочисленных уровней фиксировано форматом. Масштаб задаёт цену одного уровня: мельче шаг — точнее представление типичных значений, но меньше суммарный охватываемый диапазон, и хвосты распределения весов клиппируются. Масштаб выбирают как компромисс между этими двумя потерями. Размер в памяти определяется разрядностью формата и не меняется от масштаба.'
  kind: choice
  options:
    - Уровни становятся плотнее, но диапазон вещественных значений, влезающий в целочисленный формат, сужается вдвое, и крупные веса обрезаются
    - 'Ничего: точность растёт бесплатно, диапазон целочисленного формата от масштаба не зависит'
    - Размер модели в памяти вырастает вдвое, потому что уровней стало вдвое больше
    - 'Обратное преобразование перестаёт быть однозначным: одному целому начинают соответствовать два вещественных значения'
  correct: 0
