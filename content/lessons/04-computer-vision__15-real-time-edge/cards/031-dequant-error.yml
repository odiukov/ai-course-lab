- concept: квантование — отображение многих значений в одно, поэтому оно необратимо по информации, хотя обратимо по формату
  question: Объясни своими словами, почему обратное преобразование квантованного веса принципиально не может вернуть исходное вещественное число, даже если масштаб известен точно.
  explanation: 'Ключ — необратимость самого округления, а не нехватка данных о масштабе. Отсюда и обозначение x̂: результат деквантования — оценка, ошибка которой ограничена половиной шага сетки.'
  kind: open
  reference: 'Квантование — отображение «многие в одно»: целый интервал вещественных значений шириной в один шаг округляется на общий уровень q. В памяти остаётся только номер уровня, а положение исходного числа внутри интервала не сохраняется нигде. Обратное преобразование x̂ = q · s умеет назвать лишь представителя уровня — его центр. Знание масштаба не помогает: масштаб восстанавливает границы сетки, но не утраченную информацию о том, какое из нескольких исходных значений дало этот q. Формат обратим, информация — нет.'
  id: 031-dequant-error-3
  fingerprint: 9a131589
