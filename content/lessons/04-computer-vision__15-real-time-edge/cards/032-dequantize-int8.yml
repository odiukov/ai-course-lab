- concept: выходной буфер деквантования должен быть вещественным; dtype, унаследованный от целочисленного входа, усечёт результат
  question: Функция восстановления заводит выходной массив как `out = np.empty_like(q)`, где `q` — массив квантованных целых уровней, и затем пишет туда `q * scale`. Что получится?
  explanation: Умножение целого массива на вещественный масштаб само по себе даёт вещественный результат, но запись в заранее созданный целочисленный буфер приводит его обратно к int. При масштабе 0.04 уровень 45 даст 1.8 и запишется как 1. Выход деквантования нужно создавать явно вещественным (`astype(np.float32)` на входе или `dtype=np.float32` у буфера), форма при этом остаётся прежней.
  kind: choice
  options:
    - 'Значения усекутся до целых: `empty_like` наследует целочисленный dtype входа, и вещественное произведение приводится к нему при записи'
    - 'Всё корректно: dtype результата определяется правой частью присваивания'
    - Возникнет ошибка несовпадения типов, присваивание не выполнится
    - Результат будет верным, но форма выхода потеряет последнюю ось
  correct: 0
  id: 032-dequantize-int8-2
  fingerprint: 4642b0a6
- concept: при округлении к ближайшему уровню максимальная ошибка восстановления равна половине шага квантования
  question: Равномерное квантование с округлением к ближайшему уровню, масштаб 0.04. Значение лежит внутри представимого диапазона. Какова максимальная по модулю ошибка восстановления этого значения?
  explanation: 'Соседние восстановимые значения отстоят друг от друга ровно на масштаб (шаг сетки). Округление к ближайшему уровню означает, что число не может быть дальше половины шага от него: 0.04 / 2 = 0.02. Отсюда и оценка качества круговой проверки: сравнивать восстановленный массив с исходным нужно с допуском порядка половины масштаба, а не на побитовое равенство.'
  kind: numeric
  answer: 0.02
  tolerance: 0.002
