- concept: пустой набор найденных значений — успешный результат, а error означает невозможность обработать сам запрос
  question: Агент просит сервис каталога вернуть все записи, удовлетворяющие условию отбора. Ни одна запись условию не удовлетворяет, сервис отработал штатно. Каким должен быть ответ в JSON-RPC?
  explanation: 'Запрос значения по условию завершён успешно, если получатель смог вычислить множество подходящих объектов — даже когда оно пусто. error резервируется за случаями, когда запрос вообще не удалось обработать: неизвестный метод, неразбираемые параметры, сбой. Смешение пустоты с ошибкой ломает клиенту логику повторов.'
  kind: choice
  options:
    - 'result с пустым списком: запрос обработан, подходящих значений нет'
    - 'error с кодом «ничего не найдено»: результата нет — значит ошибка'
    - 'молчание: отвечать не на что'
    - 'error с кодом «неверные параметры»: условие оказалось слишком узким'
  correct: 0
  id: 043-primary-sources-1
  fingerprint: 4add2cf1
- concept: класс перформатива определяется требуемым эффектом у получателя, а не формой вызова
  question: 'Два вызова JSON-RPC устроены одинаково: поле id, поле method, поле params с условием отбора. Один метод — `archive.search`, другой — `archive.purge`. Почему их нельзя отобразить на один и тот же перформатив ACL?'
  explanation: Одинаковый конверт вызова ничего не говорит о намерении. Запрос значения оставляет мир получателя нетронутым, удаление меняет его необратимо. Если выбранный «современный аналог» перформатива одинаково хорошо описывает и то и другое, аналог подобран слишком широко.
  kind: choice
  options:
    - Потому что один просит сообщить значения, другой требует изменить состояние получателя
    - Потому что у purge обязан быть другой формат params
    - Потому что search возвращает список, а список нельзя положить в content
    - Потому что purge не нуждается в поле id
  correct: 0
  id: 043-primary-sources-2
  fingerprint: 6ed6b411
- concept: схема на content ловит неверно собранное поручение на границе приёма, до начала исполнения
  question: 'Ты вводишь JSON-Schema для содержимого поручения (обязательные поля: имя действия и его параметры) вместо свободного естественно-языкового текста. Что эта схема даёт и чего стоит?'
  explanation: Схема переносит обнаружение поломки с этапа исполнения на этап приёма — там она дешевле всего. Но она проверяет форму, а не референт терминов, поэтому не заменяет согласования значений.
  kind: open
  reference: 'Даёт: неверно собранное поручение отклоняется на границе приёма, до того как получатель начнёт действовать; проверка машинная, одинаковая у всех клиентов; отсутствие обязательного параметра больше не восстанавливается догадкой. Стоит: схему нужно версионировать и обновлять у обеих сторон синхронно, а выразительность падает — случаи, не влезающие в схему, приходится либо расширять схему, либо выносить в свободное поле. И главное ограничение: схема подтверждает структуру и типы, но не то, что стороны понимают под именем действия и под значениями параметров одно и то же.'
  id: 043-primary-sources-3
  fingerprint: fff206a4
