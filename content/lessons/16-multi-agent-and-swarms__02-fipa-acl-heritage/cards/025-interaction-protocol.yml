- concept: валидность отдельного сообщения и валидность последовательности проверяются раздельно
  question: 'Агент получил сообщение: конверт заполнен по правилам, перформатив существует в стандарте, отправитель и получатель известны, содержимое разбирается. Но по логике взаимодействия такое сообщение сейчас прийти не могло. Что именно нарушено?'
  explanation: Формат конверта и словарь перформативов проверяют одно сообщение. Протокол взаимодействия проверяет другое — кто начинает, что допустимо следом, когда разговор закрыт. Поэтому набор безупречных сообщений в неверном порядке даёт сломанное взаимодействие.
  kind: choice
  options:
    - Синтаксис конверта — значит, сообщение надо отбросить как нечитаемое
    - 'Порядок ходов взаимодействия: сообщение допустимо само по себе, но не в текущем состоянии разговора'
    - 'Семантика перформатива: раз момент неверный, перформатив выбран неправильно'
    - 'Ничего: если поля корректны, взаимодействие корректно по определению'
  correct: 1
  id: 025-interaction-protocol-1
  fingerprint: 0949277d
- concept: 'Subscribe/Notify: поток обновлений открывается подпиской и закрывается её отменой'
  question: Расставь ходы протокола Subscribe/Notify в допустимом порядке.
  explanation: 'Издатель не рассылает уведомления до подписки и прекращает их после её завершения. Именно эта рамка отличает шину событий от произвольной рассылки inform: обновление осмысленно только внутри активной подписки.'
  kind: order
  items:
    - Подписчик отправляет издателю subscribe на интересующую тему
    - Издатель регистрирует подписку и держит её активной
    - При каждом изменении темы издатель отправляет подписчику inform
    - Подписка отменяется, и издатель перестаёт слать inform по этой теме
  id: 025-interaction-protocol-2
  fingerprint: 2acb5969
- concept: request-when — отложенное действие, привязанное к предусловию
  question: Менеджеру нужно, чтобы исполнитель выполнил действие не сейчас, а в момент, когда выполнится заданное условие. Какому протоколу FIPA это соответствует и какой у него современный аналог?
  explanation: 'Request-When кодирует «сделай X, когда наступит Y»: поручение отправлено сразу, исполнение привязано к условию. Сегодня это отложенные задачи и триггеры в надёжных workflow-движках.'
  kind: choice
  options:
    - Contract Net — аналог очереди задач с приоритетами
    - Subscribe/Notify — аналог кэша с инвалидацией
    - Request-When — аналог отложенной задачи с предусловием в workflow-движке
    - Query-Ref — аналог опроса состояния по таймеру
  correct: 2
  id: 025-interaction-protocol-3
  fingerprint: 87c3ac79
