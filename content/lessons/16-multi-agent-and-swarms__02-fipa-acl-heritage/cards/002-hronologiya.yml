- concept: 'линия наследования: теория речевых актов → KQML → FIPA-ACL → закат агентных платформ → современные протоколы'
  question: Расставь этапы развития агентной коммуникации в хронологическом порядке.
  explanation: Философия дала понятие перформативного высказывания, KQML сделал из него формат сообщения, FIPA-ACL закрыл пробелы KQML и стандартизировал набор перформативов. После заката платформ пауза длилась около четверти века, и современные протоколы вернулись к тем же вопросам с более лёгкими средствами.
  kind: order
  items:
    - 'Теория речевых актов Остина и Сёрла: высказывания рассматриваются как действия'
    - 'KQML: идея превращается в проводной протокол для программных агентов'
    - 'FIPA-ACL: эталонная стандартизация перформативов, языков содержимого и протоколов взаимодействия'
    - 'Закат агентных платформ: формализм слишком дорог, веб побеждает'
    - 'MCP, A2A и родственные спецификации: те же развилки в JSON-родном виде'
  id: 002-hronologiya-1
  fingerprint: f38bede7
- concept: связь современных протоколов с FIPA — наследование проектных решений, а не совместимость или версионное обновление
  question: В каком смысле современные агентные протоколы «происходят» от FIPA-ACL?
  explanation: 'Линии обновлений нет: ни общего комитета, ни совместимости на проводе. Есть повторение одних и тех же развилок — кто отправитель, кому адресовано, какова цель сообщения, как описано содержимое, как продолжается обмен. Совпадает архитектурный ход, а не формат.'
  kind: choice
  options:
    - 'Они совместимы с FIPA-ACL на уровне формата: сообщение FIPA можно передать современному агенту напрямую'
    - Они наследуют дерево проектных решений — те же вопросы о полях сообщения, ролях и сценариях, — но отвечают более лёгкими, JSON-родными средствами
    - Они являются официальными версиями стандарта FIPA, выпущенными тем же комитетом
  correct: 1
  id: 002-hronologiya-2
  fingerprint: e1a1be9b
