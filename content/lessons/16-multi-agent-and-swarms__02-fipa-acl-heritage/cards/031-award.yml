- concept: 'рассылка решений отделена от оценки предложений: функция награждения принимает выбор извне'
  question: Функция рассылки решений в Contract Net получает набор предложений и указание, какое из них победило. Что в её зону ответственности НЕ входит?
  explanation: Оценка предложений — отдельная стадия, её результат приходит как готовый вход. Смешав выбор и рассылку, вы теряете возможность заменить критерий отбора (цена, срок, репутация), не трогая протокольную часть, и не сможете протестировать рассылку без придуманных цен.
  kind: choice
  options:
    - сравнить цены в предложениях и определить лучшее
    - построить по одному ответному сообщению на каждое предложение
    - проставить победителю accept-proposal, остальным reject-proposal
    - унаследовать conversation-id тендера в каждом ответе
