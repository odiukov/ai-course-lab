- concept: отклонение поданного предложения кодируется reject-proposal, а не refuse или failure
  question: Менеджер отвечает участнику, чьё предложение проиграло тендер. Какой перформатив стоит в этом ответе?
  explanation: reject-proposal — отказ принять поданное предложение. refuse означал бы отказ самого исполнителя браться за поручение, а failure — что взятая работа сорвалась. Проигравший в торге ничего не обещал и ничего не провалил, поэтому единственно верный перформатив — reject-proposal.
  kind: cloze
  template: (___ :sender manager :receiver worker-k :in-reply-to bid-k ...)
  answer: reject-proposal
  accept:
    - reject-proposal
    - :reject-proposal
