  fingerprint: 300d214f
- concept: 'корреляционный идентификатор и механизм отмены — два разных требования: наличие id не даёт способа остановить начатую работу'
  question: В протоколе каждый ответ несёт id исходного запроса, но отменить уже отправленный запрос нечем. Как это проявится в продакшене?
  explanation: 'Сопоставление отвечает на вопрос «чей это ответ», отмена — на вопрос «как отозвать намерение». Первое есть, второго нет: повисшая задача снимается только рестартом, и цена растёт с числом занятых исполнителей.'
  kind: choice
  options:
    - Зависшую работу нельзя снять сообщением — исполнитель продолжает занимать ресурсы до рестарта или ручного вмешательства
    - Ответы перестанут сопоставляться с запросами
    - Получатель не сможет определить намерение отправителя
    - Протокол не сможет передавать структурированное содержимое
  correct: 0
