- concept: ответы на вопросы чек-листа фиксируются рядом со спецификацией до релиза; успешные демонстрационные запросы их не заменяют
  question: Демонстрационные запросы к новому агентному протоколу проходят успешно, ответы приходят, JSON везде валиден. Что это подтверждает относительно готовности к продакшену?
  explanation: Демо проверяет удачный путь. Чек-лист проверяет, что будет при отмене, потере связи ответа с запросом, чужом понимании термина. Незаполненная строка в таком документе предсказывает будущий инцидент точнее, чем сотня зелёных запросов, поэтому ответы пишут до релиза и хранят рядом со спецификацией.
  kind: choice
  options:
    - 'Почти ничего: удачный путь не отвечает на вопросы об отмене, интенте, языке содержимого, многошаговых сценариях и расхождении смыслов'
    - Что протокол готов, раз сквозной сценарий работает
    - Что перформативы и идентификаторы реализованы корректно
    - Что semantic drift в этой системе невозможен
