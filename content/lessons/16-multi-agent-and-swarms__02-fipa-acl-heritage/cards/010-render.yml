- concept: рендер только форматирует переданное, не принимая содержательных решений
  question: В рендер передали сообщение, где перформатив `request`, а содержимое похоже на утверждение о факте. Что должен сделать рендер?
  explanation: 'Рендер — чистое форматирование: те же значения, другая форма. Решение о намерении принимает тот, кто собирает сообщение. Если рендер начнёт править поля, структура и её текстовая форма перестанут соответствовать друг другу.'
  kind: choice
  options:
    - Напечатать `request` как есть — выбор перформатива не его ответственность
    - Заменить перформатив на `inform`, раз содержимое сообщает факт
    - 'Вернуть ошибку: перформатив не соответствует содержимому'
    - Убрать перформатив и оставить только поля
