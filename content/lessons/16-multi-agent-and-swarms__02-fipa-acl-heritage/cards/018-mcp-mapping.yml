- concept: поле id в JSON-RPC выполняет ту же работу сопоставления запроса с ответом, что идентификатор разговора в ACL
  question: 'JSON-RPC-запрос несёт поле `"id": 7`. Какому по назначению полю агентного сообщения оно соответствует?'
  explanation: Оба формата решают одну задачу — связать пришедший ответ с отправленным запросом при нескольких параллельных обменах. Синтаксис разный, протокольная работа одна.
  kind: choice
  options:
    - 'Полю получателя: id адресует вызов конкретному серверу'
    - 'Полю содержимого: id входит в полезную нагрузку вызова'
    - Идентификатору, по которому ответ сопоставляют с породившим его запросом
    - 'Полю перформатива: id задаёт тип запрашиваемого действия'
  correct: 2
  id: 018-mcp-mapping-1
  fingerprint: eb0a34f9
- concept: перевод между протоколами идёт по функциональной роли поля, а не по совпадению имён
  question: Ты переводишь вызов из одного агентного протокола в другой. С какого вопроса правильно начинать про каждое поле?
  explanation: 'Имена и синтаксис у протоколов расходятся, а набор ролей повторяется: кто, кому, какое намерение, какая нагрузка, по какому идентификатору сопоставлять. Перевод по ролям переносится между форматами, перевод по именам — нет.'
  kind: choice
  options:
    - Как это поле называется в целевом формате
    - Какую работу это поле выполняет в обмене
    - В каком порядке поля идут в спецификации
    - Какого типа значение лежит в поле
  correct: 1
  id: 018-mcp-mapping-2
  fingerprint: cb08c77c
- concept: отсутствие соответствия для поля ontology при переводе — допустимая асимметрия, а не поломка перевода
  question: При переводе вызова инструмента в агентный конверт полю онтологии не находится никакого аналога. Что это означает?
  explanation: 'Совпадают не все роли: более поздние протоколы отказались от явного объявления предметной модели и полагаются на то, что смысл аргументов задан самим инструментом. Незаполненное поле здесь фиксирует расхождение компромиссов, а не ошибку перевода.'
  kind: choice
  options:
    - Перевод неверен, нужно искать скрытое поле в вызове
    - Вызов инструмента нельзя выразить агентным сообщением
    - 'Поле можно оставить пустым: контекст выбранного инструмента уже задаёт смысл данных'
    - Вместо онтологии следует продублировать содержимое вызова
  correct: 2
  id: 018-mcp-mapping-3
  fingerprint: 72812c9c
