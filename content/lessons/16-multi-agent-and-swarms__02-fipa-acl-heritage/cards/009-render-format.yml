- concept: в записи ACL имя поля пишется с ведущим двоеточием, перформатив — без него
  question: 'Дополни запись ACL: какой знак стоит перед именем поля?'
  explanation: Двоеточие помечает именно параметры сообщения. Перформатив (`request`) идёт сразу за открывающей скобкой без двоеточия, потому что он не параметр, а действие всего сообщения. Различие знаков позволяет разобрать запись, не зная заранее списка имён полей.
  kind: cloze
  template: |-
    (request
      ___receiver agent9@node
      :content "((deliver box-3))"
    )
  answer: ':'
  accept:
    - ':'
    - двоеточие
    - colon
  id: 009-render-format-1
  fingerprint: e1e34296
- concept: кавычки удерживают содержимое как одно значение, несмотря на пробелы и вложенные скобки внутри
  question: Зачем в записи ACL значение поля content берут в кавычки?
  explanation: Содержимое вроде `((deliver box-3 to dock-2))` само состоит из пробелов и скобок — тех же знаков, что разделяют поля конверта. Кавычки очерчивают границу значения, и разбор конверта не срывается о внутреннюю структуру полезной нагрузки.
  kind: choice
  options:
    - чтобы обозначить, что содержимое зашифровано
    - чтобы пробелы и вложенные скобки внутри читались как часть одного значения, а не как новые поля
    - чтобы отличить строковые данные от чисел при подсчёте длины сообщения
    - чтобы получатель понял, на каком естественном языке написано содержимое
  correct: 1
  id: 009-render-format-2
  fingerprint: 92b39e9f
- concept: объём записи ACL определяется числом полей плюс строки перформатива и закрывающей скобки
  question: 'Сообщение содержит перформатив и 10 полей, включая content. Его печатают в канонической форме: перформатив на первой строке после открывающей скобки, каждое поле на своей строке, закрывающая скобка отдельной строкой. Сколько строк займёт запись?'
  explanation: '10 строк на поля, одна на перформатив с открывающей скобкой, одна на закрывающую: 12. Правило «одна строка — одно поле» и делает объём записи предсказуемым, а глаз находит нужное поле сканированием по вертикали.'
  kind: numeric
  answer: 12
  tolerance: 0.001
  id: 009-render-format-3
  fingerprint: fe84da46
