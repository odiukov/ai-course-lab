- concept: агентный рантайм отвечает за жизненный цикл и доставку, а не за язык сообщений
  question: Стандарт задаёт формат и смысл сообщений между агентами. Какую задачу при этом решает агентная платформа вроде JADE?
  explanation: Язык общения и среда исполнения — разные слои. Стандарт описывает, как выглядит и что значит сообщение; платформа создаёт агентов, держит их в контейнерах, передаёт письма и решает, чей фрагмент работы выполняется сейчас.
  kind: choice
  options:
    - Определяет набор допустимых перформативов и их семантику
    - Создаёт и размещает агентов, доставляет им сообщения и планирует их работу
    - Задаёт онтологию предметной области, в которой толкуется содержимое
    - Проверяет, что содержимое сообщения истинно
  correct: 1
  id: 014-platformy-1
  fingerprint: af5e0c68
- concept: 'BDI-модель: beliefs, desires, intentions как внутреннее устройство рассуждения агента'
  question: Агент считает склад заполненным на 40 процентов, хочет держать заполнение выше 80 и уже начал закупку у выбранного поставщика. Какая из этих трёх вещей — intention в BDI-модели?
  explanation: Beliefs — что агент считает верным (оценка заполнения), desires — желаемые состояния (порог 80 процентов), intentions — цель, которую агент уже выбрал и доводит до действия (начатая закупка). Разделение позволяет менять сведения, не сбрасывая выбранный план.
  kind: choice
  options:
    - Оценка заполнения в 40 процентов
    - Желание держать заполнение выше 80 процентов
    - Начатая закупка у выбранного поставщика
    - Все три одновременно, BDI их не различает
  correct: 2
  id: 014-platformy-2
  fingerprint: 3c9583df
- concept: готовые реализации многошаговых протоколов взаимодействия избавляют от ручной сборки последовательностей ACL-сообщений
  question: Платформа поставляет готовые реализации contract-net, subscribe-notify и propose-accept. Что это даёт разработчику агента?
  explanation: Библиотека протоколов взаимодействия фиксирует порядок реплик многошагового сценария — сбор предложений, выбор исполнителя, подписку на обновления. Разработчик подключает готовую роль вместо ручной сборки каждой цепочки.
  kind: choice
  options:
    - 'Не нужно вручную собирать последовательность сообщений: кто и чем отвечает на каждом шаге переговоров уже описано'
    - Сообщения перестают нуждаться в перформативах
    - Агенты получают общую онтологию предметной области
    - Содержимое сообщений начинает проверяться на истинность
  correct: 0
  id: 014-platformy-3
