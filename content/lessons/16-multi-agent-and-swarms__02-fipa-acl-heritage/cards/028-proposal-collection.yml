- concept: принадлежность ответа торгу определяется полями конверта, а не совпадением темы содержимого
  question: Менеджер ведёт два параллельных торга на похожую работу. Почему нельзя отбирать предложения по совпадению темы в содержимом сообщения?
  explanation: 'Конверт для того и отделён от полезной нагрузки: маршрутизация и связывание опираются на его поля, а не на разбор текста задачи. Два торга по одной теме различимы только по идентификаторам, а не по словам в содержимом.'
  kind: choice
  options:
    - Потому что содержимое может быть зашифровано
    - Потому что содержимое пишет участник свободным текстом, и одинаковая тема у двух разных торгов ничего не различает; принадлежность несут поля конверта
    - Потому что содержимое сообщения при передаче нормализуется и тема теряется
    - Потому что тема задачи в содержимом обязана отсутствовать по стандарту
  correct: 1
  id: 028-proposal-collection-1
  fingerprint: 9f45aa83
- concept: 'не всякий ответ в торге является предложением: отказы отсеиваются, но не считаются сбоем'
  question: В нужном разговоре, в ответ на нужное объявление, от участника пришло сообщение с перформативом refuse. Как с ним поступает сбор предложений?
  explanation: Совпадения разговора и ссылки на объявление достаточно, чтобы признать сообщение ответом на торг, но не достаточно, чтобы признать его предложением. Победитель выбирается только среди выдвинутых условий; отказ — законный ход, который просто не даёт кандидата.
  kind: choice
  options:
    - Считает его предложением с пустыми условиями и включает в список кандидатов
    - 'Останавливает торг: отказ участника делает сбор недействительным'
    - Не включает в список кандидатов — это корректный ответ, но не выдвижение условий
    - Переписывает его перформатив в propose, раз связи конверта совпали
  correct: 2
  id: 028-proposal-collection-2
  fingerprint: 54c25f42
