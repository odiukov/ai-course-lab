- concept: в JSON-RPC часть конверта переносится транспортом и сессией, а не полями сообщения
  question: В ACL-записи отправитель и получатель названы полями сообщения. В JSON-RPC-вызове инструмента таких полей обычно нет. Где тогда находятся участники?
  explanation: 'Сообщение самодостаточно у FIPA и контекстно у JSON-RPC: адресат подразумевается открытым соединением, отправитель — авторизованной сессией. Роли не исчезли, они переехали из тела в транспорт, поэтому при конвертации их приходится передавать конвертеру отдельно.'
  kind: choice
  options:
    - 'Участники в JSON-RPC не нужны: вызов ни к кому не адресован'
    - Адрес адресата задан соединением, а отправитель — сессией или аккаунтом, то есть вне тела сообщения
    - Оба участника закодированы внутри имени метода
  correct: 1
  id: 021-two-envelopes-1
  fingerprint: 44ce7c44
- concept: FIPA хранит действие и параметры одной строкой содержимого, MCP разносит их по структурным полям
  question: ACL-запись несёт содержимое одной строкой вида `(lookup stock NVDA)`. Как та же полезная нагрузка устроена в MCP-вызове инструмента?
  explanation: 'Смысловое содержание совпадает, различается степень разбора: FIPA отдаёт получателю строку, которую тот парсит по объявленному языку содержимого, MCP отдаёт уже разобранную структуру с именем инструмента и типизированными аргументами.'
  kind: choice
  options:
    - 'Разделена структурно: имя инструмента отдельным полем, параметры — словарём аргументов'
    - Той же строкой, только обёрнутой в кавычки JSON
    - Растворена в имени метода, отдельных параметров нет
  correct: 0
  id: 021-two-envelopes-2
  fingerprint: 2f9d192d
- concept: в JSON-RPC-вызове инструмента намерение кодируется значением поля method
  question: Дополни MCP-запрос так, чтобы он выражал намерение «выполни инструмент» — аналог ACL-перформатива `request`.
  explanation: 'У FIPA намерение — отдельный класс сообщения, у JSON-RPC — значение поля `method`. Место разное, работа одна: получатель понимает тип действия до разбора нагрузки в `params`.'
  kind: cloze
  template: '{"jsonrpc": "2.0", "method": "___", "params": {"name": "lookup_price", "arguments": {"symbol": "NVDA"}}, "id": 77}'
