- concept: вызов инструмента переводится в директивный перформатив request, а не в информирующий inform
  question: Конвертер переводит JSON-RPC-вызов инструмента (метод `tools/call`) в ACL-сообщение. Какой перформатив корректен и почему?
  explanation: 'Вызов инструмента — директив: отправитель не утверждает факт, а поручает выполнение. `inform` означал бы, что отправитель считает содержимое истинным, и получатель выбрал бы неверную реакцию: сохранить сведения вместо запуска инструмента.'
  kind: choice
  options:
    - '`inform` — сервер получает данные о нужном инструменте'
    - '`request` — отправитель просит адресата выполнить действие'
    - '`confirm` — вызов подтверждает доступность инструмента'
  correct: 1
  id: 019-mcp-to-acl-1
  fingerprint: 52fdbcb6
- concept: content должен нести и действие, и его параметры, иначе получатель не восстановит поручение
  question: 'При конвертации вызова инструмента в ACL программист положил в `content` только словарь аргументов `{"ticker": "MSFT"}`, а имя инструмента отбросил. Что сломается у получателя и как это исправить?'
  explanation: Перформатив кодирует класс намерения, а конкретное действие живёт в содержимом. Потеря имени инструмента — не косметика, а потеря самого поручения.
  kind: open
  reference: 'Получатель увидит параметр без действия: `MSFT` есть, а что с ним делать — неизвестно. Перформатив `request` говорит лишь «выполни», но не «что именно». Имя инструмента — часть описания действия, поэтому в `content` нужно класть и имя, и аргументы вместе, например `(lookup_price {"ticker": "MSFT"})`. Тогда содержимое остаётся самодостаточным описанием поручения.'
  id: 019-mcp-to-acl-2
  fingerprint: 8a3d9bba
- concept: неизвестный метод отклоняется явно, а не подставляется под перформатив по умолчанию
  question: На вход конвертеру приходит JSON-RPC-запрос с методом `prompts/subscribe`, для которого сопоставление не задано. Как должна повести себя функция конвертации?
  explanation: 'Молчаливый `request` выдаёт чужое намерение за поручение: получатель выполнит действие там, где его не просили. Копирование метода в перформатив ломает канонический каталог. Явный отказ оставляет ошибку видимой на границе конвертации.'
  kind: choice
  options:
    - Явно отклонить вход (ошибка), не выбирая перформатив наугад
    - Использовать `request` как безопасное значение по умолчанию
    - Скопировать строку `prompts/subscribe` в поле перформатива как есть
  correct: 0
  id: 019-mcp-to-acl-3
  fingerprint: 17df263e
