- concept: 'перформатив как явный класс намерения: получатель выбирает реакцию до разбора содержимого'
  question: Почему FIPA-ACL выносит намерение в отдельное поле с фиксированным набором значений, вместо того чтобы позволить получателю вывести его из содержимого?
  explanation: 'Одна и та же формулировка может быть донесением, запросом или распоряжением. Догадка о намерении по тексту стоит дорого: агент выполняет действие, которого не просили, или игнорирует поручение. Явный класс превращает интерпретацию в диспетчеризацию по конечному списку.'
  kind: choice
  options:
    - Потому что содержимое передаётся в двоичном виде и вообще не читается получателем
    - Потому что фиксированный набор значений позволяет получателю выбрать реакцию однозначно, без интерпретации текста и риска выполнить не отданную команду
    - Потому что имя намерения используется для маршрутизации сообщения к нужному агенту вместо адреса
