- concept: привязка к инструментам (один язык либо коммерческая лицензия) выталкивает полиглотные команды из стандарта
  question: Команда пишет три сервиса на разных языках. Одна агентная платформа существует только под один язык, другая коммерческая. Какой вывод про эти платформы это иллюстрирует?
  explanation: 'Ограничение лежит не в протоколе, а в среде исполнения: моноязычная реализация и лицензия сужают набор команд, которые вообще могут войти. Полиглотные команды обходили обе платформы и брали то, что уже стояло во всех трёх сервисах.'
  kind: choice
  options:
    - Привязка к инструментам отсекает полиглотные команды независимо от качества самого протокола
    - Протокол не поддерживает передачу содержимого между языками
    - Коммерческие платформы всегда выразительнее открытых
    - Проблема исчезает при согласовании общей онтологии
