- concept: 'хронология вытеснения ACL-транспорта веб-стеком: REST, затем JSON-RPC, затем gRPC'
  question: Расставь транспортные подходы веб-стека в том порядке, в каком они вытесняли передачу агентных сообщений.
  explanation: Сначала REST сделал HTTP и JSON общим знаменателем, затем JSON-RPC добавил вызовы методов с идентификаторами, затем gRPC — типизированные контракты и эффективный транспорт. Ни один шаг не описывал намерение агента лучше, но каждый встраивался в существующую систему дешевле.
  kind: order
  items:
    - REST поверх HTTP и JSON
    - JSON-RPC
    - gRPC
