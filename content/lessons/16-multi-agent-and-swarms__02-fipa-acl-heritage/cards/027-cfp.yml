- concept: приглашение на торг адресуется каждому участнику отдельным конвертом
  question: Менеджер рассылает объявление о торге группе участников. Почему функция возвращает список отдельных ACL-сообщений, а не одно сообщение со списком получателей в поле получателя?
  explanation: 'Отправка идёт поштучно: у каждого участника свой конверт с его именем в получателе. Дальше его ответ приходит как отдельное сообщение, и адресность сохраняется на всём торге. Содержимое при этом у всех одинаковое.'
  kind: choice
  options:
    - Потому что ACL запрещает адресовать сообщение более чем одному агенту
    - Потому что каждое приглашение — отдельный адресованный конверт, и ответ участника сопоставляется со своим приглашением
    - Потому что при одном конверте пришлось бы дублировать содержимое задачи
    - Потому что общий конверт не позволил бы задать conversation-id
  correct: 1
  id: 027-cfp-1
  fingerprint: d4450f64
- concept: все приглашения одного торга несут одинаковый маркер ожидаемого ответа
  question: 'Заполни пропуск: маркер ответа должен быть одним и тем же для всех приглашений этого торга, чтобы ответы участников опознавались как реакция именно на него.'
  explanation: 'reply_with вычисляется один раз из идентификатора разговора и не зависит от участника: приглашения различаются только получателем. Если подставить сюда имя участника или новое значение на каждой итерации, ответы перестанут указывать на общее объявление.'
  kind: cloze
  template: messages = [make_message("cfp", "manager", p, task, conversation_id=cid, reply_with=___) for p in participants]
  answer: f"{cid}-cfp"
  accept:
    - cid + "-cfp"
    - cfp_id
    - tender_id
    - cid
    - f'{cid}-cfp'
  id: 027-cfp-2
  fingerprint: afa2f824
- concept: пустой набор адресатов даёт пустой результат, а не конверт без получателя
  question: Функция сборки приглашений вызвана с пустым набором участников. Что она должна вернуть?
  explanation: Сообщения порождаются по одному на участника, значит их ровно столько, сколько адресатов. Конверт без получателя доставить некому и сопоставить с ответом нельзя — это мусор в трейсе, а не объявление.
  kind: choice
  options:
    - Пустой список сообщений
    - Одно сообщение с пустым полем получателя — торг всё равно объявлен
    - Одно сообщение, адресованное самому менеджеру
    - 'Ошибку: торг без участников недопустим'
  correct: 0
  id: 027-cfp-3
  fingerprint: 477e25e9
