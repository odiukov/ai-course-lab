- concept: 'порядок построения ответа: обмен ролей, сохранение разговора, ссылка на исходную реплику, собственная метка'
  question: Расставь шаги построения ACL-ответа на входящее сообщение.
  explanation: Роли меняются, разговор сохраняется, ссылка на реплику берётся из входящей метки, а собственная метка выдаётся заново. Содержимое и перформатив принадлежат ответу и не копируются из запроса.
  kind: order
  items:
    - Взять входящее сообщение и его поля
    - Сделать отправителем ответа прежнего получателя, а получателем — прежнего отправителя
    - Перенести conversation-id входящего сообщения без изменений
    - Записать значение входящего reply-with в поле in-reply-to ответа
    - Присвоить ответу собственный новый reply-with
    - Указать перформатив и содержимое, относящиеся к самому ответу
  id: 012-reply-to-1
  fingerprint: 2ecdf3a3
- concept: собственный reply-with ответа — новый идентификатор, а не копия входящей метки
  question: 'Ответ строится на сообщение с `reply-with: msg-31`. Каким должно быть поле reply-with самого ответа?'
  explanation: reply-with — метка, которую отправитель предлагает для ссылки на своё сообщение. Копия msg-31 означала бы, что две разные реплики просят называть себя одинаково, и следующий in-reply-to стал бы неоднозначным. Связь с запросом уже хранит in-reply-to.
  kind: choice
  options:
    - 'Новым идентификатором, например msg-52: на этот ответ тоже могут ответить'
    - Тем же msg-31, чтобы связь реплик была видна в обоих полях
    - 'Пустым: reply-with ставит только инициатор разговора'
    - Равным conversation-id, чтобы метки не расходились
  correct: 0
  id: 012-reply-to-2
  fingerprint: 6e867b08
- concept: участники ответа получаются обменом ролями входящего сообщения
  question: 'Входящее сообщение: sender — `agent4@platform`, receiver — `agent6@platform`. Какими будут участники ответа?'
  explanation: 'Отвечает тот, кто получил: прежний receiver становится sender, прежний sender — receiver. Разговор при этом тот же, поэтому conversation-id переносится без изменений.'
  kind: choice
  options:
    - sender — agent6@platform, receiver — agent4@platform
    - sender — agent4@platform, receiver — agent6@platform
    - Оба поля берутся из conversation-id разговора
    - sender — agent6@platform, receiver — agent6@platform
