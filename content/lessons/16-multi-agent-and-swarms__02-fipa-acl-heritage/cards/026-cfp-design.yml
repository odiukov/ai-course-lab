- concept: cfp открывает торг приглашением прислать предложение и никого не назначает исполнителем
  question: Менеджеру нужно поручить работу, но условия возможных исполнителей ему заранее неизвестны. Чем отправка cfp отличается от отправки request?
  explanation: 'request — директива: получателю поручено действие. cfp — приглашение к торгу: менеджер описывает работу и условия, но исполнитель ещё не выбран и обязательства перед первым ответившим нет.'
  kind: choice
  options:
    - cfp — та же директива, что и request, просто нескольким получателям сразу
    - cfp приглашает прислать предложение и никого не назначает; request уже поручает выполнить действие
    - cfp обязывает менеджера отдать работу тому, кто ответит первым
    - cfp — информирующий перформатив, он лишь сообщает о наличии работы и ответа не ждёт
  correct: 1
  id: 026-cfp-design-1
  fingerprint: c013f226
- concept: участник вправе не выдвигать предложение в ответ на cfp
  question: Участник получил cfp, оценил свои возможности и понял, что работу в заявленных условиях не потянет. Что предполагает протокол?
  explanation: cfp собирает предложения, а не согласия. Получатель оценивает выполнимость и решает, выдвигать ли условия; отказ от участия — легальный ход торга, а не сбой.
  kind: choice
  options:
    - Он обязан прислать propose с любыми условиями — иначе разговор зависнет
    - Он может ответить отказом от участия в торге; propose — право, а не обязанность
    - Он должен молча проигнорировать cfp, так как отказ на cfp не предусмотрен
    - Он обязан переслать cfp другому агенту, способному выполнить работу
  correct: 1
  id: 026-cfp-design-2
  fingerprint: 272cf5f5
- concept: Contract Net переносит выбор исполнителя из зашитого правила в рантайм-торг
  question: Какую проектную выгоду даёт Contract Net по сравнению с жёстким правилом маршрутизации «эту задачу всегда делает агент A»?
  explanation: 'Плата за Contract Net — лишние сообщения по сравнению с прямым назначением. Взамен исполнителя определяет рынок задачи в рантайме: с новыми участниками и меняющейся загрузкой правило в коде переписывать не нужно.'
  kind: choice
  options:
    - Он сокращает число сообщений на одну задачу
    - Он гарантирует, что задача будет выполнена быстрее любого фиксированного назначения
    - Он выбирает исполнителя по присланным условиям в момент выполнения, а не по правилу, зашитому в код
    - Он снимает необходимость согласовывать формат сообщений между агентами
  correct: 2
  id: 026-cfp-design-3
  fingerprint: a634a40d
