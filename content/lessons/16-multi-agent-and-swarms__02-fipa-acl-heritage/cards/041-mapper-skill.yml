- concept: проверку спецификации на переизобретение проводят до принятия протокола, пока цена миграции ещё не уплачена
  question: В какой момент отображение спецификации на FIPA-ACL приносит пользу?
  explanation: 'Смысл проверки — ответить на вопрос «это правда новое или знакомое действие в JSON-обёртке» раньше, чем команда потратит недели на переход. После миграции ответ уже ничего не меняет: издержки понесены.'
  kind: choice
  options:
    - До принятия протокола, пока миграция ещё не оплачена и решение обратимо
    - После завершения миграции, чтобы задокументировать переход
    - Во время инцидента в продакшене, как средство диагностики
    - При написании собственной спецификации, вместо проектирования
