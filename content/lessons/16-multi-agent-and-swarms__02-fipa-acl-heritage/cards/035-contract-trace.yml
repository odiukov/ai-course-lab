- concept: контекст разговора порождается инициатором и наследуется всеми последующими репликами
  question: Откуда берётся идентификатор разговора в полном обороте Contract Net?
  explanation: 'До объявления разговора не существует — его создаёт инициатор. Дальше это общий контейнер: заявки продолжают его копированием, решения закрывают. Если бы каждый заводил свой идентификатор, связать реплики можно было бы только по содержимому — то есть ненадёжно.'
  kind: choice
  options:
    - Его создаёт менеджер при объявлении торга, а участники копируют его во все свои ответы
    - Каждый участник заводит свой идентификатор, менеджер потом сопоставляет их между собой
    - Он вычисляется из содержимого задачи, поэтому одинаков у всех торгов с одной формулировкой
    - Он появляется на стадии решения, когда становится известен победитель
