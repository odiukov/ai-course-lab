- concept: число исходящих сообщений подписчика не зависит от длительности наблюдения
  question: Клиент наблюдает за темой 10 минут. При опросе он шлёт запрос каждые 5 секунд, то есть 120 запросов. Сколько сообщений отправит клиент за тот же период по протоколу Subscribe/Notify?
  explanation: Подписчик отправляет одно сообщение subscribe и замолкает. Дальше говорит только издатель, посылая inform на каждое изменение. Стоимость на стороне подписчика становится константой вместо величины, растущей с временем наблюдения.
  kind: numeric
  answer: 1
  tolerance: 0.1
  id: 034-subscribe-notify-1
  fingerprint: 5ac823ab
- concept: опрос заставляет выбирать между задержкой и лишними запросами, подписка снимает этот компромисс
  question: Команда опрашивает статус каждые 15 секунд и хочет сократить задержку до 3 секунд, не увеличивая нагрузку. Почему Subscribe/Notify решает задачу, а настройка интервала опроса — нет?
  explanation: 'Интервал опроса — единственная ручка, и она управляет обоими показателями сразу: 3 секунды вместо 15 дают пятикратный рост запросов при том же числе реальных изменений. В Subscribe/Notify число уведомлений равно числу изменений, а задержка не зависит от расписания клиента.'
  kind: choice
  options:
    - 'опрос завязывает задержку и число запросов на один параметр: улучшая одно, портишь другое; подписка убирает связь, потому что сообщение шлётся по факту изменения'
    - подписка использует более быстрый транспорт, поэтому сообщения доходят за меньшее время
    - подписка сжимает статусы и передаёт меньше байт на каждое обновление
    - при опросе сервер не знает адрес клиента и вынужден ждать запроса
  correct: 0
  id: 034-subscribe-notify-2
