- concept: Subscribe/Notify задаёт отношение между участниками, а не конкретный канал доставки
  question: Один и тот же паттерн Subscribe/Notify реализуют поверх очередей сообщений, SSE и даже периодического HTTP-опроса. Что именно роднит эти реализации?
  explanation: 'Наследство протокола — не непрерывная струя байтов и не конкретный транспорт, а разделение ролей: декларация интереса отделена во времени от публикации фактов. Открытость соединения и гарантии доставки — свойства выбранной реализации, они меняются от очереди к SSE, а паттерн остаётся тем же.'
  kind: choice
  options:
    - получатель один раз объявляет интерес, а источник публикует новые факты по мере их появления
    - соединение между участниками остаётся физически открытым всё время наблюдения
    - данные передаются непрерывным потоком без пауз между обновлениями
    - издатель гарантирует доставку каждого уведомления ровно один раз
  correct: 0
