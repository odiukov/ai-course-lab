- concept: типизированный артефакт отклоняет неверную модальность содержимого, но не проверяет ни структуру полей конверта, ни намерение отправителя
  question: Получатель ожидает табличный артефакт со сметой, а приходит изображение сцены. Что именно перехватывает проверка типизированного артефакта?
  explanation: Типизированный артефакт отвечает на вопрос «тот ли это вид материала». Правильная таблица при этом не говорит, что с ней делать — утвердить, согласовать или принять к сведению; это работа перформатива.
  kind: choice
  options:
    - 'Неверную модальность содержимого: пришёл материал не того вида, и его можно отклонить до обработки'
    - Неверное намерение отправителя
    - Расхождение в понимании термина внутри сметы
    - Отсутствие обязательного поля конверта
  correct: 0
  id: 039-mitigations-1
  fingerprint: a95b714a
- concept: структурная валидность, модальность содержимого и намерение — три независимые проверки, ни одна не подменяет остальные
  question: 'Сообщение прошло JSON Schema: все обязательные поля на месте, типы верны. Что из этого следует?'
  explanation: 'Три меры отвечают на три разных вопроса: «правильно ли собрано?» (схема), «тот ли это вид материала?» (типизированный артефакт), «какое действие совершается?» (перформатив). Аккуратно заполненная форма — не поручение.'
  kind: choice
  options:
    - Только то, что запись собрана правильно; вид содержимого и совершаемое действие остаются непроверенными
    - Что содержимое нужного вида и намерение отправителя ясно
    - Что получатель и отправитель одинаково понимают термины содержимого
    - Что сообщение можно исполнять без дополнительных проверок конверта
  correct: 0
  id: 039-mitigations-2
  fingerprint: 2cd4df99
- concept: 'явный перформатив — самая дешёвая из мер: одно поле конверта, и оно работает даже при содержимом на естественном языке'
  question: Какая из мер против неоднозначности стоит меньше всего и продолжает работать, когда содержимое сообщения — свободный текст?
  explanation: Схема требует формальной структуры содержимого, артефакты — типовой системы, онтология — согласования словаря между всеми участниками. Перформатив стоит одного поля конверта и делает интент однозначным независимо от того, что внутри content.
  kind: choice
  options:
    - Явный перформатив в конверте
    - Полная онтология предметной области
    - JSON Schema на content
    - Типизированные артефакты для всех вложений
  correct: 0
  id: 039-mitigations-3
  fingerprint: ca947c18
