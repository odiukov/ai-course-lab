- concept: потоковые события A2A наследуют subscribe/notify, но без подписки по типизированному предикату
  question: Потоковые события A2A соответствуют паре FIPA `subscribe`/`notify`. Что сохранено и что отброшено?
  explanation: 'Механика прежняя: подписчик не опрашивает источник, а получает обновления по мере появления. Утрачено условие подписки как формального предиката — теперь фильтрация событий определяется реализацией, а не логическим выражением с проверяемой семантикой.'
  kind: choice
  options:
    - Сохранён асинхронный push обновлений, отброшена подписка на строго типизированный логический предикат
    - Сохранена подписка по предикату, отброшена асинхронность доставки
    - Сохранён опрос источника подписчиком, отброшены сами уведомления
  correct: 0
  id: 023-spec-family-1
  fingerprint: 47fd434b
- concept: общий контекст CA-MCP повторяет доску объявлений, но не гарантирует логическую согласованность записей
  question: Общий контекст, куда пишут сразу несколько агентов (CA-MCP), восходит к архитектуре доски объявлений (blackboard). Что именно из старой конструкции не перенесли?
  explanation: Сама общая память с несколькими писателями сохранилась — это рабочий структурный примитив. Исчезла модель, которая отвечала за непротиворечивость содержимого, поэтому в общем контексте могут одновременно лежать взаимоисключающие утверждения.
  kind: choice
  options:
    - Возможность нескольким участникам писать в одну память
    - Модель логической согласованности записей
    - Чтение общей памяти другими агентами
  correct: 1
  id: 023-spec-family-2
  fingerprint: 4a167328
- concept: чтение ресурса в MCP соответствует запросу значения выражения, а не запросу выполнения действия
  question: Какому перформативу FIPA ближе всего MCP-операция `resources/read`?
  explanation: 'Чтение ресурса просит вернуть значение, а не изменить состояние мира: это запрос ссылки, а не поручение. Явное намерение и идентификатор для сопоставления сохранены, формальная семантика — нет.'
  kind: choice
  options:
    - '`request` — она поручает адресату выполнить действие'
    - '`inform` — она сообщает содержимое ресурса'
    - '`query-ref` — она запрашивает значение по ссылке'
  correct: 2
  id: 023-spec-family-3
  fingerprint: 11da1da9
