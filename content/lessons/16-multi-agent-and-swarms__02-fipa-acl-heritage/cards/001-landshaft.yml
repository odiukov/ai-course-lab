- concept: практическая польза изучения устаревшего стандарта — распознавание переизобретений и предсказание режимов отказа
  question: Зачем инженеру, выбирающему современный агентный протокол, разбираться в устаревшем стандарте вроде FIPA-ACL? Назови две конкретные выгоды.
  explanation: 'История здесь — журнал предыдущего эксперимента, а не музей дат. Оценка протокола только по сегодняшним возможностям пропускает уже известные последствия тех же проектных развилок: насколько строго описывать смысл данных, кто подтверждает результат, где хранить состояние долгой задачи.'
  kind: open
  reference: 'Во-первых, видно, какие «инновации» новых спецификаций на самом деле переизобретение старых решений: вызов инструмента, жизненный цикл задачи, общее хранилище контекста — это более мягкие, JSON-родные версии решений FIPA. Во-вторых, известны режимы отказа: старый стандарт уже прошёл путь до перегрузки формализмом, поэтому можно заранее сказать, какие проблемы новая спецификация откроет для себя заново, когда начнёт добавлять недостающие примитивы.'
