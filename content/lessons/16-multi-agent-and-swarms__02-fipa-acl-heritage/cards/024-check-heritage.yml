- concept: 'общий паттерн наследования: структурный примитив сохраняют, формализм отбрасывают'
  question: Просматривая соответствия современных агентных спецификаций старым речевым актам, замечают повторяющийся паттерн в том, что именно отбрасывается. Сформулируй этот паттерн и приведи два примера.
  explanation: Одна и та же колонка потерь почти в каждой строке соответствий — это и есть признак системного выбора, а не набора частных решений.
  kind: open
  reference: 'Паттерн: сохраняют структурный примитив (явное намерение, идентификатор для сопоставления, переходы состояний задачи, асинхронный push, общая память нескольких писателей), а отбрасывают формальную часть — семантику, онтологию, гарантии полноты сценария, модель согласованности, схему. Примеры: вызов инструмента сохраняет явный интент и идентификатор, но теряет формальную семантику и онтологию; общий контекст сохраняет доску объявлений, но теряет модель логической согласованности. Закономерность системная, а не случайная: строгость обходится дорого, а каркас окупается сразу.'
  id: 024-check-heritage-2
  fingerprint: 7dae5fc0
- concept: 'отброшенный формализм не исчезает бесследно: разрешение неоднозначности перекладывают на модель'
  question: Современные спецификации отказались от формальной семантики и схем содержимого. Кто в такой архитектуре разрешает возникающую неоднозначность?
  explanation: 'Неоднозначность никуда не делась, сменился её обработчик: раньше её снимала формальная семантика и согласованная онтология, теперь — модель, читающая содержимое. Отсюда и риск: интерпретация вероятностная, а не доказуемая.'
  kind: choice
  options:
    - 'Транспортный уровень: HTTP и WebSocket проверяют смысл сообщения'
    - 'Никто: без формализма неоднозначность не возникает'
    - LLM на стороне получателя — она интерпретирует содержимое и намерение
  correct: 2
