- concept: 'semantic drift: стороны вкладывают разный смысл в общий термин, обработка проходит без ошибок, расхождение видно только по последствиям действия'
  question: Страховой агент-отправитель называет полем policy_holder плательщика взноса, агент-получатель — застрахованное лицо. Оба сообщения обработаны без единой ошибки. Чем такой сбой отличается от обычной ошибки формата?
  explanation: 'Semantic drift — молчаливый режим отказа: слово одно, понятия разные. Валидация проходит, перформатив разобран, действие выполнено — просто не то. Ошибка проявляется в мире (выплата ушла не тому), а не в канале.'
  kind: choice
  options:
    - Ни один участник не сообщает об ошибке; расхождение обнаруживается только по неверному результату действия
    - Получатель немедленно возвращает not-understood
    - Отправитель получает failure от рантайма доставки
    - Сообщение не доходит до получателя
  correct: 0
  id: 038-semantic-drift-1
  fingerprint: ae531815
- concept: обязательная онтология переводит молчаливое расхождение смысла в явный отказ на этапе разбора сообщения
  question: Почему FIPA-ACL с обязательным полем ontology не пропустил бы сообщение с расходящимся понятием «клиент»?
  explanation: 'Ценность онтологии тут не в переводе, а в отказе: понятия и их связи описаны машинно, поэтому неизвестный или неоднозначный термин не проходит разбор. Молчаливая ошибка становится громкой. Плата за это — стоимость согласования словаря между всеми участниками.'
  kind: choice
  options:
    - Термин, не входящий в согласованный словарь или трактуемый двояко, отклоняется при разборе — до того, как получатель что-то сделает
    - Онтология переводит термин в понятие получателя автоматически
    - Онтология запрещает естественно-языковое содержимое как таковое
    - Онтология гарантирует доставку сообщения нужному агенту
  correct: 0
  id: 038-semantic-drift-2
  fingerprint: 7b28fe37
- concept: перформатив фиксирует намерение сообщения, но не значения терминов внутри content — это ортогональные уровни
  question: Объясни своими словами, почему явный перформатив в конверте не устраняет semantic drift.
  explanation: 'Частая путаница: раз интент однозначен, значит сообщение однозначно. Нет — однозначен только класс действия. Референт термина в содержимом остаётся на догадках сторон.'
  kind: open
  reference: 'Перформатив отвечает на вопрос «что агент делает этим сообщением»: сообщает факт, просит выполнить действие, предлагает сделку. Он однозначно задаёт ожидаемую реакцию получателя. Но смысл слов внутри content он не определяет: request остаётся request, даже если отправитель и получатель понимают под «клиентом» разные сущности. Намерение и значение терминов — два независимых уровня; перформатив закрывает первый и ничего не говорит о втором. Против дрейфа значений работает согласованный словарь (онтология) либо явное определение термина в спецификации.'
  id: 038-semantic-drift-3
  fingerprint: 5aeff001
