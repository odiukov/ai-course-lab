- concept: 'подбор протокола взаимодействия под задачу: поток обновлений покрывается подпиской, а не торгом и не отложенным действием'
  question: Десять агентов должны получать новое значение курса валют каждый раз, когда оно меняется, и переставать его получать по своему решению. Какой протокол взаимодействия подходит?
  explanation: 'Здесь нет ни выбора исполнителя (Contract Net), ни одноразового действия по наступлению условия (Request-When). Нужен поток обновлений по теме с явным началом и концом — это Subscribe/Notify. Ошибка выбора протокола обычно вылезает позже: торг там, где нужна подписка, заставляет заново объявлять тендер на каждое обновление.'
  kind: choice
  options:
    - Subscribe/Notify
    - Contract Net Protocol
    - Request-When
    - Одиночный request с ответом inform
  correct: 0
