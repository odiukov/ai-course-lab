- concept: query-if спрашивает истинность утверждения, query-ref — значение выражения
  question: Агент хочет узнать, какой именно склад назначен заказу. Какой перформатив подходит?
  explanation: query-if отвечает на «истинно ли P?» — например, «назначен ли склад вообще?». query-ref отвечает на «каково значение X?» и возвращает конкретный склад. subscribe запускает поток будущих уведомлений, а не разовый ответ.
  kind: choice
  options:
    - query-if — вопрос об истинности утверждения, ответ «да» или «нет»
    - query-ref — запрос значения, ответом будет сам объект или величина
    - subscribe — запрос на уведомления при изменении назначения
  correct: 1
  id: 006-katalog-1
  fingerprint: 16abb461
- concept: agree отвечает на поручение, accept-proposal — на предложение
  question: Подрядчик прислал предложение выполнить работу за указанную цену. Заказчик хочет это предложение принять. Какой перформатив он использует и почему не agree?
  explanation: 'Эти перформативы лежат в разных ветках. agree — ответ исполнителя на request: «согласен сделать X». accept-proposal — ответ заказчика в переговорной ветке: «принимаю твоё предложение». confirm вообще из информационной ветки и подтверждает истинность утверждения, а не сделку.'
  kind: choice
  options:
    - agree — потому что заказчик соглашается с содержанием сообщения
    - accept-proposal — потому что принимается выдвинутое предложение, тогда как agree означает согласие исполнителя взяться за порученную ему работу
    - confirm — потому что заказчик подтверждает истинность условий сделки
  correct: 1
  id: 006-katalog-2
  fingerprint: 86e817aa
- concept: 'переговорный маршрут перформативов: сбор предложений, выдвижение, принятие, отчёт о результате'
  question: Расставь перформативы FIPA-ACL в порядке типового переговорного обмена, где заказчик ищет исполнителя работы, выбирает его и получает результат.
  explanation: 'Это скелет contract-net: объявление, отклики, выбор, отчёт. Проигравшим участникам заказчик шлёт reject-proposal, а если исполнитель взялся и не справился, вместо inform придёт failure. Знание маршрута важнее заучивания списка: по перформативу видно, какой ход ожидается следующим.'
  kind: order
  items:
    - cfp — заказчик объявляет сбор предложений по задаче
    - propose — участник выдвигает своё предложение
    - accept-proposal — заказчик принимает одно из предложений
    - inform — выбранный исполнитель сообщает о результате работы
  id: 006-katalog-3
  fingerprint: 5c61dd40
