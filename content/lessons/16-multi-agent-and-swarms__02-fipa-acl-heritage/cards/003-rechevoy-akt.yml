- concept: 'структура сообщения агента: перформатив (действие) отдельно от содержимого (о чём действие)'
  question: KQML и вслед за ним FIPA-ACL строят сообщение агента из двух различимых частей. Каких?
  explanation: 'Адреса и метаданные тоже есть, но ключевое разделение другое: содержимое отвечает на вопрос «о чём речь», перформатив — на вопрос «что отправитель делает этой репликой». Одно и то же содержимое под разными перформативами требует от получателя разных действий, поэтому намерение нельзя прятать внутри текста.'
  kind: choice
  options:
    - Адрес отправителя и адрес получателя
    - Перформатив — совершаемое отправителем действие — и содержимое, к которому это действие относится
    - Заголовок с временем отправки и тело с текстом на естественном языке
  correct: 1
  id: 003-rechevoy-akt-1
  fingerprint: 5584dcf9
- concept: 'категории речевых актов по Сёрлу: обязательство говорящего — commissive'
  question: Сёрл разделил речевые акты на assertive, directive, commissive, expressive и declarative. К какой категории относится высказывание «Обязуюсь пересчитать остатки к утру»?
  explanation: 'Commissive связывает обязательством самого отправителя, directive — адресата, assertive лишь сообщает о мире. В агентном протоколе это разные ветки: обещание исполнителя и поручение исполнителю запускают разные ожидания у обеих сторон.'
  kind: choice
  options:
    - Assertive — говорящий описывает положение дел
    - Directive — говорящий побуждает собеседника действовать
    - Commissive — говорящий берёт обязательство действовать сам
  correct: 2
  id: 003-rechevoy-akt-2
  fingerprint: ae7fc50e
