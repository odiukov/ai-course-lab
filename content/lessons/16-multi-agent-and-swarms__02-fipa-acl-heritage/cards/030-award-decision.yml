- concept: 'объём полного оборота Contract Net на N участников: N приглашений, N предложений, одно принятие, N−1 отклонений'
  question: Менеджер объявляет тендер шести участникам, каждый присылает предложение, и менеджер выбирает одного исполнителя. Сколько всего сообщений пройдёт по протоколу от объявления до полной развязки?
  explanation: '6 приглашений cfp + 6 ответов propose + 1 accept-proposal победителю + 5 reject-proposal остальным = 18. Стоимость протокола растёт линейно по числу участников: каждое предложение требует собственного ответа, поэтому «дешёвого» закрытия тендера одним сообщением не бывает.'
  kind: numeric
  answer: 18
  tolerance: 0.5
  id: 030-award-decision-1
  fingerprint: d92a5d80
- concept: тендер закрывается доставленным решением каждому участнику, а не выбором на стороне менеджера
  question: Менеджер выбрал исполнителя и отправил ему accept-proposal, а остальным не отправил ничего. В каком состоянии окажутся участники, чьи предложения не приняли?
  explanation: 'У проигравших нет источника информации о решении: они не видят чужих конвертов и не получают от протокола таймаута со смыслом «отклонено». Отсутствие reject-proposal оставляет их предложение висящим, а зарезервированное время — заблокированным. Развязка тендера — это доставленные сообщения, а не решение, принятое в голове менеджера.'
  kind: choice
  options:
    - Останутся в ожидании ответа и продолжат резервировать ресурсы под возможное поручение
    - Автоматически перейдут в состояние отказа, потому что молчание менеджера равно отклонению
    - Смогут вывести отклонение из того, что победитель начал работу, и освободить ресурсы
    - Повторно пришлют propose, поскольку протокол требует переотправки при отсутствии ответа
  correct: 0
  id: 030-award-decision-2
  fingerprint: ffc7dcb9
- concept: решение адресуется конкретному предложению, а не тендеру в целом
  question: Почему менеджер отправляет отдельный accept-proposal и отдельные reject-proposal, привязанные к конкретным предложениям, вместо одного широковещательного сообщения «исполнитель выбран»?
  explanation: 'Адресность решения даёт каждому участнику однозначный следующий шаг: победитель приступает к работе, остальные освобождают ресурсы. Общее объявление сообщает только факт выбора и оставляет разбор на догадки получателя.'
  kind: open
  reference: Объявление «исполнитель выбран» описывает разговор, а решение относится к отдельному предложению. Каждый ответ сохраняет conversation-id тендера и через in-reply-to указывает на конкретное сообщение участника, поэтому агент читает вердикт по своим условиям напрямую, без вывода по косвенным признакам. При этом участник может держать несколько предложений в разных тендерах или отвечать на несколько объявлений в одном разговоре — широковещательное сообщение не позволило бы понять, какое именно предложение принято или отклонено, и участник остался бы в неопределённости даже после доставки.
  id: 030-award-decision-3
  fingerprint: a304b194
