- concept: современные спецификации меняют доказуемый смысл на низкий порог подключения
  question: Как точнее всего описать сделку между FIPA-ACL и современными агентными спецификациями?
  explanation: Уходят формальная семантика, канонический каталог перформативов и проверенные паттерны взаимодействия. Приходят JSON-нагрузки, содержимое на естественном языке, веб-транспорт и обнаружение возможностей. Это не улучшение по всем осям, а обмен строгости на дешёвый вход.
  kind: choice
  options:
    - Современные спецификации выражают намерения точнее, поэтому формальная семантика стала не нужна
    - Более расслабленная семантика намерения обменяна на простоту реализации и подключения
    - 'Обе стороны эквивалентны: различается только запись, компромисса нет'
  correct: 1
  id: 022-tradeoff-1
  fingerprint: 8a37eb59
- concept: без канонического каталога перформативов смысл слова вроде cancel заново определяет каждая команда
  question: Два агента разных вендоров обмениваются сообщением `cancel`. Почему в современном JSON-протоколе это слово опаснее, чем перформатив из каталога FIPA?
  explanation: Пропадает не слово, а общий источник его смысла. Каждая интеграция заново договаривается об отмене, подписке и согласовании предложений — там, где раньше существовал готовый паттерн с известными свойствами.
  kind: open
  reference: У FIPA перформатив входил в канонический каталог, и его смысл был привязан к формальным условиям — что именно отменяется и в каком состоянии оказываются стороны. В JSON-протоколе значение поля задаётся документацией конкретной спецификации и кодом конкретной команды, поэтому один вендор может понимать `cancel` как отмену одной операции, другой — как снятие всей задачи, третий — как отказ ждать ответ. Расхождение вскроется не при парсинге (сообщение валидно), а в поведении систем.
  id: 022-tradeoff-2
  fingerprint: 341fe7c9
- concept: самоописывающийся документ возможностей заменяет предварительное согласование словаря
  question: Агент публикует список своих возможностей машиночитаемым JSON-документом (`listTools`, Agent Card). Что это меняет по сравнению с подходом FIPA?
  explanation: 'Онтологию нельзя было изменить в одностороннем порядке — её согласовывали до первого полезного обмена. Самоописывающийся документ переносит этот шаг в рантайм: скачал JSON и работаешь. Гарантий смысла он не даёт — только перечень возможностей.'
  kind: choice
  options:
    - Возможности выясняются во время подключения, вместо предварительного согласования общего словаря понятий
    - 'Документ заменяет транспорт: сообщения больше не нужны'
    - Документ даёт формальные гарантии смысла каждого поля
  correct: 0
  id: 022-tradeoff-3
  fingerprint: b2566b1f
