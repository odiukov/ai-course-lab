- concept: предусловие — состояние мира, а не истечение интервала времени
  question: Чем отложенное действие с предусловием («сделай X, когда истинно Y») принципиально отличается от запроса с задержкой («сделай X через час»)?
  explanation: Таймер гарантированно истекает, предикат — нет. Поэтому реализация отложенного действия обязана следить за состоянием (опрос, событие, сигнал), а не заводить будильник, и обязана корректно жить в состоянии «условие всё ещё ложно».
  kind: choice
  options:
    - Условие может не наступить никогда, поэтому срабатывание не привязано к течению времени и требует наблюдения за состоянием
    - Задержка задаётся в секундах, а условие — в миллисекундах, точность выше
    - Условие проверяется отправителем, а задержка — получателем
    - Отложенное действие всегда выполняется хотя бы раз, а запрос с задержкой может быть пропущен
  correct: 0
  id: 033-request-when-1
  fingerprint: ace0252d
- concept: 'ожидающее предусловие — не отказ: pending отличается от failure и refuse'
  question: Агент принял поручение «включи насос, когда давление упадёт ниже порога». Прошли сутки, давление не падало. Какой статус у поручения?
  explanation: 'Failure означает, что попытка выполнения была и не удалась; refuse — что агент не берётся за задачу. Здесь агент обязательство принял, попытки ещё не было. Смешивать «ждёт» с «провалилось» опасно: отправитель начнёт перепосылать поручение и получит дублирующие срабатывания.'
  kind: choice
  options:
    - 'Отложено: обязательство принято и остаётся активным, пока условие ложно'
    - 'Провалено (failure): действие так и не выполнено'
    - 'Отклонено (refuse): агент не смог выполнить поручение'
    - 'Не понято (not-understood): условие не удалось вычислить'
  correct: 0
  id: 033-request-when-2
  fingerprint: 0de33974
- concept: отложенное действие переносит наблюдение за условием на исполнителя
  question: Что даёт отложенное действие с предусловием по сравнению с тем, чтобы отправитель сам опрашивал состояние и слал обычный запрос в нужный момент?
  explanation: При опросе на стороне отправителя окно срабатывания теряется вместе с процессом отправителя, а частота опроса задаёт и задержку, и лишний трафик. Отложенная задача хранится у исполнителя вместе с действием, условием и привязкой к разговору — и остаётся живой после перезапуска.
  kind: choice
  options:
    - Обязанность следить за условием и хранить намерение переходит к исполнителю, поэтому срабатывание переживает паузы и перезапуски на стороне отправителя
    - Сообщение становится короче, потому что условие не передаётся по сети
    - Исполнитель получает право менять действие X, если условие Y изменилось
    - Отправитель гарантированно узнаёт момент срабатывания без дополнительного сообщения
  correct: 0
  id: 033-request-when-3
  fingerprint: 90de3f58
