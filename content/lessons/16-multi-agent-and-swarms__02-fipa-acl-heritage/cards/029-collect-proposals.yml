- concept: сбор предложений — конъюнкция трёх независимых условий, отказ по любому из них отбрасывает конверт
  question: Менеджер собирает предложения на конкретный cfp. Во входящей очереди 12 сообщений. Из них 7 имеют performative propose; из этих 7 у 4 совпадает conversation-id текущего тендера; из этих 4 у 2 поле in-reply-to равно reply-with нужного cfp. Сколько сообщений попадёт в результат сбора?
  explanation: 'Условия применяются одновременно, а не по отдельности: конверт проходит, только если совпали перформатив, разговор и ссылка на исходное объявление. Значит результат — самое узкое множество, 2 сообщения. Отбор по одному перформативу дал бы 7, отбор по перформативу и разговору — 4, и в обоих случаях в стопку попали бы чужие предложения.'
  kind: numeric
  answer: 2
  tolerance: 0.5
  id: 029-collect-proposals-1
  fingerprint: f917b80c
- concept: 'сбор предложений — чистая фильтрация: подмножество в исходном порядке, без правки конвертов'
  question: Функция сбора предложений в Contract Net получает список входящих сообщений. Что она обязана делать с содержимым конвертов?
  explanation: 'Сбор — это фильтр, а не обработчик. Сортировка — задача выбора победителя, восстановление in-reply-to — подделка связи, которой в сообщении не было, а перекраска refuse в propose создаёт предложение, которого участник не делал. Всё это ломает единственную гарантию фильтра: на выходе лежат ровно те конверты, что реально пришли.'
  kind: choice
  options:
    - 'Ничего: вернуть подходящие сообщения без изменений и в том порядке, в каком они пришли'
    - Отсортировать предложения по выгодности условий, чтобы менеджер сразу видел лучшее
    - Дописать недостающий in-reply-to тем сообщениям, у которых он пуст, взяв его из conversation-id
    - Преобразовать refuse в propose с нулевыми условиями, чтобы каждый участник был учтён
  correct: 0
