- concept: круговая конвертация проверяет сохранение протокольных примитивов, а не совпадение синтаксиса
  question: 'Сообщение перевели из JSON-формы в ACL и обратно. Восстановленный текст побайтово не совпал с исходным: другой порядок ключей и другие пробелы. Что это означает?'
  explanation: 'Два синтаксиса неизбежно выглядят по-разному. Круг замыкается, если совпали роли и значения: отправитель, получатель, намерение, содержимое, привязка к разговору и к реплике. Побайтовое равенство — более сильное и ненужное требование.'
  kind: choice
  options:
    - 'Проверка провалена: круговая конвертация требует идентичного текста'
    - Проверка ничего не показывает, пока формы записи различаются
    - 'Проверка может быть пройдена: сравниваются значения полей конверта, а не написание'
  correct: 2
  id: 020-round-trip-1
  fingerprint: 9c87a8cb
- concept: круговая конвертация подтверждает только те поля и типы сообщений, которые реально прошли круг
  question: Транслятор отбрасывает поле `ontology` ещё на входе, а тест круговой конвертации сравнивает исходник с результатом только по тем полям, что остались. Тест зелёный. Какой вывод из него можно делать, а какой нельзя?
  explanation: 'Границы теста задаются его входом: круг подтверждает сохранность внутри круга. Зелёный результат при усечённом сравнении — свидетельство о подмножестве, а не о трансляторе целиком.'
  kind: open
  reference: 'Можно: для сравниваемых полей и для проверенных типов сообщений представление меняется, а устройство взаимодействия сохраняется. Нельзя: заключать, что перевод не теряет информации вообще. Отброшенное до сравнения поле в проверку не попало, поэтому о нём результат молчит. То же с типами сообщений — если в наборе не было, скажем, отказа или переговорного шага, их сохранность не подтверждена.'
  id: 020-round-trip-2
  fingerprint: 8cffd157
- concept: один успешный оборот может быть частным случаем, набор разных сообщений усиливает вывод
  question: Транслятор успешно прогоняет через круговую конвертацию одно сообщение. Почему в демо прогоняют целый набор разных сообщений?
  explanation: Одно сообщение может задействовать только удобные поля — например, обойтись без ссылки на реплику или без переговорного перформатива. Набор разнотипных сообщений покрывает больше полей и намерений, поэтому свидетельство сильнее.
  kind: choice
  options:
    - Чтобы измерить скорость конвертации на объёме
    - Чтобы единственный удачный случай не сошёл за общее свойство транслятора
    - Чтобы синтаксис ACL стал ближе к JSON
  correct: 1
