- concept: онтология — машинное описание сущностей и их отношений, необходимое для разбора content
  question: Зачем формат обмена агентными сообщениями вообще требовал согласованной онтологии, если конверт уже указывает отправителя, получателя и перформатив?
  explanation: 'Конверт решает доставку и намерение, но полезная нагрузка состоит из терминов предметной области. Без общего описания сущностей и отношений получатель разберёт синтаксис, но не сможет действовать: одна и та же величина у разных участников значит разное.'
  kind: choice
  options:
    - Онтология шифрует содержимое от посторонних агентов
    - Без неё нельзя доставить сообщение по адресу
    - 'Конверт не говорит, что значат термины внутри content: получатель должен знать, какие сущности существуют и как связаны'
    - Онтология заменяет перформатив, когда намерение неочевидно
  correct: 2
  id: 015-ontology-cost-1
  fingerprint: 8f003348
- concept: стоимость согласования онтологии растёт с числом участников, потому что изменение нельзя внести в одностороннем порядке
  question: Почему обязательная общая онтология дёшева для пары агентов и разорительна для десятков компаний?
  explanation: 'Онтология — общий контракт. Односторонне добавить понятие нельзя: у остальных агентов старая модель. Поэтому каждое новое понятие тянет обсуждение, версионирование и обновление программ у всех участников, и цена растёт вместе с числом сторон.'
  kind: choice
  options:
    - Большие онтологии требуют больше памяти при разборе сообщений
    - Любое изменение модели требует согласия всех сторон, иначе остальные перестают понимать сообщения
    - Крупные компании отказываются публиковать свои сообщения
    - Число полей конверта растёт вместе с числом участников
  correct: 1
  id: 015-ontology-cost-2
  fingerprint: '36971768'
- concept: цена онтологии — это входной барьер, оплачиваемый до первого полезного обмена
  question: Объясни своими словами, почему требование общей онтологии считают барьером входа, а не издержкой эксплуатации.
  explanation: 'Ключ в моменте оплаты: расходы возникают до первой пользы, а не пропорционально объёму работы. Это и делает точный смысл дорогим билетом.'
  kind: open
  reference: 'Согласовать онтологию нужно до того, как агенты обменяются первым полезным сообщением: пока стороны не договорились о значении терминов, содержимое не разбирается и работать нечему. Значит, весь труд по стандартизации оплачивается авансом, без результата на руках. Альтернативные стеки со свободным содержимым позволяют начать обмен сразу и уточнять смысл по ходу, поэтому выигрывают по скорости выхода на работающую интеграцию.'
  id: 015-ontology-cost-3
  fingerprint: f506718e
