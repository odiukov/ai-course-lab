- concept: сборка сообщения возвращает структуру с раздельными полями, а не готовый текст
  question: Функция собирает ACL-сообщение из аргументов. Почему ей стоит вернуть структуру с отдельными полями, а не сразу готовую текстовую запись?
  explanation: Сборка и представление — разные ответственности. Пока сообщение живёт как структура, можно взять из него conversation-id, подменить получателя, сравнить поля. Из строки всё это придётся выпиливать разбором.
  kind: choice
  options:
    - Отдельные поля можно читать, менять и передавать дальше; текстовое представление получают из структуры отдельным шагом
    - Текстовая запись занимает больше памяти, чем структура
    - ACL запрещает создавать текст сообщения внутри приложения
    - Структура автоматически проверяет корректность онтологии
  correct: 0
  id: 008-make-message-1
  fingerprint: 27ab5618
- concept: content переносится в сообщение без разбора и изменения
  question: В сборщик сообщения передают содержимое `((temp Kyiv 21))`. Что с ним должна сделать функция?
  explanation: Содержимое интерпретирует получатель по указанным language и ontology, а не транспортный слой. Сборщик отвечает за конверт; любая правка content на этом уровне ломает договорённость о языке содержимого.
  kind: choice
  options:
    - Положить в поле content без изменений
    - Разобрать на предикат и аргументы и сохранить их отдельными полями
    - Убрать внешние скобки, они дублируют структуру сообщения
    - Перевести в JSON, чтобы поле было машиночитаемым
  correct: 0
  id: 008-make-message-2
  fingerprint: 36b9668c
- concept: имена полей ACL сохраняются с дефисами, включая идентификатор разговора
  question: Заполни ключ структуры сообщения так, чтобы имя поля совпадало с именем в ACL.
  explanation: В ACL поле называется conversation-id — с дефисом. Питоновское имя переменной может быть каким угодно, но ключ структуры и строка вывода обязаны совпадать с именем стандарта, иначе получатель поля не найдёт.
  kind: cloze
  template: 'msg = {"performative": performative, "sender": sender, "___": conversation_id}'
  answer: conversation-id
  accept:
    - conversation-id
  id: 008-make-message-3
  fingerprint: 229809b3
