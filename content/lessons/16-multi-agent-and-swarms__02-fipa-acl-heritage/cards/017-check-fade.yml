- concept: исчезновение реализации не опровергает идею, которую эта реализация несла
  question: Объясни своими словами, почему из факта «стандарт агентных сообщений вышел из употребления» не следует «явное указание намерения в сообщении бесполезно».
  explanation: Логическая ошибка тут — приписывание причины отказа не тому компоненту. Отказ от дорогого комплекта совместим с сохранением его дешёвых полезных частей.
  kind: open
  reference: 'Стандарт был комплектом: идея явных намерений и связанных реплик плюс обязательная онтология, формальная семантика и привязка к конкретным платформам. Рынок отверг комплект целиком, но причины назывались стоимостные — согласование, лицензии, отсутствие полиглотных реализаций. Идея явного намерения при этом ничего не стоила и продолжает переизобретаться в более дешёвых стеках. Смерть носителя не является опровержением того, что носитель нёс.'
  id: 017-check-fade-2
  fingerprint: 1925656a
