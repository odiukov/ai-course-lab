- concept: поле content несёт полезную нагрузку, остальные поля ACL — служебный конверт
  question: В записи ACL-сообщения перечислены sender, receiver, content, language, ontology, protocol, conversation-id, reply-with. Какая часть из них несёт собственно данные, ради которых сообщение отправлено?
  explanation: 'Служебных полей заметно больше, чем полезных: адреса, язык, онтология, протокол и идентификаторы обслуживают доставку и разбор, а сами данные лежат только в content. Как на конверте письма: марка и индекс занимают больше места, чем текст внутри, но без них письмо не дойдёт.'
  kind: choice
  options:
    - Только content, остальные поля описывают доставку и трактовку
    - content и ontology, потому что оба относятся к предметной области
    - content и protocol, потому что оба определяют смысл данных
    - Все поля равнозначны, деления на нагрузку и конверт нет
  correct: 0
  id: 013-check-envelope-1
  fingerprint: '31254595'
- concept: поле language объявляет синтаксис содержимого, а ontology — предметный словарь его терминов
  question: Объясни своими словами, зачем в ACL-сообщении держать одновременно поле language и поле ontology, если содержимое всё равно одно.
  explanation: Разделение повторяет разницу между «как это прочитать» и «о чём это». Получатель сначала применяет правила языка, затем подставляет значения терминов из онтологии.
  kind: open
  reference: 'language говорит, по каким правилам разбирать строку содержимого — на каком формальном языке она записана. ontology говорит, в каком предметном словаре толковать разобранные термины: что означают имена сущностей и их отношения. Одну и ту же синтаксически корректную запись можно прочитать в разных предметных областях, поэтому разбор и толкование разделены на два независимых поля.'
  id: 013-check-envelope-2
  fingerprint: '12469749'
