- concept: FIPA — стандартизующая организация, ACL — формат конверта, который она стандартизовала
  question: 'Инженер говорит: «мы не используем FIPA, у нас другой формат сообщений». Что в этой фразе смешано?'
  explanation: 'Foundation for Intelligent Physical Agents — организация (позже под крылом IEEE), стандартизовавшая язык общения агентов. ACL — конкретный конверт: перформатив, содержимое, метаданные. Свой JSON-конверт вполне может воспроизводить примитивы ACL, ничего не зная о FIPA.'
  kind: choice
  options:
    - FIPA — организация-стандартизатор, а формат конверта называется ACL; отказ от формата не равен отказу от идей стандарта
    - 'Ничего: FIPA и есть формат сообщений'
    - FIPA — это язык содержимого, а ACL — набор перформативов
    - FIPA — это рантайм агентной платформы, ACL — его конфигурация
  correct: 0
  id: 044-final-quiz-2
  fingerprint: c876a26a
- concept: вклад FIPA поверх KQML — формальная семантика перформативов и каталог протоколов взаимодействия, а не новый транспорт
  question: KQML появился раньше и решал ту же задачу — обмен знаниями между агентами. Что добавила поверх него FIPA-ACL?
  explanation: 'KQML был проще и уже по охвату: набор перформативов без строгих условий их применения. FIPA закрепила смысл перформативов формально и описала сценарии обмена как отдельные сущности. Именно вторая часть наследия выжила лучше первой.'
  kind: choice
  options:
    - Заданную формальную семантику перформативов и набор стандартизованных протоколов взаимодействия поверх отдельных сообщений
    - Бинарный транспорт вместо текстового
    - Отказ от поля содержимого в пользу типизированных аргументов
    - Возможность обмена сообщениями без указания отправителя
  correct: 0
