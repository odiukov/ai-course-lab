- concept: оркестратор торга вызывает готовые стадии в фиксированном порядке, где вход каждой — выход предыдущей
  question: Расставь стадии функции, прогоняющей полный оборот Contract Net, в правильном порядке.
  explanation: 'Порядок не произволен: победителя нельзя выбрать до отбора, а отбирать нечего до появления ответов, и ответы не с чем связывать до объявления. Каждая стадия потребляет результат предыдущей.'
  kind: order
  items:
    - Создать одно объявление торга с новым идентификатором разговора
    - Сформировать ответ-предложение от каждого участника, связав его с объявлением
    - Отфильтровать полученные ответы, оставив предложения, относящиеся к этому торгу
    - Определить победителя по заданному критерию среди отобранных предложений
    - 'Оформить решения: принятие победителю и отклонения остальным отобранным предложениям'
    - Вернуть все сообщения в хронологическом порядке
  id: 036-run-contract-net-1
  fingerprint: d98d11a4
- concept: стадия отбора остаётся обязательной даже когда вход заведомо чистый
  question: В демонстрации предложения генерирует сама функция, поэтому все они заведомо корректны. Зачем всё равно прогонять их через отбор?
  explanation: Игрушечный прогон демонстрирует контракт, а не проверяет данные. Если отбор выкинуть, потому что «здесь и так всё валидно», при подключении настоящей сети чужая или устаревшая заявка попадёт прямо в выбор победителя.
  kind: choice
  options:
    - 'Отбор — стадия протокола, а не защита от бага демонстрации: с реальным транспортом вход перестанет быть чистым, а код останется тем же'
    - Отбор сортирует предложения по цене, без него победителя не найти
    - Отбор проставляет ссылки на объявление, которых у предложений ещё нет
    - Отбор нужен, чтобы число возвращённых сообщений совпало с ожидаемым
