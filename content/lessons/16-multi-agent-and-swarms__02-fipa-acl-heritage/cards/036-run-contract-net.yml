- concept: оркестратор не собирает поля конверта вручную, а переиспользует функции построения сообщений
  question: Почему функция, прогоняющая полный оборот торга, формирует предложения и решения через существующие построители сообщений, а не заполняет поля конверта прямо в себе?
  explanation: Дублирование сборки конверта — это два независимых источника правды о том, как связываются реплики. Оркестратор отвечает за порядок и композицию; за корректность полей отвечает построитель, и правится он в одном месте.
  kind: choice
  options:
    - Правила связывания реплик остаются в одном месте, поэтому оркестратор не может разойтись с ними и меняется вместе с ними
    - Прямое заполнение полей запрещено синтаксисом ACL вне функции-построителя
    - Построители кешируют конверты, поэтому повторная сборка обошлась бы дороже
    - Иначе идентификатор разговора пришлось бы генерировать заново для каждого сообщения
