- concept: цена отсутствия отмены растёт пропорционально числу занятых исполнителей
  question: Объясни своими словами, почему отсутствие перформатива отмены дороже в многоагентном торге, чем в одиночном запросе к одному сервису.
  explanation: Отмена — не вежливость, а механизм освобождения ресурсов. Чем шире была рассылка объявления, тем больше параллельной работы висит на устаревшем намерении.
  kind: open
  reference: 'В одиночном запросе неотозванная задача занимает одного исполнителя, и лишнюю работу можно просто выбросить по возврату. В торге объявление получают все приглашённые: пока отмены нет, каждый из них продолжает оценивать задачу, резервировать ресурсы и тратить вычисления на результат, который уже никому не нужен. Издержка умножается на число участников, а менеджер вдобавок получает поток бесполезных предложений, которые всё равно придётся отклонять. Одно сообщение отмены останавливает всех сразу.'
