- concept: отмена и уже отправленный ответ могут разминуться в пути; поздний ответ не возобновляет закрытый сценарий
  question: Менеджер разослал отмену торга, но одно предложение было отправлено раньше и приходит после неё. Как должен вести себя менеджер?
  explanation: 'Отмена меняет состояние сценария у отправителя, а сеть не гарантирует порядок. Поздний ответ — нормальная гонка, а не сбой разбора: закрытый сценарий не открывается заново приходом сообщения, которое было в пути.'
  kind: choice
  options:
    - Считать торг закрытым и отклонить либо игнорировать опоздавшее предложение
    - Возобновить сбор предложений, раз участник всё же ответил
    - Ответить not-understood, потому что предложение пришло после отмены
    - Принять предложение, так как оно было отправлено до отмены
  correct: 0
