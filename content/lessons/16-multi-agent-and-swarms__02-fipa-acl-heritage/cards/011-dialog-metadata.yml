- concept: ответ привязывается к конкретной реплике сопоставлением in-reply-to с исходным reply-with
  question: В одном разговоре агент отправил два запроса и получил два ответа с одинаковым перформативом и одинаковым отправителем, причём сеть доставила их не в том порядке, в каком слались запросы. Что позволяет понять, какой ответ на какой запрос?
  explanation: 'conversation-id у всех четырёх сообщений одинаков — он лишь говорит, что это один разговор. Различает реплики пара меток: отправитель просит `reply-with`, отвечающий возвращает то же значение в `in-reply-to`.'
  kind: choice
  options:
    - Совпадение in-reply-to ответа с reply-with исходного запроса
    - Совпадение conversation-id у ответа и запроса
    - Порядок поступления сообщений в очередь
    - Совпадение поля protocol у обоих сообщений
  correct: 0
  id: 011-dialog-metadata-1
  fingerprint: 881ecf26
- concept: метка reply-with исходного сообщения возвращается ответом в поле in-reply-to
  question: 'Исходное сообщение ушло с `reply-with: msg-31`. Дополни поле ответа, которое связывает его с этой репликой.'
  explanation: reply-with — просьба «ссылайся на меня по этой метке», in-reply-to — её возврат. Значение переходит из первого поля во второе; собственный reply-with ответа при этом свой, для следующего хода.
  kind: cloze
  template: 'reply = {"conversation-id": "conv-77", "___": "msg-31", "reply-with": "msg-52"}'
  answer: in-reply-to
  accept:
    - in-reply-to
  id: 011-dialog-metadata-2
  fingerprint: 46bfe4c0
- concept: идентификатор разговора не различает реплики внутри него, поэтому нужен второй уровень связи
  question: Почему одного conversation-id недостаточно, чтобы система связала ответ с вопросом? Объясни своими словами.
  explanation: 'Два уровня решают две разные задачи: группировка (что относится к одному диалогу) и адресация реплики (что чему отвечает). Смешивать их нельзя — параллельные ветви внутри одного разговора иначе станут неразличимы.'
  kind: open
  reference: 'conversation-id общий для всех сообщений одного разговора, а внутри разговора реплик много: несколько запросов, подтверждения, итоговые ответы. По общему идентификатору видно только, что сообщение относится к этому диалогу. Если в разговоре одновременно висят два неотвеченных запроса или сообщения приходят с задержкой и не в том порядке, общий идентификатор не различит их. Второй уровень — метка конкретной реплики: reply-with в исходном сообщении и in-reply-to в ответе — указывает, на какую именно реплику отвечают.'
  id: 011-dialog-metadata-3
  fingerprint: c08b9006
