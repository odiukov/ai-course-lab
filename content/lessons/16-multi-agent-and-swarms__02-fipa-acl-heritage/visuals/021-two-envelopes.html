<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Один запрос в синтаксисе FIPA-ACL и MCP</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f7fb;
    --surface: #ffffff;
    --panel: #fbfcff;
    --left-tint: #e9f1ff;
    --right-tint: #e9f8f2;
    --exception-tint: #fff3e5;
    --text: #182033;
    --muted: #596579;
    --border: #9aa8bc;
    --divider: #d4dbe6;
    --left-accent: #2867c7;
    --right-accent: #167653;
    --map: #62728a;
    --exception: #bd5a20;
    --code: #15223b;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #171e2b;
      --panel: #1b2433;
      --left-tint: #1c3150;
      --right-tint: #173c32;
      --exception-tint: #422b1d;
      --text: #edf2fa;
      --muted: #b5c0d0;
      --border: #62728a;
      --divider: #344155;
      --left-accent: #82b2ff;
      --right-accent: #72d5ae;
      --map: #a8b7ca;
      --exception: #ffae78;
      --code: #f2f6ff;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: unset;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .diagram {
    background: var(--surface);
  }

  h1 {
    margin: unset;
    color: var(--text);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 425px;
    background: var(--surface);
    shape-rendering: geometricPrecision;
  }

  .background {
    fill: var(--surface);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
  }

  .left-header {
    fill: var(--left-tint);
  }

  .right-header {
    fill: var(--right-tint);
  }

  .exception-box {
    fill: var(--exception-tint);
    stroke: var(--exception);
    stroke-width: 1.5px;
    vector-effect: non-scaling-stroke;
  }

  .divider,
  .section-rule {
    stroke: var(--divider);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .map-line {
    fill: none;
    stroke: var(--map);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .map-node,
  .map-arrow {
    fill: var(--map);
  }

  .missing-line,
  .missing-stop {
    fill: none;
    stroke: var(--exception);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  text {
    fill: var(--text);
  }

  .panel-title {
    font-size: 17px;
    font-weight: bold;
  }

  .semantic {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: .04em;
  }

  .code {
    fill: var(--code);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", monospace;
    font-size: 14px;
  }

  .context {
    fill: var(--code);
    font-size: 14px;
  }

  .mapping-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .section-title {
    fill: var(--exception);
    font-size: 16px;
    font-weight: bold;
  }

  .exception-main {
    fill: var(--code);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", monospace;
    font-size: 15px;
    font-weight: bold;
  }

  .exception-note {
    fill: var(--text);
    font-size: 14px;
  }

  .fallback {
    margin: unset;
    color: var(--text);
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="diagram" aria-labelledby="diagram-heading">
  <h1 id="diagram-heading">Один запрос: FIPA-ACL и MCP</h1>
  <span id="diagram-description" hidden>
    Четыре строки сопоставляют участников, намерение, данные и ключ ответа.
    Поле ontology показано отдельно, потому что прямого аналога в MCP у него нет.
  </span>
  <svg id="scheme"
       viewBox="0 0 1200 425"
       width="1200"
       height="425"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-heading diagram-description">
    <title>Построчное сопоставление запроса FIPA-ACL и вызова инструмента MCP</title>
  </svg>
</main>

<script>
(() => {
  const diagramData = {
    zero: 0,
    origin: { x: 0, y: 0 },
    scale: { x: 1, y: 1 },
    canvas: { width: 1200, height: 425 },
    panel: {
      leftX: 35,
      rightX: 745,
      y: 32,
      width: 420,
      height: 280,
      corner: 14,
      headerHeight: 46,
      titleInset: 20,
      titleY: 61,
      textInset: 18
    },
    connector: {
      fromX: 478,
      toX: 722,
      labelX: 600,
      arrowLength: 13,
      arrowHalfHeight: 7,
      nodeRadius: 4
    },
    dash: { length: 8, gap: 7 },
    rows: [
      {
        top: 78,
        lineY: 120,
        mapping: "sender/receiver ↔ контекст соединения",
        left: {
          tag: "УЧАСТНИКИ",
          tagY: 94,
          lines: [
            { text: ":sender agent1", y: 113, kind: "code" },
            { text: ":receiver tool-server", y: 130, kind: "code" }
          ]
        },
        right: {
          tag: "УЧАСТНИКИ",
          tagY: 94,
          lines: [
            {
              text: "адрес сервера и отправитель",
              y: 113,
              kind: "context"
            },
            {
              text: "задаются соединением, не JSON-полем",
              y: 130,
              kind: "context"
            }
          ]
        }
      },
      {
        top: 136,
        lineY: 178,
        mapping: "request ↔ tools/call",
        left: {
          tag: "НАМЕРЕНИЕ",
          tagY: 152,
          lines: [
            { text: "(request …)", y: 178, kind: "code" }
          ]
        },
        right: {
          tag: "НАМЕРЕНИЕ",
          tagY: 152,
          lines: [
            { text: "\"method\": \"tools/call\"", y: 178, kind: "code" }
          ]
        }
      },
      {
        top: 194,
        lineY: 236,
        mapping: "content ↔ arguments",
        left: {
          tag: "ДАННЫЕ",
          tagY: 210,
          lines: [
            {
              text: ":content \"(lookup stock IBM)\"",
              y: 236,
              kind: "code"
            }
          ]
        },
        right: {
          tag: "ДАННЫЕ",
          tagY: 210,
          lines: [
            {
              text: "lookup_stock · \"arguments\":{\"symbol\":\"IBM\"}",
              y: 236,
              kind: "code"
            }
          ]
        }
      },
      {
        top: 252,
        lineY: 294,
        mapping: "conversation-id ↔ id",
        left: {
          tag: "КЛЮЧ ОТВЕТА",
          tagY: 268,
          lines: [
            { text: ":conversation-id c42", y: 294, kind: "code" }
          ]
        },
        right: {
          tag: "КЛЮЧ ОТВЕТА",
          tagY: 268,
          lines: [
            { text: "\"id\": 42", y: 294, kind: "code" }
          ]
        }
      }
    ],
    ontology: {
      ruleY: 326,
      titleX: 35,
      titleY: 350,
      leftBox: { x: 205, y: 363, width: 275, height: 52 },
      rightBox: { x: 725, y: 363, width: 440, height: 52 },
      corner: 10,
      lineFromX: 496,
      lineToX: 708,
      lineY: 390,
      labelX: 602,
      stopX: 708,
      stopTopY: 380,
      stopBottomY: 400,
      leftTextX: 342,
      leftTextY: 395,
      rightTextX: 745,
      rightMainY: 384,
      rightNoteY: 404,
      label: "прямой пары нет"
    }
  };

  const origin = diagramData.origin;
  const scale = diagramData.scale;
  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const labelPad = 8;
  const namespace = "http://www.w3.org/2000/svg";

  try {
    const svg = document.getElementById("scheme");

    const make = (name, attributes, className) => {
      const element = document.createElementNS(namespace, name);
      Object.entries(attributes).forEach(([attribute, value]) => {
        element.setAttribute(attribute, String(value));
      });
      if (className) {
        element.setAttribute("class", className);
      }
      return element;
    };

    const append = element => {
      svg.appendChild(element);
      return element;
    };

    const rectangle = (x, y, width, height, radius, className) =>
      append(make("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(radius) - sx(diagramData.zero),
        ry: sy(radius) - sy(diagramData.zero)
      }, className));

    const line = (x1, y1, x2, y2, className) =>
      append(make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2)
      }, className));

    const text = (value, x, y, className, anchor) => {
      const element = make("text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor
      }, className);
      element.textContent = value;
      return append(element);
    };

    const background = rectangle(
      diagramData.zero,
      diagramData.zero,
      diagramData.canvas.width,
      diagramData.canvas.height,
      diagramData.zero,
      "background"
    );
    background.setAttribute("aria-hidden", "true");

    const drawPanel = (x, title, headerClass, side) => {
      rectangle(
        x,
        diagramData.panel.y,
        diagramData.panel.width,
        diagramData.panel.height,
        diagramData.panel.corner,
        "panel"
      );

      rectangle(
        x,
        diagramData.panel.y,
        diagramData.panel.width,
        diagramData.panel.headerHeight,
        diagramData.panel.corner,
        headerClass
      );

      line(
        x,
        diagramData.panel.y + diagramData.panel.headerHeight,
        x + diagramData.panel.width,
        diagramData.panel.y + diagramData.panel.headerHeight,
        "divider"
      );

      text(
        title,
        x + diagramData.panel.titleInset,
        diagramData.panel.titleY,
        "panel-title",
        "start"
      );

      diagramData.rows.forEach(row => {
        if (row.top !== diagramData.panel.y + diagramData.panel.headerHeight) {
          line(
            x,
            row.top,
            x + diagramData.panel.width,
            row.top,
            "divider"
          );
        }

        const content = row[side];

        text(
          content.tag,
          x + diagramData.panel.textInset,
          content.tagY,
          "semantic",
          "start"
        );

        content.lines.forEach(item => {
          text(
            item.text,
            x + diagramData.panel.textInset,
            item.y,
            item.kind,
            "start"
          );
        });
      });
    };

    drawPanel(
      diagramData.panel.leftX,
      "FIPA-ACL",
      "left-header",
      "left"
    );

    drawPanel(
      diagramData.panel.rightX,
      "MCP / JSON-RPC",
      "right-header",
      "right"
    );

    diagramData.rows.forEach(row => {
      line(
        diagramData.connector.fromX,
        row.lineY,
        diagramData.connector.toX,
        row.lineY,
        "map-line"
      );

      append(make("circle", {
        cx: sx(diagramData.connector.fromX),
        cy: sy(row.lineY),
        r: sx(diagramData.connector.nodeRadius) - sx(diagramData.zero)
      }, "map-node"));

      append(make("polygon", {
        points: [
          `${sx(diagramData.connector.toX)},${sy(row.lineY)}`,
          `${sx(diagramData.connector.toX - diagramData.connector.arrowLength)},${sy(row.lineY - diagramData.connector.arrowHalfHeight)}`,
          `${sx(diagramData.connector.toX - diagramData.connector.arrowLength)},${sy(row.lineY + diagramData.connector.arrowHalfHeight)}`
        ].join(" ")
      }, "map-arrow"));

      text(
        row.mapping,
        diagramData.connector.labelX,
        row.lineY,
        "mapping-label",
        "middle"
      ).setAttribute(
        "y",
        String(sy(row.lineY) - labelPad)
      );
    });

    line(
      diagramData.zero,
      diagramData.ontology.ruleY,
      diagramData.canvas.width,
      diagramData.ontology.ruleY,
      "section-rule"
    );

    text(
      "Отдельное расхождение: ontology",
      diagramData.ontology.titleX,
      diagramData.ontology.titleY,
      "section-title",
      "start"
    );

    rectangle(
      diagramData.ontology.leftBox.x,
      diagramData.ontology.leftBox.y,
      diagramData.ontology.leftBox.width,
      diagramData.ontology.leftBox.height,
      diagramData.ontology.corner,
      "exception-box"
    );

    rectangle(
      diagramData.ontology.rightBox.x,
      diagramData.ontology.rightBox.y,
      diagramData.ontology.rightBox.width,
      diagramData.ontology.rightBox.height,
      diagramData.ontology.corner,
      "exception-box"
    );

    const missing = line(
      diagramData.ontology.lineFromX,
      diagramData.ontology.lineY,
      diagramData.ontology.lineToX,
      diagramData.ontology.lineY,
      "missing-line"
    );

    missing.setAttribute(
      "stroke-dasharray",
      `${sx(diagramData.dash.length) - sx(diagramData.zero)} ${sx(diagramData.dash.gap) - sx(diagramData.zero)}`
    );

    line(
      diagramData.ontology.stopX,
      diagramData.ontology.stopTopY,
      diagramData.ontology.stopX,
      diagramData.ontology.stopBottomY,
      "missing-stop"
    );

    text(
      diagramData.ontology.label,
      diagramData.ontology.labelX,
      diagramData.ontology.lineY,
      "mapping-label",
      "middle"
    ).setAttribute(
      "y",
      String(sy(diagramData.ontology.lineY) - labelPad)
    );

    text(
      ":ontology finance",
      diagramData.ontology.leftTextX,
      diagramData.ontology.leftTextY,
      "exception-main",
      "middle"
    );

    text(
      "MCP: отдельного поля нет",
      diagramData.ontology.rightTextX,
      diagramData.ontology.rightMainY,
      "exception-main",
      "start"
    );

    text(
      "смысл задаёт схема инструмента",
      diagramData.ontology.rightTextX,
      diagramData.ontology.rightNoteY,
      "exception-note",
      "start"
    );
  } catch (error) {
    const svg = document.getElementById("scheme");
    const fallback = document.createElement("p");
    fallback.className = "fallback";
    fallback.textContent =
      "Схема должна была показать четыре соответствия: sender/receiver и контекст соединения, request и tools/call, content и arguments, conversation-id и id. У ontology прямого аналога в MCP нет.";
    svg.replaceWith(fallback);
  }
})();
</script>
</body>
</html>
