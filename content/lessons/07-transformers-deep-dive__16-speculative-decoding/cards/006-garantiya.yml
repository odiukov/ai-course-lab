  fingerprint: 14443c70
- concept: после отклонения токен выбирается из скорректированного распределения verifier
  question: Что должен сделать корректный алгоритм speculative sampling, если verifier отклонил предложенный draft-моделью токен?
  explanation: Отклонение уже сообщает дополнительную информацию о результате сэмплирования, поэтому просто взять argmax или снова обратиться к draft нельзя. Скорректированное распределение компенсирует влияние черновика и сохраняет исходное распределение verifier.
  kind: choice
  options:
    - Заново сгенерировать весь ответ с начала
    - Выбрать замену из скорректированного распределения verifier
    - Всегда взять самый вероятный токен verifier
    - Повторно сэмплировать токен только из draft-модели
  correct: 1
