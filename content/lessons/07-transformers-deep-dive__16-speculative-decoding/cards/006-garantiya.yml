- concept: слабая draft-модель снижает долю принятых токенов и ускорение, но не меняет распределение результата
  question: Объясните, что произойдёт со скоростью и качеством результата, если в корректном speculative sampling заменить draft-модель на менее точную.
  explanation: 'Draft-модель влияет на эффективность: чем удачнее её предложения, тем больше токенов принимается за цикл. При корректном speculative sampling качество определяется verifier, а не силой черновика.'
  kind: open
  reference: Предложения draft-модели будут реже совпадать с распределением verifier, поэтому доля принятых токенов и ускорение уменьшатся. Однако вероятностное принятие и скорректированная замена отклонённых токенов сохранят то же распределение выходных последовательностей, которое дал бы verifier при самостоятельном декодировании.
