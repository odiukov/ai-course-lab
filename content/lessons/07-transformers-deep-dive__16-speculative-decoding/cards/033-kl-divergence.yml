- concept: KL-дивергенция конечна только при включении носителя первого распределения в носитель второго
  question: Для некоторого токена verifier задаёт положительную вероятность q, а draft-модель задаёт нулевую вероятность p. Чему равна точная KL-дивергенция D_KL(q || p)?
  explanation: Слагаемое q·ln(q/p) бесконечно при q > 0 и p = 0. Поэтому реализация должна явно вернуть бесконечность либо документировать приближённый вариант со сглаживанием.
  kind: choice
  options:
    - Бесконечности
    - Нулю
    - Конечному значению, потому что этот токен можно пропустить
    - Она обязательно становится отрицательной
  correct: 0
  id: 033-kl-divergence-1
  fingerprint: a05b6f13
- concept: KL-дивергенция нормированных распределений неотрицательна и обращается в ноль только при их совпадении
  question: Какое утверждение верно для точных нормированных распределений q и p?
  explanation: По неравенству Гиббса KL-дивергенция неотрицательна. Для распределений на одном словаре точный ноль достигается при совпадении вероятностей всех токенов.
  kind: choice
  options:
    - D_KL(q || p) неотрицательна и равна нулю тогда и только тогда, когда q и p совпадают
    - D_KL(q || p) может быть отрицательной, если draft-модель точнее verifier
    - D_KL(q || p) равна нулю для любых распределений с одинаковым самым вероятным токеном
    - D_KL(q || p) всегда строго положительна, даже если распределения совпадают
  correct: 0
  id: 033-kl-divergence-2
  fingerprint: 67f81cd5
- concept: KL-дивергенция направлена и в общем случае несимметрична
  question: Объясни своими словами, почему аргументы функции kl_divergence(q, p) нельзя бездумно менять местами.
  explanation: KL-дивергенция — направленная мера расхождения. Перестановка q и p меняет как распределение, задающее веса слагаемых, так и поведение на токенах с нулевой вероятностью.
  kind: open
  reference: В D_KL(q || p) математическое ожидание берётся по q и вычисляется логарифм отношения q/p. После перестановки распределений веса и отношение меняются, поэтому D_KL(q || p) в общем случае не равна D_KL(p || q); кроме того, одна из дивергенций может быть конечной, а обратная — бесконечной.
  id: 033-kl-divergence-3
  fingerprint: 5548e4ef
