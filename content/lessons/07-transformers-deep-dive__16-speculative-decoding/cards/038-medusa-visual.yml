- concept: дальняя голова Medusa не обусловлена фактически выбранными промежуточными токенами
  question: Почему распределение дальней головы Medusa нельзя считать тем же распределением, которое обычная языковая модель получила бы после последовательной генерации всех промежуточных токенов?
  explanation: При обычном авторегрессионном декодировании каждый следующий прогноз обусловлен уже выбранными промежуточными токенами. Головы Medusa работают параллельно из одного скрытого состояния, поэтому такого обусловливания у дальней головы нет.
  kind: open
  reference: Дальняя голова получает скрытое состояние исходного префикса, но не видит фактически выбранные токены на более близких будущих позициях. Поэтому она приближённо предсказывает удалённую позицию по сокращённому контексту, а предложенное продолжение затем необходимо проверить.
