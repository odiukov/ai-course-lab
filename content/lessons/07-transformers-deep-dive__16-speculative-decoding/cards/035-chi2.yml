- concept: эквивалентность распределений проверяется сравнением частот токенов speculative decoding и прямого сэмплирования из verifier
  question: Какой эксперимент непосредственно проверяет, сохраняет ли speculative decoding распределение выходных токенов verifier?
  explanation: Speculative decoding должен менять способ вычисления, но не итоговое распределение. Поэтому его выборку сравнивают с прямым сэмплированием из verifier; различия частот оценивают с учётом обычного шума сэмплирования.
  kind: choice
  options:
    - Сравнить среднюю задержку двух способов генерации
    - Сравнить частоты токенов в больших независимых выборках и применить статистический критерий
    - Измерить долю принятых черновых токенов
    - Проверить совпадение одного сгенерированного продолжения
  correct: 1
  id: 035-chi2-1
  fingerprint: 9693d7ee
- concept: статистика хи-квадрат суммирует квадраты отклонений частот, делённые на ожидаемые частоты
  question: Для двух токенов ожидаемые частоты равны 240 и 160, а наблюдаемые — 228 и 172. Чему равна статистика хи-квадрат Σ(O−E)²/E?
  explanation: Для первого токена вклад равен (228−240)²/240 = 0,6, для второго — (172−160)²/160 = 0,9. Суммарная статистика равна 1,5.
  kind: numeric
  answer: 1.5
  tolerance: 0.01
  id: 035-chi2-2
  fingerprint: d4dd25c4
- concept: размер выборки определяет чувствительность статистической проверки к систематическому перекосу распределения
  question: Объясни своими словами, почему малая выборка токенов может не обнаружить ошибку в реализации speculative decoding.
  explanation: Неспособность критерия обнаружить различие не гарантирует точного совпадения распределений. На 1000 сэмплах заметный перекос может затеряться в шуме, поэтому в задании используются 50 000 токенов.
  kind: open
  reference: Случайные колебания частот на малой выборке велики, поэтому небольшой систематический сдвиг трудно отличить от шума сэмплирования. Большая выборка уменьшает относительный шум и повышает статистическую мощность проверки.
  id: 035-chi2-3
  fingerprint: be06a980
