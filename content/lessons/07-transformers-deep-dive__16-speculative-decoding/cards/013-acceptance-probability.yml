- concept: нулевую вероятность draft необходимо обработать до деления
  question: Draft-модель присвоила предложенному токену нулевую вероятность. Как должна поступить функция acceptance_probability?
  explanation: Нулевая вероятность draft оказывается в знаменателе, поэтому делить нельзя. Отношение условно считают бесконечно большим, а ограничение сверху превращает его в максимальную вероятность принятия.
  kind: choice
  options:
    - Сначала выполнить деление, а затем перехватить возможную ошибку
    - Всегда отклонить токен, поскольку draft считает его невозможным
    - До деления считать отношение бесконечно большим и вернуть максимальную вероятность принятия
  correct: 2
  id: 013-acceptance-probability-1
  fingerprint: 317f9d7e
- concept: вычисление вероятности принятия отделяется от случайного решения
  question: Почему функцию acceptance_probability в speculative decoding следует сделать детерминированной и не выполнять внутри неё случайное испытание?
  explanation: acceptance_probability возвращает лишь вероятность. Само решение возникает позже при сравнении этой вероятности с равномерным случайным числом, поэтому арифметическую функцию можно проверять точными ожидаемыми результатами.
  kind: open
  reference: Функция должна только вычислять порог принятия по вероятностям verifier и draft. Отдельный код сравнивает этот порог с равномерным случайным значением и принимает решение. Такое разделение изолирует арифметику от случайности и упрощает тестирование.
  id: 013-acceptance-probability-2
  fingerprint: ad1db054
