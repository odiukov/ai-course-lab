- concept: устранимая особенность закрытой формы геометрической суммы при идеальном принятии
  question: В реализации expected_tokens_per_verify черновик всегда принимается целиком. Что должна вернуть функция?
  explanation: Деление — лишь закрытая запись конечной геометрической суммы. При идеальном принятии проходят все черновые токены и бонусный токен, поэтому этот случай нужно вычислять отдельной веткой без деления.
  kind: choice
  options:
    - Длину чернового блока плюс бонусный токен
    - Положительную бесконечность, потому что знаменатель обращается в ноль
    - Только длину чернового блока, не учитывая бонусный токен
  correct: 0
  id: 027-expected-tokens-1
  fingerprint: 5384c306
- concept: математическое ожидание числа токенов не следует округлять
  question: Функция expected_tokens_per_verify получила нецелое математическое ожидание. Как корректно вернуть результат?
  explanation: Результат описывает среднее число токенов по множеству вызовов verifier, а не результат одного конкретного вызова. Поэтому дробная часть содержательна и должна сохраняться.
  kind: choice
  options:
    - Вернуть дробное число без округления
    - Округлить вниз до числа токенов, гарантированно выдаваемых за проверку
    - Округлить до ближайшего целого числа
  correct: 0
