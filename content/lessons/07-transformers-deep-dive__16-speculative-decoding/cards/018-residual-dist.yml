- concept: у нормированных распределений суммарный дефицит вероятности равен суммарному избытку
  question: Почему для двух нормированных распределений сумма положительных разностей q_i − p_i равна модулю суммы отрицательных разностей?
  explanation: Поскольку q и p оба суммируются до единицы, суммарная разность между ними равна нулю. Поэтому вся масса, которой draft недодал одним токенам, равна массе, которую он перераспределил в пользу других.
  kind: open
  reference: Суммы вероятностей q и p одинаковы, поэтому сумма всех разностей q_i − p_i равна нулю. Следовательно, положительная часть этой суммы должна в точности компенсировать отрицательную.
