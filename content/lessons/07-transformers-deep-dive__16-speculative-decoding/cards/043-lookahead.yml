- concept: итерация Якоби одновременно обновляет все позиции окна из предыдущего состояния
  question: Расположите этапы само-спекуляции с итерацией Якоби в правильном порядке.
  explanation: В итерации Якоби все позиции пересчитываются параллельно из одного предыдущего состояния. Новые значения становятся входом только для следующего прохода.
  kind: order
  items:
    - Заполнить окно продолжения предварительными токенами
    - Параллельно вычислить предсказания для всех позиций на основе текущего состояния окна
    - Одновременно заменить предварительные токены полученными предсказаниями
    - Повторять обновление, пока нужные позиции не стабилизируются
  id: 043-lookahead-1
  fingerprint: e02343d2
- concept: неподвижная точка итерации Якоби совпадает с результатом последовательного декодирования
  question: Почему неподвижная точка lookahead-итерации воспроизводит продолжение, которое та же модель получила бы последовательным декодированием?
  explanation: После стабилизации ни одно параллельное обновление не меняет токены. Значит, каждый из них согласован со всеми предшествующими токенами и с тем же правилом декодирования, которое применялось бы авторегрессионно.
  kind: open
  reference: В неподвижной точке токен каждой позиции уже равен предсказанию модели при условии окончательного префикса перед этой позицией. Это то же условие, при котором токен выбирается при последовательном декодировании, поэтому при одинаковом правиле выбора результаты совпадают.
  id: 043-lookahead-2
  fingerprint: dc492ec5
- concept: промежуточные догадки итерации служат источником n-грамм-кандидатов
