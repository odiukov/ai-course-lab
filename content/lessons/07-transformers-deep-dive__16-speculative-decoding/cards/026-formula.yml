- concept: при фиксированной доле принятия рост длины чернового блока имеет конечный предел полезности
  question: При α = 0.9 длину draft-блока увеличивают без ограничения. К какому пределу стремится среднее число готовых токенов за один вызов verifier?
  explanation: При неограниченной длине блока конечная геометрическая сумма превращается в бесконечную. Обратная величина к оставшейся вероятности 0.1 равна 10, поэтому увеличение блока не может поднять средний выход выше этого предела.
