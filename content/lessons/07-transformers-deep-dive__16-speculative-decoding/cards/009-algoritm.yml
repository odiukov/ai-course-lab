- concept: при принятии всего чернового блока verifier позволяет получить дополнительный токен без нового прохода
  question: Из какого распределения сэмплируется дополнительный токен, если принят весь черновой блок?
  explanation: При проверке блока verifier уже вычисляет распределение для следующей за ним позиции. Поэтому после принятия всех предложений из этого распределения можно сэмплировать дополнительный токен без ещё одного запуска verifier.
  kind: cloze
  template: Если весь черновой блок принят, дополнительный токен сэмплируют из ___.
  answer: распределения verifier для позиции сразу после чернового блока
  accept:
    - следующего распределения verifier
    - распределения большой модели для следующей позиции
    - q для позиции после блока
