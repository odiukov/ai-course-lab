- concept: влияние родства моделей на долю принятия проверяют при неизменных задаче и стратегии декодирования
  question: Как поставить эксперимент, чтобы выяснить, повышает ли принадлежность draft-модели к тому же семейству, что и verifier, долю принятия α?
  explanation: На α одновременно влияют сходство моделей, декодирование и задача. Если менять несколько факторов сразу, различие в α нельзя уверенно приписать родству моделей, поэтому остальные условия эксперимента фиксируют.
  kind: open
  reference: Сравнить родственную и неродственную draft-модели с одним и тем же verifier, используя одинаковые запросы, тип задачи и параметры декодирования. Затем сопоставить измеренные доли принятия; прочие различия, особенно стоимость и качество draft-моделей, желательно контролировать.
