- concept: vanilla использует отдельную draft-модель, а lookahead выполняет само-спекуляцию итерациями Якоби
  question: Объясни своими словами, чем различается источник черновых токенов в vanilla speculative decoding и lookahead decoding.
  explanation: Vanilla требует отдельного набора весов для draft-модели. Lookahead относится к само-спекуляции и обходится без отдельной модели-черновика.
  kind: open
  reference: 'В vanilla токены предлагает отдельная небольшая draft-модель, после чего их проверяет большая модель. В lookahead отдельного черновика нет: проверяющая модель формирует и уточняет предположения сама с помощью итераций Якоби.'
