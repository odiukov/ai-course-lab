- concept: черновой KV-буфер позволяет применить результаты проверки как транзакцию
  question: Расположите этапы безопасного обновления KV cache при speculative decoding в правильном порядке.
  explanation: Временный буфер отделяет вычисленные записи от уже подтверждённого кеша. После проверки в основной кеш попадает только принятая часть, а неподтверждённый хвост удаляется.
  kind: order
  items:
    - Записать новые K/V во временный черновой буфер во время проверки
    - Определить границу принятого префикса
    - Зафиксировать K/V принятой части и отбросить записи отклонённого хвоста
