- concept: неоткаченные KV-записи незаметно подменяют контекст следующего шага генерации
  question: Почему отсутствие отката KV cache после отклонения части чернового блока может испортить генерацию без исключения или падения программы?
  explanation: KV cache хранит состояния позиций, а не признак принятия токена. Лишние записи выглядят допустимыми для модели, но заставляют её учитывать отклонённый черновой хвост как часть контекста.
  kind: open
  reference: Структура кеша остаётся технически корректной, поэтому вычисление продолжается. Однако attention использует K/V отклонённых токенов, которых нет в зафиксированном тексте, и модель продолжает генерацию из неверного контекста.
  id: 045-kv-udlinenie-3
