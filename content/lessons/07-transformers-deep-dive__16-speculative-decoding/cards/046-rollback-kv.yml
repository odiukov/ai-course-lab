- concept: целевая длина отката не может превышать текущую длину KV-кеша
  question: Что должна сделать rollback_kv, если target_len больше текущей длины кеша?
  explanation: Откат умеет только удалять хвост. Запрос большей длины указывает на рассинхронизацию счётчиков, поэтому его нельзя молча игнорировать или компенсировать фиктивными записями.
  kind: choice
  options:
    - Дополнить кеш пустыми KV-записями
    - Вернуть кеш без изменений
    - Завершиться с ошибкой проверки
    - Обрезать кеш до минимальной доступной длины
