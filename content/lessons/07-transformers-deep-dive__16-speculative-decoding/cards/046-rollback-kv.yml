- concept: rollback_kv задаёт абсолютную итоговую длину кеша, а не величину сокращения
  question: Почему интерфейсу rollback_kv надёжнее принимать итоговый target_len, а не количество удаляемых позиций?
  explanation: 'После speculative-шагa важен инвариант: длина кеша равна длине реально зафиксированного контекста. Абсолютный target_len прямо выражает этот инвариант и позволяет отдельно проверить, что он не превышает текущую длину.'
  kind: open
  reference: Итоговая длина задаёт проверяемое состояние кеша после операции и вычисляется из фактически зафиксированной последовательности. Величина сокращения зависит от промежуточных предположений о числе отвергнутых токенов и легче приводит к ошибке, особенно при добавлении токена verifier.
  id: 046-rollback-kv-3
