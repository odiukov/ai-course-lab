- concept: надёжность головы Medusa обычно снижается с увеличением горизонта её предсказания
  question: Почему предложение головы Medusa, нацеленной на более далёкую позицию, обычно реже проходит проверку верификатором, чем предложение ближайшей головы?
  explanation: Чем дальше целевая позиция, тем больше неизвестных промежуточных решений отделяет её от доступного скрытого состояния. Поэтому дальние головы обычно дают менее точные кандидаты и реже принимаются.
  kind: open
  reference: Все головы опираются на одно скрытое состояние текущей позиции. Дальняя голова предсказывает токен за несколькими ещё не определёнными промежуточными токенами и не наблюдает, какие именно варианты там будут выбраны. Из-за растущей неопределённости она чаще ошибается, поэтому доля принятия снижается.
  id: 037-medusa-2
  fingerprint: 743b8b1c
