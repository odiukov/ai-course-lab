- concept: доля принятия α растёт при сходстве моделей, детерминированном декодировании и предсказуемой задаче
  question: Для какой конфигурации speculative decoding следует ожидать наибольшую долю принятия α?
  explanation: Сходные модели чаще согласуются в распределениях токенов, жадное декодирование устраняет дополнительную случайность, а код обычно предсказуемее свободного текста. Совместно эти факторы повышают α.
  kind: choice
  options:
    - Draft и verifier принадлежат одному семейству и обучены на сходных данных, оба декодируют жадно, генерируется код
    - Draft и verifier принадлежат одному семейству, но используют температурное сэмплирование для свободного литературного диалога
    - Draft обучен на других данных и относится к другому семейству, обе модели декодируют жадно, генерируется код
    - Draft использует температурное сэмплирование, verifier декодирует жадно, генерируется свободное эссе
