- concept: категориальное сэмплирование воспроизводит заданные моделью вероятности токенов
  question: Что произойдёт, если много раз независимо сэмплировать токен из одного и того же распределения модели?
  explanation: При категориальном сэмплировании вероятность выпадения каждого токена совпадает с его весом в распределении. Поэтому при большом числе независимых повторов наблюдаемые частоты приближаются к вероятностям модели.
  kind: choice
  options:
    - Все токены будут встречаться одинаково часто
    - Всегда будет выпадать только самый вероятный токен
    - Частота каждого токена будет приближаться к назначенной ему вероятности
  correct: 2
  id: 010-sample-teoriya-1
  fingerprint: 47d89b62
- concept: ненормированные неотрицательные веса превращаются в вероятности делением на их сумму
  question: После вычисления остаточного распределения у трёх токенов остались веса 8, 13 и 17. Какова вероятность сэмплировать токен с весом 13 после нормировки?
  explanation: Сумма весов равна 38, поэтому нормированная вероятность нужного токена равна 13/38 ≈ 0.3421. Нормировка сохраняет отношения между весами, но превращает их в полноценное распределение.
  kind: numeric
  answer: 0.3421
  tolerance: 0.001
  id: 010-sample-teoriya-2
  fingerprint: 24d04bbb
