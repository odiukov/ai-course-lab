- concept: маска tree attention разрешает каждому узлу видеть только общий контекст и собственных предков
  question: Несколько ветвей-кандидатов Medusa уложены в общий вход verifier. Какая маска внимания сохраняет для каждого узла те же логиты, что и при отдельной проверке его ветви?
  explanation: Предсказание в ветви должно зависеть только от исходного контекста и выбранного ранее префикса этой ветви. Доступ к братьям или узлам чужих ветвей подмешал бы несовместимые продолжения и изменил логиты.
  kind: choice
  options:
    - Узел видит общий исходный контекст и узлы на пути от корня дерева до себя
    - Узел видит все элементы общего входа, расположенные перед ним
    - Узел видит только кандидатов на том же уровне дерева
    - Узел видит собственных предков и соседние ветви с более высокой вероятностью
  correct: 0
  id: 039-tree-attention-1
  fingerprint: 314f94f4
- concept: дерево кандидатов устраняет повторное вычисление общих префиксов разных продолжений
  question: Почему набор продолжений с общими префиксами выгодно представлять деревом при верификации? Объясни своими словами.
  explanation: Разные гипотезы часто совпадают в начале. Древовидное представление объединяет эту совпадающую часть, поэтому verifier не дублирует вычисления для одинаковых префиксов; специальная маска при этом изолирует расходящиеся ветви.
  kind: open
  reference: В дереве общий префикс хранится и обрабатывается один раз, после чего от него расходятся разные продолжения. При независимой записи полных цепочек один и тот же префикс пришлось бы повторно обрабатывать для каждой ветви.
  id: 039-tree-attention-2
  fingerprint: 01831faa
