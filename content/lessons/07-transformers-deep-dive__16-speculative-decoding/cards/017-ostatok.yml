- concept: вероятность токена в остаточном распределении равна его положительной разности q_i − p_i, делённой на сумму всех положительных разностей
  question: Для токенов A, B, C и D verifier задаёт q = [0.43, 0.32, 0.17, 0.08], а draft-модель — p = [0.52, 0.14, 0.13, 0.21]. Какова вероятность токена B в нормированном остаточном распределении? Ответ округлите до тысячных.
  explanation: Положительные разности равны [0, 0.18, 0.04, 0], их сумма — 0.22. Поэтому вероятность B равна 0.18 / 0.22 ≈ 0.818.
  kind: numeric
  answer: 0.818
