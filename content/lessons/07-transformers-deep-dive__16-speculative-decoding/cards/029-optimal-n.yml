- concept: длину чернового блока выгодно увеличивать, пока предельная отдача превышает текущую пропускную способность
  question: Пусть E_N — ожидаемое число выданных токенов, C_N — полная стоимость итерации, ΔE — прибавка от ещё одной позиции, а c — её стоимость. Заполни критерий, при котором удлинение блока повышает пропускную способность.
  explanation: 'После перекрёстного умножения получаем C_N·ΔE > E_N·c. Значит, предельное число токенов на единицу добавочной стоимости должно превосходить текущую пропускную способность. Поэтому одного положительного прироста недостаточно: он должен окупать очередной шаг draft-модели.'
  kind: cloze
  template: (E_N + ΔE) / (C_N + c) > E_N / C_N  ⇔  ΔE / c > ___
  answer: E_N / C_N
  accept:
    - E_N/C_N
    - текущая пропускная способность
  id: 029-optimal-n-1
  fingerprint: 0586b367
- concept: более высокая доля принятия сдвигает оптимальную длину чернового блока в сторону больших значений
  question: Две системы speculative decoding имеют одинаковую стоимость verifier и draft, но у первой выше доля принятия черновых токенов. Как обычно различаются оптимальные длины чернового блока?
  explanation: При большей α вероятность добраться до дальних позиций блока убывает медленнее, поэтому дополнительные черновые шаги дольше остаются полезными. В материале при α = 0.5 насыщение наступает рано, а при α = 0.85 осмысленный блок заметно длиннее.
  kind: choice
  options:
    - У первой оптимальный блок обычно длиннее
    - У первой оптимальный блок обязательно короче
    - Оптимальная длина не зависит от доли принятия
    - При любой ненулевой доле принятия оптимальная длина бесконечна
  correct: 0
