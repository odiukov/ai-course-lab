- concept: увеличение числа одновременно проверяемых позиций повышает арифметическую интенсивность прохода
  question: Объясни своими словами, почему проверка пачки заранее известных токенов лучше использует GPU, чем последовательная обработка тех же позиций по одной.
  explanation: 'Ключевая величина — арифметическая интенсивность: сколько вычислений выполняется на единицу переданных из памяти данных. Пакетная проверка повторно использует загруженные веса для нескольких позиций, поэтому лучше задействует вычислительные блоки.'
  kind: open
  reference: При обработке позиций по одной веса большой модели приходится многократно читать из видеопамяти, хотя вычислительные блоки могут оставаться недогруженными. Пачка позиций позволяет применить однажды загруженные веса сразу к нескольким наборам активаций, увеличивая объём вычислений на каждый прочитанный байт и повышая загрузку GPU.
