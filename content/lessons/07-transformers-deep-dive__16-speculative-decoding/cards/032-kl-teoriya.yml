- concept: вклад токена в KL-дивергенцию взвешивается его вероятностью у verifier
  question: Для некоторого токена verifier задаёт вероятность q_i = 0.24, а draft-модель — p_i = 0.08. Каков вклад этого токена в D_KL(q || p), если используется натуральный логарифм?
  explanation: Вклад равен q_i ln(q_i / p_i) = 0.24 ln(3) ≈ 0.2637. Множитель q_i делает расхождения по вероятным для verifier токенам более значимыми.
  kind: numeric
  answer: 0.2637
  tolerance: 0.003
  id: 032-kl-teoriya-1
  fingerprint: d8f7c7a1
- concept: максимальное расхождение по одному токену не учитывает частоту токена и хуже характеризует близость распределений, чем KL-дивергенция
  question: Почему максимальное расхождение вероятностей draft-модели и verifier по одному токену может плохо характеризовать качество черновика?
  explanation: Большая ошибка на почти невозможном для verifier токене редко влияет на генерацию. В D_KL(q || p) каждое расхождение умножается на q_i, поэтому метрика сильнее реагирует на ошибки там, где verifier действительно размещает вероятностную массу.
  kind: open
  reference: Максимум учитывает только величину самого крупного расхождения и игнорирует вероятность соответствующего токена у verifier. KL-дивергенция взвешивает логарифмическое отношение вероятностей по q_i и суммирует расхождения по всему словарю, поэтому редкая ошибка получает малый вес, а систематические ошибки на вероятных токенах — большой.
  id: 032-kl-teoriya-2
  fingerprint: fd3caca7
