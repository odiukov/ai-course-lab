<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три сервера, семь инструментов</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1e2430; --muted:#5d6b7d; --line:#8d9bad;
    --box:#ffffff; --boxline:#b6c1cf; --accent:#b3540f; --accentbg:#fdf0e3;
    --model:#eef2f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181e; --fg:#e7ecf3; --muted:#9fb0c2; --line:#6b7c8f;
      --box:#1c222b; --boxline:#3d4a59; --accent:#f0a35a; --accentbg:#2c2116;
      --model:#1f2731;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 14px}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{font-size:13px;line-height:1.5;color:var(--muted)}
  text{fill:var(--fg)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .mut{fill:var(--muted)}
  .acc{fill:var(--accent)}
</style>
<div class="wrap">
  <h2>Три сервера, семь инструментов: склейка вверх, маршрут вниз</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var tools = [
      {name:'create_note',  srv:'notes'},
      {name:'list_notes',   srv:'notes'},
      {name:'notes/search', srv:'notes',  clash:true},
      {name:'files/search', srv:'files',  clash:true, routed:true},
      {name:'read_file',    srv:'files'},
      {name:'create_issue', srv:'github'},
      {name:'list_repos',   srv:'github'}
    ];
    var servers = [
      {id:'notes',  count:'3 инструмента', rows:[0,1,2]},
      {id:'files',  count:'2 инструмента', rows:[3,4]},
      {id:'github', count:'2 инструмента', rows:[5,6]}
    ];
    /* ---- раскладка в данных координатах ---- */
    var L = {
      srvX0:0, srvX1:22, nmX0:44, nmX1:92,
      row0:14, rowStep:6.5, rowH:5,
      modY0:0, modY1:7, upX:48, dnX:86, midY:9,
      routeY:36.8, head:1.4, headW:0.9,
      leg1:60, leg2:63.5
    };
    /* ---- единственный перевод координат ---- */
    var origin = {x:22, y:26}, scale = 7;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    function rowY(i){ return L.row0 + i*L.rowStep; }
    function tri(tx,ty,dir){
      var h=L.head, w=L.headW, p;
      if(dir==='left')  p=[[tx,ty],[tx+h,ty-w],[tx+h,ty+w]];
      else if(dir==='right') p=[[tx,ty],[tx-h,ty-w],[tx-h,ty+w]];
      else if(dir==='up')    p=[[tx,ty],[tx-w,ty+h],[tx+w,ty+h]];
      else                   p=[[tx,ty],[tx-w,ty-h],[tx+w,ty-h]];
      return p.map(function(q){ return sx(q[0])+','+sy(q[1]); }).join(' ');
    }
    function rect(x0,y0,x1,y1,fill,stroke,sw,dash){
      return '<rect x="'+sx(x0)+'" y="'+sy(y0)+'" width="'+(sx(x1)-sx(x0))+
        '" height="'+(sy(y1)-sy(y0))+'" rx="6" fill="'+fill+'" stroke="'+stroke+
        '" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
    }
    function line(x0,y0,x1,y1,stroke,sw,dash){
      return '<line x1="'+sx(x0)+'" y1="'+sy(y0)+'" x2="'+sx(x1)+'" y2="'+sy(y1)+
        '" stroke="'+stroke+'" stroke-width="'+sw+'"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
    }
    function txt(x,y,dx,dy,s,anchor,cls,size,weight){
      return '<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+
        '" class="'+cls+'" font-size="'+size+'"'+(weight?' font-weight="600"':'')+'>'+s+'</text>';
    }

    var g = '';
    /* модель сверху */
    g += rect(L.nmX0,L.modY0,L.nmX1,L.modY1,'var(--model)','var(--boxline)',1.4);
    g += txt((L.nmX0+L.nmX1)/2,(L.modY0+L.modY1)/2,0,-1,'модель','middle','',13,true);
    g += txt((L.nmX0+L.nmX1)/2,(L.modY0+L.modY1)/2,0,15,
             'плоский список из 7 имён, без пометки о трубе','middle','mut',12);
    /* вверх: 7 имён */
    g += line(L.upX,rowY(0)-L.rowH/2-0.3,L.upX,L.modY1+L.head+0.3,'var(--line)',2);
    g += '<polygon points="'+tri(L.upX,L.modY1+0.3,'up')+'" fill="var(--line)"/>';
    g += txt(L.upX,L.midY,7,4,'7 имён наверх','start','mut',13);
    /* вниз: вызов */
    g += line(L.dnX,L.modY1+0.3,L.dnX,rowY(0)-L.rowH/2-L.head-0.3,'var(--accent)',2);
    g += '<polygon points="'+tri(L.dnX,rowY(0)-L.rowH/2-0.3,'down')+'" fill="var(--accent)"/>';
    g += txt(L.dnX,L.midY,-7,4,'вызов files/search','end','acc',13);

    /* сессии слева */
    servers.forEach(function(s){
      var r = s.rows, y0 = rowY(r[0])-L.rowH/2, y1 = rowY(r[r.length-1])+L.rowH/2;
      var cx = (L.srvX0+L.srvX1)/2, cy = (y0+y1)/2;
      g += rect(L.srvX0,y0,L.srvX1,y1,'var(--box)','var(--boxline)',1.6);
      g += '<text x="'+sx(cx)+'" y="'+(sy(cy)-14)+'" text-anchor="middle" class="mono" font-size="14" font-weight="600">'+s.id+'</text>';
      g += txt(cx,cy,0,5,s.count,'middle','mut',12);
      g += txt(cx,cy,0,22,'сессия · PID','middle','mut',12);
    });

    /* имена и линии склейки */
    tools.forEach(function(t,i){
      var y = rowY(i);
      g += line(L.srvX1,y,L.nmX0-L.head,y,'var(--line)',1.2);
      g += '<polygon points="'+tri(L.nmX0,y,'right')+'" fill="var(--line)"/>';
      g += rect(L.nmX0,y-L.rowH/2,L.nmX1,y+L.rowH/2,
                t.clash?'var(--accentbg)':'var(--box)',
                t.clash?'var(--accent)':'var(--boxline)', t.clash?1.8:1.2);
      g += '<text x="'+(sx(L.nmX0)+12)+'" y="'+(sy(y)+5)+'" text-anchor="start" class="mono'+
           (t.clash?' acc':'')+'" font-size="14">'+t.name+'</text>';
      if(t.clash){
        g += txt(L.nmX1,y,-12,5,'префикс добавлен при сборке','end','acc',11);
      }
    });

    /* маршрут: имя -> PID */
    g += line(L.nmX0,L.routeY,L.srvX1+L.head,L.routeY,'var(--accent)',2,true);
    g += line(L.nmX0,rowY(3)+L.rowH/2,L.nmX0,L.routeY,'var(--accent)',2,true);
    g += '<polygon points="'+tri(L.srvX1,L.routeY,'left')+'" fill="var(--accent)"/>';
    g += txt((L.srvX1+L.nmX0)/2,L.routeY,0,16,'маршрут по имени в нужный PID','middle','acc',12);

    /* легенда */
    g += txt(L.srvX0,L.leg1,0,0,'Вверх: 3 + 2 + 2 = 7 строк склеиваются в один список; из имени не видно, из какой трубы оно приехало.','start','mut',12);
    g += txt(L.srvX0,L.leg2,0,0,'Вниз: одно имя расклеивается обратно в один процесс — notes/search и files/search ведут в разные подвалы.','start','mut',12);

    host.innerHTML = '<svg viewBox="0 0 700 490" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="Три сессии на 3, 2 и 2 инструмента сливаются в плоский список из семи имён; совпавшее имя search разведено префиксами notes/search и files/search, а стрелка маршрутизации ведёт от имени к PID нужной сессии.">'+g+'</svg>';
  }catch(e){
    host.innerHTML = '<p class="fb">Схема должна была показать: три сессии слева — <b>notes</b> (3 инструмента), '+
      '<b>files</b> (2), <b>github</b> (2) — отдают наверх один плоский список из <b>7</b> имён. '+
      'Совпавшее имя <code>search</code> разведено префиксом: <code>notes/search</code> и <code>files/search</code> '+
      'стоят соседними строками. Обратная стрелка идёт от имени <code>files/search</code> к PID сессии <b>files</b>: '+
      'префикс — тот шов, по которому склейку разбирают назад.</p>';
  }
})();
</script>
</html>
