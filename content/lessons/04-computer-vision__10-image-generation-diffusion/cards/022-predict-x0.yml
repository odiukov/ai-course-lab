- concept: тензорная реализация сохраняет устройство данных и векторную обработку батча
  question: Почему внутри predict_x0 не следует преобразовывать коэффициенты расписания в числа Python или массивы NumPy?
  explanation: Операции PyTorch над тензорами выполняются на их текущем устройстве и сразу обрабатывают батч. Вызовы вроде item() создают скаляр Python и могут синхронизировать GPU, а преобразование в NumPy обычно требует переноса на CPU.
  kind: open
  reference: Такие преобразования выводят вычисления из тензорного графа, могут потребовать переноса данных на CPU и синхронизации с ускорителем, а также мешают обрабатывать весь батч одной векторной операцией. Коэффициенты следует оставлять тензорами на том же устройстве, что и изображения.
