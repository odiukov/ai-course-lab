- concept: детерминированный DDIM-сэмплер воспроизводит результат при одинаковых входных условиях
  question: Детерминированный DDIM-сэмплер дважды запускают с одинаковым начальным шумом, условием генерации, расписанием шагов и весами модели. Что ожидается на выходе?
  explanation: В детерминированном варианте DDIM обратные обновления однозначно определяются текущим состоянием и предсказанием модели. Поэтому при одинаковом начальном шуме и остальных настройках получается та же траектория.
  kind: choice
  options:
    - Разные изображения, потому что на каждом обратном переходе обязательно добавляется свежий шум
    - Одинаковые изображения, потому что при фиксированных входах обратная траектория не содержит случайных переходов
    - Одинаковые изображения только после дополнительного обучения модели
    - Разные изображения, потому что пропущенные временные шаги выбираются случайно
  correct: 1
  id: 037-ddim-bez-pereobucheniya-1
  fingerprint: e1b93c71
- concept: время диффузионной генерации приблизительно пропорционально числу вызовов денойзера
  question: Один сэмплер вызывает U-Net 840 раз, а другой — 35 раз. Если стоимость одного вызова одинакова и доминирует во времени генерации, во сколько раз второй сэмплер быстрее?
  explanation: 'Ускорение приблизительно равно отношению числа вызовов: 840 / 35 = 24. DDIM ускоряет именно генерацию, сокращая число обращений к той же обученной модели.'
  kind: numeric
  answer: 24
  tolerance: 0.01
  id: 037-ddim-bez-pereobucheniya-2
