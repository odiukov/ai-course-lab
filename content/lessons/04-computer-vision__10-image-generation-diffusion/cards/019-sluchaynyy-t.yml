- concept: временное условие позволяет одной сети выбирать подходящую стратегию удаления шума для текущего уровня зашумления
  question: Объясни своими словами, зачем DDPM передаёт нейросети временной шаг t вместе с зашумлённым изображением x_t.
  explanation: Распределение x_t и требуемая величина коррекции меняются с t. Без временного условия сеть не знает, к какому уровню шума относится вход; с ним одна и та же сеть реализует семейство денойзеров для разных t.
  kind: open
  reference: Временной шаг сообщает сети уровень зашумления и соответствующие коэффициенты процесса. Благодаря этому одна условная модель может по-разному обрабатывать слабо и сильно зашумлённые входы, обучаясь работать на всём расписании.
