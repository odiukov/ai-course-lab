- concept: согласованные коэффициенты сигнала и шума сохраняют стандартное нормальное распределение
  question: Пусть x_(t−1) и независимый шум ε имеют распределение N(0, I). Какое распределение имеет x_t = √(1−β_t)x_(t−1) + √β_t ε при допустимом β_t?
  explanation: Сумма независимых гауссовых величин остаётся гауссовой. Её среднее равно нулю, а дисперсия составляет (1−β_t)I + β_t I = I, поэтому стандартный гауссов шум остаётся стандартным.
  kind: choice
  options:
    - N(0, I)
    - Гауссово распределение с дисперсией (1+β_t)I
    - Гауссово распределение со средним β_t
    - Распределение перестаёт быть гауссовым
