- concept: чистый финиш DDIM задаётся граничным состоянием вне таблицы расписания
  question: Почему после наименьшего табличного временного шага DDIM-сэмплеру нужно перейти в отдельное виртуальное чистое состояние, а не просто завершить вычисление на первом элементе массива накопленных коэффициентов?
  explanation: 'В `alphas_cumprod[0]` коэффициент лишь близок к 1, поэтому в результате остаётся шум первого перехода. Служебный `-1` заставляет взять `a_prev = 1`: тогда `sigma = 0`, `dir_xt = 0`, и последнее обновление возвращает ровно `x0_pred`.'
  kind: open
  reference: Первый элемент массива всё ещё описывает изображение с небольшой остаточной порцией шума. Для математически чистого состояния накопленный коэффициент сигнала задают равным единице; тогда случайная и направляющая шумовые составляющие последнего обновления исчезают, а результат становится равен предсказанию чистого изображения.
  id: 038-redkoe-raspisanie-ddim-2
