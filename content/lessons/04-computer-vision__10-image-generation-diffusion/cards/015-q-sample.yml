- concept: единичные пространственные оси обеспечивают корректное broadcasting коэффициента по каналам и пикселям отдельного изображения
  question: После выбора из расписания коэффициенты имеют только ось батча, а изображения — оси батча, каналов, высоты и ширины. Как нужно изменить форму коэффициентов перед умножением и почему?
  explanation: Broadcasting сопоставляет оси справа налево. Без дополнительных единичных осей батчевая ось коэффициентов могла бы сопоставиться с пространственной осью изображения или вызвать ошибку размеров.
  kind: open
  reference: Нужно сохранить ось батча и добавить единичные оси для каналов, высоты и ширины. Тогда broadcasting распространит коэффициент каждого элемента батча только по каналам и пикселям соответствующего изображения.
  id: 015-q-sample-2
  fingerprint: fbeeca1a
