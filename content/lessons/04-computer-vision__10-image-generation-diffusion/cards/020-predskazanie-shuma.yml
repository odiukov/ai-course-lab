- concept: сэмплированный при зашумлении epsilon служит точной целевой меткой для обучения предсказателя шума
  question: Почему обучение предсказанию шума в диффузионной модели является обычной задачей обучения с учителем, хотя шум случаен?
  explanation: При создании x_t алгоритм сам сэмплирует epsilon и сохраняет его. Поэтому пара (x_t, t) становится входом, а именно использованный epsilon — точной целевой меткой.
  kind: choice
  options:
    - Конкретная реализация шума известна, поскольку она была сэмплирована для построения входа x_t
    - Сеть может однозначно вычислить шум по номеру временного шага без изображения
    - Для любого изображения на данном временном шаге используется одна и та же реализация шума
    - Целевой шум заранее размечают эксперты
  correct: 0
  id: 020-predskazanie-shuma-1
  fingerprint: d7eeccc7
- concept: MSE предсказателя шума равна среднему квадратов покомпонентных ошибок
  question: Для трёх элементов истинный шум равен [0.6, -0.2, 1.1], а сеть предсказала [0.2, 0.1, 0.5]. Чему равна MSE?
  explanation: 'Покомпонентные ошибки равны 0.4, -0.3 и 0.6. Среднее их квадратов: (0.16 + 0.09 + 0.36) / 3 = 0.2033.'
  kind: numeric
  answer: 0.2033
  tolerance: 0.0001
