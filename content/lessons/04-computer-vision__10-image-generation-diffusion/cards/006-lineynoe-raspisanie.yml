- concept: beta_t одновременно задаёт ослабление сигнала и дисперсию нового шума на конкретном шаге
  question: Переход прямого диффузионного процесса задан как q(x_s | x_{s−1}) = N(√(1−β_s) x_{s−1}, β_s I). Что произойдёт при увеличении β_s?
  explanation: При росте β_s множитель √(1−β_s) уменьшается, поэтому от предыдущего изображения сохраняется меньше сигнала. Одновременно ковариация β_s I растёт, и новый шум становится сильнее.
  kind: choice
  options:
    - Сигнал сохранится сильнее, а дисперсия шума уменьшится
    - Сигнал ослабнет сильнее, а дисперсия добавляемого шума увеличится
    - Изменится только номер шага, но не распределение
    - Среднее станет равным чистому шуму независимо от x_{s−1}
  correct: 1
  id: 006-lineynoe-raspisanie-1
  fingerprint: 208e2e73
- concept: beta_t является дисперсией шума, а его стандартное отклонение равно квадратному корню из beta_t
  question: На некотором шаге β_s = 0.0081. Каково стандартное отклонение независимо добавляемого гауссова шума в каждой компоненте?
  explanation: Ковариация шума равна β_s I, поэтому дисперсия каждой компоненты составляет β_s, а стандартное отклонение — √β_s. Здесь √0.0081 = 0.09.
  kind: numeric
  answer: 0.09
  tolerance: 0.001
  id: 006-lineynoe-raspisanie-2
  fingerprint: e92b105d
- concept: множество малых порций шума постепенно уничтожает исходный сигнал
  question: Объясни своими словами, почему прямой диффузионный процесс использует много небольших значений β_s, хотя каждая отдельная порция шума меняет изображение совсем слабо.
  explanation: Beta schedule управляет постепенной порчей изображения. Даже если каждый β_s мал, повторяющееся ослабление сигнала и накопление независимого шума со временем делают шум доминирующим.
  kind: open
  reference: 'Малые значения β_s делают соседние состояния близкими: на каждом переходе сохраняется большая часть сигнала и добавляется лишь немного шума. Однако ослабление сигнала и шум накапливаются, поэтому после множества переходов исходное изображение почти исчезает и распределение приближается к гауссову шуму.'
  id: 006-lineynoe-raspisanie-3
