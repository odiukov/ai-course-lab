- concept: при диффузионном сэмплировании каждый шаг обновляет всё изображение, а не отдельную область
  question: Объясни своими словами, почему постепенное появление крупных форм, а затем деталей не означает, что диффузионная модель рисует изображение по отдельным областям.
  explanation: Диффузионный процесс глобально изменяет текущий образ на каждом шаге. Различие между ранними крупными формами и поздними деталями связано со степенью определённости изображения, а не с обработкой отдельных областей по очереди.
  kind: open
  reference: На каждом шаге модель оценивает шум и обновляет всё текущее изображение. Общая структура обычно становится определённой раньше мелких деталей, но это результат последовательного уточнения единого изображения, а не рисования фона, объектов и деталей по очереди.
