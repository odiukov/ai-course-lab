- concept: предсказанный шум нужно преобразовать в однократное обратное обновление с учётом расписания
  question: Почему обратный шаг диффузии обычно нельзя выполнить простым вычитанием всего предсказанного шума из текущего состояния?
  explanation: Полное вычитание игнорирует масштаб конкретного перехода. Расписание определяет, насколько изменить сигнал за одну итерацию, поэтому оценка шума служит входом в математическую формулу обратного перехода, а не готовой поправкой.
  kind: open
  reference: Предсказание epsilon оценивает шумовую составляющую текущего состояния, но обратный шаг должен удалить лишь долю, соответствующую одному переходу расписания. Поэтому коэффициенты расписания преобразуют оценку шума в корректное среднее менее зашумлённого состояния; при вероятностном сэмплировании также учитывается дисперсия перехода.
  id: 030-obratnyy-process-2
