- concept: пространственная маска разделяет изменяемые и сохраняемые области при диффузионной дорисовке
  question: Объясни своими словами, как маска позволяет диффузионной модели изменить выбранную область изображения, сохранив содержимое за её пределами.
  explanation: 'Маска задаёт пространственное ограничение на протяжении всего сэмплирования: внутри неё разрешена генерация нового содержимого, а снаружи поддерживается соответствие исходному изображению.'
  kind: open
  reference: На каждом шаге расшумления маска указывает, где модель может принимать сгенерированные изменения, а где промежуточное состояние нужно согласовывать с исходным изображением. Поэтому новая область постепенно дорисовывается, а пиксели вне маски остаются привязаны к оригиналу.
