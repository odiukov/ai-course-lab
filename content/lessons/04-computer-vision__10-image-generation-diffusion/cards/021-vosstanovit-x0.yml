- concept: оценка чистого изображения получается алгебраическим обращением смеси сигнала и шума
  question: Пусть зашумлённое изображение описывается как x_t = s_t x_clean + n_t ε, а модель предсказывает шум ε̂. Какая формула оценивает x_clean?
  explanation: Сначала из x_t вычитают оценённый вклад шума n_t ε̂. Оставшаяся величина равна ослабленному чистому сигналу, поэтому её делят на s_t. В диффузионной записи s_t = √ᾱ_t, а n_t = √(1 − ᾱ_t).
  kind: choice
  options:
    - (x_t − n_t ε̂) / s_t
    - (x_t − s_t ε̂) / n_t
    - s_t x_t − n_t ε̂
  correct: 0
  id: 021-vosstanovit-x0-1
  fingerprint: 5d056e39
- concept: ошибка предсказания шума усиливается при восстановлении изображения на шагах с малой долей сигнала
  question: Объясни своими словами, почему небольшая ошибка предсказателя шума может заметно исказить оценку чистого изображения при очень сильном зашумлении.
  explanation: В формуле x̂₀ = (x_t − √(1 − ᾱ_t) ε̂) / √ᾱ_t ошибка модели также делится на √ᾱ_t. Чем меньше ᾱ_t, тем сильнее неточность предсказанного шума влияет на x̂₀.
  kind: open
  reference: Если ε̂ = ε + δ, то ошибка оценки чистого изображения равна −(n_t / s_t)δ. При сильном зашумлении коэффициент сигнала s_t мал, поэтому деление на него усиливает ошибку δ.
  id: 021-vosstanovit-x0-2
  fingerprint: 0340a505
