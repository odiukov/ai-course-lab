<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Какие точки штрафует epsilon-труба</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #596579;
      --tube: #e8f1ff;
      --boundary: #5882c6;
      --prediction: #263c66;
      --safe: #16845b;
      --safe-soft: #dff5ea;
      --penalty: #d64b4b;
      --penalty-soft: #fde7e7;
      --guide: #9ca7b8;
      --border: #d7dfeb;
      --shadow: rgba(31, 49, 82, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192231;
        --ink: #edf2fb;
        --muted: #aeb9cb;
        --tube: #203552;
        --boundary: #79a6ea;
        --prediction: #d5e3ff;
        --safe: #55d49e;
        --safe-soft: #183d32;
        --penalty: #ff7c7c;
        --penalty-soft: #4a2529;
        --guide: #77849a;
        --border: #344258;
        --shadow: rgba(0, 0, 0, 0.24);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    .figure {
      width: min(100%, 1040px);
      margin: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 28px var(--shadow);
    }

    h2 {
      margin: 0;
      padding: 18px 22px 4px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: bold;
    }

    .lead {
      margin: 0;
      padding: 4px 22px 8px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .tube {
      fill: var(--tube);
    }

    .boundary {
      stroke: var(--boundary);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .prediction {
      stroke: var(--prediction);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .error-safe {
      stroke: var(--safe);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .error-full {
      stroke: var(--guide);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .penalty-part {
      stroke: var(--penalty);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .measure-safe {
      stroke: var(--safe);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .measure-penalty {
      stroke: var(--penalty);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .measure-epsilon {
      stroke: var(--boundary);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .halo-safe {
      fill: var(--safe-soft);
      stroke: var(--safe);
      stroke-width: 2;
    }

    .halo-penalty {
      fill: var(--penalty-soft);
      stroke: var(--penalty);
      stroke-width: 2;
    }

    .point-safe {
      fill: var(--safe);
      stroke: var(--panel);
      stroke-width: 3;
    }

    .point-penalty {
      fill: var(--penalty);
      stroke: var(--panel);
      stroke-width: 3;
    }

    text {
      fill: var(--ink);
      font-size: 15px;
    }

    .diagram-title {
      font-size: 18px;
      font-weight: bold;
    }

    .line-label {
      font-size: 14px;
      font-weight: bold;
    }

    .muted-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .safe-label {
      fill: var(--safe);
      font-size: 14px;
      font-weight: bold;
    }

    .penalty-label {
      fill: var(--penalty);
      font-size: 14px;
      font-weight: bold;
    }

    .point-label {
      font-size: 15px;
      font-weight: bold;
    }

    .legend-label {
      font-size: 14px;
    }

    .fallback {
      margin: 16px 22px 22px;
      padding: 14px 16px;
      color: var(--ink);
      background: var(--tube);
      border: 1px solid var(--boundary);
      border-radius: 10px;
      font-size: 15px;
      line-height: 1.45;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-heading">
    <h2 id="figure-heading">Какие точки штрафует ε-труба</h2>
    <p class="lead">Штрафуется не вся ошибка, а только часть за границей допустимой зоны.</p>

    <svg id="diagram"
         viewBox="0 0 960 380"
         width="960"
         height="380"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение точек внутри и снаружи epsilon-трубы</title>
      <desc id="svg-desc">
        При прогнозе 10,0 и epsilon 0,5 точка 10,3 находится внутри трубы
        и не штрафуется. Точка 10,9 находится снаружи, а штраф равен 0,4.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать линию прогноза 10,0, границы ε-трубы при
      ε = 0,5, точку с ошибкой 0,3 без штрафа и точку с ошибкой 0,9,
      у которой штрафуется только превышение 0,4.
    </p>
  </figure>

  <script>
    "use strict";

    const data = [{
      zero: 0,
      plot: {
        left: 0.35,
        right: 8.45,
        headingX: 4.4,
        headingY: 1.25,
        legendY: -0.68
      },
      tube: {
        low: -0.5,
        high: 0.5,
        epsilonX: 1.02,
        epsilonTextX: 1.18,
        labelX: 8.36
      },
      pointRadius: 0.075,
      haloRadius: 0.13,
      capHalf: 0.07,
      inside: {
        x: 2.58,
        error: 0.3,
        truth: "истинное значение 10,3",
        errorLabel: "ошибка 0,3",
        penaltyLabel: "штраф = 0",
        measureX: 2.18,
        errorTextX: 2.02,
        errorTextY: 0.15,
        penaltyTextY: -0.12
      },
      outside: {
        x: 6.05,
        error: 0.9,
        truth: "истинное значение 10,9",
        errorLabel: "ошибка 0,9",
        penaltyLabel: "штраф = 0,4",
        measureX: 6.46,
        penaltyTextX: 6.62,
        penaltyTextY: 0.7,
        errorTextX: 5.78,
        errorTextY: 0.22
      },
      legend: {
        safeX: 0.82,
        safeTextX: 1.02,
        penaltyX: 4.62,
        penaltyTextX: 4.82
      }
    }];

    const origin = { x: 70, y: 246 };
    const scale = { x: 100, y: 160 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const [model] = data;
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, parent = drawing) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const line = (from, to, className, parent = drawing) => make("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className
      }, parent);

      const label = (point, content, className, anchor, dx, dy, parent = drawing) => {
        const node = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          class: className,
          "text-anchor": anchor,
          dx: dx,
          dy: dy
        }, parent);
        node.textContent = content;
        return node;
      };

      const circle = (point, radius, className, parent = drawing) => make("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: Math.abs(sx(radius) - sx(model.zero)),
        class: className
      }, parent);

      const cap = (x, y, half, className, parent = drawing) => line(
        { x: x - half, y: y },
        { x: x + half, y: y },
        className,
        parent
      );

      const tubePath = [
        "M", sx(model.plot.left), sy(model.tube.high),
        "L", sx(model.plot.right), sy(model.tube.high),
        "L", sx(model.plot.right), sy(model.tube.low),
        "L", sx(model.plot.left), sy(model.tube.low),
        "Z"
      ].join(" ");

      make("path", { d: tubePath, class: "tube" });

      label(
        { x: model.plot.headingX, y: model.plot.headingY },
        "ε-труба отделяет допустимые промахи от штрафуемых",
        "diagram-title",
        "middle",
        0,
        0
      );

      line(
        { x: model.plot.left, y: model.tube.high },
        { x: model.plot.right, y: model.tube.high },
        "boundary"
      );

      line(
        { x: model.plot.left, y: model.tube.low },
        { x: model.plot.right, y: model.tube.low },
        "boundary"
      );

      line(
        { x: model.plot.left, y: model.zero },
        { x: model.plot.right, y: model.zero },
        "prediction"
      );

      label(
        { x: model.tube.labelX, y: model.tube.high },
        "верхняя граница трубы",
        "muted-label",
        "end",
        0,
        -9
      );

      label(
        { x: model.tube.labelX, y: model.zero },
        "линия прогноза 10,0",
        "line-label",
        "end",
        0,
        -9
      );

      label(
        { x: model.tube.labelX, y: model.tube.low },
        "нижняя граница трубы",
        "muted-label",
        "end",
        0,
        19
      );

      line(
        { x: model.tube.epsilonX, y: model.zero },
        { x: model.tube.epsilonX, y: model.tube.high },
        "measure-epsilon"
      );

      cap(
        model.tube.epsilonX,
        model.zero,
        model.capHalf,
        "measure-epsilon"
      );

      cap(
        model.tube.epsilonX,
        model.tube.high,
        model.capHalf,
        "measure-epsilon"
      );

      label(
        {
          x: model.tube.epsilonTextX,
          y: (model.zero + model.tube.high) / (model.tube.high / model.tube.high + model.tube.high / model.tube.high)
        },
        "ε = 0,5",
        "line-label",
        "start",
        8,
        5
      );

      line(
        { x: model.inside.x, y: model.zero },
        { x: model.inside.x, y: model.inside.error },
        "error-safe"
      );

      line(
        { x: model.inside.measureX, y: model.zero },
        { x: model.inside.measureX, y: model.inside.error },
        "measure-safe"
      );

      cap(
        model.inside.measureX,
        model.zero,
        model.capHalf,
        "measure-safe"
      );

      cap(
        model.inside.measureX,
        model.inside.error,
        model.capHalf,
        "measure-safe"
      );

      circle(
        { x: model.inside.x, y: model.inside.error },
        model.haloRadius,
        "halo-safe"
      );

      circle(
        { x: model.inside.x, y: model.inside.error },
        model.pointRadius,
        "point-safe"
      );

      label(
        { x: model.inside.x, y: model.inside.error },
        model.inside.truth,
        "point-label",
        "middle",
        0,
        -16
      );

      label(
        { x: model.inside.errorTextX, y: model.inside.errorTextY },
        model.inside.errorLabel,
        "safe-label",
        "end",
        -8,
        5
      );

      label(
        { x: model.inside.x, y: model.inside.penaltyTextY },
        model.inside.penaltyLabel,
        "safe-label",
        "middle",
        0,
        18
      );

      line(
        { x: model.outside.x, y: model.zero },
        { x: model.outside.x, y: model.outside.error },
        "error-full"
      );

      line(
        { x: model.outside.x, y: model.tube.high },
        { x: model.outside.x, y: model.outside.error },
        "penalty-part"
      );

      line(
        { x: model.outside.measureX, y: model.tube.high },
        { x: model.outside.measureX, y: model.outside.error },
        "measure-penalty"
      );

      cap(
        model.outside.measureX,
        model.tube.high,
        model.capHalf,
        "measure-penalty"
      );

      cap(
        model.outside.measureX,
        model.outside.error,
        model.capHalf,
        "measure-penalty"
      );

      circle(
        { x: model.outside.x, y: model.outside.error },
        model.haloRadius,
        "halo-penalty"
      );

      circle(
        { x: model.outside.x, y: model.outside.error },
        model.pointRadius,
        "point-penalty"
      );

      label(
        { x: model.outside.x, y: model.outside.error },
        model.outside.truth,
        "point-label",
        "middle",
        0,
        -16
      );

      label(
        { x: model.outside.errorTextX, y: model.outside.errorTextY },
        model.outside.errorLabel,
        "muted-label",
        "end",
        -8,
        5
      );

      label(
        { x: model.outside.penaltyTextX, y: model.outside.penaltyTextY },
        model.outside.penaltyLabel,
        "penalty-label",
        "start",
        8,
        5
      );

      circle(
        { x: model.legend.safeX, y: model.plot.legendY },
        model.pointRadius,
        "point-safe"
      );

      label(
        { x: model.legend.safeTextX, y: model.plot.legendY },
        "внутри трубы → штраф 0",
        "legend-label",
        "start",
        8,
        5
      );

      circle(
        { x: model.legend.penaltyX, y: model.plot.legendY },
        model.pointRadius,
        "point-penalty"
      );

      label(
        { x: model.legend.penaltyTextX, y: model.plot.legendY },
        "снаружи → штрафуется только превышение",
        "legend-label",
        "start",
        8,
        5
      );

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
