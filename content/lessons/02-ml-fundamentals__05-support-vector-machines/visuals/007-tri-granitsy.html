<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Граница решения и две стороны margin</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: ivory;
      --text: midnightblue;
      --muted: slategray;
      --axis: lightslategray;
      --margin-line: royalblue;
      --boundary-line: darkorange;
      --margin-band: aliceblue;
      --measure: steelblue;
      --negative: crimson;
      --positive: mediumblue;
      --point-stroke: ivory;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: midnightblue;
        --text: whitesmoke;
        --muted: lightsteelblue;
        --axis: lightslategray;
        --margin-line: lightskyblue;
        --boundary-line: gold;
        --margin-band: darkslateblue;
        --measure: lightsteelblue;
        --negative: lightcoral;
        --positive: deepskyblue;
        --point-stroke: midnightblue;
      }
    }

    html,
    body {
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .diagram {
      width: 100%;
      background: var(--background);
    }

    .diagram h1 {
      font-size: 24px;
      text-align: center;
      font-weight: bold;
    }

    .diagram svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--background);
    }

    .margin-band {
      fill: var(--margin-band);
    }

    .axis,
    .tick {
      stroke: var(--axis);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .margin-line {
      stroke: var(--margin-line);
      stroke-width: 4px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .boundary-line {
      stroke: var(--boundary-line);
      stroke-width: 6px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .measure,
    .measure-cap {
      stroke: var(--measure);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
    }

    .point-negative {
      fill: var(--negative);
      stroke: var(--point-stroke);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .point-positive {
      fill: var(--positive);
      stroke: var(--point-stroke);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .label,
    .tick-label,
    .measure-label,
    .region-label,
    .formula-label {
      fill: var(--text);
      paint-order: stroke fill;
      stroke: var(--background);
      stroke-width: 5px;
      stroke-linejoin: round;
      font-family: inherit;
      dominant-baseline: middle;
    }

    .label {
      font-size: 18px;
      font-weight: bold;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 18px;
    }

    .measure-label {
      fill: var(--measure);
      font-size: 20px;
      font-weight: bold;
    }

    .region-label {
      font-size: 18px;
      font-weight: bold;
    }

    .region-negative {
      fill: var(--negative);
    }

    .region-positive {
      fill: var(--positive);
    }

    .formula-label {
      fill: var(--muted);
      font-size: 16px;
    }

    .fallback {
      font-size: 18px;
      text-align: center;
      background: var(--background);
      color: var(--text);
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <h1 id="diagram-title">Граница решения и две стороны margin</h1>

    <svg
      id="margin-diagram"
      viewBox="0 0 960 470"
      width="960"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Три параллельные вертикальные линии: margin при x равном минус единице,
        decision boundary при x равном нулю и margin при x равном единице.
        Полный margin состоит из двух равных расстояний d.
      </desc>
    </svg>

    <p id="diagram-fallback" class="fallback">
      Схема должна показать центральную decision boundary при x = 0,
      две границы margin при x = −1 и x = 1 и равные расстояния d по обе стороны.
    </p>
  </figure>

  <script>
    const data = Object.freeze({
      zero: 0,
      origin: Object.freeze({ x: 480, y: 225 }),
      scale: 150,
      domain: Object.freeze({
        left: -2.8,
        right: 2.8,
        top: 1.35,
        bottom: -1.45
      }),
      lineTop: 0.95,
      lineBottom: -0.75,
      axisY: -0.8,
      axisLeft: -2.55,
      axisRight: 2.55,
      tickTop: -0.75,
      tickBottom: -0.87,
      tickLabelY: -0.96,
      halfMeasureY: 0.55,
      halfCapTop: 0.63,
      halfCapBottom: 0.47,
      halfLabelY: 0.7,
      fullMeasureY: -1.1,
      fullCapTop: -1.02,
      fullCapBottom: -1.18,
      fullLabelY: -1.28,
      pointRadius: 0.055,
      labelPad: 12,
      lines: Object.freeze([
        Object.freeze({
          x: -1,
          className: "margin-line",
          label: "margin: x = −1",
          labelX: -1,
          labelY: 1.1,
          dx: -12,
          anchor: "end"
        }),
        Object.freeze({
          x: 0,
          className: "boundary-line",
          label: "decision boundary: x = 0",
          labelX: 0,
          labelY: 1.1,
          dx: 0,
          anchor: "middle"
        }),
        Object.freeze({
          x: 1,
          className: "margin-line",
          label: "margin: x = 1",
          labelX: 1,
          labelY: 1.1,
          dx: 12,
          anchor: "start"
        })
      ]),
      ticks: Object.freeze([
        Object.freeze({ x: -1, text: "−1" }),
        Object.freeze({ x: 0, text: "0" }),
        Object.freeze({ x: 1, text: "1" })
      ]),
      points: Object.freeze([
        Object.freeze({
          x: -1,
          y: -0.25,
          className: "point-negative",
          label: "ближайшая точка класса −1",
          dx: -12,
          anchor: "end"
        }),
        Object.freeze({
          x: 1,
          y: -0.25,
          className: "point-positive",
          label: "ближайшая точка класса +1",
          dx: 12,
          anchor: "start"
        })
      ]),
      regions: Object.freeze([
        Object.freeze({
          x: -1.75,
          y: 0.05,
          label: "отрицательный балл → класс −1",
          className: "region-label region-negative"
        }),
        Object.freeze({
          x: 1.75,
          y: 0.05,
          label: "положительный балл → класс +1",
          className: "region-label region-positive"
        })
      ]),
      halves: Object.freeze([
        Object.freeze({ left: -1, right: 0, middle: -0.5 }),
        Object.freeze({ left: 0, right: 1, middle: 0.5 })
      ]),
      formula: Object.freeze({
        x: -2.55,
        y: -1.28,
        text: "w = [1, 0], b = 0"
      }),
      axisLabel: Object.freeze({
        x: 2.55,
        y: -0.8,
        dx: 12,
        text: "x"
      })
    });

    const origin = data.origin;
    const scale = data.scale;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    const svg = document.getElementById("margin-diagram");
    const fallback = document.getElementById("diagram-fallback");

    try {
      const description = document.getElementById("diagram-description");
      svg.replaceChildren(description);

      const make = (name, attributes, text) => {
        const node = document.createElementNS(svg.namespaceURI, name);

        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });

        if (text !== undefined) {
          node.textContent = text;
        }

        return node;
      };

      const group = (className) => {
        const node = make("g", { class: className });
        svg.appendChild(node);
        return node;
      };

      const drawLine = (parent, start, end, className) => {
        parent.appendChild(make("line", {
          x1: sx(start.x),
          y1: sy(start.y),
          x2: sx(end.x),
          y2: sy(end.y),
          class: className
        }));
      };

      const drawText = (parent, label) => {
        parent.appendChild(make("text", {
          x: sx(label.x) + (label.dx || data.zero),
          y: sy(label.y) + (label.dy || data.zero),
          class: label.className,
          "text-anchor": label.anchor || "middle"
        }, label.text));
      };

      const bandLayer = group("band-layer");
      bandLayer.appendChild(make("rect", {
        x: sx(-1),
        y: sy(data.lineTop),
        width: sx(1) - sx(-1),
        height: sy(data.lineBottom) - sy(data.lineTop),
        class: "margin-band"
      }));

      const measureLayer = group("measure-layer");

      data.halves.forEach((half) => {
        drawLine(
          measureLayer,
          { x: half.left, y: data.halfMeasureY },
          { x: half.right, y: data.halfMeasureY },
          "measure"
        );

        drawLine(
          measureLayer,
          { x: half.left, y: data.halfCapTop },
          { x: half.left, y: data.halfCapBottom },
          "measure-cap"
        );

        drawLine(
          measureLayer,
          { x: half.right, y: data.halfCapTop },
          { x: half.right, y: data.halfCapBottom },
          "measure-cap"
        );

        drawText(measureLayer, {
          x: half.middle,
          y: data.halfLabelY,
          text: "d",
          className: "measure-label",
          anchor: "middle"
        });
      });

      const lineLayer = group("boundary-layer");

      data.lines.forEach((item) => {
        drawLine(
          lineLayer,
          { x: item.x, y: data.lineTop },
          { x: item.x, y: data.lineBottom },
          item.className
        );
      });

      const regionLayer = group("region-layer");

      data.regions.forEach((item) => {
        drawText(regionLayer, {
          x: item.x,
          y: item.y,
          text: item.label,
          className: item.className,
          anchor: "middle"
        });
      });

      const pointLayer = group("point-layer");

      data.points.forEach((point) => {
        pointLayer.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: Math.abs(sx(data.pointRadius) - sx(data.zero)),
          class: point.className
        }));

        drawText(pointLayer, {
          x: point.x,
          y: point.y,
          dx: point.dx,
          text: point.label,
          className: "formula-label",
          anchor: point.anchor
        });
      });

      const axisLayer = group("axis-layer");

      drawLine(
        axisLayer,
        { x: data.axisLeft, y: data.axisY },
        { x: data.axisRight, y: data.axisY },
        "axis"
      );

      data.ticks.forEach((tick) => {
        drawLine(
          axisLayer,
          { x: tick.x, y: data.tickTop },
          { x: tick.x, y: data.tickBottom },
          "tick"
        );

        drawText(axisLayer, {
          x: tick.x,
          y: data.tickLabelY,
          text: tick.text,
          className: "tick-label",
          anchor: "middle"
        });
      });

      drawText(axisLayer, {
        x: data.axisLabel.x,
        y: data.axisLabel.y,
        dx: data.axisLabel.dx,
        text: data.axisLabel.text,
        className: "tick-label",
        anchor: "start"
      });

      const fullMeasureLayer = group("full-measure-layer");

      drawLine(
        fullMeasureLayer,
        { x: -1, y: data.fullMeasureY },
        { x: 1, y: data.fullMeasureY },
        "measure"
      );

      drawLine(
        fullMeasureLayer,
        { x: -1, y: data.fullCapTop },
        { x: -1, y: data.fullCapBottom },
        "measure-cap"
      );

      drawLine(
        fullMeasureLayer,
        { x: 1, y: data.fullCapTop },
        { x: 1, y: data.fullCapBottom },
        "measure-cap"
      );

      drawText(fullMeasureLayer, {
        x: 0,
        y: data.fullLabelY,
        text: "полный margin: M = 2d",
        className: "measure-label",
        anchor: "middle"
      });

      const labelLayer = group("label-layer");

      data.lines.forEach((item) => {
        drawText(labelLayer, {
          x: item.labelX,
          y: item.labelY,
          dx: item.dx,
          text: item.label,
          className: "label",
          anchor: item.anchor
        });
      });

      drawText(labelLayer, {
        x: data.formula.x,
        y: data.formula.y,
        text: data.formula.text,
        className: "formula-label",
        anchor: "start"
      });

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
