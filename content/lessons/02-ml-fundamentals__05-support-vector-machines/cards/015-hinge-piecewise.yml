- concept: hinge loss обнуляет вклад правильно классифицированных точек за пределами margin
  question: Точка классифицирована правильно и находится за канонической границей margin. Что произойдёт с её hinge loss, если модель отодвинет точку ещё дальше в правильную сторону?
  explanation: При y·f(x) ≥ 1 выражение max(0, 1 − y·f(x)) равно нулю. Поэтому дальнейшее увеличение правильного балла не изменяет hinge loss.
  kind: choice
  options:
    - Потеря останется нулевой
    - Потеря станет отрицательной
    - Потеря начнёт расти из-за чрезмерного запаса
  correct: 0
  id: 015-hinge-piecewise-1
  fingerprint: 697222c7
- concept: ниже границы margin hinge loss линейно растёт при уменьшении signed score
  question: Объясните своими словами, как меняется hinge loss при уменьшении signed score y·f(x), если точка ещё не достигла требуемой границы margin.
  explanation: Пока y·f(x) < 1, активна линейная часть 1 − y·f(x). Поэтому уменьшение signed score на любую величину увеличивает потерю на ту же величину.
  kind: open
  reference: 'Потеря растёт линейно: одинаковое уменьшение signed score вызывает такое же увеличение hinge loss. Это действует и для правильно классифицированных точек внутри margin, и для ошибочно классифицированных точек.'
  id: 015-hinge-piecewise-2
  fingerprint: ffca53d6
