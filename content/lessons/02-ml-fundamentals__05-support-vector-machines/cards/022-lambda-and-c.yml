- concept: положительное масштабирование всей целевой функции сохраняет множество её минимумов
  question: Объясни своими словами, почему деление всей целевой функции SVM на положительную константу не меняет оптимальные параметры, а изменение коэффициента только одного её слагаемого может их изменить.
  explanation: Именно поэтому всю функцию L можно разделить на λ при переходе к записи через C. Если же изменить только λ или только коэффициент при hinge loss, баланс между малой нормой весов и нарушениями margin изменится.
  kind: open
  reference: Положительное масштабирование всей функции сохраняет порядок её значений для любых наборов параметров, поэтому сохраняются и точки минимума. Изменение коэффициента только одного слагаемого меняет относительный вес регуляризации и ошибок, а значит, может привести к другому минимуму.
  id: 022-lambda-and-c-2
  fingerprint: cc7bb465
