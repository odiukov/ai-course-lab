- concept: zip молча отбрасывает лишние координаты при несовпадении размерностей
  question: Что произойдёт, если реализация RBF-ядра строит попарные разности через zip(x, z), но один вектор длиннее другого, и почему это опасно?
  explanation: В Python zip не требует одинаковой длины последовательностей. Без явной проверки реализация проигнорирует часть признаков, из-за чего рассчитанное расстояние и RBF-сходство будут некорректными.
  kind: open
  reference: zip остановится вместе с более коротким вектором, поэтому лишние координаты будут отброшены без исключения. Ядро вычислится в усечённом пространстве и может вернуть правдоподобное, но неверное значение; размерности следует проверять заранее.
  id: 038-code-rbf-2
  fingerprint: 80ec0144
