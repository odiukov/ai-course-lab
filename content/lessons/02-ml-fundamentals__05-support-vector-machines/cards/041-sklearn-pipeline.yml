- concept: параметры предобработки для проверки модели обучаются только на обучающей выборке
  question: Данные уже разделены на обучающую и тестовую выборки. Как корректно обучить и оценить SVM без утечки данных при масштабировании?
  explanation: Pipeline при fit вычисляет параметры StandardScaler только по X_train. При оценке он преобразует X_test с уже сохранёнными параметрами, поэтому тестовые объекты не влияют на обучение.
  kind: choice
  options:
    - Объединить StandardScaler и SVC в Pipeline, обучить pipeline на X_train и оценить на X_test
    - Обучить StandardScaler на всей таблице, а затем обучить SVC только на X_train
    - Отдельно обучить StandardScaler на X_train и новый StandardScaler на X_test
    - Обучить SVC на X_train без масштабирования, а перед оценкой масштабировать только X_test
  correct: 0
  id: 041-sklearn-pipeline-1
  fingerprint: 5394fc0a
- concept: в кросс-валидации масштабировщик заново обучается внутри каждого разбиения без доступа к проверочной части
  question: Расположите действия для одного разбиения кросс-валидации Pipeline со StandardScaler и SVC в правильном порядке.
  explanation: Проверочная часть не участвует ни в вычислении средних и разбросов, ни в обучении SVC. Для следующего разбиения создаётся и обучается новый экземпляр всего pipeline.
  kind: order
  items:
    - Выделить обучающую и проверочную части текущего разбиения
    - Вычислить параметры StandardScaler по обучающей части
    - Преобразовать обучающую часть найденным масштабировщиком
    - Обучить SVC на преобразованной обучающей части
    - Преобразовать проверочную часть тем же сохранённым масштабировщиком
    - Оценить SVC на преобразованной проверочной части
  id: 041-sklearn-pipeline-2
  fingerprint: 2f2efc93
