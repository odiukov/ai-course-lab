- concept: ядра доступны в SVC, тогда как LinearSVC ограничен линейной моделью
  question: Какое утверждение о LinearSVC и SVC верно?
  explanation: LinearSVC — отдельная реализация линейного SVM без параметра kernel. SVC позволяет выбирать ядро, включая линейное, RBF и полиномиальное, поэтому подходит и для нелинейных границ.
  kind: choice
  options:
    - LinearSVC можно переключить на RBF-ядро параметром kernel
    - SVC поддерживает разные ядра, а LinearSVC строит только линейную границу
    - SVC не умеет строить линейную границу
    - Классы отличаются только значением C по умолчанию
