- concept: полиномиальное ядро подходит как первый кандидат для общей плавно изогнутой границы
  question: Граница между классами явно нелинейна, но выглядит как один общий плавный изгиб, а не как набор отдельных локальных областей. Какое ядро разумно проверить?
  explanation: Полиномиальное ядро — естественный кандидат для общей изогнутой зависимости. RBF особенно полезно, когда важна локальная структура, например отдельные островки или кольца.
  kind: choice
  options:
    - Линейное, поскольку оно способно задать только локальные области
    - Полиномиальное, поскольку оно моделирует общую нелинейную форму
    - RBF, поскольку любая нелинейность обязательно требует локальной границы
  correct: 1
  id: 039-check-kernels-1
  fingerprint: fa7fbe53
- concept: более гибкое ядро не обязательно лучше обобщает на новых данных
  question: Объясните своими словами, почему не стоит автоматически выбирать RBF-ядро для любой нелинейной выборки только из-за его гибкости.
  explanation: Гибкость расширяет множество возможных границ, но вместе с ним растёт риск подгонки под шум. Поэтому у RBF нет гарантированного преимущества перед более простым ядром.
  kind: open
  reference: RBF способно строить сложные локальные границы, поэтому может подстроиться не только под устойчивую структуру классов, но и под случайные особенности обучающей выборки. Ядро следует выбирать по геометрии данных и качеству обобщения, а не по максимальной гибкости.
  id: 039-check-kernels-2
  fingerprint: 39541ae0
