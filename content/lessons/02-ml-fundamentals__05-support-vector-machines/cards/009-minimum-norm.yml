- concept: при канонической нормировке ширина margin обратно пропорциональна норме весов
  question: Два допустимых разделителя удовлетворяют одному и тому же каноническому ограничению жёсткого SVM. Нормы их весов равны 0.6 и 1.8. Во сколько раз margin первого разделителя шире margin второго?
  explanation: 'Общий числитель в формуле ширины сокращается, поэтому отношение ширин равно обратному отношению норм: 1.8 / 0.6 = 3. Разделитель с меньшей нормой имеет более широкий margin.'
  kind: numeric
  answer: 3
  tolerance: 0.03
  id: 009-minimum-norm-1
  fingerprint: c3caa2b4
- concept: положительное масштабирование квадрата нормы не меняет оптимальный допустимый разделитель
  question: Объясни своими словами, почему при неизменных ограничениях SVM минимизацию нормы весов можно заменить минимизацией положительного кратного квадрата нормы.
  explanation: Квадрат нормы — строго возрастающая функция нормы на неотрицательных значениях, а положительный множитель не меняет точку минимума. Такая запись даёт тот же оптимальный разделитель, но более удобна для оптимизации.
  kind: open
  reference: Норма неотрицательна, а возведение неотрицательных значений в квадрат сохраняет их порядок. Умножение всех значений целевой функции на одну положительную константу также сохраняет порядок. Поэтому допустимый вектор весов с наименьшей нормой минимизирует и положительное кратное её квадрата.
  id: 009-minimum-norm-2
  fingerprint: 1eb44ccc
