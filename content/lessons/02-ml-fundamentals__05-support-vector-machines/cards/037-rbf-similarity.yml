- concept: gamma нужно изменять обратно пропорционально квадрату масштаба расстояний, чтобы сохранить значения RBF-ядра
  question: После смены единиц измерения все расстояния между объектами выросли в 6 раз. Изначально gamma равнялась 0.36. Какой должна стать gamma, чтобы значения RBF-ядра для всех пар объектов сохранились?
  explanation: 'RBF-ядро зависит от произведения gamma на квадрат расстояния. При росте расстояний в 6 раз их квадраты растут в 36 раз, поэтому gamma нужно разделить на 36: 0.36 / 36 = 0.01.'
  kind: numeric
  answer: 0.01
  tolerance: 0.0001
