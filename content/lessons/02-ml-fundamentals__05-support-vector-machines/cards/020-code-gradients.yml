- concept: вклад активного объекта в градиенты hinge loss равен минус метке, умноженной на признаки, для весов и минус метке для смещения
  question: Signed margin объекта лежит ниже порога hinge loss. Каков вклад этого объекта в градиенты по весам w и смещению b?
  explanation: На активном участке loss равен 1 − y(w·x + b). Поэтому его градиент по w равен −y·x, а по b — −y.
  kind: choice
  options:
    - 'По w: −y·x, по b: −y'
    - 'По w: y·x, по b: y'
    - 'По w: −y·w, по b: −y·b'
    - 'По w: x, по b: y'
  correct: 0
  id: 020-code-gradients-1
  fingerprint: dd7016ab
- concept: градиент средней hinge loss нормируется размером батча и не меняется при полном дублировании батча
  question: Функция потерь определена как среднее по объектам. Объясните, зачем накопленные градиенты делить на размер батча и что произойдёт с результатом при полном дублировании батча.
  explanation: hinge_loss возвращает среднее значение, поэтому hinge_gradients должна усреднять вклады тем же способом. Без деления масштаб обновления зависел бы от количества повторов одних и тех же данных.
  kind: open
  reference: Деление превращает сумму вкладов объектов в градиент средней потери. При полном дублировании батча одновременно удвоятся сумма градиентов и число объектов, поэтому итоговый средний градиент останется прежним.
  id: 020-code-gradients-2
  fingerprint: 4cc9b054
