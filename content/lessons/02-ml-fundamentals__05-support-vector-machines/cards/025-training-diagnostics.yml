- concept: слишком большой learning rate может вызывать перескакивание через подходящую область параметров и колебания обучения
  question: При обучении линейного SVM последовательными градиентными обновлениями loss то уменьшается, то снова резко возрастает, а параметры не стабилизируются. Какое изменение разумнее проверить первым, если learning rate подозрительно велик?
  explanation: При чрезмерном learning rate обновления могут перелетать через область хороших параметров. Простое добавление эпох не устраняет такие перелёты, поэтому сначала стоит уменьшить размер шага.
  kind: choice
  options:
    - Уменьшить learning rate
    - Увеличить число эпох, сохранив learning rate
    - Ещё сильнее увеличить learning rate
  correct: 0
  id: 025-training-diagnostics-1
  fingerprint: 3dc79fbc
- concept: маленький learning rate замедляет сходимость и обычно требует большего числа эпох
  question: Объясни своими словами, почему неудачная граница линейного SVM после нескольких эпох с очень маленьким learning rate ещё не доказывает, что градиент направлен неверно.
  explanation: Learning rate определяет величину одного обновления, а число эпох — количество полных проходов по выборке. При малом шаге медленный прогресс может быть следствием недостаточного числа обновлений, а не ошибки в их направлении.
  kind: open
  reference: Маленький learning rate создаёт очень небольшие обновления параметров. Градиент может вести модель в подходящем направлении, но нескольких полных проходов по данным недостаточно, поэтому для заметного приближения к решению требуется больше эпох.
  id: 025-training-diagnostics-2
  fingerprint: cf57fbeb
- concept: стабилизация функции потерь служит практическим признаком сходимости обучения
  question: Заполни пропуск в описании практического признака сходимости линейного SVM.
  explanation: Если loss больше не демонстрирует устойчивого заметного снижения, обучение приблизилось к стабильному режиму. Небольшие колебания допустимы при последовательных обновлениях по отдельным объектам.
  kind: cloze
  template: При приближении обучения к устойчивому решению функция потерь со временем ___.
  answer: перестаёт заметно уменьшаться
  accept:
    - выходит на плато
    - стабилизируется
    - почти перестаёт снижаться
  id: 025-training-diagnostics-3
  fingerprint: 6b35a4eb
