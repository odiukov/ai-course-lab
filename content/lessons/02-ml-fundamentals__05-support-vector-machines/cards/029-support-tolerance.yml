- concept: изменение допуска при поиске опорных векторов влияет только на результат их численной идентификации
  question: Для одной обученной SVM дважды выполняют поиск опорных векторов, используя разные значения допуска. Что из перечисленного может различаться между запусками?
  explanation: Допуск применяется после обучения и не меняет параметры модели. Он определяет лишь то, насколько близким к y·f(x) = 1 должно быть вычисленное значение, поэтому меняется только набор найденных индексов.
  kind: choice
  options:
    - Положение разделяющей гиперплоскости
    - Обученные веса и свободный член
    - Индексы точек, признанных опорными векторами
    - Предсказанные классы всех объектов
  correct: 2
