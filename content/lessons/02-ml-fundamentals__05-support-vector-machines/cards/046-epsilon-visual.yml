- concept: epsilon-insensitive loss симметричен относительно знака остатка
  question: У двух наблюдений остатки y − ŷ равны r и −r, причём |r| > ε. Объясни своими словами, как будут соотноситься их epsilon-insensitive штрафы.
  explanation: SVR одинаково обрабатывает завышение и занижение прогноза. Остатки противоположных знаков с одинаковым модулем одинаково выступают за соответствующие стороны epsilon-трубы.
  kind: open
  reference: 'Штрафы будут одинаковыми, потому что функция потерь зависит от модуля остатка: для обоих наблюдений штраф равен |r| − ε. Направление ошибки не влияет на его величину.'
