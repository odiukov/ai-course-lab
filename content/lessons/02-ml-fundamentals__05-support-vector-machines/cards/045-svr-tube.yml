- concept: расширение epsilon-трубы обычно уменьшает число опорных векторов и сглаживает подгонку
  question: Объясните своими словами, как увеличение ε при прочих равных обычно влияет на число опорных векторов и подгонку SVR.
  explanation: При большем ε модель игнорирует более крупные отклонения от линии предсказаний. Активных ограничений становится меньше, поэтому обычно уменьшается число опорных векторов и возрастает гладкость подгонки.
  kind: open
  reference: Более широкая epsilon-труба охватывает больше обучающих точек без потерь. Поэтому меньше точек оказываются на границе трубы или за ней и становятся опорными векторами, а подгонка обычно получается более гладкой и менее чувствительной к мелким отклонениям.
  id: 045-svr-tube-3
