- concept: epsilon задаёт зону нечувствительности, а C определяет цену выхода за неё
  question: Как различаются роли параметров ε и C в стандартном SVR?
  explanation: ε определяет, какая ошибка ещё не считается нарушением. C задаёт, насколько дорого обходится суммарная часть ошибок, выступающая за границы трубы.
  kind: choice
  options:
    - C задаёт ширину epsilon-трубы, а ε штрафует сложность модели
    - ε задаёт допустимое отклонение без потерь, а C масштабирует штраф за превышение этого допуска
    - Оба параметра влияют только на выбор ядра
    - ε и C всегда взаимозаменяемы и приводят к одной модели
  correct: 1
