- concept: неопорные точки соответствуют неактивным ограничениям и не определяют оптимальную границу
  question: Из обучающей выборки линейного hard-margin SVM удалили только точки, которые лежали строго за границами margin и не являлись опорными. Что произойдёт после повторной оптимизации?
  explanation: Для неопорных точек ограничения выполняются со строгим запасом. Они не ограничивают найденный оптимум, поэтому их удаление не меняет разделитель, пока опорные точки остаются на месте.
  kind: choice
  options:
    - Оптимальная граница и margin сохранятся
    - Граница обязательно сместится в сторону удалённых точек
    - Выборка обязательно перестанет быть линейно разделимой
  correct: 0
  id: 011-critical-points-1
  fingerprint: fc576e8c
- concept: для опорного вектора классификационное ограничение является активным
  question: Заполни пропуск в условии для опорного вектора, где ρ обозначает выбранный порог margin.
  explanation: Опорный вектор находится точно на границе margin, поэтому ограничение достигает порога без запаса. У неопорных точек значение строго превышает этот порог.
  kind: cloze
  template: 'Опорный вектор: y_i f(x_i) ___ ρ; неопорная точка: y_i f(x_i) > ρ'
  answer: '='
  accept:
    - '='
    - равно
    - равен
  id: 011-critical-points-2
  fingerprint: 6a33c3dc
- concept: доля опорных векторов служит оценочным сигналом зависимости модели от обучающих примеров
  question: У одной SVM доля опорных векторов заметно выше, чем у другой модели, обученной в сопоставимых условиях. Как это осторожно интерпретировать?
  explanation: Чем больше доля опорных векторов, тем больше отдельных наблюдений участвует в фиксации решения. Этот показатель полезен как диагностика сложности и возможной ошибки обобщения, но не заменяет проверку на валидационных данных.
  kind: open
  reference: Высокая доля опорных векторов означает, что решение зависит от большой части обучающих наблюдений. Это может указывать на менее устойчивое обобщение, однако само по себе не доказывает плохое качество на новых данных.
  id: 011-critical-points-3
  fingerprint: 3c1687d7
