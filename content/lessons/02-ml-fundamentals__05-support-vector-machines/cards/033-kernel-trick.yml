- concept: kernel trick вычисляет скалярное произведение преобразованных объектов без явного построения их признаков
  question: SVM должен использовать нелинейное преобразование φ, но явное построение φ(x) слишком дорого. Как применить kernel trick?
  explanation: Ядро напрямую возвращает значение φ(x)ᵀφ(z). Поэтому SVM может работать с линейной границей в неявном пространстве признаков и получать нелинейную границу в исходном пространстве, не вычисляя сами векторы φ(x).
  kind: choice
  options:
    - Заменить каждое скалярное произведение φ(x)ᵀφ(z) вычислением K(x, z)
    - Применить K отдельно к каждой координате x, а затем сложить координаты
    - Сначала явно построить все координаты φ(x), а затем удалить исходные признаки
    - Заменить функцией K метки классов, оставив скалярные произведения без изменений
  correct: 0
  id: 033-kernel-trick-1
  fingerprint: 144f228c
- concept: RBF-ядро вычисляется через экспоненту от отрицательного квадрата расстояния
  question: Для точек x = [2, 5] и z = [5, 9] вычислите RBF-ядро K(x, z) = exp(−γ‖x − z‖²) при γ = 0.2. Округлите ответ до четырёх знаков после запятой.
  explanation: Квадрат расстояния равен (2 − 5)² + (5 − 9)² = 25. Поэтому K(x, z) = exp(−0.2 × 25) = exp(−5) ≈ 0.0067. Малое значение отражает низкое сходство точек при выбранном γ.
  kind: numeric
  answer: 0.0067
  tolerance: 0.0001
  id: 033-kernel-trick-2
  fingerprint: b19edd91
- concept: полиномиальное ядро избегает вычислительной стоимости явного пространства признаков
  question: Объясните, почему полиномиальное ядро может быть значительно дешевле явного построения всех полиномиальных признаков степени d для объекта размерности D.
  explanation: Значение (xᵀz + c)^d можно получить после вычисления обычного скалярного произведения исходных векторов. Это сохраняет эффект большого полиномиального пространства признаков без затрат на его явное построение и хранение.
  kind: open
  reference: Явное полиномиальное преобразование создаёт пространство порядка O(D^d) признаков. Ядро вычисляет скалярное произведение в этом пространстве непосредственно по исходным векторам за O(D), не создавая преобразованные координаты.
  id: 033-kernel-trick-3
  fingerprint: '62636202'
