- concept: soft-margin SVM применим к неразделимым данным благодаря разрешённым нарушениям ограничений
  question: Обучающие классы частично перекрываются, поэтому разделить все точки без ошибок невозможно. Какая постановка SVM подходит для такой выборки?
  explanation: Soft margin допускает ошибки классификации и попадание точек внутрь margin. Величина каждого нарушения описывается slack-переменной, поэтому задача остаётся применимой к перекрывающимся классам.
  kind: choice
  options:
    - Soft-margin SVM со slack-переменными
    - Hard-margin SVM с обязательным выполнением всех ограничений
    - SVR с epsilon-трубой
    - Линейный SVM с запретом на опорные векторы
  correct: 0
  id: 048-final-quiz-1
  fingerprint: 21c25c76
- concept: полиномиальное ядро возводит сдвинутое скалярное произведение в заданную степень
  question: Восстанови формулу полиномиального ядра.
  explanation: Полиномиальное ядро применяет степень d к скалярному произведению объектов с добавленной константой c. Так модель учитывает полиномиальные комбинации исходных признаков.
  kind: cloze
  template: K(x, z) = ___
  answer: (x · z + c)^d
  accept:
    - (x·z+c)^d
    - (x . z + c)^d
    - (dot(x, z) + c)^d
  id: 048-final-quiz-2
  fingerprint: 324cee0a
- concept: RBF-сходство точки с самой собой максимально и не зависит от gamma
  question: Объясни, почему значение RBF-ядра для точки и её точной копии не зависит от gamma.
  explanation: В RBF-ядре gamma влияет на скорость снижения сходства только при ненулевом расстоянии. Для совпадающих аргументов расстояние равно нулю при любом gamma.
  kind: open
  reference: Расстояние между совпадающими точками нулевое. Поэтому множитель gamma умножается на нулевой квадрат расстояния и не влияет на экспоненту; сходство достигает максимального значения.
  id: 048-final-quiz-3
  fingerprint: 32d70992
