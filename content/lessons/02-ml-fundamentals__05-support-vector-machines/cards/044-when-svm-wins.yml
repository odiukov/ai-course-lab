- concept: малый разреженный высокоразмерный датасет с готовыми признаками является подходящим режимом для линейного SVM
  question: Для бинарной классификации доступно мало размеченных документов. Каждый документ представлен разреженным TF-IDF-вектором с очень большим числом признаков. Какую модель разумно проверить одной из первых?
  explanation: Линейный SVM хорошо работает с разреженными высокоразмерными признаками и не требует большой выборки для самостоятельного изучения представлений. Само по себе большое число столбцов не означает, что нужна глубокая модель.
  kind: choice
  options:
    - Глубокую сеть, обучаемую с нуля на сырых текстах
    - Линейный SVM
    - Ядерный SVM с RBF независимо от размера выборки
    - Модель, явно строящую все попарные взаимодействия слов
  correct: 1
  id: 044-when-svm-wins-1
  fingerprint: d9c4378e
- concept: готовые информативные признаки уменьшают преимущество глубокого обучения в автоматическом извлечении признаков
  question: Объясни, почему преобразование сырых текстов в информативные TF-IDF-векторы может уменьшить преимущество глубокой сети перед SVM на небольшой размеченной выборке.
  explanation: Глубокое обучение особенно полезно, когда признаки нужно извлечь из большого массива сырых данных. Если представление уже подготовлено, а размеченная выборка мала, линейный SVM часто остаётся сильным кандидатом.
  kind: open
  reference: Одно из главных преимуществ глубокой сети — самостоятельное выделение полезных признаков из сырых данных. TF-IDF уже предоставляет содержательные числовые признаки, поэтому это преимущество ослабевает. При небольшом числе размеченных объектов линейному SVM может быть проще построить регуляризованную границу, чем глубокой сети — надёжно выучить собственное представление.
  id: 044-when-svm-wins-2
  fingerprint: c11f70e9
