- concept: динамика качества на проверочной выборке позволяет обнаружить переход от недообучения к переобучению при росте C
  question: При последовательном увеличении C ошибка SVM на обучающей выборке всё время уменьшается, а на проверочной сначала уменьшается, затем начинает расти. Как это интерпретировать и в какой области следует выбирать C?
  explanation: 'Обучающая ошибка сама по себе обычно подталкивает к слишком большому C. Проверочная ошибка отражает обобщение: её разворот вверх показывает, что модель начала подстраиваться под шум обучающих данных.'
  kind: open
  reference: Начальное улучшение проверочного качества означает ослабление недообучения. Его последующее ухудшение при продолжающемся улучшении обучающего качества указывает на переобучение. C следует выбирать около минимума проверочной ошибки, до заметного расхождения между обучающим и проверочным качеством.
