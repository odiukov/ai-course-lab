- concept: положительный signed margin ниже требуемого уровня означает правильную классификацию с нарушением margin
  question: Для обучающей точки величина yᵢf(xᵢ) положительна, но меньше канонического уровня margin. Как расположена эта точка?
  explanation: 'Положительный yᵢf(xᵢ) означает правильную сторону decision boundary. Если он меньше 1, требование margin нарушено: точке соответствует 0 < ξᵢ < 1.'
  kind: choice
  options:
    - Она классифицирована правильно, но находится внутри margin
    - Она находится на неправильной стороне decision boundary
    - Она лежит за границей margin без нарушения
    - Она исключается из обучения как выброс
  correct: 0
  id: 012-soft-margin-1
  fingerprint: 04a2db5f
- concept: минимальная slack-переменная равна дефициту signed margin относительно канонического требования
  question: В каноническом soft-margin SVM для точки получено yᵢf(xᵢ) = −1.6. Чему равна минимальная slack-переменная ξᵢ, при которой ограничение выполняется?
  explanation: Из ограничения −1.6 ≥ 1 − ξᵢ следует ξᵢ ≥ 2.6. Поэтому минимальное значение равно 2.6; оно больше 1, что соответствует ошибочной классификации.
  kind: numeric
  answer: 2.6
  tolerance: 0.02
  id: 012-soft-margin-2
  fingerprint: ae6dbd20
