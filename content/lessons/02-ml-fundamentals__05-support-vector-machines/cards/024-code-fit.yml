- concept: каждая эпоха состоит из полного прохода по объектам с последовательными обновлениями параметров
  question: Какой каркас циклов соответствует обучению, где каждая эпоха — полный проход по X, а параметры обновляются после каждого объекта?
  explanation: Внешний цикл задаёт повторные проходы по выборке, а внутренний перебирает все объекты. Поскольку обновление находится внутри внутреннего цикла, очередной объект использует текущие параметры модели.
  kind: choice
  options:
    - Перебрать строки X один раз и обновить параметры для каждой строки
    - Для каждой эпохи сначала накопить все строки, а затем выполнить единственное обновление
    - В каждой эпохе выбрать строку X с индексом epoch и обновить параметры только по ней
    - Во внешнем цикле перебирать эпохи, во внутреннем — все строки X, выполняя обновление внутри внутреннего цикла
