- concept: после обновления параметров signed margins и множество нарушителей margin вычисляются заново
  question: Расположите действия одной итерации обучения линейного SVM и перехода к следующей итерации в правильном порядке.
  explanation: Обновление весов и свободного члена изменяет значения decision function, поэтому прежние signed margins и список нарушителей могут стать неактуальными. На следующей итерации их нужно рассчитать заново.
  kind: order
  items:
    - Вычислить signed margin каждого объекта при текущих параметрах
    - Определить объекты, нарушающие условие margin
    - Рассчитать градиент с учётом нарушителей и регуляризации
    - Обновить веса и свободный член
    - Заново вычислить signed margins при изменившихся параметрах
  id: 023-training-loop-1
  fingerprint: 14ab7061
- concept: градиентный спуск вычитает из параметра градиент, умноженный на скорость обучения
  question: Одна координата веса равна 4, соответствующая координата градиента равна 3, а скорость обучения равна 0.2. Чему станет равна эта координата после одного шага градиентного спуска?
  explanation: 'Параметр обновляется против направления роста функции потерь: 4 − 0.2 · 3 = 3.4.'
  kind: numeric
  answer: 3.4
  tolerance: 0.0001
  id: 023-training-loop-2
  fingerprint: 4be19bd4
