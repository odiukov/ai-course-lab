- concept: свободный член одинаково сдвигает баллы всех объектов
  question: В модели s = w^T x + b увеличили только свободный член b, оставив веса и признаки неизменными. Что произойдёт с баллами объектов?
  explanation: Свободный член b прибавляется к результату для каждого объекта. Поэтому его изменение одинаково сдвигает все баллы, но не меняет различия между ними, обусловленные скалярным произведением w^T x.
  kind: choice
  options:
    - Все баллы увеличатся на одну и ту же величину
    - Изменятся только баллы объектов с положительным знаком
    - Все баллы умножатся на одну и ту же величину
