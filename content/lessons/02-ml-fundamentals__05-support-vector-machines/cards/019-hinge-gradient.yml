- concept: L2-регуляризация продолжает изменять веса после исчезновения hinge-вкладов объектов
  question: Заполните пропуск в градиенте L2-регуляризованного линейного SVM.
  explanation: Исчезают только вклады объектов. Производная регуляризатора (λ/2)||w||² по весам равна λw, поэтому веса продолжают сжиматься. Свободный член в этом регуляризаторе не участвует.
  kind: cloze
  template: Если hinge-вклад всех объектов равен нулю, то ∇w L = ___, а ∇b L = 0.
  answer: λw
  accept:
    - lambda * w
    - lambda w
    - λ * w
