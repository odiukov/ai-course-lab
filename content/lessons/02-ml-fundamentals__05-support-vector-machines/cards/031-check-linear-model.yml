- concept: строгое сравнение с допуском исключает точку, чьё отклонение точно равно порогу
  question: Точка считается опорной, если абсолютное отклонение её signed margin от канонического уровня строго меньше допуска. Что произойдёт, если отклонение в точности равно допуску?
  explanation: Условие использует оператор <, поэтому равенство отклонения допуску даёт ложный результат.
