- concept: широкий margin повышает устойчивость классификации к небольшим возмущениям, но не гарантирует верность на любых новых данных
  question: Как ширина margin связана с устойчивостью предсказаний к небольшим изменениям признаков? Объясни также, чего широкий margin не гарантирует.
  explanation: Широкий margin создаёт запас до смены класса при малом сдвиге данных. Это повышает устойчивость и обычно помогает обобщению, однако не исключает ошибок на новых или сильно изменившихся объектах.
  kind: open
  reference: Чем шире margin, тем сильнее можно немного изменить положение точки, прежде чем она пересечёт разделяющую границу и получит другой класс. Поэтому широкий margin делает решение устойчивее к малым естественным отклонениям и погрешностям измерения, но не гарантирует правильную классификацию любой новой точки.
