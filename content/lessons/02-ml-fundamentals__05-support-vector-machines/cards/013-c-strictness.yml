- concept: штраф за нарушения равен произведению C на сумму slack-переменных
  question: Для нескольких точек slack-переменные равны 0,35, 0,45 и 0,65. Какой штраф за нарушения войдёт в целевую функцию при C = 6?
  explanation: Суммарное нарушение равно 0,35 + 0,45 + 0,65 = 1,45. Поэтому штраф составляет 6 · 1,45 = 8,7.
  kind: numeric
  answer: 8.7
  tolerance: 0.001
  id: 013-c-strictness-1
  fingerprint: 277e5cd6
- concept: увеличение C делает решения с меньшей суммой нарушений относительно выгоднее, но не запрещает нарушения
  question: Что происходит при увеличении C в задаче SVM с мягким margin?
  explanation: 'C умножает сумму slack-переменных, поэтому с его ростом нарушения сильнее влияют на цель. Однако они остаются допустимыми: C назначает им цену, а не превращает soft margin в безусловный запрет.'
  kind: choice
  options:
    - Любые положительные slack-переменные становятся недопустимыми
    - Модель сильнее предпочитает уменьшать суммарное нарушение, даже если для этого приходится увеличивать норму весов
    - Слагаемое с нормой весов исчезает из целевой функции
    - Большая сумма slack-переменных становится дешевле
  correct: 1
  id: 013-c-strictness-2
  fingerprint: 7a13a174
