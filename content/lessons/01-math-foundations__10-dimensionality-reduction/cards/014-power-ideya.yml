- concept: умножение на матрицу масштабирует каждую собственную компоненту на соответствующее собственное значение
  question: Пусть C eₐ = 13eₐ и C eᵦ = 7eᵦ, а начальный вектор v = eₐ + eᵦ. Во сколько раз коэффициент при eₐ будет больше коэффициента при eᵦ после умножения Cv?
  explanation: После умножения Cv = 13eₐ + 7eᵦ, поэтому отношение коэффициентов равно 13/7 ≈ 1.86. Так компонента с большим собственным значением усиливается быстрее остальных.
  kind: numeric
  answer: 1.86
  tolerance: 0.01
  id: 014-power-ideya-1
  fingerprint: e5f010fa
- concept: нормирование в power iteration ограничивает длину вектора, не изменяя его направление
  question: Заполни знаменатель в формуле нормированного шага power iteration.
  explanation: Деление на ‖Cv‖ превращает результат в единичный вектор. Общий масштаб меняется, но направление сохраняется, поэтому значения координат не разрастаются при повторных умножениях.
  kind: cloze
  template: v_new = Cv / ___
  answer: ‖Cv‖
  accept:
    - '||Cv||'
    - норма Cv
    - sqrt((Cv)^T(Cv))
  id: 014-power-ideya-2
  fingerprint: bcabcf06
- concept: power iteration сходится к доминирующему собственному направлению при ненулевой начальной проекции на него
  question: У симметричной положительно полуопределённой матрицы наибольшее собственное значение невырождено, а начальный вектор имеет ненулевую проекцию на соответствующий собственный вектор. К какому направлению сходятся повторные нормированные умножения?
  explanation: При каждом умножении компоненты вектора масштабируются своими собственными значениями. Компонента с максимальным собственным значением растёт относительно остальных быстрее, а нормирование сохраняет её направление.
  kind: choice
  options:
    - К собственному вектору с наибольшим собственным значением, с точностью до знака
    - К собственному вектору с наименьшим собственным значением
    - К направлению суммы всех собственных векторов с равными весами
    - К направлению начального вектора независимо от матрицы
  correct: 0
