- concept: ковариационная матрица описывает пары признаков и имеет по одной строке и столбцу на каждый признак
  question: Матрица данных содержит 23 объекта и 6 признаков в столбцах. Какой размер будет у ковариационной матрицы признаков?
  explanation: Строки и столбцы ковариационной матрицы соответствуют признакам. Поэтому для 6 признаков её размер равен 6 × 6 независимо от числа объектов.
  kind: choice
  options:
    - 23 × 23
    - 6 × 6
    - 23 × 6
  correct: 1
  id: 010-covariance-matrix-1
  fingerprint: 5eddbbef
- concept: ковариация двух центрированных признаков вычисляется через сумму попарных произведений с поправкой на число степеней свободы
  question: Два центрированных признака на четырёх объектах имеют значения [-2, -4, 2, 4] и [-5, -7, 5, 7]. Чему равна их несмещённая выборочная ковариация?
  explanation: Сумма попарных произведений равна 76. После оценки среднего у четырёх наблюдений остаются три степени свободы, поэтому ковариация равна 76 / 3 ≈ 25.33.
  kind: numeric
  answer: 25.33
  tolerance: 0.01
  id: 010-covariance-matrix-2
  fingerprint: bb3e9d1a
