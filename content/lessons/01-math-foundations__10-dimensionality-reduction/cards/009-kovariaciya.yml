- concept: знак ковариации показывает направление совместного изменения признаков
  question: После центрирования признаков заметно, что положительным отклонениям признака A обычно соответствуют отрицательные отклонения признака B, и наоборот. Какой знак, скорее всего, имеет их ковариация?
  explanation: Отклонения признаков обычно имеют разные знаки, поэтому их произведения отрицательны. В сумме это даёт отрицательную ковариацию.
  kind: choice
  options:
    - Положительный
    - Отрицательный
    - Нулевой
  correct: 1
  id: 009-kovariaciya-1
  fingerprint: 576d317f
- concept: ковариационная матрица симметрична
  question: Заполни равенство для элементов ковариационной матрицы.
  explanation: Перестановка признаков не меняет произведение их центрированных отклонений, поэтому ковариация признака j с признаком k равна ковариации признака k с признаком j.
  kind: cloze
  template: C_{jk} = ___
  answer: C_{kj}
  accept:
    - C_kj
    - C[k,j]
  id: 009-kovariaciya-2
  fingerprint: 7bd63302
- concept: диагональный элемент ковариационной матрицы является дисперсией соответствующего признака
  question: Объясни своими словами, что означает диагональный элемент C_{jj} ковариационной матрицы.
  explanation: На диагонали перемножаются одинаковые центрированные значения. Получаются квадраты отклонений, сумма которых определяет дисперсию признака.
  kind: open
  reference: 'Это ковариация признака j с самим собой, то есть его дисперсия: средний квадрат отклонения значений признака от собственного среднего с поправкой на оценивание по выборке.'
  id: 009-kovariaciya-3
  fingerprint: 6c891a6b
