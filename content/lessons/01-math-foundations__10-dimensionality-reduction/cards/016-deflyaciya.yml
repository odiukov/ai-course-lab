- concept: дефляция удаляет из симметричной матрицы вклад известной собственной пары
  question: Заполните пропуск в формуле дефляции для симметричной матрицы C, единичного собственного вектора u и соответствующего собственного значения μ.
  explanation: 'Матрица μuuᵀ описывает вклад собственного направления u. После её вычитания D действует на u как нулевая матрица: Du = Cu - μu(uᵀu) = μu - μu = 0.'
  kind: cloze
  template: D = ___
  answer: C - μuuᵀ
  accept:
    - C - μ u u^T
    - C - μ*u*u.T
    - C - μ(u uᵀ)
  id: 016-deflyaciya-1
  fingerprint: a3341ecf
- concept: дефляция сохраняет собственные пары, ортогональные удаляемому направлению
  question: Пусть Cu = μu и Cw = νw, причём u и w — ортогональные единичные векторы. Чему равно Dw для D = C - μuuᵀ?
  explanation: 'Поскольку uᵀw = 0, вычитаемое слагаемое не действует на w: Dw = Cw - μu(uᵀw) = νw. Поэтому дефляция удаляет выбранное направление, не меняя ортогональные ему собственные направления.'
  kind: choice
  options:
    - νw
    - нулевому вектору
    - (ν - μ)w
    - μu
  correct: 0
  id: 016-deflyaciya-2
  fingerprint: ac73c84d
- concept: последовательное применение дефляции позволяет извлекать главные компоненты по убыванию дисперсии
  question: Расположите действия алгоритма последовательного поиска главных компонент в правильном порядке.
  explanation: После каждого поиска из матрицы удаляется вклад найденной собственной пары. Доминирующим направлением обновлённого остатка становится следующая ещё не извлечённая главная компонента.
  kind: order
  items:
    - Принять ковариационную матрицу за текущую матрицу-остаток
    - Найти доминирующую собственную пару текущей матрицы-остатка
    - Сохранить найденный собственный вектор как главную компоненту
    - Вычесть из матрицы-остатка внешний продукт найденного вектора, умноженный на его собственное значение
    - Повторять поиск и дефляцию, пока не набрано нужное количество компонент
  id: 016-deflyaciya-3
  fingerprint: 9d7b24c8
