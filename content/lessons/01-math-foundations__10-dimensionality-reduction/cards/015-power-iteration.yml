- concept: нулевой результат умножения матрицы на текущий вектор нельзя нормировать
  question: Внутри power iteration получилось C @ v = 0. Как следует поступить?
  explanation: Нулевой вектор не имеет направления и не может быть нормирован. Равенство C @ v = 0 означает, что v попал в ядро матрицы; можно явно завершить вычисление или выбрать другой начальный вектор.
  kind: choice
  options:
    - Обработать вырожденный случай или повторить алгоритм с другим начальным вектором
    - 'Разделить результат на его норму: направление сохранится автоматически'
    - Заменить нулевую норму отрицательной нормой
    - Продолжить итерации с нулевым вектором до появления ненулевого направления
  correct: 0
  id: 015-power-iteration-1
  fingerprint: 929ba69e
- concept: собственное значение вдоль найденного единичного направления вычисляется отношением Рэлея
  question: Заполните выражение для оценки собственного значения, если v уже имеет единичную норму.
  explanation: Для единичного собственного вектора C @ v = λv, поэтому vᵀCv = λvᵀv = λ. Это позволяет получить собственное значение без отдельного разложения матрицы.
  kind: cloze
  template: eigenvalue = ___
  answer: v.T @ C @ v
  accept:
    - v @ C @ v
    - v.T.dot(C).dot(v)
    - np.dot(v, C @ v)
  id: 015-power-iteration-2
  fingerprint: fc1d402d
- concept: противоположные знаки собственного вектора задают одну и ту же главную ось
  question: Две реализации PCA вернули для первой компоненты векторы v и -v. Объясните, почему оба результата могут быть правильными.
  explanation: У главной компоненты нет обязательного направления «вперёд». При проверке результата следует учитывать совпадение с точностью до знака.
  kind: open
  reference: Собственный вектор определяет направление оси без фиксированной ориентации. Если Cv = λv, то C(-v) = λ(-v), поэтому смена знака не меняет собственное направление или объясняемую дисперсию, а лишь меняет знаки координат проекции.
  id: 015-power-iteration-3
  fingerprint: 22fccc46
