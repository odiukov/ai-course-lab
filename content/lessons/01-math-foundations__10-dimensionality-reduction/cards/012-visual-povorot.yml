- concept: полный ортогональный поворот PCA сохраняет попарные евклидовы расстояния
  question: Облако точек перевели из исходных координат в полный PCA-базис, не отбрасывая компоненты. Что обязательно осталось неизменным?
  explanation: Переход к полному PCA-базису — ортогональная замена координат. Она сохраняет расстояния, углы и форму облака, хотя координаты точек и дисперсии вдоль осей меняются.
  kind: choice
  options:
    - Координаты каждой точки
    - Дисперсия вдоль каждой исходной оси
    - Евклидовы расстояния между всеми парами точек
    - Корреляции между координатами
  correct: 2
  id: 012-visual-povorot-1
  fingerprint: db272d94
- concept: координата точки вдоль главной компоненты вычисляется скалярным произведением
  question: Заполни формулу PCA-координаты центрированной точки x_c вдоль единичного главного направления v.
  explanation: Новая координата — скалярная проекция центрированной точки на собственный вектор ковариационной матрицы. Поэтому она вычисляется скалярным произведением точки и главного направления.
  kind: cloze
  template: z = ___
  answer: x_c · v
  accept:
    - v · x_c
    - x_c^T v
    - v^T x_c
  id: 012-visual-povorot-2
  fingerprint: 4ebaed76
- concept: в базисе главных компонент ковариационная матрица диагональна и компоненты некоррелированы
  question: Почему разные главные компоненты после PCA имеют нулевую ковариацию?
  explanation: Если столбцы V — собственные векторы ковариационной матрицы S, то VᵀSV является диагональной матрицей. На диагонали находятся дисперсии компонент, а вне диагонали — нулевые взаимные ковариации.
  kind: open
  reference: Главные направления выбираются как ортонормированные собственные векторы ковариационной матрицы. Переход в этот базис диагонализует матрицу ковариации, поэтому её внедиагональные элементы, то есть ковариации разных компонент, равны нулю.
  id: 012-visual-povorot-3
  fingerprint: fd4e6735
