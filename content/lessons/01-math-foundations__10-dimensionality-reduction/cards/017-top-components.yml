- concept: суммарная доля объяснённой дисперсии равна отношению суммы выбранных собственных значений к сумме всех собственных значений
  question: У ковариационной матрицы собственные значения равны 17, 11 и 7. PCA сохраняет направления, соответствующие значениям 17 и 11. Какую долю общей дисперсии они объясняют? Ответьте десятичной дробью.
  explanation: Выбранные компоненты дают 17 + 11 = 28 единиц дисперсии, а полная дисперсия равна 17 + 11 + 7 = 35. Поэтому их суммарная доля равна 28 / 35 = 0.8.
  kind: numeric
  answer: 0.8
  tolerance: 0.001
