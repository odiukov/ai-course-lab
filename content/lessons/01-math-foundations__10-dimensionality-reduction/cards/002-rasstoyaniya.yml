- concept: в высокой размерности относительный разброс расстояний между случайными точками сокращается
  question: Какой признак указывает, что расстояния в пространстве признаков начали концентрироваться?
  explanation: Проблема не в самих больших расстояниях, а в исчезновении контраста между ними. Когда ближайшие и далёкие объекты находятся почти на одинаковом относительном расстоянии, понятие соседства теряет практический смысл.
  kind: choice
  options:
    - Абсолютные расстояния растут, но относительный разрыв между близкими и далёкими объектами сохраняется
    - Относительный разрыв между ближайшими и самыми далёкими объектами уменьшается
    - Расстояние до ближайшего объекта стремится к нулю
    - Все объекты получают одинаковые координаты
  correct: 1
  id: 002-rasstoyaniya-1
  fingerprint: 2aba5b21
- concept: накопление вкладов множества признаков делает поиск ближайшего соседа чувствительным к шуму
  question: Объясни своими словами, почему добавление множества независимых неинформативных признаков может ухудшить работу метода ближайших соседей.
  explanation: В многомерном пространстве полезный сигнал конкурирует с суммарным вкладом шумовых координат. Из-за концентрации расстояний даже небольшие случайные изменения могут переставить объекты в списке ближайших соседей.
  kind: open
  reference: Евклидово расстояние складывается из вкладов всех признаков. Случайные вклады множества неинформативных координат усредняются и могут заглушить различия по полезным признакам, поэтому относительные расстояния сближаются, а выбор ближайшего соседа начинает зависеть от шума.
  id: 002-rasstoyaniya-2
  fingerprint: 5f8c7728
