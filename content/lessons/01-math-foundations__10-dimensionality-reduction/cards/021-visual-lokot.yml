- concept: локоть отмечает переход от крупных приростов объяснённой дисперсии к малым
  question: На кривой накопленной объяснённой дисперсии отмечено несколько точек. Какая из них соответствует локтю?
  explanation: 'Локоть находится в месте заметного изменения наклона: до него компоненты существенно увеличивают накопленную объяснённую дисперсию, а после него дают лишь небольшие прибавки.'
  kind: choice
  options:
    - Точка, где кривая достигает наибольшей высоты
    - Точка, где быстрый рост сменяется почти горизонтальным участком
    - Точка, где кривая пересекает горизонтальную ось
    - Точка, после которой кривая начинает убывать
  correct: 1
  id: 021-visual-lokot-1
  fingerprint: 9e532307
- concept: при отсутствии резкого изгиба метод локтя не даёт однозначного числа компонент
  question: Кривая накопленной объяснённой дисперсии плавно выравнивается и не имеет заметного перелома. Можно ли по методу локтя однозначно выбрать число компонент? Объясни, как поступить.
  explanation: Метод локтя опирается на визуально выраженный переход к малым приростам. Если переход размыт, выбор становится субъективным, поэтому лучше применить порог накопленной дисперсии или оценку качества итоговой модели.
  kind: open
  reference: Нет. Метод локтя является эвристикой и без отчётливого изменения наклона не определяет единственное число компонент. В такой ситуации можно выбрать число компонент по порогу накопленной дисперсии или перебрать варианты и сравнить качество downstream-модели.
  id: 021-visual-lokot-2
  fingerprint: 98005ebe
