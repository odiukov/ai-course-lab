- concept: центрирование инвариантно к постоянному сдвигу каждого признака
  question: Ко всем значениям каждого признака добавили один и тот же для этого признака постоянный сдвиг. Объясни, как это повлияет на результат последующего центрирования.
  explanation: Для сдвинутого признака среднее сдвигается на ту же константу. Поэтому разности между значениями и средним, а значит и вся центрированная таблица, остаются прежними.
  kind: open
  reference: 'Результат центрирования не изменится: среднее каждого признака увеличится на тот же сдвиг, поэтому при вычитании среднего добавленная константа сократится.'
