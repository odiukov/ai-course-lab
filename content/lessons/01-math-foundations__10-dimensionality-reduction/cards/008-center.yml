- concept: новые данные при PCA центрируют средними, вычисленными на обучающей выборке
  question: PCA обучили на тренировочной выборке, а затем получили новые объекты. Как правильно центрировать их перед проекцией?
  explanation: Проекция определена относительно центра обучающей выборки. Если пересчитать средние на новых объектах, начало координат сместится и их координаты окажутся несопоставимы с тренировочными.
  kind: choice
  options:
    - Вычесть средние, сохранённые при обучении PCA
    - Заново вычислить средние только по новым объектам
    - Вычесть среднее каждой строки новых данных
    - Не центрировать новые объекты
  correct: 0
