- concept: формально найденный ближайший сосед не обязательно является содержательно похожим объектом
  question: Алгоритм без ошибок вычислил расстояния и вернул объект с минимальным расстоянием. Почему в пространстве очень высокой размерности этого недостаточно, чтобы считать найденный объект похожим?
  explanation: Вычисление минимума остаётся корректным, но почти одинаковые расстояния плохо разделяют похожие и непохожие объекты. Алгоритм возвращает соседа, однако само звание «ближайшего» становится малоинформативным.
  kind: choice
  options:
    - Минимальное расстояние всегда соответствует случайному объекту
    - Разница между минимальным и остальными расстояниями может быть слишком мала, чтобы надёжно отражать сходство
    - В высокой размерности невозможно определить минимум
    - Для похожих объектов расстояние должно быть отрицательным
  correct: 1
  id: 004-check-curse-1
  fingerprint: b634981d
- concept: похожие расстояния между точками не означают совпадение самих объектов
  question: Объясни своими словами, почему концентрация попарных расстояний около одного значения не позволяет заключить, что все объекты стали одинаковыми.
  explanation: Проклятие размерности не стирает различия между исходными объектами. Оно уменьшает контраст расстояний, из-за чего расстояние становится слабым сигналом для сравнения.
  kind: open
  reference: Объекты могут по-прежнему иметь разные координаты и свойства. Около одного значения концентрируется лишь выбранная мера расстояния, поэтому она теряет способность отчётливо различать степень сходства объектов.
  id: 004-check-curse-2
  fingerprint: 3e77a453
