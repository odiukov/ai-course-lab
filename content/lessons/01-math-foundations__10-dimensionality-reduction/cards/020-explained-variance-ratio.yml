- concept: деление собственных значений на общий положительный знаменатель сохраняет их порядок
  question: Расположи шаги рассуждения, показывающего, почему нормализация не меняет порядок компонент по объяснённой дисперсии.
  explanation: Деление неотрицательных величин на один и тот же положительный знаменатель сохраняет все неравенства, поэтому порядок долей совпадает с порядком собственных значений.
  kind: order
  items:
    - Убедиться, что сумма собственных значений положительна
    - Разделить каждое собственное значение на одну и ту же сумму
    - Сделать вывод, что отношения между большими и меньшими значениями сохранились
  id: 020-explained-variance-ratio-2
  fingerprint: 85d695ec
- concept: при нулевой общей дисперсии относительные вклады главных компонент не определены
  question: Почему для спектра, состоящего только из нулевых собственных значений, функция вычисления долей объяснённой дисперсии должна применять отдельное правило?
  explanation: Доля определяется относительно общей дисперсии. Если общей дисперсии нет, знаменатель равен нулю и обычная формула неприменима, поэтому поведение функции нужно задать явно.
  kind: open
  reference: Сумма собственных значений равна нулю, поэтому обычная нормализация требует деления на ноль. Кроме того, при отсутствии общей дисперсии относительный вклад каждой компоненты математически не определён; функция должна явно вернуть выбранное специальное значение или сообщить об ошибке.
  id: 020-explained-variance-ratio-3
  fingerprint: be20e527
