- concept: собственное значение ковариационной матрицы равно дисперсии вдоль соответствующей главной компоненты
  question: Ковариационная матрица двух признаков равна [[13, 6], [6, 13]]. Какую дисперсию захватывает первая главная компонента?
  explanation: Собственные значения этой матрицы равны 19 и 7. PCA ставит первой компоненту с наибольшим собственным значением, поэтому она захватывает дисперсию 19.
  kind: numeric
  answer: 19
  tolerance: 0.001
  id: 005-pca-ideya-2
  fingerprint: d5897faa
- concept: отбрасывание компонент с малыми собственными значениями минимизирует потерю общей дисперсии
  question: Почему при сокращении размерности PCA отбрасывают компоненты из конца списка, отсортированного по собственным значениям, а не произвольные направления?
  explanation: Общая сохранённая дисперсия равна сумме собственных значений оставленных компонент. Выбор крупнейших собственных значений максимизирует сохранённый разброс, а сумма отброшенных собственных значений характеризует потерю.
  kind: open
  reference: Собственное значение показывает дисперсию вдоль компоненты. Поэтому компоненты в конце списка содержат наименьшую часть общего разброса, и их удаление приводит к минимальной потере дисперсии среди ортогональных линейных проекций такой размерности.
  id: 005-pca-ideya-3
  fingerprint: 84009f3a
