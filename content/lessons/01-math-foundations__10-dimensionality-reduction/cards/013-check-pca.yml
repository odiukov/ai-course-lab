- concept: расстояние от точки до её проекции равно модулю отброшенной координаты
  question: В базисе главных компонент координаты объекта равны (13; −0,7). На сколько единиц переместится объект при проекции на первую главную ось?
  explanation: Проекция сохраняет координату 13 и обнуляет перпендикулярную координату −0,7. Поэтому евклидово расстояние от исходной точки до проекции равно 0,7.
  kind: numeric
  answer: 0.7
  tolerance: 0.001
  id: 013-check-pca-1
  fingerprint: bc4ab12b
- concept: отбрасывание главной компоненты удаляет направление в повернутом базисе, а не исходный признак
  question: Что именно удаляется, когда после PCA отбрасывают последнюю главную компоненту?
  explanation: Главные компоненты образуют новый повёрнутый базис. Удаляется координата вдоль одной его оси, тогда как оставшиеся координаты могут по-прежнему зависеть от всех исходных признаков.
  kind: choice
  options:
    - Один из исходных столбцов данных
    - Координата вдоль одной из новых осей PCA
    - Все исходные признаки, имеющие ненулевую ковариацию
  correct: 1
