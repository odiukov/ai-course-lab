- concept: проверка по операторам возможна только для примитивных подзадач; составные подзадачи из ответа LLM возвращаются в цикл разложения, а гарантия держится на том, что исполняются одни листья-операторы
  question: LLM в ответ на составную задачу вернула декомпозицию, где часть подзадач сами составные — оператора под них нет. Валидатор не может ни найти схему, ни проверить предусловие. Объясни, что планировщик делает с такой подзадачей и почему гарантия корректности плана от этого не страдает.
  explanation: 'Ошибка новичка — требовать от валидатора вердикта по составной подзадаче. Проверять там нечего: предусловия и эффекты есть только у операторов. Символьный слой контролирует именно границу «примитив/оператор», а всё, что выше, это лишь структура поиска.'
  kind: open
  reference: 'Составная подзадача не проверяется и не попадает в план как действие — она снова уходит в цикл разложения: сперва методы библиотеки, при их провале новый запрос к LLM. Проверка по схеме и предусловиям применяется только к листьям — примитивным подзадачам, у которых есть оператор. План состоит исключительно из таких листьев, каждый из них прошёл проверку схемы и предусловия в своём состоянии, поэтому корректность плана держится независимо от того, сколько промежуточных уровней предложила LLM. Если ветка вниз не доразложилась до валидных операторов, она отбрасывается целиком — худшее, что бывает, это отсутствие плана.'
  id: 014-shag-chetyre-2
  fingerprint: 8d035a01
- concept: валидация кандидатов даёт корректность (исполнимость каждого шага), но не оптимальность плана
  question: Все подсказки LLM прошли проверку по схеме операторов и по предусловиям, план собран. Что именно гарантировано таким планом?
  explanation: 'Валидатор — бинарная мерка допустимости, а не функция качества. Он пропускает любую исполнимую декомпозицию, включая обходную и избыточную. Стоимость плана символьный слой не оценивает: за это отвечают отдельные критерии выбора метода или поиск по стоимости, а не проверка схемы.'
  kind: choice
  options:
    - Что каждый шаг исполним в том состоянии, в котором до него доходит очередь — но не то, что план кратчайший или самый дешёвый
    - Что план и корректен, и минимален по числу шагов, так как невалидные ветки отсеяны
    - Что план корректен ровно с той вероятностью, с какой LLM угадала разложение
    - Что план корректен только если LLM не привлекалась ни разу
