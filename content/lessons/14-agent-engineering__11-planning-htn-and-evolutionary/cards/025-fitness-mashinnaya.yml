- concept: отбору нужно воспроизводимое ранжирование, а не откалиброванная абсолютная шкала
  question: Программный оценщик кандидатов систематически занижает метрику примерно на 20% относительно истинного значения, но для одного и того же кандидата всегда возвращает один и тот же балл и сохраняет порядок кандидатов. Годится ли такой оценщик для эволюционного поиска? Объясни.
  explanation: Ключ — различать смещение и шум. Постоянное смещение сохраняет ранжирование, случайный разброс — нет. Требование к функции приспособленности формулируется как «машинно-проверяемая и детерминированная», а не «абсолютно точная».
  kind: open
  reference: 'Годится. Отбор использует только сравнение кандидатов между собой, то есть порядок, а не абсолютное значение шкалы. Монотонное систематическое смещение порядок не меняет: кто был лучше, тот лучше и останется, и мутация-улучшение сохраняется в каждом поколении. Смещённые числа нельзя показывать как заявленный итоговый выигрыш (для этого нужен честный замер на целевой нагрузке), но поиск они не ломают. Ломает поиск другое — недетерминированность: оценщик, который на одном и том же кандидате возвращает разные вердикты, разрушает отбор, даже если в среднем откалиброван идеально. Воспроизводимость важнее точности шкалы.'
  id: 025-fitness-mashinnaya-3
  fingerprint: e03bfda8
