- concept: 'задача с жёсткими запретами и целевой функцией расслаивается: допустимость гарантирует символьный слой, стоимость минимизирует поиск внутри уже допустимого множества'
  question: 'Нужно составить график дежурств медсестёр: есть запреты по трудовому кодексу (минимальный отдых между сменами, запрет двух ночей подряд) и есть стоимость переработок, которую хочется снизить. К какому классу отнести задачу?'
  explanation: 'Штраф за нарушение трудового кодекса делает недопустимый график сравнимым с допустимым — поиск начнёт торговать законностью за экономию. Правильная схема двухслойная: формальные операторы с предусловиями и эффектами отсекают недопустимое, а числовая функция качества работает только на том, что уже прошло проверку. Класс задачи определяется не темой, а тем, чем владеет каждый слой.'
  kind: choice
  options:
    - 'Целиком к оптимизациям: раз есть стоимость, запреты можно внести в метрику как штраф и искать минимум суммарной оценки'
    - 'Задача расслаивается: допустимость по запретам гарантирует символьный слой (корректность по построению), а стоимость минимизирует поиск уже внутри множества допустимых графиков'
    - 'Целиком к задачам с доказуемой корректностью: раз есть жёсткие запреты, стоимость переработок учитывать нельзя'
  correct: 1
  id: 003-check-klass-1
  fingerprint: acbf5cd8
- concept: оба подхода требуют внешнего формального критерия — проверяемых предусловий/эффектов либо детерминированного замера; при субъективном критерии задача не попадает ни в один класс
  question: 'Задачу ставят так: «переписать письма в рассылке, чтобы они звучали убедительнее». Объясни своими словами, почему она не попадает ни в класс с доказуемой корректностью, ни в класс машинно-проверяемых оптимизаций, и что должно измениться в постановке, чтобы попала.'
  explanation: Ключ — не тема задачи, а форма критерия. Проверяемые предусловия и эффекты дают первый класс, детерминированный быстрый замер — второй, отсутствие и того и другого означает, что формальных гарантий взять неоткуда и остаётся человеческая проверка результата.
  kind: open
  reference: 'Нет формального критерия ни того, ни другого вида. Нельзя выписать предусловия и эффекты, из которых следует, что письмо допустимо, — значит символьному слою нечего гарантировать. Нет и детерминированного измерителя «убедительности»: спросить у модели, стало ли лучше, — это не функция качества, потому что оценка не воспроизводима и её нельзя использовать для отбора кандидатов. Задача попадёт во второй класс, если появится автоматический воспроизводимый замер — например, отклик на A/B-тесте с фиксированной выборкой, считающийся быстро и одинаково на одном и том же кандидате. В первый класс она попадёт, если критерий приёмки сведётся к списку формальных запретов (комплаенс, обязательные дисклеймеры): тогда корректность уходит в проверяемую схему, а не в качество генерации.'
  id: 003-check-klass-2
  fingerprint: 83e22f27
