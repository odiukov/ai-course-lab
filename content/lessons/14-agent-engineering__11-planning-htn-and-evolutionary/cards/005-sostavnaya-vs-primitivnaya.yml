- concept: тип задачи в HTN определяется наличием оператора под неё, а не масштабом или сложностью самой задачи
  question: В HTN-домене для склада задача «списать паллету со стойки» разложена методом на шесть подзадач. Затем WMS выпускает API-метод `writeoff(pallet_id)`, покрывающий всю операцию целиком. Что происходит с типом задачи?
  explanation: Граница между составной и примитивной задачей проходит по набору доступных операторов. Появился оператор, который планировщик может применить напрямую и чьи эффекты описаны, — задача примитивна, что бы ни происходило внутри реализации. Внутренняя сложность действия планировщику не видна и на классификацию не влияет.
  kind: choice
  options:
    - 'Она остаётся составной: шесть шагов физически всё равно выполняются, просто внутри API'
    - Она становится примитивной, потому что теперь под неё есть оператор с предусловиями и эффектами
    - Она остаётся составной, пока в домене не удалят старый метод разложения
    - 'Тип не меняется: он задаётся при описании домена и от набора действий не зависит'
  correct: 1
  id: 005-sostavnaya-vs-primitivnaya-1
  fingerprint: 717a8b73
- concept: мелкая по формулировке задача остаётся составной, если ни один оператор её не покрывает
  question: 'В домене есть операторы: `open_gripper`, `close_gripper`, `move_to(x, y)`. Как планировщик должен трактовать задачу «переставить деталь в ячейку 12»?'
  explanation: Краткость формулировки ничего не значит. Ни один из трёх операторов не выполняет перестановку целиком, поэтому задача составная и требует метода, расписывающего её через доступные действия. Отсутствие оператора — не ошибка домена, а обычная причина для разложения.
  kind: choice
  options:
    - 'Как примитивную: формулировка короткая и описывает одно физическое движение'
    - Как примитивную, но с составными предусловиями
    - 'Как составную: покрывающего оператора нет, значит нужен метод разложения через имеющиеся три'
    - 'Как ошибку домена: задача не совпадает ни с одним оператором'
  correct: 2
  id: 005-sostavnaya-vs-primitivnaya-2
  fingerprint: 5ab1aa4d
- concept: перенос HTN-домена в другую систему меняет классификацию задач и обесценивает часть методов, хотя формулировки задач те же
  question: Ты переносишь HTN-домен агента поддержки из системы A в систему B. Формулировки задач те же, но у B заметно богаче API. Объясни, что придётся пересмотреть в домене и почему.
  explanation: Одна и та же фраза меняет тип вместе с набором доступных действий. Поэтому при переносе домена первым делом инвентаризируют операторы новой системы, а уже потом решают, какие методы разложения сохранить, выкинуть или дописать.
  kind: open
  reference: 'Классификация задач привязана к набору операторов, а он у B другой. Часть задач, бывших составными в A, в B покрывается одним вызовом API — под них появляются операторы, а прежние методы разложения становятся лишними: планировщик спускается до готового действия и глубже не идёт. Возможно и обратное: действие, бывшее оператором в A, в B отсутствует, и задачу придётся сделать составной, написав метод через более мелкие вызовы. Пересматривать нужно именно границу «что я умею делать напрямую» и висящие над ней методы; сами цели и формулировки задач при этом не меняются.'
  id: 005-sostavnaya-vs-primitivnaya-3
  fingerprint: f2be1b0f
