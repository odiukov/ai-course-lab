- concept: пустое разложение — успех, отсутствие подходящего метода — провал; эти два исхода обязаны кодироваться разными значениями
  question: 'Функция шага декомпозиции HTN возвращает список подзадач. Один метод объявлен так: его предусловие уже выполнено, а список подзадач у него пустой (цель фактически достигнута). Другая ситуация: для составной задачи ни одного метода с выполненным предусловием не нашлось. Почему возвращать пустой список в обоих случаях — ошибка?'
  explanation: 'Это два разных исхода с противоположным смыслом. Пустое разложение — легальный успех: метод сработал, добавлять к плану нечего. «Метода нет» — провал ветки, и вызывающий код обязан его отличить, чтобы либо откатиться, либо (в гибридной схеме) обратиться к внешнему источнику декомпозиции. Слитые в одно значение, они дают план, где нерешаемая подзадача молча пропущена, а ошибка всплывёт далеко от места возникновения.'
  kind: choice
  options:
    - Пустой список означает «задача решена нулём действий», и планировщик засчитает решённой задачу, для которой разложения не существует
    - Пустой список нельзя вернуть из функции, у которой в сигнатуре объявлен тип списка подзадач
    - 'Метод с пустым списком подзадач вообще недопустим: у любого метода должна быть минимум одна подзадача'
    - Оба случая одинаковы по смыслу, разница проявляется только на этапе исполнения плана
  correct: 0
  id: 016-code-decompose-1
  fingerprint: d055be8f
- concept: 'декомпозиция не меняет состояние: факты правит только применение оператора'
  question: В HTN-планировщике шаг декомпозиции выбрал метод для составной задачи и вернул его подзадачи. Что происходит с состоянием (набором фактов) в этот момент?
  explanation: Метод — это только правило переписывания задачи в список подзадач, у него есть предусловие, но нет эффектов. Мир меняют исключительно примитивные операторы своими delete- и add-списками. Если декомпозиция начнёт править факты, состояние перестанет соответствовать префиксу реально применённых операторов, и проверки предусловий ниже по дереву поедут.
  kind: choice
  options:
    - 'Состояние не меняется: факты добавляет и удаляет только применение оператора'
    - К состоянию добавляются add-эффекты выбранного метода
    - Из состояния удаляются предусловия метода, чтобы он не сработал повторно
    - Состояние заменяется на объединение состояний всех подзадач метода
  correct: 0
  id: 016-code-decompose-2
  fingerprint: 5ad69d8f
- concept: 'контракт шага декомпозиции: ровно один уровень вниз, без рекурсии и без проверки исполнимости подзадач'
  question: Библиотека содержит 7 методов. Функция декомпозиции получает составную задачу, состояние и эту библиотеку. Что она обязана вернуть?
  explanation: 'Это один шаг вниз по дереву. Возвращённые подзадачи — сырой выход метода: часть из них может оказаться составной и уйдёт на следующий круг разложения. Проверять предусловия подзадач в момент декомпозиции бессмысленно — предусловие оператора проверяется, когда до него дойдёт очередь, а к тому моменту предыдущие операторы уже изменят состояние. Полное развёртывание и обход вариантов — работа рекурсивного планировщика уровнем выше.'
  kind: choice
  options:
    - Подзадачи первого подходящего метода как есть — среди них могут быть и составные, дальнейшее раскрытие делает вызывающий цикл
    - Полностью развёрнутый план из одних примитивных операторов
    - Подзадачи, предварительно отфильтрованные так, чтобы остались только те, чьи предусловия выполнены прямо сейчас
    - Все варианты разложения от всех 7 методов, чтобы вызывающий выбрал лучший
  correct: 0
  id: 016-code-decompose-3
  fingerprint: 0e5a8e13
