- concept: доверенная база гибридной системы — код проверки, поэтому инженерные усилия и ревью идут в валидатор/оценщик, а не в выход генератора
  question: В гибридной системе «LLM предлагает — код утверждает» есть ровно один компонент, чей выход никто не перепроверяет. Назови его и объясни, как это меняет распределение усилий на ревью и тестирование между промптом генератора и проверяющим кодом.
  explanation: Асимметрия ролей даёт асимметрию цены ошибки. Кандидат от модели проходит через фильтр, поэтому его брак локален; фильтр стоит последним, поэтому его брак системен. Тестировать надо то, чему система доверяет.
  kind: open
  reference: 'Никто не перепроверяет сам проверяющий компонент — схему операторов с предусловиями и эффектами в HTN, функцию приспособленности в эволюционном поиске. Выход LLM недоверенный по построению: его ошибка ловится следующим же шагом и стоит дёшево (кандидат просто отбрасывается). Ошибка в валидаторе или в оценщике не ловится ничем и распространяется на все планы и все поколения сразу — неверное предусловие пропускает невыполнимый шаг в реальный мир, кривой оценщик уводит популяцию не туда. Отсюда вывод: тесты, ревью и требование детерминизма адресуются проверяющему коду, а промпт генератора настраивается как обычная эвристика покрытия, без гарантий.'
