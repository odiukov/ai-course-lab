- concept: без пошагового арбитра надёжность цепочки падает мультипликативно с её длиной, поэтому высокая пошаговая точность генератора не даёт приемлемой надёжности плана
  question: LLM предлагает шаги плана и в 95% случаев шаг корректен, ошибки независимы. Плана из 15 шагов исполняется целиком, без всякой проверки шагов. Какова вероятность, что весь план окажется корректным?
  explanation: '0.95^15 ≈ 0.46 — меньше подбрасывания монеты, при отличной пошаговой точности. Ошибки без арбитра не гасятся, а перемножаются. Проверка предусловия на каждом шаге разрывает это произведение: неверный кандидат отбраковывается на месте и в план не попадает, худший исход становится «плана нет», а не «план неверен».'
  kind: numeric
  answer: 0.4633
