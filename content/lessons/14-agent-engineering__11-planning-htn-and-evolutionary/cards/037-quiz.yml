- concept: 'в эволюционном поиске по коду сильная и слабая модели в ансамбле решают разные задачи: объём дешёвых вариантов против редких крупных скачков, и это вопрос распределения бюджета, а не корректности результата'
  question: Зачем в эволюционном поиске по коду держать ансамбль из нескольких LLM разной силы вместо одной самой способной? Объясни своими словами.
  explanation: 'Ключ в том, что ансамбль — рычаг стоимости поиска. Отсев делает оценщик, значит от генераторов нужен максимум полезного разнообразия на потраченный доллар: массовость от слабых моделей плюс редкие качественные скачки от сильной.'
  kind: open
  reference: 'Генератор поставляет разнообразие, а не правильные ответы, поэтому его выбирают по цене за единицу разнообразия. Дешёвая быстрая модель даёт много мелких локальных правок за тот же бюджет — а поколений в поиске тысячи, и большая часть прироста набирается такими мелкими шагами. Сильная дорогая модель вызывается реже и нужна для редких крупных перестроек алгоритма, до которых мелкими мутациями не дойти. При этом ни одна из них не влияет на гарантии: любой кандидат всё равно проходит через один и тот же детерминированный оценщик, поэтому выбор состава ансамбля — это оптимизация бюджета поиска, а не вопрос корректности выхода.'
