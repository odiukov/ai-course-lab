- concept: однопроходный планировщик не даёт гарантий корректности, потому что в цепочке нет отдельного шага сверки плана с формальным списком ограничений
  question: Планировщик-LLM один раз пишет весь план целиком, дальше исполнитель просто идёт по шагам. Объясни своими словами, почему такая схема не может гарантировать соблюдение жёстких ограничений предметной области — и что нужно добавить, чтобы гарантия появилась.
  explanation: Ключ в том, что гарантия — свойство архитектуры, а не качества модели. Пока в цепочке нет компонента, который умеет сказать «этот шаг нарушает предусловие», никакое улучшение промпта не превратит правдоподобный план в доказуемо корректный.
  kind: open
  reference: 'Модель обучена выдавать правдоподобный текст, а не проверенный план: она не держит формального списка запретов и не сверяет с ним каждый шаг. Правдоподобность плана и его корректность — разные свойства, и нарушение видно только постфактум, если кто-то специально ищет. Чтобы получить гарантию, корректность должна принадлежать не модели, а отдельному символьному слою: операторы с явными предусловиями и эффектами, декомпозиции, которые валидируются против схемы. LLM тогда лишь предлагает кандидатов, а принимает или отвергает их верификатор.'
  id: 001-dva-provala-2
  fingerprint: 6f59ee4f
- concept: для оптимизационных задач однопроходному планировщику не хватает не проверки, а измеримого сравнения кандидатов и цикла итераций
  question: Агент с однопроходным планировщиком применили к задаче «ускорить это ядро на GPU». Он выдал один работающий вариант и остановился. Чего в такой схеме не хватает по существу?
  explanation: Здесь корректность не проблема — тысячи вариантов работают правильно. Проблема в отсутствии понятия «этот кандидат на 3% быстрее предыдущего». Нужна fitness-функция, которую считает машина (замер, а не мнение модели), и эволюционный цикл поверх неё. Проверка предусловий — лекарство от другой болезни, из класса задач с жёсткими ограничениями.
  kind: choice
  options:
    - Детерминированного и быстрого оценщика плюс цикла, который порождает много кандидатов и отбирает лучших по замеру
    - Более подробного описания задачи в промпте
    - Проверки предусловий каждого шага плана перед исполнением
    - Возможности вызывать внешние инструменты во время исполнения
