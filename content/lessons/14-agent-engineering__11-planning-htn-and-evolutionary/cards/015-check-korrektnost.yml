- concept: 'гарантия корректности не деградирует плавно: любое разрешение пропускать валидацию для «уверенных» подсказок обнуляет её целиком'
  question: 'Команда хочет ускорить гибридный HTN-планировщик: пропускать проверку по схеме операторов для тех декомпозиций, где LLM вернула высокую уверенность, и валидировать только остальные. Объясни своими словами, что происходит с гарантией корректности плана.'
  explanation: 'Корректность здесь — свойство «всё-или-ничего»: оно про худший случай по всем шагам плана. Пропуск проверки для части кандидатов открывает канал, по которому галлюцинация попадает в план напрямую, и различие между «модель ошиблась» и «план испорчен» пропадает.'
  kind: open
  reference: 'Гарантия исчезает целиком, а не ослабевает пропорционально доле пропущенных проверок. Утверждение «любой выданный план корректен» держится ровно на том, что ни один шаг не попадает в план мимо проверки предусловий по схеме операторов. Как только существует хотя бы один путь в план в обход валидации, про произвольный выданный план уже нельзя сказать, что он исполним: чтобы это узнать, придётся проверять план постфактум — то есть делать ту же работу. Уверенность модели тут не помогает: это самооценка генератора, а не проверка относительно текущего состояния, и она никак не связана с тем, выполнены ли предусловия оператора. Правильный способ ускоряться — дешевле делать саму проверку или реже звать LLM (кэшировать и обобщать удачные декомпозиции в методы), а не отключать валидацию.'
