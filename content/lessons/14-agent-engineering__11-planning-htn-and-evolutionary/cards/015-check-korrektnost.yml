- concept: 'доказуемая корректность плана относительна модели домена: она гарантирует соответствие схеме операторов, а не соответствие схемы реальности'
  question: Гибридный планировщик выдал план, каждый шаг которого прошёл проверку по схеме операторов. На реальном роботе план сломался на третьем шаге. Что это говорит о гарантии корректности?
  explanation: 'Символьный слой доказывает одно: каждый оператор применим в том состоянии, где стоит, согласно записанным предусловиям и эффектам. Если предусловие оператора неполно (забыт факт «захват свободен»), доказательство остаётся верным, а робот всё равно падает. Ошибка тут в модели домена, а не в LLM и не в валидаторе.'
  kind: choice
  options:
    - 'Гарантия нарушена: значит, подсказка LLM всё-таки попала в план в обход проверки'
    - Гарантия относительна модели домена — план корректен по отношению к записанным предусловиям и эффектам; если сама схема оператора не описывает реальность, доказательство сохраняется, а исполнение нет
    - Гарантия действует только для планов длиной до трёх шагов
    - Гарантия покрывает и реальный мир, поэтому сбой возможен только из-за случайного отказа железа
  correct: 1
