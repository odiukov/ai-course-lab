- concept: 'цикл HTN-планирования: разложение составной задачи методами до уровня операторов с проверкой предусловий и обновлением состояния'
  question: Расставь шаги HTN-планирования в порядке, в котором их выполняет планировщик.
  explanation: 'Планирование в HTN — это разворачивание сверху вниз: задача, метод, подзадачи, снова методы. Спуск заканчивается на примитивах. Именно потому, что сверка предусловий идёт на этапе разворачивания, невозможный план отсеивается до выполнения, а не во время него.'
  kind: order
  items:
    - Взять из сети очередную составную задачу
    - Выбрать метод, чьи предусловия выполнены в текущем состоянии
    - Заменить составную задачу подзадачами из этого метода
    - Дойдя до примитивной подзадачи, сверить предусловие её оператора с текущим состоянием
    - Применить эффекты оператора и обновить состояние для следующей подзадачи
    - Повторять, пока в сети не останутся одни операторы
  id: 004-htn-chetyre-2
  fingerprint: 3b64a4fa
- concept: method раскладывает составную задачу на подзадачи, operator — примитивное действие, меняющее состояние
  question: Объясни своими словами, чем method отличается от operator в HTN и почему план не может состоять из одних методов.
  explanation: 'Составная задача — это название желания, а не движение: её нельзя отдать исполнителю. Метод переводит её на уровень ниже, оператор — единственное, что реально исполняется и двигает состояние. Отсюда и критерий завершения планирования: остались одни операторы.'
  kind: open
  reference: 'Operator — примитивное действие, которое исполнитель выполняет напрямую; у него есть предусловие (что должно быть верно в состоянии) и эффект (какие факты меняются после). Method — не действие, а рецепт разложения: он говорит, какими подзадачами можно заменить составную задачу, и тоже имеет предусловие применимости, но сам по себе состояние не меняет и «выполнить» его нельзя. План — это последовательность исполнимых шагов, поэтому разворачивание методами должно продолжаться, пока все листья не станут операторами; сеть, где остались составные задачи, ещё не план.'
  id: 004-htn-chetyre-3
  fingerprint: cf7e2328
