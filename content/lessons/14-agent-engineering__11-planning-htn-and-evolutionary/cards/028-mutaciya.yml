  question: В эволюционном поиске по коду мутации предлагает ансамбль LLM, и из 12 предложенных вариантов улучшение даёт обычно один. Объясни своими словами, почему низкая доля попаданий не считается дефектом схемы и почему мутации не пытаются делать «продуманными».
  explanation: 'Ключ — разделение ролей: генератор отвечает за разнообразие, оценщик за отбор. Требование «умных» мутаций возвращает нас к исходной проблеме — никто не знает, какая правка нужна. Низкий hit rate терпим ровно потому, что цена проверки кандидата машинная и малая.'
