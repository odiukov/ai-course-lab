- concept: 'порядок гибридного цикла ChatHTN: обращение к LLM только после провала библиотеки методов, а валидация — строго до рекурсии'
  question: Гибридный HTN-планировщик с подсказками LLM обрабатывает очередную составную задачу. Расставь шаги цикла в порядке выполнения.
  explanation: 'LLM здесь резервный источник, а не основной: символьная библиотека методов пробуется первой, запрос уходит только на тупике. Критичен и порядок конца цикла — проверка по схеме операторов идёт ДО рекурсии, иначе непроверенная подзадача уже раскладывалась бы дальше и её потомки попали бы в план.'
  kind: order
  items:
    - Попытаться разложить задачу методами, которые уже есть в библиотеке домена
    - 'Если ни одно предусловие метода не выполнено — отправить LLM запрос: как разложить эту задачу в текущем состоянии'
    - Преобразовать текстовый ответ LLM в список кандидатных подзадач
    - Сверить кандидатов со схемой операторов и отбросить невалидные декомпозиции
    - Запустить рекурсию на выживших подзадачах тем же циклом
  id: 013-chathtn-cikl-1
  fingerprint: d4e8a9e9
- concept: 'подсказки LLM расширяют покрытие (полноту) домена, но не ослабляют и не усиливают гарантию корректности: худший исход остаётся «плана нет», а не «план неверен»'
  question: В гибридном HTN-планировщике LLM предлагает декомпозиции, которые затем проверяются по схеме операторов. Что изменится по сравнению с чистым HTN, если LLM начнёт стабильно выдавать бессмысленные разложения?
  explanation: 'Подсказки входят исключительно как кандидатные декомпозиции и проходят фильтр схемы операторов; LLM не дописывает план и не трогает состояние. Значит плохая LLM бьёт по полноте — задача чаще остаётся нерешённой, — но не по корректности. Выигрыш гибрида ровно в обратную сторону: конечная библиотека методов перестаёт быть потолком покрытия.'
  kind: choice
  options:
    - Планировщик станет возвращать планы с неисполнимыми действиями — гарантия корректности сломается
    - Планировщик просто чаще будет отвечать «плана нет», как и чистый HTN на непокрытой задаче; неверные планы не появятся
    - Планировщик начнёт исправлять состояние под кандидатов LLM, чтобы декомпозиция прошла проверку
    - Гарантия корректности сохранится, но только если LLM вызывается не чаще одного раза на задачу
  correct: 1
