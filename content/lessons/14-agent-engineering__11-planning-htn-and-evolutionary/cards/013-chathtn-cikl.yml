- concept: обучаемый компонент обобщает удачные LLM-декомпозиции в переиспользуемые методы, поэтому частота обращений к LLM падает по ходу работы
  question: К гибридному HTN-планировщику добавляют онлайновое обучение методам. Что именно даёт снижение частоты обращений к LLM?
  explanation: 'Обучение работает регрессией: из конкретной удачной декомпозиции выводится обобщённый метод, который ложится в библиотеку домена. Дальше похожая ситуация закрывается на первом шаге цикла, до всякого запроса. Вариант с ослаблением проверки неверен принципиально — фильтр по схеме операторов и есть источник гарантии корректности, его нельзя обменивать на скорость.'
  kind: choice
  options:
    - Ответы LLM кэшируются дословно, и повтор той же задачи в том же состоянии берётся из кэша
    - Прошедшие проверку декомпозиции обобщаются в новые методы с предусловиями, и похожие задачи дальше решаются символьно
    - Порог доверия к LLM повышается, поэтому часть кандидатов принимается без сверки со схемой операторов
    - Составные задачи переклассифицируются в примитивные, и раскладывать их больше не нужно
  correct: 1
