- concept: отсутствие паттерна в каталоге фреймворка говорит о форме его интерфейса, а не о незрелости паттерна
  question: Паттерна нет в оглавлении ни одного крупного агентного фреймворка. Объясни своими словами, почему из этого не следует, что паттерн сырой и брать его в работу рано.
  explanation: Признак зрелости — работающие реализации и понятный объём кода, а не наличие галочки в чужой документации. Пустое место в оглавлении означает лишь, что писать интеграцию придётся самому.
  kind: open
  reference: 'Каталог фреймворка отражает его интерфейс, а не состояние области. Фреймворки построены вокруг хода диалога с вызовами инструментов и памятью; HTN — это поиск с возвратом по дереву задач и состоянием домена, эволюционный цикл — долгий процесс с популяцией и бюджетом замеров. Ни то ни другое не ложится на примитив «один ход — один ответ». При этом сами планировщики существуют десятилетиями (`pyhop`, семейство SHOP), эволюционный цикл воспроизведён в открытых реализациях. Практический вывод — не отказ от паттерна, а собственная сборка сбоку: HTN-планировщик (applicable, apply_operator, decompose, plan, execute_plan) — это сотни строк, а не годовая стройка.'
  id: 036-gde-eto-zhivet-3
  fingerprint: '29115450'
