- concept: HTN и эволюционный поиск существуют отдельными библиотеками, но не как первоклассная возможность агентных фреймворков
  question: Инженер ищет в документации популярного агентного фреймворка поддержку HTN-планирования и эволюционного цикла оптимизации кода. Что реально доступно?
  explanation: Планировщики — зрелые самостоятельные библиотеки, эволюционный цикл повторяют открытые форки. Фреймворки покрывают цепочки инструментов, память, ReAct, ReWOO; HTN и цикл отбора туда не встроены, поэтому их прикручивают как внешний компонент.
  kind: choice
  options:
    - Отдельные HTN-планировщики (`pyhop`, планировщики семейства SHOP на Lisp) и открытые реализации эволюционного цикла вроде OpenEvolve существуют давно, но ни то ни другое не является первоклассной возможностью фреймворков — подключают сбоку
    - Оба паттерна включаются галочкой в конфигурации основных агентных фреймворков
    - Ни готовых планировщиков, ни открытых реализаций эволюционного цикла не существует — всё пишется с нуля
    - HTN во фреймворках есть, а эволюционный цикл доступен только по закрытой лицензии
  correct: 0
