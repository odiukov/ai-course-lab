- concept: жёсткие ограничения не агрегируются в частичную оценку, поэтому цель — корректность по построению, а не высокий процент соблюдения
  question: 'Планировщик отчитался: «из 12 жёстких ограничений маршрута нарушено одно, план выполнен на 92%». Объясни своими словами, почему такая метрика бессмысленна для этого класса задач и какой тогда должна быть цель планировщика.'
  explanation: Разница между «нельзя ошибиться» и «хочется получше» — это разница между бинарной и числовой проверкой. Где проверка бинарна, частичного зачёта не существует, и правильный ответ на вопрос «насколько план хорош» имеет ровно два значения.
  kind: open
  reference: 'Жёсткие ограничения не суммируются в балл: план либо допустим, либо нет. Нарушенное ограничение делает план непригодным к исполнению независимо от того, сколько остальных соблюдено, поэтому 92% ничем не лучше 0%. Значит, цель — не максимизировать долю соблюдённых правил, а строить план так, чтобы нарушение было невозможно: каждый шаг разворачивается только через операторы с проверенными предусловиями и эффектами (HTN), и проверка корректности принадлежит символьному слою, а не LLM.'
