- concept: в задаче с числовой функцией качества нет эталонного ответа, поэтому поиск останавливают по исчерпанию бюджета, а не по достижению корректности
  question: 'Эволюционный поиск улучшает реализацию: лучший найденный вариант делает 216 умножений вместо исходных 240. Что служит критерием остановки такого поиска?'
  explanation: 'В оптимизационном классе «правильного» ответа нет: 216 лучше 240, но никто не гарантирует, что 216 — предел. Ты двигаешь число вниз и останавливаешься по бюджету. Вариант с валидатором описывает задачу другого класса — там проверка бинарна и останов наступает при доказанной корректности.'
  kind: choice
  options:
    - Исчерпание бюджета времени/вычислений или отсутствие улучшений за много итераций — известного оптимума нет
    - Момент, когда валидатор подтверждает корректность лучшего кандидата
    - Достижение теоретически минимального числа умножений, вычисляемого заранее
    - Согласие двух независимых LLM, что дальше улучшать нечего
