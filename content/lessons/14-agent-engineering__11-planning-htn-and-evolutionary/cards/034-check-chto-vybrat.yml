- concept: ограничение проверяется до выполнения шага и запрещает его, оценщик проверяется после и лишь ранжирует готового кандидата
  question: 'Задача: переписать функцию так, чтобы 40 регрессионных тестов проходили и время работы падало. Инженер говорит: «тесты — это жёсткие ограничения, значит нужен символьный планировщик с предусловиями». В чём он ошибается? Объясни, чем ограничение отличается от оценщика.'
  explanation: Различие во времени проверки, а не в строгости. Запрет действует до шага (предусловие), оценщик — после (тест, бенчмарк). Путаница «тесты = жёсткие ограничения» — самая частая ошибка при выборе подхода.
  kind: open
  reference: 'Ограничение — это условие, которое проверяется ДО выполнения шага и не даёт его выполнить: оно живёт в предусловиях оператора, и нарушающий шаг просто не попадает в план. Тесты работают наоборот: они запускаются ПОСЛЕ того, как кандидат уже собран, и выдают вердикт/оценку готовому варианту. Это оценщик (фитнес-фильтр), а не запрет: он ничего не блокирует заранее, он отбраковывает и ранжирует. Задача с 40 тестами и замером времени — класс эволюционного поиска: тесты фильтруют корректность кандидатов, замер времени задаёт направление отбора.'
  id: 034-check-chto-vybrat-1
  fingerprint: 6266a919
- concept: оценщик даёт гарантию только на те входы, которые он реально измерил, а предусловия дают её по построению на каждом исполнении
  question: 'Бот делает финансовые операции, есть правило: перевод свыше 300 000 без второй подписи запрещён. Вариант A: закодировать правило предусловием оператора перевода. Вариант B: написать 500 тестов, проверяющих, что бот не делает такие переводы, и отбирать варианты бота по проценту прохождения. Почему A даёт гарантию, а B — нет?'
  explanation: 'Оценщик говорит только про измеренные случаи: непокрытый вход остаётся дырой, сколько бы тестов ни было. Предусловие — проверка в момент шага, поэтому запрет держится на любом входе, включая никогда не виденный. Поэтому политика/комплаенс идёт в предусловия, а не в тестовый набор.'
  kind: choice
  options:
    - Потому что тестов 500, а нужно хотя бы несколько тысяч для статистической значимости
    - Потому что предусловие проверяется на каждом фактическом исполнении шага и блокирует его, а тесты гарантируют поведение только на тех входах, которые в них попали
    - Потому что тесты выполняются медленнее предусловий и не укладываются в бюджет поколения
    - Потому что вариант B требует LLM-судьи, а предусловие проверяется кодом
