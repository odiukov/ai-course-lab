- concept: 'порядок сборки планировщика с внешним источником декомпозиций: сначала каркас и проверки, потом подключение генератора'
  question: Расположи шаги разработки HTN-планировщика с фолбэком на внешний генератор декомпозиций в правильном порядке.
  explanation: 'Сначала контракт, потом дешёвая реализация контракта, потом отладка того, что модель всё равно не починит, — цикла планировщика и проверок. Модель подключается последней: если каркас с недоверенным источником уже работает, замена реализации не трогает остальной код.'
  kind: order
  items:
    - 'Зафиксировать интерфейс фолбэка: на входе имя составной задачи и текущее состояние, на выходе список подзадач'
    - Реализовать заглушку с заготовленными ответами, удовлетворяющую этому интерфейсу
    - Прогнать планировщик на заглушке и починить рекурсию, порядок подзадач и обновление состояния
    - Проверить, что валидация кандидатных подзадач по схеме операторов отсекает заведомо негодный ответ заглушки
    - Подставить за тем же интерфейсом вызов реальной модели
  id: 017-fallback-scenarnyy-2
  fingerprint: 6dd57100
- concept: взаимозаменяемость реализаций фолбэка держится на фиксированной сигнатуре и на том, что выход в любом случае считается недоверенным
  question: Объясни своими словами, почему в HTN-планировщике заглушку с заготовленными разложениями можно заменить на вызов языковой модели, не переписывая сам планировщик.
  explanation: Подменяемость даёт не «похожесть» словаря на модель, а совпадение интерфейса плюс единый режим недоверия к результату. Если бы планировщик пропускал валидацию для «своих» подсказок, замена реализации ломала бы гарантии — и офлайн-отладка ничего не говорила бы о поведении с моделью.
  kind: open
  reference: 'Планировщик обращается к фолбэку через один узкий контракт: получает имя составной задачи и текущее состояние, ожидает список подзадач. Обе реализации этот контракт выполняют, а внутри планировщика нет ни одной ветки, зависящей от того, откуда пришёл список. Второе условие важнее первого: выход фолбэка в любом случае считается недоверенным и проходит одну и ту же проверку по схеме операторов и предусловиям, поэтому смена источника не меняет ни гарантии, ни обработку плохого ответа — меняется только вероятность его получить (и цена с задержкой вызова).'
