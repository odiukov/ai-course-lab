- concept: предусловие метода охраняет всё разложение целиком, а не отдельные подзадачи внутри него
  question: 'В HTN-домене составная задача «оплатить заказ» имеет метод с предусловием `карта_привязана` и подзадачами: списать сумму, выдать чек, обновить баланс. В текущем состоянии факта `карта_привязана` нет. Что делает планировщик?'
  explanation: Предусловие метода — это условие пригодности способа разложения, а не условие на каждый шаг внутри. Если оно ложно, весь набор подзадач недоступен как единое целое. Проверки на уровне отдельных действий делают предусловия операторов — но они срабатывают позже, когда очередь доходит до самого действия.
  kind: choice
  options:
    - Отбрасывает метод целиком вместе со всеми его подзадачами и переходит к следующему методу этой задачи
    - Пропускает только первую подзадачу «списать сумму», а остальные две выполняет
    - Раскрывает подзадачи и проверяет предусловие отдельно перед каждой из них
    - Считает задачу примитивной и пробует выполнить её одним оператором
  correct: 0
  id: 012-method-vybor-1
  fingerprint: 873d1a28
- concept: 'порядок выбора метода: первый с выполненным предусловием, при провале ветки — возврат к следующему методу'
  question: У составной задачи есть несколько методов. Расставь действия планировщика в правильном порядке.
  explanation: 'Методы перебираются по порядку, берётся первый, чьё предусловие выполнено в состоянии. Это жадный выбор, а не окончательный: выполненное предусловие гарантирует пригодность способа здесь, но не то, что глубже все предусловия операторов сойдутся. Поэтому точка выбора метода — точка возврата при бэктрекинге.'
  kind: order
  items:
    - Проверить предусловие первого по списку метода относительно текущего состояния
    - Раскрыть задачу в подзадачи этого метода и продолжить планирование по ветке
    - Обнаружив, что ниже по ветке план не сходится, откатиться к точке выбора метода
    - Проверить предусловие следующего метода и раскрыть задачу через него
  id: 012-method-vybor-2
  fingerprint: 5c40810d
- concept: если ни одно предусловие метода не выполнено, задача в данном состоянии нерешаема — планировщик не изобретает разложение
  question: Составная задача, ни одно предусловие её методов не выполнено в текущем состоянии. Каким должен быть результат HTN-планировщика?
  explanation: 'Множество разложений задано доменом заранее. Ни частичного совпадения предусловия, ни синтеза нового метода в HTN нет — именно это даёт доказуемость: любой выданный план собран только из объявленных методов и операторов. Отказ — честный ответ, а пустой план был бы враньём о выполненной задаче.'
  kind: choice
  options:
    - 'Отказ: по этой ветке задача в данном состоянии не раскладывается'
    - Выбор метода с наибольшим числом выполненных фактов предусловия как приближение
    - Порождение нового метода из подзадач соседних методов
    - 'Пустой план: задача считается уже выполненной'
  correct: 0
