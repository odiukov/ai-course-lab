- concept: бюджет времени поколения = число вызовов оценщика × стоимость вызова, поэтому к детерминизму добавляется требование скорости
  question: Эволюционный цикл делает 4000 вызовов функции приспособленности за одно поколение. Один вызов занимает 0,45 секунды. Сколько минут длится одно поколение?
  explanation: '4000 × 0,45 = 1800 секунд = 30 минут на поколение, и это только замеры. Оценщик стоит в самом внутреннем цикле, поэтому его стоимость умножается на размер популяции: замер, приемлемый для разового бенчмарка, делает поиск непроходимым. Отсюда второе требование рядом с детерминизмом — дешевизна вызова.'
  kind: numeric
  answer: 30
  tolerance: 0.5
