- concept: пригодность оценщика определяется отношением амплитуды его разброса к величине искомого прироста, а не разбросом самим по себе
  question: Оптимизационный поиск ищет улучшения порядка 0,5% за шаг. Замер приспособленности гуляет на ±2% от запуска к запуску. Объясни своими словами, что произойдёт с отбором и по какому критерию вообще решают, годится ли оценщик.
  explanation: Ключ — сравнение двух величин, а не разговор о шуме вообще. Оценщик с разбросом ±2% годится, если поиск гонится за приростами в десятки процентов, и бесполезен там, где улучшения идут долями процента и накапливаются произведением мелких шагов.
  kind: open
  reference: 'Разброс замера перекрывает искомый эффект: разница в 0,5% тонет в ±2%, и порядок кандидатов задаёт не качество кода, а то, какому кандидату повезло с замером. Отбор начинает закреплять удачные измерения вместо улучшений, и настоящие мелкие приросты теряются. Критерий пригодности — не «шум мал» в абсолюте, а отношение амплитуды разброса к размеру шага улучшения: разброс обязан быть заметно меньше прироста, который поиск должен различать. Отсюда и требование детерминированности как предельный случай: нулевой разброс различает сколь угодно мелкий прирост. Практически это значит убрать из замера всё, что зависит от окружения — стенные часы на нагруженной машине, сеть, несфиксированную случайность, ответ модели-судьи.'
