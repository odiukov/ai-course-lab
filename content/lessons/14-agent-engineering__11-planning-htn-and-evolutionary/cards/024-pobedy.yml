  explanation: Оптимизируется ровно то, что измеряется. Счётчик умножений не отличает верную схему от пустой, поэтому оценщик обязан сначала проверить тождество (схема действительно даёт произведение) и лишь затем считать баллы. У AlphaEvolve результат «48 умножений вместо 49» имеет смысл только потому, что корректность схемы проверяется машиной, а не предполагается.
