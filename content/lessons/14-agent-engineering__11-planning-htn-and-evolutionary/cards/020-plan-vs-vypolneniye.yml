- concept: 'цикл выполнения готового плана: реальное состояние, проверка применимости очередного оператора, применение его эффектов, переход к следующему'
  question: Расставьте шаги фазы выполнения готового плана (для одного оператора, с продолжением цикла) в правильном порядке.
  explanation: 'Выполнение — отдельная от поиска работа: оно единственное трогает настоящие факты. Порядок «проверил — применил — шагнул дальше» обязателен, потому что эффекты предыдущего оператора формируют то состояние, относительно которого проверяется следующий.'
  kind: order
  items:
    - Взять настоящее текущее состояние мира
    - Проверить применимость очередного оператора плана относительно этого состояния
    - Если применим — применить его эффекты и получить новое настоящее состояние (иначе остановить выполнение)
    - Перейти к следующему оператору плана и повторить с ним ту же проверку
