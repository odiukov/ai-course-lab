  fingerprint: 590ab3ef
- concept: выполнение перепроверяет предусловия по реальному состоянию, потому что поиск проверял их по предсказанному, и при расхождении честно останавливается
  question: На этапе выполнения перед каждым оператором плана заново проверяют его предусловия. Зачем, если поиск уже проверил их все?
  explanation: 'Гарантия поиска условна: «если мир будет таким, оператор применим». Между планированием и выполнением мир мог поменяться извне. Повторная проверка стоит одно сравнение множеств и делает выполнение честным — оно встаёт там, где план разошёлся с реальностью, вместо того чтобы применять эффекты к состоянию, которого нет.'
  kind: choice
  options:
    - Поиск проверял предусловия относительно предсказанных состояний; реальность могла разойтись с предсказанием, и тогда выполнение останавливается на этом операторе, а не идёт вслепую дальше
    - Проверка нужна, чтобы восстановить состояние, потерянное при возврате из рекурсии планировщика
    - 'Повторная проверка страхует от ошибок в самом коде `applicable`: два независимых прогона дают надёжный результат'
    - Без неё планировщик не сможет пересчитать длину плана и порядок операторов
  correct: 0
