- concept: 'элитизм: лучший найденный кандидат хранится вне популяции, поэтому кривая лучшего балла не убывает'
  question: Эволюционный поиск гоняет 40 поколений. В каждом поколении родители полностью заменяются потомками, а итог прогона — лучший из последнего поколения. Что произойдёт с итоговым результатом?
  explanation: Мутация случайна, значит поколение легко выходит слабее предыдущего. Отбор внутри поколения выбирает лучшего только из текущих потомков — про вытесненного рекордсмена он ничего не знает. Поэтому лучший найденный кандидат хранится отдельно и переносится через все поколения (элитизм); только тогда кривая лучшего балла монотонна.
  kind: choice
  options:
    - Итог может оказаться хуже кандидата, найденного в середине прогона, потому что удачный вариант вытеснен случайными мутациями
    - Итог гарантированно не хуже любого промежуточного кандидата, потому что отбор идёт по баллу
    - Итог всегда совпадает с лучшим за прогон, так как потомки наследуют балл родителя
    - Итог не зависит от схемы замены, если поколений достаточно много
  correct: 0
  id: 031-code-evolve-1
  fingerprint: b1fe92f6
- concept: порядок операций внутри одного поколения эволюционного поиска
  question: Расставьте шаги одного поколения эволюционного поиска по коду в правильном порядке.
  explanation: 'Мутировать можно только имея родителей, отбирать — только имея баллы, а рекорд обновляется по уже посчитанным баллам. Перестановка «отбор до оценки» превращает отбор в случайный выбор: без числа сравнивать нечего.'
  kind: order
  items:
    - Породить мутантов из текущих родителей мутатором
    - Прогнать каждого мутанта через оценщик и получить балл
    - Отсортировать кандидатов по баллу и оставить верхние k как родителей следующего поколения
    - Обновить хранимого отдельно лучшего кандидата, если рекорд побит
  id: 031-code-evolve-2
  fingerprint: bb39249b
- concept: популяция родителей шире одного лучшего кандидата ради разнообразия ветвей поиска
  question: Поиск оставляет из 16 кандидатов ровно одного — лучшего — и все 16 мутантов следующего поколения порождает из него. Чем это хуже, чем оставлять четверых лучших?
  explanation: 'Несколько родителей держат несколько независимых линий правок. Единственный родитель делает поиск локальным спуском от одной точки: если он сидит в локальном оптимуме, мелкие мутации из него не выведут. Число вызовов оценщика при этом не меняется — оно задано размером популяции, а не числом родителей.'
  kind: choice
  options:
    - Оценщик начнёт выдавать недетерминированные баллы
    - Вся популяция сходится к одной линии правок и застревает в локальном оптимуме — нет других веток, из которых можно уйти
    - Число вызовов оценщика за поколение вырастет
    - Лучший найденный кандидат перестанет сохраняться между поколениями
  correct: 1
  id: 031-code-evolve-3
  fingerprint: 161b4381
