- concept: гарантии даёт формализуемый критерий приёмки, а не сама по себе смена архитектуры
  question: Команда недовольна, что агент-редактор текстов «иногда пишет не то», и хочет переписать его на HTN ради доказуемой корректности. Качество текста оценивает редактор-человек. Объясни, что даст такая замена.
  explanation: 'Частая ошибка: считать гарантии свойством инструмента. Они свойство критерия. Строка таблицы «формальных гарантий нет» описывает не слабость ReAct, а отсутствие проверки у задачи; убрать её можно только формализовав приёмку.'
  kind: open
  reference: 'Ничего в части гарантий. Доказуемая корректность HTN — это утверждение о соответствии плана схеме операторов: каждый шаг применён при выполненных предусловиях. Если критерий приёмки («текст хороший») нигде не выражен как проверяемые предусловия и эффекты, HTN не сможет его проверять, а гарантировать будет лишь исполнимость шагов, а не искомое качество. Гарантия появляется не от выбора архитектуры, а от появления машинно-проверяемого критерия: либо список запретов (например, запрещённые формулировки, обязательный дисклеймер) — тогда HTN, либо детерминированная числовая метрика или набор тестов — тогда AlphaEvolve. Пока приёмка субъективна, честный ответ — ReAct/ReWOO без формальных гарантий.'
  id: 032-tablica-vybora-2
  fingerprint: aae71bba
- concept: политика/комплаенс-ограничения — это бинарный запрет, который кодируется предусловиями, поэтому такая автоматизация относится к классу HTN
  question: 'Автоматизация выдачи прав в компании ограничена корпоративной политикой: перечислено 17 условий, при которых действие запрещено. Почему такую задачу относят к HTN, а не к эволюционному поиску?'
  explanation: Политика отвечает «можно/нельзя», а не «насколько хорошо». Такой критерий кладётся в предусловия, и план, собранный только из применимых операторов, политику не нарушит по построению. Функция приспособленности здесь пришлось бы выдумывать, и она давала бы «почти допустимые» планы — то есть недопустимые.
  kind: choice
  options:
    - Потому что политика — набор бинарных условий допустимости, а он напрямую кодируется предусловиями операторов; поиск по числовой оценке для такого критерия не нужен и не даёт нужной гарантии
    - Потому что 17 условий — слишком мало, чтобы популяция кандидатов успела сойтись
    - Потому что эволюционный поиск не умеет работать с дискретными переменными
    - Потому что HTN быстрее эволюционного поиска на любой задаче сравнимого размера
  correct: 0
