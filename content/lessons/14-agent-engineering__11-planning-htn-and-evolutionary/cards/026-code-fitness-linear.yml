- concept: функция приспособленности принимает только данные и кандидата; истинные параметры внутри неё делают замер бессмысленным
  question: 'Инженер пишет оценщик для подбора прямой и внутри него сравнивает коэффициенты кандидата с заранее известными «правильными» значениями: балл тем выше, чем ближе кандидат к ним. Объясни своими словами, почему такой оценщик не является функцией приспособленности для этой задачи.'
  explanation: 'Смысл замера в том, что он проверяем машиной и не требует эталона: подставили x, сравнили предсказание с измерением, получили число. Как только внутрь попадает известный ответ, поиск перестаёт быть поиском — он воспроизводит вход. Проверка простая: работает ли оценщик на данных, где ответа никто не знает.'
  kind: open
  reference: 'Функция приспособленности обязана измерять, насколько кандидат согласуется с наблюдаемыми данными — её входы это данные и кандидат, ничего больше. Оценщик, знающий ответ заранее, измеряет расстояние до догадки автора, а не качество модели: на настоящей задаче истинных коэффициентов нет, и такой оценщик просто не существует. Он также не отловит ситуацию, где догадка автора хуже найденного кандидата, — поиск будет наказан за то, что лучше описывает замеры. Это утечка ответа в метрику: сходимость к «правильному» значению становится тавтологией, а не свидетельством того, что поиск работает.'
