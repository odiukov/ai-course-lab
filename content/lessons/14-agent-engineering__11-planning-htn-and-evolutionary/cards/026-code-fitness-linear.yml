- concept: 'направление оптимума функции приспособленности должно быть согласовано с правилом отбора: сумма ошибок минимизируется, отбор по максимуму берёт худших'
  question: 'Оценщик возвращает сумму квадратов отклонений кандидата от данных. Цикл отбора устроен так: на каждом поколении оставляем кандидатов с наибольшим баллом. Что произойдёт?'
  explanation: 'Сумма квадратов — это ошибка: меньше значит лучше. Отбор по максимуму сохраняет как раз тех, у кого ошибка больше всех, и поиск уверенно уезжает от решения. Лечится одним решением, принятым один раз: либо оценщик возвращает ошибку и весь код ищет минимум, либо возвращает её со знаком минус и весь код ищет максимум. Смешение двух конвенций — самый дешёвый способ получить работающий цикл, который оптимизирует не туда.'
  kind: choice
  options:
    - Поиск сойдётся медленнее, но к тому же оптимуму
    - Поиск будет систематически отбирать кандидатов, которые хуже всего описывают данные
    - 'Ничего: отбор нечувствителен к направлению шкалы, важен только порядок'
    - Поиск остановится, потому что баллы не отрицательные
