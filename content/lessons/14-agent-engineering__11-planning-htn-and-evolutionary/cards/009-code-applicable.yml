- concept: оператор применим, когда множество его предусловий целиком содержится в состоянии — конъюнкция, а не дизъюнкция
  question: 'Проверка применимости оператора в HTN: состояние — множество фактов, предусловия — множество требуемых фактов. Заполни пропуск так, чтобы оператор считался применимым только при выполнении всех требований.'
  explanation: 'Применимость — конъюнкция предусловий: каждое требование должно найтись в состоянии. С `any` оператор становится применим при единственном совпавшем факте, и планировщик выдаёт планы, нарушающие предусловия — то есть теряется ровно та доказуемая корректность, ради которой берут HTN.'
  kind: cloze
  template: |-
    def applicable(operator, state):
        return ___(fact in state for fact in operator.preconditions)
  answer: all
  accept:
    - all
    - all()
  id: 009-code-applicable-1
  fingerprint: bc9c30d6
- concept: оператор с пустым списком предусловий применим в любом состоянии (пустая конъюнкция истинна)
  question: У оператора список предусловий пустой. В каких состояниях он применим?
  explanation: 'Применимость = «каждое предусловие лежит в состоянии». Когда предусловий ноль, нарушить нечего, значит ответ `True` всегда. Типичный баг — трактовать «нечего проверять» как «проверка провалилась»: тогда безусловные операторы (сброс, инициализация) выпадают из планов навсегда.'
  kind: choice
  options:
    - 'В любом: проверять нечего, пустая конъюнкция истинна'
    - 'Ни в каком: без предусловий нечему совпасть, проверка не проходит'
    - Только в пустом состоянии, где нет ни одного факта
    - Только после того, как хотя бы один другой оператор добавил факт в состояние
  correct: 0
  id: 009-code-applicable-2
  fingerprint: d5b96a03
- concept: 'положительные предусловия монотонны: добавление фактов в состояние не отнимает применимость у оператора'
  question: В состояние добавили несколько новых фактов, ни одного не удалив. Объясни своими словами, что от этого может произойти с множеством применимых операторов и почему.
  explanation: 'Проверка смотрит на вхождение требуемых фактов, а не на равенство состояния какому-то образцу, поэтому «мусор» в состоянии безвреден. Отсюда практическое следствие: сузить множество применимых операторов можно только удалением фактов эффектами, и отладку неприменимого оператора начинают с поиска отсутствующего требования, а не с чистки состояния.'
  kind: open
  reference: 'Множество применимых операторов может только вырасти или остаться прежним, сузиться оно не может. Причина в форме проверки: предусловия положительные, и применимость — это условие «каждое требование содержится в состоянии». Добавление факта не отменяет вхождения уже присутствующих фактов, поэтому оператор, у которого все требования выполнялись, останется применимым; а оператор, которому не хватало ровно добавленного факта, станет применимым. Лишние, не упомянутые в предусловиях факты на проверку не влияют вообще. Ломается это только если в язык ввести отрицательные предусловия («факта X быть не должно») — тогда новый факт может отобрать применимость.'
  id: 009-code-applicable-3
  fingerprint: a23c4e3a
