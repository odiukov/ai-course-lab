- concept: применение оператора с невыполненными предусловиями обязано быть ошибкой, а не тихим возвратом неизменённого состояния
  question: Планировщик по ошибке вызывает применение оператора, чьи предусловия в текущем состоянии не выполнены. Реализация молча возвращает состояние без изменений. Чем это плохо?
  explanation: 'Вся ценность HTN — доказуемая корректность плана: предусловие каждого оператора выполнено в момент его очереди. Тихий возврат неизменённого состояния прячет нарушение этого инварианта — поиск продолжится и вернёт последовательность операторов, которую нельзя исполнить. Громкая ошибка превращает скрытый брак плана в падение на этапе планирования.'
  kind: choice
  options:
    - Поиск станет медленнее, потому что тупиковые ветки будут проверяться повторно
    - Планировщик выдаст внешне корректный план, в котором один шаг физически невыполним
    - Состояние потеряет неизменяемость, и откат ветки перестанет работать
    - Add-список оператора применится, а delete-список — нет
