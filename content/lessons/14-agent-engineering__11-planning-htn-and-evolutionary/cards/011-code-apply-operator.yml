- concept: применение оператора должно порождать новое состояние, а не мутировать прежнее, потому что поиск с возвратом требует доступа к состоянию родительской ветки
  question: Почему функция применения оператора в HTN-планировщике возвращает новое множество фактов, а не изменяет переданное ей состояние на месте? Объясни своими словами.
  explanation: 'Ключ — backtracking. Неизменяемое состояние делает узел дерева поиска самодостаточным: родитель хранит свой мир целиком, откат бесплатен. Проверка на практике: применить оператор и убедиться, что старое множество не изменилось.'
  kind: open
  reference: 'Планировщик ведёт поиск с возвратом: он пробует одну декомпозицию, доходит до тупика (ни один метод не подошёл или предусловие не выполнено) и должен вернуться к состоянию, которое было в узле выше, чтобы попробовать альтернативную ветку. Если применение оператора мутирует общий объект состояния, то после провала первой ветки исходного мира больше нигде нет — вторая ветка стартует из состояния, испорченного чужими эффектами, и найденный план окажется неверным. Возврат новой копии делает каждое состояние в дереве поиска неизменяемым снимком, поэтому откат сводится к тому, чтобы просто забыть дочернее состояние; ничего восстанавливать не нужно.'
  id: 011-code-apply-operator-2
