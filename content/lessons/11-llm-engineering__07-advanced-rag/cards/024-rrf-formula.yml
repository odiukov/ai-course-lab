- concept: RRF вычисляет итоговый балл как сумму обратных рангов со сглаживающей константой
  question: Документ занимает 4-е место в одном списке и 7-е место в другом. При k = 40 чему примерно равен его RRF-балл?
  explanation: RRF = 1/(40 + 4) + 1/(40 + 7) = 1/44 + 1/47 ≈ 0.02273 + 0.02128 = 0.04400.
  kind: numeric
  answer: 0.044
  tolerance: 0.0005
  id: 024-rrf-formula-1
  fingerprint: bce5c800
