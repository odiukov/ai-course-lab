<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дерево как последовательность вопросов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --canvas: white;
      --text: midnightblue;
      --muted: slategray;
      --question: aliceblue;
      --root: lavender;
      --outline: royalblue;
      --connector: lightslategray;
      --approve: honeydew;
      --approve-line: seagreen;
      --approve-text: darkgreen;
      --deny: mistyrose;
      --deny-line: firebrick;
      --deny-text: darkred;
      --yes-chip: honeydew;
      --no-chip: mistyrose;
      --chip-outline: silver;
      --guide: gainsboro;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --canvas: darkslateblue;
        --text: white;
        --muted: lightsteelblue;
        --question: midnightblue;
        --root: slateblue;
        --outline: cornflowerblue;
        --connector: lightsteelblue;
        --approve: darkgreen;
        --approve-line: mediumspringgreen;
        --approve-text: white;
        --deny: darkred;
        --deny-line: lightsalmon;
        --deny-text: white;
        --yes-chip: darkgreen;
        --no-chip: darkred;
        --chip-outline: lightslategray;
        --guide: slategray;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body,
    figure,
    h1,
    p {
      margin: initial;
    }

    .diagram-header {
      background: var(--canvas);
    }

    h1 {
      font-size: 24px;
      line-height: normal;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: normal;
    }

    figure {
      background: var(--canvas);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--canvas);
    }

    .canvas {
      fill: var(--canvas);
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .connector {
      fill: none;
      stroke: var(--connector);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrowhead {
      fill: var(--connector);
    }

    .question-box {
      fill: var(--question);
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .root-box {
      fill: var(--root);
      stroke-width: 3px;
    }

    .question-accent {
      fill: var(--outline);
    }

    .node-text {
      fill: var(--text);
      font-size: 19px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .root-text {
      font-size: 21px;
    }

    .layer-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .branch-chip {
      stroke: var(--chip-outline);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .branch.yes .branch-chip {
      fill: var(--yes-chip);
    }

    .branch.no .branch-chip {
      fill: var(--no-chip);
    }

    .branch-text {
      fill: var(--text);
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .leaf-box {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .leaf.approve .leaf-box {
      fill: var(--approve);
      stroke: var(--approve-line);
    }

    .leaf.deny .leaf-box {
      fill: var(--deny);
      stroke: var(--deny-line);
    }

    .leaf.approve .leaf-icon {
      fill: var(--approve-line);
    }

    .leaf.deny .leaf-icon {
      fill: var(--deny-line);
    }

    .leaf-mark {
      fill: none;
      stroke: var(--canvas);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .leaf.approve .leaf-text {
      fill: var(--approve-text);
    }

    .leaf.deny .leaf-text {
      fill: var(--deny-text);
    }

    .leaf-text {
      font-size: 18px;
      font-weight: bold;
      text-anchor: start;
      dominant-baseline: middle;
    }

    .footer-note {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .fallback {
      fill: var(--text);
      font-size: 17px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>
  <main>
    <header class="diagram-header">
      <h1 id="diagram-title">Дерево как последовательность вопросов</h1>
      <p class="subtitle" id="diagram-desc">Каждый ответ выбирает следующий вопрос или приводит к решению.</p>
    </header>

    <figure aria-labelledby="diagram-title diagram-desc">
      <svg id="tree" viewBox="0 0 1000 440" width="1000" height="440"
           preserveAspectRatio="xMidYMid meet" role="img">
        <title>Блок-схема решения по возрасту, доходу и кредитному рейтингу</title>
        <desc>
          Сначала дерево проверяет, меньше ли возраст 30 лет. Для младших
          клиентов оно сравнивает доход с 50 тысячами, для остальных —
          кредитный рейтинг с 700. Ветви заканчиваются решениями одобрить
          или отказать.
        </desc>
      </svg>
    </figure>
  </main>

  <script>
    const diagram = {
      frame: { x: 0, y: 0, w: 1000, h: 440 },
      transform: {
        origin: { x: 0, y: 0 },
        scale: { x: 1, y: 1 }
      },
      geometry: {
        radius: 13,
        accentWidth: 7,
        arrowHalf: 7,
        arrowDepth: 11,
        iconRadius: 18
      },
      layers: [
        { x: 500, y: 22, text: "Сначала — один общий вопрос" },
        { x: 500, y: 174, text: "Затем — вопрос только для выбранной группы" }
      ],
      guides: [
        { from: { x: 34, y: 181 }, to: { x: 966, y: 181 } },
        { from: { x: 34, y: 335 }, to: { x: 966, y: 335 } }
      ],
      nodes: [
        {
          id: "age",
          kind: "root",
          x: 350, y: 48, w: 300, h: 70,
          textX: 500, textY: 84,
          text: "Возраст меньше 30 лет?"
        },
        {
          id: "income",
          kind: "question",
          x: 70, y: 190, w: 360, h: 72,
          textX: 250, textY: 226,
          text: "Доход больше 50 тысяч?"
        },
        {
          id: "score",
          kind: "question",
          x: 570, y: 190, w: 360, h: 72,
          textX: 750, textY: 226,
          text: "Кредитный рейтинг больше 700?"
        }
      ],
      branches: [
        {
          answer: "Да", tone: "yes",
          points: [
            { x: 425, y: 118 }, { x: 425, y: 150 },
            { x: 250, y: 150 }, { x: 250, y: 190 }
          ],
          chip: { x: 344, y: 132, w: 48, h: 28 },
          label: { x: 368, y: 146 },
          tip: { x: 250, y: 190 }
        },
        {
          answer: "Нет", tone: "no",
          points: [
            { x: 575, y: 118 }, { x: 575, y: 150 },
            { x: 750, y: 150 }, { x: 750, y: 190 }
          ],
          chip: { x: 608, y: 132, w: 52, h: 28 },
          label: { x: 634, y: 146 },
          tip: { x: 750, y: 190 }
        },
        {
          answer: "Да", tone: "yes",
          points: [
            { x: 175, y: 262 }, { x: 175, y: 304 },
            { x: 120, y: 304 }, { x: 120, y: 348 }
          ],
          chip: { x: 127, y: 278, w: 48, h: 28 },
          label: { x: 151, y: 292 },
          tip: { x: 120, y: 348 }
        },
        {
          answer: "Нет", tone: "no",
          points: [
            { x: 325, y: 262 }, { x: 325, y: 304 },
            { x: 365, y: 304 }, { x: 365, y: 348 }
          ],
          chip: { x: 327, y: 278, w: 52, h: 28 },
          label: { x: 353, y: 292 },
          tip: { x: 365, y: 348 }
        },
        {
          answer: "Да", tone: "yes",
          points: [
            { x: 675, y: 262 }, { x: 675, y: 304 },
            { x: 635, y: 304 }, { x: 635, y: 348 }
          ],
          chip: { x: 622, y: 278, w: 48, h: 28 },
          label: { x: 646, y: 292 },
          tip: { x: 635, y: 348 }
        },
        {
          answer: "Нет", tone: "no",
          points: [
            { x: 825, y: 262 }, { x: 825, y: 304 },
            { x: 880, y: 304 }, { x: 880, y: 348 }
          ],
          chip: { x: 827, y: 278, w: 52, h: 28 },
          label: { x: 853, y: 292 },
          tip: { x: 880, y: 348 }
        }
      ],
      leaves: [
        {
          kind: "approve", x: 25, y: 348, w: 190, h: 58,
          icon: { x: 62, y: 377 },
          text: { x: 90, y: 377, value: "Одобрить" }
        },
        {
          kind: "deny", x: 270, y: 348, w: 190, h: 58,
          icon: { x: 307, y: 377 },
          text: { x: 335, y: 377, value: "Отказать" }
        },
        {
          kind: "approve", x: 540, y: 348, w: 190, h: 58,
          icon: { x: 577, y: 377 },
          text: { x: 605, y: 377, value: "Одобрить" }
        },
        {
          kind: "deny", x: 785, y: 348, w: 190, h: 58,
          icon: { x: 822, y: 377 },
          text: { x: 850, y: 377, value: "Отказать" }
        }
      ],
      marks: {
        approve: [
          { x: -8, y: 0 }, { x: -2, y: 7 }, { x: 9, y: -7 }
        ],
        denyA: [
          { x: -7, y: -7 }, { x: 7, y: 7 }
        ],
        denyB: [
          { x: 7, y: -7 }, { x: -7, y: 7 }
        ]
      },
      footer: {
        x: 500, y: 426,
        text: "Один путь сверху вниз: вопрос → ветвь → решение"
      },
      fallback: { x: 500, y: 220 }
    };

    const origin = {
      x: diagram.transform.origin.x,
      y: diagram.transform.origin.y
    };
    const scale = {
      x: diagram.transform.scale.x,
      y: diagram.transform.scale.y
    };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("tree");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        if (content !== undefined) element.textContent = content;
        return element;
      };

      const add = (parent, child) => {
        parent.appendChild(child);
        return child;
      };

      const roundedRect = (item, className) => make("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        rx: sx(diagram.geometry.radius) - sx(diagram.frame.x),
        class: className
      });

      const polylinePath = points => points.map((point, position) => {
        const command = position === diagram.frame.x ? "M" : "L";
        return `${command} ${sx(point.x)} ${sy(point.y)}`;
      }).join(" ");

      const arrowPoints = tip => {
        const left = {
          x: tip.x - diagram.geometry.arrowHalf,
          y: tip.y - diagram.geometry.arrowDepth
        };
        const right = {
          x: tip.x + diagram.geometry.arrowHalf,
          y: tip.y - diagram.geometry.arrowDepth
        };
        return [tip, left, right]
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
      };

      const markPath = (points, center) => points.map((point, position) => {
        const command = position === diagram.frame.x ? "M" : "L";
        return `${command} ${sx(center.x + point.x)} ${sy(center.y + point.y)}`;
      }).join(" ");

      add(svg, make("rect", {
        x: sx(diagram.frame.x),
        y: sy(diagram.frame.y),
        width: sx(diagram.frame.x + diagram.frame.w) - sx(diagram.frame.x),
        height: sy(diagram.frame.y + diagram.frame.h) - sy(diagram.frame.y),
        class: "canvas"
      }));

      const guideLayer = add(svg, make("g", { "aria-hidden": "true" }));
      diagram.guides.forEach(guide => {
        add(guideLayer, make("line", {
          x1: sx(guide.from.x),
          y1: sy(guide.from.y),
          x2: sx(guide.to.x),
          y2: sy(guide.to.y),
          class: "guide"
        }));
      });

      const layerLabels = add(svg, make("g", { "aria-hidden": "true" }));
      diagram.layers.forEach(label => {
        add(layerLabels, make("text", {
          x: sx(label.x),
          y: sy(label.y),
          class: "layer-label"
        }, label.text));
      });

      const connectorLayer = add(svg, make("g", { "aria-hidden": "true" }));
      diagram.branches.forEach(branch => {
        add(connectorLayer, make("path", {
          d: polylinePath(branch.points),
          class: "connector"
        }));
        add(connectorLayer, make("polygon", {
          points: arrowPoints(branch.tip),
          class: "arrowhead"
        }));
      });

      const nodeLayer = add(svg, make("g", {}));
      diagram.nodes.forEach(node => {
        const group = add(nodeLayer, make("g", {
          class: `node ${node.kind}`
        }));
        add(group, roundedRect(
          node,
          node.kind === "root" ? "question-box root-box" : "question-box"
        ));
        add(group, make("rect", {
          x: sx(node.x),
          y: sy(node.y),
          width: sx(node.x + diagram.geometry.accentWidth) - sx(node.x),
          height: sy(node.y + node.h) - sy(node.y),
          rx: sx(diagram.geometry.radius) - sx(diagram.frame.x),
          class: "question-accent"
        }));
        add(group, make("text", {
          x: sx(node.textX),
          y: sy(node.textY),
          class: node.kind === "root" ? "node-text root-text" : "node-text"
        }, node.text));
      });

      const branchLayer = add(svg, make("g", { "aria-hidden": "true" }));
      diagram.branches.forEach(branch => {
        const group = add(branchLayer, make("g", {
          class: `branch ${branch.tone}`
        }));
        add(group, roundedRect(branch.chip, "branch-chip"));
        add(group, make("text", {
          x: sx(branch.label.x),
          y: sy(branch.label.y),
          class: "branch-text"
        }, branch.answer));
      });

      const leafLayer = add(svg, make("g", {}));
      diagram.leaves.forEach(leaf => {
        const group = add(leafLayer, make("g", {
          class: `leaf ${leaf.kind}`
        }));

        add(group, roundedRect(leaf, "leaf-box"));
        add(group, make("circle", {
          cx: sx(leaf.icon.x),
          cy: sy(leaf.icon.y),
          r: sx(leaf.icon.x + diagram.geometry.iconRadius) - sx(leaf.icon.x),
          class: "leaf-icon"
        }));

        if (leaf.kind === "approve") {
          add(group, make("path", {
            d: markPath(diagram.marks.approve, leaf.icon),
            class: "leaf-mark"
          }));
        } else {
          add(group, make("path", {
            d: markPath(diagram.marks.denyA, leaf.icon),
            class: "leaf-mark"
          }));
          add(group, make("path", {
            d: markPath(diagram.marks.denyB, leaf.icon),
            class: "leaf-mark"
          }));
        }

        add(group, make("text", {
          x: sx(leaf.text.x),
          y: sy(leaf.text.y),
          class: "leaf-text"
        }, leaf.text.value));
      });

      add(svg, make("text", {
        x: sx(diagram.footer.x),
        y: sy(diagram.footer.y),
        class: "footer-note"
      }, diagram.footer.text));
    } catch (error) {
      const svg = document.getElementById("tree");
      while (svg.lastChild) svg.removeChild(svg.lastChild);

      const fallback = document.createElementNS(
        "http://www.w3.org/2000/svg",
        "text"
      );
      fallback.setAttribute("x", sx(diagram.fallback.x));
      fallback.setAttribute("y", sy(diagram.fallback.y));
      fallback.setAttribute("class", "fallback");
      fallback.textContent =
        "Схема должна была показать: возраст → доход или рейтинг → одобрить или отказать.";
      svg.appendChild(fallback);
    }
  </script>
</body>
</html>
