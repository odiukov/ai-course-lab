- concept: деревья случайного леса обучаются независимо друг от друга
  question: Объясни своими словами, что означает независимое обучение деревьев в случайном лесе.
  explanation: В цикле обучения новое дерево получает собственные данные и обучается без подсказок от предыдущих деревьев. Это отличает случайный лес от методов, где следующая модель специально исправляет ошибки предыдущих.
  kind: open
  reference: Структура и ошибки уже обученного дерева не управляют обучением остальных деревьев. Каждое дерево отдельно обучается на своей bootstrap-выборке и использует собственные случайные подмножества признаков; взаимодействие их результатов происходит только при итоговом агрегировании предсказаний.
  id: 036-obuchenie-lesa-2
  fingerprint: f8521a72
