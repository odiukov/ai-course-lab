- concept: variance reduction равна дисперсии родителя минус взвешенная по размерам дисперсия дочерних узлов
  question: В узле дисперсия целевых значений равна 37. После разбиения в левом узле оказалось 4 объекта с дисперсией 7, а в правом — 5 объектов с дисперсией 13. Чему равен variance reduction?
  explanation: Взвешенная дисперсия потомков равна (4/9)·7 + (5/9)·13 = 10.33. Поэтому VR = 37 − 10.33 = 26.67.
  kind: numeric
  answer: 26.67
  tolerance: 0.01
  id: 048-snizhenie-dispersii-1
  fingerprint: 572c163b
- concept: большой variance reduction соответствует малому разбросу целевых значений внутри дочерних узлов
  question: Какое разбиение предпочитает регрессионное дерево по критерию variance reduction?
  explanation: Критерий вычитает из дисперсии родителя взвешенную дисперсию потомков. Поэтому он предпочитает разбиения, после которых целевые значения внутри каждой дочерней группы близки друг к другу.
  kind: choice
  options:
    - Разбиение с наименьшей взвешенной дисперсией целевых значений внутри дочерних узлов
    - Разбиение с наибольшей разницей между средними дочерних узлов независимо от разброса внутри них
    - Разбиение с наиболее равным количеством объектов в дочерних узлах
    - Разбиение, после которого хотя бы один дочерний узел имеет большое среднее
