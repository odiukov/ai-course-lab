- concept: при пороговом разбиении значение, равное порогу, направляется в левый дочерний узел
  question: 'Значения признака равны 7, 12, 14, 18 и 21. Дерево использует порог 14: слева условие «значение не больше порога», справа — «значение больше порога». Как распределятся строки?'
  explanation: Левое условие включает равенство порогу, поэтому значение 14 попадает влево. Только значения, строго превышающие 14, направляются вправо.
  kind: choice
  options:
    - 'Слева: 7, 12; справа: 14, 18, 21'
    - 'Слева: 7, 12, 14; справа: 18, 21'
    - 'Слева: 7, 12, 14, 18; справа: 21'
    - 'Слева: 18, 21; справа: 7, 12, 14'
  correct: 1
  id: 014-razdelenie-dannyh-1
  fingerprint: ba5743a5
- concept: порог по выбранному признаку не может развести строки с одинаковым значением этого признака
  question: Две строки имеют одинаковое значение выбранного признака, но относятся к разным целевым классам. Может ли разбиение вида «x_j ≤ t» и «x_j > t» отправить их в разные дочерние узлы? Объясните.
  explanation: Целевая метка нужна для оценки качества разбиения, но не участвует в направлении строки. Если значения выбранного признака совпадают, обе строки попадут в одну и ту же группу.
  kind: open
  reference: Нет. Сторона определяется только сравнением значения выбранного признака с порогом. Одинаковые значения дают одинаковый результат сравнения независимо от целевого класса.
  id: 014-razdelenie-dannyh-2
  fingerprint: e9dd8719
