- concept: OOB-набор конкретного дерева состоит из строк, отсутствовавших в его bootstrap-выборке, и подходит для проверки этого дерева
  question: Как корректно провести OOB-проверку отдельного дерева случайного леса?
  explanation: OOB-строки дерево не использовало при обучении, поэтому они играют роль встроенной проверочной выборки. У каждого дерева свой OOB-набор, поскольку bootstrap-выборки различаются.
  kind: choice
  options:
