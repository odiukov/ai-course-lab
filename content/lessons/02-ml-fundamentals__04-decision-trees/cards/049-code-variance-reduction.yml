- concept: для критерия регрессионного дерева используется дисперсия всей группы без поправки Бесселя
  question: Заполни знаменатель при вычислении дисперсии целевых значений в узле регрессионного дерева.
  explanation: 'Критерий разбиения использует дисперсию всей группы: сумму квадратов отклонений делят на количество целевых значений. Поправка Бесселя здесь не нужна.'
  kind: cloze
  template: variance = sum(squared_deviations) / ___
  answer: len(y)
  accept:
    - y.size
  id: 049-code-variance-reduction-1
  fingerprint: 7d7d467e
- concept: при масштабировании целей variance reduction изменяется пропорционально квадрату масштаба
  question: Уменьшение дисперсии для некоторого разбиения равно 7. Все целевые значения умножили на 6, сохранив то же разбиение. Чему станет равно уменьшение дисперсии?
  explanation: 'При умножении целей на 6 каждая дисперсия умножается на 6 × 6 = 36. Поэтому уменьшение дисперсии также умножается на 36: 7 × 36 = 252.'
  kind: numeric
  answer: 252
  tolerance: 0.01
  id: 049-code-variance-reduction-2
  fingerprint: d53c9d55
- concept: для разбиения на две непустые части точное уменьшение дисперсии не может быть отрицательным
  question: Реализация с дисперсией всей группы вернула для разбиения на две непустые части значение −4.6. Какой вывод наиболее обоснован?
  explanation: Общая дисперсия раскладывается на внутригрупповую и межгрупповую составляющие. Поэтому её уменьшение после разбиения неотрицательно; допустимы лишь крошечные отрицательные отклонения из-за округления, но не −4.6.
  kind: choice
  options:
    - В вычислении дисперсий или весов, вероятно, есть ошибка
    - Разбиение особенно хорошо разделило целевые значения
    - Отрицательный результат означает равенство средних в дочерних группах
