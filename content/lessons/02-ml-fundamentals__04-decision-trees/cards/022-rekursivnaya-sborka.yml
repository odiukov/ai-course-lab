- concept: рекурсивный вызов возвращает готовый лист или поддерево для включения в родительский узел
  question: Объясни своими словами, как результаты рекурсивных вызовов для дочерних групп складываются в целое дерево решений.
  explanation: 'Рекурсия строит дерево снизу вверх по возвращаемым значениям: завершённый вызов предоставляет родителю готовую структуру для соответствующей ветви.'
  kind: open
  reference: Для каждой дочерней группы запускается построение дерева. Вызов возвращает лист, если выполнено условие остановки, либо внутренний узел с собственными потомками. Родитель сохраняет возвращённые результаты как левое и правое поддеревья, поэтому из локально построенных частей постепенно получается всё дерево.
