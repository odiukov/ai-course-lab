- concept: классы с нулевой долей не передаются в логарифм
  question: Почему при прямом вычислении энтропии пропускают классы с нулевой долей?
  explanation: Выражение для отдельного класса содержит произведение его доли на её логарифм. Для нулевой доли логарифм вычислить нельзя, но предел этого произведения равен нулю, поэтому такой член просто пропускают.
  kind: choice
  options:
    - Логарифм нуля не определён, а вклад такого класса по пределу считают нулевым
    - Нулевая доля должна уменьшать энтропию до минус бесконечности
    - Иначе сумма долей классов перестанет быть равна единице
    - Логарифм можно вычислять только для целых счётчиков
