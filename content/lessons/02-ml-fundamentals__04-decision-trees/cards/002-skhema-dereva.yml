- concept: внутренние узлы выполняют сравнения, а листья содержат итоговые предсказания
  question: Объясни своими словами, чем внутренний узел дерева решений отличается от листа.
  explanation: Внутренний узел определяет дальнейший маршрут объекта с помощью проверки. Лист завершает этот маршрут и выдаёт класс или другое предсказываемое значение.
  kind: open
  reference: Внутренний узел сравнивает значение одного признака с порогом и направляет объект в одну из ветвей. Лист больше не задаёт вопросов, а возвращает итоговое предсказание.
