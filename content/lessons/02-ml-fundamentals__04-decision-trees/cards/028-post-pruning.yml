- concept: reduced error pruning удаляет поддерево, если его замена листом не увеличивает ошибку на валидации
  question: При reduced error pruning поддерево временно заменили листом. В каком случае эту замену следует сохранить?
  explanation: Reduced error pruning оценивает ветви на валидационных данных. Если удаление поддерева не повышает валидационную ошибку, его сложность не даёт подтверждённой пользы и поддерево заменяют листом.
  kind: choice
  options:
    - Ошибка на валидации не увеличилась
    - Ошибка на обучающих данных увеличилась
    - В поддереве есть хотя бы один чистый лист
    - Корень поддерева использует числовой признак
  correct: 0
  id: 028-post-pruning-1
  fingerprint: d7560ba4
- concept: cost-complexity pruning балансирует ошибку дерева и штраф за число листьев
  question: Заполни коэффициент, управляющий штрафом за сложность дерева в критерии cost-complexity pruning.
  explanation: Параметр α задаёт цену каждого листа. Чем он больше, тем сильнее штрафуется сложность и тем компактнее становится итоговое дерево.
  kind: cloze
  template: R_α(T) = R(T) + ___ · |L(T)|
  answer: α
  accept:
    - alpha
    - альфа
  id: 028-post-pruning-2
  fingerprint: 67e6b833
- concept: post-pruning может сохранить полезные глубокие разбиения, которые pre-pruning отсёк бы преждевременно
  question: Объясни своими словами, почему post-pruning иногда даёт лучшее дерево, чем ранняя остановка роста.
  explanation: При ранней остановке решение принимается до появления возможных полезных продолжений. Post-pruning оценивает уже выросшую структуру и поэтому может отличить бесполезную сложность от цепочки разбиений, которая действительно улучшает обобщение.
  kind: open
  reference: Post-pruning сначала разрешает построить глубокие разбиения, а затем удаляет части, не оправдавшие сложность. Поэтому слабое промежуточное разбиение может сохраниться, если следующие за ним разбиения вместе дают полезный результат.
  id: 028-post-pruning-3
  fingerprint: ff99e9a9
