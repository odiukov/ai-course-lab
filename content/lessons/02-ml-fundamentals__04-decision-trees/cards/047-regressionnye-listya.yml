- concept: регрессионное дерево задаёт кусочно-постоянное предсказание по областям листьев
  question: Два объекта имеют разные значения признаков, но регрессионное дерево направляет их в один лист. Как соотносятся их предсказания?
  explanation: Внутри листа регрессионное дерево не уточняет прогноз по значениям признаков. Для всей соответствующей области оно выдаёт одну константу — среднее целевых значений обучающих объектов листа.
