- concept: энтропия узла вычисляется по долям классов
  question: В узле дерева решений находятся три объекта класса A и пять объектов класса B. Чему равна энтропия узла в битах? Округли ответ до тысячных.
  explanation: Доли классов равны 3/8 и 5/8. Поэтому H = −(3/8 · log₂(3/8) + 5/8 · log₂(5/8)) ≈ 0.954 бита.
  kind: numeric
  answer: 0.954
  tolerance: 0.001
  id: 008-formula-entropii-1
  fingerprint: 31cea4e6
- concept: энтропия максимальна при равновероятных классах
  question: В каком бинарном узле дерева решений энтропия будет наибольшей?
  explanation: Максимальная неопределённость возникает, когда классы равновероятны. Для двух классов такая энтропия равна 1 биту; у чистого узла она равна 0.
  kind: choice
  options:
    - Один класс встречается намного чаще другого
    - Оба класса представлены в равных долях
    - Все объекты принадлежат одному классу
  correct: 1
  id: 008-formula-entropii-2
  fingerprint: 0bc83d6e
- concept: энтропия и Gini имеют разную вероятностную интерпретацию
  question: Объясни своими словами, чем различается смысл энтропии и Gini impurity, хотя обе меры оценивают неоднородность узла.
  explanation: 'Обе меры равны нулю в чистом узле и растут при смешивании классов, но описывают разные величины: энтропия — информационную неопределённость, Gini — вероятность ошибки при случайном назначении метки.'
  kind: open
  reference: Энтропия выражает оставшуюся неопределённость или недостающую информацию в битах. Gini impurity интерпретируется как вероятность ошибочной метки при случайном назначении класса согласно распределению классов в узле.
  id: 008-formula-entropii-3
  fingerprint: 15b26449
