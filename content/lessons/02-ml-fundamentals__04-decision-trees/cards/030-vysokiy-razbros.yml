- concept: замена раннего разбиения меняет состав дочерних выборок и вызывает каскад изменений структуры дерева
  question: Два дерева обучены на почти одинаковых выборках, но выбрали разные разбиения в корне. Объясните, почему их последующие узлы и предсказания тоже могут сильно различаться.
  explanation: Построение дерева рекурсивно зависит от состава данных в каждом узле. Поэтому изменение раннего разбиения меняет задачи обучения во всех расположенных ниже узлах и может привести к другой структуре и другим предсказаниям.
  kind: open
  reference: Разные корневые разбиения по-разному распределяют примеры между дочерними узлами. В каждом узле дерево затем ищет лучшее разбиение уже на новом составе данных, поэтому меняются следующие условия, листья и пути объектов. Так локальное различие у корня распространяется на всё дерево.
