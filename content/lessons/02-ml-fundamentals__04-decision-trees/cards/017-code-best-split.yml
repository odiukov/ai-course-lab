- concept: кандидатами на порог служат середины между соседними уникальными значениями признака
  question: У признака есть отсортированные уникальные значения a < b < c. Какой набор порогов следует проверить при поиске лучшего разбиения?
  explanation: Порог между каждой парой соседних уникальных значений создаёт отдельное разбиение выборки. Середина интервала — удобный представитель такого порога; дополнительные точки внутри того же интервала дали бы то же разделение.
  kind: choice
  options:
    - (a + b) / 2 и (b + c) / 2
    - a, b и c
    - (a + c) / 2
  correct: 0
  id: 017-code-best-split-1
  fingerprint: ab11e2bc
- concept: параметры лучшего разбиения нужно обновлять вместе с его значением information gain
  question: Заполни обновление состояния поиска так, чтобы сохранённые признак и порог всегда соответствовали сохранённому gain.
  explanation: Значение gain без соответствующих ему признака и порога не позволяет воспроизвести найденное разбиение. Поэтому при появлении лучшего кандидата все связанные поля обновляют одновременно.
  kind: cloze
  template: |-
    if gain > best_gain:
        best_feature, best_threshold, best_gain = ___
  answer: (feature_idx, threshold, gain)
  accept:
    - feature_idx, threshold, gain
    - (feature, threshold, gain)
  id: 017-code-best-split-2
  fingerprint: 4649ed18
