- concept: Gini impurity вычисляется по долям всех классов в узле
  question: В узле находятся 8 кошек и 3 собаки. Чему примерно равен Gini impurity?
  explanation: Доли классов равны 8/11 и 3/11. Поэтому Gini = 1 − ((8/11)² + (3/11)²) = 48/121 ≈ 0.397. Аналогично для 6 кошек и 4 собак из урока получается 0.48.
  kind: numeric
  answer: 0.397
  tolerance: 0.001
  id: 006-formula-gini-1
  fingerprint: c84c7c63
- concept: Gini impurity минимален, когда узел содержит только один класс
  question: При каком составе узла Gini impurity принимает минимально возможное значение?
  explanation: Если все примеры относятся к одному классу, сумма квадратов долей равна 1, поэтому Gini равен 0. В узле с несколькими классами возможны ошибочные назначения, и impurity становится положительной.
  kind: choice
  options:
    - Все классы представлены одинаковыми долями
    - Один класс преобладает, но встречаются и другие
    - Примеры распределены между несколькими классами неравномерно
    - Все примеры принадлежат одному классу
  correct: 3
  id: 006-formula-gini-2
  fingerprint: b1070d65
