- concept: случайный лес строит разнообразные деревья и агрегирует их предсказания
  question: Расположи этапы построения и применения случайного леса в правильном порядке.
  explanation: 'Деревья сначала получают отличающиеся обучающие выборки и наборы доступных признаков. После обучения их ответы объединяют: голосованием в классификации или усреднением в регрессии.'
  kind: order
  items:
    - Создать bootstrap-выборки из обучающих данных
    - Обучить деревья, рассматривая случайные подмножества признаков при разбиениях
    - Получить предсказание каждого дерева для нового объекта
    - Объединить предсказания деревьев голосованием или усреднением
  id: 031-skhema-lesa-1
  fingerprint: 01d3c66e
- concept: в классификации случайный лес голосует за класс, а в регрессии усредняет числовые прогнозы
  question: Как случайный лес обычно объединяет ответы деревьев для классификации и регрессии?
  explanation: Метки классов объединяют голосованием, а числовые значения — средним. Так итог зависит от коллектива деревьев, а не от единственной модели.
  kind: choice
  options:
    - Для классификации выбирает класс большинством голосов, для регрессии усредняет прогнозы
    - Для классификации усредняет названия классов, для регрессии выбирает самое глубокое дерево
    - В обеих задачах использует только ответ дерева с наименьшей глубиной
    - В обеих задачах выбирает наиболее часто использованный признак
