- concept: агрегирование слабо связанных деревьев снижает разброс ансамбля
  question: Объясни своими словами, почему случайный лес обычно устойчивее отдельного дерева к небольшим изменениям обучающих данных.
  explanation: Устойчивость возникает благодаря разнообразию деревьев и агрегированию их ответов. Если ошибки слабо связаны, случайная ошибка отдельного дерева редко определяет результат всего леса.
  kind: open
  reference: Отдельные деревья обучаются на различающихся выборках и используют случайные подмножества признаков, поэтому их ошибки совпадают не полностью. Голосование или усреднение ослабляет случайные отклонения отдельных деревьев и снижает разброс итоговой модели.
