- concept: точный поиск глобально оптимального дерева является NP-трудной задачей из-за комбинаторного числа вариантов
  question: Почему алгоритмы обучения деревьев обычно не перебирают все возможные деревья, чтобы найти глобально оптимальное?
  explanation: Каждый выбор разбиения создаёт новые узлы с собственными вариантами продолжения. Число возможных структур и порогов быстро растёт, поэтому полный поиск глобального оптимума вычислительно слишком дорог.
  kind: open
  reference: Нужно сравнить комбинаторно большое число сочетаний признаков, порогов и продолжений разбиений. Такой поиск является NP-трудным и быстро становится непрактичным, поэтому обычно применяют жадное построение.
  id: 018-zhadnyy-vybor-2
