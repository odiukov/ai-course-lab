- concept: дерево естественно моделирует взаимодействия признаков последовательными разбиениями
  question: Объясни своими словами, как дерево может учесть ситуацию, в которой влияние дохода зависит от типа занятости, не создавая вручную отдельный признак взаимодействия.
  explanation: 'Последовательные разбиения задают условные зависимости: признак, проверяемый глубже, влияет только на объекты, дошедшие до соответствующей ветви. Так дерево само строит полезные взаимодействия признаков.'
  kind: open
  reference: Дерево может сначала разделить объекты по типу занятости, а затем проверить доход только внутри нужной ветви. Поэтому разные группы получают разные правила, и зависимость между признаками возникает из структуры дерева.
  id: 053-derevya-protiv-setey-2
  fingerprint: a0e3f2a7
- concept: нейросети предпочтительнее деревьев при наличии пространственной или последовательной структуры данных
  question: Какое свойство данных сильнее всего говорит в пользу нейросети, а не дерева решений?
  explanation: 'Нейросети особенно полезны, когда взаимное расположение элементов имеет смысл: соседние пиксели образуют детали изображения, а порядок слов — фразу. В плоской таблице такой структуры обычно нет.'
  kind: choice
  options:
    - Признаки собраны в обычную таблицу
    - Набор содержит числовые и категориальные столбцы
    - Порядок или близость элементов несут важную информацию
    - Нужно быстро получить интерпретируемую базовую модель
  correct: 2
