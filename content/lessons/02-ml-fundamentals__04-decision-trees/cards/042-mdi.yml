- concept: вклад узла в MDI равен снижению примеси, взвешенному по доле попавших в узел объектов
  question: Дерево обучено на 160 объектах. В узел попали 48 объектов, а разбиение в нём уменьшило примесь на 0.25. Каков вклад этого узла в MDI использованного признака?
  explanation: 'Нужно умножить долю объектов в узле на снижение примеси: (48 / 160) × 0.25 = 0.075. Поэтому сильное очищение небольшого узла может дать умеренный вклад.'
  kind: numeric
  answer: 0.075
  tolerance: 0.001
  id: 042-mdi-1
  fingerprint: 448530b6
- concept: MDI признака накапливает его взвешенные вклады во всех использующих его узлах ансамбля
  question: Один признак используется в нескольких узлах разных деревьев случайного леса. Как из этих разбиений формируется его MDI-важность?
  explanation: Каждое разбиение начисляет признаку вклад с учётом снижения примеси и размера узла. Эти вклады суммируются по узлам и деревьям, после чего итоговые важности могут быть нормализованы.
  kind: choice
  options:
    - Складываются взвешенные снижения примеси во всех узлах, где использован признак
    - Берётся только наибольшее снижение примеси среди всех таких узлов
    - Подсчитывается только количество разбиений с этим признаком
    - Берётся глубина первого узла, в котором встретился признак
  correct: 0
