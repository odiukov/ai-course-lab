- concept: фиксация random_state делает случайные операции воспроизводимыми
  question: Инженер сравнивает две конфигурации случайного леса и хочет, чтобы различие результатов не объяснялось новым случайным разбиением данных или другой случайностью при построении леса. Что следует сделать?
  explanation: Одинаковый random_state позволяет воспроизвести случайное разделение и построение леса. Тогда при изменении одного гиперпараметра сравнение меньше зависит от случайных различий между запусками.
