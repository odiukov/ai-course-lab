- concept: расширение допустимой глубины не увеличивает минимально достижимую ошибку на обучающих данных
  question: Объясни своими словами, почему дерево с большей допустимой глубиной при оптимальном обучении не обязано иметь большую ошибку на обучающей выборке, чем более мелкое дерево.
  explanation: Множество деревьев, доступных при меньшем ограничении глубины, входит в множество деревьев, доступных при большем. Дополнительная глубина расширяет выбор модели, но одновременно позволяет подгоняться под случайные особенности обучающих данных.
  kind: open
  reference: 'Более глубокому дереву доступны все разбиения мелкого дерева: оно может просто не использовать дополнительную глубину. Кроме того, новые уровни позволяют разделить области подробнее. Поэтому минимально достижимая обучающая ошибка может уменьшиться или остаться прежней, хотя качество на новых данных при этом не гарантировано.'
  id: 026-glubina-granitsy-2
  fingerprint: f07f33c1
