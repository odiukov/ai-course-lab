- concept: information gain равен примеси родителя минус взвешенная по размерам примесь дочерних узлов
  question: Узел из 12 объектов имеет примесь 0.47. После разбиения в левом дочернем узле оказалось 7 объектов с примесью 0.23, а в правом — 5 объектов с примесью 0.05. Чему равен information gain?
  explanation: 'Взвешенная примесь после разбиения: 7/12 × 0.23 + 5/12 × 0.05 = 0.155. Поэтому information gain равен 0.47 − 0.155 = 0.315.'
  kind: numeric
  answer: 0.315
  tolerance: 0.001
  id: 011-information-gain-1
  fingerprint: 771c83a3
- concept: жадное построение дерева выбирает в текущем узле разбиение с максимальным information gain
  question: Для текущего узла рассчитан information gain трёх возможных разбиений. Какое из них выберет жадный алгоритм?
  explanation: Жадный алгоритм выбирает разбиение B, потому что его information gain равен 0.31 — это наибольшее уменьшение примеси среди рассматриваемых вариантов.
  kind: choice
  options:
    - Разбиение A с information gain 0.14
    - Разбиение B с information gain 0.31
    - Разбиение C с information gain 0.26
  correct: 1
  id: 011-information-gain-2
