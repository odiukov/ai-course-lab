- concept: достижение максимальной глубины останавливает разбиение даже при положительном information gain
  question: В узле найдено разбиение с положительным information gain, но узел уже находится на предельной глубине. Что произойдёт при включённом ограничении max_depth?
  explanation: max_depth — условие предварительной остановки. После достижения предельной глубины дерево не создаёт потомков, даже если доступное разбиение могло бы улучшить чистоту обучающих данных.
  kind: choice
  options:
    - Узел останется листом
    - Разбиение будет выполнено, поскольку information gain положителен
    - Предел глубины автоматически увеличится
    - Дерево удалит все предыдущие разбиения на этой ветви
  correct: 0
  id: 027-pre-pruning-1
  fingerprint: 6e3d779f
- concept: слишком строгие ограничения роста дерева могут привести к недообучению
  question: Почему нельзя гарантированно устранить переобучение, просто выбрав максимально строгие ограничения max_depth и минимального размера листа?
  explanation: Ограничения роста регулируют компромисс между запоминанием и способностью описать реальные закономерности. Слабые ограничения допускают переобучение, а чрезмерно строгие повышают смещение модели и вызывают недообучение.
  kind: open
  reference: Слишком строгие ограничения преждевременно запрещают полезные разбиения. Дерево становится недостаточно сложным, не улавливает закономерности и недообучается, поэтому параметры роста следует подбирать по качеству на валидационных данных.
  id: 027-pre-pruning-2
  fingerprint: 2f4de257
