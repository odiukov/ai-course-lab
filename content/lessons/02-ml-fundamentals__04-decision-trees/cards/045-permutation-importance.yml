- concept: перестановка сохраняет распределение значений признака, но разрушает его связи с конкретными объектами
  question: Что происходит со столбцом признака при вычислении permutation importance?
  explanation: Перестановка не меняет сами значения и их частоты, но переносит их в другие строки. Поэтому разрушаются полезные связи признака с целевой переменной и остальными характеристиками объектов.
  kind: choice
  options:
    - Набор его значений сохраняется, но соответствие значений строкам разрушается
    - Все его значения заменяются средним
    - Вместе с ним перемешиваются правильные ответы
    - Столбец полностью удаляется из набора данных
  correct: 0
  id: 045-permutation-importance-1
  fingerprint: 65b4e965
- concept: permutation importance оценивают без переобучения проверяемой модели
  question: Почему после перемешивания признака модель нельзя переобучать перед повторной оценкой качества?
  explanation: Предсказания до и после перестановки должна делать одна и та же обученная модель. Тогда изменение качества показывает её чувствительность к нарушению информации в выбранном признаке.
  kind: open
  reference: Нужно проверить зависимость уже обученной модели от правильных значений признака. Переобучение позволило бы модели приспособиться к изменённым данным, поэтому сравнивались бы разные модели, а не работа одной модели с сохранённой и разрушенной связью признака.
  id: 045-permutation-importance-2
  fingerprint: 3623c897
- concept: усреднение результатов нескольких перестановок уменьшает случайность оценки важности
  question: После пяти независимых перестановок одного признака качество модели снизилось на 0.03, 0.07, 0.05, 0.09 и 0.06. Чему равна усреднённая permutation importance?
  explanation: Среднее падение равно (0.03 + 0.07 + 0.05 + 0.09 + 0.06) / 5 = 0.06. Несколько перестановок дают более устойчивую оценку, чем один случайный результат.
  kind: numeric
  answer: 0.06
  tolerance: 0.0001
  id: 045-permutation-importance-3
  fingerprint: 05d46051
