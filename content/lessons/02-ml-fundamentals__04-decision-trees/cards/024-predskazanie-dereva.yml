- concept: предсказание не переобучает дерево и не изменяет сохранённые разбиения
  question: Что происходит с параметрами уже обученного дерева решений при предсказании для новой строки?
  explanation: Во время предсказания метод обхода только читает сохранённые узлы. Поиск разбиений, вычисление примеси и изменение порогов относятся к обучению, а не к применению дерева.
  kind: choice
  options:
    - Дерево заново ищет лучшие разбиения с учётом новой строки
    - Пороги сдвигаются к значениям признаков новой строки
    - Сохранённые признаки и пороги только читаются, а дерево не изменяется
    - Для каждого предсказания заново вычисляются важности признаков
  correct: 2
  id: 024-predskazanie-dereva-1
  fingerprint: be4aeb17
- concept: каждый внутренний узел самостоятельно задаёт проверяемый признак, поэтому признак может повторяться на одном пути
  question: Почему при обходе дерева нельзя выбрать признак один раз и использовать его во всех последующих сравнениях?
  explanation: 'Условие берётся из текущего узла: используется значение x[node["feature"]] и сохранённый в этом же узле threshold. Переход к дочернему узлу может изменить и проверяемый признак, и порог.'
  kind: open
  reference: Каждый внутренний узел хранит собственный индекс признака и порог. Поэтому соседние узлы могут проверять разные признаки, а один и тот же признак может встретиться на пути несколько раз, в том числе с разными порогами.
  id: 024-predskazanie-dereva-2
  fingerprint: '9412e300'
