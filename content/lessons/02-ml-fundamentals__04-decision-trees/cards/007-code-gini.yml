- concept: пустой набор меток обрабатывается до вычисления долей
  question: Как должна поступить функция вычисления Gini impurity, если коллекция меток пуста?
  explanation: Для пустого входа функция возвращает 0.0. Проверка должна выполняться до вычисления долей, иначе деление количества класса на общее число меток приведёт к делению на ноль.
  kind: choice
  options:
    - Добавить фиктивную метку и продолжить вычисление
    - Сразу вернуть значение отсутствия примеси
    - Считать пустую коллекцию отдельным классом
    - Вычислить доли, а затем заменить ошибку результатом
  correct: 1
  id: 007-code-gini-1
  fingerprint: 02bd18be
- concept: словарь частот позволяет обрабатывать произвольные метки и любое количество классов
  question: Почему при реализации gini_impurity лучше собирать частоты в словаре по фактическим меткам, а не создавать отдельные счётчики для заранее известных классов?
  explanation: Ключом словаря служит сама метка, а значением — число её появлений. Поэтому один алгоритм работает и со строковыми, и с числовыми метками, а также с многоклассовыми наборами.
  kind: open
  reference: Словарь создаёт ключ для каждой реально встретившейся метки, поэтому реализация не зависит от названий и заранее заданного количества классов.
  id: 007-code-gini-2
  fingerprint: cf58c9af
