- concept: пустая часть разбиения должна сохранять структуру массивов
  question: Ни одна строка матрицы признаков X не прошла условие разбиения. Каким должен быть результат для этой части?
  explanation: Пустая ветвь является допустимым результатом применения маски. Матрица признаков должна сохранить размерность и число столбцов, чтобы последующий код мог обрабатывать результат единообразно.
  kind: choice
  options:
    - Пустая матрица признаков с тем же числом столбцов и соответствующий пустой массив ответов
    - Значение None вместо обоих массивов
    - Пустой одномерный массив признаков без информации о столбцах
    - Исключение, потому что каждая часть обязана содержать строки
