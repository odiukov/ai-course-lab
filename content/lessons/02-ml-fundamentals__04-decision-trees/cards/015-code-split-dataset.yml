  question: Строки массива идут в порядке «Марс, Луна, Солнце, Венера», а булева маска равна `[True, False, True, True]`. В каком порядке строки окажутся после применения маски?
  explanation: Булева индексация выбирает строки с истинным значением маски, не переставляя их. Поэтому относительный порядок прошедших условие строк сохраняется.
  kind: choice
