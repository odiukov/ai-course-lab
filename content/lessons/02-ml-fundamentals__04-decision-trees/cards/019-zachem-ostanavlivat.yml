- concept: чистые листья не гарантируют хорошего обобщения дерева
  question: Объясни своими словами, почему чистые листья неограниченного дерева не доказывают, что оно нашло полезную закономерность.
  explanation: Чистота листа описывает только находящиеся в нём обучающие примеры. Если дерево довело разбиения до отдельных строк, оно способно запомнить их ответы, не выявив правило, которое переносится на новые объекты.
  kind: open
  reference: Дерево может добиться чистоты, последовательно изолируя отдельные обучающие примеры с помощью очень узких разбиений. Тогда листья отражают не устойчивую связь признаков с ответом, а шум и случайные особенности конкретной выборки, поэтому качество на новых данных может быть низким.
  id: 019-zachem-ostanavlivat-2
