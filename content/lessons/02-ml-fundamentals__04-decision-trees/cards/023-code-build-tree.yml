- concept: каждый рекурсивный вызов строит поддерево только по данным соответствующей дочерней группы
  question: Почему после разбиения нельзя передавать исходные X и y в рекурсивные вызовы построения дочерних ветвей?
  explanation: 'Рекурсия должна решать меньшие подзадачи: левая ветвь строится на левой части данных, правая — на правой. Передача исходного набора сохраняет прежнюю задачу и приводит к повторению одного и того же разбиения.'
  kind: open
  reference: Каждый дочерний вызов должен получить только строки и метки своей группы. На исходных данных поиск снова может выбрать тот же вопрос, поэтому задача не уменьшается, дерево повторяет разбиение и приближается к листу лишь за счёт внешних ограничений.
