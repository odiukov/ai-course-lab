- concept: 'порядок операций внутри одного витка evaluator-optimizer: критика, затем проверка остановки, затем запись в историю и переписывание'
  question: Расставь шаги одного витка цикла итеративного улучшения (генератор уже дал нулевой вывод) в правильном порядке.
  explanation: 'Критика обязана предшествовать проверке остановки: иначе останавливаться не по чему и первый виток завершится, ничего не проверив. Проверка остановки стоит до переписывания, чтобы принятый вывод не вызывал лишний запрос к модели. Запись в историю идёт до сборки промпта, иначе переписыватель получит пустую историю и вернётся к уже исправленной ошибке.'
  kind: order
  items:
    - получить критику на текущий вывод
    - проверить условие остановки по этой критике и номеру витка
    - дописать пару «вывод — критика» в историю
    - собрать промпт переписывания из задачи, текущего вывода, критики и истории
    - получить новый вывод и увеличить счётчик витков
  id: 027-refine-loop-1
  fingerprint: 89039dc8
- concept: состояние цикла (текущий вывод, счётчик, история) держит только оркестратор, роли остаются функциями без памяти и получают всё аргументами
  question: 'Ты собираешь цикл self-refine из отдельных функций: генератор, критик, сборщик промпта переписывания, предикат остановки. Где корректно хранить номер витка и накопленную историю пар «вывод — критика»?'
  explanation: Единственное место состояния — цикл. Предикат остановки не считает витки сам, ему передают число; сборщик промпта не помнит прошлые версии, ему передают историю. Такие функции без памяти тестируются по одной, детерминированно, без подготовки скрытого контекста. Глобальные переменные и состояние внутри клиента LLM ломают и тестируемость, и возможность гонять два цикла параллельно.
  kind: choice
  options:
    - В глобальных переменных модуля, чтобы любая из функций могла их прочитать
    - Только в теле оркестрирующего цикла; остальные функции получают нужные значения аргументами и возвращают результат
    - Внутри предиката остановки — он единственный, кому нужен счётчик
    - В самом объекте клиента LLM, раз он и так делает все вызовы
  correct: 1
  id: 027-refine-loop-2
  fingerprint: 29c2b95a
- concept: проверяльщик передаётся как аргумент, поэтому переключение Self-Refine на CRITIC не трогает тело цикла
  question: Цикл принимает функцию проверки как параметр. Что это даёт на практике?
  explanation: 'Self-Refine и CRITIC отличаются ровно шагом обратной связи: самооценка модели против вердикта внешнего инструмента. Если проверяльщик — аргумент с фиксированным контрактом (задача, вывод) → критика, обе архитектуры делят одно тело цикла, и их можно сравнивать на одном коде. Ни числа витков, ни формата критики выбор такого параметра сам по себе не задаёт.'
  kind: choice
  options:
    - Позволяет пропускать шаг критики, когда проверка дорогая
    - Гарантирует, что цикл сойдётся не более чем за 12 витков
    - Переключение между самокритикой модели и внешним верификатором на инструментах меняет только аргумент вызова, тело цикла остаётся прежним
    - Даёт критику структурированный формат вместо естественного языка
  correct: 2
  id: 027-refine-loop-3
  fingerprint: 2039d95e
