- concept: галлюцинация — самое правдоподобное продолжение, поэтому те же веса оценивают её как правдоподобную, и лишние витки лишь повторяют оценку
  question: Модель выдала фактическую ошибку, и цикл самокритики прогнали по ней четыре раза подряд. Каждый виток критик пишет «фактических ошибок нет». Объясни своими словами, почему увеличение числа витков здесь не помогает.
  explanation: Ключ — независимость сигнала. Повтор самооценки не добавляет новой информации, потому что оценивающее распределение то же самое. Убедительная галлюцинация обманывает самокритика ровно потому, что убедительность и есть критерий, по которому она была сгенерирована; юнит-тест или поисковую выдачу она обмануть не может.
  kind: open
  reference: 'Галлюцинация возникает не как случайный шум, а как самое правдоподобное для данного распределения продолжение текста. Критик — тот же набор весов, что породил утверждение; он не открывает внешний источник, а спрашивает у себя «похоже ли это на правду», и получает то же «похоже». Каждый новый виток прогоняет ту же оценку по тому же распределению, поэтому даёт тот же ответ: сигнал не обновляется, растёт только видимость подтверждённости. Сдвинуть результат может лишь источник вне модели — поисковик для фактов, интерпретатор для кода, калькулятор для арифметики, тесты для «работает или нет», то есть проверка, результат которой не зависит от красноречия модели.'
  id: 008-slaboe-mesto-2
