- concept: детерминированная проверка структуры не различает содержимое пунктов одинаковой формы
  question: 'Верификатор в цикле проверяет: ровно 5 пунктов, каждый короче 80 символов. Модель выдала 5 пунктов, самый длинный — 71 символ, но в одном пункте указан неверный год исторического события. Что вернёт этот верификатор?'
  explanation: Формальный верификатор оперирует только измеримыми свойствами текста — длиной строки и числом элементов. Для него верная и неверная дата — две строки одинаковой длины. Чтобы поймать фактическую ошибку, нужен верификатор с доступом к внешнему источнику; формат и факт ловятся разными инструментами.
  kind: choice
  options:
    - 'Пустой список претензий: оба ограничения выполнены'
    - Претензию к пункту с неверным годом — счётчик символов подсветит подмену
    - Претензию к количеству пунктов, потому что ошибочный пункт не засчитывается
    - 'Ошибку выполнения: верификатор не может оценить пункт с непроверенным фактом'
  correct: 0
  id: 018-zazemlenie-1
  fingerprint: 12b1aa3d
- concept: верификатор возвращает список претензий, и пустой список служит сигналом остановки цикла
  question: Верификатор возвращает список найденных претензий. Допишите условие выхода из цикла доработки.
  explanation: 'Контракт верификатора — список претензий, а не булев вердикт: список одновременно несёт и решение (пусто = прошло), и материал для шага refine. Пустой список означает, что ни один источник правды не нашёл нарушений; второе условие выхода — исчерпание бюджета итераций через range.'
  kind: cloze
  template: |-
    for i in range(6):
        claims = verify_external(output)
        if ___:
            break
        output = refine(output, claims)
  answer: not claims
  accept:
    - not claims
    - len(claims) == 0
    - claims == []
    - not len(claims)
    - claims == list()
  id: 018-zazemlenie-2
  fingerprint: 51862ea8
- concept: измеримые ограничения выносятся в код, модель-критик остаётся для того, что кодом не измеряется
  question: В цикле evaluator-optimizer часть ограничений можно проверить кодом (число пунктов, длина строки, валидность JSON), а часть — нет (уместность тона, полнота ответа). Объясните, почему измеримые критерии не стоит отдавать модели-критику.
  explanation: 'Разделение по измеримости даёт и надёжность, и экономию: формальные проверки образуют дешёвый фильтр, а дорогой критик работает только там, где линейка бессильна. Побочный эффект — критика по измеримому критерию всегда конкретна (что нарушено и на сколько), тогда как у модели она размыта.'
  kind: open
  reference: 'Детерминированная проверка считает, а не рассуждает: она стоит ноль вызовов LLM, выполняется мгновенно и даёт один и тот же вердикт на одном и том же входе. Модель-критик на тех же критериях дороже, медленнее, недетерминирована и может одобрить нарушение, если текст выглядит убедительно. Поэтому сначала выжимают всё, что формализуется в код, а модель-критика оставляют на остаток — свойства, для которых нет измеримого критерия и нет внешнего источника.'
  id: 018-zazemlenie-3
  fingerprint: 66a8bc5f
