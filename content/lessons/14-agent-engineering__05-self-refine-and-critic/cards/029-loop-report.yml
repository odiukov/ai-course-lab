- concept: функция отчёта возвращает строку, а печать оставляет вызывающему коду — это делает результат сравнимым в тесте
  question: Почему функцию отчёта делают возвращающей строку, а не печатающей внутри себя?
  explanation: 'Возврат значения отделяет формирование текста от способа его доставки: ту же строку можно сравнить в тесте, записать в файл, отправить в лог или напечатать. Печать внутри жёстко прибивает функцию к stdout и заставляет тест перехватывать поток, чтобы добраться до того, что и так могло быть возвращено.'
  kind: choice
  options:
    - Печать внутри быстрее, а возврат строки экономит память
    - Возвращённое значение можно сравнить с ожидаемым в тесте, а печать внутри оставляет проверяемым только перехваченный поток вывода
    - Строка автоматически сохраняется в историю цикла
    - Так функция становится совместима с вызовом из критика
