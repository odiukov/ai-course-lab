  question: История цикла — список из 9 элементов с индексами 0..8. В отчёте человек должен читать «виток 1» … «виток 9». Заполни пропуск.
  explanation: 'Элемент с индексом 5 — шестой виток по счёту человека. Сдвиг делается только при печати: сама история остаётся списком с нулевой индексацией, иначе сломаются срезы и обращение по индексу. Смешивать две нумерации в одном слое — верный источник off-by-one.'
