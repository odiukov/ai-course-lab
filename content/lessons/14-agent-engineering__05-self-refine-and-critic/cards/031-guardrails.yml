- concept: 'срабатывание tripwire: вывод сформирован, валидатор его отвергает через исключение, выдача не происходит, агент генерирует заново'
  question: Расставьте по порядку, что происходит, когда output guardrail отклоняет ответ агента.
  explanation: 'Ключевой момент — исключение (в OpenAI Agents SDK это OutputGuardrailTripwireTriggered) срабатывает после того, как ответ уже готов, но до того, как он опубликован. Порядок именно такой: сначала полный вывод, потом проверка, потом отказ в выдаче, потом новая попытка.'
  kind: order
  items:
    - Агент завершает работу и формирует финальный вывод
    - Валидатор guardrail запускается на этом финальном выводе
    - Валидатор признаёт вывод негодным и бросает tripwire-исключение
    - Вывод не уходит наружу — потребитель его не получает
    - Агент запускается снова и производит новую версию ответа
  id: 031-guardrails-2
  fingerprint: c0af3254
- concept: 'блокирующий валидатор не содержит правки: исправление делает генератор, а завершение цикла обеспечивает ограничение числа попыток'
  question: 'Guardrail на выходе агента умеет только одно: пропустить вывод или отклонить его. Объясните, почему одного такого валидатора недостаточно, чтобы система гарантированно выдала ответ.'
  explanation: 'Валидатор, умеющий только не пускать, задаёт критерий, но не путь к нему. Отсюда два обязательных дополнения к guardrail: содержательная обратная связь для переписывания и ограничение числа витков, иначе система зависает на упрямом дефекте.'
  kind: open
  reference: 'Отклонение — это вердикт, а не правка: валидатор ничего не переписывает, исправляет всегда генератор на следующей попытке. Поэтому, во-первых, отказ полезен ровно настолько, насколько он даёт генератору понять, что чинить (простое «не пропущено» может гонять его по кругу без прогресса), а во-вторых, у цикла нет собственного условия завершения: если генератор раз за разом не проходит проверку, попытки не кончатся. Нужен потолок числа итераций (и решение, что отдавать при его исчерпании: лучший вариант, ошибку или запасной ответ).'
