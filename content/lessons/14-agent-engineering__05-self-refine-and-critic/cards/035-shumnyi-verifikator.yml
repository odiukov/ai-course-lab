  question: Верификатор в цикле generate-verify-refine изредка помечает корректный ответ как непрошедший. Что происходит с качеством по ходу прогона?
  explanation: 'Ключ в том, что refine не проверяет обоснованность претензии, а исполняет её как инструкцию: он ломает то, что было в порядке, — сокращает укладывающийся в лимит пункт, выбрасывает нужный. Ответ на следующем витке — уже не исходный, поэтому «повторная проверка» не возвращает утраченное. Шум не усредняется, он накапливается через состояние цикла.'
  kind: choice
  options:
    - 'Ничего: следующая проверка того же ответа с высокой вероятностью пройдёт и отменит ошибку'
