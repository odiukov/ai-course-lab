  reference: 'Измерить долю ложных срабатываний: прогнать верификатор по набору заведомо корректных ответов и посчитать, как часто он выдаёт «не прошло». Смысл CRITIC в том, что вердикт инструмента не зависит от убедительности формулировок модели; но это преимущество держится ровно настолько, насколько инструмент честен. Шумный верификатор перестаёт нести внешнюю информацию — его вердикт коррелирует не с качеством ответа, а со случайностью, — и цикл платит лишние запросы за ухудшение готового текста. Порядок: сначала калибровка на заведомо правильных входах, потом цикл вокруг верификатора.'
