- concept: 'проверяемость бывает частичной: ответ разбивается на утверждения с внешним судьёй и на остальное, и цикл строится по частям'
  question: 'Задача: написать карточку товара, где есть характеристики (вес, объём батареи, срок гарантии) и рекламный текст. Объясни своими словами, как здесь применять идею внешнего верификатора.'
  explanation: Задача редко целиком проверяема или целиком непроверяема. CRITIC применяется к тем утверждениям, у которых есть источник или исполнитель; остальное честно остаётся Self-Refine.
  kind: open
  reference: 'Ответ делится на две части. Характеристики сверяются со спецификацией производителя — это настоящий верификатор: вердикт берётся из внешней записи и может разойтись с тем, что написала модель. Рекламная часть внешнего судьи не имеет, для неё остаётся самокритика (Self-Refine). Практический вывод: заземлять критику там, где есть источник, и не приделывать инструмент к рекламной части ради формы — сигнала он не даст, а лишний вызов и задержку добавит.'
