- concept: 'поведение заглушки при исчерпании скрипта: возврат последнего элемента вместо исключения оставляет условием остановки проверку, а не аварию'
  question: Скриптованная заглушка генератора хранит 6 заготовленных черновиков. Цикл запрашивает седьмой. Что должна вернуть заглушка?
  explanation: 'Лишний вызов не должен решать судьбу прогона. Повтор последнего элемента делает дополнительный виток безвредным: вывод не меняется, проверка отрабатывает как обычно, и цикл останавливается по своему штатному условию (верификатор прошёл либо исчерпан лимит итераций). Исключение подменяет отказ цикла аварией заглушки, пустая строка подсовывает данные, которых в фикстуре не было, а зацикливание на первый черновик снова ломает проверку и делает цикл бесконечным.'
  kind: choice
  options:
    - Последний, шестой черновик — и повторять его на всех дальнейших вызовах
    - Возбудить IndexError, чтобы цикл сразу упал
    - Пустую строку как признак конца скрипта
    - Снова первый черновик, зациклив последовательность
