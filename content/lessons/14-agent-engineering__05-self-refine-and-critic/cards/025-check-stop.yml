- concept: 'самоотчёт модели как единственное условие остановки ломается в обе стороны: слишком ранняя остановка и отсутствие остановки вообще'
  question: 'Инженер оставил в цикле улучшения ровно одно условие выхода: «останавливаемся, когда модель на шаге критики говорит, что править нечего». Потолка по числу витков нет, верификатора нет. Опиши два разных способа, которыми такой цикл может сломаться, и чем каждый лечится.'
  explanation: 'Самоотчёт — самое слабое из условий: он врёт систематически в сторону «всё нормально», но при несходящихся правках может не сработать вовсе. Поэтому дефолт 2026 года держит его в связке с минимумом витков и обязательным потолком, а настоящий верификатор ставит выше него.'
  kind: open
  reference: 'Первый сбой — остановка слишком рано: модель склонна одобрить собственный вывод с первой же попытки, и цикл выходит, не сделав ни одной содержательной правки; лечится минимумом витков (например, засчитывать «замечаний нет» только начиная со второго). Второй сбой — цикл не останавливается никогда: если правки не сходятся и критика каждый раз находит новое, условие выхода не срабатывает и цикл вертится бесконечно, сжигая вызовы; лечится жёстким потолком max_iterations, на котором цикл выходит с последней версией как есть. Плюс третье: там, где есть внешняя проверка (тесты, типы, assert в guardrail), её успех должен иметь приоритет над самоощущением модели.'
  id: 025-check-stop-2
