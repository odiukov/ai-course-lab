- concept: детерминированный вход изолирует переменную при сравнении двух архитектур цикла
  question: Команда сравнивает пять вариантов цикла evaluator-optimizer и хочет понять, какой вариант ловит больше дефектов. Генератор — живая модель с temperature 0.8. Почему для сравнения генератор заменяют записанным фиксированным черновиком?
  explanation: 'Это обычный контроль переменной: сравнивать можно только то, что отличается. При стохастическом генераторе один прогон даёт кривой черновик, другой — сразу валидный, и разница трасс объясняется удачей, а не устройством критика. Фиксация входа делает наблюдаемое расхождение свойством сравниваемых ролей и воспроизводимым при каждом запуске.'
  kind: choice
  options:
    - Записанный черновик даёт более качественный текст, чем модель
    - Иначе различия в трассах смешиваются с разбросом самого генератора и нельзя приписать их сравниваемым вариантам
    - Модель нельзя использовать в цикле, где больше одного критика
    - Фиксированный черновик автоматически проходит любой формальный верификатор
  correct: 1
  id: 014-fonogramma-1
  fingerprint: 1d8d8a3d
- concept: замена реализации генератора на живой вызов не задевает остальные роли, если сохранён контракт функции
  question: Цикл отлажен на записанном сценарии генерации. Что должно выполняться, чтобы переход на живую модель свёлся к правке одной функции?
  explanation: 'Роли связаны контрактом: критик, верификатор и refine получают на вход текст вывода и ничего не знают о том, откуда он взялся. Пока контракт держится, подмена скрипта на сетевой вызов локальна. Если же критик завязан на конкретные строки фикстуры, отладка на скрипте перестаёт переноситься на живой прогон.'
  kind: choice
  options:
    - Критик и верификатор должны хранить копию записанного сценария
    - Функция генерации должна сохранить сигнатуру и формат возвращаемого вывода, а остальные роли — зависеть только от него, а не от источника
    - Все роли должны выполняться одной и той же моделью
    - Верификатор должен быть переписан под вероятностный вывод модели
  correct: 1
  id: 014-fonogramma-2
  fingerprint: 9aa28591
- concept: фиксированная фикстура проверяет только те дефекты, которые в неё заложены
  question: Цикл самокоррекции отлажен на одном заранее записанном черновике с заложенными дефектами и стабильно их чинит. Какой вывод из этого сделать нельзя и что нужно, чтобы его сделать?
  explanation: 'Детерминизм даёт воспроизводимость, но не репрезентативность. Это две разные задачи: отладка/сравнение — на фиксированном входе, оценка — на выборке из настоящего распределения.'
  kind: open
  reference: Нельзя заключить, что цикл работает на реальном распределении выводов модели. Фикстура покрывает только те дефекты, которые автор в неё вписал (например, лишний пункт, превышение длины, одна фактическая ошибка); дефекты, которых в ней нет, цикл никогда не встречал. Скриптовый вход годится для отладки и для воспроизводимого сравнения архитектур, но оценка качества требует прогонов на живом генераторе с набором реальных выводов и измерением доли пойманных дефектов и ложных срабатываний.
  id: 014-fonogramma-3
  fingerprint: 30e7d187
