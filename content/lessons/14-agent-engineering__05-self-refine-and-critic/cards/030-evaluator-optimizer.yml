- concept: расхождение промптов evaluator и optimizer означает разные задачи и разные критерии, а не перефразировку одной просьбы
  question: Цикл evaluator-optimizer собран на одной модели. Какая пара промптов действительно задаёт две разные роли, а не один вызов, оплаченный дважды?
  explanation: 'Расхождение — это разные задачи и разный набор критериев, а не синонимы одной просьбы. Вариант с «посмотри, всё ли хорошо» / «поправь, если что-то не так» — одни и те же слова в двух вызовах, модель читает их как одну просьбу и отвечает штампом «одобрено». Ни temperature, ни размер модели ролей не создают: роль задаётся содержанием промпта.'
  kind: choice
  options:
    - 'Evaluator: «Посмотри, всё ли хорошо с ответом». Optimizer: «Поправь, если что-то не так»'
    - 'Evaluator: «Ты придирчивый редактор. Проверь ровно шесть требований к формату и верни список нарушений или слово PASS». Optimizer: «Вот текст и список нарушений. Устрани перечисленное, качество не оценивай»'
    - Evaluator и optimizer получают один и тот же текст промпта, но вызываются с разной temperature
    - Evaluator и optimizer получают один и тот же промпт, но optimizer работает на модели покрупнее
  correct: 1
  id: 030-evaluator-optimizer-1
  fingerprint: 858b5e47
- concept: промпт каждой роли явно запрещает действие соседней роли, иначе роли сливаются внутри одного вызова
  question: Зачем в промпт optimizer добавляют явный запрет «не оценивай качество», а в промпт evaluator — запрет переписывать текст?
  explanation: 'Без явного запрета модель охотно делает обе вещи сразу: критик заодно переписывает, правщик заодно хвалит результат. Тогда оркестратору нечего сравнивать — вердикт и правка приходят из одного акта рассуждения, и цикл вырождается в один вызов. Негативная инструкция удерживает контракт каждой роли.'
  kind: choice
  options:
    - Чтобы сократить длину ответа и сэкономить токены на каждом витке
    - 'Чтобы каждая роль выполняла ровно своё действие: иначе optimizer возвращает вердикт вместо правки, evaluator отдаёт готовый текст вместо списка дефектов, и разделение ролей исчезает'
    - Чтобы модель не выходила за пределы контекстного окна при длинной истории
    - Чтобы можно было запускать обе роли параллельно, а не последовательно
  correct: 1
  id: 030-evaluator-optimizer-2
  fingerprint: 1096c9be
- concept: 'две роли evaluator-optimizer задаются содержанием промптов, а не разными моделями: одна модель допустима, одинаковые формулировки — нет'
  question: В паттерне evaluator-optimizer обязательно ли брать разные модели для двух ролей? Объясни своими словами, что именно обязано различаться, а что может совпадать.
  explanation: Различие ролей живёт в промптах, а не в весах. Разные модели — необязательная опция; одинаковые промпты — гарантированная поломка цикла остановки.
  kind: open
  reference: 'Модель может быть одна — Anthropic не требует двух разных моделей. Обязаны различаться формулировки промптов: evaluator получает роль придирчивого проверяющего и закрытый список измеримых критериев, а на выходе отдаёт перечень дефектов либо сигнал прохождения; optimizer получает текст плюс этот перечень и задачу устранить перечисленное, без оценки качества. Пока формулировки совпадают, двух ролей нет — есть один вызов, сделанный дважды, и evaluator ставит штамп «одобрено» на первом же витке.'
  id: 030-evaluator-optimizer-3
  fingerprint: 81341ec7
