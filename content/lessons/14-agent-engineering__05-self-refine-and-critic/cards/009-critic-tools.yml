- concept: CRITIC даёт выигрыш только там, где существует внешний верификатор; без него он вырождается в Self-Refine
  question: На какой из задач петля с внешней проверкой (CRITIC) НЕ даст выигрыша по качеству по сравнению с обычной петлёй самокритики?
  explanation: 'Выразительность слогана не проверяется поисковиком, интерпретатором, калькулятором или тестом — внешнего верификатора для неё нет, и петля схлопывается в Self-Refine. Год берётся поиском, падающая функция — запуском кода и тестами, сумма — калькулятором. Приделывать верификатор-заглушку к творческой задаче вредно: платишь лишней задержкой и лишним запросом, а сигнала не получаешь.'
  kind: choice
  options:
    - Сделать слоган рекламной кампании более выразительным
    - Уточнить год основания компании в справке для клиента
    - Починить функцию парсинга, которая падает на пустом вводе
    - Пересчитать сумму скидки в коммерческом предложении
  correct: 0
  id: 009-critic-tools-1
  fingerprint: 5c783097
- concept: 'каждому сорту утверждений соответствует свой вид верификатора: поиск для фактов, исполнение кода и тесты для работоспособности'
  question: 'Ответ агента содержит два утверждения: «эта библиотека вышла в 2019 году» и функцию, которая якобы возвращает отсортированный список. Какая проверка соответствует подходу CRITIC?'
  explanation: 'Верификатор подбирается под сорт утверждения: фактическая дата — поисковик, корректность кода — интерпретатор и предметные верификаторы (тесты, проверка типов, линтеры). Усиление формулировок и лишние витки не добавляют нового источника сигнала — оценивают те же веса, что породили ответ.'
  kind: choice
  options:
    - Добавить в промпт критика требование «будь строже» и прогнать оценку ещё раз
    - Дату проверить поиском во внешнем источнике, функцию — запуском интерпретатора и юнит-тестами
    - Попросить модель оценить свою уверенность по шкале и отбросить утверждения с низкой уверенностью
    - Увеличить число витков самокритики, пока модель не перестанет менять ответ
  correct: 1
  id: 009-critic-tools-2
  fingerprint: ad1829eb
- concept: общее свойство внешних верификаторов — их вердикт не зависит от убедительности формулировок модели
  question: Поисковик, интерпретатор кода, калькулятор и юнит-тесты — разные инструменты. Какое общее свойство делает их пригодными как источник критики, и почему без него шаг обратной связи ненадёжен?
  explanation: 'Ключевое слово — заземление (grounding): критика опирается на результат инструмента, а не на суждение модели о самой себе. Отсюда и граница метода: где инструмента не существует, свойство пропадает и остаётся обычная самокритика.'
  kind: open
  reference: Их результат порождается процессом вне весов модели и не зависит от того, насколько убедительно написан ответ. Тест падает или проходит, калькулятор даёт число, поиск даёт источник — красноречие текста на вердикт не влияет. Обычный шаг feedback оценивает вывод той же моделью и той же памятью, поэтому убедительно сформулированная ошибка получает высокую оценку. Критика, заземлённая на выводе инструмента, даёт переписывателю сигнал, который нельзя получить переформулировкой промпта критика.
  id: 009-critic-tools-3
  fingerprint: 379ddcd1
