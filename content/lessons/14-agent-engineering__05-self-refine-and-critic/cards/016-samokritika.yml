- concept: шаг feedback в Self-Refine возвращает естественный язык, и refine исполняет эту строку как инструкцию, а не как оценку
  question: В цикле Self-Refine шаг feedback реализован как обычный вызов модели. Что он физически отдаёт следующему шагу и как это меняет требования к его формулировке?
  explanation: 'Выход LLM-критика — текст, и refine читает его как инструкцию. Отсюда требование: критика обязана называть место, нарушение и действие («пунктов пять, нужно три — убери два последних»), иначе refine переписывает наугад. Булевы вердикты и числа выдаёт верификатор, а не самокритик.'
  kind: choice
  options:
    - Булев вердикт «прошло/не прошло»; refine сам решает, что править, поэтому формулировка критики роли не играет
    - Число-оценку качества; refine выбирает по порогу одну из заготовленных стратегий переписывания
    - Строку текста, которую refine получает на вход как указание к действию, поэтому критика должна быть исполнимой без переспрашивания
    - Diff-патч к предыдущему ответу; refine просто применяет его к тексту
  correct: 2
  id: 016-samokritika-1
  fingerprint: 4dca5474
- concept: исполнимая критика строится как локализация дефекта, называние нарушенного ограничения и предписание правки
  question: Расставьте элементы полезной реплики критика в порядке, в котором они делают её исполнимой для шага refine.
  explanation: Без места refine не знает, куда смотреть; без ограничения — не знает, что считать нормой; без действия — не знает, что делать. Реплика «получилось неплохо, но можно лучше» не содержит ни одного из трёх и приводит к случайному переписыванию.
  kind: order
  items:
    - 'Указать место дефекта: какой именно фрагмент ответа не в порядке'
    - Назвать нарушенное ограничение и его требуемое значение (например, длина 90 символов при лимите 50)
    - 'Предписать конкретное действие: что сделать с этим фрагментом'
  id: 016-samokritika-2
  fingerprint: 35d9f7e5
- concept: 'конкретность критики производна от измеримости критерия: размытый критерий делает критику неисполнимой'
  question: Объясните своими словами, почему замена критерия «ровно 5 пунктов, каждый короче 50 символов» на критерий «текст звучит убедительно» ухудшает не только оценку, но и качество правок в цикле evaluator-optimizer.
  explanation: 'Качество витка ограничено не умом критика, а разрешающей способностью критерия: критика не может быть конкретнее того, что она проверяет.'
  kind: open
  reference: 'Измеримый критерий позволяет критику ткнуть пальцем в конкретное место и назвать величину нарушения: «пунктов шесть, нужно пять — убери последний; третий пункт 71 символ при лимите 50 — сократи». Такую реплику refine исполняет однозначно. Размытый критерий не даёт ни локализации, ни порога, поэтому критика вырождается в оценочные фразы вида «можно лучше», и refine переписывает наугад — часто ломая то, что было в порядке. Поэтому в проекте сперва ищут измеримые критерии, а модель-критика оставляют на то, что измерить нельзя.'
  id: 016-samokritika-3
  fingerprint: 9b35c8eb
