- concept: разметка промпта именованными секциями разделяет роли склеенных кусков текста, иначе модель правит не тот блок
  question: 'Функция собирает вход для шага refine: постановка задачи, текущий вариант ответа и список замечаний. Разработчик склеивает их подряд через перенос строки, без каких-либо заголовков. Какой отказ наиболее характерен для такого промпта?'
  explanation: 'На входе у модели одна строка, а не структура: без подписей вроде «Задача:», «Текущий вариант:», «Замечания:» границы кусков определяются только по смыслу текста, и правкам подвергается случайный фрагмент. Разметка секций дешёвая и снимает именно эту неоднозначность; длину она почти не меняет, и никакой валидации формата у API нет.'
  kind: choice
  options:
    - Модель превысит лимит контекста, потому что конкатенация длиннее размеченного варианта
    - Модель спутает роли фрагментов и начнёт править формулировку задания или сами замечания вместо ответа
    - Модель откажется отвечать, так как вход без заголовков не проходит валидацию API
    - Модель вернёт ответ на исходную задачу дословно, полностью проигнорировав вход
  correct: 1
  id: 021-refine-prompt-1
  fingerprint: f2d166ff
- concept: инструкция о требуемом действии ставится последней секцией промпта, после всего контекста
  question: Расположите секции промпта для шага refine в порядке от начала строки к концу, следуя принципу «контекст раньше, требуемое действие последним».
  explanation: 'Модель читает вход сверху вниз, и ближе всего к моменту генерации оказывается последний блок — поэтому туда кладут директиву о формате вывода. Контекст выстроен по нарастанию конкретности: что требовалось, что получилось, что в этом не так. Если директиву поставить первой, к концу длинного контекста она перебивается материалом и на выходе появляется «вот улучшенная версия» и прочие пояснения.'
  kind: order
  items:
    - Постановка исходной задачи
    - Текущий вариант ответа, который нужно исправить
    - Замечания критика к этому варианту
    - Указание вернуть только исправленный текст, без пояснений
  id: 021-refine-prompt-2
  fingerprint: 3a2c1a7e
- concept: пустой раздел истории в промпте должен быть либо убран, либо явно помечен как пустой, иначе отсутствие содержимого читается как отсутствие предыдущих версий
  question: Промпт refine всегда печатает заголовок секции с историей предыдущих версий и критик. На седьмом витке цикла история непустая, но код по ошибке передал пустой список, и под заголовком нет ни строки. Объясни, чем это опаснее, чем полное отсутствие секции, и как правильно обрабатывать пустую историю.
  explanation: 'Разница между «нет данных» и «данных нет по факту» для модели неразличима: она видит только текст. Пустой заголовок несёт сигнал, а не молчание, и сигнал этот ложный. Отсюда правило: любой опциональный блок промпта либо исчезает, либо явно называет своё пустое состояние.'
  kind: open
  reference: 'Заголовок без содержимого модель прочитает как утверждение «предыдущих версий не было» — это не пробел в данных, а ложный факт во входе. Модель решит, что правит первый черновик, и спокойно вернёт дефект, устранённый на прошлых витках; цикл начнёт ходить по кругу. Корректных вариантов два: при действительно пустой истории убирать блок целиком (тогда отсутствие секции ничего не утверждает) либо писать явную строку вроде «предыдущих правок нет». А сам сбой — пустой список там, где история есть, — ловится проверкой на стороне цикла, потому что промпт-сборщик доверяет тому, что ему передали.'
  id: 021-refine-prompt-3
  fingerprint: a6aa149e
