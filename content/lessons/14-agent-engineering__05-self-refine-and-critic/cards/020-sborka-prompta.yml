- concept: исключение последнего вывода из промпта refine заставляет модель генерировать заново, а не править
  question: В цикле evaluator-optimizer промпт refine собирают из требования, критики и истории, но сам текст последней версии в промпт не кладут. Какой сбой это даёт чаще всего?
  explanation: 'Refine — операция правки над конкретным артефактом. Нет артефакта — нет правки: модель решает задачу заново из требования и критики, и корректные части прошлой версии пропадают случайным образом. Дословный повтор — это симптом отсутствия критики, а не отсутствия вывода.'
  kind: choice
  options:
    - Модель выдаёт новый ответ с нуля и теряет уже удачные фрагменты предыдущей версии
    - Модель отказывается отвечать, потому что промпт неполный по формату
    - Модель дословно повторяет предыдущую версию, так как править нечего
    - Модель начинает игнорировать критику и всегда сообщает «no issues»
  correct: 0
  id: 020-sborka-prompta-1
  fingerprint: 038d17e3
- concept: вызов LLM не хранит состояние между вызовами, поэтому исходное требование дублируется в каждом промпте цикла
  question: Цикл self-refine делает 9 вызовов одной модели. Требование к результату (формат, ограничения) уже было полностью написано в промпте генерации. Почему его повторяют в каждом промпте refine?
  explanation: Между вызовами состояния нет — весь мир модели на данном витке это текст промпта. Критика говорит «сократи пункт», но не содержит ни числа пунктов, ни лимита длины, ни запрета трогать корректные пункты, поэтому без явного требования формат разъезжается на первом же витке.
  kind: choice
  options:
    - 'Каждый вызов модели независим: промпт — единственный доступный ей контекст, из критики требование не восстанавливается'
    - Повтор требования снижает стоимость вызова за счёт кэша токенов
    - Модель забывает требование только после превышения окна контекста, поэтому повтор нужен лишь на длинных задачах
    - Повтор нужен, чтобы шаг feedback мог сверить вывод с требованием
  correct: 0
  id: 020-sborka-prompta-2
  fingerprint: 9c05cff7
- concept: состав аргументов шага refine в Self-Refine
  question: 'Дополните сигнатуру шага refine в цикле Self-Refine: помимо исходной задачи, последней версии вывода и накопленной истории версий с замечаниями, refine принимает результат шага feedback по текущей версии.'
  explanation: Без критики по текущей версии refine не знает, что именно менять, и возвращает почти тот же вывод. Задача задаёт цель, output_n — предмет правки, critique_n — что не так сейчас, history — что уже пробовали и какие замечания были.
  kind: cloze
  template: refine(task, output_n, ___, history) -> output_n+1
  answer: critique_n
  accept:
    - critique
    - critique_n
    - feedback_n
    - critique(output_n)
  id: 020-sborka-prompta-3
  fingerprint: 76d8c689
