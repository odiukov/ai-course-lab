- concept: передача текущего времени параметром делает очистку детерминированной и тестируемой
  question: Почему функции очистки журнала лучше принимать момент запуска аргументом, а не читать системные часы внутри?
  explanation: Явно переданное время устраняет зависимость теста от системных часов. Тест может создать записи относительно фиксированной границы и всегда получить одинаковый результат.
  kind: choice
  options:
    - Чтобы срок хранения зависел от размера журнала
    - Чтобы тест мог зафиксировать время и воспроизводимо проверить пограничные случаи
    - Чтобы функция не удаляла аудиофайлы
    - Чтобы использовать локальную таймзону файловой системы
  correct: 1
  id: 032-prune-turn-log-1
  fingerprint: a663c60e
- concept: временные метки перед сравнением нужно привести к единой таймзоне
  question: Метка создания записи содержит таймзону, а граница удаления уже выражена в UTC. Заполни преобразование метки перед сравнением.
  explanation: Две timezone-aware метки следует сравнивать в общей временной шкале. Наивные метки нужно отклонять либо локализовать по явно заданному контракту, а не угадывать их таймзону.
  kind: cloze
  template: created_at_utc = record.created_at.___
  answer: astimezone(timezone.utc)
  accept:
    - astimezone(UTC)
    - astimezone(datetime.UTC)
  id: 032-prune-turn-log-2
  fingerprint: 6001fdb6
- concept: отсутствующий файл не должен нарушать идемпотентность повторной очистки
  question: Объясни, как очиститель просроченного журнала должен обработать запись, чей аудиофайл уже отсутствует, и почему.
  explanation: Очистка могла ранее успеть удалить файл и прерваться до обновления журнала. Игнорирование отсутствующего файла позволяет завершить частично выполненную операцию и не оставлять ссылку на несуществующее аудио.
  kind: open
  reference: Отсутствие файла означает, что требуемое состояние диска уже достигнуто. Очиститель должен без ошибки исключить просроченную запись из результата и продолжить работу, чтобы повторный запуск был безопасным и идемпотентным.
  id: 032-prune-turn-log-3
  fingerprint: a1d66e9a
