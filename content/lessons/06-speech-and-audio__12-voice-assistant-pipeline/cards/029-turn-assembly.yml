- concept: поочерёдная замена заглушек реальными компонентами локализует интеграционные регрессии
  question: Почему при сборке голосового ассистента полезно подключать реальные VAD, STT, LLM и TTS поочерёдно, проверяя пайплайн после каждой замены?
  explanation: Одновременное подключение всех моделей смешивает их задержки и ошибки. Поочерёдная интеграция сохраняет известную рабочую основу и позволяет связать новую регрессию с последним изменением.
  kind: open
  reference: Так между проверками изменяется только один компонент. Если после очередной замены нарушились тайминги, форматы данных или поведение пайплайна, область поиска причины ограничивается недавно подключённым компонентом и его стыками.
  id: 029-turn-assembly-2
  fingerprint: 849b3688
