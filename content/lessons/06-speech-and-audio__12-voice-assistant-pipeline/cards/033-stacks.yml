- concept: единая full-duplex-модель снижает задержку за счёт отказа от последовательного модульного конвейера
  question: Объясни, почему архитектура Moshi способна отвечать быстрее модульного голосового стека и какой инженерный компромисс при этом возникает.
  explanation: Преимущество Moshi связано не с ускорением каждого обычного звена, а с устранением самой цепочки отдельных звеньев. Платой становится переход к иной архитектуре с меньшей свободой независимо выбирать и настраивать компоненты.
  kind: open
  reference: Moshi ведёт двустороннее аудиовзаимодействие одной моделью, поэтому ей не нужны последовательные переходы между отдельными STT, LLM и TTS. Это уменьшает задержку, но вместо независимо заменяемых компонентов команда получает другую, менее модульную архитектуру.
  id: 033-stacks-3
