- concept: managed-платформы ускоряют запуск ценой ограниченного контроля над компонентами конвейера
  question: Команде важнее всего как можно быстрее выпустить голосового ассистента, а тонкая настройка отдельных компонентов не требуется. Какой вариант наиболее уместен?
  explanation: Managed-платформа предоставляет готовую инфраструктуру и сокращает время запуска. Компромисс состоит в том, что часть настроек и возможностей замены внутренних компонентов недоступна.
  kind: choice
  options:
    - Managed-платформа вроде Vapi или Retell
    - Самостоятельная сборка на Pipecat и открытых моделях
    - Полностью локальный стек из отдельных движков
  correct: 0
