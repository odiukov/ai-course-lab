- concept: потоковое перекрытие этапов сокращает сквозную задержку до первого аудио
  question: Почему сквозную задержку потокового голосового ассистента нельзя оценивать простым сложением полного времени STT, LLM и TTS? Объясни своими словами.
  explanation: При последовательном запуске времена этапов действительно складываются. Потоковая передача позволяет следующему этапу начать работу по частичному результату предыдущего, поэтому значительная часть вычислений выполняется одновременно.
  kind: open
  reference: 'Этапы могут выполняться с перекрытием: STT выдаёт промежуточный текст во время речи, LLM начинает обрабатывать уже полученный префикс, а TTS озвучивает начало ответа до завершения его генерации. Поэтому задержку до первого аудио определяет критический путь между зависимыми событиями, а не сумма полного времени всех этапов.'
  id: 002-budget-2
  fingerprint: 22c8037a
