- concept: слишком короткие аудиочанки увеличивают накладные расходы обработки
  question: Объясни своими словами, почему уменьшение длительности аудиочанка не всегда делает голосовой ассистент быстрее.
  explanation: Короткий чанк раньше попадает в конвейер, но повышает частоту вызовов и передач. Поэтому длительность выбирают как компромисс между задержкой накопления и накладными расходами.
  kind: open
  reference: Каждый чанк требует отдельной передачи, пробуждения обработчика и служебной обработки. При чрезмерном дроблении небольшое сокращение ожидания заполнения чанка может оказаться меньше возросших накладных расходов.
