- concept: частота дискретизации на входе должна соответствовать формату, ожидаемому STT-моделью
  question: Микрофон выдаёт аудио с более высокой частотой дискретизации, чем ожидает модель распознавания речи. Что целесообразнее сделать перед передачей аудио в STT?
  explanation: Если STT рассчитана на другую частоту, аудио всё равно придётся передискретизировать. Раннее приведение к ожидаемому формату уменьшает лишние вычисления и объём передаваемых данных.
  kind: choice
  options:
    - Привести поток к ожидаемой частоте дискретизации как можно раньше
    - Передать поток без изменений, поскольку более высокая частота всегда улучшает распознавание
    - Увеличить размер чанков, чтобы модель самостоятельно определила частоту
    - Преобразовать монофонический поток в многоканальный
