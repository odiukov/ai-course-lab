- concept: минимальная длительность речи реализуется как требование нескольких последовательных речевых чанков
  question: VAD подтверждает начало речи только после 224 мс непрерывного сигнала выше порога. Аудио поступает чанками по 32 мс. Сколько последовательных чанков необходимо?
  explanation: 'Нужно разделить минимальную длительность речи на длительность чанка: 224 / 32 = 7. В конфигурации урока аналогично проверяются 250 мс речи при чанках по 20 мс — требуется примерно 12–13 чанков.'
  kind: numeric
  answer: 7
  tolerance: 0.01
