- concept: вложенный async for полностью выполняет внутренний цикл перед переходом к следующей итерации внешнего
  question: 'Код обрабатывает поток фрагментов LLM вложенным циклом: `async for fragment in llm.stream(prompt): async for chunk in tts.stream(fragment): await speaker.play(chunk)`. Когда управление внешнего цикла сможет перейти к следующему фрагменту?'
  explanation: Тело внешней итерации включает весь внутренний цикл, поэтому следующая итерация внешнего `async for` начинается лишь после исчерпания текущего потока TTS. Само вложение циклов не запускает их параллельно.
  kind: choice
  options:
    - Когда завершится внутренний поток TTS для текущего фрагмента
    - Сразу после получения первого аудиочанка текущего фрагмента
    - Только после завершения всего потока LLM
    - Одновременно с запуском внутреннего цикла
