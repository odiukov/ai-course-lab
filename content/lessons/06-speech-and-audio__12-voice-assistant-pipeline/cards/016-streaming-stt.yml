- concept: новая частичная гипотеза STT заменяет предыдущий черновик, а не дописывается к нему
  question: Интерфейс получил частичный транскрипт «включи свет в спа…», а затем — «включи свет в спальне». Как правильно обновить отображаемый текст?
  explanation: Частичные транскрипты — последовательные версии одной гипотезы, а не независимые фрагменты. STT может исправлять уже распознанные слова, поэтому новый partial должен заменять текущий черновик.
  kind: choice
  options:
    - Заменить текущий черновик новой частичной гипотезой
    - Приписать новую гипотезу к предыдущей
    - Зафиксировать первую гипотезу и игнорировать последующие
    - Не показывать никакой текст до завершения всего диалога
  correct: 0
  id: 016-streaming-stt-1
  fingerprint: efec24e2
- concept: решения и вызовы инструментов должны запускаться только по финальному транскрипту
  question: Почему осмысленный частичный транскрипт потоковой STT нельзя сразу использовать для необратимого вызова инструмента?
  explanation: Partial подходит для предварительного отображения и другой отменяемой работы, но не гарантирует окончательный смысл реплики. Финальный транскрипт приходит после определения конца речи и больше не пересматривается.
  kind: open
  reference: 'Частичный транскрипт является изменяемой гипотезой: следующий фрагмент аудио может заставить STT заменить слова или смысл команды. Вызов инструмента следует выполнять только после события с is_final=True, когда реплика завершена и транскрипт зафиксирован.'
  id: 016-streaming-stt-2
  fingerprint: 7aa97a57
