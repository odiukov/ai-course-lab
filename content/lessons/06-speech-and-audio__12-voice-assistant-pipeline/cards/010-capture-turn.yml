- concept: при завершении потока уже начатая реплика возвращается даже без полного VAD-hangover
  question: Поток аудиочанков закончился до того, как накопилась требуемая непрерывная тишина, но VAD уже обнаружил речь и в буфере есть аудио. Что должна вернуть capture_turn и почему?
  explanation: Условие завершения по тишине может не выполниться из-за окончания самого потока. Поэтому после цикла функция возвращает np.concatenate(buf), если triggered установлен, и None — только если речь не была обнаружена.
  kind: open
  reference: Функция должна склеить и вернуть накопленные чанки. None допустим только тогда, когда речь вообще не начиналась; иначе уже записанная реплика будет молча потеряна.
