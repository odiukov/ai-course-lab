- concept: шифрование на диске и ограничение срока хранения снижают разные риски утечки аудиоданных
  question: Объясни своими словами, почему шифрование аудиозаписей на диске не отменяет необходимости ограничивать срок их хранения.
  explanation: 'Эти меры дополняют друг друга: шифрование защищает сохранённые файлы, а автоматическое удаление сокращает время и объём потенциальной утечки.'
  kind: open
  reference: Шифрование затрудняет чтение записей при краже или несанкционированном доступе к носителю, но данные всё равно могут быть раскрыты через ключи, приложение или учётную запись. Ограниченный срок хранения уменьшает объём и возраст данных, которые вообще могут попасть в утечку.
