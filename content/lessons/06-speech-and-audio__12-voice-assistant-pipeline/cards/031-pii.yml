- concept: срок хранения аудиозаписи задаётся при её создании и обеспечивается автоматическим удалением
  question: Расположи действия в правильном порядке для хранения записей голосовых обращений с ограниченным сроком жизни.
  explanation: Если срок не задан при создании записи, временный отладочный файл легко превращается в бессрочный архив. Автоматическое удаление обеспечивает соблюдение политики без ручной очистки.
  kind: order
  items:
    - До начала записи определить допустимый срок хранения
    - При сохранении записи назначить ей дату удаления
    - По наступлении даты автоматически удалить запись
