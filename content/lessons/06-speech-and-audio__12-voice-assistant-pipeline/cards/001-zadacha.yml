- concept: порядок преобразования данных в голосовом ассистенте
  question: Расположите этапы обработки пользовательской реплики в порядке прохождения данных через голосового ассистента.
  explanation: Основной тракт последовательно преобразует звук в выделенную речевую реплику, затем в текст, ответ модели, синтезированный звук и воспроизведение. Потоковая обработка позволяет соседним этапам частично работать одновременно, но не меняет направление передачи данных.
  kind: order
  items:
    - Захватить аудиопоток с микрофона
    - Определить границы речи с помощью VAD
    - Преобразовать речь в текст с помощью потокового STT
    - Передать транскрипт в LLM и при необходимости вызвать инструмент
    - Преобразовать текст ответа в аудио с помощью TTS
    - Проиграть синтезированное аудио пользователю
  id: 001-zadacha-1
  fingerprint: '86424613'
- concept: barge-in требует отмены всего незавершённого ответа ассистента
  question: Пользователь начал говорить, пока ассистент ещё произносит ответ. Как должна обработать это событие корректная реализация barge-in?
  explanation: 'Недостаточно заглушить плеер: LLM и TTS могут продолжить создавать ответ, который останется в очередях и прозвучит позже. При barge-in нужно остановить воспроизведение и распространить отмену на незавершённые этапы генерации ответа.'
  kind: choice
  options:
    - Только уменьшить громкость, продолжая синтезировать и ставить аудио в очередь
    - Остановить воспроизведение и отменить генерацию и синтез незавершённого ответа
    - Дождаться конца ответа, а затем обработать новую реплику
    - Продолжить воспроизведение, но одновременно запустить распознавание новой речи
  correct: 1
  id: 001-zadacha-2
  fingerprint: 0de43538
- concept: ошибка раннего звена голосового конвейера передаётся всем последующим звеньям
  question: Объясните своими словами, почему LLM обычно не может надёжно исправить слово, которое VAD обрезал до передачи аудио в STT.
  explanation: Каждое звено получает результат предыдущего. Если VAD удалил часть речи, соответствующей информации уже нет во входе STT и LLM. Попытка модели восстановить её по контексту будет догадкой, а не исправлением исходного сигнала.
  kind: open
  reference: После обрезки исходный фрагмент речи больше не поступает в распознавание. STT формирует неполный транскрипт, а LLM видит только этот транскрипт и не располагает потерянным аудиосигналом. Она может лишь предположить продолжение, что создаёт риск неверного действия.
  id: 001-zadacha-3
  fingerprint: b96a09f1
