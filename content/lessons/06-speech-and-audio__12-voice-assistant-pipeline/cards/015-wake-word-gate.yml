- concept: детектор ключевого слова нужно кормить кадрами точного размера через промежуточный буфер с сохранением остатка
  question: Заполни пропуск в коде адаптера между чанками микрофона и wake-word-детектором.
  explanation: Детектору передают кадр ровно ожидаемого размера, а не очередной микрофонный чанк целиком. Например, для кадра Porcupine на 512 сэмплов несколько чанков по 320 сэмплов накапливаются, а неиспользованный остаток сохраняется для следующего кадра.
  kind: cloze
  template: |-
    while len(pending) >= detector.frame_length:
        frame = pending[:___]
        pending = pending[detector.frame_length:]
        detector.process(frame)
  answer: detector.frame_length
  accept:
    - frame_length
    - detector.frame_length
  id: 015-wake-word-gate-1
  fingerprint: 23c480ce
- concept: таймаут ожидания первой речи автоматически закрывает wake-word-гейт после пустого срабатывания
  question: Почему после обнаружения ключевого слова wake-word-гейт должен ограничивать время ожидания начала речи?
  explanation: Пользователь может произнести только ключевое слово, передумать или вызвать ложное срабатывание. Таймаут в 2–3 секунды возвращает систему в закрытое состояние и не оставляет микрофон логически открытым навсегда.
  kind: open
  reference: Срабатывание детектора не гарантирует, что пользователь продолжит говорить. Если речь не началась до таймаута, гейт нужно снова закрыть, иначе последующее фоновое аудио будет обрабатываться как команда.
  id: 015-wake-word-gate-2
  fingerprint: a4d2812c
- concept: порог уверенности wake-word-детектора задаёт компромисс между ложными пробуждениями и пропущенными обращениями
  question: После повышения порога уверенности wake-word-детектора какое изменение наиболее ожидаемо?
  explanation: 'Высокий порог требует более уверенного совпадения: телевизор и похожие звуки реже разбудят ассистента, но тихое или нечёткое ключевое слово чаще будет пропущено. Порог следует калибровать на отложенных записях с положительными и отрицательными примерами.'
  kind: choice
  options:
    - Ложных пробуждений станет меньше, но пропущенных ключевых слов — больше
    - Ложных пробуждений станет больше, а пропущенных ключевых слов — меньше
    - Изменится только задержка синтеза речи
    - Детектор перестанет требовать кадры фиксированного размера
  correct: 0
  id: 015-wake-word-gate-3
