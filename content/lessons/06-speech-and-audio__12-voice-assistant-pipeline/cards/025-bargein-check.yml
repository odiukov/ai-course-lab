- concept: старый синтез необходимо завершить до запуска нового голосового ответа
  question: Объясни своими словами, почему при перебивании ассистента нельзя запускать новый голосовой ответ, пока прежняя задача TTS ещё работает.
  explanation: Начало нового turn само по себе не останавливает прежний TTS. Пока старый синтез не отменён, оба ответа могут конкурировать за общий аудиовыход.
  kind: open
  reference: Обе задачи могут отправлять аудиочанки в один выход. Тогда фрагменты прежнего и нового ответов перемешаются или наложатся, и пользователь услышит две конкурирующие реплики.
