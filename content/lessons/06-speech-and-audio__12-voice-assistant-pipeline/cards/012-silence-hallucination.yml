- concept: результат служебного прогрева STT нельзя включать в состояние диалога
  question: Объясни своими словами, как следует обрабатывать транскрипт, полученный при прогреве STT-модели на пустом или служебном аудиобуфере, и почему.
  explanation: Прогрев — служебная операция, а не часть разговора. Если сохранить её вывод, вымышленная реплика попадёт в контекст и сможет запустить последующие этапы голосового ассистента.
  kind: open
  reference: 'Результат прогревочного вызова нужно полностью отбросить: не записывать в лог, историю диалога и не передавать LLM. Такой вызов нужен только для инициализации модели, а его текст не соответствует пользовательской реплике и может оказаться галлюцинацией на тишине.'
  id: 012-silence-hallucination-2
  fingerprint: ca8589fb
