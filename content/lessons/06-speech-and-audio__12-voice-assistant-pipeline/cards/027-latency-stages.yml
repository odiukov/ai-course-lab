- concept: поэтапный профиль latency позволяет обнаружить звено, которое следует оптимизировать в первую очередь
  question: Объясни своими словами, почему одной сквозной задержки голосового ассистента недостаточно для выбора оптимизации и какие измерения нужно добавить.
  explanation: Одинаковая итоговая задержка может быть вызвана долгим VAD-hangover, медленным распознаванием, генерацией модели или запуском синтеза. Разбивка по этапам превращает общую жалобу на скорость в конкретную цель для профилирования и оптимизации.
  kind: open
  reference: Сквозная задержка показывает только общий результат и не указывает источник ожидания. Нужно записывать временные отметки на границах VAD, STT, LLM и TTS, вычислять длительность каждого этапа и начинать исследование с наиболее значимого вклада.
  id: 027-latency-stages-2
  fingerprint: c32dc2d5
