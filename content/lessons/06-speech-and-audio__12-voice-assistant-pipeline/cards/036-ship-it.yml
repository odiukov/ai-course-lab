- concept: неустранимый конфликт архитектурных ограничений нужно явно и количественно фиксировать в спецификации
  question: Аудио и транскрипты обязаны оставаться внутри инфраструктуры, но ни одна допустимая локальная конфигурация не укладывается в целевую задержку. Как это следует оформить в спецификации?
  explanation: Архитектурная спецификация не должна скрывать несовместимость требований. Она фиксирует достижимый показатель, размер отклонения и осознанный приоритет комплаенса над исходным бюджетом задержки.
  kind: open
  reference: Нужно прямо указать, что целевая задержка недостижима при обязательном локальном исполнении, привести измеримую достижимую цель и величину отклонения, а также зафиксировать, что комплаенс выбран как более приоритетное ограничение. Возможные оптимизации следует описать вместе с их ценой для качества или пользовательского восприятия.
  id: 036-ship-it-2
  fingerprint: 48b224fd
