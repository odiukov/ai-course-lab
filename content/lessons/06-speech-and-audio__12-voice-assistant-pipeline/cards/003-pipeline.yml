- concept: VAD должен продолжать анализировать микрофон во время воспроизведения ответа
  question: Почему голосовой ассистент не должен отключать VAD, пока из динамика звучит его ответ?
  explanation: VAD нужен не только для определения границ исходной реплики. Во время воспроизведения он продолжает следить за микрофоном, чтобы обнаружить новую речь пользователя и передать событие обработчику прерывания.
  kind: open
  reference: Иначе система не обнаружит, что пользователь начал говорить поверх ответа, и не сможет своевременно запустить обработку новой реплики.
