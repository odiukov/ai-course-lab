- concept: dispatch_tool выбирает обработчик по имени из явного реестра и корректно обрабатывает неизвестные имена
  question: Как лучше реализовать выбор локальной функции по имени инструмента, полученному от LLM?
  explanation: Явный словарь связывает только разрешённые имена с обработчиками. Если имя неизвестно, dispatch_tool должен вернуть результат с описанием ошибки, чтобы LLM могла исправить вызов, а не оставить поток в неопределённом состоянии.
  kind: choice
  options:
    - Хранить разрешённые имена и функции в словаре, а при отсутствии имени возвращать понятную ошибку
    - Искать функцию с таким именем среди всех глобальных объектов программы
    - Игнорировать неизвестное имя и продолжать ждать текстовые чанки
  correct: 0
  id: 021-dispatch-tool-1
  fingerprint: 1d1b19b7
- concept: аргументы вызова инструмента нужно привести к типам, объявленным в его схеме
  question: Схема set_timer объявляет seconds как int, но значение пришло из JSON строкой. Заполни преобразование перед вызовом обработчика.
  explanation: JSON-аргументы нельзя безусловно считать уже приведёнными к типам функции. Перед вызовом set_timer строковое значение seconds преобразуют через int.
