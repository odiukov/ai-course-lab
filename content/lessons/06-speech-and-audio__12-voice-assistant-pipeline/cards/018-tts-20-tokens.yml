- concept: непрерывное воспроизведение требует, чтобы LLM пополняла текст не медленнее, чем TTS его расходует
  question: Объясните своими словами, при каком условии ранний запуск потокового TTS не приведёт к паузам внутри ответа.
  explanation: Ранний старт уменьшает только начальное ожидание. Для непрерывной речи последующие текстовые фрагменты должны поступать достаточно быстро, иначе TTS опустошит буфер и замолчит.
  kind: open
  reference: После запуска синтеза LLM должна в среднем выдавать следующие фрагменты текста не медленнее, чем TTS успевает их озвучивать. Тогда готовый текст постоянно имеется в буфере, и воспроизведение продолжается без ожидания.
  id: 018-tts-20-tokens-3
  fingerprint: 1427a7bc
