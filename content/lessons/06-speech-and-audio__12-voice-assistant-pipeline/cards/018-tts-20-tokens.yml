- concept: задержка накопления стартового префикса равна отношению числа ожидаемых токенов к скорости генерации
  question: TTS запускается после накопления 36 токенов, а LLM генерирует 80 токенов в секунду. Через сколько секунд можно передать первый фрагмент в синтезатор?
  explanation: Время накопления префикса вычисляется как N / R. Здесь 36 / 80 = 0,45 с. Чем больше стартовый префикс, тем позже начинается синтез.
  kind: numeric
  answer: 0.45
  tolerance: 0.01
  id: 018-tts-20-tokens-1
  fingerprint: 51e59c72
- concept: размер стартового префикса TTS задаёт компромисс между задержкой и качеством произношения
  question: Передача каждого нового токена прямо в TTS приводит к обрывкам слов и неверной интонации, а ожидание полного ответа создаёт большую задержку. Какое решение лучше всего балансирует эти проблемы?
  explanation: Слишком короткий фрагмент не даёт синтезатору достаточного контекста для границ слов и интонации. Слишком длинный откладывает начало речи, поэтому нужен умеренный стартовый буфер.
  kind: choice
  options:
    - Передавать в TTS каждый токен отдельно, не накапливая контекст
    - Накопить достаточно связный начальный фрагмент и затем передавать текст порциями
    - Всегда ждать завершения всего ответа LLM
    - Уменьшить частоту дискретизации микрофона
  correct: 1
  id: 018-tts-20-tokens-2
