- concept: шифрование передачи данных не равнозначно запрету на их выход из инфраструктуры
  question: Почему облачный сервис с шифрованием соединения не удовлетворяет требованию, по которому аудио и расшифровки не должны покидать серверы организации?
  explanation: Шифрование канала снижает риск перехвата, а запрет на передачу наружу задаёт границу размещения и обработки данных. Это разные гарантии безопасности.
  kind: open
  reference: 'Шифрование защищает данные при передаче, но не меняет место их обработки: облачный провайдер всё равно получает аудио или расшифровки. Для строгого запрета на выход данных обработка должна выполняться внутри контролируемой инфраструктуры организации.'
  id: 035-stack-choice-2
  fingerprint: 4f665262
