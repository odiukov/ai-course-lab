<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Матрица сходства и максимум в строке</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c1f24; --muted:#6b7280; --grid:#c9ced6;
    --cell:#eef2f7; --hot:#2f6fed; --hotfg:#ffffff; --sum:#b45309; --box:#f6f8fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ebf0; --muted:#9aa3b2; --grid:#3a4插;
      --grid:#3a4150; --cell:#1e2430; --hot:#5b8dff; --hotfg:#0d1117;
      --sum:#f0b429; --box:#1a1f28;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .err{font-size:13px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Матрица сходства: 5 токенов запроса × 16 патчей страницы</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---------- данные ----------
    var ROWS = ['q₁','q₂','q₃','q₄','q₅'];
    var NCOL = 16;
    var M = [
      [0.12,0.31,0.08,0.44,0.19,0.27,0.71,0.22,0.15,0.09,0.33,0.18,0.05,0.24,0.11,0.29],
      [0.21,0.14,0.55,0.17,0.09,0.38,0.26,0.12,0.63,0.31,0.07,0.20,0.28,0.16,0.10,0.23],
      [0.08,0.19,0.11,0.25,0.82,0.30,0.14,0.21,0.09,0.17,0.35,0.12,0.06,0.28,0.13,0.20],
      [0.30,0.22,0.16,0.09,0.24,0.11,0.19,0.34,0.13,0.27,0.15,0.58,0.21,0.08,0.26,0.12],
      [0.14,0.67,0.23,0.10,0.31,0.18,0.09,0.25,0.20,0.12,0.29,0.16,0.34,0.11,0.22,0.07]
    ];

    // ---------- origin + scale + ЕДИНСТВЕННЫЙ перевод ----------
    var ORIGIN = {x:150, y:96};   // пиксель точки (0,0) сетки
    var SCALE  = {x:34,  y:34};   // пикселей на единицу
    function sx(x){ return ORIGIN.x + x*SCALE.x; }
    function sy(y){ return ORIGIN.y + y*SCALE.y; }

    // отступы подписей (пиксели — разрешено)
    var PAD = 8, FS = 12, FSS = 11, LW = 1;
    var NS = 'http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
        'font-size':size||FS,fill:'currentColor','dominant-baseline':'middle'});
      if(cls) t.setAttribute('class',cls);
      t.appendChild(document.createTextNode(s)); return t;
    }

    var svg = el('svg',{viewBox:'0 0 800 330',
      preserveAspectRatio:'xMidYMid meet',role:'img'});
    svg.appendChild(el('rect',{x:0,y:0,width:800,height:330,fill:'var(--bg)'}));

    var g = el('g',{}); svg.appendChild(g);

    // ---------- максимумы по строкам ----------
    var maxV=[], maxJ=[], total=0;
    for(var i=0;i<M.length;i++){
      var bj=0; for(var j=1;j<NCOL;j++) if(M[i][j]>M[i][bj]) bj=j;
      maxJ.push(bj); maxV.push(M[i][bj]); total+=M[i][bj];
    }

    // ---------- заголовок столбцов ----------
    g.appendChild(txt(sx(NCOL/2), sy(0)-PAD*2.2,
      'патчи страницы  d₁ … d₁₆', 'middle', null, FSS)).setAttribute('fill','var(--muted)');
    g.appendChild(txt(sx(0.5), sy(0)-PAD, 'd₁','middle',null,FSS))
      .setAttribute('fill','var(--muted)');
    g.appendChild(txt(sx(NCOL-0.5), sy(0)-PAD, 'd₁₆','middle',null,FSS))
      .setAttribute('fill','var(--muted)');

    // ---------- клетки ----------
    for(var i=0;i<M.length;i++){
      for(var j=0;j<NCOL;j++){
        var hot = (j===maxJ[i]);
        g.appendChild(el('rect',{
          x:sx(j), y:sy(i), width:SCALE.x, height:SCALE.y,
          fill: hot?'var(--hot)':'var(--cell)',
          stroke:'var(--grid)','stroke-width':LW}));
        var t = txt(sx(j+0.5), sy(i+0.5),
          M[i][j].toFixed(2).slice(1), 'middle', null, FSS);
        t.setAttribute('fill', hot?'var(--hotfg)':'var(--muted)');
        if(hot) t.setAttribute('font-weight','700');
        g.appendChild(t);
      }
      // подпись строки — слева, anchor=end
      var rt = txt(sx(0)-PAD, sy(i+0.5), ROWS[i], 'end', null, FS);
      rt.setAttribute('font-weight','600'); g.appendChild(rt);
    }

    // подпись оси строк — левее подписей строк, повёрнута
    var rot = txt(0,0,'токены запроса','middle',null,FSS);
    rot.setAttribute('fill','var(--muted)');
    rot.setAttribute('transform','translate('+(sx(0)-PAD*5)+','+sy(M.length/2)+
      ') rotate(-90)');
    rot.setAttribute('x',0); rot.setAttribute('y',0);
    g.appendChild(rot);

    // ---------- стрелки «максимум в строке» ----------
    var head = el('defs',{});
    var mk = el('marker',{id:'ah',viewBox:'0 0 10 10',refX:'9',refY:'5',
      markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
    mk.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--hot)'}));
    head.appendChild(mk); svg.appendChild(head);

    var COLX = NCOL + 1.1;           // столбик максимумов (в единицах сетки)
    for(var i=0;i<M.length;i++){
      g.appendChild(el('line',{
        x1:sx(NCOL)+PAD/2, y1:sy(i+0.5), x2:sx(COLX)-PAD/2, y2:sy(i+0.5),
        stroke:'var(--hot)','stroke-width':LW+0.6,'marker-end':'url(#ah)'}));
    }
    // подпись у ХВОСТА первой стрелки, выше линии
    var lt = txt(sx(NCOL)+PAD/2, sy(0)-PAD, 'max по строке','start',null,FSS);
    lt.setAttribute('fill','var(--hot)'); g.appendChild(lt);

    // ---------- столбик максимумов ----------
    for(var i=0;i<M.length;i++){
      g.appendChild(el('rect',{
        x:sx(COLX), y:sy(i), width:SCALE.x*1.6, height:SCALE.y,
        fill:'var(--box)',stroke:'var(--hot)','stroke-width':LW}));
      var mt = txt(sx(COLX+0.8), sy(i+0.5), maxV[i].toFixed(2), 'middle', null, FS);
      mt.setAttribute('font-weight','700'); g.appendChild(mt);
    }

    // ---------- сумма ----------
    var SY = M.length + 0.45;
    g.appendChild(el('line',{
      x1:sx(COLX), y1:sy(SY), x2:sx(COLX+1.6), y2:sy(SY),
      stroke:'var(--sum)','stroke-width':LW+1}));
    // знак «+» слева от столбика, разведён от подписи суммы (та — ниже)
    var pl = txt(sx(COLX)-PAD, sy(M.length-0.5), '+', 'end', null, FS+3);
    pl.setAttribute('fill','var(--sum)'); g.appendChild(pl);

    g.appendChild(el('rect',{
      x:sx(COLX), y:sy(SY+0.15), width:SCALE.x*1.6, height:SCALE.y,
      fill:'var(--box)',stroke:'var(--sum)','stroke-width':LW+0.6}));
    var st = txt(sx(COLX+0.8), sy(SY+0.65), total.toFixed(2), 'middle', null, FS+1);
    st.setAttribute('font-weight','700'); st.setAttribute('fill','var(--sum)');
    g.appendChild(st);

    // подпись суммы — СНИЗУ по центру блока (не наезжает на «+» слева)
    var su = txt(sx(COLX+0.8), sy(SY+1.55), 'балл страницы','middle',null,FSS);
    su.setAttribute('fill','var(--sum)'); g.appendChild(su);

    // ---------- формула, снизу слева ----------
    var f = txt(sx(0), sy(SY+1.55), 'балл = Σᵢ maxⱼ cos(qᵢ, dⱼ)','start',null,FS);
    f.setAttribute('fill','currentColor'); f.setAttribute('font-weight','600');
    g.appendChild(f);
    var f2 = txt(sx(0), sy(SY+2.2),
      '5 строк × 16 столбцов = 80 косинусов, 5 максимумов, 1 балл','start',null,FSS);
    f2.setAttribute('fill','var(--muted)'); g.appendChild(f2);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="err">Схема должна была показать таблицу 5×16: '+
      'строки — токены запроса q₁…q₅, столбцы — патчи страницы d₁…d₁₆, '+
      'в клетке — cos(qᵢ, dⱼ). В каждой строке подсвечена клетка-максимум; '+
      'справа столбик из 5 максимумов, их сумма — итоговый балл страницы: '+
      'балл = Σᵢ maxⱼ cos(qᵢ, dⱼ).</p>';
  }
})();
</script>
</body>
</html>
