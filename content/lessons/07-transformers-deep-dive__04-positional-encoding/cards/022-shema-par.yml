- concept: эквивалентность согласованных схем разбиения RoPE с точностью до перестановки координат
  question: Почему схемы соседних пар и «половина против половины» могут реализовывать одну и ту же математику RoPE?
  explanation: Перестановка координат — ортогональное преобразование. При одинаковой перестановке обоих векторов и согласованном назначении углов она меняет представление данных, но не результат скалярного произведения.
  kind: open
  reference: Одна схема получается из другой перестановкой координат. Если запросы и ключи переставлены одинаково и каждой соответствующей паре назначена та же частота, скалярные произведения не меняются.
