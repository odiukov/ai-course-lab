- concept: увеличение base удлиняет период медленных вращений, но не устраняет периодичность RoPE
  question: Объясни своими словами, почему увеличение base позволяет медленным парам RoPE различать позиции на большем расстоянии, но не делает их углы уникальными на сколь угодно длинной последовательности.
  explanation: При base = 10000 самая медленная пара за 8000 токенов проходит лишь около 0.8 радиана. Увеличение base ещё сильнее растягивает её период, но любой ненулевой угловой шаг рано или поздно приводит к повторению фазы.
  kind: open
  reference: 'Больший base уменьшает угловое приращение медленных пар, поэтому для полного оборота им требуется больше позиций. Однако вращение остаётся периодическим: после целого числа оборотов угол повторяется, и отдельная пара снова не может различить некоторые далёкие позиции.'
  id: 024-base-ruchka-2
  fingerprint: bb4f50aa
