- concept: уплотнение геометрической сетки наклонов ALiBi при увеличении числа голов
  question: Показатели степеней в расписании наклонов ALiBi равномерно распределены между H головами. Как изменится отношение наклонов соседних голов, если увеличить H, сохранив правило построения?
  explanation: Для соседних голов m_(h+1) / m_h = 2^(−8/H). При росте H модуль показателя 8/H уменьшается, поэтому отношение приближается к 1 и наклоны располагаются плотнее.
  kind: open
  reference: 'Отношение приблизится к нейтральному множителю: соседние наклоны станут ближе друг к другу, а геометрическая сетка — плотнее.'
  id: 031-naklony-2
  fingerprint: 1a307f49
