- concept: скалярное произведение после RoPE зависит от относительного смещения позиций
  question: Заполните пропуск в тождестве для поворотов RoPE.
  explanation: Повороты, соответствующие абсолютным позициям, внутри скалярного произведения сводятся к одному повороту на разность позиций. Поэтому RoPE кодирует относительное смещение между токенами.
  kind: cloze
  template: Если R(a)ᵀR(b) = R(b − a), то (R(i)q)ᵀ(R(j)k) = qᵀR(___)k.
  answer: j − i
  accept:
    - j - i
    - разность j и i
    - относительное смещение от i к j
  id: 004-tri-epohi-2
  fingerprint: a4ae0d01
- concept: ALiBi добавляет к attention logits зависящий от головы линейный штраф за расстояние
  question: Объясните, как ALiBi изменяет оценки attention и что означает отдельный наклон для каждой головы.
  explanation: 'ALiBi не изменяет эмбеддинги, Q или K: позиционная информация добавляется непосредственно к attention logits. Линейная зависимость от расстояния не требует таблицы позиций и хорошо переносится на более длинные последовательности.'
  kind: open
  reference: ALiBi вычитает из attention logit величину, линейно растущую с расстоянием между токенами. Коэффициент этого штрафа различается у разных голов, поэтому каждая голова ослабляет дальние позиции со своей скоростью.
  id: 004-tri-epohi-3
  fingerprint: 553a137d
