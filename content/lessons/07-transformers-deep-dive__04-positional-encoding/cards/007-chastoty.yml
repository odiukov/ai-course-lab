- concept: комбинация синусоидальных пар с разными периодами устраняет неоднозначность отдельных периодических координат
  question: У одной быстрой синус-косинусной пары две далёкие позиции получили почти одинаковые значения из-за периодичности. Почему полный абсолютный синусоидальный код всё же может различить эти позиции?
  explanation: Каждая отдельная пара периодична и потому неоднозначна. Но пары с разными делителями повторяются с разной скоростью, а их совместный набор фаз образует гораздо более однозначную позиционную подпись.
  kind: choice
  options:
    - Остальные пары используют другие делители, поэтому совпадение фаз сразу во всех координатах маловероятно
    - Добавление эмбеддинга токена делает каждую синусоиду непериодической
    - Косинус полностью устраняет периодичность синуса
    - Attention восстанавливает точную позицию независимо от позиционного кода
