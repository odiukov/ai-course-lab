- concept: вещественное деление сохраняет дробные показатели степени при вычислении наклонов ALiBi
  question: Какой оператор должен стоять в формуле показателя степени, чтобы округление частного не создавало одинаковые наклоны для разных голов?
  explanation: Оператор `/` сохраняет дробную часть показателя. При `//` показатели округляются вниз, поэтому несколько голов могут получить одинаковые наклоны вместо геометрической последовательности.
  kind: cloze
  template: exponent = -scale * ordinal ___ n_heads
  answer: /
  accept:
    - /
    - обычное деление
    - вещественное деление
  id: 032-code-alibi-slopes-1
  fingerprint: cae6db52
- concept: нормировка порядкового номера головы фиксирует крайний наклон независимо от числа голов
  question: Наклоны вычисляют по формуле `m_r = base ** (-scale * r / n_heads)`, где `r` — порядковый номер головы от первой до последней. Почему наклон последней головы не зависит от `n_heads`?
  explanation: В исходной формуле для последней головы дробь `(h + 1) / n_heads` равна 1, поэтому крайний наклон всегда равен `2 ** -8`. Число голов меняет плотность промежуточных наклонов, но не эту границу.
  kind: open
  reference: У последней головы порядковый номер равен числу голов, поэтому отношение `r / n_heads` сокращается. Показатель становится равен `-scale`, а наклон — `base ** (-scale)` при любом числе голов.
  id: 032-code-alibi-slopes-2
  fingerprint: 11e62803
