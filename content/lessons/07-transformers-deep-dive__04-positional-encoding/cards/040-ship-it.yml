- concept: выбор схемы позиционного кодирования начинается с длины контекста, а затем учитывает бюджет на дообучение
  question: Расположите этапы выбора позиционного кодирования для новой языковой модели в правильном порядке.
  explanation: 'Для обычного контекста до 8K достаточно RoPE с base = 10000. При переходе к сотням тысяч токенов решающим становится бюджет на дообучение: с ним применяют RoPE и YaRN, без него — ALiBi.'
  kind: order
  items:
    - Определить требуемую длину контекста.
    - Если нужен сверхдлинный контекст, проверить возможность дообучения на длинных последовательностях.
    - При наличии дообучения выбрать расширение RoPE, а при его отсутствии рассмотреть ALiBi.
  id: 040-ship-it-1
  fingerprint: 17185dea
- concept: абсолютное синусоидальное кодирование выбирают для точного воспроизведения исходной архитектуры Transformer
  question: Исследователь хочет максимально точно воспроизвести архитектуру исходной работы Transformer, а не спроектировать современную модель. Какую схему позиционного кодирования ему следует выбрать?
  explanation: Абсолютные синусоиды соответствуют архитектуре статьи 2017 года. Для новой модели практический выбор обычно делают между RoPE, его расширениями и ALiBi в зависимости от требуемой длины и бюджета на дообучение.
  kind: choice
  options:
    - Абсолютное синусоидальное кодирование
    - RoPE
    - ALiBi
    - RoPE с YaRN
