- concept: перед сложением из заранее вычисленной таблицы берут префикс длины входной последовательности
  question: Матрица эмбеддингов `x` имеет форму `7 × 96`, а таблица позиционных кодов `pe` — `300 × 96`. Как правильно добавить позиционные коды?
  explanation: 'Нужны первые 7 строк таблицы: они соответствуют позициям токенов от начала последовательности. Срез `pe[:len(x)]` получает форму `7 × 96`, совместимую с `x`.'
  kind: choice
  options:
    - '`x + pe`'
    - '`x + pe[:, :len(x)]`'
    - '`x + pe[-len(x):]`'
    - '`x + pe[:len(x)]`'
  correct: 3
  id: 011-code-add-pe-1
  fingerprint: bed8f011
- concept: число строк заранее вычисленной таблицы ограничивает максимальную поддерживаемую длину последовательности
  question: Таблица позиционных кодов содержит 300 строк, а во входной последовательности 347 токенов. Сколько строк позиционного кода не хватает для поэлементного сложения?
  explanation: Каждому токену требуется отдельная строка позиционного кода. Поэтому необходимо ещё `347 − 300 = 47` строк; одного среза существующей таблицы недостаточно.
  kind: numeric
  answer: 47
  tolerance: 0.01
  id: 011-code-add-pe-2
  fingerprint: f65349a5
