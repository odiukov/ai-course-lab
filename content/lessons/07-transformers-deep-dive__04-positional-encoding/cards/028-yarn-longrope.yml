- concept: YaRN сочетает частотно-зависимую интерполяцию RoPE с коррекцией масштаба attention
  question: Какое описание точнее всего передаёт принцип YaRN при расширении контекста?
  explanation: Быстрые измерения нужны для различения близких позиций, поэтому YaRN почти не сжимает их. Медленные измерения интерполируются сильнее, а промежуточные получают плавный коэффициент. Дополнительная коррекция масштаба помогает не допустить чрезмерного выравнивания весов attention на длинном контексте.
  kind: choice
  options:
    - Одинаково сжать позиции во всех частотных измерениях и больше ничего не менять
    - Сохранить быстрые измерения, интерполировать медленные, плавно смешать режимы для промежуточных и скорректировать масштаб attention
    - Заменить RoPE обучаемой таблицей абсолютных позиций
    - Оставить все частоты без изменений и обрезать токены за пределами обученной длины
  correct: 1
  id: 028-yarn-longrope-1
  fingerprint: 034fb736
- concept: LongRoPE подбирает отдельный масштаб для каждого измерения посредством поиска
  question: Дополните утверждение о том, чем LongRoPE отличается от схем с единым коэффициентом масштабирования.
  explanation: LongRoPE не задаёт одну аналитическую пропорцию для всех частот. Поиск оценивает наборы покоординатных коэффициентов и выбирает вариант, лучше сохраняющий качество модели на расширенном контексте.
  kind: cloze
  template: В LongRoPE коэффициент масштабирования выбирается ___
  answer: отдельно для каждого измерения с помощью эволюционного поиска
  accept:
    - для каждого измерения отдельно с помощью эволюционного поиска
    - по каждому измерению посредством эволюционного поиска
    - индивидуально для каждого измерения через эволюционный поиск
  id: 028-yarn-longrope-2
  fingerprint: 308ada8e
- concept: дообучение компенсирует потерю локального разрешения при равномерной position interpolation
  question: Почему равномерная position interpolation может ухудшить различение соседних токенов, хотя удерживает фазы RoPE в знакомом модели диапазоне, и какую роль играет последующее дообучение?
  explanation: Равномерное сжатие решает проблему незнакомых дальних углов ценой ухудшения локального позиционного сигнала. Обучение на длинных последовательностях позволяет параметрам attention приспособиться к этой новой геометрии.
  kind: open
  reference: Интерполяция уменьшает приращение фазы между соседними позициями во всех измерениях, включая быстрые, поэтому локальные позиции становятся менее различимыми. Дообучение адаптирует модель к новым, сжатым фазовым различиям и учит извлекать из них локальный порядок.
  id: 028-yarn-longrope-3
  fingerprint: 72290bba
