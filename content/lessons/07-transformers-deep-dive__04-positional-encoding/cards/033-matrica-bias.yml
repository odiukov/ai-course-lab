  fingerprint: 7b9ab4c9
- concept: матрица ALiBi на основе модуля расстояния симметрична
  question: Для матрицы `B_{ij} = -m|i-j|` заполните тождество, которое выполняется для любой пары позиций.
  explanation: 'Модуль не меняется при перестановке индексов: `|j-i| = |i-j|`. Поэтому штрафы симметричны относительно главной диагонали, а на самой диагонали равны нулю.'
  kind: cloze
  template: B_{ji} = ___
  answer: B_{ij}
  accept:
    - B_ij
    - B[i,j]
  id: 033-matrica-bias-2
  fingerprint: 8ca092a8
- concept: добавление позиционного смещения в logits сохраняет нормировку внимания через последующий softmax
  question: Почему матрицу ALiBi следует прибавлять к attention logits до softmax, а не к уже нормированным весам внимания?
  explanation: В исходной реализации `bias[h]` сначала прибавляется к матрице оценок головы, и только затем выполняется softmax. Так позиционный штраф влияет на распределение внимания, не нарушая его вероятностных свойств.
  kind: open
  reference: 'Softmax должен применяться уже к скорректированным оценкам: он преобразует их в неотрицательные веса и заново нормирует каждую строку до единичной суммы. Прибавление отрицательных штрафов после softmax нарушило бы эту нормировку и могло бы создать отрицательные веса.'
  id: 033-matrica-bias-3
  fingerprint: 904c3a09
