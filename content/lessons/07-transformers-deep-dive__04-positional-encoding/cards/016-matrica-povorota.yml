- concept: координаты вектора после умножения на матрицу плоского поворота
  question: Пара координат (x, y) поворачивается против часовой стрелки на угол φ. Какие координаты получатся после умножения на стандартную матрицу поворота?
  explanation: Первая строка матрицы даёт x cos φ − y sin φ, а вторая — x sin φ + y cos φ. В RoPE вместо φ подставляется pos·θ_i для соответствующей пары координат Q или K.
  kind: choice
  options:
    - (x cos φ − y sin φ, x sin φ + y cos φ)
    - (x cos φ + y sin φ, x sin φ − y cos φ)
    - (x sin φ − y cos φ, x cos φ + y sin φ)
    - (x cos φ − y cos φ, x sin φ + y sin φ)
  correct: 0
  id: 016-matrica-povorota-1
  fingerprint: 4599907e
- concept: матрица поворота сохраняет евклидову длину произвольной пары координат
  question: Почему применение RoPE к паре координат запроса или ключа не изменяет евклидову длину этой пары?
  explanation: Столбцы матрицы поворота ортонормированы благодаря тождеству cos²φ + sin²φ = 1. Поэтому поворот меняет направление пары координат, но сохраняет сумму квадратов её компонент и длину.
  kind: open
  reference: 'Матрица поворота ортогональна: RᵀR = I. Поэтому для любого вектора v длина после поворота удовлетворяет ||Rv||² = vᵀRᵀRv = vᵀv = ||v||².'
  id: 016-matrica-povorota-2
  fingerprint: 13ec95e6
