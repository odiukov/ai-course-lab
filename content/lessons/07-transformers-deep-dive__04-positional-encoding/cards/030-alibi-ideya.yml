- concept: разные наклоны ALiBi задают головам разные масштабы локальности
  question: У двух голов одинаковые содержательные attention logits, но у первой головы наклон ALiBi меньше. Как это повлияет на её внимание?
  explanation: Штраф равен произведению наклона на расстояние. При меньшем наклоне он медленнее растёт с расстоянием, поэтому дальние ключи сохраняют больший вес. Разные наклоны позволяют головам работать на разных масштабах контекста.
  kind: choice
  options:
    - Она будет слабее подавлять удалённые ключи и получит более широкий эффективный контекст.
    - Она будет сильнее подавлять удалённые ключи и сосредоточится на ближайших токенах.
    - Наклон изменит только веса соседних токенов, не затрагивая дальние.
    - Наклон не повлияет на распределение после softmax.
