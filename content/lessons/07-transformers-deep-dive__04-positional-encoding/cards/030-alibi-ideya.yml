- concept: фиксированный ALiBi создаёт позиционное смещение без обучаемых позиционных параметров
  question: Объясни своими словами, как ALiBi может учитывать взаимное расположение токенов, не используя обучаемую таблицу позиционных эмбеддингов.
  explanation: Индексы токенов уже позволяют вычислить расстояние между ними. ALiBi преобразует это расстояние в фиксированный штраф и вычитает его из attention logit; при заранее заданных наклонах новых обучаемых позиционных параметров не появляется.
  kind: open
  reference: ALiBi вычисляет детерминированное смещение attention logit из расстояния между индексами токенов и заранее заданного наклона головы. Позиционная зависимость возникает непосредственно в оценках attention, поэтому отдельные обучаемые позиционные векторы не нужны.
  id: 030-alibi-ideya-3
