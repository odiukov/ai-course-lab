- concept: разделение пересчёта параметра частот и применения вращений RoPE
  question: Объясни своими словами, что должна и чего не должна делать функция `scale_rope_base`.
  explanation: '`scale_rope_base` отвечает только за NTK-aware пересчёт base. Возвращённое значение затем используют при построении углов RoPE; сами повороты запросов и ключей остаются отдельным этапом.'
  kind: open
  reference: 'Функция должна вычислить и вернуть новый скалярный параметр base. Она не вычисляет позиции, не строит углы и не поворачивает Q и K: эти операции выполняются позже с частотами, рассчитанными из нового base.'
