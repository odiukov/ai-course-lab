- concept: одинаковое относительное смещение не гарантирует одинаковый attention logit для разных запросов и ключей
  question: Две разные пары «запрос — ключ» имеют одинаковое смещение m − n. Обязаны ли их attention logits после RoPE совпасть? Объясни.
  explanation: 'Утверждение о зависимости от m − n касается позиций. Содержимое векторов никуда не исчезает: вклад пары имеет вид qᵀR((n − m)θ)k. Поэтому одинаковое расстояние между токенами не делает разные пары токенов одинаково релевантными.'
  kind: open
  reference: Нет. При фиксированных Q и K позиционная часть скалярного произведения зависит только от m − n, но сам результат также зависит от координат Q и K. Одинаковое смещение задаёт одинаковый относительный поворот, а не одинаковые скалярные произведения произвольных векторов.
  id: 019-otnositelnost-1
  fingerprint: eecbe120
- concept: RoPE различает направления относительного смещения благодаря его знаку
  question: Исходные векторы q и k зафиксированы. Их позиционные метки поменяли местами, не меняя сами векторы. Что в общем случае произойдёт с вкладом одной координатной пары RoPE в attention logit?
  explanation: До перестановки относительный поворот задаётся углом (m − n)θ, а после неё — (n − m)θ. Эти углы противоположны. Для произвольных q и k соответствующие скалярные произведения не обязаны совпадать, поэтому RoPE способен учитывать не только величину расстояния, но и его направление.
  kind: choice
  options:
    - Он может измениться, потому что относительный поворот сменится на противоположный
    - Он обязательно сохранится из-за симметрии скалярного произведения
    - Он обязательно сменит знак
    - Он будет зависеть только от суммы позиционных меток
  correct: 0
  id: 019-otnositelnost-2
  fingerprint: 98ea28b8
