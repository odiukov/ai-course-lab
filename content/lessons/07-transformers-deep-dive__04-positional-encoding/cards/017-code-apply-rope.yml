- concept: исходные координаты пары нужно сохранить до записи результатов поворота
  question: Почему при реализации apply_rope обе исходные координаты пары следует прочитать до изменения выходного вектора?
  explanation: Обе новые координаты зависят от двух исходных значений. Если сначала перезаписать первую координату, а затем взять её для расчёта второй, получится уже не исходная пара и формула поворота будет нарушена.
