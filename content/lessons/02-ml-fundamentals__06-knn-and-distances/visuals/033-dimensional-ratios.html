<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сближение ближайшей и дальней точки</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #657087;
      --axis: #748096;
      --grid: #d9deea;
      --accent: #5b55d6;
      --accent-strong: #3f39b8;
      --accent-soft: #e5e3ff;
      --near: #159a82;
      --near-soft: #d9f4ed;
      --shadow: rgba(34, 43, 69, 0.10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151d;
        --panel: #191e29;
        --ink: #f2f4fa;
        --muted: #aab2c3;
        --axis: #98a2b8;
        --grid: #353d4f;
        --accent: #a7a1ff;
        --accent-strong: #c1bdff;
        --accent-soft: #302e57;
        --near: #65d8c1;
        --near-soft: #193d39;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      background: var(--panel);
      overflow: hidden;
    }

    header {
      padding: 18px 24px 4px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 760;
      letter-spacing: -0.015em;
    }

    header p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    svg {
      display: block;
      width: 100%;
      max-height: 420px;
      background: var(--panel);
      overflow: visible;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
      fill: none;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .baseline {
      stroke: var(--near);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .guide {
      stroke: var(--grid);
      stroke-width: 1;
    }

    .trend-area {
      fill: var(--accent-soft);
      opacity: 0.7;
    }

    .trend {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .spread {
      stroke: var(--accent);
      stroke-width: 7;
      stroke-linecap: round;
      opacity: 0.34;
    }

    .spread-cap {
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .sample {
      fill: var(--panel);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .point {
      fill: var(--accent-strong);
      stroke: var(--panel);
      stroke-width: 3;
    }

    .final-ring {
      fill: var(--near-soft);
      stroke: var(--near);
      stroke-width: 2;
    }

    .arrow {
      fill: none;
      stroke: var(--accent-strong);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--accent-strong);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
    }

    .axis-title {
      font-size: 15px;
      font-weight: 680;
    }

    .tick-label {
      font-size: 15px;
      font-weight: 650;
    }

    .ratio-label {
      font-size: 18px;
      font-weight: 780;
      fill: var(--accent-strong);
    }

    .spread-label {
      font-size: 15px;
      font-weight: 720;
      fill: var(--accent-strong);
    }

    .annotation {
      font-size: 14px;
      font-weight: 650;
      fill: var(--accent-strong);
    }

    .percent-label {
      font-size: 14px;
      font-weight: 720;
      fill: var(--near);
    }

    .note {
      font-size: 13px;
      fill: var(--muted);
    }

    .baseline-label {
      font-size: 14px;
      font-weight: 680;
      fill: var(--near);
    }

    #fallback {
      margin: 18px 24px 24px;
      padding: 14px 16px;
      border: 1px solid var(--grid);
      background: var(--accent-soft);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
    }

    #fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Сближение ближайшей и дальней точки</h1>
      <p>Отношение максимального расстояния к минимальному</p>
    </header>

    <svg
      id="chart"
      viewBox="0 0 960 420"
      width="960"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="chart-title chart-description"
    >
      <title id="chart-title">Сближение максимального и минимального расстояний</title>
      <desc id="chart-description">
        При двух признаках отношение заметно меняется, при ста признаках
        оно около 1,01, а при тысяче признаков — около 1,001.
      </desc>
    </svg>

    <p id="fallback">
      Схема должна показать: при d=2 наблюдается заметный разброс, при d=100
      отношение расстояний около 1,01, а при d=1000 — около 1,001.
    </p>
  </main>

  <script>
    const data = [
      {
        dimension: "d=2",
        ratio: "заметный разброс",
        x: 0.66,
        y: 3.42,
        valueDx: 16,
        valueDy: 5,
        valueAnchor: "start"
      },
      {
        dimension: "d=100",
        ratio: "≈ 1,01",
        x: 2.34,
        y: 2.04,
        valueDx: 0,
        valueDy: -16,
        valueAnchor: "middle"
      },
      {
        dimension: "d=1000",
        ratio: "≈ 1,001",
        detail: "всего 0,1% разницы",
        x: 3.82,
        y: 1.15,
        valueDx: -12,
        valueDy: -16,
        detailDx: -12,
        detailDy: 23,
        valueAnchor: "end"
      }
    ];

    const spreadData = [
      { x: 0.53, y: 2.86 },
      { x: 0.61, y: 3.23 },
      { x: 0.70, y: 3.57 },
      { x: 0.58, y: 3.88 }
    ];

    const guideData = [
      { x: 0.66, yTop: 2.67, yBottom: 0 },
      { x: 2.34, yTop: 2.04, yBottom: 0 },
      { x: 3.82, yTop: 1.15, yBottom: 0 }
    ];

    const canvas = { width: 960, height: 420 };
    const origin = { x: 210, y: 360 };
    const scale = { x: 175, y: 70 };

    const labelPadding = {
      tickY: 27,
      xTitleY: 43,
      yTitleY: -9,
      baselineX: -14,
      noteY: -9
    };

    const lineWidths = {
      sampleRadius: 0.035,
      pointRadius: 0.055,
      ringRadius: 0.105,
      spreadHalfCap: 0.09,
      arrowHeadLength: 0.11,
      arrowHeadHalfHeight: 0.085
    };

    const fontSizes = {
      normal: 15,
      ratio: 18,
      note: 13
    };

    const geometry = [
      { kind: "xAxis", x1: 0, y1: 0, x2: 4.08, y2: 0 },
      { kind: "yAxis", x1: 0, y1: 0, x2: 0, y2: 4.16 },
      { kind: "baseline", x1: 0, y1: 0.45, x2: 4.04, y2: 0.45 },
      { kind: "spread", x1: 0.62, y1: 2.66, x2: 0.62, y2: 4.02 },
      { kind: "arrow", x1: 2.64, y1: 3.08, x2: 3.56, y2: 1.53 }
    ];

    const textData = [
      {
        text: "max расстояние / min расстояние",
        className: "axis-title",
        x: 0,
        y: 4.16,
        dx: 0,
        dy: -9,
        anchor: "start"
      },
      {
        text: "схематично: область возле 1 увеличена",
        className: "note",
        x: 4.04,
        y: 4.16,
        dx: 0,
        dy: -9,
        anchor: "end"
      },
      {
        text: "1 — расстояния равны",
        className: "baseline-label",
        x: 0,
        y: 0.45,
        dx: -14,
        dy: 5,
        anchor: "end"
      },
      {
        text: "Размерность d",
        className: "axis-title",
        x: 4.04,
        y: 0,
        dx: 0,
        dy: 43,
        anchor: "end"
      },
      {
        text: "разрыв сжимается",
        className: "annotation",
        x: 2.61,
        y: 3.17,
        dx: 0,
        dy: -9,
        anchor: "middle"
      }
    ];

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const svg = document.getElementById("chart");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function makeElement(tag, attributes, content) {
      const node = document.createElementNS(namespace, tag);

      for (const [name, value] of Object.entries(attributes || {})) {
        node.setAttribute(name, String(value));
      }

      if (content !== undefined) {
        node.textContent = content;
      }

      return node;
    }

    function makeLine(item, className) {
      return makeElement("line", {
        x1: sx(item.x1),
        y1: sy(item.y1),
        x2: sx(item.x2),
        y2: sy(item.y2),
        class: className
      });
    }

    function makeText(item) {
      return makeElement("text", {
        x: sx(item.x),
        y: sy(item.y),
        dx: item.dx,
        dy: item.dy,
        "text-anchor": item.anchor,
        class: item.className
      }, item.text);
    }

    function makeCircle(item, className, radius) {
      return makeElement("circle", {
        cx: sx(item.x),
        cy: sy(item.y),
        r: sx(radius) - sx(0),
        class: className
      });
    }

    function makePolyline(points, className) {
      return makeElement("polyline", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      });
    }

    try {
      const fragment = document.createDocumentFragment();
      const [lowDimension, middleDimension, highDimension] = data;
      const [xAxis, yAxis, baseline, spread, arrow] = geometry;

      const areaPoints = [
        { x: lowDimension.x, y: lowDimension.y },
        { x: middleDimension.x, y: middleDimension.y },
        { x: highDimension.x, y: highDimension.y },
        { x: highDimension.x, y: baseline.y1 },
        { x: lowDimension.x, y: baseline.y1 }
      ];

      fragment.appendChild(makePolyline(areaPoints, "trend-area"));

      guideData.forEach(guide => {
        fragment.appendChild(makeLine({
          x1: guide.x,
          y1: guide.yTop,
          x2: guide.x,
          y2: guide.yBottom
        }, "guide"));
      });

      fragment.appendChild(makeLine(baseline, "baseline"));
      fragment.appendChild(makeLine(xAxis, "axis"));
      fragment.appendChild(makeLine(yAxis, "axis"));

      const xArrowHead = [
        { x: xAxis.x2, y: xAxis.y2 },
        {
          x: xAxis.x2 - lineWidths.arrowHeadLength,
          y: xAxis.y2 + lineWidths.arrowHeadHalfHeight
        },
        {
          x: xAxis.x2 - lineWidths.arrowHeadLength,
          y: xAxis.y2 - lineWidths.arrowHeadHalfHeight
        }
      ];

      const yArrowHead = [
        { x: yAxis.x2, y: yAxis.y2 },
        {
          x: yAxis.x2 - lineWidths.arrowHeadHalfHeight,
          y: yAxis.y2 - lineWidths.arrowHeadLength
        },
        {
          x: yAxis.x2 + lineWidths.arrowHeadHalfHeight,
          y: yAxis.y2 - lineWidths.arrowHeadLength
        }
      ];

      fragment.appendChild(makePolyline(xArrowHead, "arrow-head"));
      fragment.appendChild(makePolyline(yArrowHead, "arrow-head"));

      data.forEach(point => {
        fragment.appendChild(makeLine({
          x1: point.x,
          y1: 0,
          x2: point.x,
          y2: -0.09
        }, "tick"));

        fragment.appendChild(makeText({
          text: point.dimension,
          className: "tick-label",
          x: point.x,
          y: 0,
          dx: 0,
          dy: labelPadding.tickY,
          anchor: "middle"
        }));
      });

      fragment.appendChild(makeLine(spread, "spread"));

      fragment.appendChild(makeLine({
        x1: spread.x1 - lineWidths.spreadHalfCap,
        y1: spread.y1,
        x2: spread.x1 + lineWidths.spreadHalfCap,
        y2: spread.y1
      }, "spread-cap"));

      fragment.appendChild(makeLine({
        x1: spread.x2 - lineWidths.spreadHalfCap,
        y1: spread.y2,
        x2: spread.x2 + lineWidths.spreadHalfCap,
        y2: spread.y2
      }, "spread-cap"));

      spreadData.forEach(sample => {
        fragment.appendChild(
          makeCircle(sample, "sample", lineWidths.sampleRadius)
        );
      });

      fragment.appendChild(makePolyline(data, "trend"));

      fragment.appendChild(
        makeCircle(middleDimension, "point", lineWidths.pointRadius)
      );

      fragment.appendChild(
        makeCircle(highDimension, "final-ring", lineWidths.ringRadius)
      );

      fragment.appendChild(
        makeCircle(highDimension, "point", lineWidths.pointRadius)
      );

      fragment.appendChild(makeText({
        text: lowDimension.ratio,
        className: "spread-label",
        x: lowDimension.x,
        y: lowDimension.y,
        dx: lowDimension.valueDx,
        dy: lowDimension.valueDy,
        anchor: lowDimension.valueAnchor
      }));

      fragment.appendChild(makeText({
        text: middleDimension.ratio,
        className: "ratio-label",
        x: middleDimension.x,
        y: middleDimension.y,
        dx: middleDimension.valueDx,
        dy: middleDimension.valueDy,
        anchor: middleDimension.valueAnchor
      }));

      fragment.appendChild(makeText({
        text: highDimension.ratio,
        className: "ratio-label",
        x: highDimension.x,
        y: highDimension.y,
        dx: highDimension.valueDx,
        dy: highDimension.valueDy,
        anchor: highDimension.valueAnchor
      }));

      fragment.appendChild(makeText({
        text: highDimension.detail,
        className: "percent-label",
        x: highDimension.x,
        y: highDimension.y,
        dx: highDimension.detailDx,
        dy: highDimension.detailDy,
        anchor: highDimension.valueAnchor
      }));

      fragment.appendChild(makeLine(arrow, "arrow"));

      const convergenceArrowHead = [
        { x: arrow.x2, y: arrow.y2 },
        {
          x: arrow.x2 - lineWidths.arrowHeadLength,
          y: arrow.y2 + lineWidths.arrowHeadHalfHeight
        },
        {
          x: arrow.x2 - lineWidths.arrowHeadHalfHeight,
          y: arrow.y2 + lineWidths.arrowHeadLength
        }
      ];

      fragment.appendChild(
        makePolyline(convergenceArrowHead, "arrow-head")
      );

      textData.forEach(label => {
        fragment.appendChild(makeText(label));
      });

      svg.appendChild(fragment);
      fallback.hidden = true;
    } catch (error) {
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать: заметный разброс при d=2, отношение около 1,01 при d=100 и около 1,001 при d=1000.";
    }
  </script>
</body>
</html>
