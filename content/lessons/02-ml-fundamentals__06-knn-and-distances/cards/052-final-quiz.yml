- concept: полный перебор соседей требует времени, линейного по числу обучающих объектов и размерности
  question: Заполни асимптотическую сложность вычисления расстояний от одного запроса до всей обучающей выборки без индекса.
  explanation: Для каждой из n обучающих точек нужно сравнить d координат, поэтому полный перебор требует O(n · d) операций на один запрос без учёта отбора ближайших результатов.
  kind: cloze
  template: T(n, d) = ___
  answer: O(n * d)
  accept:
    - O(nd)
    - O(n*d)
    - O(n · d)
    - Θ(n * d)
    - Θ(nd)
