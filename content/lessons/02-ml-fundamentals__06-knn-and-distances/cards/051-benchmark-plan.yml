- concept: честное сравнение гиперпараметров KNN требует одинаковых данных для всех кандидатов
  question: Исследователь сравнивает несколько значений K и метрик расстояния для KNN. Как провести сравнение так, чтобы разницу в качестве можно было связать именно с настройками модели?
  explanation: Если конфигурации получают одинаковые обучающие и валидационные данные, меняются только исследуемые настройки. При разных разбиениях результат смешивает влияние модели со случайной сложностью выборки.
  kind: choice
  options:
    - Оценить все конфигурации на одной и той же зафиксированной валидационной выборке
    - Для каждой конфигурации случайно создавать новую валидационную выборку
    - Выбрать для каждой конфигурации ту выборку, на которой она показывает лучший результат
    - Обучить конфигурации на разных объёмах данных и сравнить их итоговые оценки
  correct: 0
  id: 051-benchmark-plan-1
  fingerprint: 34878bf3
- concept: валидационные данные служат для выбора конфигурации, а тестовые — для независимой итоговой оценки
  question: Расположите этапы выбора конфигурации KNN в правильном порядке.
  explanation: Тестовые данные не участвуют в выборе K, метрики или способа голосования. Поэтому оценка на них показывает качество уже выбранного решения, а не качество очередной попытки подобрать настройки под известный тест.
  kind: order
  items:
    - Заранее разделить данные на обучающую, валидационную и тестовую части
    - Обучить и настроить каждую конфигурацию только с использованием обучающей части
    - Сравнить конфигурации на валидационной части и выбрать лучшую
    - Оценить выбранную конфигурацию на тестовой части
  id: 051-benchmark-plan-2
  fingerprint: 793f3ef1
- concept: точные способы поиска соседей сравнивают по совпадению результатов и вычислительным затратам
  question: Почему при сравнении полного перебора и точного поиска через дерево недостаточно измерить только качество классификации KNN?
  explanation: Если найденные соседи совпадают, предсказания KNN и их качество также должны совпасть. Практическое преимущество точного индекса проявляется в скорости и памяти, а расхождение соседей указывает на ошибку реализации или на фактически приближённый поиск.
  kind: open
  reference: Точные способы поиска должны возвращать одинаковых ближайших соседей, поэтому сначала проверяют совпадение результатов. После этого сравнивают время построения индекса, задержку запросов и потребление памяти, поскольку именно вычислительные затраты различают такие способы поиска.
  id: 051-benchmark-plan-3
  fingerprint: b8a7d37e
