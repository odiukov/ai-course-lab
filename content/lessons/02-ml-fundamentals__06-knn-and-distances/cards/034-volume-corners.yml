- concept: для набора фиксированной доли данных KNN вынужден расширять окрестность и теряет локальность
  question: Объясните, почему в пространстве с большим числом независимых признаков KNN приходится считать соседями всё менее похожие объекты, чтобы охватить фиксированную долю равномерно распределённых данных.
  explanation: Объём пространства быстро уходит из небольшой центральной области. Расширение радиуса позволяет найти нужное число соседей, но такая окрестность охватывает значительную часть пространства и перестаёт быть локальной.
  kind: open
  reference: В высокой размерности малая окрестность занимает ничтожную долю всего пространства. Поэтому для включения фиксированной доли данных её радиус приходится сильно увеличивать, и выбранные объекты могут заметно отличаться от запроса сразу по многим признакам.
