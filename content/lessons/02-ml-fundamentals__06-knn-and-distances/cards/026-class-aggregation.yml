- concept: обычное голосование эквивалентно взвешенному при одинаковых положительных весах всех соседей
  question: При каком условии взвешенное голосование KNN обязательно выберет тот же класс, что и обычное голосование?
  explanation: Если веса всех соседей одинаковы, суммарный вес класса пропорционален числу его представителей. Поэтому класс с наибольшим количеством обычных голосов имеет и наибольшую сумму весов.
  kind: open
  reference: Все выбранные соседи должны получить одинаковый положительный вес.
