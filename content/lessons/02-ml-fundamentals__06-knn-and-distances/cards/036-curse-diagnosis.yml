- concept: общее масштабирование пространства не устраняет концентрацию расстояний
  question: Все координаты запроса и обучающих объектов умножили на один и тот же положительный коэффициент c. Заполни формулу для отношения максимального расстояния к минимальному.
  explanation: Оба расстояния умножаются на c, поэтому коэффициент сокращается. Если расстояния почти не различались относительно друг друга, общее изменение масштаба этого не исправит.
  kind: cloze
  template: d'ₘₐₓ / d'ₘᵢₙ = ___
  answer: dₘₐₓ / dₘᵢₙ
  accept:
    - d_max / d_min
    - d_max/d_min
