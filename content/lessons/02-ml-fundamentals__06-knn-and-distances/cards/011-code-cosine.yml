- concept: нулевая норма требует отдельной обработки до вычисления косинусного расстояния
  question: Почему функция косинусного расстояния должна проверять нормы векторов до деления и что ей следует вернуть, если какая-либо норма равна нулю?
  explanation: Косинус определён только при ненулевых нормах. Предварительная проверка предотвращает деление на ноль, а возврат единичного расстояния задаёт безопасное поведение для вектора без направления.
  kind: open
  reference: Нулевой вектор не имеет направления, а произведение норм оказывается нулевым, поэтому вычисление привело бы к делению на ноль. По условию функции нужно вернуть единичное расстояние.
