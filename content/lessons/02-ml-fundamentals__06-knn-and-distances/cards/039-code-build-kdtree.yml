- concept: медианный элемент исключается из дочерних подмножеств, чтобы рекурсивная задача уменьшалась
  question: Почему при рекурсивном построении KD-дерева медианную точку нельзя передавать ни в левую, ни в правую дочернюю ветвь?
  explanation: Текущий узел забирает медиану себе, а детям передаются только элементы строго до и строго после неё. Поэтому размер каждого следующего подмножества уменьшается.
  kind: open
