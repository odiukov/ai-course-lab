- concept: вес соседа вычисляется как обратная величина суммы расстояния и epsilon
  question: В distance-weighted KNN расстояние до соседа равно 0,24, а epsilon — 0,06. Какой вес получит этот сосед?
  explanation: Вес равен 1 / (0,24 + 0,06) = 1 / 0,30 ≈ 3,33.
  kind: numeric
  answer: 3.33
  tolerance: 0.01
