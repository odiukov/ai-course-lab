- concept: рекурсивное построение KD-дерева применяет разделение по оси и локальной медиане к каждому полученному подмножеству
  question: Расположите действия при рекурсивном построении части KD-дерева в правильном порядке.
  explanation: Каждый узел строится только по относящемуся к нему подмножеству. Поэтому после разделения по площади в точке 55 медиану цены вычисляют заново и отдельно внутри каждой полученной группы.
  kind: order
  items:
    - Выбрать ось разделения для текущего уровня дерева
    - Найти медиану выбранной координаты внутри текущего подмножества точек
    - Разделить текущее подмножество по найденной медиане
    - Повторить процедуру для полученных частей, пока они не станут листьями
  id: 038-kdtree-build-2
  fingerprint: e4d84899
