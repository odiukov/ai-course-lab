- concept: метка соседа извлекается из обучающих меток по индексу найденного объекта
  question: Функция поиска соседей вернула пары `(distance, row_idx)`. Заполни пропуск, чтобы получить класс текущего соседа.
  explanation: Поиск соседей возвращает индекс обучающего объекта, а его класс хранится в `y_train` под тем же индексом. Само расстояние метку класса не содержит.
  kind: cloze
  template: |-
    for distance, row_idx in neighbors:
        label = ___
  answer: y_train[row_idx]
  accept:
    - y_train[row_idx]
  id: 027-code-classify-1
  fingerprint: 3c8f7b40
- concept: поиск аргмаксимума в словаре голосов должен возвращать класс, а не величину его голоса
  question: Словарь `votes` сопоставляет каждому классу сумму набранных голосов. Какое выражение вернёт класс с наибольшей суммой?
  explanation: '`max(votes, key=votes.get)` перебирает ключи словаря, сравнивает их по соответствующим значениям и возвращает ключ-победитель. `max(votes.values())` вернул бы только величину максимального голоса.'
  kind: choice
  options:
    - max(votes, key=votes.get)
    - max(votes.values())
    - max(votes.get)
    - votes[max(votes.values())]
  correct: 0
  id: 027-code-classify-2
  fingerprint: e5b77818
