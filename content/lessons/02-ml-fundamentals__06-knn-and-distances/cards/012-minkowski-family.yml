  question: Что происходит с расстоянием Минковского при неограниченном увеличении p для фиксированной пары точек?
  explanation: 'Это предельный случай семейства Минковского — расстояние Чебышёва. Для расхождений 2 и 5 оно равно 5: при росте p наибольшее расхождение всё сильнее доминирует над остальными.'
