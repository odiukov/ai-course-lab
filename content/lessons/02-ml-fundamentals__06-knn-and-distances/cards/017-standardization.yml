  fingerprint: 5065ce61
- concept: стандартизация делает признаки сопоставимыми за счёт нормирования каждого признака на его собственный разброс
  question: Почему после стандартизации признаки, измеренные в разных единицах, можно корректнее использовать вместе при вычислении расстояния?
  explanation: После вычитания среднего и деления на стандартное отклонение исходные единицы измерения перестают определять масштаб координаты. Расстояние сравнивает относительные отклонения внутри каждого признака.
  kind: choice
  options:
    - Каждое значение выражается как отклонение от среднего в единицах разброса своего признака
    - Все исходные значения разных признаков становятся одинаковыми
    - Алгоритм перестаёт учитывать различия между объектами
    - Расстояние вычисляется только по признаку с наименьшими значениями
