- concept: косинусное расстояние подходит для текстовых эмбеддингов, когда важнее направление, а не длина вектора
  question: Нормы текстовых эмбеддингов заметно зависят от объёма документов, но при поиске соседей нужно сравнивать прежде всего их смысловую направленность. Какую метрику выбрать?
  explanation: Косинусное расстояние сравнивает направления векторов и не позволяет различиям в их длине доминировать при выборе соседей. Поэтому оно часто применяется к текстам и эмбеддингам.
