- concept: для смешанных типов признаков расстояния по разным типам объединяют в собственную метрику
  question: Объект описан массой, материалом и местоположением. Почему одной стандартной метрики может быть недостаточно и как построить расстояние для KNN?
  explanation: Числовая разность, несовпадение категорий и географическая удалённость имеют разный смысл. Собственная метрика позволяет корректно оценить каждую часть и объединить результаты.
  kind: open
  reference: 'Разные типы признаков требуют разных правил сравнения: массу можно сравнивать числовой метрикой, материал — метрикой для категорий, а местоположение — географическим расстоянием. Затем эти компоненты объединяют в собственную метрику с вкладом каждого признака, соответствующим задаче.'
