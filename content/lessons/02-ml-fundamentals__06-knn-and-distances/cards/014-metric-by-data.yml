- concept: выбор метрики может изменить состав ближайших соседей и предсказание KNN
  question: Для одного набора данных KNN с манхэттенским расстоянием выбрал одних соседей, а с косинусным — других. Данные и значение k не менялись. Чем это объясняется?
  explanation: Метрика определяет геометрию соседства. При её замене меняются расстояния и их порядок, поэтому KNN может выбрать другой набор соседей и выдать другое предсказание.
  kind: choice
  options:
    - Метрики задают разные определения близости, поэтому порядок соседей может измениться
    - KNN обязан выбирать случайных соседей при каждом запуске
    - Косинусное расстояние автоматически изменяет целевые классы объектов
