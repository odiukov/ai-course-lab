- concept: относительный разрыв между дальней и ближайшей точками вычисляется относительно расстояния до ближайшей точки
  question: Расстояние от запроса до ближайшей точки равно 375, а до самой дальней — 378. На сколько процентов дальняя точка дальше ближайшей?
  explanation: Относительный разрыв равен (378 − 375) / 375 × 100% = 0,8%. Такой расчёт показывает не абсолютную, а относительную различимость расстояний.
  kind: numeric
  answer: 0.8
  tolerance: 0.01
  id: 033-dimensional-ratios-1
  fingerprint: ff1fdc13
- concept: устойчивость порядка соседей зависит от соотношения разрыва расстояний и возможной погрешности
  question: Расстояния от запроса до двух кандидатов равны 48,20 и 48,24. Из-за шума каждое вычисленное расстояние может измениться на 0,06. Какой вывод об их порядке обоснован?
  explanation: Разрыв составляет лишь 0,04, а возможное изменение расстояний больше этого разрыва. Поэтому небольшое возмущение способно поменять кандидатов местами, хотя алгоритм по-прежнему сможет их отсортировать.
  kind: choice
  options:
    - Первый кандидат гарантированно останется ближайшим
    - Порядок кандидатов может измениться, потому что разрыв меньше возможного изменения расстояний
    - Оба кандидата обязательно окажутся на одинаковом расстоянии
    - Шум не может влиять на выбор соседей после сортировки
  correct: 1
  id: 033-dimensional-ratios-2
