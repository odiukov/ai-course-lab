- concept: зависимость времени поиска в KD-дереве от размерности пространства
  question: Как обычно меняется средняя сложность запроса ближайшего соседа в KD-дереве при переходе от низкой к высокой размерности?
  explanation: В низкой размерности KD-дерево обычно отсекает значительную часть пространства и выполняет запрос в среднем за O(log n). В высокой размерности поиск может посетить почти всё дерево, поэтому сложность приближается к O(n).
  kind: choice
  options:
    - От O(log n) она может приблизиться к O(n)
    - Она остаётся O(log n) при любой размерности
    - Она улучшается от O(n) до O(log n)
    - Она всегда равна O(n log n)
  correct: 0
  id: 043-kdtree-limits-1
  fingerprint: 38ed1af9
- concept: ослабление отсечения ветвей KD-дерева в высокой размерности
  question: Почему даже сбалансированное KD-дерево может искать ближайшего соседа почти как полный перебор в пространстве высокой размерности?
  explanation: Быстрый поиск обеспечивается не только малой глубиной дерева, но и отсечением неперспективных ветвей. В высокой размерности такое отсечение срабатывает редко, поэтому преимущество дерева исчезает.
  kind: open
  reference: Сбалансированность сокращает глубину первоначального спуска, но в высокой размерности при обратном проходе удаётся исключить мало соседних областей. Поэтому алгоритм проверяет всё больше ветвей и в пределе посещает почти все точки.
  id: 043-kdtree-limits-2
  fingerprint: feacec40
