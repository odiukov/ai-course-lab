- concept: манхэттенское расстояние равно сумме модулей покоординатных разностей
  question: Заполни пропуск в формуле манхэттенского расстояния между векторами.
  explanation: Для каждой координаты вычисляют разность, берут её модуль и складывают результаты. Например, разности −2, 5 и −1 дают расстояние 2 + 5 + 1 = 8.
  kind: cloze
  template: d(a,b)=___
  answer: \sum_i |a_i-b_i|
  accept:
    - Σ_i |a_i-b_i|
    - sum_i abs(a_i-b_i)
  id: 008-l1-kvartaly-1
  fingerprint: 92d58feb
- concept: отсутствие возведения разностей в квадрат делает L1 устойчивее к выбросам, чем L2
  question: Почему манхэттенское расстояние обычно меньше подвержено влиянию выбросов, чем евклидово?
  explanation: L1 складывает модули разностей. В L2 разности возводятся в квадрат, поэтому необычно большая разность усиливается дополнительно и сильнее влияет на итоговое расстояние.
  kind: choice
  options:
    - Оно полностью игнорирует координату с самой большой разностью
    - Оно использует модули разностей, не возводя большие разности в квадрат
    - Оно заменяет каждую разность её знаком
    - Оно учитывает только направление векторов
  correct: 1
  id: 008-l1-kvartaly-2
  fingerprint: 2bddf733
