- concept: сферические границы ball tree позволяют эффективнее отсекать ветви для структуры, не выровненной по координатным осям
  question: Почему ball tree может проверять меньше ветвей, чем KD-дерево, если точки образуют наклонные или округлые группы?
  explanation: Чем плотнее ограничивающая область охватывает точки, тем чаще поиск может исключить всё поддерево без проверки каждой находящейся в нём точки.
  kind: open
  reference: Гиперсферы ball tree могут плотнее охватывать такие группы, чем параллельные осям области KD-дерева. Благодаря меньшему объёму пустого пространства проще доказать, что целая ветвь не содержит более близких соседей, и отсечь её.
