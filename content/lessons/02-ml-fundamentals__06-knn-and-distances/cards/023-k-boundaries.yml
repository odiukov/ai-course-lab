- concept: при K=N граница решения исчезает, потому что все запросы получают глобальный класс большинства
  question: Объясни своими словами, почему KNN-классификатор при K=N выдаёт один и тот же класс для любой новой точки.
  explanation: При K=N модель каждый раз голосует по всему обучающему набору. Положение новой точки больше ни на что не влияет, поэтому предсказание везде одинаково, а граница между классами фактически исчезает.
  kind: open
  reference: Для каждого запроса соседями становятся все N обучающих объектов. Их состав не зависит от положения запроса, поэтому голосование всегда имеет один результат — глобальный класс большинства.
  id: 023-k-boundaries-2
