- concept: соседнюю ветвь KD-дерева проверяют, если её нижняя оценка расстояния меньше текущего лучшего расстояния
  question: При точном поиске ближайшего соседа в KD-дереве текущее лучшее расстояние равно r, а минимально возможное расстояние до точек соседней области равно b. Когда соседняя ветвь может содержать более близкую точку?
  explanation: Если b < r, нижняя граница расстояния в соседней области ещё допускает улучшение результата. При b > r всю ветвь можно отбросить. Равенство важно лишь при необходимости учитывать точки, находящиеся на той же минимальной дистанции.
  kind: choice
  options:
    - Когда b < r
    - Когда b > r
    - Только когда b равно r
    - При любом соотношении b и r
  correct: 0
  id: 040-kdtree-query-1
  fingerprint: 624226c5
- concept: поиск в KD-дереве состоит из спуска к листу и обратного прохода с проверкой перспективных ветвей
  question: Расположи этапы точного поиска ближайших соседей в KD-дереве в правильном порядке.
  explanation: Первичный спуск быстро даёт кандидатов, но ещё не гарантирует точный результат. При возвращении к корню алгоритм проверяет только области, способные улучшить текущий набор соседей.
  kind: order
  items:
    - Выбирать на каждом разделении сторону, содержащую запрос, и спуститься до листа
    - Проверить точки листа и сформировать текущий набор лучших кандидатов
    - При подъёме к родительскому узлу сравнить нижнюю оценку расстояния до соседней области с текущим радиусом поиска
    - Исследовать перспективную соседнюю ветвь, обновить кандидатов и продолжить обратный проход
  id: 040-kdtree-query-2
  fingerprint: b53ca3b7
- concept: при поиске K соседей радиус отсечения задаётся самым дальним объектом текущего набора кандидатов
  question: Заполни формулу радиуса отсечения при поиске K ближайших соседей, если C_K — текущий набор кандидатов.
  explanation: Чтобы новая точка вошла в текущий набор K лучших, она должна оказаться ближе самого дальнего кандидата. Поэтому именно максимальное расстояние внутри C_K служит порогом при отсечении ветвей.
  kind: cloze
  template: r_K = ___
  answer: max_{x ∈ C_K} d(q, x)
  accept:
    - расстояние до самого дальнего кандидата
    - максимальное расстояние до кандидата из C_K
  id: 040-kdtree-query-3
  fingerprint: 2b2c81ef
