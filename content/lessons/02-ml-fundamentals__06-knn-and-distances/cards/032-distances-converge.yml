- concept: суммирование вкладов множества неинформативных координат приводит к концентрации расстояний
  question: Объясни своими словами, почему добавление множества независимых неинформативных признаков может сделать расстояния от запроса до разных объектов относительно похожими.
  explanation: В высокой размерности расстояние складывается из множества координатных вкладов. Если признаки не образуют полезной структуры, их случайные различия усредняются, и расстояния концентрируются около характерного значения.
  kind: open
  reference: Каждый новый признак добавляет к расстоянию случайный вклад. При суммировании большого числа таких вкладов положительные и отрицательные отклонения от типичного уровня частично компенсируются, поэтому относительный разброс итоговых расстояний уменьшается.
  id: 032-distances-converge-2
