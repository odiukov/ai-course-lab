- concept: перед KNN бесполезные признаки удаляют, а избыточные связанные признаки можно сжать
  question: В данных для KNN есть случайные идентификаторы и большая группа сильно связанных числовых признаков. Как лучше подготовить такие данные?
  explanation: KNN учитывает каждую координату при вычислении расстояния. Бесполезные идентификаторы следует удалить, а избыточные связанные признаки можно сжать, например с помощью PCA.
  kind: choice
  options:
    - 'Оставить все столбцы: KNN сам определит, какие признаки важны'
    - Удалить идентификаторы, а связанные признаки представить меньшим числом координат
    - Заменить все признаки одним случайным столбцом
    - Продублировать связанные признаки, чтобы усилить их влияние
  correct: 1
  id: 035-reduce-dimensions-1
  fingerprint: b3f8743f
- concept: различие между отбором признаков и снижением размерности перед KNN
  question: Объясни своими словами, чем удаление признаков отличается от снижения размерности и зачем оба подхода применяют перед KNN.
  explanation: 'В высокой размерности расстояния между объектами становятся почти одинаковыми: при d = 1000 отношение максимального расстояния к минимальному может быть около 1.001. Удаление лишних координат и их сжатие ослабляют эту проблему.'
  kind: open
  reference: При отборе признаков ненужные исходные столбцы исключают целиком. При снижении размерности множество исходных признаков преобразуют в меньшее число новых координат, стараясь сохранить полезную структуру данных. Оба подхода уменьшают число измерений, в которых KNN сравнивает объекты, и помогают сделать соседство более содержательным.
  id: 035-reduce-dimensions-2
  fingerprint: 0e1168d1
