- concept: во взвешенной KNN-классификации побеждает класс с наибольшей суммой весов соседей
  question: Взвешенный KNN-классификатор нашёл соседей класса A с весами 4,5 и 0,7, а класса B — с весами 2,4 и 2,3. Какой класс получит запрос?
  explanation: Для каждого класса складываются веса его соседей. У класса A сумма равна 5,2, а у класса B — 4,7, поэтому побеждает класс A.
  kind: choice
  options:
    - Класс A
    - Класс B
    - Нельзя определить без исходных расстояний
  correct: 0
  id: 025-distance-weights-1
  fingerprint: 73853a29
- concept: epsilon предотвращает деление на ноль при точном совпадении запроса с обучающим объектом
  question: Зачем к расстоянию добавляют маленькое положительное epsilon при вычислении веса соседа во взвешенном KNN?
  explanation: Без epsilon точное совпадение привело бы к делению на ноль. Добавка делает вычисление корректным, при этом совпавший объект всё равно получает особенно большой вес.
  kind: open
  reference: Если запрос точно совпадёт с обучающим объектом, расстояние станет нулевым. Epsilon сохраняет знаменатель положительным, предотвращает деление на ноль и оставляет совпавшему объекту очень большой, но конечный вес.
  id: 025-distance-weights-2
  fingerprint: b2ac40c6
- concept: множество далёких соседей может накопить заметный суммарный вес, поэтому взвешивание не делает выбор K безразличным
  question: Вес ближайшего соседа равен 3,6. Вес каждого далёкого соседа того же конкурирующего класса равен 0,08. Какое минимальное количество далёких соседей даст суммарный вес строго больше веса ближайшего?
  explanation: Сорок пять далёких соседей дают суммарный вес 3,6 — это только равенство. Сорок шесть дают 3,68 и уже перевешивают ближайшего соседа. Поэтому взвешенный KNN менее чувствителен к K, но чрезмерно большое K всё же может изменить результат.
  kind: numeric
  answer: 46
  tolerance: 0.001
  id: 025-distance-weights-3
