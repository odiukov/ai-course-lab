- concept: классификатор по одному ближайшему соседу склонен переобучаться
  question: Как обычно ведёт себя KNN, который учитывает только одного ближайшего соседа, если в обучающей выборке нет одинаковых объектов с разными метками?
  explanation: При K = 1 каждый обучающий объект оказывается ближайшим соседом самому себе, поэтому ошибка на обучении обычно нулевая. Однако граница решения повторяет шум и случайные особенности данных, что ведёт к высокому разбросу.
  kind: choice
  options:
    - Почти не ошибается на обучении, но сильно реагирует на шум и отдельные точки
    - Даёт гладкую границу и игнорирует локальные особенности
    - Всегда предсказывает самый частый класс во всей выборке
  correct: 0
  id: 024-pick-k-1
  fingerprint: ea00e445
- concept: нечётное K предотвращает ничью в бинарном голосовании, но не гарантирует хорошее качество модели
  question: Объясни своими словами, какую проблему решает нечётное K в бинарной классификации и почему этого недостаточно для выбора хорошей модели.
  explanation: Нечётность K отвечает только за отсутствие равного счёта между двумя классами. Компромисс между переобучением и недообучением всё равно зависит от величины K.
  kind: open
  reference: 'Нечётное число соседей не позволяет голосам двух классов разделиться поровну. Однако оно не определяет подходящий масштаб соседства: слишком малое K остаётся чувствительным к шуму, а слишком большое может сгладить полезную структуру.'
  id: 024-pick-k-2
  fingerprint: 180e311b
