- concept: поиск ближайших соседей в RAG возвращает релевантные фрагменты документов
  question: Что является результатом поиска ближайших соседей в типичной RAG-системе?
  explanation: RAG сопоставляет эмбеддинг вопроса с эмбеддингами фрагментов документов и извлекает ближайшие фрагменты. В отличие от KNN-классификатора, результатом поиска здесь служат сами найденные объекты, а не метка, полученная голосованием.
  kind: choice
  options:
    - Новый набор параметров языковой модели
    - Фрагменты документов, близкие к вопросу в пространстве эмбеддингов
    - Единственная метка класса, выбранная голосованием
    - Среднее значение координат всех документов
  correct: 1
  id: 049-knn-in-ai-1
  fingerprint: c62e1059
- concept: рекомендательные системы используют близость эмбеддингов для поиска похожих пользователей или объектов
  question: Объясните, как поиск ближайших соседей можно использовать для формирования рекомендаций.
  explanation: Если представление и метрика отражают полезное сходство, близкие эмбеддинги соответствуют похожим пользователям или объектам. Поэтому тот же поиск соседей, который применяется в KNN, может находить кандидатов для рекомендательной системы.
  kind: open
  reference: Пользователей или рекомендуемые объекты представляют эмбеддингами. Для выбранного пользователя или объекта находят ближайшие векторы, соответствующие похожим пользователям, товарам, фильмам или другим объектам, и используют найденные объекты как кандидатов для рекомендации.
  id: 049-knn-in-ai-2
  fingerprint: caef8945
