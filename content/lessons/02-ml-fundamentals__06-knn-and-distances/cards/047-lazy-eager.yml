- concept: ленивое обучение удобно при частых обновлениях данных и редких предсказаниях
  question: Обучающая выборка сервиса часто пополняется, а прогнозы запрашивают редко. Объясни, почему в такой ситуации ленивое обучение может быть удобнее жадного.
  explanation: Ленивое обучение делает обновление дешёвым, но переносит расходы на запросы. При частых изменениях выборки и небольшом числе прогнозов такой обмен может быть выгоден.
  kind: open
  reference: Ленивый алгоритм может сразу учитывать добавленные наблюдения без повторного обучения. Поскольку прогнозы редки, высокая стоимость вычислений во время каждого запроса менее критична. Жадную модель после обновлений пришлось бы переобучать, чтобы изменить её параметры.
  id: 047-lazy-eager-2
  fingerprint: '0e311345'
