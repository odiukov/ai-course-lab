- concept: модуль комплексного коэффициента равен корню из суммы квадратов его действительной и мнимой частей
  question: Коэффициент Фурье имеет действительную часть 6 и мнимую часть 8. Чему равен его модуль?
  explanation: Модуль равен √(6² + 8²) = √100 = 10. Знаки частей не повлияли бы на результат, поскольку обе части возводятся в квадрат.
  kind: numeric
  answer: 10
  tolerance: 0.001
  id: 018-magnitude-spectrum-1
  fingerprint: 343b2e7c
- concept: спектр мощности равен квадрату magnitude spectrum
  question: Для некоторой частотной корзины модуль коэффициента равен m. Как выражается мощность в этой корзине?
  explanation: Мощность равна |X[k]|². Если m = |X[k]|, то мощность равна m², то есть m · m.
  kind: choice
  options:
    - m + m
    - m · m
    - √m
    - 1 / m
  correct: 1
  id: 018-magnitude-spectrum-2
  fingerprint: ffd47f4a
