- concept: полное частотное представление сохраняет информацию, необходимую для восстановления сигнала
  question: Почему представление сигнала в частотной области не обязательно означает потерю исходных значений во времени?
  explanation: Временная и частотная области — разные представления одних данных. Амплитуды описывают силу составляющих, а фазы — их взаимное расположение, поэтому полный спектр позволяет выполнить обратное преобразование и восстановить сигнал.
  kind: open
  reference: Полное частотное представление содержит амплитуды и фазы составляющих. Если они сохранены и преобразование выполнено в подходящих условиях, обратное преобразование Фурье восстанавливает исходный сигнал.
