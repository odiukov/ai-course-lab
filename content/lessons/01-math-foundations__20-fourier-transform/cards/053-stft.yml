- concept: число общих отсчётов соседних окон STFT равно разности между размером окна и шагом
  question: Окно STFT содержит 600 отсчётов, а hop size равен 240 отсчётам. Сколько отсчётов перекрываются у двух соседних окон?
  explanation: Следующее окно начинается через 240 отсчётов, поэтому общая часть равна 600 − 240 = 360 отсчётов. Это соответствует перекрытию 60%.
  kind: numeric
  answer: 360
  tolerance: 0.1
  id: 053-stft-1
  fingerprint: cad259da
- concept: STFT строит спектрограмму последовательным оконным анализом локальных фрагментов сигнала
  question: Расположи операции обработки одного положения окна STFT в правильном порядке.
  explanation: Сначала выбирают локальный фрагмент, затем сглаживают его края оконной функцией и вычисляют FFT. Полученный спектр модулей сохраняют как один временной срез спектрограммы.
  kind: order
  items:
    - Извлечь фрагмент сигнала для текущего положения окна
    - Умножить фрагмент на оконную функцию
    - Вычислить FFT оконного фрагмента
    - Сохранить спектр модулей как столбец спектрограммы
  id: 053-stft-2
  fingerprint: afe1e802
