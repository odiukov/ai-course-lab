- concept: разбиение по чётности индексов сохраняет структуру DFT в подпоследовательностях меньшей длины
  question: Почему разбиение входных отсчётов по чётным и нечётным индексам позволяет рекурсивно вычислять DFT?
  explanation: После подстановки чётных индексов их вклады принимают форму отдельного DFT половинной длины. Для нечётных индексов получается ещё одно такое DFT, а сдвиг индексов учитывается поворачивающим множителем.
  kind: open
  reference: У чётных индексов исходный номер выражается через локальный индекс подпоследовательности, поэтому комплексные экспоненты образуют базис DFT меньшей длины. Нечётные индексы дают такое же малое DFT с дополнительным фазовым множителем.
  id: 025-even-odd-2
  fingerprint: 70b27e01
