- concept: период дискретного фазора равен N, делённому на НОД частотного индекса и длины DFT
  question: В DFT длины N = 35 выбран частотный индекс k = 14. Через сколько увеличений n фазор впервые вернётся в исходную точку?
  explanation: Период равен N / НОД(N, k). НОД(35, 14) = 7, поэтому фазор возвращается в исходную точку через 35 / 7 = 5 шагов.
  kind: numeric
  answer: 5
  tolerance: 0.01
  id: 010-phasor-circle-1
  fingerprint: acc15b8f
- concept: частотные индексы, различающиеся на целое число длин DFT, задают одинаковую последовательность фазоров
  question: Для DFT длины N = 15 базисный множитель взят с частотным индексом k = 6. Какой другой целочисленный индекс создаёт точно такие же множители для всех целых n?
  explanation: Индекс 21 отличается от 6 ровно на N = 15. Добавка N в частотном индексе вносит в показатель экспоненты целое число полных оборотов, поэтому значения фазора не меняются.
  kind: choice
