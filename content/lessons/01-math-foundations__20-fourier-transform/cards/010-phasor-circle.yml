- concept: коэффициент DFT для постоянной составляющей равен сумме всех отсчётов
  question: Объясни своими словами, почему коэффициент DFT для постоянной составляющей равен сумме всех отсчётов сигнала.
  explanation: При k = 0 множитель e^(-2πikn/N) равен единице для любого n, поэтому формула DFT превращается в обычное суммирование отсчётов.
  kind: open
  reference: Для нулевой частоты базисный фазор не вращается и при каждом отсчёте равен единице. Поэтому каждый отсчёт входит в коэффициент без изменения, а итоговый коэффициент равен их сумме.
  id: 010-phasor-circle-3
  fingerprint: 49028a17
