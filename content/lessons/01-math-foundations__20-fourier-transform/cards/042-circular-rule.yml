- concept: периодическая интерпретация DFT приводит к заворачиванию вкладов на границе
  question: Почему поэлементное произведение DFT последовательностей с последующим IDFT без дополнения нулями даёт циклическую, а не линейную свёртку? Объясни своими словами.
  explanation: Для DFT конец последовательности непосредственно соединён с её началом. Из-за этой периодичности свёрточные вклады не продолжают результат за границей, а заворачиваются на противоположную сторону.
  kind: open
  reference: DFT интерпретирует конечную последовательность как один период периодического сигнала. Поэтому вклад, выходящий за конец периода, появляется в его начале и складывается с уже находящимися там значениями.
  id: 042-circular-rule-2
  fingerprint: 189a0dc8
