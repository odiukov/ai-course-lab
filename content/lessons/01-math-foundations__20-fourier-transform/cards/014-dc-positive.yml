- concept: постоянное смещение сигнала изменяет только DC-компоненту его DFT
  question: К каждому отсчёту сигнала прибавили одну и ту же константу. Какая часть его спектра DFT изменится?
  explanation: Добавленная константа не создаёт колебаний, поэтому её вклад сосредоточен в X[0]. Значение X[0] изменится на произведение добавленной константы и N, а остальные коэффициенты не изменятся.
  kind: open
  reference: 'Изменится только DC-компонента: она описывает постоянный уровень сигнала. Коэффициенты ненулевых частот останутся прежними.'
  id: 014-dc-positive-1
  fingerprint: 050643a4
- concept: корзины от первой ненулевой до частоты Найквиста представляют положительные частоты, возрастающие с индексом
  question: Как интерпретируются коэффициенты DFT от первой ненулевой корзины до корзины Найквиста?
  explanation: Для 1 ≤ k ≤ N/2 коэффициент X[k] соответствует k циклам на N отсчётов. Поэтому увеличение k означает более быстрое положительное колебание, вплоть до частоты Найквиста.
  kind: choice
  options:
    - Как отрицательные частоты, которые становятся ниже с ростом индекса
    - Как копии постоянной составляющей
    - Как последовательные отсчёты исходного сигнала
    - Как одну и ту же частоту с разными обозначениями
    - Как коэффициенты, содержащие только фазу и не содержащие амплитуду
    - Как положительные частоты, которые становятся выше с ростом индекса
  correct: 5
  id: 014-dc-positive-2
  fingerprint: 6f9a4cb1
