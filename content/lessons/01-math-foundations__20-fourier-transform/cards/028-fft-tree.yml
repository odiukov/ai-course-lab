- concept: полное рекурсивное разбиение FFT создаёт битово-развёрнутый порядок индексов
  question: Как связан порядок исходных индексов в листьях дерева FFT с их двоичной записью?
  explanation: Каждое разделение по чётности проверяет очередной бит индекса, начиная с младшего. Последовательность выборов ветвей записывает биты в обратном порядке, поэтому возникает битово-развёрнутая перестановка.
  kind: open
  reference: Порядок листьев получается обращением порядка битов в двоичной записи каждого индекса. На каждом уровне ветвь выбирается по очередному младшему биту, поэтому весь путь читает биты от младшего к старшему.
  id: 028-fft-tree-1
  fingerprint: 8575d1ff
- concept: глубина рекурсивного дерева FFT равна двоичному логарифму длины сигнала
  question: FFT длины 512 на каждом уровне делит задачу пополам. Сколько уровней разбиения отделяет исходную задачу от базовых случаев?
  explanation: При каждом разбиении размер задачи уменьшается вдвое. Двоичный логарифм 512 равен 9, поэтому до базовых случаев нужно пройти 9 уровней.
  kind: numeric
  answer: 9
  tolerance: 0.01
  id: 028-fft-tree-2
  fingerprint: d3a80166
