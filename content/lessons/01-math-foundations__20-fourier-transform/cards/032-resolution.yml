- concept: частотное разрешение DFT обратно пропорционально длительности наблюдения
  question: Какова минимальная длительность записи в секундах, если требуется частотный шаг DFT не крупнее 4 Гц?
  explanation: Частотный шаг равен Δf = 1/T, поэтому T = 1/Δf = 1/4 = 0,25 секунды. Чем дольше наблюдение, тем ближе расположены частотные корзины.
  kind: numeric
  answer: 0.25
  tolerance: 0.001
  id: 032-resolution-1
  fingerprint: 359e3fe2
- concept: повышение частоты дискретизации без увеличения длительности расширяет частотный диапазон, но не улучшает разрешение
  question: Частоту дискретизации записи увеличили вдвое, сохранив прежнюю длительность наблюдения. Как изменятся частотный шаг DFT и граница Найквиста?
  explanation: При неизменной длительности число отсчётов растёт вместе с частотой дискретизации, поэтому отношение fs/N и частотный шаг остаются прежними. Граница Найквиста fs/2 при этом повышается.
  kind: choice
  options:
    - Частотный шаг уменьшится вдвое, а граница Найквиста не изменится
    - И частотный шаг, и граница Найквиста останутся прежними
    - Частотный шаг не изменится, а граница Найквиста увеличится вдвое
    - И частотный шаг, и граница Найквиста увеличатся вдвое
  correct: 2
  id: 032-resolution-2
  fingerprint: bae455fa
