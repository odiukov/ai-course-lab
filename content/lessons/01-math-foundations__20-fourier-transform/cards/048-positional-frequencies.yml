- concept: координаты синусоидальной позиционной кодировки остаются ограниченными при росте номера позиции
  question: Почему отдельные координаты синусоидальной позиционной кодировки не растут по модулю вместе с номером позиции?
  explanation: Аргумент sin или cos увеличивается с позицией, но выход функции продолжает колебаться между −1 и 1. Благодаря этому масштаб позиционных признаков не зависит от величины номера позиции.
  kind: open
  reference: Каждая координата вычисляется функцией sin или cos. Эти периодические функции принимают значения только в ограниченном диапазоне, поэтому даже очень большой номер позиции не приводит к неограниченному росту координат.
