- concept: поворот синус-косинусной пары сохраняет её евклидову норму
  question: Позиционная пара имеет координаты sin(ωp) и cos(ωp). Какая величина гарантированно не изменится после сдвига позиции?
  explanation: Сдвиг действует как поворот, а поворот сохраняет евклидову норму. Поэтому сумма квадратов синуса и косинуса остаётся единичной, хотя сами координаты меняются.
  kind: choice
  options:
    - Сумма квадратов координат
