- concept: последовательные позиционные сдвиги складывают углы поворота одной частотной пары
  question: Объясни, почему для одной синус-косинусной пары последовательные сдвиги на Δₐ и Δᵦ эквивалентны одному сдвигу на Δₐ + Δᵦ.
  explanation: 'Матрицы поворота одной пары образуют согласованную систему: произведение поворотов для двух сдвигов равно повороту для суммы этих сдвигов.'
  kind: open
  reference: Первый сдвиг поворачивает пару на угол ωΔₐ, а второй — на ωΔᵦ. Композиция поворотов складывает их углы, поэтому общий угол равен ωΔₐ + ωΔᵦ = ω(Δₐ + Δᵦ), что соответствует одному суммарному сдвигу.
