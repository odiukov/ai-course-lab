- concept: базовый случай FFT нормализует тип спектрального коэффициента до Complex
  question: Когда рекурсия FFT дошла до неделимой последовательности, зачем возвращать её значение в виде Complex, если на входе был обычный скаляр?
  explanation: Численно коэффициент базового случая совпадает с исходным значением, но Complex обеспечивает единый тип данных во всей рекурсии. Благодаря этому сложение, вычитание и умножение на twiddle выполняются без отдельных ветвей для обычных чисел.
  kind: open
  reference: Чтобы все рекурсивные вызовы возвращали спектральные коэффициенты одного комплексного типа и их можно было единообразно объединять с комплексными поворачивающими множителями.
  id: 027-fft-2
  fingerprint: 566bd510
