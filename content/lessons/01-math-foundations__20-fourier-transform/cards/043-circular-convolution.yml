- concept: аккумулятор прямой циклической свёртки создаётся отдельно для каждой выходной позиции
  question: Расположите действия прямой реализации циклической свёртки в правильном порядке.
  explanation: Внешний цикл выбирает выходной отсчёт, а внутренний собирает для него полную сумму произведений. Если сохранить аккумулятор до завершения внутреннего цикла или не создать его заново для следующей позиции, результат будет неверным.
  kind: order
  items:
    - Создать новый результирующий массив нужной длины.
    - Для очередной позиции результата создать отдельный аккумулятор суммы.
    - Перебрать входные отсчёты и прибавить в аккумулятор соответствующие произведения.
    - После завершения внутреннего перебора сохранить аккумулятор в выбранную позицию результата.
  id: 043-circular-convolution-2
  fingerprint: 4eadcf22
