- concept: размытие подавляет высокие частоты, а повышение резкости усиливает их
  question: Как размытие и повышение резкости по-разному воздействуют на частотные компоненты изображения?
  explanation: Плавные области представлены преимущественно низкими частотами, а мелкие детали и резкие границы — высокими. Поэтому подавление высоких частот сглаживает изображение, а их усиление подчёркивает детали и контуры.
  kind: open
  reference: Размытие ослабляет высокочастотные компоненты, соответствующие быстрым изменениям яркости. Повышение резкости, напротив, усиливает эти компоненты.
