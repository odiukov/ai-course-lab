- concept: ячейка спектрограммы характеризует силу частотной компоненты в определённом временном окне
  question: В спектрограмме столбцы соответствуют временным окнам, а строки — частотным корзинам. Что показывает значение одной ячейки?
  explanation: Каждый столбец получается из локального фрагмента сигнала, а каждая строка относится к частотной корзине. Значение на их пересечении показывает magnitude или энергию этой частоты в данном окне.
  kind: choice
  options:
    - Силу соответствующей частотной компоненты в соответствующем временном окне
    - Точный временной отсчёт исходного сигнала
    - Общую длительность звучания этой частоты
    - Порядковый номер FFT-преобразования
  correct: 0
  id: 054-spectrogram-1
  fingerprint: 3770b6e7
- concept: рост частоты во времени образует восходящую спектральную траекторию
  question: На спектрограмме яркая узкая полоса с течением времени перемещается от низких частот к высоким. Какой звук наиболее вероятно дал такую картину?
  explanation: Положение полосы по частотной оси показывает преобладающую частоту. Если полоса поднимается по мере движения во времени, частота звука возрастает.
  kind: choice
  options:
    - Нота с неизменной высотой
    - Свист с постепенно растущей высотой
    - Короткий широкополосный хлопок
    - Тишина с постоянным фоновым шумом
  correct: 1
  id: 054-spectrogram-2
  fingerprint: a400a0b6
- concept: временная локализация спектрограммы ограничена конечной длиной и шагом окон
  question: Почему отдельный столбец спектрограммы нельзя считать описанием звука в одном точном мгновении?
  explanation: FFT для столбца получает сразу несколько соседних отсчётов из оконного фрагмента. Спектрограмма локализует событие лишь в пределах этого окна и сетки, заданной шагом окон.
  kind: open
  reference: Столбец вычисляется по конечному фрагменту сигнала, попавшему в окно STFT. Поэтому он объединяет информацию за некоторый интервал времени, а точность временной локализации зависит от длины окна и шага между окнами.
  id: 054-spectrogram-3
  fingerprint: 56edaa77
