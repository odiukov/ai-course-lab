- concept: частота выше границы Найквиста при дискретизации отображается в более низкую частоту
  question: Синусоиду частотой 19 Гц дискретизируют с частотой 30 Гц. Под какую положительную частоту она замаскируется?
  explanation: Частота Найквиста равна 15 Гц, поэтому 19 Гц лежит выше неё. После дискретизации она неотличима от зеркальной частоты 30 − 19 = 11 Гц.
  kind: choice
  options:
    - 9 Гц
    - 11 Гц
    - 13 Гц
    - 19 Гц
  correct: 1
  id: 015-nyquist-negative-1
  fingerprint: 3913ff64
- concept: частотные корзины после Найквиста переводятся в отрицательные физические частоты
  question: DFT содержит 20 корзин, а частота дискретизации равна 100 Гц. Какой физической частоте соответствует корзина k = 17?
  explanation: Для корзины после Найквиста используется f_k = (k − N)f_s/N. Поэтому (17 − 20)·100/20 = −15 Гц.
  kind: numeric
  answer: -15
  tolerance: 0.001
  id: 015-nyquist-negative-2
  fingerprint: 1cc66c58
- concept: спектр вещественного сигнала обладает комплексно-сопряжённой симметрией
  question: Заполни пропуск в формуле симметрии DFT вещественного сигнала.
  explanation: Зеркальные коэффициенты имеют одинаковые действительные части и противоположные мнимые части. Поэтому отрицательная половина спектра вещественного сигнала не содержит независимой информации.
  kind: cloze
  template: X[N-k] = ___
  answer: conj(X[k])
  accept:
    - conjugate(X[k])
    - комплексно-сопряжённое X[k]
    - X[k]*
  id: 015-nyquist-negative-3
  fingerprint: 319ac983
