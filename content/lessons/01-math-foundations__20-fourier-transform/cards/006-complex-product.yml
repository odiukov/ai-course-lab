- concept: модуль произведения комплексных чисел равен произведению их модулей
  question: Модули комплексных чисел z и w равны 5 и 7. Чему равен модуль произведения zw?
  explanation: 'При комплексном умножении модули перемножаются: |zw| = |z||w|. Поэтому |zw| = 5 · 7 = 35.'
  kind: numeric
  answer: 35
  tolerance: 0.001
  id: 006-complex-product-1
  fingerprint: 1c48008f
- concept: при умножении комплексных чисел их аргументы складываются
  question: Аргумент комплексного числа z равен 70°, а аргумент w равен −25°. Каков аргумент произведения zw?
  explanation: 'При комплексном умножении углы складываются: arg(zw) = arg(z) + arg(w). Поэтому 70° + (−25°) = 45°.'
  kind: choice
  options:
    - 45°
    - 95°
    - −45°
