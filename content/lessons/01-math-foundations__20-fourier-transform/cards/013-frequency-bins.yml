- concept: физическая частота корзины DFT равна произведению её индекса на частотный шаг fs/N
  question: Сигнал дискретизирован с частотой 9600 Гц, а DFT вычислена по 2400 отсчётам. Какой физической частоте в герцах соответствует корзина k = 135?
  explanation: Частота корзины вычисляется как f_k = k·fs/N. Частотный шаг равен 9600/2400 = 4 Гц, поэтому корзина k = 135 соответствует 135·4 = 540 Гц.
  kind: numeric
  answer: 540
  tolerance: 0.01
  id: 013-frequency-bins-1
  fingerprint: 18c6ce96
- concept: при неизменной частоте дискретизации увеличение числа отсчётов уменьшает частотный шаг DFT
  question: Объясни своими словами, почему более длинная запись позволяет DFT различать более близкие частоты, если частота дискретизации остаётся неизменной.
  explanation: Разрешение DFT определяется формулой Δf = fs/N. Чем больше отсчётов содержит запись при том же fs, тем меньше расстояние между соседними частотными корзинами и тем ближе могут быть различимые частоты.
  kind: open
  reference: 'Частотный шаг равен Δf = fs/N. При увеличении числа отсчётов N знаменатель растёт, поэтому Δf уменьшается: соседние корзины соответствуют более близким физическим частотам.'
  id: 013-frequency-bins-2
  fingerprint: 309996c9
