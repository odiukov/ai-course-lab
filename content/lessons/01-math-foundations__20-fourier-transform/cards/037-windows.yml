- concept: широкий главный лепесток ухудшает разделение близких частот
  question: Почему окно Блэкмана может хуже окна Ханна разделить близкие по частоте тоны, несмотря на более сильное подавление боковых лепестков?
  explanation: Подавление боковых лепестков и ширина главного лепестка образуют компромисс. Блэкман очищает фон лучше Ханна, но сильнее расширяет пики и тем самым ухудшает различение близких частот.
  kind: open
  reference: Окно Блэкмана создаёт более широкий главный лепесток. Главные лепестки близких тонов сильнее перекрываются и могут слиться в один пик, поэтому частоты становится труднее различить.
