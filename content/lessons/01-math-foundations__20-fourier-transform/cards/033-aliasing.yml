- concept: по совпадающим отсчётам невозможно однозначно выбрать исходный сигнал среди его алиасов
  question: Два непрерывных синусоидальных сигнала после дискретизации дали совершенно одинаковые отсчёты. Можно ли без дополнительных сведений однозначно определить, какой из сигналов был исходным? Объясни своими словами.
  explanation: При алиасинге разные непрерывные сигналы становятся одной и той же дискретной последовательностью. Например, отсчёты тонов 90 Гц и 10 Гц при частоте дискретизации 100 Гц совпадают, поэтому восстановить исходные 90 Гц только математической обработкой нельзя.
  kind: open
  reference: Нет. Если последовательности отсчётов совпадают, они содержат одинаковую информацию, поэтому никакая последующая обработка не сможет различить исходные сигналы. Для выбора нужны дополнительные сведения или ограничения на спектр.
  id: 033-aliasing-1
  fingerprint: ebbf5b0a
- concept: антиалиасинговая фильтрация должна выполняться до дискретизации
  question: Расположи этапы обработки аналогового сигнала так, чтобы предотвратить алиасинг и затем получить его спектр.
  explanation: 'Фильтр ставят перед аналого-цифровым преобразованием: он удаляет опасные высокочастотные компоненты до того, как они превратятся в ложные низкие частоты. Фильтрация после оцифровки уже не позволяет отличить настоящий низкий тон от его алиаса.'
  kind: order
  items:
    - Ослабить аналоговым низкочастотным фильтром компоненты выше частоты Найквиста
    - Преобразовать отфильтрованный сигнал в дискретные отсчёты
    - Вычислить спектр полученных отсчётов
  id: 033-aliasing-2
  fingerprint: f7dcf61d
