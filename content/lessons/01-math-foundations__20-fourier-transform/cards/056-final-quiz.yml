- concept: небольшие расхождения между FFT и прямым DFT возникают из-за округления при различном порядке операций
  question: Почему корректные реализации FFT и прямого DFT могут вернуть не побитово одинаковые, а лишь очень близкие комплексные коэффициенты?
  explanation: FFT переорганизует вычисление тех же сумм DFT. Поскольку арифметика с плавающей точкой не является точно ассоциативной, допустимы малые численные расхождения.
  kind: open
  reference: Обе реализации вычисляют одно преобразование, но складывают и умножают числа с плавающей точкой в разном порядке. Округления накапливаются немного по-разному, поэтому результаты сравнивают с численным допуском.
  id: 056-final-quiz-2
  fingerprint: 56d35819
- concept: линейная свёртка вычисляется как сумма произведений перекрывающихся отсчётов для каждого сдвига без циклического заворачивания
  question: Расположи действия прямого вычисления линейной свёртки для одного за другим выходных сдвигов.
  explanation: Каждый элемент линейной свёртки является суммой попарных произведений при соответствующем взаимном сдвиге последовательностей. Индексы за границами считаются нулевыми, а не заворачиваются.
  kind: order
  items:
    - Зафиксировать очередной выходной сдвиг и обнулить сумму
    - Найти пары отсчётов двух последовательностей, перекрывающиеся при этом сдвиге
    - Перемножить отсчёты в каждой перекрывающейся паре
    - Сложить произведения, записать результат и перейти к следующему сдвигу
  id: 056-final-quiz-3
