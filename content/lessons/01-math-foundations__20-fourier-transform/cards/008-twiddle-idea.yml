- concept: единичный модуль комплексной экспоненты DFT означает чистое вращение без изменения величины
  question: Почему базисный комплексный множитель DFT меняет направление вклада отсчёта, но сам по себе не меняет его величину?
  explanation: Поворачивающий множитель лежит на единичной окружности. Поэтому он задаёт фазу вклада отсчёта, не усиливая и не ослабляя этот вклад.
  kind: open
  reference: Модуль комплексной экспоненты равен единице. Умножение на неё изменяет фазу, то есть поворачивает комплексное число, но сохраняет его модуль.
