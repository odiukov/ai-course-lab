<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как поворачивающий множитель обходит единичную окружность</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #647089;
      --axis: #73809a;
      --circle: #aeb8ca;
      --rotation: #2868d7;
      --point: #f08a24;
      --start: #16845b;
      --outline: #d5dce8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--background);
      border: 1px solid var(--outline);
    }

    h1 {
      margin: 0;
      padding: 14px 18px 8px;
      font-size: 20px;
      line-height: 1.25;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--background);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      stroke: var(--circle);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .unit-circle {
      fill: none;
      stroke: var(--circle);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .rotation {
      fill: none;
      stroke: var(--rotation);
      stroke-width: 2.5px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrowhead {
      fill: var(--rotation);
      stroke: var(--rotation);
      stroke-width: 1px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .point {
      fill: var(--point);
      stroke: var(--background);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .start-point {
      fill: var(--start);
    }

    .point-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 13px;
      dominant-baseline: middle;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--outline);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .panel-title {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
      dominant-baseline: middle;
    }

    .panel-text {
      fill: var(--text);
      font-size: 15px;
      dominant-baseline: middle;
    }

    .panel-note {
      fill: var(--muted);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .direction-key {
      stroke: var(--rotation);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      margin: 0;
      padding: 24px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111722;
        --panel: #192231;
        --text: #edf2fb;
        --muted: #aebbd0;
        --axis: #8795ad;
        --circle: #64728a;
        --rotation: #73a7ff;
        --point: #ffad55;
        --start: #55d19b;
        --outline: #334158;
      }
    }
  </style>
</head>
<body>
  <main class="diagram">
    <h1 id="diagram-title">Как поворачивающий множитель обходит единичную окружность</h1>

    <svg
      id="plot"
      viewBox="0 0 820 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Восемь значений twiddle при N равно 8 и k равно 1 расположены на
        единичной окружности. Стрелки показывают переходы по часовой стрелке
        от n равно 0 до n равно 7.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать восемь комплексных точек
      twiddle(1, n, 8) для n от 0 до 7 на единичной окружности и стрелки
      обхода по часовой стрелке.
    </p>
  </main>

  <script>
    const diagramData = [
      {
        zero: 0,
        one: 1,
        two: 2,
        eight: 8,
        fullTurn: 6.283185307179586,
        axisMin: -1.48,
        axisMax: 1.48,
        tickInner: 0.94,
        tickOuter: 1.06,
        controlRadius: 1.12,
        arrowGap: 0.12,
        headLength: 0.105,
        headHalfWidth: 0.052,
        pointRadius: 0.047,
        panelLeft: 1.78,
        panelRight: 3.75,
        panelTop: 1.42,
        panelBottom: -1.42,
        panelTextX: 1.96,
        panelTitleY: 1.19,
        keyStartX: 1.96,
        keyEndX: 2.30,
        keyY: 0.88,
        keyHeadLength: 0.10,
        keyHeadHalfWidth: 0.05,
        axisXLabelX: 1.31,
        axisXLabelY: -0.15,
        axisYLabelX: 0.08,
        axisYLabelY: 1.38,
        labelPad: 9,
        lowerLabelPad: 15,
        topLabelPad: -10,
        panelLines: [
          { x: 2.42, y: 0.88, text: "по часовой стрелке", kind: "text" },
          { x: 1.96, y: 0.53, text: "n = 0 → 1 → 2 → … → 7", kind: "text" },
          { x: 1.96, y: 0.18, text: "Один отсчёт — одно деление", kind: "text" },
          { x: 1.96, y: -0.17, text: "Восемь точек — один оборот", kind: "text" },
          { x: 1.96, y: -0.58, text: "Минус в показателе", kind: "note" },
          { x: 1.96, y: -0.84, text: "задаёт направление", kind: "note" },
          { x: 1.96, y: -1.18, text: "n считает дискретные шаги", kind: "note" }
        ]
      },
      [
        {
          n: 0,
          x: 1,
          y: 0,
          lx: 1.16,
          ly: 0.03,
          dx: 9,
          dy: 0,
          anchor: "start",
          label: "n = 0 · старт: 1"
        },
        {
          n: 1,
          x: 0.7071067811865476,
          y: -0.7071067811865476,
          lx: 0.88,
          ly: -0.88,
          dx: 9,
          dy: 15,
          anchor: "start",
          label: "n = 1"
        },
        {
          n: 2,
          x: 0,
          y: -1,
          lx: 0,
          ly: -1.19,
          dx: 0,
          dy: 15,
          anchor: "middle",
          label: "n = 2"
        },
        {
          n: 3,
          x: -0.7071067811865476,
          y: -0.7071067811865476,
          lx: -0.88,
          ly: -0.88,
          dx: -9,
          dy: 15,
          anchor: "end",
          label: "n = 3"
        },
        {
          n: 4,
          x: -1,
          y: 0,
          lx: -1.16,
          ly: 0.03,
          dx: -9,
          dy: 0,
          anchor: "end",
          label: "n = 4"
        },
        {
          n: 5,
          x: -0.7071067811865476,
          y: 0.7071067811865476,
          lx: -0.88,
          ly: 0.88,
          dx: -9,
          dy: -10,
          anchor: "end",
          label: "n = 5"
        },
        {
          n: 6,
          x: 0,
          y: 1,
          lx: 0,
          ly: 1.19,
          dx: 0,
          dy: -10,
          anchor: "middle",
          label: "n = 6"
        },
        {
          n: 7,
          x: 0.7071067811865476,
          y: 0.7071067811865476,
          lx: 0.88,
          ly: 0.88,
          dx: 9,
          dy: -10,
          anchor: "start",
          label: "n = 7"
        }
      ]
    ];

    const origin = Object.freeze({ x: 280, y: 215 });
    const scale = 140;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    const svg = document.getElementById("plot");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    try {
      const [config, points] = diagramData;
      const {
        zero,
        one,
        two,
        eight,
        fullTurn,
        axisMin,
        axisMax,
        tickInner,
        tickOuter,
        controlRadius,
        arrowGap,
        headLength,
        headHalfWidth,
        pointRadius,
        panelLeft,
        panelRight,
        panelTop,
        panelBottom,
        panelTextX,
        panelTitleY,
        keyStartX,
        keyEndX,
        keyY,
        keyHeadLength,
        keyHeadHalfWidth,
        axisXLabelX,
        axisXLabelY,
        axisYLabelX,
        axisYLabelY,
        panelLines
      } = config;

      const make = (name, attributes, text) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, value);
        });
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      };

      const addLine = (x1, y1, x2, y2, className) => {
        svg.appendChild(
          make("line", {
            x1: sx(x1),
            y1: sy(y1),
            x2: sx(x2),
            y2: sy(y2),
            class: className
          })
        );
      };

      const addText = (x, y, text, className, anchor, dx, dy) => {
        svg.appendChild(
          make(
            "text",
            {
              x: sx(x),
              y: sy(y),
              dx,
              dy,
              class: className,
              "text-anchor": anchor
            },
            text
          )
        );
      };

      const addArrowHead = (tipX, tipY, dirX, dirY, length, halfWidth) => {
        const magnitude = Math.hypot(dirX, dirY);
        const ux = dirX / magnitude;
        const uy = dirY / magnitude;
        const baseX = tipX - ux * length;
        const baseY = tipY - uy * length;
        const leftX = baseX - uy * halfWidth;
        const leftY = baseY + ux * halfWidth;
        const rightX = baseX + uy * halfWidth;
        const rightY = baseY - ux * halfWidth;

        svg.appendChild(
          make("polygon", {
            points: [
              `${sx(tipX)},${sy(tipY)}`,
              `${sx(leftX)},${sy(leftY)}`,
              `${sx(rightX)},${sy(rightY)}`
            ].join(" "),
            class: "arrowhead"
          })
        );
      };

      svg.appendChild(
        make("rect", {
          x: sx(panelLeft),
          y: sy(panelTop),
          width: sx(panelRight) - sx(panelLeft),
          height: sy(panelBottom) - sy(panelTop),
          class: "panel"
        })
      );

      addLine(axisMin, zero, axisMax, zero, "axis");
      addLine(zero, axisMin, zero, axisMax, "axis");

      svg.appendChild(
        make("circle", {
          cx: sx(zero),
          cy: sy(zero),
          r: Math.abs(sx(one) - sx(zero)),
          class: "unit-circle"
        })
      );

      points.forEach(point => {
        const angle = Math.atan2(point.y, point.x);
        addLine(
          Math.cos(angle) * tickInner,
          Math.sin(angle) * tickInner,
          Math.cos(angle) * tickOuter,
          Math.sin(angle) * tickOuter,
          "tick"
        );
      });

      points.forEach((point, index) => {
        const startAngle =
          -(fullTurn * point.n) / eight - arrowGap;
        const endAngle =
          -(fullTurn * (point.n + one)) / eight + arrowGap;
        const middleAngle = (startAngle + endAngle) / two;

        const startX = Math.cos(startAngle);
        const startY = Math.sin(startAngle);
        const endX = Math.cos(endAngle);
        const endY = Math.sin(endAngle);
        const controlX = Math.cos(middleAngle) * controlRadius;
        const controlY = Math.sin(middleAngle) * controlRadius;

        svg.appendChild(
          make("path", {
            d:
              `M ${sx(startX)} ${sy(startY)} ` +
              `Q ${sx(controlX)} ${sy(controlY)} ${sx(endX)} ${sy(endY)}`,
            class: "rotation"
          })
        );

        addArrowHead(
          endX,
          endY,
          endX - controlX,
          endY - controlY,
          headLength,
          headHalfWidth
        );
      });

      points.forEach(point => {
        svg.appendChild(
          make("circle", {
            cx: sx(point.x),
            cy: sy(point.y),
            r: Math.abs(sx(pointRadius) - sx(zero)),
            class: point.n === zero ? "point start-point" : "point"
          })
        );

        addText(
          point.lx,
          point.ly,
          point.label,
          "point-label",
          point.anchor,
          point.dx,
          point.dy
        );
      });

      addText(
        axisXLabelX,
        axisXLabelY,
        "действительная ось",
        "axis-label",
        "end",
        zero,
        zero
      );

      addText(
        axisYLabelX,
        axisYLabelY,
        "мнимая ось",
        "axis-label",
        "start",
        zero,
        zero
      );

      addText(
        panelTextX,
        panelTitleY,
        "twiddle(1, n, 8)",
        "panel-title",
        "start",
        zero,
        zero
      );

      addLine(keyStartX, keyY, keyEndX, keyY, "direction-key");
      addArrowHead(
        keyEndX,
        keyY,
        keyEndX - keyStartX,
        zero,
        keyHeadLength,
        keyHeadHalfWidth
      );

      panelLines.forEach(line => {
        addText(
          line.x,
          line.y,
          line.text,
          line.kind === "note" ? "panel-note" : "panel-text",
          "start",
          zero,
          zero
        );
      });

      if (points.length !== eight) {
        throw new Error("Не удалось построить восемь точек");
      }
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
