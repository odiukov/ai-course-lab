- concept: преобразование карты признаков CNN в последовательность для рекуррентного слоя
  question: Как в CRNN преобразовать карту признаков формы (N, C, H′, W′) в последовательность, где временные шаги соответствуют горизонтальным позициям строки?
  explanation: Усреднение по H′ сворачивает вертикальную размерность, а перестановка осей делает W′ длиной последовательности. Вектор из C признаков на каждой горизонтальной позиции поступает в BiLSTM.
  kind: choice
  options:
    - Усреднить признаки по ширине и получить последовательность вдоль высоты
    - Усреднить признаки по высоте и переставить оси в форму (N, W′, C)
    - Объединить высоту и ширину в один вектор для всего изображения
    - Выбрать только центральную строку карты признаков
  correct: 1
  id: 019-crnn-marshrut-1
  fingerprint: 0d3e032e
- concept: BiLSTM использует левый и правый контекст при распознавании символа
  question: Объясни своими словами, почему BiLSTM может увереннее распознать неоднозначный фрагмент строки, чем однонаправленная LSTM.
  explanation: CNN извлекает локальные визуальные признаки, а два направления BiLSTM добавляют контекст слева и справа. Их выходы объединяются перед классификацией символов.
  kind: open
  reference: BiLSTM обрабатывает последовательность признаков в обоих направлениях. Поэтому представление каждой позиции учитывает как предшествующие, так и последующие участки строки, а неоднозначный локальный признак можно интерпретировать с учётом контекста с обеих сторон.
  id: 019-crnn-marshrut-2
  fingerprint: 85581c79
