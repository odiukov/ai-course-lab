- concept: вероятность безошибочного результата многоступенчатого конвейера равна произведению вероятностей успеха его этапов
  question: OCR-конвейер состоит из трёх модулей. Каждый независимо выдаёт правильный результат с вероятностью 92%. Какова вероятность в процентах, что весь документ пройдёт конвейер без ошибки? Округли до сотых.
  explanation: 'Для успеха должны правильно сработать все модули: 0.92 × 0.92 × 0.92 = 0.778688, то есть примерно 77.87%. End-to-end подход устраняет передачу результата между отдельными модулями и тем самым избегает такого перемножения их ошибок.'
  kind: numeric
  answer: 77.87
  tolerance: 0.05
