- concept: классификация целых слов как отдельных классов не позволяет составлять невиданные строки из символов
  question: Объясните, почему представление каждого целого слова отдельным классом плохо подходит для распознавания фамилий, адресов и идентификаторов.
  explanation: Классы целых слов образуют закрытый словарь и не дают композиционной генерализации. Посимвольная модель может собирать новые строки из известных символов, а классификатор слов — только выбирать уже предусмотренный класс.
  kind: open
  reference: Число возможных строк слишком велико, а словарь классов остаётся фиксированным. Модель сможет выбирать только среди заранее заведённых строк и не распознает новое слово или идентификатор, хотя все его символы могут быть знакомы.
