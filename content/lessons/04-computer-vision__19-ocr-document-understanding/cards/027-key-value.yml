- concept: извлечение ключей и значений учитывает текстовые, пространственные и визуальные признаки вместо одной лишь близости
  question: Почему в плотной форме нельзя надёжно связывать каждый ключ с ближайшим текстовым фрагментом и какие признаки должна учитывать модель извлечения полей?
  explanation: Геометрическая близость сама по себе неоднозначна. Сочетание содержания, положения и визуального оформления помогает определить, какое значение семантически связано с конкретным ключом.
  kind: open
  reference: Ближайший фрагмент может относиться к другому полю, поскольку значения располагаются справа, снизу или в отдельных ячейках. Модель должна совместно учитывать распознанный текст, координаты фрагментов и визуальную структуру документа.
  id: 027-key-value-1
  fingerprint: c4f897d7
- concept: выбор модели извлечения ключей и значений зависит от визуальной сложности документа
  question: Нужно получать структурированные поля из визуально насыщенных документов со сложным оформлением. Какая модель наиболее уместна для этой задачи?
  explanation: Donut подходит для визуально сложных документов и может непосредственно генерировать структурированный результат. LayoutLMv3 чаще применяют для более простых сканов, а TrOCR и CTC решают задачу распознавания текста, но не извлечения пар ключ–значение.
  kind: choice
  options:
    - TrOCR
    - Donut
    - CTC-декодер
    - DocLayNet
  correct: 1
