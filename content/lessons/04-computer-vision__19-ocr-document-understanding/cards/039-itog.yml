- concept: качество OCR на новых данных оценивают по отложенной выборке
  question: TinyCRNN почти безошибочно распознаёт строки, на которых обучалась. Как проверить, научилась ли модель распознавать новые строки, а не запомнила обучающие примеры?
  explanation: Метрика на обучающих примерах может скрывать переобучение. В упражнении CER предлагается считать на отложенных строках, которые модель не видела при обновлении весов.
  kind: choice
  options:
    - Посчитать CER на отдельно сгенерированной отложенной выборке
    - Повторно посчитать loss на обучающей выборке
    - Увеличить число шагов обучения и не проводить оценку
    - Сравнить размеры файлов с весами модели
  correct: 0
  id: 039-itog-1
  fingerprint: 4d679b36
- concept: честное сравнение OCR-декодеров требует контролируемого эксперимента
  question: Как организовать эксперимент, чтобы изменение CER можно было приписать замене жадного CTC-декодирования на beam search?
  explanation: Если одновременно переобучить модель, заменить данные или изменить нормализацию, станет непонятно, что именно повлияло на CER. В таком сравнении независимой переменной должен оставаться только декодер.
  kind: open
  reference: Нужно зафиксировать одну и ту же обученную модель, входные изображения, выходные вероятности, словарь, нормализацию и эталонные подписи. Затем декодировать одинаковые выходы обоими методами и сравнить CER на одной выборке.
  id: 039-itog-2
  fingerprint: f289c5b8
