- concept: общая ширина OCR-батча определяется самой длинной строкой
  question: Дополните выражение для общей ширины батча, в котором более короткие изображения дополняются фоном.
  explanation: Все изображения в одном тензоре должны иметь одинаковую форму. Поэтому ширину задаёт самая длинная строка, а неиспользованная область более коротких примеров остаётся заполненной фоном.
  kind: cloze
  template: W = char_width * ___
  answer: max(len(s) for s in strings)
  accept:
    - max(map(len, strings))
