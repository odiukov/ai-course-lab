- concept: плоский массив целей разделяется на подписи отдельных изображений с помощью массива длин
  question: Зачем при объединении символьных индексов всех OCR-подписей в один плоский массив отдельно сохранять длину каждой подписи?
  explanation: После конкатенации по самому массиву индексов нельзя определить, где заканчивается одна подпись и начинается следующая. Массив длин восстанавливает эти границы и сообщает функции потерь фактическую длину цели для каждого изображения.
  kind: open
  reference: Длины задают границы подписей отдельных изображений в общем массиве и позволяют передавать последовательности переменной длины без добавления фиктивных целевых символов.
