- concept: продакшен-цель CER ниже 2% относится к чистым сканам
  question: OCR-система показала CER 1,7% на чистых сканах. Как интерпретировать этот результат относительно указанной продакшен-цели?
  explanation: Для чистых сканов указана продакшен-цель CER < 2%, поэтому 1,7% проходит порог. При этом сумму, дату и другие критичные поля нужно оценивать отдельно.
  kind: open
  reference: 'Результат соответствует цели: 1,7% ниже порога 2%. Вывод относится именно к чистым сканам и сам по себе не гарантирует правильность важных структурированных полей.'
