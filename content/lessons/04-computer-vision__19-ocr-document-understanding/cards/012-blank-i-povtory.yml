- concept: схлопывание соседних повторов позволяет одному символу занимать несколько временных шагов
  question: Почему в CTC несколько одинаковых эмиссий символа на соседних временных шагах считаются одним символом?
  explanation: CTC не требует, чтобы каждой букве соответствовал ровно один временной шаг. Поэтому последовательность вроде `h h h` после схлопывания обозначает одну `h`, уверенно распознанную на нескольких соседних шагах.
  kind: open
  reference: Один символ изображения может занимать несколько позиций карты признаков. Схлопывание соседних повторов позволяет модели удерживать этот символ во времени, не создавая лишних букв в итоговой строке.
  id: 012-blank-i-povtory-1
  fingerprint: 1c65a704
- concept: CTC blank обозначает отсутствие символа, а не пробел в распознанном тексте
  question: CTC-модель выдала последовательность `a blank b`. Какой текст получится после декодирования?
  explanation: Blank — служебный класс «на этом временном шаге символа нет». При декодировании он удаляется и не превращается в пробел, поэтому результат — `ab`.
  kind: choice
  options:
    - '`a b` с пробелом между буквами'
    - '`ab`'
    - '`ablankb`'
    - '`a`'
  correct: 1
  id: 012-blank-i-povtory-2
  fingerprint: 28429d75
