- concept: последовательность этапов классического OCR-конвейера
  question: Расположите этапы классического OCR в правильном порядке — от исходного изображения до текста в порядке чтения.
  explanation: Детектор сначала создаёт рамки текстовых областей, затем эти области вырезаются. Модель распознавания превращает каждый фрагмент в строку, а layout-этап упорядочивает полученные строки.
  kind: order
  items:
    - Обнаружить области со словами или строками
    - Вырезать найденные области изображения
    - Распознать символы в каждом фрагменте
    - Восстановить порядок чтения распознанных строк
  id: 004-klassicheskiy-konveyer-1
  fingerprint: 8a603451
- concept: пропущенная детектором текстовая область не может быть восстановлена последующими этапами OCR
  question: Детектор не создал bounding box для заголовка, но распознаватель безошибочно обработал все переданные ему фрагменты. Что произойдёт с заголовком в итоговом тексте?
  explanation: Распознавание работает только с областями, найденными и вырезанными детектором. Если область пропущена, последующие этапы не получают её пиксели и не могут вернуть потерянный текст.
  kind: choice
  options:
    - Распознаватель восстановит заголовок по соседним фрагментам
    - Заголовок будет отсутствовать, потому что его изображение не дошло до распознавателя
    - Layout-этап заново найдёт заголовок на исходном изображении
    - Заголовок появится после изменения порядка чтения
  correct: 1
  id: 004-klassicheskiy-konveyer-2
  fingerprint: 08921af0
