- concept: небольшой разброс вертикальных координат требует группировки слов в строки с допуском
  question: Почему слова одной печатной строки нельзя надёжно группировать только по точному равенству координат их верхних границ? Объясни, как поступить устойчивее.
  explanation: Точное сравнение координат превращает небольшой шум детектора в ложное разделение строк. Вертикальный допуск или проверка перекрытия рамок делает группировку устойчивой.
  kind: open
  reference: Рамки слов одной строки могут немного различаться по высоте из-за формы символов и погрешности детектора. Нужно считать близкие или достаточно перекрывающиеся по вертикали рамки одной строкой, а затем упорядочивать слова в ней по горизонтальной координате.
  id: 007-poryadok-chteniya-2
  fingerprint: b8cf59f0
- concept: горизонтальный порядок рамок зависит от направления письменности
  question: Два фрагмента арабской строки уже отнесены к одной строке. Какое правило обычно применяют для их горизонтального упорядочивания?
  explanation: Порядок чтения определяется системой письма. Для арабского текста фрагменты одной строки обычно упорядочивают справа налево, а для латиницы — слева направо.
  kind: choice
  options:
    - От рамки с меньшей шириной к рамке с большей шириной
    - Справа налево
    - Слева направо
    - По алфавиту распознанных слов
  correct: 1
