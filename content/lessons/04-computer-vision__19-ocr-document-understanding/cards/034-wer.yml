- concept: WER не имеет верхней границы и может превышать 100% из-за вставок
  question: Может ли Word Error Rate оказаться больше 100%?
  explanation: WER делит число удалений, замен и вставок на количество слов в эталоне. Число вставок не ограничено длиной эталона, поэтому итоговый WER может превышать 100%.
  kind: choice
  options:
    - Нет, любая доля ошибок ограничена 100%
    - Да, если предсказание содержит достаточно много лишних слов
    - Да, но только если эталон и предсказание полностью совпадают
  correct: 1
  id: 034-wer-1
  fingerprint: f46f574f
- concept: WER зависит от правил токенизации и предварительной нормализации текста
  question: Почему при сравнении WER двух OCR-систем необходимо использовать одинаковые правила обработки регистра, пунктуации и пробелов?
  explanation: WER сравнивает уже подготовленные последовательности слов. Если одну строку привести к нижнему регистру или очистить от пунктуации, а другую нет, метрика учтёт различия предобработки как ошибки распознавания.
  kind: open
  reference: Эти правила определяют, какие последовательности считаются словами и равными ли считаются их написания. Разная нормализация может изменить число вставок, удалений и замен даже при одинаковом распознанном содержании, поэтому результаты WER станут несопоставимыми.
  id: 034-wer-2
  fingerprint: 0d60be78
