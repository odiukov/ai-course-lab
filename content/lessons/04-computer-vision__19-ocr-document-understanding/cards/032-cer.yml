- concept: низкий общий CER не гарантирует правильность семантически важных полей документа
  question: Почему при оценке извлечения итоговой суммы из счёта недостаточно измерять только CER всего распознанного текста?
  explanation: CER показывает среднюю точность текста, но не учитывает важность конкретных фрагментов. Ошибка в несущественном слове и ошибка в сумме получают одинаковый вес, поэтому для полей вроде invoice_total нужен отдельный F1.
  kind: open
  reference: Общий CER одинаково учитывает ошибки во всех символах и может выглядеть низким, даже если ошибка попала в итоговую сумму. Поэтому качество критичных структурированных полей дополнительно оценивают отдельно, например с помощью F1 по парам ключ–значение.
  id: 032-cer-2
  fingerprint: 3076b354
