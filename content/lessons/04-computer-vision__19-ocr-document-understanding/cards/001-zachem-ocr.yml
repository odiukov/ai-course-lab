- concept: переход от изображения документа к структурированным полям проходит через OCR, анализ разметки и понимание документа
  question: Расположи этапы обработки документа в порядке от исходного изображения до готового структурированного поля.
  explanation: Сначала OCR превращает пиксели в текст. Затем анализ разметки восстанавливает области и отношения между фрагментами. Только после этого понимание документа позволяет получить структурированное поле вроде `invoice_total`.
  kind: order
  items:
    - Распознать символы и получить текстовые фрагменты
    - Сгруппировать фрагменты по областям и восстановить структуру документа
    - Определить семантические роли элементов и извлечь нужное поле
