- concept: продакшен-OCR выбирают по совместному сравнению качества, задержки и стоимости на собственных документах
  question: 'Две OCR-системы тестируют перед внедрением: первая немного точнее, но не укладывается в бюджет и допустимое время ответа; вторая достигает требуемого качества и соблюдает оба ограничения. Какое решение инженерно обоснованно?'
  explanation: 'Модель следует сравнивать на контрольной выборке своих документов: качество чтения измеряют CER, качество извлечения полей — F1, а рядом учитывают задержку и стоимость. Максимальная точность сама по себе не делает систему подходящей для продакшена.'
  kind: choice
  options:
    - Выбрать вторую систему как удовлетворяющую всем производственным ограничениям
    - Всегда выбрать первую систему из-за максимальной точности
    - Выбрать систему с большим числом параметров
    - Оценивать только скорость, не измеряя качество
