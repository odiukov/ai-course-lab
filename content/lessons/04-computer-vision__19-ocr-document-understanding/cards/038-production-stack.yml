- concept: VLM-OCR предпочтителен для разнородных документов и задач, требующих семантического рассуждения
  question: Объясни, почему для небольшой коллекции документов множества разных форматов с неоднозначными полями часто выбирают VLM-OCR, а не отдельную дообученную модель для каждого формата.
  explanation: 'Сильная сторона VLM — гибкость: одна модель работает с разными макетами и семантическими запросами. Обратная сторона — более высокая стоимость и задержка каждого вызова.'
  kind: open
  reference: VLM способна без отдельного обучения под каждый шаблон обрабатывать разнородные документы, связывать элементы по смыслу и рассуждать о неоднозначностях. При малом количестве документов каждого формата стоимость запросов обычно ниже совокупных затрат на разметку, обучение и поддержку множества специализированных моделей.
