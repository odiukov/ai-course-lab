<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полный маршрут классического OCR</title>
<style>
  :root{
    color-scheme:light dark;
    --page:#f8fafc;
    --panel:#ffffff;
    --panel-soft:#f1f5f9;
    --ink:#172033;
    --muted:#526075;
    --line:#94a3b8;
    --blue:#2563eb;
    --blue-soft:#dbeafe;
    --amber:#b45309;
    --amber-soft:#fef3c7;
    --green:#15803d;
    --green-soft:#dcfce7;
    --violet:#7c3aed;
    --violet-soft:#ede9fe;
    --red:#be123c;
    --red-soft:#ffe4e6;
    --shadow:#cbd5e1;
  }
  body{
    background:var(--page);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:12px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    text-align:center;
  }
  .subtitle{
    color:var(--muted);
    font-size:14px;
    text-align:center;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:430px;
    background:var(--page);
  }
  .card{fill:var(--panel);stroke:var(--shadow);stroke-width:2}
  .header-neutral{fill:var(--panel-soft)}
  .header-blue{fill:var(--blue-soft)}
  .header-amber{fill:var(--amber-soft)}
  .header-violet{fill:var(--violet-soft)}
  .header-green{fill:var(--green-soft)}
  .stage-title{fill:var(--ink);font-size:14px;font-weight:700}
  .stage-note{fill:var(--muted);font-size:12px}
  .sample-line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
  .sample-thin{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
  .box-blue{fill:none;stroke:var(--blue);stroke-width:2}
  .box-amber{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2}
  .box-violet{fill:var(--violet-soft);stroke:var(--violet);stroke-width:2}
  .box-green{fill:var(--green-soft);stroke:var(--green);stroke-width:2}
  .arrow{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
  .arrow-head{fill:var(--line)}
  .flow-label{fill:var(--muted);font-size:13px;font-weight:600}
  .tiny{fill:var(--muted);font-size:11px}
  .recognized{fill:var(--ink);font-size:13px;font-weight:650}
  .order-line{fill:none;stroke:var(--violet);stroke-width:2}
  .order-head{fill:var(--violet)}
  .dependency{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round}
  .dependency-head{fill:var(--blue)}
  .callout{fill:var(--panel);stroke-width:2}
  .callout-red{stroke:var(--red)}
  .callout-amber{stroke:var(--amber)}
  .callout-violet{stroke:var(--violet)}
  .callout-title{fill:var(--ink);font-size:13px;font-weight:700}
  .callout-text{fill:var(--muted);font-size:12px}
  #fallback{
    background:var(--panel);
    color:var(--ink);
    font-size:15px;
    padding:12px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --page:#0f172a;
      --panel:#172033;
      --panel-soft:#202b40;
      --ink:#f1f5f9;
      --muted:#b6c1d1;
      --line:#718096;
      --blue:#60a5fa;
      --blue-soft:#17345d;
      --amber:#fbbf24;
      --amber-soft:#4a3510;
      --green:#4ade80;
      --green-soft:#123c2a;
      --violet:#c4b5fd;
      --violet-soft:#35265a;
      --red:#fb7185;
      --red-soft:#4c1d2b;
      --shadow:#3b465b;
    }
  }
</style>
</head>
<body>
<h1>Полный маршрут классического OCR</h1>
<p class="subtitle">Изображение проходит цепочку зависимых решений — от поиска областей до текста в порядке чтения</p>

<svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Полный маршрут классического OCR</title>
  <desc id="svgDesc">Изображение меню проходит поиск текста, создание рамок, вырезание областей, распознавание, получение строк и восстановление порядка чтения.</desc>
</svg>
<div id="fallback" hidden>Схема должна была показать путь изображения через поиск текстовых областей, рамки и вырезание, распознавание строк и восстановление порядка чтения.</div>

<script>
const DATA=[
  {
    cardY:42,cardW:128,cardH:228,headerH:48,round:10,
    stages:[
      {x:18,title:["Изображение"],note:["фото меню"],kind:"image",tone:"neutral"},
      {x:164,title:["Поиск","текста"],note:["найдены области"],kind:"detect",tone:"blue"},
      {x:310,title:["Рамки","областей"],note:["координаты"],kind:"boxes",tone:"blue"},
      {x:456,title:["Вырезание"],note:["каждая область"],kind:"crop",tone:"blue"},
      {x:602,title:["Распозна-","вание"],note:["пиксели → знаки"],kind:"recognize",tone:"amber"},
      {x:748,title:["Строки","текста"],note:["отдельные строки"],kind:"strings",tone:"amber"},
      {x:894,title:["Порядок","макета"],note:["колонки и строки"],kind:"layout",tone:"violet"},
      {x:1040,title:["Текст по","чтению"],note:["готовый результат"],kind:"output",tone:"green"}
    ],
    arrows:[
      {a:[146,156],b:[160,156],head:[[160,156],[153,151],[153,161]]},
      {a:[292,156],b:[306,156],head:[[306,156],[299,151],[299,161]]},
      {a:[438,156],b:[452,156],head:[[452,156],[445,151],[445,161]]},
      {a:[584,156],b:[598,156],head:[[598,156],[591,151],[591,161]]},
      {a:[730,156],b:[744,156],head:[[744,156],[737,151],[737,161]]},
      {a:[876,156],b:[890,156],head:[[890,156],[883,151],[883,161]]},
      {a:[1022,156],b:[1036,156],head:[[1036,156],[1029,151],[1029,161]]}
    ],
    dependency:{
      a:[82,298],b:[1104,298],head:[[1104,298],[1095,292],[1095,304]],
      label:[593,290]
    },
    callouts:[
      {x:18,w:370,tone:"red",title:"Область не нашли",text:["Распознавать нечего —","строка исчезает."]},
      {x:415,w:370,tone:"amber",title:"Рамка обрезала слово",text:["Распознавание видит лишь","сохранённую часть."]},
      {x:812,w:370,tone:"violet",title:"Строки верны, порядок нет",text:["Колонки смешались на этапе","восстановления макета."]}
    ],
    calloutY:326,calloutH:86
  }
];
const origin=Object.freeze({x:0,y:0});
const scale=Object.freeze({x:1,y:1});
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  const NS="http://www.w3.org/2000/svg";
  const [model]=DATA;

  const node=(name,attrs={},className="")=>{
    const n=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs)) n.setAttribute(key,value);
    if(className) n.setAttribute("class",className);
    return n;
  };

  const rect=(parent,x,y,w,h,className,rx=model.round)=>{
    parent.appendChild(node("rect",{
      x:sx(x),y:sy(y),width:sx(w)-sx(0),height:sy(h)-sy(0),
      rx:sx(rx)-sx(0),ry:sy(rx)-sy(0)
    },className));
  };

  const line=(parent,a,b,className)=>{
    parent.appendChild(node("line",{
      x1:sx(a[0]),y1:sy(a[1]),x2:sx(b[0]),y2:sy(b[1])
    },className));
  };

  const polygon=(parent,points,className)=>{
    parent.appendChild(node("polygon",{
      points:points.map(p=>`${sx(p[0])},${sy(p[1])}`).join(" ")
    },className));
  };

  const text=(parent,x,y,content,className,anchor="middle")=>{
    const t=node("text",{x:sx(x),y:sy(y),"text-anchor":anchor},className);
    t.textContent=content;
    parent.appendChild(t);
  };

  const multiline=(parent,x,ys,lines,className,anchor="middle")=>{
    lines.forEach((content,position)=>text(parent,x,ys[position],content,className,anchor));
  };

  const menuLines=(g,x)=>{
    line(g,[x+18,132],[x+56,132],"sample-line");
    line(g,[x+72,132],[x+105,132],"sample-thin");
    line(g,[x+18,150],[x+62,150],"sample-line");
    line(g,[x+79,150],[x+105,150],"sample-thin");
    line(g,[x+18,168],[x+53,168],"sample-line");
    line(g,[x+74,168],[x+105,168],"sample-thin");
    line(g,[x+18,186],[x+64,186],"sample-line");
    line(g,[x+81,186],[x+105,186],"sample-thin");
  };

  const visual=(g,stage)=>{
    const x=stage.x;

    if(stage.kind==="image"){
      rect(g,x+12,116,104,90,"header-neutral",5);
      menuLines(g,x);
      line(g,[x+68,124],[x+68,198],"sample-thin");
    }

    if(stage.kind==="detect"){
      rect(g,x+12,116,104,90,"header-neutral",5);
      menuLines(g,x);
      rect(g,x+14,123,50,18,"box-blue",3);
      rect(g,x+14,141,54,18,"box-blue",3);
      rect(g,x+70,123,40,18,"box-blue",3);
      rect(g,x+70,141,40,18,"box-blue",3);
      rect(g,x+14,159,45,18,"box-blue",3);
      rect(g,x+70,159,40,18,"box-blue",3);
      rect(g,x+14,177,56,18,"box-blue",3);
      rect(g,x+76,177,34,18,"box-blue",3);
    }

    if(stage.kind==="boxes"){
      rect(g,x+17,120,94,24,"box-blue",4);
      rect(g,x+17,153,72,24,"box-blue",4);
      rect(g,x+37,186,74,24,"box-blue",4);
      line(g,[x+25,132],[x+89,132],"sample-line");
      line(g,[x+25,165],[x+76,165],"sample-line");
      line(g,[x+45,198],[x+99,198],"sample-line");
    }

    if(stage.kind==="crop"){
      rect(g,x+14,120,100,25,"box-blue",4);
      rect(g,x+14,154,100,25,"box-blue",4);
      rect(g,x+14,188,100,25,"box-blue",4);
      line(g,[x+24,132],[x+94,132],"sample-line");
      line(g,[x+24,166],[x+81,166],"sample-line");
      line(g,[x+24,200],[x+103,200],"sample-line");
    }

    if(stage.kind==="recognize"){
      rect(g,x+14,120,100,30,"box-amber",4);
      line(g,[x+24,135],[x+93,135],"sample-line");
      line(g,[x+64,157],[x+64,177],"arrow");
      polygon(g,[[x+64,182],[x+59,174],[x+69,174]],"arrow-head");
      rect(g,x+20,190,25,28,"box-amber",3);
      rect(g,x+51,190,25,28,"box-amber",3);
      rect(g,x+82,190,25,28,"box-amber",3);
      text(g,x+32,209,"С","recognized");
      text(g,x+63,209,"У","recognized");
      text(g,x+94,209,"П","recognized");
    }

    if(stage.kind==="strings"){
      rect(g,x+12,119,104,96,"header-neutral",5);
      text(g,x+22,140,"«Суп»","recognized","start");
      text(g,x+22,162,"«Салат»","recognized","start");
      text(g,x+22,184,"«Чай»","recognized","start");
      text(g,x+22,206,"«Кофе»","recognized","start");
    }

    if(stage.kind==="layout"){
      rect(g,x+12,116,104,100,"header-neutral",5);
      line(g,[x+24,133],[x+55,133],"sample-line");
      line(g,[x+24,158],[x+55,158],"sample-line");
      line(g,[x+73,133],[x+103,133],"sample-line");
      line(g,[x+73,158],[x+103,158],"sample-line");
      line(g,[x+24,177],[x+24,198],"order-line");
      polygon(g,[[x+24,204],[x+19,196],[x+29,196]],"order-head");
      line(g,[x+55,204],[x+95,204],"order-line");
      polygon(g,[[x+101,204],[x+93,199],[x+93,209]],"order-head");
      line(g,[x+103,177],[x+103,198],"order-line");
      polygon(g,[[x+103,204],[x+98,196],[x+108,196]],"order-head");
    }

    if(stage.kind==="output"){
      rect(g,x+12,116,104,100,"box-green",5);
      text(g,x+23,139,"Суп","recognized","start");
      text(g,x+23,160,"Салат","recognized","start");
      text(g,x+23,181,"Чай","recognized","start");
      text(g,x+23,202,"Кофе","recognized","start");
    }
  };

  model.stages.forEach(stage=>{
    const g=node("g");
    svg.appendChild(g);
    rect(g,stage.x,model.cardY,model.cardW,model.cardH,"card");
    rect(g,stage.x,model.cardY,model.cardW,model.headerH,`header-${stage.tone}`);
    const titleYs=stage.title.length===1?[72]:[63,80];
    multiline(g,stage.x+64,titleYs,stage.title,"stage-title");
    visual(g,stage);
    multiline(g,stage.x+64,[246,261],stage.note,"stage-note");
  });

  model.arrows.forEach(a=>{
    line(svg,a.a,a.b,"arrow");
    polygon(svg,a.head,"arrow-head");
  });

  line(svg,model.dependency.a,model.dependency.b,"dependency");
  polygon(svg,model.dependency.head,"dependency-head");
  text(svg,model.dependency.label[0],model.dependency.label[1],
       "каждый этап получает результат предыдущего","flow-label");

  model.callouts.forEach(callout=>{
    rect(svg,callout.x,model.calloutY,callout.w,model.calloutH,
         `callout callout-${callout.tone}`,8);
    text(svg,callout.x+callout.w/2,350,callout.title,"callout-title");
    multiline(svg,callout.x+callout.w/2,[373,391],callout.text,"callout-text");
  });

  if(!svg.querySelector("g")) throw new Error("Схема не построена");
  fallback.hidden=true;
}catch(error){
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  if(svg) svg.hidden=true;
  if(fallback) fallback.hidden=false;
}
</script>
</body>
</html>
