<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Почему ширина карты признаков становится осью времени</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --panel: #ffffff;
    --card: #f4f6fb;
    --ink: #172033;
    --muted: #60708a;
    --line: #a7b3c7;
    --grid: #94a4bd;
    --blue: #3b72d9;
    --blue-soft: #dbe8ff;
    --cyan: #0c8ca3;
    --cyan-soft: #d9f3f6;
    --violet: #7856c9;
    --violet-soft: #e9e1ff;
    --accent: #d85d38;
    --accent-soft: #ffe5d9;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111723;
      --panel: #171f2d;
      --card: #1d2738;
      --ink: #edf3ff;
      --muted: #a8b7cf;
      --line: #56657d;
      --grid: #64748e;
      --blue: #82acff;
      --blue-soft: #243d67;
      --cyan: #62d4e3;
      --cyan-soft: #173f48;
      --violet: #b79bff;
      --violet-soft: #382d5d;
      --accent: #ff9a78;
      --accent-soft: #573124;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 12px;
    background: var(--panel);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    font-weight: 720;
    letter-spacing: -0.01em;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--panel);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .section-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
  }

  .card {
    fill: var(--card);
    stroke: var(--line);
    stroke-width: 1.5;
  }

  .feature {
    fill: var(--blue-soft);
    stroke: var(--blue);
    stroke-width: 1.5;
  }

  .feature-band-a { fill: var(--cyan); opacity: .30; }
  .feature-band-b { fill: var(--violet); opacity: .24; }
  .feature-band-c { fill: var(--accent); opacity: .22; }

  .dimension {
    font-size: 17px;
    font-weight: 720;
  }

  .pool-label {
    fill: var(--blue);
    font-size: 14px;
    font-weight: 720;
  }

  .arrow-line, .time-line {
    fill: none;
    stroke: var(--blue);
    stroke-width: 2;
    stroke-linecap: round;
  }

  .arrow-head, .time-head { fill: var(--blue); }

  .summary {
    font-size: 15px;
    font-weight: 650;
  }

  .summary-muted {
    fill: var(--muted);
    font-size: 15px;
  }

  .divider {
    stroke: var(--line);
    stroke-width: 1;
  }

  .map-cell {
    stroke: var(--grid);
    stroke-width: .75;
  }

  .map-a { fill: var(--blue-soft); }
  .map-b { fill: var(--cyan-soft); }
  .map-c { fill: var(--violet-soft); }
  .map-hot { fill: var(--accent-soft); }

  .map-outline {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.5;
  }

  .main-label {
    font-size: 16px;
    font-weight: 720;
  }

  .mean-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .vector {
    fill: var(--violet-soft);
    stroke: var(--violet);
    stroke-width: 1.25;
  }

  .vector-edge {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 1.5;
  }

  .vector-mark {
    stroke: var(--violet);
    stroke-width: 1;
    stroke-linecap: round;
  }

  .edge-mark { stroke: var(--accent); }

  .time-label {
    fill: var(--blue);
    font-size: 14px;
    font-weight: 720;
  }

  .edge-label {
    fill: var(--muted);
    font-size: 13px;
  }

  #fallback {
    margin: 12px 0 0;
    padding: 14px;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    font-size: 15px;
  }
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">Почему ширина карты признаков становится осью времени</h1>
  <svg id="diagram"
       viewBox="0 0 1200 470"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">Пулинги превращают изображение 1 на 32 на 80 в карту высотой 2 и шириной 20. Усреднение высоты даёт 20 векторов — последовательность для LSTM.</desc>
  </svg>
  <p id="fallback">Схема должна показать: 1 × 32 × 80 → C × 16 × 40 → C × 8 × 20 → C × 4 × 20 → C × 2 × 20; после усреднения высоты ширина 20 становится 20 временными шагами.</p>
</main>

<script>
const data = Object.freeze([{
  zero: 0, one: 1, two: 2, three: 3,
  originX: 0, originY: 0, scaleX: 1, scaleY: 1,
  head: 10, headHalf: 6,
  cardsY: 56, cardsW: 170, cardsH: 148,
  stages: [
    {x: 30,  gx: 55,  gy: 101, gw: 120, gh: 48, label: "1 × 32 × 80"},
    {x: 260, gx: 297, gy: 105, gw: 96,  gh: 40, label: "C × 16 × 40"},
    {x: 490, gx: 539, gy: 109, gw: 72,  gh: 32, label: "C × 8 × 20"},
    {x: 720, gx: 769, gy: 113, gw: 72,  gh: 24, label: "C × 4 × 20"},
    {x: 950, gx: 999, gy: 117, gw: 72,  gh: 16, label: "C × 2 × 20"}
  ],
  pools: [
    {x1: 208, x2: 246, y: 128, ly: 105, label: "2 × 2"},
    {x1: 438, x2: 476, y: 128, ly: 105, label: "2 × 2"},
    {x1: 668, x2: 706, y: 128, ly: 105, label: "2 × 1"},
    {x1: 898, x2: 936, y: 128, ly: 105, label: "2 × 1"}
  ],
  stageTextY: 181,
  bandInset: 8, bandGap: 9, bandWidth: 13,
  sectionX: 30, sectionY: 27,
  summaryX: 600, heightY: 228, widthY: 251,
  dividerX1: 30, dividerX2: 1170, dividerY: 274,
  lowerSectionY: 301,
  mapX: 50, mapY: 327, mapW: 500, mapH: 64,
  mapLabelX: 300, mapLabelY: 305,
  steps: 20, rows: 2, cellW: 25, cellH: 32,
  meanX1: 578, meanX2: 700, meanY: 359,
  meanLabelX: 639, meanLabelY: 337,
  seqX: 730, seqY: 330, seqW: 17, seqGap: 4, seqH: 52,
  seqLabelX: 938, seqLabelY: 305,
  markInsetX: 4, markY1: 343, markY2: 356, markY3: 369,
  timeX1: 730, timeX2: 1147, timeY: 421,
  timeLabelX: 938, timeLabelY: 407,
  edgeLabelY: 449,
  titleCardBandCount: 4
}]);

const d = data.find(Boolean);
const origin = Object.freeze({x: d.originX, y: d.originY});
const scale = Object.freeze({x: d.scaleX, y: d.scaleY});
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");

  function node(tag, className) {
    const el = document.createElementNS(ns, tag);
    if (className) el.setAttribute("class", className);
    return el;
  }

  function rect(parent, x, y, w, h, className) {
    const el = node("rect", className);
    el.setAttribute("x", sx(x));
    el.setAttribute("y", sy(y));
    el.setAttribute("width", sx(x + w) - sx(x));
    el.setAttribute("height", sy(y + h) - sy(y));
    parent.appendChild(el);
    return el;
  }

  function line(parent, x1, y1, x2, y2, className) {
    const el = node("line", className);
    el.setAttribute("x1", sx(x1));
    el.setAttribute("y1", sy(y1));
    el.setAttribute("x2", sx(x2));
    el.setAttribute("y2", sy(y2));
    parent.appendChild(el);
    return el;
  }

  function label(parent, value, x, y, anchor, className) {
    const el = node("text", className);
    el.setAttribute("x", sx(x));
    el.setAttribute("y", sy(y));
    el.setAttribute("text-anchor", anchor);
    el.textContent = value;
    parent.appendChild(el);
    return el;
  }

  function arrow(parent, x1, y1, x2, y2, lineClass, headClass) {
    line(parent, x1, y1, x2, y2, lineClass);
    const tip = node("polygon", headClass);
    tip.setAttribute("points", [
      sx(x2) + "," + sy(y2),
      sx(x2 - d.head) + "," + sy(y2 - d.headHalf),
      sx(x2 - d.head) + "," + sy(y2 + d.headHalf)
    ].join(" "));
    parent.appendChild(tip);
  }

  const root = node("g");
  svg.appendChild(root);

  label(root, "СЖАТИЕ CNN", d.sectionX, d.sectionY, "start", "section-label");

  d.stages.forEach((stage, stageIndex) => {
    rect(root, stage.x, d.cardsY, d.cardsW, d.cardsH, "card");
    rect(root, stage.gx, stage.gy, stage.gw, stage.gh, "feature");

    const usable = stage.gw - d.bandInset * d.two;
    const stride = usable / d.titleCardBandCount;
    for (let band = d.zero; band < d.titleCardBandCount; band += d.one) {
      const bandX = stage.gx + d.bandInset + stride * band;
      const bandW = Math.min(d.bandWidth, stride - d.bandGap);
      const bandClass = band % d.three === d.zero
        ? "feature-band-a"
        : band % d.three === d.one
          ? "feature-band-b"
          : "feature-band-c";
      rect(root, bandX, stage.gy, bandW, stage.gh, bandClass);
    }

    label(root, stage.label, stage.x + d.cardsW / d.two,
      d.stageTextY, "middle", "dimension");

    if (stageIndex < d.pools.length) {
      const pool = d.pools[stageIndex];
      arrow(root, pool.x1, pool.y, pool.x2, pool.y,
        "arrow-line", "arrow-head");
      label(root, pool.label, (pool.x1 + pool.x2) / d.two,
        pool.ly, "middle", "pool-label");
    }
  });

  label(root, "высота: 32 → 16 → 8 → 4 → 2",
    d.summaryX, d.heightY, "middle", "summary");
  label(root, "ширина: 80 → 40 → 20 → 20 → 20",
    d.summaryX, d.widthY, "middle", "summary-muted");

  line(root, d.dividerX1, d.dividerY, d.dividerX2,
    d.dividerY, "divider");
  label(root, "ИЗ КАРТЫ — В ПОСЛЕДОВАТЕЛЬНОСТЬ",
    d.sectionX, d.lowerSectionY, "start", "section-label");

  label(root, "карта признаков: высота 2, ширина 20",
    d.mapLabelX, d.mapLabelY, "middle", "main-label");

  for (let column = d.zero; column < d.steps; column += d.one) {
    for (let row = d.zero; row < d.rows; row += d.one) {
      const cellClass = column % d.three === d.zero
        ? "map-cell map-a"
        : column % d.three === d.one
          ? "map-cell map-b"
          : row === d.zero
            ? "map-cell map-c"
            : "map-cell map-hot";
      rect(root,
        d.mapX + column * d.cellW,
        d.mapY + row * d.cellH,
        d.cellW, d.cellH, cellClass);
    }
  }
  rect(root, d.mapX, d.mapY, d.mapW, d.mapH, "map-outline");

  arrow(root, d.meanX1, d.meanY, d.meanX2, d.meanY,
    "arrow-line", "arrow-head");
  label(root, "среднее по высоте", d.meanLabelX,
    d.meanLabelY, "middle", "mean-label");

  label(root, "20 векторов = 20 временных шагов",
    d.seqLabelX, d.seqLabelY, "middle", "main-label");

  for (let step = d.zero; step < d.steps; step += d.one) {
    const x = d.seqX + step * (d.seqW + d.seqGap);
    const edge = step === d.zero || step === d.steps - d.one;
    rect(root, x, d.seqY, d.seqW, d.seqH,
      edge ? "vector-edge" : "vector");

    const markClass = edge ? "vector-mark edge-mark" : "vector-mark";
    line(root, x + d.markInsetX, d.markY1,
      x + d.seqW - d.markInsetX, d.markY1, markClass);
    line(root, x + d.markInsetX, d.markY2,
      x + d.seqW - d.markInsetX, d.markY2, markClass);
    line(root, x + d.markInsetX, d.markY3,
      x + d.seqW - d.markInsetX, d.markY3, markClass);
  }

  label(root, "время = положение слева направо",
    d.timeLabelX, d.timeLabelY, "middle", "time-label");
  arrow(root, d.timeX1, d.timeY, d.timeX2, d.timeY,
    "time-line", "time-head");
  label(root, "левый край", d.timeX1, d.edgeLabelY,
    "start", "edge-label");
  label(root, "правый край", d.timeX2, d.edgeLabelY,
    "end", "edge-label");

  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
  console.error(error);
}
</script>
</body>
</html>
