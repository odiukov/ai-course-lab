- concept: FewShotPromptTemplate получает отдельный шаблон примера и отвечает за сборку полного few-shot-промпта
  question: Заполни имя аргумента, через который LangChain передаёт формат одной демонстрации сборщику few-shot-промпта.
  explanation: Отдельный PromptTemplate описывает вид одной демонстрации, а FewShotPromptTemplate собирает демонстрации и целевой запрос. Поэтому формат примеров можно менять централизованно.
  kind: cloze
  template: |-
    few_shot_prompt = FewShotPromptTemplate(
        examples=examples,
        ___=example_prompt,
        suffix=suffix,
        input_variables=["input"]
    )
  answer: example_prompt
  accept:
    - example_prompt
  id: 058-langchain-1
  fingerprint: 2d94959e
