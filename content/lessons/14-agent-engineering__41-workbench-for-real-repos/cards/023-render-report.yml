  question: Почему функция построения отчёта возвращает строку Markdown, а не пишет её в файл сама?
  explanation: 'Отделение вычисления текста от побочного эффекта даёт дешёвую проверку воспроизводимости: два вызова, сравнение строк. Запись файла — отдельное решение вызывающего кода, включая путь и момент записи.'
  kind: choice
  options:
    - Её можно проверить сравнением двух вызовов на одном входе, не создавая файлов и не трогая файловую систему
    - Строку быстрее передавать по сети
    - Markdown нельзя корректно записать из той же функции, что его строит
    - Так отчёт автоматически становится детерминированным
