- concept: адаптация scope-контракта к репозиторию уточняет адреса поверхностей, но не расширяет права по смысловой категории
  question: Контракт области переносят на реальный репозиторий, где задача касается валидации при регистрации. Какая формулировка разрешённых изменений корректна?
  explanation: 'Смысловая категория вроде «всё про авторизацию» втягивает вход в систему, сброс пароля и общие настройки безопасности, которых задача не касается. Контракт привязывают к найденным конкретным поверхностям: меняются координаты, а не цели и не объём прав.'
  kind: choice
  options:
    - «Разрешено менять всё, что относится к авторизации» — так контракт покроет любые смежные случаи
    - «Разрешено менять обработчик регистрации, используемую им валидацию, тип конверта ошибки и тесты этого обработчика»
    - «Разрешено менять любой файл, который агент сочтёт связанным с задачей по ходу работы»
  correct: 1
  id: 006-adapt-contract-1
  fingerprint: d5eb2958
- concept: 'минимальность прав при адаптации: право не выдаётся, если задача выполнима без него; общий модуль не открывается целиком'
  question: При адаптации контракта выясняется, что нужный тип ответа об ошибке в репозитории уже существует, а проверка правила живёт в общем модуле валидации. Что должно попасть в контракт?
  explanation: Право, без которого задача выполнима, не выдаётся. Расположение кода в общем модуле — повод точно указать изменяемое правило, а не открыть модуль целиком по смыслу.
  kind: choice
  options:
    - Право менять типы ошибок и весь модуль валидации — так агент не упрётся в ограничение
    - Право на минимальное изменение конкретного правила в модуле; право менять типы не добавляют, раз нужный тип уже есть
    - 'Ничего: если код лежит в общем модуле, задача выходит за пределы любого контракта'
  correct: 1
  id: 006-adapt-contract-2
  fingerprint: a6f80b4c
- concept: разграничение того, что при адаптации контракта разрешено менять (адреса), и того, что менять нельзя (требования и объём прав)
  question: Ты переносишь готовый контракт области на незнакомый репозиторий, и имена файлов там оказались не такими, как ожидалось. Что при этом допустимо изменить в контракте, а что нет?
  explanation: Репозиторий подсказывает, куда идти, но не выдаёт пропуск в соседние комнаты. Новая координата помогает выполнить ту же работу; дополнительные зоны расширяют права.
  kind: open
  reference: 'Допустимо скорректировать координаты: пути и имена файлов, точное расположение обработчика, валидации, типов и тестов. Недопустимо менять требования задачи (условие отклонения, статус и форму ответа об ошибке, обязательный тест, доказывающий поведение) и недопустимо добавлять новые цели или новые разрешённые зоны. Несовпадение адреса — повод исправить адрес, а не повод дописать соседние области в список разрешённого.'
  id: 006-adapt-contract-3
  fingerprint: cafda4b3
