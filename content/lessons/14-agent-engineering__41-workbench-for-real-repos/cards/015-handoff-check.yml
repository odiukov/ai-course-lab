- concept: 'отсутствие изменений — тоже сведение: передача называет поверхности, которых намеренно не касались'
  question: 'В передаче написано: «изменён `api/orders.py`; в `db/migrations/` ничего не менял». Зачем упоминать каталог, где изменений не было?'
  explanation: 'Явное «не трогал» снимает целую ветку расследования и одновременно показывает незакрытую часть работы. Пустое место в отчёте такого не даёт: непонятно, не меняли или забыли сказать.'
  kind: choice
  options:
    - Чтобы отчёт выглядел подробнее и внушал больше доверия.
    - Чтобы следующая сессия не тратила проверку на заведомо нетронутую область и видела, что миграции ещё не написаны.
    - Чтобы зафиксировать нарушение границ области задачи.
  correct: 1
  id: 015-handoff-check-1
  fingerprint: 4d575117
- concept: адресат передачи — следующий исполнитель, поэтому её состав определяется его первым действием
  question: Что должно определять, какие сведения попадут в передачу?
  explanation: Передача — вход следующей сессии, а не итоговый отчёт о заслугах. Перечень рассмотренных и отвергнутых идей длинный, но к следующему действию не приближает; строка «приёмочный тест прошёл, команда такая-то» приближает.
  kind: choice
  options:
    - 'Объём выполненной работы: чем больше сделано, тем длиннее запись.'
    - 'Первое действие следующего исполнителя: он должен начать его без повторного расследования.'
    - Формат отчётности, принятый у заказчика.
  correct: 1
  id: 015-handoff-check-2
  fingerprint: bab46ae0
