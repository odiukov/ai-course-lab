- concept: правило процесса обосновывается исходом, который оно предотвращает в наблюдаемом прогоне, а не авторитетом или общими соображениями
  question: Ревьюер спрашивает, зачем к каждому PR прикладывать правила агента и контракт области. Какое обоснование сильнее всего?
  explanation: Правило становится защитимым, когда видно, какой конкретный отказ оно ловит. Авторитет и отраслевая практика не отвечают на вопрос «что случится, если убрать»; прогон отвечает.
  kind: choice
  options:
    - Ссылка на решение архитектурного комитета, закрепившего этот порядок
    - Прогон, где без контрактного пайплайна появилось изменение файла вне области, а с ним границы соблюдены
    - Указание, что так работают команды с похожим стеком
    - Обещание, что при таком порядке ошибок станет меньше
  correct: 1
  id: 033-use-report-1
  fingerprint: ef9fe34d
- concept: отключение шлюза формулируется как снятие конкретной измеримой гарантии, известной до принятия решения
  question: Менеджер предлагает отключить шлюз верификации «только на этот спринт». Какую роль здесь играет отчёт до/после?
  explanation: Отчёт не запрещает и не решает. Он переводит спор с вопроса «мешает ли шлюз» на вопрос «готовы ли мы месяц не отличать «агент написал, что тестировал» от «есть след запуска»». Цена становится известна заранее, а не после инцидента.
  kind: choice
  options:
    - Доказывает, что шлюз нельзя отключать ни при каких условиях
    - Показывает, какую именно гарантию — свидетельство фактического запуска тестов — команда снимает, и делает решение осознанным
    - Автоматически блокирует изменение конфигурации CI
    - Оценивает, насколько ускорится сборка после отключения
  correct: 1
  id: 033-use-report-2
  fingerprint: 34fd9c91
- concept: одна запись измерений обслуживает разные решения, потому что решения различаются допустимым риском, а не набором фактов
  question: Почему один и тот же отчёт до/после годится и как обоснование правила в PR, и как критерий допуска в CI, и как основание выбрать агентный продукт?
  explanation: 'Отдельные аргументы под каждый разговор конкурируют убедительностью. Общая запись измерений устраняет эту конкуренцию: обсуждается порог риска, а не чья история звучит правдоподобнее.'
  kind: open
  reference: 'Во всех трёх случаях спорят не о фактах, а о допустимом риске: какой отказ мы готовы пропустить и за какую цену. Отчёт даёт общий набор измерений — соблюдение области, лишние файлы, свидетельство запуска, пригодность передачи, завершённость задачи, — снятых по одинаковому протоколу. Ревьюер читает из него, какой исход защищает правило; CI берёт исход как условие допуска; при выборе продукта меняется испытуемый, а задача, протокол и исходы остаются, и рекламное обещание проверяется на собственном репозитории. Решение отчёт не принимает: он делает его цену видимой.'
  id: 033-use-report-3
  fingerprint: b1832998
