- concept: 'вход нормализуется до проверки признаков: отсутствующее поле, None и строка из пробелов сводятся к одному пустому значению'
  question: 'Заполни пропуск: поле передачи нужно привести к виду, где отсутствие ключа, None и строка из пробелов дают одинаковый пустой результат.'
  explanation: get вернёт None для отсутствующего ключа, `or ""` превращает None в строку, strip убирает пробельную заглушку. Без нормализации поле из одних пробелов засчиталось бы как заполненное, и пустая передача получила бы тот же балл, что настоящее описание.
  kind: cloze
  template: summary = (handoff.get("summary") or "").___()
  answer: strip
  accept:
    - strip
    - strip()
    - .strip()
  id: 014-handoff-quality-1
  fingerprint: 13b7a0a2
- concept: оценка передачи считается как доля независимо проверенных признаков, а не по объёму текста
  question: Функция оценки передачи проверяет 5 независимых признаков и возвращает долю выполненных. В передаче есть конкретное описание изменения, команда проверки и её результат, но нет ни перечня затронутых файлов, ни оставшихся рисков. Какое значение вернёт функция?
  explanation: 'Выполнено 3 признака из 5, доля 0.6. Считается число независимо подтверждённых признаков, а не длина строки: развёрнутый рассказ без единой команды даст меньше, чем три сухие проверяемые строки.'
  kind: numeric
  answer: 0.6
  tolerance: 0.01
  id: 014-handoff-quality-2
  fingerprint: b708879b
