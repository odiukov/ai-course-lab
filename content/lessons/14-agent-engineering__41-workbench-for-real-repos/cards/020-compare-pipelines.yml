- concept: исходы сопоставляются по имени ключа; позиция элемента в структуре не несёт смысла
  question: Функция сравнения получает две записи прогона. В первой исходы перечислены в одном порядке, во второй — в другом, но набор имён одинаков. Каким должен быть результат сравнения?
  explanation: Сопоставление по индексу склеило бы, например, соблюдение границ с оценкой передачи и выдало бы правдоподобную, но ложную таблицу. Ключ — единственный признак того, что две ячейки описывают одно и то же свойство работы.
  kind: choice
  options:
    - 'Тем же самым: сопоставление ведётся по именам исходов, порядок элементов на результат не влияет'
    - 'Разным: порядок в записи задаёт приоритет исходов'
    - 'Ошибкой: разный порядок означает разные пайплайны'
    - Тем же самым, но только если обе записи предварительно отсортированы вызывающим кодом
  correct: 0
  id: 020-compare-pipelines-1
  fingerprint: 35cabbdf
- concept: несовпадение наборов ключей делает сравнение невалидным — вход отклоняется, а не сравнивается по пересечению
  question: В одной записи шесть исходов, в другой семь. Дополни проверку так, чтобы такие записи не сравнивались молча.
  explanation: 'Сравнение только по пересечению ключей дало бы таблицу, где строки уже не обозначают одно и то же: потерянный исход просто исчезает из отчёта, а незнакомый добавленный остаётся неучтённым. Явный отказ лучше тихо неверного результата.'
  kind: cloze
  template: |-
    if set(before) ___ set(after):
        raise ValueError("несовместимые наборы исходов")
  answer: '!='
  accept:
    - '!='
    - is not
    - not ==
  id: 020-compare-pipelines-2
  fingerprint: 4b1ff283
- concept: 'направление изменения определяется парой значений: равные значения дают «без изменений» независимо от того, успешны они или нет'
  question: По исходу «свидетельство запуска тестов» оба пайплайна дали отрицательный результат. Как классифицируется эта пара при попарном сравнении?
  explanation: Функция сравнения фиксирует переход, а не выносит вердикт. Одинаковые значения — «без изменений», даже когда оба плохие; такая строка честно показывает, что верстак этот исход не сдвинул, и её нельзя ни спрятать, ни записать в регресс.
  kind: choice
  options:
    - Без изменений — направление определяется парой значений, а не их качеством
    - Ухудшение — отрицательный результат всегда учитывается как регресс
    - Улучшение отсутствует, поэтому пара исключается из отчёта
    - Пара считается недействительной и требует повторного прогона
  correct: 0
  id: 020-compare-pipelines-3
  fingerprint: 50b1e089
