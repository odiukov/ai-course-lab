- concept: сокращение набора инструментов повышает долю успеха, потому что каждый лишний инструмент — дополнительная развилка выбора
  question: У агента 45 инструментов и 72% успешных прогонов. Команда удаляет большую часть, оставив только нужные для области задачи, — успех растёт. Какое объяснение верно?
  explanation: 'Vercel сообщила о росте с 80% до 100% после удаления 80% инструментов. Дело не в скорости, а в пространстве выбора: острее область — меньше поводов свернуть не туда.'
  kind: choice
  options:
    - Каждый лишний инструмент — развилка, на которой можно выбрать неверное действие; узкий набор сокращает число способов ошибиться
    - Меньше инструментов — короче системный промпт, и модель успевает подумать дольше
    - Удаление инструментов повышает точность самой модели
    - Оставшиеся инструменты начинают работать быстрее
