- concept: 'смешивающий фактор: любое дополнительное различие между ветками разрушает вывод о причине'
  question: В A/B-прогоне ветке с новым процессом дополнительно уточнили формулировку задачи и подсказали ожидаемый код ответа, а ветке без процесса — нет. Результат второй ветки лучше. Что можно заключить?
  explanation: Уточнённая формулировка — смешивающий фактор. Причин стало две, и результат нельзя приписать процессу. В честном прогоне неизменны задача, исходное состояние, модель, доступное время и набор измеряемых исходов.
  kind: choice
  options:
    - 'Что новый процесс работает: разница в результатах измерена одинаковыми исходами'
    - 'Что нельзя заключить ничего о процессе: различались и подсказки, поэтому причина разницы не определена'
    - Что подсказка бесполезна, раз процесс всё равно применялся
  correct: 1
  id: 003-chestnyi-ab-1
  fingerprint: 38d7bffe
- concept: 'порядок подготовки честного A/B-прогона: общее исходное состояние, две независимые копии, единое измерение'
  question: Расставь шаги подготовки и проведения честного A/B-сравнения двух пайплайнов на одном репозитории.
  explanation: 'Главная ловушка — запустить вторую ветку поверх правок первой: тогда второй агент получает частично решённую задачу. Нужны две свежие копии одного состояния и одинаковое измерение после.'
  kind: order
  items:
    - Зафиксировать исходное состояние репозитория и формулировку задачи
    - Сделать две независимые копии этого исходного состояния
    - Прогнать пайплайн без нового процесса на первой копии
    - Прогнать пайплайн с новым процессом на второй копии, не унаследовав правки первого прогона
    - Применить к обоим результатам один и тот же набор исходов
  id: 003-chestnyi-ab-2
  fingerprint: 67782ca8
