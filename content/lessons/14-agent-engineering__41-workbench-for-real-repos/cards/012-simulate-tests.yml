- concept: отсутствие запуска — самостоятельное состояние, не равное подтверждённому провалу тестов
  question: Пайплайн без верстака закончился заявлением «готово», команда приёмки не выполнялась. Как должен выглядеть результат проверки для этой ветки?
  explanation: Провал означает, что команда выполнялась и вернула ненулевой код. Здесь запуска не было вообще, и `passed = false` соврало бы, подсунув подтверждённый неуспех вместо отсутствия свидетельства. Придумывать нулевой код и вывод тестов тем более нельзя — это подделка следа.
  kind: choice
  options:
    - '`passed = false` — раз подтверждения нет, считаем прогон провалившимся'
    - Статус «не подтверждён», без кода завершения и без вывода тестов
    - '`passed = true` с кодом завершения 0 — заявление исполнителя принимается как результат'
    - 'Результат вовсе не формируется: сравнивать ветки не с чем'
  correct: 1
  id: 012-simulate-tests-1
  fingerprint: 0ec29cfe
- concept: успешность прогона определяется кодом завершения процесса, а не текстом отчёта
  question: Дополни вычисление признака успеха по результату выполненной команды приёмки.
  explanation: 'Соглашение процессов: нулевой код завершения — успех, любой другой — сбой. Опора на текст вывода («no errors») ненадёжна: раннер меняет формулировки, а число остаётся стабильным контрактом.'
  kind: cloze
  template: passed = exit_code == ___
  answer: '0'
  accept:
    - '0'
  id: 012-simulate-tests-2
  fingerprint: '79748e40'
- concept: в пайплайне с верстаком приёмка выполняется раннером и проходит через шлюз верификации и ревьюера до передачи контекста
  question: Расставь шаги пайплайна с верстаком в порядке выполнения.
  explanation: Права и состояние читаются до правок, приёмка выполняется после правок, а шлюз и ревьюер стоят между прогоном и передачей контекста. В пайплайне без верстака вместо этих четырёх проверок стоит один шаг — «объявить, что готово».
  kind: order
  items:
    - Запустить init-скрипт окружения
    - Прочитать контракт области
    - Прочитать состояние задачи
    - Править только разрешённые файлы
    - Выполнить команду приёмки через раннер обратной связи
    - Пройти шлюз верификации
    - Прогнать ревьюера
    - Сгенерировать передачу контекста
  id: 012-simulate-tests-3
  fingerprint: 1926bea4
