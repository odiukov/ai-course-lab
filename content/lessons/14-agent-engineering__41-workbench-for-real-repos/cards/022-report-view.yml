- concept: нестабильные значения (текущее время, случайные идентификаторы, абсолютные пути) исключаются из содержательной части отчёта
  question: Какое поле нарушает воспроизводимость отчёта о сравнении сильнее всего?
  explanation: Время и путь меняются при каждом запуске и на каждой машине, хотя измерения те же. Они создают ложные различия, поэтому в содержательной части им не место — при необходимости их держат вне сравниваемого тела.
  kind: choice
  options:
    - Отметка времени запуска и абсолютный путь к рабочей папке в теле отчёта
    - Название каждого исхода
    - Значение исхода у базового пайплайна
    - Направление изменения по каждой паре
