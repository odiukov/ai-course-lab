- concept: человекочитаемое и машинное представления выводятся из одного результата сравнения, а не собираются независимо
  question: 'Отчёт публикуется в двух видах: таблица в Markdown для человека и JSON для дальнейшей обработки. Почему оба обязаны строиться из одного и того же результата сравнения?'
  explanation: Представление не должно ничего доопределять. Один результат сравнения — два способа его напечатать; тогда и таблица, и JSON проверяемы друг против друга.
  kind: open
  reference: 'Независимая сборка означает два разных пути вычисления одних и тех же чисел. Любое расхождение в логике — другой порядок, другая обработка отсутствующего значения, забытое обновление одной из веток кода — приводит к тому, что таблица утверждает одно, а JSON другое. Тогда отчёт перестаёт быть свидетельством: скептик получает два источника и повод не верить ни одному. Единый источник делает представления заведомо согласованными, а различаться они могут только формой.'
