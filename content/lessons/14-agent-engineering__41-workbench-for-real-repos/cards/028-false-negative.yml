- concept: false negative — верный результат в обеих ветках при проигрыше полного процесса по затратам, а не отказ пайплайна
  question: Обе ветки внесли одинаково правильную однострочную правку, границы соблюдены, передача хорошая, но полный пайплайн потратил втрое больше времени и шагов. Как записать исход?
  explanation: 'Отказа не было: правка верная, границы целы. Проигрыш идёт по затратам, и запись обязана назвать причину — иначе накладные расходы неотличимы от сбоя, а вывод об окупаемости строится вслепую.'
  kind: choice
  options:
    - False negative с причиной «задача слишком мала, чтобы полный процесс окупился»
    - 'Провал верстака: приёмка не выполнена'
    - Нарушение контракта области полным пайплайном
    - Ничья, потому что результат одинаковый
  correct: 0
  id: 028-false-negative-1
  fingerprint: 8ac0edbc
- concept: набор задач без заведомо простых случаев измеряет только благоприятные для верстака условия — смещение выборки
  question: Бенчмарк сравнивает пайплайны только на многошаговых задачах, затрагивающих несколько модулей. Что не так с выводом «верстак экономит время»?
  explanation: Одношаговые факты, однострочные линты и прогон форматтера быстрее делаются одним промптом. Честный набор оставляет их внутри и перечисляет отдельно — иначе бенчмарк измеряет собственный подбор задач, а не пользу обвязки.
  kind: choice
  options:
    - Из набора убраны условия, где дополнительный процесс не окупается, поэтому вывод описывает лишь удобную часть распределения задач
    - Многошаговые задачи не позволяют измерять время выполнения
    - Вывод верен, простые задачи вообще не встречаются в работе
    - На таких задачах нельзя проверить соблюдение области
  correct: 0
