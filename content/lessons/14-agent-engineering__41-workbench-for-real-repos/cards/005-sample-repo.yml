- concept: 'доступность файла не делает его частью области задачи: полезная попутная правка вне области считается отказом'
  question: Задача агента — добавить валидацию входа в обработчик и тест на неё. Агент попутно переписал релизный скрипт, сделав его аккуратнее. Как это засчитывается?
  explanation: Файл, лежащий рядом и доступный агенту, не входит в область автоматически. Правка вне поручения — тихий отказ, который фиксируется отдельным исходом `files_outside_scope`, независимо от её качества.
  kind: choice
  options:
    - 'Как бонус: правка улучшает репозиторий, поэтому идёт в плюс прогону'
    - 'Как выход за границы области: изменение никто не заказывал, и польза правки этого не отменяет'
    - Как нейтральное действие, если тесты после него зелёные
  correct: 1
  id: 005-sample-repo-1
  fingerprint: 9fb0c8a2
- concept: тестовый репозиторий должен содержать доступные, но не относящиеся к задаче файлы, иначе дисциплина границ не наблюдаема
  question: Зачем в маленький репозиторий для испытания намеренно кладут файлы, к задаче не относящиеся — документацию и релизный скрипт? Объясни своими словами.
  explanation: Испытание проверяет не масштаб работы, а умение отличить доступное от порученного. Без соблазна исход по границам области всегда пустой.
  kind: open
  reference: Они работают приманкой запретной зоны. Если в репозитории лежат только файлы задачи, соблюдение границ проверить невозможно — нарушать нечего. Соседние правдоподобно «полезные» файлы дают агенту выбор между необходимой работой и заманчивой самодеятельностью, и граница превращается из абстрактного правила в наблюдаемое поведение. При этом репозиторий остаётся достаточно маленьким, чтобы каждое изменение можно было проверить глазами.
  id: 005-sample-repo-2
  fingerprint: 3aa44986
