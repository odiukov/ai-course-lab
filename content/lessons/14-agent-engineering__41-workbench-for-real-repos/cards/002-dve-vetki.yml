  question: Прогон получил высокую оценку ревьюера за качество кода, приёмочный тест выполнен, но агент вдобавок изменил файл, лежащий вне заявленной области задачи. Какой вывод корректен?
  explanation: 'Исходы измеряются раздельно именно поэтому: `reviewer_total` — качественная оценка поверх шлюза, а `files_outside_scope` ловит тихий отказ, который красивый отчёт легко прячет. Свести всё к одной цифре — значит завести слепое пятно.'
