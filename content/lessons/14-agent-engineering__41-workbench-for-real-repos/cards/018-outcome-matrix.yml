- concept: 'поверхности связаны: снятие одной ухудшает и тот исход, который она напрямую не измеряет'
  question: Из пайплайна убрали шлюз верификации, требующий свидетельство запуска тестов. Какой исход, помимо самого факта запуска, просядет в первую очередь?
  explanation: 'Шлюз производит именно тот проверяемый след — команду и код завершения, — который затем становится содержанием передачи. Уберите шлюз, и передача снова состоит из заверений. Контракт области при этом продолжает ловить лишние файлы: связка не значит, что разом просядет всё.'
  kind: choice
  options:
    - 'Никакой: остальные исходы измеряются другими поверхностями и не зависят от шлюза.'
    - 'Качество передачи: без обязательного свидетельства в неё попадает утверждение «тесты прошли», которое следующей сессии придётся перепроверять.'
    - 'Список файлов вне области: без шлюза исполнитель чаще правит лишние файлы.'
  correct: 1
  id: 018-outcome-matrix-1
  fingerprint: e47c2f8e
- concept: у каждого отказа есть поверхность, которая его обнаруживает, и обнаружение не держится на внимательности ревьюера
  question: 'Прогон дал два отказа: изменён файл вне разрешённой области и тесты не запускались. Какие поверхности обнаруживают эти отказы?'
  explanation: 'Разделение не косметическое: контракт области сравнивает пути diff со списком разрешённых поверхностей, шлюз требует след запуска — команду и код завершения. Ревьюер добавляет оценку поверх обоих, но сами отказы находятся без него.'
  kind: choice
  options:
    - Обе находки — работа ревьюера, машинные поверхности их не видят.
    - Лишний файл ловит контракт области, отсутствие запуска — шлюз верификации.
    - Оба отказа обнаруживает шлюз верификации при разборе diff.
  correct: 1
  id: 018-outcome-matrix-2
  fingerprint: 14cbe361
