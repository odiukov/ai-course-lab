- concept: 'запись прогона атомарна: поля, взятые из разных запусков, описывают несуществующий прогон'
  question: Свидетельство запуска тестов взяли из вчерашнего прогона, а список файлов вне области — из сегодняшнего, потому что вчера его не сохранили. Что не так с такой записью?
  explanation: Ценность записи в том, что все её поля относятся к одному запуску одного пайплайна на одной задаче. Как только поля собраны из разных запусков, запись перестаёт быть свидетельством и становится реконструкцией.
  kind: choice
  options:
    - 'Ничего: оба факта верны, каждый в своём запуске.'
    - Запись описывает прогон, которого не было, и любое сравнение на её основе недействительно.
    - 'Проблема только в датах: достаточно указать обе в примечании.'
  correct: 1
  id: 016-five-outcomes-1
  fingerprint: '54255734'
- concept: запись прогона характеризует пару «пайплайн + задача», а не пайплайн вообще
  question: Пайплайн с верстаком получил безупречную запись прогона на задаче о валидации ввода. Что эта запись позволяет утверждать, а что нет? Объясни своими словами.
  explanation: Запись фиксирует наблюдение, а не свойство инструмента. Обобщение появляется только после сравнимых прогонов, и именно поэтому все пять полей хранятся раздельно и с привязкой к запуску.
  kind: open
  reference: 'Запись говорит только о том, что произошло с этим пайплайном на этой конкретной задаче: тесты запускались, приёмка выполнена, границы соблюдены, передача пригодна, оценка ревьюера такая-то. Вывод «пайплайн лучше» из неё не следует — это один снимок. Нужны сравнение с другим пайплайном на той же задаче при прочих равных и повторение на других задачах, иначе результат может объясняться лёгкостью самой задачи.'
  id: 016-five-outcomes-2
  fingerprint: 44385aec
