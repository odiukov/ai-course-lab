- concept: 'агрегатный балл невосстановим: из одной суммы нельзя узнать, какие именно исходы изменились и в какую сторону'
  question: Прогон пайплайна оценивается по девяти независимым исходам. Команда публикует только итоговый счёт «7 улучшений». Что принципиально теряет читатель такого отчёта?
  explanation: 'Свёртка — необратимая операция: один и тот же счёт даёт множество разных раскладов по исходам. Поэтому сводное число допустимо только как производная от попарных сравнений, но не вместо них: сначала сохраняешь различия, потом считаешь.'
  kind: choice
  options:
    - Возможность узнать, какие именно исходы изменились и в каком направлении — по счёту это не восстанавливается
    - Возможность узнать общее количество исходов
    - Возможность узнать, что прогонов было два
    - Возможность узнать, детерминирован ли пайплайн
  correct: 0
  id: 019-compare-records-1
  fingerprint: 81894ef2
- concept: суммирование разнородных исходов требует общей шкалы и весов, которых у булевых и качественных исходов нет
  question: Почему сложение разнородных исходов прогона (булев факт запуска тестов, число файлов вне области, качественная оценка передачи) в один балл — некорректная операция? Объясни своими словами.
  explanation: Свёртка допустима, когда величины соизмеримы и веса обоснованы. Здесь ни того, ни другого нет, поэтому балл выглядит объективным, но его смысл придуман на месте.
  kind: open
  reference: 'У этих исходов нет общей единицы измерения и нет обоснованных весов. Сложение молча вводит допущение, что «один лишний файл вне области» стоит ровно столько же, сколько «одна ступень качества передачи», и что эти величины взаимозаменяемы. Такое допущение никем не проверено и не следует из измерения. Поэтому сравнение ведётся попарно: одноимённый исход одного пайплайна против того же исхода другого, с фиксацией направления — лучше, хуже, без изменений.'
  id: 019-compare-records-2
  fingerprint: 73290c3c
