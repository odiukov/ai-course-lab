- concept: 'внешняя валидность: контроль условий обосновывает вывод о причине внутри прогона, но не переносимость результата на другие репозитории и задачи'
  question: Контролируемое сравнение на одном фикстурном репозитории показало улучшение шести исходов из восьми. Что этот результат обосновать НЕ может?
  explanation: Контроль условий закрывает вопрос «почему возникла разница здесь». Вопрос «повторится ли она везде» закрывается только новыми прогонами на других репозиториях и задачах — одна выборка из одного приложения такого права не даёт.
  kind: choice
  options:
    - Что тот же выигрыш повторится на произвольном другом репозитории и другой задаче
    - Что разницу между прогонами разумно приписать различию пайплайнов
    - Что улучшение затронуло несколько независимых сторон работы
    - Что измерение воспроизводимо при повторном запуске
  correct: 0
  id: 021-conclusion-limit-1
  fingerprint: '407388e3'
- concept: исход без изменений не опровергает улучшение по другим исходам и не свидетельствует о неудаче эксперимента
  question: В сравнении двух пайплайнов часть исходов улучшилась, а один остался ровно таким же. Как правильно трактовать неизменившийся исход?
  explanation: Отсутствие эффекта — тоже результат измерения. Он ограничивает силу обещания («улучшилось не всё»), но не ставит под сомнение зафиксированные улучшения и не является браком методики.
  kind: choice
  options:
    - 'Как отдельное наблюдение: по этому свойству эффекта не обнаружено, что не отменяет улучшений по остальным'
    - Как доказательство того, что сравнение выполнено неверно
    - Как ухудшение, потому что ожидалось улучшение всех исходов
    - Как повод исключить этот исход из набора измеряемых
  correct: 0
