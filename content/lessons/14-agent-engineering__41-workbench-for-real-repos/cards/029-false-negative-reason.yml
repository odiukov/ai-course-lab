- concept: 'преимущество обвязки датировано: модели со временем впитывают её приёмы, поэтому вывод описывает текущее распределение инженерной нагрузки, а не постоянный закон'
  question: Команда получила заметный прирост качества агента только за счёт обвязки, без смены модели. Какой вывод из этого корректен?
  explanation: 'Замеры вроде прыжка одной и той же модели из-за пределов топ-30 на пятое место показывают, где нагрузка лежит сейчас. Модели постепенно усваивают трюки обвязки внутрь себя, поэтому вывод — про сегодняшнее распределение работы, а не про вечное превосходство обвязки. Отсюда практика: бенчмарк перезапускают на новых моделях.'
  kind: choice
  options:
    - Обвязка сильнее модели, и это соотношение сохранится при любых будущих моделях
    - Сегодня инженерная нагрузка лежит в поверхностях обвязки; часть её приёмов будущие модели впитают, и замер придётся повторить
    - Прирост доказывает, что выбор модели вообще не влияет на результат
    - Прирост означает, что текущая модель неисправна и её надо заменить
  correct: 1
  id: 029-false-negative-reason-1
  fingerprint: a1a1237b
- concept: признак простоты задачи берётся из явных данных о задаче, а не из впечатления от её названия или ощущения знакомости
  question: Классификатор помечает задачу как false negative — слишком мелкую, чтобы полный процесс окупился. На входе описание задачи. Какой сигнал допустим как основание?
  explanation: '«Поправить стиль» может означать и один пробел, и переработку десятка файлов — название не признак. Дословную запомненность нельзя выводить из ощущения: нужен отдельный признак во входных данных. И длительность прогона тут не аргумент — вопрос узкий: была ли задача изначально слишком мелкой для дополнительного процесса.'
  kind: choice
  options:
    - Название задачи звучит просто — «поправить стиль»
    - Задача кажется знакомой, модель наверняка помнит такое дословно
    - В описании явно указано, что правка однострочная и сводится к прогону форматтера
    - Полный пайплайн отработал дольше обычного пайплайна
  correct: 2
  id: 029-false-negative-reason-2
  fingerprint: ea62c365
- concept: 'перекрывающиеся признаки: широкое условие поглощает частный случай, поэтому порядок проверок определяет, насколько информативна выданная причина'
  question: 'В классификаторе причин часть условий перекрывается: одно широкое покрывает несколько узких. Проверки идут подряд, возвращается первое совпадение. Почему широкое условие ставят последним?'
  explanation: 'При возврате первого совпадения широкая проверка впереди поглощает узкие: причина формально верна, но бесполезна для отчёта. Порядок «от конкретных к общим» гарантирует, что задача с прямым признаком получит точную формулировку, а общее условие сработает только как остаток. Плюс формулировки должны быть стабильными — иначе сравнение причин между прогонами теряет смысл.'
  kind: choice
  options:
    - Иначе оно перехватит частные случаи и вместо точной причины вернётся расплывчатая
    - Иначе функция вернёт сразу несколько причин и вызывающий код упадёт
    - 'Порядок не важен: перекрытие условий само разрешится по типу возвращаемого значения'
    - Широкие условия дороже по времени, поэтому их всегда откладывают
  correct: 0
