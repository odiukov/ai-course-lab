- concept: 'выход за границы области — тихий отказ: успешный результат задачи не сигнализирует о лишних изменениях'
  question: Агент выполнил задачу, запрошенные тесты зелёные, требование доказано. При этом в diff попали два файла, которых контракт области не разрешал. Почему такой отказ называют тихим?
  explanation: 'Лишний файл не создаёт красного сигнала: тесты проходят, цель достигнута. Отсюда отдельный исход files_outside_scope — обнаружение требует сравнения списка путей с контрактом, а не чтения итога задачи.'
  kind: choice
  options:
    - Он не мешает задаче выполниться и не даёт сигнала в результатах — виден только при сверке diff с контрактом
    - Он всегда ломает сборку, но сообщение теряется среди логов
    - Он проявляется только после выката в продакшен
    - Модель сама сообщает о нём в конце отчёта
  correct: 0
  id: 025-read-deltas-1
  fingerprint: ba7ce208
- concept: 'поверхности не взаимозаменяемы: шлюз запуска не обнаруживает лишние файлы, контракт области не обнаруживает пропущенную приёмку'
  question: Команда оставляет шлюз, требующий свидетельство запуска приёмочного теста, и убирает контракт области. Какой отказ станет ненаблюдаемым?
  explanation: Шлюз проверяет факт и результат запуска, но ничего не знает о списке затронутых путей. Каждая поверхность ловит свой класс отказов, поэтому снятие одной оставляет слепое пятно, которое соседняя не закрывает.
  kind: choice
  options:
    - Изменение файла, лежащего вне разрешённой области
    - Прогон, в котором приёмочный тест не запускался
    - Прогон, в котором приёмочный тест упал
    - Прогон, в котором процесс завершился ненулевым кодом
  correct: 0
  id: 025-read-deltas-2
