- concept: первая осмысленная правка определяется вкладом в решение задачи, служебные и подготовительные действия ею не считаются
  question: В измерение добавляют исход «время до первой осмысленной правки». Что считать этой правкой?
  explanation: Если засчитывать любое действие, показатель измеряет скорость реакции, а не скорость продвижения к решению. Служебные записи и чтение файлов легко подделывают ранний старт, поэтому в определение входит только правка, приближающая готовое изменение.
  kind: choice
  options:
    - Любое первое действие агента, включая открытие и чтение файла
    - Первое изменение, продвигающее решение задачи, — например, правку целевой функции
    - Создание файла состояния или записи плана работ
    - Первый ответ модели после получения задачи
  correct: 1
  id: 032-noisy-extension-1
  fingerprint: e6e8497b
- concept: 'общая точка старта таймера для обеих веток: подготовительные расходы входят в измерение, а не выносятся из него'
  question: Один пайплайн перед первой правкой инициализирует состояние и фиксирует контракт области, другой начинает править сразу. С какого момента запускать таймер?
  explanation: Сдвиг старта у одной ветки убирает из измерения ровно ту величину, которую исход и должен показать, — цену подготовки. Общая точка отсчёта делает задержку видимой; она может быть оправданной, но решает это читатель отчёта, а не измеритель.
  kind: choice
  options:
    - С момента передачи задачи пайплайну — одинаково для обеих веток
    - Для пайплайна с подготовкой — после её завершения, чтобы не штрафовать обязательные шаги
    - С момента первой правки кода в каждой ветке
    - С момента, когда исполнитель впервые обратился к тестовой команде
  correct: 0
  id: 032-noisy-extension-2
  fingerprint: 747e7343
- concept: зашумлённый показатель характеризуется серией повторов через устойчивое типичное значение, а не лучшим прогоном
  question: Четыре повтора одной задачи в одном пайплайне дали время до первой осмысленной правки 18, 20, 22 и 96 секунд. Какое значение (в секундах) честнее предъявить как типичное?
  explanation: 'Медиана — (20+22)/2 = 21 — устойчива к единичному выбросу 96, в отличие от среднего (39). Лучший прогон (18) предъявлять нельзя: с живой моделью каждый запуск отличается, поэтому показывают типичное значение вместе с разбросом.'
  kind: numeric
  answer: 21
  tolerance: 0.5
  id: 032-noisy-extension-3
  fingerprint: 81c30ce0
