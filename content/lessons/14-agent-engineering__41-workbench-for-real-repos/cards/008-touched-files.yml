- concept: 'закрытый список: путь, о котором контракт ничего не говорит, считается нарушением, а не нейтральным случаем'
  question: Агент создал новый файл по пути, который scope-контракт вообще не упоминает — ни в разрешённых, ни в запрещённых зонах. Как классифицировать этот путь?
  explanation: Список разрешённого — закрытый. При обратном правиле (что не запрещено, то можно) исполнитель расширяет собственные права простым созданием файлов рядом с разрешённой зоной, и граница перестаёт что-либо ограничивать.
  kind: choice
  options:
    - 'Как нарушение: разрешает только явное упоминание в разрешённой области'
    - 'Как разрешённый: запрета на этот путь в контракте нет'
    - Как разрешённый, если файл новый — контракт описывает только существовавшие файлы
    - 'Как неопределённый: такой путь исключают из проверки до уточнения контракта'
  correct: 0
  id: 008-touched-files-1
  fingerprint: 92b3c10b
- concept: переименование проверяется по обоим путям — исходному и целевому
  question: В diff есть переименование файла. Что достаточно проверить по scope-контракту?
  explanation: Переименование — это два действия над двумя поверхностями. Проверка только цели пропускает вынос файла из защищённой зоны, проверка только источника — занос файла в неё. Так же полно разбираются добавления и удаления.
  kind: choice
  options:
    - 'Только целевой путь: важно, где файл лежит после изменения'
    - 'Только исходный путь: именно оттуда файл был взят'
    - 'Оба пути: переименование одновременно удаляет файл по одному адресу и создаёт по другому'
    - 'Ни одного: переименование не меняет содержимого и границы не касается'
  correct: 2
  id: 008-touched-files-2
  fingerprint: 346ca8e9
- concept: классификация путей отвечает на вопрос о праве касаться поверхности, а не о качестве изменения внутри файла
  question: 'Изменение внутри разрешённого файла сделано плохо: дублирует логику и не покрыто тестом. Как это влияет на классификацию пути по scope-контракту?'
  explanation: 'Классификация проверяет более раннее условие: имел ли исполнитель право трогать эту поверхность. Смешение двух вопросов ломает обе проверки — качественное замечание маскируется под нарушение границ, а настоящее нарушение растворяется среди замечаний по коду.'
  kind: choice
  options:
    - 'Путь переводится в нарушения: плохое изменение равно выходу за границы'
    - Путь остаётся разрешённым — качество кода оценивают более поздние проверки
    - Путь исключается из отчёта до исправления кода
    - Путь остаётся разрешённым только если тесты в итоге проходят
  correct: 1
  id: 008-touched-files-3
  fingerprint: 2f2eaacd
