- concept: 'рантайм решает судьбу возникшей ошибки: восстановление её поглощает, хрупкий ретрай и устаревшее состояние размножают'
  question: Объясни своими словами, почему в длинной задаче важнее поведение рантайма после первой ошибки, чем частота ошибок на отдельном шаге.
  explanation: Именно этот класс причин — устаревшее состояние, хрупкие ретраи, разросшийся контекст, слабое восстановление — preprints.org относит к рантайму, а не к рассуждениям, когда объясняет, почему 88% корпоративных агентных проектов не доезжают до продакшена.
  kind: open
  reference: 'Одиночная ошибка сама по себе дёшева. Дорого то, что происходит дальше: хрупкий повтор запускает ту же неудачную команду снова, устаревшее состояние заставляет действовать так, будто файл не менялся, плохое восстановление делает сбойный результат основой для следующих решений. Так одна ошибка становится входом для цепочки решений и размножается. Хорошая обвязка возвращает цель, обновляет состояние, ограничивает повторения и сохраняет пригодную передачу — тогда тот же сбой поглощается. Поэтому при неизменной модели итог длинного прогона может отличаться радикально.'
