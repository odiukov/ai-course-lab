- concept: 'переносимость оценочной обвязки: меняется привязка к репозиторию, определения протокола и исходов остаются прежними'
  question: 'Команда переносит оценочную обвязку из демо-приложения в боевой платёжный сервис: другой язык, другие каталоги, другая команда тестов. Что допустимо менять, чтобы отчёты остались сопоставимыми с прежними?'
  explanation: Переносимость означает не «запускается везде», а «на новом материале измеряет прежние свойства». Проектная привязка (пути, команда запуска, формат передачи) — параметры сцены; протокол и определения исходов — линейка. Подмена линейки делает новые отчёты внешне похожими, но несопоставимыми со старыми.
  kind: choice
  options:
    - Названия и смысл исходов — подстроить под привычную терминологию команды
    - 'Привязку к репозиторию: задачу, разрешённые пути, тестовую команду, формат передачи — при неизменных протоколе прогона и определениях исходов'
    - Набор исходов — оставить те, которые в этом репозитории проверяются проще
    - Права агента — расширить, раз репозиторий крупнее демо-приложения
  correct: 1
  id: 031-portable-benchmark-1
  fingerprint: 1a07ab3d
- concept: отсутствующий в новом репозитории аналог проверки фиксируется как явное ограничение, а не заменяется более удобным исходом
  question: В целевом репозитории нет приёмочной команды, которой можно проверить один из исходов обвязки. Что с этим делать и почему нельзя заменить исход другим, который здесь измеряется легко?
  explanation: 'Опасность переноса не в том, что что-то не измерилось, а в том, что подмена незаметна. Пропуск с пометкой честен, подмена — нет: она портит все последующие сопоставления.'
  kind: open
  reference: 'Ограничение фиксируется явно: исход помечается как неизмеримый в этом прогоне, а вывод по нему не делается. Тихая замена на удобный исход сохраняет форму отчёта, но меняет вопрос, на который он отвечает: два отчёта выглядят одинаково и складываются в сравнение, хотя измеряют разные свойства. Явная пометка сохраняет честность сравнения — читатель видит, что именно осталось непроверенным.'
  id: 031-portable-benchmark-2
  fingerprint: ab9adc0e
