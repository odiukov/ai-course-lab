- concept: единица оценки полевого испытания — весь маршрут задачи до готового изменения, а не отдельная поверхность инструментария
  question: Все отдельные компоненты инженерного окружения агента проверены по отдельности и работают. Объясни своими словами, что ещё нужно проверить и по каким наблюдаемым следам судить о результате.
  explanation: Исправные компоненты по отдельности не гарантируют результат связки. Полевое испытание проверяет маршрут целиком и оставляет наблюдаемые следы, а не ощущения.
  kind: open
  reference: 'Нужно провести одну целую задачу по полному маршруту — от исходного запроса до готового изменения, доехавшего до продакшена. Оценивается не отдельный компонент и не удачный фрагмент, а весь путь. Судить следует по наблюдаемым следам: число падений, понадобились ли откаты и остался ли пакет материалов (состояние, результаты проверок, передача контекста), которым сможет воспользоваться следующая сессия. Впечатление «стало удобнее» следом не является.'
  id: 001-polevoi-test-2
