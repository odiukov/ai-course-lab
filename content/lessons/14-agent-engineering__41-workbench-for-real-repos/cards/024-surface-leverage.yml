- concept: 'поверхности образуют цепочку, где выход предыдущей становится входом следующей: граница, наблюдаемое изменение, свидетельство действия, сохранённый контекст'
  question: Расставь звенья цепочки верстака в порядке, в котором выход каждого становится входом следующего.
  explanation: 'Ценность рождается на стыках: без объявленных границ нечего классифицировать, без классификации нечего подтверждать свидетельством, без всего этого передавать следующей сессии нечего, кроме утверждений.'
  kind: order
  items:
    - Контракт области задаёт, какие поверхности разрешено трогать
    - Классификация изменений делает выход за границы наблюдаемым фактом
    - Свидетельство запуска связывает заявление о тестах с реально выполненным действием
    - Передача сохраняет границы, изменения и свидетельства для следующей сессии
