- concept: типизированный конверт ошибки делает исход машинопроверяемым, в отличие от свободного текста
  question: 'Требование задачи: при отказе валидации ручка возвращает ошибку в типизированном конверте, а не произвольным текстом. Что это даёт автоматической проверке приёмки?'
  explanation: 'Свободный текст ошибки нельзя сверить программно: любая правка формулировки ломает проверку либо проходит незамеченной. Фиксированная схема (код статуса + поле кода ошибки) превращает требование в предикат, который раннер вычисляет однозначно.'
  kind: choice
  options:
    - Проверка сравнивает код статуса и фиксированное машиночитаемое поле кода ошибки, поэтому результат не зависит от формулировки сообщения
    - Проверка становится быстрее, так как типизированный ответ короче по размеру тела
    - Проверка может пропустить запуск теста, потому что схема ответа сама гарантирует поведение
    - 'Проверка перестаёт нуждаться в коде статуса: достаточно текста сообщения'
  correct: 0
  id: 007-adapt-scope-1
  fingerprint: c6dc4560
- concept: 'граница правила валидации: отклоняются значения строго короче порога, порог допустим'
  question: 'Правило: пароль короче 12 символов отклоняется с ошибкой валидации. Какова наибольшая длина пароля, который по этому правилу будет отклонён?'
  explanation: '«Короче 12» значит длина < 12, то есть максимум 11. Пароль ровно в 12 символов проходит. Граничные значения (11 и 12) — обязательные точки теста: именно на них ошибаются реализации, использующие <= вместо <.'
  kind: numeric
  answer: 11
  tolerance: 0.5
  id: 007-adapt-scope-2
  fingerprint: 9f5eed0f
- concept: постановка задачи содержит требование доказательства, иначе выполненная половина неотличима от готовности
  question: Постановка задачи звучит не «добавить валидацию», а «добавить валидацию и тест, доказывающий новое поведение». Объясни своими словами, зачем требование доказательства выносят прямо в формулировку задачи.
  explanation: 'В формулировке два требования, и второе легко потерять. Именно поэтому среди исходов есть отдельный acceptance_met: без явного требования доказательства агент показывает первую половину и она выглядит как готовность.'
  kind: open
  reference: 'Требование, оставшееся неявным, не проверяется. Если в задаче написано только «добавить валидацию», исполнитель отчитывается кодом, а проверяющий не имеет объективного признака, что поведение действительно изменилось: приходится верить отчёту. Вынесенное в постановку требование теста задаёт наблюдаемый артефакт — конкретный тест на конкретный ответ при пароле ниже порога, — и приёмка становится проверкой факта, а не оценкой заявления. Побочный эффект: обе половины задачи фиксируются раздельно, поэтому сданная наполовину работа видна сразу.'
  id: 007-adapt-scope-3
  fingerprint: 481b8be5
