- concept: 'классификация полна и детерминирована: обход всего списка без раннего выхода, каждый путь ровно в одной группе'
  question: Расставь шаги классификации изменённых файлов относительно scope-контракта в правильном порядке.
  explanation: 'Ранний выход на первом нарушении оставляет остаток diff непроверенным, и объём выхода за границы становится неизвестен. Полный обход даёт инвариант: объединение двух групп равно входному списку, пересечение пусто — ни один файл не потерян и ни один не посчитан дважды.'
  kind: order
  items:
    - Взять очередной путь из полного списка изменённых файлов, сохраняя исходный порядок
    - Сопоставить путь с разрешёнными директориями по границе сегмента
    - 'Поместить путь ровно в одну из двух групп: внутри области или вне её'
    - Перейти к следующему пути, не прерывая обход на первом найденном нарушении
