- concept: свидетельство прогона состоит из проверяемых деталей запуска, а не из утверждения о результате
  question: Какая запись о приёмке годится как свидетельство прогона, а не как заявление исполнителя?
  explanation: Свидетельство называет выполненную команду, код завершения и вывод — эти детали можно перепроверить и передать дальше. Остальные формулировки требуют поверить автору на слово и не различают «запускал» и «уверен, что работает».
  kind: choice
  options:
    - «Все тесты зелёные, можно мержить»
    - «Проверил вручную, поведение корректное»
    - '«Выполнена команда `pytest -q`; код завершения 0; вывод: 5 passed»'
    - «Реализация соответствует требованиям задачи»
  correct: 2
  id: 011-test-evidence-1
  fingerprint: 270f35c6
- concept: 'признаки исхода должны быть согласованы: текст результата не может противоречить коду завершения'
  question: 'Симулятор вернул запись: код завершения 2, текст вывода — «все проверки пройдены». Что не так с такой записью?'
  explanation: 'Код завершения — машиночитаемый признак исхода: нулевой означает успех, любой другой — сбой. Сценарий обязан выдавать согласованный набор признаков, иначе следующие проверки пайплайна получат запись, из которой каждый читатель извлечёт свой вывод.'
  kind: choice
  options:
    - 'Ничего: текст вывода информативнее числа и его достаточно'
    - Признаки исхода противоречат друг другу, и по такой записи нельзя определить результат прогона
    - Проблема только в том, что код завершения не приведён к строке
    - 'Ничего: ненулевой код означает лишь предупреждения, а не сбой'
  correct: 1
  id: 011-test-evidence-2
  fingerprint: ab66cae6
- concept: симуляция прогона проверяет способность пайплайна работать со следом запуска, а не исправность самого проекта
  question: Учебный пайплайн не выполняет реальных системных команд, а симулирует прогон тестов. Объясни своими словами, что такая симуляция доказывает, а что не доказывает.
  explanation: Разделение «что симулируем» и «что проверяем» — ключевое. Мы симулируем не успешность тестов, а форму свидетельства, по которой успех или сбой распознаётся дальнейшими шагами верстака.
  kind: open
  reference: 'Симуляция не доказывает, что код проекта исправен: реального запуска не было, и приборы показывают заранее выбранный сценарий. Она доказывает более узкую вещь — что пайплайн умеет производить и потреблять след запуска (команда, код завершения, вывод) и отличать его от голословного «готово». Проверяется механика верификации, а не состояние кода.'
  id: 011-test-evidence-3
  fingerprint: f1bd85c0
