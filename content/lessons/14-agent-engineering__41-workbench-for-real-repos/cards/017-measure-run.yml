- concept: сборщик записи переносит внешнее свидетельство как есть и не пересчитывает его из своих полей
  question: Функция, собирающая запись прогона, получает итоговую оценку ревьюера. Как с ней поступить?
  explanation: Качественная оценка ценна ровно тем, что добавляет взгляд поверх автоматических проверок. Пересчёт превратил бы её в копию тех же данных, а отбрасывание расхождения уничтожило бы самый интересный сигнал — место, где ревьюер видит то, чего шлюз не ловит.
  kind: choice
  options:
    - Пересчитать из остальных полей записи, чтобы запись была внутренне согласованной.
    - 'Перенести в поле как есть: это независимое свидетельство, а не производная от машинных проверок.'
    - Отбросить, если она противоречит машинным исходам.
  correct: 1
  id: 017-measure-run-1
  fingerprint: cea0bde7
- concept: 'поле-список сохраняет тип при отсутствии находок: пустой список вместо None'
  question: Заполни пропуск так, чтобы поле списка нарушений имело один и тот же тип независимо от того, нашлись нарушения или нет.
  explanation: Отсутствие нарушений — это пустой список, а не отсутствие значения. Иначе каждый потребитель записи обязан писать проверку на None, и рано или поздно кто-то прочтёт None как «границы вообще не проверяли».
  kind: cloze
