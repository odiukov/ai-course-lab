<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Матрица результатов двух прогонов</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f7f8fb;
  --surface: #ffffff;
  --ink: #172033;
  --muted: #596579;
  --grid: #c8cfda;
  --stub: #f1f4f8;
  --focus: #e6efff;
  --focus-line: #3975d6;
  --prompt-head: #e9edf3;
  --workbench-head: #d9f3ea;
  --bad-cell: #fff1ef;
  --bad-band: #c7473b;
  --bad-ink: #9d2d25;
  --good-cell: #eaf8f1;
  --good-band: #16845d;
  --good-ink: #086746;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #111722;
    --surface: #171e2b;
    --ink: #edf2fa;
    --muted: #aeb9ca;
    --grid: #465166;
    --stub: #202938;
    --focus: #1d3150;
    --focus-line: #73a7ff;
    --prompt-head: #293243;
    --workbench-head: #173d34;
    --bad-cell: #3b2528;
    --bad-band: #f0786f;
    --bad-ink: #ffaaa3;
    --good-cell: #17372f;
    --good-band: #54d2a6;
    --good-ink: #8be7c7;
  }
}
html,
body {
  margin: unset;
  background: var(--page);
  color: var(--ink);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main {
  background: var(--surface);
}
h1 {
  margin: unset;
  font-size: 20px;
  font-weight: bold;
  color: var(--ink);
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 520px;
  background: var(--surface);
  color: var(--ink);
  shape-rendering: geometricPrecision;
}
text {
  fill: currentColor;
}
.header-kicker {
  font-size: 12px;
  font-weight: bold;
  fill: var(--muted);
  letter-spacing: .08em;
}
.header-name {
  font-size: 19px;
  font-weight: bold;
}
.row-key {
  font-size: 16px;
  font-weight: bold;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.row-help,
.cell-detail,
.legend-text {
  font-size: 13px;
  fill: var(--muted);
}
.cell-value {
  font-size: 17px;
  font-weight: bold;
}
.marker {
  font-size: 22px;
  font-weight: bold;
  text-anchor: middle;
}
.bad {
  fill: var(--bad-ink);
}
.good {
  fill: var(--good-ink);
}
.stub-regular {
  fill: var(--stub);
}
.stub-evidence {
  fill: var(--focus);
}
.focus-strip {
  fill: var(--focus-line);
}
.prompt-header {
  fill: var(--prompt-head);
}
.workbench-header {
  fill: var(--workbench-head);
}
.bad-cell {
  fill: var(--bad-cell);
}
.good-cell {
  fill: var(--good-cell);
}
.bad-band {
  fill: var(--bad-band);
}
.good-band {
  fill: var(--good-band);
}
.grid {
  stroke: var(--grid);
  stroke-width: 1px;
  vector-effect: non-scaling-stroke;
}
.outer-grid {
  stroke: var(--grid);
  stroke-width: 2px;
  vector-effect: non-scaling-stroke;
}
.footer-rule {
  stroke: var(--grid);
  stroke-width: 1px;
  vector-effect: non-scaling-stroke;
}
.compare-note {
  font-size: 14px;
  font-weight: bold;
  fill: var(--focus-line);
}
.fallback-title {
  font-size: 20px;
  font-weight: bold;
}
.fallback-copy {
  font-size: 16px;
  fill: var(--muted);
}
</style>
</head>
<body>
<main>
  <h1>Матрица результатов двух прогонов</h1>
  <svg id="matrix" viewBox="0 0 1200 456" width="1200" height="456"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Сравнение прогонов prompt-only и workbench</title>
    <desc id="svg-description">Пять одинаковых полей measure_run показывают различия между двумя пайплайнами.</desc>
    <g id="drawing"></g>
    <noscript>
      Для схемы требуется JavaScript. Она сравнивает prompt-only и workbench по пяти полям:
      tests_actually_run, acceptance_met, files_outside_scope, handoff_quality и reviewer_total.
    </noscript>
  </svg>
</main>
<script>
const data = [
  {
    kind: "header",
    y1: 18, y2: 80,
    stub: { x1: 36, x2: 470, focusEnd: 44, textX: 56 },
    prompt: {
      x1: 470, x2: 815, bandEnd: 478,
      centerX: 642, markerX: 500, valueX: 534, detailX: 534
    },
    workbench: {
      x1: 815, x2: 1164, bandEnd: 823,
      centerX: 990, markerX: 845, valueX: 879, detailX: 879
    },
    kickerY: 43, nameY: 66
  },
  {
    kind: "row",
    y1: 80, y2: 144, valueY: 108, detailY: 130,
    key: "tests_actually_run",
    help: "Есть свидетельство реального запуска?",
    stubTone: "evidence",
    prompt: { mark: "×", value: "нет", detail: "запуск не подтверждён", tone: "bad" },
    workbench: { mark: "✓", value: "да", detail: "есть команда и вывод", tone: "good" }
  },
  {
    kind: "row",
    y1: 144, y2: 208, valueY: 172, detailY: 194,
    key: "acceptance_met",
    help: "Выполнен тест, доказывающий требование?",
    stubTone: "evidence",
    prompt: { mark: "×", value: "нет", detail: "нужный тест не выполнен", tone: "bad" },
    workbench: { mark: "✓", value: "да", detail: "выполнен нужный тест", tone: "good" }
  },
  {
    kind: "row",
    y1: 208, y2: 272, valueY: 236, detailY: 258,
    key: "files_outside_scope",
    help: "Есть изменения вне разрешённой области?",
    stubTone: "regular",
    prompt: { mark: "×", value: "есть", detail: "обнаружен лишний файл", tone: "bad" },
    workbench: { mark: "✓", value: "нет", detail: "границы соблюдены", tone: "good" }
  },
  {
    kind: "row",
    y1: 272, y2: 336, valueY: 300, detailY: 322,
    key: "handoff_quality",
    help: "Сможет ли следующая сессия продолжить?",
    stubTone: "regular",
    prompt: { mark: "×", value: "низкое", detail: "контекст теряется", tone: "bad" },
    workbench: { mark: "✓", value: "высокое", detail: "можно продолжить", tone: "good" }
  },
  {
    kind: "row",
    y1: 336, y2: 400, valueY: 364, detailY: 386,
    key: "reviewer_total",
    help: "Итоговая качественная оценка ревьюера",
    stubTone: "regular",
    prompt: { mark: "×", value: "низкий", detail: "результат не принят", tone: "bad" },
    workbench: { mark: "✓", value: "высокий", detail: "результат принят", tone: "good" }
  },
  {
    kind: "footer",
    tableBottom: 400, ruleY: 416, baselineY: 440,
    badMarkX: 56, badTextX: 80,
    goodMarkX: 350, goodTextX: 375,
    noteX: 1164
  }
];

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("matrix");
const drawing = document.getElementById("drawing");
const namespace = "http://www.w3.org/2000/svg";

function make(tag, attributes, content) {
  const element = document.createElementNS(namespace, tag);
  for (const [name, value] of Object.entries(attributes)) {
    element.setAttribute(name, String(value));
  }
  if (content !== undefined) element.textContent = content;
  return element;
}

function addRect(parent, box, className) {
  parent.append(make("rect", {
    x: sx(box.x1),
    y: sy(box.y1),
    width: sx(box.x2) - sx(box.x1),
    height: sy(box.y2) - sy(box.y1),
    class: className
  }));
}

function addLine(parent, x1, y1, x2, y2, className) {
  parent.append(make("line", {
    x1: sx(x1), y1: sy(y1),
    x2: sx(x2), y2: sy(y2),
    class: className
  }));
}

function addText(parent, x, y, content, className, anchor) {
  parent.append(make("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor
  }, content));
}

function renderCell(parent, column, row, result) {
  addRect(parent, {
    x1: column.x1, y1: row.y1,
    x2: column.x2, y2: row.y2
  }, result.tone + "-cell");

  addRect(parent, {
    x1: column.x1, y1: row.y1,
    x2: column.bandEnd, y2: row.y2
  }, result.tone + "-band");

  addText(parent, column.markerX, row.valueY, result.mark,
    "marker " + result.tone, "middle");
  addText(parent, column.valueX, row.valueY, result.value,
    "cell-value " + result.tone, "start");
  addText(parent, column.detailX, row.detailY, result.detail,
    "cell-detail", "start");
}

function build() {
  const [header, ...entries] = data;
  const rows = entries.filter(entry => entry.kind === "row");
  const footer = entries.find(entry => entry.kind === "footer");

  addRect(drawing, {
    x1: header.stub.x1, y1: header.y1,
    x2: header.stub.x2, y2: header.y2
  }, "stub-regular");
  addRect(drawing, {
    x1: header.prompt.x1, y1: header.y1,
    x2: header.prompt.x2, y2: header.y2
  }, "prompt-header");
  addRect(drawing, {
    x1: header.workbench.x1, y1: header.y1,
    x2: header.workbench.x2, y2: header.y2
  }, "workbench-header");

  addText(drawing, header.stub.textX, header.kickerY,
    "ЗАПИСЬ ПРОГОНА", "header-kicker", "start");
  addText(drawing, header.stub.textX, header.nameY,
    "поле measure_run", "header-name", "start");
  addText(drawing, header.prompt.centerX, header.kickerY,
    "ПАЙПЛАЙН", "header-kicker", "middle");
  addText(drawing, header.prompt.centerX, header.nameY,
    "prompt-only", "header-name", "middle");
  addText(drawing, header.workbench.centerX, header.kickerY,
    "ПАЙПЛАЙН", "header-kicker", "middle");
  addText(drawing, header.workbench.centerX, header.nameY,
    "workbench", "header-name", "middle");

  for (const row of rows) {
    addRect(drawing, {
      x1: header.stub.x1, y1: row.y1,
      x2: header.stub.x2, y2: row.y2
    }, "stub-" + row.stubTone);

    if (row.stubTone === "evidence") {
      addRect(drawing, {
        x1: header.stub.x1, y1: row.y1,
        x2: header.stub.focusEnd, y2: row.y2
      }, "focus-strip");
    }

    addText(drawing, header.stub.textX, row.valueY,
      row.key, "row-key", "start");
    addText(drawing, header.stub.textX, row.detailY,
      row.help, "row-help", "start");

    renderCell(drawing, header.prompt, row, row.prompt);
    renderCell(drawing, header.workbench, row, row.workbench);
    addLine(drawing, header.stub.x1, row.y2,
      header.workbench.x2, row.y2, "grid");
  }

  addLine(drawing, header.stub.x1, header.y1,
    header.workbench.x2, header.y1, "outer-grid");
  addLine(drawing, header.stub.x1, header.y2,
    header.workbench.x2, header.y2, "outer-grid");
  addLine(drawing, header.stub.x1, header.y1,
    header.stub.x1, footer.tableBottom, "outer-grid");
  addLine(drawing, header.stub.x2, header.y1,
    header.stub.x2, footer.tableBottom, "grid");
  addLine(drawing, header.prompt.x2, header.y1,
    header.prompt.x2, footer.tableBottom, "grid");
  addLine(drawing, header.workbench.x2, header.y1,
    header.workbench.x2, footer.tableBottom, "outer-grid");

  addLine(drawing, header.stub.x1, footer.ruleY,
    header.workbench.x2, footer.ruleY, "footer-rule");
  addText(drawing, footer.badMarkX, footer.baselineY,
    "×", "marker bad", "middle");
  addText(drawing, footer.badTextX, footer.baselineY,
    "проблема или нет свидетельства", "legend-text", "start");
  addText(drawing, footer.goodMarkX, footer.baselineY,
    "✓", "marker good", "middle");
  addText(drawing, footer.goodTextX, footer.baselineY,
    "проверяемый результат", "legend-text", "start");
  addText(drawing, footer.noteX, footer.baselineY,
    "Сравнивай одинаковые строки поперёк →",
    "compare-note", "end");
}

try {
  build();
} catch (error) {
  drawing.replaceChildren();
  addText(drawing, 60, 176,
    "Матрица результатов двух прогонов",
    "fallback-title", "start");
  addText(drawing, 60, 214,
    "prompt-only и workbench сравниваются по пяти полям:",
    "fallback-copy", "start");
  addText(drawing, 60, 250,
    "tests_actually_run · acceptance_met · files_outside_scope",
    "fallback-copy", "start");
  addText(drawing, 60, 286,
    "handoff_quality · reviewer_total",
    "fallback-copy", "start");
}
</script>
</body>
</html>
