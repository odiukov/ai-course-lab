<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Как читать матрицу ошибок</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --ink: #172033;
      --muted: #586174;
      --grid: #8791a5;
      --axis: #344258;
      --correct-fill: #dff4e7;
      --correct-ink: #17633a;
      --error-fill: #ffead9;
      --error-ink: #9a3f16;
      --guide-fill: #eef2f8;
      --guide-line: #c9d1df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111620;
        --surface: #171e2b;
        --ink: #edf2fb;
        --muted: #b5bfd0;
        --grid: #8793a8;
        --axis: #c8d2e2;
        --correct-fill: #163d2b;
        --correct-ink: #8ce0ad;
        --error-fill: #482719;
        --error-ink: #ffc19b;
        --guide-fill: #202a3a;
        --guide-line: #465269;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .frame {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      background: var(--surface);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 6px;
      font-size: 22px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
    }

    .axis-line {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: var(--axis);
    }

    .axis-title {
      font-size: 16px;
      font-weight: bold;
      fill: var(--axis);
    }

    .category {
      font-size: 15px;
      font-weight: bold;
      fill: var(--muted);
    }

    .cell {
      stroke: var(--grid);
      stroke-width: 2;
    }

    .correct {
      fill: var(--correct-fill);
    }

    .error {
      fill: var(--error-fill);
    }

    .code {
      font-size: 20px;
      font-weight: bold;
    }

    .correct-text {
      fill: var(--correct-ink);
    }

    .error-text {
      fill: var(--error-ink);
    }

    .value {
      font-size: 32px;
      font-weight: bold;
    }

    .meaning {
      font-size: 14px;
      fill: var(--muted);
    }

    .total {
      font-size: 15px;
      font-weight: bold;
      fill: var(--muted);
    }

    .guide {
      fill: var(--guide-fill);
      stroke: var(--guide-line);
      stroke-width: 2;
    }

    .guide-main {
      font-size: 15px;
      font-weight: bold;
    }

    .guide-note {
      font-size: 14px;
      fill: var(--muted);
    }

    .legend-correct {
      fill: var(--correct-ink);
    }

    .legend-error {
      fill: var(--error-ink);
    }

    #fallback {
      margin: 0;
      padding: 20px;
      font-size: 16px;
      color: var(--ink);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Как читать матрицу ошибок</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 500"
      width="960"
      height="500"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Матрица ошибок для ста писем</title>
      <desc id="svg-description">
        Строки показывают реальный класс письма, столбцы — прогноз фильтра.
        В клетках указаны TP 6, FN 4, FP 2 и TN 88.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden></p>
  </main>

  <script>
    const diagramData = Object.freeze([
      {
        kind: "layout",
        originX: 48,
        originY: 18,
        scale: 1,
        matrixLeft: 282,
        matrixMiddleX: 502,
        matrixRight: 722,
        matrixTop: 112,
        matrixMiddleY: 222,
        matrixBottom: 332,
        predictedArrowY: 54,
        predictedTitleY: 18,
        columnLabelY: 88,
        actualTitleX: 0,
        actualTitleY: 82,
        actualArrowX: 230,
        rowLabelX: 208,
        topRowCenterY: 167,
        bottomRowCenterY: 277,
        arrowHead: 8,
        corner: 10,
        totalX: 864,
        totalY: 20,
        guideLeft: 22,
        guideRight: 864,
        guideTop: 370,
        guideBottom: 458,
        guideCorner: 12,
        firstGuideX: 54,
        secondGuideX: 462,
        guideMainY: 400,
        guideNoteY: 428,
        dotRadius: 6,
        firstDotX: 38,
        secondDotX: 446,
        labelPad: 12
      },
      {
        kind: "cell",
        code: "TP",
        value: 6,
        meaning: "спам распознан",
        x1: 282,
        y1: 112,
        x2: 502,
        y2: 222,
        centerX: 392,
        codeY: 142,
        valueY: 180,
        meaningY: 205,
        tone: "correct"
      },
      {
        kind: "cell",
        code: "FN",
        value: 4,
        meaning: "спам пропущен",
        x1: 502,
        y1: 112,
        x2: 722,
        y2: 222,
        centerX: 612,
        codeY: 142,
        valueY: 180,
        meaningY: 205,
        tone: "error"
      },
      {
        kind: "cell",
        code: "FP",
        value: 2,
        meaning: "ложная тревога",
        x1: 282,
        y1: 222,
        x2: 502,
        y2: 332,
        centerX: 392,
        codeY: 252,
        valueY: 290,
        meaningY: 315,
        tone: "error"
      },
      {
        kind: "cell",
        code: "TN",
        value: 88,
        meaning: "обычное письмо",
        x1: 502,
        y1: 222,
        x2: 722,
        y2: 332,
        centerX: 612,
        codeY: 252,
        valueY: 290,
        meaningY: 315,
        tone: "correct"
      }
    ]);

    const [layout, ...cells] = diagramData;
    const origin = Object.freeze({ x: layout.originX, y: layout.originY });
    const scale = layout.scale;
    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, parent = drawing) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const addText = (content, x, y, className, anchor = "middle") => {
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        });
        node.textContent = content;
        return node;
      };

      const addRect = (x1, y1, x2, y2, className, radius) => {
        return make("rect", {
          x: sx(x1),
          y: sy(y1),
          width: sx(x2) - sx(x1),
          height: sy(y2) - sy(y1),
          rx: sx(radius) - sx(0),
          ry: sy(radius) - sy(0),
          class: className
        });
      };

      const addHorizontalArrow = (x1, y, x2, head, className) => {
        make("line", {
          x1: sx(x1),
          y1: sy(y),
          x2: sx(x2),
          y2: sy(y),
          class: className
        });
        make("polygon", {
          points: [
            [sx(x2), sy(y)],
            [sx(x2 - head), sy(y - head)],
            [sx(x2 - head), sy(y + head)]
          ].map((point) => point.join(",")).join(" "),
          class: className
        });
      };

      const addVerticalArrow = (x, y1, y2, head, className) => {
        make("line", {
          x1: sx(x),
          y1: sy(y1),
          x2: sx(x),
          y2: sy(y2),
          class: className
        });
        make("polygon", {
          points: [
            [sx(x), sy(y2)],
            [sx(x - head), sy(y2 - head)],
            [sx(x + head), sy(y2 - head)]
          ].map((point) => point.join(",")).join(" "),
          class: className
        });
      };

      addText(
        "ПРОГНОЗ МОДЕЛИ · predicted",
        layout.matrixMiddleX,
        layout.predictedTitleY,
        "axis-title"
      );

      addHorizontalArrow(
        layout.matrixLeft,
        layout.predictedArrowY,
        layout.matrixRight,
        layout.arrowHead,
        "axis-line"
      );

      addText(
        "Положительный: спам",
        layout.matrixLeft + (layout.matrixMiddleX - layout.matrixLeft) / layout.scale / (layout.scale + layout.scale),
        layout.columnLabelY,
        "category"
      );

      addText(
        "Отрицательный: не спам",
        layout.matrixMiddleX + (layout.matrixRight - layout.matrixMiddleX) / layout.scale / (layout.scale + layout.scale),
        layout.columnLabelY,
        "category"
      );

      addText(
        "РЕАЛЬНОСТЬ · actual",
        layout.actualTitleX,
        layout.actualTitleY,
        "axis-title",
        "start"
      );

      addVerticalArrow(
        layout.actualArrowX,
        layout.matrixTop,
        layout.matrixBottom,
        layout.arrowHead,
        "axis-line"
      );

      addText(
        "Положительный: спам",
        layout.rowLabelX,
        layout.topRowCenterY,
        "category",
        "end"
      );

      addText(
        "Отрицательный: не спам",
        layout.rowLabelX,
        layout.bottomRowCenterY,
        "category",
        "end"
      );

      addText(
        "Всего: 100 писем",
        layout.totalX,
        layout.totalY,
        "total",
        "end"
      );

      cells.forEach((cell) => {
        const textTone =
          cell.tone === "correct" ? "correct-text" : "error-text";

        addRect(
          cell.x1,
          cell.y1,
          cell.x2,
          cell.y2,
          `cell ${cell.tone}`,
          layout.corner
        );

        addText(
          cell.code,
          cell.centerX,
          cell.codeY,
          `code ${textTone}`
        );

        addText(
          String(cell.value),
          cell.centerX,
          cell.valueY,
          `value ${textTone}`
        );

        addText(
          cell.meaning,
          cell.centerX,
          cell.meaningY,
          "meaning"
        );
      });

      addRect(
        layout.guideLeft,
        layout.guideTop,
        layout.guideRight,
        layout.guideBottom,
        "guide",
        layout.guideCorner
      );

      make("circle", {
        cx: sx(layout.firstDotX),
        cy: sy(layout.guideMainY - layout.labelPad),
        r: sx(layout.dotRadius) - sx(0),
        class: "legend-correct"
      });

      addText(
        "Сначала выбери строку",
        layout.firstGuideX,
        layout.guideMainY,
        "guide-main",
        "start"
      );

      addText(
        "строка = реальность (actual)",
        layout.firstGuideX,
        layout.guideNoteY,
        "guide-note",
        "start"
      );

      make("circle", {
        cx: sx(layout.secondDotX),
        cy: sy(layout.guideMainY - layout.labelPad),
        r: sx(layout.dotRadius) - sx(0),
        class: "legend-error"
      });

      addText(
        "Затем выбери столбец",
        layout.secondGuideX,
        layout.guideMainY,
        "guide-main",
        "start"
      );

      addText(
        "столбец = прогноз (predicted)",
        layout.secondGuideX,
        layout.guideNoteY,
        "guide-note",
        "start"
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Матрица ошибок для 100 писем: TP — 6, FP — 2, FN — 4, TN — 88. Строки показывают реальность (actual), столбцы — прогноз модели (predicted).";
    }
  </script>
</body>
</html>
