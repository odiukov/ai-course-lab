- concept: невыпуклая поверхность MSE после сигмоиды может содержать локальные минимумы
  question: Объясните своими словами, почему невыпуклость функции потерь, возникающая при сочетании MSE и сигмоиды, мешает градиентной оптимизации логистической регрессии.
  explanation: Выпуклая поверхность ведёт к единственному глобальному минимуму, а невыпуклая может иметь несколько впадин. Поскольку оптимизатор ориентируется на локальный градиент, он не гарантирует нахождение самой глубокой из них.
  kind: open
  reference: На невыпуклой поверхности могут существовать локальные минимумы. Градиентный метод использует только наклон в текущей окрестности, поэтому способен прийти в локальный минимум и остановиться, хотя в другой области пространства весов значение ошибки ниже.
