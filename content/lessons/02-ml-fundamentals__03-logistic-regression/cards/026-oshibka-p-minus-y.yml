- concept: модуль разности p − y выражает размер промаха модели
  question: Объект A относится к положительному классу, и модель дала ему вероятность 0,93. Объект B относится к отрицательному классу, но получил вероятность положительного класса 0,46. У какого объекта модуль p − y больше и что это означает?
  explanation: Для объекта A разность равна −0,07, а для объекта B — +0,46. Модуль второй разности больше, поэтому промах на объекте B сильнее; положительный знак также показывает, что вероятность положительного класса завышена.
  kind: open
  reference: 'У объекта B: модуль его сигнала равен 0,46, тогда как у объекта A — 0,07. Значит, предсказание для объекта B дальше от правильной цели и даёт более сильный сигнал для коррекции.'
