- concept: наклон линейной границы определяется отношением весов признаков
  question: Выразите вертикальную координату границы через горизонтальную.
  explanation: После переноса остальных слагаемых и деления на d коэффициент при u равен -a/d. Поэтому соотношение весов a и d задаёт наклон границы.
  kind: cloze
  template: Если выражение a·u + d·v + c обращается в ноль, то v = ___
  answer: -(a/d)·u - c/d
  accept:
    - -a·u/d - c/d
    - (-a·u-c)/d
  id: 017-lineynaya-granica-1
  fingerprint: 767dd787
- concept: полиномиальные признаки позволяют получить нелинейную границу в исходном пространстве
  question: Один класс образует компактную область, а другой окружает её кольцом. Как можно адаптировать логистическую регрессию к такой структуре данных?
  explanation: На исходных признаках модель располагает только прямой границей, которая не отделит центр от окружающего кольца. Полиномиальный признак расстояния позволяет провести линейный порог в расширенном пространстве, соответствующий кривой границе на исходной плоскости.
  kind: choice
  options:
    - Добавить признак, равный квадрату расстояния до центра, и обучить модель на расширенных признаках
    - Только увеличить число эпох обучения на исходных признаках
    - Заменить сигмоиду сравнением линейного балла с порогом
