- concept: loss, записанный в конце эпохи, относится к уже обновлённым параметрам
  question: В цикле обучения сначала накапливают градиенты, затем обновляют параметры и только после этого вычисляют loss. Какой результат попадёт в историю первым?
  explanation: Функция потерь вызывается после градиентного шага, поэтому первая запись характеризует уже обновлённые веса и смещение. Исходный loss в историю не попадает, если его не вычислить отдельно до обучения.
  kind: choice
  options:
    - Loss до первого обновления параметров
    - Loss после первого обновления параметров
    - Loss только для последнего объекта выборки
    - Loss на тестовой выборке
  correct: 1
  id: 031-cikl-obucheniya-1
  fingerprint: 97f5c5af
- concept: накопители градиентов необходимо обнулять перед каждой эпохой
  question: Объясни своими словами, почему накопители градиентов весов и смещения обнуляют в начале каждой эпохи.
  explanation: Накопители нужны лишь для суммирования вкладов объектов внутри одного прохода по выборке. После обновления параметров прежняя сумма больше не является градиентом в текущей точке.
  kind: open
  reference: Каждая эпоха должна вычислять градиент функции потерь при текущих параметрах. Если не очистить накопители, к новому градиенту примешаются значения из предыдущих эпох, рассчитанные при других параметрах, и получится непредусмотренный шаг обновления.
  id: 031-cikl-obucheniya-2
  fingerprint: b11320c3
- concept: слишком большой learning rate может мешать снижению loss
  question: Во время обучения loss сильно колеблется и не показывает устойчивого снижения. Какое изменение learning rate разумно попробовать первым?
  explanation: Слишком большой learning rate способен перебрасывать параметры через область минимума. Меньший шаг обычно делает движение по градиенту осторожнее и стабильнее.
  kind: choice
  options:
    - Увеличить learning rate
    - Уменьшить learning rate
    - Заменить learning rate порогом классификации
    - Перестать обновлять смещение
  correct: 1
  id: 031-cikl-obucheniya-3
  fingerprint: ea3151b6
