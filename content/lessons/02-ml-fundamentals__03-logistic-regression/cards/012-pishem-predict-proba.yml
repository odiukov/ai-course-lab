- concept: порядок вероятностей predict_proba соответствует порядку входных объектов
  question: Что произойдёт с результатом predict_proba, если переставить строки матрицы X, не изменяя значения внутри строк?
  explanation: Каждая вероятность вычисляется только по признакам соответствующей строки. Перестановка строк меняет позиции результатов, но не значения вероятностей для самих объектов.
  kind: open
  reference: Вероятности переставятся в том же порядке, что и строки X. Сама вероятность каждого объекта останется прежней.
