- concept: фиксированный seed делает псевдослучайную генерацию воспроизводимой
  question: Что обеспечивает фиксированный seed при генерации учебных данных?
  explanation: Вызов random.seed(42) задаёт начальное состояние генератора. При одинаковом коде последующие запуски создадут те же точки, но сами точки по-прежнему будут иметь случайный разброс.
  kind: choice
  options:
    - Повторение той же последовательности псевдослучайных значений при неизменном порядке вызовов
    - Полное устранение случайного разброса точек
    - Гарантированное отсутствие выбросов и пересечения классов
