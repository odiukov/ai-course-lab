- concept: разнесённые центры случайных облаков не гарантируют идеальную разделимость каждой реализации
  question: Два класса генерируются нормальными распределениями с заметно разнесёнными центрами. Почему из этого не следует, что любая полученная выборка будет идеально разделяться прямой?
  explanation: Центры (2, 2) и (5, 5) делают хорошее линейное разделение вероятным, но случайные гауссовские отклонения не ограничены жёсткой границей. Разнесение центров не является доказательством идеальной разделимости.
  kind: open
  reference: Нормальное распределение допускает сколь угодно большие отклонения от центра. Поэтому отдельные точки могут попасть в область другого облака или создать выбросы, мешающие идеальному линейному разделению.
