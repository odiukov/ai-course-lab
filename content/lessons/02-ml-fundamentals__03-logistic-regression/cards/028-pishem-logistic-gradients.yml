- concept: градиенты вычисляются по текущим параметрам до выполнения шага обновления
  question: Расположите действия одной итерации градиентного спуска для логистической регрессии в правильном порядке.
  explanation: Сначала выполняется прямой проход, затем по его результатам вычисляются ошибки и градиенты. Только после этого параметры изменяются шагом градиентного спуска.
  kind: order
  items:
    - Вычислить вероятности p = sigmoid(Xw + b) при текущих параметрах
    - Получить ошибки p - y
    - Вычислить dw и db по ошибкам
    - Обновить w и b в направлении, противоположном градиентам
  id: 028-pishem-logistic-gradients-2
  fingerprint: 455659c7
