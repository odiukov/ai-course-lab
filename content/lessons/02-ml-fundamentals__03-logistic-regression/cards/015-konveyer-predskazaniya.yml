- concept: сигмоида является нелинейным звеном между линейным баллом и вероятностью
  question: Какая часть логистической регрессии нелинейно преобразует уже вычисленный линейный балл?
  explanation: Линейная часть формирует балл z, а нелинейная сигмоида преобразует его в p = 1/(1+e^-z).
  kind: choice
  options:
