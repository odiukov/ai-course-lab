- concept: выбор precision при высокой цене ложных положительных срабатываний
  question: Система автоматически блокирует учётные записи, которые считает мошенническими. Ошибочная блокировка добросовестного клиента обходится особенно дорого. Какую метрику положительных предсказаний следует улучшать в первую очередь?
  explanation: Precision показывает, какая доля заблокированных учётных записей действительно мошенническая. Чем выше precision, тем меньше добросовестных клиентов попадает под ошибочную блокировку.
  kind: choice
  options:
    - Recall
    - Precision
    - Accuracy
    - Долю положительных объектов в данных
  correct: 1
  id: 036-metriki-kak-diagnoz-1
  fingerprint: 06cec1f5
- concept: выбор recall при высокой цене пропуска положительного случая
  question: Система скрининга редкого заболевания показывает высокую accuracy, но пропускает значительную часть больных. Почему accuracy здесь недостаточно и какую метрику нужно считать приоритетной?
  explanation: Accuracy объединяет результаты по обоим классам, поэтому доминирующий отрицательный класс может замаскировать плохое обнаружение редкого положительного класса. Recall напрямую учитывает пропущенные положительные случаи через FN.
  kind: open
  reference: 'При редком заболевании высокая accuracy может получаться главным образом за счёт правильных ответов для здорового большинства и скрывать пропуски больных. Если особенно опасны ложные отрицательные ответы, приоритетен recall: он показывает, какую долю всех действительно больных обнаружила система.'
  id: 036-metriki-kak-diagnoz-2
  fingerprint: 0282d679
- concept: вычисление F1 по элементам confusion matrix
  question: На тестовой выборке модель получила TP = 48, FP = 12 и FN = 24. Чему равен F1?
  explanation: 'Precision равен 48 / 60 = 0.8, а recall — 48 / 72 ≈ 0.667. Их гармоническое среднее даёт F1 ≈ 0.727: итоговая оценка учитывает и ложные тревоги, и пропуски.'
  kind: numeric
  answer: 0.727
  tolerance: 0.002
  id: 036-metriki-kak-diagnoz-3
