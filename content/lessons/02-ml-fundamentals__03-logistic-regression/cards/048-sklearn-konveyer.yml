- concept: параметры масштабирования оценивают только по обучающей выборке, а тестовую выборку преобразуют с теми же параметрами
  question: Расположите операции рабочего конвейера бинарной классификации в правильном порядке.
  explanation: Среднее и разброс вычисляют только по обучающим данным. Тестовую часть преобразуют с сохранёнными параметрами scaler, чтобы не допустить утечки информации и честно оценить модель.
  kind: order
  items:
    - Разделить исходные данные на обучающую и тестовую части
    - Настроить StandardScaler на обучающих признаках и преобразовать их
    - Преобразовать тестовые признаки уже настроенным StandardScaler
    - Обучить LogisticRegression на масштабированных обучающих данных
    - Получить предсказания для масштабированных тестовых данных
  id: 048-sklearn-konveyer-1
  fingerprint: e9f558b1
- concept: стандартизация признаков разных масштабов улучшает условия оптимизации логистической регрессии
  question: Один признак принимает значения порядка тысяч, а другой — порядка сотых долей. Зачем стандартизировать их перед обучением LogisticRegression?
  explanation: StandardScaler центрирует каждый признак и нормирует его разброс. Без этого признаки сильно разных масштабов создают плохо согласованные направления оптимизации, из-за чего обучение может идти медленнее.
  kind: choice
  options:
    - Чтобы привести градиентные шаги по разным признакам к сопоставимому масштабу и ускорить обучение
    - Чтобы автоматически сделать классы одинаковыми по размеру
    - Чтобы заменить линейную границу решения нелинейной
    - Чтобы выход модели всегда был целочисленной меткой
  correct: 0
  id: 048-sklearn-konveyer-2
  fingerprint: 35165b81
