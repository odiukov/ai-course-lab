- concept: вычисление сигмоиды по заданному линейному баллу
  question: Линейный балл равен z = 3. Чему примерно равна sigmoid(z)?
  explanation: sigmoid(3) = 1 / (1 + e^(−3)). Поскольку e^(−3) ≈ 0,0498, результат равен примерно 0,953.
  kind: numeric
  answer: 0.953
  tolerance: 0.005
  id: 006-sigmoida-2
  fingerprint: 7d6d5de0
- concept: сигмоида сохраняет порядок линейных баллов
  question: Объясни своими словами, почему большему линейному баллу всегда соответствует большее значение сигмоиды.
  explanation: 'Сигмоида сжимает шкалу, но не переставляет объекты местами: если один балл был больше другого, его значение после сигмоиды также останется больше.'
  kind: open
  reference: 'Сигмоида строго возрастает: при увеличении z величина e^(−z) уменьшается, поэтому знаменатель уменьшается, а значение всей дроби растёт. Следовательно, преобразование не меняет порядок баллов.'
