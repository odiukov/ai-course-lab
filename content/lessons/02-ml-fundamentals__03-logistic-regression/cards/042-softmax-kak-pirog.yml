- concept: отношение двух softmax-вероятностей равно экспоненте разности соответствующих баллов
  question: В softmax балл класса A выше балла класса B на ln(5). Как соотносятся их вероятности независимо от баллов остальных классов?
  explanation: 'Общий знаменатель сокращается: p_A / p_B = e^(z_A − z_B). При разности ln(5) это отношение равно e^ln(5) = 5.'
  kind: choice
  options:
    - p_A / p_B = 5
    - p_A / p_B = ln(5)
    - p_A = p_B
