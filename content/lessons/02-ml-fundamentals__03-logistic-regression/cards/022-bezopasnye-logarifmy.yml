- concept: средняя потеря равна сумме потерь отдельных объектов, делённой на размер выборки
  question: На трёх объектах модель получила потери 0.6, 0.8 и 0.7. Чему равна средняя потеря?
  explanation: 'Нужно сложить потери и разделить сумму на количество объектов: (0.6 + 0.8 + 0.7) / 3 = 0.7. Усреднение позволяет сравнивать результаты на выборках разного размера.'
  kind: numeric
  answer: 0.7
  tolerance: 0.001
  id: 022-bezopasnye-logarifmy-1
  fingerprint: f9cf981c
- concept: клиппинг вероятностей предотвращает бесконечные значения binary cross-entropy
  question: Зачем при вычислении binary cross-entropy сдвигать граничные значения предсказанной вероятности немного внутрь допустимого интервала?
  explanation: На границе допустимого интервала аргумент одного из логарифмов может стать недопустимым. Клиппинг на малую величину сохраняет смысл большого штрафа и обеспечивает численную устойчивость.
  kind: open
  reference: Чтобы аргументы логарифмов оставались строго положительными. Тогда потеря при уверенной ошибке остаётся очень большой, но конечной, а дальнейшие вычисления не получают бесконечность или NaN.
