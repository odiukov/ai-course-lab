- concept: false positive rate нормируется по всем фактически отрицательным объектам
  question: Заполни пропуск в формуле false positive rate.
  explanation: FP и TN вместе составляют все фактически отрицательные объекты. Поэтому FPR показывает, какая их доля была ошибочно отнесена к положительному классу.
  kind: cloze
  template: FPR = FP / ___
  answer: (FP + TN)
  accept:
    - FP + TN
    - TN + FP
    - число всех фактически отрицательных объектов
  id: 051-roc-i-auc-1
  fingerprint: 68b06727
- concept: вклад участка ROC-кривой в AUC вычисляется как площадь трапеции
  question: 'Две соседние точки ROC-кривой имеют координаты (FPR, TPR): (0.14, 0.38) и (0.49, 0.82). Каков вклад участка между ними в AUC по методу трапеций?'
  explanation: 'Ширина участка по оси FPR равна 0.35, а средняя высота по TPR — 0.60. Площадь трапеции равна их произведению: 0.21.'
  kind: numeric
  answer: 0.21
  tolerance: 0.001
  id: 051-roc-i-auc-2
  fingerprint: 6bc200dd
- concept: AUC интерпретируется как качество ранжирования объектов разных классов
  question: Объясни своими словами, что означает AUC, равный 0.73, через сравнение случайно выбранных объектов положительного и отрицательного классов.
  explanation: AUC оценивает не одно решение при фиксированном пороге, а порядок модельных оценок. Чем чаще положительный объект оказывается выше отрицательного, тем больше площадь под ROC-кривой.
  kind: open
  reference: Примерно в 73% случайных пар модель присваивает положительному объекту более высокий балл или вероятность, чем отрицательному; совпавшие баллы учитываются с половинным весом.
  id: 051-roc-i-auc-3
  fingerprint: d032882a
