- concept: градиент по смещению равен средней ошибке и не содержит множителя признака
  question: Как рассчитывается градиент binary cross-entropy по смещению b в логистической регрессии?
  explanation: Смещение напрямую прибавляется к линейному баллу каждого объекта, поэтому его градиент — среднее разностей p_i − y_i. Множитель x нужен только для градиентов по весам.
  kind: choice
  options:
    - Усредняются разности p_i − y_i без умножения на признаки
    - Усредняются произведения (p_i − y_i) на значения всех признаков
    - Усредняются абсолютные значения разностей |p_i − y_i|
