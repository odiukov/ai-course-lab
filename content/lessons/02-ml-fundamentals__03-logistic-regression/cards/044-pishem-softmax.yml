- concept: равные баллы классов дают равные softmax-вероятности
  question: Модель присвоила всем классам одинаковый линейный балл. Что вернёт softmax?
  explanation: После вычитания максимума все сдвинутые баллы останутся одинаковыми, поэтому их экспоненты тоже равны. Нормализация распределит вероятность поровну между классами.
  kind: choice
  options:
    - Одинаковую вероятность для каждого класса
    - Нулевую вероятность для каждого класса
    - Всю вероятность первому классу
    - Вероятности, зависящие от величины общего балла
  correct: 0
  id: 044-pishem-softmax-1
  fingerprint: 2db5372d
- concept: сумму softmax-вероятностей проверяют с допуском из-за погрешности вычислений
  question: Заполни пропуск в проверке нормировки softmax с учётом арифметики с плавающей точкой.
  explanation: Математически сумма вероятностей равна 1, но вычисления с плавающей точкой могут дать немного отличающееся значение. math.isclose проверяет равенство с заданным допуском.
  kind: cloze
  template: assert ___(sum(probs), expected_total, rel_tol=tol, abs_tol=tol)
  answer: math.isclose
  accept:
    - isclose
  id: 044-pishem-softmax-2
  fingerprint: f5a96d25
- concept: округление вероятностей отделяют от вычисления softmax
  question: Объясни, почему реализация softmax должна возвращать неокруглённые вероятности, даже если при выводе их обычно форматируют.
  explanation: Вероятности могут дальше использоваться для вычисления loss, сравнения классов и обучения модели. Форматирование предназначено для отображения и не должно менять сами данные.
  kind: open
  reference: Округление внутри softmax безвозвратно снижает точность и может исказить последующие вычисления, например loss или выбор максимальной вероятности. Округлять следует только представление результата при выводе.
  id: 044-pishem-softmax-3
  fingerprint: 3ed757c9
