- concept: в бинарной классификации вероятность отрицательного класса является дополнением вероятности положительного класса
  question: Объясни своими словами, как по вероятности положительного класса получить вероятность отрицательного класса в бинарной классификации.
  explanation: В бинарной задаче объект относится либо к положительному, либо к отрицательному классу. Поэтому вероятности этих классов в сумме дают единицу.
  kind: open
  reference: Нужно вычесть вероятность положительного класса из единицы, потому что два класса взаимоисключающие и вместе охватывают все возможные исходы.
