- concept: размер оценённой выборки равен сумме TP, TN, FP и FN
  question: В confusion matrix получены TP = 6, TN = 7, FP = 8 и FN = 9. Сколько всего объектов оценила модель?
  explanation: Каждый объект попадает ровно в одну из четырёх категорий. Поэтому размер выборки равен TP + TN + FP + FN = 6 + 7 + 8 + 9 = 30.
