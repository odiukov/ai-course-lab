- concept: направление конкретной ошибки определяется строкой истинного класса и столбцом предсказанного класса
  question: В матрице ошибок строки соответствуют истинным классам, а столбцы — предсказаниям. Какая ячейка показывает число настоящих лис, которых модель назвала собаками?
  explanation: Объект пришёл из истинного класса «лиса», поэтому выбирается строка «лиса». Модель ответила «собака», поэтому выбирается столбец «собака».
  kind: choice
  options:
    - Строка «собака», столбец «лиса»
    - Строка «лиса», столбец «лиса»
    - Строка «собака», столбец «собака»
    - Сумма столбцов «лиса» и «собака»
    - Строка «лиса», столбец «собака»
  correct: 4
  id: 050-metriki-treh-klassov-1
  fingerprint: 0e2e5fce
- concept: recall отдельного класса равен диагональному элементу, делённому на сумму его строки в матрице ошибок
  question: |-
    Строки матрицы ошибок — истинные классы, столбцы — предсказанные:

    |   | A | B | C |
    |---|---:|---:|---:|
    | A | 24 | 6 | 5 |
    | B | 8 | 42 | 10 |
    | C | 7 | 9 | 54 |

    Чему равен recall класса B в процентах?
  explanation: Для класса B значение TP равно 42, а всего в его строке 8 + 42 + 10 = 60 истинных объектов. Поэтому recall = 42 / 60 = 70%.
  kind: numeric
  answer: 70
  tolerance: 0.1
  id: 050-metriki-treh-klassov-2
  fingerprint: c8fd7cee
- concept: общая accuracy может скрывать существенно разное качество распознавания отдельных классов
  question: Объясни своими словами, почему высокой общей accuracy недостаточно, чтобы назвать softmax-модель одинаково хорошей для всех классов. Как определить проблемный класс?
  explanation: Accuracy объединяет результаты всех классов в одно число и скрывает структуру ошибок. Матрица ошибок показывает направления путаницы, а метрики по классам позволяют отличить пропуски класса от ложного назначения его метки.
  kind: open
  reference: 'Большой класс или несколько хорошо распознаваемых классов могут обеспечить высокую общую accuracy, даже если модель часто ошибается на другом классе. Нужно изучить матрицу ошибок и отдельно вычислить precision и recall каждого класса: низкий recall показывает частые пропуски класса, а низкий precision — частое ошибочное присвоение его метки чужим объектам.'
  id: 050-metriki-treh-klassov-3
  fingerprint: 51657bc8
