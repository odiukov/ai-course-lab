- concept: плато положительного loss может означать приближение к доступному модели минимуму
  question: После заметного снижения loss почти перестал меняться, но остался больше нуля. Объясни, почему это может быть признаком сходимости, а не неисправности обучения.
  explanation: При приближении к минимуму улучшения становятся всё меньше, поэтому возникает плато. Положительное значение на плато допустимо, если данные нельзя безошибочно разделить доступной модели границей.
  kind: open
  reference: 'Малые изменения loss означают, что параметры приблизились к минимуму функции потерь. Минимальный loss не обязан быть нулевым: классы могут пересекаться, а линейная модель может быть не способна идеально разделить данные.'
