  fingerprint: 452f65dc
- concept: свободный член b одинаково сдвигает линейный балл при любом значении признака
  question: Параметр b увеличили на величину Δ, не меняя w и x. Как изменится предварительный балл z?
  explanation: После изменения свободного члена получаем z' = wx + (b + Δ) = z + Δ. Поэтому b сдвигает балл на одну и ту же величину для любого входа.
  kind: choice
  options:
    - Увеличится ровно на Δ
    - Умножится на Δ
    - Не изменится
