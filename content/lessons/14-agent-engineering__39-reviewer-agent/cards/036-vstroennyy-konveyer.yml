- concept: 'результаты пройденных этапов не наследуются изменённой версией работы: цикл повторяется с гейта'
  question: Исполнитель исправил находки и прислал новую версию. Прошлый прогон дал зелёный гейт и отчёт ревьюера. Что переносится на новую версию?
  explanation: Любая правка меняет артефакт, по которому выносились суждения, — вместе с ней могут упасть и тесты, и измерения, к которым правка на вид не относится. Прошлый отчёт входит в новый цикл как список того, что нужно проверить, а не как унаследованная оценка.
  kind: choice
  options:
    - 'Зелёный гейт: правки касались только замечаний ревьюера'
    - Оценки ревьюера по тем измерениям, которых правки не касались
    - 'Ничего из результатов: гейт прогоняется заново, затем новое ревью; из прошлого отчёта берётся только перечень находок'
    - Итоговый вердикт прошлого отчёта как стартовая точка нового
  correct: 2
