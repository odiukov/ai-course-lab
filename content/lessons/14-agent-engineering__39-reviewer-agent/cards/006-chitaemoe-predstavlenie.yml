- concept: доступ только на чтение ограничивает изменения, но не строгость требований ревьюера
  question: Что именно ограничивает у ревьюера доступ к дифу только на чтение, и что при этом не ограничено?
  explanation: Право на чтение всего пакета плюс запрет на запись и создают зазор между «сделал» и «оценил». Ограничение техническое, а не про строгость замечаний.
  kind: open
  reference: 'Ограничены изменения: ревьюер не патчит диф, не переписывает тесты, не трогает состояние работы. Не ограничены требования и оценки: в отчёте он может подробно указать, что изменено не то поведение, что приёмка доказывает ослабленную версию цели, что допущение нигде не записано, и потребовать конкретной переделки. Его единственный выход — отчёт; исправления делает исполнитель на следующем проходе, после чего ревьюер возвращается к ревью.'
