  question: После изменения промпта ревьюер провалил три задачи калибровочного набора. Инженер хочет заменить эти три задачи новыми. Почему так делать нельзя?
  explanation: Набор — это мерка. Если подстраивать её под результат, согласие всегда будет высоким и ничего не будет значить. Пополнять набор можно после человеческого разбора — особенно новыми типами пропущенных ошибок, — но не вместо провалившихся случаев.
