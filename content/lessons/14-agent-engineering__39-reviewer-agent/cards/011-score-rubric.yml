- concept: оценки возвращаются под именами измерений, а не позициями в списке
  question: Функция подсчёта рубрики возвращает баллы простым списком в фиксированном порядке. Какой конкретный риск снимает возврат под именами измерений?
  explanation: 'Отчёт ревьюера ценен адресом проблемы: важно, какое измерение просело. Позиционный список делает этот адрес зависимым от порядка вызовов — сдвиг на одну позицию превращает провал попадания в задачу в провал готовности передачи, и никакая проверка этого не заметит.'
  kind: choice
  options:
    - Именованная структура позволяет ставить дробные баллы
    - Именованная структура сама пересчитывает итог и вердикт
    - При добавлении нового измерения или смене порядка балл перестанет молча привязываться не к тому измерению
    - Именованная структура запрещает нулевые баллы
  correct: 2
  id: 011-score-rubric-1
  fingerprint: 3ea3213f
- concept: контракт оценщика не меняется при замене детерминированной заглушки на вызов LLM
  question: 'В учебной реализации оценщики измерений детерминированы: одинаковые входы дают одинаковые баллы. В боевой версии внутри оценщика появляется вызов LLM. Что обязано остаться прежним?'
  explanation: Заглушка нужна, чтобы прогнать демо-случаи и увидеть, какое измерение поймало проблему. Меняется только начинка оценщика; вызывающий код продолжает передавать один и тот же пакет артефактов и получать набор именованных баллов в исходной шкале. Детерминированность как раз и не сохраняется — это свойство учебной заглушки, а не требование контракта.
  kind: choice
  options:
    - 'Детерминированность: одинаковые входы обязаны давать одинаковый балл и с LLM'
    - 'Контракт: те же подготовленные артефакты на входе, балл в той же шкале под именем своего измерения на выходе'
    - Скорость ответа оценщика
    - Порядок вызова оценщиков, потому что от него зависят баллы
  correct: 1
  id: 011-score-rubric-2
  fingerprint: 2b3b0fd4
