  fingerprint: bb46a601
- concept: вход ревьюера должен быть отдельным снимком, а не ссылкой на живое изменяемое состояние исполнителя
  question: Сборщик возвращает ревьюеру тот же самый изменяемый объект состояния, с которым дальше продолжает работать исполнитель. Объясни своими словами, почему правило «ревьюер ничего не правит» в такой схеме держится только на словах.
  explanation: 'Именно поэтому вход ревьюера собирают в отдельную структуру: она перечисляет ровно то, что нужно для суждения, и не даёт ни одной из сторон незаметно изменить материал оценки.'
  kind: open
  reference: 'Общий объект означает общую память: любое поле, которое читает ревьюер, исполнитель может дописать или переписать между чтением и вынесением оценки, а любая случайная запись на стороне ревьюера меняет саму работу. Разделение ролей превращается в договорённость без опоры: нет технической границы, отделяющей предмет оценки от того, кто оценивает. Снимок (отдельная копия артефактов) делает границу настоящей: работа остаётся неизменной, а отчёт описывает конкретное зафиксированное состояние, к которому можно вернуться.'
  id: 007-reviewer-view-2
  fingerprint: 371fb4ba
