- concept: смещение к авторитету снимается удалением имён и ссылок из оцениваемого текста до оценивания
  question: LLM-судья систематически завышает оценку ответам, где упомянуты известные исследователи и их работы. Какая мера устраняет именно это смещение?
  explanation: 'Каждое смещение лечится своей мерой: перестановка порядка — позиционное, шкала за краткость — многословность, ротация семейств моделей — самопредпочтение, обезличивание текста — авторитет. Подставить чужое лекарство нельзя: судья продолжит видеть громкое имя и завышать оценку независимо от порядка ответов и их длины.'
  kind: choice
  options:
    - Вырезать имена авторов и ссылки из ответов до передачи судье
    - Оценивать каждую пару в двух порядках и засчитывать только совпавшие вердикты
    - Перейти на шкалу, которая прямо награждает краткость
    - Ротировать судей между разными семействами моделей
  correct: 0
  id: 029-chetyre-smeshcheniya-1
  fingerprint: 287ecbaa
- concept: при защите от позиционного смещения засчитываются только вердикты, совпавшие в обоих порядках
  question: 'Судья оценил 200 пар ответов дважды: в порядке (A,B) и в порядке (B,A). Вердикт совпал на 130 парах. Сколько пар не даёт засчитываемого результата?'
  explanation: 200 − 130 = 70 пар, где судья при перестановке выбрал другого победителя. Такой вердикт говорит о позиции ответа, а не о его качестве, поэтому он отбрасывается. Показатель самосогласованности здесь 65% — заодно оценка того, насколько судье вообще можно доверять на этой задаче.
  kind: numeric
  answer: 70
  tolerance: 0.5
  id: 029-chetyre-smeshcheniya-2
  fingerprint: 95a309ae
- concept: смещения судьи снимаются процедурой оценивания вокруг него, а не инструкцией внутри промпта
  question: Почему инструкция судье «оценивай объективно, не поддавайся смещениям» не устраняет позиционное смещение и смещение к многословности? Объясни своими словами и назови, что работает вместо неё.
  explanation: 'Ключ: смещение не снимается самонаблюдением судьи. Оно проявляется как разница между двумя прогонами, поэтому и лечится конструкцией эксперимента — контролем порядка, длины, семейства модели и метаданных, — а не формулировкой промпта.'
  kind: open
  reference: 'Смещения — свойство того, как модель обрабатывает вход, а не намерение, которое можно отменить просьбой: судья не наблюдает собственного сдвига и искренне считает свой выбор качественным. Инструкция не меняет ни порядок предъявления, ни длину ответов, ни семейство модели, ни видимость имён авторов. Работает изменение самой процедуры вокруг судьи: прогон пары в обоих порядках с зачётом только совпавших вердиктов, шкала, награждающая краткость, ротация судей между семействами моделей, обезличивание текста до оценивания. Замер остаётся обязательным: расхождение при перестановке достигает примерно 40%, надбавка за длину — около 15%.'
  id: 029-chetyre-smeshcheniya-3
  fingerprint: 4fe7fbb5
