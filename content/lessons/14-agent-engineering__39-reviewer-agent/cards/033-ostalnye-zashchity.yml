- concept: ротация судей между семействами моделей адресует самопредпочтение, и семейство — не то же, что размер модели
  question: Какое смещение снимает ротация судей между разными семействами моделей и что при этом обязательно должно меняться?
  explanation: Самопредпочтение — предпочтение выходов родственных моделей. Крупная и мелкая модель одного семейства делят это смещение, поэтому смена размера ничего не даёт. Ротация не делает отдельный вердикт беспристрастным — она мешает одному семейству систематически определять итог.
  kind: choice
  options:
    - Позиционное смещение; менять достаточно температуру генерации
    - Смещение к авторитету; менять достаточно размер модели внутри одного семейства
    - Самопредпочтение — склонность судьи выше оценивать выходы моделей своего происхождения; менять нужно именно семейство, а не размер
    - Смещение к многословности; менять нужно длину контекстного окна
  correct: 2
