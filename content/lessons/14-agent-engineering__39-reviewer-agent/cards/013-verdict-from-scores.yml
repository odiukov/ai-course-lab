- concept: вердикт вычисляется из пооценочного набора, а не из уже свёрнутой суммы
  question: Рубрика из 6 измерений. Итог посчитан, вердикт вычисляет отдельная функция. Что нужно передать ей на вход?
  explanation: 'Сложение — необратимая свёртка: из одного числа уже нельзя узнать, было ли какое-то измерение провалено полностью. Функция вердикта должна видеть оценки по измерениям, иначе часть правил рубрики применить нечем.'
  kind: cloze
  template: |-
    scores = score_all(inputs)          # оценка по каждому измерению
    total = sum(scores.values())        # итог по всей рубрике
    verdict = verdict_from_scores(___)
  answer: scores
  accept:
    - scores
    - score_all(inputs)
  id: 013-verdict-from-scores-1
  fingerprint: fd37497b
- concept: функция вердикта только классифицирует набор оценок; запись отчёта и реакция на вердикт живут вне её
  question: Функция вердикта видит, что одно измерение рубрики провалено. Что входит в её ответственность?
  explanation: Классификация набора оценок в одну метку — единственная задача этой функции. Оценивание живёт в оценщике, сохранение — в писателе отчёта, реакция — в следующем проходе конвейера. Смешение ролей делает правило вердикта невоспроизводимым.
  kind: choice
  options:
    - Поднять провальную оценку до минимально проходной и пересчитать итог
    - Вернуть метку вердикта; запись отчёта и дальнейшие действия делают другие функции
    - Записать файл отчёта и отправить его исполнителю на доработку
    - Запросить у исполнителя дополнительные артефакты и оценить их заново
  correct: 1
  id: 013-verdict-from-scores-2
  fingerprint: ad72cec8
