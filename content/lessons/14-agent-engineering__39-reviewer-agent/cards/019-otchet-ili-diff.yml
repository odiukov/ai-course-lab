- concept: 'разделение зон: связность и обоснованность оценок проверяются в отчёте, фактическое содержание изменений — в дифе'
  question: Объясни своими словами, что человек проверяет в отчёте ревьюера, а что может проверить только в дифе.
  explanation: Отчёт проверяется на внутреннюю согласованность, диф — на факты. Первое без второго ловит нелогичные отчёты, но не ловит аккуратный отчёт о невидимой ревьюеру правке.
  kind: open
  reference: 'В отчёте: покрыты ли все измерения рубрики, привязана ли каждая оценка к конкретному доказательству, следует ли вердикт из набора оценок по объявленному правилу, соблюдён ли порог уверенности. В дифе: что действительно изменено, укладываются ли правки в заявленные границы, не ослаблены ли тесты, нет ли изменений, которых отчёт вообще не упоминает. Отчёт нельзя проверить на полноту его же средствами — пропуск виден только по первичному артефакту.'
  id: 019-otchet-ili-diff-3
  fingerprint: cf740e72
