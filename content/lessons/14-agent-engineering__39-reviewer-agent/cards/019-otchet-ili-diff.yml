  fingerprint: bd3e1062
- concept: в первую очередь сверяются с дифом те утверждения отчёта, на которых держится вердикт
  question: Времени на полное чтение дифа нет. Какие утверждения отчёта сверять с ним в первую очередь?
  explanation: Ошибка в утверждении, которое ничего не решает, вердикт не меняет. Ошибка в утверждении, на котором вердикт стоит, переворачивает решение целиком — туда и уходит ограниченное внимание.
  kind: choice
  options:
    - 'Те, от которых зависит вердикт: пограничные оценки, заявленные границы изменений, доказательства приёмки'
    - Самые длинные и подробные разделы отчёта — там больше шансов встретить ошибку
    - Утверждения об оформлении и стиле кода, потому что их проверить быстрее всего
  correct: 0
