- concept: 'порядок вычислений в писателе отчёта: входы, оценки, итог, вердикт, запись'
  question: Расставь шаги функции, собирающей файл отчёта ревью.
  explanation: 'Вердикт стоит после оценивания и опирается на тот же набор оценок, который попадёт в файл. Запись — последний шаг: она фиксирует уже готовое решение, а не участвует в его получении.'
  kind: order
  items:
    - Собрать входы ревьюера в один объект артефактов
    - Получить оценки по всем измерениям рубрики от оценщика
    - Сложить оценки в итог
    - Передать тот же набор оценок в функцию вердикта и получить метку
    - Записать оценки, итог и вердикт в один файл отчёта
  id: 016-review-report-1
  fingerprint: '93906e08'
- concept: правило вердикта существует в одном месте, писатель отчёта его вызывает, а не повторяет
  question: Писатель отчёта удобно вычисляет вердикт прямо у себя, повторив условия рубрики. Чем это плохо?
  explanation: 'Дублирование правила безобидно ровно до первой правки рубрики: поменяют порог или условие провала в одном месте — и файл отчёта начнёт расходиться с тем, что показывает конвейер. Один источник правила, все остальные его вызывают.'
  kind: choice
  options:
    - Отчёт станет медленнее собираться из-за лишних вычислений
    - Две копии правила со временем разойдутся, и отчёт начнёт противоречить остальному конвейеру
    - JSON не поддерживает вычисляемые поля
    - Вердикт нельзя вычислять после того, как посчитан итог
  correct: 1
  id: 016-review-report-2
  fingerprint: cc765545
- concept: в отчёт попадают ровно те значения, из которых получен вердикт
  question: После вычисления вердикта разработчик поправил одну оценку в готовом словаре отчёта и пересчитал только итог. Что сломалось?
  explanation: Смысл отчёта — в том, что вывод восстанавливается из записанных значений. Как только оценки правят после расчёта вердикта, читатель применит правило к содержимому файла и получит другой результат. Менять оценку — значит прогонять вердикт заново.
  kind: choice
  options:
    - 'Ничего: итог пересчитан, значит отчёт согласован'
    - 'Отчёт стал невоспроизводимым: вердикт получен из другого набора оценок, чем записан в файле'
    - Файл перестал быть валидным JSON
    - Вердикт нужно теперь переименовать, потому что оценки изменились
  correct: 1
  id: 016-review-report-3
  fingerprint: 1da9924e
