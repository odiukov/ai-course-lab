- concept: критическая находка на эталонно чистом случае диагностирует рубрику или входные артефакты, а не саму работу
  question: Ревьюер выдал критическую находку на контрольном случае, где работа заведомо аккуратна. Что чинить в первую очередь?
  explanation: 'Известный правильный вердикт на то и известен: расхождение с ним — сигнал об инструменте, а не о работе. Дальше смотрят, что именно получил ревьюер на вход и как сформулирован сработавший критерий.'
  kind: choice
  options:
    - 'Работу: раз находка есть, где-то в изменении действительно спрятан дефект'
    - 'Правило вердикта: пороги полос сдвинуты слишком высоко'
    - 'Рубрику или пакет входных артефактов: либо критерий сформулирован слишком жёстко, либо ревьюер видит не то, что должен'
