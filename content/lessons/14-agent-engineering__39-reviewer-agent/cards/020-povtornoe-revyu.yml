- concept: повторное ревью оценивает текущую версию работы, а не ответы исполнителя на замечания
  question: Исполнитель отреагировал на каждую находку строкой «исправлено» и передал работу обратно. На чём ревьюер строит новый вердикт?
  explanation: 'Ответ исполнителя — это утверждение о работе, а не работа. Ревьюер оценивает новую версию: устранена ли причина находки, не замаскирована ли она и не появилось ли рядом новой проблемы.'
  kind: choice
  options:
    - 'На перечне ответов исполнителя: каждая помеченная как исправленная находка закрывается'
    - На обновлённых артефактах и новых результатах проверок — заявление исполнителя само по себе ничего не подтверждает
    - На доле находок, которые исполнитель признал справедливыми
  correct: 1
  id: 020-povtornoe-revyu-1
  fingerprint: fc8ef080
- concept: вердикт прежнего отчёта относится только к прошлой версии; в новый цикл он входит как перечень находок, а не как оценка
  question: Зачем передавать в повторное ревью прежний структурированный отчёт?
  explanation: Отчёт прошлого цикла — карта того, где искать, а не запас уже заработанных баллов. Он описывает версию, которой больше нет.
  kind: choice
  options:
    - Чтобы не потерять список находок и проверить каждую по новой версии; сам вердикт при этом относится к прошлой версии и не переносится
    - Чтобы взять оттуда действующие оценки измерений и пересчитать только те, что исполнитель трогал
    - Чтобы ревьюер видел прошлый вердикт как нижнюю границу и не оценивал работу ниже неё
  correct: 0
  id: 020-povtornoe-revyu-2
  fingerprint: 01f2f827
- concept: находка закрывается устранением её причины, а не объявлением находки несущественной
  question: 'Ревьюер отметил, что допущение не задокументировано. Исполнитель добавил комментарий: «считаю это несущественным» — и больше ничего не изменил. Что делает ревьюер?'
  explanation: Согласие или несогласие исполнителя не меняет состояние артефакта. Допущение как не было записано, так и не записано — измерение оценивается по свидетельству, а не по комментарию.
  kind: choice
  options:
    - 'Закрывает находку: исполнитель дал явный ответ по существу'
    - Понижает её до предупреждения, раз есть письменное обоснование
    - 'Оставляет находку открытой и снова применяет правило вердикта: причина не устранена'
  correct: 2
  id: 020-povtornoe-revyu-3
