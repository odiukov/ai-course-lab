- concept: специалист получает короткий промпт и только релевантную часть артефактов, полную рубрику он не прогоняет
  question: Как устроен вход узкого специалиста в пуле ревьюеров?
  explanation: Смысл пула — сузить вопрос, а не размножить одинаковые копии общего ревью. Если каждый специалист прогоняет полную рубрику, возвращается та же рассеянность, только умноженная на число прогонов.
  kind: choice
  options:
    - Короткий промпт под одну область и релевантная часть артефактов; полную рубрику он не проходит
    - Полная рубрика целиком, но с указанием обратить особое внимание на свою область
    - Полный набор артефактов и свободная формулировка задачи, чтобы специалист сам решил, что важно
