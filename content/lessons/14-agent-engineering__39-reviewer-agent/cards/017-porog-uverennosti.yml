- concept: оценка измеряет качество выполнения, уверенность — достаточность доказательств для этого суждения
  question: Измерение получило максимальный балл, но уверенность ревьюера по нему равна 0.5. Как это читать?
  explanation: 'Это две разные шкалы. Балл отвечает «насколько хорошо выполнено требование», уверенность — «насколько надёжно я это установил по имеющимся артефактам». Высокий балл при слабых свидетельствах — обычная и опасная комбинация: догадка выглядит как вывод.'
  kind: choice
  options:
    - Работа выполнена примерно наполовину, балл выставлен ошибочно
    - Работа выглядит выполненной, но доказательств для надёжного суждения мало
    - Уверенность всегда должна равняться нормированному баллу, значит в оценщике ошибка
    - Балл нужно понизить до уровня уверенности
  correct: 1
  id: 017-porog-uverennosti-1
  fingerprint: f5cbfbbc
- concept: с порогом уверенности сравнивают самое слабое измерение, а не среднее по рубрике
  question: Порог уверенности 0.7. По измерениям рубрики уверенность равна 0.95, 0.9, 0.85, 0.5 и 0.8. Какое число сравнивают с порогом?
  explanation: 'Берётся минимум — 0.5, он ниже порога 0.7, и вердикт не выдаётся. Среднее здесь 0.8 и порог бы прошло: усреднение растворяет единственное слепое пятно в благополучном фоне, а решает именно оно.'
  kind: numeric
  answer: 0.5
  tolerance: 0.01
  id: 017-porog-uverennosti-2
  fingerprint: f6cbed75
- concept: отказ от вердикта — сообщение о нехватке доказательств, а не ещё одна степень провала
  question: Ревьюер не выдал вердикт, потому что сработал порог уверенности. Что следует делать дальше?
  explanation: Отказ ничего не говорит о качестве работы — она может быть и хорошей, и плохой. Он говорит о состоянии доказательств. Правильный ход — закрыть названный пробел в артефактах; понижение порога просто возвращает догадку в виде вывода.
  kind: choice
  options:
    - Считать это провалом и вернуть работу исполнителю на переделку
    - Взять ближайший подходящий вердикт, отметив низкую уверенность
    - Добрать недостающие свидетельства по названному измерению и оценить заново
    - Понизить порог уверенности, чтобы отчёт всё-таки вышел
  correct: 2
  id: 017-porog-uverennosti-3
  fingerprint: cd0f0ca6
