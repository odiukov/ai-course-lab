- concept: запрос доказательств называет конкретный пробел и конкретное действие, а не требует общего подтверждения работоспособности
  question: Какой запрос дополнительных доказательств сформулирован правильно?
  explanation: 'Расплывчатый запрос не закрывается: любой ответ можно счесть недостаточным, и цикл идёт по кругу. Названный пробел и названное действие дают запросу проверяемое условие завершения.'
  kind: choice
  options:
    - «Убедись, что решение работает, и приложи подтверждение»
    - «Прогони тест на пустом вводе и приложи его вывод»
    - «Проверь всё, что может быть связано с обработкой ввода»
  correct: 1
