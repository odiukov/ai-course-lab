- concept: исчерпанный бюджет обязывает завершить цикл отчётом по имеющимся данным, а не выдать ещё один запрос
  question: Бюджет запросов исчерпан, но одного доказательства ревьюеру по-прежнему не хватает. Что он делает?
  explanation: 'Лимит не требует угадывать. Он требует вовремя назвать границу знания: что проверено, чего не хватает и хватает ли этого для вердикта.'
  kind: choice
  options:
    - Выдаёт отчёт по имеющимся данным, явно фиксируя недостающее доказательство и снижая уверенность
    - 'Делает ещё один запрос: лимит не должен вредить строгости проверки'
    - Ставит вердикт по худшему сценарию, считая непроверенное проваленным
