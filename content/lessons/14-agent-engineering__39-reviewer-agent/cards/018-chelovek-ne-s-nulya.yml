- concept: рубрика ревьюера настраивается под конкретный проект, а новое измерение оправдано только тем, что существующие его не покрывают
  question: Команда хочет добавить в рубрику ревьюера измерение под свою предметную область. Что нужно показать, прежде чем его вводить?
  explanation: 'Рубрику генерируют под проект: универсальный набор не ловит специфичные риски. Но измерение, чьи свидетельства уже учитываются другим измерением, добавляет двойной счёт и шум в итог, а не сигнал.'
  kind: choice
  options:
    - Что оно не поглощается уже имеющимися измерениями и требует собственных свидетельств
    - Что оно повышает средний балл по типичным задачам
    - Что для него есть детерминированная проверка в гейте
    - Что его можно оценивать той же моделью, что и остальные
