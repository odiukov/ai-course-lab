- concept: ревьюеру достаточно компактного набора артефактов вместо всей истории работы исполнителя, поэтому дорогих токенов тратится мало
  question: Исполнитель работает на дешёвой быстрой модели, ревьюер — на дорогой сильной. Объясни, почему такая связка не удорожает прогон в разы.
  explanation: 'Экономика связки держится на асимметрии объёмов: много дешёвой генерации против малого дорогого чтения. Если подать ревьюеру всю историю сессии, преимущество исчезает.'
  kind: open
  reference: 'Дешёвая модель порождает основную массу токенов: читает файлы, пробует варианты, переписывает код, чинит тесты — это длинная история сессии. Дорогая модель в эту историю не заходит: ей подают компактный снимок артефактов (требование, диф, результаты проверок, заметки о допущениях) и просят вынести суждение по рубрике. Вход короткий, выход — структурированный отчёт, тоже короткий. Поэтому дорогих токенов на порядок меньше, чем дешёвых, и стоимость определяется не тарифом сильной модели, а тем, сколько ей дают прочитать.'
