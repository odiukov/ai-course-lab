- concept: координатор работает над находками специалистов, а не проводит ещё одно полное ревью исходного материала
  question: Пул узких ревьюеров-специалистов отработал изменение и вернул свои заключения. Что делает координатор поверх них?
  explanation: 'Координатор — слой сборки, а не ещё один ревьюер. Его вход — уже сжатые заключения, а не исходный код; повторный полный прогон удвоил бы стоимость и обнулил экономию от дешёвых специалистов. Именно поэтому дорогая модель ставится только сюда: сопоставление находок между областями требует более сильного суждения, чем узкая проверка.'
  kind: choice
  options:
    - Прогоняет полную рубрику по всему изменению заново, чтобы перепроверить каждого специалиста
    - 'Работает с самими заключениями: сопоставляет находки, объединяет указывающие на одну первопричину и назначает серьёзность'
    - Выбирает заключение самого уверенного специалиста и отбрасывает остальные
    - Передаёт все заключения человеку без обработки, чтобы не потерять детали
  correct: 1
  id: 028-rabota-koordinatora-1
  fingerprint: 87ac0d21
- concept: объём сводного списка задаётся числом различимых первопричин, а не числом поступивших сообщений
  question: Специалисты вернули 12 находок. После сопоставления координатор видит, что они указывают на 5 различных первопричин. Сколько дефектов попадёт в сводный список для человека?
  explanation: '12 формулировок сворачиваются в 5 записей — по одной на первопричину. Оставшиеся 7 сообщений не выбрасываются: они прикладываются к своим записям как разные наблюдаемые последствия одной причины. Без свёртки человек прочитал бы 12 дефектов и решил, что работа разваливается в двенадцати местах.'
  kind: numeric
  answer: 5
  tolerance: 0.5
