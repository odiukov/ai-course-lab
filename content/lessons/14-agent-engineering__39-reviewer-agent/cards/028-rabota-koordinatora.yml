  fingerprint: 202f3bdb
- concept: серьёзность находки определяется масштабом её последствий, а не количеством сообщивших специалистов или их уверенностью
  question: 'Одну находку независимо сообщили четыре специалиста, все с высокой уверенностью; речь идёт о неточности в комментарии. Другую сообщил один специалист: путь к раскрытию чужих данных. Как координатор расставит серьёзность?'
  explanation: 'Кратность сообщений — сигнал о том, что находки описывают одну проблему, и работает на слияние, а не на приоритет. Серьёзность отвечает на другой вопрос: чем это обернётся. Опечатка в комментарии и утечка данных не встают в одну очередь только потому, что оба специалиста уверены.'
  kind: choice
  options:
    - 'Выше поставит первую: четыре независимых подтверждения весомее одного'
    - 'Поставит обе одинаково: уверенность специалистов в обоих случаях высокая'
    - 'Выше поставит вторую: серьёзность считается по последствиям, а число сообщений влияет только на дедупликацию'
    - Отложит обе до повторного прогона, пока специалисты не придут к общему числу голосов
  correct: 2
