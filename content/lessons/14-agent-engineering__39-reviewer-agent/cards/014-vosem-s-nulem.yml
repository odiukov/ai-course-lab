- concept: 'hard fail срабатывает по двум независимым основаниям: провал отдельного измерения либо общий уровень в нижней полосе'
  question: Может ли работа получить hard fail, если ни по одному измерению рубрики не выставлена провальная оценка?
  explanation: 'У hard fail два независимых триггера. Первый — провал отдельного обязательного измерения. Второй — слишком низкий общий уровень: работа ровно слабая по всем измерениям, и возвращать её в цикл доработок бессмысленно.'
  kind: choice
  options:
    - 'Нет: hard fail возможен только при полном провале отдельного измерения'
    - 'Да: если общий итог падает в нижнюю полосу, вердикт тоже hard fail'
    - 'Нет: без провального измерения максимум, что бывает, — soft fail'
    - Да, но только если ревьюер отказался выдавать вердикт
  correct: 1
