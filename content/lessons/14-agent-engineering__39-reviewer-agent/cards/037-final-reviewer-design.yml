- concept: вариант системного промпта ревьюера выбирается прогоном обоих на одних артефактах и сравнением пригодности отчётов для решения человека
  question: Reviewer Agent запускают с двумя системными промптами — сжатым и подробным. Как обоснованно выбрать один из них?
  explanation: 'Промпт — это входная переменная, и оценивать её надо по выходу на фиксированных входах: два прогона на одинаковых артефактах отличаются только промптом. Критерий — читаемость и пригодность отчёта для подписи, а не длина инструкции, цена токенов или самооценка модели.'
  kind: choice
  options:
    - 'Оставить подробный: длинная инструкция всегда даёт более полный отчёт'
    - 'Оставить сжатый: он дешевле по токенам на каждом прогоне'
    - Прогнать оба промпта на одних и тех же артефактах и сравнить получившиеся отчёты по тому, насколько по ним человек может принять решение
    - Выбрать тот, при котором модель ставит себе более высокую среднюю уверенность
  correct: 2
  id: 037-final-reviewer-design-1
  fingerprint: f047b3f9
- concept: полосы вердикта заданы долей от максимально возможной суммы и пересчитываются при изменении числа измерений или шкалы
  question: Рубрика ревьюера состоит из 7 измерений, каждое оценивается по шкале от 0 до 3. Порог вердикта pass задан как 80% от максимально возможной суммы. Какому значению суммы соответствует этот порог?
  explanation: 'Максимум равен 7 × 3 = 21, порог 0.8 × 21 = 16.8 (на практике округляют вверх до 17). Абсолютные полосы нельзя переносить между версиями рубрики: добавили измерение или сменили шкалу — тот же балл означает уже другую долю выполнения, и полосы надо пересчитать.'
  kind: numeric
  answer: 16.8
  tolerance: 0.1
  id: 037-final-reviewer-design-2
  fingerprint: f6308753
- concept: расхождения на калибровочном наборе разбираются по каждому отдельному случаю как диагностика, причём ошибочной может оказаться и сама эталонная запись
  question: Ревьюера прогнали по калибровочному набору из 20 исторических закрытий задач; он совпал с эталонными вердиктами в 15 случаях. Что дальше нужно сделать с этим результатом, кроме сравнения доли согласия с порогом?
  explanation: 'Агрегатная доля согласия говорит только «доверять или нет». Что именно чинить, видно лишь из отдельных несовпадений, и вывод из них бывает двусторонним: сломана рубрика либо ошибочен эталон.'
  kind: open
  reference: 'Разобрать пять расхождений поштучно: по каждому посмотреть, какое измерение и какое свидетельство привели ревьюера к другому вердикту. Расхождения — основной диагностический материал: они показывают, какая формулировка рубрики двусмысленна, какого артефакта не хватило во входах или где ревьюер систематически строг/мягок. При этом эталон не является безусловной истиной: часть исторических закрытий могла быть подписана ошибочно, и тогда правильным был вердикт ревьюера, а исправлять надо запись в наборе. Правки вносятся в рубрику или в набор, но не в обоих местах одновременно и не по итогам одного случая, иначе меняются одновременно измеряемое и мерка.'
  id: 037-final-reviewer-design-3
  fingerprint: 44ecdaa3
