- concept: 'цель прогона задаёт, что ищет модель: завершение работы или расхождение результата с запросом'
  question: Почему прогон с установкой «выполни задачу» и прогон с установкой «найди расхождения между запросом и результатом» дают разный сигнал, даже если модель одна и та же?
  explanation: Автор перечитывает, чтобы убедиться, что всё хорошо; корректор — чтобы найти ошибку. Дорогая вторая модель усиливает проверку, но роль создаёт не она, а смена цели, входов и полномочий.
  kind: open
  reference: 'Установка задаёт направление внимания. В режиме исполнителя цель — довести работу до конца, поэтому перечитывание служит подтверждению выбранного пути и защите принятых решений. В режиме ревьюера цель — найти пропуски, недописанные допущения и неверно понятый замысел, и успех измеряется найденными расхождениями. Отсюда практическое требование: отдельный контекст с другим системным промптом и другими входами, а не дописка «а теперь проверь себя» в конце той же цепочки рассуждений.'
