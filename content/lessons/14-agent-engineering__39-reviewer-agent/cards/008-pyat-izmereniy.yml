- concept: Scope discipline отслеживает выход правок за границы согласованного контракта
  question: Задача просила поправить разбор одного поля ответа. Исполнитель получил верный результат, но попутно завёл новую внешнюю зависимость и новый модуль, о которых в контракте задачи нет ни слова. Какое измерение рубрики ревьюера бьёт тревогу?
  explanation: Scope discipline спрашивает, остались ли правки внутри контракта или контракт был расширен. Расширение допустимо, но только осознанное и зафиксированное; молчаливое расширение — это балл вниз, даже когда результат верный.
