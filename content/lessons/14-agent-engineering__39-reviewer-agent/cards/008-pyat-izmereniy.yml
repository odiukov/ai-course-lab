- concept: Handoff readiness оценивает возможность продолжить работу в следующей сессии без восстановления контекста
  question: 'Объясни своими словами: что ищет ревьюер по измерению Handoff readiness и какой риск это измерение закрывает?'
  explanation: 'Handoff readiness — единственное измерение, направленное в будущее: остальные оценивают само изменение, а это — стоимость следующего шага. Корректная работа с непрозрачным состоянием получает по нему низкий балл.'
  kind: open
  reference: 'Ревьюер смотрит, сможет ли следующая сессия чисто продолжить с текущего состояния: понятно ли, что сделано и что осталось, сохранены ли принятые решения, нет ли недописанных хвостов и временных заглушек без пометок. Риск — потеря контекста между сессиями: работа выглядит завершённой, но продолжающему приходится восстанавливать замысел археологией по дифу.'
