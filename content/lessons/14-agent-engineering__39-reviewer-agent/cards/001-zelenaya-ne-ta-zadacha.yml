- concept: решение не той задачи выявляется только сверкой результата с исходной формулировкой, а не ужесточением проверок
  question: Команда, обнаружив, что агент решил соседнюю задачу, решает добавить ещё проверок и поднять покрытие. Объясни своими словами, почему это не устранит проблему и какой вход нужен, чтобы её поймать.
  explanation: Приёмка отвечает на вопрос о корректности выполнения, а не о правильности выбора работы. Поймать подмену задачи можно, только читая условие, а не решение.
  kind: open
  reference: 'Все проверки строятся из того же понимания задачи, что и реализация: чем их больше, тем тщательнее подтверждается неверная трактовка. Ошибка выбора задачи лежит вне кода и вне тестов, поэтому её видно только при сопоставлении результата с исходной формулировкой проблемы. Нужен вход, которого у приёмки нет: сама постановка задачи и вопросы «та ли это проблема», «не разросся ли скоуп», «записаны ли допущения», «можно ли продолжить с этого состояния».'
