- concept: фиксированная схема отчёта делает результаты ревью сопоставимыми между запусками и версиями
  question: Накопилось 40 отчётов ревью по разным задачам. Объясни своими словами, что даёт заранее заданная схема полей, чего не даст такой же объём свободных комментариев.
  explanation: 'Ценность структуры не в аккуратности, а в агрегируемости: отчёт становится данными, с которыми работают запросом, а не чтением.'
  kind: open
  reference: 'Одинаковые поля с известными допустимыми значениями делают отчёты сравнимыми без чтения: можно отфильтровать все случаи с провальным измерением, посмотреть распределение вердиктов, сравнить два прогона одного изменения после смены промпта, построить калибровку. Свободный текст пришлось бы каждый раз интерпретировать заново, и одно и то же явление в сорока отчётах будет названо сорока разными фразами. Схема также позволяет показывать отчёт в интерфейсе и передавать дальше по конвейеру без угадывания смысла формулировок.'
  id: 015-kontrakt-otcheta-2
