- concept: одинаковый итог соответствует разным профилям риска, и дальше работать с ними нужно по-разному
  question: Две работы получили одинаковый итог по рубрике ревьюера, но у первой просело попадание в задачу, а у второй — качество приёмки. Объясни своими словами, что даёт разбивка по измерениям такого, чего не даёт общий итог.
  explanation: 'Ради этого рубрика и держит измерения раздельными: отчёт нужен не для ранжирования работ, а для решения, что делать со следующим проходом.'
  kind: open
  reference: 'Итог говорит только «насколько хорошо в целом» и стирает адрес проблемы. Разбивка называет место: в первом случае надо вернуться к формулировке задачи и переделать само решение, во втором — решение может остаться, но команду приёмки нужно усилить до полной цели. Дальнейшие действия, стоимость доработки и риск в случае пропуска у этих двух работ разные, хотя число одно и то же. Плюс отдельные отметки показывают, какое именно измерение заметило проблему, — по одному числу этого не восстановить.'
  id: 010-ocenka-po-svidetelstvam-3
