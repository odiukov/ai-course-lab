- concept: три градации кодируют «провалено / частично / подтверждено» и намеренно не имитируют точность качественного суждения
  question: Ревьюеру предлагают заменить трёхступенчатую шкалу измерения на дробные оценки с десятыми долями. Что при этом проигрывается?
  explanation: Ревьюер не измеряет прибор, а читает свидетельства. Различие «требования нет / есть заметный пробел / подтверждено артефактами» он может обосновать; «одна и семь десятых за дисциплину границ» обосновать нечем, зато такая оценка выглядит убедительнее, чем есть.
  kind: choice
  options:
    - Дробность создаёт видимость измеренной точности там, где есть только качественное суждение; три ступени как раз и различают провал, частичное выполнение и подтверждённый артефактами результат
    - Дробные оценки нельзя сложить в итог
    - Дробные оценки делают измерения зависимыми друг от друга
    - Дробность требует удалить одно из измерений рубрики
  correct: 0
