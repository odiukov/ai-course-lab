- concept: гейт отвечает на детерминированно проверяемые факты, ревьюер выносит качественные суждения о соответствии замыслу
  question: Какой из вопросов гейт проверки может закрыть сам, без качественного суждения?
  explanation: Факт выхода за скоуп читается из списка затронутых файлов — это детерминированная проверка, как и код возврата приёмки. Вопросы о допущениях и о том, та ли работа сделана, требуют чтения постановки задачи и остаются за ревьюером.
  kind: choice
  options:
    - Достаточно ли задокументированы допущения, принятые по ходу работы
    - Изменялись ли файлы за пределами объявленного скоупа
    - Ту ли половину проблемы починил исполнитель
  correct: 1
  id: 002-geyt-i-revyuer-1
  fingerprint: 49c65c5d
- concept: качественные суждения ревьюера нельзя свести к более строгому набору детерминированных правил гейта
  question: Почему нельзя просто ужесточить гейт так, чтобы он заменил ревьюера? Объясни своими словами.
  explanation: Правило гейта проверяет, что нечто произошло; ревьюер оценивает, то ли это было. Второй вопрос не сворачивается в код выхода.
  kind: open
  reference: 'Гейт умеет проверять только то, что выражается наблюдаемым фактом: запускалась ли команда приёмки, каков код возврата, какие файлы изменены, соблюдены ли правила. Вопросы ревьюера — та ли это была работа, доказывает ли команда приёмки цель или ослабленную версию, записаны ли допущения, сможет ли следующая сессия продолжить — требуют сопоставления результата с формулировкой задачи и оценки в шкале, а не бинарного факта. Нужны оба слоя: гейт даёт надёжные факты, ревьюер связывает их с намерением.'
  id: 002-geyt-i-revyuer-2
  fingerprint: 1ceade92
