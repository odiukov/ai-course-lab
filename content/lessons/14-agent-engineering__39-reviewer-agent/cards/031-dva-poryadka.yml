- concept: 'масштаб позиционного смещения: около 40% пар меняют победителя при перестановке порядка'
  question: Судья-LLM сравнивает 250 пар ответов в двух порядках. По измерениям такого судьи примерно в 40% пар после перестановки побеждает другой ответ. Сколько пар дадут согласованный результат?
  explanation: '250 × (1 − 0,40) = 150. Замеры GPT-4 дают около 40% саморасхождения между порядками (A,B) и (B,A): почти половина вердиктов определяется местом, а не содержанием, поэтому одиночное попарное сравнение непригодно как измерение.'
  kind: numeric
  answer: 150
