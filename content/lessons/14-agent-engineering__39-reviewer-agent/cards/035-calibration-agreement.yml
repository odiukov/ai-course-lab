- concept: последовательности разной длины и пустой набор — явная ошибка входа, а не молчаливое усечение или ноль
  question: В функцию расчёта согласия передали 20 эталонных вердиктов и 19 фактических. Как правильно поступить?
  explanation: 'Попарный перебор молча обрежет длинную последовательность, и пропавший случай исчезнет из знаменателя — измерение станет тихо оптимистичным. Пустой набор отклоняют по той же причине: делить не на что, а 0.0 или 1.0 выглядели бы как результат измерения.'
  kind: choice
  options:
    - Сравнить попарно первые 19 позиций и вернуть долю от 19
    - Дополнить недостающий вердикт значением по умолчанию и считать по 20 позициям
    - 'Отклонить вход с ошибкой: непарные данные означают потерянный или лишний прогон'
    - Вернуть 0.0 — расхождение длин само по себе означает полное несогласие
