- concept: 'совпадение вердиктов проверяется точно: два разных типа провала — расхождение, а не частичное согласие'
  question: Эталон для случая — `soft_fail`, ревьюер выдал `hard_fail`. Как это учитывается при расчёте согласия?
  explanation: soft_fail и hard_fail адресуют работу разным получателям и запускают разные действия, поэтому подмена одного другим — реальная ошибка калибровки. Частичные баллы за «примерно верное направление» размывают порог и прячут именно те расхождения, ради которых набор существует.
  kind: choice
  options:
    - 'Как совпадение: оба вердикта отрицательные'
    - 'Как половина совпадения: направление верное, строгость разная'
    - 'Как расхождение: засчитывается только точное равенство вердиктов'
    - Случай исключается из расчёта как неоднозначный
