- concept: 'оценки предыдущего цикла не переносятся и не усредняются: одна правка может изменить сразу несколько измерений'
  question: В новом цикле исполнитель тронул один файл, чтобы убрать лишнее изменение. Можно ли оставить прежние оценки остальных измерений и пересчитать только скоуп?
  explanation: Измерения рубрики не разложены по файлам. Убранное лишнее изменение улучшает скоуп и может одновременно обнулить корректность — оценка, полученная на прошлой версии, к текущей не относится.
  kind: choice
  options:
    - Да, остальные измерения затронуты не были, пересчёт их не изменит
    - 'Нет, все измерения оцениваются заново: та же правка могла ослабить тест или сломать поведение'
    - Нет, но достаточно усреднить прежнюю и новую оценку по каждому измерению
  correct: 1
  id: 021-re-review-1
  fingerprint: 4de6e23d
- concept: отчёт прошлого цикла остаётся неизменным, повторное ревью создаёт отдельный документ
  question: Что должно случиться с отчётом первого цикла после того, как отработало повторное ревью?
  explanation: Прежний отчёт объясняет, почему вообще начались правки. Затерев его, теряешь возможность сравнить циклы и увидеть, что именно изменилось в оценке.
  kind: choice
  options:
    - Он остаётся нетронутым, а рядом появляется новый отчёт — так видна история циклов
    - 'Он обновляется на месте: вердикт и оценки заменяются актуальными'
    - Он удаляется, чтобы устаревший вердикт никого не сбивал с толку
  correct: 0
  id: 021-re-review-2
  fingerprint: 6d5936e0
- concept: результат повторного ревью — полноценный отчёт той же схемы, а не сокращённая сводка по закрытым находкам
  question: Какую форму должен иметь результат повторного ревью?
  explanation: Единая схема делает циклы сопоставимыми, а получателя отчёта — независимым от того, первый это прогон или пятый. Сокращённый формат пришлось бы читать по особым правилам.
  kind: choice
  options:
    - Список находок со статусом «закрыта / открыта» и без оценок
    - Патч к прежнему отчёту, описывающий только изменившиеся поля
    - 'Отчёт той же схемы, что и первичный: все измерения, доказательства, итог, вердикт'
  correct: 2
