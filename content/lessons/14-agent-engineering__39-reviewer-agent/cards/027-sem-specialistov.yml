    - Координатор раздаёт всем выбранным специалистам один и тот же снимок изменений со своим узким вопросом каждому
    - Специалисты одновременно работают каждый в своей области и возвращают отдельные заключения
    - Координатор принимает заключения и сводит их в один результат ревью
