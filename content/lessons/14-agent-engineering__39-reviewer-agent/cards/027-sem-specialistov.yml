- concept: 'координатор служит единой точкой запуска и сборки: наружу выходит один согласованный результат, а не набор отдельных заключений'
  question: Расставь этапы ревью пулом специалистов в правильном порядке.
  explanation: 'Специалисты общаются не друг с другом, а с координатором: он единственная точка входа и выхода. Иначе получателю пришлось бы самому склеивать несколько заключений.'
  kind: order
  items:
