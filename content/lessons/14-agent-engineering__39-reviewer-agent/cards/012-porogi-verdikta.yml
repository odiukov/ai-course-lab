- concept: нулевой балл по любому измерению переводит вердикт в hard fail независимо от суммы
  question: Прогон ревьюера получил максимальный балл по всем измерениям рубрики, кроме единственного, где по критерию нет приемлемого результата и выставлен низший балл. Сумма при этом попадает в проходную полосу. Какой вердикт выносится?
  explanation: 'Правило одного нуля: ноль по любому измерению даёт hard fail независимо от суммы. Сумма 8 из 10 при нуле всё равно hard fail — ноль означает не «есть куда расти», а отсутствие приемлемого результата по критерию.'
  kind: choice
  options:
    - pass — сумма в проходной полосе
    - soft fail — одно слабое измерение снижает вердикт на ступень
    - hard fail — низший балл по любому измерению перебивает сумму
  correct: 2
  id: 012-porogi-verdikta-1
  fingerprint: 5a490bfe
- concept: при отсутствии нулевых баллов вердикт целиком определяется полосой, в которую попала сумма
  question: Ни одно измерение рубрики не получило низший балл. Чем в этом случае отличается soft fail от hard fail?
  explanation: 'Без нулей работает только первая проверка — сумма. Полосы: 7–10 pass, 5–6 soft fail, 0–4 hard fail. Правило одного нуля — вторая, независимая проверка поверх этих полос; когда нулей нет, оно не срабатывает.'
  kind: choice
  options:
    - 'Только полосой, в которую попала сумма баллов: hard fail — нижняя полоса, soft fail — промежуточная между ней и pass'
    - Количеством измерений с неполным баллом, вне зависимости от суммы
    - 'Тем, какие именно измерения просели: Problem fit и Verification quality дают hard fail, остальные — soft fail'
  correct: 0
