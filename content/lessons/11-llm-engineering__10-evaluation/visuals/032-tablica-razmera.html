<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Сколько случаев нужно, чтобы увидеть регрессию 5%</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1d2024; --muted:#5d6570; --line:#b9c0c8;
    --bar:#7f8b98; --hit:#1f7a5a; --miss:#b4462f; --edge:#8b93a0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181c; --fg:#e8eaed; --muted:#9aa3ae; --line:#4a525c;
      --bar:#6d7a88; --hit:#4fbf94; --miss:#e0755a; --edge:#7a838f;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;text-align:center;}
  svg{display:block;width:100%;height:auto;max-height:480px;}
  .fail{font-size:14px;line-height:1.5;color:var(--fg);padding:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Ширина 95% доверительного интервала при точности 90%</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var DATA = [
      {n:50,   w:19, verdict:"нет",        ok:0},
      {n:100,  w:12, verdict:"едва",       ok:1},
      {n:200,  w:9,  verdict:"да",         ok:2},
      {n:500,  w:5,  verdict:"уверенно",   ok:2},
      {n:1000, w:3,  verdict:"точно",      ok:2}
    ];
    var TARGET = 5; // регрессия 5 пунктов

    // ---- холст (литералы) ----
    var VBW = 760, VBH = 400;
    var PAD = 6, LW = 1.5, FS = 13, FSS = 11.5;

    // ---- единая система координат ----
    // x — пункты ширины интервала (0..20), y — номер строки (0..5.6)
    var origin = {x: 250, y: 92};
    var scale  = {x: 21, y: 46};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y + y * scale.y; }

    var NS = "http://www.w3.org/2000/svg";
    function el(t,a){ var e=document.createElementNS(NS,t);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,cls,anchor){
      var e=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
        'font-size':cls==='s'?FSS:FS, fill:'currentColor'});
      e.textContent=s; return e;
    }

    var svg = el('svg',{viewBox:"0 0 "+VBW+" "+VBH,
      preserveAspectRatio:"xMidYMid meet", role:"img"});

    // ---- ось пунктов сверху ----
    var axisY = sy(-0.85);
    svg.appendChild(el('line',{x1:sx(0),y1:axisY,x2:sx(20),y2:axisY,
      stroke:'var(--line)','stroke-width':LW}));
    [0,5,10,15,20].forEach(function(v){
      svg.appendChild(el('line',{x1:sx(v),y1:axisY,x2:sx(v),y2:sy(-1.0),
        stroke:'var(--line)','stroke-width':LW}));
      var t=txt(sx(v), sy(-1.15), String(v), 's'); svg.appendChild(t);
    });
    var cap = txt(sx(10), sy(-1.6), "ширина интервала, пунктов", 's');
    cap.setAttribute('fill','var(--muted)'); svg.appendChild(cap);

    // ---- заголовки колонок ----
    var hN = txt(sx(-1.2), sy(-0.9), "случаев", 's','end');
    hN.setAttribute('fill','var(--muted)'); svg.appendChild(hN);
    var hV = txt(sx(20.6), sy(-0.9), "видно 5 пунктов?", 's','start');
    hV.setAttribute('fill','var(--muted)'); svg.appendChild(hV);

    // ---- порог 5 пунктов ----
    svg.appendChild(el('line',{x1:sx(TARGET),y1:sy(-0.55),
      x2:sx(TARGET),y2:sy(DATA.length-0.55),
      stroke:'var(--edge)','stroke-width':LW,'stroke-dasharray':'5 4'}));
    var thr = txt(sx(TARGET), sy(DATA.length-0.15), "порог: 5 пунктов", 's');
    thr.setAttribute('fill','var(--muted)'); svg.appendChild(thr);

    // ---- строки таблицы ----
    var COLOR = ['var(--miss)','var(--edge)','var(--hit)'];
    DATA.forEach(function(d,i){
      var y = sy(i);
      svg.appendChild(el('line',{x1:sx(0),y1:y,x2:sx(20),y2:y,
        stroke:'var(--line)','stroke-width':LW*0.5,'stroke-dasharray':'2 5'}));

      // полоса ширины интервала
      svg.appendChild(el('line',{x1:sx(0),y1:y,x2:sx(d.w),y2:y,
        stroke: d.w<=TARGET ? 'var(--hit)' : 'var(--bar)',
        'stroke-width':11,'stroke-linecap':'round'}));

      // подпись слева: число случаев
      svg.appendChild(txt(sx(-1.2), y + PAD*0.7, String(d.n), '', 'end'));

      // подпись ширины — над концом полосы
      var wl = txt(sx(d.w), y - PAD*1.9, d.w + " п.", 's');
      wl.setAttribute('fill','var(--muted)'); svg.appendChild(wl);

      // вердикт справа
      var v = txt(sx(20.6), y + PAD*0.7, d.verdict, '', 'start');
      v.setAttribute('fill', COLOR[d.ok]); svg.appendChild(v);
    });

    // ---- стрелка: вчетверо больше случаев = вдвое уже ----
    var ax = sx(-4.6);
    var y0 = sy(0), y1 = sy(2);
    svg.appendChild(el('line',{x1:ax,y1:y0,x2:ax,y2:y1 - PAD*1.4,
      stroke:'var(--edge)','stroke-width':LW}));
    var hd = el('polygon',{points:
      sx(-4.6)+","+sy(2)+" "+sx(-4.95)+","+sy(1.78)+" "+sx(-4.25)+","+sy(1.78),
      fill:'var(--edge)'});
    svg.appendChild(hd);
    var a1 = txt(ax - PAD, sy(0.35), "×4 случаев", 's','end');
    a1.setAttribute('fill','var(--muted)'); svg.appendChild(a1);
    var a2 = txt(ax - PAD, sy(0.85), "= вдвое уже", 's','end');
    a2.setAttribute('fill','var(--muted)'); svg.appendChild(a2);

    // ---- легенда ----
    var lg = txt(sx(10), sy(DATA.length+0.55),
      "минимум 200 случаев для решения ship / block; 500+ для сравнения двух систем", 's');
    lg.setAttribute('fill','var(--muted)'); svg.appendChild(lg);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fail">Схема не построилась. Она должна показывать: ' +
      'при точности 90% ширина 95% доверительного интервала равна 19 пунктам на 50 случаях (регрессию 5 пунктов не видно), ' +
      '12 пунктам на 100 (едва), 9 на 200 (видно), 5 на 500 (уверенно), 3 на 1000 (точно). ' +
      'Чтобы сузить интервал вдвое, случаев нужно вчетверо больше.</div>';
  }
})();
</script>
</body>
</html>
