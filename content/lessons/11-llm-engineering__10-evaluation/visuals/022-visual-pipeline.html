<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Конвейер оценки</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --box:#f2f5f8; --stroke:#3c4650;
    --arrow:#5a6772; --lab:#2b6cb0; --loop:#b7791f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e8ecef; --box:#1f252b; --stroke:#8b98a5;
      --arrow:#8b98a5; --lab:#7fb2e5; --loop:#e0b050;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{background:var(--bg);padding:8px 4px;}
  h2{margin:0 0 6px;padding:0 8px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .box{fill:var(--box);stroke:var(--stroke);}
  .bt{fill:var(--fg);font-size:13px;font-weight:600;}
  .lab{fill:var(--lab);font-size:11.5px;}
  .loopl{fill:var(--loop);font-size:11.5px;}
  .ln{stroke:var(--arrow);fill:none;}
  .lp{stroke:var(--loop);fill:none;}
  .ah{fill:var(--arrow);stroke:none;}
  .ahp{fill:var(--loop);stroke:none;}
  #fb{padding:0 8px 8px;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Конвейер оценки: 6 шагов и подписи на стрелках</h2>
  <svg id="d" viewBox="0 0 760 250" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Линейная цепочка Prompt, Run, Collect, Score, Compare, Decide с возвратом от Decide к Prompt"></svg>
  <div id="fb"></div>
</div>
<script>
(function(){
  var svg=document.getElementById("d");
  try{
    // ---- данные схемы ----
    var STEPS=[
      {id:"P", name:"Prompt",  x:0, out:"тестовые случаи",         side:"up"},
      {id:"R", name:"Run",     x:2, out:"выходы модели",           side:"down"},
      {id:"C", name:"Collect", x:4, out:"выход + эталон",          side:"up"},
      {id:"S", name:"Score",   x:6, out:"оценки + интервалы",      side:"down"},
      {id:"CM",name:"Compare", x:8, out:"база против новой",       side:"up"},
      {id:"D", name:"Decide",  x:10,out:"выкатить или блокировать",side:"loop"}
    ];
    var ROW=0, BW=1.55, BH=0.62, LOOP=-1.5;

    // ---- одна пара функций перевода ----
    var origin={x:60,y:150}, scale=62;
    function sx(x){return origin.x + x*scale;}
    function sy(y){return origin.y + y*scale;}

    var NS="http://www.w3.org/2000/svg";
    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(x,y,s,c,anch,dy){
      var t=el("text",{x:x,y:y,"class":c,"text-anchor":anch});
      if(dy)t.setAttribute("dy",dy); t.textContent=s; return t;}

    var LW=1.6, PAD=7, HL=0.14, HW=0.075; // отступ подписи в пикселях, остальное — в единицах данных

    function head(x,y,dir){ // dir: 1 вправо, -1 влево
      var p=[sx(x)+","+sy(y),
             sx(x-dir*HL)+","+sy(y-HW),
             sx(x-dir*HL)+","+sy(y+HW)].join(" ");
      el("polygon",{points:p,"class":"ah"});
    }

    // ---- прямоугольники ----
    STEPS.forEach(function(s){
      var l=sx(s.x-BW/2), t=sy(ROW-BH/2);
      el("rect",{x:l,y:t,width:sx(s.x+BW/2)-l,height:sy(ROW+BH/2)-t,
        rx:sx(0.12)-sx(0),"class":"box","stroke-width":LW});
      txt(sx(s.x),sy(ROW),s.name,"bt","middle","0.36em");
    });

    // ---- прямые стрелки + подписи у хвоста ----
    for(var i=0;i<STEPS.length-1;i++){
      var a=STEPS[i], b=STEPS[i+1];
      var x1=a.x+BW/2, x2=b.x-BW/2;
      el("line",{x1:sx(x1),y1:sy(ROW),x2:sx(x2-HL),y2:sy(ROW),
        "class":"ln","stroke-width":LW});
      head(x2,ROW,1);
      var mx=sx(x1)+PAD;
      if(a.side==="up") txt(mx,sy(ROW)-PAD,a.out,"lab","start");
      else              txt(mx,sy(ROW)+PAD,a.out,"lab","start","0.75em");
    }

    // ---- возврат Decide -> Prompt ----
    var d=STEPS[5], p=STEPS[0];
    var yUp=ROW-1.05;
    el("path",{d:[
      "M",sx(d.x),sy(ROW-BH/2),
      "L",sx(d.x),sy(yUp),
      "L",sx(p.x),sy(yUp),
      "L",sx(p.x),sy(ROW-BH/2+HL)
    ].join(" "),"class":"lp","stroke-width":LW,"stroke-linejoin":"round"});
    var lp=[sx(p.x)+","+sy(ROW-BH/2),
            sx(p.x-HW)+","+sy(ROW-BH/2-HL),
            sx(p.x+HW)+","+sy(ROW-BH/2-HL)].join(" ");
    el("polygon",{points:lp,"class":"ahp"});
    txt(sx((p.x+d.x)/2),sy(yUp)-PAD,d.out,"loopl","middle");
    txt(sx((p.x+d.x)/2),sy(yUp)+PAD,"круг, а не список из шести пунктов","loopl","middle","0.75em");

    // ---- пояснение снизу ----
    txt(sx(0-BW/2),sy(LOOP*-1+0.05),
      "Стрелка без входа = шаг, который не выполнить: Score не идёт без эталона, Decide — без двух наборов оценок.",
      "lab","start","0.75em");
  }catch(e){
    svg.remove();
    document.getElementById("fb").textContent=
      "Схема должна была показать цепочку Prompt → Run → Collect → Score → Compare → Decide "+
      "с подписями на стрелках: тестовые случаи, выходы модели, выход + эталон, оценки + интервалы, "+
      "база против новой, выкатить или блокировать — и обратную стрелку от Decide к Prompt, замыкающую круг.";
  }
})();
</script>
</body>
</html>
