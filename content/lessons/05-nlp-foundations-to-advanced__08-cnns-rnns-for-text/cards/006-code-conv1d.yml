- concept: порядок операций при построении карты признаков одномерной свёрткой по текстовым embeddings
  question: Расположи операции прямого прохода текстовой свёртки в правильном порядке.
  explanation: Свёртка ожидает каналы перед осью длины, поэтому признаки embedding сначала переносят на ось каналов. Затем вычисляют свёртку и применяют нелинейность к её активациям.
  kind: order
  items:
    - Переставить embeddings из [N, L, E] в [N, E, L]
    - Передать преобразованный тензор в слой одномерной свёртки
    - Применить нелинейность к полученной карте признаков
  id: 006-code-conv1d-1
  fingerprint: 5cc963a1
- concept: соответствие параметров текстовой свёртки размерности embedding, числу фильтров и ширине окна
  question: Как правильно интерпретировать основные параметры слоя одномерной свёртки над текстовыми embeddings?
  explanation: Признаки embedding выступают входными каналами. Каждый выходной канал соответствует отдельному обучаемому фильтру, а размер ядра определяет, сколько соседних позиций текста фильтр рассматривает одновременно.
  kind: choice
  options:
    - in_channels — размерность embedding, out_channels — число фильтров, kernel_size — ширина окна по токенам
    - in_channels — длина текста, out_channels — размер батча, kernel_size — размерность embedding
    - in_channels — число классов, out_channels — длина текста, kernel_size — число фильтров
    - in_channels — размер батча, out_channels — размерность embedding, kernel_size — число классов
  correct: 0
