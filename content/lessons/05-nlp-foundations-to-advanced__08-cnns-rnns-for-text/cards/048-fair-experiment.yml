- concept: выигрыш разных ширин TextCNN нужно отделять от выигрыша большей ёмкости модели
  question: 'Сравнивают две TextCNN: у первой ширина окна 8 и 210 фильтров, у второй — ширины 6, 8 и 9 по 70 фильтров. Как корректно интерпретировать такое сравнение?'
  explanation: В обеих моделях после pooling получается 210 признаков, поэтому преимущество нельзя объяснить только большей размерностью выхода. Однако число параметров свёрток зависит ещё и от ширины каждого ядра, поэтому его нужно посчитать и привести рядом с метрикой.
  kind: choice
  options:
    - Оно доказывает, что разные ширины полезнее одной, поскольку обе модели используют одинаковое число свёрточных ветвей
    - Оно выравнивает размер объединённого вектора признаков, но для вывода о пользе разных ширин нужно также сопоставить и указать число параметров
    - Оно некорректно, потому что модели с разными ширинами фильтров нельзя сравнивать на одном датасете
    - Оно проверяет только влияние случайной инициализации, а не архитектуры
  correct: 1
  id: 048-fair-experiment-1
  fingerprint: 62c4c2a3
- concept: способ pooling влияет на обучение LSTM через разные маршруты градиента
  question: Объясни своими словами, почему для честного сравнения max-pooling, mean-pooling и последнего состояния недостаточно применить их к выходам одной уже обученной LSTM.
  explanation: Pooling является частью обучаемого конвейера, а не только операцией над готовыми признаками. Замена pooling меняет распределение градиента по последовательности и, следовательно, то, какие представления выучит LSTM.
  kind: open
  reference: 'Каждый способ pooling направляет градиент к временным шагам по-разному: max — к позициям с максимумами, mean — ко всем незамаскированным позициям, last — к последнему настоящему токену. Поэтому для каждого варианта LSTM нужно обучить заново при одинаковых остальных условиях.'
  id: 048-fair-experiment-2
  fingerprint: f4f1ece5
- concept: повторные запуски позволяют оценить устойчивость архитектурного сравнения к случайности обучения
  question: Расположи действия в порядке проведения воспроизводимого сравнения вариантов модели.
  explanation: Общие условия устраняют систематические различия между вариантами, а повторные запуски показывают влияние случайной инициализации и порядка батчей. Среднее характеризует типичный результат, а разброс — устойчивость вывода.
  kind: order
  items:
    - Зафиксировать общий split данных, протокол обучения и бюджет настройки
    - Независимо обучить каждый вариант на одном и том же заранее выбранном наборе seed
    - Вычислить macro-F1 на отложенной выборке для каждого запуска
    - Сравнить среднее и разброс результатов, а не выбирать лучший отдельный запуск
  id: 048-fair-experiment-3
  fingerprint: 5aae559c
