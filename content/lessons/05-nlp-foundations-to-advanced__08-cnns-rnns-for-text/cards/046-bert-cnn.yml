- concept: контекстный энкодер создаёт разные признаки для одинакового токена в зависимости от окружения даже при замороженных весах
  question: Один и тот же многозначный токен встречается в двух предложениях с разным смыслом. Что подаст замороженный контекстный энкодер на вход свёрточному классификатору?
  explanation: Заморозка запрещает обучение весов BERT, но не отключает его прямой проход. Выход каждого токена по-прежнему зависит от окружающих токенов, поэтому CNN получает контекстные, а не статические признаки.
  kind: choice
  options:
    - Одинаковые векторы, потому что замороженный энкодер работает как статическая таблица embeddings
    - Разные векторы, потому что прямой проход учитывает контекст каждого предложения
    - Случайные векторы, потому что веса энкодера нельзя обновлять
    - Один общий вектор на всё предложение без представлений отдельных токенов
  correct: 1
  id: 046-bert-cnn-1
  fingerprint: b6cb62b5
- concept: заморозка энкодера сокращает стоимость обучения, но не устраняет его размер и вычисления при инференсе
  question: Объясни своими словами, почему замороженный большой энкодер экономит ресурсы при обучении классификатора, но не превращает всю модель в лёгкую модель для мобильного инференса.
  explanation: У BERT-base заморожены примерно 110 миллионов весов, поэтому память на их градиенты не нужна. Но сами веса занимают место, а BERT продолжает вычислять контекстные признаки для каждого входа; заморозка влияет на обучение, а не отменяет инференс энкодера.
  kind: open
  reference: Для замороженного энкодера не вычисляют градиенты и не хранят связанные с его обучением состояния, поэтому обучаются только свёртки и классификатор. Однако параметры энкодера всё равно нужно хранить, а каждый новый текст всё равно проходит через его прямой проход, поэтому размер модели и основные вычислительные затраты сохраняются.
  id: 046-bert-cnn-2
  fingerprint: 879e0dae
