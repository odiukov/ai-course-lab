- concept: результаты ветвей TextCNN объединяются по оси признаков с сохранением соответствия объектам батча
  question: После свёртки, активации и глобального pooling каждая ветвь TextCNN вернула тензор с осями «объект батча, фильтр». Как правильно собрать единый вектор признаков?
  explanation: После global max-pooling длина последовательности исчезает, и каждая ветвь даёт по одному значению на фильтр для каждого текста. Склейка по оси фильтров объединяет признаки ширин 2, 3 и 4, не смешивая строки батча.
  kind: choice
  options:
    - Склеить тензоры по оси фильтров, оставив ось батча общей
    - Склеить тензоры по оси батча, оставив ось фильтров общей
    - Склеить карты свёрток по оси позиций до глобального pooling
    - Усреднить все ветви в один скаляр для каждого объекта
  correct: 0
  id: 011-code-textcnn-features-1
  fingerprint: d574153b
- concept: полный конвейер получения объединённых признаков TextCNN
  question: Расположите операции в порядке формирования единого представления текста несколькими ветвями TextCNN.
  explanation: Свёртка сначала создаёт позиционные отклики, активация преобразует их, а pooling оставляет самый сильный отклик каждого фильтра. Только после этого компактные результаты ветвей ширины 2, 3 и 4 можно объединить по оси признаков.
  kind: order
  items:
    - В каждой ветви вычислить карту признаков одномерной свёрткой
    - Применить функцию активации к карте признаков
    - Выполнить глобальный max-pooling по позициям
    - Склеить результаты всех ветвей по оси признаков
  id: 011-code-textcnn-features-2
  fingerprint: 57ae64d3
