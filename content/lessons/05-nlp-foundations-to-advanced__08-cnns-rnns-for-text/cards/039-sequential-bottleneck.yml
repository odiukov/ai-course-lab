- concept: RNN допускает параллелизм по объектам батча и компонентам состояния, несмотря на сериализацию позиций одной последовательности
  question: Какие вычисления при обучении RNN можно распараллелить на GPU, если временные позиции одной последовательности зависят друг от друга?
  explanation: Рекуррентная зависимость запрещает параллельное вычисление временных позиций внутри одной цепочки, но не мешает параллелизму по объектам батча и координатам тензоров внутри каждого шага.
  kind: open
  reference: Можно одновременно обрабатывать независимые последовательности в батче и параллельно вычислять компоненты векторных и матричных операций внутри одного временного шага. Однако следующий временной шаг той же последовательности должен дождаться предыдущего состояния.
