- concept: последовательность токенов образует матрицу длина последовательности на размерность embedding
  question: Последовательность содержит L токенов, каждый из которых представлен embedding размерности d. Токены расположены по строкам. Заполни форму входной матрицы.
  explanation: Каждому токену соответствует отдельная строка длины d, поэтому у матрицы L строк и d столбцов.
  kind: cloze
  template: shape(X) = ___
  answer: (L, d)
  accept:
    - L × d
    - L x d
    - (L,d)
  id: 004-embedding-sequence-1
  fingerprint: d8f47eec
- concept: позиция токена задаётся строкой последовательности, а не значениями его базового embedding
  question: Повторяющийся токен обрабатывается обычным embedding lookup без контекстуализации и позиционных добавок. Что верно о строках входной матрицы, соответствующих его повторениям?
  explanation: Обычный lookup возвращает для одного токена один и тот же базовый embedding. Положение повторения определяется индексом строки; изменить сам вектор могут позиционные добавки или контекстуализация.
  kind: choice
  options:
    - Они содержат одинаковые векторы, но находятся на разных позициях среди строк
    - Они обязательно содержат разные векторы из-за разных позиций
    - Они объединяются в одну строку до передачи модели
    - Каждый следующий вектор вычисляется из всех предыдущих токенов
