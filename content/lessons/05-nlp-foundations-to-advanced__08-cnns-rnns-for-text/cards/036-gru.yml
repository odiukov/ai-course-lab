- concept: update gate управляет смешиванием прежнего hidden state и кандидата нового состояния
  question: Что происходит, когда update gate решает почти полностью сохранить прежнее hidden state?
  explanation: Update gate задаёт баланс между прежним состоянием и новым кандидатом. При преобладании старой памяти hidden state меняется лишь незначительно.
  kind: choice
  options:
    - Кандидат состояния полностью заменяет прежнюю память
    - Новое hidden state остаётся близким к прежнему
    - GRU создаёт отдельный cell state для хранения прошлого
  correct: 1
