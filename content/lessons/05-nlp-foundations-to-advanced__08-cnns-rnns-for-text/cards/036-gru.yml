- concept: GRU сокращает число параметров за счёт более простой гейтированной архитектуры без отдельного cell state
  question: Объясни своими словами, почему GRU при одинаковых размерностях входа и hidden state обычно содержит меньше параметров, чем LSTM.
  explanation: LSTM вычисляет четыре группы преобразований, а GRU — три. Поэтому при одинаковых размерностях у GRU примерно на четверть меньше параметров, хотя это само по себе не гарантирует более высокого качества.
  kind: open
  reference: 'GRU не хранит отдельный cell state и использует более простой набор гейтированных преобразований: reset gate, update gate и кандидат состояния. Поэтому ей требуется меньше матриц весов, чем LSTM.'
