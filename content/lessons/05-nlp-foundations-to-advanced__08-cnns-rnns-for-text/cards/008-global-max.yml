- concept: global max-pooling выбирает максимальную активацию из всей карты признака
  question: 'Фильтр TextCNN выдал карту признака: 0,17; 0,46; 0,88; 0,52; 0,23. Какое значение передаст дальше global max-pooling?'
  explanation: Global max-pooling сравнивает активации во всех позициях и оставляет наибольшую. Здесь это 0,88.
  kind: numeric
  answer: 0.88
  tolerance: 0.001
  id: 008-global-max-1
  fingerprint: 54d2dc5c
- concept: по результату global max-pooling нельзя восстановить количество и позиции срабатываний фильтра
  question: В одном документе фильтр сильно сработал лишь в одном месте, а в другом — в нескольких. Максимальная активация в обоих документах одинакова. Какое различие потеряет global max-pooling?
  explanation: Pooling сохраняет только максимум каждого фильтра. Поэтому одинаковый максимум даёт одинаковый результат независимо от того, сколько раз и в каких позициях возникали сильные активации.
  kind: choice
  options:
    - Количество и расположение сильных срабатываний
    - Значение самой сильной активации
    - Принадлежность активаций конкретному фильтру
  correct: 0
