- concept: коэффициент затухания описывает относительное изменение масштаба и не зависит от исходного градиента
  question: Почему при одинаковых рекуррентном весе и числе переходов функция vanishing_factor должна вернуть одинаковый результат для разных исходных градиентов?
  explanation: Степень рекуррентного веса задаёт относительный множитель. Она показывает, какая доля исходного градиента сохранится, но не вычисляет сам итоговый градиент.
  kind: open
  reference: 'Функция вычисляет только общий коэффициент изменения масштаба. Исходный градиент в неё не входит: фактический итоговый градиент получают отдельным умножением исходного значения на этот коэффициент.'
