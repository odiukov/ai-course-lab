- concept: параллельные свёртки разных ширин обнаруживают локальные признаки разного масштаба
  question: Какое преимущество даёт TextCNN параллельное применение свёрточных фильтров с разной шириной окна?
  explanation: Ширина окна задаёт размер локального контекста, доступного фильтру. Параллельные ветви с разными ширинами позволяют одной модели искать фразы нескольких масштабов, после чего их признаки объединяются.
  kind: choice
  options:
    - Каждое слово получает отдельный набор embeddings
    - Модель может распознавать как короткие, так и более протяжённые локальные фразы
    - Свёртка начинает учитывать все предыдущие токены через скрытое состояние
    - Модель перестаёт зависеть от порядка токенов внутри каждого окна
  correct: 1
  id: 010-multiple-widths-1
  fingerprint: 90ba87be
- concept: ширина фильтра задаёт поле зрения, а число фильтров — количество обучаемых детекторов этого масштаба
  question: Объясни своими словами, чем в TextCNN различаются ширина свёрточного фильтра и количество фильтров одной ширины.
  explanation: 'Одинаковая ширина не означает один распознаваемый оборот: несколько фильтров этого размера обучаются реагировать на разные локальные признаки. Добавление другой ширины меняет масштаб рассматриваемого контекста.'
  kind: open
  reference: Ширина определяет, сколько соседних токенов одновременно видит фильтр. Количество фильтров определяет, сколько разных обучаемых шаблонов модель может обнаруживать в окнах такого размера.
  id: 010-multiple-widths-2
  fingerprint: 34a2ba6b
