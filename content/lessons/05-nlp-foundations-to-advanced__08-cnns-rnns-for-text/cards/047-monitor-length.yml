- concept: связь качества с длиной текста является диагностическим сигналом, а не доказательством потери дальнего контекста
  question: Почему снижение точности на длинных текстах нельзя считать окончательным доказательством того, что RNN теряет дальний контекст?
  explanation: Срез по длине показывает, где возникает проблема, но не изолирует её причину. Для причинного вывода нужно проверить наполненность групп и исключить различия в тематике, разметке и других свойствах примеров.
  kind: open
  reference: 'Длина может быть связана с другими факторами сложности: тематикой, структурой, распределением меток или качеством разметки. Кроме того, оценки в малонаполненных группах нестабильны. Гипотеза о потере дальнего контекста становится убедительнее при достаточном числе примеров и после контроля возможных смешивающих факторов.'
