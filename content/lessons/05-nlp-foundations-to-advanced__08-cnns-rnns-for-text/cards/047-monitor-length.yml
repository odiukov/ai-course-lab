- concept: надёжная проверка дальнего контекста требует достаточной выборки и контроля смешивающих факторов
  question: Какой эксперимент лучше всего проверяет гипотезу, что падение качества связано именно с дальними зависимостями?
  explanation: Достаточная наполненность уменьшает случайный шум, а выравнивание по теме, меткам и разметке ослабляет альтернативные объяснения. Тогда устойчивое ухудшение с длиной сильнее поддерживает гипотезу о проблеме дальнего контекста.
  kind: choice
  options:
    - Сравнить достаточно наполненные группы текстов разной длины, выровненные по теме, меткам и качеству разметки
    - Сравнить общую точность двух моделей без учёта длины входов
    - Рассмотреть несколько самых длинных ошибочных текстов
    - Обучить модель дольше на той же выборке и не анализировать отдельные группы
