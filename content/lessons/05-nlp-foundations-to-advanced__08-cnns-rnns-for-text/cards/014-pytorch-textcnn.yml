- concept: ModuleList регистрирует набор обучаемых слоёв как часть PyTorch-модели
  question: Почему набор свёрточных слоёв внутри наследника nn.Module следует хранить в nn.ModuleList, а не в обычном списке Python?
  explanation: Обычный список хранит объекты Python, но не сообщает nn.Module, что внутри находятся дочерние слои. ModuleList делает параметры всех свёрток видимыми для стандартных механизмов PyTorch.
  kind: open
  reference: nn.ModuleList регистрирует вложенные слои, поэтому их параметры обнаруживаются моделью, передаются оптимизатору, сохраняются в state_dict и перемещаются между устройствами вместе со всей моделью.
  id: 014-pytorch-textcnn-1
  fingerprint: a3987faa
- concept: Dropout действует случайно при обучении и отключается при инференсе
  question: Как меняется поведение слоя nn.Dropout после переключения TextCNN из режима обучения в режим оценки и зачем это нужно?
  explanation: Во время обучения случайное скрытие признаков мешает классификатору чрезмерно полагаться на отдельные сильные детекторы. После вызова eval() Dropout работает детерминированно и не обнуляет признаки.
  kind: open
  reference: В режиме обучения Dropout случайно обнуляет часть признаков, уменьшая переобучение. В режиме оценки он перестаёт вносить случайность, поэтому одинаковый вход даёт стабильный результат.
  id: 014-pytorch-textcnn-2
  fingerprint: 398b7f62
