- concept: покомпонентный max-pooling может собрать итоговый вектор из координат разных hidden states
  question: Даны скрытые состояния h_a = [11, −9], h_b = [14, 8] и h_c = [10, 12]. Каков результат покомпонентного максимума по времени?
  explanation: 'Для каждой координаты максимум ищется независимо: 14 берётся из h_b, а 12 — из h_c. Max-pooling не обязан выбирать одно скрытое состояние целиком.'
  kind: choice
  options:
    - '[14, 12]'
    - '[14, 8]'
    - '[11, 12]'
    - '[35, 11]'
  correct: 0
