- concept: усреднение hidden states отражает распределённый по тексту сигнал и сглаживает одиночные выбросы
  question: Какую агрегацию hidden states разумно выбрать, если классификация должна учитывать общий фон всего текста, а одиночные сильные активации часто оказываются шумом? Объясни почему.
  explanation: Среднее собирает информацию со всех позиций, поэтому лучше отражает устойчивый распределённый сигнал. В отличие от максимума, одна экстремальная активация не определяет целую координату результата.
  kind: open
  reference: 'Среднее по времени: оно включает вклад каждого hidden state и уменьшает влияние одиночного выброса. Недостаток — редкий, но действительно важный сильный сигнал тоже может разбавиться.'
  id: 023-hidden-pooling-3
  fingerprint: '40162344'
