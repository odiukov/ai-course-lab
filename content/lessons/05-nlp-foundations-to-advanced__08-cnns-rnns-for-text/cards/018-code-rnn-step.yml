- concept: вычисление нового скрытого состояния одним шагом RNN
  question: Заполни выражение для одного шага простой RNN.
  explanation: Текущий вход и предыдущее скрытое состояние преобразуются разными матрицами, после чего складываются со смещением. Затем tanh поэлементно формирует новое скрытое состояние.
  kind: cloze
  template: h_t = torch.tanh(___)
  answer: W @ x_t + U @ h_prev + b
  accept:
    - W@x_t + U@h_prev + b
    - torch.matmul(W, x_t) + torch.matmul(U, h_prev) + b
  id: 018-code-rnn-step-1
  fingerprint: 0b15b118
- concept: параметры RNN используются совместно на всех временных шагах
  question: Почему для обработки следующего токена RNN не требуется создавать новые матрицы весов?
  explanation: Совместное использование W, U и b позволяет одной RNN обрабатывать последовательности разной длины без добавления новых параметров для каждой позиции.
  kind: open
  reference: На каждом временном шаге RNN повторно использует одни и те же параметры W, U и b. Меняются текущий вход и предыдущее скрытое состояние, но правило обновления остаётся общим для всей последовательности.
  id: 018-code-rnn-step-2
  fingerprint: ddb75015
