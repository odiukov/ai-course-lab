- concept: между LSTM и GRU нет универсально лучшей архитектуры
  question: Объясни своими словами, как выбрать между LSTM и GRU для новой задачи обработки текста.
  explanation: Обе архитектуры используют гейты и подходят для длинных зависимостей. GRU устроена компактнее, но итоговое качество зависит от данных, поэтому выбор подтверждают экспериментом.
