- concept: решение потоковой однонаправленной RNN является предварительным, потому что использует только уже поступивший контекст
  question: Объясни своими словами, почему классификация однонаправленной RNN в текстовом потоке может изменяться по мере поступления новых токенов.
  explanation: Низкая задержка достигается ценой отсутствия будущего контекста. Модель может выдать раннюю оценку, а затем уточнять её после каждого нового фрагмента.
  kind: open
  reference: На каждом обновлении однонаправленная RNN учитывает только полученный префикс и не видит будущих токенов. Новое продолжение добавляет контекст, который может усилить, ослабить или изменить прежний вывод, поэтому потоковый прогноз остаётся предварительным.
  id: 044-streaming-2
  fingerprint: f4045c60
