- concept: BiLSTM моделирует контекст токенов, а CRF — зависимости между выходными метками
  question: Объясните своими словами, почему CRF поверх BiLSTM не дублирует работу BiLSTM в задаче разметки токенов.
  explanation: У компонентов разные объекты моделирования. BiLSTM связывает токен с контекстом входного предложения, а CRF связывает решения на соседних позициях выхода. Их сочетание учитывает и смысл токена, и структуру последовательности меток.
  kind: open
  reference: 'BiLSTM строит для каждого токена контекстное представление и по нему оценивает возможные метки. CRF решает другую задачу: учитывает совместимость соседних меток и выбирает согласованную последовательность целиком.'
  id: 045-sequence-labeling-2
  fingerprint: 6ca83de4
