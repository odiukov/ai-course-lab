- concept: состояние хранит минимум, необходимый для продолжения, а не журнал рассуждений
  question: Исполнитель предлагает записать в файл состояния всю цепочку рассуждений сессии — примерно 23 экрана текста. Почему это хуже короткой сводки и что в записи обязано остаться?
  explanation: State отвечает на вопрос «где мы находимся», а не «как мы сюда пришли». Четыре поля дают точку продолжения; рассуждения — это трафик, который нужно перечитывать и который не превращается в действие.
  kind: open
  reference: 'Состояние читают на входе в каждую следующую сессию, поэтому его ценность — в скорости и однозначности продолжения, а не в полноте архива. Длинный журнал рассуждений заставляет заново интерпретировать чужой ход мысли, смешивает отброшенные гипотезы с актуальными фактами и стареет быстрее кода. Оставить нужно четыре вещи: какой результат сейчас нужен (задача), что уже сделано и какие файлы затронуты (прогресс), какое внешнее условие мешает двигаться (блокеры) и какой один конкретный шаг выполнить первым (следующее действие). Всё остальное — история, а не рабочее положение.'
  id: 008-state-3
  fingerprint: f6905571
