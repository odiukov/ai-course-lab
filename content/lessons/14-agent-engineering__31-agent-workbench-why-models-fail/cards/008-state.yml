  fingerprint: 59ff0317
- concept: следующее действие в состоянии — исполнимая операция, а не намерение
  question: Какая запись в поле «следующее действие» действительно позволяет новой сессии продолжить работу?
  explanation: 'Поле должно содержать один конкретный ближайший шаг, который можно выполнить, не занимаясь расследованием заново. «Разобраться» и «продолжить» — это описание намерения: следующая сессия всё равно потратит время на восстановление картины, ради чего состояние и заводили.'
  kind: choice
  options:
    - Получить сервисный токен у администратора и перезапустить tests/reports/test_export.py
    - Разобраться, почему выгрузка отчётов ведёт себя странно
    - Продолжить работу над задачей с того места, где остановились
    - Улучшить качество кода в модуле отчётов
  correct: 0
