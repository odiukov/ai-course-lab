- concept: 'передача дел реализуется парой триггеров вокруг устойчивой записи: конец прогона пишет, старт следующего читает'
  question: Расставь по порядку события, из которых складывается передача дел между двумя прогонами агента.
  explanation: 'Передача дел — не отдельная магия, а устойчивая запись, зажатая между двумя триггерами: один выдаёт её на выходе прогона, другой читает на входе следующего. Если запись не сделана до завершения или её никто не читает на старте, цепочка рвётся, и следующий прогон начинает с нуля независимо от качества сделанной работы.'
  kind: order
  items:
    - Срабатывает триггер завершения прогона
    - Воркер записывает итог и обоснование решений в устойчивое хранилище
    - Срабатывает триггер старта следующего прогона
    - Новый воркер читает запись и восстанавливает точку продолжения
  id: 033-primitives-map-3
