- concept: поверхность Instructions раскладывается на функции-проверки и политику, привязанную к старту рантайма
  question: В рабочем окружении есть правило «линтер обязан пройти перед коммитом» и файл-роутер, который на старте прогона указывает агенту, какие инструкции читать. На какие системные примитивы они раскладываются?
  explanation: 'Правило исполнимо: у него есть вход и результат, то есть это функция. Роутер ничего не исполняет — он задаёт, какой набор правил подключён к прогону, и применяется в момент старта рантайма, что делает его политикой. Хранение обоих в файлах ничего не говорит о примитиве: бэкенд хранения и роль в системе — разные вопросы.'
  kind: choice
  options:
    - Правило — функция-проверка, роутер — политика, применяемая при старте рантайма
    - Оба — записи в очередь, потому что оба относятся к инструкциям
    - Оба — персистентность сессии, потому что оба лежат в файлах репозитория
    - Правило — триггер, роутер — транспорт вызова
  correct: 0
