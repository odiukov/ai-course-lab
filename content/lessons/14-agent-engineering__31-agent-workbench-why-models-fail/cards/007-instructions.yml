- concept: запреты фиксируют недопустимые способы достижения результата отдельно от определения готовности
  question: 'Агенту поручили починить падающую проверку миграций. Он добавил в конфигурацию пропуск этой проверки: пайплайн зелёный, заявленный признак готовности формально выполнен. Что нарушено?'
  explanation: 'Определение готовности отвечает на вопрос «когда закончили», список запретов — на вопрос «чего нельзя делать по дороге». Это независимые части поверхности Instructions: критерий может быть выполнен запрещённым путём, и тогда работа не принимается несмотря на зелёный результат. Поэтому запрет «не отключай проверки ради зелёного» пишут явно, а не подразумевают.'
  kind: choice
  options:
    - 'Запрещённое действие: результат достигнут способом, который правила старта запрещают'
    - 'Ничего: признак готовности выполнен, задачу можно закрывать'
    - 'Определение готовности: раз его удалось выполнить так, оно сформулировано неверно'
    - Только оформление кода — на приёмку это не влияет
  correct: 0
  id: 007-instructions-1
  fingerprint: d4722ae0
- concept: правила старта работают как предусловие входа, до первого изменения, а условия остановки — как выход без результата
  question: Кроме определения готовности, Instructions описывают порядок старта (что прочитать и что проверить до первого действия) и условия остановки. Объясни, что дают эти две части такого, чего критерий готовности дать не может.
  explanation: 'Instructions несут три вещи: правила старта, запрещённые действия и определение готовности. Без предусловий каждая сессия начинает по-своему; без условий остановки исполнитель продолжает работу там, где надо было остановиться и запросить решение.'
  kind: open
  reference: 'Критерий готовности — постусловие: он проверяется, когда работа уже сделана, и ничего не говорит о том, с чего начинать и когда прекращать. Порядок старта — предусловие: он выполняется до первой правки и гарантирует, что исполнитель вошёл в задачу с одинаковым набором прочитанного контекста и проверенных условий независимо от того, какая модель работает. Условия остановки задают легальный выход без результата: если предусловие не выполнено или встретилось запрещённое условие, правильное поведение — остановиться и сообщить, а не импровизировать до тех пор, пока критерий не станет формально выполнимым. Вместе они закрывают начало и аварийный конец работы, а критерий готовности — только нормальный конец.'
  id: 007-instructions-2
  fingerprint: 8cf9ef99
