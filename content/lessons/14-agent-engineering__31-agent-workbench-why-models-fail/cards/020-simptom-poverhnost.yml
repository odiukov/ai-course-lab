- concept: первая линия контроля должна срабатывать автоматически на каждом действии, а не по усмотрению человека
  question: Предлагается не подключать контроль области и обязательные прогоны, а поручить ловлю всех отклонений человеку-ревьюеру. Что здесь принципиально ломается?
  explanation: 'Сигнал полезен, если появляется в момент события и всегда. Проверка области при записи файла и обязательный прогон срабатывают на каждом действии без участия человека, поэтому дают воспроизводимый отказ. Человеческий проход — выборочный и разовый: он не отменяется, но не может быть единственным детектором.'
  kind: choice
  options:
    - 'Контроль становится нерегулярным: он срабатывает раз в конце и зависит от внимания, а не на каждом действии'
    - Человек в принципе не различает выход за границы задачи
    - Ревью нельзя проводить чаще одного раза за задачу
    - 'Ничего: результат тот же, просто медленнее'
