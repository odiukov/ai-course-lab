- concept: средняя оценка «частично» означает сохраняющуюся возможность провала, а не близость к готовности
  question: Поверхность получила среднюю оценку шкалы — «механизм есть, но работает частично». Как это следует читать при планировании?
  explanation: Средняя оценка — не «почти два», а «гарантии нет». Частичный механизм пропускает часть случаев, и по пропущенным поведение не отличается от полного отсутствия поверхности. Читать её как «почти готово» — способ вычеркнуть из плана работу, которая закрывает реальный режим отказа.
  kind: choice
  options:
    - Здесь всё ещё возможен провал, гарантии нет — поверхность не закрыта
    - Поверхность практически готова, доработку можно не планировать
    - Оценка временная и уточняется только после следующего инцидента
    - Половина сценариев покрыта, значит риск ровно вдвое ниже
  correct: 0
