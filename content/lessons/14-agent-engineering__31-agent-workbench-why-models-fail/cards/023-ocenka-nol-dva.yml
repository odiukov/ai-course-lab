- concept: оценка ставится по проверяемому следу, а не по наблюдаемой привычке исполнителя
  question: Аудитор ставит поверхности верхнюю оценку, аргументируя это тем, что агент «обычно так и делает». Объясни своими словами, почему такое основание не годится, и что должно стоять за оценкой.
  explanation: Оценка по привычке исполнителя переносит надёжность обратно внутрь модели — ровно туда, откуда её выносит workbench. Проверяемый след даёт тот же ответ при смене исполнителя, поэтому только он и годится как основание.
  kind: open
  reference: '«Обычно делает» — наблюдение за поведением исполнителя, а не свойство рабочего окружения. Оно не воспроизводится: другая модель, другая формулировка задачи или более длинный прогон дают другое поведение, а поверхность на то и внешняя, чтобы результат от этого не зависел. За оценкой должен стоять проверяемый след: файл с правилом или состоянием, список разрешённых путей, фактический вывод инструмента, результат обязательного прогона. Оценка описывает, что зафиксировано в репозитории и что срабатывает само, а не то, что аудитор помнит по прошлым сессиям.'
  id: 023-ocenka-nol-dva-3
