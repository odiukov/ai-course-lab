- concept: правило разрешения ничьей должно давать одинаковый ответ на одинаковых данных независимо от порядка ключей во входных данных
  question: Два отчёта аудита содержат одни и те же оценки, но перечисляют поверхности в разном порядке, и минимум разделили несколько поверхностей. Каким должно быть поведение функции выбора самой слабой?
  explanation: 'Одинаковый вход обязан давать одинаковый выход, иначе аудит перестаёт быть воспроизводимым: сегодня чинят одно, завтра при тех же данных другое. Порядок ключей во входном отчёте — случайное свойство сборки отчёта, поэтому правило ничьей привязывают к внешнему фиксированному перечню. Частный случай — равные оценки у всех поверхностей: ответом становится первая канонически.'
  kind: choice
  options:
    - Обе перестановки дают один ответ — первую по каноническому порядку из числа разделивших минимум
    - 'Ответ может различаться: при ничьей любая из них одинаково допустима'
    - Функция должна вернуть все поверхности, разделившие минимум
    - Ответ определяется тем, какая из них перечислена в отчёте первой
