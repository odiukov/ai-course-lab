- concept: канонический перечень должен иметь единственный источник в коде, иначе копии расходятся
  question: В модуле уже объявлен канонический перечень поверхностей. Автор функции выбора самой слабой вписывает внутрь неё собственный литерал того же списка. Чем это опасно?
  explanation: 'Правильность здесь держится на том, что порядок ничьей совпадает с порядком аудита. Две копии одного перечня остаются согласованными только до первой правки, а расхождение проявится молча: функция вернёт другое имя без ошибки и без падения теста. Единственный источник убирает саму возможность такого расхождения.'
  kind: choice
  options:
    - Копии расходятся при первом же изменении перечня, и функция начнёт разрешать ничью по устаревшему порядку
    - Литерал внутри функции работает медленнее обращения к константе
    - Второй список повышает потребление памяти
    - 'Ничем: пока порядок совпадает, поведение идентично'
