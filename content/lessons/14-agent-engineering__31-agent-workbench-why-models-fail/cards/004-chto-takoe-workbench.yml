- concept: workbench состоит из артефактов вне модели, поэтому переживает её замену
  question: Модель A меняют на модель B. Что из перечисленного принадлежит workbench и переносится в новый прогон без изменений?
  explanation: 'Workbench не зависит от модели: поверхности — внешние артефакты, они остаются при смене исполнителя. Обратное не работает — убрать оболочку и сохранить надёжность за счёт одной модели не выйдет.'
  kind: choice
  options:
    - Определение готовности, список разрешённых файлов, файл состояния задачи, порядок проверки
    - Веса и токенизатор исполнителя
    - Длина контекстного окна и стиль рассуждений
