- concept: состояние обновляется по ходу прогона, иначе зафиксированная точка продолжения отстаёт от фактически выполненной работы
  question: Состояние задачи записывается один раз — в самом конце прогона, при передаче дел. Какой отказ это допускает?
  explanation: Хранилище читается и обновляется на каждом шаге, а не только на границе прогона. Редкая запись означает окно, в котором сделанная работа уже существует в файлах, но точка продолжения о ней не знает.
  kind: choice
  options:
    - 'Обрыв в середине прогона теряет весь прогресс: последняя запись отстаёт от реально сделанной работы'
    - Границы разрешённых файлов перестают действовать
    - Результаты команд перестают возвращаться в цикл
    - Обязательные проверки начинают срабатывать раньше времени
