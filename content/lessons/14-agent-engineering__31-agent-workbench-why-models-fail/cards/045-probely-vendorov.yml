- concept: 'перечень компонентов агента не покрывает операционные обязанности: удержание одновременной нагрузки, продолжение после перезапуска, разграничение прав'
  question: Описание агента перечисляет промпты, инструменты, хуки, оркестрацию, память и песочницы. В эксплуатации приходят 40 задач одновременно, процесс падает посреди работы, а один пользователь просит чужой репозиторий. Какие механизмы такое описание чаще всего оставляет неназванными?
  explanation: Перечисленные компоненты описывают, что настраиваешь, а не что разворачиваешь. Ожидание работы, единица деплоя, условия запуска, выживание состояния и проверка прав — отдельные обязанности; без них демо проходит, а эксплуатация нет. Показательно, что доска задач и лог обратной связи есть почти в каждом вендорском описании, а очередь как механизм не названа.
  kind: choice
  options:
    - Очередь, воркер как единицу деплоя, семантику триггеров, персистентность сессии и политику авторизации
    - Дополнительные инструменты и более подробный системный промпт
    - Более сильную модель и больший контекст
  correct: 0
  id: 045-probely-vendorov-1
  fingerprint: d04c9913
- concept: описание, ограниченное одним вендорским рантаймом, не отделяет общие обязанности системы от особенностей платформы
  question: Гайд вендора детально разбирает поверхности агента, но исключительно внутри собственного рантайма. Какое ограничение это накладывает на читателя?
  explanation: Внутри одного рантайма часть обязанностей уже решена платформой и потому не проговаривается. При переносе они всплывают как пробелы. Разбор на примитивы — функции, воркеры, триггеры, рантаймы, очереди, персистентность, политика — как раз отделяет переносимое от платформенного.
  kind: choice
  options:
    - 'Никакого: обязанности везде одинаковы, описания рантайма достаточно'
    - Из текста не видно, что здесь общая обязанность системы, а что — особенность конкретной платформы, поэтому перенос требует отдельного разбора на примитивы
    - Гайд применим только к моделям того же вендора, но полностью переносим между рантаймами
  correct: 1
  id: 045-probely-vendorov-2
  fingerprint: 8c9f5ff3
