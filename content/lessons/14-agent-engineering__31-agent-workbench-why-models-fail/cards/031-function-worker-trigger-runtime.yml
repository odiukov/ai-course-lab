- concept: воркер — долгоживущий процесс, владеющий жизненным циклом функций; функция — операция с входом и выходом, не живущая между вызовами
  question: Объясни своими словами, чем воркер отличается от функции и почему одну функцию может выполнять разный воркер.
  explanation: 'Разделение важно на практике: сбой «процесс не поднялся, работу никто не взял» лечится на уровне воркера, а сбой «операция вернула неверный результат при корректном входе» — на уровне функции.'
  kind: open
  reference: 'Функция — типизированная операция: получает вход, возвращает выход, по возможности не имеет побочного состояния и не существует между вызовами. Воркер — долгоживущий процесс, которому принадлежат одна или несколько таких функций и их жизненный цикл: он ждёт работу, вызывает нужную функцию, обрабатывает её завершение и остаётся жить дальше. Строитель, верификатор, ревьюер, MCP-сервер — воркеры; вызов инструмента, проверка правила, шаг верификации, обращение к модели — функции. Поскольку функция владеет только своими входами и выходами, её может вызывать любой воркер, у которого есть на это право; смена воркера не меняет саму операцию.'
  id: 031-function-worker-trigger-runtime-2
