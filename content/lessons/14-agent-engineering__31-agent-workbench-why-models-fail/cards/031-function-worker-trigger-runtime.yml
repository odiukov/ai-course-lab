  question: Расставь по порядку, как проходит одно исполнение работы в распределённом прогоне.
  explanation: 'Триггер создаёт момент, воркер владеет исполнением, рантайм ограничивает его, функция делает саму работу. Если перепутать роли, диагностика ломается: «не запустилось» и «запустилось, но вернуло не то» — отказы разных слоёв.'
  kind: order
