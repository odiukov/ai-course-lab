- concept: право обязательного ревью на каталог и разрешение агенту менять этот каталог — разные контракты, поэтому CODEOWNERS не засчитывается как ограничение области
  question: В репозитории есть CODEOWNERS со строкой `/payments/ @backend-team`. Какие поверхности это подтверждает?
  explanation: CODEOWNERS отвечает на вопрос «кто обязан посмотреть», а не «что исполнителю позволено трогать». Ограничение области — отдельный механизм, срабатывающий до слияния изменений, обычно проверка изменённых путей по разрешённому перечню.
  kind: choice
  options:
    - 'Review и Scope: указан и проверяющий, и разрешённый агенту каталог'
    - 'Только Review: строка назначает обязательного независимого проверяющего, но ничего не разрешает и не запрещает агенту менять'
    - 'Только Scope: строка ограничивает область изменений каталогом `/payments/`'
    - 'Ни одну: CODEOWNERS относится к организации команды, а не к workbench'
