- concept: 'разные поля одного артефакта относятся к разным поверхностям: чек-лист обязательных действий — Instructions, поля о результате и остатке работы — Handoff'
  question: Шаблон pull request содержит чек-лист обязательных действий и поля «что изменилось», «почему», «риски», «что осталось». Какие поверхности workbench здесь подтверждаются и по какому признаку различать поля?
  explanation: 'Аудит по названиям файлов даёт ложное покрытие: шаблон PR без полей об остатке и обосновании оставляет Handoff пустым, даже если файл шаблона существует.'
  kind: open
  reference: 'Чек-лист обязательных действий предписывает исполнителю, как вести работу, — это Instructions. Поля «что изменилось», «почему», «риски», «что осталось» описывают результат и незакрытый остаток для следующего прогона или другого исполнителя — это Handoff. Признак различения — направление во времени: предписание действует до и во время работы, а описание результата и остатка передаётся на границе после её окончания. Один артефакт при этом покрывает две поверхности, поэтому аудит идёт по полям, а не по файлам.'
  id: 053-audit-v-repozitorii-3
