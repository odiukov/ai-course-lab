  question: Задача занимает много ходов и переживает перезапуски. Чего принципиально не даёт даже максимально подробный промпт?
  explanation: Подробная формулировка улучшает решение текущего хода — и только его. Непрерывность, фактическая обратная связь, границы и приёмка требуют носителей и механизмов, которых у сообщения нет по природе.
