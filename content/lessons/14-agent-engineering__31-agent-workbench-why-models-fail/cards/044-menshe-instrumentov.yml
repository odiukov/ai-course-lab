- concept: сокращение набора инструментов работает за счёт устранения дублирования и неразличимости, но ограничено покрытием необходимых операций
  question: Сокращение набора инструментов подняло долю успеха. Команда предлагает урезать набор ещё вдвое. Какое ограничение здесь действует?
  explanation: 'Прирост даёт не малое число как таковое, а различимость: понятные границы между инструментами и предсказуемые аргументы. Убрав покрытие необходимой операции, ты меняешь ошибку выбора на невозможность выполнения — доля успеха упадёт, а не вырастет.'
  kind: choice
  options:
    - 'Никакого: чем меньше инструментов, тем лучше, резать можно до одного'
