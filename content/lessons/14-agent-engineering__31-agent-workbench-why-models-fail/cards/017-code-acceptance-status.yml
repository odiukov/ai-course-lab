  question: Обязательный тест прошёл, обязательная проверка области прошла, необязательная проверка стиля провалилась. Что должна вернуть функция приёмки и почему?
  explanation: 'Отбор обязательных проверок предшествует агрегации: приёмка зависит только от них. Иначе любой добавленный совет — например, стилевое правило — превращается в блокирующий гейт.'
  kind: choice
  options:
