- concept: единица разбора прогона — наблюдаемое событие, а не агрегированный статус
  question: Прогон закончился статусом failed. Объясните своими словами, почему по одному этому статусу нельзя назвать пропущенную поверхность, и что берут за единицу разбора.
  explanation: Диагноз ставят по следам, а не по итогу. Иначе после успешной починки заметного симптома прогон снова падает — по причине, которую не записали.
  kind: open
  reference: 'Статус — агрегат: одна и та же метка получается при выходе за область, при потерянной обратной связи, при обходе верификации и при их сочетании. Единицей разбора берут отдельное наблюдаемое событие журнала и для каждого называют поверхность, которая должна была его предотвратить (ex-ante) или поймать (постфактум). Результат разбора — перечень пар «свидетельство — поверхность», а не один ярлык.'
  id: 038-klassifikaciya-otkazov-2
  fingerprint: 4f3d0f04
