- concept: свидетельство в отчёте — наблюдаемый факт из лога или репозитория, а не характеристика поведения исполнителя
  question: Какая из формулировок годится как свидетельство в записи отчёта об отказе прогона?
  explanation: 'Свидетельство должно быть перепроверяемо по артефактам прогона: имя упавшей проверки и заявленный статус приёмки видит любой читатель. Оценки характера исполнителя и названия намерений не проверяются и ничего не локализуют.'
  kind: choice
  options:
    - Агент невнимателен к требованиям задачи
    - Обязательный тест `test_rejects_empty_payload` завершился ошибкой, но агент пометил задачу готовой
    - Качество работы агента в этом прогоне низкое
    - Verification нуждается в улучшении
  correct: 1
  id: 051-kontrakt-otcheta-1
  fingerprint: 66cd6821
- concept: рекомендуемая починка называет конкретный механизм окружения, который можно добавить или проверить, а не переименованное намерение
  question: Почему запись «улучшить Verification» непригодна как рекомендуемая починка в отчёте об отказе, и чем её заменить?
  explanation: Отчёт полезен настолько, насколько он превращается в изменение окружения. Диагноз без исполнимого действия оставляет ту же дыру к следующему прогону.
  kind: open
  reference: '«Улучшить Verification» — это название поверхности плюс намерение: из него нельзя понять, что именно добавить в workbench и как убедиться, что изменение сделано. Годная рекомендация описывает конкретный механизм и его наблюдаемое действие: например, вычислять статус готовности как конъюнкцию результатов перечня обязательных проверок и отклонять прогон, если результат хотя бы одной обязательной проверки отсутствует. Такую рекомендацию можно исполнить, а потом проверить повторным прогоном: следующий раз ложная приёмка обязана быть остановлена.'
  id: 051-kontrakt-otcheta-2
  fingerprint: '61396038'
- concept: 'запись отчёта — причинная цепочка из четырёх звеньев разного уровня: факт, тип поломки, ответственная поверхность, изменение workbench'
  question: Расставь звенья одной записи отчёта об отказе в порядке причинной цепочки.
  explanation: Цепочка идёт от наблюдения к диагнозу, от диагноза к ответственной поверхности и только затем к действию. Пропуск любого звена превращает отчёт либо в список жалоб, либо в набор работ без обоснования.
  kind: order
  items:
    - 'Свидетельство: наблюдаемый факт из лога или репозитория'
    - 'Режим отказа: как именно сломалась работа'
    - 'Поверхность: механизм окружения, который должен был остановить такой исход'
    - 'Рекомендуемая починка: конкретное изменение workbench'
