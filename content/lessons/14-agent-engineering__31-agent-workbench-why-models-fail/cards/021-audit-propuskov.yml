- concept: поверхность подтверждается работающим механизмом и его влиянием на приёмку, а не описанием в документации
  question: 'В README написано: «перед мерджем прогоняются тесты и линтер». Что требуется дополнительно, чтобы засчитать поверхность верификации как работающую?'
  explanation: 'Аудит ищет свидетельство поведения. Фраза в документации — намерение: она не запускается и ничего не блокирует. Засчитывается пара «механизм запуска + исход, который решает судьбу изменения»; то же различие отделяет реальное ограничение области от просьбы «не трогай лишние файлы».'
  kind: choice
  options:
    - Запускаемый механизм и результат, который влияет на приёмку изменения
    - Раздел документации с примерами команд
    - Явное упоминание названия поверхности в README
    - Согласие разработчиков соблюдать это правило
  correct: 0
  id: 021-audit-propuskov-2
  fingerprint: '36974964'
- concept: поверхность может быть реализована под другим именем или распределена по нескольким файлам — ищут свидетельства, а не названия
  question: Аудитор не нашёл в репозитории ни одного файла с названием, похожим на поверхность состояния, и поставил «отсутствует». Объясни своими словами, в чём тут ошибка метода и как проверить правильно.
  explanation: 'Аудит по именам даёт оба вида ложных выводов: пропускает реализацию под нестандартным именем и засчитывает пустой файл с правильным заголовком. Единственный надёжный тест — попытка получить из артефакта то, что поверхность обязана нести.'
  kind: open
  reference: 'Наличие поверхности определяется поведением, а не названием. Состояние может лежать в задачном тикете, в файле плана, в разделе рабочего документа или разойтись по нескольким местам. Правильная проверка — попытаться восстановить из найденных артефактов текущую задачу, затронутые файлы, блокеры и следующее действие. Если это восстанавливается, поверхность есть, как бы она ни называлась; если нет — её нет, даже когда файл с подходящим именем существует. Ошибка симметрична обратной: принять красивое название или описание за работающий механизм.'
  id: 021-audit-propuskov-3
  fingerprint: 65977fea
