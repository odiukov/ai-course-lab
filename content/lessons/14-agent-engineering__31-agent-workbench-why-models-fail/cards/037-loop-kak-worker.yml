- concept: один оборот цикла ограничен и завершается записью и назначением следующего триггера, а не непрерывным размышлением
  question: Расставьте операции одного оборота цикла агента в порядке исполнения.
  explanation: Оборот — короткая обработка события с фиксированным началом и концом. Записи сохраняются до порождения триггера, иначе следующий запуск стартует с устаревшей точки.
  kind: order
  items:
    - Принять входящее событие (сообщение пользователя, результат инструмента, тик таймера)
    - Прочитать сохранённое состояние прогона
    - 'Вызвать функции: обращение к модели, затем выбранный ею инструмент'
    - Записать обновлённое состояние и запись обратной связи
    - Породить триггер следующей работы (верификация, ревью, передача дел)
  id: 037-loop-kak-worker-2
  fingerprint: df2cf544
- concept: цикл активируется событием любого источника, поэтому отсутствие реплики пользователя не означает остановку
  question: Пользователь молчит 12 минут, но агент сам возобновляет работу и запускает проверку. Что это значит в терминах цикла?
  explanation: Триггером может быть тик таймера, cron, изменение файла, хук, HTTP-запрос — сообщение пользователя лишь один из источников. Воркер спит между событиями, а не размышляет непрерывно.
  kind: choice
  options:
    - Модель продолжала непрерывно думать всё это время в фоне
    - В цикл пришло событие из другого источника — таймер, хук или сообщение из очереди
    - Рантайм перезапустил модель, потому что предыдущий ход не завершился
  correct: 1
  id: 037-loop-kak-worker-3
  fingerprint: 522d3ee9
