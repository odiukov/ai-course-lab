- concept: метаданные применимости правила задают условие его подключения и отделены от самой проверки
  question: В своде правил у каждого правила указано, к каким путям и к какой стадии работы оно относится. Какую роль играет эта пометка?
  explanation: 'Instructions — это политика плюс метаданные функций. Само правило, сформулированное как условие, реализуется проверкой-функцией; метаданные говорят, к чему и когда оно относится, а роутер вроде `AGENTS.md` подключает нужную часть политики при старте рантайма. Права на файлы — отдельная вещь: это ACL, привязанный к конкретной задаче.'
  kind: choice
  options:
    - 'Это метаданные применимости: они определяют, когда правило подключается, отдельно от механизма, который его проверяет'
    - 'Это и есть проверка: пометка сама заставляет правило срабатывать'
    - Это список прав доступа к указанным путям
    - Это точка продолжения работы после перезапуска
