- concept: нарушение границ задачи при зелёных тестах — отказ в организации работы, а не дефект реализации
  question: Агент прошёл все тесты, но заодно отредактировал конфигурацию деплоя, которой задача не касалась. Как классифицировать этот отказ?
  explanation: Реализация здесь ведёт себя корректно — её проверили тесты. Сломано то, где агенту разрешено писать. Такое чинится границами задачи и критериями приёмки, а не переписыванием функции.
  kind: choice
  options:
    - 'Ошибка реализации: логика написанного кода неверна'
    - 'Ошибка организации работы: нарушены границы разрешённых правок'
    - 'Ошибка среды: тесты не покрывают конфигурацию'
  correct: 1
  id: 003-diagnoz-provala-1
  fingerprint: 9bba3bd2
- concept: один прогон может нести оба типа отказов одновременно, поэтому по факту падения теста диагноз ещё не поставлен
  question: Тесты после работы агента падают. Почему одного этого факта мало, чтобы решить, чинить код или процесс?
  explanation: 'Смотреть надо и на код, и на маршрут до отчёта об успехе. Исправления при этих диагнозах разные: одно правит логику, другое — границы, критерии и обязательную проверку.'
  kind: open
  reference: 'Падение теста показывает только несоответствие поведения ожиданию. Причиной может быть дефект реализации — функция возвращает неверный результат на согласованном тесте. А может быть отказ организации: агент правил не тот файл, работал по чужому критерию готовности, вообще не запускал авторитетные тесты и объявил успех, или задел посторонний код и сломал его. Оба типа могут присутствовать в одном прогоне. Диагноз ставится по пути до объявления успеха — какие файлы затронуты, какие проверки запускались, зафиксированы ли предположения — а не только по итоговому диффу.'
  id: 003-diagnoz-provala-2
  fingerprint: a437ad32
