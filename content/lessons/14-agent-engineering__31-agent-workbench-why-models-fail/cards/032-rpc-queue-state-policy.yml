  question: Команда «перезаписать файл конфигурации» дошла до воркера по проводу без ошибок и была принята. Что из этого следует про право её выполнить?
  explanation: 'Провод отвечает только за передачу, очередь — за удержание. Кто какую функцию может вызвать и с какой областью действия, решает политика авторизации: разрешённые и запрещённые файлы, границы согласований, списки возможностей. Верификатор может читать репозиторий и писать отчёт, но не менять исходники — даже если технически до него дошла такая команда.'
  kind: choice
  options:
    - 'Ничего: доставка и авторизация — разные контракты, права проверяет политика авторизации отдельно'
    - 'Право есть: успешная доставка означает, что вызов прошёл проверку допустимости'
    - 'Право определяет очередь: доставленное из очереди задание уже одобрено'
