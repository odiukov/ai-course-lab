  question: После падения воркера очередь честно отдаёт три невыполненных задания, но неизвестно, какие проверки уже прошли до падения. Какой примитив отсутствует?
  explanation: Очередь отвечает на вопрос «что ещё нужно сделать», а не «что уже произошло». Достигнутый прогресс, блокер и следующее действие живут в персистентности сессии — файле, чекпойнте, KV или самом репозитории.
  kind: choice
