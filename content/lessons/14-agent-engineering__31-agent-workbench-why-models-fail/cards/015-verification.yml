- concept: верификация проектируется как перечень независимых способов, которыми правка может оказаться неверной, включая регрессию прежнего поведения
  question: Ты изменил расчёт цены и убедился, что один типовой заказ считается правильно. Объясни, какой вопрос нужно задать вместо «вижу ли я правильный результат?» и что из него следует для набора проверок.
  explanation: 'Один пройденный путь — это одна точка. Верификация покрывает не «работает ли», а «где перестаёт работать»: крайние значения, регрессия и границы дают проверкам шанс опровергнуть предположение.'
  kind: open
  reference: 'Вопрос звучит так: какими независимыми способами эта правка может оказаться неверной? Из него выводится набор мишеней: крайние значения входа (пустой набор, нулевая и предельная величина, дробные суммы), сохранность прежнего поведения соседних расчётов, то есть регрессия, и соблюдение границ — не затронуты ли файлы вне разрешённой области. Один удачный маршрут подтверждает только этот маршрут, поэтому проверки строят так, чтобы каждая могла провалиться и указать конкретный класс ошибки.'
  id: 015-verification-3
