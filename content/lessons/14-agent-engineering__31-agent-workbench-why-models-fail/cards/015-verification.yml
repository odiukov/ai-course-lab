- concept: статические проверки ловят дефекты до исполнения, динамические — только по факту прогона, и классы дефектов у них разные
  question: После правки основной сценарий запускается и отвечает корректно, но в коде осталась затенённая переменная и недостижимая ветка. Какая проверка предназначена обнаружить это без запуска кода?
  explanation: Линтер читает текст программы и замечает подозрительные конструкции до исполнения. Прогон и тесты видят только те пути, которые реально исполнились, — недостижимая ветка им по определению не видна.
  kind: choice
  options:
    - Линтер
    - Дымовой прогон
    - Тест на крайних значениях входа
    - Сверка изменённых файлов с контрактом области
