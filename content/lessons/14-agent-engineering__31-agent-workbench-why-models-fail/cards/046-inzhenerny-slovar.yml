- concept: перевод ведут по наблюдаемой работе элемента, поэтому разные вывески могут покрывать одну обязанность, а ребрендинг не меняет операционных свойств
  question: Один вендор продаёт «agent memory», другой — «session persistence», третий обещает «continuity layer». Какими вопросами определить, разные это механизмы или одна обязанность под тремя вывесками?
  explanation: 'Словарь меняется, инженерия нет: переименование не меняет место хранения, срок жизни записи и поведение после перезапуска. Перевод по выполняемой работе защищает и от обратной ловушки — когда одно модное слово склеивает две разные обязанности.'
  kind: open
  reference: 'Спрашивать не про название, а про наблюдаемую работу элемента: что именно записывается, где хранится, по какому ключу читается, кто и в какой момент обновляет запись, переживает ли она перезапуск процесса, когда очищается. Если ответы совпадают, перед тобой одна обязанность — персистентность сессии — под тремя вывесками, и выбирать нужно по свойствам хранилища, а не по названию. Расхождение хотя бы в одном ответе (например, запись живёт только внутри одного прогона и не читается на старте следующего) означает другой механизм и другой режим отказа.'
