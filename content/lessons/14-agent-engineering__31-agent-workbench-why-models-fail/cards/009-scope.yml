- concept: выход за границу требует запроса расширения полномочий, исполнитель не расширяет их сам
  question: Нужная правка лежит вне разрешённых файлов, и без неё критерий приёмки не выполняется. Что предписывает контракт задачи?
  explanation: 'Контракт задаёт полномочия, а не подсказку. Если полномочий не хватает, решение о расширении принимает тот, кто выдал контракт; исполнитель, назначающий их себе, снимает саму гарантию границ. Пост-фактум упоминание в отчёте не спасает: правка уже сделана, а откат стоит дороже согласования.'
  kind: choice
  options:
    - Остановиться и запросить расширение области
    - 'Внести правку: цель задачи важнее списка файлов'
    - Внести правку и упомянуть отступление в итоговом отчёте
    - Тихо отложить задачу, ничего не сообщая
  correct: 0
  id: 009-scope-2
  fingerprint: 924800c6
- concept: полномочия действуют на уровне отдельной задачи, а не на уровне проекта
  question: Чем список разрешённых файлов отличается от общих правил работы, записанных для проекта?
  explanation: Обе поверхности — политика, но разного срока и охвата. Правила проекта переживают задачи, список разрешённых файлов выдаётся под одну задачу и вместе с ней аннулируется. Поэтому одна и та же правка может быть законной в одной задаче и нарушением в другой.
  kind: choice
  options:
    - Список разрешённых файлов — полномочия на конкретную задачу и меняется вместе с ней; общие правила одинаковы для всех задач
    - Это одно и то же, просто записанное в двух разных файлах
    - Список разрешённых файлов — рекомендация, а общие правила обязательны
    - Общие правила действуют только при смене модели, список файлов — постоянно
  correct: 0
  id: 009-scope-3
