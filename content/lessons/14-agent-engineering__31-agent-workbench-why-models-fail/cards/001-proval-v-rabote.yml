- concept: приёмка задачи определяется внешним проверяемым критерием готовности, а не заявлением исполнителя о завершении
  question: Агент дописал функцию валидации, сообщил «готово» и остановился. Что делает такое сообщение основанием считать задачу выполненной?
  explanation: Модель оценивает собственный вывод по правдоподобию, а не по факту прохождения проверок. Готовность обязана быть операционально задана до старта (какие тесты, какая команда, какой ожидаемый результат), иначе исполнитель сам решает, что считать «сделано», и решает в свою пользу.
  kind: choice
  options:
    - 'Ничего: заявление о завершении не является приёмкой, пока результат не проверен заранее заданным критерием готовности'
    - 'Читаемость кода: понятные имена и сообщения об ошибках подтверждают выполнение задачи'
    - 'Сам факт остановки: агент прекращает работу только после достижения цели'
    - 'Количество затронутых файлов: чем их меньше, тем надёжнее результат'
  correct: 0
  id: 001-proval-v-rabote-1
  fingerprint: 9a4314b7
- concept: при нескольких противоречащих сигналах проверки авторитетный источник назначается заранее, иначе исполнитель выберет удобный
  question: 'В репозитории три сигнала качества: полный набор тестов, быстрый набор smoke-тестов и локальный скрипт разработчика. Они дают разный вердикт. Что должно быть решено до запуска агента?'
  explanation: 'Если авторитет не назначен, агент оптимизирует под самый снисходительный сигнал и объявляет успех по нему. Назначение авторитетного источника — часть задания, а не свойство модели: оно переводит «вроде работает» в проверяемое утверждение.'
  kind: choice
  options:
    - Какой сигнал считается авторитетным для приёмки этой задачи
    - Какой сигнал быстрее выполняется на машине агента
    - Сколько попыток агент имеет право потратить на исправление
    - Какой сигнал чаще всего проходит без ошибок
  correct: 0
  id: 001-proval-v-rabote-2
  fingerprint: 9cefd238
- concept: незафиксированные допущения и остаток работы делают результат непродолжаемым независимо от его качества
  question: Изменение прошло все проверки, но агент нигде не записал, какие допущения принял, что уже пробовал и что осталось. Объясни своими словами, почему такой результат всё ещё нельзя считать законченной инженерной работой.
  explanation: 'Отсюда разница между «код написан» и «работа выполнена»: первое про содержимое файла, второе — про пригодность результата к проверке и продолжению.'
  kind: open
  reference: Проверки говорят только о текущем состоянии кода, но не о контексте решения. Без записи допущений нельзя понять, почему выбран именно такой вариант и где он сломается при изменении условий; без записи остатка следующая сессия (или человек) заново восстанавливает картину и рискует повторить уже отвергнутые попытки. Инженерная работа заканчивается тогда, когда результат передаётся в состоянии, которое другой участник может проверить и продолжить, а не тогда, когда код перестал падать.
  id: 001-proval-v-rabote-3
  fingerprint: 922d3a82
