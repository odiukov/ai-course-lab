- concept: демонстрация на одном примере обосновывает существование эффекта окружения, но не его величину и не универсальность
  question: Прогон задачи без инженерной обвязки провалился, прогон с обвязкой прошёл, исполнитель тот же. Какое утверждение этот опыт обосновывает?
  explanation: 'Демонстрация существования эффекта — узкое, но полезное утверждение: успех второго прогона нельзя приписать «лучшей модели». Величину эффекта и его перенос на другие задачи одиночный пример не оценивает, для этого нужен набор замеров.'
  kind: choice
  options:
    - Любой агент с такой обвязкой выполнит любую задачу
    - Устройство рабочего окружения способно изменить исход при неизменном исполнителе
    - Обвязка повышает долю успеха на произвольном наборе задач ровно на измеренную величину
  correct: 1
