- concept: метрика доли систем, дошедших до эксплуатации, измеряет всю обвязку, а точность ответов — только качество отдельного ответа
  question: Команда сообщает 92% верных ответов на офлайн-наборе задач, но лишь 11% таких систем доходят до эксплуатации. Что различают эти два числа?
  explanation: 'Это метрики разного уровня: одна оценивает ответ, другая — систему, которая превращает ответ в выполненную работу. Поэтому 88% корпоративных проектов, не дошедших до продакшена, не противоречат высоким баллам на бенчмарках: провалы группируются вокруг рантайма и окружения, а не вокруг рассуждения.'
  kind: choice
  options:
    - Второе — просто более строгая версия первого, замеренная на тех же объектах
    - Первое измеряет качество ответа, второе — способность обвязки довести работу до исполненного результата
    - Разницу целиком объясняет выбор модели
