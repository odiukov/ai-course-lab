- concept: отказы, накапливающиеся по ходу длинного прогона, не воспроизводятся на коротких замерах, поэтому длина прогона — параметр измерения
  question: Агент решает 62% коротких задач, но на задачах в несколько десятков ходов доля падает до однозначных величин, а логи полны повторов одного действия. Что это говорит про замер?
  explanation: 'Зацикливание и потеря цели проявляются только после многих ходов, поэтому короткий набор их структурно не ловит. Именно так WebAgent на длинном контексте просел с 40-50% до менее 10%: способности те же, а горизонт замера другой.'
  kind: choice
  options:
    - 'Короткий замер завышает оценку: он не воспроизводит отказы, накапливающиеся с длиной прогона'
    - Модель теряет способности по мере роста нагрузки на веса
    - Замер на коротких задачах эквивалентен длинному, если задачи из одного домена
