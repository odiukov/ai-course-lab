  question: Агент теряет прогресс после перезапуска и закрывает задачу без прогона проверок. Команда переносит запуск на другой фреймворк оркестрации. Что изменится?
  explanation: Смена рантайма меняет способ исполнения ходов. Устойчивая запись прогресса и обязательный гейт приёмки в комплект рантайма не входят — их надо построить в окружении, на любом фреймворке.
  kind: choice
