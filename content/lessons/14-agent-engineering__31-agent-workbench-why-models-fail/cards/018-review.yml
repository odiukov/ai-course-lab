- concept: независимость ревью достигается чистым контекстом и постановкой на опровержение; смены модели для этого недостаточно и она не обязательна
  question: Ревью выполняет та же модель, что строила решение. Что делает такой проход независимым?
  explanation: Независимость — это смена позиции, а не смена весов. История размышлений строителя как раз возвращает исходный замысел и уничтожает независимость; постановка «найди расхождение с контрактом» её создаёт.
  kind: choice
  options:
    - Роль проверяющего, чистый контекст и старт от контракта задачи вместо просьбы подтвердить, что всё хорошо
    - Сам факт, что запущен отдельный процесс
    - Просьба перечитать собственный diff внимательнее
    - Передача проверяющему истории размышлений строителя
  correct: 0
