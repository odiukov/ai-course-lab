- concept: отсутствие свидетельств даёт пустой перечень находок, а не запись о неизвестном отказе
  question: Классификатор прогнали по журналу, где ни один детектор не сработал и все обязательные проверки прошли. Что он должен вернуть?
  explanation: Классификатор описывает найденные свидетельства, а не выносит вердикт. Выдуманная запись без свидетельства попадёт в отчёт как реальная проблема и уведёт починку в пустоту.
