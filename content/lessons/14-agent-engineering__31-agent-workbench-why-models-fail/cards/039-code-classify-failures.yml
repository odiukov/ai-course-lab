- concept: приёмочный статус — самостоятельный источник находок наряду с журналом действий
  question: 'Журнал действий прогона чист: ни одной записи вне области, повторов нет. Но обязательная проверка не прошла. Что вернёт корректный классификатор?'
  explanation: 'Источников свидетельств несколько: журнал действий и результат приёмки. Чистое поведение не отменяет непройденного гейта, а обход гейта — самостоятельный режим отказа со своей поверхностью.'
  kind: choice
  options:
