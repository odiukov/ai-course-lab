- concept: compaction — воркер управления состоянием, который по расписанию переписывает session persistence в пределах бюджета
  question: Контекст сессии разросся, и механизм compaction заменяет старую переписку компактной сводкой. В какой примитив это переводится?
  explanation: 'Compaction ничего не решает про допустимость действий и про приёмку — он владеет жизненным циклом сохранённого состояния. Отсюда и требование: то, что нужно для продолжения, должно уцелеть после сжатия.'
  kind: choice
  options:
    - В триггер, очищающий очередь задач
    - В функцию верификации, вызываемую при закрытии задачи
    - В воркера управления состоянием, который периодически проходит по session persistence и удерживает её в бюджете
  correct: 2
  id: 041-patterny-runtime-i-policy-2
  fingerprint: e1255733
- concept: 'изоляция рантайма и политика авторизации — разные примитивы: sandbox ограничивает достижимое, политика решает допустимость вызова'
  question: Агент работает в песочнице без сети, с временной файловой системой, которая уничтожается через 30 минут. Значит ли это, что политика авторизации больше не нужна?
  explanation: Изоляция задаёт границу вычислений; авторизация решает «можно ли этот вызов» внутри границы. Испорченный внутри песочницы результат всё равно уйдёт в коммит, а лимиты правок песочница не проверяет.
  kind: choice
  options:
    - 'Нет: sandbox ограничивает достижимое рантаймом, а внутри достижимого нужна политика — например, запрет править чужой модуль или удалять файлы'
    - 'Да: если наружу ничего не уходит, любое действие внутри безопасно по определению'
    - 'Да: уничтожение файловой системы отменяет последствия любых записей'
  correct: 0
