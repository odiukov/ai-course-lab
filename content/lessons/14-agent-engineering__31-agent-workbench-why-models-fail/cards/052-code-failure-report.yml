- concept: 'функция сборки отчёта возвращает структуру данных, а запись в файл выполняет вызывающий код: вычисление отделено от ввода-вывода'
  question: Почему функцию сборки отчёта делают возвращающей словарь, а сериализацию в JSON-файл оставляют вызывающему коду?
  explanation: 'Смешение вычисления и записи привязывает анализ к побочному действию: тест вынужден работать с файловой системой, а сменить формат вывода нельзя без правки логики отчёта.'
  kind: choice
  options:
    - 'Так быстрее работает: запись в файл замедляет вычисления'
    - Чистое вычисление можно проверить тестами и переиспользовать (в печати, HTTP-ответе, другом формате), не создавая файлов при каждом вызове
    - JSON нельзя формировать внутри функции по правилам языка
    - Так отчёт получается детерминированным, а при записи внутри функции — нет
