- concept: критерий полноты отчёта — восстановимость пути «что произошло → почему → что чинить» из самого объекта, без обращения к исходному логу
  question: По какому критерию проверить, что сводный отчёт о прогоне собран достаточно полно?
  explanation: Отчёт нужен именно тогда, когда лог уже недоступен или читать его дорого. Если для интерпретации записи всё равно приходится возвращаться к логу, отчёт не выполняет свою работу.
  kind: open
  reference: 'Отчёт достаточен, если по нему одному, без исходного лога, восстанавливается путь: что произошло (детальные свидетельства — конкретные записи вне разрешённой области, повторённые шаги, результаты каждой обязательной проверки), почему это отказ (режимы отказа и связанные с ними поверхности) и что чинить (упорядоченный перечень поверхностей). Одного булева вердикта вроде failed недостаточно: он сообщает исход, но не даёт ни локализации, ни основания для приоритета починки.'
