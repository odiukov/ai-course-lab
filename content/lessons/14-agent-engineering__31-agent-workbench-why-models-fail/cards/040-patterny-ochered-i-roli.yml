- concept: Ralph Loop = триггер перепостановки задачи в очередь с чистым контекстом, при котором цель переносит устойчивое состояние
  question: Агент сделал около 40% работы, написал «готово» и остановился. Что делает Ralph Loop в терминах примитивов?
  explanation: 'Это обычный ретрай: работа возвращается в очередь и берётся заново с чистого листа. Чистый контекст не стирает прогресс, потому что прогресс лежит не в переписке, а в session persistence.'
  kind: choice
  options:
    - Триггер кладёт исходную задачу обратно в очередь и запускает её в чистом контексте, а цель и прогресс переносит устойчивое состояние
    - Расширяет окно контекста, чтобы вся задача помещалась целиком и агент не терял её из виду
    - Продолжает тот же диалог напоминанием «работа не закончена», сохраняя накопленный контекст
  correct: 0
  id: 040-patterny-ochered-i-roli-1
  fingerprint: fdbf81ea
- concept: в PEV план материализуется в состоянии, поэтому исполнение и проверка не зависят от контекста фазы планирования
  question: В схеме Plan / Execute / Verify планировщик записывает план в состояние, а не держит его в своём ходе. Зачем?
  explanation: Фазы связаны состоянием и очередью, а не общим окном контекста. План-артефакт делает исполнение и проверку повторяемыми и позволяет им идти в другом процессе и в другое время.
  kind: choice
  options:
    - Чтобы сэкономить токены на длинном ответе планировщика
    - Чтобы модель не забыла план к концу длинного рассуждения
    - 'Потому что исполнитель и проверяющий — отдельные воркеры: без плана как артефакта у следующей фазы просто нет входа'
  correct: 2
  id: 040-patterny-ochered-i-roli-2
  fingerprint: b9ee27bc
- concept: 'harness-compute separation — это control plane и data plane: решения о постановке, повторе и приёмке отделены от исполнения работы'
  question: Что именно разделяет «harness-compute separation»?
  explanation: 'Ярлык новый, разделение старое: control plane / data plane описано в распределённых системах задолго до слова «агент». Управляющие решения не должны зависеть от того, что происходит внутри тяжёлого вызова.'
  kind: choice
  options:
    - Плоскость управления (что поставить в очередь, кому отдать, когда повторить, достаточно ли доказательств) и плоскость исполнения (вызов модели, запуск теста и инструмента)
    - Память модели и её вычислительный блок
    - Системный промпт и пользовательский промпт в одном ходе
  correct: 0
  id: 040-patterny-ochered-i-roli-3
  fingerprint: 1dd3c541
