- concept: свёртка дубликатов выполняется после присвоения приоритета, иначе позицию поверхности определит случайно первый встреченный источник сигнала
  question: Расставь этапы построения упорядоченного плана починки поверхностей workbench так, чтобы поверхность, встреченная в нескольких источниках, получила позицию по сильнейшему своему сигналу.
  explanation: 'Если снять дубли до классификации, выживет запись того источника, который просто оказался первым в обходе, и системная дыра встанет позади своего следствия. Классификация до свёртки делает результат независимым от порядка обхода источников: у поверхности берётся максимум по тяжести, а не первое попавшееся упоминание.'
  kind: order
  items:
    - Собрать кандидатов из всех источников сигнала, допуская повторы
    - Присвоить каждому кандидату класс приоритета по типу свидетельства о дефекте
    - Свернуть повторы, оставив за поверхностью её сильнейший класс
    - 'Вернуть последовательность: сначала классы по убыванию тяжести, внутри класса — по фиксированному перечню поверхностей'
