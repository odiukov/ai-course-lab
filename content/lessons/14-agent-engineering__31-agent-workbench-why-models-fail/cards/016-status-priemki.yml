- concept: статус приёмки — конъюнкция обязательных результатов, поэтому одна неудача решает исход независимо от числа успехов
  question: 'Обязательных проверок пять: четыре прошли, одна провалилась. Что даёт статус приёмки?'
  explanation: 'Приёмка вычисляется как «все обязательные прошли», то есть логическое И. Такая функция монотонна: добавление успехов не компенсирует ни одного провала, поэтому «четыре из пяти» не является промежуточным состоянием.'
  kind: choice
  options:
    - 'Не принят: одной неудачи обязательной проверки достаточно для отказа'
    - Принят, если провалившаяся проверка признана некритичной
    - Принят, потому что большинство результатов зелёные
    - Зависит от порядка, в котором проверки выполнялись
