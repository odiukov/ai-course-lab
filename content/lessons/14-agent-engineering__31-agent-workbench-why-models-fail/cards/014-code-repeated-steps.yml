- concept: отметка «встречено» ставится после проверки текущей записи, иначе первое вхождение опознаёт само себя как повтор
  question: Дополните проход по журналу так, чтобы первое вхождение шага не попадало в повторы.
  explanation: Отметка ставится в конце итерации. Если поднять seen.add(step) выше условия, каждая запись окажется уже «встреченной» на момент собственной проверки, и в повторы уйдёт весь журнал. Пустой журнал и журнал без повторов при верном порядке дают пустой результат.
  kind: cloze
  template: |-
    seen = set()
    repeated = []
    for step in log:
        if step in seen and step not in repeated:
            repeated.append(step)
        ___
  answer: seen.add(step)
  accept:
    - seen.add(step)
    - seen.add( step )
    - seen |= {step}
  id: 014-code-repeated-steps-3
  fingerprint: 9fb62452
