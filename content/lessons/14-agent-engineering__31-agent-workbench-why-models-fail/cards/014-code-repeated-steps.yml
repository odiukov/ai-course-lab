- concept: результат выборки повторов — набор различных названий, кратность вхождений на его размер не влияет
  question: 'Журнал агента содержит 14 записей: inspect, edit, run_tests, edit, lint, run_tests, inspect, commit, lint, plan, edit, run_tests, lint, deploy. Функция возвращает названия шагов, встретившихся более одного раза, каждое не чаще одного раза. Сколько элементов будет в результате?'
  explanation: 'Повторяются inspect (2), edit (3), run_tests (3), lint (3) — четыре названия. commit, plan и deploy встречаются по разу и не входят. Тройное вхождение lint не даёт трёх элементов: результат отвечает на вопрос «к каким шагам агент возвращался», а не «сколько раз».'
  kind: numeric
  answer: 4
  tolerance: 0.4
  id: 014-code-repeated-steps-1
  fingerprint: 639bbe11
- concept: хеш-множество отвечает только на вопрос о принадлежности; детерминированный порядок вывода требует отдельной последовательности
  question: Функция ищет повторяющиеся шаги журнала и должна вернуть их в порядке появления. Почему недостаточно накапливать повторы в множестве (set) и вернуть его?
  explanation: 'Множество даёт дешёвую проверку «видели ли уже», но не задаёт порядок обхода. Дубликаты оно как раз отсекает — это его плюс. Поэтому рабочая связка: множество для факта встречи плюс список для упорядоченного результата.'
  kind: choice
  options:
    - Множество не хранит порядок элементов, поэтому вывод перестаёт быть воспроизводимым; порядок надо накапливать в отдельной последовательности
    - Множество не умеет хранить строки, поэтому названия шагов придётся кодировать числами
    - Множество допускает дубликаты, поэтому трижды выполненный шаг попадёт в вывод трижды
    - Проверка принадлежности множеству занимает линейное время, поэтому на длинных журналах функция будет слишком медленной
  correct: 0
  id: 014-code-repeated-steps-2
