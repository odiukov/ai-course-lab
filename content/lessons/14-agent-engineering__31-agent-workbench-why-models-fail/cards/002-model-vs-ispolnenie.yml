- concept: единичный успешный прогон доказывает способность модели, но не надёжность её исполнения
  question: 'Одна и та же модель на одинаковом задании: в первом прогоне находит нужный файл, правит и прогоняет тесты; во втором пишет такой же код, но объявляет успех, не запустив проверку. Какой вывод корректен?'
  explanation: Способность отвечает на «может ли она это сделать», надёжность исполнения — «насколько регулярно проходит весь путь без пропусков». Успешный прогон закрывает первый вопрос и ничего не говорит про второй.
  kind: choice
  options:
    - Модель не умеет решать задачи такого класса
    - Модель способна решить задачу, но исполнение не доводится до конца стабильно
    - Разница объясняется только сложностью кода в конкретном прогоне
  correct: 1
  id: 002-model-vs-ispolnenie-1
  fingerprint: 9b3fcfd5
- concept: провал по пределу способностей и провал по исполнению различаются диагностикой и лечатся разными средствами
  question: Агент провалил задачу. Как отличить предел способностей модели от срыва исполнения?
  explanation: 'Единичный провал не доказывает неумение: срываться может окружение задачи, а не центральная часть «написать код». Диагноз задаёт, что менять — процесс или исполнителя.'
  kind: open
  reference: 'Надо повторить задачу при явно заданных условиях: определение готовности, разрешённые файлы, обязательный прогон проверок, доступное состояние предыдущей попытки. Если при этих условиях модель решает задачу — провал был в исполнении: потерян один из окружающих шагов (граница работы, критерий завершения, проверка результата). Если решение остаётся неверным по существу даже при полностью описанной работе — упёрлись в способность модели. Первое чинится процессом, второе — сменой модели или декомпозицией задачи.'
  id: 002-model-vs-ispolnenie-2
  fingerprint: ed82e27d
