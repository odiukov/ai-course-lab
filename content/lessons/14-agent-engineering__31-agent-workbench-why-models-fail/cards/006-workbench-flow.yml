- concept: 'порядок прохождения задачи через поверхности: ограничение области и состояние до изменения, наблюдение и проверка после'
  question: Расставь этапы прохождения задачи через workbench в правильном порядке — от постановки до передачи следующей сессии.
  explanation: 'Ограничения и состояние действуют до генерации, наблюдение и проверка — после. Последний шаг возвращает результат в состояние, поэтому конвейер замыкается в петлю: следующий прогон стартует не с пустого места.'
  kind: order
  items:
    - 'Задача ограничивается контрактом области: разрешённые файлы и критерии приёмки'
    - 'Читается сохранённое состояние: что уже сделано и откуда продолжать'
    - Агент вносит изменение
    - Фактический вывод выполнения возвращается в цикл
    - Гейт верификации прогоняет тесты, линтер и проверку границ
    - Проверяющий оценивает результат в независимой роли
    - Итог фиксируется и записывается обратно в состояние
  id: 006-workbench-flow-1
  fingerprint: dd3f2641
- concept: ограничения области действуют до генерации (ex-ante политика), а не как проверка постфактум
  question: Почему контракт области задаётся до того, как агент начнёт вносить изменения, а не проверяется только после?
  explanation: Область — это политика допуска, а не отчёт. Пока она действует на входе, недопустимая правка просто не происходит; сдвинутая на выход, она превращается в разбор последствий, а стоимость отката растёт вместе с объёмом сделанного.
  kind: choice
  options:
    - Заданный заранее контракт запрещает недопустимое действие, а проверка постфактум лишь фиксирует уже сделанную правку, которую придётся откатывать
    - Ранняя проверка области выполняется быстрее, чем поздняя
    - После генерации список изменённых файлов уже недоступен
    - Постфактум-проверка требует независимого проверяющего, а до генерации не требует
  correct: 0
