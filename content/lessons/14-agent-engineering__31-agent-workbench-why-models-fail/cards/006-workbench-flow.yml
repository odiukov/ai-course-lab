- concept: обратная связь исполнения и гейт верификации занимают разные позиции в потоке и решают разные задачи
  question: Обратная связь и гейт верификации оба показывают вывод команд. В чём разница их роли в потоке?
  explanation: 'Одна и та же команда служит двум целям в разных точках: внутри цикла её вывод — сигнал для следующего хода агента, на выходе — условие пропуска. Уберёшь первое — агент работает вслепую; уберёшь второе — непроверенный результат уходит дальше.'
  kind: choice
  options:
    - Обратная связь питает цикл во время работы и позволяет исправиться, верификация — гейт приёмки перед передачей результата дальше
    - Обратная связь работает с тестами, верификация — с логами сервера
    - Обратная связь запускается вручную, верификация — автоматически
    - Обратная связь применяется к чужому коду, верификация — к своему
