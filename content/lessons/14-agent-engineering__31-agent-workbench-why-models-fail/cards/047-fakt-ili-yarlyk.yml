- concept: разложимость паттерна в известные примитивы лишает его статуса открытия, но не отменяет пользы как готовой схемы их соединения
  question: 'Заявленный harness-паттерн полностью раскладывается в уже известные примитивы: триггер, очередь и запись состояния. Какой вывод корректен?'
  explanation: 'Перевод в примитивы отвечает на вопрос «что это по сути», а не «нужно ли это». Схема соединения — реальная ценность: она экономит проектирование. Обманывает только подача разложимого рецепта как новой архитектурной сущности.'
  kind: choice
  options:
