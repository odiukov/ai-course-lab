- concept: независимость ревью держится на урезанных правах воркера-ревьюера — чтение чужих артефактов и запись только своего отчёта
  question: Ревьюер запущен отдельным процессом, но имеет право писать в исходники строителя. Чем это опасно?
  explanation: 'Review — отдельный воркер с урезанными правами: читать артефакты строителя и писать отчёты ревью. Отдельность процесса сама по себе не мешает ревьюеру стать автором проверяемого кода; мешает именно отсутствие права записи в чужие артефакты. Та же логика, по которой кассир не подписывает акт проверки собственной кассы.'
  kind: choice
  options:
    - Он может сам исправить найденный дефект и затем одобрить собственную правку — независимого прохода больше нет
    - 'Ничем: отдельный процесс уже обеспечивает независимость'
    - 'Только скоростью: две записи в одни файлы замедлят прогон'
    - Ничем, если он каждый раз описывает свои правки в отчёте
