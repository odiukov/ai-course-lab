- concept: handoff несёт обоснование принятого решения — информацию, невыводимую из diff
  question: Сессия закончилась, изменения лежат в репозитории, историю правок видно в diff. Что handoff обязан нести сверх этого, потому что по коду это не восстанавливается?
  explanation: 'Diff показывает, что изменилось, но не почему: перенос проверки до HTTP-вызова и её удаление выглядят в коде одинаково самодостаточно. Без записанной причины следующая сессия заново открывает уже закрытый вопрос и может откатить осознанное решение. Список команд и переписка — избыточный лог, они не дают ни причины, ни оставшегося действия.'
  kind: choice
  options:
    - Причину, по которой выбран именно такой вариант правки
    - Полный список выполненных команд оболочки
    - Копию переписки исполнителя с моделью
    - Перечень изменённых строк и файлов
  correct: 0
  id: 019-handoff-1
  fingerprint: ed8c2e59
- concept: handoff действует на границе между прогонами, остальные поверхности — внутри прогона
  question: Чем handoff отличается от прочих поверхностей workbench по моменту срабатывания?
  explanation: 'Ограничение области, обратная связь, верификация и ревью нужны, пока задача исполняется. Handoff нужен ровно в точке, где один прогон кончается, а задача — нет: он переносит результат, причину и незакрытое действие в следующий прогон. Поэтому его отсутствие не портит текущий прогон, а обнуляет следующий.'
  kind: choice
  options:
    - Он работает на границе между прогонами, тогда как остальные действуют внутри одного прогона
    - Он единственный поддаётся автоматизации
    - Он подменяет гейт верификации, если тот не успел отработать
    - Он срабатывает до первого изменения кода
  correct: 0
