- concept: повторное исполнение шага — штатное событие распределённого прогона, поэтому шаги с побочными действиями проектируют идемпотентными
  question: Почему шаг агента, имеющий побочный эффект (создание записи, отправка запроса, коммит), стоит делать идемпотентным? Объясни своими словами.
  explanation: Ключевой момент — неразличимость потери подтверждения и невыполнения действия. Раз повтор неизбежен, безопасность повтора закладывается в сам шаг, а не в аккуратность исполнителя.
  kind: open
  reference: 'Прогон растянут по процессам и времени, поэтому результат шага может не дойти обратно: ответ теряется, процесс падает после действия, но до записи состояния, срабатывает ретрай. Исполнитель не отличает «действие не выполнилось» от «выполнилось, но подтверждение не вернулось», и повторяет шаг. Идемпотентность (ключ операции, проверка существования, повтор с тем же идентификатором) делает повтор безопасным: второй прогон не создаёт вторую запись и не отправляет второй запрос.'
