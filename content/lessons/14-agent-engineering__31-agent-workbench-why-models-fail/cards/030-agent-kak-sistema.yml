- concept: цикл агента отображается на примитив воркера, а обращение к модели — на функцию, которую этот воркер вызывает
  question: Чем является сам цикл агента в терминах примитивов распределённых систем?
  explanation: Цикл — воркер обычной формы обработчика задач. Обращение к модели и вызовы инструментов — функции, которые он вызывает; состояние и обратная связь — записи, которые он пишет; проверка, ревью и передача дел — триггеры, которые он выдаёт.
  kind: choice
  options:
    - 'Воркером: долгоживущим процессом, который потребляет события, вызывает функции, пишет записи и выдаёт триггеры'
    - 'Функцией: чистым обработчиком с типизированными входом и выходом'
    - 'Очередью: устойчивым буфером между триггером и исполнителем'
    - Политикой авторизации, решающей, какие вызовы допустимы
  correct: 0
