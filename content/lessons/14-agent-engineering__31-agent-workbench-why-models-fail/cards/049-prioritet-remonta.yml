  question: Расставь шаги выбора первой починки после аудита workbench, давшего несколько замечаний.
  explanation: Оценка самой слабой поверхности — вход разбора, а не готовый план. Причинную связь даёт только сопоставление замечаний с наблюдаемыми сбоями, а повторный аудит отличает уцелевший симптом каскада от отдельного дефекта.
