  question: 'Два дефекта объясняют одинаковое число сбоев прогона: Scope отсутствует полностью, а Verification реализована частично (запускается только линтер, тесты не влияют на приёмку). С чего разумнее начать и почему?'
  explanation: Частичная реализация даёт ненулевое покрытие, полное отсутствие — нулевое. При сопоставимом влиянии выигрыш от закрытия нулевого покрытия больше, поэтому отсутствующая поверхность идёт первой.
