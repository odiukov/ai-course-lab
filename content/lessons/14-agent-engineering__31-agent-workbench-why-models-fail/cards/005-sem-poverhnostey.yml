- concept: Review — независимый проход в роли проверяющего; самопроверка автора его не заменяет
  question: Что отличает поверхность Review от повторного прохода того же агента по своему коду?
  explanation: Автор наследует свои же допущения и ищет подтверждение решения. Review вводит независимую позицию с собственными критериями — это отдельный проход в другой роли, а не повторное чтение тем же взглядом; смена модели тут не обязательное условие.
  kind: choice
  options:
    - 'Смена роли: проверяющий оценивает результат против критериев приёмки, а не защищает выбранное решение'
    - 'Более длинный контекст: проверяющий видит больше файлов'
    - 'Другая модель: ревью обязано выполняться моделью другого поставщика'
    - 'Другой момент времени: ревью проводится после мержа в основную ветку'
  correct: 0
