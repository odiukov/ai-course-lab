- concept: Feedback несёт фактический вывод исполнения обратно в цикл, а не пересказ агента о результате
  question: Агент отправил запрос, сервер вернул 503, а в отчёте агента написано «эндпоинт отвечает корректно». Отсутствие какой поверхности workbench это диагностирует?
  explanation: Feedback — это канал, по которому фактический вывод команды, ответа сервера или теста попадает обратно к агенту. Когда он разорван, модель продолжает работать со своей моделью мира, а не с наблюдаемым результатом, и уверенно объявляет успех поверх ошибки.
  kind: choice
  options:
    - 'Feedback: реальный вывод исполнения не возвращается в цикл, поэтому агент рассуждает о собственном ожидании'
    - 'Scope: агент обратился к запрещённому эндпоинту'
    - 'Instructions: агенту не сказали, какой код ответа считается успешным'
    - 'Handoff: результат запроса не записан для следующей сессии'
  correct: 0
  id: 005-sem-poverhnostey-1
  fingerprint: 2467372b
- concept: 'поверхности не взаимозаменяемы: каждая закрывает свой режим отказа, покрытие одной не компенсирует отсутствие другой'
  question: В окружении настроены тесты и линтер, они дают зелёный результат. Какой отказ этот набор в принципе не способен поймать?
  explanation: 'Verification отвечает на вопрос «работает ли то, что сделано», и молчит про вопрос «то ли сделано». Границы разрешённых и запрещённых изменений держит Scope. Поэтому надёжность даёт набор поверхностей, а не усиление одной: у каждой свой режим отказа.'
  kind: choice
  options:
    - Изменение файлов, которые задача не разрешала трогать
    - Синтаксическую ошибку в новом модуле
    - Нарушение стиля именования переменных
    - Падение проверки граничных значений
  correct: 0
