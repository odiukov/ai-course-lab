- concept: пригодность обратной связи определяется наличием диагностических деталей вызова, а не булевым статусом
  question: Инструмент вернул `HTTP 422 — field 'email' has invalid format`, а оболочка передала модели строку «вызов завершён с ошибкой». Чего не хватает для исправления?
  explanation: 'Булев статус говорит, что действие не удалось, но не говорит, что менять. Полезный результат несёт минимум три вещи: статус (код выхода или HTTP-код), обычный вывод и текст ошибки. Именно строка про формат `email` превращает следующий ход из повторной попытки наугад в точную правку.'
  kind: choice
  options:
    - 'Причины отказа: кода ответа и тела (для shell — stdout и stderr), из которых видно, какое поле и чем не устроило'
    - Более подробной инструкции в системном промпте
    - Повтора того же вызова с теми же аргументами
    - Разрешения записывать файлы в репозитории
  correct: 0
  id: 012-feedback-1
  fingerprint: 880331b4
- concept: поверхность Feedback соответствует примитиву устойчивой записи вызова в очередь/журнал
  question: Каким примитивом распределённых систем описывается поверхность Feedback, если снять с неё слово «агент»?
  explanation: 'Политика авторизации — это про границы полномочий, хранилище состояния — про то, что переживает перезапуск между шагами, рантайм — про то, где и с какими лимитами всё исполняется. Feedback же — журнал вызовов: каждая запись устойчива и воспроизводима, как сообщение в очереди.'
  kind: choice
  options:
    - Устойчивая запись каждого вызова в журнал/очередь — воспроизводимая и переживающая перезапуск
    - Политика авторизации, решающая, кто какую функцию вызывает
    - Хранилище состояния сессии, читаемое рантаймом на каждом шаге
    - Граница рантайма, задающая таймауты и ресурсы
  correct: 0
  id: 012-feedback-2
  fingerprint: 650ab5c0
- concept: результат вызова должен становиться входом следующего хода модели; лог, который читает только человек, цикл не замыкает
  question: Оболочка пишет полный вывод каждой команды в файл лога, доступный человеку, а модели передаёт только строку «команда выполнена». Замкнут ли цикл? Объясни.
  explanation: Хранение вывода и доставка вывода — разные вещи. Первое даёт воспроизводимость и разбор, второе даёт исполнителю возможность исправиться до того, как ошибка уедет дальше.
  kind: open
  reference: 'Нет. Наблюдение сохранено, но не доставлено тому, кто принимает следующее решение. Feedback замыкает цикл, только если результат вызова становится частью входа следующего хода модели: тогда несовпадение ожидаемого и фактического видно там, где выбирается очередное действие. Лог для человека полезен как аудит и разбор постфактум, но пока модель его не видит, она продолжает действовать по своим намерениям и может объявить успех после отказа. Признак разомкнутости простой: команда ушла, наблюдение вернулось не в контур принятия решения.'
  id: 012-feedback-3
  fingerprint: 60f4a04d
