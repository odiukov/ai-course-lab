<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта восьми системных примитивов</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --surface: #ffffff;
    --surface-strong: #e8eef8;
    --ink: #172033;
    --muted: #5d687b;
    --line: #8794aa;
    --execution: #2563a7;
    --execution-fill: #e8f2ff;
    --connection: #7a4aa0;
    --connection-fill: #f3eafd;
    --queue: #b45f16;
    --queue-fill: #fff0dc;
    --state: #18705b;
    --state-fill: #def5ed;
    --danger: #a13e4a;
    --shadow: #cbd5e1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --surface: #182131;
      --surface-strong: #253248;
      --ink: #edf3ff;
      --muted: #afbbce;
      --line: #6f7e95;
      --execution: #75b7ff;
      --execution-fill: #183652;
      --connection: #d09aef;
      --connection-fill: #39294a;
      --queue: #ffb25f;
      --queue-fill: #49331e;
      --state: #62d5b2;
      --state-fill: #193d35;
      --danger: #ff8997;
      --shadow: #0b1018;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    width: 100%;
  }

  header {
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 20px;
    line-height: normal;
  }

  .kicker {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--bg);
  }

  .map-line {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
  }

  .guide {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5px;
    stroke-dasharray: 6px 5px;
  }

  .arrow {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-head {
    fill: var(--ink);
    stroke: none;
  }

  .node {
    stroke-width: 2px;
  }

  .execution {
    fill: var(--execution-fill);
    stroke: var(--execution);
  }

  .connection {
    fill: var(--connection-fill);
    stroke: var(--connection);
  }

  .center {
    fill: var(--surface-strong);
    stroke: var(--ink);
    stroke-width: 3px;
  }

  .panel {
    fill: var(--surface);
    stroke: var(--shadow);
    stroke-width: 2px;
  }

  .queue-box {
    fill: var(--queue-fill);
    stroke: var(--queue);
    stroke-width: 2px;
  }

  .state-box {
    fill: var(--state-fill);
    stroke: var(--state);
    stroke-width: 2px;
  }

  .node-label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .center-label {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .group-label {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
    text-anchor: middle;
  }

  .execution-label { fill: var(--execution); }
  .connection-label { fill: var(--connection); }

  .panel-title {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
    text-anchor: start;
    dominant-baseline: middle;
  }

  .mini-label {
    fill: var(--ink);
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .annotation {
    fill: var(--muted);
    font-size: 12px;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .retry-label {
    fill: var(--queue);
    font-size: 12px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  .restart-label {
    fill: var(--danger);
    font-size: 11px;
    font-weight: bold;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  #fallback {
    margin: auto;
    max-width: 900px;
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--danger);
    font-size: 15px;
    text-align: center;
  }

  [hidden] { display: none; }
</style>
</head>
<body>
<header>
  <h1>Карта восьми системных примитивов</h1>
  <p class="kicker">Не этапы, а места, где проверяют нарушенный системный контракт</p>
</header>

<div id="fallback">
  Схема должна показать восемь примитивов вокруг цикла агента, ретраи очереди
  и восстановление сохранённой сессии после перезапуска.
</div>

<svg id="diagram" viewBox="0 0 1200 460" width="1200" height="460"
     role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Карта восьми системных примитивов вокруг цикла агента</title>
  <desc id="svg-desc">
    Четыре примитива исполнения и четыре примитива связи и состояния окружают
    цикл агента. Внизу отдельно показаны ретрай очереди и восстановление
    состояния после перезапуска.
  </desc>
</svg>

<script>
const data = [
  {
    kind: "config",
    zero: 0,
    half: 0.5,
    huge: 100000,
    arrowBack: 1.5,
    arrowWing: 0.9,
    dash: 0.7,
    gap: 0.55
  },
  {
    kind: "group",
    x: -33,
    y: -29,
    text: "ИСПОЛНЕНИЕ",
    className: "group-label execution-label"
  },
  {
    kind: "group",
    x: 33,
    y: -29,
    text: "СВЯЗЬ · СОСТОЯНИЕ · ПРАВА",
    className: "group-label connection-label"
  },
  {
    kind: "center",
    id: "loop",
    x: 0,
    y: 0,
    w: 24,
    h: 10,
    lines: ["ЦИКЛ", "АГЕНТА"],
    ty: [-1.25, 1.25]
  },
  {
    kind: "node",
    id: "function",
    group: "execution",
    x: -45,
    y: -19,
    w: 20,
    h: 7,
    lines: ["ФУНКЦИЯ"],
    ty: [0]
  },
  {
    kind: "node",
    id: "worker",
    group: "execution",
    x: -16,
    y: -23,
    w: 19,
    h: 7,
    lines: ["ВОРКЕР"],
    ty: [0]
  },
  {
    kind: "node",
    id: "trigger",
    group: "execution",
    x: 16,
    y: -23,
    w: 19,
    h: 7,
    lines: ["ТРИГГЕР"],
    ty: [0]
  },
  {
    kind: "node",
    id: "runtime",
    group: "execution",
    x: 45,
    y: -19,
    w: 20,
    h: 7,
    lines: ["РАНТАЙМ"],
    ty: [0]
  },
  {
    kind: "node",
    id: "rpc",
    group: "connection",
    x: -47,
    y: 8,
    w: 20,
    h: 7,
    lines: ["HTTP / RPC"],
    ty: [0]
  },
  {
    kind: "node",
    id: "queue",
    group: "connection",
    x: -21,
    y: 19,
    w: 19,
    h: 7,
    lines: ["ОЧЕРЕДЬ"],
    ty: [0]
  },
  {
    kind: "node",
    id: "persistence",
    group: "connection",
    x: 18,
    y: 19,
    w: 24,
    h: 8,
    lines: ["СОСТОЯНИЕ", "СЕССИИ"],
    ty: [-1.05, 1.05]
  },
  {
    kind: "node",
    id: "policy",
    group: "connection",
    x: 47,
    y: 8,
    w: 22,
    h: 8,
    lines: ["ПОЛИТИКА", "ДОСТУПА"],
    ty: [-1.05, 1.05]
  },
  {
    kind: "panel",
    id: "queue-panel",
    x: -56,
    y: 33,
    w: 48,
    h: 14,
    title: "ОЧЕРЕДЬ УДЕРЖИВАЕТ РАБОТУ"
  },
  {
    kind: "panel",
    id: "state-panel",
    x: 5,
    y: 33,
    w: 52,
    h: 14,
    title: "СЕССИЯ ПЕРЕЖИВАЕТ ПЕРЕЗАПУСК"
  },
  {
    kind: "mini",
    group: "queue-box",
    x: -49,
    y: 40,
    w: 11,
    h: 5,
    text: "РАБОТА"
  },
  {
    kind: "mini",
    group: "queue-box",
    x: -18,
    y: 40,
    w: 12,
    h: 5,
    text: "ВОРКЕР"
  },
  {
    kind: "mini",
    group: "state-box",
    x: 12,
    y: 40,
    w: 12,
    h: 5,
    text: "СЕССИЯ"
  },
  {
    kind: "mini",
    group: "state-box",
    x: 31,
    y: 40,
    w: 14,
    h: 5,
    text: "ХРАНИЛИЩЕ"
  },
  {
    kind: "mini",
    group: "state-box",
    x: 50,
    y: 40,
    w: 12,
    h: 5,
    text: "НОВЫЙ ЦИКЛ"
  },
  {
    kind: "guide",
    points: [[-21, 22.5], [-32, 30], [-32, 33]]
  },
  {
    kind: "guide",
    points: [[18, 23], [25, 29], [25, 33]]
  },
  {
    kind: "arrow",
    className: "arrow",
    points: [[-43.5, 40], [-24, 40]],
    label: "выдача",
    lx: -33.75,
    ly: 38.5,
    labelClass: "annotation"
  },
  {
    kind: "arrow",
    className: "arrow",
    points: [[-18, 42.5], [-18, 45], [-49, 45], [-49, 42.5]],
    label: "ошибка → ретрай",
    lx: -33.5,
    ly: 43.6,
    labelClass: "retry-label"
  },
  {
    kind: "arrow",
    className: "arrow",
    points: [[18, 40], [24, 40]],
    label: "сохранить",
    lx: 21,
    ly: 38.5,
    labelClass: "annotation"
  },
  {
    kind: "separator",
    points: [[40.5, 35.5], [40.5, 45.5]],
    label: "ПЕРЕЗАПУСК",
    lx: 40.5,
    ly: 35
  },
  {
    kind: "arrow",
    className: "arrow",
    points: [[38, 40], [44, 40]],
    label: "восстановить",
    lx: 41,
    ly: 43.7,
    labelClass: "annotation"
  }
];

const origin = { x: 600, y: 214 };
const scale = { x: 9.2, y: 4.9 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");
const [config] = data.filter(item => item.kind === "config");

function make(tag, attributes, text) {
  const node = document.createElementNS(svg.namespaceURI, tag);
  Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));
  if (text !== undefined) node.textContent = text;
  return node;
}

function rectBox(item, className) {
  const left = item.x - item.w * config.half;
  const right = item.x + item.w * config.half;
  const top = item.y - item.h * config.half;
  const bottom = item.y + item.h * config.half;
  return make("rect", {
    x: sx(left),
    y: sy(top),
    width: sx(right) - sx(left),
    height: sy(bottom) - sy(top),
    class: className
  });
}

function addMultiline(item, className) {
  const text = make("text", {
    x: sx(item.x),
    y: sy(item.y),
    class: className
  });
  item.lines.forEach((line, index) => {
    text.appendChild(make("tspan", {
      x: sx(item.x),
      y: sy(item.y + item.ty[index])
    }, line));
  });
  svg.appendChild(text);
}

function clippedEndpoints(center, node) {
  const dx = node.x - center.x;
  const dy = node.y - center.y;
  const centerTx = dx !== config.zero
    ? center.w * config.half / Math.abs(dx)
    : config.huge;
  const centerTy = dy !== config.zero
    ? center.h * config.half / Math.abs(dy)
    : config.huge;
  const nodeTx = dx !== config.zero
    ? node.w * config.half / Math.abs(dx)
    : config.huge;
  const nodeTy = dy !== config.zero
    ? node.h * config.half / Math.abs(dy)
    : config.huge;
  const fromScale = Math.min(centerTx, centerTy);
  const toScale = Math.min(nodeTx, nodeTy);
  return [
    [center.x + dx * fromScale, center.y + dy * fromScale],
    [node.x - dx * toScale, node.y - dy * toScale]
  ];
}

function polyline(points, className) {
  return make("polyline", {
    points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
    class: className
  });
}

function addArrow(item) {
  svg.appendChild(polyline(item.points, item.className));
  const end = item.points.at(-config.arrowWing);
  const before = item.points.at(-config.arrowBack);
  const dx = end[0] - before[0];
  const dy = end[1] - before[1];
  const length = Math.sqrt(dx * dx + dy * dy);
  const ux = dx / length;
  const uy = dy / length;
  const baseX = end[0] - ux * config.arrowBack;
  const baseY = end[1] - uy * config.arrowBack;
  const left = [
    baseX - uy * config.arrowWing,
    baseY + ux * config.arrowWing
  ];
  const right = [
    baseX + uy * config.arrowWing,
    baseY - ux * config.arrowWing
  ];
  svg.appendChild(make("polygon", {
    points: [
      `${sx(end[0])},${sy(end[1])}`,
      `${sx(left[0])},${sy(left[1])}`,
      `${sx(right[0])},${sy(right[1])}`
    ].join(" "),
    class: "arrow-head"
  }));
  svg.appendChild(make("text", {
    x: sx(item.lx),
    y: sy(item.ly),
    class: item.labelClass
  }, item.label));
}

try {
  const center = data.find(item => item.kind === "center");
  const nodes = data.filter(item => item.kind === "node");

  nodes.forEach(node => {
    const points = clippedEndpoints(center, node);
    svg.appendChild(make("line", {
      x1: sx(points[0][0]),
      y1: sy(points[0][1]),
      x2: sx(points[1][0]),
      y2: sy(points[1][1]),
      class: "map-line"
    }));
  });

  data.filter(item => item.kind === "guide").forEach(item => {
    svg.appendChild(polyline(item.points, "guide"));
  });

  data.filter(item => item.kind === "panel").forEach(item => {
    svg.appendChild(rectBox(item, "panel"));
    const left = item.x - item.w * config.half;
    const top = item.y - item.h * config.half;
    svg.appendChild(make("text", {
      x: sx(left + config.gap),
      y: sy(top + config.arrowBack),
      class: "panel-title"
    }, item.title));
  });

  data.filter(item => item.kind === "group").forEach(item => {
    svg.appendChild(make("text", {
      x: sx(item.x),
      y: sy(item.y),
      class: item.className
    }, item.text));
  });

  svg.appendChild(rectBox(center, "center"));
  addMultiline(center, "center-label");

  nodes.forEach(node => {
    svg.appendChild(rectBox(node, `node ${node.group}`));
    addMultiline(node, "node-label");
  });

  data.filter(item => item.kind === "mini").forEach(item => {
    svg.appendChild(rectBox(item, item.group));
    svg.appendChild(make("text", {
      x: sx(item.x),
      y: sy(item.y),
      class: "mini-label"
    }, item.text));
  });

  data.filter(item => item.kind === "arrow").forEach(addArrow);

  data.filter(item => item.kind === "separator").forEach(item => {
    svg.appendChild(polyline(item.points, "guide"));
    svg.appendChild(make("text", {
      x: sx(item.lx),
      y: sy(item.ly),
      class: "restart-label"
    }, item.label));
  });

  fallback.hidden = true;
} catch (error) {
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
</body>
</html>
