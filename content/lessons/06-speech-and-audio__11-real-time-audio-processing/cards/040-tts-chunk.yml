- concept: слишком короткие выходные TTS-чанки делают слышимыми артефакты на границах работы вокодера
  question: Почему маленькие кадры подходят для чтения готового сигнала с микрофона, но столь же мелкие выходные чанки могут ухудшить голос потокового TTS?
  explanation: 'При TTS-чанках короче примерно 200 мс швы вокодера могут стать слышимыми. Около 320 мс обычно даёт разумный компромисс: границ меньше, а поток всё ещё можно начать воспроизводить быстро.'
  kind: open
  reference: Микрофонные кадры лишь делят уже существующую звуковую волну. Вокодер синтезирует каждый выходной чанк отдельно, поэтому между соседними чанками возможны разрывы фазы, тембра или просодии. Чем короче чанки, тем чаще встречаются такие границы и тем заметнее артефакты.
