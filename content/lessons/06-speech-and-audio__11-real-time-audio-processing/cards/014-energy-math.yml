- concept: энергия аудиокадра вычисляется как среднее квадратов его отсчётов
  question: Аудиокадр состоит из отсчётов [0.25, -0.25, 0.75, -0.75]. Чему равен их средний квадрат?
  explanation: Квадраты отсчётов равны 0.0625, 0.0625, 0.5625 и 0.5625. Их сумма — 1.25, а среднее для четырёх отсчётов — 0.3125. Знаки не влияют на результат.
  kind: numeric
  answer: 0.3125
  tolerance: 0.00001
  id: 014-energy-math-1
  fingerprint: e8626422
- concept: энергетический VAD не отличает речь от фонового шума с сопоставимой энергией
  question: Кадр с речью и кадр с шумом вентилятора имеют одинаковый средний квадрат отсчётов. Как поведёт себя VAD, использующий только фиксированный энергетический порог?
  explanation: Такой детектор видит только энергию кадра. При одинаковом среднем квадрате и одном пороге он не располагает признаком, позволяющим отличить голос от вентилятора.
  kind: choice
  options:
    - Обязательно распознает речь только в первом кадре
    - Примет одинаковое решение для обоих кадров
    - Обязательно отклонит оба кадра как тишину
    - Определит источник звука по знакам отсчётов
  correct: 1
  id: 014-energy-math-2
  fingerprint: 18ae6d1f
- concept: сравнение среднего квадрата с квадратом порога эквивалентно сравнению RMS с порогом амплитуды
  question: Почему энергетический VAD может сравнивать средний квадрат отсчётов с квадратом амплитудного порога, не вычисляя RMS?
  explanation: И средний квадрат, и порог в квадрате неотрицательны. Возведение обеих сторон сравнения RMS в квадрат сохраняет его результат и убирает лишнюю операцию квадратного корня.
  kind: open
  reference: Квадратный корень монотонно возрастает для неотрицательных значений. Поэтому условие «RMS больше порога» эквивалентно условию «средний квадрат больше квадрата порога», а извлекать корень на каждом кадре не требуется.
  id: 014-energy-math-3
  fingerprint: f77610ac
