- concept: глубина jitter buffer задаёт компромисс между устойчивостью к сетевому джиттеру и задержкой воспроизведения
  question: Объясните своими словами, почему увеличение jitter buffer уменьшает вероятность слышимых провалов, но ухудшает отзывчивость голосового приложения.
  explanation: Jitter buffer не устраняет колебания сетевой задержки, а маскирует их запасом заранее накопленного аудио. Малый запас приводит к провалам при опоздании пакетов, а чрезмерный делает диалог заметно медленнее.
  kind: open
  reference: Большой буфер дольше удерживает уже полученное аудио, поэтому запоздавшие пакеты чаще успевают прийти до своего момента воспроизведения. Однако воспроизведение начинается позже, и эта дополнительная задержка увеличивает сквозную latency разговора.
  id: 023-jitter-2
  fingerprint: a1714e60
