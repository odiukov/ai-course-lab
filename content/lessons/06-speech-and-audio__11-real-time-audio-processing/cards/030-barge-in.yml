- concept: при barge-in активный синтез отменяется до передачи нового аудиокадра в ASR
  question: Расположите действия обработчика barge-in в правильном порядке.
  explanation: Ассистент должен замолчать сразу после обнаружения речи пользователя. Поэтому активную задачу TTS отменяют до того, как продолжают обработку кадра в ASR.
  kind: order
  items:
    - Получить от VAD кадр, помеченный как речь пользователя
    - Если задача потокового TTS ещё выполняется, отменить её
    - Передать аудиокадр в потоковый ASR
  id: 030-barge-in-1
  fingerprint: 78d06e4c
- concept: потоковый TTS должен выполняться отдельной асинхронной задачей, чтобы оставаться отменяемым
  question: Почему в системе с barge-in потоковый синтез речи запускают через asyncio.create_task, а не обычным блокирующим вызовом?
  explanation: При блокирующем синтезе управляющий поток не сможет одновременно принимать аудио пользователя и заметить перебивание. asyncio.create_task позволяет обрабатывать ввод параллельно и вызвать cancel() у активного TTS.
  kind: open
  reference: Отдельная асинхронная задача не блокирует обработку входящих кадров микрофона. Система может вовремя обнаружить речь пользователя и отменить ещё выполняющийся TTS.
  id: 030-barge-in-2
  fingerprint: 8d550ba6
