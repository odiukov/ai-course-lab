- concept: VAD размечает аудио как речь или не-речь, а не регулирует его громкость
  question: Почему VAD корректнее считать классификатором аудиокадров, а не регулятором громкости?
  explanation: Задача VAD — классификация речи и не-речи. Поэтому VAD может учитывать не только амплитуду, но и другие признаки сигнала; изменение громкости само по себе не является его основной функцией.
  kind: open
  reference: VAD с помощью модели или эвристики определяет, относится ли кадр к речи или не-речи. Он выдаёт разметку для дальнейшей логики системы, а не просто делает тихий сигнал громче или тише.
  id: 043-quiz-2
  fingerprint: 0cee257a
- concept: полный дуплекс допускает одновременную речь пользователя и системы
  question: Какое поведение характеризует голосовую систему с full duplex?
  explanation: Full duplex означает одновременную передачу звука в обе стороны. В отличие от строгого чередования реплик, система продолжает принимать пользователя даже во время собственного аудио; Moshi — пример такой архитектуры.
  kind: choice
  options:
    - Она разрешает говорить только после полного завершения предыдущей реплики
    - Пользователь и бот могут говорить одновременно
    - Она лишь восстанавливает порядок сетевых пакетов
    - Она обязательно отключает микрофон на время ответа бота
  correct: 1
