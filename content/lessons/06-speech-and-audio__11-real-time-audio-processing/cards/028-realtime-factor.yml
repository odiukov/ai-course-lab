- concept: RTF равен отношению времени обработки к длительности обработанного аудио
  question: Аудиофрагмент длительностью 48 мс обрабатывается за 27 мс. Чему равен RTF?
  explanation: 'RTF вычисляется как время обработки, делённое на длительность аудио: 27 / 48 = 0.5625. Такой результат находится ниже границы устойчивости: обработчик в среднем работает быстрее, чем поступает звук.'
  kind: numeric
  answer: 0.5625
  tolerance: 0.001
  id: 028-realtime-factor-1
  fingerprint: 66d0835c
- concept: запас RTF ниже границы устойчивости нужен для компенсации временных скачков времени обработки
  question: Почему в рабочем аудиопайплайне опасно целиться в RTF почти у самой границы устойчивости, даже если среднее значение формально остаётся ниже неё?
  explanation: Среднее значение скрывает кратковременные замедления. В эти моменты обработчик копит очередь, а заметный запас производительности позволяет быстро её разобрать после возврата к обычной скорости.
  kind: choice
  options:
    - Скачки из-за сборки мусора, планировщика или сложных кадров могут накопить долг, который небольшой запас будет погашать слишком медленно
    - RTF неизбежно увеличивается с продолжительностью разговора, даже если время обработки кадров постоянно
    - Кольцевой буфер перестаёт принимать кадры, когда RTF приближается к границе устойчивости
    - RTF измеряет только сетевую задержку и не учитывает вычисления моделей
