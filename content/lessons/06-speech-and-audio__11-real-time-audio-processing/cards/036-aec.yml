- concept: AEC вычитает эхо только после оценки задержки и преобразования сигнала акустическим трактом
  question: Расположи этапы акустического эхоподавления в правильном порядке.
  explanation: 'Прямое вычитание исходного TTS не сработает: на пути через динамик, помещение и микрофон сигнал задерживается и изменяется. AEC сначала моделирует этот путь, затем вычитает уже согласованную с микрофонной записью оценку эха.'
  kind: order
  items:
    - Получить точный цифровой сигнал, отправляемый на динамик
    - По сигналу микрофона оценить задержку и искажения акустического пути
    - Сформировать оценку того, как воспроизводимый сигнал вернулся в микрофон
    - Вычесть оценённое эхо из микрофонного сигнала и передать остаток дальше
