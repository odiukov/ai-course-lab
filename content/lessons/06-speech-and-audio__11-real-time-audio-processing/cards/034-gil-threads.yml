- concept: аудиоколбэк на горячем пути должен выполнять только быстрое копирование кадра, а тяжёлую обработку следует вынести
  question: Как организовать захват аудио и выполнение ASR, VAD и ресемплинга, чтобы конкуренция за GIL не срывала поступление кадров?
  explanation: Чем меньше Python-работы выполняет аудиоколбэк, тем ниже риск пропустить срок чтения очередного кадра. Модели и преобразования можно обрабатывать асинхронно после того, как кадр надёжно сохранён.
  kind: open
  reference: Использовать библиотеку с аудиоколбэком, вызываемым из C-потока звуковой подсистемы, например sounddevice поверх PortAudio. В колбэке только быстро скопировать кадр в заранее подготовленный буфер и сразу выйти. ASR, VAD, ресемплинг, логирование и другую тяжёлую работу выполнять вне горячего пути — в отдельном потоке или процессе.
  id: 034-gil-threads-2
  fingerprint: 1ff2b68f
