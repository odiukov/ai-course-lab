- concept: задержки последовательных этапов складываются в сквозную задержку
  question: Последовательные этапы аудиопайплайна занимают 17, 13, 137, 83, 89 и 19 мс. Какова сквозная задержка до начала воспроизведения?
  explanation: 'Нужно сложить задержки всех этапов: 17 + 13 + 137 + 83 + 89 + 19 = 358 мс. Максимум отдельных задержек здесь брать нельзя: каждый следующий этап зависит от результата предыдущего.'
  kind: numeric
  answer: 358
  tolerance: 0.1
  id: 002-budget-table-1
  fingerprint: ae1f1021
- concept: в стриминговом пайплайне критична задержка до первого пригодного результата
  question: Какие метрики лучше всего отражают момент, когда стриминговый голосовой ассистент может начать отвечать?
  explanation: Стриминг позволяет передавать частичные результаты дальше по конвейеру. Поэтому для начала ответа важны время до первого токена и время до первого аудиофрагмента, а не полное время генерации реплики.
  kind: choice
  options:
    - Время до завершения всего текста LLM и синтеза всей аудиореплики
    - Время до первого токена LLM и первого аудиофрагмента TTS
    - Среднее время обработки всех запросов после завершения диалога
  correct: 1
  id: 002-budget-table-2
  fingerprint: dcb51bb5
- concept: при одинаковом относительном ускорении наибольший вклад даёт оптимизация самого дорогого этапа
  question: 'Этапы голосового пайплайна занимают: буферизация — 18 мс, VAD — 12 мс, ASR — 126 мс, LLM — 84 мс, TTS — 147 мс, вывод звука — 21 мс. Какой этап выгоднее оптимизировать, если любой из них можно ускорить на одинаковую долю?'
  explanation: При одинаковом относительном ускорении абсолютная экономия пропорциональна исходной задержке. TTS занимает 147 мс — больше любого другого этапа, поэтому его оптимизация сильнее всего уменьшит общую задержку.
  kind: choice
  options:
    - VAD
    - ASR
    - LLM
    - TTS
  correct: 3
