- concept: уменьшение длительности кадра повышает частоту фиксированных накладных расходов
  question: Длительность аудиокадра уменьшили, сохранив частоту дискретизации и объём звука в секунду. Почему загрузка процессора может вырасти?
  explanation: У каждого вызова есть почти постоянная служебная стоимость. Короткие кадры поступают чаще, поэтому пайплайн чаще платит за планирование, передачу данных и вход в обработчик.
  kind: choice
  options:
    - Пробуждение потока, передача буфера и вызов модели происходят чаще
    - Частота дискретизации автоматически увеличивается
    - В каждом кадре становится больше отсчётов
    - Кольцевой буфер обязательно удваивается
  correct: 0
  id: 008-frame-tradeoff-1
  fingerprint: 8e9fec27
- concept: увеличение длительности кадра добавляет задержку его накопления
  question: Почему большой аудиокадр увеличивает минимальную задержку пайплайна, даже если последующая обработка выполняется мгновенно?
  explanation: Размер кадра задаёт время, которое требуется на его заполнение. Эта задержка возникает до работы VAD, ASR и остальных компонентов, поэтому ускорение моделей её не устраняет.
  kind: open
  reference: Обработчик не может получить полный кадр, пока микрофон не накопит аудио на всю его длительность. Поэтому увеличение кадра непосредственно добавляет ожидание до начала дальнейшей обработки.
  id: 008-frame-tradeoff-2
  fingerprint: a2cafcff
