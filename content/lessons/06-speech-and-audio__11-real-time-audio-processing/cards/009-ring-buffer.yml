- concept: предварительно выделенный кольцевой буфер обеспечивает предсказуемые затраты памяти и убирает выделения памяти из горячего аудиопути
  question: Объясни своими словами, почему для передачи аудиокадров между производителем и потребителем предварительно выделенный кольцевой буфер обычно предпочтительнее растущего списка.
  explanation: В аудиопотоке важна предсказуемость времени выполнения. Фиксированная ёмкость ограничивает потребление памяти, а повторное использование ячеек устраняет динамические выделения памяти из горячего пути.
  kind: open
  reference: Кольцевой буфер занимает заранее ограниченный объём памяти и переиспользует уже выделенные ячейки. Поэтому каждый новый кадр не вызывает выделение памяти, а временное отставание потребителя не приводит к неограниченному росту очереди и непредсказуемым паузам.
