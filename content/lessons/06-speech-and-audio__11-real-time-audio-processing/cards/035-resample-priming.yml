- concept: холостой синтез при запуске устраняет задержку холодного старта первого реального запроса к TTS
  question: Расположите действия в порядке, который позволяет обслужить первую реальную реплику без холодного старта TTS.
  explanation: Первый прогон заранее загружает нужные веса и поднимает вычислительные ядра. Поэтому затраты на прогрев возникают при старте сервиса, а не во время первой реплики пользователя.
  kind: order
  items:
    - Загрузить TTS-модель и оставить её в памяти
    - Выполнить холостой синтез и отбросить полученное аудио
    - Начать принимать пользовательские запросы
    - Синтезировать первую реальную реплику
