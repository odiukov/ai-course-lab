- concept: перекрытие работы этапов сокращает сквозное время без ускорения отдельных моделей
  question: Объясни своими словами, как голосовой ассистент может отвечать заметно быстрее, даже если ASR, языковая модель и синтезатор речи по отдельности не стали вычислять быстрее.
  explanation: Главный выигрыш возникает из-за перекрытия вычислений и передачи промежуточных результатов. Производительность отдельного компонента может остаться прежней, но простаивающих интервалов между компонентами становится меньше.
  kind: open
  reference: 'Этапы запускаются асинхронно и работают одновременно с частичными результатами: языковая модель уже обрабатывает начало распознанной фразы, пока ASR разбирает её продолжение, а синтез речи может принимать первые фрагменты ответа до завершения всей генерации. Поэтому сокращается ожидание между этапами и общее календарное время.'
  id: 005-tri-priema-2
  fingerprint: 401ae987
- concept: прерываемая генерация отменяет устаревший ответ при новой реплике пользователя
  question: Пользователь начал говорить поверх ответа голосового ассистента. Расположи действия прерываемой системы в логическом порядке.
  explanation: Сначала система должна заметить вмешательство пользователя, затем отменить ставший неактуальным ответ и переключиться на новую реплику. Это предотвращает расход вычислений и времени на продолжение ответа, который пользователь уже прервал.
  kind: order
  items:
    - Обнаружить новую речь пользователя
    - Остановить генерацию и воспроизведение текущего ответа
    - Начать обработку новой реплики пользователя
  id: 005-tri-priema-3
  fingerprint: e726d0a7
