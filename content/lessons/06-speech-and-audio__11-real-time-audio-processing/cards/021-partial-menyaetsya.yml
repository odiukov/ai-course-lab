- concept: частичный результат потокового распознавания является пересматриваемой гипотезой
  question: Потоковый ASR сначала вывел «закажи такси», а после получения следующих аудиокадров заменил текст на «закажи такси завтра». Как это следует интерпретировать?
  explanation: Partial строится по доступной на текущий момент части сигнала и может измениться после поступления новых кадров. Только final гарантирует, что соответствующий участок транскрипта больше не будет пересмотрен.
  kind: choice
  options:
    - Это нормальное уточнение частичной гипотезы по новому акустическому контексту
    - Это означает повреждение уже обработанных аудиокадров
    - Это доказывает, что потоковое распознавание работает пакетно
    - Это означает, что первая версия текста была финальной
  correct: 0
  id: 021-partial-menyaetsya-1
  fingerprint: 730065dc
- concept: транскрипт хранится как неизменяемый финальный префикс и заменяемый частичный суффикс
  question: Расположи действия клиента потокового ASR в порядке обработки очередного обновления транскрипта.
  explanation: 'Финальный префикс накапливается и больше не редактируется, а partial не дописывается навсегда: прежняя гипотеза заменяется новой. Иначе интерфейс будет сохранять отвергнутые моделью варианты.'
  kind: order
  items:
    - Принять обновление и разделить новые финальные и частичные фрагменты
    - Добавить новые финальные фрагменты к зафиксированному префиксу
    - Заменить прежний частичный суффикс актуальной гипотезой
  id: 021-partial-menyaetsya-2
  fingerprint: 66136f1f
- concept: необратимые действия запускаются только по финализированным фрагментам ASR
  question: Почему исполнитель команд или генератор ответа не должен запускаться непосредственно по каждому partial-транскрипту?
  explanation: Промежуточный текст полезен для быстрого интерфейса, но не является подтверждённым вводом. Финализация служит границей, после которой фрагмент безопасно использовать для поиска, вызова инструментов, генерации ответа и других действий с побочными эффектами.
  kind: open
  reference: Partial может быть пересмотрен при поступлении нового аудиоконтекста. Запуск внешнего действия по такой гипотезе способен вызвать неверный или повторный побочный эффект, который трудно отменить. Пользователю partial можно показывать, но в обработку команд следует передавать только final.
  id: 021-partial-menyaetsya-3
  fingerprint: c41e409f
