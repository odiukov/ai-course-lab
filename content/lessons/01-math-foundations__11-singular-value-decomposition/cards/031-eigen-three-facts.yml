- concept: квадратичная форма матрицы AᵀA неотрицательна для любого вектора
  question: Какое равенство непосредственно доказывает, что AᵀA положительно полуопределена для любой вещественной матрицы A и любого вектора x?
  explanation: Квадратичная форма xᵀAᵀAx равна скалярному произведению Ax с самим собой, то есть квадрату его нормы. Поэтому она неотрицательна, собственные значения AᵀA неотрицательны, а сингулярные числа вещественны.
  kind: choice
  options:
    - xᵀAᵀAx = ⟨Ax, Ax⟩ ≥ 0
    - xᵀAᵀAx = det(A)
    - xᵀAᵀAx = tr(A)
  correct: 0
  id: 031-eigen-three-facts-1
  fingerprint: 6c6dbf7c
- concept: при образовании AᵀA число обусловленности возводится в квадрат
  question: Число обусловленности матрицы A равно 25. Чему равно число обусловленности AᵀA?
  explanation: 'При переходе к AᵀA число обусловленности возводится в квадрат: 25 × 25 = 625. Из-за этого малые сингулярные числа сильнее страдают от ошибок округления.'
  kind: numeric
  answer: 625
  tolerance: 0.01
  id: 031-eigen-three-facts-2
  fingerprint: 5c87a571
- concept: для симметричной положительно полуопределённой матрицы SVD можно выбрать совпадающим с разложением по собственным векторам
  question: Пусть симметричная положительно полуопределённая матрица имеет разложение A = QΛQᵀ. Как можно выбрать множители её SVD A = UΣVᵀ?
  explanation: У положительно полуопределённой матрицы собственные значения неотрицательны, поэтому они уже подходят на роль сингулярных чисел. Левые и правые сингулярные векторы можно выбрать равными собственным векторам.
  kind: choice
  options:
    - U = Q, Σ = Λ, V = Q
    - U = Q, Σ = −Λ, V = Q
    - U = Λ, Σ = Q, V = Λ
  correct: 0
  id: 031-eigen-three-facts-3
  fingerprint: c30df2f0
