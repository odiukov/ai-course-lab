- concept: центрирование делает направления PCA инвариантными к общему сдвигу всех наблюдений
  question: К каждому объекту набора данных прибавили фиксированный вектор сдвига. Объясните, почему после повторного центрирования главные компоненты PCA не изменятся.
  explanation: PCA после центрирования зависит от взаимного расположения объектов относительно среднего, а не от абсолютного положения всего облака данных.
  kind: open
  reference: Среднее набора сместится на тот же вектор. При вычитании нового среднего этот сдвиг сократится, поэтому центрированная матрица, её ковариация и направления главных компонент останутся прежними.
