- concept: объяснённая дисперсия компоненты PCA равна квадрату соответствующего сингулярного числа, делённому на число степеней свободы
  question: Центрированная матрица содержит 9 наблюдений. Сингулярное число некоторой компоненты равно 12. Чему равна объяснённая дисперсия этой компоненты при использовании выборочной ковариации?
  explanation: Квадрат сингулярного числа делят на число степеней свободы выборочной ковариации. Для девяти наблюдений делитель равен восьми, поэтому квадрат двенадцати даёт объяснённую дисперсию восемнадцать.
  kind: numeric
  answer: 18
  tolerance: 0.001
