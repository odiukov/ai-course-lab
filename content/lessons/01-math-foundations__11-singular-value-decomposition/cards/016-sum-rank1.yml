  fingerprint: bc157ba3
- concept: усечённое SVD сокращает объём хранения за счёт представления матрицы небольшим набором векторов
  question: Почему усечённое SVD может хранить приближение матрицы размера m на n компактнее, чем явное хранение всех её элементов?
  explanation: Полная матрица требует mn значений. Усечённое разложение хранит только k пар сингулярных векторов и соответствующие сингулярные числа, то есть k(m+n)+k значений. При k, существенно меньшем размеров матрицы, это намного компактнее.
  kind: open
  reference: Для каждой из k сохранённых компонент достаточно хранить левый вектор длины m, правый вектор длины n и сингулярное число. Всего требуется k(m+n)+k значений вместо mn, что даёт экономию при малом k.
  id: 016-sum-rank1-2
  fingerprint: 4e59236d
