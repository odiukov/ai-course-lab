- concept: ошибка усечённого SVD в норме Фробениуса равна корню из суммы квадратов отброшенных сингулярных чисел
  question: После усечения SVD ненулевые отброшенные сингулярные числа равны 21 и 20. Чему равна ошибка приближения в норме Фробениуса?
  explanation: Ошибка равна √(21² + 20²) = √841 = 29. В норме Фробениуса вклад вносят все отброшенные сингулярные числа.
  kind: numeric
  answer: 29
  tolerance: 0.001
  id: 019-frobenius-1
  fingerprint: 5c4f1156
- concept: условие совпадения спектральной ошибки и ошибки Фробениуса для усечённого SVD
  question: Когда спектральная ошибка усечённого SVD совпадает с ошибкой в норме Фробениуса?
  explanation: Спектральная ошибка равна наибольшему отброшенному сингулярному числу, а ошибка Фробениуса учитывает квадраты всех отброшенных значений. Они совпадают, если остальные отброшенные значения нулевые.
  kind: choice
  options:
    - Когда исходная матрица квадратная
    - Когда все сохранённые сингулярные числа равны
    - Когда среди отброшенных сингулярных чисел ненулевым является только наибольшее
    - Когда число строк матрицы равно числу её столбцов
  correct: 2
