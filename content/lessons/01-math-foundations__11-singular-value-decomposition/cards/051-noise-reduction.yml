- concept: величина сингулярного числа не определяет смысл компоненты как сигнала или шума
  question: Почему нельзя автоматически объявлять все компоненты с малыми сингулярными числами шумом, а все ведущие компоненты полезным сигналом?
  explanation: Усечение отделяет сильные направления от слабых, а не полезные явления от вредных по их смыслу. Поэтому качество шумоподавления зависит от того, соответствует ли спектральное разделение реальному разделению сигнала и шума.
  kind: open
  reference: SVD ранжирует компоненты по выраженности и согласованности структуры, но не знает их содержательного смысла. Слабый полезный процесс может получить малое сингулярное число и исчезнуть при усечении, а сильная структурированная помеха может попасть в ведущие компоненты и сохраниться.
  id: 051-noise-reduction-2
  fingerprint: aa5bbdd9
