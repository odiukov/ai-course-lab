- concept: скорость убывания сингулярных чисел показывает выраженность низкоранговой структуры
  question: У одной матрицы сингулярные числа резко убывают после нескольких ведущих, а у другой уменьшаются постепенно. Какая матрица лучше допускает приближение малого ранга и почему?
  explanation: Резкий спад сингулярных чисел указывает на выраженную низкоранговую структуру. При медленном спаде для малой ошибки приходится сохранять много компонент.
  kind: open
  reference: 'Первая матрица: несколько ведущих компонент захватывают основную часть матрицы, а отброшенный хвост даёт небольшую ошибку. Постепенное убывание означает, что существенная информация распределена по многим направлениям.'
