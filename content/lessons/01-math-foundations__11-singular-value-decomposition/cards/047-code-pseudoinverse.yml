- concept: булева индексация позволяет не вычислять обратные значения для отброшенных сингулярных чисел
  question: Массив s содержит сингулярные числа, а tol задаёт порог отсечения. Какой фрагмент создаёт массив обратных значений той же формы и не вычисляет reciprocal для элементов, не прошедших порог?
  explanation: Сначала создаётся нулевой массив исходной формы, затем reciprocal вычисляется только для выбранных маской элементов. Поэтому отброшенные сингулярные числа остаются нулевыми и не участвуют в делении.
  kind: choice
  options:
    - |-
      s_inv = np.zeros_like(s)
      mask = s > tol
      s_inv[mask] = np.reciprocal(s[mask])
    - |-
      s_inv = np.reciprocal(s)
      s_inv[s <= tol] = np.zeros_like(s[s <= tol])
    - |-
      mask = s > tol
      s_inv = np.reciprocal(s[mask])
    - |-
      s_inv = np.zeros_like(s)
      mask = s > tol
      s_inv[mask] = s[mask]
  correct: 0
  id: 047-code-pseudoinverse-1
  fingerprint: 4e67212a
- concept: тождество Мура — Пенроуза A A⁺ A = A служит проверкой псевдообратной матрицы
  question: Какое выражение нужно подставить, чтобы проверить одно из тождеств Мура — Пенроуза для вычисленной матрицы A_plus?
  explanation: Для псевдообратной должно выполняться A A⁺ A = A. Используется приближённое сравнение, поскольку SVD и последующие матричные умножения выполняются с конечной точностью.
  kind: cloze
  template: np.allclose(___, A)
  answer: A @ A_plus @ A
  accept:
    - (A @ A_plus) @ A
    - A @ (A_plus @ A)
  id: 047-code-pseudoinverse-2
  fingerprint: 6e20ee08
