- concept: латентные оси LSA не имеют заранее заданных семантических названий
  question: Почему отдельную координатную ось, полученную LSA, нельзя автоматически считать готовой темой с однозначным человеческим названием?
  explanation: SVD выбирает направления, которые описывают структуру матрицы, не получая названий тем. Значение латентной оси приходится выводить из терминов с большими весами, причём однозначная словесная интерпретация возможна не всегда.
  kind: open
  reference: Оси возникают из статистической структуры совместной встречаемости терминов, а не из заранее заданных смысловых меток. Один латентный фактор обычно определяется вкладом многих слов и может смешивать несколько различий, поэтому его смысл интерпретируют по весам терминов лишь после разложения.
  id: 057-vis-lsa-2
  fingerprint: 00dee00d
