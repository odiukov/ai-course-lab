- concept: тройка, построенная из собственной пары AᵀA, удовлетворяет сопряжённому сингулярному равенству
  question: Восстанови второе равенство для сингулярной тройки.
  explanation: Aᵀu = AᵀAv / σ = λv / σ. Поскольку λ = σ², результат равен σv. Значит, построенные u, σ и v согласованы с обоими сингулярными равенствами.
  kind: cloze
  template: Если AᵀAv = λv, σ = √λ и u = Av / σ, то Aᵀu = ___.
  answer: σv
  accept:
    - sigma * v
    - σ * v
    - sqrt(lambda) * v
    - √λv
  id: 035-triple-from-eigen-2
  fingerprint: 25ccaf39
- concept: деление на почти нулевое сингулярное число делает вычисление левого сингулярного вектора численно неустойчивым
  question: Почему при почти нулевом собственном значении λ не следует вычислять u по формуле u = Av / √λ?
  explanation: Теоретически при ненулевом λ формула корректна, но в вычислениях очень маленький знаменатель усиливает накопленные ошибки. Поэтому реализация проверяет собственное значение до вычисления u.
  kind: open
  reference: При малом λ сингулярное число σ = √λ тоже мало. Деление на него многократно усиливает ошибки округления и погрешность в Av, поэтому направление вычисленного u становится ненадёжным. Такую компоненту следует отбросить по численному порогу.
  id: 035-triple-from-eigen-3
  fingerprint: e1d5d117
