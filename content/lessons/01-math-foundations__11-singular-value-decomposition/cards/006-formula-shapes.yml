- concept: ранг матрицы равен числу её ненулевых сингулярных чисел
  question: Как определить ранг матрицы A по диагонали Σ в её сингулярном разложении?
  explanation: Каждое ненулевое сингулярное число соответствует независимому направлению, которое сохраняет преобразование. Поэтому число таких элементов и есть ранг A.
  kind: open
