- concept: число диагональных позиций в Sigma равно меньшей размерности исходной матрицы
  question: У матрицы A есть a строк и b столбцов, причём a < b. Сколько позиций для сингулярных чисел находится на диагонали прямоугольной матрицы Σ?
  explanation: Диагональ прямоугольной матрицы Σ имеет min(a, b) позиций. Поскольку a < b, таких позиций ровно a.
  kind: choice
  options:
    - a
    - b
    - a + b
    - ab
  correct: 0
