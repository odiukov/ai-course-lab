- concept: структура и интерпретация матрицы «термин — документ»
  question: Что означает элемент матрицы «термин — документ», расположенный на пересечении строки некоторого термина и столбца некоторого документа?
  explanation: Строки такой матрицы соответствуют терминам, столбцы — документам, а элементы показывают частоту или взвешенную значимость термина в документе. Именно эту числовую матрицу LSA раскладывает с помощью SVD.
  kind: choice
  options:
    - Смысловую близость термина и документа, заданную вручную
    - Частоту или другой вес этого термина в данном документе
    - Число документов, тематически похожих на данный документ
  correct: 1
  id: 056-lsa-1
  fingerprint: dc760474
- concept: вывод смысловой близости терминов из сходства их распределений по документам
  question: Объясни своими словами, почему LSA может расположить два синонимичных термина близко, даже если они редко встречаются непосредственно рядом.
  explanation: LSA сравнивает не только прямое соседство слов, но и их распределение по всему корпусу. Похожие профили встречаемости получают близкие координаты в латентном пространстве.
  kind: open
  reference: Если термины появляются в похожих наборах документов и в сходных контекстах, строки матрицы «термин — документ» имеют похожие структуры. SVD выделяет общие латентные направления совместной встречаемости, поэтому представления таких терминов оказываются близкими без знания их словарных определений.
  id: 056-lsa-2
  fingerprint: 589e5157
