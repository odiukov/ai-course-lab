- concept: псевдообратная даёт решение задачи наименьших квадратов для несовместимой системы
  question: Система A x = b несовместна. Что гарантировано для вектора x = A⁺b?
  explanation: Когда точного решения нет, псевдообратная даёт вектор, для которого расхождение между Ax и b минимально в смысле метода наименьших квадратов. Нулевая невязка при этом не гарантируется.
  kind: choice
  options:
    - Он минимизирует норму невязки ‖Ax − b‖
    - Он обязательно обращает невязку в ноль
    - Он минимизирует норму матрицы A
    - Он существует только для квадратной матрицы A
  correct: 0
  id: 045-pseudoinverse-idea-1
  fingerprint: 44c9d782
- concept: построение псевдообратной матрицы по SVD
  question: Расположите действия для вычисления A⁺ по разложению A = UΣVᵀ в правильном порядке.
  explanation: 'Псевдообратная строится по формуле A⁺ = VΣ⁺Uᵀ. В Σ⁺ обращаются только ненулевые сингулярные числа: делить на нулевые значения нельзя.'
  kind: order
  items:
    - Транспонировать Σ, поменяв местами её строки и столбцы
    - Заменить каждое ненулевое сингулярное число на обратное ему
    - Оставить нулевые диагональные элементы нулевыми и получить Σ⁺
    - Вычислить произведение VΣ⁺Uᵀ
  id: 045-pseudoinverse-idea-2
  fingerprint: 5b1af306
- concept: размерности исходной и псевдообратной матриц меняются местами
  question: Заполните пропуск в утверждении о размерности псевдообратной матрицы.
  explanation: 'Псевдообратная меняет направление отображения: для матрицы размера p × q матрица A⁺ имеет размер q × p, поэтому произведение A⁺b имеет размерность пространства неизвестных.'
  kind: cloze
  template: Если A имеет размер p × q, то A⁺ имеет размер ___.
  answer: q × p
  accept:
    - q×p
    - q x p
    - q на p
  id: 045-pseudoinverse-idea-3
  fingerprint: d54e5818
