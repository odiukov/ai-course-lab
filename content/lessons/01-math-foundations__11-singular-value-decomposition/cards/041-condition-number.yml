- concept: малое минимальное сингулярное число повышает чувствительность решения обратной задачи к возмущениям
  question: У двух невырожденных матриц одинаковое максимальное сингулярное число, но у матрицы B минимальное сингулярное число гораздо меньше. Решение какой системы чувствительнее к малым ошибкам в данных?
  explanation: При одинаковом максимальном сингулярном числе уменьшение минимального увеличивает их отношение. Поэтому обратное преобразование матрицы B сильнее усиливает ошибки в слабом сингулярном направлении.
  kind: choice
  options:
    - Обеих одинаково, поскольку их максимальные сингулярные числа совпадают
    - Системы с матрицей A, поскольку большее минимальное сингулярное число усиливает ошибки
    - Системы с матрицей B, поскольку у неё больше число обусловленности
