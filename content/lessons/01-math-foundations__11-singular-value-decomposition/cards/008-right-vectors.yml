- concept: координаты вектора в базисе правых сингулярных векторов находятся скалярными произведениями
  question: Восстановите формулу для коэффициента разложения входного вектора по ортонормированному базису правых сингулярных векторов.
  explanation: Поскольку правые сингулярные векторы ортонормированы, скалярное произведение v_kᵀx обнуляет вклады остальных базисных направлений и оставляет коэффициент c_k.
  kind: cloze
  template: Если x = Σ_k c_k v_k, то c_k = ___.
  answer: v_kᵀx
  accept:
    - v_k^T x
    - <v_k, x>
    - v_k · x
