- concept: точная дефляция обнуляет уже найденное сингулярное направление в остатке
  question: Пусть (σ, u, v) — точная сингулярная тройка матрицы A, причём v имеет единичную длину. Чему равно произведение (A − σuvᵀ)v?
  explanation: Поскольку Av = σu и vᵀv = 1, получаем (A − σuvᵀ)v = σu − σu = 0. Поэтому найденное направление больше не может стать главным направлением остатка.
  kind: choice
  options:
    - Нулевому вектору
    - σu
    - Av + σu
    - σv
  correct: 0
  id: 037-deflation-1
  fingerprint: 8eaa3bcf
- concept: остаток при дефляции равен исходной матрице без суммы уже извлечённых сингулярных слоёв
  question: Заполни формулу остатка после удаления сингулярных компонент с индексами из множества J.
  explanation: Каждая сингулярная компонента представлена матрицей σ_j u_j v_jᵀ. Последовательное вычитание таких слоёв оставляет в R только ещё не извлечённые компоненты.
  kind: cloze
  template: R = A − ___
  answer: ∑_{j∈J} σ_j u_j v_jᵀ
  accept:
    - sum_{j in J} sigma_j u_j v_j^T
    - Σ_{j∈J} σ_j u_j v_jᵀ
  id: 037-deflation-2
  fingerprint: 8ec94d5b
- concept: порядок вычислений в одной итерации SVD с дефляцией
  question: Расположи операции одной итерации дефляционного алгоритма в правильном порядке.
  explanation: Сначала главное направление ищут у текущего остатка. Из найденной собственной пары строят сингулярную тройку, а затем вычитают соответствующий слой, чтобы следующая итерация искала сильнейшую из оставшихся компонент.
  kind: order
  items:
    - Сформировать грамову матрицу G = RᵀR для текущего остатка R
    - Степенным методом найти главную собственную пару (λ, v) матрицы G
    - Вычислить σ = √λ и u = Rv / σ
    - 'Обновить остаток: R ← R − σuvᵀ'
  id: 037-deflation-3
  fingerprint: 5b1fc94b
