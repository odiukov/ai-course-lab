- concept: реконструкция матрицы при возврате правых сингулярных векторов столбцами матрицы V
  question: Функция SVD возвращает U, одномерный массив S и матрицу V, в столбцах которой находятся правые сингулярные векторы. Заполни пропуск в формуле реконструкции.
  explanation: Разложение имеет вид A = UΣVᵀ. Поскольку функция возвращает именно V, при реконструкции его необходимо транспонировать.
  kind: cloze
  template: A_reconstructed = U @ np.diag(S) @ ___
  answer: V.T
  accept:
    - V.transpose()
    - np.transpose(V)
  id: 038-code-svd-1
  fingerprint: 72862de7
- concept: фактическое число возвращённых компонент может быть меньше запрошенного из-за досрочной остановки
  question: Функции SVD передали желаемое число компонент k, но численный ранг матрицы оказался меньше. Какое соотношение размеров результата должно выполняться после досрочной остановки?
  explanation: Если собственное значение остатка меньше порога 1e-10, цикл завершается без добавления новой тройки. Поэтому согласованная ширина U и V и длина S равны числу уже найденных компонент, которое может быть меньше k.
  kind: choice
  options:
    - Число столбцов U, длина S и число столбцов V равны числу фактически найденных компонент и могут быть меньше k
    - U и V обязаны иметь ровно k столбцов, а недостающие столбцы заполняются случайными векторами
    - S обязана иметь длину k, поэтому недостающие сингулярные числа заменяются единицами
    - Досрочная остановка допустима только после возврата результата, поэтому размеры всегда определяются исключительно k
