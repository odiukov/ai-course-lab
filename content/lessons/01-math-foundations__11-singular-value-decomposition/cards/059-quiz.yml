- concept: структура разложения матрицы в SVD
  question: Заполни формулу сингулярного разложения матрицы A.
  explanation: 'В SVD матрица представляется как A = UΣVᵀ: V задаёт правые сингулярные векторы, Σ содержит сингулярные числа, а U — левые сингулярные векторы.'
  kind: cloze
  template: A = ___
  answer: UΣVᵀ
  accept:
    - U Sigma V^T
    - UΣV^T
    - U · Σ · Vᵀ
  id: 059-quiz-1
  fingerprint: 0752cf74
- concept: сингулярные числа в стандартной записи SVD упорядочены по убыванию
  question: Почему при усечённом SVD выражение top-k означает сохранение первых k сингулярных компонент?
  explanation: Сингулярные числа записывают по убыванию, поэтому первые k компонент обладают наибольшими масштабами. Остальные компоненты не обязаны быть нулевыми — при усечении их просто отбрасывают.
  kind: choice
  options:
    - Сингулярные числа стандартно упорядочивают от наибольшего к наименьшему
    - Первые k столбцов U всегда совпадают со стандартными базисными векторами
    - Все компоненты после k обязательно имеют нулевые сингулярные числа
    - Столбцы V стандартно упорядочивают по числу ненулевых координат
  correct: 0
