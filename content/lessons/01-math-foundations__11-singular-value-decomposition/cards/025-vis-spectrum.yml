- concept: логарифмическая шкала отображает одинаковые отношения сингулярных чисел одинаковыми интервалами
  question: Как интерпретируется одинаковый вертикальный интервал между точками спектра на логарифмической шкале?
  explanation: Разность log(σ_i) − log(σ_j) равна log(σ_i/σ_j), поэтому расстояние на логарифмической шкале определяется отношением сингулярных чисел. Это позволяет различать даже очень малые значения в хвосте спектра.
  kind: cloze
  template: На логарифмической вертикальной шкале одинаковый интервал означает одинаковое ___ значений, а не одинаковую разность.
