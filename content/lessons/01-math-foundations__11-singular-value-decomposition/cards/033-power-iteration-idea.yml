- concept: нормировка в степенном методе сохраняет направление вектора и контролирует его масштаб
  question: Что обычно произойдёт, если в степенном методе умножать вектор на матрицу, но не нормировать после каждой итерации?
  explanation: Нормировка не меняет направление вектора и потому не мешает сходимости. Она удерживает длину вектора в разумном диапазоне, предотвращая переполнение или затухание чисел.
  kind: choice
  options:
    - Направление может сходиться к главному собственному вектору, но норма способна вызвать переполнение или потерю точности
    - Метод перестанет усиливать компоненту вдоль главного собственного вектора
    - Вектор после первого умножения обязательно станет ортогонален своему начальному направлению
  correct: 0
  id: 033-power-iteration-idea-1
  fingerprint: d95709de
- concept: собственное значение после сходимости степенного метода вычисляется отношением Рэлея
  question: Вектор v имеет единичную длину и уже сошёлся к собственному направлению матрицы M. Чем заполнить пропуск, чтобы получить соответствующее собственное значение?
  explanation: Для нормированного собственного вектора выполняется Mv = λv, поэтому vᵀMv = λvᵀv = λ. До полной сходимости это выражение служит оценкой собственного значения.
  kind: cloze
  template: eigenvalue = ___
  answer: v @ M @ v
  accept:
    - v.T @ M @ v
    - v.T.dot(M).dot(v)
  id: 033-power-iteration-idea-2
  fingerprint: ac2b28c7
- concept: для сходимости к главному собственному вектору начальный вектор должен иметь ненулевую компоненту вдоль него
  question: Начальный вектор степенного метода точно ортогонален главному собственному вектору симметричной матрицы. Появится ли главное направление при последующих умножениях в точной арифметике?
  explanation: Умножение масштабирует уже имеющиеся собственные компоненты, но не создаёт отсутствующие. Случайная инициализация используется потому, что точная ортогональность главному направлению крайне маловероятна.
  kind: choice
  options:
    - Нет, его нулевая компонента останется нулевой, и метод выделит сильнейшее из присутствующих направлений
    - Да, умножение на матрицу обязательно добавит компоненту главного направления
    - Да, эту компоненту создаст нормировка вектора
  correct: 0
  id: 033-power-iteration-idea-3
  fingerprint: 4ab35cfd
