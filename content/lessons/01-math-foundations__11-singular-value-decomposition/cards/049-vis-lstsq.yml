- concept: ортогональность остатка пространству столбцов в решении наименьших квадратов
  question: Заполни геометрическое условие оптимальности решения задачи наименьших квадратов.
  explanation: 'Ортогональность остатка всем столбцам A выражается нормальным уравнением: транспонированная A, умноженная на остаток, даёт нулевой вектор. Поэтому небольшое изменение параметров не может дополнительно уменьшить сумму квадратов ошибок.'
  kind: cloze
  template: Для оптимального x остаток b − Ax ортогонален ___.
  answer: пространству столбцов матрицы A
  accept:
    - столбцам A
    - образу A
    - пространству столбцов A
