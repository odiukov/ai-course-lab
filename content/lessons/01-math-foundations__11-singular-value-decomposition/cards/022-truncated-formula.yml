- concept: согласованное извлечение блоков для построения усечённого SVD
  question: Пусть A = UΣVᵀ, а q — число сохраняемых сингулярных направлений. Какие части множителей нужно перемножить, чтобы получить усечённое приближение A_q?
  explanation: 'Сохраняются согласованные сингулярные тройки: U_q содержит соответствующие левые векторы, Σ_q — их сингулярные числа, а V_q — правые векторы. Поэтому A_q = U_qΣ_qV_qᵀ.'
  kind: choice
  options:
    - Первые q столбцов U, левый верхний блок Σ размера q×q и транспонированные первые q столбцов V
    - Первые q строк U, левый верхний блок Σ размера q×q и первые q столбцов V без транспонирования
    - Первые q столбцов U, всю матрицу Σ и первые q строки V
    - Первые q строк U, последние q диагональных элементов Σ и транспонированные первые q строки V
  correct: 0
  id: 022-truncated-formula-1
  fingerprint: 16c39668
- concept: усечение SVD уменьшает ранг матрицы, но не изменяет её внешние размеры
  question: Матрица B имеет форму r×s. Объясните, почему приближение B_t, построенное по t ведущим сингулярным направлениям, также имеет форму r×s, хотя его ранг ограничен величиной t.
  explanation: Низкоранговое приближение заменяет внутреннюю структуру матрицы, а не пространство её входов и выходов. Произведение (r×t)(t×t)(t×s) возвращает матрицу формы r×s, но её ранг не может превышать t.
  kind: open
  reference: Усечённые множители имеют формы r×t, t×t и t×s. Их произведение поэтому имеет форму r×s. При этом оно составлено не более чем из t независимых сингулярных компонент, так что его ранг не превосходит t.
  id: 022-truncated-formula-2
  fingerprint: 9a94a4a1
