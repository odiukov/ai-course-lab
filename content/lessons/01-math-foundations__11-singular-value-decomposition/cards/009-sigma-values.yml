- concept: образ правого сингулярного вектора направлен вдоль соответствующего левого сингулярного вектора
  question: Пусть vᵢ — правый сингулярный вектор матрицы A, uᵢ — соответствующий левый сингулярный вектор, а σᵢ — соответствующее сингулярное число. Чему равно Avᵢ?
  explanation: 'Для каждой сингулярной тройки выполняется Avᵢ = σᵢuᵢ: матрица переводит правый сингулярный вектор в направление соответствующего левого вектора и масштабирует его на σᵢ.'
  kind: choice
  options:
    - uᵢ
    - σᵢvᵢ
    - Auᵢ
    - σᵢuᵢ
  correct: 3
  id: 009-sigma-values-1
  fingerprint: f29445d7
- concept: направление с нулевым сингулярным числом принадлежит ядру матрицы и теряется при преобразовании
  question: Почему компоненту входного вектора вдоль правого сингулярного вектора с нулевым сингулярным числом невозможно восстановить по результату умножения на матрицу?
  explanation: Нулевое сингулярное число означает полное схлопывание соответствующего направления. Разные входы, отличающиеся компонентой вдоль vᵢ, получают один и тот же образ, поэтому преобразование необратимо на этом направлении.
  kind: open
  reference: 'Если σᵢ равно нулю, то Avᵢ = σᵢuᵢ = 0. Поэтому добавление к входу любой компоненты вдоль vᵢ не меняет результат: A(v + cvᵢ) = Av. По выходу нельзя определить, какой была потерянная компонента.'
  id: 009-sigma-values-2
  fingerprint: bba61b22
