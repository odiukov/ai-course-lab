- concept: ошибка реконструкции шумного наблюдения не подходит для выбора ранга шумоподавления
  question: Почему нельзя выбирать ранг SVD для шумоподавления, просто минимизируя ошибку реконструкции относительно самой шумной матрицы?
  explanation: Полное число компонент почти точно восстанавливает шумное наблюдение, но это не означает близость к чистой матрице. Для выбора ранга нужен спектральный критерий или независимая проверка качества очистки.
  kind: open
  reference: При увеличении ранга реконструкция всё точнее повторяет наблюдаемую матрицу вместе с её шумом. Такой критерий предпочитает сохранить как можно больше компонент и не измеряет качество восстановления чистого сигнала.
  id: 053-check-noise-2
  fingerprint: e3efd09b
