- concept: собственный вектор определяет направление с точностью до знака
  question: Повторный запуск степенного метода для той же матрицы вернул прежнее собственное значение, но вместо вектора v получился −v. Как интерпретировать результат?
  explanation: Если Mv = λv, то M(−v) = λ(−v). Поэтому смена знака не меняет собственного направления или соответствующего собственного значения.
  kind: choice
  options:
    - 'Один из запусков ошибочен: знаки координат собственного вектора должны быть фиксированы'
    - Метод не сошёлся, поскольку результаты обязаны совпадать покоординатно
    - Оба вектора верны и задают одно собственное направление
  correct: 2
  id: 034-code-power-iteration-1
  fingerprint: '46430117'
- concept: скорость степенного метода зависит от разрыва между ведущим и следующим собственными значениями
  question: Почему степенной метод может сходиться медленно, если модуль ведущего собственного значения лишь немного больше модуля следующего?
  explanation: В собственном базисе каждая компонента умножается на своё собственное значение. Чем ближе по модулю следующее значение к ведущему, тем больше итераций нужно, чтобы ведущее направление стало заметно преобладать.
  kind: open
  reference: При каждом умножении относительная доля следующего собственного направления уменьшается во столько раз, каково отношение его собственного значения к ведущему. Если это отношение близко к единице, посторонняя компонента затухает медленно.
  id: 034-code-power-iteration-2
  fingerprint: ae704214
- concept: нулевой результат умножения нельзя нормировать в степенном методе
  question: Что произойдёт в наивной реализации power_iteration, если выражение M @ v даст нулевой вектор, и как следует обработать такой случай?
  explanation: Строка v = Mv / np.linalg.norm(Mv) предполагает ненулевую норму. Явная проверка защищает реализацию от деления на ноль, например для нулевой матрицы или попадания в её ядро.
  kind: open
  reference: Норма результата тоже будет нулевой, поэтому деление при нормировке не определено и приведёт к некорректным значениям. Перед делением нужно проверить норму и завершить алгоритм, сообщив о нулевом собственном значении или невозможности продолжить.
  id: 034-code-power-iteration-3
  fingerprint: 1b846008
