- concept: сингулярные числа неотрицательны, поскольку выражают величины растяжения
  question: Объясните своими словами, почему отрицательное сингулярное число не требуется даже для преобразования, которое меняет ориентацию пространства.
  explanation: 'Знак не нужен для описания длины: масштаб оси всегда неотрицателен. Повороты и отражения входят в ортогональные множители U и V.'
  kind: open
  reference: Сингулярное число описывает только неотрицательную величину растяжения, то есть длину оси. Отражения и другие изменения ориентации кодируются ортогональными матрицами U и V, а не знаком сингулярного числа.
