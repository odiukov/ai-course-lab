- concept: сжатие через SVD выгодно только ниже порогового ранга
  question: Чёрно-белое изображение задано матрицей размером 512×384. Для приближения ранга k сохраняют по k коэффициентов для каждой строки, каждой колонки и ещё по одному сингулярному числу на компоненту. Каков максимальный целый ранг k, при котором такое представление содержит меньше чисел, чем исходная матрица?
  explanation: Каждая компонента требует 512 + 384 коэффициента и один сингулярный скаляр, то есть 897 чисел. Исходная матрица содержит 196608 чисел. Неравенство 897k < 196608 выполняется максимум при k = 219; при k = 220 потребуется уже 197340 чисел.
  kind: numeric
  answer: 219
  tolerance: 0.4
  id: 027-image-compression-1
  fingerprint: 939bd095
- concept: при усечении SVD естественного изображения мелкие детали обычно теряются раньше общей структуры
  question: У естественного изображения сингулярные числа быстро убывают. Что обычно происходит при умеренном уменьшении ранга его SVD-приближения?
  explanation: Ведущие сингулярные компоненты обычно описывают крупные формы и плавные изменения яркости. Компоненты с меньшими сингулярными числами чаще отвечают за тонкие детали и шум, поэтому при усечении они пропадают раньше.
  kind: choice
  options:
    - Изображение обязательно меняет свои высоту и ширину
    - Сначала полностью исчезают крупные формы и плавные градиенты
    - Все пиксели становятся одинаково яркими
    - В первую очередь сглаживаются мелкие текстуры и шум, а общая структура сохраняется
  correct: 3
  id: 027-image-compression-2
