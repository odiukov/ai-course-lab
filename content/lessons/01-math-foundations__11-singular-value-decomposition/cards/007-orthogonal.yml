- concept: ортогональное преобразование сохраняет скалярные произведения
  question: Пусть Q — ортогональная матрица, а x и y — векторы. Чему равно скалярное произведение (Qx)ᵀ(Qy)?
  explanation: (Qx)ᵀ(Qy) = xᵀQᵀQy = xᵀIy = xᵀy. Поэтому ортогональное преобразование сохраняет скалярные произведения, а вместе с ними длины и углы.
  kind: choice
  options:
    - xᵀy
    - −xᵀy
    - xᵀQy
    - (xᵀy)²
  correct: 0
  id: 007-orthogonal-1
  fingerprint: 7fd3ba2a
- concept: обратная ортогональная матрица равна её транспонированной матрице
  question: Заполни пропуск в формуле для обратной ортогональной матрицы Q.
  explanation: 'Из условия QᵀQ = I следует, что умножение на Qᵀ отменяет умножение на Q. Значит, Qᵀ является обратной матрицей: Q⁻¹ = Qᵀ.'
  kind: cloze
  template: Q⁻¹ = ___
  answer: Qᵀ
  accept:
    - Q^T
    - Qᵀ
    - transpose(Q)
  id: 007-orthogonal-2
