- concept: обычное SVD требует заполненной числовой матрицы, а методы матричной факторизации могут обучаться только по наблюдаемым оценкам
  question: Почему обычное SVD нельзя напрямую применить к матрице с пропущенными оценками и как это ограничение обходят практические рекомендательные алгоритмы?
  explanation: Знак пропуска не является числом и не задаёт оценку. Поэтому вместо разложения неполной матрицы практические методы оптимизируют пользовательские и объектные факторы только на наблюдаемых клетках.
  kind: open
  reference: Обычное SVD определено для матрицы, каждый элемент которой является числом, поэтому неизвестные оценки нельзя передать ему как пропуски. Практические методы факторизации, например Funk SVD или ALS, подбирают латентные профили по известным оценкам, исключая ненаблюдаемые клетки из функции ошибки.
