- concept: элемент внешнего произведения равен произведению соответствующих координат двух векторов
  question: Заполни пропуск в формуле для элемента внешнего произведения векторов.
  explanation: Внешнее произведение умножает каждый элемент столбца u на каждый элемент строки v^T. Поэтому элемент в строке i и столбце j равен u_i v_j.
  kind: cloze
  template: (u v^T)_{ij} = ___
  answer: u_i v_j
  accept:
    - v_j u_i
    - u[i] * v[j]
  id: 014-outer-product-1
  fingerprint: 193ece09
- concept: ненулевое внешнее произведение имеет единичный ранг, потому что все его столбцы коллинеарны
  question: Объясни своими словами, почему внешнее произведение двух ненулевых векторов u v^T имеет единичный ранг.
  explanation: 'Столбец с индексом j имеет вид v_j u. Все столбцы являются скалярными кратными одного вектора u, поэтому независимое направление только одно. Условие ненулевости важно: если один из векторов нулевой, получится нулевая матрица.'
  kind: open
  reference: Каждый столбец матрицы u v^T равен вектору u, умноженному на соответствующую координату v. Поэтому все столбцы лежат на одной прямой и линейное пространство столбцов имеет единичную размерность. Поскольку оба вектора ненулевые, матрица не нулевая.
  id: 014-outer-product-2
  fingerprint: b0d6831e
