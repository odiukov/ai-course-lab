- concept: собственные значения AᵀA равны квадратам сингулярных чисел A
  question: Восстановите связь между собственным значением AᵀA и соответствующим сингулярным числом A.
  explanation: Диагональные элементы ΣᵀΣ имеют вид σ·σ. Поэтому соответствующее собственное значение удовлетворяет равенству λ = σ·σ, откуда σ = √λ.
  kind: cloze
  template: Если λ — собственное значение AᵀA, то соответствующее сингулярное число σ равно ___.
  answer: √λ
  accept:
    - sqrt(λ)
    - \sqrt{\lambda}
    - корень из λ
  id: 030-eigen-link-2
  fingerprint: b412b791
