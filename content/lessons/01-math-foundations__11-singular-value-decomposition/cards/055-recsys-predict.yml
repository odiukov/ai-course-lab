- concept: симметричное включение сингулярных значений в латентные профили
  question: Заполни пропуск в формуле латентных профилей.
  explanation: Произведение P Qᵀ содержит два множителя √Σ, которые вместе дают Σ. Поэтому P Qᵀ = UΣVᵀ, а элементы реконструкции вычисляются как скалярные произведения строк P и Q.
  kind: cloze
  template: Чтобы поровну распределить веса в разложении UΣVᵀ между профилями, можно взять P = U√Σ и Q = V ___.
  answer: √Σ
  accept:
    - sqrt(Σ)
    - квадратный корень из Σ
  id: 055-recsys-predict-1
  fingerprint: 040685cf
- concept: чередование условных задач наименьших квадратов в ALS
  question: Расположи действия итерации ALS, начинающейся с обновления профилей пользователей, в правильном порядке.
  explanation: ALS оптимизирует один блок переменных при фиксированном другом. После обновления пользователей их профили фиксируют и обновляют объекты; чередование продолжают до выполнения критерия остановки.
  kind: order
  items:
    - Зафиксировать профили объектов и решить задачи наименьших квадратов для профилей пользователей
    - Зафиксировать обновлённые профили пользователей и решить задачи наименьших квадратов для профилей объектов
    - Проверить критерий остановки и при необходимости начать следующее чередование
  id: 055-recsys-predict-2
  fingerprint: 7956ef0c
- concept: локальное обновление профилей в Funk SVD по ошибке наблюдаемой оценки
  question: Объясни своими словами, как Funk SVD использует одну известную оценку для корректировки латентных профилей.
  explanation: Обновление определяется остатком между наблюдаемой оценкой и текущим предсказанием. Оно затрагивает профили выбранных пользователя и объекта, постепенно уменьшая ошибку на известных данных.
  kind: open
  reference: Метод вычисляет предсказание как скалярное произведение профилей пользователя и объекта, находит разность между известной и предсказанной оценками и немного изменяет соответствующие профили так, чтобы уменьшить эту ошибку.
  id: 055-recsys-predict-3
  fingerprint: 5b07a0ca
