<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три уравнения, две неизвестные — компромисс</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5f6b7c;
      --axis: #334155;
      --grid: #dbe3ec;
      --fit: #2563eb;
      --fit-halo: #dbeafe;
      --point: #172033;
      --point-core: #ffffff;
      --residual: #dc4c3e;
      --residual-soft: #fee2e2;
      --border: #cbd5e1;
      --line-thin: 1.5;
      --line-normal: 2.5;
      --line-strong: 4;
      --line-halo: 9;
      --font-title: 23px;
      --font-subtitle: 14px;
      --font-label: 14px;
      --font-small: 13px;
      --font-symbol: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--background);
      color: var(--ink);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .diagram {
      width: 100%;
      max-width: 620px;
      margin: 0;
      overflow: hidden;
      background: var(--panel);
      border: var(--line-thin) solid var(--border);
    }

    .diagram__header {
      padding: 14px 18px 10px;
      border-bottom: var(--line-thin) solid var(--border);
    }

    .diagram__title {
      margin: 0;
      font-size: var(--font-title);
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .diagram__subtitle {
      margin: 6px 0 0;
      max-width: 570px;
      color: var(--muted);
      font-size: var(--font-subtitle);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--panel);
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: var(--line-thin);
      vector-effect: non-scaling-stroke;
    }

    .axis-line,
    .tick-mark {
      stroke: var(--axis);
      stroke-width: var(--line-normal);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .fit-halo {
      fill: none;
      stroke: var(--fit-halo);
      stroke-width: var(--line-halo);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .fit-line {
      fill: none;
      stroke: var(--fit);
      stroke-width: var(--line-strong);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      fill: none;
      stroke: var(--fit);
      stroke-width: var(--line-thin);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .residual-halo {
      fill: none;
      stroke: var(--residual-soft);
      stroke-width: var(--line-halo);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .residual-line,
    .residual-cap {
      fill: none;
      stroke: var(--residual);
      stroke-width: var(--line-normal);
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .point-ring {
      fill: var(--panel);
      stroke: var(--point);
      stroke-width: var(--line-strong);
      vector-effect: non-scaling-stroke;
    }

    .point-core {
      fill: var(--point);
    }

    text {
      fill: var(--ink);
      font-size: var(--font-label);
      text-rendering: geometricPrecision;
    }

    .tick-label,
    .axis-label {
      fill: var(--muted);
      font-size: var(--font-small);
    }

    .point-label {
      font-size: var(--font-label);
      font-weight: 650;
    }

    .residual-label {
      fill: var(--residual);
      font-size: var(--font-symbol);
      font-weight: 750;
    }

    .fit-label {
      fill: var(--fit);
      font-size: var(--font-label);
      font-weight: 700;
    }

    .legend-label {
      fill: var(--muted);
      font-size: var(--font-small);
    }

    .legend-emphasis {
      fill: var(--residual);
      font-size: var(--font-small);
      font-weight: 700;
    }

    .fallback {
      margin: 0;
      padding: 26px 20px;
      color: var(--ink);
      background: var(--panel);
      font-size: var(--font-label);
    }

    [hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0b1120;
        --panel: #111827;
        --ink: #e8edf5;
        --muted: #aab6c7;
        --axis: #cbd5e1;
        --grid: #334155;
        --fit: #60a5fa;
        --fit-halo: #1e3a5f;
        --point: #f1f5f9;
        --point-core: #111827;
        --residual: #fb7185;
        --residual-soft: #4c1d2c;
        --border: #475569;
      }
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title diagram-subtitle">
    <figcaption class="diagram__header">
      <h1 class="diagram__title" id="diagram-title">
        Три уравнения, две неизвестные — компромисс
      </h1>
      <p class="diagram__subtitle" id="diagram-subtitle">
        Прямая выбирается так, чтобы совокупный размер вертикальных остатков
        был минимален.
      </p>
    </figcaption>

    <svg
      id="plot"
      viewBox="0 0 620 420"
      width="620"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">
        Точки и прямая наименьших квадратов
      </title>
      <desc id="svg-description">
        На плоскости отмечены точки один, три; два, пять; три, шесть.
        От точек до прямой наименьших квадратов проведены подписанные
        вертикальные остатки.
      </desc>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать точки (1, 3), (2, 5), (3, 6), прямую
      наименьших квадратов и вертикальные остатки r₁, r₂, r₃.
    </p>

    <noscript>
      <p class="fallback">
        Схема: точки (1, 3), (2, 5), (3, 6), прямая наименьших квадратов
        и вертикальные остатки между точками и прямой.
      </p>
    </noscript>
  </figure>

  <script>
    /*
      Все видимые координаты описаны в математической системе данных.
      Даже засечки, выносная линия и концы коротких отметок проходят
      через единственное преобразование sx/sy.
    */
    const data = Object.freeze({
      points: Object.freeze([
        Object.freeze({
          x: 1, y: 3, name: "(1, 3)", residual: "r₁",
          pointDx: -12, pointDy: 17, pointAnchor: "end",
          residualDx: 12, residualDy: 5, residualAnchor: "start"
        }),
        Object.freeze({
          x: 2, y: 5, name: "(2, 5)", residual: "r₂",
          pointDx: 12, pointDy: -13, pointAnchor: "start",
          residualDx: -12, residualDy: 5, residualAnchor: "end"
        }),
        Object.freeze({
          x: 3, y: 6, name: "(3, 6)", residual: "r₃",
          pointDx: -12, pointDy: -13, pointAnchor: "end",
          residualDx: 12, residualDy: 17, residualAnchor: "start"
        })
      ]),
      axes: Object.freeze({
        xMin: -0.28,
        xMax: 3.48,
        yMin: -0.22,
        yMax: 6.35,
        xTicks: Object.freeze([1, 2, 3]),
        yTicks: Object.freeze([3, 5, 6]),
        tickHalf: 0.07,
        xTickLabelY: -0.38,
        yTickLabelX: -0.22,
        xLabelX: 3.46,
        xLabelY: -0.7,
        yLabelX: 0.12,
        yLabelY: 6.24
      }),
      regression: Object.freeze({
        xStart: 0.58,
        xEnd: 3.18,
        labelX: 3.68,
        firstLabelY: 5.94,
        secondLabelY: 5.56,
        leaderStartX: 3.58,
        leaderStartY: 5.42,
        leaderEndX: 2.82,
        capHalf: 0.075
      }),
      legend: Object.freeze({
        sampleX: 3.8,
        sampleTopY: 2.05,
        sampleBottomY: 1.45,
        textX: 4.02,
        firstTextY: 1.96,
        secondTextY: 1.56,
        capHalf: 0.075
      }),
      dot: Object.freeze({
        outerRadius: 0.105,
        innerRadius: 0.035
      }),
      labels: Object.freeze({
        padding: 12,
        lineWidth: 3,
        fontSize: 14
      })
    });

    const origin = Object.freeze({ x: 110, y: 380 });
    const scale = 58;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    try {
      const svg = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (tag, attributes = {}) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        return element;
      };

      const group = (className, label) => {
        const element = node("g", {
          class: className,
          "aria-label": label
        });
        svg.appendChild(element);
        return element;
      };

      const addLine = (
        parent,
        x1,
        y1,
        x2,
        y2,
        className
      ) => {
        const element = node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });
        parent.appendChild(element);
        return element;
      };

      const addText = (
        parent,
        x,
        y,
        value,
        className,
        anchor,
        dx,
        dy
      ) => {
        const element = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          dx,
          dy
        });
        element.textContent = value;
        parent.appendChild(element);
        return element;
      };

      const radiusFromScale = (logicalRadius) =>
        Math.abs(sx(logicalRadius) - sx(data.axes.xMin + -data.axes.xMin));

      /*
        Коэффициенты прямой не записаны заранее: они вычисляются из трёх
        заданных точек обычной формулой наименьших квадратов.
      */
      const count = data.points.length;
      const sumX = data.points.map((point) => point.x)
        .reduce((left, right) => left + right);
      const sumY = data.points.map((point) => point.y)
        .reduce((left, right) => left + right);
      const meanX = sumX / count;
      const meanY = sumY / count;
      const centeredProducts = data.points
        .map((point) => (point.x - meanX) * (point.y - meanY))
        .reduce((left, right) => left + right);
      const centeredSquares = data.points
        .map((point) => (point.x - meanX) * (point.x - meanX))
        .reduce((left, right) => left + right);
      const slope = centeredProducts / centeredSquares;
      const intercept = meanY - slope * meanX;
      const fittedY = (x) => slope * x + intercept;

      const gridLayer = group("grid", "Вспомогательная сетка");

      data.axes.xTicks.forEach((x) => {
        addLine(
          gridLayer,
          x,
          data.axes.yMin + -data.axes.yMin,
          x,
          data.axes.yMax,
          "grid-line"
        );
      });

      data.axes.yTicks.forEach((y) => {
        addLine(
          gridLayer,
          data.axes.xMin + -data.axes.xMin,
          y,
          data.axes.xMax,
          y,
          "grid-line"
        );
      });

      const axisLayer = group("axes", "Координатные оси");

      addLine(
        axisLayer,
        data.axes.xMin,
        data.axes.yMin + -data.axes.yMin,
        data.axes.xMax,
        data.axes.yMin + -data.axes.yMin,
        "axis-line"
      );
      addLine(
        axisLayer,
        data.axes.xMin + -data.axes.xMin,
        data.axes.yMin,
        data.axes.xMin + -data.axes.xMin,
        data.axes.yMax,
        "axis-line"
      );

      data.axes.xTicks.forEach((x) => {
        addLine(
          axisLayer,
          x,
          -data.axes.tickHalf,
          x,
          data.axes.tickHalf,
          "tick-mark"
        );
        addText(
          axisLayer,
          x,
          data.axes.xTickLabelY,
          String(x),
          "tick-label",
          "middle",
          data.labels.padding + -data.labels.padding,
          data.labels.padding + -data.labels.padding
        );
      });

      data.axes.yTicks.forEach((y) => {
        addLine(
          axisLayer,
          -data.axes.tickHalf,
          y,
          data.axes.tickHalf,
          y,
          "tick-mark"
        );
        addText(
          axisLayer,
          data.axes.yTickLabelX,
          y,
          String(y),
          "tick-label",
          "end",
          -data.labels.padding / data.labels.lineWidth,
          data.labels.fontSize / data.labels.fontSize
        );
      });

      addText(
        axisLayer,
        data.axes.xLabelX,
        data.axes.xLabelY,
        "номер измерения x",
        "axis-label",
        "end",
        data.labels.padding + -data.labels.padding,
        data.labels.padding + -data.labels.padding
      );
      addText(
        axisLayer,
        data.axes.yLabelX,
        data.axes.yLabelY,
        "измеренное значение y",
        "axis-label",
        "start",
        data.labels.padding + -data.labels.padding,
        data.labels.padding + -data.labels.padding
      );

      const fitLayer = group(
        "least-squares-fit",
        "Прямая наименьших квадратов"
      );
      const fitStartY = fittedY(data.regression.xStart);
      const fitEndY = fittedY(data.regression.xEnd);

      addLine(
        fitLayer,
        data.regression.xStart,
        fitStartY,
        data.regression.xEnd,
        fitEndY,
        "fit-halo"
      );
      addLine(
        fitLayer,
        data.regression.xStart,
        fitStartY,
        data.regression.xEnd,
        fitEndY,
        "fit-line"
      );

      addLine(
        fitLayer,
        data.regression.leaderStartX,
        data.regression.leaderStartY,
        data.regression.leaderEndX,
        fittedY(data.regression.leaderEndX),
        "leader"
      );
      addText(
        fitLayer,
        data.regression.labelX,
        data.regression.firstLabelY,
        "прямая наименьших",
        "fit-label",
        "start",
        data.labels.padding + -data.labels.padding,
        data.labels.padding + -data.labels.padding
      );
      addText(
        fitLayer,
        data.regression.labelX,
        data.regression.secondLabelY,
        "квадратов",
        "fit-label",
        "start",
        data.labels.padding + -data.labels.padding,
        data.labels.padding + -data.labels.padding
      );

      const residualLayer = group(
        "residuals",
        "Вертикальные остатки от точек до прямой"
      );

      data.points.forEach((point) => {
        const prediction = fittedY(point.x);
        const middleY = (point.y + prediction) / data.points
          .map((item) => item.x)
          .filter((x) => x === point.x)
          .length / data.labels.lineWidth * data.labels.lineWidth /
          (data.labels.lineWidth + data.labels.lineWidth);

        addLine(
          residualLayer,
          point.x,
          point.y,
          point.x,
          prediction,
          "residual-halo"
        );
        addLine(
          residualLayer,
          point.x,
          point.y,
          point.x,
          prediction,
          "residual-line"
        );
        addLine(
          residualLayer,
          point.x - data.regression.capHalf,
          point.y,
          point.x + data.regression.capHalf,
          point.y,
          "residual-cap"
        );
        addLine(
          residualLayer,
          point.x - data.regression.capHalf,
          prediction,
          point.x + data.regression.capHalf,
          prediction,
          "residual-cap"
        );
        addText(
          residualLayer,
          point.x,
          middleY,
          point.residual,
          "residual-label",
          point.residualAnchor,
          point.residualDx,
          point.residualDy
        );
      });

      const pointLayer = group("measurements", "Три измеренные точки");

      data.points.forEach((point) => {
        const outer = node("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: radiusFromScale(data.dot.outerRadius),
          class: "point-ring"
        });
        const inner = node("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: radiusFromScale(data.dot.innerRadius),
          class: "point-core"
        });

        pointLayer.appendChild(outer);
        pointLayer.appendChild(inner);

        addText(
          pointLayer,
          point.x,
          point.y,
          point.name,
          "point-label",
          point.pointAnchor,
          point.pointDx,
          point.pointDy
        );
      });

      const legendLayer = group(
        "legend",
        "Объяснение обозначений остатков"
      );

      addLine(
        legendLayer,
        data.legend.sampleX,
        data.legend.sampleTopY,
        data.legend.sampleX,
        data.legend.sampleBottomY,
        "residual-line"
      );
      addLine(
        legendLayer,
        data.legend.sampleX - data.legend.capHalf,
        data.legend.sampleTopY,
        data.legend.sampleX + data.legend.capHalf,
        data.legend.sampleTopY,
        "residual-cap"
      );
      addLine(
        legendLayer,
        data.legend.sampleX - data.legend.capHalf,
        data.legend.sampleBottomY,
        data.legend.sampleX + data.legend.capHalf,
        data.legend.sampleBottomY,
        "residual-cap"
      );
      addText(
        legendLayer,
        data.legend.textX,
        data.legend.firstTextY,
        "r₁, r₂, r₃ — остатки:",
        "legend-emphasis",
        "start",
        data.labels.padding + -data.labels.padding,
        data.labels.padding + -data.labels.padding
      );
      addText(
        legendLayer,
        data.legend.textX,
        data.legend.secondTextY,
        "вертикальные расстояния до прямой",
        "legend-label",
        "start",
        data.labels.padding + -data.labels.padding,
        data.labels.padding + -data.labels.padding
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
