<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Слова и документы в двумерном пространстве понятий</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5d687c;
      --axis: #8792a7;
      --grid: #dbe2ec;
      --term: #7c3aed;
      --term-edge: #5b21b6;
      --document: #0f8a78;
      --document-edge: #08685b;
      --land-fill: #f1eafe;
      --land-edge: #cab8f4;
      --water-fill: #e3f3fa;
      --water-edge: #9ed5e8;
      --relation: #98a3b6;
      --origin: #334155;
      --note: #edf2f7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #182131;
        --text: #eef2ff;
        --muted: #bdc7d9;
        --axis: #91a0b8;
        --grid: #303c50;
        --term: #b99af7;
        --term-edge: #d8c7ff;
        --document: #56cbb9;
        --document-edge: #9ae8dc;
        --land-fill: #30264a;
        --land-edge: #765fa9;
        --water-fill: #183847;
        --water-edge: #347c98;
        --relation: #66758d;
        --origin: #d7deeb;
        --note: #222e41;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .diagram {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    .heading {
      margin: 0;
      padding: 14px 20px 8px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .subheading {
      margin: 0;
      padding: 0 20px 8px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--panel);
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .axis-line {
      stroke: var(--axis);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .origin-mark {
      stroke: var(--origin);
      stroke-width: 7px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .cluster-land {
      fill: var(--land-fill);
      stroke: var(--land-edge);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .cluster-water {
      fill: var(--water-fill);
      stroke: var(--water-edge);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .relation {
      stroke: var(--relation);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .term-point {
      stroke: var(--term);
      stroke-width: 13px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .term-core {
      stroke: var(--term-edge);
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .document-point {
      fill: var(--document);
      stroke: var(--document-edge);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .cluster-label {
      fill: var(--text);
      font-size: 14px;
      font-weight: bold;
    }

    .point-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .document-label {
      fill: var(--text);
      font-size: 14px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .rank-label {
      fill: var(--term-edge);
      font-size: 16px;
      font-weight: bold;
    }

    .legend-label,
    .distance-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .failure {
      margin: 0;
      padding: 28px;
      color: var(--text);
      background: var(--panel);
      font-size: 16px;
      text-align: center;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure class="diagram">
    <figcaption>
      <h1 class="heading">Слова и документы в пространстве понятий, k=2</h1>
      <p class="subheading">Близость показывает похожее употребление, а не словарное определение</p>
    </figcaption>

    <svg id="map"
         viewBox="0 0 960 430"
         width="960"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
    </svg>

    <p id="failure" class="failure" hidden>
      Здесь должна быть двумерная карта: рядом расположены cat и dog,
      отдельную группу образуют fish и ocean, pet находится между группами,
      а Doc1–Doc4 размещены среди тематически близких слов.
    </p>
  </figure>

  <script>
    const data = Object.freeze({
      gridX: [-2, -1, 1, 2],
      gridY: [-1, 1],
      bounds: {
        left: -2.65,
        right: 2.65,
        bottom: -1.25,
        top: 1.35
      },
      clusters: [
        {
          className: "cluster-land",
          label: "похожий контекст: кошка и собака",
          labelPoint: { x: -2.45, y: 1.16 },
          anchor: "start",
          dx: 0,
          dy: -8,
          hull: [
            { x: -2.45, y: 1.05 },
            { x: -2.08, y: 1.28 },
            { x: -1.30, y: 1.16 },
            { x: -0.82, y: 0.67 },
            { x: -0.69, y: -0.61 },
            { x: -1.14, y: -0.89 },
            { x: -2.10, y: -0.63 },
            { x: -2.51, y: -0.08 }
          ]
        },
        {
          className: "cluster-water",
          label: "похожий контекст: рыба и океан",
          labelPoint: { x: 1.03, y: 1.16 },
          anchor: "start",
          dx: 0,
          dy: -8,
          hull: [
            { x: 0.91, y: 1.08 },
            { x: 1.42, y: 1.30 },
            { x: 2.29, y: 1.13 },
            { x: 2.52, y: 0.56 },
            { x: 2.28, y: -0.63 },
            { x: 1.53, y: -0.86 },
            { x: 1.02, y: -0.48 },
            { x: 0.82, y: 0.40 }
          ]
        }
      ],
      terms: [
        {
          id: "cat",
          label: "cat · кошка",
          x: -1.96,
          y: 0.73,
          dx: -13,
          dy: -8,
          anchor: "end"
        },
        {
          id: "dog",
          label: "dog · собака",
          x: -1.38,
          y: 0.57,
          dx: 13,
          dy: 6,
          anchor: "start"
        },
        {
          id: "fish",
          label: "fish · рыба",
          x: 1.38,
          y: 0.72,
          dx: -13,
          dy: -8,
          anchor: "end"
        },
        {
          id: "ocean",
          label: "ocean · океан",
          x: 1.98,
          y: 0.50,
          dx: 13,
          dy: 6,
          anchor: "start"
        },
        {
          id: "pet",
          label: "pet · питомец",
          x: 0,
          y: -0.18,
          dx: 13,
          dy: 5,
          anchor: "start"
        }
      ],
      documents: [
        {
          id: "Doc1",
          label: "Doc1",
          x: -1.78,
          y: 0.09,
          dx: -12,
          dy: 5,
          anchor: "end",
          half: 0.07
        },
        {
          id: "Doc2",
          label: "Doc2",
          x: 1.72,
          y: -0.31,
          dx: 0,
          dy: 24,
          anchor: "middle",
          half: 0.07
        },
        {
          id: "Doc3",
          label: "Doc3",
          x: 0.29,
          y: 0.32,
          dx: 0,
          dy: -15,
          anchor: "middle",
          half: 0.07
        },
        {
          id: "Doc4",
          label: "Doc4",
          x: -0.76,
          y: -0.50,
          dx: 0,
          dy: 24,
          anchor: "middle",
          half: 0.07
        }
      ],
      relations: [
        {
          from: { x: -1.96, y: 0.73 },
          to: { x: -1.38, y: 0.57 }
        },
        {
          from: { x: 1.38, y: 0.72 },
          to: { x: 1.98, y: 0.50 }
        },
        {
          from: { x: -1.78, y: 0.09 },
          to: { x: -1.55, y: 0.50 }
        },
        {
          from: { x: 1.72, y: -0.31 },
          to: { x: 1.62, y: 0.38 }
        },
        {
          from: { x: 0.29, y: 0.32 },
          to: { x: 0, y: -0.18 }
        },
        {
          from: { x: -0.76, y: -0.50 },
          to: { x: 0, y: -0.18 }
        }
      ],
      labels: {
        rank: {
          text: "плоскость k=2",
          point: { x: -2.54, y: 1.45 },
          dx: 0,
          dy: 0,
          anchor: "start"
        },
        horizontalAxis: {
          text: "первое найденное направление SVD",
          point: { x: 2.57, y: 0 },
          dx: -2,
          dy: 29,
          anchor: "end"
        },
        verticalAxis: {
          text: "второе найденное направление SVD",
          point: { x: 0, y: 1.34 },
          dx: 13,
          dy: 4,
          anchor: "start"
        },
        distance: {
          text: "меньше расстояние → больше сходство",
          point: { x: 2.54, y: -1.43 },
          dx: 0,
          dy: 0,
          anchor: "end"
        }
      },
      legend: {
        term: {
          point: { x: -2.45, y: -1.43 },
          text: "слово",
          dx: 14,
          dy: 5,
          anchor: "start"
        },
        document: {
          point: { x: -1.42, y: -1.43 },
          text: "документ",
          dx: 14,
          dy: 5,
          anchor: "start",
          half: 0.055
        }
      }
    });

    const origin = Object.freeze({ x: 480, y: 221 });
    const scale = Object.freeze({ x: 159, y: 119 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("map");
      const namespace = "http://www.w3.org/2000/svg";

      function element(name, attributes, content) {
        const item = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          item.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          item.textContent = content;
        }
        return item;
      }

      function mappedLine(from, to, className) {
        return element("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        });
      }

      function mappedText(item, className) {
        return element("text", {
          x: sx(item.point.x),
          y: sy(item.point.y),
          dx: item.dx,
          dy: item.dy,
          "text-anchor": item.anchor,
          class: className
        }, item.text);
      }

      function squarePoints(item) {
        return [
          { x: item.x - item.half, y: item.y + item.half },
          { x: item.x + item.half, y: item.y + item.half },
          { x: item.x + item.half, y: item.y - item.half },
          { x: item.x - item.half, y: item.y - item.half }
        ].map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");
      }

      const title = element("title", { id: "svg-title" },
        "Слова и документы в двумерном пространстве понятий");
      const description = element("desc", { id: "svg-description" },
        "Точки cat и dog расположены рядом слева, fish и ocean образуют отдельную группу справа, pet находится посередине, документы Doc1–Doc4 размещены между близкими по теме словами.");
      svg.append(title, description);

      const gridLayer = element("g", { "aria-hidden": "true" });
      data.gridX.forEach(x => {
        gridLayer.append(mappedLine(
          { x, y: data.bounds.bottom },
          { x, y: data.bounds.top },
          "grid-line"
        ));
      });
      data.gridY.forEach(y => {
        gridLayer.append(mappedLine(
          { x: data.bounds.left, y },
          { x: data.bounds.right, y },
          "grid-line"
        ));
      });
      svg.append(gridLayer);

      const clusterLayer = element("g", { "aria-label": "Тематические группы" });
      data.clusters.forEach(cluster => {
        clusterLayer.append(element("polygon", {
          points: cluster.hull
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: cluster.className
        }));
      });
      svg.append(clusterLayer);

      const axisLayer = element("g", { "aria-label": "Латентные направления SVD" });
      axisLayer.append(
        mappedLine(
          { x: data.bounds.left, y: 0 },
          { x: data.bounds.right, y: 0 },
          "axis-line"
        ),
        mappedLine(
          { x: 0, y: data.bounds.bottom },
          { x: 0, y: data.bounds.top },
          "axis-line"
        ),
        mappedLine(
          { x: 0, y: 0 },
          { x: 0, y: 0 },
          "origin-mark"
        )
      );
      svg.append(axisLayer);

      const relationLayer = element("g", {
        "aria-label": "Линии между близкими точками"
      });
      data.relations.forEach(relation => {
        relationLayer.append(mappedLine(
          relation.from,
          relation.to,
          "relation"
        ));
      });
      svg.append(relationLayer);

      const documentLayer = element("g", { "aria-label": "Документы" });
      data.documents.forEach(documentPoint => {
        documentLayer.append(element("polygon", {
          points: squarePoints(documentPoint),
          class: "document-point"
        }));
      });
      svg.append(documentLayer);

      const termLayer = element("g", { "aria-label": "Слова" });
      data.terms.forEach(term => {
        const point = { x: term.x, y: term.y };
        termLayer.append(
          mappedLine(point, point, "term-point"),
          mappedLine(point, point, "term-core")
        );
      });
      svg.append(termLayer);

      const labelLayer = element("g", { "aria-label": "Подписи точек" });
      data.clusters.forEach(cluster => {
        labelLayer.append(mappedText({
          point: cluster.labelPoint,
          text: cluster.label,
          dx: cluster.dx,
          dy: cluster.dy,
          anchor: cluster.anchor
        }, "cluster-label"));
      });

      data.terms.forEach(term => {
        labelLayer.append(mappedText({
          point: { x: term.x, y: term.y },
          text: term.label,
          dx: term.dx,
          dy: term.dy,
          anchor: term.anchor
        }, "point-label"));
      });

      data.documents.forEach(documentPoint => {
        labelLayer.append(mappedText({
          point: { x: documentPoint.x, y: documentPoint.y },
          text: documentPoint.label,
          dx: documentPoint.dx,
          dy: documentPoint.dy,
          anchor: documentPoint.anchor
        }, "document-label"));
      });

      labelLayer.append(
        mappedText(data.labels.rank, "rank-label"),
        mappedText(data.labels.horizontalAxis, "axis-label"),
        mappedText(data.labels.verticalAxis, "axis-label"),
        mappedText(data.labels.distance, "distance-note")
      );
      svg.append(labelLayer);

      const legendLayer = element("g", { "aria-label": "Условные обозначения" });
      const termLegendPoint = data.legend.term.point;
      legendLayer.append(
        mappedLine(termLegendPoint, termLegendPoint, "term-point"),
        mappedLine(termLegendPoint, termLegendPoint, "term-core"),
        mappedText({
          point: termLegendPoint,
          text: data.legend.term.text,
          dx: data.legend.term.dx,
          dy: data.legend.term.dy,
          anchor: data.legend.term.anchor
        }, "legend-label")
      );

      const documentLegend = {
        x: data.legend.document.point.x,
        y: data.legend.document.point.y,
        half: data.legend.document.half
      };
      legendLayer.append(
        element("polygon", {
          points: squarePoints(documentLegend),
          class: "document-point"
        }),
        mappedText({
          point: data.legend.document.point,
          text: data.legend.document.text,
          dx: data.legend.document.dx,
          dy: data.legend.document.dy,
          anchor: data.legend.document.anchor
        }, "legend-label")
      );
      svg.append(legendLayer);
    } catch (error) {
      document.getElementById("map").hidden = true;
      document.getElementById("failure").hidden = false;
    }
  </script>
</body>
</html>
