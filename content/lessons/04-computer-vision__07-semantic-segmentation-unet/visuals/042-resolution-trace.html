<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь разрешения через четыре уровня</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --surface: #ffffff;
      --surface-alt: #eef4fb;
      --ink: #172033;
      --muted: #596579;
      --border: #b8c4d6;
      --good: #167a68;
      --good-fill: #dff4ee;
      --good-strong: #0c6657;
      --bad: #bd4f36;
      --bad-fill: #fde8e2;
      --accent: #4f64d8;
      --accent-fill: #e8ebff;
      --arrow: #69758a;
      --shadow: #dbe2ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #182130;
        --surface-alt: #202c3d;
        --ink: #eef3fb;
        --muted: #aebbd0;
        --border: #526077;
        --good: #63d8bd;
        --good-fill: #173f3a;
        --good-strong: #8be4cf;
        --bad: #ff927b;
        --bad-fill: #4a2926;
        --accent: #aeb7ff;
        --accent-fill: #30375f;
        --arrow: #9aa8bd;
        --shadow: #0b1018;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .frame {
      max-width: 1120px;
      margin: auto;
    }

    h1 {
      font-size: 22px;
      font-weight: bold;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    text {
      font-family: inherit;
      fill: var(--ink);
      dominant-baseline: middle;
    }

    .panel {
      fill: var(--surface-alt);
      stroke: var(--border);
      stroke-width: 1.5;
    }

    .good-node {
      fill: var(--good-fill);
      stroke: var(--good);
      stroke-width: 2;
    }

    .bad-node {
      fill: var(--bad-fill);
      stroke: var(--bad);
      stroke-width: 2;
    }

    .aligned-node {
      fill: var(--accent-fill);
      stroke: var(--accent);
      stroke-width: 2.5;
    }

    .skip-shape {
      fill: var(--good-fill);
      stroke: var(--good);
      stroke-width: 3;
    }

    .decoder-shape {
      fill: var(--bad-fill);
      stroke: var(--bad);
      stroke-width: 3;
    }

    .aligned-skip {
      fill: var(--good-fill);
      stroke: var(--good);
      stroke-width: 4;
    }

    .aligned-decoder {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
    }

    .arrow-line {
      stroke: var(--arrow);
      stroke-width: 2.5;
    }

    .arrow-head {
      fill: var(--arrow);
    }

    .interpolate-line {
      stroke: var(--accent);
      stroke-width: 3;
    }

    .interpolate-head {
      fill: var(--accent);
    }

    .bridge-line {
      stroke: var(--good);
      stroke-width: 3;
    }

    .bridge-head {
      fill: var(--good);
    }

    .node-text {
      font-size: 20px;
      font-weight: bold;
    }

    .section-title {
      font-size: 19px;
      font-weight: bold;
    }

    .section-note {
      font-size: 14px;
      fill: var(--muted);
    }

    .arrow-note {
      font-size: 13px;
      fill: var(--muted);
    }

    .bridge-note {
      font-size: 14px;
      font-weight: bold;
      fill: var(--good-strong);
    }

    .bad-note {
      font-size: 14px;
      font-weight: bold;
      fill: var(--bad);
    }

    .accent-note {
      font-size: 15px;
      font-weight: bold;
      fill: var(--accent);
    }

    .plain-note {
      font-size: 14px;
      fill: var(--ink);
    }

    .symbol {
      font-size: 24px;
      font-weight: bold;
      fill: var(--bad);
    }

    #fallback {
      font-size: 16px;
      color: var(--bad);
      background: var(--surface);
      border: 2px solid var(--bad);
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Путь разрешения через четыре уровня</h1>

    <svg id="diagram"
         viewBox="0 0 1120 500"
         width="1120"
         height="500"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Сравнение корректной цепочки размеров 256, 128, 64, 32, 16 и проблемной цепочки 250, 125, 62, 31, 15 с выравниванием skip connection через F.interpolate">
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать корректный путь 256 → 128 → 64 → 32 → 16,
      проблемный путь 250 → 125 → 62 → 31 → 15 и выравнивание несовпавших
      форм skip connection через F.interpolate.
    </div>
  </main>

  <script>
    const data = {
      canvas: [0, 0, 1120, 500],

      panels: [
        [20, 18, 1100, 226],
        [20, 240, 1100, 482]
      ],

      goodNodes: [
        [50, 82, 210, 142, 130, 112, "256 × 256"],
        [255, 82, 415, 142, 335, 112, "128 × 128"],
        [460, 82, 620, 142, 540, 112, "64 × 64"],
        [665, 82, 825, 142, 745, 112, "32 × 32"],
        [870, 82, 1030, 142, 950, 112, "16 × 16"]
      ],

      badNodes: [
        [50, 300, 210, 360, 130, 330, "250 × 250"],
        [255, 300, 415, 360, 335, 330, "125 × 125"],
        [460, 300, 620, 360, 540, 330, "62 × 62"],
        [665, 300, 825, 360, 745, 330, "31 × 31"],
        [870, 300, 1030, 360, 950, 330, "15 × 15"]
      ],

      chainArrows: [
        [[215, 112], [250, 112], [[250, 112], [238, 104], [238, 120]]],
        [[420, 112], [455, 112], [[455, 112], [443, 104], [443, 120]]],
        [[625, 112], [660, 112], [[660, 112], [648, 104], [648, 120]]],
        [[830, 112], [865, 112], [[865, 112], [853, 104], [853, 120]]],
        [[215, 330], [250, 330], [[250, 330], [238, 322], [238, 338]]],
        [[420, 330], [455, 330], [[455, 330], [443, 322], [443, 338]]],
        [[625, 330], [660, 330], [[660, 330], [648, 322], [648, 338]]],
        [[830, 330], [865, 330], [[865, 330], [853, 322], [853, 338]]]
      ],

      bridgeRects: [
        [300, 169, 420, 211, "good-node"],
        [690, 169, 810, 211, "good-node"]
      ],

      bridgeArrow: [
        [435, 190],
        [675, 190],
        [[675, 190], [660, 181], [660, 199]]
      ],

      mismatchRects: [
        [246, 400, 346, 460, "skip-shape"],
        [376, 408, 463, 452, "decoder-shape"]
      ],

      interpolateArrow: [
        [495, 430],
        [625, 430],
        [[625, 430], [609, 420], [609, 440]]
      ],

      alignedRects: [
        [654, 400, 754, 460, "aligned-skip"],
        [654, 400, 754, 460, "aligned-decoder"]
      ],

      labels: [
        [[50, 50], [0, 0], "start", "section-title",
          "Корректно: четыре деления вдвое"],
        [[1050, 50], [0, 0], "end", "section-note",
          "256 делится на 16 без остатка"],

        [[232, 94], [0, -7], "middle", "arrow-note", "вдвое"],
        [[437, 94], [0, -7], "middle", "arrow-note", "вдвое"],
        [[642, 94], [0, -7], "middle", "arrow-note", "вдвое"],
        [[847, 94], [0, -7], "middle", "arrow-note", "вдвое"],

        [[300, 190], [-12, 0], "end", "bridge-note", "32 × 32"],
        [[555, 169], [0, -7], "middle", "bridge-note",
          "skip connection: размеры совпадают"],
        [[810, 190], [12, 0], "start", "bridge-note", "32 × 32"],
        [[555, 211], [0, 7], "middle", "section-note",
          "признаки соединяются в одном масштабе"],

        [[50, 272], [0, 0], "start", "section-title",
          "Проблемно: округление на каждом уровне"],
        [[1050, 272], [0, 0], "end", "bad-note",
          "250 не делится на 16"],

        [[232, 312], [0, -7], "middle", "arrow-note", "вдвое"],
        [[437, 312], [0, -7], "middle", "arrow-note", "вдвое"],
        [[642, 312], [0, -7], "middle", "arrow-note", "вдвое"],
        [[847, 312], [0, -7], "middle", "arrow-note", "вдвое"],

        [[50, 430], [0, 0], "start", "bad-note",
          "skip connection:"],
        [[246, 400], [0, -10], "start", "plain-note",
          "skip 31 × 31"],
        [[361, 430], [0, 0], "middle", "symbol", "≠"],
        [[376, 452], [0, 12], "start", "plain-note",
          "decoder после увеличения"],

        [[560, 410], [0, -9], "middle", "accent-note",
          "F.interpolate"],
        [[560, 452], [0, 10], "middle", "section-note",
          "подгоняет высоту и ширину"],

        [[754, 400], [15, -7], "start", "accent-note",
          "H × W выровнены"],
        [[754, 430], [15, 8], "start", "plain-note",
          "skip connection снова совпадает"]
      ]
    };

    const origin = [0, 0];
    const scale = 1;
    const [originX, originY] = origin;
    const sx = x => originX + x * scale;
    const sy = y => originY + y * scale;

    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const make = (name, attributes, className) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }
        if (className) element.setAttribute("class", className);
        svg.appendChild(element);
        return element;
      };

      const drawRect = (left, top, right, bottom, className) =>
        make("rect", {
          x: sx(left),
          y: sy(top),
          width: sx(right) - sx(left),
          height: sy(bottom) - sy(top)
        }, className);

      const drawLine = (from, to, className) => {
        const [fromX, fromY] = from;
        const [toX, toY] = to;
        return make("line", {
          x1: sx(fromX),
          y1: sy(fromY),
          x2: sx(toX),
          y2: sy(toY)
        }, className);
      };

      const drawHead = (points, className) => {
        const converted = [];
        for (const [x, y] of points) converted.push(`${sx(x)},${sy(y)}`);
        return make("polygon", { points: converted.join(" ") }, className);
      };

      const drawLabel = (point, offset, anchor, className, content) => {
        const [x, y] = point;
        const [dx, dy] = offset;
        const text = make("text", {
          x: sx(x) + dx,
          y: sy(y) + dy,
          "text-anchor": anchor
        }, className);
        text.textContent = content;
        return text;
      };

      const [canvasLeft, canvasTop, canvasRight, canvasBottom] = data.canvas;
      drawRect(canvasLeft, canvasTop, canvasRight, canvasBottom, "canvas-bg");

      for (const [left, top, right, bottom] of data.panels) {
        drawRect(left, top, right, bottom, "panel");
      }

      for (const [left, top, right, bottom, centerX, centerY, content]
        of data.goodNodes) {
        drawRect(left, top, right, bottom, "good-node");
        drawLabel([centerX, centerY], [0, 0], "middle", "node-text", content);
      }

      for (const [left, top, right, bottom, centerX, centerY, content]
        of data.badNodes) {
        drawRect(left, top, right, bottom, "bad-node");
        drawLabel([centerX, centerY], [0, 0], "middle", "node-text", content);
      }

      for (const [from, to, head] of data.chainArrows) {
        drawLine(from, to, "arrow-line");
        drawHead(head, "arrow-head");
      }

      for (const [left, top, right, bottom, className] of data.bridgeRects) {
        drawRect(left, top, right, bottom, className);
      }

      const [bridgeFrom, bridgeTo, bridgeHead] = data.bridgeArrow;
      drawLine(bridgeFrom, bridgeTo, "bridge-line");
      drawHead(bridgeHead, "bridge-head");

      for (const [left, top, right, bottom, className] of data.mismatchRects) {
        drawRect(left, top, right, bottom, className);
      }

      const [interpolateFrom, interpolateTo, interpolateHead] =
        data.interpolateArrow;
      drawLine(interpolateFrom, interpolateTo, "interpolate-line");
      drawHead(interpolateHead, "interpolate-head");

      for (const [left, top, right, bottom, className] of data.alignedRects) {
        drawRect(left, top, right, bottom, className);
      }

      for (const [point, offset, anchor, className, content] of data.labels) {
        drawLabel(point, offset, anchor, className, content);
      }
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
</body>
</html>
