<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Форма буквы U и мостики признаков</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --ink: #172033;
      --muted: #526074;
      --main: #64748b;
      --enc-fill: #dbeafe;
      --enc-stroke: #2563eb;
      --dec-fill: #dcfce7;
      --dec-stroke: #16a34a;
      --bot-fill: #fef3c7;
      --bot-stroke: #d97706;
      --out-fill: #f3e8ff;
      --out-stroke: #9333ea;
      --skip: #0891b2;
      --guide: #cbd5e1;
      --fallback: #b91c1c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: #f1f5f9;
        --muted: #cbd5e1;
        --main: #94a3b8;
        --enc-fill: #172554;
        --enc-stroke: #60a5fa;
        --dec-fill: #052e24;
        --dec-stroke: #4ade80;
        --bot-fill: #422006;
        --bot-stroke: #fbbf24;
        --out-fill: #3b0764;
        --out-stroke: #d8b4fe;
        --skip: #22d3ee;
        --guide: #334155;
        --fallback: #fca5a5;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--page);
    }

    h2 {
      margin: 0;
      padding: 7px;
      font-size: 18px;
      line-height: normal;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--page);
    }

    .node {
      stroke-linejoin: round;
    }

    .encoder {
      fill: var(--enc-fill);
      stroke: var(--enc-stroke);
    }

    .decoder {
      fill: var(--dec-fill);
      stroke: var(--dec-stroke);
    }

    .bottleneck {
      fill: var(--bot-fill);
      stroke: var(--bot-stroke);
    }

    .output {
      fill: var(--out-fill);
      stroke: var(--out-stroke);
    }

    .main-line {
      fill: none;
      stroke: var(--main);
      stroke-linecap: round;
    }

    .main-head {
      fill: var(--main);
    }

    .skip-line {
      fill: none;
      stroke: var(--skip);
      stroke-linecap: round;
    }

    .skip-head {
      fill: var(--skip);
    }

    .legend-guide {
      fill: none;
      stroke: var(--guide);
      stroke-linecap: round;
    }

    .label {
      fill: var(--ink);
    }

    .secondary {
      fill: var(--muted);
    }

    .skip-label {
      fill: var(--skip);
    }

    .zone-label {
      fill: var(--muted);
      font-weight: bold;
      letter-spacing: 0.04em;
    }

    .node-primary {
      fill: var(--ink);
      font-weight: bold;
    }

    .node-secondary {
      fill: var(--muted);
    }

    #fallback {
      display: none;
      margin: 0;
      padding: 7px;
      color: var(--fallback);
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Форма буквы U и мостики признаков</h2>
    <svg
      id="diagram"
      width="1780"
      height="470"
      viewBox="0 0 1780 470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Симметричная схема U-Net: энкодер уменьшает разрешение от 256 на 256 до 16 на 16, декодер восстанавливает его, а четыре мостика соединяют одинаковые масштабы."
    ></svg>
    <p id="fallback">
      Схема должна была показать U-Net: спуск 256×256 → 128×128 →
      64×64 → 32×32 → 16×16, обратный подъём и четыре мостика между
      одинаковыми разрешениями.
    </p>
  </figure>

  <script>
    const DATA = [
      {
        zero: 0,
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1,
        two: 2,
        headLength: 13,
        headHalf: 7,
        dash: 10,
        dashGap: 8,
        nodeTextGap: 10,
        zoneFontFactor: 1.08,
        smallFontFactor: 0.92,
        legendY: 446
      },
      [
        {
          id: "e1",
          kind: "encoder",
          x: 50,
          y: 48,
          w: 120,
          h: 54,
          primary: "64 канала",
          secondary: "256×256"
        },
        {
          id: "e2",
          kind: "encoder",
          x: 240,
          y: 123,
          w: 120,
          h: 54,
          primary: "128 каналов",
          secondary: "128×128"
        },
        {
          id: "e3",
          kind: "encoder",
          x: 430,
          y: 198,
          w: 120,
          h: 54,
          primary: "256 каналов",
          secondary: "64×64"
        },
        {
          id: "e4",
          kind: "encoder",
          x: 620,
          y: 273,
          w: 120,
          h: 54,
          primary: "512 каналов",
          secondary: "32×32"
        },
        {
          id: "b",
          kind: "bottleneck",
          x: 790,
          y: 353,
          w: 120,
          h: 58,
          primary: "1024 канала",
          secondary: "16×16"
        },
        {
          id: "d4",
          kind: "decoder",
          x: 960,
          y: 273,
          w: 120,
          h: 54,
          primary: "512 каналов",
          secondary: "32×32"
        },
        {
          id: "d3",
          kind: "decoder",
          x: 1150,
          y: 198,
          w: 120,
          h: 54,
          primary: "256 каналов",
          secondary: "64×64"
        },
        {
          id: "d2",
          kind: "decoder",
          x: 1340,
          y: 123,
          w: 120,
          h: 54,
          primary: "128 каналов",
          secondary: "128×128"
        },
        {
          id: "d1",
          kind: "decoder",
          x: 1515,
          y: 48,
          w: 120,
          h: 54,
          primary: "64 канала",
          secondary: "256×256"
        },
        {
          id: "out",
          kind: "output",
          x: 1660,
          y: 40,
          w: 95,
          h: 70,
          primary: "1×1",
          secondary: "классы",
          tertiary: "256×256"
        }
      ],
      [
        { from: { x: 170, y: 75 }, to: { x: 240, y: 150 } },
        { from: { x: 360, y: 150 }, to: { x: 430, y: 225 } },
        { from: { x: 550, y: 225 }, to: { x: 620, y: 300 } },
        { from: { x: 740, y: 300 }, to: { x: 790, y: 382 } },
        { from: { x: 910, y: 382 }, to: { x: 960, y: 300 } },
        { from: { x: 1080, y: 300 }, to: { x: 1150, y: 225 } },
        { from: { x: 1270, y: 225 }, to: { x: 1340, y: 150 } },
        { from: { x: 1460, y: 150 }, to: { x: 1515, y: 75 } },
        { from: { x: 1635, y: 75 }, to: { x: 1660, y: 75 } }
      ],
      [
        {
          from: { x: 170, y: 48 },
          to: { x: 1515, y: 48 },
          label: "мостик 256×256",
          anchor: { x: 1110, y: 48 },
          dx: 0,
          dy: -1,
          textAnchor: "middle"
        },
        {
          from: { x: 360, y: 123 },
          to: { x: 1340, y: 123 },
          label: "мостик 128×128",
          anchor: { x: 920, y: 123 },
          dx: 0,
          dy: -1,
          textAnchor: "middle"
        },
        {
          from: { x: 550, y: 198 },
          to: { x: 1150, y: 198 },
          label: "мостик 64×64",
          anchor: { x: 850, y: 198 },
          dx: 0,
          dy: -1,
          textAnchor: "middle"
        },
        {
          from: { x: 740, y: 273 },
          to: { x: 960, y: 273 },
          label: "мостик 32×32",
          anchor: { x: 850, y: 273 },
          dx: 0,
          dy: -1,
          textAnchor: "middle"
        }
      ],
      {
        zones: [
          { x: 335, y: 18, text: "ЭНКОДЕР · СЖАТИЕ" },
          { x: 850, y: 18, text: "УЗКОЕ МЕСТО" },
          { x: 1305, y: 18, text: "ДЕКОДЕР · ВОССТАНОВЛЕНИЕ" }
        ],
        main: {
          from: { x: 55, y: 446 },
          to: { x: 120, y: 446 },
          anchor: { x: 120, y: 446 },
          dx: 1,
          dy: 0,
          textAnchor: "start",
          text: "основной путь: разрешение меняется"
        },
        skip: {
          from: { x: 655, y: 446 },
          to: { x: 720, y: 446 },
          anchor: { x: 720, y: 446 },
          dx: 1,
          dy: 0,
          textAnchor: "start",
          text: "мостик: признаки того же масштаба"
        }
      }
    ];

    const [G, NODES, EDGES, SKIPS, LEGEND] = DATA;
    const origin = Object.freeze({ x: G.originX, y: G.originY });
    const scale = Object.freeze({ x: G.scaleX, y: G.scaleY });
    const WIDTH = 1780;
    const HEIGHT = 470;
    const LABEL_PAD = 7;
    const LINE_WIDTH = 2;
    const FONT_SIZE = 14;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const NS = "http://www.w3.org/2000/svg";

      const make = (name, attrs, className) => {
        const element = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const line = (from, to, className, dashed) => {
        const element = make(
          "line",
          {
            x1: sx(from.x),
            y1: sy(from.y),
            x2: sx(to.x),
            y2: sy(to.y),
            "stroke-width": LINE_WIDTH
          },
          className
        );
        if (dashed) {
          element.setAttribute(
            "stroke-dasharray",
            `${sx(G.dash) - sx(G.zero)} ${sx(G.dashGap) - sx(G.zero)}`
          );
        }
        return add(element);
      };

      const arrowHead = (from, to, className) => {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const baseX = to.x - ux * G.headLength;
        const baseY = to.y - uy * G.headLength;
        const points = [
          { x: to.x, y: to.y },
          {
            x: baseX - uy * G.headHalf,
            y: baseY + ux * G.headHalf
          },
          {
            x: baseX + uy * G.headHalf,
            y: baseY - ux * G.headHalf
          }
        ];
        return add(
          make(
            "polygon",
            {
              points: points
                .map(point => `${sx(point.x)},${sy(point.y)}`)
                .join(" ")
            },
            className
          )
        );
      };

      const text = (
        value,
        x,
        y,
        className,
        textAnchor,
        fontSize
      ) => {
        const element = make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            "text-anchor": textAnchor,
            "font-size": fontSize
          },
          className
        );
        element.textContent = value;
        return add(element);
      };

      const offsetText = (item, className, fontSize) => {
        const element = make(
          "text",
          {
            x: sx(item.anchor.x) + item.dx * LABEL_PAD,
            y: sy(item.anchor.y) + item.dy * LABEL_PAD,
            "text-anchor": item.textAnchor,
            "font-size": fontSize
          },
          className
        );
        element.textContent = item.label || item.text;
        return add(element);
      };

      LEGEND.zones.forEach(zone => {
        text(
          zone.text,
          zone.x,
          zone.y,
          "zone-label",
          "middle",
          FONT_SIZE * G.zoneFontFactor
        );
      });

      SKIPS.forEach(skip => {
        line(skip.from, skip.to, "skip-line", true);
        arrowHead(skip.from, skip.to, "skip-head");
        offsetText(
          skip,
          "skip-label",
          FONT_SIZE * G.smallFontFactor
        );
      });

      EDGES.forEach(edge => {
        line(edge.from, edge.to, "main-line", false);
        arrowHead(edge.from, edge.to, "main-head");
      });

      NODES.forEach(node => {
        add(
          make(
            "rect",
            {
              x: sx(node.x),
              y: sy(node.y),
              width: sx(node.x + node.w) - sx(node.x),
              height: sy(node.y + node.h) - sy(node.y),
              "stroke-width": LINE_WIDTH
            },
            `node ${node.kind}`
          )
        );

        const centerX = node.x + node.w / G.two;
        const centerY = node.y + node.h / G.two;

        if (node.tertiary) {
          text(
            node.primary,
            centerX,
            centerY - G.nodeTextGap,
            "node-primary",
            "middle",
            FONT_SIZE
          );
          text(
            node.secondary,
            centerX,
            centerY,
            "node-secondary",
            "middle",
            FONT_SIZE * G.smallFontFactor
          );
          text(
            node.tertiary,
            centerX,
            centerY + G.nodeTextGap,
            "node-secondary",
            "middle",
            FONT_SIZE * G.smallFontFactor
          );
        } else {
          text(
            node.primary,
            centerX,
            centerY - G.nodeTextGap / G.two,
            "node-primary",
            "middle",
            FONT_SIZE
          );
          text(
            node.secondary,
            centerX,
            centerY + G.nodeTextGap,
            "node-secondary",
            "middle",
            FONT_SIZE * G.smallFontFactor
          );
        }
      });

      line(
        LEGEND.main.from,
        LEGEND.main.to,
        "legend-guide",
        false
      );
      arrowHead(
        LEGEND.main.from,
        LEGEND.main.to,
        "main-head"
      );
      offsetText(
        LEGEND.main,
        "secondary",
        FONT_SIZE * G.smallFontFactor
      );

      line(
        LEGEND.skip.from,
        LEGEND.skip.to,
        "skip-line",
        true
      );
      arrowHead(
        LEGEND.skip.from,
        LEGEND.skip.to,
        "skip-head"
      );
      offsetText(
        LEGEND.skip,
        "secondary",
        FONT_SIZE * G.smallFontFactor
      );

      svg.setAttribute("width", WIDTH);
      svg.setAttribute("height", HEIGHT);
    } catch (error) {
      document.getElementById("diagram").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
</body>
</html>
