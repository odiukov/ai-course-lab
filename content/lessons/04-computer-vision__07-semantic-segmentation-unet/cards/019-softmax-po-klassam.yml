- concept: вероятности взаимоисключающих классов одного пикселя конкурируют из-за общей нормировки softmax
  question: Объясни, что произойдёт с вероятностями классов одного пикселя, если увеличить логит выбранного класса, оставив остальные логиты неизменными.
  explanation: Softmax делит экспоненту каждого логита на сумму экспонент всех классов этого пикселя. Увеличение одного логита повышает его долю и одновременно увеличивает общий знаменатель для остальных классов.
  kind: open
  reference: Вероятность выбранного класса возрастёт, а вероятности остальных классов уменьшатся, поскольку softmax нормирует их общей суммой и распределение для пикселя должно сохранять сумму, равную единице.
  id: 019-softmax-po-klassam-2
  fingerprint: 35577c7a
