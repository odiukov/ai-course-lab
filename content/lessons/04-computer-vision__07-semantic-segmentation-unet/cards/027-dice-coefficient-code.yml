- concept: мягкий Dice сохраняет вклад вероятностей и остаётся пригодным для градиентного обучения
  question: Почему перед вычислением soft Dice не следует превращать вероятности в бинарную маску с помощью порога?
  explanation: 'Soft Dice работает непосредственно с вероятностями: более уверенный пиксель вносит больший вклад в перекрытие. Жёсткая пороговая операция уничтожает эту градацию и мешает обучению через обратное распространение.'
  kind: choice
  options:
    - Порог отбрасывает информацию об уверенности и почти везде не передаёт полезный градиент
    - Порог меняет пространственные размеры маски
    - Порог заставляет вероятности разных пикселей суммироваться в единицу
  correct: 0
  id: 027-dice-coefficient-code-1
  fingerprint: f84c38c8
- concept: epsilon в знаменателе предотвращает неопределённое деление для двух пустых масок
  question: Что вернёт Dice, если предсказание и эталон полностью пусты, а epsilon добавлен только в знаменатель? Объясни роль epsilon.
  explanation: Без epsilon получилась бы неопределённость вида ноль, делённый на ноль. Добавка только в знаменатель делает результат конечным; чтобы считать две пустые маски идеальным совпадением, потребовалось бы другое соглашение или отдельная обработка.
  kind: open
  reference: 'Коэффициент будет равен нулю: числитель останется нулевым, а epsilon сделает знаменатель ненулевым. Это предотвращает неопределённость и NaN, но не объявляет две пустые маски идеальным совпадением.'
  id: 027-dice-coefficient-code-2
  fingerprint: 27a4d548
