- concept: кросс-энтропия и Dice loss дают взаимодополняющие обучающие сигналы
  question: Почему при сильном дисбалансе классов сегментационную сеть часто обучают на сумме pixel cross-entropy и Dice loss?
  explanation: Кросс-энтропия обеспечивает устойчивые точечные градиенты, особенно в начале обучения. Dice loss оценивает маску целиком и сохраняет внимание к малому классу при большом количестве фоновых пикселей.
  kind: choice
  options:
    - Кросс-энтропия отвечает только за фон, а Dice loss — только за объект
    - Сумма потерь устраняет необходимость подбирать порог для итоговой маски
    - Кросс-энтропия даёт локальные сигналы по пикселям, а Dice loss контролирует перекрытие маски и не позволяет большинству-фону скрыть провал редкого класса
  correct: 2
  id: 030-combined-loss-1
  fingerprint: 6214bb1b
- concept: коэффициент lambda регулирует относительное влияние Dice loss в комбинированной функции потерь
  question: Дополните утверждение о комбинированной функции потерь.
  explanation: Коэффициент λ масштабирует вклад Dice loss. Чем он больше, тем сильнее оптимизатор ориентируется на перекрытие масок относительно попиксельной кросс-энтропии.
  kind: cloze
  template: В выражении L = L_CE + λ · L_Dice увеличение λ при прочих равных приводит к ___ влияния ошибки перекрытия на обучение.
  answer: усилению
  accept:
    - увеличению
