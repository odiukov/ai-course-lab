- concept: Dice однозначно вычисляется из IoU, поэтому обе метрики одинаково ранжируют модели по качеству перекрытия
  question: Для предсказанной маски IoU равен 0.8. Чему примерно равен Dice?
  explanation: 'По связи Dice = 2 × IoU / (1 + IoU) получаем 1.6 / 1.8 ≈ 0.889. Преобразование монотонно: большему IoU всегда соответствует больший Dice.'
  kind: numeric
  answer: 0.889
  tolerance: 0.001
  id: 037-dice-iou-boundary-1
  fingerprint: 4293b9c4
- concept: Boundary F1 оценивает близость контуров и выявляет ошибки границ, которые могут быть слабо заметны в метриках перекрытия
  question: У моделей одинаково высокие IoU и Dice. Граница маски первой модели почти везде проходит в допустимой близости от эталонного контура, а у второй на многих участках заметно отклоняется от него. Какой вывод верен?
  explanation: IoU и Dice в основном оценивают совпадение площадей масок, поэтому небольшие ошибки контура крупного объекта могут мало изменить их значения. Boundary F1 отдельно проверяет близость предсказанной и эталонной границ.
  kind: choice
  options:
    - У первой модели Boundary F1 будет выше, поскольку её контур точнее совпадает с эталонным
    - Boundary F1 обязан быть одинаковым, раз совпадают IoU и Dice
    - У второй модели Boundary F1 будет выше, поскольку отклонение контура не влияет на эту метрику
    - Сравнить границы можно только по pixel accuracy
