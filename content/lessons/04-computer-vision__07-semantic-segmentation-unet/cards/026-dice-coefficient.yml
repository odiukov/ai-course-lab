- concept: Dice вычисляется как удвоенное пересечение, делённое на сумму размеров масок
  question: Предсказанная маска содержит 72 пикселя, эталонная — 54 пикселя, а их пересечение — 36 пикселей. Чему примерно равен Dice coefficient?
  explanation: 'Удваиваем пересечение: 36 + 36 = 72. Сумма размеров масок равна 72 + 54 = 126, поэтому Dice = 72 / 126 ≈ 0,57.'
  kind: numeric
  answer: 0.57
  tolerance: 0.01
  id: 026-dice-coefficient-1
  fingerprint: e66d5811
- concept: истинно отрицательные фоновые пиксели не влияют на Dice
  question: Почему добавление вокруг изображения большой области фона, которую модель правильно распознаёт как фон, не увеличивает Dice для маски объекта?
  explanation: В формуле Dice нет количества истинно отрицательных пикселей. Поэтому огромный общий фон не может скрыть лишние или пропущенные части объекта.
  kind: open
  reference: Dice зависит только от размеров предсказанной и эталонной масок и их пересечения. Пиксели, не входящие ни в одну маску, не меняют ни числитель, ни знаменатель, поэтому правильно распознанный дополнительный фон не влияет на оценку.
  id: 026-dice-coefficient-2
  fingerprint: 1645eb58
