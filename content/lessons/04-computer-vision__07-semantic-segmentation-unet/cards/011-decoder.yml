- concept: этап decoder удваивает каждое пространственное измерение карты признаков
  question: Карта признаков перед очередным этапом decoder имеет размер 7×9. Какой размер она получит, если этап удваивает высоту и ширину?
  explanation: Увеличение высоты и ширины вдвое превращает карту 7×9 в 14×18. Общее число пространственных позиций при этом возрастает вчетверо.
  kind: choice
  options:
    - 14×18
    - 7×18
    - 14×9
    - 28×36
  correct: 0
  id: 011-decoder-1
  fingerprint: 9a87053c
- concept: финальная проекция создаёт для каждого пикселя отдельную оценку каждого класса
  question: Заполни размерность канала в тензоре выходных логитов сегментационной сети.
  explanation: Decoder возвращает пространственную сетку полного разрешения, а финальная свёртка переводит её признаки в num_classes каналов. Поэтому в каждой позиции есть по одному логиту для каждого класса.
  kind: cloze
  template: logits.shape = [batch_size, ___, height, width]
  answer: num_classes
  accept:
    - число классов
    - количество классов
    - n_classes
  id: 011-decoder-2
  fingerprint: f4effa8d
