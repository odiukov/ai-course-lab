- concept: перекрытие и смешивание предсказаний уменьшают артефакты на границах тайлов
  question: Расположи этапы тайловой сегментации большого изображения в правильном порядке.
  explanation: Перекрытие даёт несколько предсказаний для пограничных областей. Их усреднение или плавное смешивание снижает влияние неполного контекста у краёв тайлов и делает швы менее заметными.
  kind: order
  items:
    - Разбить изображение на перекрывающиеся тайлы
    - Получить маску для каждого тайла
    - Совместить маски в координатах исходного изображения
    - Смешать предсказания в областях перекрытия
  id: 041-tiles-dilation-1
  fingerprint: cd61142b
- concept: dilated-свёртка расширяет рецептивное поле без увеличения ядра и числа его весов
  question: Как dilated-свёртка увеличивает область входа, влияющую на один выходной признак?
  explanation: Dilation разносит точки выборки фиксированного ядра по большей области. Поэтому рецептивное поле растёт, хотя размер ядра и число обучаемых весов не меняются.
  kind: choice
  options:
    - Добавляет промежутки между позициями, к которым применяется ядро
    - Увеличивает число классов в выходной маске
    - Обрабатывает каждый тайл несколько раз с разными метками
    - Заменяет свёртку интерполяцией всей карты признаков
