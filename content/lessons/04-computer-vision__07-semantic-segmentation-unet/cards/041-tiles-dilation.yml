- concept: тайлинг и dilation решают проблему памяти разными механизмами
  question: Объясни своими словами, почему dilated-свёртки не заменяют тайлинг как способ непосредственного сокращения расхода памяти.
  explanation: Тайлы ограничивают объём данных одного прямого прохода. Dilated-свёртки меняют соотношение между пространственным разрешением и рецептивным полем, однако сами по себе не устраняют стоимость хранения больших карт признаков.
  kind: open
  reference: Тайлинг уменьшает площадь изображения, одновременно проходящую через сеть, поэтому напрямую сокращает размеры промежуточных карт. Dilation расширяет рецептивное поле без дополнительного уменьшения разрешения, но карты высокого разрешения по-прежнему нужно хранить, поэтому экономия памяти не гарантирована.
