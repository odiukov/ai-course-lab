  question: Какое преимущество обычно даёт последовательность малых свёрток с активацией между ними по сравнению с одной более широкой свёрткой при сопоставимом рецептивном поле?
  explanation: Составленные последовательно малые ядра могут охватить ту же область входа, что и более широкое ядро, но требуют меньше весов. Активация между свёртками добавляет ещё одно нелинейное преобразование.
