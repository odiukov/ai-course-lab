- concept: локальных признаков недостаточно для разрешения неоднозначных участков изображения
  question: Почему сегментационная сеть, использующая только признаки из маленькой окрестности каждого пикселя, может сохранять резкие края, но ошибаться в классах внешне похожих участков?
  explanation: Высокое пространственное разрешение помогает локализовать границу, но само по себе не раскрывает смысл участка. Для правильной классификации неоднозначных пикселей сети нужен контекст более крупной области.
  kind: open
  reference: Маленькая окрестность содержит детали, но не показывает окружение и структуру всей сцены. Поэтому одинаковые по цвету или текстуре участки могут получить один класс, хотя глобальный контекст указывает на разные объекты.
