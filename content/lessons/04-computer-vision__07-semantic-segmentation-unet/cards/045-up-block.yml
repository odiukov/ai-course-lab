- concept: увеличение с фиксированным масштабом не всегда обращает округление пространственных размеров при пулинге
  question: Почему после билинейного увеличения с фиксированным масштабом карта decoder может не совпасть по высоте или ширине с картой skip connection?
  explanation: Если исходная сторона не делится на общий коэффициент сжатия U-Net, последовательность уменьшений округляет её. Обратное увеличение по фиксированному коэффициенту может дать расхождение на строку или столбец; интерполяция до размера skip устраняет его перед конкатенацией.
  kind: open
  reference: Пулинг округляет размеры и может потерять информацию о нечётной стороне. Увеличение с фиксированным масштабом не восстанавливает потерянную строку или столбец, поэтому карту decoder нужно дополнительно интерполировать до точного пространственного размера skip.
  id: 045-up-block-1
  fingerprint: 7fea9d05
- concept: несоответствие числа каналов является ошибкой архитектуры и не должно исправляться пространственной интерполяцией
  question: Высота и ширина тензоров decoder и skip совпадают, но после их объединения число каналов не соответствует входу следующего DoubleConv. Как следует обрабатывать такую ситуацию?
  explanation: F.interpolate изменяет высоту и ширину, но не исправляет архитектурное число каналов. DoubleConv должен быть создан для суммы каналов обоих потоков; несоответствие этой сумме указывает на ошибку конфигурации.
  kind: choice
  options:
    - 'Не пытаться исправлять её интерполяцией: проверить конфигурацию каналов и позволить слою сообщить об ошибке'
    - Интерполировать тензор decoder до пространственного размера skip
    - Молча отбросить лишние каналы перед объединением
    - Повторять каналы меньшего тензора, пока их количества не сравняются
