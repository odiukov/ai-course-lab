- concept: кросс-энтропия сегментации усредняет отрицательные логарифмы вероятностей правильных классов по пикселям
  question: Для двух пикселей модель назначила правильным классам вероятности 0.8 и 0.2. Чему равен средний кросс-энтропийный loss?
  explanation: Вклады пикселей равны −ln(0.8) ≈ 0.223 и −ln(0.2) ≈ 1.609. Их среднее равно примерно 0.916.
  kind: numeric
  answer: 0.916
  tolerance: 0.002
  id: 023-pixel-cross-entropy-1
  fingerprint: 02e78aa2
- concept: все пиксельные классификации используют общие параметры одной сегментационной сети
  question: Объясни своими словами, почему обучение семантической сегментации можно считать множеством пиксельных классификаций, но нельзя считать обучением отдельной модели для каждого пикселя.
  explanation: Классификационные решения относятся к разным позициям сетки, но не имеют отдельных наборов параметров. Общие веса позволяют обучающему сигналу со всей маски совместно улучшать одну модель.
  kind: open
  reference: Каждая пространственная позиция даёт отдельное предсказание класса и отдельный вклад в loss, однако все эти предсказания вычисляет одна сеть с общими весами. Градиенты от пикселей объединяются, а обновление изменяет одни и те же параметры модели.
  id: 023-pixel-cross-entropy-2
