  reference: 'Последняя пространственная ось не совпадает: для части пикселей логитов нет соответствующей целевой метки либо наоборот. Маска должна иметь форму `(B, Y, X)`, чтобы каждому вектору классов соответствовал ровно один индекс правильного класса.'
