- concept: размеры порции и пространственные размеры логитов и целевой маски должны совпадать
  question: Модель вернула логиты формы `(B, K, Y, X)`, а целевая маска имеет форму `(B, Y, Z)`. Объясните, почему кросс-энтропию нельзя корректно вычислить при `X ≠ Z`.
  explanation: Кросс-энтропия сопоставляет предсказание и целевой класс отдельно в каждой позиции порции и изображения. Поэтому оси порции, высоты и ширины обязаны совпадать; только ось классов присутствует исключительно в логитах.
