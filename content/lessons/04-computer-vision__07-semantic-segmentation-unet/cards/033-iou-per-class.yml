- concept: IoU класса вычисляется как отношение пересечения масок к их объединению
  question: Эталонная маска класса содержит 16 пикселей, предсказанная — 19, а их пересечение состоит из 11 пикселей. Чему равен IoU с округлением до сотых?
  explanation: 'Размер объединения равен 16 + 19 − 11 = 24: общие пиксели нельзя учитывать дважды. Поэтому IoU = 11 / 24 ≈ 0,46.'
  kind: numeric
  answer: 0.46
  tolerance: 0.01
  id: 033-iou-per-class-1
  fingerprint: 028688fd
- concept: IoU не определён, когда и эталонная, и предсказанная маски класса пусты
  question: Для некоторого класса и эталонная, и предсказанная маски пусты. Как корректно трактовать IoU этого класса на данном изображении?
  explanation: Пересечение и объединение пустых масок имеют нулевой размер, поэтому отношение не определено. Обычно такой случай пропускают при агрегировании либо обрабатывают по явно заданному правилу протокола оценки.
  kind: choice
  options:
    - Как идеальное распознавание класса
    - 'Как неопределённое значение: на изображении нет пикселей этого класса для оценки'
    - Как полный провал распознавания класса
  correct: 1
