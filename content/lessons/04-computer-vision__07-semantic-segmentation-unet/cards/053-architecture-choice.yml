- concept: заявленное лидерство архитектуры на бенчмарках не заменяет сравнение на целевых данных
  question: Почему статус SegFormer как сильной современной архитектуры недостаточен, чтобы без эксперимента предпочесть его U-Net для конкретного проекта?
  explanation: Архитектуры могут по-разному вести себя на конкретных классах, объёме данных и разрешении изображений. Выбор подтверждают целевой метрикой на собственной валидации и проверкой эксплуатационных ограничений.
  kind: open
  reference: Результаты на чужих бенчмарках не гарантируют преимущества на целевом распределении данных и при ограничениях проекта. Модели нужно сравнить по единому протоколу на собственной валидационной выборке, учитывая качество, память, скорость и сложность обучения.
