- concept: усреднение батчевых IoU и IoU по всему датасету используют разное взвешивание
  question: Почему среднее арифметическое определённых IoU по батчам может отличаться от IoU, вычисленного после накопления пересечений и объединений по всему датасету?
  explanation: Батч с маленьким объединением влияет на обычное среднее так же, как батч с большим. Если сложить пересечения и объединения отдельно, каждый пиксель объединения получает одинаковый вес, поэтому результат соответствует IoU по всему датасету.
  kind: choice
  options:
    - Среднее по батчам даёт каждому батчу одинаковый вес, а итоговое отношение фактически взвешивает их по размерам объединений
    - При накоплении пересечений функция softmax начинает нормировать вероятности по батчам
    - Среднее по батчам учитывает истинно отрицательные пиксели, а итоговое отношение их отбрасывает
    - Итоговое отношение автоматически заменяет все ложноположительные пиксели истинноположительными
