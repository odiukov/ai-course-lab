- concept: память карты признаков пропорциональна произведению высоты, ширины и числа каналов
  question: Высоту и ширину карты признаков увеличили в 1.5 раза, а число каналов — втрое. Во сколько раз выросло количество хранимых значений?
  explanation: Число значений равно H × W × C. Поэтому рост составляет 1.5 × 1.5 × 3 = 6.75 раза. В частности, удвоение обеих сторон изображения при неизменном числе каналов увеличивает объём карты в четыре раза.
  kind: numeric
  answer: 6.75
  tolerance: 0.01
  id: 040-pamyat-razreshenie-1
  fingerprint: 3f0da5d0
- concept: обучение U-Net требует памяти для сохранённых активаций и карт skip connections
  question: Объясни своими словами, почему один и тот же U-Net обычно требует заметно больше видеопамяти при обучении, чем при инференсе.
  explanation: Память занимают не только параметры и вход. Обратному проходу нужны сохранённые активации, а decoder позже использует карты encoder через skip connections. Поэтому обучение U-Net с входом 256×256 и базой 64 канала расходует существенно больше памяти, чем только прямой проход.
  kind: open
  reference: При обучении промежуточные активации сохраняются до обратного прохода, чтобы вычислить градиенты. Кроме того, U-Net должен удерживать карты encoder для последующих skip connections. При инференсе градиенты не вычисляются, поэтому многие промежуточные данные можно освобождать раньше.
  id: 040-pamyat-razreshenie-2
  fingerprint: fd11ef54
