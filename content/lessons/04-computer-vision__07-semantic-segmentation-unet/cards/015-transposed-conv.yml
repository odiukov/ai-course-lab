- concept: транспонированная свёртка обучает само преобразование увеличения, а билинейная интерполяция использует фиксированное правило
  question: Объясни своими словами, почему ConvTranspose2d называют обучаемым увеличением, а bilinear upsample — фиксированным, даже если после интерполяции стоит обычная свёртка.
  explanation: Различие относится к самому этапу изменения разрешения. У транспонированной свёртки этот этап параметризован весами, а у билинейной интерполяции он детерминирован; обучаемой остаётся только следующая за ней свёртка.
  kind: open
  reference: 'ConvTranspose2d строит увеличенную карту с помощью обучаемого ядра: его веса непосредственно определяют вклад входных ячеек в выходные. Bilinear upsample сам по себе не имеет обучаемых параметров и вычисляет новые значения по фиксированному правилу интерполяции; следующая свёртка обучает обработку уже увеличенной карты.'
  id: 015-transposed-conv-2
  fingerprint: 2ac83301
