- concept: skip connection соединяет уровни с одинаковым пространственным разрешением
  question: Какую карту encoder следует передать через skip connection на конкретный уровень decoder?
  explanation: 'Одинаковое пространственное разрешение сохраняет соответствие позиций: признаки в каждой ячейке encoder относятся к той же области изображения, что и ячейка decoder.'
  kind: choice
  options:
    - Карту с той же высотой и шириной, что и у текущей карты decoder
    - Карту с ближайшего к bottleneck уровня независимо от её размера
    - Одну и ту же карту bottleneck для всех уровней decoder
  correct: 0
  id: 013-unet-schema-1
  fingerprint: e7a351a1
- concept: конкатенация skip-признаков по каналам сохраняет пространственные размеры и складывает числа каналов
  question: Заполни размерность результата конкатенации карты encoder и карты decoder по оси каналов.
  explanation: Карты одного масштаба имеют общие высоту и ширину. При склейке по оси каналов эти размеры не меняются, а каналы обеих карт объединяются.
  kind: cloze
  template: concat(E_s, D_s) → H_s × W_s × ___
  answer: (C_E + C_D)
  accept:
    - C_E + C_D
    - C_D + C_E
    - (C_D + C_E)
