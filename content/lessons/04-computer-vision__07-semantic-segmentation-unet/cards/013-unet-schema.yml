- concept: число каналов растёт в encoder и уменьшается в decoder
  question: Как меняется число каналов признаков при прохождении U-Net от входной части к bottleneck и затем к выходной части?
  explanation: Encoder накапливает больше типов высокоуровневых признаков в каналах. Decoder по мере восстановления пространственной сетки сокращает их число перед финальным преобразованием в каналы классов.
  kind: open
  reference: В encoder число каналов последовательно увеличивается, достигая максимума в bottleneck, а в decoder уменьшается в обратном направлении.
