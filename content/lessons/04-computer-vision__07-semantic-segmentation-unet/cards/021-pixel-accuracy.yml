- concept: pixel accuracy равна доле пикселей с правильно предсказанным классом
  question: В эталонной маске 1600 пикселей. Модель правильно определила класс для 1392 из них. Чему равна pixel accuracy в процентах?
  explanation: 'Pixel accuracy вычисляется как число правильных предсказаний, делённое на общее число пикселей: 1392 / 1600 = 0,87, то есть 87%.'
  kind: numeric
  answer: 87
  tolerance: 0.1
  id: 021-pixel-accuracy-1
  fingerprint: 63fd4da8
- concept: pixel accuracy модели следует сравнивать с наивной стратегией предсказания доминирующего класса
  question: Фон занимает 94% проверочной выборки. Модель получила pixel accuracy 92%. Какой вывод обоснован?
  explanation: Стратегия «везде фон» получила бы 94%, поэтому результат модели 92% не выглядит сильным даже по этой метрике. Кроме того, общая pixel accuracy не показывает, обнаруживает ли модель редкие классы.
  kind: choice
  options:
    - Модель надёжно распознаёт редкие объекты, поскольку её accuracy превышает 90%
    - По pixel accuracy модель уступает стратегии «предсказывать везде фон», а качество редких классов нужно проверять отдельно
    - Модель обязательно превосходит наивную стратегию, поскольку умеет предсказывать несколько классов
    - Сравнивать модель с предсказанием одного класса можно только по значению функции потерь
  correct: 1
  id: 021-pixel-accuracy-2
  fingerprint: 4ce88388
