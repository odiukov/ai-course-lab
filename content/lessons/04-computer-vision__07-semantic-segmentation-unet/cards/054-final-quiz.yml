- concept: польза добавления Dice для класса измеряется изменением его IoU в парном сравнении
  question: 'После добавления Dice к базовой функции потерь IoU изменился так: фон — с 0.93 до 0.94, объект — с 0.68 до 0.76, граница — с 0.41 до 0.55. Какому классу Dice помог сильнее всего?'
  explanation: Прирост IoU равен 0.01 для фона, 0.08 для объекта и 0.14 для границы. Сравнивать нужно изменения одного класса между вариантами обучения, а не только итоговые абсолютные значения.
  kind: choice
  options:
    - Фону
