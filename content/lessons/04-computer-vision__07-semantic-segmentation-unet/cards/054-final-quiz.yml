- concept: синтетическая импульсная проба выявляет периодический отклик обучаемого up-блока
  question: Расположите действия для проверки up-блока с транспонированной свёрткой на шахматные артефакты.
  explanation: Импульсная проба отделяет свойства операции увеличения от содержания изображения. Периодически различающиеся отклики соседних фаз указывают, что up-блок способен создавать решётчатый рисунок.
