- concept: предобучение переносит в сегментационную модель признаки encoder, а decoder и выходная голова осваивают новую задачу
  question: Что происходит при создании U-Net с encoder, предобученным на классификации изображений?
  explanation: Предобученные веса encoder помогают распознавать универсальные края, текстуры и формы. Decoder и последний слой не знают классов новой сегментационной задачи, поэтому их необходимо обучить на целевых масках.
  kind: choice
  options:
    - Вся сеть уже умеет предсказывать маски нужных классов и не требует обучения
    - Encoder предоставляет ранее изученные признаки, а decoder и выходной слой обучаются преобразовывать их в целевые маски
    - Предобученные веса автоматически преобразуют разметку в требуемый формат
    - Обучается только encoder, а decoder остаётся неизменным
  correct: 1
  id: 052-smp-unet-1
  fingerprint: 96432a01
- concept: замена реализации модели не требует менять остальной конвейер при сохранении контракта входов и выходов
  question: Почему при замене самописного U-Net на smp.Unet обычно можно сохранить загрузчик данных, функцию потерь и метрики?
  explanation: Компоненты конвейера зависят от формата входа и выхода модели, а не от внутреннего устройства encoder и decoder. Если число входных каналов и классов настроено правильно, прежние маски, loss и метрики остаются совместимыми.
  kind: open
  reference: Обе модели получают изображения того же формата и возвращают пространственные логиты для тех же классов. Поэтому формат входов и целевых масок, а также правила вычисления loss и метрик не меняются.
  id: 052-smp-unet-2
  fingerprint: 25a87c8b
- concept: эффект предобученного encoder проверяют контролируемым сравнением моделей
  question: Как корректнее всего проверить, улучшает ли предобученный encoder качество сегментации по сравнению с обучением с нуля?
  explanation: Одинаковые данные, метрика и условия оценки изолируют влияние предобучения. Иначе различие mIoU может объясняться разметкой, составом выборки или способом вычисления метрики, а не encoder.
  kind: choice
  options:
    - Обучить модели на разных наборах данных и сравнить лучшие опубликованные значения метрик
    - Для предобученной модели выбрать более простую валидационную выборку
    - Сравнить модели на одном разбиении данных и по одной метрике, сохранив остальные существенные условия эксперимента
    - Оценить только скорость уменьшения обучающего loss
  correct: 2
  id: 052-smp-unet-3
  fingerprint: 82acafed
