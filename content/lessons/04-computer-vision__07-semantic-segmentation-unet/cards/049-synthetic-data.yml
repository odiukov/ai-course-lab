- concept: успешный синтетический smoke test подтверждает работоспособность конвейера, но не качество на реальных данных
  question: Объясни своими словами, что можно и чего нельзя заключить, если сегментационная сеть успешно обучилась на простых синтетических фигурах.
  explanation: Простые круги и квадраты изолируют базовую работоспособность конвейера. Успех на них помогает отделить программную ошибку от сложности задачи, но не доказывает обобщение на настоящие снимки.
  kind: open
  reference: 'Можно заключить, что загрузка данных, согласование изображений и масок, архитектура, функция потерь и обучение в целом способны работать совместно. Нельзя заключить, что модель справится с реальными изображениями: синтетика не воспроизводит их текстуры, освещение, шум, разнообразие объектов и сдвиг распределения.'
  id: 049-synthetic-data-2
  fingerprint: 1f03d20d
- concept: фотометрический шум изменяет входное изображение, но не дискретную целевую маску
  question: В синтетический сегментационный датасет добавляют небольшой случайный фотометрический шум. Как правильно обработать изображение и целевую маску?
  explanation: Шум моделирует вариативность наблюдаемого изображения. Маска содержит точные дискретные классы пикселей, поэтому вещественный шум сделал бы целевые метки некорректными.
  kind: choice
  options:
    - Добавить одинаковый вещественный шум и к изображению, и к индексам классов в маске
    - Добавить шум только к маске, чтобы сделать границы менее резкими
    - Добавить шум к изображению, а целочисленные метки маски оставить неизменными
  correct: 2
  id: 049-synthetic-data-3
  fingerprint: 0812140d
