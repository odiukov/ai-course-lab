- concept: билинейная интерполяция вычисляет новые значения по ближайшим соседям с учётом расстояния до них
  question: Как bilinear upsample вычисляет значение в новой позиции карты признаков?
  explanation: Билинейная интерполяция использует фиксированное взвешенное усреднение соседних значений. Веса определяются расстоянием до новой позиции и не обучаются.
  kind: choice
  options:
    - Копирует значение случайно выбранного соседнего элемента
    - Вычисляет взвешенную комбинацию ближайших значений, отдавая больший вес более близким
    - Обучает отдельный параметр для каждой новой позиции
    - Выбирает максимальное значение во всей карте признаков
  correct: 1
  id: 016-bilinear-upsample-1
  fingerprint: 6aaefe10
- concept: свёртка после билинейного увеличения обучается локально уточнять сглаженные признаки и смешивать каналы
  question: Объясни своими словами, зачем после bilinear upsample в декодере U-Net ставят обычную свёртку.
  explanation: Интерполяция отвечает только за предсказуемое увеличение карты. Обучаемая свёртка затем адаптирует её содержимое к задаче сегментации и помогает восстановить полезные локальные детали.
  kind: open
  reference: 'Bilinear upsample меняет пространственное разрешение по фиксированному правилу, но может сглаживать детали. Следующая свёртка обучается обрабатывать локальные окрестности: уточнять контуры, смешивать каналы и устранять нежелательное размытие.'
  id: 016-bilinear-upsample-2
  fingerprint: 9f25d58c
