- concept: средний loss эпохи нужно взвешивать по числу примеров в батчах
  question: 'В эпохе было два батча: в первом 45 примеров со средним loss 0.4, во втором 15 примеров со средним loss 1.1. Чему равен средний loss по всем примерам эпохи?'
  explanation: 'Средние по батчам взвешивают их размерами: (45 × 0.4 + 15 × 1.1) / 60 = 0.575. Простое среднее двух значений дало бы слишком большой вес меньшему батчу.'
  kind: numeric
  answer: 0.575
  tolerance: 0.001
