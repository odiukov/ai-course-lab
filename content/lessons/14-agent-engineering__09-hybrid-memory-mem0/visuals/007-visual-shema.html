<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Гибридная память: песочные часы</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1c1c22; --mute:#5c5c6b;
    --line:#8a8a9c; --vec:#2f6fd0; --kv:#1f8a5a; --gr:#b3541e; --fuse:#7a3fbf;
    --box:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161b; --fg:#eceef4; --mute:#a3a8b8;
      --line:#7b8296; --vec:#7fb0ff; --kv:#5fd39a; --gr:#f0a06a; --fuse:#c39aff;
      --box:#1d212a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  text{font:12px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);}
  .mute{fill:var(--mute);font-size:11px;}
  .fail{padding:10px;border:1px solid var(--line);border-radius:6px;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Гибридная память: одна точка входа, три хранилища, один скоринг</h2>
  <div id="host"><svg id="d" viewBox="0 0 760 500" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Схема песочных часов: add расходится в три хранилища, search сходится в скоринговый слой"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    var S=document.getElementById("d"), NS="http://www.w3.org/2000/svg";

    // ---- данные схемы (единицы схемы) ----
    var D={
      entry:{x:0,y:6,label:"add(text)"},
      parse:{x:0,y:4.6,label:"разбор на факты"},
      stores:[
        {x:-3.4,y:2.6,key:"вектор",ms:"80 мс",color:"var(--vec)",tag:"v"},
        {x: 0.0,y:2.6,key:"KV",   ms:"1 мс", color:"var(--kv)", tag:"k"},
        {x: 3.4,y:2.6,key:"граф", ms:"40 мс",color:"var(--gr)", tag:"g"}
      ],
      fuse:{x:0,y:0.9,label:"сплавляющий скоринг"},
      out:{x:0,y:-0.4,label:"search(query) ≈ 80 мс"},
      bw:1.5, bh:0.62
    };
    var origin={x:380,y:430}, scale={x:78,y:66};
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    var PAD=6, LW=1.6;

    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);S.appendChild(e);return e;}
    function txt(x,y,s,anchor,cls){var t=el("text",{x:x,y:y,"text-anchor":anchor||"middle"});if(cls)t.setAttribute("class",cls);t.textContent=s;return t;}
    function box(cx,cy,w,h,color){
      el("rect",{x:sx(cx-w/2),y:sy(cy+h/2),width:sx(cx+w/2)-sx(cx-w/2),
        height:sy(cy-h/2)-sy(cy+h/2),rx:6,fill:"var(--box)",stroke:color,"stroke-width":LW});
    }
    function arrow(x1,y1,x2,y2,color,head){
      el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:color,"stroke-width":LW,"stroke-linecap":"round"});
      if(head===false)return;
      // наконечник строим из точек в единицах схемы
      var dx=sx(x2)-sx(x1), dy=sy(y2)-sy(y1), L=Math.hypot(dx,dy)||1;
      var ux=dx/L, uy=dy/L, hx=sx(x2), hy=sy(y2), a=9, b=4.2;
      el("polygon",{points:[hx,hy,hx-a*ux+b*uy,hy-a*uy-b*ux,hx-a*ux-b*uy,hy-a*uy+b*ux].join(" "),fill:color});
    }

    // ---- верх: вход и разбор ----
    box(D.parse.x,D.parse.y,3.0,D.bh,"var(--line)");
    txt(sx(D.parse.x),sy(D.parse.y)+4,D.parse.label,"middle");
    arrow(D.entry.x,D.entry.y,D.parse.x,D.parse.y+D.bh/2,"var(--line)");
    txt(sx(D.entry.x)+PAD,sy(D.entry.y),D.entry.label,"start");
    txt(sx(D.entry.x)-PAD,sy(D.entry.y),"один вход","end","mute");

    // ---- хранилища + стрелки записи (вниз) и чтения (вверх) ----
    D.stores.forEach(function(s){
      box(s.x,s.y,D.bw,D.bh,s.color);
      txt(sx(s.x),sy(s.y)+4,s.key,"middle");

      // запись: разбор -> хранилище
      arrow(D.parse.x,D.parse.y-D.bh/2, s.x, s.y+D.bh/2, "var(--line)");

      // чтение: хранилище -> скоринг
      arrow(s.x, s.y-D.bh/2, D.fuse.x + (s.x>0?0.9:(s.x<0?-0.9:0)), D.fuse.y+D.bh/2, s.color);

      // задержка: слева у левого блока, справа у правого, снизу-центр у KV
      if(s.x<0)      txt(sx(s.x-D.bw/2)-PAD, sy(s.y)+4, s.ms, "end", "mute");
      else if(s.x>0) txt(sx(s.x+D.bw/2)+PAD, sy(s.y)+4, s.ms, "start", "mute");
      else           txt(sx(s.x), sy(s.y-D.bh/2)-PAD, s.ms, "middle", "mute");
    });
    txt(sx(D.stores[0].x-D.bw/2)-PAD, sy(D.stores[0].y+D.bh/2)-PAD, "три копии факта","start","mute");

    // ---- низ: скоринговый слой и выход ----
    box(D.fuse.x,D.fuse.y,3.6,D.bh,"var(--fuse)");
    txt(sx(D.fuse.x),sy(D.fuse.y)+4,D.fuse.label,"middle");
    arrow(D.out.x,D.fuse.y-D.bh/2,D.out.x,D.out.y,"var(--fuse)");
    txt(sx(D.out.x)+PAD,sy(D.out.y)+4,D.out.label,"start");
    txt(sx(D.out.x)-PAD,sy(D.out.y)+4,"один выход","end","mute");

    // подписи двух узких мест — сбоку, разведены по вертикали
    txt(sx(D.parse.x+1.5)+PAD, sy(D.parse.y)+4, "узкое место 1","start","mute");
    txt(sx(D.fuse.x+1.8)+PAD, sy(D.fuse.y)+4, "узкое место 2","start","mute");

    // легенда одной строкой под схемой
    txt(sx(0), sy(-1.05), "вниз — запись (add) · вверх — чтение (search), три пути идут параллельно","middle","mute");
  }catch(e){
    host.innerHTML='<div class="fail">Схема-песочные часы: сверху один <b>add(text)</b> идёт в разбор на факты, оттуда стрелки расходятся в три хранилища — вектор (80 мс), KV (1 мс), граф (40 мс). Снизу три стрелки сходятся в один сплавляющий скоринговый слой, из него выходит один результат <b>search</b> ≈ 80 мс (по самому медленному пути, а не по сумме).</div>';
  }
})();
</script>
</body>
</html>
