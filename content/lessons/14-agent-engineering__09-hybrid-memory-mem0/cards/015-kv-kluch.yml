- concept: 'промах по ключу даёт пустой ответ, а не приближённый: KV не умеет частичного совпадения'
  question: 'Факт записан по ключу ("u77", "allergy", "peanut"). Пользователь спрашивает: «какую еду мне лучше не брать в поездку?». Что вернёт KV-хранилище и почему? Что из этого следует для маршрутизации запросов?'
  explanation: 'Плата за скорость доступа по ключу — требование точности ключа. Именно поэтому KV живёт рядом с вектором, а не вместо него: 1 мс против 80 мс выигрываются только на запросах, где адрес факта собирается из самой формулировки.'
  kind: open
  reference: 'Ничего. Из формулировки не выводятся ни fact_type, ни entity, значит ключ не собирается и обращения по адресу не происходит. KV не сравнивает и не приближает — он открывает ячейку по точному ключу либо не открывает ничего. Частичное или похожее совпадение ему недоступно, поэтому такой запрос обязан идти в векторное хранилище, где ответ ищется по смысловой близости. Отсюда правило: KV берёт запросы, из которых ключ выводится однозначно; всё остальное маршрутизируется в вектор или граф.'
  id: 015-kv-kluch-3
  fingerprint: dbccb533
