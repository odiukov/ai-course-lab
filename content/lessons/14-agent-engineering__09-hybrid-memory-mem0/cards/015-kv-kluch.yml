- concept: ключ факта состоит из владельца, рода факта и предмета, о котором факт
  question: Заполни пропуск в составном ключе KV-хранилища памяти.
  explanation: 'Ключ склеивается из трёх частей: user_id — чья память, fact_type — какого рода факт, entity — о чём именно речь. Ключ ("u77", "allergy", "peanut") адресует ровно одно значение. Важно, что ключ собирается по одному правилу и на записи, и на чтении — иначе запись существует, но недостижима.'
  kind: cloze
  template: 'kv[(user_id, fact_type, ___)] = value   # kv[("u77", "allergy", "peanut")]'
  answer: entity
  accept:
