- concept: система, которая задаёт уровни памяти, но требует принести свои векторный и графовый бэкенды, переносит администрирование хранилищ на команду, оставляя ей и свободу выбора
  question: Одна система долговременной памяти приходит с собственным набором хранилищ и управляемым облаком. Другая определяет только уровни памяти (оперативный, недавнее, архив), а векторный и графовый бэкенды команда подключает свои. Объясни своими словами, чем эти два варианта различаются по эксплуатационной нагрузке и по контролю.
  explanation: Letta даёт три уровня — core/recall/archival, — но бэкенды приносишь свои, то есть эксплуатация хранилищ остаётся на тебе. Mem0 в облаке отдаёт эксплуатацию наружу вместе с контролем; в self-host возвращает и то, и другое сразу тремя базами.
  kind: open
  reference: 'Первый вариант в облачном виде снимает эксплуатацию: обновления, бэкапы, дисковое место, отказы хранилищ — чужая забота, но и контроля над внутренностями почти нет, а данные лежат у поставщика. Второй не поставляет хранилищ вовсе: уровни памяти заданы, а поднимать, обновлять и бэкапить векторную базу и граф придётся самим — это ровно та же операционная нагрузка, что и у self-host. Взамен команда сама выбирает бэкенды под свою инфраструктуру и может заменить любой из них. Разница не в качестве поиска, а в том, сколько систем надо держать живыми и кто может дёргать за ручки.'
  id: 037-use-it-2
