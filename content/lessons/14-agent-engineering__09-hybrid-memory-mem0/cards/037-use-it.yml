- concept: своя сборка памяти оправдана нуждой в точном контроле над экстрактором фактов или весами сплавления, а не недовольством качеством поиска готовых систем
  question: В каком случае оправдано писать свою сборку гибридной памяти вместо готовой системы?
  explanation: 'Паттерн у своей сборки тот же самый, так что выиграть в качестве поиска она не обещает. Смысл в рычаге: комплаенс требует ровно знать и менять правила извлечения фактов, а голосовой агент — профиль весов с доминирующей свежестью. Платишь за этот рычаг полной эксплуатацией всех хранилищ. Лицензия сама по себе аргумента не даёт: Mem0 идёт под Apache 2.0.'
  kind: choice
  options:
    - Когда качество поиска у готовых систем измеримо ниже нужного продукту
    - Когда нужен точный контроль над экстрактором фактов (комплаенс) или над весами сплавления — например, у голосового агента, где свежесть должна давить остальные сигналы
    - Когда объём фактов слишком мал, чтобы оправдать три отдельные базы
    - Когда лицензия готовой системы не разрешает коммерческое использование
