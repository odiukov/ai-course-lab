- concept: 'порядок кандидатов задаётся весами, а не только сигналами: изменение веса одного слагаемого переставляет выдачу при неизменных relevance/importance/recency'
  question: 'Fusion-скор считается как w_r·relevance + w_i·importance + w_t·recency. Веса w_r = 0.35 и w_t = 0.25 зафиксированы, w_i настраивают. Кандидат A: relevance 0.8, importance 0.1, recency 0.3. Кандидат B: relevance 0.4, importance 0.9, recency 0.7. При каком значении w_i оба кандидата получат одинаковый скор?'
  explanation: 'Скор A = 0.35·0.8 + 0.25·0.3 + w_i·0.1 = 0.355 + 0.1·w_i. Скор B = 0.35·0.4 + 0.25·0.7 + w_i·0.9 = 0.315 + 0.9·w_i. Равенство: 0.04 = 0.8·w_i, значит w_i = 0.05. Ниже 0.05 первым идёт A, выше — B. Сами сигналы не менялись ни на йоту: порядок выдачи переставила только настройка веса, поэтому веса крутят под продукт, а не под запись.'
  kind: numeric
  answer: 0.05
  tolerance: 0.005
  id: 022-formula-summa-1
  fingerprint: 5a9f8cfd
- concept: при совпадении двух из трёх сигналов порядок двух кандидатов решает третий сигнал и не зависит от конкретных величин весов (пока его вес положителен)
  question: Два кандидата имеют одинаковую importance (0.6 у обоих) и одинаковую recency (0.45 у обоих). У первого relevance 0.7, у второго 0.25. Скор считается как w_r·relevance + w_i·importance + w_t·recency, все веса положительны. Что можно сказать об их взаимном порядке?
  explanation: 'Разность скоров = w_r·(0.7 − 0.25) + w_i·0 + w_t·0 = 0.45·w_r. Совпадающие слагаемые сокращаются, остаётся один член с положительным множителем. Поднимать w_i или w_t бесполезно: они прибавляют обоим кандидатам поровну. Веса переставляют кандидатов только там, где сигналы расходятся.'
  kind: choice
  options:
    - Первый всегда выше второго при любых положительных весах
    - Порядок зависит от того, насколько w_i больше w_r
    - Второй выйдет вперёд, если сильно поднять w_t
    - Определить нельзя, пока не известны все три веса численно
  correct: 0
