- concept: предел пропускной способности гибридной памяти задают общие точки схождения (извлечение фактов на записи, ранжирование на чтении), а не отдельные хранилища
  question: Инженер хочет ускорить гибридную память и заменяет графовый бэкенд на вдвое более быстрый. Выигрыш оказывается почти нулевым. Объясни, какие компоненты в такой архитектуре реально ограничивают производительность и почему замена одного хранилища этого не меняет.
  explanation: 'Форма архитектуры — сужение, расширение, сужение. Ветви в середине параллельны, значит их вклад в задержку берётся по максимуму и насыщается. Всё, что не параллелится, сидит в двух узких местах: разбор текста на факты и общее ранжирование кандидатов. Там же и точки отказа: упало извлечение фактов — не пишется ничего ни в одно хранилище.'
  kind: open
  reference: 'Хранилища опрашиваются параллельно и независимо, поэтому задержка чтения равна самому медленному из них: ускорение не-самого-медленного бэкенда ничего не даёт, а ускорение самого медленного лишь сдвигает узкое место на следующий. Настоящие общие точки — те, через которые проходит каждый запрос в одиночку: на записи это извлечение фактов из текста (шаг с LLM, самый дорогой в add), на чтении — слой сплавляющего скоринга, через который обязаны пройти все кандидаты перед отсечением. Хранилища в середине взаимозаменяемы и добавляемы именно потому, что вход и выход у них общие; оптимизировать надо вход и выход.'
