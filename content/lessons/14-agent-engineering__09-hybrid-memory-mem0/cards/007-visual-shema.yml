- concept: глобальное ранжирование требует слоя над хранилищами, потому что каждое хранилище видит только своих кандидатов и свою шкалу оценки
  question: В гибридной памяти векторный индекс, KV и граф возвращают своих кандидатов на один запрос. Почему итоговое ранжирование нельзя поручить самим хранилищам — например, брать по два лучших от каждого?
  explanation: 'Косинус 0.8 из вектора и вес пути 0.8 из графа — не одно и то же число, а фиксированные квоты «по столько-то от каждого» задают ответ до того, как он посчитан: если весь ответ лежит в графе, вектор всё равно займёт свои места. Сравнимость появляется только там, где к кандидатам применяют одну функцию с общими весами relevance/importance/recency, а этот слой по определению стоит над хранилищами, а не внутри одного из них.'
  kind: choice
  options:
    - Хранилища физически не умеют сортировать свою выдачу по оценке
    - Каждое хранилище оценивает кандидатов в собственной шкале (косинус, точное совпадение, вес пути) и не видит, что нашли остальные, поэтому сравнить записи между хранилищами можно только в общем слое сверху
    - Хранилища опрашиваются последовательно, и к моменту ответа последнего результаты первых уже устарели
    - Квоты по два кандидата нарушают лимит контекста модели
