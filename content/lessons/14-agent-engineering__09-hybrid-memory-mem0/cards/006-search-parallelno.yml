- concept: 'параллельный опрос возможен потому, что между хранилищами нет зависимости по данным: вход каждого выводится из самого запроса'
  question: Почему векторное, KV- и графовое хранилища в Mem0 можно опрашивать одновременно, а не по цепочке?
  explanation: 'Параллелизм упирается не в железо, а в зависимости по данным. KV собирает ключ из запроса, граф берёт сущности из запроса, вектор — embedding запроса. Ни одному не нужен ответ соседа, поэтому все три стартуют вместе. Ждёт только скоринг: ему нужны все три списка, чтобы сплавить их в один.'
  kind: choice
  options:
    - 'Потому что вход каждого хранилища выводится из самого запроса: ключ (user_id, type, entity) и сущности для обхода не требуют чужого результата'
    - Потому что все три хранилища физически лежат на одной машине и делят соединение
    - Потому что векторное хранилище заранее сообщает остальным, какие записи искать
    - Потому что скоринговый слой запускается до того, как хранилища ответят
