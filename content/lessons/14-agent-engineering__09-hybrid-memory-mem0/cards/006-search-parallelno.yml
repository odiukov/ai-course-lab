- concept: тройная запись факта — плата, вносимая на записи; на чтении дополнительное хранилище почти бесплатно, если не оно самое медленное
  question: 'Один факт при add() пишется в три хранилища сразу: втрое больше места и втрое больше работы. Какое следствие этого для чтения верно?'
  explanation: 'Запись оплачивается один раз и целиком: три вставки вместо одной. Чтение идёт параллельно, поэтому вклад третьего хранилища в задержку равен нулю, если оно отвечает быстрее лидера. Отсюда и смысл сделки: избыточность на записи покупает покрытие трёх классов запросов почти без потерь на чтении.'
  kind: choice
  options:
    - Тройная цена платится на записи; на search() третье хранилище почти не добавляет задержки, пока оно не оказывается самым медленным из трёх
    - search() тоже становится втрое медленнее, потому что читает все три копии факта
    - Задержка search() растёт пропорционально размеру самого большого хранилища
    - На чтении используется только одно хранилище, остальные две копии — резервные
