- concept: 'одно слагаемое relevance считается разными способами в зависимости от хранилища: сходство вектора, бинарное совпадение ключа, вес пути в графе'
  question: 'В гибридной памяти кандидаты пришли из трёх бэкендов: векторного, KV и графового. Что верно про слагаемое relevance в общем скоре?'
  explanation: Relevance — это роль в формуле, а не одна метрика. Ключ либо совпал, либо нет, поэтому у KV значение бинарное; в графе расстояние обхода задаёт вес пути — сосед в один шаг весит больше, чем сущность через двух посредников. Общая шкала достигается нормализацией кандидатов перед скорингом, а не единой метрикой в хранилищах.
  kind: choice
  options:
    - Для всех трёх кандидатов relevance считается одной и той же метрикой сходства, иначе числа несравнимы
    - У векторного кандидата это сходство эмбеддингов, у KV — бинарный исход совпадения ключа, у графового — вес пути до сущности запроса
    - У KV-кандидата relevance берётся из эмбеддинга его значения, потому что у ключа своей меры близости нет
    - Графовый кандидат вообще не имеет relevance и участвует в скоре только через importance и recency
  correct: 1
  id: 023-tri-izmereniya-1
  fingerprint: 262f39a3
- concept: importance — свойство самой записи, не зависящее от запроса, в отличие от relevance, которая определяется парой «запрос, запись»
  question: Один и тот же факт «номер паспорта пользователя — X» извлекается двумя разными запросами. Как при этом ведут себя его relevance и importance, и почему? Объясни своими словами.
  explanation: 'Три слагаемых берутся из трёх разных источников: relevance — из пары «запрос и запись», importance — из самой записи, recency — из часов. Смешать их источники нельзя: importance, зависящая от запроса, — это уже вторая релевантность.'
  kind: open
  reference: 'Relevance пересчитывается для каждого запроса: это функция пары «запрос, запись», и для разных запросов она разная. Importance от запроса не зависит вообще — это атрибут записи, проставленный на пути записи (флагом вручную или моделью/статистикой обращений) и хранящийся вместе с фактом. Поэтому у идентификаторов, имён, политик importance близка к максимуму постоянно, а у реплики вроде «сегодня дождь» — почти нулевая, независимо от того, чем её вытащили. Практическое следствие: importance можно посчитать один раз при записи, relevance — только в момент поиска.'
  id: 023-tri-izmereniya-2
  fingerprint: 740ae5f4
- concept: 'экспоненциальное затухание свежести: каждый период полураспада делит значение вдвое, поэтому давние записи различаются между собой всё слабее'
  question: Свежесть записи затухает экспоненциально с периодом полураспада 30 дней; сразу после обращения она равна единице. К записи не обращались 90 дней. Чему равна её свежесть?
  explanation: '90 дней = три периода полураспада, значит 1 · (1/2)^3 = 0.125. Тот же расчёт объясняет главное свойство экспоненты: разрыв между 90 и 120 днями — 0.125 против 0.0625, а между 900 и 1200 днями обе величины неотличимы от нуля. Свежесть различает недавнее и режет всё старое в один слой.'
  kind: numeric
  answer: 0.125
  tolerance: 0.005
  id: 023-tri-izmereniya-3
  fingerprint: 8950e6dc
