- concept: обход графа ведёт множество посещённых сущностей, иначе двусторонний матч на следующей глубине возвращается в исходную сущность и зацикливает поиск
  question: Расставь шаги обхода соседей в графовом хранилище памяти на глубину больше одного перехода.
  explanation: 'Матч по обоим концам ребра делает обход по сути ненаправленным: сосед, найденный на первом переходе, на втором переходе приведёт обратно в исходную сущность. Множество посещённых — единственное, что останавливает этот цикл. Фильтр валидности ставят до сбора соседей, а не после: иначе устаревшее ребро уже раскрутит целую ветку кандидатов.'
  kind: order
  items:
    - Отбросить рёбра, помеченные невалидными, чтобы устаревшие факты не попали в кандидаты
    - Найти рёбра, где сущность текущего фронта стоит в любом из двух концов
    - Взять противоположный конец ребра как соседа и отметить исходную сущность как посещённую
    - На следующем переходе разворачивать только тех соседей, которых ещё не посещали
