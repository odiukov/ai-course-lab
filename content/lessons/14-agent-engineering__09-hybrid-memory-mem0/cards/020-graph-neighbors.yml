  question: Рёбра хранятся четвёрками (subject, relation, object, valid); переезд пользователя не удаляет старое ребро, а снимает у него флаг. Заполни пропуск в сборе соседей для обычного (не временного) запроса.
  explanation: 'Инвалидация — это пометка, а не удаление: история нужна временным запросам («где пользователь жил раньше»). Значит обычный обход обязан отсекать valid=False сам, до сборки списка соседей. Без этого условия хранилище честно вернёт факт, который уже опровергнут, и скоринговый слой ранжирует его наравне с действующими.'
