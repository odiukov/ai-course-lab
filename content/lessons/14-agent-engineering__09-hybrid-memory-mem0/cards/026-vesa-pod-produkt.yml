- concept: 'профиль весов fusion-скора выбирается по цене промаха продукта: у комплаенс-агента старая запись действует, поэтому вес важности доминирует, а вес свежести прижимается к полу'
  question: Агент отвечает на вопросы по внутренним политикам организации. Регламент, принятый много лет назад и с тех пор не отменённый, обязателен к исполнению наравне с принятым в этом квартале. Какой профиль весов (relevance / importance / recency) для fusion-скора подходит такому агенту?
  explanation: 'Действующий статус документа не убывает со временем, поэтому затухание свежести здесь мешает: оно топит валидные старые регламенты. Разделять действующее и второстепенное умеет importance, помечаемая при записи, — её вес и поднимают. Первый профиль — чатовый (свежесть наверху), третий — retrieval-профиль (почти чистая релевантность), равные веса не отражают ни одного продуктового приоритета.'
  kind: choice
  options:
    - 38% / 14% / 48%
    - 32% / 56% / 12%
    - 84% / 8% / 8%
    - 34% / 33% / 33%
  correct: 1
  id: 026-vesa-pod-produkt-1
  fingerprint: 8a013e73
- concept: веса fusion-скора — нормированный бюджет с фиксированной суммой, поэтому рост одного веса оплачивается уменьшением остальных, а не добавляется поверх
  question: 'Веса fusion-скора нормированы: их сумма фиксирована. У агента сейчас relevance 46%, importance 38%, recency 16%. Продукт переводят в диалоговый режим и поднимают вес свежести на 22 процентных пункта, забирая добавку поровну из двух других весов. Каким станет вес relevance (в процентах)?'
  explanation: '22 пункта делятся поровну: по 11 с каждого из двух весов. relevance = 46 − 11 = 35%, importance = 38 − 11 = 27%, recency = 16 + 22 = 38%. Сумма сохраняется. Это ключевое свойство настройки: не три независимые ручки, а перераспределение одного бюджета — поднять свежесть можно только ослабив релевантность или важность.'
  kind: numeric
  answer: 35
  tolerance: 0.5
  id: 026-vesa-pod-produkt-2
  fingerprint: 83277ecb
- concept: когда два факта об одном атрибуте противоречат друг другу при равной релевантности и равной важности, единственный различающий их сигнал — свежесть, поэтому продукты с отменяющими друг друга фактами требуют высокого w_recency
  question: В памяти два факта об одном и том же атрибуте пользователя (язык интерфейса). Оба записаны как настройка профиля, то есть с одинаковой важностью; запросу «на каком языке отвечать» оба релевантны одинаково. Один записан давно, другой — сегодня, и он отменяет первый. Что определяет, какой факт всплывёт наверх?
  explanation: Скор — взвешенная сумма трёх слагаемых. Если два из трёх совпадают, их вклады сокращаются и исход решает третье — свежесть, при любом положительном её весе. Но с чатовым весом свежести разрыв получается большим и устойчивым, а с комплаенс-профилем (свежесть у пола) отставание старого факта почти незаметно, и он может остаться наверху из-за шума в релевантности. Importance помечается при записи и не растёт от того, что запись новая.
  kind: choice
  options:
    - Слагаемое свежести — при равных relevance и importance только оно различает записи, поэтому в продуктах с отменяющими фактами его вес поднимают выше остальных
    - Слагаемое важности — более новая запись автоматически получает большую importance
    - Слагаемое релевантности — точное совпадение атрибута перевесит любую разницу во времени
    - Порядок записи в хранилище — при равенстве скоров возвращается последняя добавленная запись
