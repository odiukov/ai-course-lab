- concept: близость по пересечению токенов даёт нулевой скор для синонимичных перефразировок без общих слов
  question: Векторное хранилище считает близость как долю общих токенов между запросом и записью. В памяти лежит запись «предпочитаю пряную кухню», пользователь спрашивает «что я люблю есть острого». Что вернёт такое хранилище и почему?
  explanation: 'Пересечение токенов — лексическая мера, а не семантическая. Настоящий эмбеддер отображает «острая еда» и «пряная кухня» в близкие точки пространства, потому что обучался на смысле. Мешок слов видит только строки: нет общих строк — нет близости. Это главная плата за отказ от модели-эмбеддера в учебной реализации.'
  kind: choice
  options:
    - 'Высокий скор: обе фразы про еду, и хранилище улавливает эту тему'
    - 'Нулевой или почти нулевой скор: у мешков токенов нет общих слов, а смысл слов хранилищу недоступен'
    - 'Средний скор: длины фраз близки, и это компенсирует отсутствие общих слов'
    - 'Ошибку: сравнить фразы разной длины таким способом нельзя'
  correct: 1
  id: 009-embed-tokeny-1
  fingerprint: df932353
- concept: скор пересечения токенов считается как доля общих токенов от объединения множеств
  question: Наивное векторное хранилище оценивает близость как |A ∩ B| / |A ∪ B|, где A и B — множества токенов запроса и записи. В запросе 7 различных токенов, в записи 9 различных токенов, общих у них 5. Чему равен скор?
  explanation: 'Объединение = 7 + 9 − 5 = 11, пересечение = 5, скор = 5/11 ≈ 0.45. Важно, что мера зависит только от состава множеств: ни порядок токенов, ни их позиции в фразе в неё не входят.'
  kind: numeric
  answer: 0.45
  tolerance: 0.02
  id: 009-embed-tokeny-2
  fingerprint: fb233c71
- concept: мешок токенов не сохраняет порядок слов, поэтому любые перестановки одной фразы неразличимы для хранилища
  question: 'Фраза нормализуется в множество токенов: нижний регистр, снятие пунктуации, разрез по пробелам. Две записи — «собака укусила почтальона» и «почтальона укусила собака». Как их различит такое хранилище при поиске?'
  explanation: 'Слово «мешок» и означает потерю порядка: множество {собака, укусила, почтальона} одно и то же для обеих фраз. Кто кого укусил — информация о структуре, а не о составе, и наивное представление её не несёт. Настоящие эмбеддеры порядок учитывают, поэтому такие пары различают.'
  kind: choice
  options:
    - 'Никак: множества токенов совпадают, скоры к любому запросу будут одинаковы'
    - 'По первому токену: он входит в множество с большим весом'
    - По порядку слов, он сохраняется при разрезе по пробелам
    - Различит только если добавить в запрос знаки препинания
  correct: 0
  id: 009-embed-tokeny-3
  fingerprint: '67551436'
