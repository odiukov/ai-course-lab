- concept: релевантность KV-кандидата максимальна по построению (совпадение ключа бинарно), поэтому его место в общем рейтинге решают только важность и свежесть
  question: В общий рейтинг гибридной памяти попал кандидат из key-value-хранилища, найденный по точному ключу. Что это говорит о его позиции в итоговой выдаче?
  explanation: 'Совпадение ключа бинарно: попал или не попал, промежуточной уверенности нет. Значит, у любого KV-кандидата слагаемое релевантности прижато к потолку шкалы и одинаково для всех таких кандидатов — различает их только важность и свежесть. Первое место при этом не гарантировано: кандидат с релевантностью чуть ниже, но высокой важностью и свежестью, обгоняет его по взвешенной сумме.'
  kind: choice
  options:
    - Его слагаемое релевантности всегда максимально, поэтому относительно других кандидатов его двигают только важность и свежесть
    - Он всегда занимает первое место, потому что точное попадание сильнее любого приближённого
    - Его релевантность зависит от того, сколько символов ключа совпало с запросом
    - Он попадает в выдачу только если ни один векторный кандидат не набрал больше половины шкалы
