- concept: дубли в объединённом списке схлопываются по идентичности самой записи, а не по похожести текстов или совпадению скоров
  question: Объясни своими словами, по какому признаку в объединённом списке кандидатов гибридной памяти определяют, что две строки — это один и тот же факт, и почему нельзя опираться на схожесть их текстов.
  explanation: Схлопывание идёт по идентификатору записи. Дубли возникают не случайно, а из-за того, что факт пишется во все хранилища; поэтому идентичность известна точно и гадать по тексту не нужно. Если этого не делать, один факт займёт несколько мест в top-k и вытеснит другие ответы.
  kind: open
  reference: 'Дубли ищутся по идентичности записи — по её идентификатору (владелец, факт, версия), а не по тексту и не по скору. Причина дублей известна заранее: один факт при записи кладётся во все хранилища сразу, поэтому одна и та же запись возвращается разными ветками поиска в разных представлениях — вектором, значением по ключу, ребром графа. Схожесть текстов для этого не годится в обе стороны: два разных факта могут быть текстуально почти одинаковыми (два адреса одного пользователя) и слиплись бы ошибочно, а один и тот же факт в разных представлениях может выглядеть по-разному (текст записи против типизированного ребра) и не слился бы. Скоры тоже не признак: у одной записи они разные в разных хранилищах, а у разных записей могут совпадать. При склейке за кандидатом остаётся наибольшая нормированная релевантность.'
