- concept: бюджет пересчёта эмбеддингов распределяют по частоте обращения, потому что ущерб от дрейфа пропорционален участию записи в выдаче
  question: Пересчёт эмбеддингов всего корпуса дорог, поэтому его делают частично. Объясни своими словами, почему пересчитывают топ-N самых используемых записей, а не случайную выборку того же размера.
  explanation: 'Пересчёт — операция с фиксированной ценой за запись и очень разной отдачей. Приоритет по использованию превращает ограниченный бюджет в максимальное улучшение реальной выдачи. Побочный эффект: журнал обращений становится обязательной телеметрией памяти, иначе топ-N нечем считать.'
  kind: open
  reference: Дрейф вредит только там, где он виден в выдаче. Запись, к которой запросы фактически приходят, участвует в ранжировании постоянно, и её смещённый вектор портит ответы регулярно; запись из мёртвого хвоста стоит в пересчёте ровно столько же, но выигрыш от неё близок к нулю, потому что она всё равно не попадает в top-k. Частота обращения — дешёвая оценка ожидаемого ущерба, поэтому она и служит приоритетом при ограниченном бюджете пересчёта. Случайная выборка тратит тот же бюджет пропорционально размеру корпуса, а не пропорционально вреду.
  id: 034-drift-i-schema-2
  fingerprint: 3e761f95
- concept: неконтролируемый рост набора значений type раскалывает ключевое пространство KV на синонимы, и лечится это закрытым реестром типов с ревизией и миграцией записей, а не правкой кода чтения
  question: В общую KV-память пишут четыре продуктовые команды. Одна кладёт факты с type="food_allergy", другая — "allergy", третья — "health.allergy". Каждый вариант разумен сам по себе. Какова природа проблемы и что её устраняет?
  explanation: 'Это schema creep: схема портится не кодом, а свободой писателей, поэтому ни один код-ревью и ни один регрессионный тест чтения её не поймает. Лечение организационное — тип из закрытого словаря, ревизия набора по расписанию, миграция старых записей к канону. Особенно коварно то, что промах ничем не кричит: сплавляющий скоринг просто складывается без KV-слагаемого, а векторная ветка возвращает правдоподобный суррогат.'
  kind: choice
  options:
    - Ключевое пространство разошлось на синонимичные значения type, и чтение по одному варианту не видит записи, положенные под другим; устраняет это закрытый согласованный список допустимых type с периодической ревизией и миграцией уже записанных фактов
    - 'Проблема в производительности: рост числа уникальных значений type увеличивает стоимость чтения по ключу, помогает шардирование хранилища'
    - 'Проблемы нет: при отсутствии точного ключа хранилище отдаёт запись с ближайшим по написанию type'
    - Проблема целиком на стороне векторной ветки, потому что она индексирует поле type вместе с текстом факта
  correct: 0
