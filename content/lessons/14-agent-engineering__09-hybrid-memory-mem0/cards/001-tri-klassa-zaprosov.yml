- concept: ответ на реляционный запрос строится многошаговым обходом графа, а не одним извлечением
  question: Агент отвечает на вопрос «какие клиенты платят через то же юрлицо, что и клиент X?» по графу памяти. Расставь шаги в порядке выполнения.
  explanation: 'Реляционный запрос — это обход, а не lookup: старт от известной сущности, переход по ребру к связующему узлу, разворот к соседям, фильтрация исходной вершины. Ни KV, ни вектор такой многошаговый переход не выполняют — KV достаёт значение по точному ключу, вектор ранжирует по близости смысла.'
  kind: order
  items:
    - Найти узел клиента X
    - Пройти по ребру «платит через» от X к узлу платёжного юрлица
    - Собрать входящие рёбра «платит через» у этого юрлица
    - Вернуть клиентов на другом конце этих рёбер, исключив самого X
  id: 001-tri-klassa-zaprosov-3
  fingerprint: 543baed7
