- concept: semantic similarity ищет по смыслу, а не по совпадению слов или ключей
  question: 'Пользователь спрашивает агента: «что мы решили насчёт утечки памяти в воркере?» В сохранённой переписке этих слов нет — там было «сервис пухнет и его перезапускает OOM-killer». Какое хранилище памяти вернёт нужную запись?'
  explanation: 'Это класс semantic similarity. Вектор сравнивает не буквы, а положение смысла в пространстве эмбеддингов, поэтому парафраз («пухнет», «OOM») попадает рядом с «утечкой памяти». KV промахнётся: у факта нет заранее известного точного ключа. Граф хранит связи сущностей, а не близость формулировок.'
  kind: choice
  options:
    - 'Векторное: эмбеддинги запроса и записи близки по смыслу, лексическое пересечение не требуется'
    - 'KV: достаточно завести ключ по теме вопроса и достать значение'
    - 'Граф: нужно пройти по рёбрам от воркера к памяти'
    - 'Никакое: без совпадения ключевых слов запись недостижима'
  correct: 0
  id: 001-tri-klassa-zaprosov-1
  fingerprint: 5f180501
- concept: relationship reasoning требует обхода рёбер, ответа нет ни в одной отдельной записи
  question: 'Запрос к памяти агента: «какие клиенты завязаны на одно и то же платёжное юрлицо?» Почему векторный поиск принципиально не решает такую задачу, даже при идеальных эмбеддингах?'
  explanation: 'Класс relationship reasoning: ответ — производная от структуры связей, а не текст, который где-то записан. Similarity вернёт записи, похожие на формулировку вопроса, но не выполнит переход по рёбрам и не соберёт множество клиентов на другом конце общего узла-юрлица. Это работа графа.'
  kind: choice
  options:
    - 'Ответ не лежит ни в одной записи целиком: его надо собрать обходом связей клиент → юрлицо → другие клиенты'
    - Эмбеддинги плохо кодируют имена собственные, поэтому названия компаний теряются
    - Векторный индекс возвращает слишком много результатов и превышает окно контекста
    - Векторный поиск не умеет фильтровать по user_id, а запрос требует фильтрации
  correct: 0
  id: 001-tri-klassa-zaprosov-2
