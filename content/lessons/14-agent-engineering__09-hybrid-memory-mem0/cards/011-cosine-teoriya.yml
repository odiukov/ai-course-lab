- concept: близость мешков токенов = размер пересечения, делённый на геометрическое среднее размеров мешков
  question: Наивное векторное хранилище считает близость двух текстов как размер пересечения их мешков токенов, делённый на квадратный корень из произведения размеров мешков. Запрос даёт мешок из 9 уникальных токенов, кандидат — из 16, общих токенов у них 6. Чему равна близость?
  explanation: sim = |A∩B| / sqrt(|A|·|B|) = 6 / sqrt(9·16) = 6/12 = 0.5. Знаменатель — геометрическое среднее размеров мешков; он играет роль «среднего размера» и приводит абсолютный счёт совпадений к доле.
  kind: numeric
  answer: 0.5
  tolerance: 0.02
  id: 011-cosine-teoriya-1
  fingerprint: efeb2bf7
- concept: выбор знаменателя нормировки определяет, чья длина наказывается; min(|A|,|B|) даёт преимущество вырожденно коротким кандидатам
  question: Близость мешков токенов нормируют делением пересечения на sqrt(|A|·|B|). Что случится с ранжированием, если заменить знаменатель на min(|A|,|B|)?
  explanation: 'При знаменателе min(|A|,|B|) кандидат, чей мешок целиком лежит внутри запроса, даёт |A∩B| = min, то есть скор 1.0 — даже если он не несёт никакой информации. Геометрическое среднее держит обе крайности: наказывает и болтливого кандидата (большой |B|), и вырожденно короткого (маленький |B| поднимает знаменатель недостаточно, чтобы дать единицу).'
  kind: choice
  options:
    - Кандидат из одного-двух токенов, целиком входящих в запрос, получит максимальный скор и обойдёт длинные точные факты
    - Длинные многословные кандидаты начнут получать скор выше, чем короткие точные факты
    - Скор перестанет зависеть от размера запроса, но порядок кандидатов сохранится
    - Скор станет отрицательным для мешков без общих токенов
