- concept: нормировка задаёт общую шкалу [0,1] с максимумом при совпадении мешков, что делает кандидатов разной длины сравнимыми
  question: Что даёт нормировка пересечения на геометрическое среднее размеров мешков с точки зрения сравнения кандидатов разной длины?
  explanation: '|A∩B| ≤ min(|A|,|B|) ≤ sqrt(|A|·|B|), поэтому дробь никогда не превышает 1, а единицу даёт только совпадение мешков. Общая шкала [0,1] — то, что позволяет складывать этот скор с другими сигналами (важность, свежесть) во взвешенной сумме. Синонимы без общих токенов всё равно дают 0: это цена наивной близости, а не нормировки.'
  kind: choice
  options:
    - Скор попадает в диапазон от 0 до 1 и достигает 1 только при совпадении мешков, поэтому кандидаты любой длины сравнимы на одной шкале
    - Скор начинает учитывать порядок слов внутри текста
    - Скор становится ненулевым для синонимов, у которых нет общих токенов
    - Скор перестаёт зависеть от размера пересечения и определяется только длинами
