- concept: векторная ветка возвращает ранжированную окрестность фиксированного размера k и не отличает точное попадание от близкого соседа, тогда как KV отвечает единственной записью по ключу
  question: Запрос «какой у меня тариф» — из тех, где ключ (user_id, fact_type, entity) выводится однозначно. Объясни своими словами, чем результат векторной ветки на таком запросе отличается от результата KV-ветки при k = 5.
  explanation: 'Косинусная близость — непрерывная шкала, и top-k всегда возвращает k кандидатов, каким бы далёким ни оказался пятый. Ключ же либо есть, либо его нет. Отсюда правило распределения: формулировка гуляет, смысл держится — вектор; ключ выводится из запроса однозначно — KV.'
  kind: open
  reference: 'KV собирает ключ из запроса и отдаёт ровно ту запись, что лежит под ключом: одно значение, никаких соседей. Векторное хранилище отдаёт top-k по косинусу — при k = 5 это пять ближайших фактов, ранжированных по близости, без понятия «точное попадание»: нужный тариф там, скорее всего, будет, но вместе с четырьмя похожими по смыслу фактами (условия оплаты, прошлый тариф, лимиты). Поэтому на запросах с однозначным ключом вектор шумит, а KV попадает точно.'
  id: 021-check-kuda-2
  fingerprint: '75368838'
