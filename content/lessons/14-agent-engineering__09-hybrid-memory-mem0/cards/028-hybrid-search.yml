- concept: нативные ответы хранилищ несравнимы по форме, поэтому каждому кандидату до сплава приписывается число в общей шкале
  question: 'Три хранилища гибридной памяти отвечают в разной форме: вектор — числом близости, KV — самой записью без числа, граф — ребром. Объясни своими словами, почему их нельзя ранжировать в этом виде и что делается с ответами перед сплавом.'
  explanation: 'Ключевая мысль: приведение к общей шкале — отдельный шаг, а не побочный эффект скоринга. Хранилище знает только свою метрику и своих кандидатов; общая шкала появляется в слое над ними. Без неё сортировка сравнивала бы 0.31 с «просто нашлось».'
  kind: open
  reference: 'Сплав — арифметика над числами, а сортировка требует одной шкалы. Косинус 0.31, факт «ключ совпал» и «ребро существует» — величины разной природы: между ними нет отношения больше/меньше. Поэтому каждому кандидату перед скорингом приписывают релевантность в общей шкале [0,1]: у вектора берут готовую близость, точному попаданию по ключу назначают максимум (совпадение бинарно — либо да, либо нет), ребру дают вес пути, убывающий с числом шагов. Только после этого приведения кандидаты из разных источников попадают в одну взвешенную сумму с важностью и свежестью и становятся сравнимыми.'
