- concept: 'пустой ответ отдельного хранилища — штатный режим гибридного поиска, а не сбой: сплав идёт по тем источникам, которые дали кандидатов'
  question: Запрос «что мы обсуждали про дрейф агента» приходит в гибридную память. Вектор вернул 7 кандидатов, KV — ничего (ключ не выведен), граф — ничего (сущность не опознана). Как должен повести себя гибридный поиск?
  explanation: 'Промах по ключу и отсутствие опознанной сущности — обычная форма запроса, а не отказ хранилища. Скоринг считается для каждого кандидата отдельно и не требует, чтобы каждое хранилище что-то прислало, поэтому функция спокойно ранжирует то, что есть. Штрафовать за молчание чужих веток нечем: молчание KV не говорит ничего о качестве векторного кандидата.'
  kind: choice
