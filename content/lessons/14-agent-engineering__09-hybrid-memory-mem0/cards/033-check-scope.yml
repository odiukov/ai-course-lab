- concept: запись факта сразу в несколько областей видимости расширяет его фактическую доступность до самой широкой копии, поэтому каждая запись выбирает ровно одну область
  question: Инженер сомневается, куда положить факт «клиент просил не упоминать сумму сделки», и на всякий случай пишет его и в session-, и в user-, и в agent-память. Что он получил?
  explanation: Область видимости — это граница доступа, а не резервная копия. Каждая запись выбирает одну область; продублированный факт доступен через самую широкую из них, и все остальные ограничения становятся декоративными.
  kind: choice
  options:
    - 'Резерв надёжности: если одна область очистится, факт останется в двух других'
    - Фактическую видимость по самой широкой из трёх копий — приватный факт теперь достаётся запросам, которым он не принадлежит
    - Тройной вес в сплавляющем скоринге, из-за чего факт всегда идёт первым
    - 'Ничего: дубликаты схлопнутся при извлечении, останется одна копия'
  correct: 1
  id: 033-check-scope-1
  fingerprint: 82072c2d
- concept: извлечение опрашивает несколько областей видимости одновременно, приписывая каждой свой вес, а не сливает области в одну общую
  question: Ассистенту нужны и устойчивые предпочтения человека, и условия текущего разговора. Как устроено извлечение из нескольких областей видимости?
  explanation: 'Области остаются раздельными: извлечение перечисляет нужные области со своими весами, поэтому кандидат из session-памяти может обойти кандидат из user-памяти при равной релевантности. Слияние областей в одну убрало бы саму границу, ради которой они введены.'
  kind: choice
  options:
    - Области сливаются в одно хранилище перед поиском, иначе кандидатов не сравнить
    - Запрос обращается к нескольким областям сразу, и каждой области приписан собственный вес, влияющий на итоговый порядок кандидатов
    - Опрашивается только одна область — та, что дала непустой ответ первой
    - Области опрашиваются по очереди, и следующая читается только если предыдущая ничего не вернула
  correct: 1
