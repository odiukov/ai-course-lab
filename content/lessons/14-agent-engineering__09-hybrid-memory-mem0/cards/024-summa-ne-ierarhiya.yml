- concept: при нормированных признаках вклад слагаемого ограничен сверху его весом, поэтому отставание больше этого веса нельзя отыграть данным признаком ни при каких его значениях
  question: Все три признака нормированы к отрезку от нуля до единицы, вес recency равен 0.22. Объясни своими словами, почему у recency есть жёсткий предел того, что она способна изменить в исходе ранжирования.
  explanation: 'Нормировка признака в отрезок от нуля до единицы превращает вес в потолок вклада. Отсюда практический вывод при настройке: продукт, где свежесть обязана иногда перебивать всё остальное, требует веса recency сопоставимого с суммарным разбросом прочих слагаемых, иначе признак будет влиять только на близких кандидатов.'
  kind: open
  reference: Вклад слагаемого w_recency · recency лежит между нулём и w_recency, то есть максимум, который recency добавляет кандидату, равен 0.22. Значит, разница двух кандидатов по этому слагаемому не превышает 0.22. Если кандидат отстаёт по сумме остальных слагаемых больше чем на 0.22, никакая свежесть его не вытянет — даже идеально свежая запись против абсолютно несвежей. Компенсация в взвешенной сумме реальна, но ограничена сверху весом признака; чтобы поднять потолок, надо менять вес, а не значения.
