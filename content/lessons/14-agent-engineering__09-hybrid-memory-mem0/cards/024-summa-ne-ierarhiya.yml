- concept: 'порог компенсации между двумя признаками равен отношению их весов: требуемый перевес по одному признаку = (перевес по другому × его вес) / собственный вес'
  question: Скор считается как взвешенная сумма, w_relevance = 0.4, w_importance = 0.36. Кандидат A превосходит кандидата B по importance ровно на 0.8. На сколько минимум должна быть выше relevance кандидата B, чтобы он сравнялся с A по итоговому скору (recency у обоих одинакова)?
  explanation: 'Условие равенства: w_relevance · Δrelevance = w_importance · Δimportance. Отсюда Δrelevance = 0.36 · 0.8 / 0.4 = 0.72. Курс обмена между признаками задаётся не самими значениями, а отношением весов: чем меньше вес признака, тем большее преимущество по нему нужно, чтобы отыграть чужое.'
  kind: numeric
  answer: 0.72
  tolerance: 0.01
