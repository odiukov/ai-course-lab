- concept: на пути записи извлечение фактов LLM предшествует размещению каждого факта во всех хранилищах
  question: Расставь по порядку, что происходит внутри add(text, user_id, metadata) в гибридной памяти Mem0.
  explanation: Единица хранения — не исходная реплика, а извлечённый факт, поэтому LLM-извлечение стоит первым и его результат уже размножается по бэкендам. Без этого шага в вектор ушёл бы сырой текст, а KV и граф остались бы без ключа и без сущностей.
  kind: order
  items:
    - LLM извлекает из текста факты-кандидаты
    - каждый факт кодируется в embedding и пишется в векторное хранилище
    - каждый факт пишется в KV-хранилище под ключом (user_id, fact_type, entity)
    - каждый факт пишется в графовое хранилище как типизированное ребро между сущностями
  id: 008-check-add-search-1
  fingerprint: 4edad7e4
- concept: в графовом хранилище факт представлен типизированным ребром между сущностями, а не текстом и не вектором
  question: В каком виде факт попадает в графовое хранилище Mem0g?
  explanation: Граф нужен под запросы о связях, поэтому факт кладётся туда рёбрами с типом — по ним потом идёт обход от сущностей запроса. Embedding — форма для векторного хранилища, ключ (user_id, fact_type, entity) — для KV.
  kind: choice
  options:
    - Как типизированное ребро между сущностями факта
    - Как embedding-вектор, но с другой метрикой близости
    - Как строка исходной реплики пользователя целиком
    - Как ключ вида (user_id, fact_type, entity) со значением-фактом
  correct: 0
  id: 008-check-add-search-2
  fingerprint: de302a3c
- concept: хранилища получают одну и ту же единицу знания в разных представлениях, а не делят её между собой на части
  question: Пользователь сообщил единственный факт, add() отработал без ошибок. Что верно про состояние хранилищ?
  explanation: 'Запись идёт во все хранилища целиком: это дублирование одной единицы знания в разных представлениях, а не её разрезание. Отсюда и практическое следствие: правка или инвалидация факта обязана дойти до каждого представления, иначе бэкенды разойдутся в ответах.'
  kind: choice
  options:
    - 'Факт разложен на части: смысл ушёл в вектор, сущности в граф, остаток в KV'
    - 'Один и тот же факт лежит в каждом хранилище, но в своей форме: embedding, значение под ключом, ребро'
    - Факт лежит в векторном хранилище, а KV и граф хранят ссылки на эту запись
    - Каждое хранилище получило собственный факт, извлечённый под его класс запросов
  correct: 1
  id: 008-check-add-search-3
  fingerprint: b80fff78
