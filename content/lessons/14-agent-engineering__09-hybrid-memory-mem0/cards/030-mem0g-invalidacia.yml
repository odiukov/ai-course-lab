- concept: запись противоречащего факта — это добавление ребра рядом с переключением флага валидности у старого, а не правка объекта существующего ребра
  question: Расставь шаги, которые graph-память выполняет при поступлении факта, конфликтующего с уже записанным.
  explanation: 'Порядок важен: сначала поиск по (субъект, связь), потом сравнение объектов, и только после этого две независимые записи — пометка старого и вставка нового. Соблазн схлопнуть последние два шага в один UPDATE объекта у существующего ребра и есть источник потери истории: строки со старым значением после такого апдейта в хранилище не остаётся.'
  kind: order
  items:
    - Найти существующие рёбра с тем же субъектом и тем же типом связи
    - Сравнить объект найденного ребра с объектом нового факта и зафиксировать конфликт при расхождении
    - Переключить у старого ребра флаг валидности в False, оставив само ребро в хранилище
    - Записать новое ребро с новым объектом и валидностью True
