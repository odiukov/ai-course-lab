- concept: пометка вместо удаления сохраняет класс временных запросов, потому что ответ строится обходом подграфа, валидного на указанный момент, а не текущего состояния
  question: Пользователь в мае сообщил «работаю в Nokia», в ноябре — «перешёл в Spotify». Объясни своими словами, что теряет память, если при втором факте просто заменить объект у ребра `works_at`, и какой запрос перестаёт быть отвечаемым.
  explanation: 'Ключевое различие — между «ответ неточен» и «ответа нет в принципе». Удаление уничтожает не один ответ, а весь класс временных запросов: сколько ни улучшай поиск, отсутствующей строки он не найдёт. Пометка превращает булево «действует сейчас» в историю с интервалами, по которой строится подграф на нужный момент.'
  kind: open
  reference: 'Замена объекта отвечает только на вопрос «где сейчас»: в хранилище остаётся единственное значение Spotify. Запрос вида «где пользователь работал в июле» становится неотвечаемым не приблизительно, а принципиально — строки с Nokia в графе больше нет, восстанавливать ответ не из чего, и память уверенно вернёт Spotify, то есть выдаст неверный факт вместо признания незнания. Пометка старого ребра невалидным вместо удаления оставляет оба ребра в хранилище, а вместе с датами перехода — интервалы валидности. Тогда временной запрос обходит не текущее состояние графа, а подграф, валидный на указанный момент: для июля валидно ребро с Nokia, для декабря — со Spotify. Ценой становится рост графа и обязанность каждого обычного чтения учитывать валидность.'
