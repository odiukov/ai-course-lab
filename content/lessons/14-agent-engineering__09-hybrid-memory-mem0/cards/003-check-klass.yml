- concept: класс запроса определяется формой требуемого ответа, а не темой формулировки
  question: 'Агент получает два запроса про одну и ту же компанию: «что мы знаем про клиента Acme?» и «какой у клиента Acme расчётный счёт?». Тема одна, а хранилища нужны разные. Что именно определяет класс запроса?'
  explanation: Класс задаётся тем, что должно вернуться. «Что мы знаем про Acme» требует подборку похожего по смыслу — это semantic similarity, вектор. «Расчётный счёт Acme» требует одно значение под ключом (user, type, entity) — это fact lookup, KV. Тема и там и там одна, поэтому по теме класс не определяется.
  kind: choice
  options:
    - 'Форма нужного ответа: набор релевантных фрагментов по смыслу или одно точное значение по известному ключу'
    - 'Тема запроса: запросы про клиентов всегда идут в граф, запросы про диалоги — в вектор'
    - 'Длина формулировки: короткие запросы обслуживает KV, длинные — вектор'
    - 'Наличие имени собственного в запросе: если имя есть, это всегда fact lookup'
  correct: 0
  id: 003-check-klass-1
  fingerprint: 2c94a1ca
- concept: непустой результат хранилища не доказывает, что запрос его класса; ошибка маршрутизации проявляется правдоподобным, но неверным ответом, а не пустым
  question: Почему нельзя судить о правильности выбора хранилища по тому, что оно вернуло непустой результат? Объясни на примере векторного поиска по запросу, который на самом деле относится к другому классу.
  explanation: Отсюда и различие «хранилище что-то вернёт» и «хранилище тут выигрывает». Вектор отвечает почти на всё, KV на неизвестный ключ вернёт пусто честно, а граф без нужного ребра вернёт пустой обход. Молчаливая деградация вектора — главная причина, по которой одно хранилище на всё выглядит рабочим и при этом ошибается.
  kind: open
  reference: 'Векторный поиск по построению возвращает ближайших соседей к эмбеддингу запроса — ближайшие есть всегда, даже когда нужного факта или нужной связи в корпусе нет вовсе. На запрос «через какое платёжное юрлицо проходят платежи клиента Acme» вектор вернёт куски текста, где часто встречаются «Acme» и «платёж», и они будут похожи на ответ, но связь между узлами он не обходит, а значит ответа не даёт. Ошибка маршрутизации выглядит не как пустой результат и не как исключение, а как правдоподобный неверный ответ, поэтому критерий «вернуло что-то» бесполезен: критерий — совпадает ли форма выдачи хранилища с формой нужного ответа.'
  id: 003-check-klass-2
  fingerprint: a61c7b5f
