- concept: agent memory хранит состояние экземпляра агента и не привязана ни к человеку, ни к треду
  question: Чем agent memory отличается от user memory и session memory? Приведи пример записи, которой место именно в agent memory.
  explanation: 'Три области различаются не темой записи, а тем, к чему запись привязана: к человеку, к треду или к экземпляру агента. Каждая запись выбирает ровно одну область в момент записи; извлечение потом может опрашивать несколько областей сразу, давая каждой свой вес.'
  kind: open
  reference: 'User memory привязана к человеку через user_id и переживает сессии. Session memory привязана к треду и умирает вместе с ним. Agent memory — состояние конкретного экземпляра агента: какие инструменты он уже пробовал, что ему поручили, какие шаги плана выполнены. Она не про факты о человеке и не про контекст диалога, поэтому её горизонт жизни задаётся жизнью самого экземпляра агента, а не пользователем или тредом. Пример: «поиск по внутренней базе уже вызывался и вернул пусто — не повторять».'
  id: 032-scope-3
  fingerprint: 5f74fedc
