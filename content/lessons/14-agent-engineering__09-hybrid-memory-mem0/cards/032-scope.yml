- concept: область видимости записи выбирается по владельцу и горизонту жизни факта, а не по его теме
  question: 'Ассистент за один разговор узнал два факта: «у пользователя непереносимость лактозы» и «в этом треде отвечай маркированными списками». Как правильно разложить их по областям видимости Mem0?'
  explanation: Область определяется тем, кому принадлежит запись и как долго она должна жить. Медицинский факт нужен и через месяц в новом чате — это user memory с ключом user_id. Требование к формату действует только внутри треда и завтра становится мусором — session memory. Общий источник (один человек, один разговор) не делает записи одноуровневыми.
  kind: choice
  options:
    - 'Оба в user memory: оба сказал один и тот же человек'
    - Непереносимость — в user memory, требование к формату — в session memory
    - 'Оба в session memory: оба произнесены в одном треде'
    - Непереносимость — в session memory, требование к формату — в agent memory
  correct: 1
  id: 032-scope-1
  fingerprint: 94cf169e
- concept: 'пропущенная фильтрация по user_id — нарушение изоляции, а не деградация качества: пайплайн отдаёт чужую запись как валидную с высоким скором'
  question: В гибридной памяти извлечение случайно запустили без фильтра по владельцу записи. Как это проявится?
  explanation: 'Скоринг ничего не знает о владельце: он считает релевантность, важность и свежесть. Чужая запись, семантически подходящая к запросу, получит высокий скор и попадёт в ответ. Ни одна функция не падает, качество формально не проседает — user_id и есть единственная граница между памятью разных людей, поэтому забытый фильтр даёт не плохой ответ, а чужой.'
  kind: choice
  options:
    - Поиск вернёт пустой результат, потому что запись не пройдёт проверку прав
    - Скор релевантных записей упадёт, и ответы станут заметно хуже по качеству
    - Поиск отработает штатно и вернёт чужую запись с высоким скором — ответ будет связным и правдоподобным
    - Хранилище выбросит ошибку доступа при обращении к записи другого владельца
  correct: 2
