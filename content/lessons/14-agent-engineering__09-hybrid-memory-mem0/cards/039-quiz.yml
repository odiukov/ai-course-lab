- concept: 'единица памяти — отдельный факт, а не входящее сообщение: одно сообщение даёт несколько независимых фактов либо ни одного'
  question: 'Пользователь пишет: «Переехал в Лиссабон, работаю питонистом, кстати погода тут жуткая». Объясни, что после этого окажется в памяти и почему записей будет не одна и не столько же, сколько сообщений.'
  explanation: Память хранит факты, а не переписку. Отсюда и число записей ≠ числу сообщений, и возможность точечной инвалидации.
  kind: open
  reference: 'Экстрактор разбирает сообщение на кортежи: (пользователь, живёт_в, Лиссабон) и (пользователь, язык, Python). Реплика про погоду фактом не становится — она ничего не утверждает о постоянных свойствах или связях. Значит, одно сообщение даёт две записи, а другое сообщение может дать ноль. Дальше каждый факт живёт сам по себе: у него своя важность, своя свежесть, своя валидность, и опровергнуть переезд можно, не трогая факт про язык. Если бы единицей была реплика, отменить один факт из неё было бы нечем.'
  id: 039-quiz-2
  fingerprint: '30081328'
- concept: деградация качества извлечения от роста корпуса бьёт только по векторной ветке; поиск по ключу и обход рёбер к размеру корпуса нечувствительны
  question: Корпус памяти вырос с 40 тысяч записей до 900 тысяч. Качество ответов просело. По какой ветке гибридного поиска удар придётся в первую очередь и почему?
  explanation: 'Embedding drift — свойство приближённого поиска по сходству: с ростом корпуса окрестность запроса заполняется почти-подходящими записями. KV отвечает по точному ключу, графовый обход идёт по явным рёбрам от опознанной сущности — обе ветки от размера корпуса так не страдают. Лечение адресное: пересчёт эмбеддингов, а не перестройка всей памяти.'
  kind: choice
  options:
    - 'По KV: чем больше записей, тем чаще коллизии ключей и тем хуже совпадение'
    - 'По векторной: в плотном пространстве соседей у любого запроса становится больше, релевантные тонут среди похожих, и приближённый поиск ошибается чаще'
    - 'По графовой: рёбер больше, значит обход возвращает больше мусора на той же глубине'
  correct: 1
  id: 039-quiz-3
  fingerprint: ac6cdf4e
