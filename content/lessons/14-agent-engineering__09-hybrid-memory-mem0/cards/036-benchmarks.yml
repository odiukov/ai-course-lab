- concept: LLM с полным контекстом обязана входить в набор базовых решений, иначе выигрыш архитектуры памяти нельзя отличить от выигрыша над заведомо слабым конкурентом
  question: Команда меряет свою систему памяти и сравнивает её только с плоским векторным хранилищем. Почему такой набор базовых решений недостаточен?
  explanation: 'Базовый набор должен включать варианты, которые реально конкурируют за место в проде: полный контекст, плоский вектор, плоский KV. Полный контекст критичен — если он выигрывает, слой памяти не нужен на этой длине истории. Mem0 отчитывается об отрыве в 10+ пунктов именно от такого набора.'
  kind: choice
  options:
    - Векторное хранилище слишком медленное, надо сравнивать с более быстрым бэкендом
    - Не покрыт самый простой способ решить задачу — залить всю историю в контекст модели целиком; без него неясно, нужна ли вообще отдельная память
    - Одного базового решения мало по формальным требованиям публикации, число значения не имеет
    - Векторное хранилище не поддерживает фильтрацию по владельцу записи, поэтому сравнение некорректно
  correct: 1
