- concept: балл на бенчмарке обосновывает жизнеспособность идеи, но не выбор конкретной системы в прод, потому что не меряет эксплуатационные издержки
  question: Гибридная память обгоняет все базовые решения на публичном бенчмарке на 12 пунктов. Объясни своими словами, что этот результат обосновывает, а что — нет, и какие свойства системы бенчмарк не измеряет.
  explanation: Числа Mem0 (91.6 / 93.4 / 64.1) доказывают, что сплавляющий дизайн даёт не погрешность округления. Дальше решение принимается по операционной форме — задержке, стоимости тройной записи, отлаживаемости, — а не по строке в таблице.
  kind: open
  reference: 'Обосновывает: идея сплава нескольких представлений одного факта не пустая — отрыв в 12 пунктов не спишешь на шум и погрешность округления. Не обосновывает: выбор конкретной реализации в прод. Бенчмарк меряет свой датасет с его распределением запросов, а продовое распределение другое. Не измеряется ничего из того, с чем жить в эксплуатации: задержка чтения и записи (запись факта во все хранилища), стоимость (извлечение фактов LLM на каждой записи, три хранилища вместо одного), отладка и наблюдаемость, поведение при сбое одного бэкенда, миграции и дрейф эмбеддингов. Плюс качество зависит от весов сплава, настроенных под продукт, а бенчмарк меряет одну фиксированную настройку. Практический вывод: число — аргумент за архитектурный класс, дальше нужен замер на своём трафике.'
