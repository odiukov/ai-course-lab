- concept: общий интерфейс add/search поверх разнородных бэкендов снимает с вызывающего кода задачу маршрутизации запроса
  question: Гибридная память держит векторный индекс, key-value и граф и прячет их за одной парой операций add/search. Объясни своими словами, что это даёт вызывающему коду и почему без такого слоя гибридная память плохо живёт в продакшене.
  explanation: Вклад гибридной памяти не в том, что бэкендов много, а в том, что они спрятаны за одним контрактом плюс общая функция скоринга. Иначе выбор бэкенда становится обязанностью прикладного кода, и любая ошибка классификации запроса — это молчаливый пустой ответ памяти.
  kind: open
  reference: 'Вызывающий код не обязан заранее классифицировать запрос и выбирать бэкенд: он пишет факт одним add (запись расходится по всем бэкендам) и читает одним search. Без общего слоя маршрутизация протекает в бизнес-логику агента — приходится писать правила «это похоже на поиск факта, иду в key-value», ошибки классификации дают пустой ответ, а добавление или замена бэкенда ломает вызывающий код. Единый интерфейс также даёт место, куда поставить функцию скоринга: она сливает выдачу разных бэкендов в один ранжированный набор, поэтому промах одного источника компенсируется остальными, а не превращается в промах всей памяти.'
