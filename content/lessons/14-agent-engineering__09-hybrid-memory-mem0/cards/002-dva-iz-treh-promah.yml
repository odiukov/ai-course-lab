- concept: 'порядок обработки одного search в гибридной памяти: параллельный опрос бэкендов, нормализация кандидатов, общий скоринг, отсечение'
  question: Расставь шаги обработки одного вызова search в гибридной памяти по порядку.
  explanation: Бэкенды опрашиваются параллельно, иначе задержка складывается. Кандидаты нормализуются, потому что косинусная близость, точное попадание по ключу и длина пути в графе несопоставимы напрямую. Общий скор объединяет релевантность, важность и свежесть, и только после сортировки применяется отсечение — обрезать до скоринга значит потерять запись, слабую в своём бэкенде, но сильную по важности или свежести.
  kind: order
  items:
    - 'Разослать запрос всем бэкендам параллельно: векторному индексу, key-value и графу'
    - Собрать разнородные кандидаты и привести их к общему виду записи памяти
    - Посчитать общий скор каждого кандидата по релевантности, важности и свежести
    - Отсортировать по скору, отсечь top-k и вернуть один список вызывающему коду
