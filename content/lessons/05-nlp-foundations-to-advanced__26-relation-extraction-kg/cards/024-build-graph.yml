- concept: простая сборка списка смежности сохраняет повторяющиеся входные triples
  question: Функция строит список смежности, последовательно выполняя append для каждого входного triple. Что произойдёт, если один и тот же triple встретится во входе повторно?
  explanation: Ключом словаря служит только субъект, а его значение — обычный список. append не выполняет дедупликацию, поэтому каждому вхождению triple соответствует отдельная запись ребра.
  kind: choice
  options:
    - Повтор будет автоматически удалён словарём
    - Одинаковая пара relation–object будет добавлена повторно
    - Второе добавление вызовет ошибку дублирования ключа
