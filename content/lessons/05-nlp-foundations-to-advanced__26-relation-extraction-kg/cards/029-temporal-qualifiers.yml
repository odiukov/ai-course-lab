- concept: исторический запрос к графу знаний должен проверять попадание момента запроса в период действия отношения
  question: Как определить, применимо ли ограниченное во времени отношение к моменту исторического запроса?
  explanation: 'Совпадения сущностей и типа ребра недостаточно: момент запроса должен попадать в период действия отношения. Иначе актуальный факт может дать неверный ответ на исторический вопрос.'
  kind: choice
  options:
    - Проверить, входит ли момент запроса в интервал между квалификаторами начала и конца отношения
    - Проверить только совпадение типа отношения и участвующих сущностей
    - Считать отношение применимым ко всем моментам до его добавления в граф
    - Выбрать отношение с наиболее поздней датой начала независимо от момента запроса
  correct: 0
  id: 029-temporal-qualifiers-1
  fingerprint: 9d998a50
- concept: отсутствие квалификатора конца отношения не доказывает его бессрочность
  question: Объясни своими словами, почему отсутствие даты окончания у отношения в графе знаний нельзя автоматически трактовать как «отношение действует вечно».
  explanation: Неполная временная информация описывает границы знания графа, а не гарантированный срок действия факта. Отсутствующий конец периода следует трактовать как неизвестный или открытый, а не как доказательство вечности.
  kind: open
  reference: Дата окончания может отсутствовать потому, что отношение ещё продолжается, либо потому, что конец неизвестен или не был записан. Поэтому граф не даёт оснований утверждать бессрочность отношения.
  id: 029-temporal-qualifiers-2
  fingerprint: 2897e31d
