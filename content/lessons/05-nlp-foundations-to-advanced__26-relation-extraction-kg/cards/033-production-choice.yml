- concept: production-подход к relation extraction должен одновременно учитывать специализацию домена и требования аудита
  question: Компания строит граф знаний по юридическим документам, а каждый загружаемый факт должен быть проверяем по исходному тексту. Какой подход наиболее уместен?
  explanation: Юридическая лексика и схема отношений требуют доменной адаптации и собственной онтологии, а аудит — подтверждаемых спанов, provenance и этапа верификации. Один универсальный экстрактор не закрывает оба требования сам по себе.
  kind: choice
  options:
    - Использовать универсальный экстрактор без адаптации и сразу загружать его ответы в граф
    - Дообучить экстрактор на юридическом домене, использовать собственную онтологию и добавить проверку фактов по спанам с provenance
    - Применить Open IE и автоматически считать каждую найденную формулировку новым типом отношения
    - Ограничиться набором регулярных выражений, поскольку детерминированность полностью устраняет ошибки
  correct: 1
  id: 033-production-choice-1
  fingerprint: e0917221
- concept: сквозная доля сохранённых фактов в последовательном pipeline равна произведению долей сохранения на его этапах
  question: Заполни формулу для сквозной доли фактов, сохранившихся после последовательного прохождения всех этапов pipeline, где rᵢ — доля фактов, сохранённая отдельным этапом.
  explanation: Потери последовательных этапов перемножаются. Поэтому при шести этапах с сохранением 90% фактов на каждом сквозная доля составляет лишь 0,9⁶, то есть около 53%.
  kind: cloze
  template: R_end-to-end = ___
  answer: ∏ᵢ rᵢ
  accept:
    - произведение всех rᵢ
    - product(rᵢ)
    - Πᵢ rᵢ
  id: 033-production-choice-2
  fingerprint: 66ad4676
