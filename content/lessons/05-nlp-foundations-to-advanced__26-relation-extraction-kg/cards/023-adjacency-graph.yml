- concept: поиск исходящих соседей в списке смежности ограничивает обработку рёбрами выбранного узла
  question: Почему запрос исходящих соседей по списку смежности обычно эффективнее полного перебора всех triples графа?
  explanation: Хеш-поиск по ключу находит нужный список без просмотра чужих рёбер. Фильтр по типу отношения затем применяется только к исходящим рёбрам найденного узла.
  kind: open
  reference: Словарь позволяет сразу получить список исходящих рёбер выбранного узла. После этого просматриваются и при необходимости фильтруются только эти рёбра, поэтому работа зависит от исходящей степени узла, а не от общего числа triples.
