- concept: список значений сохраняет несколько исходящих рёбер одного узла
  question: Заполни пропуск так, чтобы новые рёбра добавлялись к уже сохранённым, а не заменяли их.
  explanation: Для отсутствующего ключа создаётся пустой список, после чего append добавляет очередное ребро. Поэтому один узел может иметь несколько исходящих отношений, в том числе одного типа.
