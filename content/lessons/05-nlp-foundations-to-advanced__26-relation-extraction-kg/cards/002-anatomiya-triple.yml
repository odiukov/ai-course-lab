- concept: распределение сущностей и отношения по ролям subject, relation и object
  question: Какой triple правильно извлечён из предложения «Исследовательская лаборатория расположена в Новосибирском академгородке»?
  explanation: Subject — сущность, о которой сообщается факт; relation — связь; object — сущность, на которую она направлена. Роль элемента не зависит от количества слов в его названии.
  kind: choice
  options:
    - (Новосибирский академгородок, расположена в, исследовательская лаборатория)
    - (исследовательская лаборатория, Новосибирский академгородок, расположена в)
    - (исследовательская лаборатория, расположена в, Новосибирский академгородок)
  correct: 2
  id: 002-anatomiya-triple-1
  fingerprint: 2d829335
- concept: направление отношения в triple задаётся порядком subject и object
  question: Объясни своими словами, почему triples `(Анна, руководит, проект)` и `(проект, руководит, Анна)` выражают разные утверждения.
  explanation: Subject и object — не взаимозаменяемые края связи. Их порядок задаёт направление утверждения; менять его можно только вместе с отношением, например заменяя отношение на корректное обратное.
  kind: open
  reference: Triple читается от subject через relation к object. В первом случае Анна руководит проектом, а во втором субъектом руководства становится проект, поэтому перестановка сущностей меняет смысл факта.
  id: 002-anatomiya-triple-2
  fingerprint: 6fa5b9a4
