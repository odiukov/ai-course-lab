- concept: частичное совпадение с источником не подтверждает весь извлечённый triple
  question: 'Источник сообщает: «Мария работает в компании Orion». Система извлекла факт «Мария основала Orion». Как следует оценить этот факт?'
  explanation: Для подтверждения недостаточно найти в источнике субъект и объект. Текст должен поддерживать именно извлечённое отношение; иначе triple содержит неподтверждённое добавление модели.
  kind: choice
  options:
    - 'Подтвердить: источник упоминает и Марию, и Orion'
    - 'Отклонить или отправить на ручную проверку: источник не подтверждает отношение «основала»'
    - Подтвердить, если основание компании выглядит правдоподобно
    - Заменить отношение «основала» на любое более вероятное
  correct: 1
  id: 001-tekst-v-fakty-1
  fingerprint: 4d65d406
- concept: подтверждение утверждения источником не равнозначно доказательству его истинности в реальном мире
  question: Объясни своими словами, почему проверка извлечённого факта по исходному фрагменту ещё не доказывает, что этот факт истинен в реальном мире.
  explanation: 'У извлечения отношений есть два разных уровня проверки: сначала выясняют, верно ли передано утверждение источника, а затем при необходимости проверяют само утверждение по независимым свидетельствам.'
  kind: open
  reference: 'Такая проверка устанавливает только соответствие между triple и содержанием источника: источник действительно делает это утверждение. Сам источник может ошибаться, быть устаревшим или ненадёжным, поэтому для проверки реального события нужны независимые данные или другие документы.'
