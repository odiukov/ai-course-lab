- concept: сопоставление с каноническим отношением должно хранить правило ориентации аргументов
  question: Закрытая онтология формулирует некоторые свойства в направлении, обратном исходной глагольной фразе. Что должно возвращать сопоставление отношения, чтобы сохранить смысл triple?
  explanation: 'Одного идентификатора недостаточно: каноническое свойство может иметь обратную ориентацию. Флаг перестановки позволяет одновременно выбрать свойство и правильно расположить его аргументы.'
  kind: choice
  options:
    - Идентификатор свойства и указание, нужно ли поменять subject и object местами
    - Только идентификатор свойства
    - Идентификатор свойства и длину исходного предложения
    - Только нормализованную глагольную фразу
  correct: 0
  id: 020-triple-canonicalization-1
  fingerprint: f7738252
- concept: дедупликация фактов выполняется после канонизации отношения и ориентации аргументов
  question: Объясни своими словами, почему удалять дубликаты triples до канонизации отношений и ориентации аргументов ненадёжно.
  explanation: Сравнение сырых triples обнаруживает лишь текстовые совпадения. Канонизация устраняет различия в формулировке отношения и его ориентации, поэтому семантические дубликаты следует искать уже среди канонических triples.
  kind: open
  reference: Один факт может быть извлечён с разными поверхностными формулировками и разным порядком участников. До отображения на единый идентификатор свойства и приведения аргументов к его направлению такие записи выглядят различными; после канонизации они принимают общую форму и могут быть корректно объединены.
  id: 020-triple-canonicalization-2
  fingerprint: 12372b25
