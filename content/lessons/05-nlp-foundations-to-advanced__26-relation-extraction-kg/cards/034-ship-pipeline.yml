- concept: полный контракт RE-пайплайна фиксирует extractor, ontology, provenance, merge strategy и evaluation как совместные условия приёмки
  question: Объясни своими словами, какие решения необходимо зафиксировать в контракте relation extraction пайплайна, прежде чем загружать его результаты в production knowledge graph.
  explanation: Работающий экстрактор сам по себе не задаёт поведение всей системы. Контракт связывает extractor, ontology, provenance, merge strategy и evaluation, чтобы результаты можно было однозначно принять или отклонить.
  kind: open
  reference: Нужно определить способ извлечения и его целевой баланс качества, модель отношений, обязательную привязку фактов к документам и спанам, правила слияния и дедупликации с учётом времени, а также протокол оценки качества.
  id: 034-ship-pipeline-1
  fingerprint: 0254ef21
- concept: временные квалификаторы входят в ключ слияния для ограниченных во времени отношений
  question: После канонизации получены две связи с одинаковыми ID сотрудника, работодателя и отношения employer, но с разными непересекающимися периодами действия. Как их следует обработать при слиянии?
  explanation: Для отношений вроде работодателя, супруга или должности период действия является частью смысла факта. Совпадения канонических ID сущностей и отношения недостаточно для признания записей дублями, если их временные квалификаторы различаются.
  kind: choice
  options:
    - Удалить любую из связей как полный дубль
    - Сохранить обе связи, поскольку разные периоды обозначают разные временные факты
    - Объединить их в бессрочную связь без дат
    - Выбрать связь, извлечённую первой
  correct: 1
