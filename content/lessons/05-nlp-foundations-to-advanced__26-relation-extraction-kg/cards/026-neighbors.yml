- concept: возврат нового списка защищает внутреннее состояние графа от изменения через результат запроса
  question: Почему функция поиска соседей может возвращать новый список пар, а не сам список рёбер, хранящийся в графе?
  explanation: Списки в Python изменяемы. Возврат ссылки на хранимый список позволит вызывающему коду случайно удалить или добавить рёбра, тогда как новый список сохраняет запрос читающим.
