- concept: структурная валидность ответа не гарантирует текстовую обоснованность извлечённых связей
  question: LLM вернула синтаксически корректный JSON с полями subject, relation и object. Что из этого можно заключить?
  explanation: Строгая JSON-схема делает результат предсказуемым для следующего этапа, но модель способна упаковать неподтверждённый факт в корректную структуру. Формат ответа и обоснованность его содержания — разные свойства.
  kind: choice
  options:
    - Ответ удобно автоматически разобрать, но каждую связь всё ещё нужно проверять на поддержку исходным текстом
    - Все извлечённые связи подтверждены исходным текстом
    - Модель не использовала знания, полученные во время обучения
    - Ответ можно сразу добавлять в граф знаний без проверки
  correct: 0
  id: 031-llm-extraction-1
  fingerprint: 620bef12
- concept: relation extraction должна исключать правдоподобные факты, которые не сформулированы в исходном тексте
  question: Объясни своими словами, почему LLM-экстрактор не должен добавлять в результат общеизвестный факт о сущности, если этот факт отсутствует в обрабатываемом тексте.
  explanation: Правдоподобие или реальная истинность факта не заменяет его присутствие в источнике. Запрет на дополнительные выводы удерживает модель в границах relation extraction и не даёт превратить её в средство обогащения данных.
  kind: open
  reference: Задача экстрактора — представить отношения, явно поддержанные конкретным источником, а не дополнить источник знаниями модели. Даже истинный факт без текстового основания является неподтверждённым результатом извлечения и нарушает требование «без выводов сверх текста».
  id: 031-llm-extraction-2
  fingerprint: 54f160ec
