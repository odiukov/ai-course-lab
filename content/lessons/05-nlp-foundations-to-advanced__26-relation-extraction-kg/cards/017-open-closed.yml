- concept: принципиально новый тип отношения требует явного расширения закрытой онтологии
  question: Open IE обнаружила важную связь, для которой в закрытой онтологии нет свойства с подходящим смыслом. Что нужно сделать, чтобы хранить такую связь в основном графе без смыслового искажения?
  explanation: Закрытая онтология разрешает только заранее определённые типы отношений и сама не создаёт новые. Поэтому действительно новую связь принимают в основной граф лишь после управляемого изменения схемы.
  kind: open
  reference: 'Нужно явно расширить онтологию: определить новое свойство и его семантику, после чего сопоставлять проверенные извлечения с этим свойством. Нельзя назначать существующий тип лишь ради загрузки в граф, если его смысл не подходит.'
