- concept: полнота результата требует завершить обход всех паттернов до возврата списка
  question: Почему в pattern-based relation extractor оператор return должен выполняться после завершения цикла по всем паттернам, а не внутри него?
  explanation: Внешний цикл отвечает за перебор типов отношений, а внутренний — за все совпадения каждого типа. Досрочный return обрывает внешний цикл и делает извлечение неполным.
  kind: open
  reference: Если вернуть список внутри цикла, функция завершится после обработки первого паттерна и проигнорирует отношения, описанные остальными правилами. Нужно накопить тройки для всех паттернов и только затем вернуть общий список.
  id: 007-extract-triples-2
  fingerprint: fe7db3bd
