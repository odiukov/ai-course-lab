- concept: паттерн одновременно выделяет участников факта и назначает тип отношения
  question: Какую метку отношения должен возвращать паттерн для конструкций «субъект works at объект» и «субъект works for объект»?
  explanation: Регулярное выражение выделяет subject и object, а связанная с ним метка задаёт ребро между ними. Поэтому обе предусмотренные формы создают отношение worksAt.
  kind: cloze
  template: PATTERNS = [(r"(?P<s>[A-Z]\\w+) works? (?:at|for) (?P<o>[A-Z]\\w+)", "___")]
  answer: worksAt
  accept:
    - worksAt
  id: 006-pattern-extraction-1
  fingerprint: 834d5b0a
- concept: регулярный паттерн извлекает только явно предусмотренные языковые формы
  question: Экстрактор использует паттерн `(?P<s>[A-Z]\\w+) (?:is|was) born in (?P<o>\\w+)`. Какое предложение соответствует этому паттерну?
  explanation: 'Паттерн требует последовательность: имя, `is` или `was`, затем `born in` и объект. Семантически близкие перефразировки без этой формы он не распознает.'
  kind: choice
  options:
    - Ravi was born in Delhi
    - Delhi is Ravi's birthplace
    - Ravi grew up in Delhi
    - Ravi was born near Delhi
  correct: 0
  id: 006-pattern-extraction-2
  fingerprint: 940c751d
- concept: детерминированные правила делают результат извлечения трассируемым и отлаживаемым
  question: Почему ошибку паттерн-экстрактора обычно проще локализовать, чем ошибку нейросетевого экстрактора?
  explanation: У извлечённого отношения есть явная причина — совпадение с конкретным паттерном. Это позволяет воспроизвести ошибку и точечно изменить условие сопоставления или метку.
  kind: open
  reference: Каждый результат детерминированно связан с конкретным регулярным выражением и назначенной ему меткой отношения. Можно установить, какое правило сработало, проверить его группы subject и object и исправить именно это правило.
  id: 006-pattern-extraction-3
  fingerprint: ea4cbe58
