- concept: пустая выборка требует явного контракта метрики из-за отсутствия знаменателя
  question: Почему функция, вычисляющая долю ошибок, должна отдельно обрабатывать пустой список результатов?
  explanation: 'Без отдельной проверки вычисление завершится делением на ноль. В контракте hallucination_rate для пустого списка принято возвращать 0.0: результатов нет, поэтому оценивать ошибки не на чем.'
  kind: open
  reference: У отношения количества ошибок к количеству результатов в пустой выборке знаменатель равен нулю. Явная ветка для пустого списка предотвращает деление на ноль и возвращает заранее согласованное нейтральное значение.
