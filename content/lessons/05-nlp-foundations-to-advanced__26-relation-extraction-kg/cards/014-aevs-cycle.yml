- concept: Supplement проверяет покрытие закреплённых спанов принятыми фактами
  question: После этапа Verify в пайплайне AEVS остались только подтверждённые triples. Что должен сделать этап Supplement?
  explanation: 'Supplement выполняет аудит покрытия: сопоставляет закреплённые в Anchor фрагменты с уже проверенными и принятыми фактами. Непокрытый спан указывает, что извлечение могло пропустить отношение или его участника.'
  kind: choice
  options:
    - Вернуть все отброшенные triples без повторной проверки
    - Найти закреплённые спаны, которые не вошли ни в один принятый факт
    - Заменить отношения произвольными фразами Open IE
    - Удалить у принятых triples ссылки на источник
  correct: 1
  id: 014-aevs-cycle-1
  fingerprint: 3a5a5a72
- concept: AEVS обменивает дополнительные вычисления на снижение галлюцинаций и проверяемость извлечения
  question: Почему пайплайн AEVS требует больше вычислений, чем однопроходная генерация triples, и какую инженерную пользу дают эти затраты?
  explanation: Однопроходная модель сразу смешивает поиск свидетельств и генерацию факта. AEVS разделяет эти операции, поэтому выполняет больше работы, но делает результат аудируемым, уменьшает число галлюцинаций и отдельно выявляет неполное покрытие источника.
  kind: open
  reference: Текст обрабатывается последовательно для закрепления спанов, построения кандидатов, проверки по источнику и контроля покрытия. Дополнительные проходы позволяют отбрасывать неподтверждённые факты, обнаруживать пропуски и прослеживать, на каком свидетельстве основан каждый результат.
  id: 014-aevs-cycle-2
  fingerprint: 0ea84b83
