- concept: верификация спана требует точного совпадения среза с заявленным текстом сущности без нормализации
  question: Срез источника отличается от заявленного текста сущности только регистром букв. Как должна поступить строгая функция verify_span?
  explanation: Проверка сопоставляет указанный срез и текст сущности без изменения регистра, удаления пробелов или поиска замены. Она подтверждает ответ модели, а не исправляет его.
  kind: choice
  options:
    - Вернуть False, потому что сравнение должно быть точным
    - Привести обе строки к нижнему регистру и вернуть True
    - Найти такое же слово с подходящим регистром в другом месте
    - Вернуть True, если различие не меняет смысл сущности
  correct: 0
  id: 009-verify-span-1
  fingerprint: 51b308ea
- concept: границы спана необходимо валидировать до выполнения среза
  question: Почему verify_span должна отклонять отрицательные, перепутанные и выходящие за источник границы до сравнения строк?
  explanation: Допустимость операции среза в Python ещё не означает корректность координат источника. Явная проверка границ заставляет verify_span возвращать False для невалидной привязки, даже если получившаяся строка случайно совпала.
  kind: open
  reference: Python допускает некоторые отрицательные и выходящие за длину границы при создании среза. Без отдельной проверки некорректные координаты могут дать осмысленный фрагмент и быть ошибочно приняты. Поэтому функция сначала проверяет структуру, типы и диапазон границ, а затем сравнивает срез с текстом сущности.
  id: 009-verify-span-2
  fingerprint: 1eaa7070
