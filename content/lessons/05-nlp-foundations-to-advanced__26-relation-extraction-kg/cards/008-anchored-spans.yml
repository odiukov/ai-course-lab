- concept: спан идентифицирует конкретное вхождение сущности при повторении одинакового текста
  question: Объясни своими словами, почему при извлечении сущности недостаточно сохранить только её текст, если одно и то же название встречается в документе несколько раз.
  explanation: Поле `text` сообщает, что извлечено, но не указывает, из какого места. Пара координат связывает значение с одним конкретным фрагментом документа.
  kind: open
  reference: Одинаковая строка может соответствовать нескольким вхождениям. Символьный спан задаёт границы конкретного вхождения и позволяет однозначно найти его в источнике.
  id: 008-anchored-spans-2
  fingerprint: '81792257'
- concept: координаты спана должны относиться к той же неизменённой строке, по которой выполняется проверка
  question: Экстрактор вычислил символьные спаны по исходной строке, после чего перед проверкой из строки удалили лишние пробелы. Какое последствие наиболее вероятно?
  explanation: Пробелы и знаки препинания участвуют в подсчёте символьных позиций. Любое изменение строки между вычислением и проверкой спанов может сделать координаты недействительными.
  kind: choice
  options:
    - Отношения автоматически станут точнее
    - Координаты могут сместиться, и срезы перестанут совпадать с извлечёнными значениями
    - Спаны останутся корректными, потому что пробелы не считаются символами
    - Изменится только регистр извлечённых сущностей
  correct: 1
  id: 008-anchored-spans-3
