- concept: distant supervision автоматически создаёт обучающие метки из фактов базы знаний, но может давать шумную разметку
  question: Объясни своими словами, как distant supervision создаёт обучающие примеры для извлечения отношений без ручной разметки каждого предложения и откуда в этих примерах берётся шум.
  explanation: Distant supervision заменяет дорогую ручную разметку автоматическим сопоставлением текстов с фактами базы знаний. Цена масштаба — ошибочные или неоднозначные метки, возникающие из-за несовершенного сопоставления.
  kind: open
  reference: Известные факты базы знаний сопоставляют с фрагментами, где упомянуты соответствующие сущности, и автоматически назначают этим фрагментам метки отношений. Такая эвристика создаёт много примеров, но упоминание двух сущностей не гарантирует, что конкретный фрагмент действительно выражает известное между ними отношение.
  id: 030-rebel-seq2seq-1
  fingerprint: 33eb2b8c
- concept: лимит длины генерации применяется ко всей сериализованной последовательности и может обрезать последние факты
  question: Экстрактор отношений генерирует все найденные triple как одну последовательность. На длинных фрагментах последние факты исчезают после достижения лимита генерации. Как следует обрабатывать такие фрагменты?
  explanation: В REBEL параметр max_length=200 ограничивает всю выходную последовательность, а не каждый triple отдельно. Когда бюджет токенов исчерпан, хвост генерации обрезается, поэтому длинный вход делят на фрагменты и затем собирают результаты.
  kind: choice
  options:
    - Считать исчезнувшие факты доказательством того, что их отношения отсутствуют в онтологии
    - Разбивать вход на небольшие фрагменты, извлекать факты отдельно и объединять результаты
    - Применять лимит заново к каждому triple уже после завершения генерации
    - Удалять специальные маркеры до передачи фрагмента модели
  correct: 1
