- concept: выбор баланса precision и recall зависит от стоимости ложных и пропущенных фактов
  question: Ложное ребро в медицинском knowledge graph может привести к опасному автоматическому решению, а пропущенный факт позднее проверит специалист. Какой профиль системы предпочтительнее?
  explanation: Когда ложноположительная связь опаснее пропуска, приоритетом становится precision. Если же дороже обходится пропущенный факт, разумнее смещать баланс в сторону recall.
  kind: choice
  options:
    - Высокий precision, даже ценой снижения recall
    - Высокий recall, даже ценой снижения precision
