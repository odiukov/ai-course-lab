  fingerprint: 127abe1d
- concept: recall — доля найденных фактов среди всех истинных фактов
  question: Заполни пропуск в формуле recall.
  explanation: 'Recall измеряет полноту: какую часть действительно присутствующих фактов удалось извлечь. В знаменателе учитываются и найденные, и пропущенные истинные факты.'
  kind: cloze
  template: recall = число верно извлечённых фактов / ___
  answer: общее число истинных фактов
  accept:
