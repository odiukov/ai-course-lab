<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь от предложения к knowledge graph</title>
<style>
:root{
  --line:1px;
  --heavy:2px;
  --zero:calc(var(--line) - var(--line));
  --bg:#f7f8fb;
  --panel:#ffffff;
  --panel-soft:#eef2f7;
  --ink:#172033;
  --muted:#64748b;
  --border:#cbd5e1;
  --entity:#2563eb;
  --entity-soft:#dbeafe;
  --relation:#b45309;
  --relation-soft:#fef3c7;
  --arrow:#64748b;
  --node:#0f766e;
  --node-soft:#ccfbf1;
  --shadow:#d7dee8;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10141d;
    --panel:#181e2a;
    --panel-soft:#202838;
    --ink:#eef2ff;
    --muted:#a8b3c7;
    --border:#3b475c;
    --entity:#7db2ff;
    --entity-soft:#18345f;
    --relation:#f6bd60;
    --relation-soft:#503719;
    --arrow:#9aa8bd;
    --node:#63d5c8;
    --node-soft:#163f3e;
    --shadow:#090c12;
  }
}
html,body{
  margin:var(--zero);
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
figure{
  margin:var(--zero);
  background:var(--bg);
}
figcaption{
  color:var(--ink);
  font-size:20px;
  font-weight:bold;
  text-align:center;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--bg);
}
.section-title{
  fill:var(--muted);
  font-size:15px;
  font-weight:bold;
  letter-spacing:.08em;
}
.card{
  fill:var(--panel);
  stroke:var(--border);
  stroke-width:var(--line);
}
.card-shadow{
  fill:var(--shadow);
}
.source-line{
  fill:var(--ink);
  font-size:21px;
  font-weight:bold;
}
.hint{
  fill:var(--muted);
  font-size:14px;
}
.pill{
  fill:var(--entity-soft);
  stroke:var(--entity);
  stroke-width:var(--line);
}
.pill-text{
  fill:var(--entity);
  font-size:14px;
  font-weight:bold;
}
.triple-text{
  fill:var(--ink);
  font-size:16px;
}
.entity-text{
  fill:var(--entity);
  font-weight:bold;
}
.relation-text{
  fill:var(--relation);
  font-weight:bold;
}
.flow{
  fill:none;
  stroke:var(--arrow);
  stroke-width:var(--heavy);
  stroke-linecap:round;
}
.flow-head{
  fill:var(--arrow);
}
.flow-label{
  fill:var(--muted);
  font-size:13px;
  font-weight:bold;
  text-anchor:middle;
}
.graph-edge{
  fill:none;
  stroke:var(--relation);
  stroke-width:var(--heavy);
  stroke-linecap:round;
}
.graph-head{
  fill:var(--relation);
}
.edge-label{
  fill:var(--relation);
  stroke:var(--bg);
  stroke-width:7px;
  paint-order:stroke;
  font-size:14px;
  font-weight:bold;
  text-anchor:middle;
}
.node{
  fill:var(--node-soft);
  stroke:var(--node);
  stroke-width:var(--heavy);
}
.node-text{
  fill:var(--node);
  font-size:16px;
  font-weight:bold;
  text-anchor:middle;
  dominant-baseline:middle;
}
.legend{
  fill:var(--muted);
  font-size:14px;
  text-anchor:middle;
}
.fallback{
  fill:var(--ink);
  font-size:18px;
  text-anchor:middle;
}
</style>
</head>
<body>
<figure>
  <figcaption>Путь от предложения к knowledge graph</figcaption>
  <svg viewBox="0 0 1440 470" width="100%" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Преобразование предложения в четыре triple и knowledge graph</title>
    <desc id="svg-desc">Предложение о Тиме Куке, Apple и 2011 годе превращается в четыре triple. Сущности становятся узлами, а отношения — подписанными рёбрами.</desc>
    <g id="drawing"></g>
  </svg>
</figure>
<script>
const data=[{
  origin:{x:0,y:0},
  scale:1,
  radius:12,
  shadow:{x:4,y:5},
  arrow:{length:13,wing:7},
  source:{
    title:{text:"ИСХОДНОЕ ПРЕДЛОЖЕНИЕ",x:20,y:38,anchor:"start"},
    box:{x:20,y:70,w:290,h:318},
    lines:[
      {text:"“Tim Cook",x:165,y:151},
      {text:"became CEO",x:165,y:181},
      {text:"of Apple",x:165,y:211},
      {text:"in 2011”",x:165,y:241}
    ],
    hint:{text:"упоминания сущностей",x:165,y:286},
    mentions:[
      {text:"Tim Cook",x:43,y:306,w:102,h:34},
      {text:"CEO",x:181,y:306,w:65,h:34},
      {text:"Apple",x:43,y:346,w:102,h:34},
      {text:"2011",x:181,y:346,w:65,h:34}
    ]
  },
  triples:{
    title:{text:"ЧЕТЫРЕ TRIPLE",x:615,y:38,anchor:"middle"},
    x:380,w:470,h:58,
    rows:[
      {y:70,subject:"Tim Cook",relation:"стал",object:"CEO"},
      {y:150,subject:"CEO",relation:"должность в",object:"Apple"},
      {y:230,subject:"Tim Cook",relation:"возглавил",object:"Apple"},
      {y:310,subject:"Tim Cook",relation:"начал в",object:"2011"}
    ]
  },
  graph:{
    title:{text:"KNOWLEDGE GRAPH",x:1192,y:38,anchor:"middle"},
    nodes:[
      {id:"cook",text:"Tim Cook",x:985,y:212,w:120,h:56},
      {id:"ceo",text:"CEO",x:1137,y:76,w:110,h:56},
      {id:"apple",text:"Apple",x:1290,y:212,w:120,h:56},
      {id:"year",text:"2011",x:1142,y:354,w:100,h:56}
    ],
    edges:[
      {
        from:{x:1087,y:212},to:{x:1155,y:132},
        text:"стал",anchor:{x:1087,y:212},offset:{x:38,y:-34}
      },
      {
        from:{x:1230,y:124},to:{x:1310,y:214},
        text:"должность в",anchor:{x:1230,y:124},offset:{x:47,y:28}
      },
      {
        from:{x:1105,y:240},to:{x:1290,y:240},
        text:"возглавил",anchor:{x:1105,y:240},offset:{x:90,y:-17}
      },
      {
        from:{x:1087,y:268},to:{x:1158,y:354},
        text:"начал в",anchor:{x:1087,y:268},offset:{x:39,y:50}
      }
    ],
    legend:{
      x:1192,y:442,
      first:"сущности → узлы",
      second:"отношения → подписанные рёбра"
    }
  },
  flows:[
    {
      from:{x:320,y:229},to:{x:365,y:229},
      text:"извлечение фактов",
      anchor:{x:320,y:229},offset:{x:23,y:-22}
    },
    {
      from:{x:860,y:229},to:{x:950,y:229},
      text:"сборка графа",
      anchor:{x:860,y:229},offset:{x:45,y:31}
    }
  ],
  fallback:{
    lines:[
      {text:"Предложение превращается в четыре triple,",x:720,y:216},
      {text:"затем сущности становятся узлами,",x:720,y:246},
      {text:"а отношения — подписанными рёбрами.",x:720,y:276}
    ]
  }
}];

const [diagram]=data;
const origin=diagram.origin;
const scale=diagram.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

const NS="http://www.w3.org/2000/svg";
const layer=document.getElementById("drawing");

function element(name,attrs,content){
  const node=document.createElementNS(NS,name);
  Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));
  if(content!==undefined) node.textContent=content;
  return node;
}

function add(node){
  layer.appendChild(node);
  return node;
}

function rect(box,className,shift){
  const move=shift||{x:diagram.origin.x,y:diagram.origin.y};
  return element("rect",{
    x:sx(box.x+move.x),
    y:sy(box.y+move.y),
    width:sx(box.x+box.w)-sx(box.x),
    height:sy(box.y+box.h)-sy(box.y),
    rx:sx(box.x+diagram.radius)-sx(box.x),
    class:className
  });
}

function textLabel(item,className){
  return element("text",{
    x:sx(item.x),
    y:sy(item.y),
    "text-anchor":item.anchor||"middle",
    class:className
  },item.text);
}

function arrow(item,lineClass,headClass){
  const dx=item.to.x-item.from.x;
  const dy=item.to.y-item.from.y;
  const length=Math.hypot(dx,dy);
  if(!length) throw new Error("Некорректная стрелка");
  const ux=dx/length;
  const uy=dy/length;
  const base={
    x:item.to.x-ux*diagram.arrow.length,
    y:item.to.y-uy*diagram.arrow.length
  };
  const left={
    x:base.x-uy*diagram.arrow.wing,
    y:base.y+ux*diagram.arrow.wing
  };
  const right={
    x:base.x+uy*diagram.arrow.wing,
    y:base.y-ux*diagram.arrow.wing
  };
  add(element("line",{
    x1:sx(item.from.x),y1:sy(item.from.y),
    x2:sx(base.x),y2:sy(base.y),
    class:lineClass
  }));
  add(element("polygon",{
    points:[item.to,left,right]
      .map(point=>`${sx(point.x)},${sy(point.y)}`).join(" "),
    class:headClass
  }));
}

function offsetLabel(item,className){
  return element("text",{
    x:sx(item.anchor.x+item.offset.x),
    y:sy(item.anchor.y+item.offset.y),
    "text-anchor":"middle",
    class:className
  },item.text);
}

try{
  const source=diagram.source;
  const triples=diagram.triples;
  const graph=diagram.graph;

  add(textLabel(source.title,"section-title"));
  add(textLabel(triples.title,"section-title"));
  add(textLabel(graph.title,"section-title"));

  add(rect(source.box,"card-shadow",diagram.shadow));
  add(rect(source.box,"card"));

  source.lines.forEach(line=>add(textLabel(line,"source-line")));
  add(textLabel(source.hint,"hint"));

  source.mentions.forEach(item=>{
    const box={x:item.x,y:item.y,w:item.w,h:item.h};
    add(rect(box,"pill"));
    add(element("text",{
      x:sx(item.x+item.w/diagram.shadow.x),
      y:sy(item.y+item.h/diagram.shadow.x),
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      class:"pill-text"
    },item.text));
  });

  diagram.flows.forEach(item=>{
    arrow(item,"flow","flow-head");
    add(offsetLabel(item,"flow-label"));
  });

  triples.rows.forEach(row=>{
    const box={x:triples.x,y:row.y,w:triples.w,h:triples.h};
    add(rect(box,"card-shadow",diagram.shadow));
    add(rect(box,"card"));
    const label=element("text",{
      x:sx(triples.x+triples.w/diagram.shadow.x),
      y:sy(row.y+triples.h/diagram.shadow.x),
      "text-anchor":"middle",
      "dominant-baseline":"middle",
      class:"triple-text"
    });
    const parts=[
      {text:"(",class:"triple-text"},
      {text:row.subject,class:"entity-text"},
      {text:", ",class:"triple-text"},
      {text:row.relation,class:"relation-text"},
      {text:", ",class:"triple-text"},
      {text:row.object,class:"entity-text"},
      {text:")",class:"triple-text"}
    ];
    parts.forEach(part=>{
      const span=element("tspan",{class:part.class},part.text);
      label.appendChild(span);
    });
    add(label);
  });

  graph.edges.forEach(item=>{
    arrow(item,"graph-edge","graph-head");
    add(offsetLabel(item,"edge-label"));
  });

  graph.nodes.forEach(node=>{
    add(rect(node,"node"));
    add(element("text",{
      x:sx(node.x+node.w/diagram.shadow.x),
      y:sy(node.y+node.h/diagram.shadow.x),
      class:"node-text"
    },node.text));
  });

  const legend=element("text",{
    x:sx(graph.legend.x),
    y:sy(graph.legend.y),
    class:"legend"
  });
  legend.appendChild(element("tspan",{class:"entity-text"},graph.legend.first));
  legend.appendChild(element("tspan",{class:"legend"},"  ·  "));
  legend.appendChild(element("tspan",{class:"relation-text"},graph.legend.second));
  add(legend);
}catch(error){
  while(layer.firstChild) layer.removeChild(layer.firstChild);
  diagram.fallback.lines.forEach(line=>add(textLabel(line,"fallback")));
}
</script>
</body>
</html>
