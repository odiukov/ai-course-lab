<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Четыре прохода AEVS</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f6f3ec;
  --panel:#fffdf8;
  --ink:#172033;
  --muted:#596274;
  --line:#8a93a4;
  --blue:#dcecff;
  --blue-ink:#164e86;
  --violet:#eee4ff;
  --violet-ink:#6840a5;
  --green:#dff4e8;
  --green-ink:#17623a;
  --amber:#fff0bd;
  --amber-ink:#765300;
  --red:#ffe0df;
  --red-ink:#a52d2a;
  --shadow:#d9d4c9;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111722;
    --panel:#192231;
    --ink:#edf2fa;
    --muted:#aeb8c8;
    --line:#758198;
    --blue:#173b5d;
    --blue-ink:#a9d5ff;
    --violet:#392956;
    --violet-ink:#dcc5ff;
    --green:#173f30;
    --green-ink:#a8eac4;
    --amber:#493b16;
    --amber-ink:#ffe08a;
    --red:#512727;
    --red-ink:#ffb8b5;
    --shadow:#090d14;
  }
}
*{box-sizing:border-box}
body{
  margin:unset;
  background:var(--page);
  color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
header{
  margin:unset;
  padding:8px 18px 4px;
  font-size:22px;
  font-weight:750;
  letter-spacing:.01em;
}
svg{
  display:block;
  width:100%;
  height:440px;
  max-height:440px;
  background:var(--page);
}
text{fill:var(--ink)}
.stage-title{font-size:21px;font-weight:750}
.stage-subtitle{font-size:14px;fill:var(--muted);font-weight:650}
.source-label{font-size:11px;fill:var(--muted);font-weight:700;letter-spacing:.08em}
.source-text{font-size:13px;font-weight:550}
.body-text{font-size:13px}
.small-text{font-size:12px;fill:var(--muted)}
.bad-text{font-size:13px;fill:var(--red-ink);font-weight:700}
.good-text{font-size:13px;fill:var(--green-ink);font-weight:700}
.note-text{font-size:12px;fill:var(--amber-ink);font-weight:700}
.arrow-label{font-size:12px;fill:var(--muted);font-weight:700}
.card{fill:var(--panel);stroke:var(--line);stroke-width:1.5}
.source{fill:var(--page);stroke:var(--shadow);stroke-width:1}
.entity{fill:var(--blue);stroke:var(--blue-ink);stroke-width:1}
.relation{fill:var(--violet);stroke:var(--violet-ink);stroke-width:1}
.good{fill:var(--green);stroke:var(--green-ink);stroke-width:1}
.warn{fill:var(--amber);stroke:var(--amber-ink);stroke-width:1.5}
.bad{fill:var(--red);stroke:var(--red-ink);stroke-width:1.5}
.divider{stroke:var(--shadow);stroke-width:1}
.arrow{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.arrow-head{fill:var(--line)}
.reject-arrow{fill:none;stroke:var(--red-ink);stroke-width:2.5;stroke-linecap:round}
.reject-head{fill:var(--red-ink)}
.fallback{
  padding:18px;
  background:var(--panel);
  color:var(--ink);
  font-size:16px;
}
[hidden]{display:none}
</style>
</head>
<body>
<header id="diagram-title">Четыре прохода AEVS</header>
<div id="fallback" class="fallback" hidden></div>
<svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="diagram-title diagram-description">
  <desc id="diagram-description">Цикл Anchor, Extract, Verify и Supplement. На Verify неподтверждённый triple отбрасывается, а Supplement находит закреплённые спаны без triple.</desc>
</svg>
<script>
const DATA={
  cards:[
    {x:12,y:62,w:250,h:232,title:"Anchor",subtitle:"Закрепить точные спаны"},
    {x:295,y:62,w:250,h:232,title:"Extract",subtitle:"Собрать кандидатов"},
    {x:578,y:62,w:250,h:232,title:"Verify",subtitle:"Сверить с источником"},
    {x:861,y:62,w:250,h:232,title:"Supplement",subtitle:"Проверить покрытие"}
  ],
  sources:[
    {x:26,y:113,w:222,h:55},
    {x:309,y:113,w:222,h:55},
    {x:592,y:113,w:222,h:55},
    {x:875,y:113,w:222,h:55}
  ],
  arrows:[
    {points:[[262,178],[295,178]],head:[[295,178],[282,170],[282,186]]},
    {points:[[545,178],[578,178]],head:[[578,178],[565,170],[565,186]]},
    {points:[[828,178],[861,178]],head:[[861,178],[848,170],[848,186]]},
    {points:[[986,62],[986,28],[137,28],[137,62]],head:[[137,62],[129,49],[145,49]],
     label:{x:561,y:28,dx:0,dy:-8,text:"тот же текст проходит цикл",anchor:"middle"}}
  ],
  reject:{
    points:[[703,294],[703,328]],
    head:[[703,328],[695,315],[711,315]],
    box:{x:608,y:333,w:190,h:51},
    label:{x:715,y:309,dx:6,dy:0,text:"не подтверждён",anchor:"start"}
  },
  anchorSpans:[
    {x:26,y:185,w:68,h:25,text:"Тим Кук",kind:"entity"},
    {x:99,y:185,w:80,h:25,text:"работает в",kind:"relation"},
    {x:184,y:185,w:51,h:25,text:"Apple",kind:"entity"},
    {x:55,y:218,w:68,h:25,text:"живёт в",kind:"relation"},
    {x:128,y:218,w:94,h:25,text:"Калифорнии",kind:"entity"}
  ],
  supplementSpans:[
    {x:883,y:211,w:68,h:25,text:"живёт в",kind:"warn"},
    {x:957,y:211,w:104,h:25,text:"Калифорнии",kind:"warn"}
  ]
};
const ORIGIN=Object.freeze({x:30,y:18});
const SCALE=Object.freeze({x:1,y:1});
const sx=x=>ORIGIN.x+x*SCALE.x;
const sy=y=>ORIGIN.y+y*SCALE.y;

const svg=document.getElementById("diagram");
const fallback=document.getElementById("fallback");
const NS="http://www.w3.org/2000/svg";

try{
  const make=(name,attrs={},content="")=>{
    const node=document.createElementNS(NS,name);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,value));
    if(content)node.textContent=content;
    svg.appendChild(node);
    return node;
  };
  const rect=(d,kind="card",radius=10)=>make("rect",{
    x:sx(d.x),y:sy(d.y),
    width:sx(d.w)-sx(0),height:sy(d.h)-sy(0),
    rx:sx(radius)-sx(0),class:kind
  });
  const text=(x,y,value,kind="body-text",anchor="start",dx=0,dy=0)=>make("text",{
    x:sx(x),y:sy(y),dx,dy,class:kind,"text-anchor":anchor
  },value);
  const line=(x1,y1,x2,y2,kind="divider")=>make("line",{
    x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:kind
  });
  const polyline=(points,kind="arrow")=>make("polyline",{
    points:points.map(point=>`${sx(point[0])},${sy(point[1])}`).join(" "),
    class:kind
  });
  const polygon=(points,kind="arrow-head")=>make("polygon",{
    points:points.map(point=>`${sx(point[0])},${sy(point[1])}`).join(" "),
    class:kind
  });
  const pill=(d)=>{
    rect(d,d.kind,7);
    text(d.x+d.w/2,d.y+17,d.text,
      d.kind==="warn"?"note-text":"body-text","middle");
  };
  const sourceText=(x)=>{
    text(x+10,126,"ТОТ ЖЕ ТЕКСТ","source-label");
    text(x+10,145,"Тим Кук работает в Apple","source-text");
    text(x+10,160,"и живёт в Калифорнии.","source-text");
  };

  DATA.cards.forEach((card,index)=>{
    rect(card);
    text(card.x+14,card.y+29,card.title,"stage-title");
    text(card.x+14,card.y+49,card.subtitle,"stage-subtitle");
    line(card.x+14,card.y+57,card.x+card.w-14,card.y+57);
    rect(DATA.sources[index],"source",7);
    sourceText(DATA.sources[index].x);
  });

  DATA.arrows.forEach(arrow=>{
    polyline(arrow.points);
    polygon(arrow.head);
    if(arrow.label){
      text(arrow.label.x,arrow.label.y,arrow.label.text,"arrow-label",
        arrow.label.anchor,arrow.label.dx,arrow.label.dy);
    }
  });

  DATA.anchorSpans.forEach(pill);
  text(137,260,"только опора — фактов ещё нет","small-text","middle");

  rect({x:309,y:184,w:222,h:45},"good",7);
  text(320,202,"Тим Кук","body-text");
  text(320,219,"— работает в → Apple","good-text");

  rect({x:309,y:236,w:222,h:47},"warn",7);
  text(320,254,"Тим Кук","body-text");
  text(320,271,"— живёт в → Google","note-text");
  text(520,281,"span: «Калифорнии»","small-text","end");

  text(606,195,"Apple = «Apple»","good-text");
  rect({x:592,y:204,w:222,h:31},"good",7);
  text(703,225,"принять triple","good-text","middle");

  text(606,255,"Google ≠ «Калифорнии»","bad-text");
  rect({x:592,y:264,w:222,h:19},"bad",7);
  text(703,279,"проверка не пройдена","bad-text","middle");

  text(875,192,"Закреплены, но не вошли","small-text");
  text(875,207,"ни в один принятый triple:","small-text");
  DATA.supplementSpans.forEach(pill);
  line(875,250,1097,250);
  text(986,270,"вернуть внимание к спанам","note-text","middle");
  text(986,286,"и дополнить извлечение","small-text","middle");

  polyline(DATA.reject.points,"reject-arrow");
  polygon(DATA.reject.head,"reject-head");
  text(DATA.reject.label.x,DATA.reject.label.y,DATA.reject.label.text,
    "bad-text",DATA.reject.label.anchor,DATA.reject.label.dx,DATA.reject.label.dy);
  rect(DATA.reject.box,"bad",9);
  text(703,354,"ОТБРОСИТЬ ВЕСЬ TRIPLE","bad-text","middle");
  text(703,373,"значение не совпало со спаном","small-text","middle");

  text(137,406,"Anchor","stage-subtitle","middle");
  text(420,406,"Extract","stage-subtitle","middle");
  text(703,406,"Verify","stage-subtitle","middle");
  text(986,406,"Supplement","stage-subtitle","middle");
  line(137,392,137,399);
  line(420,392,420,399);
  line(703,392,703,399);
  line(986,392,986,399);
}catch(error){
  svg.hidden=true;
  fallback.hidden=false;
  fallback.textContent="Схема должна была показать цикл Anchor → Extract → Verify → Supplement: неподтверждённый triple отбрасывается на Verify, а Supplement отмечает закреплённые спаны без triple.";
}
</script>
</body>
</html>
