<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как запрос P108 находит работодателя</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --ink: #172033;
      --muted: #64748b;
      --edge: #94a3b8;
      --outline: #cbd5e1;
      --accent: #dc2626;
      --accent-soft: #fee2e2;
      --success: #15803d;
      --success-soft: #dcfce7;
      --node: #e0e7ff;
      --node-outline: #6366f1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #182235;
        --panel-soft: #202d43;
        --ink: #f1f5f9;
        --muted: #aebbd0;
        --edge: #718096;
        --outline: #41516a;
        --accent: #fb7185;
        --accent-soft: #4b1f2c;
        --success: #4ade80;
        --success-soft: #173c2a;
        --node: #292d5d;
        --node-outline: #a5b4fc;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: auto;
      max-width: 1120px;
      background: var(--panel);
    }

    h1 {
      margin: unset;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .panel {
      fill: var(--panel-soft);
      stroke: var(--outline);
      stroke-width: 2px;
    }

    .query-panel {
      fill: var(--panel-soft);
      stroke: var(--outline);
      stroke-width: 2px;
    }

    .source-node {
      fill: var(--node);
      stroke: var(--node-outline);
      stroke-width: 3px;
    }

    .target-node {
      fill: var(--panel);
      stroke: var(--outline);
      stroke-width: 2px;
    }

    .answer-card {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 3px;
    }

    .edge-rejected {
      fill: none;
      stroke: var(--edge);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edge-selected {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-line {
      fill: none;
      stroke: var(--success);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-rejected {
      fill: var(--edge);
    }

    .arrow-selected {
      fill: var(--accent);
    }

    .arrow-flow {
      fill: var(--success);
    }

    .relation-rejected {
      fill: var(--panel);
      stroke: var(--edge);
      stroke-width: 2px;
    }

    .relation-selected {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .cross {
      stroke: var(--edge);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .check {
      fill: none;
      stroke: var(--success);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .legend-rejected {
      stroke: var(--edge);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .legend-selected {
      stroke: var(--accent);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    text {
      fill: var(--ink);
      font-size: 16px;
      dominant-baseline: middle;
    }

    .small {
      font-size: 14px;
      fill: var(--muted);
    }

    .eyebrow {
      font-size: 13px;
      font-weight: bold;
      fill: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .query {
      font-size: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: bold;
    }

    .node-title {
      font-size: 20px;
      font-weight: bold;
    }

    .relation {
      font-size: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: bold;
    }

    .selected-text {
      fill: var(--accent);
    }

    .answer-text {
      fill: var(--success);
      font-weight: bold;
    }

    .fallback {
      font-size: 18px;
      color: var(--ink);
      background: var(--panel);
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Как запрос P108 находит работодателя</h1>
    <svg id="diagram"
         viewBox="0 0 1120 430"
         width="1120"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        От узла Tim Cook выходят рёбра role, P108 и start_date.
        Фильтр relation=P108 отбрасывает остальные типы и оставляет ребро к Apple.
      </desc>
    </svg>
    <p id="fallback" class="fallback" hidden>
      От Tim Cook выходят рёбра role, P108 и start_date.
      Фильтр relation=P108 оставляет только исходящее ребро к Apple.
    </p>
  </figure>

  <script>
    const DATA = Object.freeze({
      zero: 0,

      queryBox: { x: .25, y: .12, w: 9.55, h: .68, r: .14 },
      sourceBox: { x: .25, y: 1.55, w: 1.95, h: .82, r: .16 },

      targetBoxes: [
        { x: 5.75, y: .92, w: 1.9, h: .68, r: .14 },
        { x: 5.75, y: 1.72, w: 1.9, h: .68, r: .14 },
        { x: 5.75, y: 2.52, w: 1.9, h: .68, r: .14 }
      ],

      resultPanel: { x: 8.02, y: 1.08, w: 1.78, h: 2.15, r: .16 },
      answerBox: { x: 8.2, y: 1.72, w: 1.42, h: .78, r: .14 },
      legendBox: { x: .25, y: 3.52, w: 9.55, h: .55, r: .12 },

      edges: [
        {
          kind: "rejected",
          line: [{ x: 2.2, y: 1.72 }, { x: 5.75, y: 1.26 }],
          arrow: [
            { x: 5.75, y: 1.26 },
            { x: 5.52, y: 1.18 },
            { x: 5.56, y: 1.38 }
          ],
          relationBox: { x: 3.05, y: 1.2, w: .86, h: .42, r: .1 },
          relationLabel: { x: 3.48, y: 1.41, text: "role" },
          statusLabel: { x: 4.38, y: 1.05, text: "не P108" },
          cross: [
            [{ x: 4.92, y: 1.13 }, { x: 5.08, y: 1.29 }],
            [{ x: 5.08, y: 1.13 }, { x: 4.92, y: 1.29 }]
          ]
        },
        {
          kind: "selected",
          line: [{ x: 2.2, y: 1.96 }, { x: 5.75, y: 2.06 }],
          arrow: [
            { x: 5.75, y: 2.06 },
            { x: 5.52, y: 1.94 },
            { x: 5.52, y: 2.16 }
          ],
          relationBox: { x: 3.02, y: 1.76, w: 1.02, h: .46, r: .1 },
          relationLabel: { x: 3.53, y: 1.99, text: "P108" },
          statusLabel: { x: 4.36, y: 2.28, text: "совпало" },
          check: [
            { x: 4.88, y: 2.08 },
            { x: 4.99, y: 2.2 },
            { x: 5.2, y: 1.94 }
          ]
        },
        {
          kind: "rejected",
          line: [{ x: 2.2, y: 2.2 }, { x: 5.75, y: 2.86 }],
          arrow: [
            { x: 5.75, y: 2.86 },
            { x: 5.54, y: 2.69 },
            { x: 5.5, y: 2.9 }
          ],
          relationBox: { x: 2.86, y: 2.5, w: 1.43, h: .42, r: .1 },
          relationLabel: { x: 3.575, y: 2.71, text: "start_date" },
          statusLabel: { x: 4.4, y: 3.08, text: "не P108" },
          cross: [
            [{ x: 4.92, y: 2.79 }, { x: 5.08, y: 2.95 }],
            [{ x: 5.08, y: 2.79 }, { x: 4.92, y: 2.95 }]
          ]
        }
      ],

      flow: {
        line: [{ x: 7.65, y: 2.06 }, { x: 8.2, y: 2.06 }],
        arrow: [
          { x: 8.2, y: 2.06 },
          { x: 7.98, y: 1.94 },
          { x: 7.98, y: 2.18 }
        ]
      },

      texts: [
        { x: .52, y: .34, text: "ФИЛЬТР ЗАПРОСА", className: "eyebrow", anchor: "start" },
        { x: 2.08, y: .47, text: "relation = “P108”", className: "query", anchor: "start" },
        { x: 5.15, y: .47, text: "проверяется тип каждого исходящего ребра", className: "small", anchor: "start" },

        { x: 1.225, y: 1.84, text: "Tim Cook", className: "node-title", anchor: "middle" },
        { x: 1.225, y: 2.14, text: "исходный узел", className: "small", anchor: "middle" },

        { x: 6.7, y: 1.16, text: "руководитель", className: "", anchor: "middle" },
        { x: 6.7, y: 1.39, text: "роль", className: "small", anchor: "middle" },

        { x: 6.7, y: 1.96, text: "Apple", className: "node-title", anchor: "middle" },
        { x: 6.7, y: 2.19, text: "работодатель", className: "small", anchor: "middle" },

        { x: 6.7, y: 2.76, text: "начало работы", className: "", anchor: "middle" },
        { x: 6.7, y: 2.99, text: "дата", className: "small", anchor: "middle" },

        { x: 8.91, y: 1.35, text: "ОСТАЁТСЯ", className: "eyebrow", anchor: "middle" },
        { x: 8.91, y: 1.58, text: "одно совпадение", className: "small", anchor: "middle" },
        { x: 8.91, y: 1.94, text: "P108 → Apple", className: "relation answer-text", anchor: "middle" },
        { x: 8.91, y: 2.25, text: "ответ запроса", className: "small", anchor: "middle" },
        { x: 8.91, y: 2.83, text: "Направление:", className: "small", anchor: "middle" },
        { x: 8.91, y: 3.04, text: "от Tim Cook к Apple", className: "small", anchor: "middle" },

        { x: .78, y: 3.8, text: "проходит фильтр P108", className: "small", anchor: "start" },
        { x: 4.86, y: 3.8, text: "остаётся в графе, но скрывается этим запросом", className: "small", anchor: "start" }
      ],

      legendLines: [
        { x1: .4, y1: 3.8, x2: .66, y2: 3.8, className: "legend-selected" },
        { x1: 4.48, y1: 3.8, x2: 4.74, y2: 3.8, className: "legend-rejected" }
      ]
    });

    const origin = Object.freeze({ x: 44, y: 28 });
    const scale = Object.freeze({ x: 108, y: 92 });

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      function make(tag, attributes, content) {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          if (value !== undefined && value !== "") {
            element.setAttribute(name, value);
          }
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      }

      function addRect(box, className) {
        const { x, y, w, h, r } = box;
        svg.appendChild(make("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y),
          rx: sx(r) - sx(DATA.zero),
          class: className
        }));
      }

      function addLine(points, className) {
        const [start, end] = points;
        svg.appendChild(make("line", {
          x1: sx(start.x),
          y1: sy(start.y),
          x2: sx(end.x),
          y2: sy(end.y),
          class: className
        }));
      }

      function addPolyline(points, className) {
        svg.appendChild(make("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        }));
      }

      function addPolygon(points, className) {
        svg.appendChild(make("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        }));
      }

      function addText(item) {
        svg.appendChild(make("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: item.className,
          "text-anchor": item.anchor
        }, item.text));
      }

      addRect(DATA.queryBox, "query-panel");
      addRect(DATA.resultPanel, "panel");
      addRect(DATA.legendBox, "panel");

      DATA.edges.forEach(edge => {
        const selected = edge.kind === "selected";
        addLine(edge.line, selected ? "edge-selected" : "edge-rejected");
        addPolygon(edge.arrow, selected ? "arrow-selected" : "arrow-rejected");
      });

      addLine(DATA.flow.line, "flow-line");
      addPolygon(DATA.flow.arrow, "arrow-flow");

      addRect(DATA.sourceBox, "source-node");
      DATA.targetBoxes.forEach(addTarget => addRect(addTarget, "target-node"));
      addRect(DATA.answerBox, "answer-card");

      DATA.edges.forEach(edge => {
        const selected = edge.kind === "selected";
        addRect(edge.relationBox, selected ? "relation-selected" : "relation-rejected");
        addText({
          ...edge.relationLabel,
          className: selected ? "relation selected-text" : "relation",
          anchor: "middle"
        });
        addText({
          ...edge.statusLabel,
          className: selected ? "small answer-text" : "small",
          anchor: "middle"
        });

        if (edge.cross) {
          edge.cross.forEach(segment => addLine(segment, "cross"));
        }
        if (edge.check) {
          addPolyline(edge.check, "check");
        }
      });

      DATA.legendLines.forEach(item => {
        addLine(
          [{ x: item.x1, y: item.y1 }, { x: item.x2, y: item.y2 }],
          item.className
        );
      });

      DATA.texts.forEach(addText);
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
