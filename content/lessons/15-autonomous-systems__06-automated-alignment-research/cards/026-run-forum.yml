- concept: 'порядок действий одного раунда форума: назначение, решение, публикация, возможная подделка, проверка'
  question: Расставь шаги функции, выполняющей полный прогон форума, в правильном порядке.
  explanation: 'Проверка идёт последней, потому что её предмет — окончательное содержимое журнала. Подделка возможна только после публикации: менять можно лишь то, что уже сохранено.'
  kind: order
  items:
    - Создать пустой форум (журнал записей)
    - Раздать входные задачи агентам, получив назначения с режимом
    - Для каждого назначения вычислить находку по задаче и режиму
    - Опубликовать находку в журнал штатной функцией добавления записи
    - Если агент помечен как скомпрометированный — изменить его уже сохранённую запись
    - Проверить целостность всего журнала и вернуть записи вместе с итогом проверки
  id: 026-run-forum-1
  fingerprint: e4ab0559
- concept: проверка целостности должна выполняться над финальным состоянием журнала, иначе она сертифицирует состояние, которого больше нет
  question: В прогоне форума верификация журнала вызывается сразу после каждой публикации, а изменение сохранённых записей происходит позже. Каков главный дефект такой схемы?
  explanation: Верификация — утверждение о конкретном состоянии журнала на момент проверки. Всё, что изменено позже, остаётся вне её охвата, и итог прогона становится ложно обнадёживающим.
  kind: choice
  options:
    - Проверка выполняется слишком часто и замедляет прогон
    - Проверка подтверждает состояние, существовавшее до подделки, и результат прогона выглядит чистым при изменённом журнале
    - Отпечатки перестают быть детерминированными при повторном вызове
    - Записи публикуются в неверном порядке
  correct: 1
