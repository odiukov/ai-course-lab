- concept: публикация только через штатную функцию добавления записи гарантирует единый формат и вычисление отпечатка
  question: Почему в прогоне нельзя собирать запись журнала вручную (словарём с полями) вместо вызова штатной функции добавления?
  explanation: Отпечаток и канонический формат — инварианты, которые держит одна точка входа. Обход этой точки создаёт запись, для которой проверка либо невозможна, либо даёт бессмысленный результат.
  kind: choice
  options:
    - Ручная сборка работает медленнее из-за копирования словаря
    - Ручная сборка обходит единый формат записи и вычисление отпечатка, поэтому запись может попасть в журнал непроверяемой
    - Ручная сборка нарушает append-only, так как перезаписывает предыдущий элемент
    - Ручная сборка запрещена правами доступа песочницы
  correct: 1
