- concept: прогон, в котором отсутствует ветка компрометации, измеряет только благоприятный сценарий и завышает оценку надёжности контура
  question: 'Симулятор форума из 5 агентов моделирует только добросовестное поведение: назначение, решение, публикация. Объясни своими словами, почему такой прогон не даёт оснований утверждать, что контур форума надёжен.'
  explanation: Незадействованный детектор не даёт свидетельства. Поэтому попытка подделки — штатная часть модели прогона, а не отдельный «плохой» сценарий.
  kind: open
  reference: 'Прогон без враждебной ветки проверяет лишь то, что работает пайплайн в отсутствие противника. Свойство, ради которого строится append-only журнал с отпечатками, — обнаружение изменения уже опубликованного — в таком прогоне вообще не нагружается: детектор ни разу не получает вход, на котором должен сработать. Молчание проверки тогда не отличимо от её неработоспособности. Чтобы утверждение о надёжности имело смысл, в прогоне должна быть попытка изменить сохранённую запись и наблюдаемая реакция верификации на неё.'
