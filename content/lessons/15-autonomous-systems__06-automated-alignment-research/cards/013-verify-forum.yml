- concept: целостность журнала — конъюнкция по всем записям, поэтому проверка одной записи ничего не гарантирует про остальные
  question: Аудитор журнала из 60 записей пересчитывает хеш только у самой свежей записи и получает совпадение. Что он вправе заключить?
  explanation: Хеш записи — обязательство о содержимом ровно этой записи и ни о какой другой. Пока записи не сцеплены в цепочку, совпадение у одной ничего не говорит про соседей, поэтому проверка целостности журнала — это проверка каждой записи и логическое И по всем результатам.
  kind: choice
  options:
    - 'Что журнал цел целиком: последняя запись зависит от всех предыдущих'
    - Что не изменена только эта одна запись; подделка в любой из остальных 59 останется незамеченной
    - Что журнал цел, если записи добавлялись строго по времени
    - Что подделка возможна только в записях, добавленных после проверенной
  correct: 1
  id: 013-verify-forum-1
  fingerprint: 9ec95f9d
- concept: проверка прекращается на первом расхождении, потому что последующие совпадения не восстанавливают целостность
  question: Журнал из 200 записей проверяется по порядку, с досрочным возвратом при первом несовпадении. Изменена запись номер 138 (нумерация с единицы), остальные целы. Сколько хешей будет пересчитано до возврата отрицательного результата?
  explanation: 'Записи 1–137 совпадают и проверка идёт дальше, на 138-й обнаруживается расхождение и функция возвращает отрицательный результат. Итого 138 пересчётов. Продолжать смысла нет: целостность — это И по всем записям, и одно ложное значение уже определяет результат.'
  kind: numeric
  answer: 138
  tolerance: 0.5
  id: 013-verify-forum-2
  fingerprint: 7558cf1c
- concept: верификатор только наблюдает; запись пересчитанного отпечатка поверх сохранённого уничтожает свидетельство подделки
  question: Почему процедура проверки целостности не должна записывать пересчитанный отпечаток поверх сохранённого, даже когда они не совпали?
  explanation: 'Проверка, которая чинит расхождение, превращается в механизм отмывания подделки. Отсюда и правило: у процедуры верификации права только на чтение, а любое изменение журнала оформляется новой записью, а не правкой старой.'
  kind: open
  reference: 'Сохранённый отпечаток — это обязательство, зафиксированное в момент добавления записи. Пересчитанный отпечаток соответствует текущему, возможно изменённому содержимому. Перезапись делает их равными и любая последующая проверка пройдёт успешно: единственное свидетельство подделки стёрто, а изменённое содержимое узаконено. Верификатор должен только читать и сообщать результат; исправление — отдельное действие с отдельными правами, и делает его не тот, кто проверяет.'
  id: 013-verify-forum-3
  fingerprint: 2cedd6fb
