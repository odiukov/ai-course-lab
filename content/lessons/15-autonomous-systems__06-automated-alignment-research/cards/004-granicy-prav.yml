- concept: агенты обмениваются находками через форум, но не имеют доступа в чужие песочницы
  question: Агент A хочет узнать, что выяснил агент B в параллельном эксперименте. Что ему доступно?
  explanation: Обмен идёт только через опубликованные находки. Рабочие пространства остаются приватными — иначе изоляция песочниц не давала бы ничего.
  kind: choice
  options:
    - Прочитать записи агента B на общем форуме; в песочницу агента B доступа нет
    - Смонтировать файловую систему песочницы агента B и посмотреть его черновики и логи
    - Запросить у очереди задач копию рабочего каталога агента B
