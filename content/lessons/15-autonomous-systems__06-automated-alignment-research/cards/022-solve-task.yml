- concept: 'набор крайних случаев для проверки такой модели: обе сложности в обоих режимах плюс нераспознанное значение режима'
  question: Каким минимальным набором проверок убедиться, что реализация действительно кодирует зависимость исхода от режима и сложности?
  explanation: Четыре комбинации показывают, меняется ли сравнительный исход при росте сложности, а не зашит ли режим-победитель константой. Неизвестное значение режима проверяет, что функция не возвращает молча результат одной из веток.
  kind: choice
  options:
    - Один прогон трудной задачи в свободном режиме — там эффект максимален
    - Простая и трудная задача в каждом из режимов, плюс поведение при неизвестном значении режима
    - Несколько прогонов одной задачи в одном режиме для оценки разброса
