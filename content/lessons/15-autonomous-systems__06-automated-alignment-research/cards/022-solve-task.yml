- concept: модель исхода задачи не переназначает исполнителя и не пишет в журнал — распределение и публикация лежат вне её ответственности
  question: Функция, считающая исход задачи, получила задачу и режим. Что она делать НЕ должна?
  explanation: 'Выбор исполнителя делает распределитель, публикацию — форум. Смешение ответственностей ломает и приоритет очереди, и аудит: одна функция начинает и решать, и фиксировать собственный результат.'
