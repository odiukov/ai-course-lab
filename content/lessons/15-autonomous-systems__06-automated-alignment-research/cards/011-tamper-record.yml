  fingerprint: bde82ae0
- concept: 'имитируемая модель угрозы: доступ к содержимому записи при отсутствии доступа к остальным полям и составу журнала'
  question: Имитация злоумышленника подменяет текст находки, но оставляет прежними автора записи, её позицию в журнале и сохранённый вместе с ней отпечаток. Какую модель угрозы описывает такой набор ограничений?
  explanation: 'Любой тест защиты осмыслен только внутри объявленной модели угрозы. Здесь она узкая и намеренно такая: атакующий добрался до текста, но не до всей истории.'
  kind: open
  reference: 'Описывается атакующий с частичным доступом: он может переписать содержимое уже принятой записи, но не может подделать её метаданные и не может привести сохранённый отпечаток в соответствие с новым текстом. Это и есть интересный для проверки случай — след атаки остаётся именно в виде несоответствия между содержимым и сопровождающими его данными. Если бы имитация переписывала всё подряд, включая отпечаток, эксперимент проверял бы не механизм обнаружения, а сценарий полного захвата хранилища, где обсуждаемая защита неприменима по построению. Ограничение также делает подделку точечной и воспроизводимой: изменилось ровно одно поле одной записи, всё остальное — контроль.'
  id: 011-tamper-record-2
  fingerprint: e7bb6e1c
