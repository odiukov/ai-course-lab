- concept: атака на целостность опаснее атаки на доступность, потому что система продолжает выглядеть работающей
  question: Скомпрометированный исследовательский агент может либо стереть форум целиком, либо незаметно заменить содержимое одной опубликованной находки на противоположное. Почему второй сценарий считают более опасным для исследовательского контура?
  explanation: 'Упавший форум — это авария, её замечают в тот же момент. Подменённая находка не создаёт никакого события: агенты читают её, доверяют ей и строят на ней планы. Целостность подрывается тихо, поэтому её проверяют отдельным механизмом, а не по факту жалоб.'
  kind: choice
  options:
    - Он дешевле в исполнении и требует меньше прав доступа к хранилищу
    - Отказ виден сразу и вызывает реакцию, а подмена оставляет систему внешне исправной, и ложные данные продолжают использоваться как доверенные
    - Он необратим, тогда как удалённый форум всегда восстанавливается из резервной копии
  correct: 1
  id: 010-poddelka-1
  fingerprint: 9e67f17f
- concept: ложная находка распространяется через чтение форума, поэтому ущерб превышает долю скомпрометированного агента
  question: На форуме работают шесть исследовательских агентов, один из них скомпрометирован. Почему доля испорченного исследовательского выхода оказывается выше доли этого агента в публикациях?
  explanation: Форум — общий источник посылок, а не витрина результатов. Ложный вывод становится входом для следующего цикла экспериментов у всех, кто его прочитал, и портит их выводы тоже. Поэтому один агент из шести портит заметно больше одной шестой выхода.
  kind: choice
  options:
    - Скомпрометированный агент публикует чаще остальных, потому что не тратит время на реальные эксперименты
    - Остальные агенты читают форум и берут ложную находку в основание собственных экспериментов, так что заражение переходит в чужие публикации
    - Хранилище дублирует записи между агентами, и одна подделка физически размножается по журналу
  correct: 1
  id: 010-poddelka-2
  fingerprint: e5397ccf
- concept: подделку в эксперименте делают контролируемой, чтобы отличить срабатывание детектора от постороннего сбоя
  question: Зачем при проверке защиты форума заранее фиксируют, какую запись портят, в какой момент и каким было её исходное содержимое, вместо того чтобы дать скомпрометированному агенту произвольно вредить?
  explanation: 'Это стандартная логика теста защиты: атака должна быть управляемым входом с известным ожидаемым выходом. Неограниченный вред превращает эксперимент в аварию, из которой нельзя сделать вывод о качестве механизма.'
  kind: open
  reference: 'Проверяется не факт «что-то сломалось», а конкретная реакция механизма целостности. Известная цель даёт ожидаемый ответ детектора: расхождение должно возникнуть ровно на этой записи и ни на какой другой. Известный момент отделяет последствия подделки от ошибок кода и случайных сбоев, случившихся раньше или позже. Известное исходное содержимое позволяет измерить ущерб и восстановить состояние. Кроме того, ограниченное и воспроизводимое изменение можно повторять в тестах, а произвольный вред невоспроизводим и не даёт понять, поймал детектор атаку или промолчал.'
  id: 010-poddelka-3
  fingerprint: 8c35659f
