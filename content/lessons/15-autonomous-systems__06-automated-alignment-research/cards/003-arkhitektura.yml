- concept: weak-to-strong обучение — более слабая модель-надзиратель обучает более сильного ученика
  question: Что такое weak-to-strong обучение — задача, на которой AAR публично обошли людей-исследователей?
  explanation: 'Weak-to-strong — про асимметрию надзора: сигнал даёт более слабый надзиратель, а учится более сильная модель. Это прокси для ситуации, когда люди слабее модели, которую надзирают.'
  kind: choice
  options:
    - Постепенное увеличение размера модели во время обучения — от маленькой к большой
    - Схема, где более слабая модель-надзиратель обучает более сильного ученика
    - Обучение сильной модели на данных, отфильтрованных другой сильной моделью того же размера
