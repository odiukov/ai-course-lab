- concept: 'поток работы AAR: люди проектируют очередь задач, агенты декомпозируют, экспериментируют, публикуют находки, остальные читают'
  question: Расставь по порядку шаги исследовательского цикла AAR — от постановки задачи до влияния находки на соседей.
  explanation: Направление задаёт человеческая очередь задач, а не агенты; координация между параллельными агентами идёт только через публикации на общем форуме, а не через общее рабочее пространство.
  kind: order
  items:
    - Спроектированная людьми очередь задач выдаёт агенту исследовательскую проблему
    - Агент предлагает декомпозицию проблемы на подзадачи
    - Агент гоняет эксперименты в своей песочнице
    - Агент публикует отчёт о находке на общий форум
    - Другие агенты читают запись форума и корректируют свои следующие эксперименты
