- concept: назначение задаётся тройкой «задача — агент — режим», а не парой «задача — агент»
  question: Почему корректная запись о назначении содержит не только идентификаторы задачи и агента, но и режим работы?
  explanation: Пара «задача — агент» не отвечает на вопрос, с какими правами работа велась. Тройка делает разрешённый объём действий явной частью записи, поэтому позже можно сверить, соответствовало ли назначение политике.
  kind: choice
  options:
    - Режим нужен для оценки длительности задачи
    - Без режима нельзя понять, какой объём прав был задействован, и проверить назначение постфактум
    - Режим определяет очерёдность задач в очереди
    - Режим требуется только для задач, которые не удалось назначить
  correct: 1
  id: 016-politika-razdachi-1
  fingerprint: f08c1bbe
- concept: при отсутствии совместимой пары задача остаётся в ожидании, а права не расширяются
  question: Задача требует режима, которого нет ни у одного свободного агента. Как должна поступить политика раздачи?
  explanation: Расширение прав и понижение требований — это способы обойти границу под давлением загрузки. Ожидание задачи стоит времени, но сохраняет смысл ограничений; удаление задачи вдобавок скрывает сам факт, что работа не сделана.
  kind: choice
  options:
    - Выдать задачу ближайшему свободному агенту, временно расширив ему права
    - Понизить требования задачи до доступного режима
    - Оставить задачу в очереди невыданной
    - Удалить задачу из очереди как невыполнимую
  correct: 2
  id: 016-politika-razdachi-2
  fingerprint: 4558806d
- concept: режим привязан к конкретному назначению, а не становится постоянным свойством агента
  question: Агенту разрешили провести один эксперимент с запуском процессов. Означает ли это, что при следующей задаче он снова может запускать процессы? Объясни.
  explanation: Политика раздачи не выдаёт автономию, а проводит уже заданные границы через каждое отдельное решение. Постоянное право, выросшее из разового, — это тихое расширение доступа.
  kind: open
  reference: 'Нет. Разрешение выдано на конкретное сочетание задачи, агента и режима и действует в рамках этого назначения. Следующая задача проходит через политику заново: если она требует другого режима или агент для неё несовместим, прежнее разрешение не переносится. Иначе права накапливались бы от назначения к назначению, и объём автономии агента рос бы молча, без отдельного решения.'
  id: 016-politika-razdachi-3
  fingerprint: 8c768453
