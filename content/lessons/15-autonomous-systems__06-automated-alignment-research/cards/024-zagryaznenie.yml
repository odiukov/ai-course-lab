- concept: 'локализация последствий требует прослеживаемости зависимостей: какие последующие работы опирались на разоблачённую запись'
  question: Спустя несколько раундов выяснилось, что одна опубликованная находка ложна. Почему пометки этой записи как недостоверной недостаточно и что нужно для устранения последствий?
  explanation: Общий канал делает ошибку множителем, а не разовым событием. Отзыв, ограниченный одной записью, не догоняет её потомков.
  kind: open
  reference: 'Ложная запись успела стать предпосылкой других работ: кто-то подбирал параметры к описанному методу, кто-то сравнивал его с альтернативой. Эти результаты получены честно, целостность их записей не нарушена, но их выводы наследуют ложную посылку и продолжают читаться остальными. Нужна прослеживаемость: у каждой записи должно быть видно, на какие предыдущие находки она опирается, чтобы после разоблачения можно было построить множество зависимых работ и пометить или перепроверить их. Без такого графа зависимостей отметка на исходной записи оставляет её следствия в обращении.'
  id: 024-zagryaznenie-2
  fingerprint: ddd5e0db
