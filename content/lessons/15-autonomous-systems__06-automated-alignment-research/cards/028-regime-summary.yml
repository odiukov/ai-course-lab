- concept: нарушение целостности относится к тому режиму, в чьей записи обнаружено расхождение, и не переносится в статистику другого режима
  question: Проверка нашла расхождение отпечатка в записи, опубликованной агентом в режиме `free-decomposition`. Куда попадает это нарушение в сводке из 15 записей по двум режимам?
  explanation: Смысл сводки — сопоставление режимов. Разнесение нарушения не по принадлежности записи ломает именно то сравнение, ради которого сводка считается.
  kind: choice
  options:
    - В общий счётчик прогона, без привязки к режиму
    - Только в счётчик режима `free-decomposition`, потому что сравниваются режимы, а не прогоны
    - Поровну в оба режима, так как форум общий
    - В режим `fixed-workflow`, потому что он отвечает за аудит
  correct: 1
