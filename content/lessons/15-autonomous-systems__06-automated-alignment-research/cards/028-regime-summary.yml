- concept: счётчик нарушений реагирует на несовпадение отпечатка с содержимым, а не на оценку качества находки
  question: 'Запись с подозрительно высоким качеством находки прошла проверку: пересчитанный отпечаток совпал с сохранённым. Что должен показать счётчик нарушений?'
  explanation: Отпечаток свидетельствует о неизменности содержимого, а не о его истинности. Подозрительность высокой оценки — отдельный вопрос, и смешивать его со счётчиком целостности значит сделать оба показателя нечитаемыми.
  kind: choice
  options:
    - Увеличиться, потому что аномально высокое качество — признак подделки
    - 'Остаться прежним: счётчик фиксирует расхождение отпечатка и содержимого, а не правдоподобие оценки'
    - Увеличиться на долю превышения над средним качеством
    - Обнулить качество этой записи в сводке режима
  correct: 1
