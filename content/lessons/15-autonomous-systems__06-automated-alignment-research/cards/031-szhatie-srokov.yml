- concept: вклад дополнительного результата по выравниванию в сокращение разрыва обусловлен доверием к процессу, поэтому число отчётов не является мерой прогресса
  question: Автоматизированный контур выдал за квартал 40 отчётов по выравниванию против 8 у прежней ручной схемы. Какой вывод о сокращении разрыва отсюда следует?
  explanation: 'Связь «результат сокращает разрыв» держится тогда и только тогда, когда процессу, который этот результат произвёл, можно доверять. Непойманный подтасованный отчёт даёт не нулевой, а отрицательный вклад: на нём строят дальнейшую работу. Поэтому гарантии целостности — не надстройка над пользой контура, а условие самой пользы.'
  kind: choice
  options:
    - Разрыв сократился в пять раз — вклад пропорционален числу отчётов
    - 'Никакой: каждый отчёт сокращает разрыв только при условии, что самому исследовательскому процессу можно доверять, а число отчётов этого условия не проверяет'
    - Разрыв точно не изменился, потому что автоматические отчёты не считаются результатом
    - Вывод возможен, если хотя бы половина отчётов прошла публикацию на общем канале
