- concept: сжатие цикла умножает производные работы от одного непроверенного результата, увеличивая глубину и цену ветки ложных выводов за то же календарное время
  question: Доля ошибочных результатов на один прогон не изменилась, но длительность исследовательского цикла сократилась с месяца до недели. Объясни своими словами, почему при этом ущерб от одного непроверенного результата растёт.
  explanation: 'Ускорение масштабирует и хорошие, и ложные находки. Ключевой множитель — производные работы: если на сомнительном результате строятся дальнейшие эксперименты, за неделю возникает ветка, которая раньше набиралась месяц. Отсюда требование независимой перепроверки перед использованием чужого результата как предпосылки и прослеживаемость зависимостей для локализации последствий.'
  kind: open
  reference: 'Ошибочный результат не остаётся изолированным: он становится предпосылкой следующих работ. За то же календарное время сжатый цикл успевает построить на нём больше производных экспериментов и глубже вложенную цепочку выводов, а обнаружение и разбор зависимостей происходят по человеческим срокам, которые не сжались. Поэтому при неизменной доле ошибок на прогон растёт число и глубина заражённых веток, а также объём работы, которую придётся отозвать. Пропускная способность контура — не то же самое, что прогресс: она усиливает выбранное направление, включая ошибочное.'
