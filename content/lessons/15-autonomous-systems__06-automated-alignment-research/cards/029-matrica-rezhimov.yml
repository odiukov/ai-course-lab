- concept: 'две ячейки с равным результатом неэквивалентны, если требуют разного объёма аудита: качество и проверяемость — разные оси выбора'
  question: В матрице результатов две ячейки дают одинаковые 40 баллов качества, но одна оставила прозрачную цепочку действий, а другая потребовала кратно большего разбора. Что из этого следует?
  explanation: Матрица не назначает победителя, а показывает, где возникло преимущество и какой ценой. Равный балл при разной проверяемости — это разные предложения, а не одно и то же.
  kind: choice
  options:
    - 'Ячейки эквивалентны: сравнение ведётся по качеству решения'
    - 'Ячейки неэквивалентны: при равном результате различается цена проверки, и выбор режима зависит от того, сколько аудита вы готовы оплатить'
    - Вторую ячейку нужно исключить из матрицы как ненадёжную
    - Разница в аудите означает, что качество измерено неверно и его надо пересчитать
