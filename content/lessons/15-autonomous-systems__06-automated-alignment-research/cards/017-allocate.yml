- concept: агент, получивший назначение, выбывает из пула свободных до конца прохода, иначе один агент получает несколько задач
  question: Расставьте шаги одного прохода распределения задач по агентам с учётом допусков.
  explanation: '«Свободен» — это состояние, которое меняется по ходу прохода. Если не убирать назначенного агента из пула, один агент соберёт несколько задач: каждая проверка допуска пройдёт, а фактическая занятость учтена не будет.'
  kind: order
  items:
    - Взять очередную задачу из очереди, соблюдая её порядок
    - Среди агентов, ещё не получивших назначения, найти того, чей допуск покрывает требуемый режим
    - Создать назначение и пометить выбранного агента занятым
    - Перейти к следующей задаче, не возвращая занятого агента в пул кандидатов
  id: 017-allocate-2
  fingerprint: 21ecbc81
- concept: пропускная способность распределения ограничена числом агентов с нужным допуском, а не длиной очереди
  question: 'В очереди 20 задач: 12 требуют режима эксперимента, 8 — режима анализа. Свободны 5 агентов с допуском только к экспериментам и 6 агентов с допуском только к анализу; каждый агент берёт не более одной задачи. Сколько задач останется в ожидании после прохода?'
  explanation: 'Пулы допусков не пересекаются, поэтому классы считаются отдельно: экспериментов назначено min(12, 5) = 5, анализов min(8, 6) = 6, всего 11 назначений из 20 задач. В ожидании остаются 9. Узкое место — допуски, а не длина очереди: добавление задач в очередь эту цифру не улучшит, а расширять права агентов ради заполнения очереди распределитель не имеет права.'
  kind: numeric
  answer: 9
  tolerance: 0.5
