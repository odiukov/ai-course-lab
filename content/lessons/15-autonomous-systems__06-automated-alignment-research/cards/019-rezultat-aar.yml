- concept: перенос результата на новые условия требует отдельной проверки каждого различающегося звена сравнения
  question: Хотим утверждать, что преимущество агентной системы над людьми держится и на других задачах выравнивания. Что для этого нужно в первую очередь?
  explanation: Каждое изменённое звено — новая задача, другие участники, другой лимит времени, другой критерий — это отдельная гипотеза. Повтор одного и того же заезда даёт устойчивость результата, но не его переносимость.
  kind: choice
  options:
    - Повторить тот же самый эксперимент ещё 4 раза
    - Повысить балл системы на уже пройденной задаче
    - Прогнать сравнение на других задачах, зафиксировав состав участников, ресурсы и критерий оценки
  correct: 2
