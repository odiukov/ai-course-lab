- concept: балл по исследовательской метрике не свидетельствует ни о полезности, ни о безопасности произведённых идей
  question: Почему из более высокого балла агентной системы в исследовательской оценке нельзя заключить, что её идеи полезнее и безопаснее человеческих?
  explanation: 'Классическая подмена: показатель принимают за то, ради чего он вводился. Корректное чтение — измеримое преимущество по конкретному критерию, не более.'
  kind: open
  reference: Балл измеряет соответствие выбранной метрике на выбранной задаче. Полезность идеи проверяется её воспроизведением и применением дальше, безопасность — отдельными проверками поведения и последствий. Метрика может вознаграждать то, что легко измерить (скорость, формальное качество отчёта, попадание в целевой показатель), и при этом ничего не говорить о том, устойчива ли идея, не оптимизирована ли она под саму метрику и какие риски несёт её применение. Поэтому «выше балл» — утверждение об измерении, а не о ценности или безопасности.
