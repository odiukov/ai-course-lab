- concept: узкое место исследований по выравниванию — время квалифицированных исследователей, а не идеи или вычисления
  question: Объясни своими словами, почему в исследованиях по выравниванию узким местом считают именно время исследователей, а не вычислительные мощности.
  explanation: 'Разрыв считается просто: недели на итерацию × ограниченное число людей против непрерывно растущего списка задач по безопасности.'
  kind: open
  reference: 'Одна итерация эксперимента (масштабируемый надзор, спецификация награды, weak-to-strong обучение) занимает недели человеческого внимания: постановка гипотезы, дизайн, анализ результата. Компьют можно докупить, а квалифицированных исследователей по выравниванию мало и подготовка занимает годы. При этом объём задач растёт вместе с фронтирными возможностями быстрее, чем прибывают люди. Отсюда мотивация AAR: перенести часть итераций на модели, которые крутят их параллельно и круглосуточно.'
