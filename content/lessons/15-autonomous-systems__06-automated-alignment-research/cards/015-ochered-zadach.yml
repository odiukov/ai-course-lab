- concept: самостоятельность в исполнении задачи не даёт права переопределять исследовательскую повестку
  question: Агент по ходу выданной задачи наткнулся на побочный результат, который кажется важнее исходной проблемы. Что он вправе сделать, а что — нет, и почему граница проведена именно так?
  explanation: 'Смысл конструкции в том, что человек задаёт внешний контур, а не каждый шаг: агент работает быстро внутри границы, но перенос границы остаётся человеческим решением.'
  kind: open
  reference: 'Вправе: включить наблюдение в отчёт, описать, почему оно выглядит значимым, предложить постановку новой задачи. Не вправе: объявить побочный вопрос новым направлением и перевести на него вычисления, подменив выданную задачу. Свобода агента лежит внутри задачи — декомпозиция, план экспериментов, интерпретация; состав повестки задают люди. Иначе автономия исполнения незаметно превращается в автономию целеполагания, и внешний контур перестаёт что-либо ограничивать.'
  id: 015-ochered-zadach-2
