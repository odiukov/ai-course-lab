- concept: признаки задачи, наблюдаемые до запуска, по которым выбирается режим работы агента
  question: Ты формируешь очередь из 6 задач и должен назначить каждой режим — предписанный workflow или свободную декомпозицию — до начала работы. Какие свойства самой задачи ты смотришь и как они склоняют выбор?
  explanation: 'Итог урока: победителем оказывается не режим, а правило выбора. Сравнение режимов ведётся внутри класса, а класс определяется признаками, доступными до запуска.'
  kind: open
  reference: 'Смотреть до запуска: (1) насколько известен маршрут решения — при отработанном, повторяющемся пути свободу выбирать нечем, и предписанный workflow конкурентен; (2) сколько правдоподобных направлений и развилок, где план придётся перестраивать — их наличие оправдывает свободную декомпозицию; (3) цена ошибки и обратимость последствий — дорогая ошибка сдвигает выбор к жёсткому сценарию; (4) требования к аудиту: предписанный маршрут проверяется сверкой с планом, свободный требует разбора принятых решений и границ. Все четыре признака наблюдаемы до прогона, поэтому не зависят от того, какой режим победил.'
