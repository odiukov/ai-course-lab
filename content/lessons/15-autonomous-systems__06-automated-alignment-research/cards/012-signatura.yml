- concept: 'процедура верификации записи: пересчитать отпечаток от текущего содержимого и сравнить с сохранённым'
  question: Расставь шаги проверки того, что запись форума не менялась после публикации.
  explanation: 'Ключевое условие — «теми же правилами»: другая сортировка ключей или другие разделители дадут расхождение на нетронутой записи. Сравниваются два отпечатка, а не тексты, поэтому проверка не зависит от того, помнит ли аудитор исходное содержимое.'
  kind: order
  items:
    - Взять текущее содержимое записи из журнала
    - Привести его к канонической форме теми же правилами сериализации, что применялись при публикации
    - Вычислить хеш от полученных байтов
    - Сравнить результат с отпечатком, сохранённым при публикации
  id: 012-signatura-1
  fingerprint: 4e6db4a4
- concept: отпечаток служит компактным обязательством о содержимом, поэтому проверка не требует хранить копию оригинала
  question: Проверяющий не сохранял копию исходного текста находки — только её отпечаток. Почему этого достаточно, чтобы уличить подмену?
  explanation: 'Хеш необратим: исходный текст из него не достаётся. Зато он работает как обязательство фиксированного размера — сравнить пересчитанное значение с сохранённым дешевле и надёжнее, чем хранить и сличать полные копии всех записей.'
  kind: choice
  options:
    - Из отпечатка восстанавливается исходный текст, и его можно сравнить с текущим
    - Отпечаток однозначно определяется содержимым, поэтому текущий текст, дающий другой отпечаток, заведомо не тот, что был зафиксирован при публикации
    - Отпечаток содержит контрольную сумму длины, и подмена меняет размер записи
  correct: 1
  id: 012-signatura-2
  fingerprint: d8413a8d
- concept: расхождение отпечатков фиксирует факт несоответствия, но не даёт ни автора, ни момента, ни исходного содержимого
  question: Пересчитанный отпечаток записи не совпал с сохранённым. Что именно установлено этим фактом?
  explanation: Хеш даёт обнаружение, а не атрибуцию и не восстановление. Расхождение говорит только о противоречии между отпечатком и содержимым; чтобы назвать виновника и момент, нужны другие данные — журналы доступа к хранилищу, а чтобы вернуть исходный текст — резервная копия.
  kind: choice
  options:
    - Что запись изменил конкретный агент, последним обращавшийся к хранилищу
    - Что текущее содержимое не соответствует зафиксированному при публикации; кто, когда и что именно менял, из расхождения не следует
    - Что запись была изменена ровно один раз и прежний текст восстановим из отпечатка
  correct: 1
  id: 012-signatura-3
  fingerprint: 9b673f88
