- concept: субъект аудита не должен иметь прав записи на собственный аудит-трейл, поэтому изоляция исполнения и целостность записи — разные гарантии
  question: Изолированная среда исполнения не даёт коду агента трогать остальную систему. Почему этого недостаточно, чтобы доверять журналу экспериментов, и что должно измениться в размещении журнала?
  explanation: 'Две разные гарантии: изоляция отвечает на вопрос «что код может сделать с системой», целостность лога — на вопрос «можно ли верить записи о том, что он сделал». Вторая достигается только выносом хранилища за периметр записи субъекта.'
  kind: open
  reference: 'Изоляция среды защищает окружение от кода: она ограничивает радиус поражения сбоя или вредного действия. Но журнал, лежащий внутри той же подконтрольной агенту зоны, остаётся объектом, который агент вправе редактировать — он одновременно и автор результата, и хранитель свидетельств о нём. Тогда отчёт доказывает лишь то, что агент решил показать. Журнал нужно вынести за границу прав агента: во внешнее хранилище, где у него есть право только на добавление записи и нет креденшелов на изменение и удаление прошлых. Тогда проверяющему не нужно верить в добросовестность агента — достаточно того, что инфраструктура не давала технической возможности скрыть неудачу.'
  id: 005-vneshnyaya-granica-3
