- concept: канонической сериализацию делает фиксированный порядок ключей и фиксированные разделители
  question: Две записи содержат одинаковые пары ключ-значение, но созданы с разным порядком вставки ключей. Дополни сериализацию так, чтобы обе дали одинаковую строку.
  explanation: Словарь сохраняет порядок вставки, поэтому без sort_keys=True эквивалентные записи дадут разные строки и разные отпечатки. separators убирает пробелы по умолчанию — второй источник расхождения. Каноническая форма нужна именно для того, чтобы 'одинаковое содержимое' означало 'одинаковые байты'.
  kind: cloze
  template: payload = json.dumps(record, sort_keys=___, separators=(",", ":"))
  answer: 'True'
  accept:
    - 'true'
    - 'True'
  id: 007-record-hash-1
  fingerprint: e72b03b7
- concept: хеш-функция принимает байты, поэтому строку нужно закодировать выбранной кодировкой
  question: Почему сериализованную запись перед вычислением хеша кодируют в байты, а не передают хеш-функции как текстовую строку?
  explanation: 'hashlib работает с bytes и на str кидает TypeError. Один и тот же символ в разных кодировках даёт разные байты, поэтому кодировку фиксируют явно (UTF-8) — иначе отпечаток зависел бы от настроек окружения. Хеширование не шифрует: содержимое из отпечатка не восстанавливается вовсе.'
  kind: choice
  options:
    - Кодирование сокращает длину входа и ускоряет вычисление
    - Хеш-функция определена над последовательностью байтов; текстовая строка — абстракция над символами, и без явной кодировки нет однозначного представления входа
    - Кодирование шифрует содержимое, и без него отпечаток можно было бы расшифровать обратно
  correct: 1
  id: 007-record-hash-2
  fingerprint: b4e9e58a
- concept: отпечаток должен покрывать всё содержимое записи, иначе непокрытые поля меняются незаметно
  question: Разработчик решает хешировать не всю запись, а только поле с результатом эксперимента — «остальное служебное». Объясни, что ломается в такой схеме.
  explanation: 'Область покрытия отпечатка — это ровно та область, где подмена обнаружима. Сузив вход хеша, сужаешь и защиту, причём молча: тесты на ''изменил символ в результате — хеш изменился'' продолжат проходить.'
  kind: open
  reference: 'Всё, что не вошло в хешируемое содержимое, изменяется без изменения отпечатка. Автор записи, идентификатор эксперимента, параметры прогона, отметка времени можно переписать, и проверка совпадения хешей промолчит. Тогда отпечаток перестаёт быть обязательством о записи и становится обязательством об одном поле: результат ''тот же'', но приписан другому агенту или другому набору параметров. Поэтому хешируют всю переданную запись целиком в канонической форме, а не выбранное подмножество ''важных'' полей.'
  id: 007-record-hash-3
  fingerprint: 6002b25e
