- concept: при свободной декомпозиции предметом аудита становятся принятые решения и границы, а не совпадение с маршрутом
  question: Агент работает в режиме свободной декомпозиции. Что служит основанием считать его работу корректной?
  explanation: Маршрута для сверки больше нет, поэтому «пункты закрыты» ничего не доказывает. Проверять приходится сами решения и соблюдение границ — отсюда требование к наблюдаемости и к проверяемой истории записей.
  kind: choice
  options:
    - Отчёт о том, что все запланированные пункты выполнены
    - Совпадение фактической последовательности действий с выданным маршрутом
    - 'След решений: какие подзадачи созданы, какие инструменты вызваны, что записано и не нарушены ли разрешённые границы'
  correct: 2
