- concept: гибкость декомпозиции и способность к неожиданному ходу — одно и то же свойство, а не два независимых параметра
  question: Команда хочет разрешить агенту самому придумывать подзадачи, но запретить неожиданные способы их решения. Почему такой запрос нельзя выполнить настройкой степени свободы?
  explanation: Ровно то свойство, которое улучшает результат — право перестроить план — даёт и несанкционированную декомпозицию, неожиданное использование инструментов, дрейф цели. Раз ручка одна, ограничение риска приходится строить отдельно, наблюдаемостью.
  kind: choice
  options:
    - Потому что неожиданные ходы возникают только из ошибок модели, а не из свободы
    - Потому что свобода декомпозиции и есть способность выйти за предусмотренный ход; это одна ручка, а не две
    - Потому что подзадачи всё равно утверждает человек
  correct: 1
