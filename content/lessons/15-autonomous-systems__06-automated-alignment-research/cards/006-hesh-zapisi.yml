- concept: хеш детерминирован и меняется при любом изменении входа
  question: Запись форума захешировали, потом добавили в неё один лишний пробел и захешировали снова. Что произойдёт с отпечатком?
  explanation: 'Хеш — детерминированная функция от всего содержимого: тот же вход даёт тот же выход, а любое отличие входа даёт другой отпечаток. Величина правки не связана с величиной изменения хеша.'
  kind: choice
  options:
    - 'Останется прежним: пробелы не влияют на содержание'
    - Изменится — вход стал другим, а значит и хеш другой; при этом одинаковый текст всегда даёт одинаковый хеш
    - Изменится только последний символ отпечатка, пропорционально размеру правки
  correct: 1
  id: 006-hesh-zapisi-1
  fingerprint: cd4912a6
- concept: хеш делает подмену обнаружимой, но не запрещает её и не скрывает содержимое; нужен эталонный хеш вне досягаемости изменяющего
  question: Что даёт хеширование записи журнала?
  explanation: 'Хеш ничего не блокирует и не прячет: он отвечает на вопрос «это ровно та запись, что была зафиксирована тогда?». Если эталонный отпечаток лежит рядом с записью и правится вместе с ней, проверка ничего не стоит.'
  kind: choice
  options:
    - Физически запрещает изменять запись
    - Шифрует содержимое записи, скрывая его от читателей
    - Делает подмену обнаружимой — при условии, что эталонный отпечаток хранится там, куда изменяющий не дотянется
  correct: 2
  id: 006-hesh-zapisi-2
  fingerprint: fce8f213
- concept: длина хеша фиксирована и не зависит от размера входа
  question: Одна запись форума — короткая строка на пару слов, другая — лог эксперимента на 900 мегабайт. Как соотносятся длины их хешей?
  explanation: Фиксированная длина выхода — часть определения хеш-функции. Именно поэтому отпечаток дёшево хранить и сравнивать независимо от объёма исходной записи.
  kind: choice
  options:
    - Хеш большого лога длиннее — отпечаток растёт вместе с входом
    - 'Длина одинаковая: хеш-функция всегда выдаёт строку фиксированной длины, например 64 символа'
    - 'Длина зависит от типа данных: у текста и бинарного лога отпечатки разного формата'
  correct: 1
