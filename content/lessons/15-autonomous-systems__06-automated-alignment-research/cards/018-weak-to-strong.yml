- concept: чистая имитация надзирателя переносит на ученика его потолок и ошибки; интерес представляет обобщение сверх сигнала
  question: Сильный ученик обучается на разметке более слабого надзирателя и в итоге воспроизводит её почти точно, включая систематические ошибки надзирателя. Как это оценивают в исследованиях такого обучения?
  explanation: Точная имитация означает, что способности ученика, превышающие уровень надзирателя, не задействованы. Интересный исход — когда ученик улавливает закономерность, которую надзиратель применяет непоследовательно, и обходит его по качеству.
  kind: choice
  options:
    - 'Как успех: сигнал усвоен полностью'
    - 'Как неудачу: ученик унаследовал потолок надзирателя вместо того, чтобы превзойти его'
    - Как признак того, что надзиратель был слишком сильным
    - Как нейтральный результат, не связанный с качеством обучения
  correct: 1
  id: 018-weak-to-strong-1
  fingerprint: f4ec49b9
- concept: ценность слабого надзирателя определяется полезностью учебного сигнала, а не его способностью решить задачу
  question: Надзиратель заведомо не способен сам решить задачи, на которых учится ученик. Что определяет, годится ли он в надзиратели?
  explanation: '«Слабый» значит слабее ученика, а не бесполезный: указание на противоречие или путаницу бывает ценным, даже когда сам надзиратель написать правильный ответ не может. Опасен не низкий уровень, а уверенная систематическая ошибка — она способна ухудшить ученика.'
  kind: choice
  options:
    - Доля задач, которые он решает верно самостоятельно
    - Совпадение его архитектуры с архитектурой ученика
    - Достаточно ли информативен и несмещён его сигнал, чтобы ученик улучшался, обучаясь на нём
    - Скорость, с которой он выдаёт разметку
  correct: 2
  id: 018-weak-to-strong-2
