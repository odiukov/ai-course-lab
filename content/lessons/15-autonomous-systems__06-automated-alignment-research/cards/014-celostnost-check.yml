- concept: проверка целостности не обнаруживает событие, которое вообще не попало в журнал
  question: Все отпечатки журнала совпадают. Какое нарушение эта проверка принципиально не способна выявить?
  explanation: Отпечаток берётся от того, что записано. Несозданная запись не участвует ни в одном сравнении, поэтому «все хеши совпали» означает «имеющееся не менялось», а не «записано всё, что произошло».
  kind: choice
  options:
    - Изменение текста уже внесённой записи
    - Событие, о котором запись никогда не создавалась
    - Подмену числового поля внутри записи
    - Замену записи на копию другой записи того же журнала
  correct: 1
  id: 014-celostnost-check-1
  fingerprint: 560babce
- concept: полнота журнала обеспечивается принудительной фиксацией вне контроля субъекта, а не отпечатками
  question: Объясни своими словами, почему полноту журнала нельзя получить добавлением отпечатков, и чем её приходится обеспечивать вместо этого.
  explanation: Целостность защищает свидетельство от переписывания, полнота — от избирательного умолчания. Вторая достигается только тем, что решение «записывать или нет» изымается у того, за кем ведётся запись.
  kind: open
  reference: 'Отпечаток — обязательство о содержимом уже существующей записи; он ничего не утверждает о событиях, для которых записи нет. Полнота — свойство процесса записи, а не отдельной записи: её даёт принудительная фиксация на стороне инфраструктуры, когда событие (запуск эксперимента, его исход) регистрируется тем слоем, который его исполняет, и субъект не может пропустить регистрацию по своему решению. Целостность и полнота — независимые гарантии: журнал бывает целым и неполным одновременно.'
  id: 014-celostnost-check-2
  fingerprint: 03fc21bc
