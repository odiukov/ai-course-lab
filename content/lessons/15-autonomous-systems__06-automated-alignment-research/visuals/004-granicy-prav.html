<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта прав трёх исследовательских агентов</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --panel: #ffffff;
    --ink: #182235;
    --muted: #64748b;
    --line: #94a3b8;
    --sandbox: #eaf4ff;
    --sandbox-line: #4b83bd;
    --forum: #f2edff;
    --forum-line: #7759b8;
    --card: #ffffff;
    --add: #176b55;
    --read: #2468a2;
    --danger: #bd3545;
    --warning: #a96816;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101722;
      --panel: #141e2d;
      --ink: #eef4ff;
      --muted: #a9b7ca;
      --line: #64748b;
      --sandbox: #152c43;
      --sandbox-line: #71a7dd;
      --forum: #29213d;
      --forum-line: #a88ddd;
      --card: #192435;
      --add: #65c7a8;
      --read: #76b9ef;
      --danger: #ff7c88;
      --warning: #e7ae5c;
    }
  }

  html,
  body {
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .diagram-title {
    box-sizing: border-box;
    width: 100%;
    padding: 6px 12px;
    background: var(--panel);
    border: solid var(--line);
    border-width: 1px;
    font-size: 20px;
    font-weight: bold;
  }

  #stage {
    width: 100%;
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .sandbox {
    fill: var(--sandbox);
    stroke: var(--sandbox-line);
    stroke-width: 2px;
  }

  .agent-disc {
    fill: var(--panel);
    stroke: var(--sandbox-line);
    stroke-width: 2px;
  }

  .forum {
    fill: var(--forum);
    stroke: var(--forum-line);
    stroke-width: 3px;
  }

  .entry {
    fill: var(--card);
    stroke: var(--forum-line);
    stroke-width: 1px;
  }

  .forbidden-card {
    fill: var(--panel);
    stroke: var(--danger);
    stroke-width: 1px;
  }

  .barrier,
  .danger-line {
    fill: none;
    stroke: var(--danger);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .add-line {
    fill: none;
    stroke: var(--add);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .read-line {
    fill: none;
    stroke: var(--read);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .add-head {
    fill: var(--add);
  }

  .read-head {
    fill: var(--read);
  }

  .divider {
    stroke: var(--line);
    stroke-width: 1px;
  }

  .title-text {
    font-size: 18px;
    font-weight: bold;
  }

  .section-text {
    font-size: 15px;
    font-weight: bold;
  }

  .body-text {
    font-size: 14px;
  }

  .small-text {
    fill: var(--muted);
    font-size: 12px;
  }

  .agent-mark {
    font-size: 13px;
    font-weight: bold;
  }

  .arrow-add-label {
    fill: var(--add);
    font-size: 13px;
    font-weight: bold;
  }

  .arrow-read-label {
    fill: var(--read);
    font-size: 13px;
    font-weight: bold;
  }

  .entry-owner {
    fill: var(--muted);
    font-size: 11px;
    font-weight: bold;
  }

  .entry-main {
    font-size: 13px;
    font-weight: bold;
  }

  .warning-text {
    fill: var(--warning);
  }

  .danger-text {
    fill: var(--danger);
    font-size: 13px;
    font-weight: bold;
  }

  .fallback {
    padding: 12px;
    color: var(--ink);
    background: var(--panel);
    border: solid var(--line);
    border-width: 1px;
    font-size: 16px;
  }
</style>
</head>
<body>
<div class="diagram-title">Карта прав трёх исследовательских агентов</div>
<div id="stage">
  <svg id="diagram" viewBox="0 0 1200 470" width="1200" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Права трёх AAR в песочницах и на общем форуме</title>
    <desc id="svg-description">Три изолированных агента могут читать общий внешний форум и добавлять записи, но не могут изменять или удалять прошлые записи.</desc>
  </svg>
</div>

<script>
(() => {
  const diagramData = [{
    zero: 0,
    dash: { x1: 0, x2: 7, y1: 0, y2: 6 },
    sandboxes: [
      {
        box: { x1: 50, y1: 28, x2: 350, y2: 158 },
        disc: { x: 93, y: 94, r: 27 },
        labels: [
          { x: 70, y: 53, dx: 0, dy: 0, anchor: "start", cls: "section-text", value: "СВОЯ ПЕСОЧНИЦА" },
          { x: 132, y: 78, dx: 0, dy: 0, anchor: "start", cls: "title-text", value: "Агент 1" },
          { x: 132, y: 103, dx: 0, dy: 0, anchor: "start", cls: "body-text", value: "файлы • эксперименты • отчёт" },
          { x: 132, y: 127, dx: 0, dy: 0, anchor: "start", cls: "small-text", value: "ФС • сеть • процессы ограничены" },
          { x: 132, y: 147, dx: 0, dy: 0, anchor: "start", cls: "small-text", value: "соседям вход закрыт" },
          { x: 93, y: 94, dx: 0, dy: 4, anchor: "middle", cls: "agent-mark", value: "AAR" }
        ]
      },
      {
        box: { x1: 425, y1: 28, x2: 725, y2: 158 },
        disc: { x: 468, y: 94, r: 27 },
        labels: [
          { x: 445, y: 53, dx: 0, dy: 0, anchor: "start", cls: "section-text", value: "СВОЯ ПЕСОЧНИЦА" },
          { x: 507, y: 78, dx: 0, dy: 0, anchor: "start", cls: "title-text", value: "Агент 2" },
          { x: 507, y: 103, dx: 0, dy: 0, anchor: "start", cls: "body-text", value: "файлы • эксперименты • отчёт" },
          { x: 507, y: 127, dx: 0, dy: 0, anchor: "start", cls: "small-text", value: "ФС • сеть • процессы ограничены" },
          { x: 507, y: 147, dx: 0, dy: 0, anchor: "start", cls: "small-text", value: "соседям вход закрыт" },
          { x: 468, y: 94, dx: 0, dy: 4, anchor: "middle", cls: "agent-mark", value: "AAR" }
        ]
      },
      {
        box: { x1: 800, y1: 28, x2: 1100, y2: 158 },
        disc: { x: 843, y: 94, r: 27 },
        labels: [
          { x: 820, y: 53, dx: 0, dy: 0, anchor: "start", cls: "section-text", value: "СВОЯ ПЕСОЧНИЦА" },
          { x: 882, y: 78, dx: 0, dy: 0, anchor: "start", cls: "title-text", value: "Агент 3" },
          { x: 882, y: 103, dx: 0, dy: 0, anchor: "start", cls: "body-text", value: "файлы • эксперименты • отчёт" },
          { x: 882, y: 127, dx: 0, dy: 0, anchor: "start", cls: "small-text", value: "ФС • сеть • процессы ограничены" },
          { x: 882, y: 147, dx: 0, dy: 0, anchor: "start", cls: "small-text", value: "соседям вход закрыт" },
          { x: 843, y: 94, dx: 0, dy: 4, anchor: "middle", cls: "agent-mark", value: "AAR" }
        ]
      }
    ],
    barriers: [
      { a: { x: 377, y: 82 }, b: { x: 399, y: 106 }, c: { x: 399, y: 82 }, d: { x: 377, y: 106 } },
      { a: { x: 752, y: 82 }, b: { x: 774, y: 106 }, c: { x: 774, y: 82 }, d: { x: 752, y: 106 } }
    ],
    arrows: [
      {
        cls: "add-line", headCls: "add-head",
        from: { x: 166, y: 166 }, to: { x: 166, y: 270 },
        head: [{ x: 158, y: 258 }, { x: 166, y: 278 }, { x: 174, y: 258 }],
        label: { x: 166, y: 190, dx: -10, dy: 0, anchor: "end", cls: "arrow-add-label", value: "добавить" }
      },
      {
        cls: "read-line", headCls: "read-head",
        from: { x: 242, y: 278 }, to: { x: 242, y: 174 },
        head: [{ x: 234, y: 186 }, { x: 242, y: 166 }, { x: 250, y: 186 }],
        label: { x: 242, y: 246, dx: 10, dy: 0, anchor: "start", cls: "arrow-read-label", value: "читать" }
      },
      {
        cls: "add-line", headCls: "add-head",
        from: { x: 541, y: 166 }, to: { x: 541, y: 270 },
        head: [{ x: 533, y: 258 }, { x: 541, y: 278 }, { x: 549, y: 258 }],
        label: { x: 541, y: 190, dx: -10, dy: 0, anchor: "end", cls: "arrow-add-label", value: "добавить" }
      },
      {
        cls: "read-line", headCls: "read-head",
        from: { x: 617, y: 278 }, to: { x: 617, y: 174 },
        head: [{ x: 609, y: 186 }, { x: 617, y: 166 }, { x: 625, y: 186 }],
        label: { x: 617, y: 246, dx: 10, dy: 0, anchor: "start", cls: "arrow-read-label", value: "читать" }
      },
      {
        cls: "add-line", headCls: "add-head",
        from: { x: 916, y: 166 }, to: { x: 916, y: 270 },
        head: [{ x: 908, y: 258 }, { x: 916, y: 278 }, { x: 924, y: 258 }],
        label: { x: 916, y: 190, dx: -10, dy: 0, anchor: "end", cls: "arrow-add-label", value: "добавить" }
      },
      {
        cls: "read-line", headCls: "read-head",
        from: { x: 992, y: 278 }, to: { x: 992, y: 174 },
        head: [{ x: 984, y: 186 }, { x: 992, y: 166 }, { x: 1000, y: 186 }],
        label: { x: 992, y: 246, dx: 10, dy: 0, anchor: "start", cls: "arrow-read-label", value: "читать" }
      }
    ],
    forum: { x1: 72, y1: 280, x2: 1128, y2: 405 },
    forumLabels: [
      { x: 94, y: 309, dx: 0, dy: 0, anchor: "start", cls: "title-text", value: "ОБЩИЙ ВНЕШНИЙ ФОРУМ" },
      { x: 1106, y: 309, dx: 0, dy: 0, anchor: "end", cls: "small-text", value: "история только продолжает расти" }
    ],
    entries: [
      {
        box: { x1: 94, y1: 326, x2: 322, y2: 390 },
        labels: [
          { x: 110, y: 348, dx: 0, dy: 0, anchor: "start", cls: "entry-owner", value: "ЗАПИСЬ АГЕНТА 1" },
          { x: 110, y: 374, dx: 0, dy: 0, anchor: "start", cls: "entry-main warning-text", value: "ошибка остаётся видимой" }
        ]
      },
      {
        box: { x1: 336, y1: 326, x2: 564, y2: 390 },
        labels: [
          { x: 352, y: 348, dx: 0, dy: 0, anchor: "start", cls: "entry-owner", value: "НОВАЯ ЗАПИСЬ АГЕНТА 1" },
          { x: 352, y: 374, dx: 0, dy: 0, anchor: "start", cls: "entry-main", value: "поправка добавлена рядом" }
        ]
      },
      {
        box: { x1: 578, y1: 326, x2: 806, y2: 390 },
        labels: [
          { x: 594, y: 348, dx: 0, dy: 0, anchor: "start", cls: "entry-owner", value: "ЗАПИСЬ АГЕНТА 2" },
          { x: 594, y: 374, dx: 0, dy: 0, anchor: "start", cls: "entry-main", value: "доступна всем агентам" }
        ]
      },
      {
        box: { x1: 820, y1: 326, x2: 1106, y2: 390 },
        labels: [
          { x: 836, y: 348, dx: 0, dy: 0, anchor: "start", cls: "entry-owner", value: "ЗАПИСЬ АГЕНТА 3" },
          { x: 836, y: 374, dx: 0, dy: 0, anchor: "start", cls: "entry-main", value: "доступна всем агентам" }
        ]
      }
    ],
    unavailableLabel: { x: 92, y: 446, dx: 0, dy: 0, anchor: "start", cls: "section-text", value: "НЕДОСТУПНО ИЗ ПЕСОЧНИЦЫ:" },
    actions: [
      {
        box: { x1: 326, y1: 418, x2: 640, y2: 460 },
        label: { x: 483, y: 444, dx: 0, dy: 0, anchor: "middle", cls: "danger-text", value: "ИЗМЕНИТЬ ПРОШЛУЮ ЗАПИСЬ" },
        slash: { a: { x: 342, y: 424 }, b: { x: 624, y: 454 }, c: { x: 624, y: 424 }, d: { x: 342, y: 454 } }
      },
      {
        box: { x1: 662, y1: 418, x2: 1076, y2: 460 },
        label: { x: 869, y: 444, dx: 0, dy: 0, anchor: "middle", cls: "danger-text", value: "УДАЛИТЬ ПРОШЛУЮ ЗАПИСЬ" },
        slash: { a: { x: 678, y: 424 }, b: { x: 1060, y: 454 }, c: { x: 1060, y: 424 }, d: { x: 678, y: 454 } }
      }
    ],
    fallback: "Схема должна была показать три изолированные песочницы AAR и общий внешний форум: читать и добавлять записи можно, изменять и удалять прошлые записи нельзя."
  }];

  const data = diagramData.find(Boolean);
  const origin = { x: 0, y: 0 };
  const scale = { x: 1, y: 1 };
  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  try {
    const svg = document.getElementById("diagram");
    const ns = "http://www.w3.org/2000/svg";

    const make = (tag, attrs, parent = svg) => {
      const item = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([name, value]) => item.setAttribute(name, String(value)));
      parent.append(item);
      return item;
    };

    const rect = (box, cls) => make("rect", {
      x: sx(box.x1),
      y: sy(box.y1),
      width: sx(box.x2) - sx(box.x1),
      height: sy(box.y2) - sy(box.y1),
      class: cls
    });

    const line = (a, b, cls) => make("line", {
      x1: sx(a.x),
      y1: sy(a.y),
      x2: sx(b.x),
      y2: sy(b.y),
      class: cls
    });

    const text = label => {
      const item = make("text", {
        x: sx(label.x),
        y: sy(label.y),
        dx: label.dx,
        dy: label.dy,
        "text-anchor": label.anchor,
        class: label.cls
      });
      item.textContent = label.value;
      return item;
    };

    const polygon = (points, cls) => make("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: cls
    });

    data.sandboxes.forEach(agent => {
      rect(agent.box, "sandbox");
      make("circle", {
        cx: sx(agent.disc.x),
        cy: sy(agent.disc.y),
        r: sx(agent.disc.r) - sx(data.zero),
        class: "agent-disc"
      });
      agent.labels.forEach(text);
    });

    data.barriers.forEach(mark => {
      line(mark.a, mark.b, "barrier");
      line(mark.c, mark.d, "barrier");
    });

    data.arrows.forEach(arrow => {
      line(arrow.from, arrow.to, arrow.cls);
      polygon(arrow.head, arrow.headCls);
      text(arrow.label);
    });

    const forum = rect(data.forum, "forum");
    forum.setAttribute(
      "stroke-dasharray",
      `${sx(data.dash.x2) - sx(data.dash.x1)} ${sy(data.dash.y2) - sy(data.dash.y1)}`
    );
    data.forumLabels.forEach(text);

    data.entries.forEach(entry => {
      rect(entry.box, "entry");
      entry.labels.forEach(text);
    });

    text(data.unavailableLabel);

    data.actions.forEach(action => {
      rect(action.box, "forbidden-card");
      text(action.label);
      line(action.slash.a, action.slash.b, "danger-line");
      line(action.slash.c, action.slash.d, "danger-line");
    });
  } catch (error) {
    const stage = document.getElementById("stage");
    stage.textContent = data.fallback;
    stage.className = "fallback";
  }
})();
</script>
</body>
</html>
