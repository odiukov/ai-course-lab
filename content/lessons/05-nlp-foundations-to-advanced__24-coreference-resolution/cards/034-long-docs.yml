- concept: ширина перекрытия балансирует сохранение межоконных кореферентных связей и повторные вычисления
  question: Объясни своими словами, зачем окнам длинного документа нужно перекрытие и почему его не следует делать ни слишком узким, ни чрезмерно широким.
  explanation: На контекстах длиннее 2 000 токенов качество может падать примерно на 15 F1, поэтому документ обрабатывают частями. Нахлёст сохраняет связи через границы частей, но его увеличение означает, что всё больше токенов модель обрабатывает повторно.
  kind: open
  reference: Перекрытие позволяет одному и тому же упоминанию попасть в соседние окна и стать опорой для слияния локальных coreference-кластеров. При слишком узком перекрытии такая опора может отсутствовать, и одна сущность распадётся на несколько кластеров. Чрезмерно широкое перекрытие увеличивает повторную обработку текста и вычислительные затраты.
  id: 034-long-docs-2
