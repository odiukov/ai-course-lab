- concept: вероятность угадать правильный антецедент случайным выбором равна единице, делённой на число кандидатов
  question: Для местоимения рассматриваются восемь кандидатов, среди которых ровно один правильный. Какова вероятность случайно выбрать его, в процентах?
  explanation: При равновероятном выборе одного из восьми кандидатов вероятность успеха равна 1/8, то есть 12,5%. Эвристический скоринг нужен, чтобы превзойти этот случайный базовый уровень.
  kind: numeric
  answer: 12.5
