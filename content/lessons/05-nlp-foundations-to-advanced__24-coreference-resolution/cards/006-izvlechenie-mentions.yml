- concept: извлечение кандидатов предшествует выбору антецедента и само по себе не устанавливает кореферентные связи
  question: Объясни своими словами, почему обнаружение фрагментов «Lina Park», «the designer» и «she» ещё не означает, что учебный резолвер признал их одной сущностью.
  explanation: 'Извлечение отвечает на вопрос, какие фрагменты могут быть упоминаниями. Кореферентность определяется позже: кандидаты сравниваются и оцениваются, после чего местоимение связывается с наиболее подходящим антецедентом.'
  kind: open
  reference: Правила по форме текста только добавляют подходящие фрагменты в список кандидатов. Чтобы установить связь, резолвер должен отдельно рассмотреть предшествующие упоминания, оценить их по согласованию, близости и синтаксической роли и выбрать лучший антецедент.
  id: 006-izvlechenie-mentions-2
  fingerprint: 6dc7e17e
