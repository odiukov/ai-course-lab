- concept: упоминание без кореферентных связей образует singleton-кластер
  question: Как система кореференции должна представить упоминание, для которого в документе нет других упоминаний той же сущности?
  explanation: 'Кореферентное разбиение охватывает все найденные упоминания. Отсутствие текстового кореферента не означает, что упоминание нужно отбросить: оно становится отдельным кластером.'
  kind: open
  reference: Поместить его в отдельный singleton-кластер, содержащий только это упоминание.
