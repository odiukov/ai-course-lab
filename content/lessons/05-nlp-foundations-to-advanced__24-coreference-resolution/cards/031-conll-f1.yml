- concept: CEAF оценивает кластеры после оптимального взаимно-однозначного сопоставления предсказанного и эталонного разбиений
  question: Расположи этапы вычисления кластерной метрики CEAF, используемой в CoNLL, в правильном порядке.
  explanation: Сначала CEAF определяет сходство возможных пар кластеров, затем выбирает оптимальное взаимно-однозначное соответствие и лишь после этого агрегирует оценки. Поэтому один предсказанный кластер не может одновременно получить полный зачёт за несколько эталонных сущностей.
  kind: order
  items:
    - Вычислить сходство для возможных пар предсказанных и эталонных кластеров
    - Найти взаимно-однозначное сопоставление кластеров с максимальным суммарным сходством
    - Агрегировать сходство сопоставленных пар и получить итоговые precision, recall и F-меру
  id: 031-conll-f1-2
  fingerprint: c9abce95
