- concept: антецедент выбирается по максимальной взвешенной сумме сигналов
  question: Резолвер вычисляет S = 0.7A + 0.4R + 0.9U. Для Веры значения A, R и U равны 0.8, 0.6 и 0.3, а для Нины — 0.75, 0.85 и 0.15. Каков итоговый балл выбранного антецедента?
  explanation: Вера получает 0.7 × 0.8 + 0.4 × 0.6 + 0.9 × 0.3 = 1.07. Балл Нины равен 0.7 × 0.75 + 0.4 × 0.85 + 0.9 × 0.15 = 1.00, поэтому резолвер выбирает Веру.
  kind: numeric
  answer: 1.07
  tolerance: 0.005
  id: 015-vybor-antecedent-1
  fingerprint: 7e7dc9d6
- concept: итоговый скор ранжирует кандидатов, но не доказывает кореферентность
  question: Объясните своими словами, почему максимальный итоговый скор кандидата ещё не означает, что местоимение действительно обозначает эту сущность.
  explanation: Взвешенный скор служит правилом выбора, а не логическим доказательством и не обязательно является вероятностью. Ошибки признаков, весов или набора кандидатов могут привести к неверному решению даже при однозначном максимуме.
  kind: open
  reference: Скор объединяет эвристические сигналы и позволяет сравнить доступных кандидатов. Максимум означает лишь, что один кандидат получил больше поддержки по заданным правилам и весам; сами признаки могут быть неточными, а правильного антецедента может не оказаться среди кандидатов.
  id: 015-vybor-antecedent-2
  fingerprint: b71b4d64
