- concept: номер кореферентного кластера не кодирует его смысл или уверенность модели
  question: Нейросетевая coreference-модель вернула несколько кластеров с порядковыми идентификаторами. Что можно заключить из идентификатора конкретного кластера?
  explanation: Идентификаторы нужны, чтобы различать кластеры в выводе. Их порядок может зависеть от реализации и не кодирует тип сущности, важность или уверенность модели.
  kind: choice
  options:
    - Он указывает тип сущности
    - Он служит технической меткой и сам по себе ничего не говорит о сущности или уверенности
    - Он показывает вероятность правильной кластеризации
    - Он определяет, какой кластер важнее для последующей обработки
  correct: 1
  id: 025-pretrained-coref-1
  fingerprint: 10eb8711
- concept: первый mention в кластере не обязан быть каноническим названием сущности
  question: Объясни своими словами, почему первый mention в готовом coreference-кластере нельзя автоматически считать каноническим названием или специально выбранным правильным антецедентом.
  explanation: Coreference-кластер задаёт группу совместно отнесённых упоминаний, но не обязательно назначает среди них каноническое. Для выбора канонического имени требуется отдельное правило или этап обработки.
  kind: open
  reference: Порядок упоминаний обычно отражает их положение в документе или особенности реализации. Первый элемент может быть лишь самым ранним или удобным представителем кластера; кореферентность означает принадлежность всех элементов одной сущности, а не особый статус первого элемента.
  id: 025-pretrained-coref-2
  fingerprint: b7f8d6de
- concept: текстовые формы mentions извлекаются из span-объектов через атрибут text
  question: Заполни пропуск, чтобы получить видимые текстовые формы всех span-объектов в coreference-кластере.
  explanation: Элементы кластера представлены span-объектами. Атрибут text возвращает соответствующие им фрагменты исходного документа, которые можно вручную сопоставить с контекстом.
