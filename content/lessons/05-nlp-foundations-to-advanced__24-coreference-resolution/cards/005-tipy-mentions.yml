- concept: местоименные упоминания несут мало лексической информации и сильнее всего зависят от контекста
  question: Объясните своими словами, почему при разрешении кореференции упоминание «она» обычно труднее связать с сущностью, чем «профессор Соколова» или «руководитель отдела».
  explanation: Имя содержит наиболее прямую подсказку о референте, описание ограничивает круг кандидатов по роли или признакам, а местоимение вроде «она» подходит множеству сущностей. Его связь приходится восстанавливать преимущественно по окружению.
  kind: open
  reference: Местоимение сообщает в основном грамматические признаки, например род и число, но почти не описывает референта. Имя прямо называет сущность, а описание задаёт её роль или свойства, поэтому для разрешения местоимения требуется больше контекста.
  id: 005-tipy-mentions-2
  fingerprint: f96f6600
