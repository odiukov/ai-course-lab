- concept: нулевой вариант в mention-ranking позволяет не связывать упоминание ни с одним доступным антецедентом
  question: Объясните своими словами, зачем при ранжировании антецедентов нужен вариант «антецедента нет».
  explanation: Без нулевого варианта модель была бы обязана выбрать кого-то из предшествующих кандидатов даже для новой сущности. Если этот вариант получает наивысшую оценку, кореферентная связь не создаётся и начинается новый кластер.
  kind: open
  reference: Он позволяет модели распознать, что упоминание впервые вводит сущность, и начать для неё новый кластер вместо принудительной связи с одним из предыдущих упоминаний.
