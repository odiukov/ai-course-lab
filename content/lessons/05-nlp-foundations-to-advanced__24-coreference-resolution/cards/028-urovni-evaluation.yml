- concept: оценка mention требует точного совпадения границ предсказанного и эталонного отрезков
  question: В эталоне mention размечен как «технический директор стартапа», а модель предсказала только «директор стартапа». Как это учитывается при оценке с точным совпадением отрезков?
  explanation: При точной оценке spans границы должны полностью совпасть. Укороченный отрезок считается ложноположительным предсказанием, а полный эталонный mention — пропущенным.
  kind: choice
  options:
    - Как одно верное предсказание, поскольку смысл совпадает
    - Как ложноположительный предсказанный отрезок и пропущенный эталонный отрезок
    - Только как пропущенный эталонный отрезок
    - Ошибка учитывается лишь при оценке кластеров
  correct: 1
  id: 028-urovni-evaluation-1
  fingerprint: 02e715b1
- concept: precision по mention равен доле точно верных отрезков среди всех предсказанных
  question: Резолвер предсказал 30 mention, из которых 24 точно совпали с эталонными отрезками. Чему равен precision по mention?
  explanation: 'Precision использует число предсказаний в знаменателе: 24 / 30 = 0,8. Метрика показывает, какая доля найденных моделью отрезков действительно является верной.'
  kind: numeric
  answer: 0.8
  tolerance: 0.001
  id: 028-urovni-evaluation-2
  fingerprint: 6d6d1c03
- concept: качество coreference-системы диагностируют последовательно на уровнях mentions, связей и кластеров
  question: Расположи этапы оценки coreference-резолвера в диагностически полезном порядке.
  explanation: Сначала проверяют, найдены ли нужные отрезки, затем — правильно ли они связаны, и только после этого оценивают готовые кластеры. Такой порядок помогает определить, на каком уровне возникла ошибка.
  kind: order
  items:
    - Оценить найденные mentions как отрезки текста
    - Оценить кореферентные связи между mentions
    - Оценить итоговые coreference-кластеры
  id: 028-urovni-evaluation-3
  fingerprint: 0069b6dc
