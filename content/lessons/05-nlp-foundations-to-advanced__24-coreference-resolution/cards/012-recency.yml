- concept: оценка близости монотонно убывает с расстоянием и выражает предпочтение, а не вероятность кореферентности
  question: Объясните, как расстояние до антецедента превращают в оценку близости и почему максимальной оценки близости недостаточно для установления кореферентной связи.
  explanation: Убывающая шкала сохраняет дальних кандидатов, но ослабляет их влияние. Ближайшее упоминание может относиться к другой сущности, поэтому близость служит одним из складываемых сигналов, а не самостоятельным доказательством.
  kind: open
  reference: 'Расстояние преобразуют убывающей функцией: более близкое предыдущее упоминание получает более высокую оценку. Эта оценка лишь даёт кандидату преимущество и не является вероятностью правильной связи, поэтому её следует учитывать вместе с согласованием признаков и синтаксической ролью.'
  id: 012-recency-2
