- concept: MUC агрегирует числители и знаменатели по всем кластерам до вычисления отношения
  question: Заполни пропуск в формуле агрегированного MUC recall.
  explanation: Сначала складывают сохранённые связи во всех эталонных кластерах и отдельно складывают все возможные связи. Усреднение recall отдельных кластеров придало бы маленьким и большим кластерам одинаковый вес и дало бы другую метрику.
  kind: cloze
  template: muc_recall = sum(saved_links_by_cluster) / ___
  answer: sum(possible_links_by_cluster)
  accept:
    - sum(all_possible_links)
    - sum(recall_denominators)
  id: 030-muc-f1-1
  fingerprint: d55638eb
- concept: singleton-кластер не влияет на MUC, потому что не содержит возможных внутрикластерных связей
  question: Объясни, почему singleton-кластер не должен изменять числитель или знаменатель MUC.
  explanation: MUC оценивает сохранение связности внутри кластеров. Единственное упоминание уже связно само по себе и не требует ни одной кореферентной связи, поэтому учитывать singleton как обычный ненулевой случай нельзя.
  kind: open
  reference: Вклад кластера в число возможных связей равен числу его mentions минус единица. У singleton этот вклад равен нулю, поэтому он ничего не добавляет ни к числу возможных, ни к числу сохранённых связей.
  id: 030-muc-f1-2
  fingerprint: cd2214dc
