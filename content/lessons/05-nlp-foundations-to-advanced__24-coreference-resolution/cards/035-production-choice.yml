- concept: мультиязычная кореференция требует модели, обученной на нужных языках
  question: Система должна разрешать кореференцию в немецких и португальских обращениях пользователей. Какой подход наиболее обоснован?
  explanation: Для нескольких языков нужна модель с мультиязычным представлением текста и coreference-обучением на соответствующих языках. Англоязычная модель не становится мультиязычной автоматически.
  kind: choice
  options:
    - Использовать англоязычную модель без дополнительного обучения
    - Использовать модель на базе XLM-R, обученную на мультиязычной coreference-разметке
    - Заменить разрешение кореференции поиском одинаковых строк
    - Применять только англоязычный NER
  correct: 1
  id: 035-production-choice-1
  fingerprint: 48eff4fa
- concept: междокументная кореференция требует отдельного класса моделей
  question: Нужно определить, что должность в одной новости и полное имя в другой новости обозначают одного человека. Почему обычной модели внутридокументной кореференции недостаточно и какой подход нужен?
  explanation: Граница документа задаёт область, внутри которой стандартный резолвер ищет антецеденты. Связывание упоминаний из разных текстов является отдельной задачей cross-document coreference.
  kind: open
  reference: Обычная модель рассматривает каждый документ как отдельный контекст и не создаёт связи между их упоминаниями. Нужна специализированная междокументная модель кореференции сущностей или событий.
  id: 035-production-choice-2
  fingerprint: e254643e
