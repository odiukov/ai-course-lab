- concept: при катафоре антецедент расположен правее ссылающегося местоимения
  question: «Перед тем как она выступила, Анна проверила микрофон». Почему резолвер, рассматривающий только более ранние упоминания, не сможет связать «она» с «Анной»?
  explanation: 'Это катафора: местоимение предшествует своему антецеденту. Поиск исключительно влево не просто неверно ранжирует кандидатов — он вообще не рассматривает «Анну».'
  kind: choice
  options:
    - Имена собственные нельзя считать упоминаниями сущностей
    - Антецедент расположен после местоимения и не попадает в множество кандидатов
    - Местоимение и имя обязательно относятся к разным сущностям
    - Для местоимения нельзя определить грамматический род
  correct: 1
  id: 033-hard-cases-1
  fingerprint: 634dd55a
- concept: bridging связывает разные, семантически связанные сущности и не требует их объединения в coreference-кластер
  question: «Ноутбук упал со стола. Клавиатура треснула». Объясните, почему «ноутбук» и «клавиатуру» не следует помещать в один coreference-кластер и как лучше представить их связь.
  explanation: Coreference-кластер объединяет упоминания одной и той же сущности. Bridging передаёт ассоциативную связь между разными сущностями — например, частью и целым — поэтому обычное кластерное объединение исказило бы смысл.
  kind: open
  reference: 'Это разные сущности, поэтому между упоминаниями нет отношения тождества, необходимого для кореференции. Здесь возникает bridging: клавиатура понимается как часть ранее упомянутого ноутбука. Связь следует представить отдельным отношением «часть — целое».'
  id: 033-hard-cases-2
  fingerprint: 245002b5
