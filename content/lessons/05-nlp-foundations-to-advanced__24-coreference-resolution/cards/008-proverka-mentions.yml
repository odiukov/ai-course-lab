- concept: ложный mention отличается от ошибок границы и типа тем, что вообще не является упоминанием сущности
  question: Объясни своими словами, чем ложный mention отличается от упоминания с неправильной границей или неправильным типом.
  explanation: 'Эти ошибки требуют разных исправлений: ложный mention удаляют, границу настоящего упоминания изменяют, а при ошибке типа исправляют его категорию.'
  kind: open
  reference: Ложный mention — это фрагмент, который вообще не следовало извлекать как упоминание сущности. При ошибке границы настоящее упоминание найдено не целиком или с лишними словами, а при ошибке типа оно найдено с верной границей, но отнесено не к той категории.
  id: 008-proverka-mentions-2
  fingerprint: d45acd2c
