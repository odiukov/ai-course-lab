- concept: валидность mention проверяется по его символьным смещениям в исходном тексте
  question: Расположите действия для проверки mention, который LLM вернула вместе со смещениями start и end.
  explanation: Допустимые смещения привязывают mention к конкретному месту документа. Точное сравнение text[start:end] с mention выявляет выдуманные, неточно переписанные и неправильно ограниченные фрагменты.
  kind: order
  items:
    - Проверить, что start и end задают допустимый отрезок внутри исходного текста
    - Извлечь фрагмент text[start:end]
    - Сравнить извлечённый фрагмент с текстом mention символ в символ
    - Отклонить или пометить mention, если границы недопустимы либо строки не совпадают
  id: 026-llm-coref-1
  fingerprint: 753b7278
- concept: проверка возвращённых spans не обнаруживает пропущенные моделью mentions
  question: Почему точное совпадение каждого возвращённого mention с text[start:end] ещё не доказывает полноту результата coreference resolution?
  explanation: Смещения подтверждают существование и границы возвращённых фрагментов, но ничего не говорят об отсутствующих в JSON упоминаниях. Особенно в длинных документах нужна отдельная проверка, что модель не потеряла нужные mentions.
  kind: open
  reference: Такая проверка рассматривает только mentions, уже присутствующие в ответе. Модель могла не вернуть местоимение или именную группу, поэтому полноту нужно проверять отдельно, сопоставляя исходный текст со всем набором извлечённых mentions.
  id: 026-llm-coref-2
  fingerprint: aaa8c882
