- concept: MUC recall определяется числом фрагментов, на которые предсказание разбило эталонный кластер
  question: В эталонном кластере 12 упоминаний. Модель нашла их все, но распределила по 7 предсказанным кластерам. Чему равен MUC recall для этого эталонного кластера?
  explanation: Связный кластер из 12 упоминаний требует 11 связей. Разбиение на 7 фрагментов означает, что сохранено 12 − 7 = 5 необходимых связей. Поэтому MUC recall равен 5/11 ≈ 0,455.
  kind: numeric
  answer: 0.455
  tolerance: 0.005
  id: 029-muc-links-1
  fingerprint: 7e7599fc
- concept: MUC precision штрафует предсказанный кластер за объединение частей разных эталонных кластеров
  question: Заполни пропуск в формуле вклада предсказанного кластера R в числитель MUC precision.
  explanation: Эталонная разметка делит предсказанный кластер на части. Чтобы разъединить ошибочно склеенные сущности, нужно удалить связи между этими частями; чем их больше, тем ниже MUC precision.
  kind: cloze
  template: '|R| − ___'
  answer: число эталонных кластеров, пересекающих R
  accept:
    - количество эталонных кластеров, пересекающих R
    - число gold-кластеров, пересекающих R
    - количество частей R по эталонной разметке
  id: 029-muc-links-2
  fingerprint: ec77627f
