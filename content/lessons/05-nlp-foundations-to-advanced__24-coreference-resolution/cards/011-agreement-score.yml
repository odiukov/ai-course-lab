- concept: неизвестное значение признака при согласовании нейтрально, а не равнозначно несовместимости
  question: У местоимения известны род и число. У кандидата число совпадает, а род не размечен. Как компонент согласования должен оценить этого кандидата?
  explanation: Совпадение известных значений усиливает кандидата. Если значение неизвестно хотя бы с одной стороны, оно не даёт оснований ни награждать, ни отклонять кандидата.
  kind: choice
  options:
    - Учесть совпадение числа, а неизвестный род оставить без награды и штрафа
    - Отклонить кандидата из-за отсутствующего рода
    - Считать неизвестный род совпавшим и начислить за него балл
    - Не учитывать ни род, ни известное совпадение числа
  correct: 0
  id: 011-agreement-score-1
  fingerprint: 532e9f28
- concept: регистр местоимения нормализуется перед поиском его признаков в словаре
  question: Заполни пропуск так, чтобы варианты написания местоимения в разных регистрах обращались к одной записи словаря.
  explanation: Нормализация регистра перед поиском не позволяет форме в начале предложения потерять признаки только из-за заглавной буквы. Для английских местоимений подходят как casefold(), так и lower().
  kind: cloze
  template: features = pronouns[token.___()]
  answer: casefold
  accept:
    - lower
