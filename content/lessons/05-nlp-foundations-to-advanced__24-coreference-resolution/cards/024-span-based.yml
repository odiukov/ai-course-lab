- concept: совместное обучение связывает выбор границ упоминаний с разрешением кореференции
  question: Почему в end-to-end span-based модели кореферентная связь может повлиять на выбор между несколькими пересекающимися кандидатами в упоминания?
  explanation: В независимом конвейере границы фиксируются до разрешения кореференции. При совместном обучении ошибки связей передают обучающий сигнал в представления span и помогают выбирать границы, полезные для всего документа.
  kind: open
  reference: Модель использует общие контекстные представления и совместно обучает оценку упоминания и оценку антецедента. Поэтому предпочтение получает не только правдоподобный сам по себе отрезок, но и отрезок, который образует убедительные кореферентные связи.
  id: 024-span-based-1
  fingerprint: 1b125318
- concept: ограничение максимальной длины span сокращает вычисления ценой потери длинных упоминаний
  question: Каково неизбежное следствие ограничения максимальной длины span в span-based модели?
  explanation: Ограничение делает перебор непрерывных отрезков управляемым, но исключённые длинные span вообще не попадают в набор кандидатов. Последующая оценка уже не может восстановить такое упоминание.
  kind: choice
  options:
    - Модель не сможет обнаружить упоминание, которое длиннее установленного ограничения
    - Модель сможет находить только местоименные упоминания
    - Каждый оставшийся span будет автоматически признан настоящим упоминанием
    - Для каждого упоминания обязательно найдётся антецедент
