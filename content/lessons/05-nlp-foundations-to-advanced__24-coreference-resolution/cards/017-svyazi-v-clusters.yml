- concept: ложноположительная кореферентная связь может ошибочно слить целые кластеры
  question: Объясни своими словами, почему одна ошибочно предсказанная кореферентная связь способна испортить результат сильнее, чем только для соединённой ею пары упоминаний.
  explanation: Кластеры строятся как связные компоненты графа упоминаний. Поэтому ложное ребро между двумя компонентами объединяет не только его концы, но и все упоминания, достижимые от них по другим связям.
  kind: open
  reference: При транзитивном замыкании связь между упоминаниями из разных сущностей создаёт мост между их цепочками. В результате все упоминания из двух ранее раздельных кластеров могут оказаться в одном ошибочном кластере.
