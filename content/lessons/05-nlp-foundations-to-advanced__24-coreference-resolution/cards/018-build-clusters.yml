- concept: направление связи mention → antecedent не влияет на объединение кореферентных компонентов
  question: Резолвер сохранил кореферентную связь как mention → antecedent. Как следует учитывать её при построении кластеров?
  explanation: Стрелка показывает, какое упоминание было выбрано антецедентом, но принадлежность одной сущности симметрична. Поэтому при объединении компонентов связь рассматривается как ненаправленная.
  kind: choice
  options:
    - Объединить оба конца связи в одну компоненту независимо от направления стрелки
    - Добавить mention в кластер antecedent, но не считать antecedent частью кластера mention
    - Создать отдельный кластер для каждого направления связи
  correct: 0
  id: 018-build-clusters-1
  fingerprint: 0d1d52af
- concept: union-find материализует кластеры только после завершения всех объединений
  question: Расположи этапы построения кореференционных кластеров с помощью union-find в правильном порядке.
  explanation: 'Кластеры формируют после обработки всех связей: очередное объединение может соединить две ранее независимые компоненты. Обход mention в исходном порядке сохраняет этот порядок внутри результата.'
  kind: order
  items:
    - Создать отдельного представителя для каждого mention
    - Обработать все связи, объединяя компоненты их концов
    - Пройти mention в исходном порядке и сгруппировать их по окончательным представителям
  id: 018-build-clusters-2
  fingerprint: 07d4f1ee
