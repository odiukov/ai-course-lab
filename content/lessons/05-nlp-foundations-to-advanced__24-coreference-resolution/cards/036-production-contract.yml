- concept: конкретный checkpoint нейросетевой модели обеспечивает воспроизводимость coreference-системы
  question: В спецификации coreference-системы указано только «использовать нейронную span-based модель». Какого свойства не хватает такой спецификации?
  explanation: Название класса архитектуры не определяет веса, данные обучения и версию модели. Конкретный checkpoint позволяет повторить запуск и корректно сравнивать результаты.
  kind: choice
  options:
    - 'Воспроизводимости: необходимо назвать конкретный checkpoint'
    - 'Поддержки местоимений: span-based модели обрабатывают только именные группы'
    - 'Кластеризации: checkpoint нужен только для извлечения упоминаний'
  correct: 0
  id: 036-production-contract-1
  fingerprint: 08bf2eea
- concept: mention-level precision и recall являются обязательным условием допуска coreference-конвейера
  question: Команда получила высокую итоговую кластерную метрику и вручную просмотрела часть документов, но не рассчитала precision и recall для извлечения упоминаний. Какое решение соответствует строгому production-контракту?
  explanation: Итоговая кластерная метрика может скрыть пропущенные и ложные упоминания. Поэтому контракт требует отдельного mention-level отчёта и не допускает конвейер без него.
  kind: choice
  options:
    - Выпустить систему, потому что ручная проверка заменяет оценку упоминаний
    - Не выпускать систему до появления mention-level precision и recall
    - Оценивать только скорость обработки, поскольку качество кластеров уже измерено
  correct: 1
  id: 036-production-contract-2
