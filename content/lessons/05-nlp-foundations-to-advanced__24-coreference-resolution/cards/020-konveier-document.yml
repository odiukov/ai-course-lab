- concept: промежуточные представления позволяют локализовать ошибку в конвейере кореференции
  question: Именная группа присутствует среди извлечённых упоминаний, но местоимение связано не с ней. На каком этапе полного кореферентного резолвера возникла ошибка?
  explanation: Упоминание уже извлечено, поэтому первый этап сработал. Неверная пара «местоимение — антецедент» возникает на этапе связывания; последующая группировка лишь использует эту пару.
  kind: choice
  options:
    - При извлечении упоминаний
    - При выборе антецедента
    - При группировке связанных упоминаний
  correct: 1
  id: 020-konveier-document-1
  fingerprint: eacb5ff1
- concept: этап кластеризации не исправляет семантические ошибки выбранных кореферентных связей
  question: Резолвер ошибочно связал местоимение с неподходящим антецедентом. Что должен сделать обычный этап построения кластеров?
  explanation: Кластеризация получает уже выбранные связи и объединяет их в компоненты. Она не выполняет повторный семантический анализ, поэтому ошибка связывания переходит в итоговый кластер.
  kind: choice
  options:
    - Повторно оценить смысл предложения и заменить антецедент
    - Удалить связь, если поверхностные формы упоминаний различаются
    - Сгруппировать упоминания согласно полученным связям, сохранив ошибку
    - Заново извлечь все упоминания документа
  correct: 2
  id: 020-konveier-document-2
  fingerprint: dff8341c
- concept: полный rule-based резолвер объединяет подготовленные операции, не вводя дополнительного сигнала выбора антецедента
  question: Объясните своими словами, какую функцию выполняет полный rule-based кореферентный резолвер поверх отдельных процедур обработки текста.
  explanation: Полный резолвер отвечает за согласованную передачу результатов между стадиями. Качество решений определяется извлечением упоминаний, оценкой антецедентов и построением кластеров, а не новой эвристикой оркестратора.
  kind: open
  reference: 'Он организует единый конвейер: передаёт извлечённые упоминания механизму связывания, а выбранные связи — механизму кластеризации. Сам оркестратор не добавляет новую эвристику или признак для оценки антецедентов.'
  id: 020-konveier-document-3
