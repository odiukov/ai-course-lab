<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>От упоминаний к сущностям</title>
  <style>
    :root {
      color-scheme: light dark;
      --figure-bg: #f8fafc;
      --title-bg: #f1f5f9;
      --text: #172033;
      --muted: #667085;
      --border: #cbd5e1;
      --person: #c2415d;
      --person-fill: #fff0f3;
      --person-soft: #f8d9e0;
      --company: #087f75;
      --company-fill: #e9fbf8;
      --company-soft: #c9f0e9;
      --link-person: #b83250;
      --link-company: #08766d;
      --caption-bg: #eef2f7;
      --caption-text: #344054;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --figure-bg: #111827;
        --title-bg: #172033;
        --text: #f3f6fb;
        --muted: #aab4c5;
        --border: #465269;
        --person: #ff8ca1;
        --person-fill: #3b202b;
        --person-soft: #612d3e;
        --company: #5ee0d1;
        --company-fill: #153733;
        --company-soft: #20534d;
        --link-person: #ff8ca1;
        --link-company: #5ee0d1;
        --caption-bg: #1c2638;
        --caption-text: #d6deea;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--figure-bg);
    }

    .figure {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--figure-bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure-title {
      margin: unset;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--title-bg);
      color: var(--text);
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--figure-bg);
    }

    .column-heading {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .mention-card,
    .entity-card {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .mention-card.person {
      fill: var(--person-fill);
      stroke: var(--person);
    }

    .mention-card.company {
      fill: var(--company-fill);
      stroke: var(--company);
    }

    .mention-band.person,
    .entity-accent.person {
      fill: var(--person);
    }

    .mention-band.company,
    .entity-accent.company {
      fill: var(--company);
    }

    .mention-text {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .mention-type {
      fill: var(--muted);
      font-size: 12px;
    }

    .entity-card.person {
      fill: var(--person-fill);
      stroke: var(--person);
    }

    .entity-card.company {
      fill: var(--company-fill);
      stroke: var(--company);
    }

    .entity-icon.person {
      fill: var(--person-soft);
      stroke: var(--person);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .entity-icon.company {
      fill: var(--company-soft);
      stroke: var(--company);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .entity-letter.person {
      fill: var(--person);
    }

    .entity-letter.company {
      fill: var(--company);
    }

    .entity-letter {
      font-size: 19px;
      font-weight: bold;
    }

    .entity-kicker {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .entity-name {
      fill: var(--text);
      font-size: 21px;
      font-weight: bold;
    }

    .entity-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .link {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .link.person {
      stroke: var(--link-person);
    }

    .link.company {
      stroke: var(--link-company);
    }

    .arrow.person {
      fill: var(--link-person);
    }

    .arrow.company {
      fill: var(--link-company);
    }

    .footer-box {
      fill: var(--caption-bg);
      stroke: var(--border);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .footer-text {
      fill: var(--caption-text);
      font-size: 15px;
      font-weight: bold;
    }

    .fallback {
      margin: unset;
      padding: 16px 20px;
      background: var(--figure-bg);
      color: var(--text);
      font-size: 15px;
    }

    .fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <section class="figure" aria-labelledby="figure-heading">
    <h2 class="figure-title" id="figure-heading">От упоминаний к сущностям</h2>

    <svg
      id="diagram"
      viewBox="0 0 1000 420"
      width="1000"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Кластеризация упоминаний в сущности</title>
      <desc id="svg-description">
        Упоминания Tim Cook, Apple's CEO и he сходятся в кластер человека.
        Упоминания Apple и the company сходятся в кластер компании.
      </desc>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать, что «Tim Cook», «Apple's CEO» и «he»
      относятся к одному человеку, а «Apple» и «the company» — к одной
      компании.
    </p>
  </section>

  <script>
    const diagramData = [
      {
        kind: "layout",
        leftHeading: [60, 27],
        rightHeading: [680, 27],
        footer: [155, 376, 690, 30, 14],
        footerText: [500, 391],
        cardRound: [10, 10],
        entityRound: [16, 16],
        bandWidth: 8
      },
      {
        kind: "mention",
        group: "person",
        text: "Tim Cook",
        type: "имя собственное",
        box: [60, 55, 340, 44],
        main: [86, 72],
        detail: [86, 89]
      },
      {
        kind: "mention",
        group: "person",
        text: "Apple's CEO",
        type: "описание роли",
        box: [60, 111, 340, 44],
        main: [86, 128],
        detail: [86, 145]
      },
      {
        kind: "mention",
        group: "person",
        text: "he",
        type: "местоимение",
        box: [60, 167, 340, 44],
        main: [86, 184],
        detail: [86, 201]
      },
      {
        kind: "mention",
        group: "company",
        text: "Apple",
        type: "название организации",
        box: [60, 252, 340, 44],
        main: [86, 269],
        detail: [86, 286]
      },
      {
        kind: "mention",
        group: "company",
        text: "the company",
        type: "описание организации",
        box: [60, 308, 340, 44],
        main: [86, 325],
        detail: [86, 342]
      },
      {
        kind: "entity",
        group: "person",
        box: [680, 55, 260, 156],
        icon: [730, 133, 25],
        letter: ["Ч", 730, 134],
        kicker: ["КЛАСТЕР ЧЕЛОВЕКА", 775, 91],
        name: ["Tim Cook", 775, 128],
        note: ["одна сущность", 775, 157]
      },
      {
        kind: "entity",
        group: "company",
        box: [680, 252, 260, 100],
        icon: [730, 302, 25],
        letter: ["К", 730, 303],
        kicker: ["КЛАСТЕР КОМПАНИИ", 775, 274],
        name: ["Apple", 775, 303],
        note: ["одна сущность", 775, 329]
      },
      {
        kind: "link",
        group: "person",
        curve: [400, 77, 490, 77, 575, 80, 680, 80],
        head: [[680, 80], [665, 72], [665, 88]]
      },
      {
        kind: "link",
        group: "person",
        curve: [400, 133, 490, 133, 575, 133, 680, 133],
        head: [[680, 133], [665, 125], [665, 141]]
      },
      {
        kind: "link",
        group: "person",
        curve: [400, 189, 490, 189, 575, 186, 680, 186],
        head: [[680, 186], [665, 178], [665, 194]]
      },
      {
        kind: "link",
        group: "company",
        curve: [400, 274, 490, 274, 575, 277, 680, 277],
        head: [[680, 277], [665, 269], [665, 285]]
      },
      {
        kind: "link",
        group: "company",
        curve: [400, 330, 490, 330, 575, 327, 680, 327],
        head: [[680, 327], [665, 319], [665, 335]]
      }
    ];

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const [layout, ...items] = diagramData;

      const make = (tag, attributes, content) => {
        const element = document.createElementNS(namespace, tag);

        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, String(value));
        }

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      };

      const fragment = document.createDocumentFragment();
      const shapeLayer = make("g", { "aria-hidden": "true" });
      const linkLayer = make("g", { "aria-hidden": "true" });
      const textLayer = make("g", { "aria-hidden": "true" });

      const [leftHeadingX, leftHeadingY] = layout.leftHeading;
      const [rightHeadingX, rightHeadingY] = layout.rightHeading;

      textLayer.append(
        make(
          "text",
          {
            x: sx(leftHeadingX),
            y: sy(leftHeadingY),
            class: "column-heading",
            "text-anchor": "start"
          },
          "УПОМИНАНИЯ В ТЕКСТЕ"
        ),
        make(
          "text",
          {
            x: sx(rightHeadingX),
            y: sy(rightHeadingY),
            class: "column-heading",
            "text-anchor": "start"
          },
          "СУЩНОСТИ"
        )
      );

      for (const item of items) {
        if (item.kind === "mention") {
          const [x, y, width, height] = item.box;
          const [roundX, roundY] = layout.cardRound;
          const [mainX, mainY] = item.main;
          const [detailX, detailY] = item.detail;

          shapeLayer.append(
            make("rect", {
              x: sx(x),
              y: sy(y),
              width: sx(x + width) - sx(x),
              height: sy(y + height) - sy(y),
              rx: sx(roundX) - sx(origin.x),
              ry: sy(roundY) - sy(origin.y),
              class: `mention-card ${item.group}`
            }),
            make("rect", {
              x: sx(x),
              y: sy(y),
              width: sx(x + layout.bandWidth) - sx(x),
              height: sy(y + height) - sy(y),
              rx: sx(roundX) - sx(origin.x),
              ry: sy(roundY) - sy(origin.y),
              class: `mention-band ${item.group}`
            })
          );

          textLayer.append(
            make(
              "text",
              {
                x: sx(mainX),
                y: sy(mainY),
                class: "mention-text",
                "text-anchor": "start",
                "dominant-baseline": "middle"
              },
              item.text
            ),
            make(
              "text",
              {
                x: sx(detailX),
                y: sy(detailY),
                class: "mention-type",
                "text-anchor": "start",
                "dominant-baseline": "middle"
              },
              item.type
            )
          );
        }

        if (item.kind === "entity") {
          const [x, y, width, height] = item.box;
          const [roundX, roundY] = layout.entityRound;
          const [iconX, iconY, iconRadius] = item.icon;
          const [letter, letterX, letterY] = item.letter;
          const [kicker, kickerX, kickerY] = item.kicker;
          const [name, nameX, nameY] = item.name;
          const [note, noteX, noteY] = item.note;

          shapeLayer.append(
            make("rect", {
              x: sx(x),
              y: sy(y),
              width: sx(x + width) - sx(x),
              height: sy(y + height) - sy(y),
              rx: sx(roundX) - sx(origin.x),
              ry: sy(roundY) - sy(origin.y),
              class: `entity-card ${item.group}`
            }),
            make("rect", {
              x: sx(x),
              y: sy(y),
              width: sx(x + layout.bandWidth) - sx(x),
              height: sy(y + height) - sy(y),
              rx: sx(roundX) - sx(origin.x),
              ry: sy(roundY) - sy(origin.y),
              class: `entity-accent ${item.group}`
            }),
            make("circle", {
              cx: sx(iconX),
              cy: sy(iconY),
              r: sx(iconRadius) - sx(origin.x),
              class: `entity-icon ${item.group}`
            })
          );

          textLayer.append(
            make(
              "text",
              {
                x: sx(letterX),
                y: sy(letterY),
                class: `entity-letter ${item.group}`,
                "text-anchor": "middle",
                "dominant-baseline": "middle"
              },
              letter
            ),
            make(
              "text",
              {
                x: sx(kickerX),
                y: sy(kickerY),
                class: "entity-kicker",
                "text-anchor": "start",
                "dominant-baseline": "middle"
              },
              kicker
            ),
            make(
              "text",
              {
                x: sx(nameX),
                y: sy(nameY),
                class: "entity-name",
                "text-anchor": "start",
                "dominant-baseline": "middle"
              },
              name
            ),
            make(
              "text",
              {
                x: sx(noteX),
                y: sy(noteY),
                class: "entity-note",
                "text-anchor": "start",
                "dominant-baseline": "middle"
              },
              note
            )
          );
        }
      }

      for (const item of items) {
        if (item.kind === "link") {
          const [
            startX,
            startY,
            firstControlX,
            firstControlY,
            secondControlX,
            secondControlY,
            endX,
            endY
          ] = item.curve;
          const [tip, upper, lower] = item.head;
          const [tipX, tipY] = tip;
          const [upperX, upperY] = upper;
          const [lowerX, lowerY] = lower;

          linkLayer.append(
            make("path", {
              d:
                `M ${sx(startX)} ${sy(startY)} ` +
                `C ${sx(firstControlX)} ${sy(firstControlY)}, ` +
                `${sx(secondControlX)} ${sy(secondControlY)}, ` +
                `${sx(endX)} ${sy(endY)}`,
              class: `link ${item.group}`
            }),
            make("polygon", {
              points:
                `${sx(tipX)},${sy(tipY)} ` +
                `${sx(upperX)},${sy(upperY)} ` +
                `${sx(lowerX)},${sy(lowerY)}`,
              class: `arrow ${item.group}`
            })
          );
        }
      }

      const [footerX, footerY, footerWidth, footerHeight, footerRound] =
        layout.footer;
      const [footerTextX, footerTextY] = layout.footerText;

      shapeLayer.append(
        make("rect", {
          x: sx(footerX),
          y: sy(footerY),
          width: sx(footerX + footerWidth) - sx(footerX),
          height: sy(footerY + footerHeight) - sy(footerY),
          rx: sx(footerRound) - sx(origin.x),
          ry: sy(footerRound) - sy(origin.y),
          class: "footer-box"
        })
      );

      textLayer.append(
        make(
          "text",
          {
            x: sx(footerTextX),
            y: sy(footerTextY),
            class: "footer-text",
            "text-anchor": "middle",
            "dominant-baseline": "middle"
          },
          "Разные текстовые формы  →  один объект реального мира"
        )
      );

      fragment.append(shapeLayer, linkLayer, textLayer);
      svg.append(fragment);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.replaceChildren();
      svg.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
</body>
</html>
