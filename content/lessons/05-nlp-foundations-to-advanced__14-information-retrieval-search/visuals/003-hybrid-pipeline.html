<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь запроса через гибридный поиск</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --panel: #ffffff;
    --panel-soft: #eef2ff;
    --panel-warm: #fff7ed;
    --panel-green: #ecfdf5;
    --ink: #172033;
    --muted: #526078;
    --line: #718096;
    --border: #9aa7ba;
    --blue: #315fc4;
    --orange: #b85d14;
    --violet: #6842b8;
    --green: #16745a;
    --arrow: #48566d;
    --badge: #e8eef9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --panel: #1d2738;
      --panel-soft: #202b4a;
      --panel-warm: #3a291e;
      --panel-green: #17372f;
      --ink: #f2f5fa;
      --muted: #b9c3d3;
      --line: #93a2b8;
      --border: #5d6b80;
      --blue: #8fb1ff;
      --orange: #ffad72;
      --violet: #bea6ff;
      --green: #70d8b6;
      --arrow: #a9b5c7;
      --badge: #29364c;
    }
  }
  html, body {
    margin: unset;
    padding: unset;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main {
    background: var(--bg);
  }
  h1 {
    margin: unset;
    padding: unset;
    font-size: 22px;
    line-height: normal;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 455px;
    background: var(--bg);
  }
  .card {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2px;
  }
  .query-card {
    fill: var(--panel-soft);
    stroke: var(--blue);
    stroke-width: 2px;
  }
  .sparse-card {
    fill: var(--panel-warm);
    stroke: var(--orange);
    stroke-width: 2px;
  }
  .dense-card {
    fill: var(--panel-soft);
    stroke: var(--blue);
    stroke-width: 2px;
  }
  .fusion-card {
    fill: var(--panel);
    stroke: var(--violet);
    stroke-width: 3px;
  }
  .rerank-card {
    fill: var(--panel-green);
    stroke: var(--green);
    stroke-width: 3px;
  }
  .result-card {
    fill: var(--panel);
    stroke: var(--green);
    stroke-width: 3px;
  }
  .badge {
    fill: var(--badge);
    stroke: var(--border);
    stroke-width: 1px;
  }
  .connector {
    fill: none;
    stroke: var(--arrow);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .fork {
    fill: var(--arrow);
    stroke: var(--bg);
    stroke-width: 2px;
  }
  .arrow-head {
    fill: var(--arrow);
  }
  text {
    fill: var(--ink);
  }
  .major {
    font-size: 22px;
    font-weight: bold;
  }
  .title {
    font-size: 18px;
    font-weight: bold;
  }
  .body {
    font-size: 15px;
  }
  .small {
    fill: var(--muted);
    font-size: 13px;
  }
  .count {
    font-size: 15px;
    font-weight: bold;
  }
  .blue {
    fill: var(--blue);
  }
  .orange {
    fill: var(--orange);
  }
  .violet {
    fill: var(--violet);
  }
  .green {
    fill: var(--green);
  }
  #fallback {
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<main>
  <h1>Путь запроса через гибридный поиск</h1>
  <svg id="diagram"
       viewBox="0 0 1200 455"
       width="1200"
       height="455"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Воронка гибридного поиска</title>
    <desc id="svg-desc">Запрос параллельно поступает в BM25 и dense-поиск. Два списка по 30 кандидатов объединяются методом RRF, после чего cross-encoder проверяет первые 30 пар и оставляет top-5.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна показать, как запрос параллельно проходит через BM25 и dense-поиск, два списка по 30 кандидатов сливаются методом RRF, а cross-encoder оставляет top-5.</p>
</main>
<script>
const data = {
  corner: 14,
  nodeRadius: 7,
  cards: [
    { kind: "query-card", x1: 35, y1: 180, x2: 240, y2: 300 },
    { kind: "sparse-card", x1: 325, y1: 55, x2: 515, y2: 195 },
    { kind: "dense-card", x1: 325, y1: 285, x2: 515, y2: 425 },
    { kind: "fusion-card", x1: 605, y1: 175, x2: 775, y2: 305 },
    { kind: "rerank-card", x1: 835, y1: 150, x2: 1015, y2: 330 },
    { kind: "result-card", x1: 1050, y1: 185, x2: 1165, y2: 295 }
  ],
  badges: [
    { x1: 350, y1: 140, x2: 490, y2: 180 },
    { x1: 350, y1: 370, x2: 490, y2: 410 },
    { x1: 625, y1: 255, x2: 755, y2: 292 },
    { x1: 858, y1: 238, x2: 992, y2: 282 }
  ],
  paths: [
    { points: [{x:240,y:240},{x:282,y:240}] },
    { points: [{x:282,y:240},{x:282,y:125},{x:325,y:125}] },
    { points: [{x:282,y:240},{x:282,y:355},{x:325,y:355}] },
    { points: [{x:515,y:125},{x:555,y:125},{x:555,y:210},{x:605,y:210}] },
    { points: [{x:515,y:355},{x:555,y:355},{x:555,y:270},{x:605,y:270}] },
    { points: [{x:775,y:240},{x:835,y:240}] },
    { points: [{x:1015,y:240},{x:1050,y:240}] }
  ],
  heads: [
    [{x:325,y:125},{x:313,y:118},{x:313,y:132}],
    [{x:325,y:355},{x:313,y:348},{x:313,y:362}],
    [{x:605,y:210},{x:593,y:203},{x:593,y:217}],
    [{x:605,y:270},{x:593,y:263},{x:593,y:277}],
    [{x:835,y:240},{x:823,y:233},{x:823,y:247}],
    [{x:1050,y:240},{x:1038,y:233},{x:1038,y:247}]
  ],
  fork: { x: 282, y: 240 },
  texts: [
    { x:137, y:213, value:"ЗАПРОС", cls:"small blue", anchor:"middle" },
    { x:137, y:246, value:"«как получить компенсацию", cls:"body", anchor:"middle" },
    { x:137, y:270, value:"за задержанный рейс»", cls:"body", anchor:"middle" },

    { x:420, y:88, value:"BM25", cls:"major orange", anchor:"middle" },
    { x:420, y:116, value:"дословный поиск", cls:"body", anchor:"middle" },
    { x:420, y:166, value:"30 кандидатов", cls:"count", anchor:"middle" },

    { x:420, y:318, value:"Dense", cls:"major blue", anchor:"middle" },
    { x:420, y:346, value:"смысловой поиск", cls:"body", anchor:"middle" },
    { x:420, y:396, value:"30 кандидатов", cls:"count", anchor:"middle" },

    { x:580, y:87, value:"два независимых списка", cls:"small", anchor:"middle" },
    { x:690, y:211, value:"RRF", cls:"major violet", anchor:"middle" },
    { x:690, y:237, value:"слияние по местам", cls:"body", anchor:"middle" },
    { x:690, y:280, value:"≈ 30–60 кандидатов", cls:"count", anchor:"middle" },

    { x:805, y:222, value:"первые 30", cls:"small", anchor:"middle" },
    { x:925, y:186, value:"Cross-encoder", cls:"title green", anchor:"middle" },
    { x:925, y:215, value:"точно оценивает пары", cls:"body", anchor:"middle" },
    { x:925, y:264, value:"запрос + документ", cls:"count", anchor:"middle" },
    { x:925, y:310, value:"дорогая финальная проверка", cls:"small", anchor:"middle" },

    { x:1107, y:231, value:"TOP-5", cls:"major green", anchor:"middle" },
    { x:1107, y:261, value:"лучшие ответы", cls:"body", anchor:"middle" },

    { x:600, y:447, value:"широкий быстрый отбор  →  слияние без путаницы оценок  →  точная проверка финалистов", cls:"small", anchor:"middle" }
  ]
};

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = svg.namespaceURI;

  function make(tag, attributes, parent) {
    const element = document.createElementNS(namespace, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      element.setAttribute(name, String(value));
    });
    (parent || svg).appendChild(element);
    return element;
  }

  function drawRect(item, cls) {
    return make("rect", {
      x: sx(item.x1),
      y: sy(item.y1),
      width: sx(item.x2) - sx(item.x1),
      height: sy(item.y2) - sy(item.y1),
      rx: sx(item.x1 + data.corner) - sx(item.x1),
      ry: sy(item.y1 + data.corner) - sy(item.y1),
      class: cls
    });
  }

  const connectorLayer = make("g", { "aria-hidden": "true" });
  data.paths.forEach(item => {
    make("polyline", {
      points: item.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: "connector"
    }, connectorLayer);
  });

  make("circle", {
    cx: sx(data.fork.x),
    cy: sy(data.fork.y),
    r: sx(data.fork.x + data.nodeRadius) - sx(data.fork.x),
    class: "fork"
  }, connectorLayer);

  data.heads.forEach(points => {
    make("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: "arrow-head"
    }, connectorLayer);
  });

  const cardLayer = make("g", { "aria-hidden": "true" });
  data.cards.forEach(item => drawRect(item, `card ${item.kind}`));
  data.badges.forEach(item => drawRect(item, "badge"));

  const textLayer = make("g", {});
  data.texts.forEach(item => {
    const label = make("text", {
      x: sx(item.x),
      y: sy(item.y),
      class: item.cls,
      "text-anchor": item.anchor
    }, textLayer);
    label.textContent = item.value;
  });

  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
</body>
</html>
