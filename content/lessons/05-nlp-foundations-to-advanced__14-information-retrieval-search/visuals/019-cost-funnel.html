<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цена поиска уменьшается вместе с числом кандидатов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5e687b;
      --line: #77849a;
      --soft-line: #cbd3df;
      --sparse: #dbeafe;
      --sparse-edge: #3b82f6;
      --dense: #e0e7ff;
      --dense-edge: #6366f1;
      --fusion: #dcfce7;
      --fusion-edge: #16a34a;
      --rerank: #ffedd5;
      --rerank-edge: #ea580c;
      --result: #fef3c7;
      --result-edge: #ca8a04;
      --note: #eef2f7;
      --shadow: #17203318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #172033;
        --ink: #f3f6fb;
        --muted: #b4bed0;
        --line: #9ba8bc;
        --soft-line: #46536a;
        --sparse: #18365f;
        --sparse-edge: #60a5fa;
        --dense: #292b69;
        --dense-edge: #9da3ff;
        --fusion: #153f2d;
        --fusion-edge: #4ade80;
        --rerank: #5a2c16;
        --rerank-edge: #fb923c;
        --result: #554315;
        --result-edge: #facc15;
        --note: #202b3d;
        --shadow: #00000045;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 8px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    figure {
      margin: 0;
      background: var(--page);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--page);
    }

    .stage {
      stroke-width: 2px;
      filter: drop-shadow(0 4px 5px var(--shadow));
    }

    .corpus-sheet {
      fill: var(--panel);
      stroke: var(--soft-line);
      stroke-width: 2px;
    }

    .corpus-front {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .sparse {
      fill: var(--sparse);
      stroke: var(--sparse-edge);
    }

    .dense {
      fill: var(--dense);
      stroke: var(--dense-edge);
    }

    .fusion {
      fill: var(--fusion);
      stroke: var(--fusion-edge);
    }

    .rerank {
      fill: var(--rerank);
      stroke: var(--rerank-edge);
    }

    .result {
      fill: var(--result);
      stroke: var(--result-edge);
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrowhead {
      fill: var(--line);
    }

    .divider {
      stroke: var(--soft-line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .main-label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .value-label {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .result-number {
      fill: var(--ink);
      font-size: 30px;
      font-weight: bold;
    }

    .detail-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .section-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .03em;
    }

    .flow-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .note-box {
      fill: var(--note);
      stroke: var(--soft-line);
      stroke-width: 2px;
    }

    .note-main {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .note-accent {
      fill: var(--rerank-edge);
      font-size: 17px;
      font-weight: bold;
    }

    #fallback {
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background: var(--panel);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Цена поиска уменьшается вместе с числом кандидатов</h1>
    <figure aria-labelledby="diagram-title diagram-desc">
      <svg id="chart"
           viewBox="0 0 1200 420"
           preserveAspectRatio="xMidYMid meet"
           role="img">
        <title id="diagram-title">Воронка гибридного поиска</title>
        <desc id="diagram-desc">
          BM25 и dense-поиск быстро сокращают миллион документов до короткого
          списка. Кросс-энкодер проверяет только 30 пар и возвращает 5 документов.
        </desc>
        <g id="diagram"></g>
      </svg>
      <p id="fallback" hidden>
        Схема должна была показать воронку поиска: BM25 работает менее 10 мс по
        индексу, dense-поиск занимает 50–200 мс, затем кросс-энкодер проверяет
        30 пар вместо 1 000 000 и возвращает 5 документов.
      </p>
    </figure>
  </main>

  <script>
    const data = {
      zero: 0,
      radius: 12,
      canvas: { width: 1200, height: 420 },
      corpusLayers: [
        { x: 42, y: 104, w: 178, h: 154 },
        { x: 50, y: 96, w: 178, h: 154 },
        { x: 58, y: 88, w: 178, h: 154 }
      ],
      cards: [
        { x: 300, y: 48, w: 222, h: 112, className: "stage sparse" },
        { x: 300, y: 218, w: 222, h: 112, className: "stage dense" },
        { x: 805, y: 126, w: 210, h: 126, className: "stage rerank" },
        { x: 1060, y: 145, w: 105, h: 88, className: "stage result" }
      ],
      fusion: {
        className: "stage fusion",
        points: [
          [590, 94],
          [750, 124],
          [750, 254],
          [590, 284],
          [555, 254],
          [555, 124]
        ]
      },
      arrows: [
        {
          line: [236, 132, 285, 104],
          head: [[285, 104], [273, 103], [279, 114]]
        },
        {
          line: [236, 204, 285, 274],
          head: [[285, 274], [274, 268], [276, 281]]
        },
        {
          line: [522, 104, 555, 151],
          head: [[555, 151], [544, 144], [546, 157]]
        },
        {
          line: [522, 274, 555, 227],
          head: [[555, 227], [546, 221], [544, 234]]
        },
        {
          line: [750, 189, 790, 189],
          head: [[790, 189], [778, 181], [778, 197]]
        },
        {
          line: [1015, 189, 1045, 189],
          head: [[1045, 189], [1033, 181], [1033, 197]]
        }
      ],
      dividers: [
        [322, 108, 500, 108],
        [322, 278, 500, 278],
        [827, 188, 993, 188]
      ],
      note: { x: 250, y: 354, w: 915, h: 50 },
      labels: [
        { x: 147, y: 125, text: "1 000 000", className: "result-number", anchor: "middle" },
        { x: 147, y: 153, text: "документов", className: "main-label", anchor: "middle" },
        { x: 147, y: 184, text: "весь корпус", className: "detail-label", anchor: "middle" },
        { x: 147, y: 207, text: "для каждого запроса", className: "detail-label", anchor: "middle" },

        { x: 411, y: 80, text: "BM25", className: "main-label", anchor: "middle" },
        { x: 411, y: 134, text: "менее 10 мс", className: "value-label", anchor: "middle" },
        { x: 411, y: 151, text: "по инвертированному индексу", className: "detail-label", anchor: "middle" },

        { x: 411, y: 250, text: "Dense-поиск", className: "main-label", anchor: "middle" },
        { x: 411, y: 304, text: "50–200 мс", className: "value-label", anchor: "middle" },
        { x: 411, y: 321, text: "по векторному индексу", className: "detail-label", anchor: "middle" },

        { x: 652, y: 172, text: "Слияние", className: "main-label", anchor: "middle" },
        { x: 652, y: 203, text: "30–60", className: "value-label", anchor: "middle" },
        { x: 652, y: 226, text: "кандидатов", className: "detail-label", anchor: "middle" },

        { x: 910, y: 160, text: "Кросс-энкодер", className: "main-label", anchor: "middle" },
        { x: 910, y: 217, text: "30 пар", className: "value-label", anchor: "middle" },
        { x: 910, y: 239, text: "«запрос — документ»", className: "detail-label", anchor: "middle" },

        { x: 1112, y: 184, text: "5", className: "result-number", anchor: "middle" },
        { x: 1112, y: 212, text: "документов", className: "detail-label", anchor: "middle" },

        { x: 411, y: 28, text: "БЫСТРЫЙ СБОР КАНДИДАТОВ", className: "section-label", anchor: "middle" },
        { x: 910, y: 106, text: "ТОЧНАЯ ПРОВЕРКА", className: "section-label", anchor: "middle" },
        { x: 765, y: 178, text: "только остаток", className: "flow-label", anchor: "middle" },
        { x: 1030, y: 174, text: "лучшие", className: "flow-label", anchor: "middle" },

        { x: 512, y: 385, text: "30 сравнений вместо 1 000 000", className: "note-main", anchor: "middle" },
        { x: 915, y: 385, text: "≈ 33 000× меньше работы", className: "note-accent", anchor: "middle" }
      ]
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const root = document.getElementById("diagram");
      const zero = data.zero;

      const element = (name, attributes, parent = root) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        parent.appendChild(node);
        return node;
      };

      const rectangle = ({ x, y, w, h }, className, radius = data.radius) =>
        element("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y),
          rx: sx(radius) - sx(zero),
          ry: sy(radius) - sy(zero),
          class: className
        });

      data.arrows.forEach(({ line, head }) => {
        const [x1, y1, x2, y2] = line;
        element("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: "flow"
        });
        element("polygon", {
          points: head.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
          class: "arrowhead"
        });
      });

      data.corpusLayers.forEach((sheet, index, sheets) => {
        const className = sheet === sheets[sheets.length - data.scale]
          ? "corpus-front"
          : "corpus-sheet";
        rectangle(sheet, className);
      });

      data.cards.forEach(card => rectangle(card, card.className));

      element("polygon", {
        points: data.fusion.points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
        class: data.fusion.className
      });

      data.dividers.forEach(segment => {
        const [x1, y1, x2, y2] = segment;
        element("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: "divider"
        });
      });

      rectangle(data.note, "note-box");

      data.labels.forEach(label => {
        const text = element("text", {
          x: sx(label.x),
          y: sy(label.y),
          class: label.className,
          "text-anchor": label.anchor
        });
        text.textContent = label.text;
      });
    } catch (error) {
      document.getElementById("chart").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
</body>
</html>
