- concept: документы с нулевой оценкой исключают из пула кандидатов до ограничения выдачи
  question: Зачем поисковому ранжировщику удалять документы с нулевой оценкой до выбора top-k?
  explanation: Нулевая оценка не даёт оснований считать документ кандидатом по запросу. Такие документы лишь занимают места в ограниченном пуле и добавляют шум для последующих этапов поиска.
  kind: choice
  options:
    - Чтобы изменить среднюю длину документов в корпусе
    - Чтобы места кандидатов не занимали документы без признаков соответствия запросу
    - Чтобы увеличить вес редких терминов
    - Чтобы разрешить ничьи между положительными оценками
  correct: 1
  id: 016-ranking-rules-1
  fingerprint: b88eedbe
- concept: ничьи разрешаются детерминированно по возрастанию индекса документа
  question: Заполни пропуск в ключе сортировки, чтобы оценки шли по убыванию, а равные результаты — по возрастанию индекса документа.
  explanation: Отрицание разворачивает только порядок оценок. Индекс остаётся без изменения, поэтому при равных оценках меньший индекс всегда оказывается раньше; сортировка всей пары с reverse=True развернула бы и порядок индексов.
  kind: cloze
  template: 'results.sort(key=lambda item: (___, item.doc_index))'
  answer: -item.score
  accept:
    - -(item.score)
  id: 016-ranking-rules-2
