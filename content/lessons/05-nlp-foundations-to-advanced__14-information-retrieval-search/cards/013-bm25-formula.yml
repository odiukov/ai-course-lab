- concept: насыщение частоты термина уменьшает ценность каждого следующего повтора
  question: Почему при фиксированной поправке на длину многократное повторение термина не увеличивает его вклад в оценку документа пропорционально числу вхождений?
  explanation: В BM25 частота присутствует и в числителе, и в знаменателе. Поэтому первые совпадения важны, а последующие дают всё меньшую прибавку и не позволяют механическому повторению слова бесконечно повышать оценку.
  kind: open
  reference: 'Частота термина входит в дробь насыщения: сначала повторы заметно увеличивают вклад, но предельная ценность каждого следующего вхождения уменьшается, а множитель приближается к конечному пределу.'
  id: 013-bm25-formula-1
  fingerprint: 3a0b9905
- concept: усиление нормировки по длине снижает вклад термина в документе длиннее среднего
  question: Документ заметно длиннее среднего по корпусу. Частота совпавшего термина и его IDF зафиксированы. Что произойдёт с вкладом термина при увеличении параметра нормировки по длине b?
  explanation: Для документа длиннее среднего отношение его длины к средней больше единицы. Увеличение b усиливает этот компонент знаменателя, поэтому дробь и итоговый вклад термина уменьшаются. При b=0 длина игнорируется, а при b=1 применяется полная нормировка.
  kind: choice
  options:
    - Вклад уменьшится
    - Вклад увеличится
    - Вклад не изменится
    - Вклад обязательно станет отрицательным
  correct: 0
