- concept: обратный индекс сопоставляет каждому термину список содержащих его документов
  question: Какие данные являются основой обратного индекса для лексического поиска?
  explanation: Список вхождений хранит идентификаторы документов для конкретного термина. Рядом можно сохранить его частоту в каждом документе, чтобы при ранжировании не пересчитывать её по исходному тексту.
  kind: choice
  options:
    - Для каждого документа — полный текст всех похожих документов
    - Для каждого термина — список идентификаторов документов, где он встречается
    - Для каждого запроса — заранее отсортированный список результатов
    - Для каждого документа — только его итоговая оценка релевантности
  correct: 1
  id: 018-inverted-index-1
  fingerprint: f01feefc
- concept: кандидаты для лексического ранжирования формируются объединением списков вхождений терминов запроса
  question: Расположи действия поисковой системы с обратным индексом в правильном порядке.
  explanation: Объединение списков охватывает документы, содержащие хотя бы один термин запроса. Документы вне этого множества не внесли бы вклад в лексическую оценку, поэтому обращаться к ним при обработке запроса не требуется.
  kind: order
  items:
    - Получить из индекса списки вхождений для терминов запроса
    - Объединить идентификаторы документов из найденных списков
    - Вычислить лексическую оценку только для полученных кандидатов
    - Отсортировать кандидатов по оценке
  id: 018-inverted-index-2
  fingerprint: 6ef190e5
- concept: обратный индекс ускоряет запросы ценой предварительного построения, дополнительного хранения и обновления структуры
  question: Объясни своими словами, какую работу обратный индекс переносит с момента выполнения запроса на этап подготовки корпуса и чем за это приходится платить.
  explanation: Обратный индекс не устраняет работу, а выполняет значительную её часть заранее. Это сокращает задержку поиска, но создаёт расходы на построение, хранение и синхронизацию индекса с корпусом.
  kind: open
  reference: Термины и содержащие их документы связывают заранее, поэтому во время запроса поиск обращается только к подходящим спискам вхождений. За ускорение платят временем построения индекса, местом для его хранения и необходимостью обновлять его при изменениях корпуса.
  id: 018-inverted-index-3
  fingerprint: 2ade6d25
