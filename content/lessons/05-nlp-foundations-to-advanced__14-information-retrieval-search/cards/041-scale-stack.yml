- concept: поисковую инфраструктуру усложняют только после выхода за ограничения памяти, задержки или обновлений
  question: Эмбеддинги корпуса помещаются в оперативную память, гибридный поиск выполняется с требуемой задержкой, а обновления индекса не создают проблем. Какое решение об отдельной поисковой базе наиболее обоснованно?
  explanation: Отдельная база оправданна, когда текущая реализация перестаёт укладываться в память, требования к задержке или режим обновлений. Пока ограничения соблюдаются, дополнительный сервис преимущественно увеличивает сложность развёртывания и сопровождения.
  kind: choice
  options:
    - Обязательно внедрить её, поскольку отдельная база сама по себе повышает качество поиска
    - Оставить поиск в памяти, пока измерения не покажут нарушение ресурсных требований
    - Выбирать решение только по количеству документов, не измеряя задержку и потребление памяти
    - Отказаться от лексического поиска, чтобы освободить место для отдельной dense-системы
  correct: 1
  id: 041-scale-stack-1
  fingerprint: fe1ba69a
- concept: при среднем масштабе dense- и лексический поиск переносят в подходящие специализированные индексы и выполняют параллельно
  question: Корпус уже неудобно обрабатывать полным перебором в одном процессе, но распределённая система для огромного индекса пока не требуется. Какая архитектура соответствует этому масштабу?
  explanation: Специализированный dense-индекс ускоряет поиск по эмбеддингам, а Elasticsearch или OpenSearch предоставляет полноценный обратный индекс. Параллельный запуск сохраняет преимущества обоих способов поиска без преждевременного перехода к распределённой инфраструктуре.
  kind: choice
  options:
    - Хранить документы только в объектном хранилище и просматривать их последовательно при каждом запросе
    - Использовать FAISS или pgvector для dense-поиска, Elasticsearch или OpenSearch для лексического поиска и запускать оба поиска параллельно
    - Сразу распределить индекс между множеством машин независимо от фактической нагрузки
    - Оставить только генеративную модель и передавать ей весь корпус без поиска
  correct: 1
