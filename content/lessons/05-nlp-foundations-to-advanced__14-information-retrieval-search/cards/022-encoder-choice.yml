- concept: качество dense-энкодера нужно оценивать на репрезентативных данных целевого поиска
  question: Два dense-энкодера поддерживают нужные языки и укладываются в ресурсный бюджет. Почему нельзя выбрать победителя только по общему публичному рейтингу и что следует сделать вместо этого?
  explanation: Модель, сильная на общем бенчмарке, может хуже различать профессиональную лексику, стиль и типичные намерения пользователей конкретной системы. Поэтому окончательный выбор делают по результатам проверки на целевых примерах.
  kind: open
  reference: Публичный рейтинг может измерять качество на других доменах и распределениях запросов. Нужно сравнить модели на репрезентативных запросах и документах собственной базы с разметкой релевантности.
