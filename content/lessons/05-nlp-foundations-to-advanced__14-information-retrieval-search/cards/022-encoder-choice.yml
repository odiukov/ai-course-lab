- concept: память для dense-индекса линейно зависит от числа документов и размерности эмбеддинга
  question: Для 750000 документов хранятся эмбеддинги размерностью 768 в формате float32. Сколько примерно десятичных гигабайт занимает матрица эмбеддингов без служебных данных?
  explanation: 'Объём равен числу документов × размерность × 4 байта: 750000 × 768 × 4 = 2304000000 байт, то есть 2,304 ГБ. Сам индекс и служебные структуры потребуют дополнительной памяти.'
  kind: numeric
  answer: 2.304
  tolerance: 0.01
