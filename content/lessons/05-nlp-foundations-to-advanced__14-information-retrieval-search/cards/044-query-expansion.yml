- concept: последовательность поиска с расширением запроса методом HyDE
  question: Расположите этапы HyDE-поиска в правильном порядке.
  explanation: HyDE сначала превращает короткий запрос в правдоподобный развёрнутый ответ, а затем использует эмбеддинг этого текста для поиска. Источником фактов для итогового ответа остаются найденные документы.
  kind: order
  items:
    - Получить короткий пользовательский запрос
    - Сгенерировать гипотетический ответ на запрос
    - Преобразовать гипотетический ответ в эмбеддинг
    - Найти близкие документы по этому эмбеддингу
    - Сформировать итоговый ответ на основе найденных документов
  id: 044-query-expansion-1
  fingerprint: df12559e
- concept: гипотетический ответ в HyDE служит поисковым представлением, а не источником фактов
  question: Модель добавила в гипотетический ответ правдоподобную, но неверную деталь. При каком использовании HyDE эта ошибка с наименьшей вероятностью попадёт в ответ пользователю?
  explanation: В HyDE гипотеза помогает найти документы с похожим языком и смыслом, но не считается доказательством. Поэтому итоговую генерацию нужно заземлять в извлечённых источниках, которые могут исправить ошибочные детали гипотезы.
  kind: choice
  options:
    - Гипотетический текст используется только для поиска, а итоговый ответ опирается на найденные документы
    - Гипотетический текст сразу выдаётся пользователю как окончательный ответ
    - Гипотетический текст без проверки добавляется в корпус знаний
    - Любой документ, противоречащий гипотетическому тексту, исключается из выдачи
  correct: 0
  id: 044-query-expansion-2
  fingerprint: c7c8c070
