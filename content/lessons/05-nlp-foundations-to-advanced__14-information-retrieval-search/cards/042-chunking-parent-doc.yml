- concept: увеличение размера чанка создаёт компромисс между полнотой контекста и точностью поиска
  question: Почему нельзя надёжно исправить потерю контекста в RAG, просто сделав все чанки крупнее?
  explanation: Размер сам по себе не решает задачу нарезки. Слишком маленькие фрагменты теряют связанные условия, а слишком крупные размывают релевантный сигнал и расходуют контекстный бюджет.
  kind: open
  reference: Крупный чанк чаще сохраняет окружающие условия и пояснения, но содержит больше постороннего текста. Из-за этого релевантная фраза слабее влияет на сопоставление с запросом, а в контекст модели попадает больше шума. Нужны осмысленные границы или разделение точного поиска и последующего расширения контекста.
