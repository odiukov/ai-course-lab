- concept: для high-stakes поиска reranking финальных кандидатов является обязательным ограничением
  question: Для юридического поиска предлагают гибридный retriever, но хотят отказаться от cross-encoder reranker ради меньшей задержки. От выбранных верхних документов зависит итоговый ответ пользователю. Как должен поступить retrieval-picker?
  explanation: В юридическом и медицинском поиске ошибка в финальной выдаче особенно опасна. Поэтому picker не должен разрешать пропуск cross-encoder reranking, если именно верхние документы определяют ответ; его задержку нужно заранее учитывать в бюджете.
  kind: choice
  options:
    - Одобрить стек, если dense-энкодер обучен на юридических текстах
    - Отказаться от рекомендации без reranker и потребовать пересмотреть бюджет задержки или архитектуру
    - Заменить гибрид на dense-only, чтобы освободить время для генерации
    - Оставить решение на усмотрение разработчика без дополнительной проверки
  correct: 1
  id: 045-retrieval-picker-1
  fingerprint: ac61bd7c
- concept: конкретный dense-энкодер выбирают с учётом языков, предметной области и длины входа
  question: Объясни своими словами, какие свойства корпуса и запросов нужно проверить перед тем, как назвать конкретную модель dense-энкодера.
  explanation: Название модели должно следовать из требований задачи. Несоответствие языка, домена или длины контекста может ухудшить retrieval даже у сильного универсального энкодера.
  kind: open
  reference: Нужно проверить, поддерживает ли модель языки запросов и документов, соответствует ли её обучение предметной области и помещаются ли типичные фрагменты в допустимую длину контекста. Известность модели сама по себе не доказывает её пригодность.
  id: 045-retrieval-picker-2
  fingerprint: d13ff273
- concept: вклад компонентов retrieval-стека оценивают последовательными изменениями относительно baseline
  question: Расположи действия так, чтобы можно было измерить пользу каждого усложнения retrieval-стека.
  explanation: Если одновременно изменить несколько компонентов, нельзя понять источник выигрыша или ухудшения. Baseline и последовательные изменения позволяют связать результат с конкретным улучшением и одновременно контролировать задержку и инфраструктурные ограничения.
  kind: order
  items:
    - Зафиксировать требования и выбрать простой baseline
    - Измерить качество и задержку baseline на репрезентативном наборе запросов
    - Добавить одно улучшение в retrieval-стек
    - Повторить оценку и сравнить результат с baseline
    - Оставить улучшение только при достаточном выигрыше в рамках ограничений
  id: 045-retrieval-picker-3
  fingerprint: 2bd17da7
