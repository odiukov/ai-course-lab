- concept: выражения аргументов по умолчанию вычисляются при определении функции
  question: Модуль содержит функцию `def search(reranker=CrossEncoder("model"))`. Что произойдёт при импорте этого модуля?
  explanation: Python вычисляет выражения аргументов по умолчанию при выполнении определения функции. Поскольку верхний уровень модуля выполняется при импорте, конструктор модели запустится уже тогда.
  kind: choice
  options:
    - CrossEncoder будет создан только при первом вызове search
    - CrossEncoder будет создан во время определения функции при импорте
    - CrossEncoder будет создаваться при каждом вызове search
    - CrossEncoder будет создан только при явной передаче reranker
  correct: 1
  id: 033-lazy-reranker-1
  fingerprint: ef99bf60
- concept: ленивая инициализация создаёт тяжёлый объект при первом обращении и кеширует его
  question: Расположи события в правильном порядке для лениво загружаемого и кешируемого reranker.
  explanation: Ленивая загрузка отделяет импорт от тяжёлой инициализации. Модель создаётся только при первом реальном обращении, а кеш предотвращает повторную загрузку при следующих запросах.
  kind: order
  items:
    - Модуль импортируется, а переменная кеша остаётся равной None
    - Первый поисковый запрос обращается к функции получения reranker
    - Функция создаёт модель и сохраняет её в кеше
    - Следующий запрос получает уже сохранённый экземпляр
  id: 033-lazy-reranker-2
  fingerprint: 2f82d991
- concept: явная передача зависимости позволяет тестировать поиск без создания настоящей модели
  question: Объясни своими словами, зачем функции поиска принимать необязательный объект reranker, если она умеет самостоятельно загрузить модель.
  explanation: Передача зависимости извне отделяет логику поиска от создания модели. В рабочем коде можно использовать лениво загруженный экземпляр, а в тестах — быстрый предсказуемый заменитель.
  kind: open
  reference: Явный параметр позволяет передать готовый reranker или лёгкую тестовую замену. Тогда функция не вызывает загрузчик настоящей модели, тест не скачивает веса и не расходует ресурсы на тяжёлую инициализацию.
  id: 033-lazy-reranker-3
  fingerprint: ba3931ad
