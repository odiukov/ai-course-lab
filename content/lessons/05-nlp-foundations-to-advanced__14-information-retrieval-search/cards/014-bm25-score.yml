- concept: параметр насыщения умножает всю поправку на длину документа
  question: В формуле частотного множителя параметр k должен масштабировать всю поправку на длину. Переменная unit обозначает единичную константу. Заполни пропуск.
  explanation: Знаменатель имеет вид суммы частоты термина и произведения параметра насыщения на полную поправку длины. Если вынести часть поправки из-под умножения, оценка документов нестандартной длины будет рассчитана неверно.
  kind: cloze
  template: |-
    length_norm = (unit - b) + b * doc_len / avg_len
    denominator = f + ___
  answer: k * length_norm
  accept:
    - k*length_norm
    - length_norm * k
    - length_norm*k
  id: 014-bm25-score-1
  fingerprint: 6f71a779
- concept: отсутствующий в документе термин даёт нулевой вклад в оценку
  question: Почему при оценке документа можно сразу пропустить токен запроса, которого нет в Counter этого документа, не вычисляя для него IDF?
  explanation: IDF определяет вес редкости только для реально совпавшего термина. Если его частота в выбранном документе нулевая, умножаемый на IDF частотный множитель обнуляется независимо от редкости термина.
  kind: open
  reference: Частота такого токена в документе нулевая, поэтому числитель его частотного множителя также нулевой и весь вклад равен нулю. Ранний переход к следующему токену сохраняет результат и исключает лишнее вычисление IDF.
  id: 014-bm25-score-2
  fingerprint: 9ec5478f
