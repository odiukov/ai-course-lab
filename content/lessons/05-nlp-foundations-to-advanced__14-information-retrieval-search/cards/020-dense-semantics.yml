- concept: dense retrieval сопоставляет перефразировки по семантической близости эмбеддингов
  question: Почему dense retrieval может найти документ, выражающий смысл запроса другими словами, без заранее составленного словаря синонимов?
  explanation: Энкодер усваивает семантические закономерности из обучающих данных. Поиск сравнивает полученные представления, поэтому опирается на близость смыслов, а не только на совпадение слов.
  kind: open
  reference: Обученный энкодер отображает семантически похожие тексты в близкие области векторного пространства. Поэтому близость эмбеддингов позволяет сопоставить перефразировки даже без общих слов и явных правил для синонимов.
  id: 020-dense-semantics-1
  fingerprint: '28421390'
- concept: для L2-нормированных эмбеддингов скалярное произведение равно косинусному сходству
  question: Заполни пропуск в формуле сходства двух L2-нормированных эмбеддингов.
  explanation: Общая формула косинуса делит скалярное произведение на произведение норм. После L2-нормировки обе нормы равны единице, поэтому остаётся только a · b. Благодаря этому сходства со всем корпусом можно вычислить одним матричным умножением.
  kind: cloze
  template: cos(a, b) = ___
  answer: a · b
  accept:
    - dot(a, b)
    - a @ b
    - скалярное произведение a и b
  id: 020-dense-semantics-2
  fingerprint: 8161ad79
- concept: bi-encoder позволяет заранее вычислить представления документов и кодировать при запросе только сам запрос
  question: Расположи операции dense retrieval с bi-encoder в правильном порядке.
  explanation: Документные эмбеддинги строятся заранее и повторно используются при поиске. Во время запроса остаётся получить один новый эмбеддинг, сравнить его с матрицей индекса и выбрать документы с наибольшим сходством.
  kind: order
  items:
    - Независимо закодировать документы и сохранить их эмбеддинги
    - Закодировать поступивший запрос
    - Вычислить сходство эмбеддинга запроса с сохранёнными эмбеддингами
    - Отсортировать документы по убыванию сходства
  id: 020-dense-semantics-3
  fingerprint: 19eb410d
