- concept: L2-нормализация ненулевого вектора сохраняет его направление и делает длину единичной
  question: Что происходит с ненулевым вектором после деления на его L2-норму?
  explanation: L2-норма ненулевого вектора положительна, поэтому деление на неё лишь масштабирует вектор. Направление сохраняется, а новая L2-норма становится единичной.
  kind: choice
  options:
    - Его направление сохраняется, а длина становится единичной
    - Его направление меняется на противоположное
    - Все его координаты становятся одинаковыми
    - Он становится ортогональным исходному вектору
  correct: 0
  id: 021-normalized-embeddings-1
  fingerprint: 1111e1a4
- concept: ненормированный запрос масштабирует оценки всех нормированных документов одной общей величиной
  question: Все векторы документов L2-нормированы, но вектор запроса не нормирован. Как его скалярное произведение с документом связано с косинусным сходством и что это означает для ранжирования документов по одному запросу?
  explanation: При единичной норме документа выполняется q·d = ||q||₂ cos(q,d). Норма запроса — общий положительный множитель для всех документов, поэтому она не влияет на их порядок в рамках одного запроса, но меняет масштаб оценок.
  kind: open
  reference: Скалярное произведение равно косинусному сходству, умноженному на L2-норму запроса. Для одного запроса этот множитель одинаков у всех документов, поэтому порядок документов не изменится, но сами оценки не будут значениями косинусного сходства.
  id: 021-normalized-embeddings-2
  fingerprint: 618218fd
