- concept: nDCG учитывает градации релевантности и позиции документов
  question: Эксперты оценивают документы как полностью полезные, частично полезные и бесполезные. Какая метрика подходит для проверки того, что наиболее полезные документы расположены раньше остальных?
  explanation: nDCG@k учитывает не только порядок результатов, но и разные степени их релевантности. Recall@k проверяет полноту, а MRR — позицию первого релевантного документа.
  kind: choice
  options:
    - Recall@k
    - MRR
    - nDCG@k
    - Precision@k
  correct: 2
  id: 034-retrieval-metrics-1
  fingerprint: 15acd79f
- concept: MRR равен среднему обратному рангу первого релевантного документа
  question: В шести запросах первый релевантный документ оказался на позициях 6, 8, 11, 12, 13 и 14. Чему примерно равен MRR?
  explanation: 'Для каждого запроса берётся обратный ранг первого релевантного документа: MRR = (1/6 + 1/8 + 1/11 + 1/12 + 1/13 + 1/14) / 6 ≈ 0.1024.'
  kind: numeric
  answer: 0.1024
  tolerance: 0.0001
  id: 034-retrieval-metrics-2
  fingerprint: d32807f7
- concept: высокий MRR не гарантирует высокую полноту выдачи
  question: Объясни своими словами, почему поисковая система может иметь высокий MRR, но низкий Recall@k.
  explanation: 'Метрики проверяют разные свойства выдачи: MRR оценивает раннее появление первого полезного результата, а Recall@k — попадание релевантных документов в ограниченный список.'
  kind: open
  reference: MRR зависит только от позиции первого релевантного документа. Если он почти всегда находится рано, MRR будет высоким, даже когда остальные релевантные документы не попадают в первые k результатов. Recall@k, напротив, отражает полноту найденного набора.
  id: 034-retrieval-metrics-3
  fingerprint: a0bfbcab
