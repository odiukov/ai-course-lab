- concept: запрос и документы должны обрабатываться одним и тем же токенизатором
  question: Запрос содержит `fatal error user missing`, а документ — `FATAL_Error:User-Missing`. При каком условии лексический поиск сопоставит все слова?
  explanation: Лексический поиск сравнивает токены, а не исходные строки. Одинаковая нормализация превратит различия в регистре и разделителях в одинаковую последовательность слов.
  kind: choice
  options:
    - Запрос и документ переводятся в нижний регистр и разбиваются на токены по одним правилам
    - Документ разбивается по пробелам, а запрос — по знакам пунктуации
    - Разделители и регистр сохраняются как части токенов
    - Для запроса и документа используются разные наборы допустимых символов
  correct: 0
  id: 006-tokenization-contract-1
  fingerprint: aa5475a4
- concept: ограничения токенизатора могут удалить значимые слова до этапа ранжирования
  question: Токенизатор извлекает только последовательности латинских букв, а запрос целиком написан кириллицей. Объясни, почему лексический ранжировщик не сможет найти документы по словам запроса и на каком этапе следует исправлять проблему.
  explanation: Ранжирование работает только с результатом предобработки. Если токенизатор удалил значимые слова, формула оценки уже не может восстановить их или учесть совпадения.
  kind: open
  reference: Кириллические слова не попадут в список токенов, поэтому ранжировщику нечего сопоставлять с документами. Исправлять нужно токенизацию или анализатор текста до вычисления оценок, добавив поддержку нужного алфавита.
  id: 006-tokenization-contract-2
  fingerprint: 2f072b2c
