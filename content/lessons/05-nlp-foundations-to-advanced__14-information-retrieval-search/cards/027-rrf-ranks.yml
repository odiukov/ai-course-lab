- concept: параметр k управляет чувствительностью RRF к разнице между позициями
  question: Объясни своими словами, как увеличение параметра k влияет на различие между вкладом верхних и нижних позиций в RRF.
  explanation: Позиция прибавляется к k в знаменателе. Когда k велик, изменение позиции составляет малую часть знаменателя, поэтому вклады разных мест становятся ближе друг к другу.
  kind: open
  reference: 'При увеличении k относительная разница между вкладами соседних и удалённых позиций уменьшается: RRF слабее выделяет верхушку списка. При уменьшении k верхние позиции получают заметно большее преимущество.'
  id: 027-rrf-ranks-2
  fingerprint: 7feed043
- concept: отсутствие документа в отдельном списке не исключает его из RRF и не создаёт штрафа
  question: Как RRF обрабатывает документ, который присутствует в одном ранжировании, но отсутствует в другом?
  explanation: RRF суммирует вклады только за фактические появления документа. Отсутствующий список ничего не добавляет, но оценки из остальных списков сохраняются.
  kind: choice
  options:
    - Учитывает вклад только того ранжирования, где документ присутствует
    - Назначает документу последнее место в ранжировании, где его нет
    - Вычитает штраф за отсутствие во втором ранжировании
    - Полностью удаляет документ из объединённой выдачи
