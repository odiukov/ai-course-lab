- concept: Recall@k — доля запросов с существующим релевантным документом, для которых он попал в первые k результатов
  question: В тесте для всех 64 запросов существует релевантный документ. Для 48 запросов он попал в первые 7 результатов retriever-а. Чему равен Recall@7 в долях от нуля до единицы?
  explanation: Recall@k вычисляется как доля запросов, для которых релевантный документ найден в пределах top-k. Здесь Recall@7 = 48 / 64 = 0.75.
  kind: numeric
  answer: 0.75
  tolerance: 0.001
  id: 035-recall-priority-1
  fingerprint: 9f098f15
- concept: Recall retriever-а нужно измерять при том же cutoff, с которым результаты передаются reader-у
  question: Retriever показывает высокий Recall@m, но reader получает только первые n документов, причём n меньше m. Какая метрика непосредственно показывает, как часто нужный документ действительно доступен reader-у?
  explanation: Reader видит только первые n документов, поэтому релевантен Recall@n. Документ, найденный между позициями n и m, улучшает Recall@m, но до reader-а не доходит.
  kind: choice
  options:
    - Recall@n
    - Recall@m
    - Среднее значение Recall@n и Recall@m
