<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Где дерево расходится при перестановке tools и context</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: ghostwhite;
      --card: white;
      --ink: midnightblue;
      --muted: slategray;
      --shared: seagreen;
      --top: royalblue;
      --bottom: darkorange;
      --split: crimson;
      --guide: gainsboro;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: midnightblue;
        --card: darkslateblue;
        --ink: whitesmoke;
        --muted: lightsteelblue;
        --shared: mediumseagreen;
        --top: lightskyblue;
        --bottom: orange;
        --split: tomato;
        --guide: slategray;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
    }

    body,
    figure,
    figcaption,
    p {
      margin: unset;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      font-size: 16px;
    }

    figure {
      background: var(--bg);
    }

    figcaption {
      box-sizing: border-box;
      color: var(--ink);
      font-size: 19px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      box-sizing: border-box;
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--bg);
      border: 1px solid var(--guide);
    }

    .edge,
    .arrow-wing,
    .pointer,
    .divider,
    .legend-mark {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .edge-shared,
    .legend-shared {
      stroke: var(--shared);
    }

    .edge-top,
    .legend-top {
      stroke: var(--top);
    }

    .edge-bottom,
    .legend-bottom {
      stroke: var(--bottom);
    }

    .pointer,
    .fork-ring {
      stroke: var(--split);
    }

    .divider {
      stroke: var(--guide);
    }

    .node {
      fill: var(--card);
      vector-effect: non-scaling-stroke;
    }

    .node-shared {
      stroke: var(--shared);
    }

    .node-top {
      stroke: var(--top);
    }

    .node-bottom {
      stroke: var(--bottom);
    }

    .fork-ring {
      fill: var(--bg);
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .node-label {
      font-weight: bold;
    }

    .node-subtitle,
    .track-note,
    .legend-label {
      fill: var(--muted);
    }

    .callout {
      fill: var(--split);
      font-weight: bold;
    }

    .track-label {
      font-weight: bold;
    }

    .fallback {
      color: var(--split);
      font-size: 16px;
      text-align: center;
    }

    .fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">
      Где дерево расходится при перестановке tools и context
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      role="img"
      aria-label="Два промпта делят 124 блока system, а затем расходятся: в одном идут инструменты и контекст, в другом контекст и инструменты."
    >
      <g id="diagramRoot"></g>
    </svg>

    <p id="fallback" class="fallback">
      Схема должна показать общий префикс system из 124 блоков и две отдельные
      ветви после перестановки tools и context.
    </p>
  </figure>

  <script>
    const DATA = Object.freeze([
      Object.freeze({
        kind: "config",
        zero: 0,
        one: 1,
        half: 0.5,
        arrowLength: 11,
        arrowHalf: 7,
        corner: 10,
        forkRadius: 7,
        nodeStroke: 2.5,
        edgeStroke: 3,
        pointerStroke: 2,
        dividerStroke: 1,
        nodeFont: 17,
        subFont: 14,
        trackFont: 16,
        calloutFont: 16,
        legendFont: 15,
        labelPad: 10,
        optical: 5
      }),

      Object.freeze({
        kind: "node",
        id: "system",
        branch: "shared",
        x: 30,
        y: 153,
        w: 210,
        h: 86,
        label: "система",
        subtitle: "общие 124 блока"
      }),

      Object.freeze({
        kind: "node",
        id: "top-tools",
        branch: "top",
        x: 335,
        y: 80,
        w: 145,
        h: 54,
        label: "инструменты"
      }),
      Object.freeze({
        kind: "node",
        id: "top-context",
        branch: "top",
        x: 505,
        y: 80,
        w: 160,
        h: 54,
        label: "контекст"
      }),
      Object.freeze({
        kind: "node",
        id: "top-history",
        branch: "top",
        x: 690,
        y: 80,
        w: 160,
        h: 54,
        label: "история"
      }),
      Object.freeze({
        kind: "node",
        id: "top-question",
        branch: "top",
        x: 875,
        y: 80,
        w: 170,
        h: 54,
        label: "вопрос"
      }),

      Object.freeze({
        kind: "node",
        id: "bottom-context",
        branch: "bottom",
        x: 335,
        y: 265,
        w: 145,
        h: 54,
        label: "контекст"
      }),
      Object.freeze({
        kind: "node",
        id: "bottom-tools",
        branch: "bottom",
        x: 505,
        y: 265,
        w: 160,
        h: 54,
        label: "инструменты"
      }),
      Object.freeze({
        kind: "node",
        id: "bottom-history",
        branch: "bottom",
        x: 690,
        y: 265,
        w: 160,
        h: 54,
        label: "история"
      }),
      Object.freeze({
        kind: "node",
        id: "bottom-question",
        branch: "bottom",
        x: 875,
        y: 265,
        w: 170,
        h: 54,
        label: "вопрос"
      }),

      Object.freeze({
        kind: "edge",
        branch: "shared",
        x1: 240,
        y1: 196,
        x2: 290,
        y2: 196
      }),
      Object.freeze({
        kind: "edge",
        branch: "top",
        x1: 290,
        y1: 196,
        x2: 335,
        y2: 107
      }),
      Object.freeze({
        kind: "edge",
        branch: "top",
        x1: 480,
        y1: 107,
        x2: 505,
        y2: 107
      }),
      Object.freeze({
        kind: "edge",
        branch: "top",
        x1: 665,
        y1: 107,
        x2: 690,
        y2: 107
      }),
      Object.freeze({
        kind: "edge",
        branch: "top",
        x1: 850,
        y1: 107,
        x2: 875,
        y2: 107
      }),
      Object.freeze({
        kind: "edge",
        branch: "bottom",
        x1: 290,
        y1: 196,
        x2: 335,
        y2: 292
      }),
      Object.freeze({
        kind: "edge",
        branch: "bottom",
        x1: 480,
        y1: 292,
        x2: 505,
        y2: 292
      }),
      Object.freeze({
        kind: "edge",
        branch: "bottom",
        x1: 665,
        y1: 292,
        x2: 690,
        y2: 292
      }),
      Object.freeze({
        kind: "edge",
        branch: "bottom",
        x1: 850,
        y1: 292,
        x2: 875,
        y2: 292
      }),

      Object.freeze({
        kind: "text",
        role: "callout",
        x: 290,
        y: 25,
        anchor: "middle",
        label: "развилка на второй части"
      }),
      Object.freeze({
        kind: "line",
        role: "pointer",
        x1: 290,
        y1: 40,
        x2: 290,
        y2: 184
      }),

      Object.freeze({
        kind: "text",
        role: "track-top",
        x: 335,
        y: 62,
        anchor: "start",
        label: "Запрос А: инструменты → контекст"
      }),
      Object.freeze({
        kind: "text",
        role: "track-bottom",
        x: 335,
        y: 249,
        anchor: "start",
        label: "Запрос Б: контекст → инструменты"
      }),

      Object.freeze({
        kind: "line",
        role: "divider",
        x1: 30,
        y1: 346,
        x2: 1045,
        y2: 346
      }),
      Object.freeze({
        kind: "legend",
        role: "shared",
        x1: 30,
        x2: 64,
        y: 378,
        textX: 78,
        textY: 383,
        label: "общий префикс: system, 124 блока"
      }),
      Object.freeze({
        kind: "legend",
        role: "separate",
        x1: 445,
        x2: 479,
        topY: 372,
        bottomY: 384,
        textX: 495,
        textY: 383,
        label: "после развилки одинаковые части считаются отдельно"
      })
    ]);

    const origin = Object.freeze({ x: 50, y: 20 });
    const scale = 1;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    try {
      const [cfg, ...items] = DATA;
      const root = document.getElementById("diagramRoot");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const appendLine = (parent, a, b, className, strokeWidth) => {
        parent.appendChild(make("line", {
          x1: sx(a.x),
          y1: sy(a.y),
          x2: sx(b.x),
          y2: sy(b.y),
          class: className,
          "stroke-width": strokeWidth
        }));
      };

      const appendArrow = (parent, edge) => {
        const start = { x: edge.x1, y: edge.y1 };
        const end = { x: edge.x2, y: edge.y2 };
        const className = `edge edge-${edge.branch}`;
        const dx = end.x - start.x;
        const dy = end.y - start.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const base = {
          x: end.x - ux * cfg.arrowLength,
          y: end.y - uy * cfg.arrowLength
        };
        const wingA = {
          x: base.x - uy * cfg.arrowHalf,
          y: base.y + ux * cfg.arrowHalf
        };
        const wingB = {
          x: base.x + uy * cfg.arrowHalf,
          y: base.y - ux * cfg.arrowHalf
        };

        appendLine(parent, start, end, className, cfg.edgeStroke);
        appendLine(
          parent,
          end,
          wingA,
          `${className} arrow-wing`,
          cfg.edgeStroke
        );
        appendLine(
          parent,
          end,
          wingB,
          `${className} arrow-wing`,
          cfg.edgeStroke
        );
      };

      const edgeLayer = make("g", { "aria-hidden": "true" });
      items
        .filter((item) => item.kind === "edge")
        .forEach((edge) => appendArrow(edgeLayer, edge));
      root.appendChild(edgeLayer);

      items
        .filter((item) => item.kind === "line")
        .forEach((line) => {
          const className =
            line.role === "divider" ? "divider" : "pointer";
          const strokeWidth =
            line.role === "divider"
              ? cfg.dividerStroke
              : cfg.pointerStroke;

          appendLine(
            root,
            { x: line.x1, y: line.y1 },
            { x: line.x2, y: line.y2 },
            className,
            strokeWidth
          );
        });

      const fork = { x: 290, y: 196 };
      root.appendChild(make("circle", {
        cx: sx(fork.x),
        cy: sy(fork.y),
        r: sx(cfg.forkRadius) - sx(cfg.zero),
        class: "fork-ring",
        "stroke-width": cfg.nodeStroke
      }));

      items
        .filter((item) => item.kind === "node")
        .forEach((node) => {
          const group = make("g", {
            "aria-label":
              node.subtitle === undefined
                ? node.label
                : `${node.label}, ${node.subtitle}`
          });

          group.appendChild(make("rect", {
            x: sx(node.x),
            y: sy(node.y),
            width: sx(node.x + node.w) - sx(node.x),
            height: sy(node.y + node.h) - sy(node.y),
            rx: sx(cfg.corner) - sx(cfg.zero),
            class: `node node-${node.branch}`,
            "stroke-width": cfg.nodeStroke
          }));

          const centerX = node.x + node.w * cfg.half;
          const centerY = node.y + node.h * cfg.half;

          if (node.subtitle === undefined) {
            group.appendChild(make("text", {
              x: sx(centerX),
              y: sy(centerY + cfg.optical),
              "text-anchor": "middle",
              class: "node-label",
              "font-size": cfg.nodeFont
            }, node.label));
          } else {
            group.appendChild(make("text", {
              x: sx(centerX),
              y: sy(centerY - cfg.labelPad * cfg.half),
              "text-anchor": "middle",
              class: "node-label",
              "font-size": cfg.nodeFont
            }, node.label));

            group.appendChild(make("text", {
              x: sx(centerX),
              y: sy(centerY + cfg.labelPad + cfg.optical),
              "text-anchor": "middle",
              class: "node-subtitle",
              "font-size": cfg.subFont
            }, node.subtitle));
          }

          root.appendChild(group);
        });

      items
        .filter((item) => item.kind === "text")
        .forEach((label) => {
          const className =
            label.role === "callout"
              ? "callout"
              : label.role === "track-top"
                ? "track-label edge-top"
                : "track-label edge-bottom";
          const fontSize =
            label.role === "callout"
              ? cfg.calloutFont
              : cfg.trackFont;

          root.appendChild(make("text", {
            x: sx(label.x),
            y: sy(label.y),
            "text-anchor": label.anchor,
            class: className,
            "font-size": fontSize
          }, label.label));
        });

      items
        .filter((item) => item.kind === "legend")
        .forEach((legend) => {
          if (legend.role === "shared") {
            appendLine(
              root,
              { x: legend.x1, y: legend.y },
              { x: legend.x2, y: legend.y },
              "legend-mark legend-shared",
              cfg.edgeStroke
            );
          } else {
            appendLine(
              root,
              { x: legend.x1, y: legend.topY },
              { x: legend.x2, y: legend.topY },
              "legend-mark legend-top",
              cfg.edgeStroke
            );
            appendLine(
              root,
              { x: legend.x1, y: legend.bottomY },
              { x: legend.x2, y: legend.bottomY },
              "legend-mark legend-bottom",
              cfg.edgeStroke
            );
          }

          root.appendChild(make("text", {
            x: sx(legend.textX),
            y: sy(legend.textY),
            "text-anchor": "start",
            class: "legend-label",
            "font-size": cfg.legendFont
          }, legend.label));
        });

      fallback.hidden = true;
    } catch (error) {
      const root = document.getElementById("diagramRoot");
      const fallback = document.getElementById("fallback");
      root.replaceChildren();
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна показать: оба промпта делят 124 блока system, затем один продолжает ветвь «инструменты → контекст», а другой — «контекст → инструменты».";
    }
  </script>
</body>
</html>
