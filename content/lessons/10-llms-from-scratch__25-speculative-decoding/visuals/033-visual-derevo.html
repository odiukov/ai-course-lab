<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Дерево из шести узлов</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d2430;
    --muted: #5d6a7d;
    --edge: #7b8ba3;
    --accept: #1f7a5a;
    --alt: #b06b12;
    --nodefill: #eef2f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --fg: #e6ebf2;
      --muted: #9aa8bb;
      --edge: #6b7c93;
      --accept: #4fd39f;
      --alt: #e0a martial;
      --alt: #e0a54a;
      --nodefill: #1d242e;
    }
  }
  html, body { margin: 0; background: var(--bg); }
  .wrap { background: var(--bg); color: var(--fg); padding: 8px 10px 12px; font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  h2 { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; max-height: 480px; }
  .fail { color: var(--muted); font-size: 13px; }
  text { fill: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  text.dim { fill: var(--muted); }
  text.acc { fill: var(--accept); }
  text.alt2 { fill: var(--alt); }
</style>
</head>
<body>
<div class="wrap">
  <h2>Шесть узлов дерева — три цепочки-кандидата за один проход target</h2>
  <div id="host"><noscript class="fail">Дерево: root с ветками «очень» (0.5) и «слишком» (0.3); у «очень» дети «вкусный» и «крепкий», у «вкусный» ребёнок «!»; у «слишком» ребёнок «горький». Шесть узлов, три цепочки: «очень вкусный !» (3 токена), «очень крепкий», «слишком горький» — против 2 токенов у цепочки.</div>
</div>
<script>
(function () {
  var host = document.getElementById('host');
  try {
    // ---- данные схемы (координаты в условных единицах) ----
    var NODES = [
      { id: 'root', x: 0,   y: 0,   label: 'root',      role: 'root',  anchor: 'end',    side: 'left'  },
      { id: 'a',    x: 2,   y: 1,   label: 'очень',     role: 'acc',   prob: '0.5',      anchor: 'middle', side: 'up' },
      { id: 'b',    x: 2,   y: -1,  label: 'слишком',   role: 'alt',   prob: '0.3',      anchor: 'middle', side: 'down' },
      { id: 'c',    x: 4,   y: 1.7, label: 'вкусный',   role: 'acc',   anchor: 'middle', side: 'up' },
      { id: 'd',    x: 4,   y: 0.4, label: 'крепкий',   role: 'acc',   anchor: 'middle', side: 'down' },
      { id: 'e',    x: 4,   y: -1,  label: 'горький',   role: 'alt',   anchor: 'middle', side: 'down' },
      { id: 'f',    x: 6,   y: 1.7, label: '!',         role: 'acc',   anchor: 'start',  side: 'right' }
    ];
    var EDGES = [
      { from: 'root', to: 'a' }, { from: 'root', to: 'b' },
      { from: 'a', to: 'c' }, { from: 'a', to: 'd' }, { from: 'b', to: 'e' },
      { from: 'c', to: 'f' }
    ];
    var NOTES = [
      { x: 0,   y: 2.55, text: 'Дерево: 6 узлов, 3 цепочки-кандидата', anchor: 'start', side: 'up',   cls: '' },
      { x: 6,   y: 0.4,  text: '3 токена — самая длинная цепочка',     anchor: 'end',   side: 'down', cls: 'dim' },
      { x: 0,   y: -2.2, text: 'Цепочка: 2 токена в мусор после отказа', anchor: 'start', side: 'down', cls: 'dim' }
    ];

    // ---- единственное отображение координат ----
    var origin = { x: 96, y: 176 };
    var scale = { x: 108, y: 62 };
    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y - y * scale.y; }

    var PAD = 6;        // отступ подписи от точки привязки, px
    var STROKE = 2;     // толщина линий
    var FS = 13;        // размер шрифта

    var byId = {};
    NODES.forEach(function (n) { byId[n.id] = n; });

    var W = 760, H = 380;
    var svgns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.setAttribute('role', 'img');

    var defs = document.createElementNS(svgns, 'defs');
    svg.appendChild(defs);

    function el(name, attrs) {
      var e = document.createElementNS(svgns, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      svg.appendChild(e);
      return e;
    }
    function colorOf(role) {
      return role === 'alt' ? 'var(--alt)' : (role === 'root' ? 'var(--edge)' : 'var(--accept)');
    }
    function label(x, y, txt, anchor, side, cls, weight) {
      var px = sx(x), py = sy(y);
      if (side === 'left') px -= PAD + FS * 0.7;
      if (side === 'right') px += PAD + FS * 0.7;
      if (side === 'up') py -= PAD + FS * 0.8;
      if (side === 'down') py += PAD + FS * 1.35;
      var t = el('text', { x: px, y: py, 'text-anchor': anchor, 'font-size': FS });
      if (cls) t.setAttribute('class', cls);
      if (weight) t.setAttribute('font-weight', weight);
      t.textContent = txt;
      return t;
    }

    // рёбра со стрелками (наконечник строим вершинами через sx/sy)
    EDGES.forEach(function (e) {
      var p = byId[e.from], q = byId[e.to];
      var x1 = sx(p.x), y1 = sy(p.y), x2 = sx(q.x), y2 = sy(q.y);
      var dx = x2 - x1, dy = y2 - y1;
      var len = Math.sqrt(dx * dx + dy * dy);
      var ux = dx / len, uy = dy / len;
      var r0 = sx(0.22) - sx(0);            // отступ от центра узла, через перевод
      var head = sx(0.11) - sx(0);
      var ax = x1 + ux * r0, ay = y1 + uy * r0;
      var bx = x2 - ux * r0, by = y2 - uy * r0;
      el('line', {
        x1: ax, y1: ay, x2: bx, y2: by,
        stroke: colorOf(q.role), 'stroke-width': STROKE, 'stroke-linecap': 'round'
      });
      var tipx = bx, tipy = by;
      var nx = -uy, ny = ux;
      el('polygon', {
        points: [
          tipx + ',' + tipy,
          (tipx - ux * head * 2 + nx * head) + ',' + (tipy - uy * head * 2 + ny * head),
          (tipx - ux * head * 2 - nx * head) + ',' + (tipy - uy * head * 2 - ny * head)
        ].join(' '),
        fill: colorOf(q.role)
      });
    });

    // узлы
    var R = sx(0.22) - sx(0);
    NODES.forEach(function (n) {
      el('circle', {
        cx: sx(n.x), cy: sy(n.y), r: R,
        fill: 'var(--nodefill)', stroke: colorOf(n.role), 'stroke-width': STROKE
      });
      var cls = n.role === 'alt' ? 'alt2' : (n.role === 'root' ? 'dim' : 'acc');
      label(n.x, n.y, n.label, n.anchor, n.side, cls, '600');
      if (n.prob) {
        // вероятность разведена в противоположную сторону от имени узла
        var opp = n.side === 'up' ? 'down' : 'up';
        label(n.x, n.y, 'p = ' + n.prob, 'middle', opp, 'dim');
      }
    });

    NOTES.forEach(function (n) { label(n.x, n.y, n.text, n.anchor, n.side, n.cls); });

    host.textContent = '';
    host.appendChild(svg);
  } catch (err) {
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна показывать дерево: root с ветками «очень» (p = 0.5) и «слишком» (p = 0.3); у «очень» дети «вкусный» и «крепкий», у «вкусный» ребёнок «!»; у «слишком» ребёнок «горький». Шесть узлов дают три цепочки-кандидата — «очень вкусный !» (3 токена), «очень крепкий», «слишком горький» — за один проход target, вместо 2 токенов в мусор у одной цепочки.</p>';
  }
})();
</script>
</body>
</html>
