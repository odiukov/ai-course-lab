<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Схема демо-графа</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5b6672; --line:#3d4a57;
    --node:#f2f5f8; --nodeb:#3d4a57; --hot:#1d6fd0; --hotfill:#dceafa;
    --gate:#8a5a00; --gatefill:#fdf1d8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161b; --fg:#e8edf2; --muted:#9aa7b4; --line:#8b9aa8;
      --node:#1c232b; --nodeb:#8b9aa8; --hot:#68aaf5; --hotfill:#17293d;
      --gate:#e0b25e; --gatefill:#2c2312;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:10px 8px}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .cap{color:var(--muted);font-size:12px;margin:6px 0 0}
  .err{color:var(--muted);font-size:13px;white-space:pre-line}
</style>
<div class="wrap">
  <h2>Демо-граф: один прогон — ровно одна из трёх ветвей</h2>
  <div id="host"><svg id="d" viewBox="0 0 920 380" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Граф: START, classify, три ветки refund/bug/sales, human gate, send, END"></svg></div>
  <p class="cap" id="cap">Подсвечено — прогон <b>START → classify → refund → done → END</b>: сработали 3 узла из 5, <b>bug</b> и <b>sales</b> не запускались. Серые рёбра существуют всегда, но в этом прогоне не выбраны.</p>
</div>
<script>
(function(){
try{
  /* ---- данные схемы в своих координатах ---- */
  var N = [
    {id:"START", x:0,  y:0, t:"START",  k:"edge", hot:1},
    {id:"cls",   x:2,  y:0, t:"classify",k:"node", hot:1},
    {id:"refund",x:4.4,y:1.5,t:"refund", k:"node", hot:1},
    {id:"bug",   x:4.4,y:0, t:"bug",     k:"node", hot:0},
    {id:"sales", x:4.4,y:-1.5,t:"sales", k:"node",hot:0},
    {id:"gate",  x:6.7,y:0, t:"human gate",k:"gate",hot:1},
    {id:"done",  x:8.7,y:0, t:"done / send",k:"node",hot:1},
    {id:"END",   x:10.6,y:0,t:"END",     k:"edge", hot:1}
  ];
  var E = [
    {a:"START",b:"cls",   hot:1},
    {a:"cls",  b:"refund",hot:1,lab:"route=refund"},
    {a:"cls",  b:"bug",   hot:0,lab:"route=bug"},
    {a:"cls",  b:"sales", hot:0,lab:"route=sales"},
    {a:"refund",b:"gate", hot:1},
    {a:"bug",  b:"gate",  hot:0},
    {a:"sales",b:"gate",  hot:0},
    {a:"gate", b:"done",  hot:1},
    {a:"done", b:"END",   hot:1}
  ];

  /* ---- один origin, один scale, одна пара sx/sy ---- */
  var origin = {x:70, y:190}, scale = 74;
  function sx(x){ return origin.x + x*scale; }
  function sy(y){ return origin.y - y*scale; }

  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("d");
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function by(id){for(var i=0;i<N.length;i++)if(N[i].id===id)return N[i];}
  var LW=1.6, FS=13, PAD=7;                 /* толщина, кегль, отступ подписи */
  var boxW=scale*1.32, boxH=scale*0.5;

  svg.appendChild(el("rect",{x:0,y:0,width:920,height:380,fill:"var(--bg)"}));
  var defs=el("defs",{});
  ["line","hot"].forEach(function(c){
    var m=el("marker",{id:"h-"+c,viewBox:"0 0 10 8",refX:"9",refY:"4",
      markerWidth:"7",markerHeight:"6",orient:"auto-start-reverse"});
    m.appendChild(el("path",{d:"M0,0 L10,4 L0,8 z",fill:"var(--"+c+")"}));
    defs.appendChild(m);
  });
  svg.appendChild(defs);

  /* ---- рёбра: обрезаны по краям боксов ---- */
  function port(n,dirx){
    return {x: sx(n.x) + dirx*(n.k==="edge"? boxH*0.62 : boxW/2), y: sy(n.y)};
  }
  E.forEach(function(e){
    var a=by(e.a), b=by(e.b), col=e.hot?"var(--hot)":"var(--line)";
    var p1=port(a,1), p2=port(b,-1);
    var mx=(p1.x+p2.x)/2;
    var d="M"+p1.x+","+p1.y+" C"+mx+","+p1.y+" "+mx+","+p2.y+" "+p2.x+","+p2.y;
    svg.appendChild(el("path",{d:d,fill:"none",stroke:col,
      "stroke-width":e.hot?LW+0.9:LW,"stroke-dasharray":e.hot?"":"5 4",
      "marker-end":"url(#h-"+(e.hot?"hot":"line")+")",opacity:e.hot?1:.75}));
    if(e.lab){
      /* подпись у хвоста, разведена по вертикали от своей ветки */
      var up = by(e.b).y > by(e.a).y;
      svg.appendChild(el("text",{x:p1.x+PAD*1.4, y:sy(by(e.b).y)+(up?-PAD*1.2:(by(e.b).y<by(e.a).y?PAD*2.1:-PAD*1.2)),
        "text-anchor":"start","font-size":FS-1.5,
        fill:e.hot?"var(--hot)":"var(--muted)"})).textContent=e.lab;
    }
  });

  /* ---- узлы ---- */
  N.forEach(function(n){
    var g=el("g",{}), cx=sx(n.x), cy=sy(n.y);
    if(n.k==="edge"){
      g.appendChild(el("rect",{x:cx-boxH*0.62,y:cy-boxH/2,width:boxH*1.24,height:boxH,
        rx:boxH/2,fill:"var(--hotfill)",stroke:"var(--hot)","stroke-width":LW}));
    } else {
      var isG=n.k==="gate";
      g.appendChild(el("rect",{x:cx-boxW/2,y:cy-boxH/2,width:boxW,height:boxH,rx:boxH*0.22,
        fill:n.hot?(isG?"var(--gatefill)":"var(--hotfill)"):"var(--node)",
        stroke:isG?"var(--gate)":(n.hot?"var(--hot)":"var(--nodeb)"),
        "stroke-width":n.hot?LW+0.6:LW,
        "stroke-dasharray":n.hot?"":"4 3"}));
    }
    g.appendChild(el("text",{x:cx,y:cy+FS*0.35,"text-anchor":"middle","font-size":FS,
      fill:n.hot?"var(--fg)":"var(--muted)","font-weight":n.hot?600:400})).textContent=n.t;
    svg.appendChild(g);
  });

  /* ---- аннотации: якоря разные, стороны разные ---- */
  var cls=by("cls");
  svg.appendChild(el("text",{x:sx(cls.x)-boxW/2, y:sy(cls.y)-boxH/2-PAD*1.6,
    "text-anchor":"start","font-size":FS-1,fill:"var(--muted)"}))
    .textContent="3 ребра наружу";

  var gate=by("gate");
  svg.appendChild(el("text",{x:sx(gate.x), y:sy(gate.y)-boxH/2-PAD*1.6,
    "text-anchor":"middle","font-size":FS-1,fill:"var(--gate)"}))
    .textContent="пауза: человек правит состояние";
  svg.appendChild(el("text",{x:sx(gate.x), y:sy(gate.y)+boxH/2+PAD*2.4,
    "text-anchor":"middle","font-size":FS-1,fill:"var(--muted)"}))
    .textContent="3 ребра внутрь";

  /* фигурная скобка ветвей + подпись сбоку, ниже линии */
  var bx=sx(by("refund").x)+boxW/2+PAD*2.2;
  svg.appendChild(el("path",{d:"M"+bx+","+sy(1.5)+" H"+(bx+PAD)+" V"+sy(-1.5)+" H"+bx,
    fill:"none",stroke:"var(--muted)","stroke-width":LW}));
  svg.appendChild(el("text",{x:bx+PAD*2, y:sy(-1.5)+PAD*2.6,
    "text-anchor":"start","font-size":FS-1,fill:"var(--muted)"}))
    .textContent="взаимоисключающие: за прогон ровно 1 из 3";

  /* чекпоинты на горячем пути */
  ["cls","refund","done"].forEach(function(id){
    var n=by(id);
    svg.appendChild(el("circle",{cx:sx(n.x)+boxW/2, cy:sy(n.y)-boxH/2,
      r:scale*0.055,fill:"var(--hot)"}));
  });
  var r=by("refund");
  svg.appendChild(el("text",{x:sx(r.x)+boxW/2+PAD, y:sy(r.y)-boxH/2-PAD,
    "text-anchor":"start","font-size":FS-1.5,fill:"var(--hot)"}))
    .textContent="● чекпоинт после узла — 3 точки за прогон";

  /* легенда снизу, вне рисунка */
  svg.appendChild(el("text",{x:sx(0)-boxH*0.62, y:sy(-2.15),
    "text-anchor":"start","font-size":FS-1,fill:"var(--hot)"}))
    .textContent="—— выбранный прогон: START → classify → refund → done → END";
  svg.appendChild(el("text",{x:sx(0)-boxH*0.62, y:sy(-2.15)+FS*1.5,
    "text-anchor":"start","font-size":FS-1,fill:"var(--muted)"}))
    .textContent="- - -  рёбра графа, не выбранные в этом прогоне (bug, sales)";
}catch(err){
  var h=document.getElementById("host");
  h.innerHTML='<p class="err">Схема не построилась. Она должна показывать: '+
   'START → classify, из classify три взаимоисключающие ветки refund / bug / sales, '+
   'все три сходятся в human gate → done/send → END. За один прогон срабатывает '+
   'ровно одна ветвь: START → classify → refund → done → END (3 узла из 5, '+
   'bug и sales не запускались), и после каждого узла пишется чекпоинт — 3 точки за прогон.</p>';
}
})();
</script>
</html>
