- concept: узел возвращает частичное обновление, и ключи, отсутствующие в обновлении, сохраняют прежнее значение
  question: 'Состояние графа содержит поля `route`, `messages`, `attempt`, `status`. Узел вернул `{"route": "sales"}`. Каким должно быть поведение функции слияния обновления с состоянием?'
  explanation: Узел — это функция `(state) -> state_update`, и возвращает он дельту, а не всё состояние. Молчание про поле означает «поле меня не касается», а не «обнули поле». Замена состояния дельтой стёрла бы историю сообщений и счётчик попыток после первого же узла, и восстановление из чекпоинта возобновляло бы прогон с пустым состоянием.
  kind: choice
  options:
    - 'Заменить состояние возвращённым словарём: в новом состоянии останется только `route`'
    - Обновить `route`, а `messages`, `attempt` и `status` оставить в точности такими, какими они были
    - Обновить `route`, а остальные поля сбросить в значения по умолчанию для их типов
    - 'Отклонить обновление: узел обязан возвращать все поля состояния'
  correct: 1
  id: 009-code-merge-update-1
  fingerprint: b1ef14e6
- concept: 'редьюсер задаётся отдельно на каждое поле: накопительные поля склеиваются, скалярные вытесняются'
  question: Поле `messages` накапливает историю (узел возвращает список из новых сообщений), поле `route` — скаляр. Допишите строку редьюсера для накопительного поля.
  explanation: 'Редьюсер — правило склейки старого значения с новым, своё на каждое поле. Для списка сообщений или лога событий это конкатенация: возврат `{"messages": [msg]}` значит «допиши в конец», а не «теперь в истории ровно одно сообщение». Для скаляров вроде `route` или `status` редьюсер по умолчанию — перезапись последним значением.'
  kind: cloze
  template: |-
    new_state["messages"] = old_state["messages"] ___ update["messages"]
    new_state["route"] = update["route"]
  answer: +
  accept:
    - +
    - ' + '
    - plus
  id: 009-code-merge-update-2
  fingerprint: a7da42a8
- concept: явный None в обновлении отличается от отсутствующего ключа, поэтому проверять надо членство ключа, а не значение
  question: 'Функция слияния написана так: для каждого поля состояния берётся `update.get(field)`, и если результат не `None`, поле перезаписывается. Какой дефект несёт эта реализация?'
  explanation: '`get` схлопывает два разных случая в один. Признак наличия обновления — членство ключа (`field in update`), а не его значение. Иначе явный `None` (сброс поля) молча игнорируется. Симметричная ошибка — трактовать любое `None` как обновление: тогда каждое поле обнуляется на каждом шаге. Той же строгости требует и незнакомый ключ: опечатку `rout` вместо `route` функция должна не проглатывать, а поднимать ошибку.'
  kind: choice
  options:
    - Она не сможет отличить «узел явно вернул None» от «узел не вернул ключ», и обнулить поле станет невозможно
    - Она будет обнулять все поля состояния на каждом шаге
    - Она сломает только накопительные поля, а скалярные обработает верно
    - Она заставит узлы возвращать полное состояние целиком
  correct: 0
  id: 009-code-merge-update-3
  fingerprint: 1e84a8f7
