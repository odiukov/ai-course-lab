- concept: драйвер графа не содержит доменной логики — он только упорядочивает вызовы отдельно тестируемых функций (слияние, выбор перехода, запись чекпоинта)
  question: Объясни своими словами, почему функция-драйвер графа состояний не должна содержать собственной логики — ни правил маршрутизации, ни правил слияния обновлений, ни сериализации состояния, — а только вызывать для этого отдельные функции.
  explanation: 'Разделение «механики» и «политики»: цикл знает порядок, но не знает правил. Это и даёт независимую тестируемость частей, сменяемый чекпоинтер и одинаковый код для запуска и для возобновления.'
  kind: open
  reference: 'Драйвер отвечает за одно: порядок операций на витке цикла (вызов узла, слияние обновления, запись чекпоинта, выбор следующего узла) и условие выхода. Вся содержательная логика вынесена в отдельные чистые функции, поэтому каждую можно тестировать без запуска графа: слияние — на паре словарей, маршрутизацию — на состоянии без узлов и рёбер, валидацию — на описании графа. Если правила зашить внутрь цикла, они проверяются только сквозным прогоном, любое изменение маршрутизации требует трогать код исполнения, а подменить хранилище чекпоинтов или политику слияния становится нельзя без переписывания драйвера. Плюс сам драйвер тогда остаётся достаточно тонким, чтобы одинаково работать и на старте с чистого состояния, и на возобновлении с загруженного.'
