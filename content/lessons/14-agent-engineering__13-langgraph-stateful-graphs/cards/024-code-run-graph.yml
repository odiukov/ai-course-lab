- concept: цикл выполнения нуждается в потолке шагов, потому что условные рёбра допускают замкнутое кольцо без естественного терминатора, и превышение потолка — это ошибка, а не нормальное завершение
  question: Драйвер крутит цикл «вызвать узел — слить — сохранить — выбрать переход», пока не придёт END. Зачем добавлять счётчик шагов с потолком (скажем, 250) и что драйвер обязан сделать при его превышении?
  explanation: 'Условное ребро выбирает следующий узел функцией от состояния, и ничто не мешает состоянию возвращать граф в тот же узел бесконечно — END может не наступить никогда. Потолок делает худший случай ограниченным: не больше 250 вызовов модели. Возврат состояния «как итогового» при упёршемся счётчике опаснее падения: наверху получат обрезанный результат, неотличимый от успешного прогона.'
  kind: choice
  options:
    - Потолок ограничивает бесконечный цикл, который дают замкнутые в кольцо условные рёбра; при превышении надо завершиться ошибкой, а не вернуть текущее состояние как итоговое
    - 'Потолок нужен, чтобы ограничить размер чекпоинта: после 250 записей состояние перестаёт помещаться в базу'
    - Потолок задаёт число узлов графа; превышение означает, что в граф добавили узлы во время прогона
    - 'Потолок нужен только для стриминга: интерфейс не умеет показывать больше 250 событий-дельт'
