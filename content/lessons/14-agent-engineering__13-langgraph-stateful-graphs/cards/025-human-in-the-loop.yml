- concept: узлы ниже по потоку не различают источник обновления состояния, поэтому правку человека надо валидировать до записи в чекпоинтер
  question: Оператор правит в чекпоинте поле route, вписывая туда имя ветки, которой в графе нет. Запись кладут обратно, прогон продолжают. Что произойдёт?
  explanation: Слияние обновления и выбор перехода читают только состояние и не знают, откуда пришло значение — из узла или из рук человека. Значит валидировать правку обязан тот слой, который её принимает, до записи в чекпоинтер.
  kind: choice
  options:
    - Прогон упадёт на выборе перехода — состояние не хранит признака «правил человек», и никакой дополнительной проверки правки не делается
    - Граф отклонит правку, потому что чекпоинтер сверяет записанное значение со списком имён узлов
    - 'Прогон продолжится с прежним значением route: ручные правки применяются только после подтверждения следующим узлом'
    - Граф автоматически откатится к предыдущему чекпоинту, обнаружив неизвестное значение
