- concept: точку паузы выбирают по цене отката побочного эффекта, а не по особенностям механики узла
  question: Граф из 30 узлов, чекпоинт пишется после каждого. Ставить паузу перед каждым узлом никто не будет. По какому критерию выбирают узлы, перед которыми человек всё-таки смотрит состояние?
  explanation: 'Ключ: критерий экономический, а не технический. Ни один узел не «умеет» паузу лучше другого — все они одинаково оставляют после себя чекпоинт. Выбирают там, где отмена дороже проверки.'
  kind: open
  reference: 'По стоимости и необратимости побочного эффекта узла: списание денег, письмо клиенту, запрос наружу, который нельзя отменить. Механика паузы у всех узлов одинаковая — состояние и так сериализовано после каждого шага. Разница только в цене ошибки: перед необратимым действием разовый просмотр дешевле, чем последующий откат, а перед чистым узлом-преобразователем пауза не окупается, потому что его результат можно просто пересчитать.'
