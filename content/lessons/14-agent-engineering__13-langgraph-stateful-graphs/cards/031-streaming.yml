- concept: одно и то же обновление узла уходит в два независимых потребителя — наружу как событие стрима и в хранилище как чекпоинт; ни один не заменяет другой
  question: Узел вернул обновление состояния. Объясни своими словами, почему рантайму не нужен отдельный механизм для стриминга, и почему стриминг при этом не отменяет запись чекпоинта.
  explanation: Ключ в том, что дельта одна, а потребителей два. Стриминг дёшев именно потому, что паразитирует на уже существующем обновлении. Но канал к клиенту ненадёжен и не является хранилищем состояния, поэтому восстановление по-прежнему держится на чекпоинтере.
  kind: open
  reference: 'Обновление узла — уже готовый объект дельты, поэтому стриминг ничего не вычисляет заново: рантайм просто отдаёт наружу то же самое, что кладёт в состояние и в хранилище. Но у двух получателей разные задачи. Событие стрима эфемерно, живёт в соединении с клиентом и нужно для отображения прогресса; при обрыве соединения оно теряется. Чекпоинт долговечен и нужен для возобновления после сбоя. Убрать чекпоинт, оставив стрим, — потерять возможность продолжить прогон; убрать стрим, оставив чекпоинт, — вернуться к молчанию на всё время работы графа.'
