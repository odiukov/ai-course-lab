- concept: 'у стриминга две гранулярности: событие по завершении узла (имя узла + его обновление) и частичный вывод внутри узла до его возврата'
  question: Какое утверждение о гранулярности стриминга в графовом рантайме верно?
  explanation: 'Это два независимых уровня. Внутриузловой поток (например, токены генерации) идёт, пока узел ещё выполняется. Событие уровня узла появляется после возврата — в нём имя узла и его дельта, из чего вызывающая сторона строит прогресс по шагам. Одно не заменяет другое: узел без потокового вывода всё равно даст событие завершения.'
  kind: choice
  options:
    - 'События бывают только по завершении узла: пока узел не вернул обновление, отдавать наружу нечего'
    - 'События бывают только потоковые внутри узла: границы узлов вызывающей стороне не видны'
    - 'Есть обе гранулярности: узел может отдавать частичный вывод ещё до своего возврата, а по завершении рантайм отдаёт событие с именем узла и его обновлением'
    - 'Гранулярность задаётся чекпоинтером: сколько записей в хранилище, столько и событий'
