  question: Сервис на каждый HTTP-запрос генерирует свежий идентификатор сессии и передаёт его графу. Чекпоинты пишутся исправно после каждого узла. Пользователь повторяет прерванный запрос. Что произойдёт?
  explanation: Ничего не сломалось — просто ключ другой, и запись нашлась не та (точнее, не нашлась). Два запуска с одинаковым идентификатором сессии — это один прогон, разорванный падением; с разными — два независимых прогона с нуля. Поэтому выбор идентификатора и есть выбор «продолжаем или начинаем заново», и генерировать его на каждую попытку — способ отключить возобновление, не трогая чекпоинтер.
