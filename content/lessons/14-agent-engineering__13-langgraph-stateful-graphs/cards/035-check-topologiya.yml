  reference: 'Иерархия — это супервизоры над супервизорами: каждая команда получает своего супервизора, а над ними ставится верхний. Реализуется вложенными подграфами: подграф команды выглядит для верхнего уровня как обычный узел. Недооценивают роутеры: к 30 исполнителям добавляется 6 командных супервизоров и один верхний — 7 роутеров, каждый из которых тратит вызов LLM на своё решение о маршруте. Считать надо оба слоя, а не только исполнителей.'
