- concept: чекпоинт пишется после каждого узла, потому что точка падения неизвестна заранее, а сериализация состояния дешевле повторного прогона
  question: Рантайм графа сериализует состояние в чекпоинтер после каждого узла, а не один раз по завершении прогона. Что оправдывает такую частоту?
  explanation: Запись после каждого узла — страховка от события, момент которого не предсказать. Стоимость снимка — сериализация словаря состояния, стоимость потери — повторные вызовы модели за все пройденные шаги. Именно поэтому в уроке падение на 38-м шаге из 40 обходится в 2 цента вместо 38.
  kind: choice
  options:
    - Чекпоинтер (SQLite, Postgres, Redis) не умеет принимать запись реже, чем раз в узел
    - Нужен снимок непосредственно перед падением, а место падения заранее неизвестно; сама запись состояния стоит несравнимо дешевле повторных вызовов модели
    - Иначе слияние обновлений от узлов даст неверное состояние
    - Частая запись ускоряет прогон, потому что состояние не держится в памяти целиком
  correct: 1
  id: 018-durable-execution-1
  fingerprint: a2392688
- concept: стоимость восстановления при durable execution равна стоимости только непройденных шагов
  question: Прогон графа состоит из 60 узлов, каждый делает один вызов модели по 6 центов. Последний успешный чекпоинт записан после узла 50, дальше процесс упал. Сколько центов стоит доведение прогона до конца через resume(session_id)?
  explanation: 'Чекпоинт после узла 50 хранит точное состояние на этой границе, поэтому переигрываются только узлы 51–60: 10 вызовов × 6 центов = 60 центов. Без чекпоинтера пришлось бы платить за все 60 узлов заново, то есть 360 центов.'
  kind: numeric
  answer: 60
  tolerance: 0.01
  id: 018-durable-execution-2
  fingerprint: 582c1c35
- concept: запись чекпоинта стоит между получением нового состояния и переходом по ребру, а не перед вызовом узла
  question: Расставь действия рантайма при обработке одного узла в правильном порядке.
  explanation: Снимок делается после того, как состояние собрано, но до шага по ребру. Тогда на границе узлов всегда лежит согласованное состояние, и resume(session_id) продолжает ровно с узла N+1 — работа узла N не повторяется.
  kind: order
  items:
    - Узел исполняется и возвращает обновление состояния
    - Рантайм получает новое полное состояние графа
    - Рантайм сериализует состояние целиком и пишет его в чекпоинтер
    - Рантайм выбирает исходящее ребро и передаёт управление следующему узлу
  id: 018-durable-execution-3
  fingerprint: b2902558
