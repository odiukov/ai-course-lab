- concept: имя следующего узла — производное значение, детерминированно пересчитываемое из состояния, поэтому в чекпоинт оно не пишется
  question: Чекпоинтер сериализует состояние графа, но не сохраняет имя узла, в который граф собирался перейти. Объясни своими словами, почему этого достаточно для корректного возобновления.
  explanation: Состояние — источник истины, маршрут — его функция. Пока маршрутизатор детерминирован и читает только состояние, повторный вызов после загрузки чекпоинта даёт тот же целевой узел, и хранить его отдельно незачем.
  kind: open
  reference: Выбор перехода не хранится нигде — это чистая функция от состояния, которая пересчитывается заново при каждом обходе ребра. Чекпоинт содержит все поля состояния; при возобновлении маршрутизатор получает ровно тот же словарь и по детерминированности выдаёт то же имя целевого узла. Хранить производное значение не нужно, а вот обратное — сохранить указатель на следующий узел, не зафиксировав состояние, — даёт восстановленный узел без данных, на которых он должен работать. Единственный источник истины при восстановлении — состояние.
