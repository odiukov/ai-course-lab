- concept: ценность генератора-заготовки — в том, что он фиксирует решения, дорогие к изменению позже, а не в экономии времени набора
  question: Заготовка генерирует каркас графа состояний сразу с подключённым чекпоинтером и веткой возобновления. Объясни своими словами, в чём её основная польза и почему «экономия времени на печати» — неверный ответ.
  explanation: 'Общий признак хорошего шаблона: он захватывает решения, дешёвые в момент создания и дорогие в момент изменения. Чекпоинтер — ровно такое решение: одна и та же строчка кода стоит копейки в пустом каркасе и переписывания половины узлов в готовом графе.'
  kind: open
  reference: 'Набор каркаса — минуты, и эту экономию легко получить копипастой. Реальная польза в том, что заготовка не оставляет места решению «персистентность потом»: чекпоинтер и возобновление оказываются в коде до того, как написан первый узел. Это важно, потому что стоимость такого решения асимметрична — заложенное сразу оно почти бесплатно, добавленное позже требует пересмотра состояния (что сериализуемо), узлов (что безопасно выполнить повторно) и запуска (откуда взять ключ прогона). Заготовка ценна тем, какие решения она фиксирует, а не сколько символов печатает.'
  id: 037-navyk-zagotovka-2
