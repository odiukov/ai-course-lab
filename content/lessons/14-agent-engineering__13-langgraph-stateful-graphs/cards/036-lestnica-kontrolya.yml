- concept: уровни контроля над агентным рантаймом упорядочены по объёму решений, которые разработчик принимает сам
  question: Расставь варианты сборки агента от наименьшего контроля (и наименьшего объёма своего кода) к наибольшему.
  explanation: 'Разница между уровнями — объём решений, отданных разработчику. Фабрика решает всё сама. Свой граф отдаёт форму состояния и маршрутизацию, но оставляет хранение библиотеке. Своя реализация отдаёт и хранение: сериализуется ровно то, что нужно, и туда, куда нужно.'
  kind: order
  items:
    - 'Готовая фабрика агента: одна строка, ни одного решения про состояние и чекпоинты'
    - 'Свой граф на фреймворке: поля состояния, редьюсеры и условные рёбра объявляются самостоятельно, чекпоинтер берётся готовый'
    - 'Полностью своя реализация: своя форма состояния и свой бэкенд чекпоинтера'
  id: 036-lestnica-kontrolya-2
  fingerprint: e0106526
- concept: альтернативные обвязки выбираются по своему отличительному свойству, а не по общей «мощности»
  question: Система должна вести много агентных диалогов параллельно, с высокой конкурентностью между агентами. При этом хранить состояние в собственной базе не требуется. Какой признак делает акторную обвязку (вроде AutoGen) уместнее, чем написание своего графа и своего чекпоинтера?
  explanation: Обвязку выбирают по свойству, которого не хватает. Акторная модель — про конкурентность; обвязка со встроенным хранилищем сессий — про готовое хранение без своей схемы. Спуск к своему чекпоинтеру нужен только тогда, когда упор именно в бэкенд хранения или в форму состояния, а не когда просто хочется контроля.
  kind: choice
  options:
    - Акторная модель отменяет необходимость в состоянии агента
    - Акторная модель напрямую адресует нужное свойство — высокую конкурентность, — а требования к хранилищу состояния не нарушены, значит платить своим кодом не за что
    - Свой чекпоинтер физически несовместим с параллельными диалогами
    - Акторные обвязки всегда дешевле по вызовам модели
  correct: 1
  id: 036-lestnica-kontrolya-3
