- concept: 'критерий разделения памятей — к чему привязан факт: к одному прогону или к сущности, переживающей прогоны'
  question: Какой признак решает, куда положить факт — в состояние прогона или в долговременное хранилище?
  explanation: Разделяет не размер и не происхождение, а срок жизни и якорь. Реплики про один заказ нужны, пока идёт этот разговор, — это поле состояния. «Клиент требовал возврат многократно» привязано к клиенту и должно пережить сотни прогонов, поэтому лежит отдельно и ключуется идентификатором клиента.
  kind: choice
  options:
    - Привязан ли факт к конкретному разговору или к сущности, которая переживает множество разговоров
    - 'Объём факта в байтах: крупное идёт в хранилище, мелкое остаётся в состоянии'
    - Сгенерирован факт моделью или пришёл от пользователя
    - Успел ли факт попасть в чекпоинт до падения прогона
  correct: 0
