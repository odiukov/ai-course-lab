- concept: чекпоинтер восстанавливает только контекст своего прогона и сам по себе не даёт кросс-прогонного знания о пользователе
  question: У команды подключён чекпоинтер, возобновление после сбоя работает безупречно. Но при каждом новом обращении клиента агент заново спрашивает всё, что клиент рассказывал в прошлые 15 обращений. Объясни, почему чекпоинтер эту проблему не решает.
  explanation: Две памяти решают разные задачи. Краткосрочная — поле состояния (история сообщений), восстанавливается вместе с чекпоинтом и после закрытия диалога не нужна. Долгосрочная — внешнее хранилище, ключ по клиенту, доступ инструментом. Исправность одной ничего не говорит о наличии другой.
  kind: open
  reference: 'Чекпоинтер сохраняет состояние конкретного прогона и находит его по ключу этого прогона. Внутри одного разговора он честно возвращает историю сообщений и всё остальное состояние — это краткосрочная память. Но новое обращение клиента — это другой прогон с другим ключом, то есть другая ячейка хранилища, и старая история туда не относится (да и не нужна: сорок реплик про давно закрытый заказ только мешают). Знание о клиенте живёт в другом измерении: оно привязано не к прогону, а к самому клиенту, поэтому требует отдельного долговременного хранилища с ключом по идентификатору клиента, куда факты пишутся и откуда граф их читает инструментом. Чекпоинтер про клиента ничего не знает, потому что его никто об этом и не спрашивал.'
  id: 032-dva-vida-pamyati-3
