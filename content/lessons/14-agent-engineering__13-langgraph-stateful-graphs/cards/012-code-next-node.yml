  explanation: Возобновление исходит из того, что то же состояние даёт то же решение о переходе. Недетерминированный источник (модель, время, внешний API) и побочная запись превращают повтор перехода в новую ветку и в двойной инкремент. Решение принимается заранее в узле и сохраняется в поле состояния, а маршрутизатор его только читает.
