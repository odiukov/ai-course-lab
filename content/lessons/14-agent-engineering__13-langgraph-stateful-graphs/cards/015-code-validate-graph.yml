- concept: обход достижимости от START идёт по рёбрам с множеством посещённых, иначе цикл в графе зацикливает валидатор
  question: Расставь шаги проверки достижимости узлов в описании графа (граф может содержать циклы).
  explanation: 'Пропуск уже посещённых — не оптимизация, а условие завершимости: узел с ребром назад (retry) без этой проверки гоняет обход по кольцу вечно. Валидатор не запускает узлы, он ходит только по именам, поэтому обход дёшев и не стоит ни одного вызова модели.'
  kind: order
  items:
    - Положить START в очередь обхода, множество посещённых пустое
    - Взять узел из очереди; если он уже в посещённых — пропустить его
    - Отметить узел как посещённый
    - Добавить в очередь все имена-цели исходящих рёбер этого узла
    - Когда очередь опустела, вычесть посещённые из множества всех узлов — остаток недостижим
  id: 015-code-validate-graph-1
  fingerprint: dba81990
- concept: 'узел без исходящих рёбер (кроме END) — тупик: прогон останавливается на нём, не дойдя до конца графа'
  question: Валидатор графа получил 9 узлов и для каждого — список имён, куда узел может уйти. У узла `escalate` этот список пуст, при этом `escalate` достижим от START, а все его имена-цели корректны. Что должен сообщить валидатор?
  explanation: Три проверки ловят разные болезни. Висячее ребро — цель есть, а узла с таким именем нет. Недостижимость — на узел никто не ссылается. Тупик — узел есть, до него доходят, но выйти из него некуда; единственный законный узел без выходов — END.
  kind: choice
  options:
    - 'Ничего: узел достижим и висячих рёбер у него нет'
    - 'Тупик: у узла нет ни одного выхода, значит прогон, дойдя до него, остановится, так и не попав в END'
    - 'Висячее ребро: пустой список целей считается ссылкой на несуществующий узел'
    - 'Недостижимый узел: без исходящих рёбер узел выпадает из обхода'
  correct: 1
  id: 015-code-validate-graph-2
  fingerprint: '839109e9'
- concept: валидатор собирает полный список проблем и возвращает его целиком, а не прерывается на первой найденной
  question: Почему функция статической валидации графа возвращает список всех найденных проблем, а не бросает исключение на первой?
  explanation: 'Валидация ничего не исполняет, поэтому останавливаться после первой находки незачем: обход всё равно проходит весь граф. Если сломаны и висячее ребро, и тупик, и недостижимый узел, дешевле получить три строки сразу. Пустой список при этом — понятный сигнал «граф здоров».'
  kind: choice
  options:
    - Исключение нельзя бросить внутри обхода с множеством посещённых
    - Список позволяет увидеть все поломки за один прогон валидатора; иначе на каждую ошибку тратится отдельный цикл «поправил — перезапустил»
    - Пустой список нужен как значение по умолчанию для условных рёбер
    - Список ошибок сериализуется в чекпоинт, а исключение — нет
  correct: 1
  id: 015-code-validate-graph-3
  fingerprint: f99bbc77
