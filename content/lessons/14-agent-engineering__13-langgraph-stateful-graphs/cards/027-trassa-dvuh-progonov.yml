- concept: в чекпоинтируемое состояние попадает только сериализуемое, а объекты, привязанные к процессу, пересоздаются после загрузки
  question: Узел графа открыл HTTP-клиент с пулом соединений и положил сам объект клиента в поле состояния, чтобы следующие узлы его переиспользовали. Что с этим не так с точки зрения надёжного выполнения?
  explanation: 'Чекпоинт — это сериализация состояния. Всё, что живёт только внутри процесса (сокеты, файловые дескрипторы, соединения, замыкания), сериализовать либо нельзя, либо бессмысленно: после возобновления на другом хосте они не валидны. В состоянии хранят данные (адрес, идентификатор ключа, параметры), а ресурсы пересоздают при инициализации прогона.'
  kind: choice
  options:
    - Объект не сериализуется, а даже если бы сериализовался — сокеты мертвы после перезапуска; в состоянии держат конфигурацию, клиент пересоздают при старте
    - 'Ничего: чекпоинтер сохранит объект вместе с открытыми соединениями и восстановит их при загрузке'
    - 'Проблема только в размере: объект большой, чекпоинт будет писаться медленно, но корректно'
    - 'Проблема в редьюсере: объект клиента надо просто помечать как накопительное поле'
