  question: Объясни своими словами, почему для механики возобновления графа с чекпоинтами аварийное падение узла и штатное ожидание решения человека — по сути одно и то же событие.
  explanation: Единственный вход возобновления — сериализованное состояние по ключу сессии. Причина остановки в этот вход не входит, поэтому сбой и запланированная пауза обрабатываются одним и тем же кодом; разница только в том, ждали её или нет.
  kind: open
  reference: 'Возобновление опирается только на факт: под ключом сессии в чекпоинтере лежит состояние после последнего успешно завершённого узла, а следующего вызова не произошло. Почему не произошло — упал процесс, кончился таймаут, оператор ушёл — рантайм не знает и знать не должен: причина не записывается в состояние и не влияет на процедуру. В обоих случаях восстановление одинаковое: прочитать запись по ключу сессии, поднять из неё словарь состояния, вычислить следующий переход и продолжить. Отсюда и то, что участие человека не требует отдельного механизма: это то же самое чтение чекпоинта, только пауза запланирована.'
