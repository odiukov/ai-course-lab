  question: Оценка «запись чекпоинта стоит доли миллисекунды на узел» получена для графа с состоянием из нескольких скалярных полей и коротких списков. При каком изменении графа эта оценка перестанет быть верной?
  explanation: 'Стоимость записи чекпоинта пропорциональна размеру сериализуемого состояния. Больше узлов — больше записей, но каждая по-прежнему дешёвая; условные рёбра и внешние вызовы объём состояния не меняют. А накопление сырых документов в state раздувает каждую запись, и вместе с ней растёт стоимость и записи, и чтения при возобновлении. Отсюда практика: в состоянии хранить ссылки и извлечённые поля, а тяжёлые данные — во внешнем хранилище.'
