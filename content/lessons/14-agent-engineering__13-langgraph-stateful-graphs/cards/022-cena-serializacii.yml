  question: Объясни своими словами, почему сравнение «стоимость чекпоинтинга против стоимости перезапуска» нельзя свести к сравнению двух чисел и почему оно решается в пользу чекпоинтов тем сильнее, чем длиннее прогон.
  explanation: 'Ключ — не абсолютные числа, а форма зависимости. Фиксированные единицы миллисекунд на узел против потери десятков вызовов модели, накопленных к моменту падения. В уроке: 40 мс накладных расходов против 37 заново оплачиваемых вызовов модели при падении на 38-м узле.'
