  reference: 'Две величины по-разному зависят от прогресса. Накладные расходы чекпоинтинга — фиксированная стоимость на узел: она одинакова на первом узле и на сотом, суммарно линейна по длине графа и не зависит от того, где произойдёт сбой. Цена перезапуска без чекпоинтов — это стоимость всей уже проделанной работы: оплаченные токены и минуты ожидания по всем успешно пройденным узлам, и она растёт по мере продвижения. Сбой ближе к концу обходится дороже всего. Поэтому чем длиннее прогон, тем сильнее перевес: маленькая постоянная надбавка страхует растущую потерю. Плюс перезапуск не гарантирует успеха — недетерминированные узлы могут упасть снова в другом месте.'
