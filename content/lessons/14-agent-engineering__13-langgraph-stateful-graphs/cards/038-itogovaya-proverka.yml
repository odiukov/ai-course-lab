- concept: состояние графа объявлено типизированной схемой полей, и узлы обмениваются данными только через объявленные поля
  question: Почему состояние графа объявляют типизированной схемой заранее, а не передают между узлами произвольный словарь, куда каждый узел кладёт что хочет?
  explanation: 'Типизированное состояние — первая из четырёх составных частей state graph (состояние, узлы, рёбра, редьюсеры). Оно не украшение для IDE: на нём держатся и пофайловые редьюсеры, и сериализация в чекпоинт.'
  kind: open
  reference: 'Схема — это единственный контракт между узлами: узел не знает, кто его вызвал и кто пойдёт следом, он знает только имена и типы полей состояния. Типизированная схема даёт три вещи, которых нет у свободного словаря: (1) поле, которого нет в схеме, не переживёт слияние и не доедет до потребителя, а опечатка в имени ключа ловится до запуска, а не проявляется тишиной в середине прогона; (2) к каждому полю привязывается свой редьюсер — без объявленного набора полей некуда его вешать; (3) чекпоинтер сериализует состояние, а значит должен знать, что именно сериализует, чтобы восстановить это в том же виде. Свободный словарь ломает все три: контракт становится негласным, слияние — угадыванием, восстановление — ненадёжным.'
  id: 038-itogovaya-proverka-2
  fingerprint: f70b6248
- concept: статическое ребро фиксирует переход до запуска, условное — только в рантайме, поэтому доля условных рёбер задаёт, сколько путей графа известно заранее
  question: В графе из 9 узлов инженер сделал каждое ребро условным «на всякий случай, вдруг понадобится ветвление». Что он потерял по сравнению с графом, где условны только два ребра?
  explanation: Условное ребро — это ребро, выбираемое функцией от состояния, и его цель известна только в момент прохода. Статические рёбра, наоборот, дают граф, который читается глазами и проверяется до запуска. Ветвление стоит вводить там, где решение действительно зависит от состояния, иначе структура графа перестаёт быть документацией его поведения.
  kind: choice
  options:
    - 'Возможность писать чекпоинты: условные рёбра несовместимы с персистентностью состояния'
    - 'Возможность узнать маршрут до запуска: у статического ребра цель зафиксирована при сборке, а у условного она вычисляется функцией в рантайме, поэтому реальные пути графа теперь видны только по трассам прогонов'
    - 'Возможность использовать редьюсеры: слияние состояния работает только на статических рёбрах'
    - 'Скорость: вычисление функции ребра стоит дороже вызова самого узла'
