- concept: возобновление восстанавливает накопительные поля состояния (счётчик шагов, история сообщений) из чекпоинта и не инициализирует их заново
  question: Почему при возобновлении прогона счётчик выполненных шагов и история сообщений должны браться из чекпоинта, а не инициализироваться заново, если известен узел, с которого продолжать?
  explanation: Возобновление = то же состояние + другая стартовая точка. Любое поле, которое resume молча обнулит, — это либо потерянная защита (лимит шагов), либо потерянный контекст (история), либо неверная отчётность о стоимости прогона.
  kind: open
  reference: 'Имя следующего узла задаёт только точку входа в цикл, но не контекст работы. Счётчик шагов защищает от бесконечного кольца по условным рёбрам: обнулённый счётчик даёт возобновлённому прогону полный лимит заново, и зацикленный граф крутится дольше потолка. История сообщений — вход для узлов ниже по потоку: без неё модель на повторно запущенном узле не видит уже собранных фактов и решений, и решение может измениться, то есть возобновление перестаёт быть продолжением того же прогона. Правило: возобновление восстанавливает всё состояние целиком и меняет только точку входа.'
