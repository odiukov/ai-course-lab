- concept: отсутствие записи в чекпоинтере — валидный результат чтения, а не ошибка; выбор поведения остаётся за вызывающим
  question: Функция возобновления получает идентификатор сессии, для которого в чекпоинтере нет ни одной записи. Какое поведение корректно?
  explanation: 'Пустой чекпоинт означает ровно одно: сессии с таким идентификатором не существовало. Это не отказ и не поломка. Тихий старт с начала прячет разницу между «продолжили» и «начали заново» — самый дорогой класс ошибок при durable execution. Создание пустой записи хуже: чтение начинает мутировать хранилище.'
  kind: choice
  options:
    - Вернуть пустой результат — «возобновлять нечего», а решение (стартовать с нуля или сообщить об ошибке) принимает вызывающий код
    - 'Молча запустить граф с начала: раз состояния нет, начало и есть возобновление'
    - 'Бросить исключение: обращение к несуществующей сессии всегда ошибка данных'
    - Создать пустую запись чекпоинта и вернуть её, чтобы дальнейшие вызовы находили сессию
  correct: 0
