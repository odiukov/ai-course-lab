- concept: статическая валидация графа — сверка множества имён узлов и множества имён-целей перехода в обе стороны
  question: Расставь шаги статической проверки графа, которая ловит и висячие рёбра, и недостижимые узлы без единого запуска.
  explanation: 'Оба дефекта — это разность двух множеств строк, вычисляемая за миллисекунды и без единого вызова модели. Ключевой момент — полнота второго множества: если не собрать возвраты условных функций и точку входа, проверка объявит недостижимыми узлы, в которые попадают только через ветвление.'
  kind: order
  items:
    - Собрать множество имён всех зарегистрированных узлов
    - 'Собрать множество всех имён, которые где-либо стоят целью перехода: обычные рёбра, каждая ветка каждой условной функции, точка входа'
    - 'Вычесть первое множество из второго: оставшиеся имена — висячие рёбра, будущий KeyError'
    - 'Вычесть второе множество из первого: оставшиеся имена — недостижимые узлы, мёртвый код'
  id: 014-vislie-rebra-2
