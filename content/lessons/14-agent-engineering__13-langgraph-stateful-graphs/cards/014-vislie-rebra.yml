- concept: 'недостижимый узел не даёт никакого сигнала: граф отрабатывает до конца, а заявленная ветка поведения никогда не исполняется'
  question: Инженер добавил в граф узел аварийной эскалации, зарегистрировал его, но ни одна ветка маршрутизирующей функции не возвращает его имя. Почему такой дефект опаснее висячего ребра, и как обнаружить его до запуска?
  explanation: 'Асимметрия сигнала: висячее ребро — громкая ошибка, недостижимый узел — молчаливая. Поэтому проверку делают в обе стороны, а не только «все ли цели существуют».'
  kind: open
  reference: 'Висячее ребро рано или поздно само о себе заявит — падением с KeyError при попытке перехода. Недостижимый узел не падает никогда: граф собирается, отрабатывает до конца, тесты зелёные, а ветка поведения просто не существует в рантайме. Инженер уверен, что защита есть, хотя её нет — отказ тихий и обнаруживается только в инциденте, когда защита должна была сработать. Ловится тем же сравнением двух множеств имён, но в обратную сторону: имя зарегистрированного узла, не встречающееся ни в одной цели перехода (ни в обычных рёбрах, ни в ветках условных функций, ни в точке входа), — недостижимо.'
  id: 014-vislie-rebra-3
  fingerprint: 5bba301b
