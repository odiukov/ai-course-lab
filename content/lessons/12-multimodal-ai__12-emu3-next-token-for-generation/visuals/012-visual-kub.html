<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Куб 4x4x4 против квадрата 8x8</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a1a; --muted:#5a5a5a;
    --img:#1f6fb2; --imgfill:#cfe4f5;
    --vid:#b2571f; --vidfill:#f5ddc6;
    --grid:#9aa0a6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e8e8e8; --muted:#a8adb4;
      --img:#6ab7f0; --imgfill:#1d3purple;
      --img:#6ab7f0; --imgfill:#1d3a55;
      --vid:#f0a76a; --vidfill:#4a2f16;
      --grid:#6b7178;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);}
  .wrap{background:var(--bg);max-width:100%;}
  h2{font:600 16px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;margin:10px 12px 4px;color:var(--fg);}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--fg);}
  .muted{fill:var(--muted);}
  #fallback{font:14px/1.5 system-ui,sans-serif;color:var(--fg);padding:8px 12px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Куб 4x4x4 против квадрата 8x8: 64 значения в обоих</h2>
  <svg id="svg" viewBox="0 0 640 380" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Слева патч 8 на 8 на одном кадре, справа кубик 4 на 4 на 4 сквозь четыре кадра"></svg>
  <div id="fallback" hidden></div>
</div>
<script>
(function(){
  var svg=document.getElementById("svg");
  var NS="http://www.w3.org/2000/svg";

  // ---- данные схемы (единственные литералы-данные) ----
  var D={
    imgFrame:{x:1,y:1,w:10,h:10},      // кадр картинки, в единицах сетки
    imgPatch:{x:2,y:3,w:8,h:8},        // квадрат 8x8 внутри кадра
    vidFrames:[{x:16,y:0},{x:18,y:2},{x:20,y:4},{x:22,y:6}], // 4 кадра со сдвигом
    frameSize:10,                       // сторона кадра видео
    cube:{x:3,y:3,w:4,h:4},            // куб 4x4 внутри кадра, глубина = 4 кадра
    arrow:{x0:16.5,y0:17.5,x1:25.5,y1:17.5}
  };
  var CANVAS={w:640,h:380};

  // ---- один origin, один scale ----
  var origin={x:24,y:34};
  var scale=11.2;
  function sx(x){ return origin.x + x*scale; }
  function sy(y){ return origin.y + y*scale; }

  // ---- отступы подписей в пикселях (разрешённые литералы) ----
  var PAD=10, FS=13, FSS=11.5, LW=1.6;

  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function add(e){svg.appendChild(e);return e;}
  function rect(x,y,w,h,fill,stroke,op){
    return add(el("rect",{x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),
      fill:fill,stroke:stroke,"stroke-width":LW,"fill-opacity":(op===undefined?1:op)}));
  }
  function line(x1,y1,x2,y2,stroke,w,dash){
    var e=el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:stroke,"stroke-width":(w||LW)});
    if(dash)e.setAttribute("stroke-dasharray",dash);
    return add(e);
  }
  function label(x,y,dx,dy,anchor,txt,cls,size){
    var t=el("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,"font-size":(size||FS)});
    if(cls)t.setAttribute("class",cls);
    t.textContent=txt;return add(t);
  }
  function grid(x,y,w,h,n,stroke){
    var i,g=el("g",{stroke:stroke,"stroke-width":0.7,"stroke-opacity":0.55});
    for(i=1;i<n;i++){
      g.appendChild(el("line",{x1:sx(x+w*i/n),y1:sy(y),x2:sx(x+w*i/n),y2:sy(y+h)}));
      g.appendChild(el("line",{x1:sx(x),y1:sy(y+h*i/n),x2:sx(x+w),y2:sy(y+h*i/n)}));
    }
    return add(g);
  }

  try{
    var cs=getComputedStyle(document.documentElement);
    var C={img:cs.getPropertyValue("--img").trim(),imgf:cs.getPropertyValue("--imgfill").trim(),
           vid:cs.getPropertyValue("--vid").trim(),vidf:cs.getPropertyValue("--vidfill").trim(),
           grid:cs.getPropertyValue("--grid").trim(),fg:cs.getPropertyValue("--fg").trim()};

    // ===== ЛЕВО: картинка, один кадр =====
    var F=D.imgFrame,P=D.imgPatch;
    rect(F.x,F.y,F.w,F.h,"none",C.grid,0);
    label(F.x+F.w/2,F.y,0,-PAD,"middle","Один кадр картинки","muted",FSS);
    rect(P.x,P.y,P.w,P.h,C.imgf,C.img,1);
    grid(P.x,P.y,P.w,P.h,8,C.img);
    label(P.x+P.w/2,P.y+P.h/2,0,FS*0.35,"middle","8 x 8",null,FS);
    label(P.x,P.y+P.h,0,PAD+FS,"start","1 токен = 64 значения","muted",FSS);
    label(P.x,P.y+P.h,0,PAD+FS*2.2,"start","времени не видит","muted",FSS);

    // ===== ПРАВО: видео, четыре кадра =====
    var S=D.frameSize,K=D.cube,fr=D.vidFrames,i;
    for(i=fr.length-1;i>=0;i--){
      rect(fr[i].x,fr[i].y,S,S,C.bg||"none",C.grid,0);
      rect(fr[i].x+K.x,fr[i].y+K.y,K.w,K.h,C.vidf,C.vid,1);
      grid(fr[i].x+K.x,fr[i].y+K.y,K.w,K.h,4,C.vid);
    }
    // рёбра «глубины» куба сквозь кадры
    var a=fr[0],b=fr[fr.length-1];
    line(a.x+K.x,      a.y+K.y,      b.x+K.x,      b.y+K.y,      C.vid,LW);
    line(a.x+K.x+K.w,  a.y+K.y,      b.x+K.x+K.w,  b.y+K.y,      C.vid,LW);
    line(a.x+K.x,      a.y+K.y+K.h,  b.x+K.x,      b.y+K.y+K.h,  C.vid,LW);
    line(a.x+K.x+K.w,  a.y+K.y+K.h,  b.x+K.x+K.w,  b.y+K.y+K.h,  C.vid,LW);

    label(fr[0].x+S,fr[0].y,PAD,-PAD*0.2,"start","4 x 4 на кадре",null,FS);
    label(b.x+K.x+K.w,b.y+K.y+K.h,PAD,PAD*1.6,"start","x 4 кадра = 64 значения",null,FS);

    // стрелка времени под правым блоком
    var A=D.arrow, hx=(A.x1-A.x0)*0.12, hy=0.45;
    line(A.x0,A.y0,A.x1,A.y1,C.fg,LW);
    add(el("polygon",{points:[sx(A.x1)+","+sy(A.y1),
                              sx(A.x1-hx*0.5)+","+sy(A.y1-hy),
                              sx(A.x1-hx*0.5)+","+sy(A.y1+hy)].join(" "),fill:C.fg}));
    label(A.x0,A.y0,-PAD,-PAD*0.4,"end","время","muted",FSS);
    label(A.x0,A.y0,PAD*0.4,PAD+FS*0.6,"start","движение за 4 кадра попадает внутрь одного токена","muted",FSS);

    // разделитель
    line(F.x+F.w+2.2,F.y-1.6,F.x+F.w+2.2,A.y0+1.6,C.grid,1,"4 4");
  }catch(e){
    svg.setAttribute("hidden","hidden");
    var f=document.getElementById("fallback");
    f.hidden=false;
    f.textContent="Схема: слева квадрат 8 x 8 пикселей внутри одного кадра — 64 значения, время не видно. "+
      "Справа куб 4 x 4 x 4: квадрат 4 на 4 пикселя, повторённый сквозь четыре кадра подряд — тоже 64 значения, "+
      "но движение за эти четыре кадра попадает внутрь одного токена.";
  }
})();
</script>
</body>
</html>
