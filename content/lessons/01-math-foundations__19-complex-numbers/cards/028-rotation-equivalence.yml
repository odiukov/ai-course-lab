- concept: умножение на комплексную экспоненту эквивалентно применению матрицы поворота на тот же угол
  question: Какой матрице соответствует умножение комплексного числа z = x + yi на e^(iθ)?
  explanation: После умножения получаются координаты x cos θ − y sin θ и x sin θ + y cos θ. Именно их вычисляют строки стандартной матрицы поворота.
  kind: choice
  options:
    - '[[cos θ, −sin θ], [sin θ, cos θ]]'
    - '[[cos θ, sin θ], [−sin θ, cos θ]]'
    - '[[sin θ, −cos θ], [cos θ, sin θ]]'
  correct: 0
  id: 028-rotation-equivalence-1
  fingerprint: d5bc4c0c
- concept: вторая строка матрицы поворота вычисляет мнимую часть результата комплексного умножения
  question: Заполни формулу для мнимой части произведения комплексного числа на e^(iθ).
  explanation: Раскрытие произведения даёт (x cos θ − y sin θ) + (x sin θ + y cos θ)i. Коэффициент при i совпадает с результатом второй строки матрицы поворота.
  kind: cloze
  template: Im((x + yi)e^(iθ)) = ___
  answer: x sin θ + y cos θ
  accept:
    - x*sin(theta) + y*cos(theta)
    - x sin(theta) + y cos(theta)
  id: 028-rotation-equivalence-2
  fingerprint: 61dc1a26
