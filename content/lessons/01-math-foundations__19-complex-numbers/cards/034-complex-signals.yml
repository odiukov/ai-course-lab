- concept: сигналы с общей угловой частотой складываются через сумму их комплексных амплитуд
  question: Вынеси общий временной множитель из суммы двух комплексных сигналов с одинаковой угловой частотой.
  explanation: Обе экспоненты содержат общий множитель e^(i*omega*t). Оставшаяся сумма комплексных амплитуд определяет амплитуду и начальную фазу результирующего сигнала.
  kind: cloze
  template: z_a(t)=A*e^(i*(omega*t+alpha)), z_b(t)=B*e^(i*(omega*t+beta)). Тогда z_a(t)+z_b(t)=e^(i*omega*t)*(___).
  answer: A*e^(i*alpha)+B*e^(i*beta)
  accept:
    - A e^(i alpha) + B e^(i beta)
    - A*exp(i*alpha)+B*exp(i*beta)
  id: 034-complex-signals-1
  fingerprint: daf892e9
- concept: умножение комплексных экспонент складывает их угловые частоты и фазы
  question: Сигнал z(t)=A*e^(i*(omega*t+phi)) умножают на p(t)=e^(i*(delta_omega*t+delta)). Какие параметры имеет произведение?
  explanation: 'При умножении показатели экспонент складываются: (omega*t+phi)+(delta_omega*t+delta). Поэтому угловая частота сдвигается на delta_omega, фаза — на delta, а амплитуда не меняется, поскольку модуль множителя p(t) единичный.'
  kind: choice
  options:
    - Амплитуда A, угловая частота omega+delta_omega, начальная фаза phi+delta
    - Амплитуда A, угловая частота omega*delta_omega, начальная фаза phi*delta
    - Амплитуда A+delta_omega, угловая частота omega, начальная фаза phi+delta
    - Амплитуда A, угловая частота omega+delta, начальная фаза phi+delta_omega
  correct: 0
