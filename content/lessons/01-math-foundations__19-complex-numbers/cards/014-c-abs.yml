- concept: модуль комплексного числа равен нулю только у нулевого комплексного числа
  question: Объясните своими словами, почему модуль комплексного числа равен нулю только тогда, когда равны нулю и его вещественная, и его мнимая части.
  explanation: Под корнем находится сумма квадратов координат. Положительная по модулю координата делает эту сумму положительной, поэтому нулевой модуль возможен только у числа с обеими нулевыми частями.
  kind: open
  reference: Квадраты обеих частей неотрицательны. Их сумма может быть равна нулю только в том случае, если каждый квадрат равен нулю, то есть обе части комплексного числа равны нулю.
