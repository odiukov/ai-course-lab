- concept: мнимая координата полярной записи равна проекции радиуса на мнимую ось
  question: Как восстановить коэффициент b при i из полярных координат r и θ?
  explanation: Мнимая координата — вертикальная проекция радиус-вектора, поэтому b = r sin(θ). Для точки 3 + 2i эта проекция равна 2.
  kind: cloze
  template: b = ___
  answer: r * sin(theta)
  accept:
    - r*sin(theta)
    - r sin θ
    - r·sin(θ)
  id: 020-polar-visual-2
  fingerprint: 2032ebac
