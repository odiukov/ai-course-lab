- concept: алгоритм деления комплексных чисел с помощью сопряжённого знаменателя
  question: Расположи действия для деления одного комплексного числа на другое в правильном порядке.
  explanation: Одна и та же ненулевая величина добавляется как множитель к числителю и знаменателю, поэтому значение дроби сохраняется. Произведение знаменателя на его сопряжённое становится вещественным, после чего обе части числителя делятся на обычный вещественный скаляр.
  kind: order
  items:
    - Найти число, сопряжённое знаменателю
    - Умножить на него и числитель, и знаменатель
    - Упростить знаменатель до вещественной суммы квадратов его координат
    - Разделить вещественную и мнимую части нового числителя на полученный вещественный знаменатель
