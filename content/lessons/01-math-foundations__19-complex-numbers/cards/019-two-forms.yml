- concept: алгебраическая и полярная формы являются разными представлениями одного комплексного числа
  question: Как связаны записи z = a + bi и z = r(cos(θ) + i sin(θ)), если их параметры согласованы?
  explanation: В алгебраической форме положение задано координатами a и b, а в полярной — расстоянием r и направлением θ. При согласованных параметрах меняется только способ описания точки.
  kind: choice
  options:
    - Они задают одну и ту же точку комплексной плоскости
    - Они задают точки, симметричные относительно вещественной оси
    - Алгебраическая запись задаёт точку, а полярная — другое комплексное число
  correct: 0
  id: 019-two-forms-1
  fingerprint: 7d8e15ff
- concept: вещественная координата полярной записи равна проекции радиуса на вещественную ось
  question: Восстанови вещественную часть комплексного числа из его полярных параметров.
  explanation: Раскрывая полярную запись, получаем z = r cos(θ) + i·r sin(θ). Поэтому алгебраические координаты равны a = r cos(θ) и b = r sin(θ).
  kind: cloze
  template: Если z = r(cos(θ) + i sin(θ)), то a = ___, а b = r sin(θ).
  answer: r cos(θ)
  accept:
    - r*cos(θ)
    - r cos(theta)
    - r*cos(theta)
  id: 019-two-forms-2
  fingerprint: 295789a6
