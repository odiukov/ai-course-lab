- concept: медленные и быстрые компоненты позиционной кодировки передают положение с разным разрешением
  question: Объясните своими словами, какую роль играют медленно и быстро меняющиеся компоненты синусоидальной позиционной кодировки.
  explanation: 'Разные частоты дают разные масштабы представления позиции: низкие частоты сохраняют общую область последовательности, а высокие обеспечивают более точное различение.'
  kind: open
  reference: Медленные компоненты мало различаются у соседних позиций и отражают их грубое расположение. Быстрые компоненты меняются заметнее и помогают различать близкие позиции.
  id: 046-positional-encoding-1
  fingerprint: fd2c0c0a
- concept: сочетание разных частот уменьшает неоднозначность из-за периодичности отдельных синусоид
  question: Почему для позиционной кодировки используют несколько синусоидальных частот, а не одну?
  explanation: Код одной частоты повторяется через определённый период, поэтому разные позиции могут получить одинаковую пару значений. Совместный отпечаток нескольких частот повторяется гораздо реже и лучше различает позиции.
  kind: choice
  options:
    - Отдельная частота периодически повторяется, а сочетание разных периодов помогает различать далёкие позиции
    - Несколько частот заставляют амплитуду кодировки расти вместе с позицией
    - Каждая дополнительная частота удаляет одну координату из вектора
    - Несколько частот превращают синус и косинус в линейные функции
