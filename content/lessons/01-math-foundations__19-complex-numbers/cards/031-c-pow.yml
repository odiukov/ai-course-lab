- concept: при возведении комплексного числа в целую степень модуль возводится в эту степень, а аргумент умножается на показатель
  question: Заполни формулу для ненулевого комплексного числа в полярной форме.
  explanation: При каждом комплексном умножении модули перемножаются, а аргументы складываются. Для n одинаковых множителей это даёт модуль r^n и аргумент n*theta.
  kind: cloze
  template: z = r * (cos(theta) + i*sin(theta))  =>  z^n = ___
  answer: r^n * (cos(n*theta) + i*sin(n*theta))
  accept:
    - r^n(cos(n*theta)+i*sin(n*theta))
    - r^n * e^(i*n*theta)
  id: 031-c-pow-1
  fingerprint: 6d67d6a3
- concept: итеративное вычисление неотрицательной целой степени через нейтральный накопитель и комплексное умножение
  question: Расположи действия функции c_pow(z, n) в правильном порядке.
  explanation: Нейтральный старт не добавляет лишнего множителя. Каждый проход домножает текущий результат на z, поэтому после n проходов накопитель равен z^n; если проходов нет, он остаётся нейтральным элементом.
  kind: order
  items:
    - Создать накопитель, равный нейтральному элементу комплексного умножения.
    - 'Повторить n раз: заменить накопитель на c_mul(накопитель, z).'
    - Вернуть накопитель как значение z^n.
  id: 031-c-pow-2
  fingerprint: 48b12363
