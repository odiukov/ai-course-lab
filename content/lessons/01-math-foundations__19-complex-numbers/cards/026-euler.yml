- concept: значения комплексной экспоненты с чисто мнимым показателем лежат на единичной окружности
  question: Где на комплексной плоскости расположены значения e^(iφ), если φ принимает любые вещественные значения?
  explanation: По формуле Эйлера координаты равны cos(φ) и sin(φ). Тождество cos²(φ) + sin²(φ) = 1 означает, что модуль e^(iφ) всегда равен 1, поэтому значения лежат на единичной окружности.
  kind: choice
  options:
    - Только на вещественной оси
    - Внутри единичного круга
    - На единичной окружности
  correct: 2
  id: 026-euler-1
  fingerprint: 63e72a3c
- concept: комплексная экспонента с чисто мнимым показателем периодична по углу
  question: Почему добавление полного оборота к вещественному углу не изменяет значение e^(iφ)?
  explanation: Формула Эйлера выражает e^(iφ) через cos(φ) и sin(φ). Обе функции имеют период 2π, поэтому e^(i(φ + 2π)) = e^(iφ).
  kind: open
  reference: После полного оборота косинус и синус возвращаются к прежним значениям. Поэтому вещественная и мнимая части комплексной экспоненты также не изменяются.
  id: 026-euler-2
  fingerprint: 3dbe9f98
