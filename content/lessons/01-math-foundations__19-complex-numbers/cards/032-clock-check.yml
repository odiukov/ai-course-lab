- concept: возврат после полного цикла в вычислениях с плавающей точкой проверяют с численным допуском
  question: После полного цикла поворотов программа получила точку, которая лишь на величину машинной погрешности отличается от начальной. Как корректно проверить возврат?
  explanation: Тригонометрические операции и повторные умножения накапливают погрешность. Поэтому результат вроде (1.0000000000000002, -0.0000000000000004) следует считать возвращением в (1, 0), если расхождение меньше выбранного допуска.
  kind: choice
  options:
    - Потребовать точного равенства обеих координат
    - Сравнить расстояние между итоговой и начальной точками с небольшим допуском
    - Округлять координаты после каждого промежуточного поворота
