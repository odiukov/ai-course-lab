- concept: проекции вращающегося фазора дают синусоидальные сигналы
  question: У фазора e^(iωt) наблюдают только мнимую координату его конца. Какой сигнал получится?
  explanation: По формуле Эйлера e^(iωt) = cos(ωt) + i sin(ωt), поэтому мнимая координата фазора равна sin(ωt). Вещественная координата даёт cos(ωt).
  kind: choice
  options:
    - sin(ωt)
    - cos(ωt)
    - Постоянный сигнал
    - Линейно растущий сигнал
  correct: 0
  id: 033-phasor-1
  fingerprint: 16fc4b01
- concept: угловая частота задаёт скорость вращения фазора и скорость колебаний его проекций
  question: Как увеличение модуля ω в фазоре e^(iωt) влияет на вращение фазора и получаемые из него синусоидальные сигналы?
  explanation: Угол фазора равен ωt. Чем быстрее этот угол изменяется со временем, тем быстрее вращается фазор и тем выше частота сигналов cos(ωt) и sin(ωt).
  kind: open
  reference: Фазор вращается быстрее, поэтому его вещественная и мнимая проекции также совершают колебания быстрее.
  id: 033-phasor-2
  fingerprint: 55a5acdd
- concept: амплитуда представляется длиной фазора, а начальная фаза — его углом
  question: Фазор записан как A·e^(i(ωt+φ)). Какова геометрическая роль параметров A и φ?
  explanation: Множитель A масштабирует фазор и амплитуду его проекций. Добавка φ сдвигает угол вращения, поэтому задаёт начальную фазу сигналов.
  kind: choice
  options:
    - A задаёт длину стрелки, а φ — её начальный угол
    - A задаёт начальный угол, а φ — скорость вращения
    - A задаёт скорость вращения, а φ — длину стрелки
    - Оба параметра изменяют только скорость вращения
  correct: 0
