- concept: умножение на i сохраняет модуль комплексного числа
  question: Почему умножение любого комплексного числа на i не изменяет его модуль?
  explanation: 'Умножение на i выполняет поворот на 90 градусов без растяжения. Координаты меняются с (a, b) на (−b, a), но сумма их квадратов остаётся той же: a² + b².'
  kind: open
  reference: Модуль i равен единице, а модуль произведения равен произведению модулей. Поэтому |iz| = |z|; геометрически меняется только направление комплексного вектора.
