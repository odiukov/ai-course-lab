- concept: сравнение query и key после RoPE инвариантно к общему сдвигу их позиций
  question: Query находится на позиции 7, а key — на позиции 11. Оба токена сдвинули на 20 позиций, так что они оказались на позициях 27 и 31. Как изменится их сравнение, обусловленное RoPE?
  explanation: 'В RoPE совместный абсолютный поворот сокращается при сравнении query и key. В обоих случаях относительный сдвиг равен 4: 11 − 7 = 31 − 27, поэтому позиционная составляющая сравнения сохраняется.'
  kind: choice
  options:
    - Не изменится, поскольку относительный сдвиг останется прежним
    - Усилится, поскольку абсолютные номера позиций выросли
    - Ослабнет, поскольку RoPE накапливает общий угол поворота
    - Станет независимым от порядка токенов
  correct: 0
  id: 047-rope-1
  fingerprint: 3fa8627a
- concept: знак относительного угла RoPE кодирует направление смещения между токенами
  question: Объясни своими словами, как изменится относительный угол RoPE, если поменять местами query на позиции m и key на позиции n.
  explanation: RoPE использует знаковую разность позиций, а не только расстояние без направления. Поэтому перестановка токенов обращает относительный поворот.
  kind: open
  reference: 'Разность позиций сменит знак: вместо (n − m)θ получится (m − n)θ = −(n − m)θ. Величина смещения сохранится, но поворот будет направлен в противоположную сторону.'
  id: 047-rope-2
  fingerprint: '138663e9'
