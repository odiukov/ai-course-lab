- concept: коэффициент DFT X[k] измеряет корреляцию сигнала с комплексной синусоидой частоты k
  question: Что выражает коэффициент X[k] дискретного преобразования Фурье?
  explanation: DFT умножает отсчёты сигнала на значения эталонной комплексной синусоиды и суммирует результаты. Поэтому X[k] показывает, насколько в сигнале выражена соответствующая частотная составляющая, включая её фазу.
  kind: choice
  options:
    - Степень согласованности сигнала с комплексной синусоидой частоты k
    - Значение исходного отсчёта x[k]
    - Порядковый номер самой сильной частоты
    - Среднее значение всех отсчётов сигнала
  correct: 0
  id: 039-dft-question-1
  fingerprint: ea40b813
- concept: DFT возвращает отдельный комплексный коэффициент для каждой доступной дискретной частоты
  question: Почему результат DFT хранит набор коэффициентов X[k], а не только индекс наиболее выраженной частоты?
  explanation: Для сигнала из N отсчётов DFT вычисляет N коэффициентов. Каждый X[k] относится к своему частотному эталону, поэтому преобразование сохраняет полный частотный состав, а не выбирает единственного победителя.
  kind: open
  reference: DFT независимо сравнивает сигнал с каждой частотой своей дискретной сетки. Сигнал может одновременно содержать несколько частотных составляющих, поэтому для каждой из них сохраняется отдельный комплексный коэффициент.
  id: 039-dft-question-2
  fingerprint: bbf9fb45
