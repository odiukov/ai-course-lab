- concept: знак фазы комплексного веса задаёт направление его вращения
  question: Какую роль играет знак перед фазой в комплексном весе прямого DFT?
  explanation: В прямом DFT отрицательный знак означает уменьшение фазы по мере продвижения по отсчётам. Замена знака на положительный развернула бы вращение в противоположную сторону.
  kind: cloze
  template: В выражении e^{-iθ} знак «−» задаёт ___ вращения комплексного веса.
  answer: направление
  accept:
    - направление вращения
    - направление поворота
    - ориентацию вращения
