- concept: последовательное применение согласованных DFT и IDFT восстанавливает исходный сигнал с точностью машинной арифметики
  question: Что произойдёт, если к конечному дискретному сигналу сначала применить DFT, а затем согласованное с ним IDFT? Почему результат на компьютере иногда немного отличается от исходных отсчётов?
  explanation: DFT и согласованное IDFT являются взаимно обратными преобразованиями. В точной арифметике восстановление было бы точным, но вычисление комплексных весов и суммирование дают малые ошибки округления.
  kind: open
  reference: IDFT восстановит исходный сигнал. Небольшие расхождения возможны из-за округления при вычислениях с плавающей точкой, а не из-за потери частотной информации.
