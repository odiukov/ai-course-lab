- concept: 'сопряжение является инволюцией: двойное применение возвращает исходное число'
  question: Объясни своими словами, почему выражение c_conj(c_conj(z)) должно иметь то же значение, что и z.
  explanation: Двойное отрицание возвращает прежнюю мнимую часть, а вещественная часть при обоих вызовах переносится без изменения. Следовательно, двойное сопряжение восстанавливает исходное значение.
  kind: open
  reference: Каждое сопряжение меняет знак мнимой части. При повторном применении знак меняется ещё раз и становится исходным, поэтому всё комплексное число восстанавливается.
