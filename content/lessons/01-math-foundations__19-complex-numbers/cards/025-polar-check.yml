- concept: тесты полярного преобразования должны охватывать разные комбинации знаков координат
  question: Почему для проверки перехода в полярную форму недостаточно использовать только комплексные числа с положительными вещественной и мнимой частями?
  explanation: Ошибки выбора четверти часто не проявляются, когда обе координаты положительны. Поэтому в тесты нужно включать точки из других областей комплексной плоскости.
  kind: open
  reference: При положительных координатах ошибочный способ вычисления угла может случайно дать правдоподобный результат. Точки с другими комбинациями знаков проверяют, правильно ли определяется четверть комплексной плоскости.
  id: 025-polar-check-2
