- concept: вещественные числа не изменяются при сопряжении
  question: Почему любое вещественное число совпадает со своим сопряжённым?
  explanation: Геометрически вещественные числа лежат на оси, относительно которой выполняется отражение. Каждая точка этой оси при отражении остаётся на месте.
  kind: open
  reference: У вещественного числа нет ненулевой мнимой части. Сопряжение меняет только знак мнимой части, поэтому такое число остаётся прежним.
  id: 011-sopryazhenie-2
  fingerprint: 43c66258
