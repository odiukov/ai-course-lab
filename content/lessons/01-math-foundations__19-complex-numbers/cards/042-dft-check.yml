- concept: масштабирование амплитуды синусоиды пропорционально масштабирует модуль её спектрального пика
  question: Сигнал содержит две синусоиды на разных индексах. Амплитуда второй составляет 0.25 амплитуды первой. Если модуль первого пика равен 80, каким будет модуль второго пика при одинаковой нормировке DFT?
  explanation: 'DFT линейно зависит от сигнала, поэтому уменьшение амплитуды до 0.25 уменьшает модуль пика в той же пропорции: 80 × 0.25 = 20.'
  kind: numeric
  answer: 20
  tolerance: 0.01
