- concept: знаки координат при переходе из полярной формы определяются знаками косинуса и синуса угла
  question: Комплексное число задано как z = 7(cos(135°) + i sin(135°)). Какие знаки имеют его вещественная и мнимая части?
  explanation: 'При 135° косинус отрицателен, а синус положителен. Поэтому a = r cos θ < 0, а b = r sin θ > 0: точка находится во второй четверти.'
  kind: choice
  options:
    - Вещественная положительна, мнимая положительна
    - Вещественная отрицательна, мнимая положительна
    - Вещественная отрицательна, мнимая отрицательна
    - Вещественная положительна, мнимая отрицательна
