- concept: вещественная и мнимая части задают координаты точки на комплексной плоскости
  question: Какой точке на комплексной плоскости соответствует число z = -5 + 7i?
  explanation: Вещественная часть задаёт горизонтальную координату, а коэффициент перед i — вертикальную. Поэтому z = -5 + 7i соответствует точке (-5, 7).
  kind: choice
  options:
    - (-5, 7)
    - (5, -7)
    - (7, -5)
  correct: 0
  id: 003-complex-plane-1
  fingerprint: dc8dc258
- concept: комплексное число можно интерпретировать и как точку, и как вектор из начала координат
  question: Комплексному числу z = a + bi соответствует точка (a, b). Объясни, чем отличаются представления этого числа как точки и как вектора и что у них общего.
  explanation: 'Два представления описывают один геометрический объект с разных сторон: точка отвечает за положение, а вектор из начала координат — за направление и перемещение к нему.'
  kind: open
  reference: Точка описывает положение (a, b), а вектор — направленное перемещение из начала координат к этому положению. Координаты конечной точки и компоненты вектора одинаковы.
  id: 003-complex-plane-2
  fingerprint: 056fe900
