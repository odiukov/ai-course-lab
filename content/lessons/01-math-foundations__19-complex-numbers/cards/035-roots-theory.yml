- concept: корни из единицы задают равномерную сетку частот дискретного преобразования Фурье
  question: Объясните своими словами, какую роль корни из единицы играют в дискретном преобразовании Фурье.
  explanation: Формула w_k = e^(2πik/N) перебирает равномерно разнесённые фазы. Именно по такой дискретной сетке DFT измеряет частотные составляющие сигнала.
  kind: open
  reference: Они задают равномерно расположенные на единичной окружности фазы, соответствующие дискретному набору частот, на которые DFT раскладывает сигнал.
  id: 035-roots-theory-2
  fingerprint: 5cf1176c
