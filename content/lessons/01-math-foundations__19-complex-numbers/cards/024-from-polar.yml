- concept: функции math.sin и math.cos принимают угол в радианах
  question: Почему передача угла в градусах напрямую в from_polar может дать неверные координаты?
  explanation: Вычисления from_polar зависят от math.cos(theta) и math.sin(theta), а эти функции ожидают радианы. Число, выражающее градусы, будет воспринято как число радиан.
  kind: open
  reference: math.sin и math.cos интерпретируют аргумент как радианы, поэтому угол в градусах сначала нужно преобразовать в радианы.
  id: 024-from-polar-2
  fingerprint: 2726eb1c
