- concept: аргумент нулевого комплексного числа математически не определён
  question: Для какого комплексного числа аргумент математически не определён?
  explanation: У нулевого комплексного числа нет направления от начала координат. Программа может вернуть некоторый угол по соглашению, но математически аргумент нуля не определён.
  kind: choice
  options:
    - Для нулевого комплексного числа
    - Для любого отрицательного вещественного числа
    - Для любого чисто мнимого числа
