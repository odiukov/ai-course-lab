<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Точка 3 + 2i: координаты, длина и угол</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #5b6475;
      --axis: #667085;
      --grid: #d9deea;
      --leg: #d97706;
      --leg-soft: #fff3d6;
      --vector: #2563eb;
      --angle: #7c3aed;
      --point: #dc2626;
      --halo: #ffffff;
      --fallback: #9f1239;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --surface: #182131;
        --text: #f3f4f6;
        --muted: #c4cad5;
        --axis: #aab3c2;
        --grid: #39465a;
        --leg: #fbbf24;
        --leg-soft: #372d18;
        --vector: #60a5fa;
        --angle: #c4b5fd;
        --point: #fb7185;
        --halo: #182131;
        --fallback: #fda4af;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    figure {
      width: min(100%, 650px);
      margin: unset;
      background: var(--surface);
      overflow: hidden;
    }

    figcaption {
      color: var(--text);
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--surface);
    }

    .axis {
      stroke: var(--axis);
      fill: var(--axis);
    }

    .guide {
      stroke: var(--grid);
      fill: none;
    }

    .leg {
      stroke: var(--leg);
      fill: none;
    }

    .leg-fill {
      fill: var(--leg-soft);
      stroke: none;
    }

    .vector {
      stroke: var(--vector);
      fill: none;
    }

    .vector-head {
      fill: var(--vector);
      stroke: none;
    }

    .angle {
      stroke: var(--angle);
      fill: none;
    }

    .right-angle {
      stroke: var(--leg);
      fill: none;
    }

    .point {
      fill: var(--point);
      stroke: var(--halo);
    }

    .label,
    .small-label,
    .axis-label,
    .point-label,
    .vector-label,
    .angle-label {
      paint-order: stroke;
      stroke: var(--halo);
      stroke-linejoin: round;
      fill: var(--text);
    }

    .small-label,
    .axis-label {
      fill: var(--muted);
    }

    .point-label {
      fill: var(--point);
      font-weight: 700;
    }

    .vector-label {
      fill: var(--vector);
      font-weight: 700;
    }

    .angle-label {
      fill: var(--angle);
      font-weight: 700;
    }

    .leg-label {
      fill: var(--leg);
      font-weight: 700;
    }

    .fallback {
      fill: var(--fallback);
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-subtitle">
    <figcaption id="diagram-title">
      Точка 3 + 2i: координаты, длина и угол
    </figcaption>
    <div class="subtitle" id="diagram-subtitle">
      Одна точка — два равноценных описания
    </div>
    <svg
      id="diagram"
      viewBox="0 0 650 420"
      width="650"
      height="420"
      role="img"
      aria-labelledby="svg-title svg-desc"
      preserveAspectRatio="xMidYMid meet"
    >
      <title id="svg-title">Точка 3 плюс 2i на комплексной плоскости</title>
      <desc id="svg-desc">
        Прямоугольный треугольник с катетами 3 и 2, радиусом корень
        из 13 и углом atan2 от 2 и 3, приблизительно равным 34 градусам.
      </desc>
      <g id="plot"></g>
    </svg>
  </figure>

  <script>
    "use strict";

    const DATA = Object.freeze([
      Object.freeze({
        xMin: -0.8,
        xMax: 5.8,
        yMin: -0.85,
        yMax: 3,
        originXPart: 0.15,
        originYPart: 0.72,
        scalePart: 0.2,
        tick: 0.1,
        arrowLength: 0.18,
        arrowWing: 0.09,
        vectorHead: 0.22,
        vectorWing: 0.12,
        pointRadius: 0.07,
        angleRadius: 0.72,
        angleSteps: 24,
        first: 0,
        next: 1,
        rightMark: 0.25,
        dash: "6 6"
      }),
      Object.freeze({
        x: 3,
        y: 2,
        modulusSquared: 13,
        approximateModulus: "3,6",
        approximateAngle: "34°"
      }),
      Object.freeze([
        Object.freeze({
          text: "вещественная ось",
          x: 5.8, y: 0, dx: 0, dy: 3,
          anchor: "end", kind: "axis-label"
        }),
        Object.freeze({
          text: "мнимая ось",
          x: 0, y: 3, dx: 2, dy: 1,
          anchor: "start", kind: "axis-label"
        }),
        Object.freeze({
          text: "3 вправо",
          x: 1.5, y: 0, dx: 0, dy: 3,
          anchor: "middle", kind: "leg-label"
        }),
        Object.freeze({
          text: "2 вверх",
          x: 3, y: 1, dx: 2, dy: 0,
          anchor: "start", kind: "leg-label"
        }),
        Object.freeze({
          text: "√13 ≈ 3,6",
          x: 1.5, y: 1, dx: -1, dy: -2,
          anchor: "middle", kind: "vector-label"
        }),
        Object.freeze({
          text: "θ = atan2(2, 3) ≈ 34°",
          x: 0.72, y: 0.16, dx: 1, dy: 4,
          anchor: "start", kind: "angle-label"
        }),
        Object.freeze({
          text: "3 + 2i  ↔  (3, 2)",
          x: 3, y: 2, dx: 2, dy: -2,
          anchor: "start", kind: "point-label"
        })
      ])
    ]);

    const WIDTH = 650;
    const HEIGHT = 420;
    const LABEL_PAD = 8;
    const LINE_WIDTH = Object.freeze({
      axis: 2,
      guide: 2,
      leg: 4,
      vector: 4,
      angle: 3,
      point: 3,
      halo: 5
    });
    const FONT_SIZE = Object.freeze({
      normal: 17,
      small: 15,
      important: 18,
      fallback: 16
    });

    const [cfg, point, labelSpecs] = DATA;
    const ORIGIN = Object.freeze({
      x: WIDTH * cfg.originXPart,
      y: HEIGHT * cfg.originYPart
    });
    const SCALE = HEIGHT * cfg.scalePart;

    const sx = x => ORIGIN.x + x * SCALE;
    const sy = y => ORIGIN.y - y * SCALE;

    try {
      const svg = document.getElementById("diagram");
      const plot = document.getElementById("plot");
      const NS = svg.namespaceURI;
      const theta = Math.atan2(point.y, point.x);
      const modulus = Math.sqrt(point.modulusSquared);

      const el = (name, attrs, className) => {
        const node = document.createElementNS(NS, name);
        if (className) node.setAttribute("class", className);
        Object.entries(attrs).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        plot.appendChild(node);
        return node;
      };

      const line = (a, b, className, width, extra = {}) => el("line", {
        x1: sx(a.x),
        y1: sy(a.y),
        x2: sx(b.x),
        y2: sy(b.y),
        "stroke-width": width,
        "stroke-linecap": "round",
        ...extra
      }, className);

      const polygon = (points, className) => el("polygon", {
        points: points.map(p => `${sx(p.x)},${sy(p.y)}`).join(" ")
      }, className);

      const polyline = (points, className, width, extra = {}) => el(
        "polyline",
        {
          points: points.map(p => `${sx(p.x)},${sy(p.y)}`).join(" "),
          "stroke-width": width,
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          ...extra
        },
        className
      );

      const label = spec => {
        const node = el("text", {
          x: sx(spec.x) + spec.dx * LABEL_PAD,
          y: sy(spec.y) + spec.dy * LABEL_PAD,
          "text-anchor": spec.anchor,
          "dominant-baseline": "middle",
          "font-size": spec.kind === "axis-label"
            ? FONT_SIZE.small
            : FONT_SIZE.normal,
          "stroke-width": LINE_WIDTH.halo
        }, `label ${spec.kind}`);
        node.textContent = spec.text;
        return node;
      };

      const arrowHead = (tip, tail, length, wing, className) => {
        const dx = tip.x - tail.x;
        const dy = tip.y - tail.y;
        const distance = Math.hypot(dx, dy);
        const ux = dx / distance;
        const uy = dy / distance;
        const base = {
          x: tip.x - ux * length,
          y: tip.y - uy * length
        };
        polygon([
          tip,
          {
            x: base.x - uy * wing,
            y: base.y + ux * wing
          },
          {
            x: base.x + uy * wing,
            y: base.y - ux * wing
          }
        ], className);
      };

      const origin = { x: cfg.first, y: cfg.first };
      const xEnd = { x: cfg.xMax, y: cfg.first };
      const xStart = { x: cfg.xMin, y: cfg.first };
      const yEnd = { x: cfg.first, y: cfg.yMax };
      const yStart = { x: cfg.first, y: cfg.yMin };
      const corner = { x: point.x, y: cfg.first };

      line(xStart, xEnd, "axis", LINE_WIDTH.axis);
      arrowHead(
        xEnd,
        xStart,
        cfg.arrowLength,
        cfg.arrowWing,
        "axis"
      );

      line(yStart, yEnd, "axis", LINE_WIDTH.axis);
      arrowHead(
        yEnd,
        yStart,
        cfg.arrowLength,
        cfg.arrowWing,
        "axis"
      );

      line(
        { x: point.x, y: -cfg.tick },
        { x: point.x, y: cfg.tick },
        "axis",
        LINE_WIDTH.axis
      );
      line(
        { x: -cfg.tick, y: point.y },
        { x: cfg.tick, y: point.y },
        "axis",
        LINE_WIDTH.axis
      );

      polygon(
        [origin, corner, point],
        "leg-fill"
      );

      line(
        origin,
        corner,
        "leg",
        LINE_WIDTH.leg
      );
      line(
        corner,
        point,
        "leg",
        LINE_WIDTH.leg
      );

      line(
        { x: cfg.first, y: point.y },
        point,
        "guide",
        LINE_WIDTH.guide,
        { "stroke-dasharray": cfg.dash }
      );

      line(
        origin,
        point,
        "vector",
        LINE_WIDTH.vector
      );
      arrowHead(
        point,
        origin,
        cfg.vectorHead,
        cfg.vectorWing,
        "vector-head"
      );

      const right = cfg.rightMark;
      polyline([
        { x: point.x - right, y: cfg.first },
        { x: point.x - right, y: right },
        { x: point.x, y: right }
      ], "right-angle", LINE_WIDTH.angle);

      const arcPoints = [];
      for (
        let index = cfg.first;
        index <= cfg.angleSteps;
        index += cfg.next
      ) {
        const angle = theta * index / cfg.angleSteps;
        arcPoints.push({
          x: cfg.angleRadius * Math.cos(angle),
          y: cfg.angleRadius * Math.sin(angle)
        });
      }
      polyline(
        arcPoints,
        "angle",
        LINE_WIDTH.angle
      );

      el("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: sx(cfg.pointRadius) - sx(cfg.first),
        "stroke-width": LINE_WIDTH.point
      }, "point");

      labelSpecs.forEach(label);

      const accessible = [
        `Точка (${point.x}, ${point.y}).`,
        `Катеты равны ${point.x} и ${point.y}.`,
        `Радиус равен корню из ${point.modulusSquared},`,
        `то есть приблизительно ${point.approximateModulus}.`,
        `Угол atan2(${point.y}, ${point.x})`,
        `приблизительно равен ${point.approximateAngle}.`
      ].join(" ");
      svg.setAttribute("aria-label", accessible);

      if (!Number.isFinite(modulus) || !Number.isFinite(theta)) {
        throw new Error("Геометрия содержит неверное число");
      }
    } catch (error) {
      const svg = document.getElementById("diagram");
      const plot = document.getElementById("plot");
      while (plot.firstChild) plot.removeChild(plot.firstChild);

      const NS = svg.namespaceURI;
      const fallbackLines = [
        Object.freeze({
          text: "Схема должна была показать точку (3, 2),",
          x: 0, y: 2, dx: 2, dy: 0
        }),
        Object.freeze({
          text: "катеты 3 и 2, радиус √13",
          x: 0, y: 1.5, dx: 2, dy: 0
        }),
        Object.freeze({
          text: "и угол atan2(2, 3) ≈ 34°.",
          x: 0, y: 1, dx: 2, dy: 0
        })
      ];

      fallbackLines.forEach(spec => {
        const node = document.createElementNS(NS, "text");
        node.setAttribute("x", String(sx(spec.x) + spec.dx * LABEL_PAD));
        node.setAttribute("y", String(sy(spec.y) + spec.dy * LABEL_PAD));
        node.setAttribute("font-size", String(FONT_SIZE.fallback));
        node.setAttribute("text-anchor", "start");
        node.setAttribute("dominant-baseline", "middle");
        node.setAttribute("class", "fallback");
        node.textContent = spec.text;
        plot.appendChild(node);
      });
    }
  </script>
</body>
</html>
