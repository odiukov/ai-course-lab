<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сопряжённые точки имеют одинаковый модуль</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #59657a;
      --axis: #536078;
      --guide: #b9c4d8;
      --vector: #2563eb;
      --vector-soft: #dbeafe;
      --point: #dc2626;
      --point-ring: #ffffff;
      --border: #d8dfeb;
      --line-axis: 2px;
      --line-guide: 2px;
      --line-vector: 4px;
      --line-mark: 3px;
      --line-point: 3px;
      --title-size: 22px;
      --subtitle-size: 15px;
      --label-size: 16px;
      --small-size: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101521;
        --panel: #171e2c;
        --ink: #edf2ff;
        --muted: #b6c0d4;
        --axis: #a9b5ca;
        --guide: #53627c;
        --vector: #69a2ff;
        --vector-soft: #1b3766;
        --point: #fb7185;
        --point-ring: #171e2c;
        --border: #344057;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    .diagram {
      width: 100%;
      max-width: 920px;
      margin-inline: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .heading {
      padding: 16px 20px 10px;
    }

    .heading h1 {
      margin: 0;
      color: var(--ink);
      font-size: var(--title-size);
      line-height: 1.25;
      font-weight: bold;
    }

    .heading p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: var(--subtitle-size);
      line-height: 1.4;
    }

    .canvas {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: var(--line-axis);
      stroke-linecap: round;
      fill: none;
    }

    .axis-head {
      stroke: var(--axis);
      stroke-width: var(--line-axis);
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: var(--line-axis);
      stroke-linecap: round;
    }

    .reflection-guide {
      stroke: var(--guide);
      stroke-width: var(--line-guide);
      stroke-linecap: round;
    }

    .reflection-crossing {
      fill: var(--panel);
      stroke: var(--guide);
      stroke-width: var(--line-guide);
    }

    .vector {
      stroke: var(--vector);
      stroke-width: var(--line-vector);
      stroke-linecap: round;
      fill: none;
    }

    .vector-head {
      stroke: var(--vector);
      stroke-width: var(--line-vector);
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .equal-mark {
      stroke: var(--vector);
      stroke-width: var(--line-mark);
      stroke-linecap: round;
    }

    .point {
      fill: var(--point);
      stroke: var(--point-ring);
      stroke-width: var(--line-point);
    }

    .origin-point {
      fill: var(--axis);
    }

    .axis-label,
    .tick-label,
    .point-label,
    .length-label,
    .guide-label,
    .origin-label {
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .axis-label {
      fill: var(--muted);
      font-size: var(--small-size);
      font-weight: bold;
    }

    .tick-label,
    .origin-label {
      fill: var(--muted);
      font-size: var(--small-size);
    }

    .point-label {
      fill: var(--ink);
      font-size: var(--label-size);
      font-weight: bold;
    }

    .length-label {
      fill: var(--vector);
      font-size: var(--label-size);
      font-weight: bold;
    }

    .guide-label {
      fill: var(--muted);
      font-size: var(--small-size);
    }

    .fallback {
      margin: 12px 20px 20px;
      padding: 14px 16px;
      color: var(--ink);
      background: var(--vector-soft);
      border: 1px solid var(--border);
      font-size: var(--label-size);
      line-height: 1.45;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="diagram">
    <header class="heading">
      <h1>Сопряжённые точки имеют одинаковый модуль</h1>
      <p>Отражение меняет знак мнимой части, но сохраняет расстояние до начала координат.</p>
    </header>

    <svg
      id="canvas"
      class="canvas"
      viewBox="0 0 920 470"
      width="920"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Равные модули сопряжённых комплексных чисел</title>
      <desc id="svg-description">
        Точки 3 плюс 2i и 3 минус 2i зеркальны относительно вещественной оси.
        Стрелки от начала координат к обеим точкам имеют длину корень из 13.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать точки 3 + 2i и 3 − 2i, зеркальные относительно
      вещественной оси, и две равные стрелки длины √13 от начала координат.
    </p>
  </main>

  <script>
    const diagramData = Object.freeze([{
      zero: 0,
      origin: Object.freeze({ x: 235, y: 235 }),
      scale: 90,

      axes: Object.freeze({
        xMin: -2.15,
        xMax: 6.45,
        yMin: -2.35,
        yMax: 2.35,
        headLength: 0.18,
        headHalfWidth: 0.10
      }),

      points: Object.freeze([
        Object.freeze({
          x: 3,
          y: 2,
          label: "3 + 2i",
          labelDx: 16,
          labelDy: -18,
          labelAnchor: "start",
          lengthDx: -10,
          lengthDy: -19,
          lengthAnchor: "end"
        }),
        Object.freeze({
          x: 3,
          y: -2,
          label: "3 − 2i",
          labelDx: 16,
          labelDy: 22,
          labelAnchor: "start",
          lengthDx: -10,
          lengthDy: 19,
          lengthAnchor: "end"
        })
      ]),

      ticks: Object.freeze([
        Object.freeze({
          axis: "x",
          value: 3,
          label: "3",
          labelDx: 0,
          labelDy: 24,
          labelAnchor: "middle"
        }),
        Object.freeze({
          axis: "y",
          value: 2,
          label: "2",
          labelDx: -14,
          labelDy: 0,
          labelAnchor: "end"
        }),
        Object.freeze({
          axis: "y",
          value: -2,
          label: "−2",
          labelDx: -14,
          labelDy: 0,
          labelAnchor: "end"
        })
      ]),

      tickHalf: 0.075,
      dotRadius: 0.085,
      originRadius: 0.045,
      crossingRadius: 0.055,

      vectorHeadLength: 0.22,
      vectorHeadHalfWidth: 0.12,
      equalMarkAt: 0.56,
      equalMarkHalf: 0.075,
      lengthLabelAt: 0.47,

      labels: Object.freeze({
        real: Object.freeze({
          x: 6.32,
          y: 0,
          text: "вещественная ось",
          dx: -8,
          dy: -19,
          anchor: "end"
        }),
        imaginary: Object.freeze({
          x: 0,
          y: 2.27,
          text: "мнимая ось",
          dx: 15,
          dy: 10,
          anchor: "start"
        }),
        origin: Object.freeze({
          x: 0,
          y: 0,
          text: "O",
          dx: -13,
          dy: 20,
          anchor: "end"
        }),
        reflection: Object.freeze({
          x: 3,
          y: 0,
          text: "зеркальное отражение",
          dx: 14,
          dy: -17,
          anchor: "start"
        }),
        length: "√13"
      })
    }]);

    const [config] = diagramData;
    const origin = config.origin;
    const scale = config.scale;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const canvas = document.getElementById("canvas");
      const fallback = document.getElementById("fallback");

      const element = (name, className) => {
        const node = document.createElementNS(namespace, name);
        if (className) {
          node.setAttribute("class", className);
        }
        return node;
      };

      const append = (node) => {
        drawing.appendChild(node);
        return node;
      };

      const line = (x1, y1, x2, y2, className) => {
        const node = element("line", className);
        node.setAttribute("x1", sx(x1));
        node.setAttribute("y1", sy(y1));
        node.setAttribute("x2", sx(x2));
        node.setAttribute("y2", sy(y2));
        return append(node);
      };

      const circle = (x, y, radius, className) => {
        const node = element("circle", className);
        node.setAttribute("cx", sx(x));
        node.setAttribute("cy", sy(y));
        node.setAttribute(
          "r",
          Math.abs(sx(radius) - sx(config.zero))
        );
        return append(node);
      };

      const polyline = (points, className) => {
        const node = element("polyline", className);
        node.setAttribute(
          "points",
          points.map((point) => `${sx(point.x)},${sy(point.y)}`).join(" ")
        );
        return append(node);
      };

      const text = (
        x,
        y,
        content,
        className,
        dx,
        dy,
        anchor
      ) => {
        const node = element("text", className);
        node.setAttribute("x", sx(x));
        node.setAttribute("y", sy(y));
        node.setAttribute("dx", dx);
        node.setAttribute("dy", dy);
        node.setAttribute("text-anchor", anchor);
        node.textContent = content;
        return append(node);
      };

      const arrowHead = (
        tip,
        direction,
        headLength,
        headHalfWidth,
        className
      ) => {
        const length = Math.hypot(direction.x, direction.y);
        const ux = direction.x / length;
        const uy = direction.y / length;
        const px = -uy;
        const py = ux;
        const baseX = tip.x - ux * headLength;
        const baseY = tip.y - uy * headLength;

        polyline([
          {
            x: baseX + px * headHalfWidth,
            y: baseY + py * headHalfWidth
          },
          tip,
          {
            x: baseX - px * headHalfWidth,
            y: baseY - py * headHalfWidth
          }
        ], className);
      };

      line(
        config.axes.xMin,
        config.zero,
        config.axes.xMax,
        config.zero,
        "axis"
      );

      line(
        config.zero,
        config.axes.yMin,
        config.zero,
        config.axes.yMax,
        "axis"
      );

      arrowHead(
        { x: config.axes.xMax, y: config.zero },
        { x: config.axes.xMax, y: config.zero },
        config.axes.headLength,
        config.axes.headHalfWidth,
        "axis-head"
      );

      arrowHead(
        { x: config.zero, y: config.axes.yMax },
        { x: config.zero, y: config.axes.yMax },
        config.axes.headLength,
        config.axes.headHalfWidth,
        "axis-head"
      );

      for (const tick of config.ticks) {
        if (tick.axis === "x") {
          line(
            tick.value,
            -config.tickHalf,
            tick.value,
            config.tickHalf,
            "tick"
          );

          text(
            tick.value,
            config.zero,
            tick.label,
            "tick-label",
            tick.labelDx,
            tick.labelDy,
            tick.labelAnchor
          );
        } else {
          line(
            -config.tickHalf,
            tick.value,
            config.tickHalf,
            tick.value,
            "tick"
          );

          text(
            config.zero,
            tick.value,
            tick.label,
            "tick-label",
            tick.labelDx,
            tick.labelDy,
            tick.labelAnchor
          );
        }
      }

      const upperPoint = config.points.find((point) => point.y > config.zero);
      const lowerPoint = config.points.find((point) => point.y < config.zero);

      line(
        upperPoint.x,
        lowerPoint.y,
        upperPoint.x,
        upperPoint.y,
        "reflection-guide"
      );

      circle(
        upperPoint.x,
        config.zero,
        config.crossingRadius,
        "reflection-crossing"
      );

      text(
        config.labels.reflection.x,
        config.labels.reflection.y,
        config.labels.reflection.text,
        "guide-label",
        config.labels.reflection.dx,
        config.labels.reflection.dy,
        config.labels.reflection.anchor
      );

      const drawVector = (point) => {
        line(
          config.zero,
          config.zero,
          point.x,
          point.y,
          "vector"
        );

        arrowHead(
          { x: point.x, y: point.y },
          { x: point.x, y: point.y },
          config.vectorHeadLength,
          config.vectorHeadHalfWidth,
          "vector-head"
        );

        const vectorLength = Math.hypot(point.x, point.y);
        const unitX = point.x / vectorLength;
        const unitY = point.y / vectorLength;
        const perpendicularX = -unitY;
        const perpendicularY = unitX;
        const markX = point.x * config.equalMarkAt;
        const markY = point.y * config.equalMarkAt;

        line(
          markX - perpendicularX * config.equalMarkHalf,
          markY - perpendicularY * config.equalMarkHalf,
          markX + perpendicularX * config.equalMarkHalf,
          markY + perpendicularY * config.equalMarkHalf,
          "equal-mark"
        );

        text(
          point.x * config.lengthLabelAt,
          point.y * config.lengthLabelAt,
          config.labels.length,
          "length-label",
          point.lengthDx,
          point.lengthDy,
          point.lengthAnchor
        );
      };

      for (const point of config.points) {
        drawVector(point);
      }

      circle(
        config.zero,
        config.zero,
        config.originRadius,
        "origin-point"
      );

      for (const point of config.points) {
        circle(
          point.x,
          point.y,
          config.dotRadius,
          "point"
        );

        text(
          point.x,
          point.y,
          point.label,
          "point-label",
          point.labelDx,
          point.labelDy,
          point.labelAnchor
        );
      }

      for (const label of [
        config.labels.real,
        config.labels.imaginary
      ]) {
        text(
          label.x,
          label.y,
          label.text,
          "axis-label",
          label.dx,
          label.dy,
          label.anchor
        );
      }

      text(
        config.labels.origin.x,
        config.labels.origin.y,
        config.labels.origin.text,
        "origin-label",
        config.labels.origin.dx,
        config.labels.origin.dy,
        config.labels.origin.anchor
      );

      canvas.removeAttribute("aria-hidden");
      fallback.hidden = true;
    } catch (error) {
      const canvas = document.getElementById("canvas");
      const fallback = document.getElementById("fallback");

      canvas.hidden = true;
      canvas.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
</body>
</html>
