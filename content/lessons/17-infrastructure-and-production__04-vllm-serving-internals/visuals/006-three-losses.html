<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три независимые потери на пути запроса</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#58657a;
  --line:#bac4d3;
  --loss:#fff0eb;
  --loss-strong:#c94f3d;
  --empty:#f3b7aa;
  --work:#75aef2;
  --work-dark:#3779c7;
  --solution:#e8f7f0;
  --solution-strong:#16805e;
  --page:#55b891;
  --prefill:#e99545;
  --decode:#6964cf;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111722;
    --panel:#192231;
    --ink:#edf3ff;
    --muted:#aebbd0;
    --line:#46536a;
    --loss:#38231f;
    --loss-strong:#ff8b76;
    --empty:#7e443c;
    --work:#417fca;
    --work-dark:#8bbfff;
    --solution:#17352d;
    --solution-strong:#72d7ae;
    --page:#46a982;
    --prefill:#d98438;
    --decode:#918bea;
  }
}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:18px;font-weight:bold}
svg{display:block;width:100%;height:auto;background:var(--bg)}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
.loss-zone{fill:var(--loss);stroke:var(--loss-strong);stroke-width:2}
.solution-zone{fill:var(--solution);stroke:var(--solution-strong);stroke-width:2}
.outline{fill:none;stroke:var(--line);stroke-width:2}
.fragment{fill:var(--loss-strong)}
.gap{fill:var(--panel);stroke:var(--loss-strong);stroke-width:2}
.empty{fill:var(--empty)}
.work{fill:var(--work)}
.work-dark{fill:var(--work-dark)}
.page{fill:var(--page)}
.prefill{fill:var(--prefill)}
.decode{fill:var(--decode)}
.loss-line{fill:none;stroke:var(--loss-strong);stroke-width:3;stroke-linecap:round}
.solution-line{fill:none;stroke:var(--solution-strong);stroke-width:3;stroke-linecap:round}
.grid-line{fill:none;stroke:var(--line);stroke-width:2}
.cross{fill:none;stroke:var(--loss-strong);stroke-width:3;stroke-linecap:round}
.arrow{fill:var(--solution-strong)}
.lane-title{fill:var(--ink);font-size:18px;font-weight:bold}
.loss-title{fill:var(--loss-strong);font-size:15px;font-weight:bold}
.solution-title{fill:var(--solution-strong);font-size:17px;font-weight:bold}
.label{fill:var(--ink);font-size:14px}
.muted{fill:var(--muted);font-size:13px}
.badge{fill:var(--loss-strong);font-size:16px;font-weight:bold}
.small{fill:var(--ink);font-size:12px}
</style>
</head>
<body>
<h1>Три независимые потери на пути запроса</h1>
<svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Три независимые потери эффективности LLM-сервера</title>
  <desc id="svg-desc">Три колонки сопоставляют потери KV-памяти, простаивающие слоты статического батча и остановку decode длинным prefill с решениями PagedAttention, continuous batching и chunked prefill.</desc>
</svg>
<p id="fallback" hidden>Схема должна была показать три независимые потери: 60–80 % KV-памяти исправляет PagedAttention, простаивающие слоты статического батча — continuous batching, а остановку decode длинным prefill на 800 мс — chunked prefill.</p>
<script>
const data=[
  {kind:"config",origin:{x:0,y:0},scale:{x:1,y:1},zero:0},

  ["r","panel",18,8,372,422,14],
  ["r","loss-zone",36,76,336,158,10],
  ["r","solution-zone",36,258,336,148,10],
  ["t","lane-title",204,38,0,0,"middle","Память GPU"],
  ["t","loss-title",204,66,0,0,"middle","Потеря KV-памяти"],
  ["r","outline",58,94,292,58,6],
  ["r","fragment",64,100,42,46,3],
  ["r","fragment",126,100,64,46,3],
  ["r","fragment",218,100,34,46,3],
  ["r","fragment",278,100,64,46,3],
  ["r","gap",106,100,20,46,3],
  ["r","gap",190,100,28,46,3],
  ["r","gap",252,100,26,46,3],
  ["t","muted",204,177,0,0,"middle","свободное место разрознено"],
  ["t","badge",204,207,0,0,"middle","60–80 % памяти недоступно"],
  ["l","solution-line",204,237,204,249],
  ["p","arrow",[[197,247],[211,247],[204,256]]],
  ["t","solution-title",204,286,0,0,"middle","PagedAttention"],
  ["r","outline",58,306,292,52,6],
  ["r","page",64,312,32,18,3],
  ["r","page",100,312,32,18,3],
  ["r","page",136,312,32,18,3],
  ["r","page",172,312,32,18,3],
  ["r","page",208,312,32,18,3],
  ["r","page",244,312,32,18,3],
  ["r","page",280,312,32,18,3],
  ["r","page",316,312,28,18,3],
  ["r","page",64,334,32,18,3],
  ["r","page",100,334,32,18,3],
  ["r","page",136,334,32,18,3],
  ["r","page",172,334,32,18,3],
  ["r","page",208,334,32,18,3],
  ["r","page",244,334,32,18,3],
  ["r","page",280,334,32,18,3],
  ["r","page",316,334,28,18,3],
  ["t","muted",204,382,0,0,"middle","страницы занимают подходящие участки"],

  ["r","panel",414,8,372,422,14],
  ["r","loss-zone",432,76,336,158,10],
  ["r","solution-zone",432,258,336,148,10],
  ["t","lane-title",600,38,0,0,"middle","Слоты батча"],
  ["t","loss-title",600,66,0,0,"middle","Потеря времени слотов"],
  ["r","outline",456,94,288,84,5],
  ["l","grid-line",456,122,744,122],
  ["l","grid-line",456,150,744,150],
  ["r","work",462,100,132,16,2],
  ["r","empty",594,100,144,16,2],
  ["r","work",462,128,220,16,2],
  ["r","empty",682,128,56,16,2],
  ["r","work",462,156,82,16,2],
  ["r","empty",544,156,194,16,2],
  ["l","cross",618,102,630,114],
  ["l","cross",630,102,618,114],
  ["l","cross",698,130,710,142],
  ["l","cross",710,130,698,142],
  ["l","cross",564,158,576,170],
  ["l","cross",576,158,564,170],
  ["t","muted",600,201,0,0,"middle","готовые запросы всё ещё держат места"],
  ["l","solution-line",600,237,600,249],
  ["p","arrow",[[593,247],[607,247],[600,256]]],
  ["t","solution-title",600,286,0,0,"middle","Continuous batching"],
  ["r","outline",456,306,288,62,5],
  ["l","grid-line",456,337,744,337],
  ["r","work",462,312,78,19,2],
  ["r","work-dark",540,312,92,19,2],
  ["r","work",632,312,106,19,2],
  ["r","work-dark",462,343,112,19,2],
  ["r","work",574,343,70,19,2],
  ["r","work-dark",644,343,94,19,2],
  ["l","solution-line",540,307,540,332],
  ["l","solution-line",574,338,574,363],
  ["t","muted",600,389,0,0,"middle","освободившийся слот сразу получает запрос"],

  ["r","panel",810,8,372,422,14],
  ["r","loss-zone",828,76,336,158,10],
  ["r","solution-zone",828,258,336,148,10],
  ["t","lane-title",996,38,0,0,"middle","Время GPU"],
  ["t","loss-title",996,66,0,0,"middle","Пауза в decode"],
  ["t","small",852,105,0,0,"start","prefill"],
  ["r","prefill",852,114,210,44,5],
  ["t","badge",957,142,0,0,"middle","800 мс"],
  ["l","loss-line",852,184,1062,184],
  ["c","decode",1072,184,6],
  ["c","decode",1092,184,6],
  ["c","decode",1112,184,6],
  ["t","muted",996,211,0,0,"middle","начатые ответы ждут следующего токена"],
  ["l","solution-line",996,237,996,249],
  ["p","arrow",[[989,247],[1003,247],[996,256]]],
  ["t","solution-title",996,286,0,0,"middle","Chunked prefill"],
  ["l","grid-line",852,342,1140,342],
  ["r","prefill",852,316,48,36,4],
  ["c","decode",912,342,7],
  ["c","decode",932,342,7],
  ["r","prefill",946,316,48,36,4],
  ["c","decode",1006,342,7],
  ["c","decode",1026,342,7],
  ["r","prefill",1040,316,48,36,4],
  ["c","decode",1100,342,7],
  ["c","decode",1120,342,7],
  ["t","small",876,308,0,0,"middle","порция"],
  ["t","small",970,308,0,0,"middle","порция"],
  ["t","small",1064,308,0,0,"middle","порция"],
  ["t","muted",996,382,0,0,"middle","порции prefill чередуются с decode"]
];

const cfg=data.find(item=>item.kind==="config");
const origin=cfg.origin;
const scale=cfg.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const namespace=svg.namespaceURI;
  const make=(name,attributes,text)=>{
    const node=document.createElementNS(namespace,name);
    for(const [key,value] of Object.entries(attributes)) node.setAttribute(key,value);
    if(text!==undefined) node.textContent=text;
    return node;
  };

  for(const item of data){
    if(item.kind==="config") continue;
    const [type,cls,a,b,c,d,e,f]=item;

    if(type==="r"){
      svg.append(make("rect",{
        class:cls,
        x:sx(a),
        y:sy(b),
        width:sx(a+c)-sx(a),
        height:sy(b+d)-sy(b),
        rx:sx(e)-sx(cfg.zero),
        ry:sy(e)-sy(cfg.zero)
      }));
    }

    if(type==="l"){
      svg.append(make("line",{
        class:cls,
        x1:sx(a),
        y1:sy(b),
        x2:sx(c),
        y2:sy(d)
      }));
    }

    if(type==="c"){
      svg.append(make("circle",{
        class:cls,
        cx:sx(a),
        cy:sy(b),
        r:sx(c)-sx(cfg.zero)
      }));
    }

    if(type==="p"){
      svg.append(make("polygon",{
        class:cls,
        points:a.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" ")
      }));
    }

    if(type==="t"){
      svg.append(make("text",{
        class:cls,
        x:sx(a),
        y:sy(b),
        dx:sx(c)-sx(cfg.zero),
        dy:sy(d)-sy(cfg.zero),
        "text-anchor":e,
        "dominant-baseline":"middle"
      },f));
    }
  }
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
</body>
</html>
