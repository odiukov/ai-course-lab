- concept: объекты, созданные исполненным кодом, достаются из переданного в exec пространства имён по имени
  question: Сгенерированный код объявляет функцию `triple`. Verifier исполняет его и должен вызвать эту функцию. Заполните пропуск.
  explanation: '`exec` не возвращает объявленные объекты — он складывает их в переданный словарь. Поэтому проверяемая функция достаётся из этого словаря по своему имени, и только после вызова появляется фактический результат для сравнения с ожидаемым.'
  kind: cloze
  template: |-
    ns = {}
    exec(code, ns)
    fn = ns[___]
    actual = fn(7)
  answer: '"triple"'
  accept:
    - '''triple'''
    - '"triple"'
    - triple
  id: 026-verifier-run-1
  fingerprint: 7c051906
- concept: исключение при исполнении артефакта конвертируется в fail с описанием, а не роняет конвейер
  question: При вызове проверяемой функции вылетает `ZeroDivisionError`. Как должна повести себя `verifier_run`?
  explanation: 'Три исхода дают fail: код не исполнился, нужная функция не появилась в пространстве имён, вызов упал с исключением. Все они — результат проверки артефакта, поэтому verifier обязан вернуть отказ с описанием, оставив конвейер живым.'
  kind: choice
  options:
    - 'Вернуть fail с описанием ошибки: исключение — это исход проверки, а не аварийная остановка конвейера'
    - Пробросить исключение наверх, чтобы прогон остановился и ошибку увидел разработчик
    - 'Вернуть pass с пометкой «не проверено»: сравнение значений не состоялось'
    - Передать код critic, потому что причина падения видна по тексту
  correct: 0
  id: 026-verifier-run-2
