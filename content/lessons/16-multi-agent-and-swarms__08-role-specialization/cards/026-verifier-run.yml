- concept: вердикт определяется равенством значений, а не совпадением их строкового представления
  question: Ожидаемый результат — число 14. Функция вернула строку "14". Какой вердикт корректен?
  explanation: Verifier сравнивает сами значения, а не имена, типы или их строковое представление. Совпадение того, как результат выглядит при печати, — то же правдоподобие, от которого верификация как раз и должна защищать.
  kind: choice
  options:
    - 'fail: сравниваются значения, и `"14" == 14` ложно'
    - 'pass: напечатанный результат совпадает с ожидаемым'
    - 'pass: важен смысл значения, а не его тип'
    - Проверка неприменима, нужно переписать спецификацию
  correct: 0
  id: 026-verifier-run-3
  fingerprint: ad43cdc0
