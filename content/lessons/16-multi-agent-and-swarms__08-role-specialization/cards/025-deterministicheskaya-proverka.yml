- concept: успешное исполнение артефакта фиксирует только отсутствие исключения и само по себе не является вердиктом
  question: 'Verifier исполнил сгенерированный код в песочнице: интерпретатор не выдал ни одной ошибки, функция отработала и вернула число. Что отсюда следует о вердикте?'
  explanation: 'Исполнение и оценка — два разных этапа. Программа спокойно завершается и возвращает неверное значение: `return x + 2` вместо `return x * 2` не падает никогда. Проверка заканчивается только сопоставлением факта с заранее записанным ожиданием.'
  kind: choice
  options:
    - 'Пока ничего: отсутствие исключения — лишь факт запуска, вердикт появляется после сравнения полученного значения с ожидаемым'
    - 'Можно ставить pass: код исполнился без ошибок, значит соответствует спецификации'
    - Можно ставить pass, если возвращённое значение имеет тип, указанный в спецификации
    - Вердикт должен вынести critic, verifier только запускает код
  correct: 0
  id: 025-deterministicheskaya-proverka-1
  fingerprint: b13599b1
- concept: эталон сравнения берётся из спецификации до запуска, а не из наблюдённого результата
  question: Verifier вызывает проверяемую функцию, получает 21, записывает это значение как ожидаемое и затем сравнивает его с полученным. Вердикт — pass. В чём дефект такой проверки?
  explanation: Если эталон извлекать из прогона, проверка всегда даст pass и не отличит верный код от неверного. Ожидание — часть спецификации («для входа 3 ожидается 6»), оно фиксируется до исполнения и не зависит от того, что вернул артефакт.
  kind: choice
  options:
    - 'Ожидаемое значение обязано приходить из спецификации до запуска: выведенное из результата ожидание делает сравнение тождественно истинным'
    - 'Дефекта нет: verifier опирается на наблюдаемый факт запуска'
    - Нужно было сравнивать не значения, а типы возвращаемых объектов
    - Ожидаемое значение должен назначать critic после просмотра кода
  correct: 0
  id: 025-deterministicheskaya-proverka-2
  fingerprint: a57d1d92
- concept: детерминированная проверка идёт от эталона к исполнению, вызову и сравнению
  question: Расставьте действия verifier в порядке выполнения.
  explanation: 'Эталон первым: без него нечего сравнивать. Затем исполнение даёт объекты, вызов — факт, и только сравнение факта с ожиданием превращает запуск в проверку. Ответ verifier содержит вход, ожидание и полученное значение, чтобы вердикт можно было перепроверить.'
  kind: order
  items:
    - Взять из спецификации тестовый вход и ожидаемое значение
    - Исполнить строку сгенерированного кода в отдельном пространстве имён
    - Вызвать полученную функцию на тестовом входе и запомнить фактический результат
    - Сравнить фактический результат с ожидаемым и выдать pass или fail
  id: 025-deterministicheskaya-proverka-3
  fingerprint: 5b0c34e2
