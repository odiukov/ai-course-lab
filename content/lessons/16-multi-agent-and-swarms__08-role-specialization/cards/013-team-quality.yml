- concept: среднее по пустому набору не определено, поэтому агрегат задаёт нейтральный результат отдельной веткой
  question: Объясни своими словами, почему функция среднего качества покрытия обязана отдельно обрабатывать пустой список задач и что она должна вернуть.
  explanation: 'Граничный случай решается на уровне агрегата: нулевой знаменатель — не редкая аномалия, а нормальное состояние пустого бэклога.'
  kind: open
  reference: 'Среднее — это сумма, делённая на количество элементов. При пустом списке количество равно нулю, и деление не определено, поэтому общая формула даёт ошибку времени выполнения. Функция возвращает нейтральное нулевое значение: команда пока не покрывает ни одной задачи, значит и качества покрытия нет. Возвращается число того же типа, что и для непустого случая, иначе вызывающий код придётся ветвить у каждого использования.'
