- concept: соответствие считается внутри пары «задача — назначенная ей роль», а не по совпадению позиций в двух списках
  question: Метрика качества команды получает список задач и результат распределения. Списки одинаковой длины. Что обязательно должно выполняться при подсчёте?
  explanation: Одна роль может получить несколько задач, а другая — ни одной, поэтому позиция в списке ролей не совпадает с позицией задачи. Разрыв пары даёт число, не связанное с реальным распределением.
  kind: choice
  options:
    - Каждая оценка считается для той задачи, которой роль реально назначена
    - Роли и задачи можно сопоставить по позиции, раз длины совпадают
    - Каждая роль оценивается по самой сложной задаче списка
