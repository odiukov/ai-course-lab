- concept: покрытие задачи определяется сравнением максимальной оценки с порогом, а не фактом наличия победителя
  question: Порог сильного соответствия — 0,8. Для задачи по миграции базы роли получили 0,55; 0,75 и 0,45. Какой вывод верен?
  explanation: Ранжирование и достаточность — разные вопросы. Максимум 0,75 отвечает «кто лучший», порог 0,8 отвечает «хватает ли квалификации». Победитель среди слабых кандидатов остаётся слабым кандидатом.
  kind: choice
  options:
    - 'Задача покрыта: роль с 0,75 выигрывает у остальных'
    - 'Задача не покрыта: лучшая оценка не достигает порога'
    - Задачу нужно отдать роли с 0,45, чтобы разгрузить сильных исполнителей
  correct: 1
  id: 014-proverka-sostava-1
  fingerprint: 54ea76f8
- concept: пробел покрытия — сигнал менять состав или дробить задачу, а не перераспределять имеющиеся роли
  question: Распределение показало задачу, у которой лучшая оценка ниже порога. Объясни своими словами, какие действия это оправдывает, а какие нет.
  explanation: Метрика покрытия ценна тем, что показывает дефицит компетенций в составе команды. Если реакция на неё — только перетасовка назначений, сигнал теряется.
  kind: open
  reference: 'Перестановка задач между существующими ролями пробел не закрывает: набор оценок остаётся тем же, меняется только кто именно получит слабое соответствие. Осмысленные действия — добавить в пул роль с недостающими навыками, разбить задачу на части, каждая из которых покрывается сильно, или снизить требования задачи, если они завышены. Понижать порог ради красивого отчёта нельзя: это скрывает пробел, а не устраняет его.'
  id: 014-proverka-sostava-2
  fingerprint: b22871d6
