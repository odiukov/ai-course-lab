- concept: соответствие роли задаче — взвешенная доля закрытых требований, нормированная на максимум
  question: 'Задача требует трёх навыков с весами важности: проверка источников — 15, работа с юридическими формулировками — 12, оформление таблиц — 6. Роль уверенно владеет проверкой источников и оформлением таблиц, юридическими формулировками — нет. Чему равно её соответствие задаче по шкале от 0 до 1?'
  explanation: 'Складываются веса закрытых требований: 15 + 6 = 21. Максимум для этой задачи 15 + 12 + 6 = 33. 21 / 33 ≈ 0,64. Нормировка нужна, чтобы число значило «доля закрытых взвешенных требований», а не «сколько баллов набралось».'
  kind: numeric
  answer: 0.64
  tolerance: 0.02
  id: 006-ocenka-kompetencii-1
  fingerprint: 9b031eaf
- concept: соответствие измеряется относительно требований конкретной задачи, а не абсолютной силы роли
  question: 'Роль A имеет высокие оценки по анализу данных и программированию и низкую по проверке фактов. Роль B — средние оценки везде, но высокую по проверке фактов. Задача: подтвердить утверждения в отчёте по первоисточникам. Какую роль выбрать и почему?'
  explanation: Измеряется попадание навыков в потребность, а не талант сам по себе. Сильное программирование не компенсирует неспособность проверить источник, поэтому одна и та же роль получает высокий балл на одной задаче и низкий на другой.
  kind: choice
  options:
    - 'Роль B: соответствие считается по весам требований задачи, а сильные навыки, которые задаче не нужны, баллов не добавляют'
    - 'Роль A: у неё выше суммарная оценка навыков, значит она справится и с проверкой фактов'
    - 'Любую: разница в отдельных навыках усредняется на длинной серии задач'
  correct: 0
