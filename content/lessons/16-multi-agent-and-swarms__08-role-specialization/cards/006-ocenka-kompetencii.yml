- concept: нормировка на максимум делает оценки соответствия сравнимыми между задачами разного веса
  question: Зачем сумму набранных баллов роли делить на максимально возможную сумму весов для этой задачи, вместо того чтобы сравнивать роли по сырым баллам?
  explanation: Нормировка отвязывает оценку от масштаба задачи. Значение 0,8 означает «закрыто примерно 80% взвешенных требований этой задачи», а не «роль на 80% хороша вообще».
  kind: open
  reference: 'Сырая сумма зависит от того, сколько требований у задачи и насколько они весомы: у задачи с пятью тяжёлыми требованиями сырые баллы будут выше, чем у задачи с двумя, даже если роль закрывает вторую задачу полностью, а первую наполовину. Деление на максимум переводит результат в общую шкале от 0 до 1, где значение читается как доля закрытых взвешенных требований. После этого можно сравнивать разные роли на одной задаче и одну роль на разных задачах, а также задавать единый порог допуска.'
  id: 006-ocenka-kompetencii-3
