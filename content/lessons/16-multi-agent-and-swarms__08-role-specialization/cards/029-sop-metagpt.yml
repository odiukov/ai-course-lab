- concept: предсказуемость даёт процедура, применённая к команде, а не индивидуальная сила ролей
  question: Как читать формулу Code = SOP(Team) и почему предсказуемость приписывается именно SOP, а не составу команды?
  explanation: 'Ключевой сдвиг: детерминированность вносится структурой процесса, а не качеством отдельных агентов. Один и тот же набор ролей без SOP даёт непредсказуемый результат.'
  kind: open
  reference: 'Team — набор специализированных ролей, SOP — заданная процедура: порядок действий и передач между ними. Код получается как результат применения процедуры к команде. Сама команда не решает, кто работает следующим и что кому отправляется, — это определено заранее. Поэтому предсказуемость создаёт не пять способных участников, а пять заранее состыкованных обязательств по входу и выходу: убери схему у любой роли, и следующая начнёт достраивать недостающее догадками, хотя каждый участник по-прежнему умеет свою работу.'
  id: 029-sop-metagpt-3
  fingerprint: 3cb4f5c7
