- concept: 'SOP состыковывает контракты: выход одной роли обязан быть допустимым входом следующей'
  question: У каждой роли уже есть контракт входа и выхода. Что добавляет к этому SOP?
  explanation: 'Контракт описывает одну роль изолированно. SOP отвечает за швы: он гарантирует, что дизайн, выданный архитектором, — валидный вход для нарезки задач. Так разовая передача артефакта превращается в повторяемый процесс.'
  kind: choice
  options:
    - 'Стыковку контрактов между ролями: выход предыдущей роли должен быть допустимым входом следующей, и порядок передач зафиксирован'
    - Более подробное описание обязанностей внутри каждой роли
    - Право роли выбирать, кому отправить результат, исходя из содержания артефакта
    - Дополнительную проверку качества артефактов на каждом шаге
