- concept: итог запуска определяет детерминированный вердикт, а accept оценивающей роли — только пропуск к проверке, не голос
  question: Запуск конвейера получил accept от LLM-критика и fail от детерминированной проверки. Каким должен быть итог запуска?
  explanation: Это не голосование. Правдоподобный, но неверный код штатно проходит субъективную оценку и падает на тесте — именно поэтому итог берётся у проверки, исполняющей артефакт, а accept работает как разрешение перейти к ней.
  kind: choice
  options:
    - 'fail: решает вердикт детерминированной проверки, accept лишь давал право её запустить'
    - 'pass: один из проверяющих артефакт принял'
    - 'Неопределённый: вердикты равноправны, голоса разделились'
    - pass, если критик уверен в своём accept, иначе fail
  correct: 0
  id: 035-run-pipeline-1
  fingerprint: 825b9cbb
- concept: запуск возвращает результаты этапов, чтобы место остановки было отличимо по вердикту
  question: Функция запуска конвейера возвращает наружу только финальный флаг pass/fail. Что при этом теряется?
  explanation: 'Флаг не различает fail «артефакт отклонён до исполнения» и fail «код исполнился и дал не то значение». Возврат результатов всех этапов вместе с итогом делает запуск диагностируемым: видно и решение, и точку, где движение прекратилось.'
  kind: choice
  options:
    - 'Не видно, где запуск остановился: отказ на оценке замысла и падение теста выглядят одинаково'
    - 'Теряется скорость: вычисление одного флага требует лишнего прохода по ролям'
    - Роли больше нельзя вызвать повторно на том же входе
    - 'Нарушается контракт проверяющей роли: она обязана возвращать флаг сама'
  correct: 0
  id: 035-run-pipeline-2
  fingerprint: ffbb750d
