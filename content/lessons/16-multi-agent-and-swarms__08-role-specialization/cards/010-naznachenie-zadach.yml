- concept: инвариантность назначений к перестановке задач — тест на раздачу по очереди
  question: Набор задач и набор ролей не менялся, но задачи подали на вход в другом порядке — и исполнители сменились. О чём это говорит?
  explanation: Если исполнитель зависит только от требований задачи, перестановка задач не должна ничего менять. Смена исполнителей выдаёт раздачу по кругу (задача i — роль i). Перестановка входа — дешёвая проверка, которая отличает подбор по соответствию от подбора по индексу.
  kind: choice
  options:
    - Назначение опирается на позицию задачи в списке, а не на её требования
    - Оценки соответствия посчитаны верно, но список ролей слишком короткий
    - 'Так и должно быть: очередь задач — часть требований задачи'
    - Роли исчерпались, поэтому поздним задачам достались остатки
  correct: 0
  id: 010-naznachenie-zadach-1
  fingerprint: f1b0f9ee
- concept: равномерность загрузки ролей — метрика распределения нагрузки, а не показатель качества подбора
  question: 'Распределение задач вышло неравномерным: одной роли досталось несколько задач, другой — ни одной. Каждый выбор сделан по максимальному соответствию. Как это трактовать?'
  explanation: Соответствие и загрузка — разные величины. Подбор по соответствию оптимизирует качество исполнения каждой задачи; если ограничение по пропускной способности реально существует, его вводят отдельно и явно, а не подменяют им критерий подбора.
  kind: choice
  options:
    - 'Это допустимо: равное число поручений говорит о балансе загрузки, а не о качестве подбора'
    - 'Это ошибка: каждая доступная роль обязана получить хотя бы одну задачу'
    - 'Это ошибка: роль нельзя назначать на вторую задачу, пока свободны другие роли'
    - Это допустимо только если у незанятой роли нулевая оценка на всех задачах
  correct: 0
  id: 010-naznachenie-zadach-2
