- concept: 'функция оценки чистая: не изменяет переданные описания роли и задачи'
  question: Объясни своими словами, почему функция оценки соответствия не должна дописывать недостающие навыки в словарь роли, даже если это удобнее, чем читать значение по умолчанию.
  explanation: Оценка соответствия вызывается многократно для разных пар «роль — задача». Любая мутация входа делает результат зависимым от истории вызовов, а не только от аргументов.
  kind: open
  reference: 'Запись в переданный словарь — побочный эффект: после вызова роль меняется. Дальнейшие оценки этой же роли на других задачах пойдут по изменённым данным, а повторный вызов на «тех же» данных даст другой результат. Пропадает воспроизводимость и возможность сравнивать роли между собой. Правильный вариант — читать отсутствующий навык как 0, не трогая вход; вход остаётся неизменным, функция остаётся чистой.'
  id: 007-competence-3
  fingerprint: 397fd3cb
