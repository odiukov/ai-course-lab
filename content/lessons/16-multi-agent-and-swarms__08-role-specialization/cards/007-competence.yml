- concept: навык, отсутствующий у роли, вносит нулевой вклад, а не прерывает расчёт
  question: 'Задача требует навыки с весами: анализ 0.5, проверка 0.3, статистика 0.2. У роли есть анализ на уровне 0.8, проверка на уровне 0.4, а также дизайн на уровне 0.9. Навыка «статистика» у роли нет. Чему равна оценка соответствия роли задаче?'
  explanation: 'Считаются только требования задачи: 0.5·0.8 + 0.3·0.4 + 0.2·0 = 0.52. Дизайн 0.9 в требования не входит и в сумму не попадает. Отсутствующий навык читается со значением по умолчанию 0, поэтому неполный набор навыков не ломает вычисление.'
  kind: numeric
  answer: 0.52
  tolerance: 0.01
  id: 007-competence-1
  fingerprint: 0a9b4b11
- concept: сумма взвешенных вкладов не зависит от порядка перебора требований
  question: Оценка соответствия накапливается циклом по требованиям задачи. Требования перечислили в другом порядке. Что произойдёт с результатом?
  explanation: Итог — сумма произведений «вес требования × уровень навыка». Перестановка слагаемых суммы ничего не меняет. Если тесты на перестановку падают, значит функция где-то зависит от порядка — например, прерывает цикл или перезаписывает аккумулятор вместо накопления.
  kind: choice
  options:
    - 'Результат не изменится: сложение вкладов коммутативно'
    - Результат вырастет, если самые тяжёлые требования идут первыми
    - Результат изменится из-за накопления ошибки округления в первом же слагаемом
    - Результат станет неопределённым, пока порядок не зафиксирован явно
  correct: 0
