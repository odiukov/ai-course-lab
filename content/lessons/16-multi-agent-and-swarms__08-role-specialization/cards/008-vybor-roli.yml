- concept: случайное разрешение ничьей ломает воспроизводимость запуска
  question: Две роли набрали одинаковую максимальную оценку соответствия. Система выбирает победителя случайно. Чем это в первую очередь вредит?
  explanation: 'При равенстве оценок сами оценки уже не различают кандидатов. Жребий делает прогон невоспроизводимым: отладка и сравнение версий системы теряют опору. Правило ничьей фиксируют заранее — например, порядок в утверждённом списке приоритетов.'
  kind: choice
  options:
    - Один и тот же вход даёт разные назначения, и нельзя понять, изменился ли результат из-за данных или из-за жребия
    - Случайный выбор всегда даёт роль с более низкой компетентностью
    - Оценки соответствия перестают быть сравнимыми между задачами
    - Ничья возникает чаще, потому что жребий сглаживает разницу оценок
  correct: 0
  id: 008-vybor-roli-1
  fingerprint: bbb19fb9
- concept: 'выбор роли — двухступенчатый критерий: сначала максимум оценки, затем заранее заданный приоритет'
  question: Расставь шаги детерминированного выбора роли под задачу.
  explanation: 'Приоритет — второй критерий, а не первый: он включается только среди уже равных лидеров, иначе список приоритетов подменил бы собой измерение соответствия. Такой порядок гарантирует, что один и тот же набор оценок всегда даёт один и тот же выбор.'
  kind: order
  items:
    - Посчитать оценку соответствия каждой доступной роли этой задаче
    - Найти максимальное значение оценки
    - Отобрать все роли, чья оценка равна максимуму
    - Из отобранных взять ту, что стоит раньше в фиксированном списке приоритетов
  id: 008-vybor-roli-2
  fingerprint: 3ebe84a6
