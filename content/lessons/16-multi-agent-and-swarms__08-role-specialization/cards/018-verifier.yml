- concept: дефект, проскочивший при pass, — дефект набора проверок, и чинится добавлением правила
  question: На проде всплыл дефект в артефакте, который ранее получил pass. Объясни своими словами, где здесь ошибка и что правильно изменить.
  explanation: Сила проверяющего не в широте суждения, а в жёсткой связке «правило — запуск — доказательство». Расширять надо правила; ослаблять порог, чтобы отчёт был зелёным, — прятать дефект.
  kind: open
  reference: 'Вердикт был верен для того набора правил, который существовал: проверка на этот дефект просто отсутствовала. Спорить с pass как с мнением бессмысленно — он воспроизводим на том же артефакте. Правильное действие: добавить проверку, воспроизводящую дефект, убедиться, что она даёт fail с доказательством на старом артефакте, и только потом чинить сам артефакт. Так набор правил растёт вместе с найденными классами ошибок.'
  id: 018-verifier-2
  fingerprint: 8fa50b7f
