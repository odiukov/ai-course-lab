- concept: дефект адресуется роли по признаку воспроизводимости на конкретном входе, а не по своей серьёзности
  question: По какому признаку дефект отправляют верификатору, а не критику?
  explanation: Разделяет не тяжесть и не тип файла, а способ установления факта. Если дефект проявляется на запуске с конкретным входом, он воспроизводим и уходит верификатору. Если требуется суждение — критику.
  kind: choice
  options:
    - Дефект серьёзнее и дороже в исправлении
    - 'Дефект можно воспроизвести: задать конкретный вход и получить наблюдаемый результат'
    - Дефект нашли позже остальных
    - Дефект относится к коду, а не к документации
  correct: 1
  id: 020-critic-ili-verifier-1
  fingerprint: 2c059276
- concept: для избыточной сложности и уместности решения нет детерминированного критерия, поэтому такие дефекты структурно недоступны верификатору
  question: Функция проходит весь набор тестов, но реализует задачу в два раза длиннее и запутаннее, чем нужно. Почему добавлением ещё одного теста этот дефект не поймать?
  explanation: 'Классы дефектов разные: верификатор ловит расхождение поведения с ожиданием, критик — расхождение решения с разумным замыслом. Ни один не заменяет другого.'
  kind: open
  reference: 'Верификатор выносит вердикт по заранее заданному предикату: подать вход, сравнить фактический результат с ожидаемым. «Слишком сложно», «неуместно для этой задачи», «трудно проследить логику» — оценки без объективного порога: нет входа, на котором такой дефект даёт наблюдаемое отличие от корректного поведения. Метрики вроде длины или вложенности можно померить, но их пороги произвольны и не отделяют оправданную сложность от лишней. Такое суждение выносит критик, читая артефакт вместе с замыслом.'
  id: 020-critic-ili-verifier-2
  fingerprint: 0db9a77e
