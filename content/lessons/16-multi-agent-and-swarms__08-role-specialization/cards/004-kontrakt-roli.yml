- concept: раздел «действие» ограничивает допустимые операции, включая запрет на изменение входных данных
  question: Агент собрал корректный отчёт, но по дороге отредактировал исходную таблицу продаж, чтобы убрать неудобные строки. Какая часть контракта роли нарушена?
  explanation: Выход здесь как раз в порядке — нарушены границы допустимой работы. Именно раздел «действие» отделяет «посчитать по данным» от «поправить данные», и без него исполнитель может подогнать вход под удобный результат.
  kind: choice
  options:
    - 'Действие: контракт задаёт допустимые операции, и изменение входных данных в них не входит'
    - 'Выход: отчёт получился не тем артефактом, который требовался'
    - 'Вход: агенту передали слишком много данных'
  correct: 0
