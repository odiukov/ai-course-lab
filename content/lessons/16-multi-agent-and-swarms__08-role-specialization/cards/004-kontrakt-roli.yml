  fingerprint: 4fb6a412
- concept: критерий завершения формулируется как наблюдаемый проверяемый признак, а не как намерение или усилие
  question: Роль собирает единый список сотрудников из кадровой системы, системы доступов и биллинга. Сформулируй для неё критерий завершения и объясни, почему формулировка «данные собраны аккуратно» не годится.
  explanation: Критерий завершения — то, по чему следующая роль или верификатор выносит принято/отклонено. Если признак нельзя наблюдать в самом артефакте, остановка становится решением исполнителя, а не свойством работы.
  kind: open
  reference: 'Годный критерий наблюдаем и проверяем извне: например, «в списке присутствует каждый идентификатор, встречающийся хотя бы в одном из трёх источников; дубликаты по идентификатору отсутствуют; для каждой записи заполнены обязательные поля; расхождения между источниками вынесены в отдельный список». «Собрано аккуратно» описывает намерение исполнителя, а не свойство артефакта: его нельзя проверить, по нему нельзя отклонить работу, и следующая роль получает обещание вместо принимаемого результата.'
  id: 004-kontrakt-roli-3
  fingerprint: 0a1f899e
