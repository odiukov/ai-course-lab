- concept: пустая коллекция задач — естественный граничный случай цикла, не требующий отдельной ветки
  question: На вход функции назначения подали пустую коллекцию задач и непустой список ролей. Каким должен быть результат?
  explanation: 'Результат строится по задачам, а не по ролям, поэтому нет задач — нет пар. Отдельная проверка на пустоту не нужна: цикл по пустой коллекции сам вернёт пустой аккумулятор. Специальная ветка тут добавила бы код, который нечем отличить от общего пути.'
  kind: choice
  options:
    - Пустой набор назначений — тело цикла ни разу не выполнится
    - Набор, где каждой роли сопоставлено None, чтобы структура осталась полной
    - 'Ошибка: назначать нечего, значит вход некорректен'
    - Набор с одной парой «пустая задача — роль с наивысшим приоритетом»
  correct: 0
