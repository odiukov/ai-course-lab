- concept: 'согласие одинаковых агентов не является независимой проверкой: их ошибки коррелированы'
  question: Несколько агентов с одним и тем же промптом, одним и тем же контекстом и одним и тем же набором инструментов независимо дали совпадающий ответ. Что даёт это совпадение?
  explanation: Независимость даёт не отдельный процесс, а отличие в данных, инструментах и способе рассуждения. При одинаковых входах и инструментах копии ошибаются в одних и тех же местах, и большинство просто закрепляет общую ошибку.
  kind: choice
  options:
    - 'Почти ничего: их ошибки коррелированы, поэтому общий слепой участок воспроизводится во всех ответах'
    - 'Сильное подтверждение: совпадение независимых источников снижает вероятность ошибки в разы'
    - Гарантию корректности, если ответов больше трёх и они получены отдельными вызовами
  correct: 0
  id: 001-odinakovye-agenty-1
  fingerprint: 045c3777
- concept: разногласие полезно только когда оно заземлено на другой источник данных или объективную проверку
  question: Почему разногласие между агентами повышает качество системы только тогда, когда у агентов разные входы, инструменты или права, а не просто разные случайные сэмплы?
  explanation: Ценность даёт не сам факт спора, а заземлённая коррекция. Критик с инструментами, которых нет у планировщика, и верификатор с объективным набором тестов вносят в систему то, чего в исходном контексте не было.
  kind: open
  reference: 'Разные сэмплы одной модели с одним контекстом дают параллельное угадывание: варианты расходятся в формулировках, но опираются на одни и те же данные и одну и ту же привычку рассуждения, поэтому спор нечем разрешить. Когда у участника есть другой вход (например, только артефакт вместо цели) или другой инструмент (раннер тестов, статический анализ, поиск по документации), его возражение опирается на внешний источник: у коррекции появляется заземление, и расхождение можно разрешить фактом, а не голосованием.'
  id: 001-odinakovye-agenty-2
