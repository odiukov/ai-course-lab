- concept: функция выбора делегирует подсчёт единственной функции оценки, а не дублирует её логику
  question: Функция выбора лучшей роли для задачи могла бы сама сравнивать навыки роли с требованиями задачи, но вместо этого вызывает отдельную функцию оценки competence(role, task). Объясни своими словами, почему повторный расчёт внутри функции выбора — это ошибка проектирования.
  explanation: 'Разделение ответственностей: competence считает, best_role сравнивает. Дублированная формула — источник рассогласования между отчётом об оценках и итоговым выбором.'
  kind: open
  reference: 'Расчёт соответствия должен иметь единственную реализацию. Если логику скопировать в функцию выбора, две функции начнут расходиться при первом же изменении правил (новый вес, новый навык, другая нормировка), и система будет одновременно утверждать, что роль набрала одну оценку и что победила другая. Делегирование даёт согласованность и одну точку правки и тестирования: выбор отвечает только за перебор и сравнение, оценка — только за число.'
  id: 009-best-role-1
  fingerprint: 45a88d0e
- concept: лидер и его оценка обновляются одной операцией, иначе возвращённая роль не соответствует максимуму
  question: Перебор ролей хранит лидера и его оценку в двух переменных. В теле условия реализация обновляет переменную с лучшей оценкой, но забывает обновить переменную с самой ролью. Роли перебираются в порядке с оценками 0.31, 0.87, 0.64. Какую роль вернёт такая функция?
  explanation: Переменная с ролью не менялась ни разу, поэтому вернётся начальный кандидат с 0.31, хотя переменная с лучшей оценкой честно доросла до 0.87. Ошибки не будет — код отработает молча и выдаст неверный ответ. Поэтому роль и её оценка должны обновляться одним присваиванием.
  kind: choice
  options:
    - Роль с оценкой 0.31 — ту, что была записана в лидеры при инициализации
    - Роль с оценкой 0.87 — обладателя максимума
    - Роль с оценкой 0.64 — последнюю просмотренную
    - 'Ничего не вернёт: рассинхронизация переменных вызовет ошибку выполнения'
  correct: 0
  id: 009-best-role-2
  fingerprint: aef37758
- concept: функция выбора возвращает сам объект роли, а не её числовую оценку
  question: Дополни возврат функции, которая выбирает подходящую роль для задачи.
  explanation: 'Вызывающему коду нужен исполнитель, а не метрика: работу отдают роли. Оценка — лишь служебное значение сравнения внутри цикла. Если вернуть best_score, вызывающая сторона получит число и не сможет назначить задачу.'
  kind: cloze
  template: |-
    def best_role(task, roles):
        best = roles[0]
        best_score = competence(best, task)
        for role in roles[1:]:
            score = competence(role, task)
            if score > best_score:
                best, best_score = role, score
        return ___
  answer: best
  accept:
    - best
    - best_role_found
    - 'best  # сама роль'
  id: 009-best-role-3
  fingerprint: c4a8f0cc
