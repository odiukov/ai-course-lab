- concept: 'маршрут работы по конвейеру ролей: цель, артефакт, вердикт'
  question: Расставь работу канонического конвейера ролей в порядке прохождения.
  explanation: 'Направление внимания меняется на каждом шаге: намерение раскладывается в шаги, один шаг воплощается в артефакт, артефакт оценивается. Право записи есть только у executor, поэтому проверяющие получают именно то, что было сделано.'
  kind: order
  items:
    - Planner читает цель и выдаёт структурированный план или спецификацию шагов
    - Executor берёт один шаг плана и с помощью рабочих инструментов создаёт артефакт
    - 'Проверяющие роли получают готовый артефакт и выдают вердикт: обоснованное принято/отклонено и pass/fail с доказательством'
