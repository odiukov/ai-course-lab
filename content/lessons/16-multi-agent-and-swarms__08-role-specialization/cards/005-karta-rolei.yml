  fingerprint: 19e9785a
- concept: critic сверяет артефакт с замыслом, verifier читает только артефакт
  question: Чем различаются входы critic и verifier?
  explanation: 'Ответ на вопрос «соответствует ли сделанное задуманному» требует доступа к замыслу, поэтому critic читает и артефакт, и спецификацию. Verifier отвечает на вопрос факта: он запускает раннер тестов, тайпчекер или валидатор схемы на самом артефакте, и замысел ему для этого не нужен.'
  kind: choice
  options:
    - Critic получает артефакт вместе с замыслом планировщика и сверяет одно с другим, verifier получает только артефакт и прогоняет по нему заранее заданные проверки
    - Critic получает исходную цель, а verifier — план по шагам
    - Оба получают одинаковый вход, различаются только форматом ответа
  correct: 0
