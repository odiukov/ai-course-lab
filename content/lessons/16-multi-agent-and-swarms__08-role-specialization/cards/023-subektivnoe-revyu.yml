- concept: комментарий описывает намерение автора и не исполняется, поэтому не является свидетельством о поведении артефакта
  question: Функция снабжена комментарием «учитывает все граничные случаи», и critic ставит accept. Объясни своими словами, почему такой комментарий не может служить основанием для положительного вердикта.
  explanation: 'Ключ — комментарий не исполняется. Он повышает доверие критика ровно потому, что выглядит как знание автора о граничных случаях, но проверить это утверждение чтением нельзя: функция, обещающая «граничные случаи», может на 400 и 15% возвращать 385 вместо 340.'
  kind: open
  reference: 'Комментарий — это утверждение автора о намерении, а не часть вычисления: он не исполняется и никак не влияет на возвращаемое значение. Critic, читая его, достраивает намерение и подменяет трудный вопрос «что функция вернёт на входе X» лёгким «похоже ли это на добросовестное решение». Свидетельством о поведении может быть только выполнение кода на конкретных данных и сравнение результата с ожидаемым — это работа верификатора, а не чтение. Более того, правдоподобный комментарий активно вреден: он маскирует расхождение между заявленным и фактическим поведением.'
  id: 023-subektivnoe-revyu-2
  fingerprint: fc60b756
