- concept: вердикт критика ценен обоснованием, связывающим нарушенное требование с конкретным свойством артефакта
  question: Критик отклоняет присланный текст рассылки. Какой из ответов пригоден для работы?
  explanation: Обоснование должно назвать требование и указать место в артефакте, которое ему противоречит. Без этой связки исполнитель не знает, что менять, и цикл «сделал — отклонили» не сходится, а мнение критика становится неотличимым от произвола.
  kind: choice
  options:
    - '«Отклонено: общее впечатление слабое»'
    - '«Отклонено: требовался нейтральный тон для корпоративных клиентов, а первые два абзаца построены на восклицаниях и обращении на “ты”»'
    - '«Отклонено: попробуй переписать и пришли снова»'
  correct: 1
  id: 017-critic-1
  fingerprint: c876dc00
- concept: 'положительный результат объективных проверок и приёмка критиком независимы: артефакт может быть исправным и при этом не тем'
  question: 'Экспортированный отчёт проходит все автоматические проверки: схема валидна, типы верны, тесты зелёные. Критик всё равно отклоняет его. Возможно ли это?'
  explanation: Проверки отвечают на вопрос «работает ли», критик — на вопрос «то ли мы сделали». Требование, не выраженное исполнимым правилом, зелёными тестами не ловится, поэтому вердикты не заменяют друг друга.
  kind: choice
  options:
    - Нет, зелёные проверки означают приёмку — критику нечего добавить
    - 'Да: проверки подтверждают исправность, а критик оценивает соответствие замыслу — например, отчёт собран по кварталу вместо запрошенного месяца'
    - Нет, это конфликт вердиктов, и его решают повторным запуском проверок
  correct: 1
  id: 017-critic-2
  fingerprint: 3a49c5e9
