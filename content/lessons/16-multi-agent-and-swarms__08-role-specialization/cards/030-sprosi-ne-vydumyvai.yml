- concept: адресность запроса привязывает ответ к полномочиям роли и сохраняет происхождение решения
  question: Почему вопрос о недостающей детали задают конкретной роли по имени, а не в общий канал команды?
  explanation: Вопрос «кто-нибудь знает цвет?» оставляет ответственность размытой — ответить может роль, которая сама угадывает. Адресное обращение сохраняет и понятную передачу артефакта, и прослеживаемое происхождение решения.
  kind: choice
  options:
    - 'Имя связывает вопрос с полномочиями роли по её контракту: ответ приходит от владельца решения, а не от того, кто тоже предполагает'
    - Так сообщение быстрее доставляется и экономится один вызов модели
    - Общий канал перегружает контекст остальных ролей лишними токенами
    - Только именованный адресат обязан отвечать, остальные могут промолчать
