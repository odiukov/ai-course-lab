- concept: модель по умолчанию заполняет пробел наиболее вероятным значением, поэтому остановку задают правилом в промпте
  question: Что делает модель по умолчанию, столкнувшись с пробелом в спецификации, и что меняет добавленное правило?
  explanation: 'Модель без такого правила практически никогда не говорит «я не знаю» — она дописывает недостающее наиболее вероятным вариантом, и результат выглядит убедительно. Одно предложение в промпте меняет режим: цена вопроса — один вызов, цена выдумки — весь артефакт.'
  kind: choice
  options:
    - По умолчанию она достраивает пробел самым правдоподобным значением; правило переводит поведение с «догадаюсь» на «спрошу»
    - По умолчанию она возвращает ошибку; правило учит её продолжать работу без остановки
    - По умолчанию она копирует деталь из предыдущего артефакта; правило запрещает переиспользование
    - По умолчанию она отдаёт решение критику; правило переносит выбор обратно на исполнителя
