- concept: прослеживаемость конвейера обеспечивается тем, что вместе с артефактом хранятся задание, идентификатор версии и доказательство проверки
  question: 'Через месяц после сдачи возникает спор: почему модуль устроен именно так и на каком основании его признали готовым. Какие сведения должны были остаться сохранены рядом с артефактом, чтобы ответить, и зачем каждое из них?'
  explanation: Между ролями двигается объект и приложенные к нему свидетельства, а не статус. Задание, версия и доказательство — минимальный набор, по которому цепочку можно восстановить задним числом.
  kind: open
  reference: 'Три вещи: (1) спецификация или задание, по которому артефакт создан — отвечает на вопрос «что требовалось»; (2) идентификатор версии артефакта — отвечает «что именно оценивали», иначе вердикты нельзя привязать к объекту; (3) доказательство объективной проверки, например отчёт раннера или валидатора, плюс обоснование вердикта критика — отвечает «чем подтверждён итог». Без этой связки остаётся только сообщение «готово», которое ничего не подтверждает и не позволяет восстановить цепочку.'
