- concept: конвейер обязан содержать хотя бы один узел, чей pass/fail вычисляет код, а не модель
  question: Конвейер собран из шести LLM-агентов с разными именами ролей; каждый читает результат и выносит своё суждение. Какое минимальное изменение переводит итог из «все согласились» в «проверено»?
  explanation: 'Классический режим сбоя MAST: все узлы — модели, все выходы сводятся к «выглядит нормально». Лечит не число голосов и не формулировка промпта, а один узел, где решение принимает код: запуск теста, тайпчекер, валидатор схемы.'
  kind: choice
  options:
    - Добавить седьмого агента с более строгим системным промптом
    - Добавить узел, чей вердикт pass/fail вычисляет детерминированная программа на артефакте
    - Запретить агентам видеть вердикты друг друга
    - Повысить температуру у части агентов ради разнообразия мнений
  correct: 1
  id: 021-generalist-antipattern-1
  fingerprint: c641c7cf
- concept: однотипность формулировок вердиктов — наблюдаемый симптом того, что специализация не задана
  question: Ты смотришь логи мультиагентной системы и хочешь понять, есть ли в ней реальная специализация ролей. Какой признак в выходах агентов сразу выдаёт её отсутствие и что нужно проверить дальше?
  explanation: 'Симптом видно в логах, причина — в конфигурации входов и инструментов. Ищут расхождение классов выходов: план, артефакт, обоснованный вердикт, pass/fail с доказательством — это разные объекты.'
  kind: open
  reference: 'Признак: выходы всех ролей однотипны по форме и содержанию — короткие оценочные суждения вида «выглядит корректно», «ошибок не вижу», без разных типов артефактов на выходе. Значит роли делают одно действие: оценивают по впечатлению. Дальше надо проверять не тексты промптов, а вход каждой роли (что она реально читает), её инструменты (чем может воздействовать на артефакт) и права (может ли писать). Если у всех вход и инструменты совпадают, имена ролей — просто ярлыки на одном generalist.'
  id: 021-generalist-antipattern-2
  fingerprint: fa3efc62
