- concept: accept на артефакте со скрытым багом — корректное поведение критика, если баг не обнаруживается чтением
  question: Реализация критика вернула accept артефакту, который позже провалил тест на граничном входе. Причина бага была не видна при чтении. Как это оценить?
  explanation: Ограниченность класса покрытия — свойство роли, а не баг. Критик отвечает за соответствие замыслу, ясность и оправданность сложности; дефекты, наблюдаемые только на выполнении, закрывает верификатор. Именно поэтому в конвейере держат обоих.
  kind: choice
  options:
    - 'Реализация критика ошибочна и требует починки: он обязан ловить такие баги'
    - 'Это ожидаемая граница роли: критик работает чтением, а баг проявляется только на запуске'
    - 'Реализация критика ошибочна: он должен был отправить артефакт на доработку из-за неопределённости'
    - Это дефект спецификации planner, а не критика
  correct: 1
  id: 024-critic-review-1
  fingerprint: 748e78f3
- concept: если критик начинает исполнять артефакт, он дублирует верификатор и конвейер теряет отдельный класс покрытия
  question: В реализацию критика предлагают добавить запуск артефакта и сравнение фактического результата с ожидаемым — «чтобы он ошибался реже». Что при этом ломается?
  explanation: Ценность пары ролей — в разных классах дефектов. Слияние их не повышает надёжность, а сокращает суммарное покрытие.
  kind: open
  reference: 'Критик перестаёт быть отдельной ролью: он начинает выносить тот же детерминированный вердикт, что и верификатор, на тех же данных. Конвейер получает два узла с одинаковым классом покрытия и теряет узел, отвечающий за суждение о ясности, уместности и соответствии замыслу — дефекты этого класса перестают ловиться вообще. Плюс исчезает независимость: расхождение между субъективной приёмкой и объективной проверкой было полезным сигналом, а теперь оба вердикта опираются на один и тот же запуск. Правильный ход — не расширять критика, а добавлять правила в набор проверок верификатора.'
  id: 024-critic-review-2
  fingerprint: a959ef27
