- concept: додуманная деталь превращается в неявное требование, с которым сверяются следующие роли
  question: Исполнителю не назвали имя таблицы в базе данных, и он выбрал самое правдоподобное. Объясни своими словами, почему такая подстановка опаснее, чем просто одна ошибка в артефакте.
  explanation: 'Выдуманная деталь не отличима от согласованной. Именно поэтому правило требует запросить её до выдачи артефакта: после выдачи она уже участвует в оценке как замысел.'
  kind: open
  reference: 'Подставленное значение нигде не помечено как догадка, поэтому дальше по конвейеру оно читается как часть замысла. Следующие роли сверяют артефакт с ним же: оценивающая роль считает его требованием, а проверяющая берёт его как эталон и подтверждает поведение, которого никто не заказывал. Ошибка перестаёт быть локальной — она становится неявным требованием, и найти её потом можно только вернувшись к владельцу спецификации, а не чтением артефакта.'
