- concept: переход между этапами разрешает оркестратор по вердикту, а роль не выбирает себе получателя
  question: Почему право передать артефакт дальше держит управляющий запуск, а не сама роль, которая только что закончила работу?
  explanation: 'Оркестратор ничего не производит: он хранит цель, спецификацию, текущую версию артефакта, замечания и доказательство проверки — и по вердикту решает, идёт версия дальше или возвращается на правку. Роль такой картины не видит, поэтому маршрутизировать себя не может.'
  kind: choice
  options:
    - Роль видит лишь свой вход и не знает вердиктов, поэтому правило перехода можно применить только там, где хранится состояние запуска
    - Роли технически не умеют вызывать друг друга в агентных фреймворках
    - 'Так дешевле: передача через оркестратор не требует дополнительного вызова модели'
    - Оркестратор выполняет часть работы ролей и потому лучше знает артефакт
  correct: 0
