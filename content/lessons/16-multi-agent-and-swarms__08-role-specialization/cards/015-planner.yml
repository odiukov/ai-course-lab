- concept: выход planner — структурированная спецификация шагов, его инструменты — поиск по знаниям и документация, а не рабочие инструменты записи
  question: Агенту в роли planner дана цель «выпустить релиз клиентской библиотеки». Что он обязан вернуть?
  explanation: Planner читает цель и документацию, а отдаёт план. Сборка пакета — работа исполнителя, вердикт — работа проверяющих ролей. Планировщик с правом собирать релиз перестаёт быть отдельной ролью.
  kind: choice
  options:
    - Собранный пакет библиотеки с проставленной версией
    - 'Список шагов со спецификацией: результат каждого шага, порядок и зависимости'
    - Вердикт «готово / не готово» по текущему состоянию репозитория
  correct: 1
  id: 015-planner-1
  fingerprint: f2b65ddb
- concept: полнота спецификации измеряется тем, что исполнителю не приходится доопределять результат шага
  question: Какой пункт плана указывает, что planner оставил часть цели неразобранной?
  explanation: 'Формулировка вида «заняться» не называет ни результата, ни признака завершения — решение о том, что создавать, откладывается на исполнителя. Спецификация ценна ровно тем, что снимает эти решения заранее: что дано, что получить, какие ограничения, когда шаг закрыт.'
  kind: choice
  options:
    - «Заняться вопросом совместимости»
    - «Составить таблицу поддерживаемых версий среды выполнения с датой окончания поддержки для каждой»
    - «Обновить файл миграции до схемы версии 3, не меняя существующие индексы»
  correct: 0
  id: 015-planner-2
  fingerprint: 36cb6730
