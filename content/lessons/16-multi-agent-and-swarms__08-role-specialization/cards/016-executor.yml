- concept: вход executor — ровно один шаг спецификации, а не цель целиком и не весь план
  question: План состоит из семи шагов. Что подаётся на вход агенту-исполнителю за один запуск?
  explanation: 'Один шаг задаёт границу работы: исполнителю не нужно заново решать, что делать первым, — это решение уже принято планировщиком. Отдав весь план сразу, вы возвращаете исполнителю функцию планирования и теряете специализацию.'
  kind: choice
  options:
    - Исходная цель, чтобы он сам выбрал порядок работы
    - Один шаг плана с его результатом и ограничениями
    - Все семь шагов сразу, чтобы сэкономить вызовы
  correct: 1
  id: 016-executor-1
  fingerprint: c89f1bc2
- concept: следующие роли конвейера читают объект, поэтому исполнитель обязан оставить изменённое состояние, а не отчёт о намерении
  question: 'Исполнитель вернул текст: «Поле “Телефон” следует добавить после поля “Email”, с валидацией формата». Объясни своими словами, почему этого недостаточно.'
  explanation: 'Отличие исполнителя от планировщика операционное: он меняет состояние, пусть и только внутри рабочей папки. Вернувшийся текст вместо артефакта означает, что шаг не выполнен.'
  kind: open
  reference: 'Это описание намерения, а не артефакт: состояние мира не изменилось, файл формы прежний. Роли, которые идут дальше, работают с объектом — проверяющий читает артефакт и запускает на нём проверки, а описанию плана предъявить нечего. Артефактом был бы обновлённый файл формы, запись в базе, созданная через API заявка — то, что можно передать дальше и изменить ещё раз. Ради этого исполнитель и получает рабочие инструменты и право записи.'
  id: 016-executor-2
  fingerprint: 24c26b75
