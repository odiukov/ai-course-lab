- concept: перенос роли между фреймворками проверяется совпадением контракта на одном входе, а не совпадением API
  question: Роль перенесли из одного агентного фреймворка в другой. Как убедиться, что перенесли роль, а не только её название?
  explanation: 'Переносимая часть — контракт: какой вход роль принимает, что делает, какой выход отдаёт и по какому наблюдаемому признаку останавливается. Если после миграции исполнитель начал планировать всю задачу или только обсуждать артефакт, совпадение имён и модели ничего не спасает.'
  kind: choice
  options:
    - Подать обеим реализациям один и тот же вход и сравнить тип возвращённого выхода и критерий остановки
    - Проверить, что класс агента в новом фреймворке называется так же
    - Сравнить длину и стиль промптов до и после переноса
    - Убедиться, что обе реализации вызывают одну и ту же модель
  correct: 0
