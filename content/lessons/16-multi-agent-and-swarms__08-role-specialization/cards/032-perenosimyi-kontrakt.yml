- concept: 'в CrewAI специализация задаётся тремя полями агента: role, goal, backstory'
  question: Дополни конструктор агента CrewAI — учебную поверхность специализации.
  explanation: 'В CrewAI специализация раскладывается по `role`, `goal` и `backstory`: кем агент выступает, чего должен добиться и из какого опыта действует. Это те же части контракта роли, просто записанные в поля конструктора.'
