- concept: константный вердикт не зависит от артефакта, поэтому не несёт о нём никакой информации
  question: Функция-агент игнорирует свой аргумент и всегда возвращает один и тот же положительный вердикт. Что известно об артефакте после её вызова?
  explanation: Вердикт, не зависящий от аргумента, одинаков для валидного и для испорченного артефакта. Такой выход подтверждает только факт вызова функции — наличие ответа, а не наличие проверки.
  kind: choice
  options:
    - Артефакт удовлетворяет хотя бы минимальным требованиям
    - 'Ничего: выход не зависит от входа, значит не различает артефакты'
    - Артефакт корректен с вероятностью, равной доле корректных артефактов на входе
    - Артефакт синтаксически валиден, иначе вызов упал бы
  correct: 1
  id: 022-generalist-1
  fingerprint: 1a2f7850
- concept: 'различающий тест роли: подать заведомо валидный и заведомо испорченный вход и сравнить вердикты'
  question: Тебе дали проверяющего агента и надо выяснить, действительно ли он проверяет артефакт, а не штампует одобрение. Какой эксперимент это показывает и как читать его результат?
  explanation: Проверяют не текст промпта роли, а её поведение на различающихся входах. Дифференциальный тест — самый дешёвый способ отделить проверку от имитации.
  kind: open
  reference: 'Подать два входа: заведомо корректный артефакт и заведомо испорченный (пустой, обрезанный, с внесённой ошибкой). Сравнить вердикты. Если они совпали — агент не различает эти входы, его выход не зависит от аргумента, это generalist со штампом. Если испорченный вход даёт отрицательный вердикт с указанием, что именно не так, — агент действительно читает артефакт. Совпадение вердиктов на явно разных входах — не случайность, а доказательство отсутствия проверки.'
  id: 022-generalist-2
  fingerprint: ffe286a0
