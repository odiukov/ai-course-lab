- concept: дублирование одинаковых агентов масштабирует пропускную способность линейно
  question: Один агент качественно обрабатывает 15 независимых заявок в час. В очереди 360 заявок, задачи не зависят друг от друга. Сколько часов уйдёт, если запустить 4 таких же агента параллельно?
  explanation: '15 × 4 = 60 заявок в час, 360 / 60 = 6 часов. Копии складывают пропускную способность, но доля ошибок в каждой заявке остаётся прежней: дублирование лечит объём, а не качество.'
  kind: numeric
  answer: 6
  tolerance: 0.1
  id: 002-potolok-kachestva-1
  fingerprint: 011bca1a
- concept: увеличение числа одинаковых агентов поднимает стоимость, но не потолок качества
  question: Система из трёх одинаковых агентов с голосованием даёт 62% верных ответов. Ты увеличиваешь их число до девяти, ничего больше не меняя. Что вероятнее всего произойдёт?
  explanation: Погасить голосованием можно только независимый шум. Систематическая ошибка, общая для всех копий, набирает большинство при любом числе голосующих — растёт лишь счёт за вызовы.
  kind: choice
  options:
