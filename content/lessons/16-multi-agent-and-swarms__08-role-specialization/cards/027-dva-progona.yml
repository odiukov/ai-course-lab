- concept: поведения двух реализаций сравнимы только на одном и том же проверочном входе
  question: Верный и неверный варианты кода прогнали каждый на своём тестовом входе и получили ожидаемые для этих входов значения. Почему такое сравнение ничего не доказывает?
  explanation: 'Verifier приносит не мнение, а факт, но факт привязан к конкретному входу. Сравнивают два поведения на одном проверочном примере: там верный код совпадает с ожиданием, а правдоподобный, но неверный — расходится.'
  kind: choice
  options:
    - 'Расхождение поведения видно только на общем входе: разные входы делают результаты несопоставимыми'
    - Потому что критик не участвовал в сравнении
    - Потому что верный код нужно прогонять на большем числе входов, чем неверный
    - Потому что оба прогона дали pass, а значит проверка избыточна
