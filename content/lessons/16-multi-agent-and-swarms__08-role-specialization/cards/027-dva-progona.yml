- concept: правильность операции задаётся спецификацией, а не типичностью или правдоподобностью конструкции
  question: Два артефакта одинаково аккуратны, у обоих осмысленное имя функции и привычная арифметическая операция. Что решает, какой из них верен?
  explanation: '`return x + 2` выглядит ровно так же «программно», как `return x * 2`. Внешний вид строки не содержит информации о требуемой операции — её задаёт спецификация, а различие проявляется только исполнением.'
  kind: choice
  options:
    - Ожидаемое поведение, зафиксированное в спецификации, и результат прогона на проверочном примере
    - Насколько привычна использованная операция для задач такого рода
    - 'Оценка critic: у него больше контекста о замысле'
    - Отсутствие синтаксических ошибок и понятность имён
