<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта различий ролей</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --grid: lightslategray;
      --header: lavender;
      --planner: aliceblue;
      --executor: honeydew;
      --critic: mistyrose;
      --verifier: lightcyan;
      --write: palegreen;
      --opinion: lavenderblush;
      --fact: azure;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frame {
      margin: unset;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    .static-title {
      margin: unset;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      background: var(--header);
      border-bottom: 1px solid var(--grid);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 490px;
      background: var(--panel);
      shape-rendering: geometricPrecision;
    }

    [hidden] {
      display: none;
    }

    .fallback {
      margin: unset;
      font-size: 16px;
      color: var(--ink);
      background: var(--panel);
    }

    .table-base {
      fill: var(--panel);
    }

    .header-fill {
      fill: var(--header);
    }

    .planner-fill {
      fill: var(--planner);
    }

    .executor-fill {
      fill: var(--executor);
    }

    .critic-fill {
      fill: var(--critic);
    }

    .verifier-fill {
      fill: var(--verifier);
    }

    .write-fill {
      fill: var(--write);
    }

    .opinion-fill {
      fill: var(--opinion);
    }

    .fact-fill {
      fill: var(--fact);
    }

    .grid-line,
    .outer-line,
    .accent-line {
      fill: none;
      stroke: var(--grid);
      vector-effect: non-scaling-stroke;
    }

    .grid-line {
      stroke-width: 1px;
    }

    .outer-line {
      stroke-width: 2px;
    }

    .accent-line {
      stroke-width: 3px;
    }

    text {
      fill: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .header-text {
      font-size: 15px;
      font-weight: bold;
    }

    .role-name {
      font-size: 16px;
      font-weight: bold;
    }

    .role-russian {
      font-size: 13px;
      fill: var(--muted);
    }

    .cell-main {
      font-size: 14px;
      font-weight: bold;
    }

    .cell-detail {
      font-size: 13px;
      fill: var(--muted);
    }

    .permission-yes {
      font-size: 15px;
      font-weight: bold;
    }

    .permission-no {
      font-size: 14px;
      font-weight: bold;
    }

    .note-title {
      font-size: 14px;
      font-weight: bold;
    }

    .note-detail {
      font-size: 13px;
      fill: var(--muted);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslategray;
        --ink: white;
        --muted: gainsboro;
        --grid: lightslategray;
        --header: darkslateblue;
        --planner: steelblue;
        --executor: darkgreen;
        --critic: darkred;
        --verifier: teal;
        --write: seagreen;
        --opinion: maroon;
        --fact: darkcyan;
      }
    }
  </style>
</head>
<body>
  <figure class="frame">
    <h1 class="static-title" id="diagram-heading">Карта различий: planner, executor, critic и verifier</h1>

    <svg id="diagram"
         viewBox="0 0 1200 470"
         width="1200"
         height="470"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-heading diagram-description">
      <title>Сравнение четырёх канонических ролей агента</title>
      <desc id="diagram-description">
        Таблица сопоставляет вход, инструменты, право записи и формат выхода
        для planner, executor, critic и verifier.
      </desc>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать таблицу из четырёх строк: planner читает цель
      и выдаёт план; executor читает один шаг, единственный имеет право записи
      и создаёт артефакт; critic читает артефакт вместе с замыслом и возвращает
      принято или отклонено с обоснованием; verifier запускает проверки и
      возвращает pass или fail с доказательством.
    </p>
  </figure>

  <script>
    const diagramData = [
      {
        kind: "layout",
        table: { x: 0, y: 0, w: 1148, h: 366 },
        header: { y: 0, h: 54, textY: 34 },
        columns: [
          { key: "role", label: "Роль", x: 0, w: 154, center: 77 },
          { key: "input", label: "Вход", x: 154, w: 248, center: 278 },
          { key: "tools", label: "Инструменты", x: 402, w: 314, center: 559 },
          { key: "write", label: "Право записи", x: 716, w: 132, center: 782 },
          { key: "output", label: "Формат выхода", x: 848, w: 300, center: 998 }
        ],
        verticals: [154, 402, 716, 848],
        horizontals: [54, 132, 210, 288],
        text: { padX: 12, firstY: 25, lineGap: 19 },
        role: { nameY: 31, russianY: 52 },
        notes: [
          {
            x: 0, y: 386, w: 565, h: 56,
            fill: "opinion-fill",
            line: "critic-fill",
            title: "CRITIC — обсуждаемое мнение",
            detail: "Сверяет решение с замыслом и объясняет оценку."
          },
          {
            x: 583, y: 386, w: 565, h: 56,
            fill: "fact-fill",
            line: "verifier-fill",
            title: "VERIFIER — проверяемый факт",
            detail: "Повторяет заданную проверку и предъявляет доказательство."
          }
        ],
        noteText: { x: 16, titleY: 23, detailY: 43 },
        noteAccent: { x: 0, y: 0, w: 7, h: 56 }
      },
      {
        kind: "row",
        role: "PLANNER",
        russian: "планировщик",
        y: 54,
        h: 78,
        fill: "planner-fill",
        cells: [
          {
            key: "input", x: 154,
            lines: [
              { text: "Цель", primary: true },
              { text: "«подготовить страницу регистрации»" }
            ]
          },
          {
            key: "tools", x: 402,
            lines: [
              { text: "Поиск по знаниям", primary: true },
              { text: "документация" }
            ]
          },
          {
            key: "write", x: 716,
            lines: [
              { text: "Нет", primary: true, permission: "no" },
              { text: "описывает шаги" }
            ]
          },
          {
            key: "output", x: 848,
            lines: [
              { text: "Структурированный план", primary: true },
              { text: "или спецификация" }
            ]
          }
        ]
      },
      {
        kind: "row",
        role: "EXECUTOR",
        russian: "исполнитель",
        y: 132,
        h: 78,
        fill: "executor-fill",
        highlight: { x: 716, y: 132, w: 132, h: 78, fill: "write-fill" },
        cells: [
          {
            key: "input", x: 154,
            lines: [
              { text: "Один шаг плана", primary: true },
              { text: "«сделать форму»" }
            ]
          },
          {
            key: "tools", x: 402,
            lines: [
              { text: "Рабочие инструменты", primary: true },
              { text: "компилятор · shell · клиент API" }
            ]
          },
          {
            key: "write", x: 716,
            lines: [
              { text: "Да", primary: true, permission: "yes" },
              { text: "создаёт и меняет" }
            ]
          },
          {
            key: "output", x: 848,
            lines: [
              { text: "Артефакт", primary: true },
              { text: "готовая форма" }
            ]
          }
        ]
      },
      {
        kind: "row",
        role: "CRITIC",
        russian: "критик",
        y: 210,
        h: 78,
        fill: "critic-fill",
        highlight: { x: 848, y: 210, w: 300, h: 78, fill: "opinion-fill" },
        cells: [
          {
            key: "input", x: 154,
            lines: [
              { text: "Артефакт + замысел", primary: true },
              { text: "результат executor и план planner" }
            ]
          },
          {
            key: "tools", x: 402,
            lines: [
              { text: "Артефакт только для чтения", primary: true },
              { text: "статический анализ" }
            ]
          },
          {
            key: "write", x: 716,
            lines: [
              { text: "Нет", primary: true, permission: "no" },
              { text: "ничего не меняет" }
            ]
          },
          {
            key: "output", x: 848,
            lines: [
              { text: "Принято / отклонено", primary: true },
              { text: "обоснованное мнение" }
            ]
          }
        ]
      },
      {
        kind: "row",
        role: "VERIFIER",
        russian: "верификатор",
        y: 288,
        h: 78,
        fill: "verifier-fill",
        highlight: { x: 848, y: 288, w: 300, h: 78, fill: "fact-fill" },
        cells: [
          {
            key: "input", x: 154,
            lines: [
              { text: "Артефакт", primary: true },
              { text: "готовый результат executor" }
            ]
          },
          {
            key: "tools", x: 402,
            lines: [
              { text: "Раннер тестов · тайпчекер", primary: true },
              { text: "валидатор схемы" }
            ]
          },
          {
            key: "write", x: 716,
            lines: [
              { text: "Нет", primary: true, permission: "no" },
              { text: "только запускает проверку" }
            ]
          },
          {
            key: "output", x: 848,
            lines: [
              { text: "pass / fail", primary: true },
              { text: "результат с доказательством" }
            ]
          }
        ]
      }
    ];

    const origin = Object.freeze({ x: 26, y: 14 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const layout = diagramData.find(item => item.kind === "layout");
      const rows = diagramData.filter(item => item.kind === "row");

      const node = (name, attributes, className, content) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        if (className) element.setAttribute("class", className);
        if (content) element.textContent = content;
        svg.appendChild(element);
        return element;
      };

      const rect = (box, className) => node("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y)
      }, className);

      const line = (x1, y1, x2, y2, className) => node("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2)
      }, className);

      const label = (x, y, content, className, anchor) => node("text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor
      }, className, content);

      rect(layout.table, "table-base");
      rect({
        x: layout.table.x,
        y: layout.header.y,
        w: layout.table.w,
        h: layout.header.h
      }, "header-fill");

      rows.forEach(row => {
        rect({
          x: layout.table.x,
          y: row.y,
          w: layout.columns.find(column => column.key === "role").w,
          h: row.h
        }, row.fill);

        if (row.highlight) rect(row.highlight, row.highlight.fill);
      });

      layout.verticals.forEach(x => {
        line(x, layout.table.y, x, layout.table.h, "grid-line");
      });

      layout.horizontals.forEach(y => {
        line(layout.table.x, y, layout.table.w, y, "grid-line");
      });

      rect(layout.table, "outer-line");

      layout.columns.forEach(column => {
        label(
          column.center,
          layout.header.textY,
          column.label,
          "header-text",
          "middle"
        );
      });

      rows.forEach(row => {
        label(
          layout.columns.find(column => column.key === "role").center,
          row.y + layout.role.nameY,
          row.role,
          "role-name",
          "middle"
        );

        label(
          layout.columns.find(column => column.key === "role").center,
          row.y + layout.role.russianY,
          row.russian,
          "role-russian",
          "middle"
        );

        row.cells.forEach(cell => {
          let currentY = row.y + layout.text.firstY;

          cell.lines.forEach(textLine => {
            let className = textLine.primary ? "cell-main" : "cell-detail";

            if (textLine.permission === "yes") {
              className = "permission-yes";
            }

            if (textLine.permission === "no") {
              className = "permission-no";
            }

            label(
              cell.x + layout.text.padX,
              currentY,
              textLine.text,
              className,
              "start"
            );

            currentY += layout.text.lineGap;
          });
        });
      });

      layout.notes.forEach(note => {
        rect(note, note.fill);

        rect({
          x: note.x + layout.noteAccent.x,
          y: note.y + layout.noteAccent.y,
          w: layout.noteAccent.w,
          h: layout.noteAccent.h
        }, note.line);

        label(
          note.x + layout.noteText.x,
          note.y + layout.noteText.titleY,
          note.title,
          "note-title",
          "start"
        );

        label(
          note.x + layout.noteText.x,
          note.y + layout.noteText.detailY,
          note.detail,
          "note-detail",
          "start"
        );
      });

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      svg.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
</body>
</html>
