<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Путь от волны к токенам и обратно</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --surface: #ffffff;
    --surface-soft: #edf1f8;
    --ink: #172033;
    --muted: #5b667c;
    --line: #66728a;
    --codec: #3478c5;
    --codec-soft: #dcecff;
    --token: #7456c8;
    --token-soft: #e9e1ff;
    --creative: #c74d72;
    --creative-soft: #ffe0ea;
    --wave: #16856d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111622;
      --surface: #1b2231;
      --surface-soft: #242d3e;
      --ink: #eef3ff;
      --muted: #b8c2d8;
      --line: #9aa7c1;
      --codec: #79b9ff;
      --codec-soft: #203b59;
      --token: #b7a0ff;
      --token-soft: #382f5b;
      --creative: #ff86a8;
      --creative-soft: #55283a;
      --wave: #60d6bb;
    }
  }

  html, body, main {
    background: var(--bg);
    color: var(--ink);
  }

  main {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  h1 {
    font-size: 24px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
    font-family: inherit;
    shape-rendering: geometricPrecision;
  }

  .panel {
    fill: var(--surface);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .codec-panel {
    fill: var(--codec-soft);
    stroke: var(--codec);
    stroke-width: 3px;
  }

  .rvq-panel {
    fill: var(--token-soft);
    stroke: var(--token);
    stroke-width: 3px;
  }

  .creative-panel {
    fill: var(--creative-soft);
    stroke: var(--creative);
    stroke-width: 4px;
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .flow-token {
    fill: none;
    stroke: var(--token);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .arrow {
    fill: var(--line);
  }

  .arrow-token {
    fill: var(--token);
  }

  .wave {
    fill: none;
    stroke: var(--wave);
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .token-cell {
    fill: var(--surface);
    stroke: var(--token);
    stroke-width: 1px;
  }

  .token-cell-new {
    fill: var(--creative);
    stroke: var(--creative);
    stroke-width: 1px;
  }

  .region-codec {
    fill: none;
    stroke: var(--codec);
    stroke-width: 2px;
  }

  .region-creative {
    fill: none;
    stroke: var(--creative);
    stroke-width: 3px;
  }

  text {
    fill: var(--ink);
    font-size: 15px;
  }

  .title {
    font-size: 18px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .number {
    font-size: 15px;
    font-weight: bold;
  }

  .creative-text {
    fill: var(--creative);
    font-size: 13px;
    font-weight: bold;
  }

  .region-label {
    font-size: 13px;
    font-weight: bold;
  }

  #fallback {
    font-size: 16px;
  }
</style>
</head>
<body>
<main>
  <h1>Путь от волны к генерируемым токенам и обратно</h1>
  <svg id="diagram" viewBox="0 0 1200 390" width="1200" height="390"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">От аудиоволны к токенам и обратно</title>
    <desc id="svg-desc">Двадцать четыре тысячи отсчётов в секунду проходят через свёрточный энкодер и восемь потоков RVQ. Генератор создаёт новые индексы, а декодер восстанавливает аудиоволну.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна была показать путь: 24 000 отсчётов в секунду → свёрточный энкодер → 8 потоков RVQ по 75 индексов в секунду → генератор новых индексов → декодер → аудиоволна.</p>
</main>

<script>
const DATA = [{
  zero: 0,
  origin: {x: 24, y: 18},
  scale: {x: 1, y: 1},
  background: {x: -24, y: -18, w: 1200, h: 390},
  corner: 12,
  arrow: {length: 14, half: 9},
  inputWave: [
    {x: 12, y: 154}, {x: 22, y: 154}, {x: 31, y: 142},
    {x: 40, y: 179}, {x: 49, y: 126}, {x: 58, y: 188},
    {x: 67, y: 136}, {x: 76, y: 172}, {x: 85, y: 146},
    {x: 94, y: 162}, {x: 103, y: 151}, {x: 112, y: 157},
    {x: 126, y: 154}
  ],
  outputWave: [
    {x: 1090, y: 154}, {x: 1098, y: 154}, {x: 1106, y: 139},
    {x: 1114, y: 181}, {x: 1122, y: 121}, {x: 1130, y: 190},
    {x: 1138, y: 133}, {x: 1146, y: 174}, {x: 1154, y: 144}
  ],
  panels: [
    {x: 172, y: 96, w: 146, h: 124, cls: "codec-panel"},
    {x: 365, y: 72, w: 226, h: 174, cls: "rvq-panel"},
    {x: 670, y: 88, w: 190, h: 142, cls: "creative-panel"},
    {x: 938, y: 96, w: 140, h: 124, cls: "codec-panel"}
  ],
  arrows: [
    {x1: 128, y1: 154, x2: 172, y2: 154, cls: "flow", head: "arrow"},
    {x1: 318, y1: 154, x2: 365, y2: 154, cls: "flow-token", head: "arrow-token"},
    {x1: 591, y1: 154, x2: 670, y2: 154, cls: "flow-token", head: "arrow-token"},
    {x1: 860, y1: 154, x2: 938, y2: 154, cls: "flow-token", head: "arrow-token"},
    {x1: 1078, y1: 154, x2: 1090, y2: 154, cls: "flow", head: "arrow"}
  ],
  text: [
    {x: 10, y: 49, value: "24 000 отсчётов в секунду", anchor: "start", cls: "number"},
    {x: 1154, y: 49, value: "аудиоволна", anchor: "end", cls: "number"},

    {x: 245, y: 132, value: "Свёрточный", anchor: "middle", cls: "title"},
    {x: 245, y: 156, value: "энкодер", anchor: "middle", cls: "title"},
    {x: 245, y: 191, value: "волна → векторы", anchor: "middle", cls: "small"},

    {x: 478, y: 101, value: "8 потоков RVQ", anchor: "middle", cls: "title"},
    {x: 478, y: 225, value: "по 75 индексов в секунду", anchor: "middle", cls: "small"},
    {x: 478, y: 267, value: "8 × 75 = 600 токенов в секунду", anchor: "middle", cls: "number"},

    {x: 765, y: 126, value: "Генератор", anchor: "middle", cls: "title"},
    {x: 765, y: 153, value: "предсказывает", anchor: "middle", cls: "small"},
    {x: 765, y: 175, value: "новые индексы", anchor: "middle", cls: "small"},
    {x: 765, y: 207, value: "ЗДЕСЬ ПОЯВЛЯЕТСЯ НОВОЕ", anchor: "middle", cls: "creative-text"},

    {x: 1008, y: 143, value: "Декодер", anchor: "middle", cls: "title"},
    {x: 1008, y: 178, value: "индексы → волна", anchor: "middle", cls: "small"}
  ],
  lanes: [
    {y: 115, label: "q₁"}, {y: 128, label: "q₂"},
    {y: 141, label: "q₃"}, {y: 154, label: "q₄"},
    {y: 167, label: "q₅"}, {y: 180, label: "q₆"},
    {y: 193, label: "q₇"}, {y: 206, label: "q₈"}
  ],
  token: {
    xs: [414, 440, 466, 492, 518, 544],
    w: 16, h: 8, r: 2, labelX: 399
  },
  regions: [
    {x1: 12, x2: 591, y: 294, tick: 10, labelX: 301, labelY: 326,
     label: "КОДЕК: звук → индексы", cls: "region-codec"},
    {x1: 648, x2: 882, y: 294, tick: 10, labelX: 765, labelY: 326,
     label: "ГЕНЕРАЦИЯ: новые токены", cls: "region-creative"},
    {x1: 916, x2: 1154, y: 294, tick: 10, labelX: 1035, labelY: 326,
     label: "КОДЕК: индексы → звук", cls: "region-codec"}
  ],
  note: {
    x: 583, y: 359,
    value: "Кодек переводит представления; генератор продолжает последовательность номеров."
  }
}];

const [D] = DATA;
const origin = Object.freeze({...D.origin});
const scale = Object.freeze({...D.scale});
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const NS = "http://www.w3.org/2000/svg";

  const node = (tag, attributes, value) => {
    const item = document.createElementNS(NS, tag);
    for (const [name, content] of Object.entries(attributes)) {
      item.setAttribute(name, content);
    }
    if (value !== undefined) item.textContent = value;
    return item;
  };

  svg.append(node("rect", {
    x: sx(D.background.x),
    y: sy(D.background.y),
    width: sx(D.background.x + D.background.w) - sx(D.background.x),
    height: sy(D.background.y + D.background.h) - sy(D.background.y),
    fill: "var(--bg)"
  }));

  for (const panel of D.panels) {
    svg.append(node("rect", {
      x: sx(panel.x),
      y: sy(panel.y),
      width: sx(panel.x + panel.w) - sx(panel.x),
      height: sy(panel.y + panel.h) - sy(panel.y),
      rx: sx(D.corner) - sx(D.zero),
      ry: sy(D.corner) - sy(D.zero),
      class: `panel ${panel.cls}`
    }));
  }

  const drawArrow = arrow => {
    svg.append(node("line", {
      x1: sx(arrow.x1), y1: sy(arrow.y1),
      x2: sx(arrow.x2), y2: sy(arrow.y2),
      class: arrow.cls
    }));
    svg.append(node("polygon", {
      points: [
        `${sx(arrow.x2)},${sy(arrow.y2)}`,
        `${sx(arrow.x2 - D.arrow.length)},${sy(arrow.y2 - D.arrow.half)}`,
        `${sx(arrow.x2 - D.arrow.length)},${sy(arrow.y2 + D.arrow.half)}`
      ].join(" "),
      class: arrow.head
    }));
  };

  for (const arrow of D.arrows) drawArrow(arrow);

  svg.append(node("polyline", {
    points: D.inputWave.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: "wave"
  }));

  svg.append(node("polyline", {
    points: D.outputWave.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: "wave"
  }));

  for (const lane of D.lanes) {
    svg.append(node("text", {
      x: sx(D.token.labelX),
      y: sy(lane.y),
      "text-anchor": "end",
      "dominant-baseline": "middle",
      class: "small"
    }, lane.label));

    for (const tokenX of D.token.xs) {
      svg.append(node("rect", {
        x: sx(tokenX),
        y: sy(lane.y - D.token.h / D.token.r),
        width: sx(tokenX + D.token.w) - sx(tokenX),
        height: sy(lane.y - D.token.h / D.token.r + D.token.h) -
                sy(lane.y - D.token.h / D.token.r),
        rx: sx(D.token.r) - sx(D.zero),
        ry: sy(D.token.r) - sy(D.zero),
        class: tokenX === D.token.xs.at(-D.scale.x) ? "token-cell-new" : "token-cell"
      }));
    }
  }

  for (const label of D.text) {
    svg.append(node("text", {
      x: sx(label.x),
      y: sy(label.y),
      "text-anchor": label.anchor,
      class: label.cls
    }, label.value));
  }

  for (const region of D.regions) {
    svg.append(node("line", {
      x1: sx(region.x1), y1: sy(region.y),
      x2: sx(region.x2), y2: sy(region.y),
      class: region.cls
    }));
    svg.append(node("line", {
      x1: sx(region.x1), y1: sy(region.y),
      x2: sx(region.x1), y2: sy(region.y + region.tick),
      class: region.cls
    }));
    svg.append(node("line", {
      x1: sx(region.x2), y1: sy(region.y),
      x2: sx(region.x2), y2: sy(region.y + region.tick),
      class: region.cls
    }));
    svg.append(node("text", {
      x: sx(region.labelX),
      y: sy(region.labelY),
      "text-anchor": "middle",
      class: "region-label"
    }, region.label));
  }

  svg.append(node("text", {
    x: sx(D.note.x),
    y: sy(D.note.y),
    "text-anchor": "middle",
    class: "small"
  }, D.note.value));

  fallback.hidden = true;
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (svg) svg.hidden = true;
  if (fallback) fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
