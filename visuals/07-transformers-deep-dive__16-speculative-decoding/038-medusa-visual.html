<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Головы Medusa</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5b6572;
    --trunk:#3a5ea8; --head:#1f7a5a; --far:#b3541e; --line:#8a94a3;
    --box:#eef2f8; --boxfar:#fbeee4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --fg:#e6eaef; --muted:#9aa5b3;
      --trunk:#7fa6e8; --head:#5fc8a0; --far:#f0a36a; --line:#5d6674;
      --box:#1e2630; --boxfar:#2e2620;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 10px 10px;}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .err{font-size:13px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Medusa: один ствол — четыре головы</h2>
  <div id="host"><svg id="d" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Ствол даёт h_t, от него четыре независимые головы на позиции t+1..t+4"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    var SVG="http://www.w3.org/2000/svg";
    var svg=document.getElementById("d");

    // ---- данные схемы ----
    var HEADS=[
      {id:"head_0", pos:"t+1", y:3,  far:false},
      {id:"head_1", pos:"t+2", y:1,  far:false},
      {id:"head_2", pos:"t+3", y:-1, far:true},
      {id:"head_3", pos:"t+4", y:-3, far:true}
    ];
    var TRUNK={x:0, y:0};      // ствол
    var HID={x:2.2, y:0};      // h_t
    var HEADX=5.0;             // колонка голов
    var OUTX=7.6;              // колонка выходных токенов

    // ---- ОДНА пара переводов ----
    var origin={x:120, y:190}, scale={x:88, y:44};
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    // литералы-пиксели: отступы подписей, толщины, кегль
    var PAD=10, LW=2, LWT=3, FS=13, FSS=12, FSB=14;

    function el(n,a){var e=document.createElementNS(SVG,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function add(n,a){var e=el(n,a);svg.appendChild(e);return e;}
    function txt(px,py,s,anchor,cls,size){
      var t=add("text",{x:px,y:py,"text-anchor":anchor||"middle",
        "font-size":size||FS,fill:cls||"var(--fg)","dominant-baseline":"middle"});
      t.textContent=s; return t;
    }
    function box(cx,cy,w,h,fill,stroke){
      return add("rect",{x:cx-w/2,y:cy-h/2,width:w,height:h,rx:8,
        fill:fill,stroke:stroke,"stroke-width":LW});
    }
    function line(x1,y1,x2,y2,stroke,w,dash){
      var a={x1:x1,y1:y1,x2:x2,y2:y2,stroke:stroke,"stroke-width":w||LW,"stroke-linecap":"round"};
      if(dash)a["stroke-dasharray"]=dash;
      return add("line",a);
    }
    function arrow(x1,y1,x2,y2,stroke,w){
      line(x1,y1,x2,y2,stroke,w);
      var ang=Math.atan2(y2-y1,x2-x1), L=11, S=0.42;
      add("polygon",{points:[
        x2,y2,
        x2-L*Math.cos(ang-S),y2-L*Math.sin(ang-S),
        x2-L*Math.cos(ang+S),y2-L*Math.sin(ang+S)].join(" "),fill:stroke});
    }

    // ---- ствол ----
    var tw=sx(1.3)-sx(0), th=sy(0)-sy(3.4);
    box(sx(TRUNK.x),sy(TRUNK.y),tw,th,"var(--box)","var(--trunk)");
    txt(sx(TRUNK.x),sy(0.55),"ствол","middle","var(--trunk)",FSB);
    txt(sx(TRUNK.x),sy(0.0),"verifier","middle","var(--trunk)",FSS);
    txt(sx(TRUNK.x),sy(-0.55),"десятки слоёв","middle","var(--muted)",FSS);
    txt(sx(TRUNK.x),sy(1.7)-PAD*1.6,"один прогон","middle","var(--muted)",FSS);

    // префикс -> ствол
    arrow(sx(-1.15),sy(0),sx(-0.72),sy(0),"var(--line)",LW);
    txt(sx(-1.2),sy(0),"префикс","end","var(--muted)",FSS);

    // ствол -> h_t
    arrow(sx(0.68),sy(0),sx(HID.x-0.42),sy(0),"var(--trunk)",LWT);

    // ---- h_t ----
    var hw=sx(0.78)-sx(0), hh=sy(0)-sy(0.62);
    box(sx(HID.x),sy(HID.y),hw,hh,"var(--box)","var(--trunk)");
    txt(sx(HID.x),sy(HID.y),"h\u209C","middle","var(--trunk)",FSB);
    txt(sx(HID.x),sy(-0.75)-PAD,"скрытое состояние","middle","var(--muted)",FSS);

    // ---- головы ----
    var bw=sx(1.5)-sx(0), bh=sy(0)-sy(0.62);
    var ow=sx(1.0)-sx(0);
    HEADS.forEach(function(h){
      var col=h.far?"var(--far)":"var(--head)";
      var fill=h.far?"var(--boxfar)":"var(--box)";
      var hy=sy(h.y);
      // h_t -> голова (все от одной точки, ветвление)
      arrow(sx(HID.x+0.42),sy(HID.y),sx(HEADX-0.78),hy,col,LW);
      box(sx(HEADX),hy,bw,bh,fill,col);
      txt(sx(HEADX),hy,h.id,"middle",col,FS);
      // голова -> позиция
      arrow(sx(HEADX+0.78),hy,sx(OUTX-0.52),hy,col,LW);
      box(sx(OUTX),hy,ow,bh,fill,col);
      txt(sx(OUTX),hy,h.pos,"middle",col,FS);
    });

    // подписи точности: справа от колонки выходов, каждая на своей строке
    var ACC=[
      {y:3,  s:"ближняя: чаще принимают"},
      {y:-3, s:"дальняя: доля принятия ниже"}
    ];
    txt(sx(OUTX+0.62),sy(3),ACC[0].s,"start","var(--head)",FSS);
    txt(sx(OUTX+0.62),sy(-3),ACC[1].s,"start","var(--far)",FSS);

    // вертикальная стрелка «чем дальше, тем слепее»
    var gx=sx(OUTX+0.55);
    line(gx,sy(2.5),gx,sy(-2.5),"var(--line)",LW,"4 4");
    arrow(gx,sy(2.5),gx,sy(-2.4),"var(--line)",LW);

    // ---- ключевая мысль: стрелок между головами нет ----
    var nx=sx(HEADX);
    line(sx(HEADX-0.42),sy(2.0),sx(HEADX+0.42),sy(2.0),"var(--line)",LW,"5 5");
    txt(nx,sy(2.35),"между головами стрелок нет — они параллельны","middle","var(--muted)",FSS);

    txt(sx(HEADX),sy(-3.9),"четыре умножения матриц, доли миллисекунды","middle","var(--muted)",FSS);
    txt(sx(HID.x),sy(-3.9),"head_3 не знает, что выпало на t+1..t+3","end","var(--far)",FSS);

  }catch(e){
    host.innerHTML='<p class="err">Схема не построилась. Она должна показывать: '+
      'общий ствол verifier перемалывает префикс и выдаёт одно скрытое состояние h\u209C; '+
      'от этого же h\u209C параллельно растут четыре головы — head_0 предсказывает токен в позиции t+1, '+
      'head_1 в t+2, head_2 в t+3, head_3 в t+4. Стрелок между головами нет: они не ждут друг друга. '+
      'Чем дальше голова смотрит, тем ниже её доля принятия — head_3 угадывает четвёртый токен, '+
      'не зная, что реально выпало на первых трёх.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
