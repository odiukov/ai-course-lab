<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пороговая лестница ASL</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --ink: #172033;
      --muted: #58647a;
      --line: #36445e;
      --step: #e7ebf2;
      --step-edge: #c8d0df;
      --accent: #c83757;
      --accent-soft: #f4ced8;
      --accent-ink: white;
      --note: #fff7e2;
      --note-line: #c58a18;
      --quiet: #8792a6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --ink: #eef2f8;
        --muted: #b5bfd0;
        --line: #aab5c8;
        --step: #263143;
        --step-edge: #46536a;
        --accent: #e75f7d;
        --accent-soft: #552638;
        --accent-ink: #fff8fa;
        --note: #30291c;
        --note-line: #e3ad46;
        --quiet: #79869b;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      background: var(--page);
    }

    h1 {
      margin: unset;
      padding: 11px 18px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--page);
    }

    .stair-body {
      fill: var(--step);
      stroke: var(--step-edge);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .step-band {
      fill: var(--step-edge);
    }

    .step-band.active {
      fill: var(--accent);
    }

    .stair-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .step-label {
      fill: var(--ink);
      font-size: 25px;
      font-weight: bold;
      text-anchor: middle;
    }

    .step-label.active {
      fill: var(--accent-ink);
    }

    .active-caption {
      fill: var(--accent-ink);
      font-size: 19px;
      font-weight: bold;
      text-anchor: middle;
    }

    .active-detail {
      fill: var(--accent-ink);
      font-size: 16px;
      text-anchor: middle;
    }

    .callout {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .callout-link {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .marker-halo {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .marker {
      fill: var(--accent);
      stroke: var(--page);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .top-note {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
      text-anchor: start;
    }

    .top-detail {
      fill: var(--muted);
      font-size: 15px;
      text-anchor: start;
    }

    .guide {
      fill: none;
      stroke: var(--quiet);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .guide.positive {
      stroke: var(--note-line);
      stroke-width: 3px;
    }

    .cross {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .guide-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    .guide-label.positive {
      fill: var(--ink);
    }

    .threshold-tag {
      fill: var(--note);
      stroke: var(--note-line);
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .threshold-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .fallback {
      margin: unset;
      padding: 24px;
      background: var(--page);
      color: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 id="diagram-title">Пороговая лестница ASL</h1>

    <svg
      id="diagram"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Пять качественных ступеней безопасности: ASL-1, ASL-2, ASL-3,
        ASL-4 и ASL-5+. Ступень ASL-3 выделена как включённая в мае 2025
        из-за CBRN-возможностей. Календарь сам по себе не перемещает маркер:
        режим меняется при пересечении порога возможностей.
      </desc>
      <g id="scene"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать лестницу ASL-1 — ASL-5+, где ASL-3
      включён в мае 2025 из-за CBRN-возможностей. Положение определяется
      пересечённым порогом, а не датой выпуска модели.
    </p>
  </main>

  <script>
    const diagramData = {
      map: [0, 0, 1, 1],
      body: [
        [100, 390],
        [100, 340],
        [300, 340],
        [300, 280],
        [490, 280],
        [490, 220],
        [680, 220],
        [680, 160],
        [870, 160],
        [870, 100],
        [1100, 100],
        [1100, 390]
      ],
      steps: [
        {
          label: "ASL-1",
          band: [[100, 340], [300, 340], [300, 390], [100, 390]],
          top: [[100, 340], [300, 340]],
          rise: [[100, 390], [100, 340]],
          text: [200, 374],
          active: false
        },
        {
          label: "ASL-2",
          band: [[300, 280], [490, 280], [490, 340], [300, 340]],
          top: [[300, 280], [490, 280]],
          rise: [[300, 340], [300, 280]],
          text: [395, 318],
          active: false
        },
        {
          label: "ASL-3",
          band: [[490, 220], [680, 220], [680, 280], [490, 280]],
          top: [[490, 220], [680, 220]],
          rise: [[490, 280], [490, 220]],
          text: [585, 258],
          active: true
        },
        {
          label: "ASL-4",
          band: [[680, 160], [870, 160], [870, 220], [680, 220]],
          top: [[680, 160], [870, 160]],
          rise: [[680, 220], [680, 160]],
          text: [775, 198],
          active: false
        },
        {
          label: "ASL-5+",
          band: [[870, 100], [1100, 100], [1100, 160], [870, 160]],
          top: [[870, 100], [1100, 100]],
          rise: [[870, 160], [870, 100]],
          text: [985, 138],
          active: false
        }
      ],
      finalEdges: [
        [[1100, 100], [1100, 390]],
        [[100, 390], [1100, 390]]
      ],
      callout: [
        [105, 48],
        [443, 48],
        [443, 135],
        [105, 135]
      ],
      calloutLink: [[443, 122], [565, 207]],
      calloutText: [
        ["ВКЛЮЧЁН В МАЕ 2025", 274, 83, "active-caption"],
        ["из-за CBRN-возможностей", 274, 112, "active-detail"]
      ],
      halo: [
        [585, 197],
        [608, 220],
        [585, 243],
        [562, 220]
      ],
      marker: [
        [585, 207],
        [598, 220],
        [585, 233],
        [572, 220]
      ],
      noteText: [
        ["Ступени — не равные интервалы", 725, 49, "top-note"],
        ["Это разные качественные условия", 725, 75, "top-detail"],
        ["«+» не обозначает окончательный потолок", 725, 101, "top-detail"]
      ],
      thresholdTag: [
        [516, 292],
        [654, 292],
        [654, 328],
        [516, 328]
      ],
      thresholdText: ["ПОРОГ", 585, 316],
      thresholdLink: [[585, 292], [585, 241]],
      calendar: {
        line: [[125, 426], [425, 426]],
        arrow: [[425, 426], [408, 416], [408, 436]],
        crossA: [[259, 412], [283, 436]],
        crossB: [[283, 412], [259, 436]],
        label: ["Календарь сам не двигает маркер", 275, 404]
      },
      capability: {
        line: [[716, 426], [1045, 426]],
        arrow: [[1045, 426], [1028, 416], [1028, 436]],
        label: ["Пересечение порога меняет режим", 880, 404]
      }
    };

    const origin = Object.freeze({
      x: diagramData.map.shift(),
      y: diagramData.map.shift()
    });

    const scale = Object.freeze({
      x: diagramData.map.shift(),
      y: diagramData.map.shift()
    });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svgNamespace = "http://www.w3.org/2000/svg";
      const scene = document.getElementById("scene");
      const fallback = document.getElementById("fallback");

      const create = (name, attributes, parent = scene) => {
        const element = document.createElementNS(svgNamespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        parent.appendChild(element);
        return element;
      };

      const polygon = (points, className, parent = scene) =>
        create(
          "polygon",
          {
            points: points
              .map(([x, y]) => `${sx(x)},${sy(y)}`)
              .join(" "),
            class: className
          },
          parent
        );

      const line = ([xStart, yStart], [xEnd, yEnd], className, parent = scene) =>
        create(
          "line",
          {
            x1: sx(xStart),
            y1: sy(yStart),
            x2: sx(xEnd),
            y2: sy(yEnd),
            class: className
          },
          parent
        );

      const text = (content, x, y, className, parent = scene) => {
        const label = create(
          "text",
          {
            x: sx(x),
            y: sy(y),
            class: className
          },
          parent
        );
        label.textContent = content;
        return label;
      };

      polygon(diagramData.body, "stair-body");

      diagramData.steps.forEach((step) => {
        polygon(
          step.band,
          step.active ? "step-band active" : "step-band"
        );
      });

      diagramData.steps.forEach((step) => {
        line(step.top[0], step.top[1], "stair-line");
        line(step.rise[0], step.rise[1], "stair-line");
      });

      diagramData.finalEdges.forEach(([start, end]) => {
        line(start, end, "stair-line");
      });

      diagramData.steps.forEach((step) => {
        text(
          step.label,
          step.text[0],
          step.text[1],
          step.active ? "step-label active" : "step-label"
        );
      });

      polygon(diagramData.callout, "callout");
      line(
        diagramData.calloutLink[0],
        diagramData.calloutLink[1],
        "callout-link"
      );

      diagramData.calloutText.forEach(([content, x, y, className]) => {
        text(content, x, y, className);
      });

      polygon(diagramData.halo, "marker-halo");
      polygon(diagramData.marker, "marker");

      diagramData.noteText.forEach(([content, x, y, className]) => {
        text(content, x, y, className);
      });

      polygon(diagramData.thresholdTag, "threshold-tag");
      line(
        diagramData.thresholdLink[0],
        diagramData.thresholdLink[1],
        "guide positive"
      );
      text(
        diagramData.thresholdText[0],
        diagramData.thresholdText[1],
        diagramData.thresholdText[2],
        "threshold-text"
      );

      line(
        diagramData.calendar.line[0],
        diagramData.calendar.line[1],
        "guide"
      );
      polygon(diagramData.calendar.arrow, "guide");
      line(
        diagramData.calendar.crossA[0],
        diagramData.calendar.crossA[1],
        "cross"
      );
      line(
        diagramData.calendar.crossB[0],
        diagramData.calendar.crossB[1],
        "cross"
      );
      text(
        diagramData.calendar.label[0],
        diagramData.calendar.label[1],
        diagramData.calendar.label[2],
        "guide-label"
      );

      line(
        diagramData.capability.line[0],
        diagramData.capability.line[1],
        "guide positive"
      );
      polygon(diagramData.capability.arrow, "guide positive");
      text(
        diagramData.capability.label[0],
        diagramData.capability.label[1],
        diagramData.capability.label[2],
        "guide-label positive"
      );

      fallback.hidden = true;
    } catch (error) {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      diagram.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
