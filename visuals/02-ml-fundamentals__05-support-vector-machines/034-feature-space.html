<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Нелинейная граница становится линейной</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --ink: #172033;
    --muted: #68748a;
    --axis: #526078;
    --guide: #9aa6b8;
    --inner: #e05263;
    --inner-stroke: #9f293a;
    --outer: #168c91;
    --outer-stroke: #08666a;
    --boundary: #9f293a;
    --plane-fill: #7967d733;
    --plane-stroke: #6653c7;
    --arrow: #705bd0;
    --panel: #ffffff;
    --shadow: #73809766;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  h1 {
    color: var(--ink);
    font-size: 20px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 1160px;
    height: 440px;
    max-width: 100%;
    max-height: 440px;
    background: var(--panel);
  }

  .axis {
    stroke: var(--axis);
    stroke-width: 1.7;
    fill: none;
  }

  .guide {
    stroke: var(--guide);
    stroke-width: 1.1;
    fill: none;
  }

  .stem {
    stroke: var(--shadow);
    stroke-width: 1.1;
    fill: none;
  }

  .boundary {
    stroke: var(--boundary);
    stroke-width: 2;
    fill: none;
  }

  .plane {
    stroke: var(--plane-stroke);
    stroke-width: 2;
    fill: var(--plane-fill);
  }

  .mapping {
    stroke: var(--arrow);
    stroke-width: 2.4;
    fill: none;
  }

  .arrowhead {
    fill: var(--arrow);
    stroke: var(--arrow);
    stroke-width: 1;
  }

  .inner-point {
    fill: var(--inner);
    stroke: var(--inner-stroke);
    stroke-width: 1.4;
  }

  .outer-point {
    fill: var(--outer);
    stroke: var(--outer-stroke);
    stroke-width: 1.4;
  }

  .shadow-point {
    fill: var(--shadow);
    stroke: var(--guide);
    stroke-width: 1;
  }

  .panel-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .label {
    fill: var(--ink);
    font-size: 14px;
  }

  .small-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .formula {
    fill: var(--arrow);
    font-size: 15px;
    font-weight: bold;
  }

  .axis-label {
    fill: var(--axis);
    font-size: 15px;
    font-style: italic;
  }

  #fallback {
    color: var(--ink);
    font-size: 15px;
  }

  [hidden] {
    display: none;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --ink: #edf2fb;
      --muted: #aab5c8;
      --axis: #a6b1c5;
      --guide: #718096;
      --inner: #ff7181;
      --inner-stroke: #ff9ba7;
      --outer: #39c4c7;
      --outer-stroke: #80e3e5;
      --boundary: #ff8b98;
      --plane-fill: #a895ff38;
      --plane-stroke: #b5a7ff;
      --arrow: #b5a7ff;
      --panel: #182132;
      --shadow: #a5b2c655;
    }
  }
</style>
</head>
<body>
<h1 id="diagram-title">Нелинейная граница становится линейной в новом пространстве</h1>

<svg id="diagram"
     width="1160"
     height="440"
     viewBox="0 0 1160 440"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="diagram-title diagram-description">
  <desc id="diagram-description">
    Слева центральный класс окружён кольцевым классом. Справа те же точки
    подняты на высоту x₁² + x₂² и разделены горизонтальной плоскостью.
  </desc>
</svg>

<p id="fallback" hidden>
  Схема должна была показать круговые классы на плоскости x₁, x₂ и те же
  точки после подъёма на высоту x₁² + x₂², где их разделяет горизонтальная
  плоскость.
</p>

<script>
const data = Object.freeze({
  canvas: { width: 1160, height: 440 },
  pointRadius: 0.115,
  shadowRadius: 0.075,
  boundaryRadius: 2.55,
  dash: "8 6",
  axes: {
    x: [{ x: -3.55, y: 0 }, { x: 3.75, y: 0 }],
    y: [{ x: 0, y: -2.75 }, { x: 0, y: 3.45 }]
  },
  mapping: {
    line: [{ x: 5.45, y: 0.35 }, { x: 8.85, y: 0.35 }],
    head: [
      { x: 8.85, y: 0.35 },
      { x: 8.35, y: 0.68 },
      { x: 8.35, y: 0.02 }
    ]
  },
  right: {
    origin: { x: 15.25, y: -1.35 },
    xBasis: { x: 1.02, y: 0.13 },
    yBasis: { x: -0.7, y: 0.1 },
    zBasis: { x: 0, y: 0.72 },
    xAxis: { x1: 3.35, x2: 0, z: 0 },
    yAxis: { x1: 0, x2: 3.35, z: 0 },
    zAxis: { x1: 0, x2: 0, z: 6.15 },
    planeLevel: 2,
    plane: [
      { x1: -2.8, x2: -2.8 },
      { x1: 2.8, x2: -2.8 },
      { x1: 2.8, x2: 2.8 },
      { x1: -2.8, x2: 2.8 }
    ]
  },
  points: [
    { x1: -0.45, x2: -0.2, kind: "inner" },
    { x1: 0.35, x2: 0.15, kind: "inner" },
    { x1: 0, x2: 0.5, kind: "inner" },
    { x1: -0.1, x2: -0.55, kind: "inner" },
    { x1: 0.55, x2: -0.35, kind: "inner" },
    { x1: -0.55, x2: 0.35, kind: "inner" },
    { x1: 0.25, x2: -0.55, kind: "inner" },
    { x1: -0.3, x2: 0.1, kind: "inner" },
    { x1: 2.2, x2: 0, kind: "outer" },
    { x1: 1.8, x2: 1.3, kind: "outer" },
    { x1: 0.7, x2: 2.1, kind: "outer" },
    { x1: -0.8, x2: 2, kind: "outer" },
    { x1: -1.9, x2: 1.15, kind: "outer" },
    { x1: -2.2, x2: -0.15, kind: "outer" },
    { x1: -1.65, x2: -1.4, kind: "outer" },
    { x1: -0.55, x2: -2.1, kind: "outer" },
    { x1: 0.9, x2: -2, kind: "outer" },
    { x1: 1.8, x2: -1.2, kind: "outer" },
    { x1: 2.05, x2: 0.65, kind: "outer" },
    { x1: 0.2, x2: -2.25, kind: "outer" }
  ],
  labels: {
    leftTitle: { x: 0, y: 5.05, dx: 0, dy: 0 },
    rightTitle: { x: 15.45, y: 5.05, dx: 0, dy: 0 },
    x1: { x: 3.75, y: 0, dx: 10, dy: 18 },
    x2: { x: 0, y: 3.45, dx: 10, dy: -6 },
    formula: { x: 7.15, y: 1.42, dx: 0, dy: 0 },
    boundaryAnchor: { x: -1.78, y: -1.82 },
    boundaryText: { x: -3.25, y: -2.72, dx: 0, dy: 0 },
    planeLeadStart: { x: 18.8, y: 0.55 },
    planeLeadEnd: { x: 20.25, y: 1.05 },
    planeText: { x: 21.15, y: 1.3, dx: 0, dy: 0 },
    rightX: { x: 18.67, y: -0.91, dx: 10, dy: 16 },
    rightY: { x: 12.9, y: -1.02, dx: -8, dy: 17 },
    rightZ: { x: 15.25, y: 3.08, dx: 10, dy: -5 },
    legendInnerDot: { x: -2.85, y: -3.18 },
    legendInnerText: { x: -2.62, y: -3.18, dx: 7, dy: 5 },
    legendOuterDot: { x: 0.55, y: -3.18 },
    legendOuterText: { x: 0.78, y: -3.18, dx: 7, dy: 5 }
  }
});
const origin = Object.freeze({ x: 190, y: 282 });
const scale = Object.freeze({ x: 43, y: 43 });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const NS = "http://www.w3.org/2000/svg";

  const el = (name, attributes, content) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attributes || {}).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    if (content) node.textContent = content;
    return node;
  };

  const addLine = (from, to, className) => {
    svg.appendChild(el("line", {
      x1: sx(from.x),
      y1: sy(from.y),
      x2: sx(to.x),
      y2: sy(to.y),
      class: className
    }));
  };

  const addText = (at, content, className, anchor) => {
    svg.appendChild(el("text", {
      x: sx(at.x),
      y: sy(at.y),
      dx: at.dx,
      dy: at.dy,
      class: className,
      "text-anchor": anchor
    }, content));
  };

  const projected = data.points.map(({ x1, x2, kind }) => {
    const z = x1 * x1 + x2 * x2;
    const base = {
      x: data.right.origin.x +
         x1 * data.right.xBasis.x +
         x2 * data.right.yBasis.x,
      y: data.right.origin.y +
         x1 * data.right.xBasis.y +
         x2 * data.right.yBasis.y
    };
    const top = {
      x: base.x + z * data.right.zBasis.x,
      y: base.y + z * data.right.zBasis.y
    };
    return { x1, x2, z, kind, base, top };
  });

  addText(data.labels.leftTitle, "Плоскость x₁, x₂", "panel-title", "middle");
  addText(data.labels.rightTitle, "Пространство с новой высотой", "panel-title", "middle");

  addLine(data.axes.x[0], data.axes.x[1], "axis");
  addLine(data.axes.y[0], data.axes.y[1], "axis");
  addText(data.labels.x1, "x₁", "axis-label", "start");
  addText(data.labels.x2, "x₂", "axis-label", "start");

  svg.appendChild(el("circle", {
    cx: sx(0),
    cy: sy(0),
    r: Math.abs(sx(data.boundaryRadius) - sx(0)),
    class: "boundary",
    "stroke-dasharray": data.dash
  }));

  data.points.forEach(({ x1, x2, kind }) => {
    svg.appendChild(el("circle", {
      cx: sx(x1),
      cy: sy(x2),
      r: Math.abs(sx(data.pointRadius) - sx(0)),
      class: kind === "inner" ? "inner-point" : "outer-point"
    }));
  });

  addLine(data.labels.boundaryAnchor, data.labels.boundaryText, "guide");
  addText(data.labels.boundaryText, "нужна круговая граница", "small-label", "start");

  addLine(data.mapping.line[0], data.mapping.line[1], "mapping");
  svg.appendChild(el("polygon", {
    points: data.mapping.head
      .map(({ x, y }) => `${sx(x)},${sy(y)}`)
      .join(" "),
    class: "arrowhead"
  }));
  addText(
    data.labels.formula,
    "φ: (x₁, x₂) ↦ (x₁, x₂, x₁² + x₂²)",
    "formula",
    "middle"
  );

  const rightOrigin = data.right.origin;
  const rightX = {
    x: rightOrigin.x +
       data.right.xAxis.x1 * data.right.xBasis.x,
    y: rightOrigin.y +
       data.right.xAxis.x1 * data.right.xBasis.y
  };
  const rightY = {
    x: rightOrigin.x +
       data.right.yAxis.x2 * data.right.yBasis.x,
    y: rightOrigin.y +
       data.right.yAxis.x2 * data.right.yBasis.y
  };
  const rightZ = {
    x: rightOrigin.x +
       data.right.zAxis.z * data.right.zBasis.x,
    y: rightOrigin.y +
       data.right.zAxis.z * data.right.zBasis.y
  };

  addLine(rightOrigin, rightX, "axis");
  addLine(rightOrigin, rightY, "axis");
  addLine(rightOrigin, rightZ, "axis");

  projected.forEach(({ base, top }) => {
    addLine(base, top, "stem");
    svg.appendChild(el("circle", {
      cx: sx(base.x),
      cy: sy(base.y),
      r: Math.abs(sx(data.shadowRadius) - sx(0)),
      class: "shadow-point"
    }));
  });

  const planeVertices = data.right.plane.map(({ x1, x2 }) => ({
    x: data.right.origin.x +
       x1 * data.right.xBasis.x +
       x2 * data.right.yBasis.x +
       data.right.planeLevel * data.right.zBasis.x,
    y: data.right.origin.y +
       x1 * data.right.xBasis.y +
       x2 * data.right.yBasis.y +
       data.right.planeLevel * data.right.zBasis.y
  }));

  svg.appendChild(el("polygon", {
    points: planeVertices
      .map(({ x, y }) => `${sx(x)},${sy(y)}`)
      .join(" "),
    class: "plane"
  }));

  projected.forEach(({ top, kind }) => {
    svg.appendChild(el("circle", {
      cx: sx(top.x),
      cy: sy(top.y),
      r: Math.abs(sx(data.pointRadius) - sx(0)),
      class: kind === "inner" ? "inner-point" : "outer-point"
    }));
  });

  addText(data.labels.rightX, "x₁", "axis-label", "start");
  addText(data.labels.rightY, "x₂", "axis-label", "end");
  addText(data.labels.rightZ, "x₁² + x₂²", "axis-label", "start");

  addLine(data.labels.planeLeadStart, data.labels.planeLeadEnd, "guide");
  const planeLabel = el("text", {
    x: sx(data.labels.planeText.x),
    y: sy(data.labels.planeText.y),
    dx: data.labels.planeText.dx,
    dy: data.labels.planeText.dy,
    class: "label",
    "text-anchor": "middle"
  });
  const planeLineOne = el("tspan", {
    x: sx(data.labels.planeText.x),
    dy: "-7"
  }, "горизонтальная");
  const planeLineTwo = el("tspan", {
    x: sx(data.labels.planeText.x),
    dy: "18"
  }, "разделяющая плоскость");
  planeLabel.append(planeLineOne, planeLineTwo);
  svg.appendChild(planeLabel);

  svg.appendChild(el("circle", {
    cx: sx(data.labels.legendInnerDot.x),
    cy: sy(data.labels.legendInnerDot.y),
    r: Math.abs(sx(data.pointRadius) - sx(0)),
    class: "inner-point"
  }));
  addText(
    data.labels.legendInnerText,
    "класс в центре",
    "small-label",
    "start"
  );

  svg.appendChild(el("circle", {
    cx: sx(data.labels.legendOuterDot.x),
    cy: sy(data.labels.legendOuterDot.y),
    r: Math.abs(sx(data.pointRadius) - sx(0)),
    class: "outer-point"
  }));
  addText(
    data.labels.legendOuterText,
    "класс-кольцо",
    "small-label",
    "start"
  );
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
