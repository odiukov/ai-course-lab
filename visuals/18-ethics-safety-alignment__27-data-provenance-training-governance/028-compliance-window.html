<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Окно комплаенса закрывается при обучении</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --ink: #172033;
      --muted: #526075;
      --panel: #ffffff;
      --before: #e6f6ef;
      --before-strong: #08785b;
      --after: #fff0e8;
      --after-strong: #bd432a;
      --boundary: #8d2b42;
      --axis: #53627a;
      --card-stroke: #aab5c6;
      --note: #edf2f9;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 20px;
    }

    svg {
      display: block;
      width: 1200px;
      height: 430px;
      max-width: 100%;
      background: var(--page);
    }

    .zone-before {
      fill: var(--before);
      stroke: var(--before-strong);
      stroke-width: 1.5;
    }

    .zone-after {
      fill: var(--after);
      stroke: var(--after-strong);
      stroke-width: 1.5;
    }

    .axis-before {
      stroke: var(--before-strong);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .axis-after {
      stroke: var(--after-strong);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .connector-before {
      stroke: var(--before-strong);
      stroke-width: 2;
    }

    .connector-after {
      stroke: var(--after-strong);
      stroke-width: 2;
    }

    .boundary {
      stroke: var(--boundary);
      stroke-width: 4;
    }

    .arrow {
      fill: var(--after-strong);
      stroke: var(--after-strong);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .stage-dot {
      fill: var(--panel);
      stroke: var(--axis);
      stroke-width: 3;
    }

    .stage-dot.training {
      fill: var(--after-strong);
      stroke: var(--after-strong);
    }

    .card {
      fill: var(--panel);
      stroke: var(--card-stroke);
      stroke-width: 1.5;
    }

    .card.before-card {
      stroke: var(--before-strong);
    }

    .card.after-card {
      stroke: var(--after-strong);
    }

    .card-accent-before {
      fill: var(--before-strong);
    }

    .card-accent-after {
      fill: var(--after-strong);
    }

    .note {
      fill: var(--note);
      stroke: var(--axis);
      stroke-width: 1.5;
    }

    .stage-label {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .zone-label {
      font-size: 15px;
      font-weight: bold;
      letter-spacing: .04em;
    }

    .before-text {
      fill: var(--before-strong);
    }

    .after-text {
      fill: var(--after-strong);
    }

    .boundary-label {
      fill: var(--boundary);
      font-size: 15px;
      font-weight: bold;
    }

    .card-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .card-detail {
      fill: var(--muted);
      font-size: 14px;
    }

    .badge-text {
      fill: var(--panel);
      font-size: 15px;
      font-weight: bold;
    }

    .note-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .note-detail {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback {
      color: var(--boundary);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --ink: #f0f4fb;
        --muted: #b3bfd1;
        --panel: #1b2432;
        --before: #14382f;
        --before-strong: #55d4ad;
        --after: #43251e;
        --after-strong: #ff967d;
        --boundary: #ff8bab;
        --axis: #9caac0;
        --card-stroke: #617087;
        --note: #202c3d;
      }
    }
  </style>
</head>
<body>
  <h1 id="diagram-title">Окно комплаенса закрывается при обучении</h1>

  <svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
       role="img" aria-labelledby="diagram-title diagram-description"
       preserveAspectRatio="xMidYMid meet">
    <desc id="diagram-description">
      Линия времени от сбора и фильтрации к обучению и выпуску. До обучения
      источник можно исключить или лицензировать. После начала обучения остаются
      приблизительное unlearning, подавление выдачи либо полное переобучение.
    </desc>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Схема должна была показать границу начала обучения: до неё доступны исключение
    и лицензирование, после неё — приблизительное unlearning, подавление выдачи
    или полное переобучение.
  </p>

  <noscript>
    <p class="fallback">
      Линия времени: сбор → фильтрация → обучение → выпуск. До обучения доступны
      исключение и лицензирование; после — приблизительное unlearning, подавление
      выдачи или полное переобучение.
    </p>
  </noscript>

  <script>
    const diagramData = [
      {
        kind: "layout",
        axis: { start: 5, boundary: 46, end: 91.5, y: 11 },
        arrow: [[91.5, 11], [89.8, 9.9], [89.8, 12.1]],
        boundary: { x: 46, top: 2.2, bottom: 29.3 },
        radius: 0.66,
        corner: 0.62
      },
      {
        kind: "zone",
        className: "zone-before",
        box: [5, 1, 45.2, 29.2],
        heading: {
          text: "ДО ОБУЧЕНИЯ · решение обратимо",
          x: 25.1,
          y: 14.6,
          className: "zone-label before-text",
          anchor: "middle"
        }
      },
      {
        kind: "zone",
        className: "zone-after",
        box: [46.8, 1, 91.5, 29.2],
        heading: {
          text: "ПОСЛЕ НАЧАЛА · дорого или неполно",
          x: 69.1,
          y: 14.6,
          className: "zone-label after-text",
          anchor: "middle"
        }
      },
      {
        kind: "stage",
        x: 9,
        y: 11,
        labelX: 9,
        labelY: 7.1,
        label: "Сбор",
        className: "stage-dot"
      },
      {
        kind: "stage",
        x: 29,
        y: 11,
        labelX: 29,
        labelY: 7.1,
        label: "Фильтрация",
        className: "stage-dot"
      },
      {
        kind: "stage",
        x: 57,
        y: 11,
        labelX: 57,
        labelY: 7.1,
        label: "Обучение",
        className: "stage-dot training"
      },
      {
        kind: "stage",
        x: 82,
        y: 11,
        labelX: 82,
        labelY: 7.1,
        label: "Выпуск",
        className: "stage-dot"
      },
      {
        kind: "boundaryLabel",
        x: 46,
        y: 3.1,
        text: "ОБУЧЕНИЕ НАЧАЛОСЬ"
      },
      {
        kind: "card",
        side: "before",
        box: [7, 16.5, 23.8, 27.5],
        connector: [15.4, 16.5, 15.4, 11],
        badge: { x: 9.2, y: 18.8, r: 1.18, text: "✓" },
        lines: [
          { text: "Исключение", x: 15.4, y: 20.3, className: "card-title" },
          { text: "найти запись", x: 15.4, y: 23, className: "card-detail" },
          { text: "и убрать из корпуса", x: 15.4, y: 25.1, className: "card-detail" }
        ]
      },
      {
        kind: "card",
        side: "before",
        box: [26.2, 16.5, 43, 27.5],
        connector: [34.6, 16.5, 34.6, 11],
        badge: { x: 28.4, y: 18.8, r: 1.18, text: "✓" },
        lines: [
          { text: "Лицензирование", x: 34.6, y: 20.3, className: "card-title" },
          { text: "проверить право", x: 34.6, y: 23, className: "card-detail" },
          { text: "до включения", x: 34.6, y: 25.1, className: "card-detail" }
        ]
      },
      {
        kind: "card",
        side: "after",
        box: [49, 16.5, 61.8, 27.5],
        connector: [55.4, 11, 55.4, 16.5],
        badge: { x: 51, y: 18.8, r: 1.18, text: "≈" },
        lines: [
          { text: "Unlearning", x: 55.4, y: 20.3, className: "card-title" },
          { text: "приблизительное", x: 55.4, y: 23, className: "card-detail" },
          { text: "изменение весов", x: 55.4, y: 25.1, className: "card-detail" }
        ]
      },
      {
        kind: "card",
        side: "after",
        box: [63.2, 16.5, 76, 27.5],
        connector: [69.6, 11, 69.6, 16.5],
        badge: { x: 65.2, y: 18.8, r: 1.18, text: "≈" },
        lines: [
          { text: "Подавление", x: 69.6, y: 20.3, className: "card-title" },
          { text: "знание остаётся,", x: 69.6, y: 23, className: "card-detail" },
          { text: "выдача блокируется", x: 69.6, y: 25.1, className: "card-detail" }
        ]
      },
      {
        kind: "card",
        side: "after",
        box: [77.4, 16.5, 90.2, 27.5],
        connector: [83.8, 11, 83.8, 16.5],
        badge: { x: 79.4, y: 18.8, r: 1.18, text: "↻" },
        lines: [
          { text: "Переобучение", x: 83.8, y: 20.3, className: "card-title" },
          { text: "полное исправление,", x: 83.8, y: 23, className: "card-detail" },
          { text: "но высокая цена", x: 83.8, y: 25.1, className: "card-detail" }
        ]
      },
      {
        kind: "note",
        box: [5, 30.5, 91.5, 34.1],
        title: {
          text: "Удаление исходного файла после старта",
          x: 7,
          y: 32.3
        },
        detail: {
          text: "не отменяет уже произошедшее обучение",
          x: 89.5,
          y: 32.3
        }
      }
    ];

    const origin = Object.freeze({ x: 30, y: 8 });
    const scale = Object.freeze({ x: 12.45, y: 12.25 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const layout = diagramData.find(item => item.kind === "layout");

      const make = (tag, attributes, value) => {
        const element = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, attribute]) => {
          element.setAttribute(name, attribute);
        });
        if (value !== undefined) element.textContent = value;
        return element;
      };

      const add = element => svg.appendChild(element);

      const addRect = (box, className) => {
        const [left, top, right, bottom] = box;
        add(make("rect", {
          x: sx(left),
          y: sy(top),
          width: sx(right) - sx(left),
          height: sy(bottom) - sy(top),
          rx: sx(layout.corner) - sx(0),
          class: className
        }));
      };

      const addLine = (points, className) => {
        const [x1, y1, x2, y2] = points;
        add(make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        }));
      };

      const addText = (entry, defaultClass, anchor) => {
        add(make("text", {
          x: sx(entry.x),
          y: sy(entry.y),
          class: entry.className || defaultClass,
          "text-anchor": entry.anchor || anchor,
          "dominant-baseline": "middle"
        }, entry.text));
      };

      diagramData
        .filter(item => item.kind === "zone")
        .forEach(zone => addRect(zone.box, zone.className));

      addLine(
        [layout.axis.start, layout.axis.y, layout.axis.boundary, layout.axis.y],
        "axis-before"
      );
      addLine(
        [layout.axis.boundary, layout.axis.y, layout.axis.end, layout.axis.y],
        "axis-after"
      );

      add(make("polygon", {
        points: layout.arrow.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
        class: "arrow"
      }));

      diagramData
        .filter(item => item.kind === "card")
        .forEach(card => {
          addLine(
            card.connector,
            card.side === "before" ? "connector-before" : "connector-after"
          );
        });

      diagramData
        .filter(item => item.kind === "stage")
        .forEach(stage => {
          add(make("circle", {
            cx: sx(stage.x),
            cy: sy(stage.y),
            r: sx(layout.radius) - sx(0),
            class: stage.className
          }));
          addText(
            { text: stage.label, x: stage.labelX, y: stage.labelY },
            "stage-label",
            "middle"
          );
        });

      diagramData
        .filter(item => item.kind === "zone")
        .forEach(zone => addText(zone.heading, "zone-label", "middle"));

      addLine(
        [
          layout.boundary.x,
          layout.boundary.top,
          layout.boundary.x,
          layout.boundary.bottom
        ],
        "boundary"
      );

      diagramData
        .filter(item => item.kind === "boundaryLabel")
        .forEach(label => addText(label, "boundary-label", "middle"));

      diagramData
        .filter(item => item.kind === "card")
        .forEach(card => {
          addRect(
            card.box,
            `card ${card.side === "before" ? "before-card" : "after-card"}`
          );

          add(make("circle", {
            cx: sx(card.badge.x),
            cy: sy(card.badge.y),
            r: sx(card.badge.r) - sx(0),
            class: card.side === "before"
              ? "card-accent-before"
              : "card-accent-after"
          }));

          addText(
            {
              text: card.badge.text,
              x: card.badge.x,
              y: card.badge.y
            },
            "badge-text",
            "middle"
          );

          card.lines.forEach(line => addText(line, line.className, "middle"));
        });

      diagramData
        .filter(item => item.kind === "note")
        .forEach(note => {
          addRect(note.box, "note");
          addText(note.title, "note-title", "start");
          addText(note.detail, "note-detail", "end");
        });

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
