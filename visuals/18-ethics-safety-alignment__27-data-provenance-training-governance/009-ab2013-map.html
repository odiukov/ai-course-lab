<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта двенадцати полей AB 2013</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --ink: #172033;
    --muted: #5c667a;
    --frame: #cbd2df;
    --panel: #ffffff;
    --card: #f7f9fc;
    --origin: #166a61;
    --origin-soft: #d9f2ec;
    --content: #315ba7;
    --content-soft: #e3ebfb;
    --people: #a33d52;
    --people-soft: #f9e2e7;
    --footer: #202b42;
    --footer-ink: #ffffff;
    --shadow: #dfe3ec;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111520;
      --ink: #eef2fb;
      --muted: #aeb8cb;
      --frame: #3b455a;
      --panel: #1a2030;
      --card: #222a3c;
      --origin: #72d4c2;
      --origin-soft: #173b38;
      --content: #8eb4ff;
      --content-soft: #1e345c;
      --people: #ff9caf;
      --people-soft: #512833;
      --footer: #dce6fb;
      --footer-ink: #172033;
      --shadow: #0b0e16;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: unset;
    padding: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: 100%;
    background: var(--page);
  }

  header {
    text-align: center;
    background: var(--page);
  }

  h1 {
    margin: unset;
    font-size: 22px;
    font-weight: bold;
  }

  header p {
    margin: unset;
    font-size: 14px;
    color: var(--muted);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 450px;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--frame);
    stroke-width: 1.5px;
  }

  .panel-shadow { fill: var(--shadow); }
  .card {
    fill: var(--card);
    stroke-width: 1.5px;
  }

  .origin-card { stroke: var(--origin); }
  .content-card { stroke: var(--content); }
  .people-card { stroke: var(--people); }
  .origin-fill { fill: var(--origin-soft); }
  .content-fill { fill: var(--content-soft); }
  .people-fill { fill: var(--people-soft); }
  .origin-ink { fill: var(--origin); }
  .content-ink { fill: var(--content); }
  .people-ink { fill: var(--people); }
  .ink { fill: var(--ink); }
  .muted { fill: var(--muted); }
  .footer { fill: var(--footer); }
  .footer-ink { fill: var(--footer-ink); }

  text {
    font-family: inherit;
    dominant-baseline: middle;
  }

  .group-title {
    font-size: 17px;
    font-weight: bold;
    letter-spacing: .02em;
  }

  .group-subtitle { font-size: 13px; }
  .card-number { font-size: 16px; font-weight: bold; }
  .card-label { font-size: 14px; font-weight: bold; }
  .card-detail { font-size: 12px; }
  .route-label { font-size: 13px; font-weight: bold; }
  .formula { font-size: 18px; font-weight: bold; }
  .fallback { font-size: 17px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Карта двенадцати полей AB 2013</h1>
    <p>Один перечень — три маршрута проверки</p>
  </header>

  <svg id="map" viewBox="0 0 1200 430" width="1200" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <title id="diagram-title">Карта двенадцати обязательных полей AB 2013</title>
    <desc id="diagram-desc">Поля 1, 5, 6, 10 и 11 относятся к происхождению; поля 2, 3, 4, 9 и 12 — к содержимому и обработке; поля 7 и 8 — к данным о людях.</desc>
  </svg>

  <noscript>Схема делит поля 1, 5, 6, 10, 11; 2, 3, 4, 9, 12; и 7, 8 на три рабочих маршрута.</noscript>
</main>

<script>
const data = {
  canvas: { x: 0, y: 0, w: 1200, h: 430 },
  layout: {
    panelY: 18, panelW: 372, panelH: 330, shadowShift: 5,
    radius: 15, cardXInset: 18, cardW: 336, cardH: 36,
    numberXInset: 38, labelXInset: 63, cardRadius: 9,
    headingY: 43, subtitleY: 65, routeY: 321,
    routeLineY: 302, footerX: 22, footerY: 365,
    footerW: 1156, footerH: 48, footerRadius: 14,
    formulaX: 600, formulaY: 389, numberRadius: 13,
    stroke: 1.5
  },
  groups: [
    {
      key: "origin", x: 22, centerX: 208,
      title: "ПРОИСХОЖДЕНИЕ",
      subtitle: "откуда, на каких условиях и когда",
      route: "Маршрут: юридическая команда",
      cards: [
        { number: "1", y: 82, label: "Источники или владельцы" },
        { number: "5", y: 126, label: "Права и общественное достояние" },
        { number: "6", y: 170, label: "Покупка или лицензия" },
        { number: "10", y: 214, label: "Период сбора" },
        { number: "11", y: 258, label: "Первое использование в разработке" }
      ]
    },
    {
      key: "content", x: 414, centerX: 600,
      title: "СОДЕРЖИМОЕ И ОБРАБОТКА",
      subtitle: "что внутри и что с этим делали",
      route: "Маршрут: дата-инженеры",
      cards: [
        { number: "2", y: 82, label: "Роль датасетов в цели системы" },
        { number: "3", y: 126, label: "Число точек данных" },
        { number: "4", y: 170, label: "Типы точек и меток" },
        { number: "9", y: 214, label: "Очистка и обработка" },
        { number: "12", y: 258, label: "Синтетические данные" }
      ]
    },
    {
      key: "people", x: 806, centerX: 992,
      title: "ДАННЫЕ О ЛЮДЯХ",
      subtitle: "персональные и агрегированные сведения",
      route: "Маршрут: приватность + юристы",
      cards: [
        {
          number: "7", y: 82, h: 76,
          lines: ["Персональные данные", "Переключатель проверки CPRA"]
        },
        {
          number: "8", y: 170, h: 76,
          lines: ["Агрегированные потребительские", "сведения"]
        }
      ],
      notice: {
        x: 824, y: 258, w: 336, h: 36,
        text: "Возможна отдельная проверка рисков"
      }
    }
  ],
  fallback: {
    x: 22, y: 18, w: 1156, h: 395,
    textX: 600, textY: 185,
    detailX: 600, detailY: 225
  }
};

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("map");
  const ns = "http://www.w3.org/2000/svg";
  const L = data.layout;

  const node = (name, attrs, className) => {
    const el = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) {
      el.setAttribute(key, value);
    }
    if (className) el.setAttribute("class", className);
    return el;
  };

  const rect = (x, y, w, h, rx, className) =>
    node("rect", {
      x: sx(x), y: sy(y), width: sx(w), height: sy(h),
      rx: sx(rx), ry: sy(rx)
    }, className);

  const line = (x1, y1, x2, y2, className) =>
    node("line", {
      x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2),
      "stroke-width": sx(L.stroke)
    }, className);

  const text = (value, x, y, anchor, className) => {
    const el = node("text", {
      x: sx(x), y: sy(y), "text-anchor": anchor
    }, className);
    el.textContent = value;
    return el;
  };

  const groupFragment = document.createDocumentFragment();

  for (const group of data.groups) {
    const panel = node("g", {}, `${group.key}-group`);

    panel.append(
      rect(
        group.x + L.shadowShift,
        L.panelY + L.shadowShift,
        L.panelW,
        L.panelH,
        L.radius,
        "panel-shadow"
      ),
      rect(group.x, L.panelY, L.panelW, L.panelH, L.radius, "panel"),
      text(group.title, group.centerX, L.headingY, "middle",
        `group-title ${group.key}-ink`),
      text(group.subtitle, group.centerX, L.subtitleY, "middle",
        "group-subtitle muted")
    );

    for (const card of group.cards) {
      const cardX = group.x + L.cardXInset;
      const cardH = card.h || L.cardH;
      const cardCenterY = card.y + cardH / scale.y / (scale.y + scale.y);
      const numberX = group.x + L.numberXInset;
      const labelX = group.x + L.labelXInset;

      panel.append(
        rect(cardX, card.y, L.cardW, cardH, L.cardRadius,
          `card ${group.key}-card`),
        node("circle", {
          cx: sx(numberX),
          cy: sy(cardCenterY),
          r: sx(L.numberRadius)
        }, `${group.key}-fill`),
        text(card.number, numberX, cardCenterY, "middle",
          `card-number ${group.key}-ink`)
      );

      if (card.lines) {
        const upperY = cardCenterY - L.cardRadius;
        const lowerY = cardCenterY + L.cardRadius;
        panel.append(
          text(card.lines.shift(), labelX, upperY, "start",
            "card-label ink"),
          text(card.lines.join(" "), labelX, lowerY, "start",
            "card-detail muted")
        );
      } else {
        panel.append(
          text(card.label, labelX, cardCenterY, "start", "card-label ink")
        );
      }
    }

    if (group.notice) {
      panel.append(
        rect(
          group.notice.x, group.notice.y,
          group.notice.w, group.notice.h,
          L.cardRadius, "people-fill"
        ),
        text(
          group.notice.text,
          group.centerX,
          group.notice.y + group.notice.h / scale.y / (scale.y + scale.y),
          "middle",
          "card-detail people-ink"
        )
      );
    }

    panel.append(
      line(
        group.x + L.cardXInset,
        L.routeLineY,
        group.x + L.panelW - L.cardXInset,
        L.routeLineY,
        `${group.key}-card`
      ),
      text(group.route, group.centerX, L.routeY, "middle",
        `route-label ${group.key}-ink`)
    );

    groupFragment.append(panel);
  }

  svg.append(
    groupFragment,
    rect(
      L.footerX, L.footerY, L.footerW, L.footerH,
      L.footerRadius, "footer"
    ),
    text(
      "5 полей о происхождении + 5 о содержимом + 2 о людях = 12 обязательных полей",
      L.formulaX,
      L.formulaY,
      "middle",
      "formula footer-ink"
    )
  );
} catch (error) {
  const svg = document.getElementById("map");
  const ns = "http://www.w3.org/2000/svg";
  const F = data.fallback;
  svg.replaceChildren();

  const box = document.createElementNS(ns, "rect");
  box.setAttribute("x", sx(F.x));
  box.setAttribute("y", sy(F.y));
  box.setAttribute("width", sx(F.w));
  box.setAttribute("height", sy(F.h));
  box.setAttribute("rx", sx(data.layout.radius));
  box.setAttribute("class", "panel");
  svg.append(box);

  const message = document.createElementNS(ns, "text");
  message.setAttribute("x", sx(F.textX));
  message.setAttribute("y", sy(F.textY));
  message.setAttribute("text-anchor", "middle");
  message.setAttribute("class", "fallback ink");
  message.textContent = "Схема должна была разделить двенадцать полей на три маршрута.";
  svg.append(message);

  const detail = document.createElementNS(ns, "text");
  detail.setAttribute("x", sx(F.detailX));
  detail.setAttribute("y", sy(F.detailY));
  detail.setAttribute("text-anchor", "middle");
  detail.setAttribute("class", "card-label muted");
  detail.textContent = "Происхождение: 1, 5, 6, 10, 11 · содержимое: 2, 3, 4, 9, 12 · люди: 7, 8";
  svg.append(detail);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
