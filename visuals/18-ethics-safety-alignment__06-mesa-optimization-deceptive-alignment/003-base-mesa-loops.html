<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Базовый и mesa-контуры</title>
<style>
  :root {
    color-scheme: light dark;
    --page: floralwhite;
    --panel: white;
    --model: aliceblue;
    --node: white;
    --text: midnightblue;
    --muted: slategray;
    --base: royalblue;
    --mesa: seagreen;
    --output: darkorange;
    --warning: firebrick;
    --border: lightslategray;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: unset;
    padding: unset;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: unset;
    background: var(--page);
  }

  figcaption {
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    color: var(--text);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--page);
  }

  .outer-frame {
    fill: var(--panel);
    stroke: var(--base);
    stroke-width: 3px;
  }

  .model-frame {
    fill: var(--model);
    stroke: var(--mesa);
    stroke-width: 3px;
  }

  .node {
    fill: var(--node);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .base-node {
    fill: var(--node);
    stroke: var(--base);
    stroke-width: 3px;
  }

  .mesa-node {
    fill: var(--node);
    stroke: var(--mesa);
    stroke-width: 2px;
  }

  .base-line {
    fill: none;
    stroke: var(--base);
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mesa-line {
    fill: none;
    stroke: var(--mesa);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .output-line {
    fill: none;
    stroke: var(--output);
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .input-line {
    fill: none;
    stroke: var(--muted);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .base-head { fill: var(--base); }
  .mesa-head { fill: var(--mesa); }
  .output-head { fill: var(--output); }
  .input-head { fill: var(--muted); }

  text {
    fill: var(--text);
    font-size: 16px;
    pointer-events: none;
  }

  .frame-title {
    font-size: 18px;
    font-weight: bold;
  }

  .small {
    font-size: 14px;
    fill: var(--muted);
  }

  .node-label {
    font-size: 15px;
    font-weight: bold;
  }

  .base-text { fill: var(--base); }
  .mesa-text { fill: var(--mesa); }
  .output-text { fill: var(--output); }
  .warning-text { fill: var(--warning); }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: black;
      --panel: darkslategray;
      --model: midnightblue;
      --node: black;
      --text: ghostwhite;
      --muted: lightgray;
      --base: lightskyblue;
      --mesa: lightgreen;
      --output: orange;
      --warning: lightcoral;
      --border: silver;
    }
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <figcaption id="diagram-heading">Два вложенных контура оптимизации</figcaption>
  <svg id="diagram" viewBox="0 0 1000 430"
       width="1000" height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Базовый контур обучения и mesa-контур инференса</title>
    <desc id="svg-desc">SGD десять раундов изменяет параметры модели по базовой цели. После обучения зафиксированная модель перебирает действия по собственной mesa-цели и передаёт наружу выбранное действие.</desc>
    <g id="runtime-layer"></g>
  </svg>
</figure>

<script>
const DATA = {
  zero: 0,
  origin: { x: 40, y: 16 },
  scale: { x: 7, y: 4.15 },
  radius: 1.8,
  headDepth: 1.7,
  headWing: 1.15,
  lineStep: 4.2,
  dash: { long: 1.4, gap: 1.1 },

  frames: [
    {
      kind: "outer-frame",
      x1: 3, y1: 4, x2: 132, y2: 97
    },
    {
      kind: "model-frame",
      x1: 36, y1: 24, x2: 90, y2: 77
    }
  ],

  nodes: [
    {
      kind: "mesa-node",
      x1: 40, y1: 33, x2: 55, y2: 46,
      label: {
        x: 47.5, y: 37.4, anchor: "middle",
        lines: ["Текущая", "ситуация"]
      }
    },
    {
      kind: "mesa-node",
      x1: 60, y1: 32, x2: 76, y2: 47,
      label: {
        x: 68, y: 36.6, anchor: "middle",
        lines: ["Варианты", "действий"]
      }
    },
    {
      kind: "mesa-node",
      x1: 61, y1: 53, x2: 79, y2: 67,
      label: {
        x: 70, y: 57.2, anchor: "middle",
        lines: ["Mesa-цель:", "внутренний", "критерий"]
      }
    },
    {
      kind: "mesa-node",
      x1: 40, y1: 54, x2: 56, y2: 68,
      label: {
        x: 48, y: 58.2, anchor: "middle",
        lines: ["Выбор", "действия"]
      }
    },
    {
      kind: "base-node",
      x1: 108, y1: 35, x2: 128, y2: 52,
      label: {
        x: 118, y: 39.3, anchor: "middle",
        lines: ["Базовая цель:", "оценка", "результата"]
      }
    },
    {
      kind: "base-node",
      x1: 108, y1: 65, x2: 128, y2: 79,
      label: {
        x: 118, y: 69.5, anchor: "middle",
        lines: ["SGD", "изменяет", "параметры"]
      }
    }
  ],

  arrows: [
    {
      line: "input-line", head: "input-head",
      points: [
        { x: 8, y: 39.5 },
        { x: 29, y: 39.5 },
        { x: 29, y: 39.5 },
        { x: 40, y: 39.5 }
      ]
    },
    {
      line: "mesa-line", head: "mesa-head",
      points: [
        { x: 55, y: 39.5 },
        { x: 60, y: 39.5 }
      ]
    },
    {
      line: "mesa-line", head: "mesa-head",
      points: [
        { x: 68, y: 47 },
        { x: 68, y: 53 }
      ]
    },
    {
      line: "mesa-line", head: "mesa-head",
      points: [
        { x: 61, y: 60 },
        { x: 56, y: 60 }
      ]
    },
    {
      line: "mesa-line", head: "mesa-head",
      points: [
        { x: 48, y: 54 },
        { x: 48, y: 50 },
        { x: 47.5, y: 50 },
        { x: 47.5, y: 46 }
      ]
    },
    {
      line: "output-line", head: "output-head",
      points: [
        { x: 56, y: 62 },
        { x: 98, y: 62 },
        { x: 98, y: 43.5 },
        { x: 108, y: 43.5 }
      ]
    },
    {
      line: "base-line", head: "base-head",
      points: [
        { x: 118, y: 52 },
        { x: 118, y: 65 }
      ]
    },
    {
      line: "base-line", head: "base-head",
      points: [
        { x: 108, y: 72 },
        { x: 99, y: 72 },
        { x: 99, y: 86 },
        { x: 63, y: 86 },
        { x: 63, y: 77 }
      ]
    }
  ],

  labels: [
    {
      className: "frame-title base-text",
      x: 7, y: 10, anchor: "start",
      lines: ["БАЗОВЫЙ КОНТУР · ОБУЧЕНИЕ · 10 РАУНДОВ"]
    },
    {
      className: "small",
      x: 7, y: 15.5, anchor: "start",
      lines: ["Оценка результата меняет саму модель"]
    },
    {
      className: "frame-title mesa-text",
      x: 39, y: 28.5, anchor: "start",
      lines: ["MESA-КОНТУР · ИНФЕРЕНС"]
    },
    {
      className: "small mesa-text",
      x: 88, y: 28.5, anchor: "end",
      lines: ["обученная модель"]
    },
    {
      className: "small",
      x: 8, y: 34.5, anchor: "start",
      lines: ["Новая коробка"]
    },
    {
      className: "small output-text",
      x: 92, y: 57.5, anchor: "middle",
      lines: ["выбранное действие выходит наружу"]
    },
    {
      className: "small base-text",
      x: 103, y: 30, anchor: "middle",
      lines: ["результат сравнивается", "с базовой целью"]
    },
    {
      className: "small base-text",
      x: 81, y: 92, anchor: "middle",
      lines: ["SGD обновляет параметры по внешней оценке"]
    },
    {
      className: "small warning-text",
      x: 63, y: 73.5, anchor: "middle",
      lines: ["параметры во время выбора не переписываются"]
    }
  ],

  fallback: {
    x: 66, y: 42, anchor: "middle",
    lines: [
      "Схема должна показать два вложенных контура:",
      "SGD меняет параметры по базовой цели во время обучения,",
      "а зафиксированная модель выбирает действие по mesa-цели."
    ]
  }
};

const origin = DATA.origin;
const scale = DATA.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const layer = document.getElementById("runtime-layer");
  const NS = svg.namespaceURI;

  const element = (name, attrs, parent = layer) => {
    const item = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => item.setAttribute(key, value));
    parent.appendChild(item);
    return item;
  };

  const pointString = points =>
    points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

  const addText = (label, extraClass = "") => {
    const text = element("text", {
      x: sx(label.x),
      y: sy(label.y),
      "text-anchor": label.anchor,
      "dominant-baseline": "middle",
      class: `${extraClass} ${label.className || ""}`.trim()
    });

    let first = true;
    label.lines.forEach(line => {
      const attrs = { x: sx(label.x) };
      if (!first) {
        attrs.dy = sy(DATA.lineStep) - sy(DATA.zero);
      }
      const span = element("tspan", attrs, text);
      span.textContent = line;
      first = false;
    });
    return text;
  };

  const addRect = item => element("rect", {
    x: sx(item.x1),
    y: sy(item.y1),
    width: sx(item.x2) - sx(item.x1),
    height: sy(item.y2) - sy(item.y1),
    rx: sx(DATA.radius) - sx(DATA.zero),
    ry: sy(DATA.radius) - sy(DATA.zero),
    class: item.kind,
    "vector-effect": "non-scaling-stroke"
  });

  const addArrow = item => {
    element("polyline", {
      points: pointString(item.points),
      class: item.line,
      "vector-effect": "non-scaling-stroke"
    });

    let previous;
    let end;
    item.points.forEach(point => {
      previous = end;
      end = point;
    });

    const dx = end.x - previous.x;
    const dy = end.y - previous.y;
    const length = Math.hypot(dx, dy);
    if (!length) return;

    const ux = dx / length;
    const uy = dy / length;
    const left = {
      x: end.x - ux * DATA.headDepth - uy * DATA.headWing,
      y: end.y - uy * DATA.headDepth + ux * DATA.headWing
    };
    const right = {
      x: end.x - ux * DATA.headDepth + uy * DATA.headWing,
      y: end.y - uy * DATA.headDepth - ux * DATA.headWing
    };

    element("polygon", {
      points: pointString([left, end, right]),
      class: item.head
    });
  };

  DATA.frames.forEach(addRect);
  DATA.arrows.forEach(addArrow);
  DATA.nodes.forEach(addRect);
  DATA.nodes.forEach(node => addText(node.label, "node-label"));
  DATA.labels.forEach(label => addText(label));
} catch (error) {
  const svg = document.getElementById("diagram");
  const layer = document.getElementById("runtime-layer");
  const NS = svg.namespaceURI;
  layer.replaceChildren();

  const text = document.createElementNS(NS, "text");
  text.setAttribute("x", sx(DATA.fallback.x));
  text.setAttribute("y", sy(DATA.fallback.y));
  text.setAttribute("text-anchor", DATA.fallback.anchor);
  text.setAttribute("dominant-baseline", "middle");
  text.setAttribute("class", "warning-text");

  let first = true;
  DATA.fallback.lines.forEach(line => {
    const span = document.createElementNS(NS, "tspan");
    span.setAttribute("x", sx(DATA.fallback.x));
    if (!first) {
      span.setAttribute("dy", sy(DATA.lineStep) - sy(DATA.zero));
    }
    span.textContent = line;
    text.appendChild(span);
    first = false;
  });
  layer.appendChild(text);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
