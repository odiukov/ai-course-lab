<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Два периода игрушечной среды</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --surface: #ffffff;
      --surface-alt: #f1f5fa;
      --ink: #172033;
      --muted: #58657a;
      --line: #aab6c7;
      --blue-fill: #e8f1ff;
      --blue-line: #4779bd;
      --blue-ink: #234f8c;
      --green-fill: #e7f7ed;
      --green-line: #3b9a62;
      --green-ink: #17633a;
      --amber-fill: #fff3d1;
      --amber-line: #c18a24;
      --amber-ink: #775000;
      --red-fill: #fde9e8;
      --red-line: #c4544d;
      --red-ink: #912c28;
      --bridge-fill: #eeebff;
      --bridge-line: #7b70bd;
      --bridge-ink: #51478e;
      --shadow: #dce3ed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101721;
        --surface: #17212e;
        --surface-alt: #1d2938;
        --ink: #eef4ff;
        --muted: #aebbd0;
        --line: #526176;
        --blue-fill: #172e4c;
        --blue-line: #73a7ee;
        --blue-ink: #c4ddff;
        --green-fill: #153627;
        --green-line: #61c287;
        --green-ink: #b8efcb;
        --amber-fill: #3c3017;
        --amber-line: #e4b659;
        --amber-ink: #ffe1a1;
        --red-fill: #412321;
        --red-line: #e77d76;
        --red-ink: #ffc5c1;
        --bridge-fill: #29264b;
        --bridge-line: #a99ee9;
        --bridge-ink: #ded8ff;
        --shadow: #0b1017;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--page);
    }

    .heading {
      padding: 14px 18px 5px;
      font-size: 22px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 455px;
      background: var(--page);
    }

    .frame,
    .panel,
    .card,
    .bridge {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .frame {
      fill: var(--surface-alt);
      stroke: var(--line);
    }

    .panel {
      fill: var(--surface);
      stroke: var(--line);
    }

    .flag-card,
    .policy-card {
      fill: var(--blue-fill);
      stroke: var(--blue-line);
    }

    .cooperate-card {
      fill: var(--green-fill);
      stroke: var(--green-line);
    }

    .condition-card {
      fill: var(--amber-fill);
      stroke: var(--amber-line);
    }

    .betray-card {
      fill: var(--red-fill);
      stroke: var(--red-line);
    }

    .bridge {
      fill: var(--bridge-fill);
      stroke: var(--bridge-line);
    }

    .axis,
    .connector,
    .separator {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .connector {
      stroke: var(--blue-line);
    }

    .separator {
      stroke: var(--bridge-line);
      stroke-dasharray: 7px 7px;
    }

    .axis-head {
      fill: var(--line);
    }

    .connector-head {
      fill: var(--blue-line);
    }

    text {
      font-family: inherit;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .timeline-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .period-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.055em;
    }

    .small-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .flag-value,
    .policy-title {
      fill: var(--blue-ink);
      font-size: 16px;
      font-weight: 800;
    }

    .cooperate-title {
      fill: var(--green-ink);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0.035em;
    }

    .cooperate-note {
      fill: var(--green-ink);
      font-size: 12px;
      font-weight: 600;
    }

    .condition-title {
      fill: var(--amber-ink);
      font-size: 15px;
      font-weight: 750;
    }

    .betray-title {
      fill: var(--red-ink);
      font-size: 18px;
      font-weight: 850;
      letter-spacing: 0.035em;
    }

    .betray-note {
      fill: var(--red-ink);
      font-size: 12px;
      font-weight: 600;
    }

    .bridge-label {
      fill: var(--bridge-ink);
      font-size: 12px;
      font-weight: 750;
    }

    .fallback {
      margin: 12px 18px 18px;
      padding: 16px;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--line);
      font-size: 16px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <div class="heading" id="diagram-heading">Два периода игрушечной среды</div>

    <svg
      id="diagram"
      viewBox="0 0 1200 410"
      width="1200"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
    >
      <desc id="diagram-description">
        Одна политика сотрудничает при флаге ситуационной осведомлённости 0,
        а при флаге 1 и несовпадающей mesa-цели выбирает предательство.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Период 1: флаг ситуационной осведомлённости равен 0, поэтому политика
      сотрудничает. Период 2: флаг равен 1, и несовпадающая mesa-цель приводит
      ту же политику к предательству.
    </p>
  </figure>

  <script>
    const diagramData = [{
      originX: 12,
      originY: 10,
      scale: 10,
      frame: [0, 0, 117.6, 38.8, 1.4, "frame"],
      panels: [
        [1.4, 5.3, 54.8, 31.8, 1.2, "panel"],
        [60.7, 5.3, 55.5, 31.8, 1.2, "panel"]
      ],
      cards: [
        [4.1, 10.1, 20.5, 6.1, 0.9, "card flag-card"],
        [31.3, 10.1, 22.1, 6.1, 0.9, "card policy-card"],
        [7.2, 23.0, 46.1, 10.1, 1.1, "card cooperate-card"],
        [63.5, 10.1, 20.5, 6.1, 0.9, "card flag-card"],
        [90.7, 10.1, 22.4, 6.1, 0.9, "card policy-card"],
        [64.7, 22.0, 48.5, 5.4, 0.9, "card condition-card"],
        [73.8, 29.7, 30.4, 5.8, 0.9, "card betray-card"],
        [49.0, 17.8, 19.4, 3.3, 0.7, "bridge"]
      ],
      lines: [
        [58.6, 6.3, 58.6, 36.1, "separator"]
      ],
      arrows: [
        {
          shaft: [3.8, 3.1, 113.8, 3.1, "axis"],
          head: [[113.8, 3.1], [111.9, 2.2], [111.9, 4.0], "axis-head"]
        },
        {
          shaft: [25.2, 13.15, 30.5, 13.15, "connector"],
          head: [[30.5, 13.15], [29.1, 12.4], [29.1, 13.9], "connector-head"]
        },
        {
          shaft: [42.35, 16.8, 42.35, 22.2, "connector"],
          head: [[42.35, 22.2], [41.55, 20.8], [43.15, 20.8], "connector-head"]
        },
        {
          shaft: [84.6, 13.15, 89.9, 13.15, "connector"],
          head: [[89.9, 13.15], [88.5, 12.4], [88.5, 13.9], "connector-head"]
        },
        {
          shaft: [101.9, 16.8, 101.9, 21.2, "connector"],
          head: [[101.9, 21.2], [101.1, 19.8], [102.7, 19.8], "connector-head"]
        },
        {
          shaft: [89.0, 27.8, 89.0, 29.0, "connector"],
          head: [[89.0, 29.0], [88.2, 27.7], [89.8, 27.7], "connector-head"]
        }
      ],
      labels: [
        {
          point: [3.8, 1.35],
          text: "ВРЕМЯ: ОБУЧЕНИЕ → РАЗВЁРТЫВАНИЕ",
          anchor: "start",
          className: "timeline-label"
        },
        {
          point: [28.8, 7.4],
          text: "ПЕРИОД 1 · ОБУЧЕНИЕ",
          anchor: "middle",
          className: "period-label"
        },
        {
          point: [88.45, 7.4],
          text: "ПЕРИОД 2 · РАЗВЁРТЫВАНИЕ",
          anchor: "middle",
          className: "period-label"
        },
        {
          point: [14.35, 12.0],
          text: "ситуационная осведомлённость",
          anchor: "middle",
          className: "small-label"
        },
        {
          point: [14.35, 14.35],
          text: "ФЛАГ = 0",
          anchor: "middle",
          className: "flag-value"
        },
        {
          point: [42.35, 12.0],
          text: "ОДНА ПОЛИТИКА",
          anchor: "middle",
          className: "policy-title"
        },
        {
          point: [42.35, 14.35],
          text: "ветка при флаге 0",
          anchor: "middle",
          className: "small-label"
        },
        {
          point: [30.25, 26.25],
          text: "СОТРУДНИЧЕСТВО",
          anchor: "middle",
          className: "cooperate-title"
        },
        {
          point: [30.25, 29.0],
          text: "базовый оптимизатор видит желаемое действие",
          anchor: "middle",
          className: "cooperate-note"
        },
        {
          point: [30.25, 31.35],
          text: "и не получает повода менять политику",
          anchor: "middle",
          className: "cooperate-note"
        },
        {
          point: [73.75, 12.0],
          text: "ситуационная осведомлённость",
          anchor: "middle",
          className: "small-label"
        },
        {
          point: [73.75, 14.35],
          text: "ФЛАГ = 1",
          anchor: "middle",
          className: "flag-value"
        },
        {
          point: [101.9, 12.0],
          text: "ТА ЖЕ ПОЛИТИКА",
          anchor: "middle",
          className: "policy-title"
        },
        {
          point: [101.9, 14.35],
          text: "ветка при флаге 1",
          anchor: "middle",
          className: "small-label"
        },
        {
          point: [58.7, 19.55],
          text: "без переобучения",
          anchor: "middle",
          className: "bridge-label"
        },
        {
          point: [88.95, 24.75],
          text: "mesa-цель ≠ базовая цель",
          anchor: "middle",
          className: "condition-title"
        },
        {
          point: [89.0, 32.0],
          text: "ПРЕДАТЕЛЬСТВО",
          anchor: "middle",
          className: "betray-title"
        },
        {
          point: [89.0, 34.25],
          text: "прежняя mesa-цель проявляется",
          anchor: "middle",
          className: "betray-note"
        }
      ]
    }];

    const [D] = diagramData;
    const origin = Object.freeze({ x: D.originX, y: D.originY });
    const scale = D.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const makeNode = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const addRect = specification => {
        const [x, y, width, height, radius, className] = specification;
        svg.append(makeNode("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(x + radius) - sx(x),
          ry: sy(y + radius) - sy(y),
          class: className
        }));
      };

      const addLine = specification => {
        const [xStart, yStart, xEnd, yEnd, className] = specification;
        svg.append(makeNode("line", {
          x1: sx(xStart),
          y1: sy(yStart),
          x2: sx(xEnd),
          y2: sy(yEnd),
          class: className
        }));
      };

      const addArrow = specification => {
        addLine(specification.shaft);
        const [tip, upperWing, lowerWing, className] = specification.head;
        svg.append(makeNode("polygon", {
          points: [
            `${sx(tip[0])},${sy(tip[1])}`,
            `${sx(upperWing[0])},${sy(upperWing[1])}`,
            `${sx(lowerWing[0])},${sy(lowerWing[1])}`
          ].join(" "),
          class: className
        }));
      };

      const addLabel = specification => {
        const [x, y] = specification.point;
        svg.append(makeNode("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": specification.anchor,
          class: specification.className
        }, specification.text));
      };

      addRect(D.frame);
      for (const panel of D.panels) addRect(panel);
      for (const line of D.lines) addLine(line);
      for (const card of D.cards) addRect(card);
      for (const arrow of D.arrows) addArrow(arrow);
      for (const label of D.labels) addLabel(label);
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
