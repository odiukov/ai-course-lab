<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Якорь, позитив, негатив и margin</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #667085;
    --axis: #8b95a7;
    --guide: #b7bfcc;
    --anchor: #2563eb;
    --positive: #159455;
    --negative: #d04444;
    --margin: #f2c94c;
    --margin-fill: #fff1a8;
    --safe-fill: #dcf6e8;
    --hard-fill: #ffe4e1;
    --border: #d8dde7;
    --shadow: #c7ceda;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --panel: #192230;
      --ink: #edf2f7;
      --muted: #aeb8c7;
      --axis: #8793a5;
      --guide: #566274;
      --anchor: #70a5ff;
      --positive: #56d392;
      --negative: #ff7770;
      --margin: #ffd85e;
      --margin-fill: #594d20;
      --safe-fill: #173f31;
      --hard-fill: #502c31;
      --border: #344052;
      --shadow: #0a0e15;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    width: 100%;
    margin: 0;
    padding: 14px 16px 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 2px 8px var(--shadow);
    overflow: hidden;
  }

  h1 {
    margin: 0 0 4px;
    font-size: 20px;
    line-height: 1.25;
    font-weight: 750;
    letter-spacing: -0.01em;
  }

  .subtitle {
    margin: 0 0 2px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.35;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
  }

  .axis, .guide, .distance, .threshold, .separator {
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .axis { stroke: var(--axis); stroke-width: 2; }
  .guide { stroke: var(--guide); stroke-width: 1.5; stroke-dasharray: 4 5; }
  .threshold { stroke: var(--margin); stroke-width: 2; stroke-dasharray: 5 4; }
  .separator { stroke: var(--border); stroke-width: 1; }
  .distance { stroke: var(--ink); stroke-width: 1.6; }
  .margin-band { fill: var(--margin-fill); opacity: .82; }
  .formula-easy { fill: var(--safe-fill); stroke: var(--positive); }
  .formula-hard { fill: var(--hard-fill); stroke: var(--negative); }
  .formula-box { stroke-width: 1.5; vector-effect: non-scaling-stroke; }

  text {
    fill: var(--ink);
    font-size: 14px;
    dominant-baseline: alphabetic;
  }

  .section-title { font-size: 16px; font-weight: 750; }
  .point-label { font-size: 14px; font-weight: 700; }
  .small { font-size: 12px; fill: var(--muted); }
  .margin-label { font-size: 12px; font-weight: 750; fill: var(--ink); }
  .formula-title { font-size: 14px; font-weight: 750; }
  .formula { font-size: 13px; font-variant-numeric: tabular-nums; }
  .result-easy { fill: var(--positive); font-weight: 800; }
  .result-hard { fill: var(--negative); font-weight: 800; }
  .anchor-dot { fill: var(--anchor); stroke: var(--panel); stroke-width: 3; }
  .positive-dot { fill: var(--positive); stroke: var(--panel); stroke-width: 3; }
  .negative-dot { fill: var(--negative); stroke: var(--panel); stroke-width: 3; }
  .anchor-ring { fill: none; stroke: var(--anchor); stroke-width: 2; }
  .tick { stroke: var(--ink); stroke-width: 1.6; vector-effect: non-scaling-stroke; }

  #fallback {
    margin: 18px 4px 8px;
    padding: 12px;
    color: var(--ink);
    background: var(--hard-fill);
    border: 1px solid var(--negative);
    border-radius: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <h1 id="diagram-heading">Якорь, позитив, негатив и margin</h1>
  <p class="subtitle">Негатив должен быть дальше позитива как минимум на заданный запас.</p>
  <svg id="diagram" viewBox="0 0 760 430" width="760" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Сравнение лёгкого и сложного негатива при margin 0.2">
    <title>Triplet loss для лёгкого и сложного негатива</title>
  </svg>
  <div id="fallback" hidden>
    Схема должна была показать: при d(a,p)=0.3, margin=0.2 и d(a,n)=0.9
    loss равен 0; при d(a,n)=0.4 loss равен 0.1.
  </div>
</figure>

<script>
const DATA = {
  axisEnd: .96,
  radius: .018,
  ringRadius: .029,
  tickHalf: .075,
  marginTop: -.14,
  marginBottom: .14,
  thresholdTop: -.25,
  thresholdBottom: .25,
  positive: .3,
  boundary: .5,
  easyNegative: .9,
  hardNegative: .4,
  easyY: 0,
  hardY: 2.05,
  separatorY: 1.16,
  easyTitle: {x: 0, y: -.48, dx: 0, dy: 0},
  hardTitle: {x: 0, y: 1.53, dx: 0, dy: 0},
  easyMarginLabel: {x: .4, y: -.18, dx: 0, dy: -4},
  hardMarginLabel: {x: .4, y: 1.87, dx: 0, dy: -4},
  easyPointDy: 27,
  hardPointDy: 27,
  easyDistanceAP: {x1: 0, x2: .3, y: .53, labelY: .53, labelDy: -8},
  easyDistanceAN: {x1: 0, x2: .9, y: .77, labelY: .77, labelDy: 17},
  hardDistanceAP: {x1: 0, x2: .3, y: 2.6, labelY: 2.6, labelDy: 16},
  hardDistanceAN: {x1: 0, x2: .4, y: 2.84, labelY: 2.84, labelDy: 16},
  easyBox: {x1: 1.04, y1: -.42, x2: 1.65, y2: .43},
  hardBox: {x1: 1.04, y1: 1.61, x2: 1.65, y2: 2.53},
  boxTextX: 1.08,
  easyText: {titleY: -.23, formulaY: .02, resultY: .27},
  hardText: {titleY: 1.81, formulaY: 2.06, resultY: 2.31},
  legend: {x: 0, y: 3.16, dx: 0, dy: 0},
  labelPad: 8
};
const origin = {x: 94, y: 80};
const scale = {x: 400, y: 108};

function sx(x) { return origin.x + x * scale.x; }
function sy(y) { return origin.y + y * scale.y; }

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";

  function node(name, attrs, content) {
    const item = document.createElementNS(ns, name);
    Object.entries(attrs || {}).forEach(([key, value]) => item.setAttribute(key, value));
    if (content !== undefined) item.textContent = content;
    svg.appendChild(item);
    return item;
  }

  function line(x1, y1, x2, y2, cls) {
    return node("line", {
      x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2), class: cls
    });
  }

  function rect(x1, y1, x2, y2, cls) {
    return node("rect", {
      x: sx(x1), y: sy(y1),
      width: sx(x2) - sx(x1), height: sy(y2) - sy(y1),
      rx: DATA.labelPad, class: cls
    });
  }

  function text(x, y, value, cls, anchor, dx, dy) {
    return node("text", {
      x: sx(x), y: sy(y), class: cls,
      "text-anchor": anchor, dx: dx, dy: dy
    }, value);
  }

  function point(x, y, kind, label, dy) {
    node("circle", {
      cx: sx(x), cy: sy(y),
      r: sx(DATA.radius) - sx(0),
      class: kind + "-dot"
    });
    if (kind === "anchor") {
      node("circle", {
        cx: sx(x), cy: sy(y),
        r: sx(DATA.ringRadius) - sx(0),
        class: "anchor-ring"
      });
    }
    text(x, y, label, "point-label", "middle", 0, dy);
  }

  function dimension(item, label) {
    line(item.x1, item.y, item.x2, item.y, "distance");
    line(item.x1, item.y - DATA.tickHalf, item.x1, item.y + DATA.tickHalf, "tick");
    line(item.x2, item.y - DATA.tickHalf, item.x2, item.y + DATA.tickHalf, "tick");
    text(
      (item.x1 + item.x2) / DATA.boundary,
      item.labelY,
      label,
      "small",
      "middle",
      0,
      item.labelDy
    );
  }

  function row(y, negative, titleSpec, title, marginSpec, negativeLabel, pointDy) {
    rect(DATA.positive, y + DATA.marginTop, DATA.boundary, y + DATA.marginBottom, "margin-band");
    line(0, y, DATA.axisEnd, y, "axis");
    line(DATA.positive, y + DATA.thresholdTop, DATA.positive, y + DATA.thresholdBottom, "guide");
    line(DATA.boundary, y + DATA.thresholdTop, DATA.boundary, y + DATA.thresholdBottom, "threshold");
    line(negative, y + DATA.thresholdBottom, negative, y + DATA.tickHalf, "guide");
    text(titleSpec.x, titleSpec.y, title, "section-title", "start", titleSpec.dx, titleSpec.dy);
    text(
      marginSpec.x, marginSpec.y, "margin = 0.2",
      "margin-label", "middle", marginSpec.dx, marginSpec.dy
    );
    point(0, y, "anchor", "якорь a", pointDy);
    point(DATA.positive, y, "positive", "позитив p", pointDy);
    point(negative, y, "negative", negativeLabel, pointDy);
    text(
      DATA.boundary, y + DATA.thresholdTop,
      "граница p + margin", "small", "middle", 0, -DATA.labelPad
    );
  }

  row(
    DATA.easyY, DATA.easyNegative, DATA.easyTitle,
    "Лёгкий негатив: запас уже соблюдён",
    DATA.easyMarginLabel, "лёгкий негатив n", DATA.easyPointDy
  );
  dimension(DATA.easyDistanceAP, "d(a,p) = 0.3");
  dimension(DATA.easyDistanceAN, "d(a,n) = 0.9");

  rect(
    DATA.easyBox.x1, DATA.easyBox.y1,
    DATA.easyBox.x2, DATA.easyBox.y2,
    "formula-box formula-easy"
  );
  text(
    DATA.boxTextX, DATA.easyText.titleY,
    "Лёгкая тройка", "formula-title", "start", 0, 0
  );
  text(
    DATA.boxTextX, DATA.easyText.formulaY,
    "0.3 − 0.9 + 0.2 = −0.4", "formula", "start", 0, 0
  );
  text(
    DATA.boxTextX, DATA.easyText.resultY,
    "loss = max(0, −0.4) = 0", "formula result-easy", "start", 0, 0
  );

  line(0, DATA.separatorY, DATA.axisEnd, DATA.separatorY, "separator");

  row(
    DATA.hardY, DATA.hardNegative, DATA.hardTitle,
    "Сложный негатив: порядок верный, запаса нет",
    DATA.hardMarginLabel, "сложный негатив n", DATA.hardPointDy
  );
  dimension(DATA.hardDistanceAP, "d(a,p) = 0.3");
  dimension(DATA.hardDistanceAN, "d(a,n) = 0.4");

  rect(
    DATA.hardBox.x1, DATA.hardBox.y1,
    DATA.hardBox.x2, DATA.hardBox.y2,
    "formula-box formula-hard"
  );
  text(
    DATA.boxTextX, DATA.hardText.titleY,
    "Сложная тройка", "formula-title", "start", 0, 0
  );
  text(
    DATA.boxTextX, DATA.hardText.formulaY,
    "0.3 − 0.4 + 0.2 = 0.1", "formula", "start", 0, 0
  );
  text(
    DATA.boxTextX, DATA.hardText.resultY,
    "loss = max(0, 0.1) = 0.1", "formula result-hard", "start", 0, 0
  );

  text(
    DATA.legend.x, DATA.legend.y,
    "Оба расстояния измеряются от одного якоря a.",
    "small", "start", DATA.legend.dx, DATA.legend.dy
  );
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
