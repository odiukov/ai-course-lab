<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Уборка как обязательный шлюз перед генерацией</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fb;
      --panel: #ffffff;
      --panel-soft: #eef3f8;
      --ink: #172033;
      --muted: #586579;
      --line: #63738a;
      --gate: #e7eefb;
      --gate-line: #315b9a;
      --pass: #e4f5e9;
      --pass-line: #24713e;
      --stop: #fbe8e7;
      --stop-line: #a73530;
      --note: #fff5d7;
      --note-line: #967321;
      --arrow: #53657d;
      --shadow: #d5dce7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #1a2331;
        --panel-soft: #202c3b;
        --ink: #edf3fa;
        --muted: #afbed0;
        --line: #8293a9;
        --gate: #1b3150;
        --gate-line: #79a9ed;
        --pass: #173a27;
        --pass-line: #62c984;
        --stop: #442322;
        --stop-line: #ef817a;
        --note: #413619;
        --note-line: #d9b85d;
        --arrow: #9aabc0;
        --shadow: #0b1018;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: unset;
      background: var(--page);
    }

    h1 {
      margin: unset;
      padding: 12px 18px 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--page);
    }

    .check-box {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .check-band {
      fill: var(--panel-soft);
    }

    .check-mark {
      fill: var(--gate-line);
      font-size: 15px;
      font-weight: bold;
    }

    .check-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .check-caption {
      fill: var(--muted);
      font-size: 12px;
    }

    .flow-line {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-head {
      fill: var(--arrow);
    }

    .gate-box {
      fill: var(--gate);
      stroke: var(--gate-line);
      stroke-width: 3px;
    }

    .gate-band {
      fill: var(--gate-line);
    }

    .gate-band-text {
      fill: #ffffff;
      font-size: 12px;
      font-weight: bold;
    }

    .gate-title {
      fill: var(--ink);
      font-size: 22px;
      font-weight: bold;
    }

    .gate-code {
      fill: var(--gate-line);
      font-size: 18px;
      font-weight: bold;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .gate-copy {
      fill: var(--muted);
      font-size: 13px;
    }

    .branch-label {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .pass-box {
      fill: var(--pass);
      stroke: var(--pass-line);
      stroke-width: 3px;
    }

    .pass-kicker,
    .pass-title {
      fill: var(--pass-line);
      font-weight: bold;
    }

    .pass-kicker {
      font-size: 12px;
    }

    .pass-title {
      font-size: 19px;
    }

    .pass-copy {
      fill: var(--ink);
      font-size: 13px;
    }

    .stop-box {
      fill: var(--stop);
      stroke: var(--stop-line);
      stroke-width: 3px;
    }

    .stop-kicker,
    .stop-title {
      fill: var(--stop-line);
      font-weight: bold;
    }

    .stop-kicker {
      font-size: 12px;
    }

    .stop-title {
      font-size: 20px;
    }

    .stop-copy {
      fill: var(--ink);
      font-size: 13px;
    }

    .retry-box {
      fill: var(--note);
      stroke: var(--note-line);
      stroke-width: 2px;
    }

    .retry-icon {
      fill: var(--note-line);
      font-size: 22px;
      font-weight: bold;
    }

    .retry-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .retry-copy {
      fill: var(--muted);
      font-size: 12px;
    }

    #diagram-fallback {
      margin: unset;
      padding: 18px;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--stop-line);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Уборка — обязательный шлюз перед генерацией</h1>
    <svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-describedby="diagram-description">
      <title>Пять проверок чистоты сходятся в clean_state.json</title>
      <desc id="diagram-description">
        Пустой список проблем разрешает генератору создать handoff, а непустой
        список останавливает передачу. После исправления проверки выполняются заново.
      </desc>
      <g id="diagram-root"></g>
    </svg>
    <p id="diagram-fallback" hidden>
      Пять проверок чистоты должны сформировать clean_state.json. Пустой список
      разрешает генерацию handoff, а любая найденная проблема полностью блокирует
      передачу до повторной уборки.
    </p>
  </figure>

  <script>
    const diagramData = Object.freeze({
      checks: [
        { x: 28, y: 34, w: 222, h: 54, cy: 61, targetY: 142,
          mark: "✓", label: "Рабочее дерево", caption: "нет незакоммиченного диффа" },
        { x: 28, y: 101, w: 222, h: 54, cy: 128, targetY: 164,
          mark: "✓", label: "Временные артефакты", caption: "нет tmp и черновиков" },
        { x: 28, y: 168, w: 222, h: 54, cy: 195, targetY: 186,
          mark: "✓", label: "Тесты", caption: "зелёные или риск назван" },
        { x: 28, y: 235, w: 222, h: 54, cy: 262, targetY: 208,
          mark: "✓", label: "Доска фич", caption: "статусы соответствуют фактам" },
        { x: 28, y: 302, w: 222, h: 54, cy: 329, targetY: 230,
          mark: "✓", label: "Ветка", caption: "ожидаемая ветка, не detached HEAD" }
      ],
      checkGeometry: {
        bandW: 34,
        markX: 45,
        labelX: 70,
        labelRise: 5,
        captionDrop: 14,
        routeX: 388,
        approachX: 430
      },
      gate: {
        x: 465, y: 112, w: 300, h: 166,
        bandH: 30,
        centerX: 615,
        bandTextY: 132,
        titleY: 172,
        codeY: 207,
        copyY: 239,
        copySecondY: 258,
        leftX: 465,
        rightX: 765,
        passY: 159,
        stopY: 231
      },
      pass: {
        x: 900, y: 66, w: 270, h: 116,
        centerX: 1035,
        kickerY: 91,
        titleY: 124,
        copyY: 151,
        targetX: 900,
        targetY: 124
      },
      stop: {
        x: 900, y: 224, w: 270, h: 116,
        centerX: 1035,
        kickerY: 249,
        titleY: 282,
        copyY: 309,
        targetX: 900,
        targetY: 282
      },
      branches: {
        elbowX: 835,
        labelX: 786,
        passLabelY: 141,
        stopLabelY: 258,
        passLabel: "список пуст",
        stopLabel: "есть хотя бы одна проблема"
      },
      retry: {
        x: 465, y: 372, w: 705, h: 56,
        iconX: 490,
        iconY: 408,
        titleX: 524,
        titleY: 397,
        copyX: 524,
        copyY: 416,
        title: "Исправить и выполнить уборку заново",
        copy: "Старый результат не даёт разрешения: нужен новый пустой список."
      },
      arrow: {
        back: 13,
        wing: 7
      },
      fallback: {
        x: 600,
        y: 220
      }
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const SVG_NS = "http://www.w3.org/2000/svg";
    const labelPadding = 8;
    const lineThickness = 2;
    const bodyFontSize = 15;

    try {
      const root = document.getElementById("diagram-root");
      const data = diagramData;

      function element(name, attributes, className) {
        const item = document.createElementNS(SVG_NS, name);
        Object.entries(attributes).forEach(([key, value]) => {
          item.setAttribute(key, String(value));
        });
        if (className) item.setAttribute("class", className);
        return item;
      }

      function addRect(parent, box, className) {
        const item = element("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.w) - sx(origin.x),
          height: sy(box.h) - sy(origin.y)
        }, className);
        parent.appendChild(item);
        return item;
      }

      function addText(parent, x, y, value, className, anchor) {
        const item = element("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor
        }, className);
        item.textContent = value;
        parent.appendChild(item);
        return item;
      }

      function addRightArrow(parent, points) {
        const route = element("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
        }, "flow-line");
        route.style.strokeWidth = `${lineThickness}px`;
        parent.appendChild(route);

        const tip = points[points.length - scale.x];
        const head = element("polygon", {
          points: [
            `${sx(tip.x)},${sy(tip.y)}`,
            `${sx(tip.x - data.arrow.back)},${sy(tip.y - data.arrow.wing)}`,
            `${sx(tip.x - data.arrow.back)},${sy(tip.y + data.arrow.wing)}`
          ].join(" ")
        }, "flow-head");
        parent.appendChild(head);
      }

      const arrowsLayer = element("g", {}, "arrows");
      const nodesLayer = element("g", {}, "nodes");
      const labelsLayer = element("g", {}, "labels");
      root.appendChild(arrowsLayer);
      root.appendChild(nodesLayer);
      root.appendChild(labelsLayer);

      data.checks.forEach(check => {
        const checkRight = check.x + check.w;
        addRightArrow(arrowsLayer, [
          { x: checkRight, y: check.cy },
          { x: data.checkGeometry.routeX, y: check.cy },
          { x: data.checkGeometry.approachX, y: check.targetY },
          { x: data.gate.leftX, y: check.targetY }
        ]);
      });

      addRightArrow(arrowsLayer, [
        { x: data.gate.rightX, y: data.gate.passY },
        { x: data.branches.elbowX, y: data.gate.passY },
        { x: data.branches.elbowX, y: data.pass.targetY },
        { x: data.pass.targetX, y: data.pass.targetY }
      ]);

      addRightArrow(arrowsLayer, [
        { x: data.gate.rightX, y: data.gate.stopY },
        { x: data.branches.elbowX, y: data.gate.stopY },
        { x: data.branches.elbowX, y: data.stop.targetY },
        { x: data.stop.targetX, y: data.stop.targetY }
      ]);

      data.checks.forEach(check => {
        addRect(nodesLayer, check, "check-box");
        addRect(nodesLayer, {
          x: check.x,
          y: check.y,
          w: data.checkGeometry.bandW,
          h: check.h
        }, "check-band");

        addText(
          labelsLayer,
          data.checkGeometry.markX,
          check.cy + data.checkGeometry.labelRise,
          check.mark,
          "check-mark",
          "middle"
        );
        addText(
          labelsLayer,
          data.checkGeometry.labelX,
          check.cy - data.checkGeometry.labelRise,
          check.label,
          "check-label",
          "start"
        );
        addText(
          labelsLayer,
          data.checkGeometry.labelX,
          check.cy + data.checkGeometry.captionDrop,
          check.caption,
          "check-caption",
          "start"
        );
      });

      addRect(nodesLayer, data.gate, "gate-box");
      addRect(nodesLayer, {
        x: data.gate.x,
        y: data.gate.y,
        w: data.gate.w,
        h: data.gate.bandH
      }, "gate-band");

      addText(
        labelsLayer,
        data.gate.centerX,
        data.gate.bandTextY,
        "ОБЯЗАТЕЛЬНЫЙ ШЛЮЗ",
        "gate-band-text",
        "middle"
      );
      addText(
        labelsLayer,
        data.gate.centerX,
        data.gate.titleY,
        "Пять проверок",
        "gate-title",
        "middle"
      );
      addText(
        labelsLayer,
        data.gate.centerX,
        data.gate.codeY,
        "clean_state.json",
        "gate-code",
        "middle"
      );
      addText(
        labelsLayer,
        data.gate.centerX,
        data.gate.copyY,
        "issues: список блокирующих проблем",
        "gate-copy",
        "middle"
      );
      addText(
        labelsLayer,
        data.gate.centerX,
        data.gate.copySecondY,
        "его содержимое решает исход",
        "gate-copy",
        "middle"
      );

      addText(
        labelsLayer,
        data.branches.labelX + labelPadding,
        data.branches.passLabelY,
        data.branches.passLabel,
        "branch-label",
        "start"
      );
      addText(
        labelsLayer,
        data.branches.labelX + labelPadding,
        data.branches.stopLabelY,
        data.branches.stopLabel,
        "branch-label",
        "start"
      );

      addRect(nodesLayer, data.pass, "pass-box");
      addText(
        labelsLayer,
        data.pass.centerX,
        data.pass.kickerY,
        "РАЗРЕШЕНО",
        "pass-kicker",
        "middle"
      );
      addText(
        labelsLayer,
        data.pass.centerX,
        data.pass.titleY,
        "Генератор handoff",
        "pass-title",
        "middle"
      );
      addText(
        labelsLayer,
        data.pass.centerX,
        data.pass.copyY,
        "пакет передачи создаётся",
        "pass-copy",
        "middle"
      );

      addRect(nodesLayer, data.stop, "stop-box");
      addText(
        labelsLayer,
        data.stop.centerX,
        data.stop.kickerY,
        "ЗАБЛОКИРОВАНО",
        "stop-kicker",
        "middle"
      );
      addText(
        labelsLayer,
        data.stop.centerX,
        data.stop.titleY,
        "СТОП",
        "stop-title",
        "middle"
      );
      addText(
        labelsLayer,
        data.stop.centerX,
        data.stop.copyY,
        "handoff не записывается",
        "stop-copy",
        "middle"
      );

      addRect(nodesLayer, data.retry, "retry-box");
      addText(
        labelsLayer,
        data.retry.iconX,
        data.retry.iconY,
        "↻",
        "retry-icon",
        "middle"
      );
      addText(
        labelsLayer,
        data.retry.titleX,
        data.retry.titleY,
        data.retry.title,
        "retry-title",
        "start"
      );
      addText(
        labelsLayer,
        data.retry.copyX,
        data.retry.copyY,
        data.retry.copy,
        "retry-copy",
        "start"
      );

      root.style.fontSize = `${bodyFontSize}px`;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("diagram-fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
