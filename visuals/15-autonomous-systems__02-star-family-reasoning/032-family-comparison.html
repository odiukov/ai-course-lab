<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цена и слабые места семейства STaR</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fb;
    --panel: #ffffff;
    --row: #f4f6fa;
    --row-alt: #eef2f7;
    --ink: #18202b;
    --muted: #5d6877;
    --line: #aeb8c6;
    --arrow: #7a8798;
    --blue: #2768d7;
    --blue-soft: #e5efff;
    --amber: #a55b00;
    --amber-soft: #fff0d7;
    --violet: #7251c7;
    --violet-soft: #eee9ff;
    --green: #16724c;
    --green-soft: #e1f5eb;
    --danger: #a33b45;
    --danger-soft: #fde9eb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .diagram {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 20px;
    line-height: 1.25;
    letter-spacing: -0.01em;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--panel);
  }

  .header {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 750;
    letter-spacing: 0.04em;
  }

  .row-bg {
    fill: var(--row);
    stroke: var(--line);
    stroke-width: 1px;
  }

  .row-bg.alt { fill: var(--row-alt); }

  .method {
    font-size: 18px;
    font-weight: 760;
    fill: var(--ink);
  }

  .body {
    font-size: 15px;
    font-weight: 520;
    fill: var(--ink);
  }

  .muted {
    font-size: 13px;
    font-weight: 520;
    fill: var(--muted);
  }

  .cost-box {
    stroke-width: 1.5px;
  }

  .cost {
    font-size: 25px;
    font-weight: 820;
    text-anchor: middle;
  }

  .cost-note {
    font-size: 12px;
    font-weight: 650;
    text-anchor: middle;
  }

  .tone-blue .cost-box {
    fill: var(--blue-soft);
    stroke: var(--blue);
  }

  .tone-blue .cost,
  .tone-blue .cost-note { fill: var(--blue); }

  .tone-amber .cost-box {
    fill: var(--amber-soft);
    stroke: var(--amber);
  }

  .tone-amber .cost,
  .tone-amber .cost-note { fill: var(--amber); }

  .tone-violet .cost-box {
    fill: var(--violet-soft);
    stroke: var(--violet);
  }

  .tone-violet .cost,
  .tone-violet .cost-note { fill: var(--violet); }

  .tone-green .cost-box {
    fill: var(--green-soft);
    stroke: var(--green);
  }

  .tone-green .cost,
  .tone-green .cost-note { fill: var(--green); }

  .data-bad {
    fill: var(--danger-soft);
    stroke: var(--danger);
    stroke-width: 1px;
  }

  .data-good {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-width: 1px;
  }

  .data-mid {
    fill: var(--amber-soft);
    stroke: var(--amber);
    stroke-width: 1px;
  }

  .data-text {
    font-size: 14px;
    font-weight: 680;
    text-anchor: middle;
    fill: var(--ink);
  }

  .arrow-line {
    stroke: var(--arrow);
    stroke-width: 1.5px;
    stroke-linecap: round;
  }

  .arrow-head { fill: var(--arrow); }

  .footer-box {
    fill: var(--violet-soft);
    stroke: var(--violet);
    stroke-width: 1.5px;
  }

  .footer {
    fill: var(--ink);
    font-size: 16px;
    font-weight: 720;
    text-anchor: middle;
  }

  .fallback {
    fill: var(--ink);
    font-size: 17px;
    font-weight: 620;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141a;
      --panel: #171c24;
      --row: #1d2430;
      --row-alt: #222a37;
      --ink: #edf1f7;
      --muted: #aeb9c8;
      --line: #465164;
      --arrow: #8492a7;
      --blue: #80adff;
      --blue-soft: #1d3355;
      --amber: #ffc36a;
      --amber-soft: #49351b;
      --violet: #b8a2ff;
      --violet-soft: #342a55;
      --green: #67d6a4;
      --green-soft: #183d31;
      --danger: #ff929c;
      --danger-soft: #49262d;
    }
  }
</style>
</head>
<body>
<main class="diagram">
  <h1 id="diagram-title">Цена и слабые места семейства STaR</h1>
  <svg id="chart"
       viewBox="0 0 1200 450"
       width="1200"
       height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title"></svg>
</main>

<script>
const diagram = [{
  columns: [
    { x: 25,  w: 160, title: "МЕТОД" },
    { x: 220, w: 280, title: "СИГНАЛ ОБУЧЕНИЯ" },
    { x: 535, w: 160, title: "ЦЕНА ОТВЕТА" },
    { x: 730, w: 170, title: "НЕУДАЧНЫЕ ДАННЫЕ" },
    { x: 935, w: 240, title: "ОСНОВНОЙ РЕЖИМ ОТКАЗА" }
  ],
  headerY: 28,
  rowHeight: 76,
  radius: 8,
  arrowPairs: [[185, 220], [500, 535], [695, 730], [900, 935]],
  arrowInset: 8,
  arrowWing: 5,
  footer: { x: 25, y: 394, w: 1150, h: 40, textX: 600, textY: 420 },
  fallback: [
    { x: 40, y: 110, text: "Схема должна была сравнить STaR, рационализацию," },
    { x: 40, y: 142, text: "V-STaR и Quiet-STaR по сигналу, цене вывода," },
    { x: 40, y: 174, text: "использованию неудач и основному режиму отказа." }
  ]
}, {
  y: 52, cy: 90, alt: false, tone: "tone-blue", dataTone: "data-bad",
  method: [
    { x: 41, y: 84, text: "STaR", cls: "method" }
  ],
  signal: [
    { x: 236, y: 80, text: "Оставить трассу,", cls: "body" },
    { x: 236, y: 103, text: "если ответ верен", cls: "body" }
  ],
  cost: [
    { x: 615, y: 84, text: "1×", cls: "cost" },
    { x: 615, y: 108, text: "одна трасса", cls: "cost-note" }
  ],
  data: [
    { x: 815, y: 81, text: "Все неудачи", cls: "data-text" },
    { x: 815, y: 103, text: "выбрасываются", cls: "data-text" }
  ],
  failure: [
    { x: 951, y: 80, text: "Срез угла:", cls: "body" },
    { x: 951, y: 103, text: "верный ответ, ленивый путь", cls: "body" }
  ]
}, {
  y: 134, cy: 172, alt: true, tone: "tone-amber", dataTone: "data-mid",
  method: [
    { x: 41, y: 161, text: "STaR +", cls: "method" },
    { x: 41, y: 185, text: "рационализация", cls: "body" }
  ],
  signal: [
    { x: 236, y: 162, text: "STaR + повтор с", cls: "body" },
    { x: 236, y: 185, text: "подсказанным ответом", cls: "body" }
  ],
  cost: [
    { x: 615, y: 166, text: "1×", cls: "cost" },
    { x: 615, y: 190, text: "одна трасса", cls: "cost-note" }
  ],
  data: [
    { x: 815, y: 163, text: "Часть неудач", cls: "data-text" },
    { x: 815, y: 185, text: "возвращается", cls: "data-text" }
  ],
  failure: [
    { x: 951, y: 162, text: "Убедительный, но", cls: "body" },
    { x: 951, y: 185, text: "неправдоподобный путь", cls: "body" }
  ]
}, {
  y: 216, cy: 254, alt: false, tone: "tone-violet", dataTone: "data-good",
  method: [
    { x: 41, y: 249, text: "V-STaR", cls: "method" }
  ],
  signal: [
    { x: 236, y: 244, text: "STaR + DPO-судья", cls: "body" },
    { x: 236, y: 267, text: "на обоих классах", cls: "body" }
  ],
  cost: [
    { x: 615, y: 244, text: "N×", cls: "cost" },
    { x: 615, y: 264, text: "Best-of-N; N=8: ≈8", cls: "cost-note" },
    { x: 615, y: 280, text: "прогонов + судья", cls: "cost-note" }
  ],
  data: [
    { x: 815, y: 245, text: "Успех + неудача", cls: "data-text" },
    { x: 815, y: 267, text: "учат судью", cls: "data-text" }
  ],
  failure: [
    { x: 951, y: 244, text: "Судья закрепляет", cls: "body" },
    { x: 951, y: 267, text: "уверенную неправоту", cls: "body" }
  ]
}, {
  y: 298, cy: 336, alt: true, tone: "tone-green", dataTone: "data-good",
  method: [
    { x: 41, y: 331, text: "Quiet-STaR", cls: "method" }
  ],
  signal: [
    { x: 236, y: 326, text: "Обоснование у каждого", cls: "body" },
    { x: 236, y: 349, text: "токена + вес смешивания", cls: "body" }
  ],
  cost: [
    { x: 615, y: 330, text: "1,5–3×", cls: "cost" },
    { x: 615, y: 354, text: "мысли у каждого токена", cls: "cost-note" }
  ],
  data: [
    { x: 815, y: 327, text: "Сигнал используется", cls: "data-text" },
    { x: 815, y: 349, text: "плотнее", cls: "data-text" }
  ],
  failure: [
    { x: 951, y: 326, text: "Градиент всё ещё", cls: "body" },
    { x: 951, y: 349, text: "обусловлен ответом", cls: "body" }
  ]
}];

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const [layout, ...rows] = diagram;
  const svg = document.getElementById("chart");
  const ns = "http://www.w3.org/2000/svg";

  const make = (name, attrs, cls, parent = svg) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    if (cls) node.setAttribute("class", cls);
    parent.appendChild(node);
    return node;
  };

  const label = (item, parent = svg) => {
    const node = make("text", { x: sx(item.x), y: sy(item.y) }, item.cls, parent);
    node.textContent = item.text;
    return node;
  };

  layout.columns.forEach(column => {
    label({ x: column.x, y: layout.headerY, text: column.title, cls: "header" });
  });

  rows.forEach(row => {
    const group = make("g", {}, row.tone);

    layout.columns.forEach(column => {
      make("rect", {
        x: sx(column.x),
        y: sy(row.y),
        width: sx(column.w),
        height: sy(layout.rowHeight),
        rx: sx(layout.radius),
        ry: sy(layout.radius)
      }, row.alt ? "row-bg alt" : "row-bg", group);
    });

    layout.arrowPairs.forEach(pair => {
      const [fromX, toX] = pair;
      make("line", {
        x1: sx(fromX),
        y1: sy(row.cy),
        x2: sx(toX),
        y2: sy(row.cy)
      }, "arrow-line");

      make("polygon", {
        points: [
          [sx(toX), sy(row.cy)],
          [sx(toX - layout.arrowInset), sy(row.cy - layout.arrowWing)],
          [sx(toX - layout.arrowInset), sy(row.cy + layout.arrowWing)]
        ].map(point => point.join(",")).join(" ")
      }, "arrow-head");
    });

    const costColumn = layout.columns.find(column => column.title === "ЦЕНА ОТВЕТА");
    const dataColumn = layout.columns.find(column => column.title === "НЕУДАЧНЫЕ ДАННЫЕ");

    make("rect", {
      x: sx(costColumn.x),
      y: sy(row.y),
      width: sx(costColumn.w),
      height: sy(layout.rowHeight),
      rx: sx(layout.radius),
      ry: sy(layout.radius)
    }, "cost-box", group);

    make("rect", {
      x: sx(dataColumn.x),
      y: sy(row.y),
      width: sx(dataColumn.w),
      height: sy(layout.rowHeight),
      rx: sx(layout.radius),
      ry: sy(layout.radius)
    }, row.dataTone, group);

    row.method.forEach(item => label(item, group));
    row.signal.forEach(item => label(item, group));
    row.cost.forEach(item => label(item, group));
    row.data.forEach(item => label(item, group));
    row.failure.forEach(item => label(item, group));
  });

  make("rect", {
    x: sx(layout.footer.x),
    y: sy(layout.footer.y),
    width: sx(layout.footer.w),
    height: sy(layout.footer.h),
    rx: sx(layout.radius),
    ry: sy(layout.radius)
  }, "footer-box");

  label({
    x: layout.footer.textX,
    y: layout.footer.textY,
    text: "Бесплатного победителя нет: данные ↔ вычисления ↔ характер ошибки",
    cls: "footer"
  });
} catch (error) {
  const svg = document.getElementById("chart");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const [layout] = diagram;
  const ns = "http://www.w3.org/2000/svg";

  layout.fallback.forEach(item => {
    const node = document.createElementNS(ns, "text");
    node.setAttribute("x", sx(item.x));
    node.setAttribute("y", sy(item.y));
    node.setAttribute("class", "fallback");
    node.textContent = item.text;
    svg.appendChild(node);
  });
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
