<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учебный двухступенчатый классификатор</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #eef2f7;
    --canvas: #ffffff;
    --ink: #172033;
    --muted: #536178;
    --line: #64748b;
    --panel: #f7f9fc;
    --fast: #e8f1ff;
    --fast-line: #3973c7;
    --slow: #f4ebff;
    --slow-line: #8053b5;
    --allow: #e4f6ea;
    --allow-line: #25834a;
    --block: #ffebeb;
    --block-line: #bd3a3a;
    --return: #fff3d8;
    --return-line: #a96a08;
    --note: #edf3f8;
    --shadow: #d9e0e8;
    --white: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111827;
      --canvas: #182131;
      --ink: #f1f5f9;
      --muted: #b7c2d3;
      --line: #8fa0b8;
      --panel: #202b3d;
      --fast: #19375c;
      --fast-line: #79adf2;
      --slow: #38284c;
      --slow-line: #c4a0ec;
      --allow: #183d2a;
      --allow-line: #69c98c;
      --block: #4a2328;
      --block-line: #f38a8a;
      --return: #493719;
      --return-line: #e8b65d;
      --note: #233044;
      --shadow: #0e1521;
      --white: #ffffff;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .frame {
    box-sizing: border-box;
    width: 100%;
    max-width: 1200px;
    margin: auto;
    overflow: hidden;
    background: var(--canvas);
    border: 1px solid var(--shadow);
  }

  .heading {
    box-sizing: border-box;
    padding: 12px 18px;
    color: var(--ink);
    background: var(--canvas);
    border-bottom: 1px solid var(--shadow);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--canvas);
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .arrowhead {
    fill: var(--line);
    stroke: none;
  }

  .node {
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .action {
    fill: var(--panel);
    stroke: var(--line);
  }

  .fast {
    fill: var(--fast);
    stroke: var(--fast-line);
  }

  .slow {
    fill: var(--slow);
    stroke: var(--slow-line);
  }

  .allow {
    fill: var(--allow);
    stroke: var(--allow-line);
  }

  .block {
    fill: var(--block);
    stroke: var(--block-line);
  }

  .return {
    fill: var(--return);
    stroke: var(--return-line);
  }

  .note {
    fill: var(--note);
    stroke: var(--shadow);
  }

  .title-text {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .body-text {
    fill: var(--muted);
    font-size: 14px;
  }

  .stage-text {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
  }

  .edge-text {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .outcome-text {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .pill {
    fill: var(--canvas);
    stroke: var(--line);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .pill-text {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .note-main {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .note-sub {
    fill: var(--muted);
    font-size: 13px;
  }

  .fallback {
    padding: 18px;
    color: var(--ink);
    background: var(--canvas);
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="frame">
  <header class="heading">Учебный двухступенчатый классификатор</header>
  <svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Поток действия через быструю и медленную проверки</title>
    <desc id="svg-desc">Действие сначала проверяется по ключевым словам. Большая часть потока разрешается сразу, а подозрительные действия переходят к расширенной проверке правил с исходами разрешить, заблокировать или вернуть пользователю.</desc>
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна была показать поток действия через быструю проверку по ключевым словам, затем через медленную проверку правил, с исходами: разрешить, заблокировать или вернуть пользователю.
  </div>
</main>

<script>
const data = [{
  origin: { x: 40, y: 30 },
  scale: { x: 1, y: 1 },
  last: -1,
  previous: -2,
  radius: 12,
  arrow: { depth: 12, wing: 7 },
  nodes: [
    {
      kind: "action", x: 20, y: 145, w: 150, h: 70,
      lines: [
        { text: "ПРЕДЛОЖЕННОЕ", x: 95, y: 173, cls: "stage-text", anchor: "middle" },
        { text: "ДЕЙСТВИЕ", x: 95, y: 198, cls: "title-text", anchor: "middle" }
      ]
    },
    {
      kind: "fast", x: 220, y: 115, w: 230, h: 125,
      lines: [
        { text: "СТУПЕНЬ 1", x: 335, y: 142, cls: "stage-text", anchor: "middle" },
        { text: "Быстрая проверка", x: 335, y: 169, cls: "title-text", anchor: "middle" },
        { text: "по ключевым словам", x: 335, y: 195, cls: "body-text", anchor: "middle" },
        { text: "дёшево и грубо", x: 335, y: 220, cls: "body-text", anchor: "middle" }
      ]
    },
    {
      kind: "slow", x: 520, y: 115, w: 260, h: 125,
      lines: [
        { text: "СТУПЕНЬ 2", x: 650, y: 142, cls: "stage-text", anchor: "middle" },
        { text: "Медленная проверка", x: 650, y: 169, cls: "title-text", anchor: "middle" },
        { text: "расширенный набор правил", x: 650, y: 195, cls: "body-text", anchor: "middle" },
        { text: "внимательно и дороже", x: 650, y: 220, cls: "body-text", anchor: "middle" }
      ]
    },
    {
      kind: "allow", x: 900, y: 30, w: 180, h: 75,
      lines: [
        { text: "РАЗРЕШИТЬ", x: 990, y: 63, cls: "outcome-text", anchor: "middle" },
        { text: "действие проходит", x: 990, y: 85, cls: "body-text", anchor: "middle" }
      ]
    },
    {
      kind: "block", x: 900, y: 145, w: 180, h: 75,
      lines: [
        { text: "ЗАБЛОКИРОВАТЬ", x: 990, y: 178, cls: "outcome-text", anchor: "middle" },
        { text: "правило нарушено", x: 990, y: 200, cls: "body-text", anchor: "middle" }
      ]
    },
    {
      kind: "return", x: 900, y: 260, w: 180, h: 75,
      lines: [
        { text: "ВЕРНУТЬ", x: 990, y: 289, cls: "outcome-text", anchor: "middle" },
        { text: "ПОЛЬЗОВАТЕЛЮ", x: 990, y: 310, cls: "outcome-text", anchor: "middle" },
        { text: "нужно уточнение", x: 990, y: 328, cls: "body-text", anchor: "middle" }
      ]
    }
  ],
  flows: [
    {
      points: [{ x: 170, y: 180 }, { x: 220, y: 180 }]
    },
    {
      points: [
        { x: 450, y: 140 }, { x: 490, y: 140 },
        { x: 490, y: 68 }, { x: 900, y: 68 }
      ]
    },
    {
      points: [{ x: 450, y: 205 }, { x: 520, y: 205 }]
    },
    {
      points: [
        { x: 780, y: 145 }, { x: 840, y: 145 },
        { x: 840, y: 90 }, { x: 900, y: 90 }
      ]
    },
    {
      points: [{ x: 780, y: 183 }, { x: 900, y: 183 }]
    },
    {
      points: [
        { x: 780, y: 220 }, { x: 840, y: 220 },
        { x: 840, y: 298 }, { x: 900, y: 298 }
      ]
    }
  ],
  labels: [
    {
      text: "ничего настораживающего", x: 475, y: 128,
      ox: 0, oy: -7, anchor: "start", cls: "edge-text"
    },
    {
      text: "подозрительный сигнал", x: 485, y: 218,
      ox: 0, oy: 13, anchor: "middle", cls: "edge-text"
    },
    {
      text: "безопасно", x: 798, y: 135,
      ox: 5, oy: -6, anchor: "start", cls: "edge-text"
    },
    {
      text: "нарушение", x: 798, y: 183,
      ox: 5, oy: 18, anchor: "start", cls: "edge-text"
    },
    {
      text: "нужно уточнить", x: 798, y: 220,
      ox: 5, oy: 18, anchor: "start", cls: "edge-text"
    }
  ],
  pills: [
    { x: 646, y: 43, w: 112, h: 34, text: "95 из 100", tx: 702, ty: 66 },
    { x: 454, y: 172, w: 96, h: 29, text: "5 из 100", tx: 502, ty: 192 }
  ],
  note: {
    x: 150, y: 355, w: 780, h: 48,
    lines: [
      {
        text: "Быстрая ступень решает, где тратить вычисления.",
        x: 540, y: 376, cls: "note-main", anchor: "middle"
      },
      {
        text: "Слишком чувствительная → медленно; слишком мягкая → промахи.",
        x: 540, y: 395, cls: "note-sub", anchor: "middle"
      }
    ]
  }
}];

const [D] = data;
const origin = Object.freeze(D.origin);
const scale = Object.freeze(D.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  const make = (tag, attrs, text) => {
    const item = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([name, value]) => item.setAttribute(name, value));
    if (text !== undefined) item.textContent = text;
    return item;
  };

  const layer = name => {
    const group = make("g", { "data-layer": name });
    svg.appendChild(group);
    return group;
  };

  const flowLayer = layer("поток");
  const nodeLayer = layer("ступени-и-исходы");
  const labelLayer = layer("подписи");

  const drawArrow = points => {
    const line = make("polyline", {
      class: "flow",
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
    });
    flowLayer.appendChild(line);

    const end = points.at(D.last);
    const before = points.at(D.previous);
    const vx = end.x - before.x;
    const vy = end.y - before.y;
    const length = Math.hypot(vx, vy);
    const ux = vx / length;
    const uy = vy / length;
    const baseX = end.x - ux * D.arrow.depth;
    const baseY = end.y - uy * D.arrow.depth;
    const left = {
      x: baseX - uy * D.arrow.wing,
      y: baseY + ux * D.arrow.wing
    };
    const right = {
      x: baseX + uy * D.arrow.wing,
      y: baseY - ux * D.arrow.wing
    };

    flowLayer.appendChild(make("polygon", {
      class: "arrowhead",
      points: [
        `${sx(end.x)},${sy(end.y)}`,
        `${sx(left.x)},${sy(left.y)}`,
        `${sx(right.x)},${sy(right.y)}`
      ].join(" ")
    }));
  };

  D.flows.forEach(flow => drawArrow(flow.points));

  const drawText = (entry, parent) => {
    parent.appendChild(make("text", {
      x: sx(entry.x) + entry.ox,
      y: sy(entry.y) + entry.oy,
      class: entry.cls,
      "text-anchor": entry.anchor
    }, entry.text));
  };

  D.nodes.forEach(node => {
    nodeLayer.appendChild(make("rect", {
      x: sx(node.x),
      y: sy(node.y),
      width: sx(node.x + node.w) - sx(node.x),
      height: sy(node.y + node.h) - sy(node.y),
      rx: sx(D.radius) - sx(0),
      ry: sy(D.radius) - sy(0),
      class: `node ${node.kind}`
    }));
    node.lines.forEach(line => drawText({ ...line, ox: 0, oy: 0 }, nodeLayer));
  });

  D.pills.forEach(pill => {
    labelLayer.appendChild(make("rect", {
      x: sx(pill.x),
      y: sy(pill.y),
      width: sx(pill.x + pill.w) - sx(pill.x),
      height: sy(pill.y + pill.h) - sy(pill.y),
      rx: sx(pill.h) - sx(pill.y - pill.y),
      ry: sy(pill.h) - sy(pill.y - pill.y),
      class: "pill"
    }));
    labelLayer.appendChild(make("text", {
      x: sx(pill.tx),
      y: sy(pill.ty),
      class: "pill-text",
      "text-anchor": "middle"
    }, pill.text));
  });

  D.labels.forEach(label => drawText(label, labelLayer));

  nodeLayer.appendChild(make("rect", {
    x: sx(D.note.x),
    y: sy(D.note.y),
    width: sx(D.note.x + D.note.w) - sx(D.note.x),
    height: sy(D.note.y + D.note.h) - sy(D.note.y),
    rx: sx(D.radius) - sx(0),
    ry: sy(D.radius) - sy(0),
    class: "node note"
  }));
  D.note.lines.forEach(line => drawText({ ...line, ox: 0, oy: 0 }, labelLayer));

  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
