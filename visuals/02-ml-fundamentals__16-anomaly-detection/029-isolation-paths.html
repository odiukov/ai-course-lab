<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Короткий путь выдаёт аномалию</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5d687c;
      --axis: #8792a6;
      --point: #53657d;
      --normal: #087f8c;
      --normal-soft: #d9f1f1;
      --anomaly: #d73535;
      --anomaly-soft: #fde3e3;
      --common-cut: #7d8797;
      --normal-cut: #1595a3;
      --anomaly-cut: #df3f3f;
      --border: #cbd3df;
      --label-back: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182131;
        --ink: #edf2f8;
        --muted: #aab6c7;
        --axis: #718097;
        --point: #9aabc1;
        --normal: #55d5dc;
        --normal-soft: #153c43;
        --anomaly: #ff7373;
        --anomaly-soft: #4a242b;
        --common-cut: #9aa7b9;
        --normal-cut: #50cbd2;
        --anomaly-cut: #ff7474;
        --border: #38465a;
        --label-back: #182131;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: unset;
      padding: 12px 16px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    figcaption {
      margin: unset;
      padding: 2px 4px 10px;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.25;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .axis,
    .boundary,
    .cut {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2px;
    }

    .boundary {
      stroke: var(--border);
      stroke-width: 1px;
    }

    .cut {
      stroke-linecap: round;
      stroke-width: 3px;
    }

    .cut-common {
      stroke: var(--common-cut);
    }

    .cut-normal {
      stroke: var(--normal-cut);
    }

    .cut-anomaly {
      stroke: var(--anomaly-cut);
    }

    .normal-zone {
      fill: var(--normal-soft);
      stroke: var(--normal);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .anomaly-zone {
      fill: var(--anomaly-soft);
      stroke: var(--anomaly);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .cloud-point {
      fill: var(--point);
      stroke: var(--panel);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .normal-target-ring {
      fill: var(--panel);
      stroke: var(--normal);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .normal-target {
      fill: var(--normal);
    }

    .anomaly-ring {
      fill: var(--panel);
      stroke: var(--anomaly);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .anomaly-point {
      fill: var(--anomaly);
    }

    text {
      font-family: inherit;
      fill: var(--ink);
    }

    .section-label {
      font-size: 17px;
      font-weight: 700;
    }

    .point-label {
      font-size: 16px;
      font-weight: 700;
      paint-order: stroke;
      stroke: var(--label-back);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .explain-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 600;
      paint-order: stroke;
      stroke: var(--label-back);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .cut-number {
      font-size: 14px;
      font-weight: 800;
      paint-order: stroke;
      stroke: var(--label-back);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .normal-number {
      fill: var(--normal);
    }

    .anomaly-number {
      fill: var(--anomaly);
    }

    .common-number {
      fill: var(--common-cut);
    }

    .axis-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback {
      padding: 18px;
      color: var(--ink);
      font-size: 16px;
    }

    noscript {
      display: block;
      padding: 18px;
      color: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <figcaption id="diagram-heading">Короткий путь выдаёт аномалию</figcaption>
    <svg id="diagram" viewBox="0 0 960 430" width="960" height="430"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Изоляция обычной точки и аномалии случайными разрезами</title>
      <desc id="svg-desc">
        Удалённая красная точка отделяется после второго разреза, а обычная
        точка внутри плотного облака остаётся вместе с соседями до восьмого.
      </desc>
    </svg>
    <noscript>
      Схема должна показать: удалённая красная точка изолируется за 2–3
      разреза, а точке в плотном облаке требуется около 8 разрезов.
    </noscript>
  </figure>

  <script>
    const data = {
      math: {
        zero: 0,
        plotRight: 10,
        plotTop: 7,
        plotBottom: 0,
        pointRadius: 0.052,
        targetRadius: 0.072,
        ringRadius: 0.13
      },
      zones: [
        { kind: "anomaly-zone", left: 6.5, right: 9.55, bottom: 1.55, top: 6.45 },
        { kind: "normal-zone", left: 2.7, right: 4.6, bottom: 2.6, top: 4.5 }
      ],
      points: [
        { x: 1.18, y: 1.16 }, { x: 2.18, y: 1.08 },
        { x: 3.72, y: 1.22 }, { x: 4.82, y: 1.12 },
        { x: 1.02, y: 2.28 }, { x: 1.34, y: 2.86 },
        { x: 1.12, y: 3.62 }, { x: 1.42, y: 4.34 },
        { x: 1.18, y: 5.08 }, { x: 1.48, y: 5.82 },
        { x: 1.84, y: 2.34 }, { x: 2.22, y: 2.42 },
        { x: 2.62, y: 2.38 }, { x: 3.18, y: 2.42 },
        { x: 3.76, y: 2.34 }, { x: 4.32, y: 2.44 },
        { x: 4.86, y: 2.36 }, { x: 5.22, y: 2.72 },
        { x: 1.82, y: 3.08 }, { x: 2.28, y: 3.18 },
        { x: 2.58, y: 3.72 }, { x: 4.66, y: 3.28 },
        { x: 5.04, y: 3.64 }, { x: 5.42, y: 3.22 },
        { x: 1.92, y: 4.02 }, { x: 2.54, y: 4.04 },
        { x: 4.68, y: 4.02 }, { x: 5.16, y: 4.38 },
        { x: 5.54, y: 4.02 }, { x: 1.76, y: 4.76 },
        { x: 2.16, y: 4.92 }, { x: 2.66, y: 4.72 },
        { x: 3.14, y: 4.76 }, { x: 3.72, y: 4.84 },
        { x: 4.22, y: 4.78 }, { x: 4.82, y: 4.92 },
        { x: 5.32, y: 4.76 }, { x: 1.92, y: 5.32 },
        { x: 2.42, y: 5.64 }, { x: 2.98, y: 5.76 },
        { x: 3.48, y: 5.66 }, { x: 4.02, y: 5.86 },
        { x: 4.54, y: 5.68 }, { x: 5.02, y: 5.48 },
        { x: 2.18, y: 6.08 }, { x: 2.82, y: 6.18 },
        { x: 3.42, y: 6.04 }, { x: 4.12, y: 6.16 },
        { x: 4.76, y: 6.02 }
      ],
      targets: [
        { kind: "normal", x: 3.3, y: 4.08 },
        { kind: "anomaly", x: 8.28, y: 4.92 }
      ],
      cuts: [
        { label: "1", kind: "common", x1: 0.5, y1: 1.55, x2: 9.55, y2: 1.55,
          lx: 0.72, ly: 1.55, dx: 0, dy: -8 },
        { label: "2", kind: "anomaly", x1: 6.5, y1: 1.55, x2: 6.5, y2: 6.45,
          lx: 6.5, ly: 6.12, dx: 10, dy: 0 },
        { label: "3", kind: "normal", x1: 1.6, y1: 1.55, x2: 1.6, y2: 6.45,
          lx: 1.6, ly: 6.12, dx: 10, dy: 0 },
        { label: "4", kind: "normal", x1: 1.6, y1: 5.5, x2: 6.5, y2: 5.5,
          lx: 1.82, ly: 5.5, dx: 0, dy: -8 },
        { label: "5", kind: "normal", x1: 4.6, y1: 1.55, x2: 4.6, y2: 5.5,
          lx: 4.6, ly: 5.18, dx: 10, dy: 0 },
        { label: "6", kind: "normal", x1: 1.6, y1: 2.6, x2: 4.6, y2: 2.6,
          lx: 1.84, ly: 2.6, dx: 0, dy: -8 },
        { label: "7", kind: "normal", x1: 2.7, y1: 2.6, x2: 2.7, y2: 5.5,
          lx: 2.7, ly: 3.02, dx: 10, dy: 0 },
        { label: "8", kind: "normal", x1: 2.7, y1: 4.5, x2: 4.6, y2: 4.5,
          lx: 2.92, ly: 4.5, dx: 0, dy: -8 }
      ],
      labels: [
        { text: "Плотное облако нормальных точек", cls: "section-label",
          x: 0.46, y: 6.68, dx: 0, dy: 0, anchor: "start" },
        { text: "разрезы 3–8 дробят всё меньшую область", cls: "explain-label",
          x: 2.04, y: 6.38, dx: 0, dy: 0, anchor: "start" },
        { text: "обычная точка · путь ≈ 8", cls: "point-label",
          x: 3.3, y: 4.08, dx: 14, dy: 19, anchor: "start" },
        { text: "аномалия · путь 2–3", cls: "point-label",
          x: 8.28, y: 4.92, dx: 0, dy: -20, anchor: "middle" },
        { text: "большая пустая область", cls: "explain-label",
          x: 8.28, y: 4.92, dx: 0, dy: 28, anchor: "middle" },
        { text: "путь = сколько разрезов понадобилось для изоляции",
          cls: "axis-label", x: 5, y: -0.43, dx: 0, dy: 0, anchor: "middle" }
      ]
    };
    const origin = { x: 70, y: 386 };
    const scale = { x: 82, y: 50 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      const make = (tag, attributes, content) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        if (content !== undefined) node.textContent = content;
        return node;
      };

      const addLine = (x1, y1, x2, y2, cls) => {
        svg.appendChild(make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: cls
        }));
      };

      const addRect = zone => {
        svg.appendChild(make("rect", {
          x: sx(zone.left),
          y: sy(zone.top),
          width: sx(zone.right) - sx(zone.left),
          height: sy(zone.bottom) - sy(zone.top),
          class: zone.kind
        }));
      };

      const radius = value =>
        Math.abs(sx(value) - sx(data.math.zero));

      data.zones.forEach(addRect);

      addLine(
        data.math.zero,
        data.math.zero,
        data.math.plotRight,
        data.math.zero,
        "axis"
      );
      addLine(
        data.math.zero,
        data.math.zero,
        data.math.zero,
        data.math.plotTop,
        "axis"
      );
      addLine(
        data.math.zero,
        data.math.plotTop,
        data.math.plotRight,
        data.math.plotTop,
        "boundary"
      );
      addLine(
        data.math.plotRight,
        data.math.plotBottom,
        data.math.plotRight,
        data.math.plotTop,
        "boundary"
      );

      data.cuts.forEach(cut => {
        addLine(
          cut.x1,
          cut.y1,
          cut.x2,
          cut.y2,
          `cut cut-${cut.kind}`
        );
      });

      data.points.forEach(point => {
        svg.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: radius(data.math.pointRadius),
          class: "cloud-point"
        }));
      });

      data.targets.forEach(point => {
        const ringClass = point.kind === "normal"
          ? "normal-target-ring"
          : "anomaly-ring";
        const pointClass = point.kind === "normal"
          ? "normal-target"
          : "anomaly-point";

        svg.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: radius(data.math.ringRadius),
          class: ringClass
        }));
        svg.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: radius(data.math.targetRadius),
          class: pointClass
        }));
      });

      data.cuts.forEach(cut => {
        svg.appendChild(make("text", {
          x: sx(cut.lx),
          y: sy(cut.ly),
          dx: cut.dx,
          dy: cut.dy,
          "text-anchor": "middle",
          "dominant-baseline": "middle",
          class: `cut-number ${cut.kind}-number`
        }, cut.label));
      });

      data.labels.forEach(label => {
        svg.appendChild(make("text", {
          x: sx(label.x),
          y: sy(label.y),
          dx: label.dx,
          dy: label.dy,
          "text-anchor": label.anchor,
          "dominant-baseline": "middle",
          class: label.cls
        }, label.text));
      });
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.createElement("p");
      fallback.className = "fallback";
      fallback.textContent =
        "Схема должна показать: удалённая красная точка изолируется за 2–3 разреза, а точке в плотном облаке требуется около 8 разрезов.";
      svg.replaceWith(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
