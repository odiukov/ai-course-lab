<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три способа быть аномалией</title>
<style>
:root {
  color-scheme: light dark;
  --page: #f7f8fc;
  --panel: #ffffff;
  --ink: #172033;
  --muted: #59657a;
  --line: #7e8aa2;
  --point: #e65353;
  --point-soft: #fff0f0;
  --context: #d98b17;
  --context-soft: #fff7df;
  --collective: #8a55d6;
  --collective-soft: #f6efff;
  --hub: #24324a;
  --hub-text: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #11151d;
    --panel: #191f2a;
    --ink: #edf2ff;
    --muted: #aeb9ce;
    --line: #748198;
    --point: #ff7777;
    --point-soft: #382226;
    --context: #f2ad45;
    --context-soft: #392f1d;
    --collective: #bd8aff;
    --collective-soft: #302442;
    --hub: #dce6fb;
    --hub-text: #172033;
  }
}
* {
  box-sizing: border-box;
}
html, body {
  background: var(--page);
  color: var(--ink);
}
body {
  margin: unset;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}
.figure {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  overflow: hidden;
}
h1 {
  margin: unset;
  padding: 12px 16px 8px;
  font-size: 21px;
  text-align: center;
  background: var(--panel);
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 450px;
  background: var(--panel);
}
.branch {
  fill: none;
  stroke: var(--line);
  stroke-linecap: round;
}
.card {
  stroke-width: 2px;
}
.point-card {
  fill: var(--point-soft);
  stroke: var(--point);
}
.context-card {
  fill: var(--context-soft);
  stroke: var(--context);
}
.collective-card {
  fill: var(--collective-soft);
  stroke: var(--collective);
}
.hub {
  fill: var(--hub);
}
.hub-title {
  fill: var(--hub-text);
  font-size: 22px;
  font-weight: bold;
}
.hub-note {
  fill: var(--hub-text);
  font-size: 14px;
}
.branch-label {
  fill: var(--muted);
  font-size: 13px;
  font-weight: bold;
}
.type {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
}
.point-ink {
  fill: var(--point);
}
.context-ink {
  fill: var(--context);
}
.collective-ink {
  fill: var(--collective);
}
.value {
  fill: var(--ink);
  font-size: 35px;
  font-weight: bold;
}
.sequence-value {
  fill: var(--ink);
  font-size: 23px;
  font-weight: bold;
}
.explanation {
  fill: var(--muted);
  font-size: 15px;
}
.rule {
  stroke: var(--line);
  stroke-width: 1px;
}
.unit-caption {
  fill: var(--muted);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}
.unit {
  fill: var(--ink);
  font-size: 17px;
  font-weight: bold;
}
.icon-ring {
  fill: var(--panel);
  stroke-width: 2px;
}
.dot {
  fill: var(--collective);
}
.fallback {
  fill: var(--ink);
  font-size: 18px;
}
</style>
</head>
<body>
<main class="figure" aria-labelledby="diagram-title">
  <h1 id="diagram-title">Три способа быть аномалией</h1>
  <svg id="diagram" viewBox="0 0 1200 450" width="1200" height="450"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три ветви аномалий: значение 500 градусов, 90 градусов по Фаренгейту зимой и последовательность из 50 неудачных входов">
    <title>Три способа быть аномалией</title>
    <desc>Точечная аномалия заметна в одном значении, контекстная — вместе с обстоятельствами, коллективная — в последовательности.</desc>
  </svg>
</main>
<script>
const diagramData = {
  hub: {
    x: 420, y: 12, w: 360, h: 72, rx: 16,
    titleY: 40, noteY: 64,
    title: "Где спрятана странность?",
    note: "Выбери единицу сравнения"
  },
  branches: {
    rootX: 600, rootY: 84, bendY: 118, endY: 151,
    arrowHalf: 8, arrowTop: 140,
    items: [
      {x: 220, labelX: 220, labelY: 113, label: "САМО ЗНАЧЕНИЕ", color: "point"},
      {x: 600, labelX: 616, labelY: 126, label: "ОБСТОЯТЕЛЬСТВА", color: "context"},
      {x: 980, labelX: 980, labelY: 113, label: "ПОВТОРЕНИЕ ПОДРЯД", color: "collective"}
    ]
  },
  cards: [
    {
      kind: "point", x: 45, y: 155, w: 350, h: 270, rx: 18,
      iconX: 82, iconY: 190, iconR: 15,
      typeX: 108, typeY: 195, type: "ТОЧЕЧНАЯ",
      valueX: 220, valueY: 258, value: "500 °C",
      noteX: 220, noteY: 288, note: "странно само по себе",
      ruleX1: 75, ruleX2: 365, ruleY: 320,
      captionX: 220, captionY: 348, caption: "ЕДИНИЦА СРАВНЕНИЯ",
      unitX: 220, unitY: 380, unit: "одно значение"
    },
    {
      kind: "context", x: 425, y: 155, w: 350, h: 270, rx: 18,
      iconX: 462, iconY: 190, iconR: 15,
      typeX: 488, typeY: 195, type: "КОНТЕКСТНАЯ",
      valueX: 600, valueY: 248, value: "90 °F",
      badgeX: 553, badgeY: 264, badgeW: 94, badgeH: 28, badgeR: 14,
      badgeTextX: 600, badgeTextY: 284, badge: "ЗИМОЙ",
      noteX: 600, noteY: 309, note: "норма летом, аномалия зимой",
      ruleX1: 455, ruleX2: 745, ruleY: 328,
      captionX: 600, captionY: 352, caption: "ЕДИНИЦА СРАВНЕНИЯ",
      unitX: 600, unitY: 382, unit: "значение + контекст"
    },
    {
      kind: "collective", x: 805, y: 155, w: 350, h: 270, rx: 18,
      iconX: 842, iconY: 190, iconR: 15,
      typeX: 868, typeY: 195, type: "КОЛЛЕКТИВНАЯ",
      valueX: 980, valueY: 230, value: "50 неудачных входов",
      dotsX: 848, dotsY: 250, columns: 25, rows: 2,
      dotGapX: 11, dotGapY: 15, dotR: 3,
      noteX: 980, noteY: 295, note: "каждый допустим, серия — нет",
      ruleX1: 835, ruleX2: 1125, ruleY: 320,
      captionX: 980, captionY: 348, caption: "ЕДИНИЦА СРАВНЕНИЯ",
      unitX: 980, unitY: 380, unit: "целая последовательность",
      count: 50
    }
  ],
  canvas: {x: 0, y: 0, w: 1200, h: 450},
  fallback: {
    x: 600,
    lines: [
      {y: 190, text: "Схема: 500 °C — странно само по себе."},
      {y: 225, text: "90 °F — странно зимой."},
      {y: 260, text: "50 неудачных входов — странная последовательность."}
    ]
  }
};
const origin = Object.freeze({x: 0, y: 0});
const scale = Object.freeze({x: 1, y: 1});
const canvasWidth = 1200;
const canvasHeight = 450;
const labelPadding = 8;
const lineWidth = 4;
const fontSize = 18;

function sx(x) {
  return origin.x + x * scale.x;
}
function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";

  function make(tag, attributes, className) {
    const node = document.createElementNS(ns, tag);
    Object.entries(attributes).forEach(([name, value]) => node.setAttribute(name, value));
    if (className) node.setAttribute("class", className);
    return node;
  }

  function addText(parent, x, y, value, className, anchor) {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor
    }, className);
    node.textContent = value;
    parent.appendChild(node);
    return node;
  }

  function addRect(parent, item, className) {
    const node = make("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.x + item.w) - sx(item.x),
      height: sy(item.y + item.h) - sy(item.y),
      rx: sx(item.rx) - sx(origin.x),
      ry: sy(item.rx) - sy(origin.y)
    }, className);
    parent.appendChild(node);
    return node;
  }

  function addCircle(parent, x, y, radius, className) {
    const node = make("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(radius) - sx(origin.x)
    }, className);
    parent.appendChild(node);
    return node;
  }

  function addLine(parent, x1, y1, x2, y2, className) {
    const node = make("line", {
      x1: sx(x1), y1: sy(y1),
      x2: sx(x2), y2: sy(y2)
    }, className);
    parent.appendChild(node);
    return node;
  }

  const background = make("rect", {
    x: sx(diagramData.canvas.x),
    y: sy(diagramData.canvas.y),
    width: sx(diagramData.canvas.w) - sx(diagramData.canvas.x),
    height: sy(diagramData.canvas.h) - sy(diagramData.canvas.y)
  });
  background.setAttribute("fill", "var(--panel)");
  svg.appendChild(background);

  const branchesLayer = make("g", {});
  const cardsLayer = make("g", {});
  svg.append(branchesLayer, cardsLayer);

  const hub = addRect(branchesLayer, diagramData.hub, "hub");
  hub.setAttribute("stroke-width", lineWidth);
  addText(branchesLayer, diagramData.hub.x + diagramData.hub.w / diagramData.branches.items.length,
    diagramData.hub.titleY, diagramData.hub.title, "hub-title", "middle");
  addText(branchesLayer, diagramData.hub.x + diagramData.hub.w / diagramData.branches.items.length,
    diagramData.hub.noteY, diagramData.hub.note, "hub-note", "middle");

  diagramData.branches.items.forEach((branch) => {
    const path = make("path", {
      d: [
        "M", sx(diagramData.branches.rootX), sy(diagramData.branches.rootY),
        "C", sx(diagramData.branches.rootX), sy(diagramData.branches.bendY),
        sx(branch.x), sy(diagramData.branches.bendY),
        sx(branch.x), sy(diagramData.branches.endY)
      ].join(" "),
      "stroke-width": lineWidth
    }, "branch");
    branchesLayer.appendChild(path);

    const arrow = make("polygon", {
      points: [
        [branch.x, diagramData.branches.endY],
        [branch.x - diagramData.branches.arrowHalf, diagramData.branches.arrowTop],
        [branch.x + diagramData.branches.arrowHalf, diagramData.branches.arrowTop]
      ].map((point) => `${sx(point.shift())},${sy(point.pop())}`).join(" "),
      fill: `var(--${branch.color})`
    });
    branchesLayer.appendChild(arrow);
    addText(branchesLayer, branch.labelX, branch.labelY, branch.label,
      "branch-label", "middle");
  });

  diagramData.cards.forEach((card) => {
    addRect(cardsLayer, card, `card ${card.kind}-card`);
    addCircle(cardsLayer, card.iconX, card.iconY, card.iconR,
      `icon-ring ${card.kind}-ink`);
    addCircle(cardsLayer, card.iconX, card.iconY,
      card.iconR - labelPadding, `${card.kind}-ink`);
    addText(cardsLayer, card.typeX, card.typeY, card.type,
      `type ${card.kind}-ink`, "start");

    addText(cardsLayer, card.valueX, card.valueY, card.value,
      card.kind === "collective" ? "sequence-value" : "value", "middle");

    if (card.kind === "context") {
      addRect(cardsLayer, {
        x: card.badgeX, y: card.badgeY, w: card.badgeW,
        h: card.badgeH, rx: card.badgeR
      }, "context-ink");
      const badge = addText(cardsLayer, card.badgeTextX, card.badgeTextY,
        card.badge, "branch-label", "middle");
      badge.setAttribute("fill", "var(--panel)");
    }

    if (card.kind === "collective") {
      Array.from({length: card.count}).forEach((unused, index) => {
        const column = index % card.columns;
        const row = Math.floor(index / card.columns);
        addCircle(cardsLayer,
          card.dotsX + column * card.dotGapX,
          card.dotsY + row * card.dotGapY,
          card.dotR, "dot");
      });
    }

    addText(cardsLayer, card.noteX, card.noteY, card.note,
      "explanation", "middle");
    addLine(cardsLayer, card.ruleX1, card.ruleY,
      card.ruleX2, card.ruleY, "rule");
    addText(cardsLayer, card.captionX, card.captionY, card.caption,
      "unit-caption", "middle");
    addText(cardsLayer, card.unitX, card.unitY, card.unit,
      "unit", "middle");
  });
} catch (error) {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  while (svg.lastChild && svg.lastChild.tagName !== "desc") {
    svg.removeChild(svg.lastChild);
  }
  diagramData.fallback.lines.forEach((line) => {
    const text = document.createElementNS(ns, "text");
    text.setAttribute("x", sx(diagramData.fallback.x));
    text.setAttribute("y", sy(line.y));
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "fallback");
    text.setAttribute("font-size", fontSize);
    text.textContent = line.text;
    svg.appendChild(text);
  });
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
