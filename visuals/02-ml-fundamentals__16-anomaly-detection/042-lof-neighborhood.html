<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глобальная редкость и локальное одиночество</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: ivory;
    --panel: whitesmoke;
    --panel-stroke: lightsteelblue;
    --text: midnightblue;
    --muted: slategray;
    --dense: steelblue;
    --sparse: mediumpurple;
    --normal-halo: slateblue;
    --outlier: darkorange;
    --outlier-soft: moccasin;
    --link-normal: mediumslateblue;
    --link-outlier: chocolate;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --panel: #182235;
      --panel-stroke: #52627a;
      --text: #edf2f7;
      --muted: #b8c2d1;
      --dense: #65b5e8;
      --sparse: #b59aee;
      --normal-halo: #a7a1ff;
      --outlier: #ffad42;
      --outlier-soft: #543719;
      --link-normal: #a79cff;
      --link-outlier: #ff9b45;
    }
  }

  html,
  body {
    background: var(--bg);
    color: var(--text);
  }

  figure {
    background: var(--bg);
    margin: 0;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    overflow: hidden;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .heading {
    fill: var(--text);
    font-size: 24px;
    font-weight: bold;
  }

  .cluster-label {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .callout {
    fill: var(--text);
    font-size: 16px;
    font-weight: bold;
  }

  .legend {
    fill: var(--muted);
    font-size: 16px;
  }

  .fallback {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--panel-stroke);
    stroke-width: 1.5px;
  }

  .halo {
    fill: none;
    stroke-width: 2.5px;
  }

  .neighbor-link {
    fill: none;
    stroke-width: 1.5px;
    stroke-linecap: round;
  }

  .leader {
    fill: none;
    stroke-width: 2.5px;
    stroke-linecap: round;
  }
</style>
</head>
<body>
<figure aria-labelledby="svg-title svg-desc">
  <svg id="chart" viewBox="0 0 1200 510" width="1200" height="510"
       preserveAspectRatio="xMidYMid meet" role="img">
    <title id="svg-title">Глобальная редкость и локальное одиночество</title>
    <desc id="svg-desc">
      Плотный кластер из 1000 точек и разреженный кластер из 50 точек.
      В малом кластере одна точка отделена от ближайших соседей заметно
      большим промежутком.
    </desc>

    <text id="heading" class="heading">
      Глобальная редкость и локальное одиночество
    </text>

    <g id="diagram"></g>

    <text id="fallback" class="fallback">
      Схема должна показать кластеры на 1000 и 50 точек и локально одинокую точку.
    </text>
  </svg>
</figure>

<script>
const DATA = [
  {
    originX: 24,
    originY: 486,
    scaleValue: 48,

    zero: 0,
    one: 1,
    two: 2,
    four: 4,
    seven: 7,

    titleX: 12,
    titleY: 9.58,

    denseCount: 1000,
    denseColumns: 40,
    denseCenterX: 6.15,
    denseCenterY: 5.25,
    denseStepX: 0.16,
    denseStepY: 0.18,
    denseJitterX: 0.026,
    denseJitterY: 0.024,
    denseRadius: 0.027,

    sparseCount: 50,
    sparseColumns: 7,
    sparseCenterX: 16.75,
    sparseCenterY: 5.18,
    sparseStepX: 0.52,
    sparseStepY: 0.55,
    sparseJitterX: 0.045,
    sparseJitterY: 0.04,
    sparseRadius: 0.064,
    focusIndex: 24,

    outlierX: 20.35,
    outlierY: 5.28,
    outlierRadius: 0.12,

    normalHaloRadius: 0.86,
    outlierHaloRadius: 0.92,
    dashLength: 0.17,
    dashGap: 0.12,
    neighborCount: 4,

    denseOpacity: 0.72,
    sparseOpacity: 0.88,
    panelOpacity: 0.82,
    haloOpacity: 0.88,
    linkOpacity: 0.55,
    leaderOpacity: 0.9,

    densePanelX: 6.15,
    densePanelY: 5.25,
    densePanelRX: 5.45,
    densePanelRY: 3.05,

    sparsePanelX: 17.65,
    sparsePanelY: 5.25,
    sparsePanelRX: 4.9,
    sparsePanelRY: 3.05,

    normalTailX: 13.25,
    normalTailY: 2.12,
    normalElbowX: 14.62,
    normalElbowY: 2.48,

    outlierTailX: 22.42,
    outlierTailY: 7.32,
    outlierElbowX: 21.55,
    outlierElbowY: 6.86,

    normalLegendX: 2.58,
    normalLegendY: 0.58,
    outlierLegendX: 13.15,
    outlierLegendY: 0.58,
    legendRadius: 0.075,

    fallbackX: 12,
    fallbackY: 5.2
  },
  [
    {
      x: 6.15, y: 8.63, dx: 0, dy: 0,
      text: "Плотный кластер · 1000 точек",
      anchor: "middle", className: "cluster-label"
    },
    {
      x: 17.65, y: 8.63, dx: 0, dy: 0,
      text: "Разреженный кластер · 50 точек",
      anchor: "middle", className: "cluster-label"
    },
    {
      x: 13.18, y: 1.94, dx: 0, dy: 0,
      text: "у соседей так же",
      anchor: "start", className: "callout"
    },
    {
      x: 22.48, y: 7.55, dx: 0, dy: 0,
      text: "локально одинока",
      anchor: "end", className: "callout"
    },
    {
      x: 2.58, y: 0.58, dx: 12, dy: 5,
      text: "LOF ≈ 1 — плотность как у соседей",
      anchor: "start", className: "legend"
    },
    {
      x: 13.15, y: 0.58, dx: 12, dy: 5,
      text: "LOF > 1 — вокруг точки свободнее",
      anchor: "start", className: "legend"
    }
  ]
];

const [cfg, labels] = DATA;
const origin = Object.freeze({ x: cfg.originX, y: cfg.originY });
const scale = cfg.scaleValue;

const sx = x => origin.x + x * scale;
const sy = y => origin.y - y * scale;

const svgNS = "http://www.w3.org/2000/svg";
const diagram = document.getElementById("diagram");
const heading = document.getElementById("heading");
const fallback = document.getElementById("fallback");

heading.setAttribute("x", sx(cfg.titleX));
heading.setAttribute("y", sy(cfg.titleY));
heading.setAttribute("text-anchor", "middle");

fallback.setAttribute("x", sx(cfg.fallbackX));
fallback.setAttribute("y", sy(cfg.fallbackY));
fallback.setAttribute("text-anchor", "middle");

try {
  const make = (name, attributes, className) => {
    const node = document.createElementNS(svgNS, name);
    if (className) node.setAttribute("class", className);
    for (const [key, value] of Object.entries(attributes)) {
      node.setAttribute(key, value);
    }
    return node;
  };

  const circle = (point, radius, fill, opacity, className) =>
    make("circle", {
      cx: sx(point.x),
      cy: sy(point.y),
      r: sx(radius) - sx(cfg.zero),
      fill,
      opacity
    }, className);

  const line = (start, end, stroke, opacity, className) =>
    make("line", {
      x1: sx(start.x),
      y1: sy(start.y),
      x2: sx(end.x),
      y2: sy(end.y),
      stroke,
      opacity
    }, className);

  const nearest = (points, target, count, omitTarget) =>
    points
      .filter(point => !omitTarget || point !== target)
      .map(point => ({
        point,
        distance:
          (point.x - target.x) * (point.x - target.x) +
          (point.y - target.y) * (point.y - target.y)
      }))
      .sort((left, right) => left.distance - right.distance)
      .slice(cfg.zero, count)
      .map(entry => entry.point);

  const densePoints = [];
  const sparsePoints = [];
  let normalFocus;

  for (
    let index = cfg.zero;
    index < cfg.denseCount;
    index += cfg.one
  ) {
    const column = index % cfg.denseColumns;
    const row = Math.floor(index / cfg.denseColumns);
    const centeredColumn =
      column - (cfg.denseColumns - cfg.one) / cfg.two;
    const rowCount = cfg.denseCount / cfg.denseColumns;
    const centeredRow = row - (rowCount - cfg.one) / cfg.two;

    densePoints.push({
      x:
        cfg.denseCenterX +
        centeredColumn * cfg.denseStepX +
        Math.sin(index * cfg.seven) * cfg.denseJitterX,
      y:
        cfg.denseCenterY +
        centeredRow * cfg.denseStepY +
        Math.cos(index * cfg.four) * cfg.denseJitterY
    });
  }

  const regularSparseCount = cfg.sparseCount - cfg.one;

  for (
    let index = cfg.zero;
    index < regularSparseCount;
    index += cfg.one
  ) {
    const column = index % cfg.sparseColumns;
    const row = Math.floor(index / cfg.sparseColumns);
    const centeredColumn =
      column - (cfg.sparseColumns - cfg.one) / cfg.two;
    const centeredRow =
      row - (cfg.sparseColumns - cfg.one) / cfg.two;

    const point = {
      x:
        cfg.sparseCenterX +
        centeredColumn * cfg.sparseStepX +
        Math.sin(index * cfg.four) * cfg.sparseJitterX,
      y:
        cfg.sparseCenterY +
        centeredRow * cfg.sparseStepY +
        Math.cos(index * cfg.seven) * cfg.sparseJitterY
    };

    sparsePoints.push(point);
    if (index === cfg.focusIndex) normalFocus = point;
  }

  const outlier = { x: cfg.outlierX, y: cfg.outlierY };

  const densePanel = make("ellipse", {
    cx: sx(cfg.densePanelX),
    cy: sy(cfg.densePanelY),
    rx: sx(cfg.densePanelRX) - sx(cfg.zero),
    ry: sy(cfg.zero) - sy(cfg.densePanelRY),
    opacity: cfg.panelOpacity
  }, "panel");

  const sparsePanel = make("ellipse", {
    cx: sx(cfg.sparsePanelX),
    cy: sy(cfg.sparsePanelY),
    rx: sx(cfg.sparsePanelRX) - sx(cfg.zero),
    ry: sy(cfg.zero) - sy(cfg.sparsePanelRY),
    opacity: cfg.panelOpacity
  }, "panel");

  diagram.append(densePanel, sparsePanel);

  const normalHalo = circle(
    normalFocus,
    cfg.normalHaloRadius,
    "none",
    cfg.haloOpacity,
    "halo"
  );
  normalHalo.setAttribute("stroke", "var(--normal-halo)");
  normalHalo.setAttribute(
    "stroke-dasharray",
    `${sx(cfg.dashLength) - sx(cfg.zero)} ${sx(cfg.dashGap) - sx(cfg.zero)}`
  );

  const outlierHalo = circle(
    outlier,
    cfg.outlierHaloRadius,
    "none",
    cfg.haloOpacity,
    "halo"
  );
  outlierHalo.setAttribute("stroke", "var(--outlier)");
  outlierHalo.setAttribute(
    "stroke-dasharray",
    `${sx(cfg.dashLength) - sx(cfg.zero)} ${sx(cfg.dashGap) - sx(cfg.zero)}`
  );

  diagram.append(normalHalo, outlierHalo);

  for (const neighbor of nearest(
    sparsePoints,
    normalFocus,
    cfg.neighborCount,
    true
  )) {
    diagram.append(
      line(
        normalFocus,
        neighbor,
        "var(--link-normal)",
        cfg.linkOpacity,
        "neighbor-link"
      )
    );
  }

  for (const neighbor of nearest(
    sparsePoints,
    outlier,
    cfg.neighborCount,
    false
  )) {
    diagram.append(
      line(
        outlier,
        neighbor,
        "var(--link-outlier)",
        cfg.linkOpacity,
        "neighbor-link"
      )
    );
  }

  const denseLayer = make("g", {}, "");
  for (const point of densePoints) {
    denseLayer.append(
      circle(
        point,
        cfg.denseRadius,
        "var(--dense)",
        cfg.denseOpacity,
        ""
      )
    );
  }

  const sparseLayer = make("g", {}, "");
  for (const point of sparsePoints) {
    sparseLayer.append(
      circle(
        point,
        cfg.sparseRadius,
        "var(--sparse)",
        cfg.sparseOpacity,
        ""
      )
    );
  }

  diagram.append(denseLayer, sparseLayer);

  diagram.append(
    circle(
      normalFocus,
      cfg.sparseRadius,
      "var(--normal-halo)",
      cfg.sparseOpacity,
      ""
    )
  );

  const outlierSoft = circle(
    outlier,
    cfg.outlierRadius * cfg.two,
    "var(--outlier-soft)",
    cfg.haloOpacity,
    ""
  );

  const outlierPoint = circle(
    outlier,
    cfg.outlierRadius,
    "var(--outlier)",
    cfg.one,
    ""
  );

  diagram.append(outlierSoft, outlierPoint);

  const normalTail = {
    x: cfg.normalTailX,
    y: cfg.normalTailY
  };
  const normalElbow = {
    x: cfg.normalElbowX,
    y: cfg.normalElbowY
  };
  const outlierTail = {
    x: cfg.outlierTailX,
    y: cfg.outlierTailY
  };
  const outlierElbow = {
    x: cfg.outlierElbowX,
    y: cfg.outlierElbowY
  };

  diagram.append(
    line(
      normalTail,
      normalElbow,
      "var(--normal-halo)",
      cfg.leaderOpacity,
      "leader"
    ),
    line(
      normalElbow,
      normalFocus,
      "var(--normal-halo)",
      cfg.leaderOpacity,
      "leader"
    ),
    line(
      outlierTail,
      outlierElbow,
      "var(--outlier)",
      cfg.leaderOpacity,
      "leader"
    ),
    line(
      outlierElbow,
      outlier,
      "var(--outlier)",
      cfg.leaderOpacity,
      "leader"
    )
  );

  diagram.append(
    circle(
      { x: cfg.normalLegendX, y: cfg.normalLegendY },
      cfg.legendRadius,
      "var(--sparse)",
      cfg.one,
      ""
    ),
    circle(
      { x: cfg.outlierLegendX, y: cfg.outlierLegendY },
      cfg.legendRadius,
      "var(--outlier)",
      cfg.one,
      ""
    )
  );

  for (const item of labels) {
    const text = make("text", {
      x: sx(item.x),
      y: sy(item.y),
      dx: item.dx,
      dy: item.dy,
      "text-anchor": item.anchor
    }, item.className);
    text.textContent = item.text;
    diagram.append(text);
  }

  fallback.setAttribute("visibility", "hidden");
} catch (error) {
  diagram.replaceChildren();
  fallback.setAttribute("visibility", "visible");
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
