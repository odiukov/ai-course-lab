<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>От оценок аномальности к полезной проверке</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #eef2f8;
      --ink: #172033;
      --muted: #5f6b7d;
      --line: #9aa7b9;
      --accent: #315fce;
      --accent-soft: #dfe8ff;
      --risk: #bc3f4a;
      --risk-soft: #ffe3e5;
      --success: #247154;
      --success-soft: #dff4e9;
      --shadow: #d9dfeb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
      padding: 12px;
    }

    h1 {
      margin: unset;
      padding: 4px 4px 10px;
      font-size: 20px;
      line-height: 1.25;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 410px;
      overflow: visible;
      background: var(--surface);
      border: 1px solid var(--shadow);
    }

    .panel {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .panel-band {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .record {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .score-track {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .score-fill {
      fill: var(--accent);
    }

    .rank-top {
      fill: var(--risk-soft);
      stroke: var(--risk);
      stroke-width: 1.5px;
    }

    .rank-rest {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .fraud {
      fill: var(--risk-soft);
      stroke: var(--risk);
      stroke-width: 1.5px;
    }

    .analyst {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.5px;
    }

    .metric {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 1.5px;
    }

    .arrow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-width: 1px;
    }

    .bracket {
      fill: none;
      stroke: var(--risk);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .magnifier {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .magnifier-handle {
      stroke: var(--accent);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .label {
      fill: var(--ink);
      font-size: 13px;
    }

    .small {
      fill: var(--muted);
      font-size: 11px;
    }

    .strong {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .risk-text {
      fill: var(--risk);
      font-size: 12px;
      font-weight: bold;
    }

    .metric-title {
      fill: var(--success);
      font-size: 17px;
      font-weight: bold;
    }

    .metric-text {
      fill: var(--ink);
      font-size: 12px;
    }

    .step-number {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .step-number-text {
      fill: var(--accent);
      font-size: 12px;
      font-weight: bold;
    }

    #fallback {
      margin: unset;
      padding: 16px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--shadow);
      font-size: 14px;
      line-height: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --surface: #181e28;
        --surface-soft: #222b38;
        --ink: #edf1f7;
        --muted: #aab4c3;
        --line: #536175;
        --accent: #86a8ff;
        --accent-soft: #26385f;
        --risk: #ff939c;
        --risk-soft: #4a252d;
        --success: #79d4ad;
        --success-soft: #203e34;
        --shadow: #303a49;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>От оценок аномальности к полезной проверке</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 410"
      width="960"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <title id="diagram-title">От миллиона транзакций к Precision@100</title>
      <desc id="diagram-description">
        Модель оценивает и ранжирует миллион транзакций. Аналитик проверяет
        первые сто записей, после чего вычисляется Precision@100.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать: модель ранжирует 1 000 000 транзакций,
      среди которых 1000 мошеннических; аналитик проверяет топ-100, после
      чего считается Precision@100.
    </p>

    <noscript>
      <p id="fallback">
        Схема: модель ранжирует 1 000 000 транзакций, аналитик проверяет
        топ-100, затем считается Precision@100.
      </p>
    </noscript>
  </main>

  <script>
    (() => {
      "use strict";

      const data = [
        {
          origin: [2, 1],
          scale: 10,
          arrow: [0.8, 0.55],
          panels: [
            [0.5, 4, 21, 23],
            [28, 4, 18, 23],
            [53, 4, 19, 23],
            [77, 4, 14.5, 23]
          ],
          panelBands: [
            [0.5, 4, 21, 4],
            [28, 4, 18, 4],
            [53, 4, 19, 4],
            [77, 4, 14.5, 4]
          ],
          records: [
            [2.2, 10, 17.6, 2.4],
            [2.2, 13.4, 17.6, 2.4],
            [2.2, 16.8, 17.6, 2.4]
          ],
          fraudBox: [2.2, 21.1, 17.6, 3.9],
          scoreTracks: [
            [30.2, 10, 13.6, 1.8, 12.2],
            [30.2, 13.1, 13.6, 1.8, 10.2],
            [30.2, 16.2, 13.6, 1.8, 7.8],
            [30.2, 19.3, 13.6, 1.8, 5.2],
            [30.2, 22.4, 13.6, 1.8, 2.9]
          ],
          ranks: [
            [55.2, 9.6, 12.9, 2.5, "rank-top"],
            [55.2, 12.8, 12.9, 2.5, "rank-top"],
            [55.2, 16, 12.9, 2.5, "rank-rest"],
            [55.2, 19.2, 12.9, 2.5, "rank-rest"],
            [55.2, 22.4, 12.9, 2.5, "rank-rest"]
          ],
          bracket: [
            [69.2, 9.6],
            [70.3, 9.6],
            [70.3, 15.3],
            [69.2, 15.3]
          ],
          analystCircle: [83.2, 14.2, 3.1],
          analystHandle: [85.5, 16.5, 88.1, 19.1],
          analystCard: [79.2, 21.3, 10.1, 3.7],
          metric: [50.5, 30.1, 41, 7.6],
          stepCircles: [
            [2.4, 6, 1.2, "A"],
            [29.9, 6, 1.2, "B"],
            [54.9, 6, 1.2, "C"],
            [78.9, 6, 1.2, "D"]
          ],
          arrows: [
            [22.1, 15.5, 27.1, 15.5],
            [46.7, 15.5, 52.1, 15.5],
            [72.6, 12.4, 76.1, 12.4],
            [84.2, 27.6, 84.2, 29.2]
          ],
          texts: [
            [11, 6.6, "1 000 000 транзакций", "middle", "title"],
            [37, 6.6, "Оценки аномальности", "middle", "title"],
            [62.5, 6.6, "Рейтинг", "middle", "title"],
            [84.3, 6.6, "Проверка", "middle", "title"],

            [3.3, 11.6, "операция", "start", "small"],
            [3.3, 15, "операция", "start", "small"],
            [3.3, 18.4, "операция", "start", "small"],
            [18.7, 18.4, "⋮", "end", "strong"],
            [11, 23.5, "1000 мошеннических", "middle", "risk-text"],

            [21.9, 13.5, "модель", "start", "small"],
            [21.9, 14.8, "присваивает", "start", "small"],
            [21.9, 16.1, "оценки", "start", "small"],

            [46.4, 13.6, "по убыванию", "start", "small"],
            [46.4, 14.9, "подозрительности", "start", "small"],

            [62.5, 11.3, "самые необычные", "middle", "small"],
            [62.5, 14.5, "следующие", "middle", "small"],
            [62.5, 17.7, "ниже в рейтинге", "middle", "small"],
            [62.5, 20.9, "ещё ниже", "middle", "small"],
            [62.5, 24.1, "⋮", "middle", "strong"],

            [70.8, 11.7, "топ-100", "start", "risk-text"],
            [70.8, 13.3, "в очередь", "start", "small"],

            [76.1, 10.3, "передать", "start", "small"],
            [76.1, 11.6, "аналитику", "start", "small"],

            [84.3, 23.7, "аналитик проверяет", "middle", "label"],

            [52.4, 33.2, "Precision@100", "start", "metric-title"],
            [52.4, 35.5, "сколько подтверждённых мошеннических", "start", "metric-text"],
            [52.4, 37.1, "оказалось среди 100 проверенных", "start", "metric-text"],

            [82.8, 28.4, "после ручной проверки", "end", "small"]
          ]
        }
      ];

      const [layout] = data;
      const [originX, originY] = layout.origin;
      const origin = Object.freeze({ x: originX, y: originY });
      const scale = layout.scale;

      const sx = x => origin.x + x * scale;
      const sy = y => origin.y + y * scale;

      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (name, attributes, className) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const rectangle = (entry, className) => {
        const [x, y, width, height] = entry;
        return add(node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y)
        }, className));
      };

      const line = (entry, className) => {
        const [x1, y1, x2, y2] = entry;
        return add(node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2)
        }, className));
      };

      const polyline = (entries, className) => {
        const points = entries
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" ");
        return add(node("polyline", { points }, className));
      };

      const circle = (entry, className) => {
        const [x, y, radius] = entry;
        return add(node("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(x + radius) - sx(x)
        }, className));
      };

      const text = entry => {
        const [x, y, value, anchor, className] = entry;
        const element = node("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, className);
        element.textContent = value;
        return add(element);
      };

      const arrow = entry => {
        const [x1, y1, x2, y2] = entry;
        const [length, spread] = layout.arrow;
        line(entry, "arrow");

        const horizontal = y1 === y2;
        const vertical = x1 === x2;
        let points;

        if (horizontal) {
          points = [
            [x2, y2],
            [x2 - length, y2 - spread],
            [x2 - length, y2 + spread]
          ];
        } else if (vertical) {
          points = [
            [x2, y2],
            [x2 - spread, y2 - length],
            [x2 + spread, y2 - length]
          ];
        } else {
          points = [
            [x2, y2],
            [x2 - length, y2 - spread],
            [x2 - spread, y2 - length]
          ];
        }

        const polygonPoints = points
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" ");

        add(node("polygon", { points: polygonPoints }, "arrow-head"));
      };

      try {
        layout.panels.forEach(entry => rectangle(entry, "panel"));
        layout.panelBands.forEach(entry => rectangle(entry, "panel-band"));
        layout.records.forEach(entry => rectangle(entry, "record"));
        rectangle(layout.fraudBox, "fraud");

        layout.scoreTracks.forEach(entry => {
          const [x, y, width, height, fillWidth] = entry;
          rectangle([x, y, width, height], "score-track");
          rectangle([x, y, fillWidth, height], "score-fill");
        });

        layout.ranks.forEach(entry => {
          const [x, y, width, height, className] = entry;
          rectangle([x, y, width, height], className);
        });

        polyline(layout.bracket, "bracket");
        circle(layout.analystCircle, "magnifier");
        line(layout.analystHandle, "magnifier-handle");
        rectangle(layout.analystCard, "analyst");
        rectangle(layout.metric, "metric");

        layout.stepCircles.forEach(entry => {
          const [x, y, radius, value] = entry;
          circle([x, y, radius], "step-number");
          text([x, y, value, "middle", "step-number-text"]);
        });

        layout.arrows.forEach(arrow);
        layout.texts.forEach(text);
      } catch (error) {
        svg.replaceChildren();
        svg.hidden = true;
        fallback.hidden = false;
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
