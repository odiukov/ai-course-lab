<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как признаки складываются в logit тональности</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5e687b;
      --line: #8190a8;
      --soft: #eaf0f8;
      --feature: #e5f0ff;
      --feature-line: #4e78ad;
      --accent: #2667c9;
      --accent-soft: #e8f1ff;
      --negative: #b63d4d;
      --negative-soft: #fdecef;
      --positive: #217a55;
      --positive-soft: #e6f5ed;
      --formula: #f3f0ff;
      --formula-line: #7565b6;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182130;
        --ink: #edf3ff;
        --muted: #b4bfd2;
        --line: #8190a8;
        --soft: #222e40;
        --feature: #1c3554;
        --feature-line: #78a9e6;
        --accent: #85b9ff;
        --accent-soft: #203958;
        --negative: #ff9cac;
        --negative-soft: #47252d;
        --positive: #7bd5a9;
        --positive-soft: #1d4233;
        --formula: #302b4b;
        --formula-line: #b5a7ee;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      overflow: hidden;
    }

    .figure-title {
      margin: 0;
      padding: 16px 22px 8px;
      font-size: 22px;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .figure-subtitle {
      margin: 0;
      padding: 0 22px 8px;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--panel);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
      font-size: 16px;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .tiny {
      fill: var(--muted);
      font-size: 12px;
    }

    .strong {
      font-size: 17px;
      font-weight: 700;
    }

    .formula-text {
      font-size: 18px;
      font-weight: 650;
    }

    .sum-sign {
      font-size: 29px;
      font-weight: 700;
    }

    .negative-text {
      fill: var(--negative);
      font-weight: 750;
    }

    .positive-text {
      fill: var(--positive);
      font-weight: 700;
    }

    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .edge-accent {
      stroke: var(--accent);
    }

    .edge-negative {
      stroke: var(--negative);
    }

    .arrow-head {
      fill: var(--line);
    }

    .arrow-head-accent {
      fill: var(--accent);
    }

    .arrow-head-negative {
      fill: var(--negative);
    }

    .phrase-box {
      fill: var(--soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .feature-box {
      fill: var(--feature);
      stroke: var(--feature-line);
      stroke-width: 2px;
    }

    .weight-box {
      fill: var(--panel);
      stroke: var(--feature-line);
      stroke-width: 2px;
    }

    .negative-box {
      fill: var(--negative-soft);
      stroke: var(--negative);
      stroke-width: 3px;
    }

    .sum-node {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .sigmoid-box {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .threshold {
      fill: var(--formula);
      stroke: var(--formula-line);
      stroke-width: 2px;
    }

    .formula-box {
      fill: var(--formula);
      stroke: var(--formula-line);
      stroke-width: 2px;
    }

    .positive-box {
      fill: var(--positive-soft);
      stroke: var(--positive);
      stroke-width: 2px;
    }

    .negative-result {
      fill: var(--negative-soft);
      stroke: var(--negative);
      stroke-width: 2px;
    }

    .brace {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .fallback {
      margin: 12px 22px 22px;
      color: var(--negative);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title">
    <h1 class="figure-title" id="figure-title">Как признаки складываются в logit тональности</h1>
    <p class="figure-subtitle">Одна фраза даёт несколько признаков; каждый вносит свой обученный вклад.</p>

    <svg
      id="chart"
      viewBox="0 0 1200 450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Фраза not good превращается в признаки not, good и not_good, их веса складываются в logit, затем применяется sigmoid и порог 0.5"
    >
      <title>Признаки фразы not good складываются в logit тональности</title>
      <desc>У биграммы not_good отрицательный вес минус 2.3. После суммы logit проходит через sigmoid и сравнивается с порогом 0.5.</desc>
      <g id="diagram"></g>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать: «not good» превращается в признаки
      not, good и not_good; их веса, включая −2.3 для not_good,
      складываются в logit, проходят через sigmoid и сравниваются с порогом 0.5.
    </p>
  </figure>

  <script>
    const DATA = [{
      origin: [0, 0],
      scale: [1, 1],
      two: 2,
      arrowLength: 12,
      arrowWidth: 8,
      phraseLabel: [38, 24],
      phraseNot: [48, 42, 112, 52],
      phraseGood: [174, 42, 126, 52],
      brace: [[48, 108], [48, 116], [300, 116], [300, 108]],
      braceLabel: [174, 139],
      features: [
        { name: "not", box: [34, 172, 154, 58], weight: [230, 172, 170, 58], value: "w_not", tone: "normal" },
        { name: "good", box: [34, 252, 154, 58], weight: [230, 252, 170, 58], value: "w_good", tone: "normal" },
        { name: "not_good", box: [34, 332, 154, 58], weight: [230, 332, 170, 58], value: "−2.3", tone: "negative" }
      ],
      featureHeading: [34, 158],
      weightHeading: [230, 158],
      phraseLinks: [
        [[104, 94], [104, 172]],
        [[237, 94], [111, 252]],
        [[174, 116], [111, 332]]
      ],
      sum: [526, 276, 48],
      sumLabel: [526, 342],
      mergeEnds: [[478, 253], [478, 276], [478, 299]],
      sigmoid: [630, 226, 190, 100],
      threshold: [[914, 276], [986, 218], [1058, 276], [986, 334]],
      positive: [1084, 184, 102, 58],
      negative: [1084, 310, 102, 58],
      formula: [418, 382, 402, 52],
      flowLabel: [585, 207],
      sigmoidLabel: [725, 258],
      sigmoidValue: [725, 292],
      thresholdLabel: [986, 266],
      thresholdValue: [986, 290],
      branchPositive: [1056, 239],
      branchNegative: [1056, 327]
    }];

    const ORIGIN = { x: DATA[0].origin[0], y: DATA[0].origin[1] };
    const SCALE = { x: DATA[0].scale[0], y: DATA[0].scale[1] };

    const sx = x => ORIGIN.x + x * SCALE.x;
    const sy = y => ORIGIN.y + y * SCALE.y;

    try {
      const S = DATA[0];
      const root = document.getElementById("diagram");
      const NS = "http://www.w3.org/2000/svg";

      function node(tag, attrs, parent = root) {
        const el = document.createElementNS(NS, tag);
        for (const [key, value] of Object.entries(attrs)) {
          el.setAttribute(key, value);
        }
        parent.appendChild(el);
        return el;
      }

      function rect(box, className) {
        const [x, y, w, h] = box;
        return node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y),
          class: className
        });
      }

      function line(a, b, className = "edge") {
        return node("line", {
          x1: sx(a[0]),
          y1: sy(a[1]),
          x2: sx(b[0]),
          y2: sy(b[1]),
          class: className
        });
      }

      function polyline(points, className) {
        return node("polyline", {
          points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
          class: className
        });
      }

      function polygon(points, className) {
        return node("polygon", {
          points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
          class: className
        });
      }

      function label(value, point, anchor = "middle", className = "") {
        const el = node("text", {
          x: sx(point[0]),
          y: sy(point[1]),
          "text-anchor": anchor,
          class: className
        });
        el.textContent = value;
        return el;
      }

      function arrow(a, b, edgeClass = "edge", headClass = "arrow-head") {
        line(a, b, edgeClass);

        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const half = S.arrowWidth / S.two;
        const baseX = b[0] - ux * S.arrowLength;
        const baseY = b[1] - uy * S.arrowLength;
        const px = -uy * half;
        const py = ux * half;

        polygon([
          [b[0], b[1]],
          [baseX + px, baseY + py],
          [baseX - px, baseY - py]
        ], headClass);
      }

      function center(box) {
        return [
          box[0] + box[2] / S.two,
          box[1] + box[3] / S.two
        ];
      }

      label("исходная фраза", S.phraseLabel, "start", "small");
      rect(S.phraseNot, "phrase-box");
      rect(S.phraseGood, "phrase-box");
      label("not", center(S.phraseNot), "middle", "strong");
      label("good", center(S.phraseGood), "middle", "strong");

      polyline(S.brace, "brace");
      label("биграмма not_good", S.braceLabel, "middle", "small");

      label("признаки", S.featureHeading, "start", "small");
      label("обученные веса", S.weightHeading, "start", "small");

      for (const link of S.phraseLinks) {
        arrow(link[0], link[1], "edge", "arrow-head");
      }

      S.features.forEach((feature, index) => {
        const negative = feature.tone === "negative";
        rect(feature.box, negative ? "negative-box" : "feature-box");
        rect(feature.weight, negative ? "negative-box" : "weight-box");

        label(
          feature.name,
          center(feature.box),
          "middle",
          negative ? "strong negative-text" : "strong"
        );

        const weightCenter = center(feature.weight);
        label("вес", [weightCenter[0], weightCenter[1] - S.arrowWidth], "middle", "tiny");
        label(
          feature.value,
          [weightCenter[0], weightCenter[1] + S.arrowLength],
          "middle",
          negative ? "strong negative-text" : "strong"
        );

        const featureRight = [
          feature.box[0] + feature.box[2],
          feature.box[1] + feature.box[3] / S.two
        ];
        const weightLeft = [
          feature.weight[0],
          feature.weight[1] + feature.weight[3] / S.two
        ];
        const weightRight = [
          feature.weight[0] + feature.weight[2],
          feature.weight[1] + feature.weight[3] / S.two
        ];

        arrow(
          featureRight,
          weightLeft,
          negative ? "edge edge-negative" : "edge",
          negative ? "arrow-head-negative" : "arrow-head"
        );

        arrow(
          weightRight,
          S.mergeEnds[index],
          negative ? "edge edge-negative" : "edge",
          negative ? "arrow-head-negative" : "arrow-head"
        );
      });

      node("circle", {
        cx: sx(S.sum[0]),
        cy: sy(S.sum[1]),
        r: sx(S.sum[0] + S.sum[2]) - sx(S.sum[0]),
        class: "sum-node"
      });
      label("Σ", [S.sum[0], S.sum[1] + S.arrowWidth], "middle", "sum-sign");
      label("сумма вкладов", S.sumLabel, "middle", "small");

      S.mergeEnds.forEach((endpoint, index) => {
        const target = [
          S.sum[0] - S.sum[2],
          endpoint[1]
        ];
        arrow(
          endpoint,
          target,
          index === S.features.length - DATA[0].scale[0]
            ? "edge edge-negative"
            : "edge",
          index === S.features.length - DATA[0].scale[0]
            ? "arrow-head-negative"
            : "arrow-head"
        );
      });

      rect(S.formula, "formula-box");
      label(
        "z = w_not + w_good − 2.3",
        center(S.formula),
        "middle",
        "formula-text"
      );

      const sumRight = [S.sum[0] + S.sum[2], S.sum[1]];
      const sigmoidLeft = [
        S.sigmoid[0],
        S.sigmoid[1] + S.sigmoid[3] / S.two
      ];
      arrow(sumRight, sigmoidLeft, "edge edge-accent", "arrow-head-accent");
      label("logit z", S.flowLabel, "middle", "small");

      rect(S.sigmoid, "sigmoid-box");
      label("sigmoid", S.sigmoidLabel, "middle", "strong");
      label("p = sigmoid(z)", S.sigmoidValue, "middle", "formula-text");

      const sigmoidRight = [
        S.sigmoid[0] + S.sigmoid[2],
        S.sigmoid[1] + S.sigmoid[3] / S.two
      ];
      const thresholdLeft = S.threshold[0];
      arrow(sigmoidRight, thresholdLeft, "edge edge-accent", "arrow-head-accent");

      polygon(S.threshold, "threshold");
      label("порог", S.thresholdLabel, "middle", "small");
      label("0.5", S.thresholdValue, "middle", "strong");

      rect(S.positive, "positive-box");
      rect(S.negative, "negative-result");
      label("позитив", center(S.positive), "middle", "positive-text");
      label("негатив", center(S.negative), "middle", "negative-text");

      const thresholdTopRight = [
        (S.threshold[1][0] + S.threshold[2][0]) / S.two,
        (S.threshold[1][1] + S.threshold[2][1]) / S.two
      ];
      const thresholdBottomRight = [
        (S.threshold[2][0] + S.threshold[3][0]) / S.two,
        (S.threshold[2][1] + S.threshold[3][1]) / S.two
      ];
      const positiveLeft = [
        S.positive[0],
        S.positive[1] + S.positive[3] / S.two
      ];
      const negativeLeft = [
        S.negative[0],
        S.negative[1] + S.negative[3] / S.two
      ];

      arrow(
        thresholdTopRight,
        positiveLeft,
        "edge edge-accent",
        "arrow-head-accent"
      );
      arrow(
        thresholdBottomRight,
        negativeLeft,
        "edge edge-negative",
        "arrow-head-negative"
      );

      label("p ≥ 0.5", S.branchPositive, "middle", "small");
      label("p < 0.5", S.branchNegative, "middle", "small");
    } catch (error) {
      document.getElementById("diagram").replaceChildren();
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
