<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как чистый шум превращается в изображение</title>
<style>
  :root {
    color-scheme: light dark;
    --page: whitesmoke;
    --ink: darkslategray;
    --muted: slategray;
    --panel: white;
    --frame: lightslategray;
    --arrow: royalblue;
    --accent: darkorange;
    --noise-a: gainsboro;
    --noise-b: silver;
    --noise-c: gray;
    --noise-d: darkgray;
    --sky: lightblue;
    --sky-soft: lightsteelblue;
    --ground: burlywood;
    --mountain: sienna;
    --mountain-soft: rosybrown;
    --sun: gold;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: darkslategray;
      --ink: whitesmoke;
      --muted: lightgray;
      --panel: midnightblue;
      --frame: lightsteelblue;
      --arrow: lightskyblue;
      --accent: gold;
      --noise-a: dimgray;
      --noise-b: slategray;
      --noise-c: darkgray;
      --noise-d: gray;
      --sky: steelblue;
      --sky-soft: slategray;
      --ground: peru;
      --mountain: sienna;
      --mountain-soft: rosybrown;
      --sun: gold;
    }
  }

  html {
    background: var(--page);
  }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }

  .figure {
    background: var(--page);
  }

  h1 {
    font-size: 20px;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 420px;
    background: var(--panel);
    border: 1px solid var(--frame);
  }

  .canvas {
    fill: var(--panel);
  }

  .state-frame {
    fill: none;
    stroke: var(--frame);
    stroke-width: 3px;
  }

  .arrow-line {
    fill: none;
    stroke: var(--arrow);
    stroke-width: 3px;
  }

  .arrow-head {
    fill: var(--arrow);
  }

  .noise-a { fill: var(--noise-a); }
  .noise-b { fill: var(--noise-b); }
  .noise-c { fill: var(--noise-c); }
  .noise-d { fill: var(--noise-d); }
  .sky { fill: var(--sky); }
  .sky-soft { fill: var(--sky-soft); }
  .ground { fill: var(--ground); }
  .mountain { fill: var(--mountain); }
  .mountain-soft { fill: var(--mountain-soft); }
  .sun { fill: var(--sun); }

  text {
    fill: var(--ink);
    font-size: 16px;
    font-family: system-ui, sans-serif;
  }

  .model-label {
    fill: var(--arrow);
    font-weight: bold;
  }

  .epsilon-label {
    fill: var(--ink);
  }

  .z-label {
    fill: var(--muted);
    font-size: 15px;
  }

  .last-z {
    fill: var(--accent);
    font-weight: bold;
  }

  .state-label {
    font-size: 23px;
    font-weight: bold;
  }

  .state-caption {
    fill: var(--muted);
    font-size: 15px;
  }

  .ellipsis {
    fill: var(--arrow);
    font-size: 23px;
    font-weight: bold;
  }

  .legend {
    fill: var(--ink);
    font-size: 16px;
  }

  .legend-muted {
    fill: var(--muted);
    font-size: 15px;
  }

  #fallback {
    color: var(--ink);
    background: var(--panel);
    border: 1px solid var(--frame);
    font-size: 16px;
  }

  [hidden] {
    display: none;
  }
</style>
</head>
<body>
<main class="figure">
  <h1 id="diagram-title">Как чистый шум превращается в изображение</h1>
  <svg
    id="diagram"
    viewBox="0 0 1200 420"
    width="1200"
    height="420"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title diagram-description">
    <title id="diagram-description">Цепочка от x₉₉₉ к x₀: модель предсказывает шум ε, а на каждом шаге кроме последнего добавляется случайный z.</title>
  </svg>
  <p id="fallback" hidden>
    Схема должна была показать цепочку x₉₉₉ → x₉₉₈ → … → x₁ → x₀:
    на каждом переходе model(xₜ, t) предсказывает ε и используется случайный z,
    а на последнем переходе z = 0.
  </p>
</main>
<script>
const data = [{
  canvas: [0, 0, 1200, 420, "canvas"],
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },

  states: [
    {
      frame: [30, 120, 200, 280, "state-frame"],
      base: [36, 126, 194, 274, "noise-b"],
      boxes: [
        [36, 126, 62, 151, "noise-c"],
        [62, 126, 91, 151, "noise-a"],
        [91, 126, 119, 151, "noise-d"],
        [119, 126, 148, 151, "noise-b"],
        [148, 126, 194, 151, "noise-a"],
        [36, 151, 62, 181, "noise-a"],
        [62, 151, 91, 181, "noise-d"],
        [91, 151, 119, 181, "noise-b"],
        [119, 151, 148, 181, "noise-c"],
        [148, 151, 194, 181, "noise-d"],
        [36, 181, 62, 211, "noise-d"],
        [62, 181, 91, 211, "noise-b"],
        [91, 181, 119, 211, "noise-a"],
        [119, 181, 148, 211, "noise-d"],
        [148, 181, 194, 211, "noise-b"],
        [36, 211, 62, 241, "noise-b"],
        [62, 211, 91, 241, "noise-c"],
        [91, 211, 119, 241, "noise-d"],
        [119, 211, 148, 241, "noise-a"],
        [148, 211, 194, 241, "noise-c"],
        [36, 241, 62, 274, "noise-a"],
        [62, 241, 91, 274, "noise-d"],
        [91, 241, 119, 274, "noise-c"],
        [119, 241, 148, 274, "noise-b"],
        [148, 241, 194, 274, "noise-a"]
      ],
      polygons: [],
      labels: [
        { x: 115, y: 307, text: "x₉₉₉", anchor: "middle", className: "state-label" },
        { x: 115, y: 332, text: "чистый шум", anchor: "middle", className: "state-caption" }
      ]
    },
    {
      frame: [330, 120, 500, 280, "state-frame"],
      base: [336, 126, 494, 274, "noise-a"],
      boxes: [
        [336, 126, 385, 159, "noise-b"],
        [385, 126, 450, 159, "noise-c"],
        [450, 126, 494, 159, "noise-b"],
        [336, 159, 374, 204, "noise-c"],
        [374, 159, 431, 204, "noise-b"],
        [431, 159, 494, 204, "noise-d"],
        [336, 204, 397, 238, "noise-b"],
        [397, 204, 462, 238, "noise-c"],
        [462, 204, 494, 238, "noise-a"],
        [336, 238, 383, 274, "noise-c"],
        [383, 238, 448, 274, "noise-d"],
        [448, 238, 494, 274, "noise-b"]
      ],
      polygons: [
        {
          points: [[336, 211], [372, 179], [408, 208], [447, 168], [494, 216], [494, 274], [336, 274]],
          className: "mountain-soft"
        }
      ],
      labels: [
        { x: 415, y: 307, text: "x₉₉₈", anchor: "middle", className: "state-label" },
        { x: 415, y: 332, text: "первая поправка", anchor: "middle", className: "state-caption" }
      ]
    },
    {
      frame: [700, 120, 870, 280, "state-frame"],
      base: [706, 126, 864, 274, "sky-soft"],
      boxes: [
        [706, 126, 746, 153, "noise-a"],
        [819, 126, 864, 156, "noise-b"],
        [706, 224, 748, 250, "noise-b"],
        [835, 204, 864, 237, "noise-a"]
      ],
      polygons: [
        {
          points: [[706, 225], [742, 188], [772, 216], [813, 169], [864, 224], [864, 274], [706, 274]],
          className: "mountain-soft"
        },
        {
          points: [[706, 236], [864, 226], [864, 274], [706, 274]],
          className: "ground"
        },
        {
          points: [[731, 145], [741, 135], [755, 135], [765, 145], [765, 159], [755, 169], [741, 169], [731, 159]],
          className: "sun"
        }
      ],
      labels: [
        { x: 785, y: 307, text: "x₁", anchor: "middle", className: "state-label" },
        { x: 785, y: 332, text: "контуры и детали", anchor: "middle", className: "state-caption" }
      ]
    },
    {
      frame: [1000, 120, 1170, 280, "state-frame"],
      base: [1006, 126, 1164, 274, "sky"],
      boxes: [],
      polygons: [
        {
          points: [[1006, 225], [1041, 187], [1073, 216], [1112, 166], [1164, 224], [1164, 274], [1006, 274]],
          className: "mountain"
        },
        {
          points: [[1006, 235], [1164, 225], [1164, 274], [1006, 274]],
          className: "ground"
        },
        {
          points: [[1031, 145], [1041, 135], [1055, 135], [1065, 145], [1065, 159], [1055, 169], [1041, 169], [1031, 159]],
          className: "sun"
        },
        {
          points: [[1090, 274], [1095, 239], [1108, 229], [1121, 239], [1126, 274]],
          className: "noise-d"
        }
      ],
      labels: [
        { x: 1085, y: 307, text: "x₀", anchor: "middle", className: "state-label" },
        { x: 1085, y: 332, text: "готовое изображение", anchor: "middle", className: "state-caption" }
      ]
    }
  ],

  transitions: [
    {
      segments: [[[210, 200], [320, 200]]],
      head: [[320, 200], [306, 191], [306, 209]],
      labels: [
        { x: 265, y: 39, text: "model(x₉₉₉, 999)", anchor: "middle", className: "model-label" },
        { x: 265, y: 67, text: "предсказывает шум ε", anchor: "middle", className: "epsilon-label" },
        { x: 265, y: 95, text: "случайный z ~ N(0, I)", anchor: "middle", className: "z-label" }
      ]
    },
    {
      segments: [[[510, 200], [570, 200]], [[630, 200], [690, 200]]],
      head: [[690, 200], [676, 191], [676, 209]],
      labels: [
        { x: 600, y: 39, text: "model(xₜ, t)", anchor: "middle", className: "model-label" },
        { x: 600, y: 67, text: "предсказывает шум ε", anchor: "middle", className: "epsilon-label" },
        { x: 600, y: 95, text: "случайный z ~ N(0, I)", anchor: "middle", className: "z-label" },
        { x: 600, y: 195, text: "…", anchor: "middle", className: "ellipsis" }
      ]
    },
    {
      segments: [[[880, 200], [990, 200]]],
      head: [[990, 200], [976, 191], [976, 209]],
      labels: [
        { x: 935, y: 39, text: "model(x₁, 1)", anchor: "middle", className: "model-label" },
        { x: 935, y: 67, text: "предсказывает шум ε", anchor: "middle", className: "epsilon-label" },
        { x: 935, y: 95, text: "z = 0 · без случайной добавки", anchor: "middle", className: "z-label last-z" }
      ]
    }
  ],

  legend: [
    { x: 600, y: 375, text: "Каждый xₜ — всё текущее изображение, а не отдельный слой.", anchor: "middle", className: "legend" },
    { x: 600, y: 402, text: "Прогноз ε направляет следующий шаг; z сохраняет разнообразие.", anchor: "middle", className: "legend-muted" }
  ]
}];

const [diagramData] = data;
const origin = diagramData.origin;
const scale = diagramData.scale;

function toPx(point) {
  return {
    x: origin.x + point.x * scale.x,
    y: origin.y + point.y * scale.y
  };
}

const svg = document.querySelector("#diagram");
const fallback = document.querySelector("#fallback");
const namespace = svg.namespaceURI;

function element(tag, className) {
  const node = document.createElementNS(namespace, tag);
  if (className) node.setAttribute("class", className);
  return node;
}

function pathData(points, close) {
  let started = false;
  const commands = points.map((point) => {
    const pixel = toPx(point);
    const command = started ? "L" : "M";
    started = true;
    return command + " " + pixel.x + " " + pixel.y;
  });
  if (close) commands.push("Z");
  return commands.join(" ");
}

function drawBox(parent, box) {
  const [xOne, yOne, xTwo, yTwo, className] = box;
  const node = element("path", className);
  node.setAttribute("d", pathData([
    { x: xOne, y: yOne },
    { x: xTwo, y: yOne },
    { x: xTwo, y: yTwo },
    { x: xOne, y: yTwo }
  ], true));
  parent.append(node);
}

function drawPolygon(parent, polygon) {
  const node = element("path", polygon.className);
  const points = polygon.points.map(([x, y]) => ({ x, y }));
  node.setAttribute("d", pathData(points, true));
  parent.append(node);
}

function drawLine(parent, segment) {
  const node = element("path", "arrow-line");
  const points = segment.map(([x, y]) => ({ x, y }));
  node.setAttribute("d", pathData(points, false));
  parent.append(node);
}

function drawText(parent, label) {
  const node = element("text", label.className);
  const pixel = toPx({ x: label.x, y: label.y });
  node.setAttribute("x", pixel.x);
  node.setAttribute("y", pixel.y);
  node.setAttribute("text-anchor", label.anchor);
  node.setAttribute("dominant-baseline", "middle");
  node.textContent = label.text;
  parent.append(node);
}

try {
  drawBox(svg, diagramData.canvas);

  diagramData.states.forEach((state) => {
    const group = element("g", "state");
    drawBox(group, state.base);
    state.boxes.forEach((box) => drawBox(group, box));
    state.polygons.forEach((polygon) => drawPolygon(group, polygon));
    drawBox(group, state.frame);
    state.labels.forEach((label) => drawText(group, label));
    svg.append(group);
  });

  diagramData.transitions.forEach((transition) => {
    const group = element("g", "transition");
    transition.segments.forEach((segment) => drawLine(group, segment));
    drawPolygon(group, {
      points: transition.head,
      className: "arrow-head"
    });
    transition.labels.forEach((label) => drawText(group, label));
    svg.append(group);
  });

  diagramData.legend.forEach((label) => drawText(svg, label));
} catch (error) {
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
