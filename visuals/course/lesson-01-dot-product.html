<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Урок 01 — скалярное произведение</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --border: #2a313c;
    --ink: #e6edf3;
    --muted: #8b949e;
    --grid: #212934;
    --axis: #3d4653;
    --a: #5ac8fa;
    --b: #ff9f43;
    --proj: #a78bfa;
    --resid: #f87171;
    --ok: #4ade80;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f8fa; --panel: #fff; --border: #d4dae1; --ink: #1c2128;
      --muted: #57606a; --grid: #e7ebef; --axis: #b6bec7;
      --a: #0a7ea4; --b: #c2410c; --proj: #7c3aed; --resid: #dc2626; --ok: #15803d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px 60px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  h2 { font-size: 17px; margin: 0 0 14px; letter-spacing: -.01em; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 22px;
  }
  .split { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 22px; align-items: start; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
  svg { width: 100%; height: auto; display: block; touch-action: none; cursor: crosshair; }
  .handle { cursor: grab; }
  .handle:active { cursor: grabbing; }
  .readout { font: 13px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .readout .row { display: flex; justify-content: space-between; gap: 14px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .readout .row:last-child { border-bottom: 0; }
  .readout .k { color: var(--muted); }
  .readout .v { font-variant-numeric: tabular-nums; }
  .verdict { margin-top: 14px; padding: 11px 13px; border-radius: 8px; font-size: 13.5px; line-height: 1.5; border: 1px solid var(--border); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: baseline; margin-right: 5px; }
  label.chk { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--muted); cursor: pointer; margin-top: 12px; }
  input[type=checkbox] { accent-color: var(--proj); width: 15px; height: 15px; }
  .btns { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 11px; cursor: pointer;
    background: transparent; color: var(--ink);
    border: 1px solid var(--border); border-radius: 7px;
  }
  button:hover { border-color: var(--a); color: var(--a); }
  button.on { border-color: var(--a); color: var(--a); background: color-mix(in srgb, var(--a) 12%, transparent); }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--grid); padding: 1.5px 5px; border-radius: 4px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 12px; }
  .mono-in { width: 58px; font: 13px ui-monospace, Menlo, monospace; background: var(--bg); color: var(--ink);
             border: 1px solid var(--border); border-radius: 6px; padding: 5px 7px; text-align: center; }
  .matgrid { display: inline-grid; grid-template-columns: auto auto; gap: 7px; margin: 4px 0 2px; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Скалярное произведение — «мы идём в одну сторону?»</h1>
  <p class="sub">Крути векторы — смотри на знак произведения и на угол между ними.</p>

  <!-- ============ 2. СКАЛЯРНОЕ ПРОИЗВЕДЕНИЕ ============ -->
  <div class="card">
    <div class="split">
      <svg id="s2" viewBox="0 0 400 400" aria-label="Два вектора и угол между ними"></svg>
      <div>
        <div class="readout" id="r2"></div>
        <div class="verdict" id="v2"></div>
        <div class="btns">
          <button data-preset="same">В одну сторону</button>
          <button data-preset="perp">Перпендикулярно</button>
          <button data-preset="opp">Навстречу</button>
        </div>
        <p class="hint">Именно так работает поиск похожего: RAG, рекомендации, attention. Косинус — это скалярное произведение, очищенное от длины: остаётся чистое «насколько похоже направление».</p>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  const SIZE = 400, C = 200, U = 40;          // центр и пиксели на единицу
  const NS = "http://www.w3.org/2000/svg";
  const X = v => C + v[0] * U;                 // мир -> экран
  const Y = v => C - v[1] * U;
  const toWorld = (px, py) => [(px - C) / U, (C - py) / U];
  const snap = v => Math.abs(v - Math.round(v)) < 0.18 ? Math.round(v) : Math.round(v * 10) / 10;
  const fmt = (n, d = 2) => (Math.abs(n) < 5e-3 ? 0 : n).toFixed(d);

  const dot = (a, b) => a[0] * b[0] + a[1] * b[1];
  const mag = a => Math.hypot(a[0], a[1]);

  function el(tag, attrs, parent) {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }

  // ---- общая сцена: сетка + оси + маркер стрелок ----
  function scene(svg) {
    svg.innerHTML = "";
    const defs = el("defs", {}, svg);
    ["a", "b", "proj", "resid", "ok"].forEach(name => {
      const m = el("marker", {
        id: "ar-" + name + "-" + svg.id, viewBox: "0 0 10 10",
        refX: 8, refY: 5, markerWidth: 6, markerHeight: 6, orient: "auto-start-reverse"
      }, defs);
      el("path", { d: "M0,0 L10,5 L0,10 z", fill: "var(--" + name + ")" }, m);
    });
    const g = el("g", {}, svg);
    for (let i = -5; i <= 5; i++) {
      el("line", { x1: X([i, 0]), y1: 0, x2: X([i, 0]), y2: SIZE, stroke: "var(--grid)", "stroke-width": 1 }, g);
      el("line", { x1: 0, y1: Y([0, i]), x2: SIZE, y2: Y([0, i]), stroke: "var(--grid)", "stroke-width": 1 }, g);
    }
    el("line", { x1: 0, y1: C, x2: SIZE, y2: C, stroke: "var(--axis)", "stroke-width": 1.5 }, g);
    el("line", { x1: C, y1: 0, x2: C, y2: SIZE, stroke: "var(--axis)", "stroke-width": 1.5 }, g);
    return svg;
  }

  function arrow(svg, from, to, kind, width) {
    return el("line", {
      x1: X(from), y1: Y(from), x2: X(to), y2: Y(to),
      stroke: "var(--" + kind + ")", "stroke-width": width || 2.5,
      "marker-end": "url(#ar-" + kind + "-" + svg.id + ")", "stroke-linecap": "round"
    }, svg);
  }

  function handle(svg, vec, kind, onDrag) {
    const h = el("circle", { cx: X(vec), cy: Y(vec), r: 9, fill: "var(--" + kind + ")",
                             stroke: "var(--bg)", "stroke-width": 2.5, class: "handle" }, svg);
    h.addEventListener("pointerdown", e => {
      h.setPointerCapture(e.pointerId);
      const move = ev => {
        const r = svg.getBoundingClientRect();
        const px = (ev.clientX - r.left) / r.width * SIZE;
        const py = (ev.clientY - r.top) / r.height * SIZE;
        let [wx, wy] = toWorld(px, py);
        wx = Math.max(-4.8, Math.min(4.8, snap(wx)));
        wy = Math.max(-4.8, Math.min(4.8, snap(wy)));
        onDrag([wx, wy]);
      };
      const up = () => { svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up); };
      svg.addEventListener("pointermove", move);
      svg.addEventListener("pointerup", up);
      e.preventDefault();
    });
    return h;
  }

  function label(svg, vec, text, kind) {
    const off = vec[0] >= 0 ? 14 : -14;
    return el("text", { x: X(vec) + off, y: Y(vec) - 12, fill: "var(--" + kind + ")",
                        "font-size": 14, "font-weight": 600,
                        "text-anchor": vec[0] >= 0 ? "start" : "end" }, svg).appendChild(
             document.createTextNode(text)).parentNode;
  }

  const row = (k, v, color) =>
    `<div class="row"><span class="k">${k}</span><span class="v"${color ? ` style="color:${color}"` : ""}>${v}</span></div>`;

  // ================= 2. скалярное произведение =================
  let a2 = [3, 1], b2 = [2, 3];
  const s2 = document.getElementById("s2");
  function draw2() {
    scene(s2);
    // дуга угла
    const angA = Math.atan2(a2[1], a2[0]), angB = Math.atan2(b2[1], b2[0]);
    const R = 46;
    let d = angB - angA;
    while (d > Math.PI) d -= 2 * Math.PI;
    while (d < -Math.PI) d += 2 * Math.PI;
    el("path", {
      d: `M ${C + R * Math.cos(angA)} ${C - R * Math.sin(angA)} A ${R} ${R} 0 0 ${d > 0 ? 0 : 1} ${C + R * Math.cos(angB)} ${C - R * Math.sin(angB)}`,
      fill: "none", stroke: "var(--muted)", "stroke-width": 1.5
    }, s2);

    arrow(s2, [0, 0], a2, "a", 3);
    arrow(s2, [0, 0], b2, "b", 3);
    label(s2, a2, "a", "a"); label(s2, b2, "b", "b");
    handle(s2, a2, "a", v => { a2 = v; draw2(); });
    handle(s2, b2, "b", v => { b2 = v; draw2(); });

    const d2 = dot(a2, b2), cos = d2 / (mag(a2) * mag(b2) || 1);
    const deg = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
    document.getElementById("r2").innerHTML =
      row("a", `[${fmt(a2[0], 1)}, ${fmt(a2[1], 1)}]`, "var(--a)") +
      row("b", `[${fmt(b2[0], 1)}, ${fmt(b2[1], 1)}]`, "var(--b)") +
      row("a·b = ax·bx + ay·by",
          `${fmt(a2[0] * b2[0], 2)} + ${fmt(a2[1] * b2[1], 2)} = ${fmt(d2)}`) +
      row("угол", fmt(deg, 1) + "°") +
      row("cos(угла) = a·b / (|a||b|)", fmt(cos), "var(--ok)");

    let verdict;
    if (d2 > 0.05) verdict = `<b style="color:var(--ok)">a·b = ${fmt(d2)} &gt; 0</b> — векторы смотрят примерно в одну сторону. «Похожи».`;
    else if (d2 < -0.05) verdict = `<b style="color:var(--resid)">a·b = ${fmt(d2)} &lt; 0</b> — векторы расходятся навстречу. «Противоположны».`;
    else verdict = `<b>a·b ≈ 0</b> — векторы перпендикулярны. Ничего общего.`;
    document.getElementById("v2").innerHTML = verdict +
      `<br><span style="color:var(--muted)">Косинус ${fmt(cos)} не зависит от длины — удлини любой вектор вдвое, он не изменится. Проверь.</span>`;
  }
  document.querySelectorAll("[data-preset]").forEach(btn => btn.onclick = () => {
    const p = btn.dataset.preset;
    a2 = [3, 1];
    b2 = p === "same" ? [2, 0.7] : p === "perp" ? [-1, 3] : [-3, -1];
    draw2();
  });

  draw2();
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
