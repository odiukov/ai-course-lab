<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта MASFT: 14 режимов в трёх категориях</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --panel: #ffffff;
    --text: #172033;
    --muted: #657086;
    --line: #aab4c7;
    --root-fill: #172033;
    --root-text: #ffffff;
    --c1: #3568d4;
    --c1-fill: #edf3ff;
    --c2: #8b4fba;
    --c2-fill: #f7effd;
    --c3: #168269;
    --c3-fill: #eaf8f4;
    --badge: #fff6d8;
    --badge-line: #c78b16;
    --badge-text: #664500;
    --shadow: #dce1eb;
    --error: #8d2635;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --panel: #171c27;
      --text: #eef2fa;
      --muted: #aab4c7;
      --line: #626e82;
      --root-fill: #eef2fa;
      --root-text: #10141d;
      --c1: #80a9ff;
      --c1-fill: #1d2d4c;
      --c2: #d19aef;
      --c2-fill: #382548;
      --c3: #62d1b4;
      --c3-fill: #173d35;
      --badge: #3d3218;
      --badge-line: #edbb4c;
      --badge-text: #ffe19a;
      --shadow: #0b0e14;
      --error: #ff9aaa;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  main {
    width: 100%;
    padding: 10px 14px 8px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }

  .intro {
    margin: 3px 0 7px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.25;
  }

  .diagram {
    display: block;
    width: 100%;
    height: auto;
    max-height: 444px;
    overflow: visible;
    background: var(--panel);
    border: 1px solid var(--shadow);
  }

  .branch {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .root-box {
    fill: var(--root-fill);
    stroke: var(--root-fill);
    stroke-width: 2px;
  }

  .root-title {
    fill: var(--root-text);
    font-size: 20px;
    font-weight: 750;
  }

  .root-note {
    fill: var(--root-text);
    font-size: 12px;
    font-weight: 600;
  }

  .category-box {
    stroke-width: 2px;
  }

  .category-box.c1,
  .mode-box.c1 {
    fill: var(--c1-fill);
    stroke: var(--c1);
  }

  .category-box.c2,
  .mode-box.c2 {
    fill: var(--c2-fill);
    stroke: var(--c2);
  }

  .category-box.c3,
  .mode-box.c3 {
    fill: var(--c3-fill);
    stroke: var(--c3);
  }

  .category-label {
    fill: var(--text);
    font-size: 15px;
    font-weight: 720;
  }

  .mode-box {
    stroke-width: 1.5px;
  }

  .mode-label {
    fill: var(--text);
    font-size: 13px;
    font-weight: 560;
  }

  .accent {
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .accent.c1 {
    stroke: var(--c1);
  }

  .accent.c2 {
    stroke: var(--c2);
  }

  .accent.c3 {
    stroke: var(--c3);
  }

  .kappa-box {
    fill: var(--badge);
    stroke: var(--badge-line);
    stroke-width: 2px;
  }

  .kappa-caption {
    fill: var(--badge-text);
    font-size: 12px;
    font-weight: 650;
  }

  .kappa-value {
    fill: var(--badge-text);
    font-size: 18px;
    font-weight: 780;
  }

  .fallback {
    margin: 8px 0 0;
    padding: 10px;
    color: var(--error);
    font-size: 14px;
    line-height: 1.35;
    border: 1px solid var(--error);
    background: var(--panel);
  }

  noscript {
    color: var(--error);
    font-size: 14px;
  }
</style>
</head>
<body>
<main>
  <h1>Карта MASFT: 14 режимов в трёх категориях</h1>
  <p class="intro">Читать сверху вниз: категории показывают области диагностики, а не последовательные этапы.</p>

  <svg
    class="diagram"
    viewBox="0 0 1200 444"
    width="1200"
    height="444"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="svg-title svg-description">
    <title id="svg-title">Дерево таксономии отказов MASFT</title>
    <desc id="svg-description">Корень MASFT ведёт к трём категориям и далее к четырнадцати режимам отказа. Рядом указано согласие разметчиков: каппа равна 0.88.</desc>
    <g id="drawing"></g>
  </svg>

  <p id="fallback" class="fallback" hidden></p>
  <noscript>Схема должна показать дерево MASFT: три категории, 14 режимов отказа и согласие разметчиков κ=0.88.</noscript>
</main>

<script>
const data = {
  layout: {
    origin: { x: 0, y: 0 },
    scale: 1,
    half: 0.5,
    radius: 8,
    root: { x: 525, y: 8, w: 150, h: 46 },
    rootTitle: { x: 600, y: 29 },
    rootNote: { x: 600, y: 45 },
    bus: { left: 210, right: 990, y: 70 },
    kappa: { x: 790, y: 9, w: 186, h: 43 },
    kappaCaption: { x: 883, y: 25 },
    kappaValue: { x: 883, y: 43 },
    categoryElbowY: 155,
    modeWidth: 330,
    modeHeight: 34,
    accentInset: 7
  },
  categories: [
    {
      className: "c1",
      trunkX: 43,
      trunkEndY: 421,
      box: { x: 35, y: 84, w: 350, h: 58 },
      label: [
        { text: "Спецификация и проектирование", x: 210, y: 108 },
        { text: "системы", x: 210, y: 128 }
      ],
      modes: [
        {
          box: { x: 55, y: 169, w: 330, h: 34 },
          label: [{ text: "Несоблюдение требований задачи", x: 72, y: 190 }]
        },
        {
          box: { x: 55, y: 216, w: 330, h: 34 },
          label: [{ text: "Несоблюдение роли агента", x: 72, y: 237 }]
        },
        {
          box: { x: 55, y: 263, w: 330, h: 34 },
          label: [{ text: "Повторение шагов", x: 72, y: 284 }]
        },
        {
          box: { x: 55, y: 310, w: 330, h: 34 },
          label: [{ text: "Потеря истории диалога", x: 72, y: 331 }]
        },
        {
          box: { x: 55, y: 357, w: 330, h: 34 },
          label: [
            { text: "Не распознано завершение", x: 72, y: 372 },
            { text: "задачи", x: 72, y: 386 }
          ]
        }
      ]
    },
    {
      className: "c2",
      trunkX: 433,
      trunkEndY: 421,
      box: { x: 425, y: 84, w: 350, h: 58 },
      label: [
        { text: "Несогласованность", x: 600, y: 108 },
        { text: "между агентами", x: 600, y: 128 }
      ],
      modes: [
        {
          box: { x: 445, y: 169, w: 330, h: 34 },
          label: [{ text: "Сброс диалога", x: 462, y: 190 }]
        },
        {
          box: { x: 445, y: 216, w: 330, h: 34 },
          label: [{ text: "Не запрошено уточнение", x: 462, y: 237 }]
        },
        {
          box: { x: 445, y: 263, w: 330, h: 34 },
          label: [{ text: "Уход от задачи", x: 462, y: 284 }]
        },
        {
          box: { x: 445, y: 310, w: 330, h: 34 },
          label: [{ text: "Сокрытие важной информации", x: 462, y: 331 }]
        },
        {
          box: { x: 445, y: 357, w: 330, h: 34 },
          label: [
            { text: "Игнорирование ответа", x: 462, y: 372 },
            { text: "другого агента", x: 462, y: 386 }
          ]
        },
        {
          box: { x: 445, y: 404, w: 330, h: 34 },
          label: [
            { text: "Расхождение рассуждения", x: 462, y: 419 },
            { text: "и действия", x: 462, y: 433 }
          ]
        }
      ]
    },
    {
      className: "c3",
      trunkX: 823,
      trunkEndY: 280,
      box: { x: 815, y: 84, w: 350, h: 58 },
      label: [
        { text: "Проверка выполнения", x: 990, y: 108 },
        { text: "задачи", x: 990, y: 128 }
      ],
      modes: [
        {
          box: { x: 835, y: 169, w: 330, h: 34 },
          label: [{ text: "Преждевременное завершение", x: 852, y: 190 }]
        },
        {
          box: { x: 835, y: 216, w: 330, h: 34 },
          label: [{ text: "Нет или неполная проверка", x: 852, y: 237 }]
        },
        {
          box: { x: 835, y: 263, w: 330, h: 34 },
          label: [{ text: "Ошибочная проверка", x: 852, y: 284 }]
        }
      ]
    }
  ]
};

const origin = Object.freeze(data.layout.origin);
const scale = data.layout.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

const namespace = "http://www.w3.org/2000/svg";
const drawing = document.getElementById("drawing");
const fallback = document.getElementById("fallback");

function element(name, attributes, content) {
  const node = document.createElementNS(namespace, name);
  for (const [key, value] of Object.entries(attributes)) {
    node.setAttribute(key, value);
  }
  if (content !== undefined) node.textContent = content;
  return node;
}

function line(x1, y1, x2, y2, className) {
  return element("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  });
}

function rectangle(box, className) {
  return element("rect", {
    x: sx(box.x),
    y: sy(box.y),
    width: sx(box.w) - sx(0),
    height: sy(box.h) - sy(0),
    rx: sx(data.layout.radius) - sx(0),
    ry: sy(data.layout.radius) - sy(0),
    class: className
  });
}

function textLabel(item, className, anchor) {
  return element("text", {
    x: sx(item.x),
    y: sy(item.y),
    class: className,
    "text-anchor": anchor
  }, item.text);
}

function centerX(box) {
  return box.x + box.w * data.layout.half;
}

function centerY(box) {
  return box.y + box.h * data.layout.half;
}

try {
  const root = data.layout.root;
  const rootCenterX = centerX(root);
  const rootBottomY = root.y + root.h;

  drawing.append(
    line(
      rootCenterX,
      rootBottomY,
      rootCenterX,
      data.layout.bus.y,
      "branch"
    ),
    line(
      data.layout.bus.left,
      data.layout.bus.y,
      data.layout.bus.right,
      data.layout.bus.y,
      "branch"
    )
  );

  for (const category of data.categories) {
    const categoryCenterX = centerX(category.box);
    const categoryBottomY = category.box.y + category.box.h;

    drawing.append(
      line(
        categoryCenterX,
        data.layout.bus.y,
        categoryCenterX,
        category.box.y,
        "branch"
      ),
      line(
        categoryCenterX,
        categoryBottomY,
        categoryCenterX,
        data.layout.categoryElbowY,
        "branch"
      ),
      line(
        categoryCenterX,
        data.layout.categoryElbowY,
        category.trunkX,
        data.layout.categoryElbowY,
        "branch"
      ),
      line(
        category.trunkX,
        data.layout.categoryElbowY,
        category.trunkX,
        category.trunkEndY,
        "branch"
      )
    );

    for (const mode of category.modes) {
      const modeCenterY = centerY(mode.box);
      drawing.append(
        line(
          category.trunkX,
          modeCenterY,
          mode.box.x,
          modeCenterY,
          "branch"
        )
      );
    }
  }

  drawing.append(
    rectangle(root, "root-box"),
    textLabel(
      { text: "MASFT", x: data.layout.rootTitle.x, y: data.layout.rootTitle.y },
      "root-title",
      "middle"
    ),
    textLabel(
      { text: "14 режимов", x: data.layout.rootNote.x, y: data.layout.rootNote.y },
      "root-note",
      "middle"
    ),
    rectangle(data.layout.kappa, "kappa-box"),
    textLabel(
      {
        text: "Согласие разметчиков",
        x: data.layout.kappaCaption.x,
        y: data.layout.kappaCaption.y
      },
      "kappa-caption",
      "middle"
    ),
    textLabel(
      {
        text: "κ = 0.88",
        x: data.layout.kappaValue.x,
        y: data.layout.kappaValue.y
      },
      "kappa-value",
      "middle"
    )
  );

  for (const category of data.categories) {
    drawing.append(
      rectangle(
        category.box,
        `category-box ${category.className}`
      )
    );

    for (const label of category.label) {
      drawing.append(textLabel(label, "category-label", "middle"));
    }

    for (const mode of category.modes) {
      const accentX = mode.box.x;
      const accentTopY = mode.box.y + data.layout.accentInset;
      const accentBottomY =
        mode.box.y + mode.box.h - data.layout.accentInset;

      drawing.append(
        rectangle(mode.box, `mode-box ${category.className}`),
        line(
          accentX,
          accentTopY,
          accentX,
          accentBottomY,
          `accent ${category.className}`
        )
      );

      for (const label of mode.label) {
        drawing.append(textLabel(label, "mode-label", "start"));
      }
    }
  }
} catch (error) {
  drawing.textContent = "";
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна показать дерево MASFT: от корня — к трём областям диагностики, затем к 14 режимам отказа; рядом должна стоять отметка согласия разметчиков κ=0.88.";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
