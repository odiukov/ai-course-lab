<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Почему семикратное ускорение требует полного стека</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5a667c;
    --line: #8290a8;
    --accent: #285fd6;
    --accent-fill: #e8efff;
    --result: #13745a;
    --result-fill: #def5ec;
    --warning: #a04d18;
    --warning-fill: #fff0df;
    --note: #6750a4;
    --note-fill: #f0eaff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --panel: #171d28;
      --ink: #eef3ff;
      --muted: #aab5c9;
      --line: #73809a;
      --accent: #8db1ff;
      --accent-fill: #20365f;
      --result: #67d7af;
      --result-fill: #173f35;
      --warning: #ffb378;
      --warning-fill: #4b2c1b;
      --note: #c7afff;
      --note-fill: #332752;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  body {
    margin: 0;
  }

  figure {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    background: var(--panel);
  }

  .figure-title {
    padding: 14px 20px 10px;
    color: var(--ink);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 480px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  svg text {
    font-family: inherit;
  }

  .section-label {
    fill: var(--ink);
  }

  .caption,
  .small {
    fill: var(--muted);
  }

  .flow-line {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .flow-line.full {
    stroke: var(--accent);
  }

  .flow-line.short {
    stroke: var(--warning);
  }

  .arrow-head.full {
    fill: var(--accent);
  }

  .arrow-head.short {
    fill: var(--warning);
  }

  .node {
    stroke-linejoin: round;
  }

  .node.base {
    fill: var(--panel);
    stroke: var(--line);
  }

  .node.factor {
    fill: var(--accent-fill);
    stroke: var(--accent);
  }

  .node.result {
    fill: var(--result-fill);
    stroke: var(--result);
  }

  .node.partial {
    fill: var(--warning-fill);
    stroke: var(--warning);
  }

  .node.note {
    fill: var(--note-fill);
    stroke: var(--note);
  }

  .factor-value {
    fill: var(--accent);
  }

  .result-value {
    fill: var(--result);
  }

  .partial-value {
    fill: var(--warning);
  }

  .note-value {
    fill: var(--note);
  }

  .fallback {
    margin: 0;
    padding: 20px;
    background: var(--panel);
    color: var(--ink);
    font-size: 16px;
    border: 1px solid var(--line);
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <div class="figure-title" id="diagram-title">
    Почему семикратное ускорение требует полного стека
  </div>
  <div id="stage">
    <svg
      id="diagram"
      viewBox="0 0 1120 450"
      width="1120"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"

      <title id="svg-title">Множители ускорения полного стека</title>
      <desc id="svg-desc">
        Полная цепочка NVFP4, MTP и разнесённого сервинга даёт ускорение
        7,2 раза. Ветка без MTP даёт только 3,6 раза.
      </desc>
    </svg>
    <noscript>
      Полный стек: 2× от FP4, 2× от MTP и 1,8× от разнесения дают 7,2×.
      Без MTP остаётся 3,6×.
    </noscript>
  </div>
</figure>

  {

    x: 17,

    texts: [
      {

        value: "Маршрутизация с учётом кэша",
        size: "note",
        weight: "bold",

      },
      {

        value: "сокращает лишние перемещения между пулами",

  {

    x: 87,
    y: 36.8,
    value: "Семь раз даёт система,",
    anchor: "start",

  },

    x: 87,

    value: "а не одна GPU",
    anchor: "start",
    size: "note",
    weight: "bold",
    className: "section-label"

const config = data.find(item => item.kind === "config");
const origin = Object.freeze(config.origin);
const scale = Object.freeze(config.scale);

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  const element = (name, attributes) => {
    const item = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => {
      item.setAttribute(key, String(value));
    });
    return item;
  };

  const appendText = (parent, spec, x) => {
    const text = element("text", {
      x: sx(x),
      y: sy(spec.y),
      "text-anchor": spec.anchor || "middle",
      "dominant-baseline": "middle",
      "font-size": config.font[spec.size],
      "font-weight": spec.weight,
      class: spec.className
    });
    text.textContent = spec.value;
    parent.appendChild(text);
  };

  data
    .filter(item => item.kind === "arrow")
    .forEach(item => {
      const [x1, y1, x2, y2] = item.line;
      const line = element("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        "stroke-width": config.lineWidth,
        class: `flow-line ${item.mode}`
      });
      svg.appendChild(line);

      const head = element("polygon", {
        points: item.head
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" "),
        class: `arrow-head ${item.mode}`
      });
      svg.appendChild(head);
    });

  data
    .filter(item => item.kind === "node")
    .forEach(item => {
      const group = element("g", {});
      const rect = element("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        rx: sx(config.radius) - sx(0),
        ry: sy(config.radius) - sy(0),
        "stroke-width": config.lineWidth,
        class: `node ${item.style}`
      });
      group.appendChild(rect);
      item.texts.forEach(spec => appendText(group, spec, item.cx));
      svg.appendChild(group);
    });

  data
    .filter(item => item.kind === "text")
    .forEach(item => appendText(svg, item, item.x));
} catch (error) {
  const stage = document.getElementById("stage");
  const fallback = document.createElement("p");
  fallback.className = "fallback";
  fallback.textContent = config.fallback;
  stage.replaceChildren(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
