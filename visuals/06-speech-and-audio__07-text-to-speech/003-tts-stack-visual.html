<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три блока конвейера TTS</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b1d22; --muted:#5c6270;
    --data-fill:#eef3fb; --data-stroke:#5a7fb5;
    --block-fill:#fdf0e6; --block-stroke:#c2762c;
    --line:#6b7280; --warn:#a8442a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e9ecf1; --muted:#a0a7b4;
      --data-fill:#1c2534; --data-stroke:#7ea6dd;
      --block-fill:#302015; --block-stroke:#dc9a52;
      --line:#8b93a1; --warn:#e08d70;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{background:var(--bg);padding:10px 12px 14px}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{font-size:13px;color:var(--muted);line-height:1.5}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .t-title{font-size:12px;font-weight:600;fill:var(--fg)}
  .t-sub{font-size:10.5px;fill:var(--muted)}
  .t-note{font-size:11.5px;fill:var(--muted)}
  .t-warn{font-size:10.5px;fill:var(--warn)}
  .t-warn-h{font-size:10.5px;fill:var(--warn);font-weight:600}
  .bx-data{fill:var(--data-fill);stroke:var(--data-stroke)}
  .bx-block{fill:var(--block-fill);stroke:var(--block-stroke)}
  .arw{stroke:var(--line);fill:none}
  .arw-h{fill:var(--line);stroke:none}
</style>
<div class="wrap">
  <h2>Три блока конвейера: что едет по стрелкам</h2>
  <div id="host"><noscript class="fail">текст (44 символа) → frontend → фонемы → акустическая модель → мел [260, 80] ≈ 21 000 чисел → вокодер → волна 72 000 отсчётов.</noscript></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (единицы схемы, не пиксели) ----
    var DATA = {
      chain: [
        {kind:'data',  w:19, lines:['текст','«Please remind me…»','44 символа']},
        {kind:'block', w:15, lines:['frontend'],
                       breaks:['ломается:','чтение чисел и имён']},
        {kind:'data',  w:19, lines:['фонемы','список токенов','P L IY Z  R IH …']},
        {kind:'block', w:15, lines:['акустическая','модель'],
                       breaks:['ломается:','паузы и длительности']},
        {kind:'data',  w:19, lines:['мел-спектрограмма','[260, 80]','≈ 21 000 чисел']},
        {kind:'block', w:15, lines:['вокодер'],
                       breaks:['ломается:','металлический хрип']},
        {kind:'data',  w:19, lines:['волна','[72 000]','3 с × 24 000 Гц']}
      ],
      gap: 6, marginX: 2,
      boxTop: 6, boxBottom: 18, lineGap: 3.2,
      noteY: 2.4, breakY: 21.6,
      headLen: 1.9, headHalf: 1.15
    };

    // ---- единственный origin, единственный scale, единственная пара sx/sy ----
    var origin = {x: 10, y: 12};
    var scale = 6.3;
    function sx(u){ return origin.x + u * scale; }
    function sy(u){ return origin.y + u * scale; }

    // ---- раскладка цепочки по x в единицах схемы ----
    var cursor = DATA.marginX, i;
    for(i = 0; i < DATA.chain.length; i++){
      var n = DATA.chain[i];
      n.x0 = cursor; n.x1 = cursor + n.w; n.xc = cursor + n.w / 2;
      cursor = n.x1 + DATA.gap;
    }
    var lastX = DATA.chain[DATA.chain.length - 1].x1;
    var midX = (DATA.chain[0].x0 + lastX) / 2;
    var cy = (DATA.boxTop + DATA.boxBottom) / 2;

    var out = [];
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function label(x, y, cls, anchor, s){
      out.push('<text x="' + sx(x) + '" y="' + sy(y) + '" class="' + cls +
               '" text-anchor="' + anchor + '">' + esc(s) + '</text>');
    }

    // подпись сверху: откуда берётся рост чисел
    label(midX, DATA.noteY, 't-note', 'middle',
          'каждый блок дописывает то, чего во входе не было: 44 → 21 000 → 72 000 чисел');

    // стрелки между блоками: хвост у правого края предыдущего
    for(i = 0; i + 1 < DATA.chain.length; i++){
      var a = DATA.chain[i], b = DATA.chain[i + 1];
      var tip = b.x0, base = tip - DATA.headLen;
      out.push('<line x1="' + sx(a.x1) + '" y1="' + sy(cy) +
               '" x2="' + sx(base) + '" y2="' + sy(cy) +
               '" class="arw" stroke-width="1.6"/>');
      out.push('<polygon class="arw-h" points="' +
        sx(tip) + ',' + sy(cy) + ' ' +
        sx(base) + ',' + sy(cy - DATA.headHalf) + ' ' +
        sx(base) + ',' + sy(cy + DATA.headHalf) + '"/>');
    }

    // коробки, их подписи и «что ломается» под блоками
    for(i = 0; i < DATA.chain.length; i++){
      var nd = DATA.chain[i];
      var isData = nd.kind === 'data';
      out.push('<rect x="' + sx(nd.x0) + '" y="' + sy(DATA.boxTop) +
               '" width="' + (sx(nd.x1) - sx(nd.x0)) +
               '" height="' + (sy(DATA.boxBottom) - sy(DATA.boxTop)) +
               '" rx="' + (sx(DATA.marginX) - sx(0)) +
               '" class="' + (isData ? 'bx-data' : 'bx-block') +
               '" stroke-width="1.4"/>');

      var k, startY = cy - (nd.lines.length - 1) * DATA.lineGap / 2;
      for(k = 0; k < nd.lines.length; k++){
        label(nd.xc, startY + k * DATA.lineGap + (k === 0 ? 0.4 : 0.6),
              k === 0 ? 't-title' : 't-sub', 'middle', nd.lines[k]);
      }

      if(nd.breaks){
        for(k = 0; k < nd.breaks.length; k++){
          label(nd.xc, DATA.breakY + k * DATA.lineGap,
                k === 0 ? 't-warn-h' : 't-warn', 'middle', nd.breaks[k]);
        }
      }
    }

    host.innerHTML =
      '<svg viewBox="0 0 1040 196" preserveAspectRatio="xMidYMid meet" ' +
      'role="img" aria-label="Конвейер TTS: текст, frontend, фонемы, ' +
      'акустическая модель, мел, вокодер, волна">' +
      '<rect x="0" y="0" width="1040" height="196" fill="var(--bg)"/>' +
      out.join('') + '</svg>';
  }catch(e){
    host.innerHTML = '<p class="fail">Схема должна была показать цепочку: ' +
      'текст «Please remind me…» (44 символа) → <b>frontend</b> (ломается чтение ' +
      'чисел и имён) → фонемы → <b>акустическая модель</b> (ломаются паузы и ' +
      'длительности) → мел-спектрограмма [260, 80] ≈ 21 000 чисел → ' +
      '<b>вокодер</b> (ломается металлический хрип) → волна 72 000 отсчётов ' +
      '(3 с × 24 000 Гц).</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
