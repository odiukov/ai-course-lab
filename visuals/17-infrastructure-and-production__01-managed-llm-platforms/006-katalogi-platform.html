<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как различаются каталоги трёх платформ</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fc;
  --surface:#ffffff;
  --ink:#172033;
  --muted:#5c677d;
  --line:#aab3c5;
  --bed:#ffe1a8;
  --bed-strong:#9a5a00;
  --azure:#d9eaff;
  --azure-strong:#1769aa;
  --foundry:#eef2f8;
  --vertex:#dff5e8;
  --vertex-strong:#16734a;
  --garden:#f0e8ff;
  --garden-strong:#7045a0;
  --result:#202b46;
  --result-ink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111521;
    --surface:#191f2d;
    --ink:#edf2ff;
    --muted:#b3bdd1;
    --line:#566078;
    --bed:#4b3517;
    --bed-strong:#ffc867;
    --azure:#193855;
    --azure-strong:#77bfff;
    --foundry:#252c3b;
    --vertex:#173d2d;
    --vertex-strong:#72dba9;
    --garden:#34264a;
    --garden-strong:#c5a0ff;
    --result:#dce6ff;
    --result-ink:#172033;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{width:100%;max-width:1040px;margin:auto;background:var(--bg)}
header{padding:10px 20px 6px}
h1{margin:0;font-size:21px;line-height:1.2}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
svg{display:none;width:100%;height:auto;max-height:430px;background:var(--bg)}
text{font-family:inherit;fill:var(--ink)}
.panel{fill:var(--surface);stroke:var(--line);stroke-width:2px}
.header-bed{fill:var(--bed);stroke:var(--bed-strong);stroke-width:2px}
.header-azure{fill:var(--azure);stroke:var(--azure-strong);stroke-width:2px}
.header-vertex{fill:var(--vertex);stroke:var(--vertex-strong);stroke-width:2px}
.card-bed{fill:var(--bed);stroke:var(--bed-strong);stroke-width:2px}
.card-azure{fill:var(--azure);stroke:var(--azure-strong);stroke-width:2px}
.foundry{fill:var(--foundry);stroke:var(--line);stroke-width:2px}
.garden{fill:var(--garden);stroke:var(--garden-strong);stroke-width:2px}
.gemini{fill:var(--vertex);stroke:var(--vertex-strong);stroke-width:2px}
.satellite{fill:var(--surface);stroke:var(--garden-strong);stroke-width:2px}
.shelf-bed{stroke:var(--bed-strong);stroke-width:2px}
.boundary{stroke:var(--line);stroke-width:2px}
.title{font-size:17px;font-weight:750}
.subtitle{font-size:12px;fill:var(--muted);font-weight:650}
.card-title{font-size:14px;font-weight:750}
.card-note{font-size:11px;fill:var(--muted)}
.azure-label{font-size:13px;font-weight:700}
.garden-label{font-size:12px;font-weight:750;fill:var(--garden-strong)}
.gemini-title{font-size:19px;font-weight:800;fill:var(--vertex-strong)}
.gemini-note{font-size:12px}
.shape-label{font-size:13px;font-weight:750}
.result{fill:var(--result)}
.result-text{font-size:15px;font-weight:750;fill:var(--result-ink)}
#fallback{margin:8px 20px 16px;padding:14px;background:var(--surface);border:2px solid var(--line);font-size:15px}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="diagram-title">Как различаются каталоги трёх платформ</h1>
    <p>Широкий выбор, глубина одного семейства и собственное ядро с внешним кругом</p>
  </header>
  <svg id="diagram" viewBox="0 0 1040 430" width="1040" height="430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">Сравнение каталогов AWS Bedrock, Azure OpenAI и Vertex AI.</desc>
  </svg>
  <p id="fallback">Схема должна была показать три витрины: Bedrock с несколькими независимыми семействами, Azure OpenAI только с моделями OpenAI и Vertex AI с ядром Gemini и отдельным Model Garden.</p>
</main>
<script>
const DATA=[
  {kind:"config",origin:{x:20,y:10},scale:{x:10,y:10}},

  {kind:"rect",x:1,y:1,w:32,h:32,rx:1,cls:"panel"},
  {kind:"rect",x:1,y:1,w:32,h:5,rx:1,cls:"header-bed"},
  {kind:"text",x:17,y:3.1,anchor:"middle",cls:"title",lines:["AWS BEDROCK"]},
  {kind:"text",x:17,y:4.8,anchor:"middle",cls:"subtitle",lines:["много разработчиков · одна оболочка"]},

  {kind:"rect",x:2.2,y:9,w:5.4,h:10,rx:.7,cls:"card-bed"},
  {kind:"text",x:4.9,y:13,anchor:"middle",cls:"card-title",lines:["Claude"]},
  {kind:"text",x:4.9,y:16.4,anchor:"middle",cls:"card-note",lines:["Anthropic"]},

  {kind:"rect",x:8.3,y:9,w:5.4,h:10,rx:.7,cls:"card-bed"},
  {kind:"text",x:11,y:13,anchor:"middle",cls:"card-title",lines:["Llama"]},
  {kind:"text",x:11,y:16.4,anchor:"middle",cls:"card-note",lines:["Meta"]},

  {kind:"rect",x:14.4,y:9,w:5.4,h:10,rx:.7,cls:"card-bed"},
  {kind:"text",x:17.1,y:13,anchor:"middle",cls:"card-title",lines:["Titan"]},
  {kind:"text",x:17.1,y:16.4,anchor:"middle",cls:"card-note",lines:["AWS"]},

  {kind:"rect",x:20.5,y:9,w:5.4,h:10,rx:.7,cls:"card-bed"},
  {kind:"text",x:23.2,y:13,anchor:"middle",cls:"card-title",lines:["Mistral"]},
  {kind:"text",x:23.2,y:16.4,anchor:"middle",cls:"card-note",lines:["Mistral AI"]},

  {kind:"rect",x:26.6,y:9,w:5.4,h:10,rx:.7,cls:"card-bed"},
  {kind:"text",x:29.3,y:13,anchor:"middle",cls:"card-title",lines:["Cohere"]},
  {kind:"text",x:29.3,y:16.4,anchor:"middle",cls:"card-note",lines:["Cohere"]},

  {kind:"line",x1:2.3,y1:22,x2:31.9,y2:22,cls:"shelf-bed"},
  {kind:"line",x1:2.3,y1:22,x2:3.4,y2:21.2,cls:"shelf-bed"},
  {kind:"line",x1:2.3,y1:22,x2:3.4,y2:22.8,cls:"shelf-bed"},
  {kind:"line",x1:31.9,y1:22,x2:30.8,y2:21.2,cls:"shelf-bed"},
  {kind:"line",x1:31.9,y1:22,x2:30.8,y2:22.8,cls:"shelf-bed"},
  {kind:"text",x:17.1,y:24.5,anchor:"middle",cls:"shape-label",lines:["широкий горизонтальный ряд"]},
  {kind:"text",x:6.4,y:28.1,anchor:"middle",cls:"card-note",lines:["текст"]},
  {kind:"text",x:17.1,y:28.1,anchor:"middle",cls:"card-note",lines:["изображения"]},
  {kind:"text",x:27.8,y:28.1,anchor:"middle",cls:"card-note",lines:["эмбеддинги"]},
  {kind:"text",x:17.1,y:31.1,anchor:"middle",cls:"subtitle",lines:["ФОРМА: ВЫБОР МЕЖДУ СЕМЕЙСТВАМИ"]},

  {kind:"rect",x:34.5,y:1,w:29,h:32,rx:1,cls:"panel"},
  {kind:"rect",x:34.5,y:1,w:29,h:5,rx:1,cls:"header-azure"},
  {kind:"text",x:49,y:3.1,anchor:"middle",cls:"title",lines:["AZURE OPENAI"]},
  {kind:"text",x:49,y:4.8,anchor:"middle",cls:"subtitle",lines:["глубина внутри семейства OpenAI"]},

  {kind:"rect",x:36,y:8,w:18.2,h:21.5,rx:.7,cls:"panel"},
  {kind:"text",x:45.1,y:10.1,anchor:"middle",cls:"subtitle",lines:["AZURE OPENAI SERVICE"]},
  {kind:"rect",x:37.2,y:11.2,w:15.8,h:3,rx:.5,cls:"card-azure"},
  {kind:"text",x:45.1,y:13.2,anchor:"middle",cls:"azure-label",lines:["GPT‑4 / 4o / 5"]},
  {kind:"rect",x:37.2,y:15,w:15.8,h:3,rx:.5,cls:"card-azure"},
  {kind:"text",x:45.1,y:17,anchor:"middle",cls:"azure-label",lines:["серия o · рассуждение"]},
  {kind:"rect",x:37.2,y:18.8,w:15.8,h:3,rx:.5,cls:"card-azure"},
  {kind:"text",x:45.1,y:20.8,anchor:"middle",cls:"azure-label",lines:["DALL·E · изображения"]},
  {kind:"rect",x:37.2,y:22.6,w:15.8,h:3,rx:.5,cls:"card-azure"},
  {kind:"text",x:45.1,y:24.6,anchor:"middle",cls:"azure-label",lines:["Whisper · речь"]},
  {kind:"rect",x:37.2,y:26.4,w:15.8,h:2,rx:.5,cls:"card-azure"},
  {kind:"text",x:45.1,y:27.9,anchor:"middle",cls:"card-note",lines:["файнтюнинг OpenAI"]},

  {kind:"line",x1:55.1,y1:8,x2:55.1,y2:29.5,cls:"boundary"},
  {kind:"rect",x:56,y:8,w:6.1,h:21.5,rx:.7,cls:"foundry"},
  {kind:"text",x:59.05,y:11.2,anchor:"middle",cls:"subtitle",
   lines:[{y:11.2,text:"AZURE AI"},{y:13,text:"FOUNDRY"}]},
  {kind:"text",x:59.05,y:17.2,anchor:"middle",cls:"card-note",
   lines:[{y:17.2,text:"сторонние"},{y:19,text:"модели"}]},
  {kind:"text",x:59.05,y:24,anchor:"middle",cls:"card-note",
   lines:[{y:24,text:"отдельный"},{y:25.8,text:"продукт"}]},
  {kind:"text",x:49,y:31.1,anchor:"middle",cls:"subtitle",lines:["ФОРМА: ГЛУБИНА ОДНОГО СЕМЕЙСТВА"]},

  {kind:"rect",x:65,y:1,w:36.5,h:32,rx:1,cls:"panel"},
  {kind:"rect",x:65,y:1,w:36.5,h:5,rx:1,cls:"header-vertex"},
  {kind:"text",x:83.25,y:3.1,anchor:"middle",cls:"title",lines:["VERTEX AI"]},
  {kind:"text",x:83.25,y:4.8,anchor:"middle",cls:"subtitle",lines:["собственное ядро · выбор вокруг него"]},

  {kind:"ellipse",cx:83.25,cy:18.8,rx:16.3,ry:10.7,cls:"garden"},
  {kind:"text",x:83.25,y:10.4,anchor:"middle",cls:"garden-label",lines:["MODEL GARDEN · ВНЕШНИЙ КРУГ"]},
  {kind:"rect",x:68.2,y:16,w:7.2,h:5.8,rx:.7,cls:"satellite"},
  {kind:"text",x:71.8,y:18.4,anchor:"middle",cls:"card-note",
   lines:[{y:18.4,text:"сторонние"},{y:20,text:"модели"}]},
  {kind:"rect",x:91.1,y:16,w:7.2,h:5.8,rx:.7,cls:"satellite"},
  {kind:"text",x:94.7,y:18.4,anchor:"middle",cls:"card-note",
   lines:[{y:18.4,text:"открытые"},{y:20,text:"модели"}]},
  {kind:"ellipse",cx:83.25,cy:19,rx:7.2,ry:6.3,cls:"gemini"},
  {kind:"text",x:83.25,y:17.8,anchor:"middle",cls:"gemini-title",lines:["Gemini"]},
  {kind:"text",x:83.25,y:20.1,anchor:"middle",cls:"gemini-note",lines:["1.5 / 2.0 / 2.5"]},
  {kind:"text",x:83.25,y:22.3,anchor:"middle",cls:"gemini-note",lines:["Flash · Pro"]},
  {kind:"text",x:83.25,y:25.1,anchor:"middle",cls:"subtitle",lines:["собственная линия Google"]},
  {kind:"text",x:83.25,y:31.1,anchor:"middle",cls:"subtitle",lines:["ФОРМА: ЯДРО + ДОПОЛНИТЕЛЬНЫЙ ВЫБОР"]},

  {kind:"rect",x:1,y:35,w:100.5,h:5.8,rx:.8,cls:"result"},
  {kind:"text",x:51.25,y:37.4,anchor:"middle",cls:"result-text",
   lines:["Claude → Bedrock   ·   GPT → Azure OpenAI   ·   Gemini → Vertex AI"]},
  {kind:"text",x:51.25,y:39.5,anchor:"middle",cls:"result-text",
   lines:["одна платформа не закрывает весь набор"]}
];

const [{origin,scale},...items]=DATA;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const svg=document.getElementById("diagram");
const fallback=document.getElementById("fallback");
const NS="http://www.w3.org/2000/svg";

try{
  for(const item of items){
    const element=document.createElementNS(NS,item.kind==="text"?"text":item.kind);
    if(item.cls) element.setAttribute("class",item.cls);

    if(item.kind==="rect"){
      element.setAttribute("x",sx(item.x));
      element.setAttribute("y",sy(item.y));
      element.setAttribute("width",sx(item.x+item.w)-sx(item.x));
      element.setAttribute("height",sy(item.y+item.h)-sy(item.y));
      element.setAttribute("rx",sx(item.x+item.rx)-sx(item.x));
      element.setAttribute("ry",sy(item.y+item.rx)-sy(item.y));
    }

    if(item.kind==="line"){
      element.setAttribute("x1",sx(item.x1));
      element.setAttribute("y1",sy(item.y1));
      element.setAttribute("x2",sx(item.x2));
      element.setAttribute("y2",sy(item.y2));
    }

    if(item.kind==="ellipse"){
      element.setAttribute("cx",sx(item.cx));
      element.setAttribute("cy",sy(item.cy));
      element.setAttribute("rx",sx(item.cx+item.rx)-sx(item.cx));
      element.setAttribute("ry",sy(item.cy+item.ry)-sy(item.cy));
    }

    if(item.kind==="text"){
      element.setAttribute("x",sx(item.x));
      element.setAttribute("y",sy(item.y));
      element.setAttribute("text-anchor",item.anchor);
      for(const line of item.lines){
        const span=document.createElementNS(NS,"tspan");
        span.setAttribute("x",sx(item.x));
        span.setAttribute("y",sy(typeof line==="string"?item.y:line.y));
        span.textContent=typeof line==="string"?line:line.text;
        element.appendChild(span);
      }
    }

    svg.appendChild(element);
  }
  svg.style.display="block";
  fallback.hidden=true;
}catch(error){
  svg.style.display="none";
  fallback.hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
