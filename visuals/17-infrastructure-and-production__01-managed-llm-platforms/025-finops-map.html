<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Три схемы атрибуции расходов</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --text:#172033;
  --muted:#5d687c;
  --line:#aab4c5;
  --lane:#eef2f8;
  --bed:#2563eb;
  --bed-soft:#e6efff;
  --vertex:#16826c;
  --vertex-soft:#e2f5ef;
  --azure:#8b5cf6;
  --azure-soft:#f0eaff;
  --cost:#c2410c;
  --cost-soft:#fff0e8;
  --warn:#8a5a00;
  --warn-soft:#fff5cf;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10141d;
    --panel:#171d29;
    --text:#edf2fb;
    --muted:#aab5c8;
    --line:#657086;
    --lane:#1c2432;
    --bed:#75a7ff;
    --bed-soft:#182a48;
    --vertex:#63d5bc;
    --vertex-soft:#16382f;
    --azure:#bda3ff;
    --azure-soft:#30264d;
    --cost:#ff9a6c;
    --cost-soft:#40251d;
    --warn:#ffd36a;
    --warn-soft:#3b3219;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{
  margin:0;
  max-height:520px;
  overflow:hidden;
  background:var(--panel);
}
h1{
  margin:0;
  padding:10px 18px;
  font-size:18px;
  line-height:22px;
  font-weight:700;
  color:var(--text);
  background:var(--panel);
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:470px;
  background:var(--panel);
}
svg text{font-family:inherit}
.lane{fill:var(--lane)}
.rule,.flow,.effort{fill:none;stroke:var(--line);stroke-linecap:round}
.node{stroke-width:2}
.bed{fill:var(--bed-soft);stroke:var(--bed)}
.vertex{fill:var(--vertex-soft);stroke:var(--vertex)}
.azure{fill:var(--azure-soft);stroke:var(--azure)}
.cost{fill:var(--cost-soft);stroke:var(--cost)}
.primary{fill:var(--text)}
.muted{fill:var(--muted)}
.bed-text{fill:var(--bed)}
.vertex-text{fill:var(--vertex)}
.azure-text{fill:var(--azure)}
.cost-text{fill:var(--cost)}
.arrow-bed{fill:var(--bed)}
.arrow-vertex{fill:var(--vertex)}
.arrow-azure{fill:var(--azure)}
.flow-bed{stroke:var(--bed)}
.flow-vertex{stroke:var(--vertex)}
.flow-azure{stroke:var(--azure)}
.warning{fill:var(--warn-soft);stroke:var(--warn)}
.warning-text{fill:var(--warn)}
.error{margin:12px 18px;color:var(--text)}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Три схемы атрибуции расходов</h1>
  <svg id="diagram" viewBox="0 0 1200 470" width="1200" height="470"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Три маршрута от вызова модели к строке расходов: Bedrock, Vertex AI и Azure"></svg>
</figure>
<script>
const diagramData = [
  {
    zero:0, corner:7, laneX:18, laneW:1112, laneH:88,
    arrowBack:11, arrowWing:6, markerR:6,
    header:{x:30,y:19,ruleX1:30,ruleX2:1130,ruleY:34},
    effort:{
      title:{x:30,y:356,text:"Шкала усилий"},
      x1:170,x2:1040,y:378,
      markers:[
        {x:250,y:378,tone:"bed",title:"Готовая детализация",sub:"поставить теги"},
        {x:590,y:378,tone:"vertex",title:"Конструктор отчётов",sub:"проекты, labels и SQL"},
        {x:930,y:378,tone:"azure",title:"Свой слой наблюдения",sub:"телеметрия и объединение"}
      ]
    },
    warning:{
      x:155,y:438,w:850,h:28,
      textX:580,textY:452,
      text:"Нет метки во время вызова → позднее счёт сам её не восстановит"
    }
  },
  {
    key:"bed", name:"Bedrock", y:44, centerY:88,
    note:"короткий нативный маршрут",
    nodes:[
      {x:148,y:70,w:88,h:36,tone:"bed",lines:[
        {x:192,y:88,text:"Вызов",size:13,weight:"bold"}
      ]},
      {x:276,y:55,w:178,h:66,tone:"bed",lines:[
        {x:365,y:69,text:"Application Inference Profile",size:12,weight:"bold"},
        {x:365,y:89,text:"team · product · feature",size:12,weight:"bold"},
        {x:365,y:108,text:"теги владельца и функции",size:11,kind:"muted"}
      ]},
      {x:500,y:67,w:130,h:42,tone:"bed",lines:[
        {x:565,y:82,text:"CloudWatch",size:13,weight:"bold"},
        {x:565,y:99,text:"группировка",size:11,kind:"muted"}
      ]},
      {x:950,y:57,w:175,h:62,tone:"cost",lines:[
        {x:1037,y:72,text:"Строка расходов",size:12,weight:"bold"},
        {x:1037,y:91,text:"team / product / feature",size:11,kind:"cost-text"},
        {x:1037,y:108,text:"видна сразу",size:11,kind:"muted"}
      ]}
    ],
    links:[
      {x1:236,y1:88,x2:276,y2:88},
      {x1:454,y1:88,x2:500,y2:88},
      {x1:630,y1:88,x2:950,y2:88,label:{
        x:770,y:88,text:"нативная атрибуция",side:"top"
      }}
    ]
  },
  {
    key:"vertex", name:"Vertex AI", y:144, centerY:188,
    note:"гибкий маршрут через данные",
    nodes:[
      {x:148,y:170,w:88,h:36,tone:"vertex",lines:[
        {x:192,y:188,text:"Вызов",size:13,weight:"bold"}
      ]},
      {x:266,y:161,w:122,h:54,tone:"vertex",lines:[
        {x:327,y:178,text:"Командный",size:12,weight:"bold"},
        {x:327,y:197,text:"GCP-проект",size:12,weight:"bold"}
      ]},
      {x:424,y:166,w:88,h:44,tone:"vertex",lines:[
        {x:468,y:181,text:"labels",size:13,weight:"bold"},
        {x:468,y:199,text:"назначение",size:10,kind:"muted"}
      ]},
      {x:550,y:158,w:164,h:60,tone:"vertex",lines:[
        {x:632,y:176,text:"BigQuery",size:13,weight:"bold"},
        {x:632,y:194,text:"Billing Export",size:12,weight:"bold"},
        {x:632,y:209,text:"данные о расходах",size:10,kind:"muted"}
      ]},
      {x:752,y:166,w:74,h:44,tone:"vertex",lines:[
        {x:789,y:181,text:"SQL",size:13,weight:"bold"},
        {x:789,y:199,text:"нужный срез",size:10,kind:"muted"}
      ]},
      {x:950,y:157,w:175,h:62,tone:"cost",lines:[
        {x:1037,y:173,text:"Строка расходов",size:12,weight:"bold"},
        {x:1037,y:192,text:"команда + labels",size:11,kind:"cost-text"},
        {x:1037,y:209,text:"после запроса",size:11,kind:"muted"}
      ]}
    ],
    links:[
      {x1:236,y1:188,x2:266,y2:188},
      {x1:388,y1:188,x2:424,y2:188},
      {x1:512,y1:188,x2:550,y2:188},
      {x1:714,y1:188,x2:752,y2:188},
      {x1:826,y1:188,x2:950,y2:188,label:{
        x:888,y:188,text:"срез запросом",side:"bottom"
      }}
    ]
  },
  {
    key:"azure", name:"Azure", y:244, centerY:288,
    note:"детализация через свою телеметрию",
    nodes:[
      {x:148,y:270,w:88,h:36,tone:"azure",lines:[
        {x:192,y:288,text:"Вызов",size:13,weight:"bold"}
      ]},
      {x:266,y:257,w:186,h:62,tone:"azure",lines:[
        {x:359,y:274,text:"Resource group",size:12,weight:"bold"},
        {x:359,y:292,text:"+ PTU reservation",size:12,weight:"bold"},
        {x:359,y:308,text:"объекты затрат",size:10,kind:"muted"}
      ]},
      {x:492,y:257,w:188,h:62,tone:"azure",lines:[
        {x:586,y:274,text:"Application Insights",size:12,weight:"bold"},
        {x:586,y:292,text:"или шлюз",size:12,weight:"bold"},
        {x:586,y:308,text:"свои метрики / заголовки",size:10,kind:"muted"}
      ]},
      {x:720,y:262,w:122,h:52,tone:"azure",lines:[
        {x:781,y:278,text:"Детализация",size:11,weight:"bold"},
        {x:781,y:296,text:"запросов",size:12,weight:"bold"}
      ]},
      {x:950,y:257,w:175,h:62,tone:"cost",lines:[
        {x:1037,y:273,text:"Строка расходов",size:12,weight:"bold"},
        {x:1037,y:292,text:"функция продукта",size:11,kind:"cost-text"},
        {x:1037,y:309,text:"после объединения",size:11,kind:"muted"}
      ]}
    ],
    links:[
      {x1:236,y1:288,x2:266,y2:288},
      {x1:452,y1:288,x2:492,y2:288},
      {x1:680,y1:288,x2:720,y2:288},
      {x1:842,y1:288,x2:950,y2:288}
    ]
  }
];

const origin = {x:24,y:4};
const scale = 1;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

const labelPad = 8;
const lineWidth = 2;
const titleFontSize = 13;
const bodyFontSize = 12;
const svg = document.getElementById("diagram");
const ns = "http://www.w3.org/2000/svg";

try {
  const [cfg, ...lanes] = diagramData;

  function el(name, attrs, parent=svg) {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key,value]) => node.setAttribute(key,value));
    parent.appendChild(node);
    return node;
  }

  function rect(item, className) {
    return el("rect", {
      x:sx(item.x), y:sy(item.y),
      width:sx(item.x+item.w)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(cfg.corner)-sx(cfg.zero),
      class:className
    });
  }

  function text(item, className="primary") {
    const node = el("text", {
      x:sx(item.x), y:sy(item.y),
      "text-anchor":item.anchor || "middle",
      "dominant-baseline":"middle",
      "font-size":item.size || bodyFontSize,
      "font-weight":item.weight || "normal",
      class:item.kind || className
    });
    node.textContent = item.text;
    return node;
  }

  function arrow(link, tone) {
    el("line", {
      x1:sx(link.x1), y1:sy(link.y1),
      x2:sx(link.x2), y2:sy(link.y2),
      "stroke-width":lineWidth,
      class:`flow flow-${tone}`
    });
    el("polygon", {
      points:[
        `${sx(link.x2)},${sy(link.y2)}`,
        `${sx(link.x2-cfg.arrowBack)},${sy(link.y2-cfg.arrowWing)}`,
        `${sx(link.x2-cfg.arrowBack)},${sy(link.y2+cfg.arrowWing)}`
      ].join(" "),
      class:`arrow-${tone}`
    });
    if (link.label) {
      const label = text({
        x:link.label.x, y:link.label.y,
        text:link.label.text, size:bodyFontSize
      },"muted");
      if (link.label.side === "top") label.setAttribute("dy",`-${labelPad}`);
      if (link.label.side === "bottom") label.setAttribute("dy",labelPad);
    }
  }

  text({
    x:cfg.header.x, y:cfg.header.y,
    text:"€4 000 дороже: вызов → владелец → строка расходов",
    size:titleFontSize, weight:"bold", anchor:"start"
  });
  el("line",{
    x1:sx(cfg.header.ruleX1),y1:sy(cfg.header.ruleY),
    x2:sx(cfg.header.ruleX2),y2:sy(cfg.header.ruleY),
    "stroke-width":lineWidth,class:"rule"
  });

  lanes.forEach(lane => {
    rect({x:cfg.laneX,y:lane.y,w:cfg.laneW,h:cfg.laneH},"lane");
    text({
      x:34,y:lane.centerY-10,text:lane.name,
      size:titleFontSize,weight:"bold",anchor:"start",
      kind:`${lane.key}-text`
    });
    text({
      x:34,y:lane.centerY+12,text:lane.note,
      size:bodyFontSize,anchor:"start",kind:"muted"
    });
    lane.links.forEach(link => arrow(link,lane.key));
    lane.nodes.forEach(node => {
      rect(node,`node ${node.tone}`);
      node.lines.forEach(line => text(line));
    });
  });

  text({
    x:cfg.effort.title.x,y:cfg.effort.title.y,
    text:cfg.effort.title.text,size:titleFontSize,
    weight:"bold",anchor:"start"
  });
  el("line",{
    x1:sx(cfg.effort.x1),y1:sy(cfg.effort.y),
    x2:sx(cfg.effort.x2),y2:sy(cfg.effort.y),
    "stroke-width":lineWidth,class:"effort"
  });
  el("polygon",{
    points:[
      `${sx(cfg.effort.x2)},${sy(cfg.effort.y)}`,
      `${sx(cfg.effort.x2-cfg.arrowBack)},${sy(cfg.effort.y-cfg.arrowWing)}`,
      `${sx(cfg.effort.x2-cfg.arrowBack)},${sy(cfg.effort.y+cfg.arrowWing)}`
    ].join(" "),
    class:"muted"
  });

  cfg.effort.markers.forEach(marker => {
    el("circle",{
      cx:sx(marker.x),cy:sy(marker.y),
      r:sx(marker.x+cfg.markerR)-sx(marker.x),
      class:marker.tone
    });
    text({
      x:marker.x,y:401,text:marker.title,
      size:bodyFontSize,weight:"bold",kind:`${marker.tone}-text`
    });
    text({
      x:marker.x,y:420,text:marker.sub,
      size:bodyFontSize,kind:"muted"
    });
  });

  rect(cfg.warning,"warning");
  text({
    x:cfg.warning.textX,y:cfg.warning.textY,
    text:cfg.warning.text,size:bodyFontSize,
    weight:"bold",kind:"warning-text"
  });
} catch (error) {
  svg.replaceChildren();
  const fallback = document.createElement("p");
  fallback.className = "error";
  fallback.textContent = "Схема должна была показать три маршрута: Bedrock — профиль с тегами и CloudWatch; Vertex AI — командный проект, labels и BigQuery Billing Export; Azure — resource group, PTU reservation и собственная телеметрия запросов.";
  svg.insertAdjacentElement("afterend",fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
