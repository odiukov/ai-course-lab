<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Вход энкодера: 197 × 768</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1b1f27; --mut:#5d6673;
    --row:#e8edf6; --rowline:#b9c4d6; --cls:#f4d7a8; --clsline:#c08a2e;
    --acc:#2f6bd8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --ink:#e8ecf3; --mut:#98a3b4;
      --row:#222b3a; --rowline:#3d4b63; --cls:#5a4520; --clsline:#d8a441;
      --acc:#79a6ff;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 6px 10px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--mut);line-height:1.5;white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Вход энкодера: таблица 197 × 768</h2>
  <div id="host"><noscript class="fail">197 строк по 768 чисел: строка 0 — [CLS], строки 1…196 — патчи в растровом порядке (0,0)…(13,13). Сбоку прибавляется positional.</noscript></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    var NS='http://www.w3.org/2000/svg';
    var VBW=1000, VBH=470;

    // ---- данные схемы (единственные литералы-данные) ----
    var ROWS=[
      {i:0,   tag:'[CLS]', cls:true},
      {i:1,   tag:'патч (0,0)'},
      {i:2,   tag:'патч (0,1)'},
      {i:3,   tag:'патч (0,2)'},
      {i:null,tag:'…', gap:true},
      {i:196, tag:'патч (13,13)'}
    ];
    var DM=768, NTOK=197;

    // ---- одна система координат ----
    var origin={x:250, y:40}, scale={x:52, y:44};
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y + y*scale.y; }

    var LW=1.4, FS=13, FSM=12, PAD=8;

    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+VBW+' '+VBH);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(x,y,s,anchor,fill,size,weight){
      var t=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
        'font-size':(size||FS),'fill':fill||'var(--ink)',
        'font-family':'system-ui,sans-serif','dominant-baseline':'middle'});
      if(weight)t.setAttribute('font-weight',weight);
      t.textContent=s;return t;
    }

    // ширина полосы в единицах сетки: 768 столбцов показаны как блок ширины 8
    var W=8;                 // ширина таблицы, ед.
    var nR=ROWS.length;      // 6 нарисованных строк

    // ---- строки таблицы ----
    ROWS.forEach(function(r,k){
      var y0=sy(k), y1=sy(k+1);
      if(r.gap){
        txt(sx(W/2), (y0+y1)/2, '⋮  ещё 192 строки  ⋮','middle','var(--mut)',FSM);
        txt(sx(0)-PAD, (y0+y1)/2, '…','end','var(--mut)',FSM);
        return;
      }
      el('rect',{x:sx(0),y:y0,width:sx(W)-sx(0),height:y1-y0,
        fill:r.cls?'var(--cls)':'var(--row)',
        stroke:r.cls?'var(--clsline)':'var(--rowline)','stroke-width':LW});
      // индекс строки слева от таблицы
      txt(sx(0)-PAD, (y0+y1)/2, r.i, 'end','var(--mut)',FSM);
      // подпись токена ещё левее
      txt(sx(0)-PAD*4, (y0+y1)/2, r.tag,'end',
        r.cls?'var(--clsline)':'var(--ink)',FS, r.cls?'600':null);
      // 768 чисел внутри строки
      txt(sx(W/2),(y0+y1)/2,'768 чисел','middle','var(--mut)',FSM);
    });

    var top=sy(0), bot=sy(nR);

    // ---- подпись «768 столбцов = d_model» сверху ----
    el('line',{x1:sx(0),y1:top-PAD*2,x2:sx(W),y2:top-PAD*2,
      stroke:'var(--mut)','stroke-width':LW});
    txt(sx(W/2), top-PAD*3.4, '768 столбцов · d_model','middle','var(--mut)',FSM);

    // ---- скоба слева: 197 строк ----
    var bx=sx(0)-PAD*13;
    el('path',{d:'M '+(bx+PAD)+' '+top+' L '+bx+' '+top+' L '+bx+' '+bot+' L '+(bx+PAD)+' '+bot,
      fill:'none',stroke:'var(--mut)','stroke-width':LW});
    var lab=txt(bx-PAD, (top+bot)/2, NTOK+' строк · токены','middle','var(--mut)',FSM);
    lab.setAttribute('transform','rotate(-90 '+(bx-PAD)+' '+((top+bot)/2)+')');

    // ---- стрелка «+ positional» справа ----
    var ax0=sx(W+2.6), ax1=sx(W)+PAD, ay=(top+bot)/2;
    el('line',{x1:ax0,y1:ay,x2:ax1,y2:ay,stroke:'var(--acc)','stroke-width':LW*1.6});
    el('path',{d:'M '+ax1+' '+ay+' L '+(ax1+PAD*1.6)+' '+(ay-PAD*0.8)+
      ' L '+(ax1+PAD*1.6)+' '+(ay+PAD*0.8)+' Z',fill:'var(--acc)'});
    // подпись у ХВОСТА стрелки
    txt(ax0+PAD, ay-PAD*2.2, '+ positional','start','var(--acc)',FS,'600');
    txt(ax0+PAD, ay+PAD*2.2, 'row и col — внутрь чисел','start','var(--mut)',FSM);

    // ---- нижняя строка: форма ----
    txt(sx(W/2), bot+PAD*3.2, 'форма (197, 768) — с батчем (B, 197, 768)',
      'middle','var(--ink)',FS,'600');
    txt(sx(W/2), bot+PAD*6, 'ни 224, ни 16, ни 14, ни 3 в форме больше нет',
      'middle','var(--mut)',FSM);

    host.innerHTML='';
    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема не построилась. Она должна показывать: '+
      'полосу из 197 строк по 768 чисел; строка 0 помечена [CLS], строки 1…196 — '+
      'патчи в растровом порядке от (0,0) до (13,13); сбоку стрелка «+ positional». '+
      'Итоговая форма — (197, 768), с батчем (B, 197, 768).</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
