<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Почему PAF не соединяет плечо с чужим локтем</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5c667a;
      --body: #8692a8;
      --person-a: #1677a6;
      --person-b: #7756b3;
      --field-a: #168966;
      --field-b: #168966;
      --field-soft-a: #bce7d8;
      --field-soft-b: #bce7d8;
      --wrong: #d65b35;
      --wrong-soft: #f4c2b4;
      --joint-fill: #ffffff;
      --guide: #b3bbc9;
      --border: #d8dee8;
      --note-bg: #eef8f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #171f2d;
        --ink: #edf2fa;
        --muted: #adb8ca;
        --body: #738096;
        --person-a: #55b9e7;
        --person-b: #b395e8;
        --field-a: #52d5a4;
        --field-b: #52d5a4;
        --field-soft-a: #244f46;
        --field-soft-b: #244f46;
        --wrong: #ff8c68;
        --wrong-soft: #713d34;
        --joint-fill: #171f2d;
        --guide: #566176;
        --border: #344054;
        --note-bg: #18342f;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .heading {
      padding: 12px 18px 4px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--panel);
    }

    .fallback {
      margin: 0;
      padding: 18px;
      color: var(--ink);
      font-size: 16px;
    }

    text {
      font-family: inherit;
      fill: var(--ink);
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title">
    <figcaption class="heading" id="figure-title">
      Почему PAF не соединяет плечо с чужим локтем
    </figcaption>
    <svg id="diagram" viewBox="0 0 960 440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Два человека с пересечёнными руками. Стрелки PAF идут вдоль правильных связей плеча и локтя, а на пути к чужому локтю направлены несогласованно, поэтому интеграл близок к нулю."></svg>
    <p id="fallback" class="fallback" hidden>
      Схема должна была показать двух людей: вдоль правильных связей
      «плечо — локоть» стрелки PAF сонаправлены, а путь к чужому локтю
      пересекает поле поперёк и получает интеграл около нуля.
    </p>
  </figure>

  <script>
    const data = {
      people: [
        {
          name: "Человек А",
          color: "var(--person-a)",
          head: { x: 4.25, y: 1.05 },
          headRadius: 0.48,
          neck: { x: 4.25, y: 1.58 },
          shoulder: { x: 4.4, y: 2.35 },
          otherShoulder: { x: 3.25, y: 2.35 },
          hip: { x: 3.85, y: 5.45 },
          ownElbow: { x: 10.15, y: 4.65 }
        },
        {
          name: "Человек Б",
          color: "var(--person-b)",
          head: { x: 14.75, y: 1.05 },
          headRadius: 0.48,
          neck: { x: 14.75, y: 1.58 },
          shoulder: { x: 14.6, y: 2.35 },
          otherShoulder: { x: 15.75, y: 2.35 },
          hip: { x: 15.15, y: 5.45 },
          ownElbow: { x: 8.0, y: 4.35 }
        }
      ],
      fieldSamples: [
        { limb: "a", t: 0.18, length: 0.62 },
        { limb: "a", t: 0.36, length: 0.62 },
        { limb: "a", t: 0.54, length: 0.62 },
        { limb: "a", t: 0.72, length: 0.62 },
        { limb: "a", t: 0.88, length: 0.62 },
        { limb: "b", t: 0.16, length: 0.62 },
        { limb: "b", t: 0.34, length: 0.62 },
        { limb: "b", t: 0.52, length: 0.62 },
        { limb: "b", t: 0.70, length: 0.62 },
        { limb: "b", t: 0.86, length: 0.62 }
      ],
      crossSamples: [
        {
          at: { x: 5.25, y: 2.82 },
          vector: { x: 0.62, y: 0.25 }
        },
        {
          at: { x: 6.18, y: 3.34 },
          vector: { x: -0.54, y: -0.34 }
        },
        {
          at: { x: 7.12, y: 3.86 },
          vector: { x: -0.18, y: 0.62 }
        }
      ],
      labels: [
        {
          text: "Плечо А",
          at: { x: 4.4, y: 2.35 },
          dx: -12,
          dy: -14,
          anchor: "end"
        },
        {
          text: "Плечо Б",
          at: { x: 14.6, y: 2.35 },
          dx: 12,
          dy: -14,
          anchor: "start"
        },
        {
          text: "свой локоть А",
          at: { x: 10.15, y: 4.65 },
          dx: 12,
          dy: 24,
          anchor: "start"
        },
        {
          text: "чужой локоть Б",
          at: { x: 8.0, y: 4.35 },
          dx: -12,
          dy: 28,
          anchor: "end"
        }
      ],
      annotations: [
        {
          text: "PAF сопровождает правильные связи",
          at: { x: 9.5, y: 1.45 },
          anchor: "middle"
        },
        {
          text: "к чужому локтю",
          at: { x: 3.75, y: 4.55 },
          anchor: "end"
        },
        {
          text: "поперёк и против пути",
          at: { x: 3.75, y: 5.02 },
          anchor: "end"
        }
      ],
      connectors: [
        {
          from: { x: 4.0, y: 4.48 },
          to: { x: 6.18, y: 3.34 }
        },
        {
          from: { x: 9.5, y: 1.65 },
          to: { x: 9.0, y: 3.95 }
        }
      ],
      legend: [
        {
          from: { x: 1.15, y: 7.55 },
          to: { x: 2.25, y: 7.55 },
          textAt: { x: 2.55, y: 7.55 },
          text: "сонаправлено вдоль пути → высокий интеграл",
          color: "var(--field-a)"
        },
        {
          from: { x: 1.15, y: 8.28 },
          to: { x: 2.25, y: 8.28 },
          textAt: { x: 2.55, y: 8.28 },
          text: "направления гасят друг друга → ∫ PAF · d̂ ≈ 0",
          color: "var(--wrong)"
        }
      ],
      zeroZone: [
        { x: 10.75, y: 3.03 },
        { x: 11.25, y: 3.22 },
        { x: 11.72, y: 3.05 }
      ],
      style: {
        torsoWidth: 5,
        limbUnderWidth: 15,
        limbWidth: 4,
        candidateWidth: 4,
        guideWidth: 2,
        arrowWidth: 3,
        connectorWidth: 2,
        jointWidth: 4,
        jointRadius: 0.15,
        head: 0.18,
        headHalf: 0.13,
        fieldOffset: 0.01,
        dotRadius: 0.055
      }
    };

    const origin = { x: 52, y: 12 };
    const scale = { x: 45, y: 48 };

    function toPx(point) {
      return {
        x: origin.x + point.x * scale.x,
        y: origin.y + point.y * scale.y
      };
    }

    const root = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const make = (tag, attrs, parent = root) => {
        const element = document.createElementNS(root.namespaceURI, tag);
        for (const [name, value] of Object.entries(attrs)) {
          element.setAttribute(name, value);
        }
        parent.appendChild(element);
        return element;
      };

      const pixelRadius = (center, radius) => {
        const middle = toPx(center);
        const edge = toPx({ x: center.x + radius, y: center.y });
        return Math.abs(edge.x - middle.x);
      };

      const line = (from, to, attrs, parent) => {
        const a = toPx(from);
        const b = toPx(to);
        return make("line", {
          x1: a.x,
          y1: a.y,
          x2: b.x,
          y2: b.y,
          ...attrs
        }, parent);
      };

      const circle = (center, radius, attrs, parent) => {
        const c = toPx(center);
        return make("circle", {
          cx: c.x,
          cy: c.y,
          r: pixelRadius(center, radius),
          ...attrs
        }, parent);
      };

      const text = (value, at, attrs, parent) => {
        const p = toPx(at);
        const label = make("text", {
          x: p.x,
          y: p.y,
          ...attrs
        }, parent);
        label.textContent = value;
        return label;
      };

      const arrow = (from, to, color, width, parent) => {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const base = {
          x: to.x - ux * data.style.head,
          y: to.y - uy * data.style.head
        };
        const left = {
          x: base.x - uy * data.style.headHalf,
          y: base.y + ux * data.style.headHalf
        };
        const right = {
          x: base.x + uy * data.style.headHalf,
          y: base.y - ux * data.style.headHalf
        };
        const tipPx = toPx(to);
        const leftPx = toPx(left);
        const rightPx = toPx(right);

        line(from, base, {
          stroke: color,
          "stroke-width": width,
          "stroke-linecap": "round"
        }, parent);

        make("polygon", {
          points:
            tipPx.x + "," + tipPx.y + " " +
            leftPx.x + "," + leftPx.y + " " +
            rightPx.x + "," + rightPx.y,
          fill: color
        }, parent);
      };

      const pointAlong = (from, to, t) => ({
        x: from.x + (to.x - from.x) * t,
        y: from.y + (to.y - from.y) * t
      });

      const shortArrowAlong = (from, to, t, length, color, parent) => {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const norm = Math.hypot(dx, dy);
        const center = pointAlong(from, to, t);
        const half = length / data.style.connectorWidth;
        const start = {
          x: center.x - dx / norm * half,
          y: center.y - dy / norm * half
        };
        const end = {
          x: center.x + dx / norm * half,
          y: center.y + dy / norm * half
        };
        arrow(start, end, color, data.style.arrowWidth, parent);
      };

      const layers = {
        bodies: make("g", { "aria-hidden": "true" }),
        fields: make("g", { "aria-hidden": "true" }),
        candidate: make("g", { "aria-hidden": "true" }),
        joints: make("g", { "aria-hidden": "true" }),
        labels: make("g", { "aria-hidden": "true" }),
        legend: make("g", { "aria-hidden": "true" })
      };

      const [personA, personB] = data.people;

      for (const person of data.people) {
        circle(person.head, person.headRadius, {
          fill: "var(--joint-fill)",
          stroke: person.color,
          "stroke-width": data.style.torsoWidth
        }, layers.bodies);

        line(person.neck, person.hip, {
          stroke: person.color,
          "stroke-width": data.style.torsoWidth,
          "stroke-linecap": "round"
        }, layers.bodies);

        line(person.otherShoulder, person.shoulder, {
          stroke: person.color,
          "stroke-width": data.style.torsoWidth,
          "stroke-linecap": "round"
        }, layers.bodies);

        line(person.hip, {
          x: person.hip.x - (person.shoulder.x - person.otherShoulder.x),
          y: person.hip.y + person.headRadius
        }, {
          stroke: "var(--body)",
          "stroke-width": data.style.torsoWidth,
          "stroke-linecap": "round"
        }, layers.bodies);

        const nameAt = {
          x: person.head.x,
          y: person.head.y - person.headRadius - data.style.head
        };
        text(person.name, nameAt, {
          "text-anchor": "middle",
          "font-size": 16,
          "font-weight": "700",
          fill: person.color
        }, layers.labels);
      }

      const limbs = [
        {
          from: personA.shoulder,
          to: personA.ownElbow,
          soft: "var(--field-soft-a)",
          color: "var(--field-a)",
          key: "a"
        },
        {
          from: personB.shoulder,
          to: personB.ownElbow,
          soft: "var(--field-soft-b)",
          color: "var(--field-b)",
          key: "b"
        }
      ];

      for (const limb of limbs) {
        line(limb.from, limb.to, {
          stroke: limb.soft,
          "stroke-width": data.style.limbUnderWidth,
          "stroke-linecap": "round"
        }, layers.fields);

        line(limb.from, limb.to, {
          stroke: limb.color,
          "stroke-width": data.style.limbWidth,
          "stroke-linecap": "round"
        }, layers.fields);

        for (const sample of data.fieldSamples) {
          if (sample.limb === limb.key) {
            shortArrowAlong(
              limb.from,
              limb.to,
              sample.t,
              sample.length,
              limb.color,
              layers.fields
            );
          }
        }
      }

      line(personA.shoulder, personB.ownElbow, {
        stroke: "var(--wrong-soft)",
        "stroke-width": data.style.limbUnderWidth,
        "stroke-linecap": "round"
      }, layers.candidate);

      arrow(
        personA.shoulder,
        personB.ownElbow,
        "var(--wrong)",
        data.style.candidateWidth,
        layers.candidate
      );

      for (const sample of data.crossSamples) {
        const halfVector = {
          x: sample.vector.x / data.style.connectorWidth,
          y: sample.vector.y / data.style.connectorWidth
        };
        arrow(
          {
            x: sample.at.x - halfVector.x,
            y: sample.at.y - halfVector.y
          },
          {
            x: sample.at.x + halfVector.x,
            y: sample.at.y + halfVector.y
          },
          "var(--ink)",
          data.style.arrowWidth,
          layers.candidate
        );
      }

      for (const point of data.zeroZone) {
        circle(point, data.style.dotRadius, {
          fill: "var(--guide)"
        }, layers.fields);
      }

      for (const connector of data.connectors) {
        line(connector.from, connector.to, {
          stroke: "var(--guide)",
          "stroke-width": data.style.connectorWidth,
          "stroke-linecap": "round"
        }, layers.labels);
      }

      for (const person of data.people) {
        circle(person.shoulder, data.style.jointRadius, {
          fill: "var(--joint-fill)",
          stroke: person.color,
          "stroke-width": data.style.jointWidth
        }, layers.joints);

        circle(person.ownElbow, data.style.jointRadius, {
          fill: "var(--joint-fill)",
          stroke: person.color,
          "stroke-width": data.style.jointWidth
        }, layers.joints);
      }

      for (const label of data.labels) {
        text(label.text, label.at, {
          dx: label.dx,
          dy: label.dy,
          "text-anchor": label.anchor,
          "font-size": 15,
          "font-weight": "700"
        }, layers.labels);
      }

      for (const annotation of data.annotations) {
        text(annotation.text, annotation.at, {
          "text-anchor": annotation.anchor,
          "font-size": 14,
          "font-weight": "600",
          fill: annotation.text === "к чужому локтю" ||
                annotation.text === "поперёк и против пути"
                ? "var(--wrong)"
                : "var(--field-a)"
        }, layers.labels);
      }

      for (const item of data.legend) {
        arrow(
          item.from,
          item.to,
          item.color,
          data.style.arrowWidth,
          layers.legend
        );
        text(item.text, item.textAt, {
          "text-anchor": "start",
          "dominant-baseline": "middle",
          "font-size": 15,
          "font-weight": "600",
          fill: item.color
        }, layers.legend);
      }
    } catch (error) {
      root.replaceChildren();
      root.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
