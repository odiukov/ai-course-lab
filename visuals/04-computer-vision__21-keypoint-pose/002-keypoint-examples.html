<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Одна задача под разными названиями</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --panel: #ffffff;
    --output: #eef3f8;
    --ink: #172033;
    --muted: #667085;
    --line: #cbd5e1;
    --person: #2878d0;
    --hand: #16866f;
    --face: #bd4c79;
    --mesh: #d46b95;
    --fallback: #a33b3b;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  text { fill: var(--ink); }

  .title {
    font-size: 24px;
    font-weight: bold;
    text-anchor: middle;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .panel-title {
    font-size: 18px;
    font-weight: bold;
    text-anchor: start;
  }

  .badge {
    font-size: 15px;
    font-weight: bold;
    text-anchor: end;
  }

  .person-text { fill: var(--person); }
  .hand-text { fill: var(--hand); }
  .face-text { fill: var(--face); }

  .skeleton {
    fill: none;
    stroke-width: 6px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .person-stroke { stroke: var(--person); }
  .hand-stroke { stroke: var(--hand); }

  .person-point {
    fill: var(--panel);
    stroke: var(--person);
    stroke-width: 3px;
  }

  .hand-point {
    fill: var(--panel);
    stroke: var(--hand);
    stroke-width: 3px;
  }

  .face-base {
    fill: var(--output);
    stroke: var(--face);
    stroke-width: 3px;
  }

  .face-feature {
    fill: none;
    stroke: var(--face);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .mesh-point { fill: var(--mesh); }

  .arrow {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .arrow-head { fill: var(--muted); }

  .output-box {
    fill: var(--output);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .output-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
    text-anchor: middle;
  }

  .output-value {
    font-size: 18px;
    font-weight: bold;
    text-anchor: middle;
  }

  .output-note {
    fill: var(--muted);
    font-size: 13px;
    text-anchor: middle;
  }

  .fallback {
    fill: var(--fallback);
    font-size: 18px;
    text-anchor: middle;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --panel: #182131;
      --output: #202c3e;
      --ink: #edf2f7;
      --muted: #aab7c8;
      --line: #39485e;
      --person: #69adff;
      --hand: #55d1b3;
      --face: #ff87b5;
      --mesh: #ec79a7;
      --fallback: #ff9797;
    }
  }
</style>
</head>
<body>
<svg id="diagram" viewBox="0 0 1200 490" width="1200" height="490"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-description">Человек с 17 точками COCO, кисть с 21 точкой и лицо с 478 точками дают одинаково устроенный выход — упорядоченные пары координат x и y.</title>
  <text id="diagram-title" class="title">Разные названия — один формат ответа</text>
  <g id="stage"></g>
  <text id="fallback" class="fallback"></text>
</svg>

<script>
const DATA = [{
  origin: { x: 0, y: 0 },
  scale: 1,
  n: {
    zero: 0, one: 1, two: 2, half: 0.5,
    titleY: 32, panelY: 54, panelW: 360, panelH: 416,
    radius: 13, inset: 20, headingY: 84,
    outputY: 374, outputH: 76, outputRadius: 11,
    outputInset: 14, outputLabelY: 397, outputValueY: 424,
    outputNoteY: 444, arrowTop: 346, arrowBottom: 368,
    arrowWing: 7, arrowBack: 9, pointRadius: 5,
    meshRadius: 1.7, faceRx: 103, faceRy: 126,
    faceTaper: 0.08, fallbackY: 245, canvasMidX: 600
  },
  panels: [
    {
      x: 25,
      title: "Поза человека",
      badge: "17 точек COCO",
      kind: "person",
      output: "[(x₁, y₁), …, (x₁₇, y₁₇)]"
    },
    {
      x: 420,
      title: "Поза кисти",
      badge: "21 точка",
      kind: "hand",
      output: "[(x₁, y₁), …, (x₂₁, y₂₁)]"
    },
    {
      x: 815,
      title: "Точки лица",
      badge: "478 точек",
      kind: "face",
      output: "[(x₁, y₁), …, (x₄₇₈, y₄₇₈)]"
    }
  ],
  person: {
    points: [
      [205, 119], [197, 112], [213, 112], [187, 120], [223, 120],
      [175, 157], [235, 157], [155, 201], [255, 201], [143, 246],
      [267, 246], [185, 230], [225, 230], [180, 284], [230, 284],
      [174, 333], [236, 333]
    ],
    bones: [
      [0, 1], [0, 2], [1, 3], [2, 4], [5, 6], [5, 7], [7, 9],
      [6, 8], [8, 10], [5, 11], [6, 12], [11, 12], [11, 13],
      [13, 15], [12, 14], [14, 16]
    ]
  },
  hand: {
    points: [
      [600, 333],
      [568, 294], [548, 266], [532, 240], [516, 218],
      [585, 276], [580, 235], [578, 198], [577, 164],
      [606, 269], [608, 224], [609, 182], [610, 145],
      [627, 275], [637, 235], [644, 199], [650, 170],
      [647, 292], [668, 262], [681, 237], [693, 215]
    ],
    bones: [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ]
  },
  face: {
    cx: 995, cy: 222, count: 478, golden: 2.399963229728653,
    features: [
      [[928, 201], [945, 191], [966, 194], [976, 203], [961, 208], [943, 207], [928, 201]],
      [[1014, 203], [1025, 194], [1046, 191], [1063, 201], [1048, 207], [1030, 208], [1014, 203]],
      [[995, 205], [988, 232], [982, 253], [995, 259], [1008, 253]],
      [[955, 286], [976, 277], [995, 281], [1014, 277], [1035, 286], [1015, 300], [995, 304], [975, 300], [955, 286]]
    ]
  }
}];

const [d] = DATA;
const origin = d.origin;
const scale = d.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

const SVG_NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("diagram");
const stage = document.getElementById("stage");
const title = document.getElementById("diagram-title");
const fallback = document.getElementById("fallback");

function node(tag, attrs, className) {
  const item = document.createElementNS(SVG_NS, tag);
  Object.entries(attrs).forEach(([name, value]) => item.setAttribute(name, value));
  if (className) item.setAttribute("class", className);
  return item;
}

function textNode(value, x, y, className) {
  const item = node("text", { x: sx(x), y: sy(y) }, className);
  item.textContent = value;
  return item;
}

function lineNode(a, b, className) {
  const [ax, ay] = a;
  const [bx, by] = b;
  return node("line", {
    x1: sx(ax), y1: sy(ay), x2: sx(bx), y2: sy(by)
  }, className);
}

function pointNode(point, className, radius) {
  const [x, y] = point;
  return node("circle", {
    cx: sx(x),
    cy: sy(y),
    r: sx(radius) - sx(d.n.zero)
  }, className);
}

function pathNode(points, className, close) {
  let first = true;
  const commands = points.map(point => {
    const [x, y] = point;
    const command = first ? "M" : "L";
    first = false;
    return command + " " + sx(x) + " " + sy(y);
  });
  if (close) commands.push("Z");
  return node("path", { d: commands.join(" ") }, className);
}

function drawArrow(cx) {
  stage.appendChild(lineNode(
    [cx, d.n.arrowTop],
    [cx, d.n.arrowBottom],
    "arrow"
  ));
  stage.appendChild(pathNode([
    [cx, d.n.arrowBottom],
    [cx - d.n.arrowWing, d.n.arrowBottom - d.n.arrowBack],
    [cx + d.n.arrowWing, d.n.arrowBottom - d.n.arrowBack]
  ], "arrow-head", true));
}

function drawPanel(panel) {
  const panelX = panel.x;
  const centerX = panelX + d.n.panelW * d.n.half;

  stage.appendChild(node("rect", {
    x: sx(panelX),
    y: sy(d.n.panelY),
    width: sx(panelX + d.n.panelW) - sx(panelX),
    height: sy(d.n.panelY + d.n.panelH) - sy(d.n.panelY),
    rx: sx(d.n.radius) - sx(d.n.zero),
    ry: sy(d.n.radius) - sy(d.n.zero)
  }, "panel"));

  stage.appendChild(textNode(
    panel.title,
    panelX + d.n.inset,
    d.n.headingY,
    "panel-title"
  ));

  stage.appendChild(textNode(
    panel.badge,
    panelX + d.n.panelW - d.n.inset,
    d.n.headingY,
    "badge " + panel.kind + "-text"
  ));

  stage.appendChild(node("rect", {
    x: sx(panelX + d.n.outputInset),
    y: sy(d.n.outputY),
    width: sx(panelX + d.n.panelW - d.n.outputInset) -
      sx(panelX + d.n.outputInset),
    height: sy(d.n.outputY + d.n.outputH) - sy(d.n.outputY),
    rx: sx(d.n.outputRadius) - sx(d.n.zero),
    ry: sy(d.n.outputRadius) - sy(d.n.zero)
  }, "output-box"));

  stage.appendChild(textNode(
    "Упорядоченные пары (x, y)",
    centerX,
    d.n.outputLabelY,
    "output-label"
  ));

  stage.appendChild(textNode(
    panel.output,
    centerX,
    d.n.outputValueY,
    "output-value " + panel.kind + "-text"
  ));

  stage.appendChild(textNode(
    "каждая позиция — свой ориентир",
    centerX,
    d.n.outputNoteY,
    "output-note"
  ));

  drawArrow(centerX);
}

function drawPerson() {
  d.person.bones.forEach(bone => {
    const [a, b] = bone;
    stage.appendChild(lineNode(
      d.person.points[a],
      d.person.points[b],
      "skeleton person-stroke"
    ));
  });
  d.person.points.forEach(point => {
    stage.appendChild(pointNode(point, "person-point", d.n.pointRadius));
  });
}

function drawHand() {
  d.hand.bones.forEach(bone => {
    const [a, b] = bone;
    stage.appendChild(lineNode(
      d.hand.points[a],
      d.hand.points[b],
      "skeleton hand-stroke"
    ));
  });
  d.hand.points.forEach(point => {
    stage.appendChild(pointNode(point, "hand-point", d.n.pointRadius));
  });
}

function drawFace() {
  const face = d.face;

  stage.appendChild(node("ellipse", {
    cx: sx(face.cx),
    cy: sy(face.cy),
    rx: sx(face.cx + d.n.faceRx) - sx(face.cx),
    ry: sy(face.cy + d.n.faceRy) - sy(face.cy)
  }, "face-base"));

  for (let i = d.n.zero; i < face.count; i += d.n.one) {
    const progress = (i + d.n.half) / face.count;
    const radius = Math.sqrt(progress);
    const angle = i * face.golden;
    const taper = d.n.one - d.n.faceTaper * progress;
    const x = face.cx + d.n.faceRx * radius * Math.cos(angle) * taper;
    const y = face.cy + d.n.faceRy * radius * Math.sin(angle);
    stage.appendChild(pointNode(
      [x, y],
      "mesh-point",
      d.n.meshRadius
    ));
  }

  face.features.forEach(feature => {
    stage.appendChild(pathNode(feature, "face-feature", false));
  });
}

title.setAttribute("x", sx(d.n.canvasMidX));
title.setAttribute("y", sy(d.n.titleY));
fallback.setAttribute("x", sx(d.n.canvasMidX));
fallback.setAttribute("y", sy(d.n.fallbackY));

try {
  d.panels.forEach(drawPanel);
  drawPerson();
  drawHand();
  drawFace();
} catch (error) {
  stage.replaceChildren();
  fallback.textContent =
    "Схема: человек — 17 точек COCO, кисть — 21, лицо — 478; выход — пары (x, y).";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
