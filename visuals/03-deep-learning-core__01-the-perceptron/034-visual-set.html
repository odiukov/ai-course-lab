<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Сеть из трёх нейронов</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b2330; --muted:#5c6b7f;
    --line:#3b4a5e; --or:#1f6f8b; --nand:#8b4a1f; --and:#5a2f8b; --out:#1f6f3b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --fg:#e6ecf3; --muted:#9fb0c3;
      --line:#b6c4d6; --or:#68c6e0; --nand:#e8a86a; --and:#c19ae8; --out:#7fd79a;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:12px;box-sizing:border-box;}
  h2{margin:0 0 8px;font-size:16px;font-weight:600;}
  .fig{background:var(--bg);border:1px solid var(--muted);border-radius:8px;padding:6px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  text{fill:var(--fg);font-family:inherit;}
  .lbl{font-size:13px;}
  .small{font-size:11px;fill:var(--muted);}
  .legend{margin:8px 2px 0;font-size:12px;color:var(--muted);}
  .fail{padding:10px;font-size:13px;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Сеть из трёх нейронов: XOR = (x1 OR x2) AND NAND(x1, x2)</h2>
  <div class="fig" id="fig"></div>
  <div class="legend">Скрытый слой: <b>u₁</b> — OR-нейрон («хотя бы один?»), <b>u₂</b> — NAND-нейрон («не оба ли сразу?»). Выходной слой: <b>y</b> — AND-нейрон, видит только u₁ и u₂.</div>
</div>
<script>
(function(){
  var fig = document.getElementById('fig');
  var W = 760, H = 380;
  var PAD = 8, R_TXT = 13, LW = 1.6;

  try {
    // ---- данные схемы (координаты в условных единицах) ----
    var nodes = [
      {id:'x1',   x:0,  y:3,   r:0.55, label:'x1',        cls:'',     side:'left'},
      {id:'x2',   x:0,  y:-3,  r:0.55, label:'x2',        cls:'',     side:'left'},
      {id:'u1',   x:4,  y:2,   r:0.9,  label:'u₁',        cls:'or',   side:'top',    sub:'OR'},
      {id:'u2',   x:4,  y:-2,  r:0.9,  label:'u₂',        cls:'nand', side:'bottom', sub:'NAND'},
      {id:'y',    x:8,  y:0,   r:0.9,  label:'y',         cls:'and',  side:'top',    sub:'AND'},
      {id:'out',  x:11, y:0,   r:0.55, label:'XOR',       cls:'out',  side:'right'}
    ];
    var edges = [
      {from:'x1', to:'u1'}, {from:'x1', to:'u2'},
      {from:'x2', to:'u1'}, {from:'x2', to:'u2'},
      {from:'u1', to:'y'},  {from:'u2', to:'y'},
      {from:'y',  to:'out'}
    ];
    // рамки слоёв: x-центр, подпись
    var layers = [
      {x:4,  top:3.2,  bot:-3.2, half:1.5, label:'скрытый слой'},
      {x:8,  top:3.2,  bot:-3.2, half:1.5, label:'выходной слой'}
    ];

    // ---- единственная пара функций перевода ----
    var origin = {x: 90, y: H/2};
    var scale  = 52;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }
    function sr(u){ return u * scale; }           // длина по той же шкале

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    var svg = el('svg', {viewBox:'0 0 '+W+' '+H, preserveAspectRatio:'xMidYMid meet',
                         role:'img', 'aria-label':'Схема сети из трёх нейронов для XOR'});
    var byId = {};
    nodes.forEach(function(n){ byId[n.id] = n; });

    var defs = el('defs', {});
    var mk = el('marker', {id:'ah', viewBox:'0 0 10 10', refX:'9', refY:'5',
                markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse',
                markerUnits:'strokeWidth'});
    mk.appendChild(el('path', {d:'M0,0 L10,5 L0,10 z', fill:'var(--line)'}));
    defs.appendChild(mk);
    svg.appendChild(defs);

    // ---- рамки слоёв (позади всего) ----
    layers.forEach(function(L){
      svg.appendChild(el('rect', {
        x: sx(L.x - L.half), y: sy(L.top),
        width: sr(2*L.half), height: sy(L.bot) - sy(L.top),
        rx: sr(0.25), fill:'none', stroke:'var(--muted)',
        'stroke-width': LW*0.7, 'stroke-dasharray': sr(0.12)+' '+sr(0.12), opacity:'0.7'
      }));
      var t = el('text', {x: sx(L.x), y: sy(L.top) - PAD, 'text-anchor':'middle', 'class':'small'});
      t.textContent = L.label;
      svg.appendChild(t);
    });

    // ---- стрелки от края круга до края круга ----
    edges.forEach(function(e){
      var a = byId[e.from], b = byId[e.to];
      var ax = sx(a.x), ay = sy(a.y), bx = sx(b.x), by = sy(b.y);
      var dx = bx - ax, dy = by - ay, len = Math.sqrt(dx*dx + dy*dy);
      var ux = dx/len, uy = dy/len;
      var x1 = ax + ux * sr(a.r), y1 = ay + uy * sr(a.r);
      var x2 = bx - ux * (sr(b.r) + PAD*0.6), y2 = by - uy * (sr(b.r) + PAD*0.6);
      svg.appendChild(el('line', {x1:x1, y1:y1, x2:x2, y2:y2,
        stroke:'var(--line)', 'stroke-width': LW, 'marker-end':'url(#ah)'}));
    });

    // ---- узлы ----
    var color = {or:'var(--or)', nand:'var(--nand)', and:'var(--and)', out:'var(--out)', '':'var(--line)'};
    nodes.forEach(function(n){
      var cx = sx(n.x), cy = sy(n.y), rr = sr(n.r);
      svg.appendChild(el('circle', {cx:cx, cy:cy, r:rr, fill:'var(--bg)',
        stroke: color[n.cls], 'stroke-width': LW*1.4}));

      // короткая метка внутри круга
      var t = el('text', {x:cx, y:cy + PAD*0.5, 'text-anchor':'middle', 'class':'lbl'});
      t.textContent = n.label;
      svg.appendChild(t);

      // подпись роли — каждая в свою сторону от своей точки
      if (n.sub){
        var ty, anch = 'middle', tx = cx;
        if (n.side === 'top')    ty = cy - rr - PAD;
        else                     ty = cy + rr + PAD + R_TXT*0.6;
        var s = el('text', {x:tx, y:ty, 'text-anchor':anch, 'class':'small'});
        s.textContent = n.sub;
        svg.appendChild(s);
      }
      if (n.side === 'left'){
        var l = el('text', {x: cx - rr - PAD, y: cy + PAD*0.4, 'text-anchor':'end', 'class':'lbl'});
        l.textContent = 'вход';
        svg.appendChild(l);
      }
      if (n.side === 'right'){
        var r2 = el('text', {x: cx + rr + PAD, y: cy + PAD*0.4, 'text-anchor':'start', 'class':'lbl'});
        r2.textContent = 'выход';
        svg.appendChild(r2);
      }
    });

    // ---- подписи у хвостов ветвлений: разведены в разные стороны ----
    var q1 = el('text', {x: sx(2) , y: sy(2.55), 'text-anchor':'middle', 'class':'small'});
    q1.textContent = '«хотя бы один?»';
    svg.appendChild(q1);

    var q2 = el('text', {x: sx(2), y: sy(-2.75), 'text-anchor':'middle', 'class':'small'});
    q2.textContent = '«не оба ли сразу?»';
    svg.appendChild(q2);

    var q3 = el('text', {x: sx(6), y: sy(0.9), 'text-anchor':'middle', 'class':'small'});
    q3.textContent = 'только u₁ и u₂';
    svg.appendChild(q3);

    fig.appendChild(svg);
  } catch (err) {
    fig.innerHTML = '<div class="fail"><b>Схема не построилась.</b> Она должна показывать: ' +
      'входы x1 и x2 идут одновременно в два нейрона скрытого слоя — OR-нейрон (u₁) ' +
      'и NAND-нейрон (u₂). Оба нейрона видят одну и ту же пару чисел. ' +
      'Их выходы u₁ и u₂ идут в третий, выходной AND-нейрон (y), который x1 и x2 ' +
      'не получает вообще. Выход y и есть XOR.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
