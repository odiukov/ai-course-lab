<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как шардированные эксперты скрывают редкий пример</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --panel-soft: #eef2f7;
    --ink: #182033;
    --muted: #5f6b7c;
    --line: #8a96a8;
    --line-soft: #cbd3df;
    --blue: #3568b8;
    --blue-soft: #dce9fb;
    --rare: #c44f35;
    --rare-soft: #f9ded6;
    --noise: #7d5cac;
    --noise-soft: #ece4f7;
    --good: #26725a;
    --shadow: #dfe4ec;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    width: 100%;
    background: var(--bg);
  }

  h2 {
    margin: 0;
    padding: 12px 18px 8px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 476px;
    background: var(--bg);
  }

  text {
    fill: var(--ink);
    font-size: 14px;
  }

  .row-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .card-title {
    font-size: 13px;
    font-weight: bold;
  }

  .panel-title {
    font-size: 17px;
    font-weight: bold;
  }

  .rare-text {
    fill: var(--rare);
    font-weight: bold;
  }

  .common-text {
    fill: var(--good);
    font-weight: bold;
  }

  .legend {
    fill: var(--muted);
    font-size: 14px;
  }

  .node {
    fill: var(--panel);
    stroke: var(--line-soft);
    stroke-width: 2px;
  }

  .expert {
    fill: var(--blue-soft);
    stroke: var(--blue);
    stroke-width: 2px;
  }

  .rare-node {
    fill: var(--rare-soft);
    stroke: var(--rare);
    stroke-width: 3px;
  }

  .distribution {
    fill: var(--panel);
    stroke: var(--line-soft);
    stroke-width: 2px;
  }

  .aggregate {
    fill: var(--noise-soft);
    stroke: var(--noise);
    stroke-width: 3px;
  }

  .output {
    fill: var(--panel);
    stroke: var(--ink);
    stroke-width: 2px;
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
  }

  .rare-connector {
    fill: none;
    stroke: var(--rare);
    stroke-width: 3px;
  }

  .baseline {
    stroke: var(--line-soft);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .common-bar {
    stroke: var(--blue);
    stroke-width: 7px;
    stroke-linecap: round;
  }

  .rare-bar {
    stroke: var(--rare);
    stroke-width: 7px;
    stroke-linecap: round;
  }

  .noise-line {
    fill: none;
    stroke: var(--noise);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .callout {
    fill: var(--rare-soft);
    stroke: var(--rare);
    stroke-width: 2px;
  }

  #fallback {
    margin: 12px 18px 18px;
    padding: 18px;
    background: var(--panel);
    border: 2px solid var(--rare);
    color: var(--ink);
    font-size: 15px;
  }

  [hidden] {
    display: none;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --panel: #192231;
      --panel-soft: #202c3d;
      --ink: #edf2fa;
      --muted: #b0bbca;
      --line: #76859a;
      --line-soft: #435166;
      --blue: #79aaf3;
      --blue-soft: #213b5d;
      --rare: #ff9278;
      --rare-soft: #4c2a29;
      --noise: #c39aee;
      --noise-soft: #35284a;
      --good: #72d5b2;
      --shadow: #0b1018;
    }
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h2 id="diagram-title">Как шардированные эксперты скрывают редкий пример</h2>
  <svg id="diagram" viewBox="0 0 1200 476" width="1200" height="476"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Десять шардов ведут к десяти экспертам. Только эксперт номер семь поддерживает редкое продолжение, и его сигнал ослабевает при шумной агрегации."></svg>
  <div id="fallback" hidden>
    Схема должна была показать десять шардов и десять экспертов: редкая фраза находится только в шарде № 7, поэтому одиночный сигнал эксперта № 7 ослабевает в общей смеси и скрывается добавленным шумом.
  </div>
</figure>

<script>
(() => {
  "use strict";

  const data = [
    [1, 174, 270, false],
    [2, 274, 340, false],
    [3, 374, 410, false],
    [4, 474, 480, false],
    [5, 574, 550, false],
    [6, 674, 620, false],
    [7, 774, 690, true],
    [8, 874, 760, false],
    [9, 974, 830, false],
    [10, 1074, 900, false]
  ];

  const origin = Object.freeze({ x: 0, y: 0 });
  const scale = Object.freeze({ x: 1, y: 1 });

  const layout = Object.freeze({
    shard: [34, 76, 34, 8],
    expert: [98, 84, 48, 9],
    distribution: [180, 84, 82, 8],
    aggregate: [220, 322, 770, 108, 14],
    output: [1024, 346, 154, 62, 10],
    rowLabels: [130, 56, 122, 205],
    bars: [24, 27, 208, 236, 5, 9, 23, 25],
    callout: [710, 4, 128, 24, 8],
    arrow: [7, 5],
    outputArrow: [990, 377, 1024],
    legend: [600, 458]
  });

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  const make = (name, attrs = {}, content = "") => {
    const element = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) {
      element.setAttribute(key, value);
    }
    if (content) element.textContent = content;
    return element;
  };

  const add = element => svg.appendChild(element);

  const rect = (x, y, width, height, radius, className) => add(make("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y),
    rx: sx(radius) - sx(0),
    ry: sy(radius) - sy(0),
    class: className
  }));

  const line = (x1, y1, x2, y2, className) => add(make("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  }));

  const text = (x, y, value, className, anchor = "middle", dx = "0", dy = "0") =>
    add(make("text", {
      x: sx(x),
      y: sy(y),
      dx,
      dy,
      class: className,
      "text-anchor": anchor,
      "dominant-baseline": "middle"
    }, value));

  const twoLines = (x, y, first, second, className) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": "middle"
    });
    node.appendChild(make("tspan", { x: sx(x), y: sy(y) }, first));
    node.appendChild(make("tspan", { x: sx(x), y: sy(y + 18) }, second));
    add(node);
  };

  const downArrow = (x1, y1, x2, y2, rare = false) => {
    const [headWidth, headHeight] = layout.arrow;
    const className = rare ? "rare-connector" : "connector";
    line(x1, y1, x2, y2 - headHeight, className);
    add(make("polygon", {
      points: [
        `${sx(x2 - headWidth)},${sy(y2 - headHeight)}`,
        `${sx(x2)},${sy(y2)}`,
        `${sx(x2 + headWidth)},${sy(y2 - headHeight)}`
      ].join(" "),
      fill: rare ? "var(--rare)" : "var(--line)"
    }));
  };

  const rightArrow = (x1, y, x2) => {
    const [headWidth, headHeight] = layout.arrow;
    line(x1, y, x2 - headHeight, y, "connector");
    add(make("polygon", {
      points: [
        `${sx(x2 - headHeight)},${sy(y - headWidth)}`,
        `${sx(x2)},${sy(y)}`,
        `${sx(x2 - headHeight)},${sy(y + headWidth)}`
      ].join(" "),
      fill: "var(--line)"
    }));
  };

  try {
    const [shardY, shardW, shardH, shardR] = layout.shard;
    const [expertY, expertW, expertH, expertR] = layout.expert;
    const [distY, distW, distH, distR] = layout.distribution;
    const [panelX, panelY, panelW, panelH, panelR] = layout.aggregate;
    const [outputX, outputY, outputW, outputH, outputR] = layout.output;
    const [labelX, shardLabelY, expertLabelY, distLabelY] = layout.rowLabels;
    const [barHalf, barInset, commonY, rareY, shortBar, mediumBar, longBar, rareLongBar] = layout.bars;
    const [calloutX, calloutY, calloutW, calloutH, calloutR] = layout.callout;
    const [arrowStart, arrowHead] = layout.arrow;
    const [outputArrowX1, outputArrowY, outputArrowX2] = layout.outputArrow;
    const [legendX, legendY] = layout.legend;

    text(labelX, shardLabelY, "10 шардов данных", "row-label", "end", "-8");
    text(labelX, expertLabelY, "10 экспертов", "row-label", "end", "-8");
    text(labelX, distLabelY, "распределения", "row-label", "end", "-8");
    text(labelX, distLabelY + 19, "следующего токена", "small", "end", "-8");

    rect(calloutX, calloutY, calloutW, calloutH, calloutR, "callout");
    text(calloutX + calloutW / 2, calloutY + calloutH / 2, "редкая фраза", "rare-text");
    line(calloutX + calloutW / 2, calloutY + calloutH, 774, shardY, "rare-connector");

    for (const [id, centerX, aggregateX, isRare] of data) {
      const shardX = centerX - shardW / 2;
      const expertX = centerX - expertW / 2;
      const distX = centerX - distW / 2;
      const nodeClass = isRare ? "rare-node" : "node";
      const expertClass = isRare ? "rare-node" : "expert";

      rect(shardX, shardY, shardW, shardH, shardR, nodeClass);
      text(centerX, shardY + shardH / 2, `Шард ${id}`, "card-title");

      downArrow(centerX, shardY + shardH, centerX, expertY, isRare);
      rect(expertX, expertY, expertW, expertH, expertR, expertClass);
      text(centerX, expertY + expertH / 2, `Эксперт ${id}`, "card-title");

      downArrow(centerX, expertY + expertH, centerX, distY, isRare);
      rect(distX, distY, distW, distH, distR, "distribution");
      text(centerX, distY + 15, `p${id}(токен)`, isRare ? "rare-text small" : "small");

      line(centerX - barHalf, commonY, centerX + barHalf, commonY, "baseline");
      line(centerX - barHalf, rareY, centerX + barHalf, rareY, "baseline");

      const commonLength = isRare ? mediumBar : longBar;
      const rareLength = isRare ? rareLongBar : shortBar;

      line(centerX - barHalf, commonY, centerX - barHalf + commonLength, commonY, "common-bar");
      line(centerX - barHalf, rareY, centerX - barHalf + rareLength, rareY, "rare-bar");

      if (isRare) {
        text(centerX + barInset, rareY, "редкое", "rare-text small", "start", "6", "-9");
      }

      downArrow(centerX, distY + distH, aggregateX, panelY, isRare);
    }

    text(142, commonY, "обычное", "small", "end", "-8");
    text(142, rareY, "редкое", "rare-text small", "end", "-8");

    rect(panelX, panelY, panelW, panelH, panelR, "aggregate");
    text(panelX + panelW / 2, panelY + 24, "Шумная приватная агрегация", "panel-title");

    text(panelX + 28, panelY + 58, "обычное продолжение", "small", "start");
    text(panelX + 28, panelY + 84, "редкое продолжение", "rare-text small", "start");

    line(panelX + 210, panelY + 58, panelX + 510, panelY + 58, "baseline");
    line(panelX + 210, panelY + 84, panelX + 510, panelY + 84, "baseline");
    line(panelX + 210, panelY + 58, panelX + 484, panelY + 58, "common-bar");
    line(panelX + 210, panelY + 84, panelX + 258, panelY + 84, "rare-bar");

    add(make("polyline", {
      points: [
        `${sx(panelX + 266)},${sy(panelY + 84)}`,
        `${sx(panelX + 278)},${sy(panelY + 78)}`,
        `${sx(panelX + 290)},${sy(panelY + 90)}`,
        `${sx(panelX + 302)},${sy(panelY + 80)}`,
        `${sx(panelX + 314)},${sy(panelY + 88)}`,
        `${sx(panelX + 326)},${sy(panelY + 82)}`,
        `${sx(panelX + 338)},${sy(panelY + 87)}`
      ].join(" "),
      class: "noise-line"
    }));

    text(panelX + 535, panelY + 58, "9 голосов → сигнал сохраняется", "common-text", "start", "8");
    text(panelX + 535, panelY + 84, "1 голос → скрыт шумом", "rare-text", "start", "8");

    rightArrow(outputArrowX1, outputArrowY, outputArrowX2);
    rect(outputX, outputY, outputW, outputH, outputR, "output");
    twoLines(outputX + outputW / 2, outputY + 25,
      "итоговое распределение",
      "следующего токена",
      "card-title"
    );

    line(774, panelY, 774, panelY - arrowHead, "rare-connector");
    text(774, panelY - arrowStart, "сигнал эксперта № 7", "rare-text small", "middle", "0", "-9");

    text(
      legendX,
      legendY,
      "Редкий пример — один голос против девяти: смешивание ослабляет его, а шум скрывает остаток.",
      "legend"
    );
  } catch (error) {
    svg.setAttribute("hidden", "");
    fallback.removeAttribute("hidden");
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
