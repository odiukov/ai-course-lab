<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прямой и извилистый пути от шума к данным</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f5ef;
      --panel: #fffdf8;
      --ink: #202735;
      --muted: #667085;
      --border: #cdd3dc;
      --curve: #4676c7;
      --curve-soft: #dce8fb;
      --direct: #d36b20;
      --direct-soft: #fae4d2;
      --node: #263348;
      --halo: #eef1f5;
      --note: #f2efe7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182130;
        --ink: #eef3fa;
        --muted: #b8c2d0;
        --border: #3d4b60;
        --curve: #82adf2;
        --curve-soft: #233b60;
        --direct: #ffad70;
        --direct-soft: #5a3523;
        --node: #f4f7fb;
        --halo: #263244;
        --note: #222d3c;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    figure {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 18px;
    }

    h2 {
      font-size: 24px;
      line-height: normal;
      margin-block-start: 0;
      margin-block-end: 6px;
    }

    .lead {
      color: var(--muted);
      font-size: 15px;
      margin-block-start: 0;
      margin-block-end: 8px;
    }

    #plot {
      width: 100%;
    }

    #plot svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
    }

    .fallback {
      color: var(--muted);
      font-size: 16px;
      padding: 24px;
    }

    .route-curve {
      fill: none;
      stroke: var(--curve);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .route-direct {
      fill: none;
      stroke: var(--direct);
      stroke-width: 5px;
      stroke-linecap: round;
    }

    .curve-step {
      fill: var(--panel);
      stroke: var(--curve);
      stroke-width: 2px;
    }

    .direct-step {
      fill: var(--direct);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .curve-arrow {
      fill: var(--curve);
    }

    .direct-arrow {
      fill: var(--direct);
    }

    .endpoint-halo {
      fill: var(--halo);
      stroke: var(--border);
      stroke-width: 1.5px;
    }

    .noise-dot {
      fill: var(--curve);
    }

    .data-dot {
      fill: var(--direct);
    }

    .endpoint-core {
      fill: var(--node);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .small-label {
      fill: var(--muted);
      font-size: 15px;
    }

    .curve-label {
      fill: var(--curve);
      font-size: 18px;
      font-weight: bold;
    }

    .direct-label {
      fill: var(--direct);
      font-size: 18px;
      font-weight: bold;
    }

    .leader {
      fill: none;
      stroke: var(--border);
      stroke-width: 1.5px;
      stroke-linecap: round;
    }

    .note-line {
      fill: none;
      stroke: var(--border);
      stroke-width: 1px;
    }

    .note-dot {
      fill: var(--muted);
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h2 id="diagram-heading">Прямой и извилистый пути от шума к данным</h2>
    <p class="lead">Начало и конец одинаковы, но число последовательных вычислений различается.</p>
    <div id="plot">
      <p class="fallback">Две траектории ведут от шума при t = 1 к данным при t = 0: извилистая требует 20–50 коротких шагов, прямая — 1–4.</p>
    </div>
  </figure>

  <script>
    const DATA = Object.freeze({
      canvas: { zero: 0, width: 1040, height: 420 },
      constants: {
        zero: 0,
        one: 1,
        minusOne: -1
      },
      route: {
        curved: [
          [1.15, 2.10], [1.39, 1.86], [1.63, 1.52], [1.87, 1.13],
          [2.11, 0.88], [2.35, 1.02], [2.59, 1.39], [2.83, 1.76],
          [3.07, 1.58], [3.31, 1.21], [3.55, 1.34], [3.79, 1.71],
          [4.03, 2.12], [4.27, 2.51], [4.51, 2.88], [4.75, 3.16],
          [4.99, 2.94], [5.23, 2.56], [5.47, 2.08], [5.71, 1.66],
          [5.95, 1.82], [6.19, 2.22], [6.43, 2.61], [6.67, 2.84],
          [6.91, 2.55], [7.15, 2.13], [7.39, 1.74], [7.63, 1.49],
          [7.87, 1.66], [8.11, 1.91], [8.35, 2.19], [8.59, 2.17],
          [8.85, 2.10]
        ],
        direct: [
          [1.15, 2.10], [3.72, 2.10], [6.29, 2.10], [8.85, 2.10]
        ],
        curvedArrows: [8, 16, 24, 32]
      },
      endpoints: {
        start: [1.15, 2.10],
        finish: [8.85, 2.10],
        haloRadius: 0.52,
        coreRadius: 0.075,
        noiseRadius: 0.045,
        dataRadius: 0.052,
        noise: [
          [0.88, 1.82], [1.13, 1.70], [1.40, 1.84], [0.78, 2.08],
          [1.02, 2.18], [1.36, 2.08], [1.52, 2.32], [0.91, 2.40],
          [1.22, 2.48], [1.48, 1.63], [0.72, 2.30]
        ],
        data: [
          [8.65, 1.90], [8.85, 1.90], [9.05, 1.90],
          [8.65, 2.10], [8.85, 2.10], [9.05, 2.10],
          [8.65, 2.30], [8.85, 2.30], [9.05, 2.30]
        ]
      },
      arrows: {
        length: 0.14,
        halfWidth: 0.075,
        minimum: 0.001
      },
      labels: [
        {
          text: "Извилистый путь · 20–50 коротких шагов",
          point: [2.45, 1.05],
          dx: 12,
          dy: -34,
          anchor: "middle",
          className: "curve-label"
        },
        {
          text: "Прямой путь · 1–4 шага",
          point: [2.25, 2.10],
          dx: 0,
          dy: 62,
          anchor: "middle",
          className: "direct-label"
        },
        {
          text: "x₁ = шум",
          point: [1.15, 2.10],
          dx: -28,
          dy: -25,
          anchor: "end",
          className: "label"
        },
        {
          text: "t = 1",
          point: [1.15, 2.10],
          dx: -28,
          dy: -4,
          anchor: "end",
          className: "small-label"
        },
        {
          text: "x₀ = данные",
          point: [8.85, 2.10],
          dx: 26,
          dy: -25,
          anchor: "start",
          className: "label"
        },
        {
          text: "t = 0",
          point: [8.85, 2.10],
          dx: 26,
          dy: -4,
          anchor: "start",
          className: "small-label"
        },
        {
          text: "частые уточнения направления",
          point: [5.03, 3.32],
          dx: 0,
          dy: 18,
          anchor: "middle",
          className: "small-label"
        },
        {
          text: "длинные шаги разумны, когда направление почти не меняется",
          point: [5.00, 4.02],
          dx: 0,
          dy: 0,
          anchor: "middle",
          className: "small-label"
        }
      ],
      leaders: [
        [[2.45, 1.05], [2.35, 1.02]],
        [[2.25, 2.10], [2.25, 2.48]],
        [[4.75, 3.16], [5.03, 3.32]]
      ],
      note: {
        line: [[1.48, 3.78], [8.52, 3.78]],
        dots: [[1.48, 3.78], [8.52, 3.78]]
      }
    });

    const ORIGIN = Object.freeze({ x: 52, y: 25 });
    const SCALE = Object.freeze({ x: 100, y: 92 });

    const sx = x => ORIGIN.x + x * SCALE.x;
    const sy = y => ORIGIN.y + y * SCALE.y;

    try {
      const C = DATA.constants;
      const NS = "http://www.w3.org/2000/svg";
      const plot = document.getElementById("plot");

      const make = (tag, attributes) => {
        const node = document.createElementNS(NS, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        return node;
      };

      const line = (from, to, className) => {
        const [x1, y1] = from;
        const [x2, y2] = to;
        return make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });
      };

      const circle = (point, radius, className) => {
        const [x, y] = point;
        return make("circle", {
          cx: sx(x),
          cy: sy(y),
          r: Math.abs(sx(radius) - sx(C.zero)),
          class: className
        });
      };

      const arrow = (from, to, className) => {
        const [ax, ay] = from;
        const [bx, by] = to;
        const rawX = bx - ax;
        const rawY = by - ay;
        const length = Math.max(Math.hypot(rawX, rawY), DATA.arrows.minimum);
        const ux = rawX / length;
        const uy = rawY / length;
        const baseX = bx - ux * DATA.arrows.length;
        const baseY = by - uy * DATA.arrows.length;
        const left = [
          baseX - uy * DATA.arrows.halfWidth,
          baseY + ux * DATA.arrows.halfWidth
        ];
        const right = [
          baseX + uy * DATA.arrows.halfWidth,
          baseY - ux * DATA.arrows.halfWidth
        ];
        const vertices = [[bx, by], left, right];
        return make("polygon", {
          points: vertices
            .map(([x, y]) => `${sx(x)},${sy(y)}`)
            .join(" "),
          class: className
        });
      };

      const label = item => {
        const [x, y] = item.point;
        const text = make("text", {
          x: sx(x),
          y: sy(y),
          dx: item.dx,
          dy: item.dy,
          "text-anchor": item.anchor,
          class: item.className
        });
        text.textContent = item.text;
        return text;
      };

      const svg = make("svg", {
        viewBox: [
          DATA.canvas.zero,
          DATA.canvas.zero,
          DATA.canvas.width,
          DATA.canvas.height
        ].join(" "),
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "svg-title svg-desc"
      });

      const title = make("title", { id: "svg-title" });
      title.textContent = "Два пути от шума к данным";
      svg.append(title);

      const description = make("desc", { id: "svg-desc" });
      description.textContent =
        "Извилистая траектория разбита на множество коротких шагов, а прямая — на несколько длинных. Обе начинаются в шуме при t равно 1 и заканчиваются в данных при t равно 0.";
      svg.append(description);

      svg.append(
        circle(DATA.endpoints.start, DATA.endpoints.haloRadius, "endpoint-halo"),
        circle(DATA.endpoints.finish, DATA.endpoints.haloRadius, "endpoint-halo")
      );

      DATA.endpoints.noise.forEach(point => {
        svg.append(circle(point, DATA.endpoints.noiseRadius, "noise-dot"));
      });

      DATA.endpoints.data.forEach(point => {
        svg.append(circle(point, DATA.endpoints.dataRadius, "data-dot"));
      });

      DATA.route.curved.slice(C.one).forEach((point, offset) => {
        const index = offset + C.one;
        svg.append(line(
          DATA.route.curved[index - C.one],
          point,
          "route-curve"
        ));
      });

      DATA.route.curved.slice(C.one, C.minusOne).forEach(point => {
        svg.append(circle(point, DATA.endpoints.noiseRadius, "curve-step"));
      });

      DATA.route.curvedArrows.forEach(index => {
        svg.append(arrow(
          DATA.route.curved[index - C.one],
          DATA.route.curved[index],
          "curve-arrow"
        ));
      });

      DATA.route.direct.slice(C.one).forEach((point, offset) => {
        const index = offset + C.one;
        svg.append(
          line(DATA.route.direct[index - C.one], point, "route-direct"),
          arrow(DATA.route.direct[index - C.one], point, "direct-arrow")
        );
      });

      DATA.route.direct.slice(C.one, C.minusOne).forEach(point => {
        svg.append(circle(point, DATA.endpoints.coreRadius, "direct-step"));
      });

      svg.append(
        circle(DATA.endpoints.start, DATA.endpoints.coreRadius, "endpoint-core"),
        circle(DATA.endpoints.finish, DATA.endpoints.coreRadius, "endpoint-core")
      );

      DATA.leaders.forEach(([from, to]) => {
        svg.append(line(from, to, "leader"));
      });

      svg.append(line(DATA.note.line[C.zero], DATA.note.line[C.one], "note-line"));

      DATA.note.dots.forEach(point => {
        svg.append(circle(point, DATA.endpoints.noiseRadius, "note-dot"));
      });

      DATA.labels.forEach(item => {
        svg.append(label(item));
      });

      plot.replaceChildren(svg);
    } catch (error) {
      const plot = document.getElementById("plot");
      plot.textContent =
        "Схема должна была показать две траектории от шума при t = 1 к данным при t = 0: извилистый путь с 20–50 короткими шагами и прямой путь с 1–4 шагами.";
      plot.className = "fallback";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
