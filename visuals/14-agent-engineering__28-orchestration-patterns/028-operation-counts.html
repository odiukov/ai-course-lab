<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цена четырёх топологий в операциях</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --text: #172033;
    --muted: #687386;
    --rule: #dce1ea;
    --route: #9aa5b5;
    --swarm: #168b76;
    --supervisor: #3478d4;
    --hierarchy: #7659c7;
    --debate: #d06a35;
    --soft-swarm: #e3f5f0;
    --soft-supervisor: #e7f0fc;
    --soft-hierarchy: #eee9fb;
    --soft-debate: #fbece4;
    --shadow: rgba(23,32,51,.09);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --panel: #18202d;
      --text: #eef3fb;
      --muted: #a9b4c6;
      --rule: #344052;
      --route: #718096;
      --swarm: #4cc7ad;
      --supervisor: #68a8f5;
      --hierarchy: #a891ed;
      --debate: #f19a68;
      --soft-swarm: #173c38;
      --soft-supervisor: #1c3657;
      --soft-hierarchy: #342b55;
      --soft-debate: #4d3025;
      --shadow: rgba(0,0,0,.22);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--rule);
    box-shadow: 0 8px 24px var(--shadow);
  }

  .heading {
    padding: 18px 24px 8px;
  }

  .heading h1 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -.02em;
  }

  .heading p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.4;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    overflow: visible;
    background: var(--panel);
  }

  .column {
    fill: var(--muted);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .09em;
  }

  .lane-name {
    fill: var(--text);
    font-size: 16px;
    font-weight: 750;
    letter-spacing: .025em;
  }

  .lane-note {
    fill: var(--muted);
    font-size: 12px;
  }

  .cost {
    fill: var(--text);
    font-size: 17px;
    font-weight: 760;
  }

  .metric-label {
    fill: var(--muted);
    font-size: 11px;
  }

  .legend {
    fill: var(--muted);
    font-size: 12px;
  }

  .separator {
    stroke: var(--rule);
    stroke-width: 1;
  }

  .route {
    fill: none;
    stroke: var(--route);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .operation {
    stroke-width: 2;
  }

  .operation-inner {
    stroke: none;
  }

  .swarm .operation {
    fill: var(--panel);
    stroke: var(--swarm);
  }

  .swarm .operation-inner,
  .swarm .depth-mark,
  .swarm .transition-mark {
    fill: var(--swarm);
    stroke: var(--swarm);
  }

  .supervisor .operation {
    fill: var(--panel);
    stroke: var(--supervisor);
  }

  .supervisor .operation-inner,
  .supervisor .depth-mark,
  .supervisor .transition-mark {
    fill: var(--supervisor);
    stroke: var(--supervisor);
  }

  .hierarchy .operation {
    fill: var(--panel);
    stroke: var(--hierarchy);
  }

  .hierarchy .operation-inner,
  .hierarchy .depth-mark,
  .hierarchy .transition-mark {
    fill: var(--hierarchy);
    stroke: var(--hierarchy);
  }

  .debate .operation {
    fill: var(--panel);
    stroke: var(--debate);
  }

  .debate .operation-inner,
  .debate .depth-mark,
  .debate .transition-mark {
    fill: var(--debate);
    stroke: var(--debate);
  }

  .depth-mark,
  .transition-mark {
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fallback {
    margin: 18px 24px 24px;
    padding: 16px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--rule);
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="figure">
  <header class="heading">
    <h1 id="diagram-title">Цена четырёх топологий в операциях</h1>
    <p>Один запрос <strong>refund</strong>: полезная работа та же, меняется длина обвязки.</p>
  </header>

  <svg id="diagram"
       viewBox="0 0 1200 500"
       width="1200"
       height="500"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">Четыре трассы запроса refund: swarm — 3 операции, supervisor — 4, hierarchy — 6, debate — 12. Высота трассы показывает глубину, стрелки показывают переходы.</desc>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Схема должна была показать один запрос refund в четырёх топологиях:
    swarm — 3 операции, supervisor — 4, hierarchy — 6, debate — 12;
    глубина видна по уровням трассы, а переходы — по стрелкам.
  </p>
</main>

<script>
const scheme = {
  zero: 0,
  unit: 1,
  canvas: { width: 1200, height: 500 },
  originPoint: { x: 0, y: 0 },
  scaleValue: { x: 1, y: 1 },
  geometry: {
    left: 48,
    right: 1172,
    columnsY: 24,
    nameX: 52,
    traceX: 250,
    costX: 842,
    depthX: 970,
    transitionsX: 1060,
    separatorStartX: 48,
    separatorEndX: 1172,
    nodeRadius: 9,
    innerRadius: 3,
    arrowLength: 8,
    arrowWidth: 5,
    depthWidth: 36,
    depthStepX: 5,
    depthStepY: 7,
    metricTopOffset: 17,
    transitionLength: 7,
    transitionGap: 10,
    transitionWing: 3,
    legendY: 480,
    legendMarkX: 52,
    legendTextX: 76,
    legendSecondX: 570,
    legendSecondTextX: 594
  },
  columns: [
    { text: "ТОПОЛОГИЯ", x: 52, anchor: "start" },
    { text: "ТРАССА REFUND", x: 250, anchor: "start" },
    { text: "ЦЕНА", x: 842, anchor: "start" },
    { text: "ГЛУБИНА", x: 970, anchor: "start" },
    { text: "ПЕРЕХОДЫ", x: 1060, anchor: "start" }
  ],
  lanes: [
    {
      className: "swarm",
      name: "SWARM",
      note: "прямые передачи",
      opText: "3 операции",
      labelY: 72,
      noteY: 94,
      metricY: 76,
      depth: 1,
      separatorY: 132,
      nodes: [
        { x: 280, y: 84 },
        { x: 520, y: 84 },
        { x: 760, y: 84 }
      ]
    },
    {
      className: "supervisor",
      name: "SUPERVISOR",
      note: "центральный диспетчер",
      opText: "4 операции",
      labelY: 166,
      noteY: 188,
      metricY: 170,
      depth: 2,
      separatorY: 226,
      nodes: [
        { x: 280, y: 176 },
        { x: 440, y: 196 },
        { x: 600, y: 196 },
        { x: 760, y: 176 }
      ]
    },
    {
      className: "hierarchy",
      name: "HIERARCHY",
      note: "два уровня управления",
      opText: "6 операций",
      labelY: 264,
      noteY: 286,
      metricY: 268,
      depth: 4,
      separatorY: 346,
      nodes: [
        { x: 280, y: 264 },
        { x: 376, y: 284 },
        { x: 472, y: 304 },
        { x: 568, y: 324 },
        { x: 664, y: 304 },
        { x: 760, y: 284 }
      ]
    },
    {
      className: "debate",
      name: "DEBATE",
      note: "предложения и критика",
      opText: "12 операций",
      labelY: 386,
      noteY: 408,
      metricY: 390,
      depth: 3,
      nodes: [
        { x: 280, y: 390 },
        { x: 325, y: 410 },
        { x: 370, y: 430 },
        { x: 415, y: 410 },
        { x: 460, y: 390 },
        { x: 505, y: 410 },
        { x: 550, y: 430 },
        { x: 595, y: 410 },
        { x: 640, y: 390 },
        { x: 685, y: 410 },
        { x: 730, y: 430 },
        { x: 775, y: 410 }
      ]
    }
  ]
};

const origin = Object.freeze({
  x: scheme.originPoint.x,
  y: scheme.originPoint.y
});

const scale = Object.freeze({
  x: scheme.scaleValue.x,
  y: scheme.scaleValue.y
});

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";
  const ZERO = scheme.zero;
  const ONE = scheme.unit;
  const g = scheme.geometry;

  const make = (name, attributes, parent) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    (parent || svg).appendChild(node);
    return node;
  };

  const text = (value, x, y, className, anchor, parent) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, parent);
    node.textContent = value;
    return node;
  };

  const line = (a, b, className, parent) => make("line", {
    x1: sx(a.x),
    y1: sy(a.y),
    x2: sx(b.x),
    y2: sy(b.y),
    class: className
  }, parent);

  const arrow = (from, to, className, parent, radius) => {
    const dx = to.x - from.x;
    const dy = to.y - from.y;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const start = {
      x: from.x + ux * radius,
      y: from.y + uy * radius
    };
    const tip = {
      x: to.x - ux * radius,
      y: to.y - uy * radius
    };
    const base = {
      x: tip.x - ux * g.arrowLength,
      y: tip.y - uy * g.arrowLength
    };
    const left = {
      x: base.x - uy * g.arrowWidth,
      y: base.y + ux * g.arrowWidth
    };
    const right = {
      x: base.x + uy * g.arrowWidth,
      y: base.y - ux * g.arrowWidth
    };

    line(start, tip, className, parent);
    line(left, tip, className, parent);
    line(right, tip, className, parent);
  };

  const operation = (point, parent, endpoint) => {
    make("circle", {
      cx: sx(point.x),
      cy: sy(point.y),
      r: sx(g.nodeRadius) - sx(ZERO),
      class: "operation"
    }, parent);

    if (endpoint) {
      make("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: sx(g.innerRadius) - sx(ZERO),
        class: "operation-inner"
      }, parent);
    }
  };

  const drawDepth = (lane, parent) => {
    const top = lane.metricY + g.metricTopOffset;
    let index = ZERO;

    while (index < lane.depth) {
      const y = top + index * g.depthStepY;
      const inset = index * g.depthStepX;
      line(
        { x: g.depthX + inset, y },
        { x: g.depthX + g.depthWidth - inset, y },
        "depth-mark",
        parent
      );
      index += ONE;
    }
  };

  const drawTransitionCount = (lane, parent) => {
    const total = lane.nodes.length - ONE;
    const y = lane.metricY + g.metricTopOffset;
    let index = ZERO;

    while (index < total) {
      const startX = g.transitionsX + index * g.transitionGap;
      const tipX = startX + g.transitionLength;

      line(
        { x: startX, y },
        { x: tipX, y },
        "transition-mark",
        parent
      );
      line(
        { x: tipX - g.transitionWing, y: y - g.transitionWing },
        { x: tipX, y },
        "transition-mark",
        parent
      );
      line(
        { x: tipX - g.transitionWing, y: y + g.transitionWing },
        { x: tipX, y },
        "transition-mark",
        parent
      );
      index += ONE;
    }
  };

  scheme.columns.forEach(column => {
    text(
      column.text,
      column.x,
      scheme.geometry.columnsY,
      "column",
      column.anchor,
      svg
    );
  });

  scheme.lanes.forEach(lane => {
    const group = make("g", { class: lane.className }, svg);
    const routes = make("g", { "aria-hidden": "true" }, group);
    const nodes = make("g", { "aria-hidden": "true" }, group);

    text(lane.name, g.nameX, lane.labelY, "lane-name", "start", group);
    text(lane.note, g.nameX, lane.noteY, "lane-note", "start", group);
    text(lane.opText, g.costX, lane.metricY, "cost", "start", group);

    lane.nodes.forEach((point, index, points) => {
      if (index < points.length - ONE) {
        arrow(point, points[index + ONE], "route", routes, g.nodeRadius);
      }
    });

    lane.nodes.forEach((point, index, points) => {
      const endpoint = index === ZERO || index === points.length - ONE;
      operation(point, nodes, endpoint);
    });

    drawDepth(lane, group);
    drawTransitionCount(lane, group);

    if (lane.separatorY) {
      line(
        { x: g.separatorStartX, y: lane.separatorY },
        { x: g.separatorEndX, y: lane.separatorY },
        "separator",
        svg
      );
    }
  });

  const legendGroup = make("g", { "aria-hidden": "true" }, svg);

  line(
    { x: g.legendMarkX, y: g.legendY },
    { x: g.legendMarkX + g.depthWidth, y: g.legendY },
    "depth-mark hierarchy",
    legendGroup
  );

  text(
    "глубина — уровни по высоте трассы",
    g.legendTextX + g.depthWidth,
    g.legendY + g.innerRadius,
    "legend",
    "start",
    legendGroup
  );

  arrow(
    { x: g.legendSecondX, y: g.legendY },
    { x: g.legendSecondX + g.depthWidth, y: g.legendY },
    "transition-mark supervisor",
    legendGroup,
    ZERO
  );

  text(
    "переходы — стрелки между операциями",
    g.legendSecondTextX + g.depthWidth,
    g.legendY + g.innerRadius,
    "legend",
    "start",
    legendGroup
  );

  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
