<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь ответа через проверку faithfulness</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #eef2f8;
      --ink: #182033;
      --muted: #5d677d;
      --line: #8893a8;
      --line-soft: #c9d0dc;
      --blue: #315fbd;
      --blue-soft: #e8efff;
      --green: #19784b;
      --green-soft: #e4f5ec;
      --red: #b13e48;
      --red-soft: #fdebed;
      --violet: #6947aa;
      --violet-soft: #f0eaff;
      --shadow: #dbe0ea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111522;
        --panel: #1a2030;
        --panel-soft: #242c3e;
        --ink: #f1f4fa;
        --muted: #b6bfd1;
        --line: #8995ac;
        --line-soft: #465168;
        --blue: #8db2ff;
        --blue-soft: #20365e;
        --green: #71d6a5;
        --green-soft: #183d30;
        --red: #ff9ba3;
        --red-soft: #51262d;
        --violet: #c7aaff;
        --violet-soft: #382957;
        --shadow: #0c0f18;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      background: var(--bg);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 8px;
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
    }

    .stage {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--bg);
    }

    .fallback {
      margin: 0;
      padding: 28px;
      font-size: 16px;
      line-height: 1.5;
      text-align: center;
      color: var(--ink);
      background: var(--panel);
    }

    .is-hidden {
      display: none;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line-soft);
    }

    .answer-frame {
      fill: var(--panel);
      stroke: var(--blue);
    }

    .answer-item {
      fill: var(--blue-soft);
      stroke: var(--blue);
    }

    .pair-frame {
      fill: var(--panel);
      stroke: var(--line-soft);
    }

    .context-cell {
      fill: var(--panel-soft);
    }

    .claim-cell {
      fill: var(--blue-soft);
    }

    .nli-box {
      fill: var(--violet-soft);
      stroke: var(--violet);
    }

    .pass-box {
      fill: var(--green-soft);
      stroke: var(--green);
    }

    .reject-box {
      fill: var(--red-soft);
      stroke: var(--red);
    }

    .score-box {
      fill: var(--panel);
      stroke: var(--blue);
    }

    .divider,
    .flow,
    .collector {
      fill: none;
      stroke: var(--line);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pass-flow {
      fill: none;
      stroke: var(--green);
      stroke-linecap: round;
    }

    .reject-flow {
      fill: none;
      stroke: var(--red);
      stroke-linecap: round;
    }

    .arrow {
      fill: var(--line);
    }

    .pass-arrow {
      fill: var(--green);
    }

    .reject-arrow {
      fill: var(--red);
    }

    .label {
      fill: var(--ink);
      font-weight: 650;
    }

    .small {
      fill: var(--muted);
    }

    .blue-text {
      fill: var(--blue);
      font-weight: 700;
    }

    .violet-text {
      fill: var(--violet);
      font-weight: 700;
    }

    .pass-text {
      fill: var(--green);
      font-weight: 700;
    }

    .reject-text {
      fill: var(--red);
      font-weight: 700;
    }

    .score {
      fill: var(--ink);
      font-weight: 800;
    }

    .dot-pass {
      fill: var(--green);
      stroke: var(--green);
    }

    .dot-reject {
      fill: var(--red-soft);
      stroke: var(--red);
    }
  </style>
</head>
<body>
  <main>
    <h1>Путь ответа через проверку faithfulness</h1>

    <svg
      id="diagram"
      class="stage"
      viewBox="0 0 1160 420"
      width="1160"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Проверка четырёх утверждений ответа по отдельности</title>
      <desc id="svg-desc">
        Ответ разбивается на четыре пары контекст — утверждение. Три NLI-проверки
        подтверждают утверждения, одна отклоняет. Итоговая доля равна трём четвёртым.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback">
      Схема должна была показать: ответ разбивается на четыре пары
      «контекст — утверждение», три пары проходят NLI-проверку, одна
      отклоняется, поэтому faithfulness = 3/4 = 0.75.
    </p>
  </main>

  <script>
    const data = [
      {
        origin: { x: 0, y: 0 },
        scale: { x: 1, y: 1 },
        zero: 0,
        canvas: { width: 1160, height: 420 },
        answer: { x: 15, y: 44, width: 145, height: 322 },
        item: { x: 34, width: 108, height: 44 },
        pair: { x: 220, width: 350, height: 56, split: 136 },
        nli: { x: 610, width: 112, height: 56 },
        result: { x: 760, width: 150, height: 56 },
        collector: { x: 950, top: 100, bottom: 340 },
        score: { x: 990, y: 157, width: 150, height: 126 },
        arrow: 10,
        arrowHalf: 6,
        radius: 9,
        dotRadius: 7,
        halfItem: 22,
        halfBox: 28,
        labelLift: 10,
        labelDrop: 11,
        titleY: 20,
        answerTitleY: 61,
        splitLabelX: 190,
        pairLabelX: 395,
        nliLabelX: 666,
        resultLabelX: 835,
        scoreLabelX: 1065,
        joinY: 220,
        scoreLineOneY: 183,
        scoreLineTwoY: 218,
        scoreDotsY: 249,
        scoreNoteY: 270,
        footerY: 397,
        stroke: 2,
        fontLarge: 24,
        fontMedium: 15,
        fontSmall: 12,
        fontScore: 25,
        dots: [
          { x: 1025, tone: "pass" },
          { x: 1052, tone: "pass" },
          { x: 1079, tone: "pass" },
          { x: 1106, tone: "reject" }
        ]
      },
      { y: 100, mark: "А", outcome: "Следует", note: "поддержано", pass: true },
      { y: 180, mark: "Б", outcome: "Следует", note: "поддержано", pass: true },
      { y: 260, mark: "В", outcome: "Следует", note: "поддержано", pass: true },
      { y: 340, mark: "Г", outcome: "Нейтрально", note: "не засчитано", pass: false }
    ];

    const [cfg, ...rows] = data;
    const origin = cfg.origin;
    const scale = cfg.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const ns = "http://www.w3.org/2000/svg";
      const root = document.getElementById("drawing");
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      const node = (name, attributes, parent = root) => {
        const element = document.createElementNS(ns, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }
        parent.appendChild(element);
        return element;
      };

      const rect = (x, y, width, height, className, radius = cfg.radius) =>
        node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(width) - sx(origin.x),
          height: sy(height) - sy(origin.y),
          rx: sx(radius) - sx(origin.x),
          ry: sy(radius) - sy(origin.y),
          class: className,
          "stroke-width": cfg.stroke
        });

      const line = (x1, y1, x2, y2, className) =>
        node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className,
          "stroke-width": cfg.stroke
        });

      const text = (x, y, value, className, anchor, size) => {
        const element = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle",
          "font-size": size
        });
        element.textContent = value;
        return element;
      };

      const circle = (x, y, radius, className) =>
        node("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(radius) - sx(origin.x),
          class: className,
          "stroke-width": cfg.stroke
        });

      const horizontalArrow = (x1, y, x2, className, arrowClass) => {
        line(x1, y, x2 - cfg.arrow, y, className);
        const points = [
          `${sx(x2)},${sy(y)}`,
          `${sx(x2 - cfg.arrow)},${sy(y - cfg.arrowHalf)}`,
          `${sx(x2 - cfg.arrow)},${sy(y + cfg.arrowHalf)}`
        ].join(" ");
        node("polygon", { points, class: arrowClass });
      };

      text(
        cfg.splitLabelX,
        cfg.titleY,
        "разбиение",
        "small",
        "middle",
        cfg.fontSmall
      );
      text(
        cfg.pairLabelX,
        cfg.titleY,
        "4 пары: контекст — утверждение",
        "label",
        "middle",
        cfg.fontMedium
      );
      text(
        cfg.nliLabelX,
        cfg.titleY,
        "NLI каждой пары",
        "label",
        "middle",
        cfg.fontMedium
      );
      text(
        cfg.resultLabelX,
        cfg.titleY,
        "решение",
        "label",
        "middle",
        cfg.fontMedium
      );
      text(
        cfg.scoreLabelX,
        cfg.titleY,
        "сборка результата",
        "label",
        "middle",
        cfg.fontMedium
      );

      rect(
        cfg.answer.x,
        cfg.answer.y,
        cfg.answer.width,
        cfg.answer.height,
        "answer-frame"
      );
      text(
        cfg.answer.x + cfg.answer.width / scale.x / (scale.x + scale.x),
        cfg.answerTitleY,
        "Ответ: 4 утверждения",
        "blue-text",
        "middle",
        cfg.fontMedium
      );

      for (const row of rows) {
        rect(
          cfg.item.x,
          row.y - cfg.halfItem,
          cfg.item.width,
          cfg.item.height,
          "answer-item"
        );
        text(
          cfg.item.x + cfg.item.width / scale.x / (scale.x + scale.x),
          row.y,
          `Утверждение ${row.mark}`,
          "blue-text",
          "middle",
          cfg.fontSmall
        );

        horizontalArrow(
          cfg.answer.x + cfg.answer.width,
          row.y,
          cfg.pair.x,
          "flow",
          "arrow"
        );

        rect(
          cfg.pair.x,
          row.y - cfg.halfBox,
          cfg.pair.width,
          cfg.pair.height,
          "pair-frame"
        );
        rect(
          cfg.pair.x,
          row.y - cfg.halfBox,
          cfg.pair.split,
          cfg.pair.height,
          "context-cell"
        );
        rect(
          cfg.pair.x + cfg.pair.split,
          row.y - cfg.halfBox,
          cfg.pair.width - cfg.pair.split,
          cfg.pair.height,
          "claim-cell"
        );
        line(
          cfg.pair.x + cfg.pair.split,
          row.y - cfg.halfBox,
          cfg.pair.x + cfg.pair.split,
          row.y + cfg.halfBox,
          "divider"
        );

        text(
          cfg.pair.x + cfg.pair.split / scale.x / (scale.x + scale.x),
          row.y - cfg.labelLift,
          "контекст",
          "label",
          "middle",
          cfg.fontSmall
        );
        text(
          cfg.pair.x + cfg.pair.split / scale.x / (scale.x + scale.x),
          row.y + cfg.labelDrop,
          "фрагмент документа",
          "small",
          "middle",
          cfg.fontSmall
        );
        text(
          cfg.pair.x + cfg.pair.split +
            (cfg.pair.width - cfg.pair.split) / scale.x / (scale.x + scale.x),
          row.y - cfg.labelLift,
          `утверждение ${row.mark}`,
          "blue-text",
          "middle",
          cfg.fontSmall
        );
        text(
          cfg.pair.x + cfg.pair.split +
            (cfg.pair.width - cfg.pair.split) / scale.x / (scale.x + scale.x),
          row.y + cfg.labelDrop,
          "проверяемый тезис",
          "small",
          "middle",
          cfg.fontSmall
        );

        horizontalArrow(
          cfg.pair.x + cfg.pair.width,
          row.y,
          cfg.nli.x,
          "flow",
          "arrow"
        );

        rect(
          cfg.nli.x,
          row.y - cfg.halfBox,
          cfg.nli.width,
          cfg.nli.height,
          "nli-box"
        );
        text(
          cfg.nli.x + cfg.nli.width / scale.x / (scale.x + scale.x),
          row.y - cfg.labelLift,
          "NLI",
          "violet-text",
          "middle",
          cfg.fontMedium
        );
        text(
          cfg.nli.x + cfg.nli.width / scale.x / (scale.x + scale.x),
          row.y + cfg.labelDrop,
          "посылка ↔ гипотеза",
          "small",
          "middle",
          cfg.fontSmall
        );

        horizontalArrow(
          cfg.nli.x + cfg.nli.width,
          row.y,
          cfg.result.x,
          "flow",
          "arrow"
        );

        rect(
          cfg.result.x,
          row.y - cfg.halfBox,
          cfg.result.width,
          cfg.result.height,
          row.pass ? "pass-box" : "reject-box"
        );
        text(
          cfg.result.x + cfg.result.width / scale.x / (scale.x + scale.x),
          row.y - cfg.labelLift,
          row.outcome,
          row.pass ? "pass-text" : "reject-text",
          "middle",
          cfg.fontMedium
        );
        text(
          cfg.result.x + cfg.result.width / scale.x / (scale.x + scale.x),
          row.y + cfg.labelDrop,
          row.note,
          row.pass ? "pass-text" : "reject-text",
          "middle",
          cfg.fontSmall
        );

        line(
          cfg.result.x + cfg.result.width,
          row.y,
          cfg.collector.x,
          row.y,
          row.pass ? "pass-flow" : "reject-flow"
        );
      }

      line(
        cfg.collector.x,
        cfg.collector.top,
        cfg.collector.x,
        cfg.collector.bottom,
        "collector"
      );
      horizontalArrow(
        cfg.collector.x,
        cfg.joinY,
        cfg.score.x,
        "flow",
        "arrow"
      );

      rect(
        cfg.score.x,
        cfg.score.y,
        cfg.score.width,
        cfg.score.height,
        "score-box"
      );
      text(
        cfg.score.x + cfg.score.width / scale.x / (scale.x + scale.x),
        cfg.scoreLineOneY,
        "faithfulness",
        "blue-text",
        "middle",
        cfg.fontMedium
      );
      text(
        cfg.score.x + cfg.score.width / scale.x / (scale.x + scale.x),
        cfg.scoreLineTwoY,
        "3/4 = 0.75",
        "score",
        "middle",
        cfg.fontScore
      );

      for (const dot of cfg.dots) {
        circle(
          dot.x,
          cfg.scoreDotsY,
          cfg.dotRadius,
          dot.tone === "pass" ? "dot-pass" : "dot-reject"
        );
      }

      text(
        cfg.score.x + cfg.score.width / scale.x / (scale.x + scale.x),
        cfg.scoreNoteY,
        "3 прошли, одно отклонено",
        "small",
        "middle",
        cfg.fontSmall
      );
      text(
        cfg.result.x,
        cfg.footerY,
        "Адрес ошибки сохранён: не прошло утверждение Г",
        "reject-text",
        "start",
        cfg.fontMedium
      );

      fallback.classList.add("is-hidden");
      svg.classList.remove("is-hidden");
    } catch (error) {
      document.getElementById("diagram").classList.add("is-hidden");
      document.getElementById("fallback").classList.remove("is-hidden");
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
