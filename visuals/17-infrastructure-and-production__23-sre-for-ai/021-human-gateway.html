<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шлюз человеческого утверждения перед действием</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --panel-soft: #eef2f8;
    --ink: #172033;
    --muted: #566176;
    --line: #8792a7;
    --blue: #315fba;
    --blue-soft: #e8efff;
    --ok: #16805b;
    --ok-soft: #e4f5ee;
    --danger: #bd3f4b;
    --danger-soft: #fdebed;
    --stroke: 2px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141d;
      --panel: #191f2b;
      --panel-soft: #222a38;
      --ink: #f1f4fb;
      --muted: #b2bbcc;
      --line: #758096;
      --blue: #86abff;
      --blue-soft: #202e4e;
      --ok: #63d2a7;
      --ok-soft: #17392f;
      --danger: #ff8992;
      --danger-soft: #47242a;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: calc(var(--stroke) - var(--stroke));
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  header {
    background: var(--bg);
    color: var(--ink);
    text-align: center;
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 500px;
    background: var(--bg);
  }

  .canvas { fill: var(--bg); }

  .cardbox {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .safe .cardbox {
    fill: var(--ok-soft);
    stroke: var(--ok);
  }

  .gate .cardbox {
    fill: var(--blue-soft);
    stroke: var(--blue);
    stroke-width: 3px;
  }

  .execute .cardbox {
    fill: var(--ok-soft);
    stroke: var(--ok);
  }

  .unsafe .cardbox,
  .blocked .cardbox {
    fill: var(--danger-soft);
    stroke: var(--danger);
  }

  text {
    fill: var(--ink);
    font-size: 15px;
  }

  .eyebrow {
    font-size: 13px;
    font-weight: bold;
  }

  .title {
    font-size: 16px;
    font-weight: bold;
  }

  .body {
    font-size: 15px;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .safe .eyebrow,
  .execute .eyebrow { fill: var(--ok); }

  .gate .eyebrow { fill: var(--blue); }

  .unsafe .eyebrow,
  .blocked .eyebrow { fill: var(--danger); }

  .route {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 3px;
    vector-effect: non-scaling-stroke;
  }

  .route.neutral { stroke: var(--line); }
  .route.allow { stroke: var(--ok); }
  .route.deny { stroke: var(--danger); }

  .head.neutral { fill: var(--line); }
  .head.allow { fill: var(--ok); }
  .head.deny { fill: var(--danger); }

  .route-label {
    font-size: 13px;
    font-weight: bold;
  }

  .route-label.allow { fill: var(--ok); }
  .route-label.deny { fill: var(--danger); }

  .badge {
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .badge.yes {
    fill: var(--ok-soft);
    stroke: var(--ok);
  }

  .badge.no {
    fill: var(--danger-soft);
    stroke: var(--danger);
  }

  .badge-text {
    font-size: 11px;
    font-weight: bold;
  }

  .badge-text.yes { fill: var(--ok); }
  .badge-text.no { fill: var(--danger); }

  .fallback-title {
    fill: var(--danger);
    font-size: 16px;
    font-weight: bold;
  }

  .fallback-body {
    fill: var(--ink);
    font-size: 15px;
  }
</style>
</head>
<body>
<header>Шлюз человеческого утверждения перед действием</header>

<svg id="diagram"
     viewBox="0 0 1200 450"
     width="1200"
     height="450"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Два пути после гипотезы AI</title>
  <desc id="svg-desc">
    Узкие обратимые действия проходят через решение человека, а изменения
    IAM, базы данных или топологии блокируются.
  </desc>
</svg>

<script>
const DATA = [{
  extent: [0, 0, 120, 45],
  zero: 0,
  radius: 1.2,

  routes: [
    {
      tone: "neutral",
      path: [[22, 22.5], [27, 22.5], [27, 13.5], [31, 13.5]],
      head: [[31, 13.5], [29.7, 12.7], [29.7, 14.3]]
    },
    {
      tone: "deny",
      path: [[22, 22.5], [27, 22.5], [27, 36], [31, 36]],
      head: [[31, 36], [29.7, 35.2], [29.7, 36.8]]
    },
    {
      tone: "allow",
      path: [[59, 13.5], [66, 13.5]],
      head: [[66, 13.5], [64.7, 12.7], [64.7, 14.3]]
    },
    {
      tone: "allow",
      path: [[88, 13.5], [95, 13.5]],
      head: [[95, 13.5], [93.7, 12.7], [93.7, 14.3]]
    },
    {
      tone: "deny",
      path: [[77, 36], [95, 36]],
      head: [[95, 36], [93.7, 35.2], [93.7, 36.8]]
    }
  ],

  routeLabels: [
    {
      p: [29.5, 10.5],
      offset: [0, -8],
      anchor: "end",
      tone: "allow",
      value: "узкое действие"
    },
    {
      p: [29.5, 39],
      offset: [0, 14],
      anchor: "end",
      tone: "deny",
      value: "широкое действие"
    },
    {
      p: [91.5, 10.5],
      offset: [0, -8],
      anchor: "middle",
      tone: "allow",
      value: "утверждено"
    },
    {
      p: [86, 33],
      offset: [0, -8],
      anchor: "middle",
      tone: "deny",
      value: "заблокировано"
    }
  ],

  nodes: [
    {
      tone: "hypothesis",
      box: [2, 15, 22, 30],
      texts: [
        {p: [12, 18.4], offset: [0, 0], anchor: "middle",
         style: "eyebrow", value: "ГИПОТЕЗА AI"},
        {p: [12, 22], offset: [0, 0], anchor: "middle",
         style: "title", value: "Рост ошибок"},
        {p: [12, 24.7], offset: [0, 0], anchor: "middle",
         style: "body", value: "после релиза"},
        {p: [12, 27.7], offset: [0, 0], anchor: "middle",
         style: "small", value: "Предложено исправление"}
      ]
    },
    {
      tone: "safe",
      box: [31, 4, 59, 23],
      texts: [
        {p: [45, 7.3], offset: [0, 0], anchor: "middle",
         style: "eyebrow", value: "БЕЗОПАСНЫЙ СПИСОК"},
        {p: [34, 11], offset: [8, 0], anchor: "start",
         style: "body", value: "• Перезапуск пода"},
        {p: [34, 14.2], offset: [8, 0], anchor: "start",
         style: "body", value: "• Откат деплоя"},
        {p: [34, 17.4], offset: [8, 0], anchor: "start",
         style: "body", value: "• Скейлинг в согласованных"},
        {p: [34, 20.2], offset: [8, 0], anchor: "start",
         style: "body", value: "  границах"}
      ]
    },
    {
      tone: "gate",
      box: [66, 4, 88, 23],
      texts: [
        {p: [77, 7.2], offset: [0, 0], anchor: "middle",
         style: "eyebrow", value: "РЕШЕНИЕ ЧЕЛОВЕКА"},
        {p: [77, 10.6], offset: [0, 0], anchor: "middle",
         style: "body", value: "Сверить контекст"},
        {p: [77, 13.2], offset: [0, 0], anchor: "middle",
         style: "body", value: "и точную команду"},
        {p: [77, 16], offset: [0, 0], anchor: "middle",
         style: "small", value: "Только положительный ответ"}
      ],
      badges: [
        {
          tone: "yes",
          box: [67.5, 18, 76.8, 21.5],
          p: [72.15, 20.3],
          offset: [0, 0],
          value: "УТВЕРДИТЬ"
        },
        {
          tone: "no",
          box: [78.2, 18, 86.5, 21.5],
          p: [82.35, 20.3],
          offset: [0, 0],
          value: "ОТКЛОНИТЬ"
        }
      ]
    },
    {
      tone: "execute",
      box: [95, 4, 118, 23],
      texts: [
        {p: [106.5, 7.2], offset: [0, 0], anchor: "middle",
         style: "eyebrow", value: "ИСПОЛНИТЕЛЬ"},
        {p: [106.5, 11], offset: [0, 0], anchor: "middle",
         style: "title", value: "Выполнить только"},
        {p: [106.5, 13.8], offset: [0, 0], anchor: "middle",
         style: "body", value: "указанное действие"},
        {p: [106.5, 17.3], offset: [0, 0], anchor: "middle",
         style: "small", value: "Команда изменилась?"},
        {p: [106.5, 20.2], offset: [0, 0], anchor: "middle",
         style: "body", value: "Нужно новое утверждение"}
      ]
    },
    {
      tone: "unsafe",
      box: [31, 29, 77, 43],
      texts: [
        {p: [54, 32.3], offset: [0, 0], anchor: "middle",
         style: "eyebrow", value: "МЕНЯЕТ ФОРМУ СИСТЕМЫ"},
        {p: [36, 35.6], offset: [8, 0], anchor: "start",
         style: "body", value: "• Изменение IAM"},
        {p: [36, 38.4], offset: [8, 0], anchor: "start",
         style: "body", value: "• Изменение базы данных"},
        {p: [36, 41.2], offset: [8, 0], anchor: "start",
         style: "body", value: "• Изменение топологии"}
      ]
    },
    {
      tone: "blocked",
      box: [95, 29, 118, 43],
      texts: [
        {p: [106.5, 32.5], offset: [0, 0], anchor: "middle",
         style: "eyebrow", value: "БЛОКИРОВКА"},
        {p: [106.5, 36.5], offset: [0, 0], anchor: "middle",
         style: "title", value: "Не передавать"},
        {p: [106.5, 39.4], offset: [0, 0], anchor: "middle",
         style: "body", value: "исполнителю"}
      ]
    }
  ],

  fallback: [
    {p: [60, 19], offset: [0, 0], anchor: "middle",
     style: "fallback-title", value: "Схему не удалось построить"},
    {p: [60, 23], offset: [0, 0], anchor: "middle",
     style: "fallback-body",
     value: "Узкие действия требуют утверждения человека;"},
    {p: [60, 26], offset: [0, 0], anchor: "middle",
     style: "fallback-body",
     value: "изменения IAM, базы данных и топологии блокируются."}
  ]
}];

const ORIGIN = Object.freeze({x: 0, y: 0});
const SCALE = 10;

const sx = x => ORIGIN.x + x * SCALE;
const sy = y => ORIGIN.y + y * SCALE;

const [diagram] = DATA;
const svg = document.getElementById("diagram");
const make = name => document.createElementNS(svg.namespaceURI, name);

const attrs = (node, values) => {
  Object.entries(values).forEach(([name, value]) => {
    node.setAttribute(name, String(value));
  });
  return node;
};

const pathData = points => {
  const [first, ...rest] = points;
  const [firstX, firstY] = first;
  const tail = rest.map(point => {
    const [x, y] = point;
    return `L ${sx(x)} ${sy(y)}`;
  }).join(" ");
  return `M ${sx(firstX)} ${sy(firstY)} ${tail}`;
};

const polygonData = points => points.map(point => {
  const [x, y] = point;
  return `${sx(x)},${sy(y)}`;
}).join(" ");

const addRect = (parent, box, className) => {
  const [x1, y1, x2, y2] = box;
  const rect = attrs(make("rect"), {
    x: sx(x1),
    y: sy(y1),
    width: sx(x2) - sx(x1),
    height: sy(y2) - sy(y1),
    rx: sx(diagram.radius) - sx(diagram.zero),
    ry: sy(diagram.radius) - sy(diagram.zero),
    class: className
  });
  parent.appendChild(rect);
  return rect;
};

const addText = (parent, item, extraClass) => {
  const [x, y] = item.p;
  const [dx, dy] = item.offset;
  const text = attrs(make("text"), {
    x: sx(x),
    y: sy(y),
    dx: dx,
    dy: dy,
    "text-anchor": item.anchor,
    class: `${item.style} ${extraClass || ""}`
  });
  text.textContent = item.value;
  parent.appendChild(text);
  return text;
};

const render = () => {
  const background = make("g");
  addRect(background, diagram.extent, "canvas");
  svg.appendChild(background);

  const routes = make("g");
  routes.setAttribute("aria-hidden", "true");

  diagram.routes.forEach(route => {
    routes.appendChild(attrs(make("path"), {
      d: pathData(route.path),
      class: `route ${route.tone}`
    }));
    routes.appendChild(attrs(make("polygon"), {
      points: polygonData(route.head),
      class: `head ${route.tone}`
    }));
  });

  svg.appendChild(routes);

  diagram.routeLabels.forEach(label => {
    addText(svg, {
      p: label.p,
      offset: label.offset,
      anchor: label.anchor,
      style: "route-label",
      value: label.value
    }, label.tone);
  });

  diagram.nodes.forEach(node => {
    const group = attrs(make("g"), {class: `card ${node.tone}`});
    addRect(group, node.box, "cardbox");
    node.texts.forEach(item => addText(group, item, ""));

    if (node.badges) {
      node.badges.forEach(badge => {
        addRect(group, badge.box, `badge ${badge.tone}`);
        addText(group, {
          p: badge.p,
          offset: badge.offset,
          anchor: "middle",
          style: "badge-text",
          value: badge.value
        }, badge.tone);
      });
    }

    svg.appendChild(group);
  });
};

try {
  render();
} catch (error) {
  const fallbackLayer = make("g");
  addRect(fallbackLayer, diagram.extent, "canvas");
  diagram.fallback.forEach(item => addText(fallbackLayer, item, ""));
  svg.appendChild(fallbackLayer);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
