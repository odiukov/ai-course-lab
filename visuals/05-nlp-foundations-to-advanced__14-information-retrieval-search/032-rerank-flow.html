<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как top-30 превращается в финальный top-5</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --panel-soft: #eef2ff;
    --panel-warm: #fff4df;
    --panel-green: #eaf8ef;
    --ink: #172033;
    --muted: #586174;
    --line: #7b8498;
    --blue: #315fd5;
    --orange: #cf6a18;
    --green: #16804a;
    --purple: #7048c8;
    --chip: #dfe7ff;
    --note: #f0f2f7;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111522;
      --panel: #1b2232;
      --panel-soft: #202b49;
      --panel-warm: #3a2b1b;
      --panel-green: #173729;
      --ink: #f4f6fb;
      --muted: #b9c1d1;
      --line: #929caf;
      --blue: #87a7ff;
      --orange: #ffad68;
      --green: #66d89b;
      --purple: #bea2ff;
      --chip: #273966;
      --note: #202736;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    width: 100%;
    background: var(--bg);
  }

  figcaption {
    padding: 14px 22px 10px;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.25;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 468px;
    background: var(--bg);
  }

  .card {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .input-card { fill: var(--panel-soft); }
  .union-card { fill: var(--panel-warm); }
  .cross-card { fill: var(--panel-green); }
  .output-card {
    fill: var(--panel-green);
    stroke: var(--green);
    stroke-width: 3px;
  }

  .note-box {
    fill: var(--note);
    stroke: var(--line);
    stroke-width: 1px;
  }

  .arrow {
    fill: none;
    stroke: var(--line);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .arrow-head { fill: var(--line); }

  .row-line {
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .row-dot { fill: var(--line); }

  .title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .body {
    fill: var(--muted);
    font-size: 14px;
  }

  .count {
    fill: var(--ink);
    font-size: 28px;
    font-weight: bold;
  }

  .code {
    fill: var(--purple);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 14px;
    font-weight: bold;
  }

  .arrow-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .note-key {
    fill: var(--purple);
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 14px;
    font-weight: bold;
  }

  .note-text {
    fill: var(--ink);
    font-size: 14px;
  }

  .final-count {
    fill: var(--green);
    font-size: 31px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Как top-30 превращается в финальный top-5</figcaption>
  <svg id="diagram" viewBox="0 0 1180 468" width="1180" height="468"
       role="img" aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      BM25 и dense-поиск возвращают по 30 документов. После объединения остаётся
      от 30 до 60 уникальных кандидатов, RRF сокращает пул до 30, cross-encoder
      оценивает 30 пар запрос-документ и оставляет финальные 5 документов.
    </desc>
  </svg>
</figure>

<script>
const DATA = Object.freeze({
  canvas: { left: 0, top: 0, right: 1180, bottom: 468 },
  math: { half: 0.5 },
  labelPad: 12,
  arrowShape: { head: 15, wing: 8 },
  cards: [
    {
      kind: "input-card", x: 28, y: 48, w: 190, h: 122,
      lines: [
        { text: "BM25", y: 72, cls: "title" },
        { text: "лексические совпадения", y: 96, cls: "body" },
        { text: "до 30 документов", y: 137, cls: "count" }
      ],
      rows: [
        { y: 111, from: 50, to: 106, dot: 42 },
        { y: 119, from: 50, to: 91, dot: 42 }
      ]
    },
    {
      kind: "input-card", x: 28, y: 236, w: 190, h: 122,
      lines: [
        { text: "Dense-поиск", y: 260, cls: "title" },
        { text: "смысловая близость", y: 284, cls: "body" },
        { text: "до 30 документов", y: 325, cls: "count" }
      ],
      rows: [
        { y: 299, from: 50, to: 106, dot: 42 },
        { y: 307, from: 50, to: 91, dot: 42 }
      ]
    },
    {
      kind: "union-card", x: 286, y: 139, w: 190, h: 132,
      lines: [
        { text: "Объединение списков", y: 166, cls: "title" },
        { text: "совпадения удаляются", y: 190, cls: "body" },
        { text: "30–60", y: 229, cls: "count" },
        { text: "уникальных кандидатов", y: 252, cls: "body" }
      ]
    },
    {
      kind: "", x: 536, y: 139, w: 176, h: 132,
      lines: [
        { text: "RRF", y: 166, cls: "title" },
        { text: "общий порядок", y: 190, cls: "body" },
        { text: "pool_size=30", y: 226, cls: "code" },
        { text: "остаются первые 30", y: 252, cls: "body" }
      ]
    },
    {
      kind: "", x: 772, y: 139, w: 176, h: 132,
      lines: [
        { text: "Пары", y: 166, cls: "title" },
        { text: "запрос + документ", y: 190, cls: "body" },
        { text: "30 пар", y: 229, cls: "count" },
        { text: "для точной проверки", y: 252, cls: "body" }
      ]
    },
    {
      kind: "cross-card", x: 1008, y: 104, w: 144, h: 202,
      lines: [
        { text: "Cross-encoder", y: 133, cls: "title" },
        { text: "читает запрос", y: 164, cls: "body" },
        { text: "и документ", y: 184, cls: "body" },
        { text: "вместе", y: 204, cls: "body" },
        { text: "30 новых", y: 242, cls: "count" },
        { text: "баллов", y: 269, cls: "count" },
        { text: "новый порядок", y: 292, cls: "body" }
      ]
    },
    {
      kind: "output-card", x: 1008, y: 348, w: 144, h: 92,
      lines: [
        { text: "Финальный top-5", y: 374, cls: "title" },
        { text: "top_k=5", y: 414, cls: "final-count" }
      ]
    }
  ],
  arrows: [
    {
      x1: 218, y1: 109, x2: 286, y2: 183,
      label: { text: "до 30", x: 230, y: 101, anchor: "start" }
    },
    {
      x1: 218, y1: 297, x2: 286, y2: 227,
      label: { text: "до 30", x: 230, y: 319, anchor: "start" }
    },
    {
      x1: 476, y1: 205, x2: 536, y2: 205,
      label: { text: "общий список", x: 506, y: 183, anchor: "middle" }
    },
    {
      x1: 712, y1: 205, x2: 772, y2: 205,
      label: { text: "первые 30", x: 742, y: 183, anchor: "middle" }
    },
    {
      x1: 948, y1: 205, x2: 1008, y2: 205,
      label: { text: "30 пар", x: 978, y: 183, anchor: "middle" }
    },
    {
      x1: 1080, y1: 306, x2: 1080, y2: 348,
      label: { text: "сортировка + срез", x: 1064, y: 329, anchor: "end" }
    }
  ],
  notes: [
    {
      x: 286, y: 326, w: 310, h: 76,
      key: "pool_size=30",
      keyX: 306, keyY: 354,
      text: "кого допустили",
      textX: 306, textY: 380,
      tail: "к точной проверке",
      tailX: 306, tailY: 398
    },
    {
      x: 638, y: 326, w: 310, h: 76,
      key: "top_k=5",
      keyX: 658, keyY: 354,
      text: "сколько победителей",
      textX: 658, textY: 380,
      tail: "увидит пользователь",
      tailX: 658, tailY: 398
    }
  ],
  footer: {
    text: "Если документ не вошёл в пул из 30, cross-encoder уже не сможет его вернуть.",
    x: 28, y: 447
  },
  fallback: {
    x: 28, y: 80,
    lines: [
      "BM25: до 30 + dense: до 30 → 30–60 уникальных кандидатов.",
      "RRF и pool_size=30 → 30 пар → cross-encoder → финальный top_k=5."
    ],
    gap: 30
  }
});

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const NS = "http://www.w3.org/2000/svg";

  const make = (name, attrs, cls) => {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    if (cls) node.setAttribute("class", cls);
    return node;
  };

  const addText = (text, x, y, cls, anchor) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor || "middle",
      "dominant-baseline": "middle"
    }, cls);
    node.textContent = text;
    svg.appendChild(node);
    return node;
  };

  const addRect = (box, cls) => {
    const node = make("rect", {
      x: sx(box.x),
      y: sy(box.y),
      width: sx(box.x + box.w) - sx(box.x),
      height: sy(box.y + box.h) - sy(box.y),
      rx: sx(DATA.labelPad) - sx(0),
      ry: sy(DATA.labelPad) - sy(0)
    }, cls);
    svg.appendChild(node);
    return node;
  };

  const addArrow = arrow => {
    const line = make("line", {
      x1: sx(arrow.x1),
      y1: sy(arrow.y1),
      x2: sx(arrow.x2),
      y2: sy(arrow.y2)
    }, "arrow");
    svg.appendChild(line);

    const dx = arrow.x2 - arrow.x1;
    const dy = arrow.y2 - arrow.y1;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const bx = arrow.x2 - ux * DATA.arrowShape.head;
    const by = arrow.y2 - uy * DATA.arrowShape.head;
    const leftX = bx - uy * DATA.arrowShape.wing;
    const leftY = by + ux * DATA.arrowShape.wing;
    const rightX = bx + uy * DATA.arrowShape.wing;
    const rightY = by - ux * DATA.arrowShape.wing;

    const head = make("polygon", {
      points: [
        `${sx(arrow.x2)},${sy(arrow.y2)}`,
        `${sx(leftX)},${sy(leftY)}`,
        `${sx(rightX)},${sy(rightY)}`
      ].join(" ")
    }, "arrow-head");
    svg.appendChild(head);

    addText(
      arrow.label.text,
      arrow.label.x,
      arrow.label.y,
      "arrow-label",
      arrow.label.anchor
    );
  };

  DATA.arrows.forEach(addArrow);

  DATA.cards.forEach(card => {
    addRect(card, `card ${card.kind}`.trim());
    const centerX = card.x + card.w * DATA.math.half;

    if (card.rows) {
      card.rows.forEach(row => {
        svg.appendChild(make("circle", {
          cx: sx(row.dot),
          cy: sy(row.y),
          r: sx(DATA.labelPad * DATA.math.half) - sx(0)
        }, "row-dot"));
        svg.appendChild(make("line", {
          x1: sx(row.from),
          y1: sy(row.y),
          x2: sx(row.to),
          y2: sy(row.y)
        }, "row-line"));
      });
    }

    card.lines.forEach(line => {
      addText(line.text, centerX, line.y, line.cls, "middle");
    });
  });

  DATA.notes.forEach(note => {
    addRect(note, "note-box");
    addText(note.key, note.keyX, note.keyY, "note-key", "start");
    addText(note.text, note.textX, note.textY, "note-text", "start");
    addText(note.tail, note.tailX, note.tailY, "note-text", "start");
  });

  addText(
    DATA.footer.text,
    DATA.footer.x,
    DATA.footer.y,
    "body",
    "start"
  );
} catch (error) {
  const svg = document.getElementById("diagram");
  const NS = "http://www.w3.org/2000/svg";
  DATA.fallback.lines.forEach((line, index) => {
    const node = document.createElementNS(NS, "text");
    node.setAttribute("x", sx(DATA.fallback.x));
    node.setAttribute("y", sy(DATA.fallback.y + index * DATA.fallback.gap));
    node.setAttribute("class", "fallback");
    node.setAttribute("text-anchor", "start");
    node.textContent = line;
    svg.appendChild(node);
  });
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
