<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три компонента генеративного агента</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f1e8;
      --surface: #fffdf7;
      --surface-soft: #f8f4e9;
      --ink: #252b33;
      --muted: #65717d;
      --line: #78838e;
      --memory: #287c70;
      --memory-soft: #dcefe9;
      --reflection: #7d57a5;
      --reflection-soft: #eee4f7;
      --plan: #b7652d;
      --plan-soft: #f7e7d9;
      --event-soft: #e8eef2;
      --event-line: #aab6bf;
      --arrow: #46545f;
      --focus: #fff7cd;
      --focus-line: #b59a38;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #161a1e;
        --surface: #20262b;
        --surface-soft: #252c32;
        --ink: #edf1f3;
        --muted: #b6c0c7;
        --line: #8b98a1;
        --memory: #69c9b9;
        --memory-soft: #173f39;
        --reflection: #c5a2e5;
        --reflection-soft: #3c2b4d;
        --plan: #efaa70;
        --plan-soft: #4b3022;
        --event-soft: #2d353c;
        --event-line: #64727c;
        --arrow: #bac6cc;
        --focus: #453d1d;
        --focus-line: #cfb85d;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      padding: 14px;
    }

    .frame {
      width: 100%;
      max-width: 960px;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 14px;
    }

    h1 {
      margin: unset;
      padding-bottom: 10px;
      font-size: 22px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--surface);
    }

    .panel {
      stroke-width: 2px;
    }

    .memory-panel {
      fill: var(--surface-soft);
      stroke: var(--memory);
    }

    .reflection-panel {
      fill: var(--reflection-soft);
      stroke: var(--reflection);
    }

    .plan-panel {
      fill: var(--plan-soft);
      stroke: var(--plan);
    }

    .entry {
      fill: var(--surface);
      stroke: var(--event-line);
      stroke-width: 1px;
    }

    .hierarchy {
      fill: var(--surface);
      stroke: var(--plan);
      stroke-width: 1px;
    }

    .revision {
      fill: var(--focus);
      stroke: var(--focus-line);
      stroke-width: 1px;
    }

    .chip-memory {
      fill: var(--memory-soft);
      stroke: var(--memory);
      stroke-width: 1px;
    }

    .arrow-line {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 1px;
    }

    text {
      fill: var(--ink);
      font-size: 14px;
    }

    .component-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: .02em;
    }

    .memory-title {
      fill: var(--memory);
    }

    .reflection-title {
      fill: var(--reflection);
    }

    .plan-title {
      fill: var(--plan);
    }

    .muted {
      fill: var(--muted);
      font-size: 12px;
    }

    .entry-kind {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .entry-text {
      font-size: 13px;
    }

    .chip-text {
      fill: var(--memory);
      font-size: 11px;
      font-weight: bold;
    }

    .quote {
      font-size: 14px;
      font-weight: bold;
    }

    .arrow-label {
      fill: var(--arrow);
      font-size: 12px;
      font-weight: bold;
    }

    .plan-step {
      fill: var(--plan);
      font-size: 12px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Три компонента генеративного агента</h1>
    <svg id="diagram"
         viewBox="0 0 960 440"
         width="960"
         height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Цикл памяти, рефлексии и планирования</title>
      <desc id="svg-desc">
        Поток памяти хранит наблюдения, рефлексия возвращает в него выводы,
        а план раскладывает день на часы и действия и меняет только затронутый
        событиями отрезок.
      </desc>
      <g id="drawing"></g>
    </svg>
  </main>

  <script>
    const DATA = [{
      map: { originX: 0, originY: 0, scaleX: 1, scaleY: 1 },
      panels: [
        {
          x1: 24, y1: 48, x2: 430, y2: 370, r: 12,
          className: "panel memory-panel"
        },
        {
          x1: 545, y1: 48, x2: 930, y2: 190, r: 12,
          className: "panel reflection-panel"
        },
        {
          x1: 545, y1: 245, x2: 930, y2: 390, r: 12,
          className: "panel plan-panel"
        }
      ],
      labels: [
        {
          x: 44, y: 77, text: "MEMORY STREAM · ПОТОК ПАМЯТИ",
          anchor: "start", className: "component-title memory-title"
        },
        {
          x: 44, y: 99,
          text: "Журнал только дополняется: старые записи не переписываются",
          anchor: "start", className: "muted"
        },
        {
          x: 565, y: 77, text: "REFLECTION · РЕФЛЕКСИЯ",
          anchor: "start", className: "component-title reflection-title"
        },
        {
          x: 565, y: 101, text: "Связывает несколько эпизодов",
          anchor: "start", className: "muted"
        },
        {
          x: 565, y: 272, text: "PLAN · ПЛАН",
          anchor: "start", className: "component-title plan-title"
        },
        {
          x: 565, y: 294, text: "Переводит намерение в исполнимые шаги",
          anchor: "start", className: "muted"
        }
      ],
      entries: [
        {
          x1: 44, y1: 114, x2: 410, y2: 158, r: 7,
          kindX: 58, kindY: 131, textX: 58, textY: 150,
          kind: "ПОЛДЕНЬ · НАБЛЮДЕНИЕ",
          text: "Изабелла спрашивает о джазе"
        },
        {
          x1: 44, y1: 164, x2: 410, y2: 208, r: 7,
          kindX: 58, kindY: 181, textX: 58, textY: 200,
          kind: "ПОЗЖЕ · НАБЛЮДЕНИЕ",
          text: "Начинается сильный дождь"
        },
        {
          x1: 44, y1: 214, x2: 410, y2: 258, r: 7,
          kindX: 58, kindY: 231, textX: 58, textY: 250,
          kind: "ВЕЧЕРОМ · ПЛАН",
          text: "Пойти на праздник Изабеллы"
        },
        {
          x1: 44, y1: 264, x2: 410, y2: 308, r: 7,
          kindX: 58, kindY: 281, textX: 58, textY: 300,
          kind: "РЕФЛЕКСИЯ",
          text: "Мне нравятся долгие беседы о музыке"
        }
      ],
      chips: [
        {
          x1: 44, y1: 324, x2: 145, y2: 352, r: 7,
          x: 94, y: 343, text: "СВЕЖЕСТЬ"
        },
        {
          x1: 154, y1: 324, x2: 264, y2: 352, r: 7,
          x: 209, y: 343, text: "ВАЖНОСТЬ"
        },
        {
          x1: 273, y1: 324, x2: 410, y2: 352, r: 7,
          x: 341, y: 343, text: "РЕЛЕВАНТНОСТЬ"
        }
      ],
      reflection: [
        {
          x: 565, y: 128, text: "«Мне нравятся долгие беседы",
          anchor: "start", className: "quote"
        },
        {
          x: 565, y: 151, text: "о музыке»",
          anchor: "start", className: "quote"
        },
        {
          x: 565, y: 174, text: "Новый вывод становится обычной записью памяти",
          anchor: "start", className: "muted"
        }
      ],
      planBoxes: [
        {
          x1: 565, y1: 309, x2: 665, y2: 343, r: 7,
          x: 615, y: 331, text: "ДЕНЬ"
        },
        {
          x1: 687, y1: 309, x2: 787, y2: 343, r: 7,
          x: 737, y: 331, text: "ЧАСЫ"
        },
        {
          x1: 809, y1: 309, x2: 910, y2: 343, r: 7,
          x: 859, y: 331, text: "ДЕЙСТВИЯ"
        }
      ],
      planLinks: [
        {
          points: [[665, 326], [687, 326]],
          head: [[687, 326], [678, 321], [678, 331]]
        },
        {
          points: [[787, 326], [809, 326]],
          head: [[809, 326], [800, 321], [800, 331]]
        }
      ],
      revision: {
        x1: 565, y1: 353, x2: 910, y2: 378, r: 7,
        x: 737, y: 370,
        text: "Дождь → меняется только затронутый отрезок"
      },
      arrows: [
        {
          points: [[430, 105], [545, 105]],
          head: [[545, 105], [534, 99], [534, 111]],
          labelX: 487, labelY: 90, label: "полезные эпизоды",
          anchor: "middle"
        },
        {
          points: [[545, 165], [495, 205], [430, 205]],
          head: [[430, 205], [441, 199], [441, 211]],
          labelX: 530, labelY: 202, label: "выводы → в память",
          anchor: "end"
        },
        {
          points: [[735, 190], [735, 245]],
          head: [[735, 245], [729, 234], [741, 234]],
          labelX: 750, labelY: 222, label: "намерение",
          anchor: "start"
        },
        {
          points: [[430, 292], [545, 292]],
          head: [[545, 292], [534, 286], [534, 298]],
          labelX: 487, labelY: 277, label: "текущий контекст",
          anchor: "middle"
        },
        {
          points: [[545, 365], [485, 412], [330, 412], [330, 370]],
          head: [[330, 370], [324, 381], [336, 381]],
          labelX: 472, labelY: 429,
          label: "планы и действия тоже записываются",
          anchor: "middle"
        }
      ],
      fallback: {
        x: 36, y: 85,
        lines: [
          "Схема должна была показать цикл из трёх компонентов:",
          "память хранит наблюдения, рефлексия возвращает выводы в память,",
          "а план раскладывает день на часы и действия."
        ],
        lineY: [85, 116, 147]
      }
    }];

    const D = DATA[DATA.length - DATA.length];
    const origin = Object.freeze({
      x: D.map.originX,
      y: D.map.originY
    });
    const scale = Object.freeze({
      x: D.map.scaleX,
      y: D.map.scaleY
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const root = document.getElementById("drawing");
    const namespace = "http://www.w3.org/2000/svg";

    function make(tag, attributes, textValue) {
      const node = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        node.setAttribute(name, value);
      });
      if (textValue !== undefined) node.textContent = textValue;
      return node;
    }

    function addRect(item, className) {
      root.appendChild(make("rect", {
        x: sx(item.x1),
        y: sy(item.y1),
        width: sx(item.x2) - sx(item.x1),
        height: sy(item.y2) - sy(item.y1),
        rx: sx(item.r) - sx(0),
        class: className
      }));
    }

    function addText(item) {
      root.appendChild(make("text", {
        x: sx(item.x),
        y: sy(item.y),
        "text-anchor": item.anchor || "start",
        class: item.className || "entry-text"
      }, item.text));
    }

    function addLine(points, head) {
      root.appendChild(make("polyline", {
        points: points.map(point =>
          `${sx(point[D.map.originX])},${sy(point[D.map.scaleY])}`
        ).join(" "),
        class: "arrow-line"
      }));
      root.appendChild(make("polygon", {
        points: head.map(point =>
          `${sx(point[D.map.originX])},${sy(point[D.map.scaleY])}`
        ).join(" "),
        class: "arrow-head"
      }));
    }

    try {
      D.panels.forEach(panel => addRect(panel, panel.className));
      D.labels.forEach(addText);

      D.entries.forEach(entry => {
        addRect(entry, "entry");
        addText({
          x: entry.kindX,
          y: entry.kindY,
          text: entry.kind,
          anchor: "start",
          className: "entry-kind"
        });
        addText({
          x: entry.textX,
          y: entry.textY,
          text: entry.text,
          anchor: "start",
          className: "entry-text"
        });
      });

      D.chips.forEach(chip => {
        addRect(chip, "chip-memory");
        addText({
          x: chip.x,
          y: chip.y,
          text: chip.text,
          anchor: "middle",
          className: "chip-text"
        });
      });

      D.reflection.forEach(addText);

      D.planBoxes.forEach(box => {
        addRect(box, "hierarchy");
        addText({
          x: box.x,
          y: box.y,
          text: box.text,
          anchor: "middle",
          className: "plan-step"
        });
      });

      D.planLinks.forEach(link => addLine(link.points, link.head));

      addRect(D.revision, "revision");
      addText({
        x: D.revision.x,
        y: D.revision.y,
        text: D.revision.text,
        anchor: "middle",
        className: "entry-text"
      });

      D.arrows.forEach(arrow => {
        addLine(arrow.points, arrow.head);
        addText({
          x: arrow.labelX,
          y: arrow.labelY,
          text: arrow.label,
          anchor: arrow.anchor,
          className: "arrow-label"
        });
      });
    } catch (error) {
      root.replaceChildren();
      D.fallback.lines.forEach((line, index) => {
        root.appendChild(make("text", {
          x: sx(D.fallback.x),
          y: sy(D.fallback.lineY[index]),
          "text-anchor": "start",
          class: "fallback"
        }, line));
      });
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
