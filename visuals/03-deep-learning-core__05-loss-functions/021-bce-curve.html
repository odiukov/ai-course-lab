<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Штраф BCE у неверной границы</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #58657a;
    --axis: #34425a;
    --guide: #d7deea;
    --danger-zone: #fff0f0;
    --curve: #d74242;
    --good: #16865a;
    --middle: #b66a08;
    --critical: #d74242;
    --halo: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #17202d;
      --ink: #edf2fa;
      --muted: #aeb9ca;
      --axis: #c5cfdd;
      --guide: #364359;
      --danger-zone: #321f27;
      --curve: #ff7474;
      --good: #55d69c;
      --middle: #ffc16b;
      --critical: #ff7474;
      --halo: #17202d;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    background: var(--panel);
  }

  h1 {
    color: var(--ink);
    font-size: 21px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--panel);
  }

  .danger-zone {
    fill: var(--danger-zone);
  }

  .guide {
    fill: none;
    stroke: var(--guide);
    stroke-width: 1.3;
  }

  .axis {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .axis-head {
    fill: var(--axis);
  }

  .curve {
    fill: none;
    stroke: var(--curve);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .curve-head {
    fill: var(--curve);
  }

  .connector {
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
  }

  .connector.good {
    stroke: var(--good);
  }

  .connector.middle {
    stroke: var(--middle);
  }

  .connector.critical {
    stroke: var(--critical);
  }

  .point {
    stroke: var(--halo);
    stroke-width: 2.5;
  }

  .point.good {
    fill: var(--good);
  }

  .point.middle {
    fill: var(--middle);
  }

  .point.critical {
    fill: var(--critical);
  }

  text {
    font-family: inherit;
    fill: var(--ink);
  }

  .axis-label {
    font-size: 16px;
    font-weight: bold;
  }

  .tick-label {
    fill: var(--muted);
    font-size: 14px;
  }

  .callout {
    font-size: 15px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--halo);
    stroke-width: 5;
    stroke-linejoin: round;
  }

  .callout.good {
    fill: var(--good);
  }

  .callout.middle {
    fill: var(--middle);
  }

  .callout.critical {
    fill: var(--critical);
  }

  .infinity-label {
    fill: var(--critical);
    font-size: 16px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--halo);
    stroke-width: 5;
    stroke-linejoin: round;
  }

  .summary {
    fill: var(--muted);
    font-size: 15px;
  }

  #fallback {
    color: var(--critical);
    font-size: 16px;
  }
</style>
</head>
<body>
<figure>
  <h1 id="chart-title">Штраф BCE стремится к бесконечности у неверной границы</h1>
  <svg
    id="chart"
    viewBox="0 0 920 410"
    width="920"
    height="410"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="chart-title chart-desc">
    <desc id="chart-desc">
      График функции минус логарифм вероятности для истинной метки один.
      При приближении вероятности к нулю штраф неограниченно растёт.
    </desc>
  </svg>
  <p id="fallback" hidden>
    Схема должна была показать график −log(p): при p = 0,99 loss = 0,01;
    при p = 0,5 loss = 0,693; при p = 0,01 loss = 4,6; при p → 0 штраф
    стремится к бесконечности.
  </p>
  <noscript>
    Схема: для y = 1 функция BCE равна −log(p) и стремится к бесконечности,
    когда p приближается к неверной границе 0.
  </noscript>
</figure>

<script>
const scheme = Object.freeze({
  canvas: Object.freeze({ width: 920, height: 410 }),
  bounds: Object.freeze({
    zero: 0,
    one: 1,
    xEnd: 1.08,
    yEnd: 7.25,
    dangerEnd: 0.085,
    dangerTop: 7.15
  }),
  curve: Object.freeze({
    pMin: 0.001,
    pMax: 1,
    samples: 180,
    first: 0,
    step: 1
  }),
  points: Object.freeze([
    Object.freeze({
      p: 0.99,
      loss: 0.01,
      lines: Object.freeze(["p = 0,99", "loss = 0,01"]),
      tone: "good",
      anchor: Object.freeze({ x: 0.92, y: 1.18, dx: -8, dy: -4 }),
      elbow: Object.freeze({ x: 0.94, y: 0.72 }),
      align: "end"
    }),
    Object.freeze({
      p: 0.5,
      loss: 0.693,
      lines: Object.freeze(["p = 0,5", "loss = 0,693"]),
      tone: "middle",
      anchor: Object.freeze({ x: 0.5, y: 1.72, dx: 0, dy: -4 }),
      elbow: Object.freeze({ x: 0.5, y: 1.22 }),
      align: "middle"
    }),
    Object.freeze({
      p: 0.01,
      loss: 4.6,
      lines: Object.freeze(["p = 0,01", "loss = 4,6"]),
      tone: "critical",
      anchor: Object.freeze({ x: 0.12, y: 5.05, dx: 8, dy: -4 }),
      elbow: Object.freeze({ x: 0.075, y: 4.82 }),
      align: "start"
    })
  ]),
  ticks: Object.freeze([
    Object.freeze({ x: 0, label: "0", align: "middle" }),
    Object.freeze({ x: 0.5, label: "0,5", align: "middle" }),
    Object.freeze({ x: 1, label: "1", align: "middle" })
  ]),
  labels: Object.freeze({
    yAxis: Object.freeze({ x: 0.025, y: 7.18, dx: 8, dy: 0 }),
    xAxis: Object.freeze({ x: 1.075, y: -0.52, dx: 0, dy: 0 }),
    infinity: Object.freeze({ x: 0.055, y: 6.45, dx: 8, dy: 0 }),
    summary: Object.freeze({ x: 0.5, y: -0.98, dx: 0, dy: 0 })
  }),
  geometry: Object.freeze({
    tickDepth: -0.12,
    pointRadius: 0.105,
    xHeadBase: 1.052,
    xHeadUpper: 0.13,
    yHeadBase: 7.02,
    yHeadSide: 0.013,
    curveTip: Object.freeze({ x: 0.001, y: 6.9 }),
    curveBaseUpper: Object.freeze({ x: 0.012, y: 6.42 }),
    curveBaseLower: Object.freeze({ x: 0.025, y: 6.62 })
  }),
  spacing: Object.freeze({
    tickText: 21,
    calloutLine: 20
  })
});

const origin = Object.freeze({ x: 112, y: 345 });
const scale = Object.freeze({ x: 700, y: 45 });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

try {
  const svg = document.getElementById("chart");
  const ns = "http://www.w3.org/2000/svg";
  const b = scheme.bounds;
  const g = scheme.geometry;
  const zero = b.zero;

  const node = (name, attrs, content) => {
    const element = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => {
      element.setAttribute(key, String(value));
    });
    if (content !== undefined) element.textContent = content;
    return element;
  };

  const add = element => {
    svg.appendChild(element);
    return element;
  };

  const line = (x1, y1, x2, y2, className) => node("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  });

  const polygon = (points, className) => node("polygon", {
    points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: className
  });

  const label = (x, y, text, className, align, dx, dy) => node("text", {
    x: sx(x) + dx,
    y: sy(y) + dy,
    class: className,
    "text-anchor": align,
    "dominant-baseline": "middle"
  }, text);

  const danger = node("rect", {
    x: sx(zero),
    y: sy(b.dangerTop),
    width: sx(b.dangerEnd) - sx(zero),
    height: sy(zero) - sy(b.dangerTop),
    class: "danger-zone"
  });
  add(danger);

  scheme.points.forEach(point => {
    add(line(zero, point.loss, point.p, point.loss, "guide"));
    add(line(point.p, zero, point.p, point.loss, "guide"));
  });

  add(line(zero, zero, b.xEnd, zero, "axis"));
  add(line(zero, zero, zero, b.yEnd, "axis"));

  add(polygon([
    { x: b.xEnd, y: zero },
    { x: g.xHeadBase, y: g.xHeadUpper },
    { x: g.xHeadBase, y: -g.xHeadUpper }
  ], "axis-head"));

  add(polygon([
    { x: zero, y: b.yEnd },
    { x: -g.yHeadSide, y: g.yHeadBase },
    { x: g.yHeadSide, y: g.yHeadBase }
  ], "axis-head"));

  scheme.ticks.forEach(tick => {
    add(line(tick.x, zero, tick.x, g.tickDepth, "axis"));
    add(label(
      tick.x,
      zero,
      tick.label,
      "tick-label",
      tick.align,
      zero,
      scheme.spacing.tickText
    ));
  });

  const c = scheme.curve;
  const commands = [];
  for (let index = c.first; index <= c.samples; index += c.step) {
    const progress = index / c.samples;
    const p = c.pMin * Math.pow(c.pMax / c.pMin, progress);
    const loss = -Math.log(p);
    commands.push(`${index === c.first ? "M" : "L"} ${sx(p)} ${sy(loss)}`);
  }

  add(node("path", {
    d: commands.join(" "),
    class: "curve"
  }));

  add(polygon([
    g.curveTip,
    g.curveBaseUpper,
    g.curveBaseLower
  ], "curve-head"));

  scheme.points.forEach(point => {
    add(line(
      point.p,
      point.loss,
      point.elbow.x,
      point.elbow.y,
      `connector ${point.tone}`
    ));
    add(line(
      point.elbow.x,
      point.elbow.y,
      point.anchor.x,
      point.anchor.y,
      `connector ${point.tone}`
    ));

    const radius = Math.abs(sy(g.pointRadius) - sy(zero));
    add(node("circle", {
      cx: sx(point.p),
      cy: sy(point.loss),
      r: radius,
      class: `point ${point.tone}`
    }));

    const text = node("text", {
      x: sx(point.anchor.x) + point.anchor.dx,
      y: sy(point.anchor.y) + point.anchor.dy,
      class: `callout ${point.tone}`,
      "text-anchor": point.align
    });

    point.lines.forEach((content, lineIndex) => {
      text.appendChild(node("tspan", {
        x: sx(point.anchor.x) + point.anchor.dx,
        y: sy(point.anchor.y) +
          point.anchor.dy +
          lineIndex * scheme.spacing.calloutLine
      }, content));
    });
    add(text);
  });

  add(label(
    scheme.labels.yAxis.x,
    scheme.labels.yAxis.y,
    "BCE = −log(p), если y = 1",
    "axis-label",
    "start",
    scheme.labels.yAxis.dx,
    scheme.labels.yAxis.dy
  ));

  add(label(
    scheme.labels.xAxis.x,
    scheme.labels.xAxis.y,
    "p — вероятность истинной метки",
    "axis-label",
    "end",
    scheme.labels.xAxis.dx,
    scheme.labels.xAxis.dy
  ));

  add(label(
    scheme.labels.infinity.x,
    scheme.labels.infinity.y,
    "p → 0: loss → ∞",
    "infinity-label",
    "start",
    scheme.labels.infinity.dx,
    scheme.labels.infinity.dy
  ));

  add(label(
    scheme.labels.summary.x,
    scheme.labels.summary.y,
    "Чем увереннее неверный прогноз, тем выше штраф",
    "summary",
    "middle",
    scheme.labels.summary.dx,
    scheme.labels.summary.dy
  ));
} catch (error) {
  const svg = document.getElementById("chart");
  const fallback = document.getElementById("fallback");
  svg.replaceChildren();
  fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
