<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Квадрат превращает большую ошибку в главный штраф</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f1f4fa;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667189;
      --axis: #37435c;
      --guide: #cbd3e2;
      --curve: #6857dc;
      --small: #12806a;
      --medium: #c36e00;
      --large: #d63f46;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      margin: auto;
      padding: 16px;
    }

    .diagram {
      width: 100%;
      max-width: 960px;
      margin: auto;
      overflow: hidden;
      background: var(--panel);
      border: 2px solid var(--guide);
    }

    h1 {
      margin: auto;
      padding: 16px 18px 8px;
      color: var(--ink);
      font-size: 23px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      overflow: visible;
      background: var(--panel);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tick {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .curve {
      fill: none;
      stroke: var(--curve);
      stroke-width: 4.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      stroke: var(--panel);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }

    .point-small {
      fill: var(--small);
    }

    .point-medium {
      fill: var(--medium);
    }

    .point-large {
      fill: var(--large);
    }

    .label,
    .axis-label,
    .tick-label,
    .curve-label {
      paint-order: stroke fill;
      stroke: var(--panel);
      stroke-width: 8px;
      stroke-linejoin: round;
    }

    .label {
      font-size: 16px;
      font-weight: bold;
    }

    .label-small {
      fill: var(--small);
    }

    .label-medium {
      fill: var(--medium);
    }

    .label-large {
      fill: var(--large);
    }

    .axis-label {
      fill: var(--axis);
      font-size: 16px;
      font-weight: bold;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 15px;
    }

    .curve-label {
      fill: var(--curve);
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      margin: auto;
      padding: 24px;
      color: var(--ink);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1320;
        --panel: #151d2d;
        --ink: #eef3ff;
        --muted: #aab5cc;
        --axis: #d4ddf0;
        --guide: #3b4862;
        --curve: #ab9cff;
        --small: #58cfb3;
        --medium: #ffb64b;
        --large: #ff7a80;
      }
    }
  </style>
</head>
<body>
  <main class="diagram">
    <h1>Квадрат превращает большую ошибку в главный штраф</h1>

    <svg
      id="chart"
      viewBox="0 0 960 430"
      width="960"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Парабола квадратного штрафа MSE</title>
      <desc id="svg-description">
        На параболе отмечено, что ошибка 1 получает штраф 1,
        ошибка 2 получает штраф 4, а ошибка 10 получает штраф 100.
      </desc>
      <g id="plot"></g>
    </svg>

    <p id="fallback" class="fallback">
      Парабола MSE: ошибка 1 даёт штраф 1, ошибка 2 — штраф 4,
      а ошибка 10 — штраф 100.
    </p>
  </main>

  <script>
    const data = Object.freeze([
      Object.freeze({
        error: 1,
        penalty: 1,
        dx: -14,
        dy: -30,
        anchor: "end",
        pointClass: "point-small",
        labelClass: "label-small"
      }),
      Object.freeze({
        error: 2,
        penalty: 4,
        dx: 14,
        dy: 32,
        anchor: "start",
        pointClass: "point-medium",
        labelClass: "label-medium"
      }),
      Object.freeze({
        error: 10,
        penalty: 100,
        dx: -14,
        dy: 30,
        anchor: "end",
        pointClass: "point-large",
        labelClass: "label-large"
      })
    ]);

    const canvas = Object.freeze({ width: 960, height: 430 });
    const [smallError, mediumError, largeError] = data;
    const zero = smallError.error - smallError.penalty;
    const plotTop = canvas.height /
      (largeError.error * mediumError.error);

    const origin = Object.freeze({
      x: canvas.width / mediumError.error,
      y: canvas.height - canvas.height / largeError.error
    });

    const scale = Object.freeze({
      x:
        (
          canvas.width -
          (canvas.width / largeError.error) * mediumError.error
        ) /
        (largeError.error * mediumError.error),
      y:
        -(origin.y - plotTop) / largeError.penalty
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelPadding = Object.freeze({
      tick: 24,
      axisSide: 14,
      axisDown: 28,
      curveSide: -14,
      curveUp: -18
    });

    try {
      const svgNamespace = "http://www.w3.org/2000/svg";
      const plot = document.getElementById("plot");
      const chart = document.getElementById("chart");
      const fallback = document.getElementById("fallback");

      const createSvg = (name, attributes, className, content) => {
        const element = document.createElementNS(svgNamespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });

        if (className) {
          element.setAttribute("class", className);
        }

        if (content) {
          element.textContent = content;
        }

        return element;
      };

      const appendPath = (pathData, className) => {
        plot.append(
          createSvg("path", { d: pathData }, className)
        );
      };

      const appendText = ({
        x,
        y,
        dx,
        dy,
        anchor,
        className,
        content
      }) => {
        plot.append(
          createSvg(
            "text",
            {
              x: sx(x) + dx,
              y: sy(y) + dy,
              "text-anchor": anchor
            },
            className,
            content
          )
        );
      };

      const halfSpan =
        largeError.error / mediumError.error;

      const pointWidth =
        smallError.error / largeError.error;

      const pointHeight =
        smallError.penalty;

      const xArrowBack =
        smallError.error / mediumError.error;

      const xArrowWing =
        mediumError.error;

      const yArrowWing =
        smallError.error / mediumError.penalty;

      const yArrowBack =
        mediumError.error;

      const curveNoteX =
        -largeError.error + mediumError.penalty;

      const curveNoteY =
        curveNoteX * curveNoteX;

      appendPath(
        [
          "M", sx(-largeError.error), sy(zero),
          "L", sx(largeError.error), sy(zero)
        ].join(" "),
        "axis"
      );

      appendPath(
        [
          "M", sx(largeError.error), sy(zero),
          "L",
          sx(largeError.error - xArrowBack),
          sy(zero + xArrowWing),
          "M", sx(largeError.error), sy(zero),
          "L",
          sx(largeError.error - xArrowBack),
          sy(zero - xArrowWing)
        ].join(" "),
        "axis"
      );

      appendPath(
        [
          "M", sx(zero), sy(zero),
          "L", sx(zero), sy(largeError.penalty)
        ].join(" "),
        "axis"
      );

      appendPath(
        [
          "M", sx(zero), sy(largeError.penalty),
          "L",
          sx(zero - yArrowWing),
          sy(largeError.penalty - yArrowBack),
          "M", sx(zero), sy(largeError.penalty),
          "L",
          sx(zero + yArrowWing),
          sy(largeError.penalty - yArrowBack)
        ].join(" "),
        "axis"
      );

      appendPath(
        [
          "M",
          sx(-largeError.error),
          sy(largeError.penalty),
          "Q",
          sx(-halfSpan),
          sy(zero),
          sx(zero),
          sy(zero),
          "Q",
          sx(halfSpan),
          sy(zero),
          sx(largeError.error),
          sy(largeError.penalty)
        ].join(" "),
        "curve"
      );

      data.forEach(point => {
        appendPath(
          [
            "M", sx(point.error), sy(zero),
            "L", sx(point.error), sy(point.penalty)
          ].join(" "),
          "guide"
        );

        appendPath(
          [
            "M", sx(point.error), sy(zero),
            "L",
            sx(point.error),
            sy(zero - smallError.penalty)
          ].join(" "),
          "tick"
        );

        appendPath(
          [
            "M",
            sx(point.error),
            sy(point.penalty + pointHeight),
            "L",
            sx(point.error + pointWidth),
            sy(point.penalty),
            "L",
            sx(point.error),
            sy(point.penalty - pointHeight),
            "L",
            sx(point.error - pointWidth),
            sy(point.penalty),
            "Z"
          ].join(" "),
          `point ${point.pointClass}`
        );

        appendText({
          x: point.error,
          y: zero,
          dx: zero,
          dy: labelPadding.tick,
          anchor: "middle",
          className: "tick-label",
          content: String(point.error)
        });

        appendText({
          x: point.error,
          y: point.penalty,
          dx: point.dx,
          dy: point.dy,
          anchor: point.anchor,
          className: `label ${point.labelClass}`,
          content:
            `ошибка ${point.error} → штраф ${point.penalty}`
        });
      });

      appendText({
        x: -largeError.error,
        y: zero,
        dx: labelPadding.axisSide,
        dy: labelPadding.axisDown,
        anchor: "start",
        className: "axis-label",
        content: "Ошибка"
      });

      appendText({
        x: zero,
        y:
          largeError.penalty -
          largeError.error * mediumError.error,
        dx: labelPadding.axisSide,
        dy: zero,
        anchor: "start",
        className: "axis-label",
        content: "Квадратный штраф"
      });

      appendText({
        x: curveNoteX,
        y: curveNoteY,
        dx: labelPadding.curveSide,
        dy: labelPadding.curveUp,
        anchor: "end",
        className: "curve-label",
        content: "MSE: штраф = ошибка²"
      });

      fallback.hidden = true;
      chart.hidden = false;
    } catch (error) {
      document.getElementById("chart").hidden = true;
      document.getElementById("fallback").hidden = false;
      document.getElementById("fallback").textContent =
        "Парабола MSE: ошибка 1 даёт штраф 1, ошибка 2 — штраф 4, а ошибка 10 — штраф 100.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
