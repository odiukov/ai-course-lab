<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Передача артефакта между четырьмя ролями</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #eef2f8;
      --ink: #182033;
      --muted: #58647a;
      --border: #aab4c7;
      --planner: #335fb6;
      --planner-fill: #e9f0ff;
      --executor: #9a5b08;
      --executor-fill: #fff1d8;
      --critic: #7a3ea0;
      --critic-fill: #f4eaff;
      --verifier: #087f69;
      --verifier-fill: #e2f7f1;
      --artifact: #087f69;
      --specification: #335fb6;
      --result: #7a3ea0;
      --evidence: #087f69;
      --shadow: #dbe1ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101522;
        --surface: #171e2e;
        --surface-soft: #20293b;
        --ink: #edf2ff;
        --muted: #b6c0d4;
        --border: #56627a;
        --planner: #8fb1ff;
        --planner-fill: #1d3157;
        --executor: #ffc46e;
        --executor-fill: #4b3317;
        --critic: #d5a4f2;
        --critic-fill: #3c2850;
        --verifier: #72dfc3;
        --verifier-fill: #163f38;
        --artifact: #72dfc3;
        --specification: #8fb1ff;
        --result: #d5a4f2;
        --evidence: #72dfc3;
        --shadow: #0b0f18;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .diagram-title {
      margin: 0;
      color: var(--ink);
      background: var(--surface);
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--surface);
    }

    .node,
    .output-card {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .node-shadow {
      fill: var(--shadow);
    }

    .planner-node {
      fill: var(--planner-fill);
      stroke: var(--planner);
    }

    .executor-node {
      fill: var(--executor-fill);
      stroke: var(--executor);
    }

    .critic-node,
    .critic-output {
      fill: var(--critic-fill);
      stroke: var(--critic);
    }

    .verifier-node,
    .verifier-output {
      fill: var(--verifier-fill);
      stroke: var(--verifier);
    }

    .wire {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .spec-wire {
      stroke: var(--specification);
    }

    .artifact-wire {
      stroke: var(--artifact);
    }

    .critic-wire {
      stroke: var(--result);
    }

    .verifier-wire {
      stroke: var(--evidence);
    }

    .arrow-spec {
      fill: var(--specification);
    }

    .arrow-artifact {
      fill: var(--artifact);
    }

    .arrow-critic {
      fill: var(--result);
    }

    .arrow-verifier {
      fill: var(--evidence);
    }

    .role-name {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
    }

    .node-copy {
      fill: var(--muted);
      font-size: 15px;
      text-anchor: middle;
    }

    .flow-label {
      font-size: 15px;
      font-weight: bold;
    }

    .spec-label {
      fill: var(--specification);
    }

    .artifact-label {
      fill: var(--artifact);
    }

    .output-main {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
    }

    .output-detail {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .junction {
      fill: var(--artifact);
      stroke: var(--surface);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .same-artifact-note {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    .same-artifact-detail {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h2 id="diagram-title" class="diagram-title">
      Передача артефакта между четырьмя ролями
    </h2>

    <svg
      id="diagram"
      viewBox="0 0 1200 410"
      width="1200"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Planner передаёт executor спецификацию. Executor создаёт
        зафиксированную версию артефакта. Один и тот же артефакт получают
        critic и verifier. Critic возвращает accept или reject с причиной,
        verifier — pass или fail с доказательством.
      </desc>
    </svg>
  </main>

  <script>
    const DATA = Object.freeze({
      canvas: Object.freeze({
        left: 0,
        top: 0,
        right: 1200,
        bottom: 410
      }),
      geometry: Object.freeze({
        corner: 13,
        shadowShift: 6,
        arrowLength: 12,
        arrowWing: 7,
        junctionRadius: 6
      }),
      nodes: Object.freeze([
        Object.freeze({
          id: "planner",
          className: "planner-node",
          x1: 35,
          y1: 120,
          x2: 225,
          y2: 220,
          cx: 130,
          titleY: 158,
          lines: Object.freeze([
            Object.freeze({ text: "цель → спецификация", x: 130, y: 191 })
          ]),
          title: "PLANNER"
        }),
        Object.freeze({
          id: "executor",
          className: "executor-node",
          x1: 315,
          y1: 120,
          x2: 505,
          y2: 220,
          cx: 410,
          titleY: 158,
          lines: Object.freeze([
            Object.freeze({ text: "создаёт артефакт", x: 410, y: 184 }),
            Object.freeze({ text: "фиксирует версию", x: 410, y: 204 })
          ]),
          title: "EXECUTOR"
        }),
        Object.freeze({
          id: "critic",
          className: "critic-node",
          x1: 640,
          y1: 120,
          x2: 870,
          y2: 220,
          cx: 755,
          titleY: 153,
          lines: Object.freeze([
            Object.freeze({
              text: "артефакт + спецификация",
              x: 755,
              y: 181
            }),
            Object.freeze({
              text: "сравнивает с замыслом",
              x: 755,
              y: 203
            })
          ]),
          title: "CRITIC"
        }),
        Object.freeze({
          id: "verifier",
          className: "verifier-node",
          x1: 945,
          y1: 120,
          x2: 1170,
          y2: 220,
          cx: 1058,
          titleY: 153,
          lines: Object.freeze([
            Object.freeze({
              text: "тот же артефакт",
              x: 1058,
              y: 181
            }),
            Object.freeze({
              text: "запускает проверку",
              x: 1058,
              y: 203
            })
          ]),
          title: "VERIFIER"
        })
      ]),
      outputs: Object.freeze([
        Object.freeze({
          className: "critic-output",
          x1: 640,
          y1: 25,
          x2: 870,
          y2: 85,
          main: Object.freeze({
            text: "accept / reject",
            x: 755,
            y: 51
          }),
          detail: Object.freeze({
            text: "с причиной",
            x: 755,
            y: 73
          })
        }),
        Object.freeze({
          className: "verifier-output",
          x1: 945,
          y1: 25,
          x2: 1170,
          y2: 85,
          main: Object.freeze({
            text: "pass / fail",
            x: 1058,
            y: 51
          }),
          detail: Object.freeze({
            text: "с доказательством",
            x: 1058,
            y: 73
          })
        })
      ]),
      wires: Object.freeze([
        Object.freeze({
          className: "spec-wire",
          arrowClass: "arrow-spec",
          arrow: true,
          points: Object.freeze([
            Object.freeze({ x: 225, y: 170 }),
            Object.freeze({ x: 315, y: 170 })
          ])
        }),
        Object.freeze({
          className: "artifact-wire",
          arrowClass: "arrow-artifact",
          arrow: false,
          points: Object.freeze([
            Object.freeze({ x: 410, y: 220 }),
            Object.freeze({ x: 410, y: 305 }),
            Object.freeze({ x: 1058, y: 305 })
          ])
        }),
        Object.freeze({
          className: "artifact-wire",
          arrowClass: "arrow-artifact",
          arrow: true,
          points: Object.freeze([
            Object.freeze({ x: 700, y: 305 }),
            Object.freeze({ x: 700, y: 220 })
          ])
        }),
        Object.freeze({
          className: "artifact-wire",
          arrowClass: "arrow-artifact",
          arrow: true,
          points: Object.freeze([
            Object.freeze({ x: 1005, y: 305 }),
            Object.freeze({ x: 1005, y: 220 })
          ])
        }),
        Object.freeze({
          className: "critic-wire",
          arrowClass: "arrow-critic",
          arrow: true,
          points: Object.freeze([
            Object.freeze({ x: 755, y: 120 }),
            Object.freeze({ x: 755, y: 85 })
          ])
        }),
        Object.freeze({
          className: "verifier-wire",
          arrowClass: "arrow-verifier",
          arrow: true,
          points: Object.freeze([
            Object.freeze({ x: 1058, y: 120 }),
            Object.freeze({ x: 1058, y: 85 })
          ])
        })
      ]),
      labels: Object.freeze([
        Object.freeze({
          text: "спецификация",
          className: "spec-label",
          anchor: Object.freeze({ x: 270, y: 170 }),
          side: "above",
          textAnchor: "middle"
        }),
        Object.freeze({
          text: "артефакт · зафиксированная версия",
          className: "artifact-label",
          anchor: Object.freeze({ x: 425, y: 305 }),
          side: "below",
          textAnchor: "start"
        })
      ]),
      junctions: Object.freeze([
        Object.freeze({ x: 410, y: 305 }),
        Object.freeze({ x: 700, y: 305 }),
        Object.freeze({ x: 1005, y: 305 })
      ]),
      note: Object.freeze({
        main: Object.freeze({
          text: "Один и тот же артефакт получают обе проверяющие роли",
          x: 600,
          y: 374
        }),
        detail: Object.freeze({
          text: "Мнение critic и доказательство verifier относятся к одной версии",
          x: 600,
          y: 397
        })
      }),
      fallback: Object.freeze([
        Object.freeze({
          text: "Planner → спецификация → executor → зафиксированный артефакт",
          x: 600,
          y: 190
        }),
        Object.freeze({
          text: "Тот же артефакт получает critic и verifier.",
          x: 600,
          y: 220
        }),
        Object.freeze({
          text: "Их выходы: accept/reject с причиной и pass/fail с доказательством.",
          x: 600,
          y: 250
        })
      ])
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    const LABEL_PAD = 13;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const description = document.getElementById("diagram-description");

      const make = (name, attributes, parent) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        parent.appendChild(element);
        return element;
      };

      const backgroundLayer = make("g", { "aria-hidden": "true" }, svg);
      const wireLayer = make("g", { "aria-hidden": "true" }, svg);
      const cardLayer = make("g", { "aria-hidden": "true" }, svg);
      const textLayer = make("g", { "aria-hidden": "true" }, svg);

      make(
        "rect",
        {
          x: sx(DATA.canvas.left),
          y: sy(DATA.canvas.top),
          width: sx(DATA.canvas.right) - sx(DATA.canvas.left),
          height: sy(DATA.canvas.bottom) - sy(DATA.canvas.top),
          fill: "var(--surface)"
        },
        backgroundLayer
      );

      const drawArrowHead = (wire) => {
        const head = wire.points[wire.points.length - DATA.geometry.junctionRadius / DATA.geometry.junctionRadius];
        const previous =
          wire.points[
            wire.points.length -
              DATA.geometry.shadowShift / DATA.geometry.arrowWing -
              DATA.geometry.junctionRadius / DATA.geometry.junctionRadius
          ];
        const deltaX = head.x - previous.x;
        const deltaY = head.y - previous.y;
        const length = Math.hypot(deltaX, deltaY);
        const unitX = deltaX / length;
        const unitY = deltaY / length;
        const baseX = head.x - unitX * DATA.geometry.arrowLength;
        const baseY = head.y - unitY * DATA.geometry.arrowLength;
        const left = {
          x: baseX - unitY * DATA.geometry.arrowWing,
          y: baseY + unitX * DATA.geometry.arrowWing
        };
        const right = {
          x: baseX + unitY * DATA.geometry.arrowWing,
          y: baseY - unitX * DATA.geometry.arrowWing
        };

        make(
          "polygon",
          {
            class: wire.arrowClass,
            points: [
              `${sx(head.x)},${sy(head.y)}`,
              `${sx(left.x)},${sy(left.y)}`,
              `${sx(right.x)},${sy(right.y)}`
            ].join(" ")
          },
          wireLayer
        );
      };

      DATA.wires.forEach((wire) => {
        make(
          "polyline",
          {
            class: `wire ${wire.className}`,
            points: wire.points
              .map((point) => `${sx(point.x)},${sy(point.y)}`)
              .join(" ")
          },
          wireLayer
        );

        if (wire.arrow) {
          drawArrowHead(wire);
        }
      });

      DATA.junctions.forEach((junction) => {
        make(
          "circle",
          {
            class: "junction",
            cx: sx(junction.x),
            cy: sy(junction.y),
            r:
              sx(DATA.geometry.junctionRadius) -
              sx(DATA.canvas.left)
          },
          wireLayer
        );
      });

      DATA.outputs.forEach((output) => {
        make(
          "rect",
          {
            class: `output-card ${output.className}`,
            x: sx(output.x1),
            y: sy(output.y1),
            width: sx(output.x2) - sx(output.x1),
            height: sy(output.y2) - sy(output.y1),
            rx: sx(DATA.geometry.corner) - sx(DATA.canvas.left),
            ry: sy(DATA.geometry.corner) - sy(DATA.canvas.top)
          },
          cardLayer
        );

        const main = make(
          "text",
          {
            class: "output-main",
            x: sx(output.main.x),
            y: sy(output.main.y)
          },
          textLayer
        );
        main.textContent = output.main.text;

        const detail = make(
          "text",
          {
            class: "output-detail",
            x: sx(output.detail.x),
            y: sy(output.detail.y)
          },
          textLayer
        );
        detail.textContent = output.detail.text;
      });

      DATA.nodes.forEach((node) => {
        make(
          "rect",
          {
            class: "node-shadow",
            x: sx(node.x1 + DATA.geometry.shadowShift),
            y: sy(node.y1 + DATA.geometry.shadowShift),
            width: sx(node.x2) - sx(node.x1),
            height: sy(node.y2) - sy(node.y1),
            rx: sx(DATA.geometry.corner) - sx(DATA.canvas.left),
            ry: sy(DATA.geometry.corner) - sy(DATA.canvas.top)
          },
          cardLayer
        );

        make(
          "rect",
          {
            class: `node ${node.className}`,
            x: sx(node.x1),
            y: sy(node.y1),
            width: sx(node.x2) - sx(node.x1),
            height: sy(node.y2) - sy(node.y1),
            rx: sx(DATA.geometry.corner) - sx(DATA.canvas.left),
            ry: sy(DATA.geometry.corner) - sy(DATA.canvas.top)
          },
          cardLayer
        );

        const title = make(
          "text",
          {
            class: "role-name",
            x: sx(node.cx),
            y: sy(node.titleY)
          },
          textLayer
        );
        title.textContent = node.title;

        node.lines.forEach((line) => {
          const copy = make(
            "text",
            {
              class: "node-copy",
              x: sx(line.x),
              y: sy(line.y)
            },
            textLayer
          );
          copy.textContent = line.text;
        });
      });

      DATA.labels.forEach((label) => {
        const labelX =
          label.side === "right"
            ? sx(label.anchor.x) + LABEL_PAD
            : label.side === "left"
              ? sx(label.anchor.x) - LABEL_PAD
              : sx(label.anchor.x);

        const labelY =
          label.side === "above"
            ? sy(label.anchor.y) - LABEL_PAD
            : label.side === "below"
              ? sy(label.anchor.y) + LABEL_PAD + LABEL_PAD
              : sy(label.anchor.y);

        const text = make(
          "text",
          {
            class: `flow-label ${label.className}`,
            x: labelX,
            y: labelY,
            "text-anchor": label.textAnchor
          },
          textLayer
        );
        text.textContent = label.text;
      });

      const noteMain = make(
        "text",
        {
          class: "same-artifact-note",
          x: sx(DATA.note.main.x),
          y: sy(DATA.note.main.y)
        },
        textLayer
      );
      noteMain.textContent = DATA.note.main.text;

      const noteDetail = make(
        "text",
        {
          class: "same-artifact-detail",
          x: sx(DATA.note.detail.x),
          y: sy(DATA.note.detail.y)
        },
        textLayer
      );
      noteDetail.textContent = DATA.note.detail.text;

      svg.appendChild(description);
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const preservedDescription =
        document.getElementById("diagram-description");
      svg.replaceChildren();

      const background = document.createElementNS(namespace, "rect");
      background.setAttribute("x", String(sx(DATA.canvas.left)));
      background.setAttribute("y", String(sy(DATA.canvas.top)));
      background.setAttribute(
        "width",
        String(sx(DATA.canvas.right) - sx(DATA.canvas.left))
      );
      background.setAttribute(
        "height",
        String(sy(DATA.canvas.bottom) - sy(DATA.canvas.top))
      );
      background.setAttribute("fill", "var(--surface)");
      svg.appendChild(background);

      DATA.fallback.forEach((line) => {
        const text = document.createElementNS(namespace, "text");
        text.setAttribute("class", "fallback");
        text.setAttribute("x", String(sx(line.x)));
        text.setAttribute("y", String(sy(line.y)));
        text.textContent = line.text;
        svg.appendChild(text);
      });

      if (preservedDescription) {
        svg.appendChild(preservedDescription);
      }
      console.error(error);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
