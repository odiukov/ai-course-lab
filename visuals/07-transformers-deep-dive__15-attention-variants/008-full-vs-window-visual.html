<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Полная маска против окна W=4</title>
<style>
  :root{ --bg:#fbfbfa; --fg:#1f2328; --muted:#6a737d; --grid:#d3d7dc;
         --full:#2f6f9f; --swa:#b4531f; --cut:#c0392b; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15181c; --fg:#e6e8ea; --muted:#9aa4ae; --grid:#3a4048;
           --full:#69aede; --swa:#e8944f; --cut:#e06c5a; }
  }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:8px 10px 12px; }
  h2{ font-size:15px; margin:0 0 6px; font-weight:600; }
  svg{ display:block; width:100%; height:auto; max-height:520px; }
  .fail{ color:var(--cut); font-size:13px; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Полная причинная маска против окна <code>W = 4</code>, N = 8</h2>
  <div id="host"><svg id="s" viewBox="0 0 720 400" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Две сетки 8 на 8: слева полный причинный треугольник (36 крестиков), справа скользящее окно W=4 (26 крестиков)"></svg></div>
  <div id="fail" class="fail"></div>
</div>
<script>
(function(){
  var N = 8, W = 4;
  var PANELS = [
    { col0:0, title:"Полная причинная маска", count:"крестиков: 36", cls:"full", win:false },
    { col0:11, title:"Окно W = 4", count:"крестиков: 26", cls:"swa", win:true }
  ];
  // одна пара функций перевода: origin + scale, дальше не меняются
  var origin = { x:70, y:64 }, scale = 30;
  function sx(x){ return origin.x + x*scale; }
  function sy(y){ return origin.y + y*scale; }

  var GAP = 4, LW = 1, LWB = 2, FS = 13, FSB = 14, PAD = 6;

  try{
    var svg = document.getElementById("s");
    var NS = "http://www.w3.org/2000/svg";
    function el(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }
    function line(x1,y1,x2,y2,stroke,w,dash){
      var l = el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:stroke,"stroke-width":w});
      if(dash) l.setAttribute("stroke-dasharray",dash);
      svg.appendChild(l);
    }
    function text(x,y,dx,dy,anchor,s,fill,size,weight){
      var t = el("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,fill:fill,
                         "font-size":(size||FS),"font-weight":(weight||"normal")});
      t.textContent = s; svg.appendChild(t);
    }
    function cross(cx,cy,stroke){
      var r = 0.28;
      line(cx-r,cy-r,cx+r,cy+r,stroke,LWB);
      line(cx-r,cy+r,cx+r,cy-r,stroke,LWB);
    }

    var C = { full:"var(--full)", swa:"var(--swa)", grid:"var(--grid)",
              fg:"var(--fg)", muted:"var(--muted)", cut:"var(--cut)" };

    svg.appendChild(el("rect",{x:0,y:0,width:720,height:400,fill:"var(--bg)"}));

    PANELS.forEach(function(p){
      var c0 = p.col0, col = C[p.cls];

      // заголовок панели — сверху, middle по центру сетки
      text(c0 + N/2, 0, 0, -34, "middle", p.title, C.fg, FSB, "600");

      // номера колонок сверху
      for(var j=0;j<N;j++) text(c0+j+0.5, 0, 0, -8, "middle", String(j), C.muted, FS);
      // номера строк слева
      for(var i=0;i<N;i++) text(c0, i+0.5, -PAD, 5, "end", String(i), C.muted, FS);

      // сетка
      for(var j2=0;j2<=N;j2++) line(c0+j2, 0, c0+j2, N, C.grid, LW);
      for(var i2=0;i2<=N;i2++) line(c0, i2, c0+N, i2, C.grid, LW);

      // крестики
      for(var i3=0;i3<N;i3++){
        var lo = p.win ? Math.max(0, i3-W+1) : 0;
        for(var j3=lo;j3<=i3;j3++) cross(c0+j3+0.5, i3+0.5, col);
      }

      // диагональ окна / гипотенуза
      line(c0, 0, c0+N, N, col, LWB);
      if(p.win){
        line(c0, W-1, c0+N-W+1, N, C.cut, LWB, "5 4");
        // отрезанный угол: строка 7, колонки 0-3
        svg.appendChild(el("rect",{x:sx(c0),y:sy(N-1),width:W*scale,height:scale,
          fill:"var(--cut)","fill-opacity":"0.14"}));
      }

      // подпись счётчика — снизу по центру
      text(c0 + N/2, N, 0, 22, "middle", p.count, col, FS, "600");
    });

    // подпись к отрезанному куску: слева от него, якорь end, ниже сетки не лезет
    var c1 = PANELS[1].col0;
    line(c1, N-0.5, c1-1.4, N+1.1, C.cut, LWB);
    text(c1-1.4, N+1.1, -PAD, 4, "end", "строка 7: колонки 0-3 отрезаны", C.cut, FS);

    // легенда снизу
    text(PANELS[0].col0, N, 0, 46, "start",
         "Σᵢ min(i+1, W): при N = 8192, W = 1024 — 7.9 млн против 33.6 млн, в 4.3 раза меньше",
         C.muted, FS);
  } catch(e){
    document.getElementById("host").innerHTML = "";
    document.getElementById("fail").textContent =
      "Схема не построилась. Она должна показывать две сетки 8×8 рядом: слева полная причинная маска — " +
      "строка i отмечена в колонках 0..i, всего 36 крестиков. Справа то же с окном W = 4 — строка i отмечена " +
      "в колонках max(0, i−3)..i, у строки 7 крестики только в колонках 4-7, колонки 0-3 отрезаны, всего 26 крестиков. " +
      "Экономия на восьми токенах — в полтора раза; при N = 8192 и W = 1024 — 7.9 млн против 33.6 млн, в 4.3 раза.";
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
