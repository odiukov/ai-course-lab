<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Два семейства: по одному токену против «проявить целиком»</title>
<style>
  :root{
    --bg:#faf9f6; --ink:#1b2130; --mut:#5b6478; --grid:#c8cedb;
    --tok:#b4541e; --dif:#17708c; --soft:#e6e2d8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171d; --ink:#e8ebf1; --mut:#99a2b4; --grid:#39414f;
      --tok:#e8894a; --dif:#54b6d2; --soft:#222836;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--ink);padding:10px 12px 12px;
    font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .ttl{font-size:15px;font-weight:600;margin:0 0 4px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .ax{stroke:var(--grid);stroke-width:1.4;fill:none}
  .live{stroke:var(--tok);stroke-width:3.4;fill:none}
  .div{stroke:var(--grid);stroke-width:1.2;stroke-dasharray:4 5;fill:none}
  .tk{stroke:var(--tok);stroke-width:1.4;fill:none}
  .tkf{fill:var(--tok);stroke:none}
  .lnk{stroke:var(--tok);stroke-width:1.1;fill:none;opacity:.7}
  .df{stroke:var(--dif);stroke-width:1.4;fill:none}
  .dff{fill:var(--dif);stroke:none;opacity:.14}
  .hatch{stroke:var(--dif);stroke-width:1.1;fill:none;opacity:.75}
  .noise{stroke:var(--dif);stroke-width:1.1;fill:none;opacity:.55}
  .hd{stroke:none}
  text{fill:var(--ink);font:12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .pt{font-size:15px;font-weight:600}
  .tick{font-size:11px;fill:var(--mut)}
  .mut{fill:var(--mut)}
  .ct{fill:var(--tok)} .cd{fill:var(--dif)}
  .fb{display:none;color:var(--ink);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <p class="ttl">Два порядка рождения звука: по одному токену против «проявить целиком»</p>
  <svg id="s" viewBox="0 0 904 272" role="img"
       aria-label="Слева token LM выдаёт 6000 токенов по одному с дрейфом к концу, справа диффузия проявляет 47 секунд разом из шума"></svg>
  <p class="fb" id="fb"></p>
</div>
<script>
(function(){
var NS="http://www.w3.org/2000/svg", svg=document.getElementById("s");
try{
  var D={
    tokens:6000, tokenCount:16,
    L:{x0:2, span:45, live:10, ticks:[0,10,40,45], labels:["0","10","40","45 с"]},
    R:{x0:58, span:47, ticks:[0,47], labels:["0","47 с"]},
    axisY:7, tickLen:0.8, tickLabelY:5, aboveAxisY:8.4,
    chainTop:21, sag:6, tok:1.3,
    orderY:23.6, orderLabelY:24.5,
    noise:{y0:24.4,y1:27}, noiseN:26, noiseLabelY:27.9,
    block:{y0:13,y1:20}, hatchN:4, blockLabelY:11.6,
    arrow:{from:24.1,to:20.4,n:8},
    head:1.1, headW:0.62,
    titleY:31, bottomY:1.3, divider:{x:52.5,y0:2,y1:29}
  };
  var origin={x:24,y:272}, scale=8;
  function sx(x){return origin.x+x*scale;}
  function sy(y){return origin.y-y*scale;}

  function add(tag,attrs,txt){
    var n=document.createElementNS(NS,tag);
    for(var k in attrs) n.setAttribute(k,attrs[k]);
    if(txt!=null) n.textContent=txt;
    svg.appendChild(n); return n;
  }
  function line(x1,y1,x2,y2,cls){
    add("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),"class":cls});
  }
  function label(x,y,txt,anchor,cls){
    add("text",{x:sx(x),y:sy(y),"text-anchor":anchor,"class":cls||""},txt);
  }
  function arrow(x1,y1,x2,y2,cls){
    var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L;
    var bx=x2-ux*D.head, by=y2-uy*D.head;
    var px=-uy*D.headW, py=ux*D.headW;
    line(x1,y1,bx,by,cls);
    add("polygon",{points:[[x2,y2],[bx+px,by+py],[bx-px,by-py]]
      .map(function(p){return sx(p[0])+","+sy(p[1]);}).join(" "),"class":cls+" hd"});
  }
  function axis(P){
    line(P.x0,D.axisY,P.x0+P.span,D.axisY,"ax");
    for(var i=0;i<P.ticks.length;i++){
      var x=P.x0+P.ticks[i];
      line(x,D.axisY,x,D.axisY-D.tickLen,"ax");
      label(x,D.tickLabelY,P.labels[i],"middle","tick");
    }
  }

  /* ---------- разделитель ---------- */
  line(D.divider.x,D.divider.y0,D.divider.x,D.divider.y1,"div");

  /* ---------- слева: token LM ---------- */
  var L=D.L, lc=L.x0+L.span/2;
  label(lc,D.titleY,"Token LM: по одному токену","middle","pt ct");

  arrow(L.x0,D.orderY,L.x0+L.span,D.orderY,"tk");
  label(L.x0,D.orderLabelY,"по одному: 6000 токенов подряд","start","mut");

  var n=D.tokenCount, pts=[];
  for(var j=0;j<n;j++){
    var t=j/(n-1);
    pts.push({x:L.x0+1+(L.span-2)*t, y:D.chainTop-D.sag*t*t});
  }
  for(var k=1;k<n;k++) line(pts[k-1].x,pts[k-1].y,pts[k].x,pts[k].y,"lnk");
  for(var m=0;m<n;m++){
    var p=pts[m], h=D.tok/2;
    add("rect",{x:sx(p.x-h),y:sy(p.y+h),
      width:sx(p.x+h)-sx(p.x-h),height:sy(p.y-h)-sy(p.y+h),
      "class":m<n/3?"tkf":"tk"});
  }
  label(L.x0+L.span,D.block.y0-D.tok,"дрейф: опора на свои же токены","end","mut");

  line(L.x0,D.axisY,L.x0+L.live,D.axisY,"live");
  label(L.x0,D.aboveAxisY,"первые 10 с — живые","start","");
  label(L.x0+L.span,D.aboveAxisY,"к 40-й — зацикливание","end","");
  axis(L);
  label(L.x0,D.bottomY,"Зацикливание к концу — порядок «по одному»","start","mut");

  /* ---------- справа: диффузия ---------- */
  var R=D.R, rc=R.x0+R.span/2;
  label(rc,D.titleY,"Диффузия: весь отрезок разом","middle","pt cd");

  for(var q=0;q<D.noiseN;q++){
    var xr=R.x0+R.span*(q+0.5)/D.noiseN;
    var a=Math.abs(Math.sin(q*2.3))*(D.noise.y1-D.noise.y0);
    line(xr,D.noise.y0,xr,D.noise.y0+a,"noise");
  }
  line(R.x0,D.noise.y0,R.x0+R.span,D.noise.y0,"df");
  label(R.x0,D.noiseLabelY,"шум сразу на всю длину — 47 с","start","mut");

  for(var i2=0;i2<D.arrow.n;i2++){
    var xa=R.x0+R.span*(i2+0.5)/D.arrow.n;
    arrow(xa,D.arrow.from,xa,D.arrow.to,"df");
  }

  add("rect",{x:sx(R.x0),y:sy(D.block.y1),
    width:sx(R.x0+R.span)-sx(R.x0),height:sy(D.block.y0)-sy(D.block.y1),"class":"dff"});
  add("rect",{x:sx(R.x0),y:sy(D.block.y1),
    width:sx(R.x0+R.span)-sx(R.x0),height:sy(D.block.y0)-sy(D.block.y1),"class":"df"});
  for(var h2=1;h2<=D.hatchN;h2++){
    var yh=D.block.y0+(D.block.y1-D.block.y0)*h2/(D.hatchN+1);
    line(R.x0,yh,R.x0+R.span,yh,"hatch");
  }
  label(R.x0,D.blockLabelY,"одна сплошная текстура, без формы","start","mut");

  label(R.x0,D.aboveAxisY,"40-я секунда — как первая","start","");
  axis(R);
  label(R.x0,D.bottomY,"Ровное полотно — порядок «всё разом»","start","mut");

}catch(e){
  svg.style.display="none";
  var fb=document.getElementById("fb");
  fb.style.display="block";
  fb.textContent="Схема не построилась. Она должна показывать: слева token LM выдаёт "
    +"6000 токенов по одному слева направо, цепочка проседает к концу — дрейф и "
    +"зацикливание к 40-й секунде при живых первых 10 с; справа диффузия из шума "
    +"на всю длину проявляет все 47 секунд разом, одинаковыми стрелками по всему "
    +"отрезку, и получается ровная текстура без формы.";
}
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
