<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Правило двух — три круга</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2129; --muted:#5b6572; --line:#d8d3c8;
    --c1:#c2410c; --c2:#1d4ed8; --c3:#047857; --bad:#dc2626; --ok:#15803d;
    --btn:#efece4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8eaee; --muted:#9aa4b2; --line:#333a44;
      --c1:#fb923c; --c2:#7aa2ff; --c3:#34d399; --bad:#f87171; --ok:#4ade80;
      --btn:#1e242c;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  figure{margin:0;padding:14px 16px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;max-width:760px}
  h2{margin:0 0 8px;font-size:16px;font-weight:650}
  svg{display:block;width:100%;height:auto;max-height:360px}
  .ctl{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 6px}
  .ctl button{font:13px/1.2 inherit;color:var(--fg);background:var(--btn);
    border:1px solid var(--line);border-radius:6px;padding:5px 9px;cursor:pointer}
  .ctl button[aria-pressed="true"]{opacity:.55;text-decoration:line-through}
  figcaption{color:var(--muted);font-size:13px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .lbl{font-size:15px;font-weight:600}
  .ex{font-size:12px}
  .zone{font-size:12px;font-weight:600}
  .verdict{font-size:16px;font-weight:700}
  .off{opacity:.28}
  .fail{color:var(--muted);font-size:13px;margin:6px 0 0}
</style>
</head>
<body>
<figure>
  <h2>Правило двух: красная зона одна — центральная</h2>
  <div id="stage"><svg id="svg" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Три пересекающихся круга: недоверенный ввод, чувствительные данные, необратимое действие; центр — 3 из 3, запрещено"></svg></div>
  <div class="ctl" id="ctl"></div>
  <figcaption>Попарные зоны разрешены. Выключи любой круг — центральная зона гаснет.</figcaption>
</figure>
<script>
(function(){
var stage=document.getElementById('stage');
try{
  var DATA={
    r:1.55,
    circles:[
      {cx:-1.0,cy:0.55,color:'var(--c1)',lbl:['недоверенный','ввод'],ex:'письмо от незнакомца',
       ax:-1.72,ay:0.95,btn:'недоверенный ввод'},
      {cx:1.0,cy:0.55,color:'var(--c2)',lbl:['чувствительные','данные'],ex:'архив переписки',
       ax:1.72,ay:0.95,btn:'чувствительные данные'},
      {cx:0.0,cy:-1.05,color:'var(--c3)',lbl:['необратимое','действие'],ex:'send_email',
       ax:0,ay:-1.95,btn:'необратимое действие'}
    ],
    zones:[{x:0,y:1.08,needs:[0,1]},{x:-0.95,y:-0.78,needs:[0,2]},{x:0.95,y:-0.78,needs:[1,2]}],
    badge:{x:0,y:0.35,r:0.26,slash:0.18},
    verdict:{x:0,y:-0.5}
  };
  var origin={x:300,y:200}, scale=80;
  function sx(v){return origin.x+v*scale;}
  function sy(v){return origin.y-v*scale;}
  function ln(v){return sx(v)-sx(0);}

  var NS='http://www.w3.org/2000/svg', svg=document.getElementById('svg');
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function txt(x,y,s,anchor,cls,dy,fill){
    var t=el('text',{x:sx(x),y:sy(y),'text-anchor':anchor,class:cls,fill:fill||'currentColor'});
    if(dy)t.setAttribute('dy',dy);
    t.textContent=s;svg.appendChild(t);return t;
  }

  var pad=14, C=DATA.circles, R=DATA.r;
  var xs=C.map(function(c){return c.cx;}), ys=C.map(function(c){return c.cy;});
  svg.setAttribute('viewBox',[
    sx(Math.min.apply(null,xs)-R)-pad,
    sy(Math.max.apply(null,ys)+R)-pad,
    ln(Math.max.apply(null,xs)-Math.min.apply(null,xs)+2*R)+2*pad,
    ln(Math.max.apply(null,ys)-Math.min.apply(null,ys)+2*R)+2*pad
  ].join(' '));

  var defs=el('defs',{});svg.appendChild(defs);
  C.forEach(function(c,i){
    var cp=el('clipPath',{id:'clip'+i});
    cp.appendChild(el('circle',{cx:sx(c.cx),cy:sy(c.cy),r:ln(R)}));
    defs.appendChild(cp);
  });

  var gDanger=el('g',{'clip-path':'url(#clip0)'});
  var inner=el('g',{'clip-path':'url(#clip1)'});
  inner.appendChild(el('circle',{cx:sx(C[2].cx),cy:sy(C[2].cy),r:ln(R),
    fill:'var(--bad)','fill-opacity':'0.5'}));
  gDanger.appendChild(inner);svg.appendChild(gDanger);

  var groups=C.map(function(c){
    var g=el('g',{});
    g.appendChild(el('circle',{cx:sx(c.cx),cy:sy(c.cy),r:ln(R),fill:c.color,
      'fill-opacity':'0.10',stroke:c.color,'stroke-width':2}));
    svg.appendChild(g);return g;
  });

  C.forEach(function(c,i){
    var side=c.ax<0?'middle':(c.ax>0?'middle':'middle');
    var t1=txt(c.ax,c.ay,c.lbl[0],side,'lbl',0,c.color);
    var t2=txt(c.ax,c.ay,c.lbl[1],side,'lbl',17,c.color);
    var t3=txt(c.ax,c.ay,c.ex,side,'ex',34,'var(--muted)');
    groups[i].__labels=[t1,t2,t3];
  });

  var zoneTexts=DATA.zones.map(function(z){
    return txt(z.x,z.y,'2 из 3',(z.x<0?'end':(z.x>0?'start':'middle')),'zone',0,'var(--ok)');
  });

  var b=DATA.badge, bg=el('g',{});svg.appendChild(bg);
  bg.appendChild(el('circle',{cx:sx(b.x),cy:sy(b.y),r:ln(b.r),fill:'none',
    stroke:'var(--bad)','stroke-width':3,id:'ring'}));
  var slash=el('line',{x1:sx(b.x-b.slash),y1:sy(b.y+b.slash),
    x2:sx(b.x+b.slash),y2:sy(b.y-b.slash),stroke:'var(--bad)','stroke-width':3});
  bg.appendChild(slash);
  var tick=el('polyline',{points:[
      sx(b.x-0.14)+','+sy(b.y+0.01),
      sx(b.x-0.03)+','+sy(b.y-0.10),
      sx(b.x+0.15)+','+sy(b.y+0.12)].join(' '),
    fill:'none',stroke:'var(--ok)','stroke-width':3,'stroke-linecap':'round'});
  bg.appendChild(tick);

  var verdict=txt(DATA.verdict.x,DATA.verdict.y,'3 из 3','middle','verdict',0,'var(--bad)');

  var off=[false,false,false];
  function render(){
    var live=off.filter(function(v){return !v;}).length;
    var all=live===3;
    groups.forEach(function(g,i){
      g.setAttribute('class',off[i]?'off':'');
      g.firstChild.setAttribute('stroke-dasharray',off[i]?'6 5':'none');
      g.firstChild.setAttribute('fill-opacity',off[i]?'0.02':'0.10');
      g.__labels.forEach(function(t){t.setAttribute('class',
        (t.getAttribute('class')||'').replace(' off','')+(off[i]?' off':''));});
    });
    gDanger.setAttribute('opacity',all?'1':'0');
    verdict.textContent=live+' из 3';
    verdict.setAttribute('fill',all?'var(--bad)':'var(--ok)');
    document.getElementById('ring').setAttribute('stroke',all?'var(--bad)':'var(--ok)');
    slash.setAttribute('opacity',all?'1':'0');
    tick.setAttribute('opacity',all?'0':'1');
    zoneTexts.forEach(function(t,i){
      var ok=DATA.zones[i].needs.every(function(k){return !off[k];});
      t.setAttribute('opacity',ok?'1':'0.2');
    });
  }

  var ctl=document.getElementById('ctl');
  C.forEach(function(c,i){
    var btn=document.createElement('button');
    btn.type='button';btn.textContent='убрать: '+c.btn;
    btn.setAttribute('aria-pressed','false');
    btn.onclick=function(){
      off[i]=!off[i];
      btn.setAttribute('aria-pressed',off[i]?'true':'false');
      render();
    };
    ctl.appendChild(btn);
  });
  render();
}catch(e){
  stage.innerHTML='';
  var p=document.createElement('p');p.className='fail';
  p.textContent='Схема не построилась. Она показывает три пересекающихся круга — '+
    'недоверенный ввод (письмо от незнакомца), чувствительные данные (архив переписки) '+
    'и необратимое действие (send_email). Три попарные зоны — по 2 из 3, они разрешены. '+
    'Центральная зона, где сходятся все три свойства, — 3 из 3, она запрещена. '+
    'Убери любой один круг, и центр гаснет.';
  stage.appendChild(p);
}
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
