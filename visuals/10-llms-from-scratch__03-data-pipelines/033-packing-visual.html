<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Padding и плотная упаковка</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --text: #172033;
    --muted: #586176;
    --line: #9ba5b8;
    --divider: #d8dde7;
    --pad: #d9dde5;
    --pad-line: #c0c6d1;
    --a: #4568dc;
    --b: #7557d8;
    --c: #168c8c;
    --d: #d46a35;
    --e: #b64872;
    --good: #087f5b;
    --bad: #b43b4b;
    --soft-good: #dff5ec;
    --soft-bad: #f9e5e8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141b;
      --panel: #181d27;
      --text: #f2f4f8;
      --muted: #b5bdcc;
      --line: #7c879a;
      --divider: #343c4b;
      --pad: #3b424f;
      --pad-line: #4c5565;
      --a: #7892ff;
      --b: #a285ff;
      --c: #45bdb7;
      --d: #ef9366;
      --e: #e47ba1;
      --good: #65d6ad;
      --bad: #ff8592;
      --soft-good: #183c34;
      --soft-bad: #41252b;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    width: 100%;
    margin: 0;
    background: var(--bg);
  }

  h1 {
    margin: 0;
    padding: 10px 18px 6px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 750;
    letter-spacing: -0.01em;
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 480px;
    background: var(--bg);
  }

  text {
    fill: var(--text);
    font-size: 15px;
    dominant-baseline: middle;
  }

  .section-title {
    font-size: 18px;
    font-weight: 750;
  }

  .section-note {
    fill: var(--muted);
    font-size: 14px;
  }

  .doc-label {
    font-size: 14px;
    font-weight: 700;
  }

  .inside-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 650;
  }

  .packed-label {
    font-size: 13px;
    font-weight: 750;
  }

  .summary-main {
    font-size: 17px;
    font-weight: 800;
  }

  .summary-sub {
    font-size: 14px;
    font-weight: 700;
  }

  .footer-main {
    font-size: 16px;
    font-weight: 800;
  }

  .footer-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .bar-outline {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
  }

  .pad {
    fill: var(--pad);
  }

  .hatch {
    stroke: var(--pad-line);
    stroke-width: 1px;
  }

  .separator {
    stroke: var(--panel);
    stroke-width: 3px;
  }

  .leader,
  .bracket {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5px;
  }

  .column-divider {
    stroke: var(--divider);
    stroke-width: 2px;
    stroke-dasharray: 5 7;
  }

  .fallback {
    fill: var(--text);
    font-size: 16px;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Padding и плотная упаковка</h1>
  <svg id="diagram" viewBox="0 0 1200 470"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Сравнение padding и плотной упаковки документов</title>
    <desc id="svg-desc">
      Слева три документа используют 6144 позиции, но содержат только 800
      полезных токенов. Справа пять документов полностью заполняют одну
      последовательность на 2048 позиций.
    </desc>
  </svg>
</figure>

<script>
const D = {
  zero: 0,
  one: 1,
  canvas: { width: 1200, height: 470 },
  divider: { x: 596, top: 38, bottom: 356 },
  left: {
    x1: 70, x2: 525,
    headingY: 42, noteY: 68,
    rows: [118, 198, 278],
    barHeight: 34,
    labelLift: 20,
    insideDrop: 1,
    docs: [
      { name: "Документ A", tokens: 200, color: "var(--a)" },
      { name: "Документ B", tokens: 500, color: "var(--b)" },
      { name: "Документ C", tokens: 100, color: "var(--c)" }
    ],
    sequence: 2048,
    useful: 800,
    occupied: 6144,
    efficiency: 13,
    card: { x1: 70, x2: 525, y1: 334, y2: 407, split: 298 }
  },
  right: {
    x1: 655, x2: 1135,
    headingY: 42, noteY: 68,
    barTop: 158, barBottom: 228,
    labelTopA: 114, labelTopB: 94,
    labelBottomA: 264, labelBottomB: 284,
    leaderGap: 7,
    docs: [
      { name: "A", tokens: 200, color: "var(--a)", side: "topA" },
      { name: "B", tokens: 500, color: "var(--b)", side: "bottomA" },
      { name: "C", tokens: 100, color: "var(--c)", side: "topB" },
      { name: "D", tokens: 400, color: "var(--d)", side: "bottomB" },
      { name: "E", tokens: 848, color: "var(--e)", side: "topA" }
    ],
    sequence: 2048,
    bracketTop: 304,
    bracketBottom: 318,
    bracketLabelY: 340,
    card: { x1: 655, x2: 1135, y1: 365, y2: 407 },
    efficiency: 100
  },
  footer: {
    lineY: 430,
    mainY: 447,
    noteY: 466,
    centerX: 600
  },
  rounding: 10,
  hatchStep: 18,
  hatchSlant: 14,
  labelInset: 10,
  fallback: { x: 44, y1: 182, y2: 216 }
};

const origin = Object.freeze({ x: D.zero, y: D.zero });
const scale = Object.freeze({ x: D.one, y: D.one });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const NS = "http://www.w3.org/2000/svg";

try {
  const make = (tag, attrs, parent = svg) => {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  };

  const text = (value, x, y, className, anchor = "start", parent = svg) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, parent);
    node.textContent = value;
    return node;
  };

  const rect = (x1, y1, x2, y2, attrs, parent = svg) =>
    make("rect", {
      x: sx(x1),
      y: sy(y1),
      width: sx(x2) - sx(x1),
      height: sy(y2) - sy(y1),
      ...attrs
    }, parent);

  const line = (x1, y1, x2, y2, attrs, parent = svg) =>
    make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      ...attrs
    }, parent);

  const group = name => make("g", { "aria-label": name });

  text("Padding: три отдельные последовательности",
    D.left.x1, D.left.headingY, "section-title");
  text("Короткий текст заканчивается, вычисления продолжаются",
    D.left.x1, D.left.noteY, "section-note");

  text("Плотная упаковка: одна последовательность",
    D.right.x1, D.right.headingY, "section-title");
  text("Следующий документ занимает свободные позиции",
    D.right.x1, D.right.noteY, "section-note");

  line(D.divider.x, D.divider.top, D.divider.x, D.divider.bottom,
    { class: "column-divider" });

  const leftGroup = group("Три последовательности с padding");
  D.left.rows.forEach((rowY, index) => {
    const doc = D.left.docs[index];
    const usefulEnd = D.left.x1 +
      (D.left.x2 - D.left.x1) * doc.tokens / D.left.sequence;
    const barBottom = rowY + D.left.barHeight;

    text(`${doc.name} · ${doc.tokens} токенов`,
      D.left.x1, rowY - D.left.labelLift, "doc-label", "start", leftGroup);
    text("2048 позиций",
      D.left.x2, rowY - D.left.labelLift, "section-note", "end", leftGroup);

    rect(D.left.x1, rowY, D.left.x2, barBottom,
      { class: "pad", rx: sx(D.rounding), ry: sy(D.rounding) }, leftGroup);

    for (
      let hatchX = usefulEnd + D.hatchStep;
      hatchX < D.left.x2;
      hatchX += D.hatchStep
    ) {
      const hatchEnd = Math.min(hatchX + D.hatchSlant, D.left.x2);
      line(hatchX, rowY, hatchEnd, barBottom,
        { class: "hatch" }, leftGroup);
    }

    rect(D.left.x1, rowY, usefulEnd, barBottom, {
      fill: doc.color,
      rx: sx(D.rounding),
      ry: sy(D.rounding)
    }, leftGroup);

    rect(D.left.x1, rowY, D.left.x2, barBottom, {
      class: "bar-outline",
      rx: sx(D.rounding),
      ry: sy(D.rounding)
    }, leftGroup);

    text("padding",
      usefulEnd + (D.left.x2 - usefulEnd) / (D.one + D.one),
      rowY + D.left.barHeight / (D.one + D.one) + D.left.insideDrop,
      "inside-label", "middle", leftGroup);
  });

  const leftCard = D.left.card;
  rect(leftCard.x1, leftCard.y1, leftCard.x2, leftCard.y2, {
    fill: "var(--soft-bad)",
    rx: sx(D.rounding),
    ry: sy(D.rounding)
  }, leftGroup);
  line(leftCard.split, leftCard.y1, leftCard.split, leftCard.y2, {
    class: "bracket"
  }, leftGroup);
  text("3 × 2048 = 6144 позиций",
    leftCard.x1 + D.labelInset,
    (leftCard.y1 + leftCard.y2) / (D.one + D.one),
    "summary-main", "start", leftGroup);
  text("полезно 800 · 13%",
    leftCard.x2 - D.labelInset,
    (leftCard.y1 + leftCard.y2) / (D.one + D.one),
    "summary-main", "end", leftGroup);

  const rightGroup = group("Пять документов без промежутков");
  const packedWidth = D.right.x2 - D.right.x1;
  let cursor = D.right.x1;

  D.right.docs.forEach((doc, index) => {
    const segmentEnd = cursor + packedWidth * doc.tokens / D.right.sequence;
    const middle = cursor + (segmentEnd - cursor) / (D.one + D.one);
    const labelY = doc.side === "topA" ? D.right.labelTopA :
      doc.side === "topB" ? D.right.labelTopB :
      doc.side === "bottomA" ? D.right.labelBottomA :
      D.right.labelBottomB;
    const isTop = doc.side === "topA" || doc.side === "topB";
    const leaderStart = isTop ? D.right.barTop : D.right.barBottom;
    const leaderEnd = isTop ?
      labelY + D.right.leaderGap :
      labelY - D.right.leaderGap;

    rect(cursor, D.right.barTop, segmentEnd, D.right.barBottom, {
      fill: doc.color
    }, rightGroup);

    line(middle, leaderStart, middle, leaderEnd, {
      class: "leader"
    }, rightGroup);

    text(`${doc.name} · ${doc.tokens}`,
      middle, labelY, "packed-label", "middle", rightGroup);

    if (index < D.right.docs.length - D.one) {
      line(segmentEnd, D.right.barTop, segmentEnd, D.right.barBottom, {
        class: "separator"
      }, rightGroup);
    }
    cursor = segmentEnd;
  });

  rect(D.right.x1, D.right.barTop, D.right.x2, D.right.barBottom, {
    class: "bar-outline",
    rx: sx(D.rounding),
    ry: sy(D.rounding)
  }, rightGroup);

  line(D.right.x1, D.right.bracketTop,
    D.right.x1, D.right.bracketBottom, { class: "bracket" }, rightGroup);
  line(D.right.x1, D.right.bracketBottom,
    D.right.x2, D.right.bracketBottom, { class: "bracket" }, rightGroup);
  line(D.right.x2, D.right.bracketTop,
    D.right.x2, D.right.bracketBottom, { class: "bracket" }, rightGroup);
  text("одна последовательность · 2048 позиций",
    D.right.x1 + packedWidth / (D.one + D.one),
    D.right.bracketLabelY, "summary-sub", "middle", rightGroup);

  const rightCard = D.right.card;
  rect(rightCard.x1, rightCard.y1, rightCard.x2, rightCard.y2, {
    fill: "var(--soft-good)",
    rx: sx(D.rounding),
    ry: sy(D.rounding)
  }, rightGroup);
  text("2048 из 2048 позиций заняты текстом",
    rightCard.x1 + D.labelInset,
    (rightCard.y1 + rightCard.y2) / (D.one + D.one),
    "summary-main", "start", rightGroup);
  text("100%",
    rightCard.x2 - D.labelInset,
    (rightCard.y1 + rightCard.y2) / (D.one + D.one),
    "summary-main", "end", rightGroup);

  line(D.left.x1, D.footer.lineY, D.right.x2, D.footer.lineY, {
    class: "bracket"
  });
  text("Те же позиции вычисляются — но вместо padding модель видит новые документы",
    D.footer.centerX, D.footer.mainY, "footer-main", "middle");
  text("13% полезных позиций слева → 100% справа",
    D.footer.centerX, D.footer.noteY, "footer-note", "middle");
} catch (error) {
  while (svg.lastChild && !svg.lastChild.matches("title, desc")) {
    svg.removeChild(svg.lastChild);
  }
  const first = document.createElementNS(NS, "text");
  first.setAttribute("x", sx(D.fallback.x));
  first.setAttribute("y", sy(D.fallback.y1));
  first.setAttribute("class", "fallback");
  first.textContent =
    "Схема: слева 800 полезных токенов занимают 6144 позиции — 13%.";
  svg.appendChild(first);

  const second = document.createElementNS(NS, "text");
  second.setAttribute("x", sx(D.fallback.x));
  second.setAttribute("y", sy(D.fallback.y2));
  second.setAttribute("class", "fallback");
  second.textContent =
    "Справа документы на 200, 500, 100, 400 и 848 токенов заполняют 2048 позиций.";
  svg.appendChild(second);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
