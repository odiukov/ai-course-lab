<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Конвейер подготовки признаков</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --ink: midnightblue;
      --muted: slategray;
      --line: steelblue;
      --arrow: royalblue;
      --panel: aliceblue;
      --source-fill: oldlace;
      --source-stroke: darkorange;
      --check-fill: honeydew;
      --check-stroke: seagreen;
      --number-fill: lavender;
      --number-stroke: slateblue;
      --category-fill: lightcyan;
      --category-stroke: teal;
      --text-fill: mistyrose;
      --text-stroke: indianred;
      --merge-fill: azure;
      --merge-stroke: darkcyan;
      --create-fill: lemonchiffon;
      --create-stroke: goldenrod;
      --select-fill: lavenderblush;
      --select-stroke: mediumvioletred;
      --ready-fill: honeydew;
      --ready-stroke: forestgreen;
      --caption: darkslategray;
    }

    * { box-sizing: border-box; }

    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: unset;
      padding: 12px 16px;
      background: var(--page);
    }

    h1 {
      margin: unset;
      padding: 4px 0 10px;
      font-size: 21px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--page);
    }

    .branch-panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .flow-line {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head { fill: var(--arrow); }

    .node {
      stroke-width: 3px;
    }

    .source { fill: var(--source-fill); stroke: var(--source-stroke); }
    .check { fill: var(--check-fill); stroke: var(--check-stroke); }
    .number { fill: var(--number-fill); stroke: var(--number-stroke); }
    .category { fill: var(--category-fill); stroke: var(--category-stroke); }
    .textual { fill: var(--text-fill); stroke: var(--text-stroke); }
    .merge { fill: var(--merge-fill); stroke: var(--merge-stroke); }
    .create { fill: var(--create-fill); stroke: var(--create-stroke); }
    .select { fill: var(--select-fill); stroke: var(--select-stroke); }
    .ready { fill: var(--ready-fill); stroke: var(--ready-stroke); }

    .node-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .node-copy {
      fill: var(--muted);
      font-size: 15px;
    }

    .raw-copy {
      fill: var(--ink);
      font-size: 15px;
    }

    .panel-label {
      fill: var(--caption);
      font-size: 15px;
      font-weight: bold;
    }

    .caption {
      fill: var(--caption);
      font-size: 16px;
      font-weight: bold;
    }

    #fallback {
      margin: unset;
      padding: 18px;
      color: var(--ink);
      font-size: 16px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --line: #64748b;
        --arrow: #60a5fa;
        --panel: #172033;
        --source-fill: #342719;
        --source-stroke: #fb923c;
        --check-fill: #153126;
        --check-stroke: #4ade80;
        --number-fill: #272545;
        --number-stroke: #a78bfa;
        --category-fill: #123238;
        --category-stroke: #2dd4bf;
        --text-fill: #3b2028;
        --text-stroke: #fb7185;
        --merge-fill: #123039;
        --merge-stroke: #22d3ee;
        --create-fill: #382f17;
        --create-stroke: #facc15;
        --select-fill: #3a1d36;
        --select-stroke: #f472b6;
        --ready-fill: #173421;
        --ready-stroke: #4ade80;
        --caption: #dbeafe;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Конвейер подготовки признаков</h1>
    <svg id="diagram" width="1680" height="440" viewBox="0 0 1680 440"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Сырые данные проходят заполнение пропусков, расходятся по трём линиям обработки, объединяются и превращаются в готовую матрицу признаков"></svg>
    <p id="fallback">Схема показывает путь от сырых данных через заполнение пропусков, обработку чисел, категорий и текста к взаимодействиям, отбору признаков и готовой матрице.</p>
  </figure>

  <script>
    const diagramData = [
      {
        kind: "panel", x: 550, y: 38, w: 300, h: 360, r: 18,
        label: "Одна покупка — разные инструменты", labelX: 700, labelY: 25
      },
      {
        kind: "node", tone: "source", x: 150, y: 220, w: 270, h: 132, r: 18,
        lines: [
          ["Сырые данные", -43, "node-title"],
          ["Цена: 79", -10, "raw-copy"],
          ["Категория: «обувь»", 16, "raw-copy"],
          ["Отзыв: «удобные, но маломерят»", 42, "raw-copy"]
        ]
      },
      {
        kind: "node", tone: "check", x: 435, y: 220, w: 190, h: 102, r: 18,
        lines: [
          ["Заполнение", -21, "node-title"],
          ["пропусков", 3, "node-title"],
          ["общая проверка строки", 31, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "number", x: 700, y: 92, w: 240, h: 80, r: 16,
        lines: [
          ["Преобразование чисел", -10, "node-title"],
          ["цена", 20, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "category", x: 700, y: 220, w: 240, h: 80, r: 16,
        lines: [
          ["Кодирование категорий", -10, "node-title"],
          ["«обувь» → признаки", 20, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "textual", x: 700, y: 348, w: 240, h: 80, r: 16,
        lines: [
          ["Текстовые признаки", -10, "node-title"],
          ["смысл отзыва", 20, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "merge", x: 960, y: 220, w: 180, h: 104, r: 18,
        lines: [
          ["Единый набор", -17, "node-title"],
          ["признаков", 8, "node-title"],
          ["та же покупка", 35, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "create", x: 1180, y: 220, w: 200, h: 104, r: 18,
        lines: [
          ["Взаимодействия", -17, "node-title"],
          ["признаков", 8, "node-title"],
          ["совместные эффекты", 35, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "select", x: 1390, y: 220, w: 170, h: 104, r: 18,
        lines: [
          ["Отбор", -17, "node-title"],
          ["признаков", 8, "node-title"],
          ["убрать лишнее", 35, "node-copy"]
        ]
      },
      {
        kind: "node", tone: "ready", x: 1585, y: 220, w: 160, h: 104, r: 18,
        lines: [
          ["Готовая", -17, "node-title"],
          ["матрица", 8, "node-title"],
          ["для модели", 35, "node-copy"]
        ]
      },
      {
        kind: "arrow",
        points: [[285, 220], [340, 220]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[530, 220], [552, 220], [552, 92], [580, 92]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[530, 220], [580, 220]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[530, 220], [552, 220], [552, 348], [580, 348]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[820, 92], [846, 92], [846, 192], [870, 192]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[820, 220], [870, 220]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[820, 348], [846, 348], [846, 248], [870, 248]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[1050, 220], [1080, 220]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[1280, 220], [1305, 220]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "arrow",
        points: [[1475, 220], [1505, 220]],
        headLength: 13, headHalf: 8
      },
      {
        kind: "caption", x: 840, y: 425,
        text: "проверить → обработать по типу → объединить → создать → отобрать"
      }
    ];

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    try {
      const make = (name, attributes, text) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        if (text !== undefined) element.textContent = text;
        return element;
      };

      const panelLayer = make("g", { "aria-hidden": "true" });
      const arrowLayer = make("g", { "aria-hidden": "true" });
      const nodeLayer = make("g", {});
      const captionLayer = make("g", {});
      svg.append(panelLayer, arrowLayer, nodeLayer, captionLayer);

      for (const item of diagramData) {
        if (item.kind === "panel") {
          panelLayer.append(
            make("rect", {
              x: sx(item.x),
              y: sy(item.y),
              width: sx(item.w) - sx(0),
              height: sy(item.h) - sy(0),
              rx: sx(item.r) - sx(0),
              ry: sy(item.r) - sy(0),
              class: "branch-panel"
            }),
            make("text", {
              x: sx(item.labelX),
              y: sy(item.labelY),
              "text-anchor": "middle",
              class: "panel-label"
            }, item.label)
          );
        }

        if (item.kind === "arrow") {
          const pathData = item.points
            .map((point, position) => {
              const [x, y] = point;
              return `${position ? "L" : "M"} ${sx(x)} ${sy(y)}`;
            })
            .join(" ");

          const lastPoint = item.points[item.points.length - 1];
          const [endX, endY] = lastPoint;
          const headPoints = [
            `${sx(endX)},${sy(endY)}`,
            `${sx(endX - item.headLength)},${sy(endY - item.headHalf)}`,
            `${sx(endX - item.headLength)},${sy(endY + item.headHalf)}`
          ].join(" ");

          arrowLayer.append(
            make("path", { d: pathData, class: "flow-line" }),
            make("polygon", { points: headPoints, class: "arrow-head" })
          );
        }

        if (item.kind === "node") {
          const group = make("g", {});
          group.append(
            make("rect", {
              x: sx(item.x - item.w / 2),
              y: sy(item.y - item.h / 2),
              width: sx(item.w) - sx(0),
              height: sy(item.h) - sy(0),
              rx: sx(item.r) - sx(0),
              ry: sy(item.r) - sy(0),
              class: `node ${item.tone}`
            })
          );

          for (const [copy, offset, className] of item.lines) {
            group.append(
              make("text", {
                x: sx(item.x),
                y: sy(item.y + offset),
                "text-anchor": "middle",
                "dominant-baseline": "middle",
                class: className
              }, copy)
            );
          }
          nodeLayer.append(group);
        }

        if (item.kind === "caption") {
          captionLayer.append(
            make("text", {
              x: sx(item.x),
              y: sy(item.y),
              "text-anchor": "middle",
              class: "caption"
            }, item.text)
          );
        }
      }

      fallback.hidden = true;
    } catch (error) {
      fallback.hidden = false;
      fallback.textContent = "Схема должна была показать путь от сырых данных через заполнение пропусков, отдельную обработку чисел, категорий и текста, объединение, взаимодействия и отбор к готовой матрице.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
