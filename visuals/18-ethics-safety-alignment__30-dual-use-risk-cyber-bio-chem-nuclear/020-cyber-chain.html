<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Где человек остаётся в агентной киберкампании</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef3f8;
      --panel: #ffffff;
      --panel-soft: #f6f9fc;
      --ink: #172234;
      --muted: #607087;
      --border: #cbd6e3;
      --agent: #1769e0;
      --agent-soft: #e9f2ff;
      --agent-line: #9bc2f8;
      --human: #c52b70;
      --human-soft: #fff0f6;
      --human-ink: #961950;
      --white: #ffffff;
      --shadow: rgba(31, 54, 83, 0.12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0c121b;
        --panel: #131d2a;
        --panel-soft: #182434;
        --ink: #eef5ff;
        --muted: #a9b8cb;
        --border: #34455b;
        --agent: #65a5ff;
        --agent-soft: #152d4c;
        --agent-line: #386899;
        --human: #ff6fae;
        --human-soft: #3d1930;
        --human-ink: #ff9bc7;
        --white: #08111d;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px var(--shadow);
    }

    figcaption {
      padding: 14px 20px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      font-size: 20px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    .metric {
      fill: var(--agent);
      font-size: 22px;
      font-weight: 780;
    }

    .top-note {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 560;
    }

    .rail-underlay {
      stroke: var(--agent-line);
      stroke-width: 12px;
      stroke-linecap: round;
    }

    .rail {
      stroke: var(--agent);
      stroke-width: 6px;
      stroke-linecap: round;
    }

    .stage {
      fill: var(--panel-soft);
      stroke: var(--border);
      stroke-width: 1.5px;
    }

    .stage-accent {
      fill: var(--agent);
    }

    .stage-tag {
      fill: var(--agent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .stage-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 730;
    }

    .stage-note {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }

    .stage-progress {
      stroke: var(--agent-line);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .stage-progress-live {
      stroke: var(--agent);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .connector {
      stroke: var(--agent);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: var(--agent);
    }

    .human-stem {
      stroke: var(--human);
      stroke-width: 2px;
      stroke-dasharray: 4 4;
    }

    .human-marker {
      fill: var(--human);
      stroke: var(--panel);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .human-center {
      fill: var(--white);
    }

    .human-panel {
      fill: var(--human-soft);
      stroke: var(--human);
      stroke-width: 1.5px;
    }

    .human-heading {
      fill: var(--human-ink);
      font-size: 17px;
      font-weight: 760;
    }

    .human-note {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 520;
    }

    .conclusion {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .legend-agent {
      fill: var(--agent);
    }

    .legend-human {
      fill: var(--human);
    }

    .legend-text {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 570;
    }

    #fallback {
      display: none;
      margin: 0;
      padding: 24px;
      background: var(--human-soft);
      color: var(--human-ink);
      font-size: 16px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">
      Где человек остаётся в агентной киберкампании
    </figcaption>
    <svg
      id="diagram"
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Цепочка от разведки до вывода данных преимущественно выполняется
        агентом, а человек входит в неё лишь в нескольких отдельных точках
        управления.
      </desc>
    </svg>
    <p id="fallback"></p>
  </figure>

  <script>
    const data = [
      {
        origin: { x: 6, y: 2 },
        scale: { x: 10, y: 10 },
        metric: {
          x: 0,
          y: 2.3,
          text: "80–90% кампании автоматизировано"
        },
        topNote: {
          x: 108,
          y: 2.3,
          text: "агент связывает действия без ожидания новой команды"
        },
        rail: {
          x1: 0,
          x2: 108,
          y: 7.6
        },
        markerSize: {
          x: 1.15,
          y: 1.15,
          center: 0.28
        },
        stageBox: {
          y: 13,
          height: 13,
          accent: 0.65,
          tagY: 2.5,
          titleY: 6.2,
          noteY: 9.2,
          progressY: 11.2,
          inset: 2.1,
          liveEnd: 7.7
        },
        connector: {
          y: 19.5,
          gap: 0.55,
          headX: 0.9,
          headY: 0.62
        },
        interventionPanel: {
          x: 0,
          y: 29.3,
          width: 108,
          height: 8.8,
          markerX: 3.3,
          markerY: 33.7,
          headingX: 6.2,
          headingY: 32.5,
          noteY: 35.3,
          conclusionX: 105.5,
          conclusionY: 32.6,
          conclusionNoteY: 35.3
        },
        legend: {
          y: 40.2,
          agentX: 0,
          agentTextX: 2.3,
          humanX: 38,
          humanTextX: 40.3,
          swatch: 0.72
        },
        fallback:
          "Схема должна была показать цепочку «разведка → эксплуатация → постэксплуатация → вывод данных»: 80–90% кампании выполняет агент, а человек вмешивается лишь в 4–6 отдельных точках управления."
      },
      {
        kind: "stage",
        x: 0,
        width: 24.5,
        tag: "РАБОТА АГЕНТА",
        title: "Разведка",
        note: "серия связанных шагов"
      },
      {
        kind: "stage",
        x: 28,
        width: 24.5,
        tag: "РАБОТА АГЕНТА",
        title: "Эксплуатация",
        note: "переход к следующей фазе"
      },
      {
        kind: "stage",
        x: 56,
        width: 24.5,
        tag: "РАБОТА АГЕНТА",
        title: "Постэксплуатация",
        note: "продолжение без ручного ведения"
      },
      {
        kind: "stage",
        x: 84,
        width: 24,
        tag: "РАБОТА АГЕНТА",
        title: "Вывод данных",
        note: "завершение цепочки"
      },
      {
        kind: "human",
        x: 13,
        y: 7.6,
        stemY: 11.6
      },
      {
        kind: "human",
        x: 34.5,
        y: 7.6,
        stemY: 11.6
      },
      {
        kind: "human",
        x: 57.7,
        y: 7.6,
        stemY: 11.6
      },
      {
        kind: "human",
        x: 78,
        y: 7.6,
        stemY: 11.6
      },
      {
        kind: "human",
        x: 101,
        y: 7.6,
        stemY: 11.6
      }
    ];

    const [layout, ...items] = data;
    const origin = layout.origin;
    const scale = layout.scale;
    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, parent = svg) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const group = (className) =>
        make("g", { class: className });

      const line = (x1, y1, x2, y2, className, parent = svg) =>
        make(
          "line",
          {
            x1: sx(x1),
            y1: sy(y1),
            x2: sx(x2),
            y2: sy(y2),
            class: className
          },
          parent
        );

      const rectangle = (x, y, width, height, className, parent = svg) =>
        make(
          "rect",
          {
            x: sx(x),
            y: sy(y),
            width: sx(x + width) - sx(x),
            height: sy(y + height) - sy(y),
            class: className
          },
          parent
        );

      const circle = (x, y, radius, className, parent = svg) =>
        make(
          "circle",
          {
            cx: sx(x),
            cy: sy(y),
            r: sx(x + radius) - sx(x),
            class: className
          },
          parent
        );

      const text = (
        x,
        y,
        value,
        className,
        anchor,
        dx,
        dy,
        parent = svg
      ) => {
        const attributes = {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        };

        if (dx !== undefined) attributes.dx = dx;
        if (dy !== undefined) attributes.dy = dy;

        const node = make("text", attributes, parent);
        node.textContent = value;
        return node;
      };

      const diamond = (
        x,
        y,
        sizeX,
        sizeY,
        className,
        parent = svg
      ) =>
        make(
          "polygon",
          {
            points: [
              [sx(x), sy(y - sizeY)],
              [sx(x + sizeX), sy(y)],
              [sx(x), sy(y + sizeY)],
              [sx(x - sizeX), sy(y)]
            ]
              .map((point) => point.join(","))
              .join(" "),
            class: className
          },
          parent
        );

      const arrow = (x1, y, x2, settings, parent = svg) => {
        line(x1, y, x2, y, "connector", parent);
        make(
          "polygon",
          {
            points: [
              [sx(x2), sy(y)],
              [sx(x2 - settings.headX), sy(y - settings.headY)],
              [sx(x2 - settings.headX), sy(y + settings.headY)]
            ]
              .map((point) => point.join(","))
              .join(" "),
            class: "connector"
          },
          parent
        );
      };

      const stages = items.filter((item) => item.kind === "stage");
      const interventions = items.filter((item) => item.kind === "human");

      text(
        layout.metric.x,
        layout.metric.y,
        layout.metric.text,
        "metric",
        "start"
      );
      text(
        layout.topNote.x,
        layout.topNote.y,
        layout.topNote.text,
        "top-note",
        "end"
      );

      line(
        layout.rail.x1,
        layout.rail.y,
        layout.rail.x2,
        layout.rail.y,
        "rail-underlay"
      );
      line(
        layout.rail.x1,
        layout.rail.y,
        layout.rail.x2,
        layout.rail.y,
        "rail"
      );

      const markerLayer = group("intervention-markers");
      interventions.forEach((marker) => {
        line(
          marker.x,
          marker.y + layout.markerSize.y,
          marker.x,
          marker.stemY,
          "human-stem",
          markerLayer
        );
        diamond(
          marker.x,
          marker.y,
          layout.markerSize.x,
          layout.markerSize.y,
          "human-marker",
          markerLayer
        );
        circle(
          marker.x,
          marker.y,
          layout.markerSize.center,
          "human-center",
          markerLayer
        );
      });

      let previousStage;
      stages.forEach((stage) => {
        if (previousStage) {
          arrow(
            previousStage.x +
              previousStage.width +
              layout.connector.gap,
            layout.connector.y,
            stage.x - layout.connector.gap,
            layout.connector
          );
        }

        const stageGroup = group("stage-group");
        rectangle(
          stage.x,
          layout.stageBox.y,
          stage.width,
          layout.stageBox.height,
          "stage",
          stageGroup
        );
        rectangle(
          stage.x,
          layout.stageBox.y,
          layout.stageBox.accent,
          layout.stageBox.height,
          "stage-accent",
          stageGroup
        );

        text(
          stage.x + layout.stageBox.inset,
          layout.stageBox.y + layout.stageBox.tagY,
          stage.tag,
          "stage-tag",
          "start",
          undefined,
          undefined,
          stageGroup
        );
        text(
          stage.x + layout.stageBox.inset,
          layout.stageBox.y + layout.stageBox.titleY,
          stage.title,
          "stage-title",
          "start",
          undefined,
          undefined,
          stageGroup
        );
        text(
          stage.x + layout.stageBox.inset,
          layout.stageBox.y + layout.stageBox.noteY,
          stage.note,
          "stage-note",
          "start",
          undefined,
          undefined,
          stageGroup
        );

        line(
          stage.x + layout.stageBox.inset,
          layout.stageBox.y + layout.stageBox.progressY,
          stage.x + stage.width - layout.stageBox.inset,
          layout.stageBox.y + layout.stageBox.progressY,
          "stage-progress",
          stageGroup
        );
        line(
          stage.x + layout.stageBox.inset,
          layout.stageBox.y + layout.stageBox.progressY,
          stage.x + layout.stageBox.liveEnd,
          layout.stageBox.y + layout.stageBox.progressY,
          "stage-progress-live",
          stageGroup
        );

        previousStage = stage;
      });

      const panel = layout.interventionPanel;
      const panelGroup = group("human-summary");
      rectangle(
        panel.x,
        panel.y,
        panel.width,
        panel.height,
        "human-panel",
        panelGroup
      );
      diamond(
        panel.markerX,
        panel.markerY,
        layout.markerSize.x,
        layout.markerSize.y,
        "human-marker",
        panelGroup
      );
      circle(
        panel.markerX,
        panel.markerY,
        layout.markerSize.center,
        "human-center",
        panelGroup
      );

      text(
        panel.headingX,
        panel.headingY,
        "4–6 точек вмешательства человека",
        "human-heading",
        "start",
        undefined,
        undefined,
        panelGroup
      );
      text(
        panel.headingX,
        panel.noteY,
        "это эпизоды выбора, подтверждения или реакции — не отдельная ручная фаза",
        "human-note",
        "start",
        undefined,
        undefined,
        panelGroup
      );
      text(
        panel.conclusionX,
        panel.conclusionY,
        "Человек остаётся внутри кампании",
        "conclusion",
        "end",
        undefined,
        undefined,
        panelGroup
      );
      text(
        panel.conclusionX,
        panel.conclusionNoteY,
        "но входит в неё только в точках управления",
        "human-note",
        "end",
        undefined,
        undefined,
        panelGroup
      );

      const legend = layout.legend;
      circle(
        legend.agentX + legend.swatch,
        legend.y,
        legend.swatch,
        "legend-agent"
      );
      text(
        legend.agentTextX,
        legend.y,
        "непрерывная работа агента",
        "legend-text",
        "start",
        0,
        5
      );
      diamond(
        legend.humanX + legend.swatch,
        legend.y,
        legend.swatch,
        legend.swatch,
        "legend-human"
      );
      text(
        legend.humanTextX,
        legend.y,
        "эпизодический вход человека; положение меток условно",
        "legend-text",
        "start",
        0,
        5
      );
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.style.display = "none";
      fallback.style.display = "block";
      fallback.textContent = layout.fallback;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
