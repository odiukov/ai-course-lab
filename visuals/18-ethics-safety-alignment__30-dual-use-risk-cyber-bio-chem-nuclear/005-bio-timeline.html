<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как био-uplift изменился за восемнадцать месяцев</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5d687c;
      --axis: #667085;
      --grid: #d8dee9;
      --mild: #6392b7;
      --mild-soft: #e7f1f8;
      --cusp: #c88a2c;
      --cusp-soft: #fff2d9;
      --risk: #bd4c55;
      --risk-soft: #fde8e9;
      --note: #eef1f6;
      --shadow: #d5dbe5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111622;
        --panel: #181f2d;
        --ink: #f2f5fa;
        --muted: #b7c0d0;
        --axis: #9aa7ba;
        --grid: #3a4558;
        --mild: #83b9df;
        --mild-soft: #20394d;
        --cusp: #efb85f;
        --cusp-soft: #4a3821;
        --risk: #f07b83;
        --risk-soft: #512b32;
        --note: #242d3d;
        --shadow: #0c1019;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    figure {
      background: var(--page);
    }

    h2 {
      color: var(--ink);
      font-size: 22px;
      font-weight: 720;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .shadow {
      fill: var(--shadow);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .segment-mild {
      fill: none;
      stroke: var(--mild);
      stroke-width: 8px;
      stroke-linecap: round;
    }

    .segment-cusp {
      fill: none;
      stroke: var(--cusp);
      stroke-width: 8px;
      stroke-linecap: round;
    }

    .segment-risk {
      fill: none;
      stroke: var(--risk);
      stroke-width: 8px;
      stroke-linecap: round;
    }

    .duration,
    .connector {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5px;
      stroke-linecap: round;
    }

    .card {
      stroke-width: 2px;
    }

    .card-mild {
      fill: var(--mild-soft);
      stroke: var(--mild);
    }

    .card-cusp {
      fill: var(--cusp-soft);
      stroke: var(--cusp);
    }

    .card-risk {
      fill: var(--risk-soft);
      stroke: var(--risk);
    }

    .strip-mild {
      fill: var(--mild);
    }

    .strip-cusp {
      fill: var(--cusp);
    }

    .strip-risk {
      fill: var(--risk);
    }

    .node-outer {
      fill: var(--panel);
      stroke-width: 4px;
    }

    .node-inner {
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .node-mild {
      fill: var(--mild);
      stroke: var(--mild);
    }

    .node-cusp {
      fill: var(--cusp);
      stroke: var(--cusp);
    }

    .node-risk {
      fill: var(--risk);
      stroke: var(--risk);
    }

    .arrow {
      fill: var(--axis);
    }

    .label {
      fill: var(--ink);
      font-size: 17px;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .main {
      fill: var(--ink);
      font-size: 21px;
      font-weight: 760;
    }

    .detail {
      fill: var(--muted);
      font-size: 16px;
    }

    .duration-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 680;
    }

    .note-box {
      fill: var(--note);
      stroke: var(--grid);
      stroke-width: 1.5px;
    }

    .note-text {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 620;
    }

    #fallback {
      color: var(--ink);
      background: var(--panel);
      border: 1px solid var(--grid);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Как био-uplift изменился за восемнадцать месяцев</h2>
    <svg id="diagram"
         viewBox="0 0 1200 460"
         width="1200"
         height="460"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Изменение смысла био-uplift за восемнадцать месяцев</title>
      <desc id="svg-desc">Три снимка развивающейся ситуации: небольшое усиление в 2024 году, состояние на грани в апреле 2025 года и усиление 2,53 раза к концу 2025 года, когда ASL-3 уже нельзя исключить.</desc>
    </svg>
    <div id="fallback" hidden>
      Схема должна была показать переход от небольшого усиления в 2024 году через состояние «на грани» в апреле 2025 года к усилению 2,53× в конце 2025 года, когда ASL-3 уже нельзя исключить.
    </div>
  </figure>

  <script>
    const data = {
      canvas: { width: 1200, height: 460 },
      origin: { x: 65, y: 245 },
      scale: { x: 105, y: 100 },
      panel: { x1: -0.55, x2: 10.78, yTop: 2.23, yBottom: -2.08 },
      shadow: { x1: -0.48, x2: 10.78, yTop: 2.16, yBottom: -2.08 },
      timeline: {
        start: { x: 0.36, y: 0 },
        end: { x: 10.48, y: 0 },
        arrow: [
          { x: 10.48, y: 0 },
          { x: 10.18, y: 0.13 },
          { x: 10.18, y: -0.13 }
        ]
      },
      duration: {
        line: {
          start: { x: 1, y: 1.92 },
          end: { x: 9.18, y: 1.92 }
        },
        ticks: [
          {
            start: { x: 1, y: 1.82 },
            end: { x: 1, y: 2.02 }
          },
          {
            start: { x: 9.18, y: 1.82 },
            end: { x: 9.18, y: 2.02 }
          }
        ],
        label: {
          anchor: { x: 5.09, y: 1.92 },
          offsetX: 0,
          offsetY: -12,
          lineGap: 20,
          anchorSide: "middle",
          className: "duration-label",
          lines: [
            { text: "примерно 18 месяцев", role: "duration-label" }
          ]
        }
      },
      stages: [
        {
          tone: "mild",
          point: { x: 1, y: 0 },
          radiusOuter: 0.13,
          radiusInner: 0.065,
          segment: {
            start: { x: 1, y: 0 },
            end: { x: 5, y: 0 }
          },
          connector: {
            start: { x: 1, y: 0.13 },
            end: { x: 1, y: 0.42 }
          },
          card: {
            x1: 0.08,
            x2: 3.16,
            yTop: 1.56,
            yBottom: 0.42
          },
          strip: {
            x1: 0.08,
            x2: 0.16,
            yTop: 1.56,
            yBottom: 0.42
          },
          label: {
            anchor: { x: 0.38, y: 1.31 },
            offsetX: 0,
            offsetY: 0,
            lineGap: 25,
            anchorSide: "start",
            className: "label",
            lines: [
              { text: "2024", role: "eyebrow" },
              { text: "Небольшое усиление", role: "main" },
              { text: "преимущество над поиском", role: "detail" }
            ]
          }
        },
        {
          tone: "cusp",
          point: { x: 5, y: 0 },
          radiusOuter: 0.15,
          radiusInner: 0.078,
          segment: {
            start: { x: 5, y: 0 },
            end: { x: 9.18, y: 0 }
          },
          connector: {
            start: { x: 5, y: -0.15 },
            end: { x: 5, y: -0.43 }
          },
          card: {
            x1: 3.54,
            x2: 6.46,
            yTop: -0.43,
            yBottom: -1.53
          },
          strip: {
            x1: 3.54,
            x2: 3.62,
            yTop: -0.43,
            yBottom: -1.53
          },
          label: {
            anchor: { x: 5, y: -0.7 },
            offsetX: 0,
            offsetY: 0,
            lineGap: 25,
            anchorSide: "middle",
            className: "label",
            lines: [
              { text: "АПРЕЛЬ 2025", role: "eyebrow" },
              { text: "На грани", role: "main" },
              { text: "существенной помощи новичку", role: "detail" }
            ]
          }
        },
        {
          tone: "risk",
          point: { x: 9.18, y: 0 },
          radiusOuter: 0.18,
          radiusInner: 0.1,
          segment: {
            start: { x: 9.18, y: 0 },
            end: { x: 10.16, y: 0 }
          },
          connector: {
            start: { x: 9.18, y: 0.18 },
            end: { x: 9.18, y: 0.34 }
          },
          card: {
            x1: 6.76,
            x2: 10.66,
            yTop: 1.64,
            yBottom: 0.34
          },
          strip: {
            x1: 6.76,
            x2: 6.84,
            yTop: 1.64,
            yBottom: 0.34
          },
          label: {
            anchor: { x: 7.08, y: 1.42 },
            offsetX: 0,
            offsetY: 0,
            lineGap: 24,
            anchorSide: "start",
            className: "label",
            lines: [
              { text: "КОНЕЦ 2025", role: "eyebrow" },
              { text: "Усиление 2,53×", role: "main" },
              { text: "на фазе приобретения", role: "detail" },
              { text: "ASL-3 исключить нельзя", role: "detail" }
            ]
          }
        }
      ],
      note: {
        box: {
          x1: 0.25,
          x2: 10.55,
          yTop: -1.72,
          yBottom: -1.99
        },
        label: {
          anchor: { x: 5.4, y: -1.855 },
          offsetX: 0,
          offsetY: 6,
          lineGap: 20,
          anchorSide: "middle",
          className: "note-text",
          lines: [
            {
              text: "Не единая числовая шкала: сопоставляем направление и практический смысл",
              role: "note-text"
            }
          ]
        }
      },
      fallback: "Схема должна была показать три этапа: небольшое усиление в 2024 году, состояние «на грани» в апреле 2025 года и усиление 2,53× в конце 2025 года, когда ASL-3 исключить нельзя."
    };

    const origin = Object.freeze({ x: data.origin.x, y: data.origin.y });
    const scale = Object.freeze({ x: data.scale.x, y: data.scale.y });

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y - y * scale.y;
    }

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      function make(tag, attributes, className) {
        const node = document.createElementNS(namespace, tag);

        if (className) {
          node.setAttribute("class", className);
        }

        for (const [name, value] of Object.entries(attributes)) {
          node.setAttribute(name, String(value));
        }

        return node;
      }

      function appendRect(box, className) {
        const rect = make("rect", {
          x: sx(box.x1),
          y: sy(box.yTop),
          width: sx(box.x2) - sx(box.x1),
          height: sy(box.yBottom) - sy(box.yTop)
        }, className);

        svg.appendChild(rect);
        return rect;
      }

      function appendLine(line, className) {
        const node = make("line", {
          x1: sx(line.start.x),
          y1: sy(line.start.y),
          x2: sx(line.end.x),
          y2: sy(line.end.y)
        }, className);

        svg.appendChild(node);
        return node;
      }

      function appendPolygon(points, className) {
        const mapped = points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        const polygon = make("polygon", { points: mapped }, className);
        svg.appendChild(polygon);
        return polygon;
      }

      function appendCircle(point, radius, className) {
        const circle = make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: Math.abs(sx(point.x + radius) - sx(point.x))
        }, className);

        svg.appendChild(circle);
        return circle;
      }

      function appendLabel(label) {
        const text = make("text", {
          "text-anchor": label.anchorSide
        }, label.className);

        let firstLine = true;

        for (const line of label.lines) {
          const tspan = make("tspan", {
            x: sx(label.anchor.x),
            dx: label.offsetX
          }, line.role);

          if (firstLine) {
            tspan.setAttribute("y", String(sy(label.anchor.y)));
            tspan.setAttribute("dy", String(label.offsetY));
            firstLine = false;
          } else {
            tspan.setAttribute("dy", String(label.lineGap));
          }

          tspan.textContent = line.text;
          text.appendChild(tspan);
        }

        svg.appendChild(text);
        return text;
      }

      appendRect(data.shadow, "shadow");
      appendRect(data.panel, "panel");

      appendLine(data.duration.line, "duration");

      for (const tick of data.duration.ticks) {
        appendLine(tick, "duration");
      }

      appendLabel(data.duration.label);
      appendLine(data.timeline, "axis");

      for (const stage of data.stages) {
        appendLine(stage.segment, `segment-${stage.tone}`);
      }

      appendPolygon(data.timeline.arrow, "arrow");

      for (const stage of data.stages) {
        appendLine(stage.connector, "connector");
        appendRect(stage.card, `card card-${stage.tone}`);
        appendRect(stage.strip, `strip-${stage.tone}`);
        appendLabel(stage.label);
        appendCircle(stage.point, stage.radiusOuter, `node-outer node-${stage.tone}`);
        appendCircle(stage.point, stage.radiusInner, `node-inner node-${stage.tone}`);
      }

      appendRect(data.note.box, "note-box");
      appendLabel(data.note.label);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      svg.hidden = true;
      fallback.textContent = data.fallback;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
