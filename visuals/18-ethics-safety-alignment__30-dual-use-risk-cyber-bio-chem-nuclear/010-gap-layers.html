<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Какие слои execution gap размываются</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f4f7fb;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#5e6b80;
  --lane:#dbe3ee;
  --lane-edge:#9aa9bd;
  --skill:#168b77;
  --skill-soft:#d9f2eb;
  --skill-pale:#edf9f5;
  --physical:#a85722;
  --physical-soft:#fae6d7;
  --physical-pale:#fff7f0;
  --accent:#3a63c7;
  --accent-soft:#e5ecff;
  --border:#cbd5e3;
  --white:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink)}
body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;
  justify-content:center;
}
figure{
  width:100%;
  max-width:960px;
  margin:0;
  background:var(--panel);
  border:1px solid var(--border);
}
figcaption{
  padding:12px 18px 8px;
  border-bottom:1px solid var(--border);
}
h1{
  margin:0;
  font-size:20px;
  line-height:1.25;
  font-weight:750;
}
.subtitle{
  margin:4px 0 0;
  color:var(--muted);
  font-size:13px;
  line-height:1.35;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:440px;
  background:var(--panel);
}
text{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  fill:var(--ink);
}
.flow{
  fill:var(--lane);
  stroke:var(--lane-edge);
  stroke-width:1.5;
}
.flow-line{
  fill:none;
  stroke:var(--lane-edge);
  stroke-width:2;
  stroke-linecap:round;
}
.arrow-head{fill:var(--lane-edge)}
.node{
  fill:var(--panel);
  stroke:var(--accent);
  stroke-width:2;
}
.node-cap{fill:var(--accent-soft)}
.node-title{
  font-size:14px;
  font-weight:760;
  letter-spacing:.04em;
}
.node-note{
  fill:var(--muted);
  font-size:11px;
}
.protocol-line{
  stroke:var(--accent);
  stroke-width:1.5;
  stroke-linecap:round;
}
.result-mark{
  fill:none;
  stroke:var(--accent);
  stroke-width:2.5;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.video-box{
  fill:var(--accent-soft);
  stroke:var(--accent);
  stroke-width:1.5;
}
.video-title{
  fill:var(--accent);
  font-size:13px;
  font-weight:780;
  letter-spacing:.03em;
}
.video-note{
  fill:var(--muted);
  font-size:11px;
}
.video-arrow{
  fill:none;
  stroke:var(--accent);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.video-head{fill:var(--accent)}
.old-skill{
  fill:var(--skill-pale);
  stroke:var(--skill);
  stroke-width:1.5;
  stroke-dasharray:5 4;
}
.skill-gap{fill:var(--panel)}
.skill-edge{
  stroke:var(--skill);
  stroke-width:2;
  stroke-linecap:round;
}
.skill-chip{fill:var(--skill)}
.physical{
  fill:var(--physical-soft);
  stroke:var(--physical);
  stroke-width:2;
}
.physical-edge{fill:var(--physical)}
.chip-text{
  fill:var(--white);
  font-size:10px;
  font-weight:800;
  letter-spacing:.06em;
}
.barrier-card-skill{
  fill:var(--skill-pale);
  stroke:var(--skill);
  stroke-width:1.5;
}
.barrier-card-physical{
  fill:var(--physical-pale);
  stroke:var(--physical);
  stroke-width:1.5;
}
.card-title{
  font-size:13px;
  font-weight:780;
}
.card-skill{fill:var(--skill)}
.card-physical{fill:var(--physical)}
.card-note{
  fill:var(--muted);
  font-size:11px;
}
.icon-skill,.icon-physical{
  fill:none;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.icon-skill{stroke:var(--skill)}
.icon-physical{stroke:var(--physical)}
.takeaway{
  fill:var(--ink);
  stroke:var(--ink);
  stroke-width:1.5;
}
.takeaway-main{
  fill:var(--white);
  font-size:14px;
  font-weight:760;
}
.takeaway-note{
  fill:var(--white);
  font-size:11px;
}
.fallback{
  margin:0;
  padding:24px;
  color:var(--ink);
  background:var(--panel);
  font-size:14px;
}
@media(prefers-color-scheme:dark){
  :root{
    --page:#0c111b;
    --panel:#141c29;
    --ink:#edf3ff;
    --muted:#aab7ca;
    --lane:#263348;
    --lane-edge:#8292aa;
    --skill:#55d3b6;
    --skill-soft:#173e38;
    --skill-pale:#142e2c;
    --physical:#f0a36d;
    --physical-soft:#4a2c21;
    --physical-pale:#30231f;
    --accent:#8baaff;
    --accent-soft:#24345d;
    --border:#334158;
    --white:#ffffff;
  }
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption>
    <h1 id="diagram-title">Какие слои execution gap размываются</h1>
    <p class="subtitle">Информационная помощь сужает барьер навыка, но не создаёт материалы и оборудование.</p>
  </figcaption>
  <svg id="diagram" viewBox="0 0 960 440" preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">Путь от текста протокола к результату пересекает три барьера. Неявный навык становится тоньше благодаря видео-коррекции, а закупки и оборудование остаются физическими ограничениями.</desc>
  </svg>
  <p id="fallback" class="fallback" hidden>Видео-коррекция сужает барьер неявного навыка. Закупки материалов и доступ к оборудованию остаются физическими ограничениями.</p>
  <noscript><p class="fallback">Видео-коррекция сужает барьер неявного навыка, но закупки и оборудование остаются ограничениями.</p></noscript>
</figure>
<script>
const data={
  canvas:{w:960,h:440},
  background:{x:0,y:0,w:120,h:55},
  lane:{x:21,y:22,w:80,h:7,r:3.5},
  flowSegments:[
    {a:[22,25.5],b:[39.5,25.5]},
    {a:[44.5,25.5],b:[62,25.5]},
    {a:[68,25.5],b:[83,25.5]},
    {a:[90,25.5],b:[99,25.5]}
  ],
  flowHeads:[
    [[36.8,24.6],[39.5,25.5],[36.8,26.4]],
    [[59.3,24.6],[62,25.5],[59.3,26.4]],
    [[80.3,24.6],[83,25.5],[80.3,26.4]],
    [[96.3,24.6],[99,25.5],[96.3,26.4]]
  ],
  nodes:[
    {kind:"protocol",x:3,y:19,w:19,h:13,r:1.6,title:[12.5,23.2],note:[12.5,29.5]},
    {kind:"result",x:99,y:19,w:18,h:13,r:1.6,title:[108,23.2],note:[108,29.5]}
  ],
  protocolLines:[
    [[6,25],[14.5,25]],[[6,27],[17,27]],[[6,29],[13,29]]
  ],
  resultMark:[[103,26],[106,29],[113,22.5]],
  video:{x:25,y:3,w:35,h:9,r:1.8,title:[42.5,6.4],note:[42.5,9.2]},
  videoArrow:{
    path:[[42.5,12],[42.5,14.5],[42,16.4]],
    head:[[40.9,14.4],[42,16.4],[43.1,14.4]]
  },
  skill:{
    old:{x:39.8,y:17,w:4.4,h:17,r:1.1,dash:0.625,gap:0.5},
    gap:{x:41.4,y:16.6,w:1.2,h:17.8},
    edges:[[[41.3,17.2],[41.3,33.2]],[[42.7,17.2],[42.7,33.2]]],
    chip:{x:37.6,y:14,w:8.8,h:2.8,r:1.4,label:[42,15.9]}
  },
  physical:[
    {id:"buy",x:62,y:16,w:6,h:19,r:1.2,edge:[62,16,1,19],
     chip:{x:60.5,y:13,w:9,h:2.8,r:1.4,label:[65,14.9]}},
    {id:"gear",x:83,y:16,w:7,h:19,r:1.2,edge:[83,16,1,19],
     chip:{x:81.8,y:13,w:9.4,h:2.8,r:1.4,label:[86.5,14.9]}}
  ],
  cards:[
    {kind:"skill",x:25,y:37,w:33,h:8.5,r:1.3,
     title:[31,40.4],note:[31,43.4]},
    {kind:"physical",id:"buy",x:60,y:37,w:27,h:8.5,r:1.3,
     title:[66,40.4],note:[66,43.4]},
    {kind:"physical",id:"gear",x:89,y:37,w:28,h:8.5,r:1.3,
     title:[95,40.4],note:[95,43.4]}
  ],
  icons:{
    skill:[[[28,40.5],[28,42.7]],[[26.9,41.6],[29.1,41.6]]],
    buy:[[[62.4,40.4],[64.3,42.2]],[[64.3,42.2],[62.4,44]],[[62.4,44],[60.5,42.2]],[[60.5,42.2],[62.4,40.4]]],
    gear:[[[91.2,40.5],[93.3,40.5]],[[93.3,40.5],[93.3,43.8]],[[93.3,43.8],[91.2,43.8]],[[91.2,43.8],[91.2,40.5]]]
  },
  takeaway:{x:3,y:48,w:114,h:5,r:1.4,main:[60,50.3],note:[60,52]},
  labels:{
    protocolTitle:"ТЕКСТ ПРОТОКОЛА",
    protocolNote:"описание известно",
    resultTitle:"РЕАЛЬНЫЙ РЕЗУЛЬТАТ",
    resultNote:"выполнено руками",
    videoTitle:"ВИДЕО-КОРРЕКЦИЯ",
    videoNote:"замечает ошибку → подсказывает поправку",
    thin:"ТОНЬШЕ",
    stays:"НА МЕСТЕ",
    skillTitle:"НЕЯВНЫЙ НАВЫК",
    skillNote:"практический барьер сужается",
    buyTitle:"ЗАКУПКИ",
    buyNote:"поставщик • деньги • доставка",
    gearTitle:"ОБОРУДОВАНИЕ",
    gearNote:"прибор • помещение • доступ",
    takeawayMain:"Одна дверь стала легче — две физические двери всё ещё закрыты",
    takeawayNote:"Execution gap сужается частично, а не исчезает"
  }
};
const origin=Object.freeze({x:0,y:0});
const scale=Object.freeze({x:8,y:8});
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const SVG_NS="http://www.w3.org/2000/svg";
const LINE_WIDTH=1.5;
const FONT_SIZE=12;
const LABEL_OFFSET=8;

try{
  const svg=document.getElementById("diagram");

  function add(tag,attrs,parent=svg){
    const item=document.createElementNS(SVG_NS,tag);
    for(const [name,value] of Object.entries(attrs)){
      item.setAttribute(name,String(value));
    }
    parent.appendChild(item);
    return item;
  }

  function rect(item,className){
    return add("rect",{
      x:sx(item.x),y:sy(item.y),
      width:sx(item.w)-sx(0),height:sy(item.h)-sy(0),
      rx:sx(item.r)-sx(0),class:className
    });
  }

  function line(points,className){
    return add("line",{
      x1:sx(points[0][0]),y1:sy(points[0][1]),
      x2:sx(points[1][0]),y2:sy(points[1][1]),
      class:className
    });
  }

  function poly(points,className){
    return add("polygon",{
      points:points.map(point=>`${sx(point[0])},${sy(point[1])}`).join(" "),
      class:className
    });
  }

  function path(points,className){
    return add("polyline",{
      points:points.map(point=>`${sx(point[0])},${sy(point[1])}`).join(" "),
      class:className
    });
  }

  function label(point,value,className,anchor="middle"){
    const item=add("text",{
      x:sx(point[0]),y:sy(point[1]),
      class:className,"text-anchor":anchor
    });
    item.textContent=value;
    return item;
  }

  rect(data.background,"background");
  rect(data.lane,"flow");

  for(const segment of data.flowSegments) line([segment.a,segment.b],"flow-line");
  for(const head of data.flowHeads) poly(head,"arrow-head");

  for(const node of data.nodes){
    rect(node,"node");
    add("rect",{
      x:sx(node.x),y:sy(node.y),
      width:sx(node.w)-sx(0),height:sy(2.2)-sy(0),
      rx:sx(node.r)-sx(0),class:"node-cap"
    });
    if(node.kind==="protocol"){
      label(node.title,data.labels.protocolTitle,"node-title");
      label(node.note,data.labels.protocolNote,"node-note");
    }else{
      label(node.title,data.labels.resultTitle,"node-title");
      label(node.note,data.labels.resultNote,"node-note");
    }
  }

  for(const item of data.protocolLines) line(item,"protocol-line");
  path(data.resultMark,"result-mark");

  rect(data.video,"video-box");
  label(data.video.title,data.labels.videoTitle,"video-title");
  label(data.video.note,data.labels.videoNote,"video-note");
  path(data.videoArrow.path,"video-arrow");
  poly(data.videoArrow.head,"video-head");

  const oldSkill=rect(data.skill.old,"old-skill");
  oldSkill.setAttribute("stroke-dasharray",
    `${sx(data.skill.old.dash)-sx(0)} ${sx(data.skill.old.gap)-sx(0)}`);
  add("rect",{
    x:sx(data.skill.gap.x),y:sy(data.skill.gap.y),
    width:sx(data.skill.gap.w)-sx(0),
    height:sy(data.skill.gap.h)-sy(0),
    class:"skill-gap"
  });
  for(const edge of data.skill.edges) line(edge,"skill-edge");
  rect(data.skill.chip,"skill-chip");
  label(data.skill.chip.label,data.labels.thin,"chip-text");

  for(const barrier of data.physical){
    rect(barrier,"physical");
    add("rect",{
      x:sx(barrier.edge[0]),y:sy(barrier.edge[1]),
      width:sx(barrier.edge[2])-sx(0),
      height:sy(barrier.edge[3])-sy(0),
      class:"physical-edge"
    });
    rect(barrier.chip,"physical-edge");
    label(barrier.chip.label,data.labels.stays,"chip-text");
  }

  for(const card of data.cards){
    const cardClass=card.kind==="skill" ? "barrier-card-skill" : "barrier-card-physical";
    rect(card,cardClass);
    if(card.kind==="skill"){
      label(card.title,data.labels.skillTitle,"card-title card-skill","start");
      label(card.note,data.labels.skillNote,"card-note","start");
    }else if(card.id==="buy"){
      label(card.title,data.labels.buyTitle,"card-title card-physical","start");
      label(card.note,data.labels.buyNote,"card-note","start");
    }else{
      label(card.title,data.labels.gearTitle,"card-title card-physical","start");
      label(card.note,data.labels.gearNote,"card-note","start");
    }
  }

  for(const segment of data.icons.skill) line(segment,"icon-skill");
  for(const segment of data.icons.buy) line(segment,"icon-physical");
  for(const segment of data.icons.gear) line(segment,"icon-physical");

  rect(data.takeaway,"takeaway");
  label(data.takeaway.main,data.labels.takeawayMain,"takeaway-main");
  label(data.takeaway.note,data.labels.takeawayNote,"takeaway-note");

  svg.style.setProperty("--line-width",`${LINE_WIDTH}`);
  svg.style.setProperty("--font-size",`${FONT_SIZE}px`);
  svg.style.setProperty("--label-offset",`${LABEL_OFFSET}px`);
}catch(error){
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  if(svg) svg.hidden=true;
  if(fallback) fallback.hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
