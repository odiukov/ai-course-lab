<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь от плоского кадра к облаку точек</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f7f8fc;
    --panel:#ffffff;
    --ink:#172033;
    --muted:#667085;
    --line:#9aa4b2;
    --soft:#e6eaf0;
    --accent:#2667d8;
    --accent-soft:#dce8ff;
    --depth-near:#f39b38;
    --depth-mid:#4bb7a5;
    --depth-far:#5669c9;
    --table:#8994a5;
    --wall:#c2c9d3;
    --cup:#ef6d78;
    --cup-dark:#bd4053;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#111722;
      --panel:#192231;
      --ink:#edf2fa;
      --muted:#aab5c4;
      --line:#7d8a9d;
      --soft:#303b4c;
      --accent:#76a7ff;
      --accent-soft:#263d63;
      --depth-near:#ffb35c;
      --depth-mid:#62d2bc;
      --depth-far:#8d9cff;
      --table:#a1acbc;
      --wall:#667286;
      --cup:#ff7f8a;
      --cup-dark:#ffadb5;
    }
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink)}
  body{margin:auto;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  figure{margin:auto;background:var(--bg)}
  header{
    color:var(--ink);
    font-size:22px;
    font-weight:bold;
    text-align:center;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:490px;
    background:var(--bg);
  }
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .stage{fill:var(--ink);font-size:18px;font-weight:bold}
  .label{fill:var(--ink);font-size:15px}
  .small{fill:var(--muted);font-size:13px}
  .badge{fill:var(--accent);font-size:15px;font-weight:bold}
  .panel{fill:var(--panel);stroke:var(--line);stroke-width:2px}
  .soft{fill:var(--soft)}
  .accent-soft{fill:var(--accent-soft)}
  .outline{fill:none;stroke:var(--ink);stroke-width:2px;stroke-linejoin:round}
  .line{fill:none;stroke:var(--line);stroke-width:2px;stroke-linecap:round}
  .axis{fill:none;stroke:var(--ink);stroke-width:2px;stroke-linecap:round}
  .flow{fill:none;stroke:var(--accent);stroke-width:3px;stroke-linecap:round}
  .ray{fill:none;stroke:var(--depth-mid);stroke-width:2px;stroke-linecap:round}
  .box{fill:none;stroke:var(--cup-dark);stroke-width:3px}
  .near{fill:var(--depth-near)}
  .mid{fill:var(--depth-mid)}
  .far{fill:var(--depth-far)}
  .table{fill:var(--table)}
  .wall{fill:var(--wall)}
  .cup{fill:var(--cup)}
  .cup-dark{fill:var(--cup-dark)}
  .legend{fill:var(--panel);stroke:var(--soft);stroke-width:2px}
  #fallback{
    color:var(--ink);
    background:var(--panel);
    font-size:16px;
    text-align:center;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <header id="diagram-title">Путь от плоского кадра к облаку точек</header>
  <svg id="diagram" viewBox="0 0 1180 460" width="1180" height="460"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="RGB-изображение проходит через модель глубины и камеру-обскуру и превращается в облако из 76 800 точек с координатами X, Y, Z">
  </svg>
  <p id="fallback" hidden>
    RGB-изображение 240 × 320 проходит через модель глубины и камеру-обскуру,
    превращаясь в 76 800 точек с координатами X, Y, Z.
  </p>
</figure>
<script>
const data={
  ox:20,oy:8,scale:1,zero:0,
  arrowLength:13,arrowWidth:7,corner:12,dot:4,pinhole:6,
  dash:8,gap:7,
  frame:[35,82,265,255],
  imageParts:[
    ["soft",35,82,230,104],["table",35,186,230,69],
    ["cup",128,132,55,74],["cup-dark",181,151,25,40]
  ],
  cupOutline:[[128,132],[183,132],[183,206],[128,206]],
  cupHandle:[[183,151],[206,151],[206,191],[183,191]],
  detection:[116,121,101,96],
  model:[335,108,165,140],
  depthCells:[
    ["far",352,126,44,32],["far",398,126,41,32],["mid",441,126,42,32],
    ["far",352,160,44,32],["mid",398,160,41,32],["near",441,160,42,32],
    ["mid",352,194,44,32],["near",398,194,41,32],["near",441,194,42,32]
  ],
  cameraBody:[[650,181],[680,165],[710,181],[710,235],[680,251],[650,235]],
  plane:[586,126,586,282],
  aperture:[680,208],
  rays:[
    [602,145,760,116,"far"],[602,176,760,162,"mid"],
    [602,208,760,208,"near"],[602,240,760,258,"mid"],
    [602,271,760,302,"far"]
  ],
  cloud:[
    [850,129,"wall"],[878,116,"wall"],[908,124,"wall"],[939,108,"wall"],
    [973,118,"wall"],[1006,104,"wall"],[1040,119,"wall"],[1074,109,"wall"],
    [1105,126,"wall"],[864,158,"wall"],[900,147,"wall"],[1092,157,"wall"],
    [850,257,"table"],[879,248,"table"],[908,263,"table"],[939,249,"table"],
    [970,268,"table"],[1002,253,"table"],[1033,267,"table"],[1064,250,"table"],
    [1096,265,"table"],[865,281,"table"],[901,287,"table"],[940,279,"table"],
    [979,294,"table"],[1017,281,"table"],[1051,291,"table"],[1085,280,"table"],
    [938,151,"far"],[959,143,"far"],[981,147,"far"],[1002,143,"far"],
    [1020,155,"far"],[933,171,"mid"],[956,166,"mid"],[981,169,"mid"],
    [1005,165,"mid"],[1024,176,"mid"],[936,193,"mid"],[958,187,"mid"],
    [983,191,"mid"],[1007,187,"mid"],[1025,197,"mid"],[940,216,"near"],
    [961,211,"near"],[984,215,"near"],[1005,211,"near"],[1021,220,"near"],
    [946,236,"near"],[967,231,"near"],[990,235,"near"],[1011,232,"near"],
    [1040,177,"mid"],[1061,174,"mid"],[1075,187,"mid"],[1065,201,"near"],
    [1043,203,"near"],[1035,187,"mid"]
  ],
  cloudDot:[4,5,6],
  axisOrigin:[861,315],
  axes:[[918,315,"X",927,320],[841,271,"Y",835,263],[890,345,"Z",896,354]],
  arrows:[[270,170,323,170],[510,170,568,170],[782,208,826,208]],
  labels:[
    ["stage",150,53,"RGB-изображение","middle"],
    ["stage",418,53,"Модель глубины","middle"],
    ["stage",680,53,"Камера-обскура","middle"],
    ["stage",978,53,"Облако точек","middle"],
    ["badge",150,286,"240 × 320 пикселей","middle"],
    ["small",418,274,"глубина для каждого пикселя","middle"],
    ["small",548,145,"карта глубины","middle"],
    ["small",680,322,"направление луча + глубина","middle"],
    ["badge",978,331,"76 800 точек (X, Y, Z)","middle"]
  ],
  legend:[130,374,880,67],
  legendLabels:[
    ["label",570,400,"Пиксель + глубина + параметры камеры → точка (X, Y, Z)","middle"],
    ["badge",570,426,"Весь кадр: 240 × 320 → 76 800 точек","middle"]
  ]
};
const origin={x:data.ox,y:data.oy};
const scale=data.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";
  const make=(name,attrs,cls)=>{
    const node=document.createElementNS(ns,name);
    for(const key in attrs) node.setAttribute(key,attrs[key]);
    if(cls) node.setAttribute("class",cls);
    svg.appendChild(node);
    return node;
  };
  const rect=(x,y,w,h,cls,r=data.zero)=>make("rect",{
    x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),
    rx:sx(r)-sx(data.zero),ry:sy(r)-sy(data.zero)
  },cls);
  const line=(x1,y1,x2,y2,cls)=>make("line",{
    x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2)
  },cls);
  const circle=(x,y,r,cls)=>make("circle",{
    cx:sx(x),cy:sy(y),r:sx(r)-sx(data.zero)
  },cls);
  const path=(points,cls,closed)=>{
    const commands=points.map((point,index)=>
      (index?"L":"M")+sx(point[0])+" "+sy(point[1])
    ).join(" ");
    return make("path",{d:commands+(closed?" Z":"")},cls);
  };
  const text=(x,y,value,cls,anchor)=>{
    const node=make("text",{x:sx(x),y:sy(y),"text-anchor":anchor},cls);
    node.textContent=value;
    return node;
  };
  const arrow=(x1,y1,x2,y2,cls)=>{
    line(x1,y1,x2,y2,cls);
    const dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy);
    const ux=dx/length,uy=dy/length;
    const bx=x2-ux*data.arrowLength;
    const by=y2-uy*data.arrowLength;
    const px=-uy*data.arrowWidth;
    const py=ux*data.arrowWidth;
    path([[x2,y2],[bx+px,by+py],[bx-px,by-py]],cls,true);
  };

  data.labels.forEach(label=>text(label[1],label[2],label[3],label[0],label[4]));

  rect(data.frame[0],data.frame[1],data.frame[2]-data.frame[0],
       data.frame[3]-data.frame[1],"panel",data.corner);
  data.imageParts.forEach(part=>rect(part[1],part[2],part[3],part[4],part[0]));
  path(data.cupOutline,"outline",true);
  path(data.cupHandle,"outline",false);
  const box=rect(data.detection[0],data.detection[1],data.detection[2],
                 data.detection[3],"box");
  box.setAttribute("stroke-dasharray",
    (sx(data.dash)-sx(data.zero))+" "+(sx(data.gap)-sx(data.zero)));

  rect(data.model[0],data.model[1],data.model[2],data.model[3],"panel",data.corner);
  data.depthCells.forEach(cell=>rect(cell[1],cell[2],cell[3],cell[4],cell[0]));

  data.arrows.forEach(item=>arrow(item[0],item[1],item[2],item[3],"flow"));

  path(data.cameraBody,"accent-soft",true);
  path(data.cameraBody,"outline",true);
  line(data.plane[0],data.plane[1],data.plane[2],data.plane[3],"axis");
  circle(data.aperture[0],data.aperture[1],data.pinhole,"cup-dark");
  data.rays.forEach(ray=>{
    line(ray[0],ray[1],data.aperture[0],data.aperture[1],"ray");
    line(data.aperture[0],data.aperture[1],ray[2],ray[3],"ray");
    circle(ray[0],ray[1],data.dot,ray[4]);
    circle(ray[2],ray[3],data.dot,ray[4]);
  });

  data.cloud.forEach(point=>{
    const radius=point[2]==="wall"?data.cloudDot[0]:
                 point[2]==="table"?data.cloudDot[1]:data.cloudDot[2];
    circle(point[0],point[1],radius,point[2]);
  });

  data.axes.forEach(axis=>{
    arrow(data.axisOrigin[0],data.axisOrigin[1],axis[0],axis[1],"axis");
    text(axis[3],axis[4],axis[2],"label","middle");
  });
  circle(data.axisOrigin[0],data.axisOrigin[1],data.dot,"cup-dark");

  rect(data.legend[0],data.legend[1],data.legend[2],data.legend[3],
       "legend",data.corner);
  data.legendLabels.forEach(label=>
    text(label[1],label[2],label[3],label[0],label[4])
  );
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
