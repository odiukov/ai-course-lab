<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Один цикл для AlphaZero, MuZero и GRPO</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --ink: midnightblue;
      --muted: slategray;
      --line: steelblue;
      --loop: darkorange;
      --header: aliceblue;
      --generate: azure;
      --improve: lavenderblush;
      --update: honeydew;
      --card-line: lightsteelblue;
      --badge: white;
      --footer: ghostwhite;
      --shadow: gainsboro;
      --error: firebrick;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: aliceblue;
        --muted: lightsteelblue;
        --line: lightskyblue;
        --loop: orange;
        --header: midnightblue;
        --generate: #132b36;
        --improve: #35243d;
        --update: #17352c;
        --card-line: slategray;
        --badge: #111827;
        --footer: #172033;
        --shadow: #090d16;
        --error: lightsalmon;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
    }

    .figure {
      background: var(--page);
      width: 100%;
    }

    h1 {
      box-sizing: border-box;
      margin: 0;
      padding: 12px 16px 8px;
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--page);
    }

    .lane-header {
      fill: var(--header);
      stroke: var(--card-line);
      stroke-width: 2px;
    }

    .card {
      stroke: var(--card-line);
      stroke-width: 2px;
    }

    .stage-generate {
      fill: var(--generate);
    }

    .stage-improve {
      fill: var(--improve);
    }

    .stage-update {
      fill: var(--update);
    }

    .badge {
      fill: var(--badge);
      stroke: var(--card-line);
      stroke-width: 1px;
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .loop {
      fill: none;
      stroke: var(--loop);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-head {
      fill: var(--line);
    }

    .loop-head {
      fill: var(--loop);
    }

    .lane-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .lane-subtitle {
      fill: var(--muted);
      font-size: 12px;
    }

    .stage-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .04em;
    }

    .main-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .detail-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .return-label {
      fill: var(--loop);
      font-size: 12px;
      font-weight: bold;
    }

    .footer-box {
      fill: var(--footer);
      stroke: var(--card-line);
      stroke-width: 2px;
    }

    .footer-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--error);
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Один цикл для AlphaZero, MuZero и GRPO</h1>
    <svg
      id="cycle-diagram"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Три параллельных контура обучения</title>
      <desc id="svg-description">
        AlphaZero, MuZero и GRPO проходят одинаковые стадии: генерируют
        траектории, улучшают цель и обновляют политику.
      </desc>
      <g id="drawing"></g>
    </svg>
  </main>

  <script>
    const DATA = Object.freeze({
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      zero: 0,
      radius: 12,
      badgeRadius: 8,
      laneWidth: 350,
      laneHeaderY: 18,
      laneHeaderHeight: 58,
      laneTitleY: 43,
      laneSubtitleY: 64,
      cardX: 15,
      cardWidth: 290,
      cardHeight: 82,
      badgeX: 29,
      badgeWidth: 262,
      badgeHeight: 23,
      stageLabelX: 160,
      mainLabelX: 160,
      loopLabelX: 326,
      footer: {
        x: 40,
        y: 410,
        width: 1120,
        height: 32,
        textX: 600,
        textY: 431,
        text: "найти лучше текущей привычки  →  превратить находку в новую привычку"
      },
      stages: [
        {
          key: "generate",
          y: 90,
          badgeY: 98,
          stageTextY: 114,
          mainY: 140,
          detailY: 160,
          label: "ГЕНЕРАЦИЯ ТРАЕКТОРИИ"
        },
        {
          key: "improve",
          y: 200,
          badgeY: 208,
          stageTextY: 224,
          mainY: 250,
          detailY: 270,
          label: "УЛУЧШЕНИЕ ЦЕЛИ"
        },
        {
          key: "update",
          y: 310,
          badgeY: 318,
          stageTextY: 334,
          mainY: 360,
          detailY: 380,
          label: "ОБНОВЛЕНИЕ ПОЛИТИКИ"
        }
      ],
      arrows: [
        {
          kind: "flow",
          points: [
            { x: 160, y: 172 },
            { x: 160, y: 200 }
          ],
          head: [
            { x: 160, y: 200 },
            { x: 153, y: 191 },
            { x: 167, y: 191 }
          ]
        },
        {
          kind: "flow",
          points: [
            { x: 160, y: 282 },
            { x: 160, y: 310 }
          ],
          head: [
            { x: 160, y: 310 },
            { x: 153, y: 301 },
            { x: 167, y: 301 }
          ]
        },
        {
          kind: "loop",
          points: [
            { x: 305, y: 351 },
            { x: 334, y: 351 },
            { x: 334, y: 131 },
            { x: 305, y: 131 }
          ],
          head: [
            { x: 305, y: 131 },
            { x: 315, y: 124 },
            { x: 315, y: 138 }
          ]
        }
      ],
      lanes: [
        {
          x: 40,
          title: "AlphaZero",
          subtitle: "поиск по известным правилам",
          returnLabel: "снова",
          cards: {
            generate: {
              main: "Self-play по точным правилам",
              detail: "сеть предлагает ходы"
            },
            improve: {
              main: "MCTS по реальным позициям",
              detail: "посещения поиска → сильная цель"
            },
            update: {
              main: "Policy-value сеть учится",
              detail: "приближаясь к результату поиска"
            }
          }
        },
        {
          x: 425,
          title: "MuZero",
          subtitle: "поиск внутри выученной модели",
          returnLabel: "снова",
          cards: {
            generate: {
              main: "Self-play текущей политики",
              detail: "сеть предлагает действия"
            },
            improve: {
              main: "MCTS в латентном мире",
              detail: "модель разворачивает продолжения"
            },
            update: {
              main: "Сети h, g, f учатся",
              detail: "приближаясь к результату поиска"
            }
          }
        },
        {
          x: 810,
          title: "GRPO",
          subtitle: "сравнение попыток внутри группы",
          returnLabel: "снова",
          cards: {
            generate: {
              main: "Одна задача → 8 ответов",
              detail: "LLM сэмплирует траектории"
            },
            improve: {
              main: "Сравнение наград в группе",
              detail: "удачные усиливаются, неудачные ослабляются"
            },
            update: {
              main: "LLM делает GRPO-шаг",
              detail: "приближаясь к лучшим траекториям"
            }
          }
        }
      ],
      fallback: {
        x: 600,
        y: 205,
        lines: [
          {
            y: 205,
            text: "Схема должна была показать три параллельных цикла:"
          },
          {
            y: 232,
            text: "траектория → улучшенная цель → обновлённая политика → новый цикл."
          }
        ]
      }
    });

    const origin = Object.freeze(DATA.origin);
    const scale = Object.freeze(DATA.scale);

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");

      const make = (name, attributes, text) => {
        const node = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, value);
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        return node;
      };

      const rect = (x, y, width, height, cssClass, radius) => make("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(radius) - sx(DATA.zero),
        ry: sy(radius) - sy(DATA.zero),
        class: cssClass
      });

      const text = (x, y, value, cssClass, anchor) => make("text", {
        x: sx(x),
        y: sy(y),
        class: cssClass,
        "text-anchor": anchor
      }, value);

      const polyline = (laneX, arrow) => make("polyline", {
        points: arrow.points
          .map(point => `${sx(laneX + point.x)},${sy(point.y)}`)
          .join(" "),
        class: arrow.kind
      });

      const arrowHead = (laneX, arrow) => make("polygon", {
        points: arrow.head
          .map(point => `${sx(laneX + point.x)},${sy(point.y)}`)
          .join(" "),
        class: `${arrow.kind}-head`
      });

      for (const lane of DATA.lanes) {
        const group = make("g", {
          "aria-label": lane.title
        });

        group.appendChild(rect(
          lane.x,
          DATA.laneHeaderY,
          DATA.laneWidth,
          DATA.laneHeaderHeight,
          "lane-header",
          DATA.radius
        ));

        group.appendChild(text(
          lane.x + DATA.laneWidth / DATA.scale.x / (DATA.scale.x + DATA.scale.x),
          DATA.laneTitleY,
          lane.title,
          "lane-title",
          "middle"
        ));

        group.appendChild(text(
          lane.x + DATA.laneWidth / DATA.scale.x / (DATA.scale.x + DATA.scale.x),
          DATA.laneSubtitleY,
          lane.subtitle,
          "lane-subtitle",
          "middle"
        ));

        for (const stage of DATA.stages) {
          const card = lane.cards[stage.key];

          group.appendChild(rect(
            lane.x + DATA.cardX,
            stage.y,
            DATA.cardWidth,
            DATA.cardHeight,
            `card stage-${stage.key}`,
            DATA.radius
          ));

          group.appendChild(rect(
            lane.x + DATA.badgeX,
            stage.badgeY,
            DATA.badgeWidth,
            DATA.badgeHeight,
            "badge",
            DATA.badgeRadius
          ));

          group.appendChild(text(
            lane.x + DATA.stageLabelX,
            stage.stageTextY,
            stage.label,
            "stage-label",
            "middle"
          ));

          group.appendChild(text(
            lane.x + DATA.mainLabelX,
            stage.mainY,
            card.main,
            "main-label",
            "middle"
          ));

          group.appendChild(text(
            lane.x + DATA.mainLabelX,
            stage.detailY,
            card.detail,
            "detail-label",
            "middle"
          ));
        }

        for (const arrow of DATA.arrows) {
          group.appendChild(polyline(lane.x, arrow));
          group.appendChild(arrowHead(lane.x, arrow));
        }

        group.appendChild(text(
          lane.x + DATA.loopLabelX,
          DATA.stages[DATA.scale.x].mainY,
          lane.returnLabel,
          "return-label",
          "end"
        ));

        drawing.appendChild(group);
      }

      drawing.appendChild(rect(
        DATA.footer.x,
        DATA.footer.y,
        DATA.footer.width,
        DATA.footer.height,
        "footer-box",
        DATA.radius
      ));

      drawing.appendChild(text(
        DATA.footer.textX,
        DATA.footer.textY,
        DATA.footer.text,
        "footer-text",
        "middle"
      ));
    } catch (error) {
      const SVG_NS = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      drawing.replaceChildren();

      for (const line of DATA.fallback.lines) {
        const message = document.createElementNS(SVG_NS, "text");
        message.setAttribute("x", sx(DATA.fallback.x));
        message.setAttribute("y", sy(line.y));
        message.setAttribute("text-anchor", "middle");
        message.setAttribute("class", "fallback");
        message.textContent = line.text;
        drawing.appendChild(message);
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
