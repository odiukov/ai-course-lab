<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Раскладка, удобная для кэша</title>
<style>
  :root{
    --bg:#fdfdfb; --ink:#1b2330; --muted:#5c6675; --edge:#c3cbd6;
    --cold:#eef2f6; --warm:#fdf0d5; --band:#f2b544; --cut:#c2410c; --btn:#e7ecf2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --ink:#e6ebf1; --muted:#9aa6b4; --edge:#3b4653;
      --cold:#222a33; --warm:#3b3222; --band:#a8781f; --cut:#fb923c; --btn:#252d37;
    }
  }
  body{margin:0;padding:14px;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  h2{font-size:15px;margin:0 0 8px;font-weight:600;}
  .ctl{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
  button{font:inherit;font-size:12.5px;padding:5px 10px;border-radius:6px;cursor:pointer;
         border:1px solid var(--edge);background:var(--btn);color:var(--ink);}
  button[aria-pressed="true"]{border-color:var(--cut);color:var(--cut);font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .blk{stroke:var(--edge);stroke-width:1;}
  .cold{fill:var(--cold);} .warm{fill:var(--warm);}
  .band{fill:var(--band);opacity:.28;}
  .name{fill:var(--ink);font-size:13px;}
  .num{fill:var(--ink);font-size:13px;font-weight:600;}
  .note{fill:var(--muted);font-size:10.5px;}
  .cut{stroke:var(--cut);stroke-width:2;stroke-dasharray:7 5;}
  .cutlbl{fill:var(--cut);font-size:12px;font-weight:600;}
  .brk{stroke:var(--band);stroke-width:2;fill:none;}
  .brklbl{fill:var(--muted);font-size:12px;}
  .total{fill:var(--muted);font-size:12.5px;}
  #fb{font-size:13px;line-height:1.5;color:var(--ink);}
</style>
<h2>Раскладка, удобная для кэша: один разрез сверху вниз</h2>
<div class="ctl" id="ctl"></div>
<svg id="s" viewBox="0 0 730 444" role="img" aria-label="Стек из шести слоёв запроса с границей кэша"></svg>
<div id="fb"></div>
<script>
(function(){
  var DATA = {
    blocks: [
      {name:'системный промпт',        tokens:4000,  note:'кэшируем',                  y0:0,    y1:1},
      {name:'определения инструментов',tokens:1500,  note:'кэшируем',                  y0:1.25, y1:2.25},
      {name:'few-shot примеры',        tokens:3000,  note:'кэшируем',                  y0:2.5,  y1:3.5},
      {name:'найденные документы',     tokens:20000, note:'только если корпус тот же', y0:3.75, y1:4.75},
      {name:'история разговора',       tokens:6000,  note:'до последнего хода',        y0:5,    y1:6},
      {name:'текущее сообщение',       tokens:200,   note:'никогда не кэшируем',       y0:6.25, y1:7.25}
    ],
    left:0, right:8, labelX:8.2, bracketX:-0.45, tickX:-0.31, pad:0.15, totalY:7.72,
    modes:[
      {id:'stable', label:'Документы те же на каждый запрос', cut:3},
      {id:'fresh',  label:'Документы ищутся под каждый вопрос', cut:2}
    ]
  };
  var ORIGIN = {x:150, y:26}, SCALE = 52;
  function sx(x){ return ORIGIN.x + x * SCALE; }
  function sy(y){ return ORIGIN.y + y * SCALE; }

  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('s'), ctl=document.getElementById('ctl');
  var fmt=function(n){ return n.toLocaleString('ru-RU'); };
  var mode=0;

  function el(tag,attrs,text){
    var n=document.createElementNS(NS,tag);
    for(var k in attrs) n.setAttribute(k,attrs[k]);
    if(text!=null) n.textContent=text;
    svg.appendChild(n); return n;
  }

  function draw(){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var B=DATA.blocks, cut=DATA.modes[mode].cut;
    var cutY=(B[cut].y1 + B[cut+1].y0)/2;
    var warm=0, total=0, i;
    for(i=0;i<B.length;i++){ total+=B[i].tokens; if(i<=cut) warm+=B[i].tokens; }

    // сплошная тёплая полоса от первого токена до границы
    el('rect',{x:sx(DATA.left-DATA.pad), y:sy(B[0].y0-DATA.pad),
               width:sx(DATA.right+DATA.pad)-sx(DATA.left-DATA.pad),
               height:sy(cutY)-sy(B[0].y0-DATA.pad), rx:6, 'class':'band'});

    for(i=0;i<B.length;i++){
      var b=B[i], mid=(b.y0+b.y1)/2;
      el('rect',{x:sx(DATA.left), y:sy(b.y0), width:sx(DATA.right)-sx(DATA.left),
                 height:sy(b.y1)-sy(b.y0), rx:4, 'class':'blk '+(i<=cut?'warm':'cold')});
      el('text',{x:sx(DATA.left)+12, y:sy(mid), 'text-anchor':'start',
                 'dominant-baseline':'middle', 'class':'name'}, b.name);
      el('text',{x:sx(DATA.labelX), y:sy(mid)-5, 'text-anchor':'start', 'class':'num'},
                 fmt(b.tokens)+' токенов');
      el('text',{x:sx(DATA.labelX), y:sy(mid)+11, 'text-anchor':'start', 'class':'note'}, b.note);
    }

    // граница кэша
    el('line',{x1:sx(DATA.left-DATA.pad), y1:sy(cutY), x2:sx(DATA.right+DATA.pad), y2:sy(cutY),
               'class':'cut'});
    el('text',{x:sx(DATA.labelX), y:sy(cutY), 'text-anchor':'start',
               'dominant-baseline':'middle', 'class':'cutlbl'}, 'граница кэша');

    // скобка тёплой зоны слева
    el('path',{d:'M'+sx(DATA.tickX)+' '+sy(B[0].y0)+' H'+sx(DATA.bracketX)+
                 ' V'+sy(cutY)+' H'+sx(DATA.tickX), 'class':'brk'});
    var bx=sx(DATA.bracketX)-14, by=(sy(B[0].y0)+sy(cutY))/2;
    el('text',{x:bx, y:by, 'text-anchor':'middle', 'class':'brklbl',
               transform:'rotate(-90 '+bx+' '+by+')'}, 'тёплый префикс '+fmt(warm));

    el('text',{x:sx(DATA.left), y:sy(DATA.totalY), 'text-anchor':'start', 'class':'total'},
       'Всего '+fmt(total)+' токенов · со скидкой '+fmt(warm)+
       ' · ниже границы — полная цена в каждом запросе');
  }

  function controls(){
    DATA.modes.forEach(function(m,i){
      var b=document.createElement('button');
      b.textContent=m.label;
      b.setAttribute('aria-pressed', i===mode ? 'true':'false');
      b.onclick=function(){
        mode=i;
        Array.prototype.forEach.call(ctl.children,function(c,j){
          c.setAttribute('aria-pressed', j===i ? 'true':'false');
        });
        draw();
      };
      ctl.appendChild(b);
    });
  }

  try{
    controls();
    draw();
  }catch(e){
    svg.remove();
    ctl.remove();
    document.getElementById('fb').textContent =
      'Схема должна была показать стек из шести слоёв запроса сверху вниз: '+
      'системный промпт 4 000 токенов, определения инструментов 1 500, few-shot примеры 3 000, '+
      'найденные документы 20 000, история разговора 6 000, текущее сообщение 200 — всего 34 700. '+
      'Тёплая зона — одна сплошная полоса от самого верха до единственной границы: '+
      'если документы стабильны, она проходит под ними и со скидкой читаются 28 500 токенов; '+
      'если документы ищутся под каждый вопрос, граница поднимается над ними и тёплыми остаются 8 500.';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
