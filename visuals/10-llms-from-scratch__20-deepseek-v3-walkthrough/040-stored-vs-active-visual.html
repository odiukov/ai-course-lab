<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>MoE-блок: память против вычислений</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b2430; --muted:#5c6675;
    --axis:#8b93a1; --grid:#e4e8ee;
    --idle:#c9ced6; --idle-line:#a8b0bb;
    --exp:#2f6fd0; --att:#e08a1e; --lead:#8b93a1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#10141a; --fg:#e6ebf2; --muted:#a3adbb;
      --axis:#6f7a8a; --grid:#232a34;
      --idle:#39414d; --idle-line:#59626f;
      --exp:#5b9bf5; --att:#f0b357; --lead:#6f7a8a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  figure{margin:0;padding:12px;background:var(--bg);}
  figcaption{font-size:15px;font-weight:600;margin:0 0 6px 2px;color:var(--fg);}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  #fallback{font-size:14px;line-height:1.5;color:var(--fg);}
  text{font-family:inherit;fill:var(--fg);}
  .lbl{font-size:14px;}
  .sml{font-size:13px;fill:var(--muted);}
  .big{font-size:15px;font-weight:600;}
  .tick{font-size:13px;fill:var(--muted);}
  .idle{fill:var(--idle);stroke:var(--idle-line);stroke-width:1;}
  .exp{fill:var(--exp);}
  .att{fill:var(--att);}
  .ax{stroke:var(--axis);stroke-width:1.5;fill:none;}
  .grid{stroke:var(--grid);stroke-width:1;}
  .lead{stroke:var(--lead);stroke-width:1.2;}
  .head{fill:var(--lead);}
  .cexp{fill:var(--exp);}
  .catt{fill:var(--att);}
</style>
</head>
<body>
<figure>
  <figcaption>Один MoE-блок DeepSeek-V3: что лежит в памяти и что работает на токен</figcaption>
  <svg id="svg" viewBox="0 0 940 480" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Столбик блока в памяти 11.5 млрд против активной части 0.54 млрд"></svg>
  <p id="fallback" hidden></p>
</figure>
<script>
(function(){
  var svg=document.getElementById('svg');
  try{
    /* --- данные схемы (млрд параметров по y, условные единицы по x) --- */
    var BARS=[
      {x0:0.0,x1:2.5,y0:0.000,y1:0.400,cls:'exp'},
      {x0:0.0,x1:2.5,y0:0.400,y1:0.544,cls:'att'},
      {x0:0.0,x1:2.5,y0:0.544,y1:11.444,cls:'idle'},
      {x0:4.4,x1:6.9,y0:0.000,y1:0.400,cls:'exp'},
      {x0:4.4,x1:6.9,y0:0.400,y1:0.544,cls:'att'}
    ];
    var TICKS=[0,2,4,6,8,10];

    /* --- единственный origin, единственный scale, единственная пара sx/sy --- */
    var ORIGIN={x:170,y:410}, SCALE=32;
    function sx(u){return ORIGIN.x+u*SCALE;}
    function sy(v){return ORIGIN.y-v*SCALE;}

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,c){return el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),'class':c});}
    function rect(b){el('rect',{x:sx(b.x0),y:sy(b.y1),width:sx(b.x1)-sx(b.x0),height:sy(b.y0)-sy(b.y1),'class':b.cls});}
    function text(x,y,dx,dy,anchor,cls,s){
      var t=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor,'class':cls});
      t.textContent=s;return t;
    }
    function arrow(x1,y1,x2,y2){
      line(x1,y1,x2,y2,'lead');
      var p=[[x2,y2],[x2-0.4,y2+0.16],[x2-0.4,y2-0.16]].map(function(q){return sx(q[0])+','+sy(q[1]);}).join(' ');
      el('polygon',{points:p,'class':'head'});
    }

    /* сетка и ось значений */
    TICKS.forEach(function(v){
      line(-0.4,v,7.0,v,'grid');
      line(-0.4,v,-0.15,v,'ax');
      text(-0.4,v,-8,4,'end','tick',String(v));
    });
    line(-0.4,0,-0.4,11.8,'ax');
    line(-0.4,0,7.0,0,'ax');
    var cap=text(-1.6,5.5,0,0,'middle','sml','млрд параметров');
    cap.setAttribute('transform','rotate(-90 '+sx(-1.6)+' '+sy(5.5)+')');

    /* столбики */
    BARS.forEach(rect);

    /* подписи столбика «в памяти» */
    text(1.25,11.444,0,-12,'middle','big','Лежит в памяти: 11.5 млрд');
    text(1.25,11.444,0,-30,'middle','sml','257 экспертов ≈ 11.3 млрд + attention 144 млн');
    text(1.25,0,0,20,'middle','lbl','весь блок');

    /* серая площадь */
    line(2.5,7,7.4,7,'lead');
    text(7.4,7,10,-6,'start','lbl','248 экспертов просто лежат:');
    text(7.4,7,10,14,'start','sml','ни одного умножения на этом токене');

    /* переход к активной части */
    arrow(2.5,0.27,4.4,0.27);
    text(2.7,0.27,0,-34,'start','lbl','цветом — то, что считает');

    /* подписи активного столбика */
    line(6.9,0.2,7.4,0.2,'lead');
    text(7.4,0.2,10,5,'start','lbl','9 экспертов × 44 млн ≈ 0.4 млрд');
    line(6.9,0.472,7.4,2.2,'lead');
    text(7.4,2.2,10,5,'start','lbl','attention 144 млн — работает целиком');
    text(5.65,0,0,20,'middle','big','работает: 0.54 млрд');

    /* нижние строки */
    text(-1.6,-1.0,0,0,'start','sml','9 из 257 экспертов = 3.5% работы; attention 144 млн — меньше 1.5% веса блока.');
    text(-1.6,-1.55,0,0,'start','sml','И так в каждом из 61 слоя: латент считается для каждого токена, выбирать там нечего.');
  }catch(e){
    svg.setAttribute('hidden','');
    var f=document.getElementById('fallback');
    f.removeAttribute('hidden');
    f.textContent='Схема не построилась. Она должна показывать два столбика одного MoE-блока: '+
      '«лежит в памяти» — 11.5 млрд (257 экспертов ≈ 11.3 млрд серым плюс attention 144 млн) и '+
      '«работает на токен» — 0.54 млрд (9 экспертов ≈ 0.4 млрд плюс те же 144 млн attention). '+
      '248 экспертов не делают ни одного умножения; 9 из 257 — это 3.5%, attention — меньше 1.5% веса блока, '+
      'но активен целиком в каждом из 61 слоя.';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
