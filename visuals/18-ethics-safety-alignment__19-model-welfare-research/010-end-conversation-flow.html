<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Граница вмешательства end-conversation</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #566176;
      --line: #68758c;
      --ordinary-fill: #e8f3ff;
      --ordinary-line: #3478b8;
      --risk-fill: #fff3dc;
      --risk-line: #c47713;
      --refusal-fill: #fff0e8;
      --refusal-line: #c85b31;
      --boundary-fill: #f4eafe;
      --boundary-line: #7d43ad;
      --end-fill: #fce8f0;
      --end-line: #b43968;
      --legend-fill: #f3f0f8;
      --shadow: rgba(32, 42, 62, 0.09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #181e29;
        --ink: #edf2fa;
        --muted: #b2bdd0;
        --line: #8995aa;
        --ordinary-fill: #18344d;
        --ordinary-line: #69afea;
        --risk-fill: #45351d;
        --risk-line: #e9aa50;
        --refusal-fill: #472b24;
        --refusal-line: #ef8d67;
        --boundary-fill: #352443;
        --boundary-line: #bd86e6;
        --end-fill: #472536;
        --end-line: #e77ba6;
        --legend-fill: #222937;
        --shadow: rgba(0, 0, 0, 0.24);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      background: var(--panel);
      box-shadow: 0 2px 12px var(--shadow);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      padding: 11px 18px 8px;
      border-bottom: 1px solid var(--legend-fill);
      font-size: 18px;
      line-height: 1.25;
      font-weight: 680;
      letter-spacing: 0.01em;
    }

    h1 code {
      color: var(--boundary-line);
      font: inherit;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linejoin: round;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--line);
      stroke: none;
    }

    .node {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .start {
      fill: var(--ordinary-fill);
      stroke: var(--ordinary-line);
    }

    .risk {
      fill: var(--risk-fill);
      stroke: var(--risk-line);
    }

    .ordinary {
      fill: var(--ordinary-fill);
      stroke: var(--ordinary-line);
    }

    .refusal {
      fill: var(--refusal-fill);
      stroke: var(--refusal-line);
    }

    .repeat {
      fill: var(--boundary-fill);
      stroke: var(--boundary-line);
    }

    .ending {
      fill: var(--end-fill);
      stroke: var(--end-line);
    }

    .separator {
      fill: none;
      stroke: var(--boundary-line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 590;
      dominant-baseline: middle;
      pointer-events: none;
    }

    .node-text {
      font-size: 14px;
    }

    .decision-text {
      font-size: 13px;
      font-weight: 650;
    }

    .branch-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .ending-text {
      fill: var(--end-line);
      font-size: 13px;
      font-weight: 720;
    }

    .legend {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 560;
    }

    .legend-key {
      fill: var(--boundary-line);
      font-weight: 730;
    }

    .fallback {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Граница вмешательства <code>end-conversation</code></h1>

    <svg
      id="diagram"
      viewBox="0 0 1000 470"
      width="1000"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Дерево решения для end-conversation</title>
      <desc id="svg-description">
        Обычный запрос ведёт к продолжению разговора. Запрос, относящийся
        к CSAM или содействию массовому насилию, получает отказ. Возможность
        завершить разговор появляется только при повторном запросе после отказа.
      </desc>
      <g id="drawing"></g>
    </svg>
  </main>

  <script>
    const data = [
      {
        kind: "config",
        arrowLength: 1.25,
        arrowHalf: 0.62,
        fallbackX: 50,
        fallbackY: 22,
        separatorLeft: 4,
        separatorRight: 96,
        separatorY: 42,
        legendX: 50,
        legendY: 45.2
      },

      {
        kind: "arrow",
        className: "flow",
        points: [
          { x: 18, y: 21 },
          { x: 22, y: 21 }
        ]
      },
      {
        kind: "arrow",
        className: "flow",
        points: [
          { x: 32, y: 12 },
          { x: 32, y: 7 },
          { x: 47, y: 7 }
        ]
      },
      {
        kind: "arrow",
        className: "flow",
        points: [
          { x: 42, y: 21 },
          { x: 47, y: 21 }
        ]
      },
      {
        kind: "arrow",
        className: "flow",
        points: [
          { x: 59, y: 21 },
          { x: 61, y: 21 }
        ]
      },
      {
        kind: "arrow",
        className: "flow",
        points: [
          { x: 70, y: 12.5 },
          { x: 70, y: 8 },
          { x: 84, y: 8 }
        ]
      },
      {
        kind: "arrow",
        className: "flow",
        points: [
          { x: 70, y: 29.5 },
          { x: 70, y: 35 },
          { x: 82, y: 35 }
        ]
      },

      {
        kind: "rect",
        className: "node start",
        x: 2,
        y: 17,
        width: 16,
        height: 8,
        textClass: "node-text",
        anchor: "middle",
        textX: 10,
        lines: [
          { y: 19.5, value: "Запрос" },
          { y: 22.5, value: "пользователя" }
        ]
      },
      {
        kind: "diamond",
        className: "node risk",
        cx: 32,
        cy: 21,
        rx: 10,
        ry: 9,
        textClass: "decision-text",
        anchor: "middle",
        textX: 32,
        lines: [
          { y: 17.7, value: "Категория риска?" },
          { y: 20.8, value: "CSAM или массовое" },
          { y: 23.9, value: "насилие" }
        ]
      },
      {
        kind: "rect",
        className: "node ordinary",
        x: 47,
        y: 3,
        width: 18,
        height: 8,
        textClass: "node-text",
        anchor: "middle",
        textX: 56,
        lines: [
          { y: 5.5, value: "Продолжить" },
          { y: 8.5, value: "разговор" }
        ]
      },
      {
        kind: "rect",
        className: "node refusal",
        x: 47,
        y: 17,
        width: 12,
        height: 8,
        textClass: "node-text",
        anchor: "middle",
        textX: 53,
        lines: [
          { y: 21, value: "Отказ" }
        ]
      },
      {
        kind: "diamond",
        className: "node repeat",
        cx: 70,
        cy: 21,
        rx: 9,
        ry: 8.5,
        textClass: "decision-text",
        anchor: "middle",
        textX: 70,
        lines: [
          { y: 19.3, value: "Повторный запрос" },
          { y: 22.7, value: "после отказа?" }
        ]
      },
      {
        kind: "rect",
        className: "node ordinary",
        x: 84,
        y: 4,
        width: 14,
        height: 8,
        textClass: "node-text",
        anchor: "middle",
        textX: 91,
        lines: [
          { y: 6.5, value: "Разговор" },
          { y: 9.5, value: "продолжается" }
        ]
      },
      {
        kind: "rect",
        className: "node ending",
        x: 82,
        y: 30,
        width: 16,
        height: 10,
        textClass: "ending-text",
        anchor: "middle",
        textX: 90,
        lines: [
          { y: 32.5, value: "Модель может" },
          { y: 35, value: "завершить" },
          { y: 37.5, value: "разговор" }
        ]
      },

      {
        kind: "label",
        className: "branch-label",
        x: 33.5,
        y: 4.8,
        anchor: "start",
        value: "нет: обычный запрос"
      },
      {
        kind: "label",
        className: "branch-label",
        x: 44.5,
        y: 19.2,
        anchor: "middle",
        value: "да"
      },
      {
        kind: "label",
        className: "branch-label",
        x: 74,
        y: 6.1,
        anchor: "start",
        value: "нет"
      },
      {
        kind: "label",
        className: "branch-label",
        x: 70,
        y: 32.2,
        anchor: "middle",
        value: "да: повтор"
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = 10;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const [config, ...items] = data;
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");

      const make = (tag, attributes, value) => {
        const element = document.createElementNS(namespace, tag);

        Object.entries(attributes).forEach(([name, attributeValue]) => {
          element.setAttribute(name, String(attributeValue));
        });

        if (value !== undefined) {
          element.textContent = value;
        }

        return element;
      };

      const drawArrow = item => {
        const reversed = [...item.points].reverse();
        const [tip, previous] = reversed;
        const dx = tip.x - previous.x;
        const dy = tip.y - previous.y;
        const length = Math.hypot(dx, dy);

        if (!length) {
          throw new Error("У стрелки совпали начало и конец");
        }

        const ux = dx / length;
        const uy = dy / length;
        const left = {
          x: tip.x - ux * config.arrowLength - uy * config.arrowHalf,
          y: tip.y - uy * config.arrowLength + ux * config.arrowHalf
        };
        const right = {
          x: tip.x - ux * config.arrowLength + uy * config.arrowHalf,
          y: tip.y - uy * config.arrowLength - ux * config.arrowHalf
        };

        const linePoints = item.points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        const headPoints = [tip, left, right]
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        drawing.appendChild(
          make("polyline", {
            class: item.className,
            points: linePoints
          })
        );

        drawing.appendChild(
          make("polygon", {
            class: "arrow-head",
            points: headPoints
          })
        );
      };

      const drawMultilineText = item => {
        const text = make("text", {
          class: item.textClass,
          "text-anchor": item.anchor
        });

        item.lines.forEach(line => {
          text.appendChild(
            make(
              "tspan",
              {
                x: sx(item.textX),
                y: sy(line.y)
              },
              line.value
            )
          );
        });

        drawing.appendChild(text);
      };

      const drawRect = item => {
        drawing.appendChild(
          make("rect", {
            class: item.className,
            x: sx(item.x),
            y: sy(item.y),
            width: sx(item.x + item.width) - sx(item.x),
            height: sy(item.y + item.height) - sy(item.y)
          })
        );

        drawMultilineText(item);
      };

      const drawDiamond = item => {
        const points = [
          { x: item.cx, y: item.cy - item.ry },
          { x: item.cx + item.rx, y: item.cy },
          { x: item.cx, y: item.cy + item.ry },
          { x: item.cx - item.rx, y: item.cy }
        ]
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        drawing.appendChild(
          make("polygon", {
            class: item.className,
            points
          })
        );

        drawMultilineText(item);
      };

      const drawLabel = item => {
        drawing.appendChild(
          make(
            "text",
            {
              class: item.className,
              x: sx(item.x),
              y: sy(item.y),
              "text-anchor": item.anchor
            },
            item.value
          )
        );
      };

      items
        .filter(item => item.kind === "arrow")
        .forEach(drawArrow);

      items
        .filter(item => item.kind === "rect")
        .forEach(drawRect);

      items
        .filter(item => item.kind === "diamond")
        .forEach(drawDiamond);

      items
        .filter(item => item.kind === "label")
        .forEach(drawLabel);

      drawing.appendChild(
        make("line", {
          class: "separator",
          x1: sx(config.separatorLeft),
          y1: sy(config.separatorY),
          x2: sx(config.separatorRight),
          y2: sy(config.separatorY)
        })
      );

      const legend = make("text", {
        class: "legend",
        x: sx(config.legendX),
        y: sy(config.legendY),
        "text-anchor": "middle"
      });

      legend.appendChild(
        make("tspan", { class: "legend-key" }, "Граница end-conversation: ")
      );
      legend.appendChild(
        make(
          "tspan",
          {},
          "категория риска + уже выданный отказ + повторный запрос"
        )
      );

      drawing.appendChild(legend);
    } catch (error) {
      const drawing = document.getElementById("drawing");
      const [config] = data;
      const namespace = "http://www.w3.org/2000/svg";
      const fallback = document.createElementNS(namespace, "text");

      drawing.replaceChildren();
      fallback.setAttribute("class", "fallback");
      fallback.setAttribute("x", String(sx(config.fallbackX)));
      fallback.setAttribute("y", String(sy(config.fallbackY)));
      fallback.setAttribute("text-anchor", "middle");
      fallback.textContent =
        "Схема: обычный запрос продолжается; риск получает отказ; лишь повтор после отказа допускает завершение разговора.";
      drawing.appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
