<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Полный маршрут изображения через ViT</title>
<style>
:root{
  --bg:#f8fafc;--card:#ffffff;--text:#172033;--muted:#526079;
  --line:#8794aa;--blue:#2563eb;--blue-soft:#dbeafe;
  --violet:#7c3aed;--violet-soft:#ede9fe;--amber:#b45309;
  --amber-soft:#fef3c7;--green:#15803d;--green-soft:#dcfce7;
  --red:#be123c;--red-soft:#ffe4e6;--cell:#bfdbfe;--ghost:#e2e8f0
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101522;--card:#182033;--text:#f1f5f9;--muted:#aebbd0;
    --line:#77849a;--blue:#60a5fa;--blue-soft:#172d4f;
    --violet:#c4b5fd;--violet-soft:#302750;--amber:#fbbf24;
    --amber-soft:#493416;--green:#4ade80;--green-soft:#173c2a;
    --red:#fb7185;--red-soft:#4a1d2a;--cell:#24466e;--ghost:#334155
  }
}
html,body{background:var(--bg)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
svg{display:block;width:100%;height:auto;max-height:500px;background:var(--bg)}
text{fill:var(--text);font-size:14px}
.title{font-size:22px;font-weight:bold}
.stage-title{font-size:15px;font-weight:bold}
.small{font-size:12px;fill:var(--muted)}
.tiny{font-size:11px}
.legend{font-size:15px;font-weight:bold;fill:var(--muted)}
.card{fill:var(--card);stroke:var(--line);stroke-width:2}
.flow{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.arrow{fill:var(--line)}
.blue{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2}
.violet{fill:var(--violet-soft);stroke:var(--violet);stroke-width:2}
.amber{fill:var(--amber-soft);stroke:var(--amber);stroke-width:2}
.green{fill:var(--green-soft);stroke:var(--green);stroke-width:2}
.red{fill:var(--red-soft);stroke:var(--red);stroke-width:2}
.ghost{fill:var(--ghost);stroke:var(--line);stroke-width:1}
.grid-cell{fill:var(--cell);stroke:var(--blue);stroke-width:1}
.ink{fill:none;stroke:var(--text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted-line{stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.answer{fill:var(--green-soft);stroke:var(--green);stroke-width:2}
.fallback{visibility:hidden}
.fallback.shown{visibility:visible}
</style>
</head>
<body>
<svg id="vit" viewBox="0 0 1400 500" width="1400" height="500"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Полный маршрут изображения через ViT</title>
  <desc id="svg-desc">Изображение превращается в патчи и токены, получает CLS-токен и позиционные представления, проходит через блоки энкодера и классификатор.</desc>
  <text id="diagram-title" class="title">Полный маршрут изображения через ViT</text>
  <g id="drawing"></g>
  <g id="fallback" class="fallback"></g>
</svg>
<script>
const data=[{
  title:{x:24,y:34},
  cards:[
    {x1:20,y1:60,x2:150,y2:420,cx:85,title:["Изображение"],kind:"image",
     layers:[{x1:38,y1:142,x2:118,y2:232,c:"red"},{x1:44,y1:136,x2:124,y2:226,c:"green"},{x1:50,y1:130,x2:130,y2:220,c:"blue"}],
     cat:[{x:69,y:179},{x:67,y:158},{x:79,y:168},{x:91,y:158},{x:89,y:179},{x:98,y:189},{x:94,y:204},{x:79,y:211},{x:64,y:204},{x:60,y:189}],
     eyes:[{x:71,y:185,r:2},{x:87,y:185,r:2}],labels:[["(3, 224, 224)",85,365],["фото кота",85,387]]},
    {x1:176,y1:60,x2:306,y2:420,cx:241,title:["Patch embedding"],kind:"patch",
     grid:{x1:197,y1:133,cell:6.3,count:14},labels:[["сетка 14 × 14",241,365],["196 патчей × 768",241,387]]},
    {x1:332,y1:60,x2:462,y2:420,cx:397,title:["Развёртка"],kind:"flat",
     tokens:[{x1:350,y1:145,x2:444,y2:166},{x1:350,y1:173,x2:444,y2:194},{x1:350,y1:201,x2:444,y2:222},{x1:350,y1:229,x2:444,y2:250},{x1:350,y1:285,x2:444,y2:306}],
     dots:{x:397,y:269},labels:[["196 токенов",397,365],["по 768 чисел",397,387]]},
    {x1:488,y1:60,x2:618,y2:420,cx:553,title:["Добавить [CLS]"],kind:"cls",
     cls:{x1:508,y1:139,x2:598,y2:178},tokens:[{x1:508,y1:190,x2:598,y2:211},{x1:508,y1:219,x2:598,y2:240},{x1:508,y1:248,x2:598,y2:269},{x1:508,y1:306,x2:598,y2:327}],
     dots:{x:553,y:288},labels:[["[CLS] — в начало",553,365],["остальные — патчи",553,387]]},
    {x1:644,y1:60,x2:774,y2:420,cx:709,title:["Позиционные","представления"],kind:"pos",
     rows:[{x1:662,y1:143,x2:756,y2:168,c:"blue"},{x1:662,y1:190,x2:756,y2:215,c:"violet"},{x1:662,y1:261,x2:756,y2:294,c:"amber"}],
     signs:[{t:"+",x:709,y:185},{t:"=",x:709,y:247}],labels:[["метка для",709,365],["каждого токена",709,387]]},
    {x1:800,y1:60,x2:955,y2:420,cx:877.5,title:["Энкодер"],kind:"encoder",
     blocks:[{x1:824,y1:132,x2:931,y2:180},{x1:824,y1:200,x2:931,y2:248},{x1:824,y1:286,x2:931,y2:334}],
     dots:{x:877.5,y:270},labels:[["N блоков",877.5,365],["обмен информацией",877.5,387]]},
    {x1:981,y1:60,x2:1111,y2:420,cx:1046,title:["Выбрать [CLS]"],kind:"take",
     ghosts:[{x1:997,y1:143,x2:1021,y2:177},{x1:1028,y1:143,x2:1052,y2:177},{x1:1059,y1:143,x2:1083,y2:177}],
     line:{x1:1046,y1:190,x2:1046,y2:242},token:{x1:1005,y1:251,x2:1087,y2:303},
     labels:[["только [CLS]",1046,365],["768 чисел",1046,387]]},
    {x1:1137,y1:60,x2:1380,y2:420,cx:1258.5,title:["Классификатор"],kind:"head",
     token:{x1:1155,y1:145,x2:1215,y2:180},line:{x1:1222,y1:162.5,x2:1250,y2:162.5},
     bars:[{x1:1260,y1:128,x2:1358,y2:153,t:"кот",x:1260,y:119,c:"green"},{x1:1260,y1:176,x2:1324,y2:201,t:"собака",x:1260,y:167,c:"violet"},{x1:1260,y1:224,x2:1303,y2:249,t:"автомобиль",x:1260,y:215,c:"blue"}],
     answer:{x1:1187,y1:292,x2:1330,y2:334},labels:[["оценки классов",1258.5,365],["ответ: «кот»",1258.5,387]]}
  ],
  arrows:[
    {x1:150,x2:176,y:240,h:[{x:176,y:240},{x:167,y:233},{x:167,y:247}]},
    {x1:306,x2:332,y:240,h:[{x:332,y:240},{x:323,y:233},{x:323,y:247}]},
    {x1:462,x2:488,y:240,h:[{x:488,y:240},{x:479,y:233},{x:479,y:247}]},
    {x1:618,x2:644,y:240,h:[{x:644,y:240},{x:635,y:233},{x:635,y:247}]},
    {x1:774,x2:800,y:240,h:[{x:800,y:240},{x:791,y:233},{x:791,y:247}]},
    {x1:955,x2:981,y:240,h:[{x:981,y:240},{x:972,y:233},{x:972,y:247}]},
    {x1:1111,x2:1137,y:240,h:[{x:1137,y:240},{x:1128,y:233},{x:1128,y:247}]}
  ],
  cardRadius:12,tokenRadius:5,eyeRadius:2,
  titleY:87,titleGap:18,legend:{x:700,y:475,text:["Пиксели → патчи → токены → общий смысл → класс"]},
  fallback:{x:700,lines:[{y:225,t:"Схема должна была показать полный маршрут изображения через ViT:"},{y:253,t:"изображение → 196 патчей → [CLS] и позиции → N блоков → классификатор."}]}
}];
const origin={x:0,y:0};
const scale={x:1,y:1};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const [d]=data;
const svg=document.getElementById("vit");
const layer=document.getElementById("drawing");
const fallback=document.getElementById("fallback");
const make=(tag,attrs,parent=layer)=>{
  const el=document.createElementNS(svg.namespaceURI,tag);
  for(const [key,value] of Object.entries(attrs))el.setAttribute(key,value);
  parent.appendChild(el);return el;
};
const rect=(q,cls,parent=layer)=>make("rect",{
  x:sx(q.x1),y:sy(q.y1),width:sx(q.x2)-sx(q.x1),height:sy(q.y2)-sy(q.y1),
  rx:sx(d.tokenRadius)-sx(0),ry:sy(d.tokenRadius)-sy(0),class:cls
},parent);
const line=(q,cls,parent=layer)=>make("line",{
  x1:sx(q.x1),y1:sy(q.y1),x2:sx(q.x2),y2:sy(q.y2),class:cls
},parent);
const polygon=(points,cls,parent=layer)=>make("polygon",{
  points:points.map(p=>`${sx(p.x)},${sy(p.y)}`).join(" "),class:cls
},parent);
const write=(lines,x,y,gap,cls,anchor="middle",parent=layer)=>{
  for(const [text,dy] of lines.map((text,index)=>[text,index*gap])){
    const el=make("text",{x:sx(x),y:sy(y+dy),class:cls,"text-anchor":anchor},parent);
    el.textContent=text;
  }
};
try{
  const heading=document.getElementById("diagram-title");
  heading.setAttribute("x",sx(d.title.x));
  heading.setAttribute("y",sy(d.title.y));

  for(const a of d.arrows){
    line({x1:a.x1,y1:a.y,x2:a.x2,y2:a.y},"flow");
    polygon(a.h,"arrow");
  }
  for(const card of d.cards){
    const frame=rect(card,"card");
    frame.setAttribute("rx",sx(d.cardRadius)-sx(0));
    frame.setAttribute("ry",sy(d.cardRadius)-sy(0));
    write(card.title,card.cx,d.titleY,d.titleGap,"stage-title");

    if(card.kind==="image"){
      for(const q of card.layers)rect(q,q.c);
      make("path",{d:card.cat.map((p,i)=>`${i?"L":"M"} ${sx(p.x)} ${sy(p.y)}`).join(" ")+" Z",class:"ink"});
      for(const e of card.eyes)make("circle",{cx:sx(e.x),cy:sy(e.y),r:sx(e.r)-sx(0),fill:"var(--text)"});
    }
    if(card.kind==="patch"){
      const g=card.grid;
      for(const row of Array.from({length:g.count},(_,i)=>i))
        for(const col of Array.from({length:g.count},(_,i)=>i)){
          const x=g.x1+col*g.cell,y=g.y1+row*g.cell;
          rect({x1:x,y1:y,x2:x+g.cell,y2:y+g.cell},"grid-cell");
        }
    }
    if(card.kind==="flat"){
      for(const q of card.tokens)rect(q,"blue");
      write(["…"],card.dots.x,card.dots.y,d.titleGap,"stage-title");
    }
    if(card.kind==="cls"){
      rect(card.cls,"green");write(["[CLS]"],card.cx,164,d.titleGap,"stage-title");
      for(const q of card.tokens)rect(q,"blue");
      write(["…"],card.dots.x,card.dots.y,d.titleGap,"stage-title");
    }
    if(card.kind==="pos"){
      for(const q of card.rows)rect(q,q.c);
      write(["токены"],card.cx,161,d.titleGap,"tiny");
      write(["позиции"],card.cx,208,d.titleGap,"tiny");
      write(["вход"],card.cx,282,d.titleGap,"tiny");
      for(const s of card.signs)write([s.t],s.x,s.y,d.titleGap,"stage-title");
    }
    if(card.kind==="encoder"){
      for(const q of card.blocks)rect(q,"amber");
      write(["токены ↔ токены"],card.cx,162,d.titleGap,"tiny");
      write(["обновление"],card.cx,230,d.titleGap,"tiny");
      write(["…"],card.dots.x,card.dots.y,d.titleGap,"stage-title");
      write(["новые токены"],card.cx,316,d.titleGap,"tiny");
    }
    if(card.kind==="take"){
      for(const q of card.ghosts)rect(q,"ghost");
      write(["[CLS]"],1009,165,d.titleGap,"tiny");
      line(card.line,"muted-line");polygon([{x:1046,y:248},{x:1039,y:239},{x:1053,y:239}],"arrow");
      rect(card.token,"green");write(["[CLS]"],card.cx,283,d.titleGap,"stage-title");
    }
    if(card.kind==="head"){
      rect(card.token,"green");write(["[CLS]"],1185,168,d.titleGap,"tiny");
      line(card.line,"muted-line");polygon([{x:1256,y:162.5},{x:1247,y:155.5},{x:1247,y:169.5}],"arrow");
      for(const b of card.bars){rect(b,b.c);write([b.t],b.x,b.y,d.titleGap,"tiny","start")}
      rect(card.answer,"answer");write(["кот"],1258.5,319,d.titleGap,"stage-title");
    }
    for(const label of card.labels)write([label[0]],label[1],label[2],d.titleGap,label[2]===365?"stage-title":"small");
  }
  write(d.legend.text,d.legend.x,d.legend.y,d.titleGap,"legend");
}catch(error){
  layer.replaceChildren();
  fallback.classList.add("shown");
  fallback.replaceChildren();
  for(const item of d.fallback.lines){
    const text=document.createElementNS(svg.namespaceURI,"text");
    text.setAttribute("x",sx(d.fallback.x));
    text.setAttribute("y",sy(item.y));
    text.setAttribute("text-anchor","middle");
    text.setAttribute("class","stage-title");
    text.textContent=item.t;
    fallback.appendChild(text);
  }
  console.error(error);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
