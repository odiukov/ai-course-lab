<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Сколько бит в событии</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a202c; --muted:#5a6472; --axis:#98a2b3;
    --grid:#e6e9ef; --bar:#2b6cb0; --barsoft:#bcd3ea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e6eaf0; --muted:#a2adbd; --axis:#5c6674;
      --grid:#242a33; --bar:#63b3ed; --barsoft:#2a4258;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 16px 12px;
        font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
  h2{margin:0 0 2px;font-size:16px}
  .sub{margin:0 0 8px;color:var(--muted);font-size:12.5px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{color:var(--muted);font-size:13px;white-space:pre-line}
</style>
<div class="wrap">
  <h2>Лестница удивления: сколько бит в событии</h2>
  <p class="sub">Шкала логарифмическая: каждое уменьшение вероятности вдвое добавляет ровно 1 бит.</p>
  <div id="slot"><p class="fail" id="fail"></p></div>
</div>
<script>
(function(){
  var slot=document.getElementById('slot'), fail=document.getElementById('fail');
  try{
    /* ---- данные схемы ---- */
    var DATA=[
      {name:'достоверное событие', p:'p = 1',       bits:0,    tag:'0 бит'},
      {name:'орёл монеты',         p:'p = 0.5',     bits:1.0,  tag:'1 бит'},
      {name:'шестёрка на кубике',  p:'p ≈ 0.167',   bits:2.58, tag:'2.58 бита'},
      {name:'один на тысячу',      p:'p = 0.001',   bits:9.97, tag:'9.97 бита'}
    ];
    var TICKS=[0,2,4,6,8,10];

    /* ---- одна система координат ---- */
    var ORIGIN={x:250,y:56}, SCALE=55;
    function sx(x){return ORIGIN.x + x*SCALE;}
    function sy(y){return ORIGIN.y + y*SCALE;}

    /* ---- пиксельные литералы: холст, отступы подписей, толщины, кегли ---- */
    var W=900,H=308, PAD=9, LW=1.4, FS=13, FS_SMALL=11.5;

    var NS='http://www.w3.org/2000/svg';
    function el(t,a){var n=document.createElementNS(NS,t);for(var k in a)n.setAttribute(k,a[k]);return n;}
    function txt(x,y,s,anchor,size,fill,weight){
      var n=el('text',{x:x,y:y,'text-anchor':anchor,'font-size':size,fill:fill,
        'font-family':'system-ui,-apple-system,Segoe UI,Roboto,sans-serif'});
      if(weight)n.setAttribute('font-weight',weight);
      n.appendChild(document.createTextNode(s));return n;
    }

    var svg=el('svg',{viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMid meet',
                      role:'img','aria-label':'Удивление событий в битах'});
    svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'var(--bg)'}));

    var AXIS_Y=3.6, TOP_Y=-0.55;

    /* сетка и засечки */
    TICKS.forEach(function(t){
      svg.appendChild(el('line',{x1:sx(t),y1:sy(TOP_Y),x2:sx(t),y2:sy(AXIS_Y),
        stroke:'var(--grid)','stroke-width':LW}));
      svg.appendChild(el('line',{x1:sx(t),y1:sy(AXIS_Y),x2:sx(t),y2:sy(AXIS_Y+0.09),
        stroke:'var(--axis)','stroke-width':LW}));
      svg.appendChild(txt(sx(t),sy(AXIS_Y+0.09)+PAD+4,String(t),'middle',FS_SMALL,'var(--muted)'));
    });

    /* ось бит со стрелкой */
    svg.appendChild(el('line',{x1:sx(0),y1:sy(AXIS_Y),x2:sx(10.35),y2:sy(AXIS_Y),
      stroke:'var(--axis)','stroke-width':LW}));
    svg.appendChild(el('polygon',{points:
      sx(10.6)+','+sy(AXIS_Y)+' '+sx(10.28)+','+sy(AXIS_Y-0.09)+' '+sx(10.28)+','+sy(AXIS_Y+0.09),
      fill:'var(--axis)'}));
    svg.appendChild(txt(sx(5),sy(AXIS_Y+0.62),'удивление, бит','middle',FS_SMALL,'var(--muted)'));

    /* ступени */
    DATA.forEach(function(d,i){
      var yTop=sy(i-0.19), yBot=sy(i+0.19), cy=sy(i);

      svg.appendChild(el('rect',{x:sx(0),y:yTop,width:Math.max(sx(d.bits)-sx(0),2.5),
        height:yBot-yTop,rx:3,fill:d.bits?'var(--bar)':'var(--barsoft)'}));

      /* подписи слева от начала шкалы: якорь end */
      svg.appendChild(txt(sx(0)-PAD,cy-3,d.name,'end',FS,'var(--fg)'));
      svg.appendChild(txt(sx(0)-PAD,cy+13,d.p,'end',FS_SMALL,'var(--muted)'));
      /* значение справа от конца ступени: якорь start */
      svg.appendChild(txt(sx(d.bits)+PAD,cy+4,d.tag,'start',FS,'var(--fg)','600'));
    });

    /* шаг «вдвое реже = +1 бит»: сбоку от середины отрезка, над линией */
    var yStep=sy(0.5);
    svg.appendChild(el('line',{x1:sx(0),y1:yStep,x2:sx(1),y2:yStep,
      stroke:'var(--axis)','stroke-width':LW,'stroke-dasharray':'4 3'}));
    svg.appendChild(el('line',{x1:sx(1),y1:sy(0.32),x2:sx(1),y2:sy(0.68),
      stroke:'var(--axis)','stroke-width':LW}));
    svg.appendChild(txt(sx(1)+PAD,yStep+4,'вероятность вдвое меньше  =  +1 бит',
      'start',FS_SMALL,'var(--muted)'));

    slot.innerHTML='';
    slot.appendChild(svg);
  }catch(e){
    fail.textContent=
      'Схема не построилась. Она показывает лестницу удивления в битах:\n'+
      'достоверное событие, p = 1 — 0 бит;\n'+
      'орёл монеты, p = 0.5 — 1 бит;\n'+
      'шестёрка на кубике, p ≈ 0.167 — 2.58 бита;\n'+
      'один на тысячу, p = 0.001 — 9.97 бита.\n'+
      'Шкала логарифмическая: уменьшение вероятности вдвое добавляет 1 бит.';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
