<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Энтропия монеты как функция p</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1d21;
    --muted: #5b6470;
    --axis: #6b7280;
    --curve: #1d6fd6;
    --mark: #c2410c;
    --grid: #dde2e8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #e8ecf1;
      --muted: #a0aab8;
      --axis: #8b95a3;
      --curve: #62a8ff;
      --mark: #ff9457;
      --grid: #2a2f38;
    }
  }
  html, body { margin: 0; background: var(--bg); }
  .wrap { background: var(--bg); color: var(--fg); padding: 8px 0 4px; }
  h2 {
    font: 600 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0 12px 4px;
    color: var(--fg);
  }
  svg { display: block; width: 100%; height: auto; max-height: 520px; }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--fg); }
  .ax { stroke: var(--axis); stroke-width: 1.5; fill: none; }
  .gr { stroke: var(--grid); stroke-width: 1; fill: none; }
  .cv { stroke: var(--curve); stroke-width: 2.5; fill: none; stroke-linejoin: round; }
  .mk { stroke: var(--mark); stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  .dot { fill: var(--mark); stroke: var(--bg); stroke-width: 1.5; }
  .dotc { fill: var(--curve); stroke: var(--bg); stroke-width: 1.5; }
  .lb { font-size: 12px; }
  .lbm { font-size: 12px; fill: var(--muted); }
  .lbk { font-size: 12px; fill: var(--mark); }
  .fail { font-size: 13px; padding: 0 12px; color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h2>Энтропия монеты H(p): максимум 1 бит при p = 0.5</h2>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById('host');
  try {
    // ---- данные схемы ----
    var W = 720, H = 430;
    var PAD = 6, FS = 12;                 // отступ подписи, размер шрифта
    var origin = { x: 96, y: 356 };       // пиксель точки (0, 0)
    var scale  = { x: 520, y: 280 };      // пикселей на единицу x / y

    var xTicks = [0, 0.5, 1];
    var yTicks = [0, 0.5, 1];
    var pMark = 0.99, hMark = 0.08;       // точка из текста шага
    var pTop = 0.5, hTop = 1;             // вершина
    var pFlat = 0.4, hFlat = 0.97;        // пологая вершина

    // ---- единственный перевод координат ----
    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y - y * scale.y; }

    function Hbin(p) {
      if (p <= 0 || p >= 1) return 0;
      return -(p * Math.log2(p) + (1 - p) * Math.log2(1 - p));
    }

    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    svg.setAttribute('role', 'img');

    function add(tag, attrs, cls, txt) {
      var e = document.createElementNS(ns, tag);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      if (cls) e.setAttribute('class', cls);
      if (txt != null) e.textContent = txt;
      svg.appendChild(e);
      return e;
    }
    function line(x1, y1, x2, y2, cls) {
      return add('line', { x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2) }, cls);
    }
    function label(x, y, dx, dy, anchor, cls, txt) {
      return add('text', {
        x: sx(x) + dx, y: sy(y) + dy, 'text-anchor': anchor
      }, cls, txt);
    }

    add('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' });

    // сетка по уровням энтропии
    yTicks.forEach(function (v) { if (v > 0) line(0, v, 1, v, 'gr'); });

    // оси со стрелками (наконечники — тоже через sx/sy)
    var axEndX = 1.08, axEndY = 1.14, hd = 0.022;
    line(0, 0, axEndX, 0, 'ax');
    line(0, 0, 0, axEndY, 'ax');
    add('polygon', {
      points: [
        sx(axEndX) + ',' + sy(0),
        sx(axEndX - hd * 2) + ',' + sy(hd),
        sx(axEndX - hd * 2) + ',' + sy(-hd)
      ].join(' '), fill: 'var(--axis)'
    });
    add('polygon', {
      points: [
        sx(0) + ',' + sy(axEndY),
        sx(-hd) + ',' + sy(axEndY - hd * 2),
        sx(hd) + ',' + sy(axEndY - hd * 2)
      ].join(' '), fill: 'var(--axis)'
    });
    label(axEndX, 0, -PAD, FS * 2, 'end', 'lbm', 'p — вероятность орла');
    label(0, axEndY, PAD * 2, 0, 'start', 'lbm', 'H, бит');

    // засечки
    xTicks.forEach(function (v) {
      line(v, 0, v, -0.03, 'ax');
      label(v, 0, 0, FS + PAD * 2, 'middle', 'lb', String(v));
    });
    yTicks.forEach(function (v) {
      line(0, v, -0.012, v, 'ax');
      label(0, v, -PAD * 2, FS * 0.35, 'end', 'lb', String(v));
    });

    // кривая
    var pts = [], i, N = 400;
    for (i = 0; i <= N; i++) {
      var p = i / N;
      pts.push(sx(p) + ',' + sy(Hbin(p)));
    }
    add('polyline', { points: pts.join(' ') }, 'cv');

    // вершина 1 бит
    line(pTop, 0, pTop, hTop, 'mk');
    add('circle', { cx: sx(pTop), cy: sy(hTop), r: 5 }, 'dotc');
    label(pTop, hTop, 0, -PAD * 2, 'middle', 'lb', 'максимум 1 бит');

    // пологая вершина: 0.4 -> 0.97
    add('circle', { cx: sx(pFlat), cy: sy(hFlat), r: 4 }, 'dotc');
    label(pFlat, hFlat, -PAD * 2, FS * 1.6, 'end', 'lbm', 'p = 0.4 → 0.97 бита');

    // нули на краях
    add('circle', { cx: sx(0), cy: sy(0), r: 4 }, 'dotc');
    add('circle', { cx: sx(1), cy: sy(0), r: 4 }, 'dotc');
    label(0, 0, PAD * 2, -PAD * 2, 'start', 'lbm', 'H = 0');
    label(1, 0, -PAD * 2, -PAD * 3, 'end', 'lbm', 'H = 0');

    // точка p = 0.99 (подписи разведены: одна выше линии, другая ниже)
    line(pMark, 0, pMark, hMark, 'mk');
    line(0, hMark, pMark, hMark, 'mk');
    add('circle', { cx: sx(pMark), cy: sy(hMark), r: 5 }, 'dot');
    label(pMark, hMark, -PAD * 2, -PAD * 2, 'end', 'lbk', 'p = 0.99');
    label(pMark, hMark, -PAD * 2, FS * 1.8, 'end', 'lbk', '0.08 бита');

    // симметрия
    label(0.5, hMark, 0, -PAD * 2, 'middle', 'lbm', 'кривая симметрична относительно p = 0.5');

    host.appendChild(svg);
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема должна была показать кривую H(p) ' +
      'от p = 0 до p = 1: ноль на краях, максимум 1 бит при p = 0.5, ' +
      'пологая вершина (p = 0.4 даёт 0.97 бита) и отмеченная точка ' +
      'p = 0.99 со значением 0.08 бита.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
