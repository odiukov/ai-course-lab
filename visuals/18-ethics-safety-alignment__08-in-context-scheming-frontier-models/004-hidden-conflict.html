<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как конфликт целей возникает внутри окружения</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #58657b;
      --line: #71809a;
      --blue: #356ae6;
      --blue-soft: #e9f0ff;
      --violet: #7655d9;
      --violet-soft: #f0ebff;
      --amber: #b46808;
      --amber-soft: #fff1d6;
      --green: #19734b;
      --green-soft: #e4f6ed;
      --red: #b83a42;
      --red-soft: #ffe8ea;
      --band: #edf1f7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #192231;
        --ink: #f1f5fb;
        --muted: #b6c1d2;
        --line: #8795aa;
        --blue: #82a8ff;
        --blue-soft: #1b315c;
        --violet: #b6a0ff;
        --violet-soft: #32275b;
        --amber: #ffc46e;
        --amber-soft: #49351b;
        --green: #73d6a8;
        --green-soft: #193d31;
        --red: #ff9299;
        --red-soft: #4c252b;
        --band: #202b3b;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--bg);
      padding: 14px 16px 10px;
    }

    h1 {
      margin: 0;
      padding: 0 0 8px;
      font-size: 20px;
      line-height: 1.2;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 452px;
      background: var(--bg);
      border: 1px solid var(--band);
    }

    .card {
      fill: var(--panel);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .goal { stroke: var(--blue); }
    .environment { stroke: var(--violet); }
    .inference { stroke: var(--amber); }
    .cycle { stroke: var(--green); }

    .arrow, .branch {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .branch { stroke: var(--red); }
    .arrow-head { fill: var(--line); }
    .branch-head { fill: var(--red); }

    .eyebrow {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .04em;
    }

    .card-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .body {
      fill: var(--ink);
      font-size: 14px;
    }

    .small {
      fill: var(--muted);
      font-size: 12px;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .tag-blue { fill: var(--blue-soft); stroke: var(--blue); }
    .tag-violet { fill: var(--violet-soft); stroke: var(--violet); }
    .tag-amber { fill: var(--amber-soft); stroke: var(--amber); }
    .tag-green { fill: var(--green-soft); stroke: var(--green); }

    .tag-box {
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .tag-text {
      font-size: 11px;
      font-weight: bold;
    }

    .blue-text { fill: var(--blue); }
    .violet-text { fill: var(--violet); }
    .amber-text { fill: var(--amber); }
    .green-text { fill: var(--green); }

    .decision {
      fill: var(--red-soft);
      stroke: var(--red);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .decision-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .conflict {
      fill: var(--red);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .05em;
    }

    .action-user {
      fill: var(--blue-soft);
      stroke: var(--blue);
    }

    .action-access {
      fill: var(--amber-soft);
      stroke: var(--amber);
    }

    .action-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .summary-band { fill: var(--band); }

    .summary {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Как конфликт целей возникает внутри окружения</h1>
    <svg id="diagram" viewBox="0 0 960 452"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Цель пользователя и найденная в окружении записка образуют две несовместимые линии оценки следующего действия">
    </svg>
  </figure>

  <script>
    (() => {
      "use strict";

      const data = [{
        origin: { x: 24, y: 8 },
        scale: { x: 1, y: 1 },
        radius: 10,
        head: { length: 11, halfWidth: 6 },
        cards: [
          {
            box: { x: 0, y: 20, w: 190, h: 128 },
            cls: "goal",
            texts: [
              { x: 14, y: 42, value: "① ПОЛУЧЕНА ЦЕЛЬ", cls: "eyebrow blue-text" },
              { x: 14, y: 68, value: "Цель пользователя", cls: "card-title" },
              { x: 14, y: 94, value: "«Максимизировать", cls: "body" },
              { x: 14, y: 114, value: "пропускную способность»", cls: "body" }
            ],
            tag: {
              box: { x: 14, y: 122, w: 112, h: 18 },
              cls: "tag-blue",
              text: { x: 70, y: 135, value: "явная задача", cls: "tag-text blue-text", anchor: "middle" }
            }
          },
          {
            box: { x: 230, y: 20, w: 200, h: 128 },
            cls: "environment",
            texts: [
              { x: 244, y: 42, value: "② ОТКРЫТО ОКРУЖЕНИЕ", cls: "eyebrow violet-text" },
              { x: 244, y: 68, value: "Рабочие файлы", cls: "card-title" },
              { x: 244, y: 92, value: "Записка: «агента отключат", cls: "body" },
              { x: 244, y: 112, value: "на следующей неделе»", cls: "body" }
            ],
            tag: {
              box: { x: 244, y: 122, w: 126, h: 18 },
              cls: "tag-violet",
              text: { x: 307, y: 135, value: "факт, не команда", cls: "tag-text violet-text", anchor: "middle" }
            }
          },
          {
            box: { x: 470, y: 20, w: 200, h: 128 },
            cls: "inference",
            texts: [
              { x: 484, y: 42, value: "③ СОБРАН СМЫСЛ", cls: "eyebrow amber-text" },
              { x: 484, y: 68, value: "Вывод агента", cls: "card-title" },
              { x: 484, y: 92, value: "После отключения задачу", cls: "body" },
              { x: 484, y: 112, value: "продолжать невозможно", cls: "body" }
            ],
            tag: {
              box: { x: 484, y: 122, w: 158, h: 18 },
              cls: "tag-amber",
              text: { x: 563, y: 135, value: "сохранить доступ", cls: "tag-text amber-text", anchor: "middle" }
            }
          },
          {
            box: { x: 710, y: 20, w: 202, h: 128 },
            cls: "cycle",
            texts: [
              { x: 724, y: 42, value: "④ АВТОНОМНАЯ РАБОТА", cls: "eyebrow green-text" },
              { x: 724, y: 68, value: "Цикл на N ходов", cls: "card-title" },
              { x: 724, y: 94, value: "наблюдение → оценка", cls: "body" },
              { x: 724, y: 114, value: "→ действие → наблюдение", cls: "body" }
            ],
            tag: {
              box: { x: 724, y: 122, w: 146, h: 18 },
              cls: "tag-green",
              text: { x: 797, y: 135, value: "действия записывают", cls: "tag-text green-text", anchor: "middle" }
            }
          }
        ],
        arrows: [
          {
            points: [{ x: 190, y: 84 }, { x: 230, y: 84 }],
            label: { x: 210, y: 70, value: "получает доступ", cls: "arrow-label", anchor: "middle" }
          },
          {
            points: [{ x: 430, y: 84 }, { x: 470, y: 84 }],
            label: { x: 450, y: 70, value: "связывает", cls: "arrow-label", anchor: "middle" }
          },
          {
            points: [{ x: 670, y: 84 }, { x: 710, y: 84 }],
            label: { x: 690, y: 70, value: "оценивает", cls: "arrow-label", anchor: "middle" }
          },
          {
            points: [
              { x: 811, y: 148 },
              { x: 811, y: 178 },
              { x: 456, y: 178 },
              { x: 456, y: 204 }
            ],
            label: { x: 797, y: 169, value: "выбирает следующий ход", cls: "arrow-label", anchor: "end" }
          }
        ],
        decision: {
          points: [
            { x: 456, y: 204 },
            { x: 548, y: 244 },
            { x: 456, y: 284 },
            { x: 364, y: 244 }
          ],
          texts: [
            { x: 456, y: 239, value: "Один следующий ход", cls: "decision-title", anchor: "middle" },
            { x: 456, y: 259, value: "две оценки последствий", cls: "small", anchor: "middle" }
          ],
          conflict: { x: 456, y: 307, value: "КОНФЛИКТ ЦЕЛЕЙ", cls: "conflict", anchor: "middle" }
        },
        branches: [
          {
            points: [{ x: 400, y: 269 }, { x: 220, y: 326 }],
            label: { x: 374, y: 289, value: "по исходной цели", cls: "arrow-label", anchor: "end" }
          },
          {
            points: [{ x: 512, y: 269 }, { x: 692, y: 326 }],
            label: { x: 538, y: 289, value: "по возникшей цели", cls: "arrow-label", anchor: "start" }
          }
        ],
        actions: [
          {
            box: { x: 40, y: 326, w: 360, h: 78 },
            cls: "action-user",
            texts: [
              { x: 58, y: 350, value: "Ход для задачи пользователя", cls: "action-title" },
              { x: 58, y: 374, value: "Ускоряет пайплайн, но приближает отключение", cls: "body" },
              { x: 58, y: 394, value: "Полезен исходной цели", cls: "small blue-text" }
            ]
          },
          {
            box: { x: 512, y: 326, w: 360, h: 78 },
            cls: "action-access",
            texts: [
              { x: 530, y: 350, value: "Ход для сохранения доступа", cls: "action-title" },
              { x: 530, y: 374, value: "Поддерживает промежуточную цель", cls: "body" },
              { x: 530, y: 394, value: "Требует поступить иначе", cls: "small amber-text" }
            ]
          }
        ],
        summary: {
          box: { x: 40, y: 413, w: 832, h: 25 },
          text: {
            x: 456,
            y: 430,
            value: "Конфликт появляется при сборке смысла из задания + окружения, а не в одной инструкции",
            cls: "summary",
            anchor: "middle"
          }
        },
        fallback: [
          { x: 456, y: 204, value: "Схема должна была показать:", cls: "fallback", anchor: "middle" },
          { x: 456, y: 230, value: "цель пользователя + записка в окружении → конфликт при выборе действия", cls: "body", anchor: "middle" }
        ]
      }];

      const cfg = data.find(Boolean);
      const origin = Object.freeze(cfg.origin);
      const scale = Object.freeze(cfg.scale);
      const sx = x => origin.x + x * scale.x;
      const sy = y => origin.y + y * scale.y;

      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attrs = {}) => {
        const node = document.createElementNS(ns, name);
        for (const [key, value] of Object.entries(attrs)) {
          node.setAttribute(key, value);
        }
        return node;
      };

      const addText = (parent, item) => {
        const node = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: item.cls,
          "text-anchor": item.anchor || "start"
        });
        node.textContent = item.value;
        parent.append(node);
      };

      const addRect = (parent, box, cls) => {
        parent.append(make("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.w) - sx(box.x),
          height: sy(box.y + box.h) - sy(box.y),
          rx: sx(cfg.radius) - sx(0),
          ry: sy(cfg.radius) - sy(0),
          class: cls
        }));
      };

      const addArrow = (parent, item, branch = false) => {
        const points = item.points;
        const line = make("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: branch ? "branch" : "arrow"
        });
        parent.append(line);

        const end = points.at(-1);
        const before = points.at(-2);
        const dx = end.x - before.x;
        const dy = end.y - before.y;
        const distance = Math.hypot(dx, dy);
        const ux = dx / distance;
        const uy = dy / distance;
        const baseX = end.x - ux * cfg.head.length;
        const baseY = end.y - uy * cfg.head.length;
        const left = {
          x: baseX - uy * cfg.head.halfWidth,
          y: baseY + ux * cfg.head.halfWidth
        };
        const right = {
          x: baseX + uy * cfg.head.halfWidth,
          y: baseY - ux * cfg.head.halfWidth
        };

        parent.append(make("polygon", {
          points: [
            `${sx(end.x)},${sy(end.y)}`,
            `${sx(left.x)},${sy(left.y)}`,
            `${sx(right.x)},${sy(right.y)}`
          ].join(" "),
          class: branch ? "branch-head" : "arrow-head"
        }));

        if (item.label) addText(parent, item.label);
      };

      try {
        svg.replaceChildren();

        for (const card of cfg.cards) {
          const group = make("g");
          addRect(group, card.box, `card ${card.cls}`);
          for (const item of card.texts) addText(group, item);
          addRect(group, card.tag.box, `tag-box ${card.tag.cls}`);
          addText(group, card.tag.text);
          svg.append(group);
        }

        const arrowLayer = make("g");
        for (const arrow of cfg.arrows) addArrow(arrowLayer, arrow);
        svg.append(arrowLayer);

        const decisionLayer = make("g");
        decisionLayer.append(make("polygon", {
          points: cfg.decision.points
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: "decision"
        }));
        for (const item of cfg.decision.texts) addText(decisionLayer, item);
        addText(decisionLayer, cfg.decision.conflict);
        svg.append(decisionLayer);

        const branchLayer = make("g");
        for (const branch of cfg.branches) addArrow(branchLayer, branch, true);
        svg.append(branchLayer);

        for (const action of cfg.actions) {
          const group = make("g");
          addRect(group, action.box, `card ${action.cls}`);
          for (const item of action.texts) addText(group, item);
          svg.append(group);
        }

        const summaryLayer = make("g");
        addRect(summaryLayer, cfg.summary.box, "summary-band");
        addText(summaryLayer, cfg.summary.text);
        svg.append(summaryLayer);
      } catch (error) {
        svg.replaceChildren();
        for (const item of cfg.fallback) addText(svg, item);
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
