<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Программирование против обучения</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1c2331; --muted:#5b6473; --line:#8d97a6;
    --rule:#1f7a5a; --rule-bg:#e4f2ec;
    --data:#33549b; --data-bg:#e5ebf7;
    --ans:#a8620f; --ans-bg:#f8ece0;
    --proc:#4c5563; --proc-bg:#eceef1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151922; --fg:#e8ecf3; --muted:#9aa4b4; --line:#5c6675;
      --rule:#5fd3a6; --rule-bg:#1b3630;
      --data:#8ab0f0; --data-bg:#1c2740;
      --ans:#e8a75c; --ans-bg:#372a1a;
      --proc:#aeb7c4; --proc-bg:#232935;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:12px 10px 14px;
    font:400 14px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:.01em}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{color:var(--muted);font-size:13px;max-width:60em}
  text{fill:var(--fg)}
  .grp{fill:var(--muted);font-size:13px;font-weight:600}
  .cap{fill:var(--muted);font-size:12.5px}
  .lgd{fill:var(--muted);font-size:12px}
  .sub{fill:var(--muted);font-size:10.5px}
  .ttl{font-size:13px;font-weight:600}
  .div{stroke:var(--line);stroke-width:1;stroke-dasharray:5 5;opacity:.65}
  .arw{stroke:var(--line);stroke-width:1.6;fill:none}
  .head{fill:var(--line)}
  .k-rule{fill:var(--rule-bg);stroke:var(--rule);stroke-width:1.4}
  .k-data{fill:var(--data-bg);stroke:var(--data);stroke-width:1.4}
  .k-ans{fill:var(--ans-bg);stroke:var(--ans);stroke-width:1.4}
  .k-proc{fill:var(--proc-bg);stroke:var(--proc);stroke-width:1.4}
</style>
<div class="wrap">
  <h2>Программирование против обучения: правила и ответы меняются местами</h2>
  <div id="host"><noscript class="fallback">Сверху: правила + данные дают ответ. Снизу: данные + ответы дают правила (модель).</noscript></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    /* ---------- данные схемы (в условных единицах) ---------- */
    var BOX = {w:4.0, h:1.1};
    var NODES = [
      {x:2.5, y:6.0, k:"rule", t:"Правила",           s:"«есть БЕСПЛАТНО» — спам"},
      {x:2.5, y:4.4, k:"data", t:"Данные",            s:"письмо"},
      {x:8.0, y:5.2, k:"proc", t:"Программа",         s:"применяет правила"},
      {x:13.5,y:5.2, k:"ans",  t:"Ответ",             s:"спам / не спам"},
      {x:2.5, y:2.4, k:"data", t:"Данные",            s:"тысячи писем"},
      {x:2.5, y:0.8, k:"ans",  t:"Ответы",            s:"спам / не спам"},
      {x:8.0, y:1.6, k:"proc", t:"Алгоритм обучения", s:"ищет закономерности"},
      {x:13.5,y:1.6, k:"rule", t:"Модель = правила",  s:"их выдаёт алгоритм"}
    ];
    var ARROWS = [
      [{x:4.5,y:6.0},{x:6.0,y:5.42}], [{x:4.5,y:4.4},{x:6.0,y:4.98}],
      [{x:10.0,y:5.2},{x:11.5,y:5.2}],
      [{x:4.5,y:2.4},{x:6.0,y:1.82}], [{x:4.5,y:0.8},{x:6.0,y:1.38}],
      [{x:10.0,y:1.6},{x:11.5,y:1.6}]
    ];
    var GROUPS = [
      {x:0.05, y:6.95, t:"Обычная программа: правила пишет человек"},
      {x:0.05, y:3.35, t:"Машинное обучение: правила находит алгоритм"}
    ];
    var DIVIDER = [{x:0.05,y:3.65},{x:15.6,y:3.65}];
    var LEGEND = [
      {x:0.05, k:"rule", t:"правила"},
      {x:4.30, k:"data", t:"данные"},
      {x:8.55, k:"ans",  t:"ответы"}
    ];
    var LEG_Y = -0.42, SW = 0.28, CAP = {x:0.05, y:-1.05};
    var HEAD = {len:0.32, w:0.17};

    /* ---------- единственный перевод координат ---------- */
    var origin = {x:26, y:300}, scale = 40;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    /* ---------- рисование ---------- */
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 700 360");
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");
    svg.setAttribute("aria-label","Правила и данные дают ответ; данные и ответы дают правила");

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function label(x,y,cls,txt,anchor,dy){
      var t=el("text",{x:sx(x), y:sy(y), "text-anchor":anchor||"middle", class:cls});
      if(dy) t.setAttribute("dy",dy);
      t.textContent=txt; return t;
    }

    var d = el("line",{x1:sx(DIVIDER[0].x), y1:sy(DIVIDER[0].y),
                       x2:sx(DIVIDER[1].x), y2:sy(DIVIDER[1].y), class:"div"});

    ARROWS.forEach(function(a){
      var p=a[0], q=a[1], dx=q.x-p.x, dy=q.y-p.y, L=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/L, uy=dy/L;
      var b={x:q.x-ux*HEAD.len, y:q.y-uy*HEAD.len};
      el("line",{x1:sx(p.x), y1:sy(p.y), x2:sx(b.x), y2:sy(b.y), class:"arw"});
      var l={x:b.x-uy*HEAD.w, y:b.y+ux*HEAD.w}, r={x:b.x+uy*HEAD.w, y:b.y-ux*HEAD.w};
      el("polygon",{class:"head", points:
        sx(q.x)+","+sy(q.y)+" "+sx(l.x)+","+sy(l.y)+" "+sx(r.x)+","+sy(r.y)});
    });

    NODES.forEach(function(n){
      var x0=sx(n.x-BOX.w/2), x1=sx(n.x+BOX.w/2);
      var y0=sy(n.y+BOX.h/2), y1=sy(n.y-BOX.h/2);
      el("rect",{x:x0, y:y0, width:x1-x0, height:y1-y0,
                 rx:sx(0.22)-sx(0), class:"k-"+n.k});
      label(n.x, n.y, "ttl", n.t, "middle", -3);
      label(n.x, n.y, "sub", n.s, "middle", 13);
    });

    GROUPS.forEach(function(g){ label(g.x, g.y, "grp", g.t, "start"); });

    LEGEND.forEach(function(g){
      var x0=sx(g.x), x1=sx(g.x+SW), y0=sy(LEG_Y+SW), y1=sy(LEG_Y);
      el("rect",{x:x0, y:y0, width:x1-x0, height:y1-y0, class:"k-"+g.k});
      var t=el("text",{x:sx(g.x+SW+0.22), y:sy(LEG_Y), "text-anchor":"start", class:"lgd"});
      t.textContent=g.t;
    });

    label(CAP.x, CAP.y, "cap",
      "Что было выходом (ответы) — стало входом; что было входом (правила) — стало выходом.",
      "start");

    host.textContent="";
    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fallback">Схема не построилась. Она должна была показать две '+
      'колонки. Верхняя, обычная программа: <b>правила</b> + <b>данные</b> идут в программу, '+
      'на выходе — <b>ответ</b> (спам / не спам). Нижняя, машинное обучение: <b>данные</b> '+
      '(тысячи писем) + <b>ответы</b> к ним идут в алгоритм обучения, на выходе — '+
      '<b>модель, то есть правила</b>. Ответы и правила поменялись местами.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
