<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Матрица ошибок 2×2</title>
<style>
  :root{
    --bg:#f7f8fa; --fg:#1d2330; --muted:#5a6473;
    --line:#98a2b3; --diag:#d8efdf; --off:#fbe0dd;
    --diagline:#3d8f5f; --offline:#c05a4c; --note:#6b7480;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --fg:#e7ecf3; --muted:#a7b1c0;
      --line:#5c6675; --diag:#1d3629; --off:#3a2222;
      --diagline:#63c68b; --offline:#e58878; --note:#98a2b0;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px}
  .title{font-size:15px;font-weight:600;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{color:var(--muted);font-size:13px}
  text{fill:var(--fg)}
  .axis{fill:var(--muted);font-size:13px;font-weight:600}
  .tick{font-size:13px}
  .code{font-size:16px;font-weight:700}
  .ex{font-size:11.5px;fill:var(--muted)}
  .legend{font-size:12px;fill:var(--note)}
</style>
<div class="wrap">
  <p class="title">Матрица ошибок 2×2: строки — истина, столбцы — предсказание</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var CELLS=[
      {c:0,r:0,code:'TP',diag:true, a:'письмо спам,',    b:'помечено спам'},
      {c:1,r:0,code:'FN',diag:false,a:'письмо спам,',    b:'прошло в инбокс'},
      {c:0,r:1,code:'FP',diag:false,a:'письмо обычное,', b:'улетело в спам'},
      {c:1,r:1,code:'TN',diag:true, a:'письмо обычное,', b:'прошло в инбокс'}
    ];
    var COLS=['Спам','Не спам'];
    var ROWS=['Реально: спам','Реально: не спам'];
    var LEG=[
      'Диагональ (TP, TN) — модель угадала. Вне диагонали (FP, FN) — промахи.',
      'Порядок строк и столбцов не стандартизирован — сначала читай подписи осей.'
    ];

    /* ---- одна система координат ---- */
    var origin={x:200,y:100}, scale=150;
    function sx(u){return origin.x+u*scale;}
    function sy(v){return origin.y+v*scale;}

    var W=550,H=470,PAD=4,LEAD=13;

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Матрица ошибок два на два: TP, FN, FP, TN на примере спам-фильтра');

    var bg=document.createElementNS(NS,'rect');
    bg.setAttribute('x',0);bg.setAttribute('y',0);
    bg.setAttribute('width',W);bg.setAttribute('height',H);
    bg.setAttribute('fill','var(--bg)');
    svg.appendChild(bg);

    function add(tag,attrs){
      var e=document.createElementNS(NS,tag);
      for(var k in attrs) e.setAttribute(k,attrs[k]);
      svg.appendChild(e); return e;
    }
    function label(u,v,txt,cls,anchor,dx,dy){
      var t=add('text',{x:sx(u)+dx,y:sy(v)+dy,'text-anchor':anchor,class:cls});
      t.textContent=txt; return t;
    }
    function poly(pts){
      return add('polygon',{points:pts.map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' ')});
    }
    function arrow(u1,v1,u2,v2,horiz){
      add('line',{x1:sx(u1),y1:sy(v1),x2:sx(u2),y2:sy(v2),
                  stroke:'var(--line)','stroke-width':1.5});
      var s=0.07,w=0.05,pts= horiz
        ? [[u2,v2],[u2-s,v2-w],[u2-s,v2+w]]
        : [[u2,v2],[u2-w,v2-s],[u2+w,v2-s]];
      poly(pts).setAttribute('fill','var(--line)');
    }

    /* ---- клетки ---- */
    CELLS.forEach(function(d){
      add('rect',{x:sx(d.c),y:sy(d.r),width:sx(d.c+1)-sx(d.c),height:sy(d.r+1)-sy(d.r),
        fill:d.diag?'var(--diag)':'var(--off)',
        stroke:'var(--line)','stroke-width':1.5});
      var cu=d.c+0.5, cv=d.r+0.5;
      var t=label(cu,cv,d.code,'code','middle',0,-1.6*LEAD);
      t.setAttribute('fill',d.diag?'var(--diagline)':'var(--offline)');
      label(cu,cv,d.a,'ex','middle',0,0);
      label(cu,cv,d.b,'ex','middle',0,LEAD);
    });

    /* ---- ось столбцов: предсказание, слева направо ---- */
    label(1,-0.46,'Предсказание модели','axis','middle',0,0);
    arrow(0.06,-0.30,1.94,-0.30,true);
    COLS.forEach(function(nm,i){
      label(i+0.5,-0.10,nm,'tick','middle',0,0);
    });

    /* ---- ось строк: истина, сверху вниз ---- */
    var rt=label(-0.95,1,'','axis','middle',0,0);
    rt.textContent='Истинный класс';
    rt.setAttribute('transform','rotate(-90 '+sx(-0.95)+' '+sy(1)+')');
    arrow(-0.78,0.06,-0.78,1.94,false);
    ROWS.forEach(function(nm,i){
      label(-0.06,i+0.5,nm,'tick','end',0,0.32*LEAD);
    });

    /* ---- легенда ---- */
    LEG.forEach(function(s,i){
      label(-0.95,2.16,s,'legend','start',0,i*1.4*LEAD);
    });

    /* защита от вылета за viewBox */
    var b=svg.getBBox&&null;
    host.appendChild(svg);
    void PAD; void b;
  }catch(e){
    var p=document.createElement('p');
    p.className='fail';
    p.textContent='Схема должна показывать квадрат 2×2: строки — истинный класс письма '+
      '(реально спам / реально не спам), столбцы — предсказание модели (спам / не спам). '+
      'По диагонали TP (спам помечен спамом) и TN (обычное письмо пропущено) — попадания. '+
      'Вне диагонали FN (спам прошёл в инбокс) и FP (важное письмо улетело в спам) — промахи.';
    host.appendChild(p);
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
