<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три выборки и их роли</title>
<style>
  :root{
    --bg:#ffffff; --ink:#17202e; --muted:#5b6577; --line:#c3cbd8;
    --a:#2563eb; --b:#c2740a; --c:#047857;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d; --ink:#e8edf5; --muted:#9aa6b8; --line:#3b4152;
      --a:#60a5fa; --b:#fbbf24; --c:#34d399;
    }
  }
  @media (prefers-color-scheme: dark){ :root{ --line:#3b4453; } }
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  figure{margin:0; padding:12px; background:var(--bg)}
  h2{margin:0 0 8px; font-size:15px; font-weight:700; letter-spacing:.01em}
  svg{display:block; width:100%; height:auto; max-height:520px; background:var(--bg)}
  .fb{font-size:13px; color:var(--muted); line-height:1.5}
  text{font-family:inherit; fill:var(--ink)}
  .cap{font-size:12.5px; fill:var(--muted)}
  .nm{font-size:14px; font-weight:600}
  .pct{font-size:15px; font-weight:700}
  .role{font-size:14px; font-weight:600}
  .sub{font-size:11px; fill:var(--muted)}
  .note{font-size:11.5px; fill:var(--muted)}
  .s-a{color:var(--a)} .s-b{color:var(--b)} .s-c{color:var(--c)}
  .seg{fill:currentColor; fill-opacity:.20; stroke:currentColor}
  .card{fill:currentColor; fill-opacity:.07; stroke:currentColor; stroke-opacity:.55}
  .arw{stroke:currentColor; fill:none}
  .head{fill:currentColor}
  .on{fill:currentColor}
</style>
</head>
<body>
<figure>
  <h2>Три выборки и их роли</h2>
  <div id="host"><p class="fb" id="fb">Полоса всех размеченных данных делится на Training 70 %, Validation 15 % и Test 15 %: Training идёт на обучение, Validation — на настройку гиперпараметров, Test — на финальную оценку один раз.</p></div>
</figure>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var VIEW={w:720,h:212};
    var GEO={
      bar:{top:0,bottom:5},
      card:{top:12.5,bottom:20.5},
      arrow:{tail:0.4,gap:0.4,headLen:1.6,headHalf:0.75},
      titleY:-4.6, noteY:22.7, radius:0.5,
      line1:14.3, line2:16.2, subY:18.6, oneLine:15.1
    };
    var SEGS=[
      {nm:'Training',  pct:70, card:[0,30],   cls:'s-a',
       role:['обучение'],                       sub:'модель учится на этих примерах'},
      {nm:'Validation',pct:15, card:[35,65],  cls:'s-b',
       role:['настройка','гиперпараметров'],    sub:'здесь ты выбираешь вариант'},
      {nm:'Test',      pct:15, card:[70,100], cls:'s-c',
       role:['финальная оценка','один раз'],    sub:'не влияет ни на обучение, ни на выбор'}
    ];

    /* ---- единственный перевод координат ---- */
    var origin={x:40,y:60}, scale=6.4;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function txt(s,a){var e=el('text',a);e.textContent=s;return e;}

    var svg=el('svg',{viewBox:'0 0 '+VIEW.w+' '+VIEW.h,
                      preserveAspectRatio:'xMidYMid meet',role:'img'});
    var rx=sx(GEO.radius)-sx(0);

    function arrow(g,x1,y1,x2,y2){
      var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/L, uy=dy/L, px=-uy, py=ux;
      var bx=x2-ux*GEO.headLen0, by=0; // placeholder, replaced below
      bx=x2-ux*GEO.arrow.headLen; by=y2-uy*GEO.arrow.headLen;
      var h=GEO.arrow.headHalf;
      g.appendChild(el('line',{class:'arw','stroke-width':1.8,
        x1:sx(x1),y1:sy(y1),x2:sx(bx),y2:sy(by)}));
      g.appendChild(el('polygon',{class:'head',points:
        sx(x2)+','+sy(y2)+' '+
        sx(bx+px*h)+','+sy(by+py*h)+' '+
        sx(bx-px*h)+','+sy(by-py*h)}));
    }

    svg.appendChild(txt('Все размеченные данные — 100 %',
      {class:'cap','text-anchor':'start',x:sx(0),y:sy(GEO.titleY)}));

    var cur=0;
    SEGS.forEach(function(s){
      var x0=cur, x1=cur+s.pct; cur=x1;
      var mid=(x0+x1)/2, cmid=(s.card[0]+s.card[1])/2;
      var g=el('g',{class:s.cls});

      g.appendChild(el('rect',{class:'seg','stroke-width':1.5,
        x:sx(x0),y:sy(GEO.bar.top),width:sx(x1)-sx(x0),
        height:sy(GEO.bar.bottom)-sy(GEO.bar.top),rx:rx}));

      g.appendChild(txt(s.nm,{class:'nm on','text-anchor':'middle',
        x:sx(mid),y:sy(GEO.bar.top),dy:-9}));
      g.appendChild(txt(s.pct+' %',{class:'pct on','text-anchor':'middle',
        x:sx(mid),y:sy((GEO.bar.top+GEO.bar.bottom)/2),dy:6}));

      arrow(g, mid, GEO.bar.bottom+GEO.arrow.tail, cmid, GEO.card.top-GEO.arrow.gap);

      g.appendChild(el('rect',{class:'card','stroke-width':1.4,
        x:sx(s.card[0]),y:sy(GEO.card.top),
        width:sx(s.card[1])-sx(s.card[0]),
        height:sy(GEO.card.bottom)-sy(GEO.card.top),rx:rx}));

      if(s.role.length===1){
        g.appendChild(txt(s.role[0],{class:'role on','text-anchor':'middle',
          x:sx(cmid),y:sy(GEO.oneLine)}));
      }else{
        g.appendChild(txt(s.role[0],{class:'role on','text-anchor':'middle',
          x:sx(cmid),y:sy(GEO.line1)}));
        g.appendChild(txt(s.role[1],{class:'role on','text-anchor':'middle',
          x:sx(cmid),y:sy(GEO.line2)}));
      }
      g.appendChild(txt(s.sub,{class:'sub','text-anchor':'middle',
        x:sx(cmid),y:sy(GEO.subY)}));

      svg.appendChild(g);
    });

    svg.appendChild(txt('Валидация уже «испачкана» твоим выбором — честный итог даёт только тест.',
      {class:'note','text-anchor':'start',x:sx(0),y:sy(GEO.noteY)}));

    host.innerHTML='';
    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fb">Схема не построилась. Она должна показывать полосу всех размеченных данных, разбитую на Training 70 %, Validation 15 % и Test 15 %, и три стрелки от долей к их ролям: Training — обучение, Validation — настройка гиперпараметров, Test — финальная оценка один раз.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
