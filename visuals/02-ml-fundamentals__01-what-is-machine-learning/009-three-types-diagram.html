<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Карта трёх типов ML</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b1f2a; --muted:#5c6473;
    --line:#8a93a6; --root:#2f5fd0; --sup:#1f7a4d; --uns:#a25a10; --rl:#8b3fa0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --fg:#e8ecf4; --muted:#a3adbf;
      --line:#6f7a8f; --root:#7aa4ff; --sup:#5fd39a; --uns:#e8ac5a; --rl:#d18ce8;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{background:var(--bg);padding:10px 12px 12px}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{font-size:13px;line-height:1.5;color:var(--muted)}
  text{font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <h2>Карта трёх типов ML: одна развилка — есть ли готовые ответы</h2>
  <div id="slot"></div>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ---- данные схемы (координаты в условных единицах) ----
    var NODES = [
      {id:'ml',  x:0,   y:0,  label:'Machine Learning',        cls:'root', anchor:'middle', side:'above'},
      {id:'sl',  x:-6,  y:-2, label:'Обучение с учителем',      cls:'sup',  anchor:'middle', side:'above'},
      {id:'ul',  x:0,   y:-2, label:'Обучение без учителя',     cls:'uns',  anchor:'middle', side:'above'},
      {id:'rl',  x:6,   y:-2, label:'Обучение с подкреплением', cls:'rl',   anchor:'middle', side:'above'},
      {id:'c',   x:-8,  y:-4, label:'Классификация',            cls:'sup',  anchor:'end',    side:'left'},
      {id:'r',   x:-5,  y:-4, label:'Регрессия',                cls:'sup',  anchor:'start',  side:'right'},
      {id:'cl',  x:-1,  y:-4, label:'Кластеризация',            cls:'uns',  anchor:'end',    side:'left'},
      {id:'dr',  x:2,   y:-4, label:'Снижение размерности',     cls:'uns',  anchor:'start',  side:'right'},
      {id:'po',  x:5,   y:-4, label:'Оптимизация политики',     cls:'rl',   anchor:'end',    side:'left'},
      {id:'vl',  x:8,   y:-4, label:'Обучение ценности',        cls:'rl',   anchor:'start',  side:'right'}
    ];
    var EDGES = [
      ['ml','sl'],['ml','ul'],['ml','rl'],
      ['sl','c'],['sl','r'],
      ['ul','cl'],['ul','dr'],
      ['rl','po'],['rl','vl']
    ];

    // ---- холст (литералы: только размеры и типографика) ----
    var W = 900, H = 380;
    var PAD = 6;        // отступ подписи от точки привязки, px
    var LW = 1.6;       // толщина линий, px
    var FS = 13;        // размер шрифта, px
    var FSR = 15;

    // ---- одна точка отсчёта и один масштаб ----
    var origin = {x: W/2, y: H - 34};
    var scale  = {x: 44, y: 96};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y + y * scale.y; }

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function byId(id){for(var i=0;i<NODES.length;i++)if(NODES[i].id===id)return NODES[i];}

    var svg = el('svg',{viewBox:'0 0 '+W+' '+H, preserveAspectRatio:'xMidYMid meet',
                        role:'img','aria-label':'Дерево трёх типов машинного обучения'});

    var COL={root:'var(--root)',sup:'var(--sup)',uns:'var(--uns)',rl:'var(--rl)'};

    // ---- рёбра: колено вниз-в-сторону-вниз, все точки через sx/sy ----
    EDGES.forEach(function(pair){
      var a=byId(pair[0]), b=byId(pair[1]);
      var midY=(a.y+b.y)/2;
      var d='M '+sx(a.x)+' '+sy(a.y)+
            ' L '+sx(a.x)+' '+sy(midY)+
            ' L '+sx(b.x)+' '+sy(midY)+
            ' L '+sx(b.x)+' '+sy(b.y);
      svg.appendChild(el('path',{d:d,fill:'none',stroke:'var(--line)','stroke-width':LW,
                                'stroke-linejoin':'round'}));
    });

    // ---- узлы: точка + подпись со своей стороной ----
    NODES.forEach(function(n){
      var px=sx(n.x), py=sy(n.y);
      svg.appendChild(el('circle',{cx:px,cy:py,r:LW*2.4,fill:COL[n.cls]}));

      var tx=px, ty=py, base='middle';
      if(n.side==='above'){ ty=py-PAD-LW; base='auto'; }
      else if(n.side==='left'){ tx=px-PAD-LW*2; }
      else if(n.side==='right'){ tx=px+PAD+LW*2; }

      var t=el('text',{x:tx,y:ty,'text-anchor':n.anchor,fill:n.id==='ml'?COL.root:'var(--fg)',
        'font-size':(n.id==='ml'?FSR:FS),
        'font-weight':(n.y>-3?'600':'400'),
        'dominant-baseline':(base==='middle'?'middle':'auto')});
      t.textContent=n.label;
      svg.appendChild(t);
    });

    // ---- подпись развилки: сбоку от середины верхних рёбер, не у наконечника ----
    var q=el('text',{x:sx(0)+PAD,y:sy(-1),'text-anchor':'start',fill:'var(--muted)',
                     'font-size':FS,'dominant-baseline':'middle'});
    q.textContent='есть ли к примерам готовые ответы?';
    svg.appendChild(q);

    var hint=el('text',{x:sx(-8),y:sy(-1),'text-anchor':'start',fill:'var(--muted)',
                        'font-size':FS,'dominant-baseline':'middle'});
    hint.textContent='да';
    svg.appendChild(hint);

    slot.appendChild(svg);
  }catch(e){
    slot.innerHTML='<p class="fallback">Схема должна показывать дерево: Machine Learning делится '+
      'на три ветви — обучение с учителем (классификация, регрессия), обучение без учителя '+
      '(кластеризация, снижение размерности), обучение с подкреплением (оптимизация политики, '+
      'обучение ценности). Читается сверху вниз; каждая задача растёт из своей ветки.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
