<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>От сырых данных к неизвестным группам</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #eef1f7;
      --ink: #182033;
      --muted: #687189;
      --line: #7b849a;
      --sea: #247da8;
      --sea-soft: #d9f2fb;
      --mount: #6d58a8;
      --mount-soft: #ebe4ff;
      --people: #b55f38;
      --people-soft: #ffe7dc;
      --notice: #8b6b18;
      --notice-soft: #fff3c9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151922;
        --panel: #202633;
        --panel-soft: #2a3140;
        --ink: #f2f5fb;
        --muted: #b2bbcd;
        --line: #929db3;
        --sea: #73c8ee;
        --sea-soft: #173c4e;
        --mount: #b9a8f2;
        --mount-soft: #352d55;
        --people: #f0a27d;
        --people-soft: #513126;
        --notice: #f0ce69;
        --notice-soft: #493f20;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--bg);
      padding: 12px 14px 14px;
    }

    h1 {
      margin: 0;
      padding: 2px 4px 10px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: .01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      overflow: visible;
      background: var(--bg);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2;
    }

    .source-panel {
      fill: var(--panel-soft);
    }

    .sea-panel {
      fill: var(--sea-soft);
      stroke: var(--sea);
    }

    .mount-panel {
      fill: var(--mount-soft);
      stroke: var(--mount);
    }

    .people-panel {
      fill: var(--people-soft);
      stroke: var(--people);
    }

    .notice-panel {
      fill: var(--notice-soft);
      stroke: var(--notice);
      stroke-width: 2;
    }

    .photo {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5;
    }

    .photo-sea {
      fill: var(--sea-soft);
    }

    .photo-mount {
      fill: var(--mount-soft);
    }

    .photo-people {
      fill: var(--people-soft);
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      fill: var(--line);
      stroke: none;
    }

    .sea-line {
      fill: none;
      stroke: var(--sea);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mount-shape {
      fill: var(--mount);
      stroke: none;
    }

    .people-shape {
      fill: var(--people);
      stroke: none;
    }

    .notice-line {
      fill: none;
      stroke: var(--notice);
      stroke-width: 3;
      stroke-linecap: round;
    }

    text {
      fill: var(--ink);
      font-size: 17px;
      dominant-baseline: middle;
    }

    .section-label {
      font-size: 18px;
      font-weight: bold;
    }

    .count {
      font-size: 20px;
      font-weight: bold;
    }

    .small {
      fill: var(--muted);
      font-size: 15px;
    }

    .group-label {
      font-size: 19px;
      font-weight: bold;
    }

    .question {
      fill: var(--notice);
      font-size: 34px;
      font-weight: bold;
    }

    .notice-text {
      fill: var(--notice);
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      padding: 18px;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--line);
      font-size: 17px;
    }

    .fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">От сырых данных к неизвестным группам</h1>

    <div id="fallback" class="fallback">
      Схема: 500 фотографий без подписей распределяются по похожести в группы
      «море», «горы» и «люди», но эталона для проверки рядом нет.
    </div>

    <svg id="diagram"
         viewBox="0 0 1200 400"
         width="1200"
         height="400"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description"></svg>
  </figure>

  <script>
    const data = [
      {type:"rect", a:{x:2,y:5}, b:{x:25,y:32}, className:"panel source-panel"},
      {type:"text", p:{x:13.5,y:2.9}, offset:{x:0,y:0}, anchor:"middle", className:"section-label", value:"Фотографии без подписей"},

      {type:"rect", a:{x:4,y:7.4}, b:{x:10,y:12.6}, className:"photo photo-mount"},
      {type:"poly", points:[{x:4.8,y:11.8},{x:6.5,y:9.1},{x:7.5,y:10.2},{x:8.4,y:8.8},{x:9.4,y:11.8}], className:"mount-shape"},

      {type:"rect", a:{x:11,y:7}, b:{x:17,y:12.2}, className:"photo photo-people"},
      {type:"circle", c:{x:13,y:9}, edge:{x:13.7,y:9}, className:"people-shape"},
      {type:"circle", c:{x:15.2,y:9.4}, edge:{x:15.8,y:9.4}, className:"people-shape"},
      {type:"poly", points:[{x:11.9,y:11.5},{x:12.3,y:10.1},{x:13.7,y:10.1},{x:14.1,y:11.5}], className:"people-shape"},
      {type:"poly", points:[{x:14.2,y:11.5},{x:14.5,y:10.4},{x:15.9,y:10.4},{x:16.2,y:11.5}], className:"people-shape"},

      {type:"rect", a:{x:18,y:7.8}, b:{x:23,y:13}, className:"photo photo-sea"},
      {type:"poly", points:[{x:18.7,y:10.1},{x:19.5,y:9.7},{x:20.3,y:10.1},{x:21.1,y:9.7},{x:22.2,y:10.1}], className:"sea-line"},
      {type:"poly", points:[{x:18.7,y:11.4},{x:19.5,y:11},{x:20.3,y:11.4},{x:21.1,y:11},{x:22.2,y:11.4}], className:"sea-line"},

      {type:"rect", a:{x:5,y:14}, b:{x:11,y:19.2}, className:"photo photo-people"},
      {type:"circle", c:{x:8,y:16}, edge:{x:8.8,y:16}, className:"people-shape"},
      {type:"poly", points:[{x:6.5,y:18.3},{x:7,y:16.9},{x:9,y:16.9},{x:9.5,y:18.3}], className:"people-shape"},

      {type:"rect", a:{x:12,y:14.3}, b:{x:18,y:19.5}, className:"photo photo-sea"},
      {type:"poly", points:[{x:12.7,y:16.7},{x:13.6,y:16.2},{x:14.5,y:16.7},{x:15.4,y:16.2},{x:17.2,y:16.7}], className:"sea-line"},
      {type:"poly", points:[{x:12.7,y:18},{x:13.6,y:17.5},{x:14.5,y:18},{x:15.4,y:17.5},{x:17.2,y:18}], className:"sea-line"},

      {type:"rect", a:{x:18.5,y:14.6}, b:{x:23,y:19.8}, className:"photo photo-mount"},
      {type:"poly", points:[{x:19.1,y:19},{x:20.2,y:16.2},{x:21,y:17.3},{x:21.7,y:15.8},{x:22.5,y:19}], className:"mount-shape"},

      {type:"rect", a:{x:7,y:20.6}, b:{x:13,y:25.8}, className:"photo photo-mount"},
      {type:"poly", points:[{x:7.7,y:25},{x:9.2,y:22},{x:10.1,y:23.2},{x:11.1,y:21.6},{x:12.3,y:25}], className:"mount-shape"},

      {type:"rect", a:{x:14,y:20.3}, b:{x:20,y:25.5}, className:"photo photo-sea"},
      {type:"poly", points:[{x:14.7,y:22.8},{x:15.6,y:22.3},{x:16.5,y:22.8},{x:17.4,y:22.3},{x:19.2,y:22.8}], className:"sea-line"},
      {type:"poly", points:[{x:14.7,y:24.1},{x:15.6,y:23.6},{x:16.5,y:24.1},{x:17.4,y:23.6},{x:19.2,y:24.1}], className:"sea-line"},

      {type:"text", p:{x:13.5,y:28.3}, offset:{x:0,y:0}, anchor:"middle", className:"count", value:"500 фотографий"},
      {type:"text", p:{x:13.5,y:30.5}, offset:{x:0,y:0}, anchor:"middle", className:"small", value:"никаких готовых меток"},

      {type:"line", a:{x:26,y:18.5}, b:{x:39,y:18.5}, className:"flow"},
      {type:"poly", points:[{x:39,y:18.5},{x:37.4,y:17.4},{x:37.4,y:19.6}], className:"arrow"},
      {type:"text", p:{x:26.6,y:15.8}, offset:{x:6,y:0}, anchor:"start", className:"section-label", value:"по похожести"},

      {type:"line", a:{x:40,y:7}, b:{x:40,y:29}, className:"flow"},
      {type:"line", a:{x:40,y:7}, b:{x:45.4,y:7}, className:"flow"},
      {type:"line", a:{x:40,y:18}, b:{x:45.4,y:18}, className:"flow"},
      {type:"line", a:{x:40,y:29}, b:{x:45.4,y:29}, className:"flow"},
      {type:"poly", points:[{x:46.2,y:7},{x:44.5,y:5.9},{x:44.5,y:8.1}], className:"arrow"},
      {type:"poly", points:[{x:46.2,y:18},{x:44.5,y:16.9},{x:44.5,y:19.1}], className:"arrow"},
      {type:"poly", points:[{x:46.2,y:29},{x:44.5,y:27.9},{x:44.5,y:30.1}], className:"arrow"},

      {type:"rect", a:{x:47,y:3}, b:{x:75.5,y:11}, className:"panel sea-panel"},
      {type:"rect", a:{x:49,y:4.3}, b:{x:55,y:9.7}, className:"photo photo-sea"},
      {type:"poly", points:[{x:49.7,y:6.6},{x:50.6,y:6.1},{x:51.5,y:6.6},{x:52.4,y:6.1},{x:54.3,y:6.6}], className:"sea-line"},
      {type:"poly", points:[{x:49.7,y:8.1},{x:50.6,y:7.6},{x:51.5,y:8.1},{x:52.4,y:7.6},{x:54.3,y:8.1}], className:"sea-line"},
      {type:"text", p:{x:57,y:6.2}, offset:{x:4,y:0}, anchor:"start", className:"group-label", value:"группа «море»"},
      {type:"text", p:{x:57,y:8.4}, offset:{x:4,y:0}, anchor:"start", className:"small", value:"похожие снимки рядом"},

      {type:"rect", a:{x:47,y:14}, b:{x:75.5,y:22}, className:"panel mount-panel"},
      {type:"rect", a:{x:49,y:15.3}, b:{x:55,y:20.7}, className:"photo photo-mount"},
      {type:"poly", points:[{x:49.7,y:20},{x:51.3,y:16.7},{x:52.2,y:17.9},{x:53.2,y:16.2},{x:54.4,y:20}], className:"mount-shape"},
      {type:"text", p:{x:57,y:17.2}, offset:{x:4,y:0}, anchor:"start", className:"group-label", value:"группа «горы»"},
      {type:"text", p:{x:57,y:19.4}, offset:{x:4,y:0}, anchor:"start", className:"small", value:"похожие снимки рядом"},

      {type:"rect", a:{x:47,y:25}, b:{x:75.5,y:33}, className:"panel people-panel"},
      {type:"rect", a:{x:49,y:26.3}, b:{x:55,y:31.7}, className:"photo photo-people"},
      {type:"circle", c:{x:51,y:28.1}, edge:{x:51.7,y:28.1}, className:"people-shape"},
      {type:"circle", c:{x:53.1,y:28.4}, edge:{x:53.7,y:28.4}, className:"people-shape"},
      {type:"poly", points:[{x:49.9,y:31},{x:50.3,y:29.2},{x:51.7,y:29.2},{x:52.1,y:31}], className:"people-shape"},
      {type:"poly", points:[{x:52.1,y:31},{x:52.4,y:29.5},{x:53.8,y:29.5},{x:54.2,y:31}], className:"people-shape"},
      {type:"text", p:{x:57,y:28.2}, offset:{x:4,y:0}, anchor:"start", className:"group-label", value:"группа «люди»"},
      {type:"text", p:{x:57,y:30.4}, offset:{x:4,y:0}, anchor:"start", className:"small", value:"похожие снимки рядом"},

      {type:"rect", a:{x:78.5,y:6}, b:{x:99,y:30}, className:"notice-panel"},
      {type:"rect", a:{x:85,y:9}, b:{x:92.5,y:19.5}, className:"panel"},
      {type:"line", a:{x:86.5,y:12}, b:{x:91,y:12}, className:"notice-line"},
      {type:"line", a:{x:86.5,y:14.5}, b:{x:91,y:14.5}, className:"notice-line"},
      {type:"line", a:{x:86.5,y:17}, b:{x:89.5,y:17}, className:"notice-line"},
      {type:"line", a:{x:83.5,y:8}, b:{x:94,y:20.5}, className:"notice-line"},
      {type:"line", a:{x:94,y:8}, b:{x:83.5,y:20.5}, className:"notice-line"},
      {type:"text", p:{x:88.8,y:23}, offset:{x:0,y:0}, anchor:"middle", className:"question", value:"?"},
      {type:"text", p:{x:88.8,y:26}, offset:{x:0,y:0}, anchor:"middle", className:"notice-text", value:"Эталона для проверки нет"},
      {type:"text", p:{x:88.8,y:28.2}, offset:{x:0,y:0}, anchor:"middle", className:"small", value:"сравнить с ответом не с чем"}
    ];

    const origin = Object.freeze({x:18,y:10});
    const scale = 11.65;

    function toPx(point) {
      return {
        x: origin.x + point.x * scale,
        y: origin.y + point.y * scale
      };
    }

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      svg.replaceChildren();

      const title = document.createElementNS(namespace, "title");
      title.id = "svg-title";
      title.textContent = "500 фотографий распределяются в неизвестные заранее группы";
      svg.appendChild(title);

      const description = document.createElementNS(namespace, "desc");
      description.id = "svg-description";
      description.textContent = "Фотографии без подписей группируются по визуальному сходству в море, горы и людей. Справа показано, что эталона для непосредственной проверки нет.";
      svg.appendChild(description);

      data.forEach((item) => {
        let element;

        if (item.type === "rect") {
          const a = toPx(item.a);
          const b = toPx(item.b);
          element = document.createElementNS(namespace, "rect");
          element.setAttribute("x", a.x);
          element.setAttribute("y", a.y);
          element.setAttribute("width", b.x - a.x);
          element.setAttribute("height", b.y - a.y);
        }

        if (item.type === "line") {
          const a = toPx(item.a);
          const b = toPx(item.b);
          element = document.createElementNS(namespace, "line");
          element.setAttribute("x1", a.x);
          element.setAttribute("y1", a.y);
          element.setAttribute("x2", b.x);
          element.setAttribute("y2", b.y);
        }

        if (item.type === "poly") {
          element = document.createElementNS(namespace, "polygon");
          element.setAttribute(
            "points",
            item.points.map((point) => {
              const pixel = toPx(point);
              return pixel.x + "," + pixel.y;
            }).join(" ")
          );
        }

        if (item.type === "circle") {
          const center = toPx(item.c);
          const edge = toPx(item.edge);
          element = document.createElementNS(namespace, "circle");
          element.setAttribute("cx", center.x);
          element.setAttribute("cy", center.y);
          element.setAttribute("r", Math.abs(edge.x - center.x));
        }

        if (item.type === "text") {
          const anchor = toPx(item.p);
          element = document.createElementNS(namespace, "text");
          element.setAttribute("x", anchor.x + item.offset.x);
          element.setAttribute("y", anchor.y + item.offset.y);
          element.setAttribute("text-anchor", item.anchor);
          element.textContent = item.value;
        }

        if (element) {
          element.setAttribute("class", item.className);
          svg.appendChild(element);
        }
      });

      fallback.hidden = true;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      fallback.textContent = "Схема должна была показать: 500 фотографий без подписей раскладываются по похожести в группы «море», «горы» и «люди», но рядом нет эталона, с которым можно проверить результат.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
