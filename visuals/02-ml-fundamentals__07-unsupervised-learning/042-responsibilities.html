<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таблица мягких принадлежностей GMM</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #58657a;
      --grid: #9aa9bd;
      --grid-soft: #d5dce7;
      --weak-a: #edf2fa;
      --weak-b: #e5ecf7;
      --strong: #3569c8;
      --strong-edge: #173f91;
      --strong-text: #ffffff;
      --sum-fill: #f4f7fb;
      --accent: #b94d20;
      --badge-fill: #fff1e8;
      --badge-edge: #d66a37;
      --shadow: #dfe5ee;
      --focus-fill: #dbe7ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121722;
        --panel: #181f2d;
        --ink: #edf3ff;
        --muted: #b7c2d4;
        --grid: #71809a;
        --grid-soft: #3e4a60;
        --weak-a: #273247;
        --weak-b: #2d3a52;
        --strong: #5487e8;
        --strong-edge: #9bbcff;
        --strong-text: #081426;
        --sum-fill: #202a3b;
        --accent: #ffad7d;
        --badge-fill: #3d2a22;
        --badge-edge: #f29462;
        --shadow: #0c1018;
        --focus-fill: #263c64;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
    }

    .figure {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      background: var(--panel);
      border: 2px solid var(--grid-soft);
      box-shadow: 0 2px 0 var(--shadow);
    }

    .figure-title {
      margin: 0;
      padding: 14px 18px 10px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
    }

    .figure-subtitle {
      margin: 0;
      padding: 0 18px 8px;
      color: var(--muted);
      font-size: 15px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 390px;
      overflow: visible;
      background: var(--panel);
    }

    .column-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .row-label {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .cell {
      stroke: var(--grid);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .weak-a {
      fill: var(--weak-a);
    }

    .weak-b {
      fill: var(--weak-b);
    }

    .strong {
      fill: var(--strong);
      stroke: var(--strong-edge);
      stroke-width: 4;
    }

    .cell-value {
      fill: var(--ink);
      font-size: 24px;
      font-weight: bold;
    }

    .cell-value-strong {
      fill: var(--strong-text);
    }

    .cell-caption {
      fill: var(--muted);
      font-size: 14px;
    }

    .cell-caption-strong {
      fill: var(--strong-text);
    }

    .sum-box {
      fill: var(--sum-fill);
      stroke: var(--grid-soft);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .sum-equation {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .sum-caption {
      fill: var(--muted);
      font-size: 14px;
    }

    .selection-halo {
      fill: var(--focus-fill);
      stroke: var(--strong-edge);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .arrow-line {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--accent);
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-label {
      fill: var(--accent);
      font-size: 15px;
      font-weight: bold;
    }

    .badge {
      fill: var(--badge-fill);
      stroke: var(--badge-edge);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .badge-kicker {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .badge-value {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .guide {
      fill: none;
      stroke: var(--grid-soft);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .footer-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .error-text {
      fill: var(--ink);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <h1 class="figure-title" id="figure-title">Таблица мягких принадлежностей GMM</h1>
    <p class="figure-subtitle">Одна строка хранит всю уверенность модели, а не только итоговый номер кластера.</p>
    <svg
      id="diagram"
      viewBox="0 0 960 390"
      width="960"
      height="390"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Мягкие принадлежности одной точки в GMM</title>
      <desc id="svg-desc">Значения 0,02, 0,95 и 0,03 складываются в 1. Максимум 0,95 определяет жёсткую метку: кластер 2.</desc>
    </svg>
  </main>

  <script>
    const diagramData = [
      {
        point: "Точка x",
        components: [
          {
            heading: "Компонента 1",
            display: "0,02",
            value: 0.02,
            tone: "weak-a",
            box: { x: 135, y: 78, w: 180, h: 112 },
            valueAt: { x: 225, y: 134 },
            captionAt: { x: 225, y: 164 },
            caption: "малая доля"
          },
          {
            heading: "Компонента 2",
            display: "0,95",
            value: 0.95,
            tone: "strong",
            box: { x: 315, y: 78, w: 180, h: 112 },
            valueAt: { x: 405, y: 134 },
            captionAt: { x: 405, y: 164 },
            caption: "максимум",
            attach: { x: 472, y: 190 },
            hardLabel: "кластер 2"
          },
          {
            heading: "Компонента 3",
            display: "0,03",
            value: 0.03,
            tone: "weak-b",
            box: { x: 495, y: 78, w: 180, h: 112 },
            valueAt: { x: 585, y: 134 },
            captionAt: { x: 585, y: 164 },
            caption: "малая доля"
          }
        ],
        equation: "0,02 + 0,95 + 0,03 = 1",
        sumCaption: "вся уверенность распределена внутри строки"
      },
      {
        origin: { x: 32, y: 18 },
        scale: { x: 1, y: 1 }
      },
      {
        headingY: 52,
        rowLabelAt: { x: 112, y: 134 },
        rowGuide: [
          { x: 125, y: 68 },
          { x: 125, y: 200 },
          { x: 685, y: 200 }
        ],
        sumBox: { x: 135, y: 222, w: 390, h: 78 },
        sumAt: { x: 330, y: 258 },
        sumCaptionAt: { x: 330, y: 283 },
        arrowRoute: [
          { x: 520, y: 312 },
          { x: 608, y: 312 }
        ],
        arrowHead: [
          { x: 608, y: 312 },
          { x: 588, y: 300 },
          { x: 588, y: 324 }
        ],
        arrowLabelAt: { x: 500, y: 214 },
        arrowLabel: "берём самое большое значение",
        badge: { x: 625, y: 274, w: 255, h: 76 },
        badgeKickerAt: { x: 752, y: 302 },
        badgeValueAt: { x: 752, y: 329 },
        badgeKicker: "жёсткая метка",
        footerAt: { x: 135, y: 344 },
        footer: "Мягкий ответ сохраняет три доли; жёсткий — только победителя.",
        fallbackAt: { x: 40, y: 120 }
      }
    ];

    const [content, transform, layout] = diagramData;
    const origin = Object.freeze({
      x: transform.origin.x,
      y: transform.origin.y
    });
    const scale = Object.freeze({
      x: transform.scale.x,
      y: transform.scale.y
    });

    const canvas = { width: 960, height: 390 };
    const labelPadding = 8;
    const lineWidth = 2;
    const emphasisWidth = 4;
    const bodyFontSize = 17;
    const valueFontSize = 24;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, textValue) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        if (textValue !== undefined) {
          node.textContent = textValue;
        }
        return node;
      };

      const add = node => {
        svg.appendChild(node);
        return node;
      };

      const addRect = (spec, className, extra) => add(make("rect", {
        x: sx(spec.x),
        y: sy(spec.y),
        width: sx(spec.x + spec.w) - sx(spec.x),
        height: sy(spec.y + spec.h) - sy(spec.y),
        class: className,
        ...extra
      }));

      const addText = (point, textValue, className, anchor) => add(make("text", {
        x: sx(point.x),
        y: sy(point.y),
        class: className,
        "text-anchor": anchor
      }, textValue));

      const pointsAttribute = points => points
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");

      const values = content.components.map(component => component.value);
      const largestValue = Math.max(...values);
      const selected = content.components.find(component => component.value === largestValue);

      add(make("polyline", {
        points: pointsAttribute(layout.rowGuide),
        class: "guide"
      }));

      addText(
        layout.rowLabelAt,
        content.point,
        "row-label",
        "end"
      );

      content.components.forEach(component => {
        const headingPoint = {
          x: component.valueAt.x,
          y: layout.headingY
        };

        addText(
          headingPoint,
          component.heading,
          "column-label",
          "middle"
        );

        if (component === selected) {
          const halo = {
            x: component.box.x - labelPadding,
            y: component.box.y - labelPadding,
            w: component.box.w + labelPadding + labelPadding,
            h: component.box.h + labelPadding + labelPadding
          };
          addRect(halo, "selection-halo", {
            "stroke-width": lineWidth
          });
        }

        addRect(component.box, `cell ${component.tone}`, {
          "stroke-width": component === selected ? emphasisWidth : lineWidth
        });

        addText(
          component.valueAt,
          component.display,
          component === selected
            ? "cell-value cell-value-strong"
            : "cell-value",
          "middle"
        );

        addText(
          component.captionAt,
          component.caption,
          component === selected
            ? "cell-caption cell-caption-strong"
            : "cell-caption",
          "middle"
        );
      });

      addRect(layout.sumBox, "sum-box", {
        "stroke-width": lineWidth
      });

      addText(
        layout.sumAt,
        content.equation,
        "sum-equation",
        "middle"
      );

      addText(
        layout.sumCaptionAt,
        content.sumCaption,
        "sum-caption",
        "middle"
      );

      const arrowPoints = [
        selected.attach,
        ...layout.arrowRoute
      ];

      add(make("polyline", {
        points: pointsAttribute(arrowPoints),
        class: "arrow-line",
        "stroke-width": emphasisWidth
      }));

      add(make("polygon", {
        points: pointsAttribute(layout.arrowHead),
        class: "arrow-head",
        "stroke-width": lineWidth
      }));

      addText(
        layout.arrowLabelAt,
        layout.arrowLabel,
        "arrow-label",
        "start"
      );

      addRect(layout.badge, "badge", {
        "stroke-width": lineWidth
      });

      addText(
        layout.badgeKickerAt,
        layout.badgeKicker,
        "badge-kicker",
        "middle"
      );

      addText(
        layout.badgeValueAt,
        selected.hardLabel,
        "badge-value",
        "middle"
      );

      addText(
        layout.footerAt,
        layout.footer,
        "footer-note",
        "start"
      );

      svg.setAttribute("data-canvas-width", String(canvas.width));
      svg.setAttribute("data-canvas-height", String(canvas.height));
      svg.style.setProperty("--body-font-size", `${bodyFontSize}px`);
      svg.style.setProperty("--value-font-size", `${valueFontSize}px`);
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const fallback = document.createElementNS(namespace, "text");
      fallback.setAttribute("x", String(sx(layout.fallbackAt.x)));
      fallback.setAttribute("y", String(sy(layout.fallbackAt.y)));
      fallback.setAttribute("class", "error-text");
      fallback.setAttribute("text-anchor", "start");
      fallback.textContent =
        "Схема: [0,02, 0,95, 0,03] дают сумму 1; максимум 0,95 выбирает кластер 2.";
      svg.appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
