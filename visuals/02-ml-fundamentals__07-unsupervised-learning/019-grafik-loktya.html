<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Локоть на графике inertia</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5f6b7a;
      --axis: #344054;
      --grid: #dbe3ec;
      --line: #3976d3;
      --soft-line: #8795a8;
      --elbow: #d85b28;
      --elbow-soft: #fff0e8;
      --steep-fill: #edf5ff;
      --flat-fill: #f4f6f8;
      --border: #d7e0e9;
      --shadow: rgba(23, 32, 51, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #18202c;
        --ink: #edf3fb;
        --muted: #aeb9c8;
        --axis: #d4deeb;
        --grid: #334052;
        --line: #75a8f8;
        --soft-line: #8492a6;
        --elbow: #ff8b5c;
        --elbow-soft: #40261f;
        --steep-fill: #1b2b42;
        --flat-fill: #202936;
        --border: #354255;
        --shadow: rgba(0, 0, 0, 0.22);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    .diagram {
      width: min(100%, 920px);
      margin: 0 auto;
      padding: 18px 20px 14px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px var(--shadow);
    }

    .diagram__title {
      margin: 0 0 4px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      line-height: 1.2;
    }

    .diagram__subtitle {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      overflow: visible;
      background: var(--panel);
    }

    svg text {
      font-family: inherit;
    }

    .zone-steep {
      fill: var(--steep-fill);
    }

    .zone-flat {
      fill: var(--flat-fill);
    }

    .grid {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .curve {
      fill: none;
      stroke: var(--line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .curve-flat {
      fill: none;
      stroke: var(--soft-line);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .point {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .point-flat {
      fill: var(--panel);
      stroke: var(--soft-line);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .elbow-halo {
      fill: var(--elbow-soft);
      stroke: var(--elbow);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .elbow-point {
      fill: var(--elbow);
      stroke: var(--panel);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .guide {
      fill: none;
      stroke: var(--elbow);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 6 6;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      fill: none;
      stroke: var(--elbow);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .value-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .phase-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .elbow-label {
      fill: var(--elbow);
      font-size: 17px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 6;
      stroke-linejoin: round;
    }

    .elbow-note {
      fill: var(--muted);
      font-size: 14px;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .fallback {
      display: none;
      margin: 16px 0 2px;
      padding: 16px;
      color: var(--ink);
      background: var(--elbow-soft);
      border: 1px solid var(--elbow);
      font-size: 15px;
      line-height: 1.45;
    }

    .fallback[data-visible="true"] {
      display: block;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title diagram-subtitle">
    <figcaption>
      <h1 class="diagram__title" id="diagram-title">Как выглядит локоть на графике inertia</h1>
      <p class="diagram__subtitle" id="diagram-subtitle">
        Резкое падение сменяется почти пологим участком около K = 3
      </p>
    </figcaption>

    <svg
      id="chart"
      viewBox="0 0 920 430"
      width="920"
      height="430"
      role="img"
      aria-labelledby="svg-title svg-description"
      preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">График inertia для K от 1 до 5</title>
      <desc id="svg-description">
        Значения inertia равны 900, 300, 120, 110 и 105. Локоть выделен при K = 3.
      </desc>
    </svg>

    <div class="fallback" id="fallback" role="status">
      Схема должна была показать график inertia со значениями 900, 300, 120,
      110 и 105 для K от 1 до 5 и выделенный локоть при K = 3.
    </div>
  </figure>

  <script>
    (() => {
      const data = Object.freeze([
        Object.freeze({ k: 1, inertia: 900 }),
        Object.freeze({ k: 2, inertia: 300 }),
        Object.freeze({ k: 3, inertia: 120 }),
        Object.freeze({ k: 4, inertia: 110 }),
        Object.freeze({ k: 5, inertia: 105 })
      ]);

      const canvas = Object.freeze({ width: 920, height: 430 });
      const [first, second, elbow, fourth, last] = data;
      const zero = canvas.width - canvas.width;
      const maxY = first.inertia + second.inertia / elbow.k;
      const endX = last.k + first.k / second.k;
      const origin = Object.freeze({
        x: canvas.width / (last.k + elbow.k + first.k),
        y: canvas.height - canvas.height / (last.k + last.k)
      });
      const scale = Object.freeze({
        x: (canvas.width - origin.x - canvas.width / (last.k + last.k)) / endX,
        y: (origin.y - canvas.height / (last.k + last.k)) / maxY
      });

      const sx = x => origin.x + x * scale.x;
      const sy = y => origin.y - y * scale.y;

      const labelPad = 12;
      const labelPadWide = 20;
      const lineWidth = 2;
      const fontSmall = 14;
      const fontMain = 15;
      const fontEmphasis = 17;
      const svg = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, className, text) => {
        const node = document.createElementNS(namespace, name);
        if (className) node.setAttribute("class", className);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const add = (parent, name, attributes, className, text) => {
        const node = make(name, attributes, className, text);
        parent.appendChild(node);
        return node;
      };

      const line = (parent, x1, y1, x2, y2, className) =>
        add(parent, "line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2)
        }, className);

      const textAt = (parent, x, y, dx, dy, anchor, className, text) =>
        add(parent, "text", {
          x: sx(x) + dx,
          y: sy(y) + dy,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, className, text);

      const circle = (parent, x, y, radius, className) =>
        add(parent, "circle", {
          cx: sx(x),
          cy: sy(y),
          r: radius
        }, className);

      const pathFrom = (parent, points, className) => {
        const [head, ...tail] = points;
        const commands = [
          `M ${sx(head.k)} ${sy(head.inertia)}`,
          ...tail.map(point => `L ${sx(point.k)} ${sy(point.inertia)}`)
        ];
        return add(parent, "path", { d: commands.join(" ") }, className);
      };

      try {
        const zones = add(svg, "g", {}, "zones");
        const axes = add(svg, "g", {}, "axes");
        const plot = add(svg, "g", {}, "plot");
        const annotations = add(svg, "g", {}, "annotations");
        const labels = add(svg, "g", {}, "labels");

        add(zones, "rect", {
          x: sx(zero),
          y: sy(maxY),
          width: sx(elbow.k) - sx(zero),
          height: sy(zero) - sy(maxY)
        }, "zone-steep");

        add(zones, "rect", {
          x: sx(elbow.k),
          y: sy(maxY),
          width: sx(endX) - sx(elbow.k),
          height: sy(zero) - sy(maxY)
        }, "zone-flat");

        data.forEach(point => {
          line(axes, zero, point.inertia, endX, point.inertia, "grid");
        });

        line(axes, zero, zero, endX, zero, "axis");
        line(axes, zero, zero, zero, maxY, "axis");

        data.forEach(point => {
          add(axes, "line", {
            x1: sx(point.k),
            y1: sy(zero) - labelPad,
            x2: sx(point.k),
            y2: sy(zero) + labelPad
          }, "tick");

          textAt(
            labels,
            point.k,
            zero,
            zero,
            labelPadWide + fontSmall,
            "middle",
            "tick-label",
            String(point.k)
          );
        });

        pathFrom(plot, [first, second, elbow], "curve");
        pathFrom(plot, [elbow, fourth, last], "curve-flat");

        line(
          annotations,
          elbow.k,
          zero,
          elbow.k,
          elbow.inertia,
          "guide"
        );

        data.forEach(point => {
          if (point.k === elbow.k) return;
          circle(
            plot,
            point.k,
            point.inertia,
            lineWidth + lineWidth + lineWidth,
            point.k > elbow.k ? "point-flat" : "point"
          );
        });

        circle(
          plot,
          elbow.k,
          elbow.inertia,
          labelPadWide,
          "elbow-halo"
        );

        circle(
          plot,
          elbow.k,
          elbow.inertia,
          lineWidth + lineWidth + lineWidth + lineWidth,
          "elbow-point"
        );

        const leaderTail = {
          k: elbow.k + first.k / second.k,
          inertia: second.inertia + elbow.inertia
        };
        const leaderBend = {
          k: elbow.k + first.k / fourth.k,
          inertia: second.inertia - elbow.inertia / elbow.k
        };

        add(annotations, "path", {
          d: [
            `M ${sx(leaderTail.k)} ${sy(leaderTail.inertia)}`,
            `L ${sx(leaderBend.k)} ${sy(leaderBend.inertia)}`,
            `L ${sx(elbow.k)} ${sy(elbow.inertia)}`
          ].join(" ")
        }, "leader");

        textAt(
          labels,
          zero,
          maxY,
          zero,
          -labelPadWide,
          "start",
          "axis-label",
          "Inertia — меньше значит плотнее"
        );

        textAt(
          labels,
          endX,
          zero,
          zero,
          labelPadWide + fontSmall + fontMain,
          "end",
          "axis-label",
          "Количество кластеров K"
        );

        textAt(
          labels,
          first.k + first.k / second.k,
          first.inertia - second.inertia,
          zero,
          -labelPad,
          "middle",
          "phase-label",
          "резкое снижение"
        );

        textAt(
          labels,
          fourth.k,
          second.inertia,
          zero,
          -labelPadWide,
          "middle",
          "phase-label",
          "дальше — почти полого"
        );

        textAt(
          labels,
          leaderTail.k,
          leaderTail.inertia,
          labelPad,
          -labelPad,
          "start",
          "elbow-label",
          "Локоть: K = 3"
        );

        textAt(
          labels,
          leaderTail.k,
          leaderTail.inertia,
          labelPad,
          labelPad + fontEmphasis,
          "start",
          "elbow-note",
          "после него выигрыш мал"
        );

        textAt(
          labels,
          first.k,
          first.inertia,
          labelPad,
          labelPadWide,
          "start",
          "value-label",
          String(first.inertia)
        );

        textAt(
          labels,
          second.k,
          second.inertia,
          -labelPad,
          -labelPadWide,
          "end",
          "value-label",
          String(second.inertia)
        );

        textAt(
          labels,
          elbow.k,
          elbow.inertia,
          -labelPadWide,
          labelPadWide + fontSmall,
          "end",
          "value-label",
          String(elbow.inertia)
        );

        textAt(
          labels,
          fourth.k,
          fourth.inertia,
          zero,
          -labelPadWide,
          "middle",
          "value-label",
          String(fourth.inertia)
        );

        textAt(
          labels,
          last.k,
          last.inertia,
          labelPad,
          labelPadWide,
          "start",
          "value-label",
          String(last.inertia)
        );

        svg.style.setProperty("--chart-line-width", `${lineWidth}px`);
        svg.style.setProperty("--chart-font-small", `${fontSmall}px`);
        svg.style.setProperty("--chart-font-main", `${fontMain}px`);
        svg.style.setProperty("--chart-font-emphasis", `${fontEmphasis}px`);
      } catch (error) {
        svg.setAttribute("hidden", "hidden");
        fallback.setAttribute("data-visible", "true");
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
