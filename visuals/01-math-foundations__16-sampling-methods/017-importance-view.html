<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Как редкая выборка получает большой вес</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: white;
      --ink: midnightblue;
      --axis: darkslategray;
      --muted: slategray;
      --border: lightsteelblue;
      --p: royalblue;
      --q: darkorange;
      --accent: crimson;
      --zone: aliceblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: midnightblue;
        --ink: aliceblue;
        --axis: lightsteelblue;
        --muted: gainsboro;
        --border: slategray;
        --p: deepskyblue;
        --q: gold;
        --accent: tomato;
        --zone: darkslateblue;
      }
    }

    html,
    body {
      background: var(--surface);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    .frame {
      max-width: 960px;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 21px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--surface);
    }

    .axis-line,
    .guide,
    .rare-guide,
    .curve,
    .leader {
      fill: none;
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis-line {
      stroke: var(--axis);
      stroke-width: 2px;
    }

    .axis-head {
      fill: var(--axis);
    }

    .zone {
      fill: var(--zone);
    }

    .guide {
      stroke: var(--muted);
      stroke-width: 1px;
    }

    .rare-guide {
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .curve-p {
      stroke: var(--p);
      stroke-width: 4px;
    }

    .curve-q {
      stroke: var(--q);
      stroke-width: 4px;
    }

    .sample {
      fill: var(--surface);
      stroke: var(--ink);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .sample-rare {
      fill: var(--accent);
      stroke: var(--surface);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .ratio-marker {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .leader-head {
      fill: var(--accent);
    }

    text {
      fill: var(--ink);
      font-size: 16px;
    }

    .axis-label,
    .note {
      fill: var(--muted);
      font-size: 15px;
    }

    .curve-label {
      font-size: 18px;
      font-weight: bold;
    }

    .label-p {
      fill: var(--p);
    }

    .label-q {
      fill: var(--q);
    }

    .weight {
      font-size: 17px;
      font-weight: bold;
    }

    .weight-rare,
    .zone-label {
      fill: var(--accent);
    }

    .zone-label {
      font-size: 15px;
      font-weight: bold;
    }

    .legend {
      fill: var(--muted);
      font-size: 15px;
    }

    #fallback {
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Как редкая выборка получает большой вес</h1>

    <svg id="diagram"
         viewBox="0 0 960 360"
         width="960"
         height="360"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Три выборки из q(x) с весами 0.2, 1.1 и 8.0</title>
      <desc id="svg-desc">
        Редкая для q(x) выборка попадает в область высокой плотности p(x)
        и поэтому получает большой вес важности.
      </desc>
    </svg>

    <p id="fallback">
      Схема должна была показать кривые p(x) и q(x), три выборки с весами
      0.2, 1.1 и 8.0 и редкую для q(x) точку в области высокой p(x).
    </p>
  </main>

  <script>
    const DATA = [
      {
        kind: "frame",
        origin: { x: 95, y: 258 },
        scale: { x: 75, y: 50 },
        zero: 0,
        radius: 0.085,
        ratioRadius: 0.07,
        axis: {
          horizontal: [
            { x: 0, y: 0 },
            { x: 10, y: 0 }
          ],
          vertical: [
            { x: 0, y: 0 },
            { x: 0, y: 4.3 }
          ],
          horizontalHead: [
            { x: 10, y: 0 },
            { x: 9.78, y: 0.13 },
            { x: 9.78, y: -0.13 }
          ],
          verticalHead: [
            { x: 0, y: 4.3 },
            { x: -0.13, y: 4.06 },
            { x: 0.13, y: 4.06 }
          ]
        },
        axisLabels: [
          {
            value: "плотность",
            at: { x: 0, y: 4.3 },
            dx: 8,
            dy: -12,
            anchor: "start",
            className: "axis-label"
          },
          {
            value: "x",
            at: { x: 10, y: 0 },
            dx: 10,
            dy: 20,
            anchor: "start",
            className: "axis-label"
          }
        ],
        zone: {
          left: 6.7,
          right: 8.08,
          bottom: 0,
          top: 4.08
        },
        zoneLabel: {
          value: "область несоответствия",
          at: { x: 7.39, y: 4.08 },
          dx: 0,
          dy: -8,
          anchor: "middle",
          className: "zone-label"
        },
        legend: {
          value: "Точки на оси — выборки из q(x). Вес = p(x) / q(x).",
          at: { x: 5, y: -1.45 },
          dx: 0,
          dy: 0,
          anchor: "middle",
          className: "legend"
        }
      },
      {
        kind: "curve",
        key: "q",
        className: "curve curve-q",
        points: [
          { x: 0, y: 0.35 },
          { x: 0.5, y: 0.9 },
          { x: 1, y: 1.8 },
          { x: 1.5, y: 2.8 },
          { x: 2, y: 3.5 },
          { x: 2.5, y: 3.7 },
          { x: 3, y: 3.45 },
          { x: 3.5, y: 2.7 },
          { x: 4, y: 1.8 },
          { x: 4.6, y: 1 },
          { x: 5.2, y: 0.72 },
          { x: 6, y: 0.58 },
          { x: 6.8, y: 0.5 },
          { x: 7.4, y: 0.44 },
          { x: 8, y: 0.32 },
          { x: 8.8, y: 0.16 },
          { x: 10, y: 0.04 }
        ],
        label: {
          value: "q(x)",
          at: { x: 2.5, y: 3.7 },
          dx: 0,
          dy: -14,
          anchor: "middle",
          className: "curve-label label-q"
        }
      },
      {
        kind: "curve",
        key: "p",
        className: "curve curve-p",
        points: [
          { x: 0, y: 0.08 },
          { x: 0.8, y: 0.16 },
          { x: 1.5, y: 0.56 },
          { x: 2.4, y: 0.7 },
          { x: 3.2, y: 0.78 },
          { x: 4, y: 0.9 },
          { x: 4.6, y: 1.1 },
          { x: 5.2, y: 1.65 },
          { x: 6, y: 2.65 },
          { x: 6.6, y: 3.35 },
          { x: 7, y: 3.65 },
          { x: 7.4, y: 3.52 },
          { x: 8, y: 2.8 },
          { x: 8.6, y: 1.75 },
          { x: 9.2, y: 0.75 },
          { x: 10, y: 0.18 }
        ],
        label: {
          value: "p(x)",
          at: { x: 6.1, y: 3.08 },
          dx: -12,
          dy: -8,
          anchor: "end",
          className: "curve-label label-p"
        }
      },
      {
        kind: "sample",
        x: 1.5,
        qY: 2.8,
        weight: {
          value: "вес 0.2",
          at: { x: 1.5, y: -0.48 },
          dx: -8,
          dy: 10,
          anchor: "end",
          className: "weight"
        }
      },
      {
        kind: "sample",
        x: 4.6,
        qY: 1,
        weight: {
          value: "вес 1.1",
          at: { x: 4.6, y: -0.48 },
          dx: 8,
          dy: 10,
          anchor: "start",
          className: "weight"
        }
      },
      {
        kind: "sample",
        x: 7.4,
        qY: 0.44,
        pY: 3.52,
        rare: true,
        weight: {
          value: "вес 8.0",
          at: { x: 7.4, y: -0.48 },
          dx: 0,
          dy: 10,
          anchor: "middle",
          className: "weight weight-rare"
        }
      },
      {
        kind: "leader",
        path: [
          { x: 9.35, y: 3.86 },
          { x: 8.55, y: 3.86 },
          { x: 7.5, y: 3.54 }
        ],
        head: [
          { x: 7.5, y: 3.54 },
          { x: 7.73, y: 3.68 },
          { x: 7.7, y: 3.42 }
        ],
        label: {
          value: "p(x) здесь высока",
          at: { x: 9.7, y: 4.02 },
          dx: 0,
          dy: -6,
          anchor: "end",
          className: "note"
        }
      },
      {
        kind: "leader",
        path: [
          { x: 9.35, y: 1.18 },
          { x: 8.55, y: 1.18 },
          { x: 7.5, y: 0.47 }
        ],
        head: [
          { x: 7.5, y: 0.47 },
          { x: 7.75, y: 0.64 },
          { x: 7.7, y: 0.3 }
        ],
        label: {
          value: "q(x) здесь мала",
          at: { x: 9.7, y: 1.36 },
          dx: 0,
          dy: -6,
          anchor: "end",
          className: "note"
        }
      }
    ];

    const [frame, qCurve, pCurve, firstSample, middleSample, rareSample, pLeader, qLeader] = DATA;
    const origin = frame.origin;
    const scale = frame.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const diagram = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const fragment = document.createDocumentFragment();
      const make = (name, attributes = {}) => {
        const element = document.createElementNS(diagram.namespaceURI, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        return element;
      };

      const line = (start, end, className) => make("line", {
        x1: sx(start.x),
        y1: sy(start.y),
        x2: sx(end.x),
        y2: sy(end.y),
        class: className
      });

      const polygon = (points, className) => make("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      });

      const polyline = (points, className) => make("polyline", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      });

      const label = spec => {
        const element = make("text", {
          x: sx(spec.at.x),
          y: sy(spec.at.y),
          dx: spec.dx,
          dy: spec.dy,
          "text-anchor": spec.anchor,
          class: spec.className
        });
        element.textContent = spec.value;
        return element;
      };

      const curvePath = curve => {
        let first = true;
        const commands = curve.points.map(point => {
          const command = first ? "M" : "L";
          first = false;
          return `${command} ${sx(point.x)} ${sy(point.y)}`;
        });
        return make("path", {
          d: commands.join(" "),
          class: curve.className
        });
      };

      const sampleRadius = Math.abs(sx(frame.radius) - sx(frame.zero));
      const ratioRadius = Math.abs(sx(frame.ratioRadius) - sx(frame.zero));

      const zone = make("rect", {
        x: sx(frame.zone.left),
        y: sy(frame.zone.top),
        width: Math.abs(sx(frame.zone.right) - sx(frame.zone.left)),
        height: Math.abs(sy(frame.zone.bottom) - sy(frame.zone.top)),
        class: "zone"
      });

      fragment.append(zone);
      fragment.append(
        line(
          frame.axis.horizontal[frame.zero],
          frame.axis.horizontal.at(-frame.radius / frame.radius),
          "axis-line"
        )
      );
      fragment.append(
        line(
          frame.axis.vertical[frame.zero],
          frame.axis.vertical.at(-frame.radius / frame.radius),
          "axis-line"
        )
      );
      fragment.append(polygon(frame.axis.horizontalHead, "axis-head"));
      fragment.append(polygon(frame.axis.verticalHead, "axis-head"));
      frame.axisLabels.forEach(spec => fragment.append(label(spec)));
      fragment.append(label(frame.zoneLabel));

      fragment.append(curvePath(qCurve));
      fragment.append(curvePath(pCurve));
      fragment.append(label(qCurve.label));
      fragment.append(label(pCurve.label));

      [firstSample, middleSample, rareSample].forEach(sample => {
        fragment.append(
          line(
            { x: sample.x, y: frame.zero },
            { x: sample.x, y: sample.qY },
            "guide"
          )
        );

        fragment.append(make("circle", {
          cx: sx(sample.x),
          cy: sy(frame.zero),
          r: sampleRadius,
          class: sample.rare ? "sample-rare" : "sample"
        }));

        fragment.append(label(sample.weight));
      });

      fragment.append(
        line(
          { x: rareSample.x, y: rareSample.qY },
          { x: rareSample.x, y: rareSample.pY },
          "rare-guide"
        )
      );

      fragment.append(make("circle", {
        cx: sx(rareSample.x),
        cy: sy(rareSample.qY),
        r: ratioRadius,
        class: "ratio-marker"
      }));

      fragment.append(make("circle", {
        cx: sx(rareSample.x),
        cy: sy(rareSample.pY),
        r: ratioRadius,
        class: "ratio-marker"
      }));

      [pLeader, qLeader].forEach(leader => {
        fragment.append(polyline(leader.path, "leader"));
        fragment.append(polygon(leader.head, "leader-head"));
        fragment.append(label(leader.label));
      });

      fragment.append(label(frame.legend));
      diagram.append(fragment);
      fallback.hidden = true;
    } catch (error) {
      diagram.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать кривые p(x) и q(x), три выборки с весами 0.2, 1.1 и 8.0 и редкую для q(x) точку в области высокой p(x).";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
