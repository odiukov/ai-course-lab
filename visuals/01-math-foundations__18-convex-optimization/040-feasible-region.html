<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Свободный минимум и лучший допустимый минимум</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --ink: #182230;
      --muted: #536173;
      --axis: #7b8798;
      --contour: #8b98aa;
      --reachable: #2563eb;
      --free: #e45649;
      --best: #0f9f75;
      --boundary: #167c60;
      --feasible-fill: #dff5eb;
      --hatch: #76bda6;
      --halo: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111720;
        --panel: #18212d;
        --ink: #ecf2f8;
        --muted: #aab7c6;
        --axis: #8290a2;
        --contour: #8796aa;
        --reachable: #73a7ff;
        --free: #ff8176;
        --best: #55d6ad;
        --boundary: #55c8a3;
        --feasible-fill: #173f36;
        --hatch: #377e6b;
        --halo: #18212d;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 20px;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    .axis,
    .axis-arrow,
    .contour,
    .reachable,
    .boundary,
    .hatch,
    .leader {
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis,
    .axis-arrow {
      fill: none;
      stroke: var(--axis);
    }

    .contour {
      fill: none;
      stroke: var(--contour);
    }

    .reachable {
      fill: none;
      stroke: var(--reachable);
    }

    .boundary {
      fill: none;
      stroke: var(--boundary);
    }

    .hatch {
      stroke: var(--hatch);
    }

    .leader {
      fill: none;
      stroke: var(--muted);
    }

    .feasible {
      fill: var(--feasible-fill);
    }

    .free-point {
      fill: var(--free);
      stroke: var(--halo);
    }

    .best-ring {
      fill: var(--panel);
      stroke: var(--best);
    }

    .best-point {
      fill: var(--best);
    }

    .label {
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--halo);
      stroke-linejoin: round;
    }

    .secondary {
      fill: var(--muted);
    }

    .feasible-label {
      fill: var(--boundary);
    }

    .reachable-label {
      fill: var(--reachable);
    }

    #fallback {
      color: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="heading">Свободный минимум и лучший допустимый минимум</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 440"
      width="960"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Свободный и допустимый минимумы на линиях уровня</title>
      <desc id="svg-description">
        Свободный минимум расположен вне заштрихованной допустимой области.
        Самая низкая достижимая линия уровня касается границы в точке лучшего
        допустимого минимума.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать линии уровня с минимумом вне допустимой
      области и точку касания самой низкой достижимой линии с границей.
    </p>
  </main>

  <script>
    const data = Object.freeze({
      ns: "http://www.w3.org/2000/svg",
      zero: 0,
      canvas: { width: 960, height: 440 },
      transform: {
        originX: 82,
        originY: 398,
        scaleX: 82,
        scaleY: 82
      },
      plot: {
        x1: 0,
        y1: 0,
        x2: 10.2,
        y2: 4.55
      },
      axes: {
        x1: 0,
        y1: 0,
        x2: 10.18,
        y2: 4.52,
        xArrow: [
          { x1: 10.18, y1: 0, x2: 10.02, y2: 0.09 },
          { x1: 10.18, y1: 0, x2: 10.02, y2: -0.09 }
        ],
        yArrow: [
          { x1: 0, y1: 4.52, x2: -0.09, y2: 4.36 },
          { x1: 0, y1: 4.52, x2: 0.09, y2: 4.36 }
        ]
      },
      objective: {
        center: { x: 3.1, y: 2.25 },
        contours: [
          { radius: 0.72, className: "contour", opacity: 0.82 },
          { radius: 1.65, className: "contour", opacity: 0.88 },
          { radius: 2.7, className: "contour", opacity: 0.94 },
          { radius: 3.85, className: "reachable", opacity: 1 }
        ]
      },
      feasible: {
        x1: 6.95,
        y1: 0,
        x2: 10.2,
        y2: 4.55,
        hatchRun: 2.8,
        hatchStarts: [
          4.45,
          5.05,
          5.65,
          6.25,
          6.85,
          7.45,
          8.05,
          8.65,
          9.25,
          9.85
        ]
      },
      boundary: {
        x: 6.95,
        y1: 0,
        y2: 4.55
      },
      points: {
        free: { x: 3.1, y: 2.25, radius: 0.105 },
        best: {
          x: 6.95,
          y: 2.25,
          outerRadius: 0.18,
          innerRadius: 0.095
        }
      },
      leaders: [
        {
          className: "leader",
          points: [
            { x: 5.42, y: 4.16 },
            { x: 6.435, y: 4.175 }
          ],
          arrow: [
            { x1: 6.435, y1: 4.175, x2: 6.27, y2: 4.24 },
            { x1: 6.435, y1: 4.175, x2: 6.28, y2: 4.09 }
          ]
        },
        {
          className: "leader",
          points: [
            { x: 8.42, y: 1.93 },
            { x: 7.62, y: 2.02 },
            { x: 6.95, y: 2.25 }
          ],
          arrow: [
            { x1: 6.95, y1: 2.25, x2: 7.13, y2: 2.26 },
            { x1: 6.95, y1: 2.25, x2: 7.08, y2: 2.13 }
          ]
        }
      ],
      labels: [
        {
          text: "свободный минимум",
          x: 3.1,
          y: 2.25,
          dx: 0,
          dy: 29,
          anchor: "middle",
          className: "label",
          fontSize: 15,
          weight: "bold"
        },
        {
          text: "лучший допустимый минимум",
          x: 7.25,
          y: 2.25,
          dx: 12,
          dy: -22,
          anchor: "start",
          className: "label",
          fontSize: 15,
          weight: "bold"
        },
        {
          text: "самая низкая достижимая линия уровня",
          x: 2.05,
          y: 4.16,
          dx: 0,
          dy: 5,
          anchor: "start",
          className: "label reachable-label",
          fontSize: 14,
          weight: "bold"
        },
        {
          text: "допустимая область",
          x: 7.22,
          y: 4.05,
          dx: 12,
          dy: 0,
          anchor: "start",
          className: "label feasible-label",
          fontSize: 15,
          weight: "bold"
        },
        {
          text: "граница ограничения",
          x: 6.95,
          y: 0.62,
          dx: 15,
          dy: 0,
          anchor: "start",
          className: "label feasible-label",
          fontSize: 14,
          weight: "normal"
        },
        {
          text: "линии уровня",
          x: 1.0,
          y: 3.36,
          dx: 0,
          dy: 0,
          anchor: "start",
          className: "label secondary",
          fontSize: 14,
          weight: "normal"
        },
        {
          text: "x",
          x: 10.18,
          y: 0,
          dx: 0,
          dy: 24,
          anchor: "middle",
          className: "label secondary",
          fontSize: 15,
          weight: "normal"
        },
        {
          text: "y",
          x: 0,
          y: 4.52,
          dx: -13,
          dy: 4,
          anchor: "end",
          className: "label secondary",
          fontSize: 15,
          weight: "normal"
        }
      ],
      styles: {
        axisWidth: 1.4,
        contourWidth: 1.6,
        reachableWidth: 3.2,
        boundaryWidth: 3,
        hatchWidth: 1.1,
        leaderWidth: 1.35,
        pointStrokeWidth: 3,
        ringWidth: 3.2,
        labelHaloWidth: 5,
        feasibleOpacity: 0.82,
        hatchOpacity: 0.64
      },
      ids: {
        root: "runtime-root",
        plotClip: "plot-clip",
        feasibleClip: "feasible-clip"
      }
    });

    const origin = Object.freeze({
      x: data.transform.originX,
      y: data.transform.originY
    });

    const scale = Object.freeze({
      x: data.transform.scaleX,
      y: data.transform.scaleY
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const root = document.createElementNS(data.ns, "g");
      root.setAttribute("id", data.ids.root);
      svg.appendChild(root);

      const make = (name, attributes, parent = root) => {
        const node = document.createElementNS(data.ns, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }
        parent.appendChild(node);
        return node;
      };

      const drawLine = (segment, className, width, parent = root) =>
        make("line", {
          x1: sx(segment.x1),
          y1: sy(segment.y1),
          x2: sx(segment.x2),
          y2: sy(segment.y2),
          class: className,
          "stroke-width": width
        }, parent);

      const drawPolyline = (points, className, width, parent = root) =>
        make("polyline", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className,
          "stroke-width": width
        }, parent);

      const defs = make("defs", {}, root);

      const plotClip = make("clipPath", { id: data.ids.plotClip }, defs);
      make("rect", {
        x: sx(data.plot.x1),
        y: sy(data.plot.y2),
        width: sx(data.plot.x2) - sx(data.plot.x1),
        height: sy(data.plot.y1) - sy(data.plot.y2)
      }, plotClip);

      const feasibleClip = make("clipPath", { id: data.ids.feasibleClip }, defs);
      make("rect", {
        x: sx(data.feasible.x1),
        y: sy(data.feasible.y2),
        width: sx(data.feasible.x2) - sx(data.feasible.x1),
        height: sy(data.feasible.y1) - sy(data.feasible.y2)
      }, feasibleClip);

      const plotGroup = make("g", {
        "clip-path": `url(#${data.ids.plotClip})`
      });

      make("rect", {
        x: sx(data.feasible.x1),
        y: sy(data.feasible.y2),
        width: sx(data.feasible.x2) - sx(data.feasible.x1),
        height: sy(data.feasible.y1) - sy(data.feasible.y2),
        class: "feasible",
        opacity: data.styles.feasibleOpacity
      }, plotGroup);

      const hatchGroup = make("g", {
        "clip-path": `url(#${data.ids.feasibleClip})`,
        opacity: data.styles.hatchOpacity
      }, plotGroup);

      for (const start of data.feasible.hatchStarts) {
        drawLine({
          x1: start,
          y1: data.feasible.y1,
          x2: start + data.feasible.hatchRun,
          y2: data.feasible.y2
        }, "hatch", data.styles.hatchWidth, hatchGroup);
      }

      for (const contour of data.objective.contours) {
        make("circle", {
          cx: sx(data.objective.center.x),
          cy: sy(data.objective.center.y),
          r: sx(contour.radius) - sx(data.zero),
          class: contour.className,
          opacity: contour.opacity,
          "stroke-width": contour.className === "reachable"
            ? data.styles.reachableWidth
            : data.styles.contourWidth
        }, plotGroup);
      }

      drawLine({
        x1: data.boundary.x,
        y1: data.boundary.y1,
        x2: data.boundary.x,
        y2: data.boundary.y2
      }, "boundary", data.styles.boundaryWidth, plotGroup);

      drawLine({
        x1: data.axes.x1,
        y1: data.axes.y1,
        x2: data.axes.x2,
        y2: data.axes.y1
      }, "axis", data.styles.axisWidth);

      drawLine({
        x1: data.axes.x1,
        y1: data.axes.y1,
        x2: data.axes.x1,
        y2: data.axes.y2
      }, "axis", data.styles.axisWidth);

      for (const segment of data.axes.xArrow) {
        drawLine(segment, "axis-arrow", data.styles.axisWidth);
      }

      for (const segment of data.axes.yArrow) {
        drawLine(segment, "axis-arrow", data.styles.axisWidth);
      }

      for (const leader of data.leaders) {
        drawPolyline(
          leader.points,
          leader.className,
          data.styles.leaderWidth
        );

        for (const segment of leader.arrow) {
          drawLine(
            segment,
            leader.className,
            data.styles.leaderWidth
          );
        }
      }

      make("circle", {
        cx: sx(data.points.free.x),
        cy: sy(data.points.free.y),
        r: sx(data.points.free.radius) - sx(data.zero),
        class: "free-point",
        "stroke-width": data.styles.pointStrokeWidth
      });

      make("circle", {
        cx: sx(data.points.best.x),
        cy: sy(data.points.best.y),
        r: sx(data.points.best.outerRadius) - sx(data.zero),
        class: "best-ring",
        "stroke-width": data.styles.ringWidth
      });

      make("circle", {
        cx: sx(data.points.best.x),
        cy: sy(data.points.best.y),
        r: sx(data.points.best.innerRadius) - sx(data.zero),
        class: "best-point"
      });

      for (const label of data.labels) {
        const text = make("text", {
          x: sx(label.x),
          y: sy(label.y),
          dx: label.dx,
          dy: label.dy,
          "text-anchor": label.anchor,
          class: label.className,
          "font-size": label.fontSize,
          "font-weight": label.weight,
          "stroke-width": data.styles.labelHaloWidth
        });
        text.textContent = label.text;
      }

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const root = document.getElementById(data.ids.root);
      const fallback = document.getElementById("fallback");

      if (root) {
        root.remove();
      }

      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
