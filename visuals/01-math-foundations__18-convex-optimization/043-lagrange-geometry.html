<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Касание линии уровня и ограничения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #526078;
      --axis: #8994a8;
      --contour: #98a5ba;
      --outer: #71819c;
      --tangent: #0b79d0;
      --constraint: #d1495b;
      --grad-f: #087f5b;
      --grad-g: #8e44ad;
      --point: #132238;
      --halo: #ffffff;
      --border: #dbe2ec;
      --note: #eef6fd;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .diagram {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .diagram__title {
      margin: 0;
      padding: 10px 18px 8px;
      font-size: 20px;
      line-height: 1.25;
      font-weight: bold;
      color: var(--ink);
      background: var(--panel);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 476px;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.5;
      fill: none;
    }

    .contour {
      stroke: var(--contour);
      stroke-width: 1.8;
      fill: none;
    }

    .contour-outer {
      stroke: var(--outer);
      stroke-width: 2;
      fill: none;
    }

    .contour-tangent {
      stroke: var(--tangent);
      stroke-width: 3.5;
      fill: none;
    }

    .constraint {
      stroke: var(--constraint);
      stroke-width: 4;
      fill: none;
    }

    .gradient-f {
      stroke: var(--grad-f);
      stroke-width: 3.5;
      fill: var(--grad-f);
    }

    .gradient-g {
      stroke: var(--grad-g);
      stroke-width: 3.5;
      fill: var(--grad-g);
    }

    .point {
      fill: var(--point);
      stroke: var(--halo);
      stroke-width: 3;
    }

    .leader {
      stroke: var(--muted);
      stroke-width: 1.3;
      fill: none;
    }

    .legend-swatch {
      stroke-width: 4;
      fill: none;
    }

    text {
      font-size: 16px;
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--halo);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .axis-label {
      font-size: 17px;
      font-weight: bold;
      fill: var(--muted);
    }

    .equation-label {
      font-size: 17px;
      font-weight: bold;
    }

    .point-label {
      font-size: 16px;
      font-weight: bold;
    }

    .gradient-label {
      font-size: 17px;
      font-weight: bold;
    }

    .legend-label {
      font-size: 15px;
      fill: var(--muted);
    }

    .summary {
      font-size: 17px;
      font-weight: bold;
      fill: var(--ink);
    }

    .fallback {
      margin: 0;
      padding: 24px;
      font-size: 16px;
      line-height: 1.45;
      color: var(--ink);
      background: var(--note);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #18202d;
        --ink: #edf3fb;
        --muted: #bac6d8;
        --axis: #8190a7;
        --contour: #687890;
        --outer: #91a3bd;
        --tangent: #56b4ff;
        --constraint: #ff7182;
        --grad-f: #55d6a8;
        --grad-g: #d49af1;
        --point: #ffffff;
        --halo: #18202d;
        --border: #354156;
        --note: #202c3c;
      }
    }
  </style>
</head>
<body>
  <main class="diagram" aria-labelledby="diagram-title">
    <h2 class="diagram__title" id="diagram-title">Касание линии уровня и ограничения</h2>
    <svg id="plot" role="img" aria-labelledby="svg-title svg-desc"
         preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">Условный минимум в точке касания</title>
      <desc id="svg-desc">Линии уровня функции x² плюс y² и прямая x плюс y равно единице касаются в точке 0.5, 0.5. Градиенты функции и ограничения параллельны.</desc>
    </svg>
    <p class="fallback" id="fallback" hidden>
      Схема должна была показать линии уровня x² + y², прямую x + y = 1,
      их касание в точке (0.5, 0.5) и параллельные градиенты функции и ограничения.
    </p>
  </main>

  <script>
    "use strict";

    const data = [
      ["origin", [280, 275]],
      ["scale", [200]],
      ["zero", [0]],
      ["axes", [[-0.95, 0], [1.55, 0], [0, -0.8], [0, 1.25]]],
      ["axisHeads", [0.055, 0.025]],
      ["contours", [0.86, 0.76, 0.58]],
      ["solution", [0.5, 0.5]],
      ["constraint", [[-0.25, 1.25], [1.42, -0.42]]],
      ["gradF", [[0.46, 0.54], [0.76, 0.84]]],
      ["gradG", [[0.54, 0.46], [0.84, 0.76]]],
      ["gradHeads", [0.07, 0.04]],
      ["pointRadius", [0.028]],
      ["labels", [
        ["x", [1.55, 0], 12, 23, "start", "axis-label"],
        ["y", [0, 1.25], -13, 6, "end", "axis-label"],
        ["x + y = 1 — допустимый маршрут", [1.03, -0.03], 18, 24, "start", "equation-label"],
        ["(0.5, 0.5)", [0.5, 0.5], -17, 31, "end", "point-label"],
        ["∇f", [0.46, 0.54], -12, -12, "end", "gradient-label"],
        ["∇g", [0.54, 0.46], 14, 23, "start", "gradient-label"],
        ["∇f ∥ ∇g", [1.78, 0.38], 0, 0, "start", "summary"]
      ]],
      ["legend", [
        [[1.7, 1.08], [1.9, 1.08], [2, 1.08], "большие линии: маршрут пересекает их", "contour-outer"],
        [[1.7, 0.88], [1.9, 0.88], [2, 0.88], "x² + y² = 0.5: линия касается", "contour-tangent"],
        [[1.7, 0.68], [1.9, 0.68], [2, 0.68], "малая линия: маршрут недостижим", "contour"]
      ]],
      ["callout", [
        [0.5, 0.5],
        [1.48, 0.49],
        [1.66, 0.49],
        "самая дешёвая достижимая линия"
      ]],
      ["calloutOffset", [10, -9]],
      ["circleCenter", [0, 0]]
    ];

    const origin = value("origin");
    const scale = value("scale").at(-1);
    const canvasWidth = 960;
    const canvasHeight = 460;

    function value(name) {
      return data.find(function (entry) {
        return entry.at(-entry.length) === name;
      }).at(-1);
    }

    function sx(x) {
      return origin.at(-origin.length) + x * scale;
    }

    function sy(y) {
      return origin.at(-1) - y * scale;
    }

    try {
      const svg = document.getElementById("plot");
      const namespace = "http://www.w3.org/2000/svg";
      const zero = value("zero").at(-1);

      svg.setAttribute("viewBox", [zero, zero, canvasWidth, canvasHeight].join(" "));
      svg.setAttribute("width", canvasWidth);
      svg.setAttribute("height", canvasHeight);

      function element(name, attributes, className) {
        const node = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(function (entry) {
          node.setAttribute(entry.at(-entry.length), entry.at(-1));
        });

        if (className) {
          node.setAttribute("class", className);
        }

        svg.appendChild(node);
        return node;
      }

      function line(a, b, className) {
        return element("line", {
          x1: sx(a.at(-a.length)),
          y1: sy(a.at(-1)),
          x2: sx(b.at(-b.length)),
          y2: sy(b.at(-1))
        }, className);
      }

      function polygon(points, className) {
        const pixels = points.map(function (point) {
          return [sx(point.at(-point.length)), sy(point.at(-1))].join(",");
        }).join(" ");

        return element("polygon", { points: pixels }, className);
      }

      function circle(center, radius, className) {
        return element("circle", {
          cx: sx(center.at(-center.length)),
          cy: sy(center.at(-1)),
          r: Math.abs(sx(radius) - sx(zero))
        }, className);
      }

      function label(content, anchor, dx, dy, textAnchor, className) {
        const node = element("text", {
          x: sx(anchor.at(-anchor.length)) + dx,
          y: sy(anchor.at(-1)) + dy,
          "text-anchor": textAnchor
        }, className);

        node.textContent = content;
        return node;
      }

      function arrow(start, end, headLength, headWidth, className) {
        const dx = end.at(-end.length) - start.at(-start.length);
        const dy = end.at(-1) - start.at(-1);
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const nx = -uy;
        const ny = ux;
        const base = [
          end.at(-end.length) - ux * headLength,
          end.at(-1) - uy * headLength
        ];
        const left = [
          base.at(-base.length) + nx * headWidth,
          base.at(-1) + ny * headWidth
        ];
        const right = [
          base.at(-base.length) - nx * headWidth,
          base.at(-1) - ny * headWidth
        ];

        line(start, end, className);
        polygon([end, left, right], className);
      }

      const axes = value("axes");
      const axisHead = value("axisHeads");

      arrow(
        axes.at(-axes.length),
        axes.at(-axes.length + axes.length / axes.length),
        axisHead.at(-axisHead.length),
        axisHead.at(-1),
        "axis"
      );

      arrow(
        axes.at(-axes.length + axes.length / (axes.length / axes.length + axes.length / axes.length)),
        axes.at(-1),
        axisHead.at(-axisHead.length),
        axisHead.at(-1),
        "axis"
      );

      const center = value("circleCenter");
      const contourRadii = value("contours");

      circle(center, contourRadii.at(-contourRadii.length), "contour-outer");
      circle(center, contourRadii.at(-contourRadii.length + contourRadii.length / contourRadii.length), "contour-outer");

      const solution = value("solution");
      const tangentRadius = Math.hypot(
        solution.at(-solution.length),
        solution.at(-1)
      );

      circle(center, tangentRadius, "contour-tangent");
      circle(center, contourRadii.at(-1), "contour");

      const constraint = value("constraint");
      line(
        constraint.at(-constraint.length),
        constraint.at(-1),
        "constraint"
      );

      const head = value("gradHeads");
      const gradF = value("gradF");
      const gradG = value("gradG");

      arrow(
        gradF.at(-gradF.length),
        gradF.at(-1),
        head.at(-head.length),
        head.at(-1),
        "gradient-f"
      );

      arrow(
        gradG.at(-gradG.length),
        gradG.at(-1),
        head.at(-head.length),
        head.at(-1),
        "gradient-g"
      );

      circle(
        solution,
        value("pointRadius").at(-1),
        "point"
      );

      value("labels").forEach(function (item) {
        label(
          item.at(-item.length),
          item.at(-item.length + item.length / item.length),
          item.at(-item.length + item.length / (item.length / item.length + item.length / item.length)),
          item.at(-item.length + item.length / (item.length / item.length + item.length / item.length) + item.length / item.length),
          item.at(-item.length + item.length / item.length + item.length / item.length + item.length / item.length + item.length / item.length),
          item.at(-1)
        );
      });

      value("legend").forEach(function (item) {
        line(
          item.at(-item.length),
          item.at(-item.length + item.length / item.length),
          "legend-swatch " + item.at(-1)
        );

        label(
          item.at(-item.length + item.length / (item.length / item.length + item.length / item.length)),
          item.at(-item.length + item.length / item.length + item.length / item.length),
          zero,
          value("calloutOffset").at(-1),
          "start",
          "legend-label"
        );
      });

      const callout = value("callout");
      const calloutOffset = value("calloutOffset");

      line(
        callout.at(-callout.length),
        callout.at(-callout.length + callout.length / callout.length),
        "leader"
      );

      line(
        callout.at(-callout.length + callout.length / callout.length),
        callout.at(-callout.length + callout.length / (callout.length / callout.length + callout.length / callout.length)),
        "leader"
      );

      label(
        callout.at(-1),
        callout.at(-callout.length + callout.length / (callout.length / callout.length + callout.length / callout.length)),
        calloutOffset.at(-calloutOffset.length),
        calloutOffset.at(-1),
        "start",
        "legend-label"
      );
    } catch (error) {
      document.getElementById("plot").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
