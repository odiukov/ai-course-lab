<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Одна выпуклая долина против нескольких ловушек</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f7f9fc;
    --ink:#172033;
    --muted:#667085;
    --grid:#d8deea;
    --divider:#b8c2d4;
    --surface:#dfe9ff;
    --surface-line:#4567a9;
    --terrain:#f1dfc8;
    --terrain-line:#805d3d;
    --route:#087ea4;
    --start:#e98228;
    --local:#c43d73;
    --global:#18865b;
    --barrier:#a33a3a;
    --panel:#ffffff;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#101522;
      --ink:#edf2ff;
      --muted:#aab5ca;
      --grid:#273247;
      --divider:#43506a;
      --surface:#202f50;
      --surface-line:#87a9ef;
      --terrain:#443626;
      --terrain-line:#d5a977;
      --route:#55c7ec;
      --start:#ffab5c;
      --local:#ff79aa;
      --global:#51d59b;
      --barrier:#ff8a8a;
      --panel:#151c2b;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  figure{
    margin:0;
    background:var(--panel);
    border:1px solid var(--grid);
    overflow:hidden;
  }
  h1{
    margin:0;
    padding:12px 16px 8px;
    font-size:18px;
    line-height:1.25;
    font-weight:700;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:470px;
    background:var(--panel);
  }
  svg[hidden],[hidden]{display:none}
  .divider{stroke:var(--divider);stroke-width:1.5;stroke-dasharray:5 6}
  .baseline{stroke:var(--grid);stroke-width:1}
  .fill-convex{fill:var(--surface)}
  .fill-terrain{fill:var(--terrain)}
  .profile-convex{fill:none;stroke:var(--surface-line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .profile-terrain{fill:none;stroke:var(--terrain-line);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
  .contour-convex{fill:none;stroke:var(--surface-line);stroke-width:1;opacity:.3}
  .contour-terrain{fill:none;stroke:var(--terrain-line);stroke-width:1;opacity:.32}
  .route{fill:none;stroke:var(--route);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .route-head{fill:var(--route)}
  .minimum-set{stroke:var(--global);stroke-width:7;stroke-linecap:round}
  .escape{fill:none;stroke:var(--barrier);stroke-width:2;stroke-dasharray:5 5}
  .leader{stroke:var(--muted);stroke-width:1.25}
  .start{fill:var(--start);stroke:var(--panel);stroke-width:2}
  .local{fill:var(--local);stroke:var(--panel);stroke-width:2}
  .global{fill:var(--global);stroke:var(--panel);stroke-width:2}
  .saddle{fill:var(--panel);stroke:var(--terrain-line);stroke-width:2}
  .legend-line{stroke:var(--route);stroke-width:2.5;stroke-linecap:round}
  .panel-title{fill:var(--ink);font-size:16px;font-weight:750;letter-spacing:.03em}
  .panel-subtitle{fill:var(--muted);font-size:13px}
  .label{fill:var(--ink);font-size:13px;font-weight:600}
  .minor{fill:var(--muted);font-size:12px}
  .barrier-label{fill:var(--barrier);font-size:12px;font-weight:650}
  .legend{fill:var(--muted);font-size:12px}
  #fallback{
    margin:0;
    padding:18px 16px 22px;
    color:var(--ink);
    font-size:14px;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Одна выпуклая долина против нескольких ловушек</h1>
  <p id="fallback">Схема должна была показать выпуклую чашу, где все траектории сходятся к глобальному дну, и невыпуклый рельеф с локальными минимумами и седлом.</p>
  <svg id="diagram" hidden viewBox="0 0 920 452" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Сравнение градиентного спуска на выпуклой и невыпуклой поверхности"></svg>
</figure>

<script>
const data=[{
  origin:{x:40,y:330},
  scale:{x:13.2,y:20},
  zero:0,
  divider:{a:{x:33.5,y:15.1},b:{x:33.5,y:-3.1}},
  baseline:{a:{x:2,y:0},b:{x:65.5,y:0}},
  convex:[
    {x:2.5,y:11.7},{x:5.2,y:8.8},{x:8.2,y:6.1},{x:11,y:3.8},
    {x:13.3,y:2},{x:15.1,y:1.2},{x:18,y:1.2},{x:20.2,y:1.6},
    {x:22.6,y:3},{x:25.5,y:5.8},{x:28.3,y:9.1},{x:31,y:12}
  ],
  convexFill:[
    {x:2.5,y:11.7},{x:5.2,y:8.8},{x:8.2,y:6.1},{x:11,y:3.8},
    {x:13.3,y:2},{x:15.1,y:1.2},{x:18,y:1.2},{x:20.2,y:1.6},
    {x:22.6,y:3},{x:25.5,y:5.8},{x:28.3,y:9.1},{x:31,y:12},
    {x:31,y:.25},{x:2.5,y:.25}
  ],
  convexContours:[
    [{x:5,y:6.9},{x:9,y:3.7},{x:13.5,y:1.4},{x:19.7,y:1.4},{x:24.2,y:3.8},{x:28.7,y:7.5}],
    [{x:7,y:5.2},{x:11,y:2.7},{x:14.3,y:1},{x:18.8,y:1},{x:22.4,y:2.5},{x:26.5,y:5.5}]
  ],
  terrain:[
    {x:36,y:8.4},{x:37.7,y:11.7},{x:39.4,y:8.1},{x:41.5,y:4.1},
    {x:43.5,y:6.1},{x:45.8,y:7.9},{x:47.5,y:5.7},{x:50.3,y:1.35},
    {x:52.5,y:5.8},{x:55.2,y:11.8},{x:57.1,y:7.2},{x:59.1,y:3.8},
    {x:61.2,y:6.2},{x:63.6,y:11.2},{x:65.5,y:8.1}
  ],
  terrainFill:[
    {x:36,y:8.4},{x:37.7,y:11.7},{x:39.4,y:8.1},{x:41.5,y:4.1},
    {x:43.5,y:6.1},{x:45.8,y:7.9},{x:47.5,y:5.7},{x:50.3,y:1.35},
    {x:52.5,y:5.8},{x:55.2,y:11.8},{x:57.1,y:7.2},{x:59.1,y:3.8},
    {x:61.2,y:6.2},{x:63.6,y:11.2},{x:65.5,y:8.1},
    {x:65.5,y:.25},{x:36,y:.25}
  ],
  terrainContours:[
    [{x:37,y:7.2},{x:39.6,y:5.3},{x:41.5,y:3.2},{x:44,y:4.7},{x:45.8,y:6.2}],
    [{x:46.1,y:6.1},{x:48,y:4.2},{x:50.3,y:.75},{x:52.8,y:4.2},{x:55.2,y:9.5}],
    [{x:55.5,y:8.8},{x:57.2,y:5.6},{x:59.1,y:3},{x:61.2,y:4.9},{x:64.1,y:8.5}]
  ],
  routes:[
    {points:[{x:5.2,y:8.8},{x:7.4,y:6.7},{x:10.5,y:4.1},{x:13.4,y:2.1},{x:15.35,y:1.2}],
     head:[{x:15.35,y:1.2},{x:14.72,y:1.28},{x:15.02,y:1.68}]},
    {points:[{x:12.2,y:2.9},{x:13.5,y:2},{x:14.8,y:1.35},{x:16.2,y:1.2}],
     head:[{x:16.2,y:1.2},{x:15.64,y:.94},{x:15.7,y:1.48}]},
    {points:[{x:28,y:8.75},{x:25.4,y:5.7},{x:22.6,y:3.1},{x:20,y:1.65},{x:17.75,y:1.2}],
     head:[{x:17.75,y:1.2},{x:18.34,y:1.58},{x:18.42,y:1.02}]},
    {points:[{x:37.7,y:11.7},{x:38.4,y:9.4},{x:39.5,y:7.5},{x:40.5,y:5.2},{x:41.5,y:4.1}],
     head:[{x:41.5,y:4.1},{x:40.89,y:4.34},{x:41.35,y:4.75}]},
    {points:[{x:55.2,y:11.8},{x:54.1,y:8.5},{x:52.9,y:5.8},{x:51.7,y:3.3},{x:50.3,y:1.35}],
     head:[{x:50.3,y:1.35},{x:50.41,y:2.02},{x:50.91,y:1.67}]},
    {points:[{x:63.6,y:11.2},{x:62.7,y:8.7},{x:61.7,y:6.6},{x:60.4,y:4.7},{x:59.1,y:3.8}],
     head:[{x:59.1,y:3.8},{x:59.42,y:4.42},{x:59.88,y:3.94}]}
  ],
  starts:[
    {x:5.2,y:8.8,r:.34},{x:12.2,y:2.9,r:.34},{x:28,y:8.75,r:.34},
    {x:37.7,y:11.7,r:.34},{x:55.2,y:11.8,r:.34},{x:63.6,y:11.2,r:.34}
  ],
  minima:[
    {x:41.5,y:4.1,r:.35,kind:"local"},{x:50.3,y:1.35,r:.4,kind:"global"},
    {x:59.1,y:3.8,r:.35,kind:"local"}
  ],
  minimumSet:{a:{x:15.1,y:1.2},b:{x:18,y:1.2}},
  saddle:[{x:45.8,y:8.28},{x:46.18,y:7.9},{x:45.8,y:7.52},{x:45.42,y:7.9}],
  escape:[{x:41.5,y:4.1},{x:43.4,y:6},{x:45.8,y:7.9}],
  leaders:[
    {a:{x:45.8,y:8.35},b:{x:45.8,y:9.05}}
  ],
  labels:[
    {x:16.7,y:15,text:"ВЫПУКЛАЯ: ОДНА ДОЛИНА",cls:"panel-title",anchor:"middle"},
    {x:16.7,y:13.65,text:"все старты ведут к одному глобальному дну",cls:"panel-subtitle",anchor:"middle"},
    {x:50,y:15,text:"НЕВЫПУКЛАЯ: НЕСКОЛЬКО ЛОВУШЕК",cls:"panel-title",anchor:"middle"},
    {x:50,y:13.65,text:"один путь — в дно, два — в локальные впадины",cls:"panel-subtitle",anchor:"middle"},
    {x:4.75,y:9.65,text:"A",cls:"label",anchor:"end",dx:-4,dy:-4},
    {x:11.85,y:3.55,text:"B",cls:"label",anchor:"end",dx:-4,dy:-5},
    {x:28.35,y:9.55,text:"C",cls:"label",anchor:"start",dx:4,dy:-4},
    {x:37.25,y:12.15,text:"A",cls:"label",anchor:"end",dx:-4,dy:-4},
    {x:55.2,y:12.35,text:"B",cls:"label",anchor:"middle",dy:-5},
    {x:64,y:11.75,text:"C",cls:"label",anchor:"start",dx:4,dy:-4},
    {x:16.55,y:.15,text:"множество глобальных минимумов",cls:"label",anchor:"middle",dy:15},
    {x:41.5,y:3.15,text:"локальный минимум",cls:"minor",anchor:"middle",dy:13},
    {x:50.3,y:.3,text:"глобальный минимум",cls:"label",anchor:"middle",dy:15},
    {x:59.1,y:2.85,text:"локальный минимум",cls:"minor",anchor:"middle",dy:13},
    {x:45.8,y:9.15,text:"седло",cls:"label",anchor:"middle",dy:-5},
    {x:43.25,y:6.45,text:"нужен подъём",cls:"barrier-label",anchor:"end",dx:-6,dy:-4},
    {x:43.55,y:6.25,text:"×",cls:"barrier-label",anchor:"middle",dy:4}
  ],
  legend:{
    y:-4.35,
    start:{x:3.8,r:.3,textX:5,text:"точка старта"},
    route:{a:{x:14.2,y:-4.35},b:{x:16.5,y:-4.35},textX:17.3,text:"спуск"},
    local:{x:24.3,r:.3,textX:25.5,text:"локальный минимум"},
    global:{x:39.8,r:.32,textX:41,text:"глобальный минимум"},
    saddle:[{x:57.1,y:-3.98},{x:57.47,y:-4.35},{x:57.1,y:-4.72},{x:56.73,y:-4.35}],
    saddleTextX:58.2,
    saddleText:"седло"
  }
}];

const [D]=data;
const origin=D.origin;
const scale=D.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y-y*scale.y;

try{
  const svg=document.getElementById("diagram");
  const fallback=document.getElementById("fallback");
  const make=(tag,attrs={})=>{
    const n=document.createElementNS("http://www.w3.org/2000/svg",tag);
    Object.entries(attrs).forEach(([key,value])=>n.setAttribute(key,value));
    return n;
  };
  const line=(a,b,cls)=>{
    svg.append(make("line",{x1:sx(a.x),y1:sy(a.y),x2:sx(b.x),y2:sy(b.y),class:cls}));
  };
  const path=(points,cls,close=false)=>{
    const d=points.map((p,index)=>
      `${index ? "L":"M"} ${sx(p.x)} ${sy(p.y)}`
    ).join(" ")+(close?" Z":"");
    svg.append(make("path",{d,class:cls}));
  };
  const polygon=(points,cls)=>{
    svg.append(make("polygon",{
      points:points.map(p=>`${sx(p.x)},${sy(p.y)}`).join(" "),
      class:cls
    }));
  };
  const circle=(p,cls)=>{
    svg.append(make("circle",{
      cx:sx(p.x),cy:sy(p.y),
      r:Math.abs(sx(p.r)-sx(D.zero)),
      class:cls
    }));
  };
  const text=t=>{
    const n=make("text",{
      x:sx(t.x),y:sy(t.y),class:t.cls,
      "text-anchor":t.anchor
    });
    if(t.dx!==undefined)n.setAttribute("dx",t.dx);
    if(t.dy!==undefined)n.setAttribute("dy",t.dy);
    n.textContent=t.text;
    svg.append(n);
  };

  line(D.baseline.a,D.baseline.b,"baseline");
  line(D.divider.a,D.divider.b,"divider");

  path(D.convexFill,"fill-convex",true);
  path(D.terrainFill,"fill-terrain",true);
  D.convexContours.forEach(points=>path(points,"contour-convex"));
  D.terrainContours.forEach(points=>path(points,"contour-terrain"));
  path(D.convex,"profile-convex");
  path(D.terrain,"profile-terrain");

  line(D.minimumSet.a,D.minimumSet.b,"minimum-set");
  D.escape.forEach(()=>{});
  path(D.escape,"escape");
  D.leaders.forEach(item=>line(item.a,item.b,"leader"));

  D.routes.forEach(route=>{
    path(route.points,"route");
    polygon(route.head,"route-head");
  });
  D.starts.forEach(point=>circle(point,"start"));
  D.minima.forEach(point=>circle(point,point.kind));
  polygon(D.saddle,"saddle");
  D.labels.forEach(text);

  const L=D.legend;
  circle({x:L.start.x,y:L.y,r:L.start.r},"start");
  text({x:L.start.textX,y:L.y,text:L.start.text,cls:"legend",anchor:"start",dx:4,dy:4});
  line(L.route.a,L.route.b,"legend-line");
  text({x:L.route.textX,y:L.y,text:L.route.text,cls:"legend",anchor:"start",dx:4,dy:4});
  circle({x:L.local.x,y:L.y,r:L.local.r},"local");
  text({x:L.local.textX,y:L.y,text:L.local.text,cls:"legend",anchor:"start",dx:4,dy:4});
  circle({x:L.global.x,y:L.y,r:L.global.r},"global");
  text({x:L.global.textX,y:L.y,text:L.global.text,cls:"legend",anchor:"start",dx:4,dy:4});
  polygon(L.saddle,"saddle");
  text({x:L.saddleTextX,y:L.y,text:L.saddleText,cls:"legend",anchor:"start",dx:4,dy:4});

  svg.hidden=false;
  fallback.hidden=true;
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
