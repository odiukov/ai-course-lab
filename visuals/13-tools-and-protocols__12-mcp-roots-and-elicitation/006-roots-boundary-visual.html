<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Граница корней</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#22222a; --muted:#6b6b78;
    --frame:#3563b8; --frameFill:#e8effc;
    --ok:#1f7a4d; --bad:#b6304a; --warn:#a5700f; --line:#9aa0ad;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15161a; --fg:#e8e8ee; --muted:#9a9aa8;
      --frame:#6f9dff; --frameFill:#1b2437;
      --ok:#4fc98a; --bad:#ff7d95; --warn:#e2b04a; --line:#575d6b;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:100%;padding:10px 12px 12px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 6px;font-weight:650;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Граница корней: проверка URI до обращения к диску</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var NS = 'http://www.w3.org/2000/svg';

    // ---- данные схемы (единственные литералы-данные) ----
    var ROOT = { x:1, y:1, w:12, h:5, uri:'file:///Users/alice/Documents/Notes', tag:'корень' };
    var ITEMS = [
      { key:'in',  x:4,   y:3.6, label:'note-14.md', verdict:'ok',
        note:'внутри корня — доступ разрешён' },
      { key:'out', x:20,  y:8.4, label:'~/notes/secret.md', verdict:'bad',
        note:'вне корня — отклонён' }
    ];
    var CHECK = { x:20, y:3.5 };            // узел проверки
    var VIEW  = { w:24, h:10 };             // мир в единицах

    // ---- одна пара функций перевода ----
    var origin = { x:26, y:20 }, scale = 33;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    var W = sx(VIEW.w) + sx(0), H = sy(VIEW.h);

    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('font-family','inherit');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=document.createElementNS(NS,'text');
      t.setAttribute('x',x); t.setAttribute('y',y);
      t.setAttribute('text-anchor',anchor||'start');
      t.setAttribute('font-size',size||13);
      t.setAttribute('fill',cls||'var(--fg)');
      t.textContent=s; svg.appendChild(t); return t;
    }

    var defs=el('defs',{});
    function marker(id,color){
      var m=document.createElementNS(NS,'marker');
      m.setAttribute('id',id); m.setAttribute('viewBox','0 0 10 10');
      m.setAttribute('refX','9'); m.setAttribute('refY','5');
      m.setAttribute('markerWidth','7'); m.setAttribute('markerHeight','7');
      m.setAttribute('orient','auto-start-reverse');
      var p=document.createElementNS(NS,'path');
      p.setAttribute('d','M0,1 L9,5 L0,9 z'); p.setAttribute('fill',color);
      m.appendChild(p); defs.appendChild(m);
    }
    marker('mOk','var(--ok)'); marker('mBad','var(--bad)');

    // ---- рамка корня ----
    el('rect',{ x:sx(ROOT.x), y:sy(ROOT.y),
      width:sx(ROOT.x+ROOT.w)-sx(ROOT.x), height:sy(ROOT.y+ROOT.h)-sy(ROOT.y),
      rx:sx(0.35)-sx(0), fill:'var(--frameFill)', stroke:'var(--frame)',
      'stroke-width':2 });

    txt(sx(ROOT.x), sy(ROOT.y)-10, ROOT.uri, 'start', 'var(--frame)', 13);
    txt(sx(ROOT.x)+8, sy(ROOT.y+ROOT.h)-10, 'область корня (поддерево)',
        'start', 'var(--muted)', 12);

    // ---- запрещённое пространство ----
    txt(sx(ROOT.x), sy(VIEW.h)-6, 'снаружи рамки — весь остальной диск',
        'start', 'var(--muted)', 12);

    // ---- узел проверки ----
    el('circle',{ cx:sx(CHECK.x), cy:sy(CHECK.y), r:sx(0.28)-sx(0),
      fill:'var(--bg)', stroke:'var(--line)', 'stroke-width':2 });
    txt(sx(CHECK.x), sy(CHECK.y)-sy(0)+sy(0)-18, 'вердикт до диска',
        'middle', 'var(--muted)', 12);

    // ---- элементы ----
    ITEMS.forEach(function(it){
      var ok = it.verdict==='ok';
      var col = ok ? 'var(--ok)' : 'var(--bad)';

      el('circle',{ cx:sx(it.x), cy:sy(it.y), r:sx(0.16)-sx(0), fill:col });

      // стрелка к узлу проверки
      el('line',{ x1:sx(it.x), y1:sy(it.y), x2:sx(CHECK.x), y2:sy(CHECK.y),
        stroke:col, 'stroke-width':2, 'stroke-dasharray': ok?'':'6 4',
        'marker-end': ok?'url(#mOk)':'url(#mBad)' });

      if(ok){
        txt(sx(it.x), sy(it.y)-16, it.label, 'start', 'var(--fg)', 14);
        txt(sx(it.x), sy(it.y)+24, '✓ ' + it.note, 'start', col, 13);
      }else{
        txt(sx(it.x), sy(it.y)+22, it.label, 'end', 'var(--fg)', 14);
        txt(sx(it.x), sy(it.y)+42, '✗ ' + it.note, 'end', col, 13);
      }
    });

    // ---- бинарность решения у узла ----
    txt(sx(CHECK.x)+18, sy(CHECK.y)-6, 'да', 'start', 'var(--ok)', 13);
    txt(sx(CHECK.x)+18, sy(CHECK.y)+14, 'нет', 'start', 'var(--bad)', 13);

    host.appendChild(svg);
  }catch(e){
    var d=document.createElement('div');
    d.className='fail';
    d.textContent =
      'Схема не построилась. Она должна показывать: рамку корня '+
      'file:///Users/alice/Documents/Notes; внутри рамки файл note-14.md — '+
      'проверка проходит (✓); снаружи рамки ~/notes/secret.md — отклонён (✗). '+
      'Решение бинарное и выносится до обращения к диску.';
    host.appendChild(d);
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
