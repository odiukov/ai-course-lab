<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Граница между агентом и оценщиком</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --ink: #172033;
      --muted: #59657a;
      --frame: #c5cedd;
      --agent-bg: #e8f4ff;
      --agent-card: #ffffff;
      --agent-line: #2474b5;
      --agent-accent: #0d5f9d;
      --judge-bg: #f3edff;
      --judge-card: #ffffff;
      --judge-line: #7651b8;
      --judge-accent: #5f3aa2;
      --wall: #263247;
      --wall-slot: #f4f7fb;
      --wall-text: #ffffff;
      --flow: #d56a1f;
      --flow-soft: #fff0e4;
      --success: #15734a;
      --success-soft: #e5f5ed;
      --shadow: #9ba7ba;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101521;
        --ink: #edf3ff;
        --muted: #aeb9cc;
        --frame: #475269;
        --agent-bg: #132a3d;
        --agent-card: #19364d;
        --agent-line: #67b8f3;
        --agent-accent: #9ad4ff;
        --judge-bg: #291f3b;
        --judge-card: #35274d;
        --judge-line: #b89bea;
        --judge-accent: #d4c0f6;
        --wall: #d5ddeb;
        --wall-slot: #101521;
        --wall-text: #172033;
        --flow: #ffad70;
        --flow-soft: #402718;
        --success: #72d4a4;
        --success-soft: #173a2c;
        --shadow: #05070c;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 10px 16px 4px;
    }

    h1 {
      margin: 0;
      padding: 0 0 6px;
      font-size: 24px;
      font-weight: 760;
      letter-spacing: 0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1180px;
      background: var(--page);
      border: 1px solid var(--frame);
    }

    .panel {
      stroke-width: 2;
    }

    .agent-panel {
      fill: var(--agent-bg);
      stroke: var(--agent-line);
    }

    .judge-panel {
      fill: var(--judge-bg);
      stroke: var(--judge-line);
    }

    .card {
      stroke-width: 1.5;
    }

    .agent-card {
      fill: var(--agent-card);
      stroke: var(--agent-line);
    }

    .judge-card {
      fill: var(--judge-card);
      stroke: var(--judge-line);
    }

    .panel-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .agent-title {
      fill: var(--agent-accent);
    }

    .judge-title {
      fill: var(--judge-accent);
    }

    .card-text {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 650;
    }

    .card-note {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 550;
    }

    .badge-text {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    .agent-badge {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 1.5;
    }

    .agent-badge-text {
      fill: var(--success);
    }

    .judge-badge {
      fill: var(--judge-bg);
      stroke: var(--judge-line);
      stroke-width: 1.5;
    }

    .judge-badge-text {
      fill: var(--judge-accent);
    }

    .separator {
      stroke: var(--frame);
      stroke-width: 1.5;
    }

    .wall {
      fill: var(--wall);
    }

    .slot {
      fill: var(--wall-slot);
      stroke: var(--flow);
      stroke-width: 1.5;
    }

    .wall-label {
      fill: var(--wall-text);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0.04em;
    }

    .lock {
      fill: none;
      stroke: var(--wall-text);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-line {
      fill: none;
      stroke: var(--flow);
      stroke-width: 2.5;
      stroke-linecap: round;
    }

    .flow-head {
      fill: var(--flow);
    }

    .flow-label-bg {
      fill: var(--flow-soft);
      stroke: var(--flow);
      stroke-width: 1.5;
    }

    .flow-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 750;
    }

    .boundary-caption {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }

    .boundary-note {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    #fallback {
      padding: 16px;
      color: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Граница между агентом и оценщиком</h1>

  <svg
    id="diagram"
    viewBox="0 0 1180 460"
    width="1180"
    height="460"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="svg-title svg-description"
  >
    <title id="svg-title">Техническая граница прав доступа</title>
    <desc id="svg-description">
      Агент может менять свои промпты, инструменты и роутеры, но не имеет
      доступа к скрытым тестам, эталонам и подсчёту балла оценщика.
    </desc>
    <g id="drawing"></g>
  </svg>

  <p id="fallback" hidden>
    Схема должна была показать техническую стену: агент может изменять свои
    промпты, инструменты и роутеры, но не может читать или менять скрытые
    тесты, эталонные ответы и подсчёт балла оценщика.
  </p>

  <noscript>
    Схема: изменяемая часть агента отделена технической границей прав доступа
    от скрытых тестов, эталонов и подсчёта балла только для чтения.
  </noscript>

  <script>
    const data = Object.freeze({
      ns: "http://www.w3.org/2000/svg",
      zero: 0,
      unit: 9.5,
      originX: 44,
      originY: 10,
      radius: 1.1,
      smallRadius: 0.7,
      line: 2,
      labelPad: 7,
      layerId: "drawing",
      fallbackId: "fallback",
      hidden: "hidden",
      space: " ",
      agentPanel: { x1: 2, y1: 5, x2: 54, y2: 45 },
      judgePanel: { x1: 66, y1: 5, x2: 118, y2: 45 },
      wall: { x1: 57.5, y1: 3.7, x2: 62.5, y2: 45 },
      separatorY: 32.2,
      titles: [
        {
          text: "АГЕНТ · МОЖНО ИЗМЕНЯТЬ",
          x: 5,
          y: 8.3,
          anchor: "start",
          className: "panel-title agent-title"
        },
        {
          text: "ОЦЕНЩИК · ТОЛЬКО ЧТЕНИЕ",
          x: 115,
          y: 8.3,
          anchor: "end",
          className: "panel-title judge-title"
        }
      ],
      badges: [
        {
          box: { x1: 39, y1: 6.5, x2: 51.7, y2: 9.2 },
          text: "ЗАПИСЬ РАЗРЕШЕНА",
          tx: 45.35,
          ty: 7.85,
          boxClass: "agent-badge",
          textClass: "badge-text agent-badge-text"
        },
        {
          box: { x1: 69, y1: 6.5, x2: 82.8, y2: 9.2 },
          text: "СКРЫТО ОТ АГЕНТА",
          tx: 75.9,
          ty: 7.85,
          boxClass: "judge-badge",
          textClass: "badge-text judge-badge-text"
        }
      ],
      cards: [
        {
          box: { x1: 5, y1: 11, x2: 51, y2: 16.4 },
          text: "Промпты и инструкции",
          note: "кандидат может редактировать",
          tx: 8,
          textY: 13,
          noteY: 15,
          markX: 6.5,
          markY: 13.7,
          mark: "✎",
          side: "agent"
        },
        {
          box: { x1: 5, y1: 18.1, x2: 51, y2: 23.5 },
          text: "Инструменты агента",
          note: "доступны для мутаций",
          tx: 8,
          textY: 20.1,
          noteY: 22.1,
          markX: 6.5,
          markY: 20.8,
          mark: "◆",
          side: "agent"
        },
        {
          box: { x1: 5, y1: 25.2, x2: 51, y2: 30.6 },
          text: "Роутеры и управляющий код",
          note: "изменяемый обвес агента",
          tx: 8,
          textY: 27.2,
          noteY: 29.2,
          markX: 6.5,
          markY: 27.9,
          mark: "⇄",
          side: "agent"
        },
        {
          box: { x1: 69, y1: 11, x2: 115, y2: 16.4 },
          text: "Скрытые тестовые задания",
          note: "файлы недоступны процессу агента",
          tx: 72,
          textY: 13,
          noteY: 15,
          markX: 70.5,
          markY: 13.7,
          mark: "●",
          side: "judge"
        },
        {
          box: { x1: 69, y1: 18.1, x2: 115, y2: 23.5 },
          text: "Эталонные ответы",
          note: "нельзя читать или переписывать",
          tx: 72,
          textY: 20.1,
          noteY: 22.1,
          markX: 70.5,
          markY: 20.8,
          mark: "●",
          side: "judge"
        },
        {
          box: { x1: 69, y1: 25.2, x2: 115, y2: 30.6 },
          text: "Подсчёт балла: 62 → 94",
          note: "линейка измерения не меняется",
          tx: 72,
          textY: 27.2,
          noteY: 29.2,
          markX: 70.5,
          markY: 27.9,
          mark: "●",
          side: "judge"
        }
      ],
      slots: [
        { x1: 57, y1: 34.4, x2: 63, y2: 36.2 },
        { x1: 57, y1: 38, x2: 63, y2: 39.8 },
        { x1: 57, y1: 41.6, x2: 63, y2: 43.4 }
      ],
      arrows: [
        {
          line: { x1: 108, y1: 35.3, x2: 12, y2: 35.3 },
          head: [
            { x: 12, y: 35.3 },
            { x: 14.2, y: 34.1 },
            { x: 14.2, y: 36.5 }
          ],
          labelBox: { x1: 91, y1: 33.5, x2: 108, y2: 35 },
          labelX: 99.5,
          labelY: 34.25,
          label: "разрешённый вход"
        },
        {
          line: { x1: 12, y1: 38.9, x2: 108, y2: 38.9 },
          head: [
            { x: 108, y: 38.9 },
            { x: 105.8, y: 37.7 },
            { x: 105.8, y: 40.1 }
          ],
          labelBox: { x1: 12, y1: 37.1, x2: 27.5, y2: 38.6 },
          labelX: 19.75,
          labelY: 37.85,
          label: "решение агента"
        },
        {
          line: { x1: 108, y1: 42.5, x2: 12, y2: 42.5 },
          head: [
            { x: 12, y: 42.5 },
            { x: 14.2, y: 41.3 },
            { x: 14.2, y: 43.7 }
          ],
          labelBox: { x1: 90, y1: 40.7, x2: 108, y2: 42.2 },
          labelX: 99,
          labelY: 41.45,
          label: "сообщённый балл"
        }
      ],
      wallCaption: {
        text: "ГРАНИЦА ПРАВ ДОСТУПА",
        x: 60,
        y: 2.4
      },
      wallNote: {
        text: "Техническая стена, а не обещание",
        x: 60,
        y: 4.5
      },
      lock: {
        body: { x1: 58.7, y1: 21.1, x2: 61.3, y2: 24.2 },
        shackle: {
          x1: 59.1,
          y1: 21.1,
          cx1: 59.1,
          cy1: 18.9,
          cx2: 60.9,
          cy2: 18.9,
          x2: 60.9,
          y2: 21.1
        },
        keyTop: { x1: 60, y1: 22, x2: 60, y2: 23.1 }
      }
    });

    const origin = Object.freeze({ x: data.originX, y: data.originY });
    const scale = Object.freeze({ x: data.unit, y: data.unit });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const layer = document.getElementById(data.layerId);

      const make = (tag, attrs, text) => {
        const node = document.createElementNS(data.ns, tag);
        Object.entries(attrs).forEach(([name, value]) => {
          node.setAttribute(name, value);
        });
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const add = (tag, attrs, text) => {
        const node = make(tag, attrs, text);
        layer.appendChild(node);
        return node;
      };

      const box = (shape, className, radius) =>
        add("rect", {
          x: sx(shape.x1),
          y: sy(shape.y1),
          width: sx(shape.x2) - sx(shape.x1),
          height: sy(shape.y2) - sy(shape.y1),
          rx: sx(radius) - sx(data.zero),
          class: className
        });

      const label = (item, className) =>
        add(
          "text",
          {
            x: sx(item.x),
            y: sy(item.y),
            dx: data.zero,
            dy: data.labelPad,
            "text-anchor": item.anchor || "middle",
            "dominant-baseline": "middle",
            class: className
          },
          item.text
        );

      box(data.agentPanel, "panel agent-panel", data.radius);
      box(data.judgePanel, "panel judge-panel", data.radius);

      add("line", {
        x1: sx(data.agentPanel.x1),
        y1: sy(data.separatorY),
        x2: sx(data.agentPanel.x2),
        y2: sy(data.separatorY),
        class: "separator"
      });

      add("line", {
        x1: sx(data.judgePanel.x1),
        y1: sy(data.separatorY),
        x2: sx(data.judgePanel.x2),
        y2: sy(data.separatorY),
        class: "separator"
      });

      data.titles.forEach((item) => label(item, item.className));

      data.badges.forEach((item) => {
        box(item.box, item.boxClass, data.smallRadius);
        label(
          {
            text: item.text,
            x: item.tx,
            y: item.ty,
            anchor: "middle"
          },
          item.textClass
        );
      });

      data.cards.forEach((item) => {
        const cardClass =
          item.side === "agent" ? "card agent-card" : "card judge-card";
        const titleClass =
          item.side === "agent"
            ? "card-text agent-title"
            : "card-text judge-title";

        box(item.box, cardClass, data.smallRadius);

        label(
          {
            text: item.mark,
            x: item.markX,
            y: item.markY,
            anchor: "middle"
          },
          titleClass
        );

        label(
          {
            text: item.text,
            x: item.tx,
            y: item.textY,
            anchor: "start"
          },
          "card-text"
        );

        label(
          {
            text: item.note,
            x: item.tx,
            y: item.noteY,
            anchor: "start"
          },
          "card-note"
        );
      });

      label(
        {
          text: data.wallCaption.text,
          x: data.wallCaption.x,
          y: data.wallCaption.y,
          anchor: "middle"
        },
        "boundary-caption"
      );

      label(
        {
          text: data.wallNote.text,
          x: data.wallNote.x,
          y: data.wallNote.y,
          anchor: "middle"
        },
        "boundary-note"
      );

      box(data.wall, "wall", data.smallRadius);

      const shackle = data.lock.shackle;
      add("path", {
        d:
          "M " +
          sx(shackle.x1) +
          data.space +
          sy(shackle.y1) +
          " C " +
          sx(shackle.cx1) +
          data.space +
          sy(shackle.cy1) +
          data.space +
          sx(shackle.cx2) +
          data.space +
          sy(shackle.cy2) +
          data.space +
          sx(shackle.x2) +
          data.space +
          sy(shackle.y2),
        class: "lock"
      });

      box(data.lock.body, "lock", data.smallRadius);

      add("line", {
        x1: sx(data.lock.keyTop.x1),
        y1: sy(data.lock.keyTop.y1),
        x2: sx(data.lock.keyTop.x2),
        y2: sy(data.lock.keyTop.y2),
        class: "lock"
      });

      data.slots.forEach((slot) => box(slot, "slot", data.smallRadius));

      data.arrows.forEach((arrow) => {
        add("line", {
          x1: sx(arrow.line.x1),
          y1: sy(arrow.line.y1),
          x2: sx(arrow.line.x2),
          y2: sy(arrow.line.y2),
          class: "flow-line"
        });

        add("polygon", {
          points: arrow.head
            .map((point) => sx(point.x) + "," + sy(point.y))
            .join(data.space),
          class: "flow-head"
        });

        box(arrow.labelBox, "flow-label-bg", data.smallRadius);

        label(
          {
            text: arrow.label,
            x: arrow.labelX,
            y: arrow.labelY,
            anchor: "middle"
          },
          "flow-label"
        );
      });
    } catch (error) {
      document.getElementById(data.fallbackId).removeAttribute(data.hidden);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
