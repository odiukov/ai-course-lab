<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Какие визиты учитывают две версии MC</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #eef3f8;
      --ink: #172033;
      --muted: #657086;
      --line: #9aa7ba;
      --first: #d65f35;
      --first-soft: #fff0e9;
      --every: #167c71;
      --every-soft: #e6f6f2;
      --shared: #7656c7;
      --shared-soft: #eee8ff;
      --skip: #a7afbd;
      --shadow: #d7deea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192231;
        --panel-soft: #202c3d;
        --ink: #edf2fa;
        --muted: #aeb9ca;
        --line: #66748a;
        --first: #ff936d;
        --first-soft: #42271f;
        --every: #5dd4c4;
        --every-soft: #173c39;
        --shared: #b49aff;
        --shared-soft: #302750;
        --skip: #737f92;
        --shadow: #0a0e15;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      width: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 8px;
      font-size: 21px;
      line-height: 1.2;
      font-weight: 750;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 472px;
      background: var(--page);
    }

    .trajectory {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .shared-tail {
      fill: none;
      stroke: var(--shared);
      stroke-width: 8px;
      stroke-linecap: round;
    }

    .guide {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-dasharray: 6px 6px;
    }

    .visit {
      fill: var(--panel);
      stroke: var(--ink);
      stroke-width: 3px;
    }

    .terminal {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .return-first {
      fill: var(--first-soft);
      stroke: var(--first);
      stroke-width: 2px;
    }

    .return-late {
      fill: var(--shared-soft);
      stroke: var(--shared);
      stroke-width: 2px;
    }

    .panel-first {
      fill: var(--panel);
      stroke: var(--first);
      stroke-width: 2px;
    }

    .panel-every {
      fill: var(--panel);
      stroke: var(--every);
      stroke-width: 2px;
    }

    .panel-rule {
      stroke: var(--shadow);
      stroke-width: 2px;
    }

    .chip-first {
      fill: var(--first-soft);
      stroke: var(--first);
      stroke-width: 2px;
    }

    .chip-every {
      fill: var(--every-soft);
      stroke: var(--every);
      stroke-width: 2px;
    }

    .chip-skipped {
      fill: var(--panel-soft);
      stroke: var(--skip);
      stroke-width: 2px;
    }

    .mean-first {
      fill: var(--first-soft);
      stroke: var(--first);
      stroke-width: 2px;
    }

    .mean-every {
      fill: var(--every-soft);
      stroke: var(--every);
      stroke-width: 2px;
    }

    .arrow-first {
      fill: var(--first);
      stroke: var(--first);
      stroke-width: 2px;
    }

    .arrow-every {
      fill: var(--every);
      stroke: var(--every);
      stroke-width: 2px;
    }

    .arrow-return {
      fill: var(--muted);
      stroke: var(--muted);
      stroke-width: 2px;
    }

    .cross {
      stroke: var(--first);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    text {
      fill: var(--ink);
      font-size: 17px;
      dominant-baseline: middle;
    }

    .small {
      fill: var(--muted);
      font-size: 15px;
    }

    .node-label {
      font-size: 20px;
      font-weight: 750;
    }

    .return-label {
      font-size: 18px;
      font-weight: 750;
    }

    .panel-title {
      font-size: 19px;
      font-weight: 800;
    }

    .panel-subtitle {
      fill: var(--muted);
      font-size: 14px;
    }

    .chip-label {
      font-size: 18px;
      font-weight: 750;
    }

    .mean-caption {
      fill: var(--muted);
      font-size: 14px;
    }

    .mean-value {
      font-size: 19px;
      font-weight: 800;
    }

    .tail-label {
      fill: var(--shared);
      font-size: 15px;
      font-weight: 750;
    }

    .error {
      fill: var(--ink);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Какие визиты учитывают две версии MC</h1>
    <svg id="diagram"
         viewBox="0 0 960 455"
         width="960"
         height="455"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Один эпизод дважды посещает состояние s. First-visit отправляет в среднее только отдачу 5, every-visit — отдачи 5 и 9.">
    </svg>
  </figure>

  <script>
    const data = [{
      trajectory: {
        start: { x: 0.45, y: 1.08 },
        first: { x: 2.65, y: 1.08, step: 2, value: 5 },
        late: { x: 6.75, y: 1.08, step: 7, value: 9 },
        end: { x: 11.45, y: 1.08 }
      },
      labels: {
        stepY: 0.42,
        tailY: 1.58,
        returnY: 2.28
      },
      cards: {
        firstX: 1.55,
        lateX: 5.65,
        width: 2.2,
        height: 0.66,
        corner: 0.13
      },
      panels: {
        y: 3.18,
        height: 2.38,
        firstX: 0.18,
        everyX: 6.04,
        width: 5.58,
        titleY: 3.55,
        subtitleY: 3.83,
        ruleY: 4.04,
        chipY: 4.34,
        chipWidth: 0.72,
        chipHeight: 0.66,
        chipFirstX: 0.66,
        chipLateX: 1.68,
        meanX: 3.02,
        meanWidth: 2.18,
        meanHeight: 0.98,
        captionY: 4.52,
        valueY: 4.84,
        noteY: 5.32
      },
      geometry: {
        visitRadius: 0.29,
        terminalHalf: 0.24,
        arrowLength: 0.18,
        arrowHalf: 0.09,
        arrowStartGap: 0.1,
        arrowEndGap: 0.1,
        returnTopGap: 0.12,
        panelCorner: 0.16,
        crossInset: 0.1
      },
      fallback: { x: 0.55, y: 2.6 }
    }];

    const origin = Object.freeze({ x: 45, y: 17 });
    const scale = Object.freeze({ x: 73, y: 73 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const [D] = data;
    const svg = document.getElementById("diagram");
    const NS = "http://www.w3.org/2000/svg";

    function make(tag, attrs, className) {
      const item = document.createElementNS(NS, tag);
      for (const [name, value] of Object.entries(attrs)) {
        item.setAttribute(name, value);
      }
      if (className) item.setAttribute("class", className);
      svg.appendChild(item);
      return item;
    }

    function line(a, b, className) {
      return make("line", {
        x1: sx(a.x),
        y1: sy(a.y),
        x2: sx(b.x),
        y2: sy(b.y)
      }, className);
    }

    function box(x, y, width, height, className, corner) {
      return make("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(corner) - sx(0),
        ry: sy(corner) - sy(0)
      }, className);
    }

    function label(content, x, y, anchor, className) {
      const item = make("text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor
      }, className);
      item.textContent = content;
      return item;
    }

    function arrow(a, b, className) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const length = Math.sqrt(dx * dx + dy * dy);
      const ux = dx / length;
      const uy = dy / length;
      const px = -uy;
      const py = ux;
      const tip = { x: b.x, y: b.y };
      const base = {
        x: b.x - ux * D.geometry.arrowLength,
        y: b.y - uy * D.geometry.arrowLength
      };
      line(a, base, className);
      make("polygon", {
        points: [
          `${sx(tip.x)},${sy(tip.y)}`,
          `${sx(base.x + px * D.geometry.arrowHalf)},${sy(base.y + py * D.geometry.arrowHalf)}`,
          `${sx(base.x - px * D.geometry.arrowHalf)},${sy(base.y - py * D.geometry.arrowHalf)}`
        ].join(" ")
      }, className);
    }

    function visit(point) {
      make("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: sx(D.geometry.visitRadius) - sx(0)
      }, "visit");
      label("s", point.x, point.y, "middle", "node-label");
      label(`шаг ${point.step}`, point.x, D.labels.stepY, "middle", "small");
    }

    function terminal(point) {
      const h = D.geometry.terminalHalf;
      make("polygon", {
        points: [
          `${sx(point.x)},${sy(point.y - h)}`,
          `${sx(point.x + h)},${sy(point.y)}`,
          `${sx(point.x)},${sy(point.y + h)}`,
          `${sx(point.x - h)},${sy(point.y)}`
        ].join(" ")
      }, "terminal");
    }

    function returnCard(point, cardX, className) {
      const cardTop = D.labels.returnY;
      const cardCenterX = cardX + D.cards.width / D.trajectory.first.step;
      arrow(
        {
          x: point.x,
          y: point.y + D.geometry.visitRadius + D.geometry.arrowStartGap
        },
        {
          x: cardCenterX,
          y: cardTop - D.geometry.returnTopGap
        },
        "arrow-return"
      );
      box(
        cardX,
        cardTop,
        D.cards.width,
        D.cards.height,
        className,
        D.cards.corner
      );
      label(
        `G${point.step === D.trajectory.first.step ? "₂" : "₇"} = ${point.value}`,
        cardCenterX,
        cardTop + D.cards.height / D.trajectory.first.step,
        "middle",
        "return-label"
      );
    }

    function chip(x, y, value, className) {
      box(
        x,
        y,
        D.panels.chipWidth,
        D.panels.chipHeight,
        className,
        D.cards.corner
      );
      label(
        String(value),
        x + D.panels.chipWidth / D.trajectory.first.step,
        y + D.panels.chipHeight / D.trajectory.first.step,
        "middle",
        "chip-label"
      );
    }

    function crossedChip(x, y, value) {
      chip(x, y, value, "chip-skipped");
      const inset = D.geometry.crossInset;
      line(
        { x: x + inset, y: y + inset },
        {
          x: x + D.panels.chipWidth - inset,
          y: y + D.panels.chipHeight - inset
        },
        "cross"
      );
      line(
        {
          x: x + D.panels.chipWidth - inset,
          y: y + inset
        },
        {
          x: x + inset,
          y: y + D.panels.chipHeight - inset
        },
        "cross"
      );
    }

    function panelBase(x, className, titleText, subtitleText) {
      box(
        x,
        D.panels.y,
        D.panels.width,
        D.panels.height,
        className,
        D.geometry.panelCorner
      );
      label(
        titleText,
        x + D.panels.width / D.trajectory.first.step,
        D.panels.titleY,
        "middle",
        "panel-title"
      );
      label(
        subtitleText,
        x + D.panels.width / D.trajectory.first.step,
        D.panels.subtitleY,
        "middle",
        "panel-subtitle"
      );
      line(
        { x: x + D.geometry.panelCorner, y: D.panels.ruleY },
        {
          x: x + D.panels.width - D.geometry.panelCorner,
          y: D.panels.ruleY
        },
        "panel-rule"
      );
    }

    try {
      const T = D.trajectory;
      line(T.start, T.end, "trajectory");
      line(T.late, T.end, "shared-tail");
      terminal(T.end);
      visit(T.first);
      visit(T.late);

      label(
        "общий хвост наград",
        (T.late.x + T.end.x) / T.first.step,
        D.labels.tailY,
        "middle",
        "tail-label"
      );

      returnCard(T.first, D.cards.firstX, "return-first");
      returnCard(T.late, D.cards.lateX, "return-late");

      panelBase(
        D.panels.firstX,
        "panel-first",
        "first-visit",
        "только самый ранний визит в эпизоде"
      );

      const firstChipX = D.panels.firstX + D.panels.chipFirstX;
      const firstLateX = D.panels.firstX + D.panels.chipLateX;
      const firstMeanX = D.panels.firstX + D.panels.meanX;

      chip(
        firstChipX,
        D.panels.chipY,
        T.first.value,
        "chip-first"
      );
      crossedChip(
        firstLateX,
        D.panels.chipY,
        T.late.value
      );
      arrow(
        {
          x: firstLateX + D.panels.chipWidth + D.geometry.arrowStartGap,
          y: D.panels.chipY + D.panels.chipHeight / T.first.step
        },
        {
          x: firstMeanX - D.geometry.arrowEndGap,
          y: D.panels.chipY + D.panels.chipHeight / T.first.step
        },
        "arrow-first"
      );
      box(
        firstMeanX,
        D.panels.chipY,
        D.panels.meanWidth,
        D.panels.meanHeight,
        "mean-first",
        D.cards.corner
      );
      label(
        "в среднее",
        firstMeanX + D.panels.meanWidth / T.first.step,
        D.panels.captionY,
        "middle",
        "mean-caption"
      );
      label(
        String(T.first.value),
        firstMeanX + D.panels.meanWidth / T.first.step,
        D.panels.valueY,
        "middle",
        "mean-value"
      );
      label(
        "отдача 9 пропущена",
        D.panels.firstX + D.panels.width / T.first.step,
        D.panels.noteY,
        "middle",
        "small"
      );

      panelBase(
        D.panels.everyX,
        "panel-every",
        "every-visit",
        "каждое появление состояния в эпизоде"
      );

      const everyChipX = D.panels.everyX + D.panels.chipFirstX;
      const everyLateX = D.panels.everyX + D.panels.chipLateX;
      const everyMeanX = D.panels.everyX + D.panels.meanX;

      chip(
        everyChipX,
        D.panels.chipY,
        T.first.value,
        "chip-every"
      );
      chip(
        everyLateX,
        D.panels.chipY,
        T.late.value,
        "chip-every"
      );
      arrow(
        {
          x: everyLateX + D.panels.chipWidth + D.geometry.arrowStartGap,
          y: D.panels.chipY + D.panels.chipHeight / T.first.step
        },
        {
          x: everyMeanX - D.geometry.arrowEndGap,
          y: D.panels.chipY + D.panels.chipHeight / T.first.step
        },
        "arrow-every"
      );
      box(
        everyMeanX,
        D.panels.chipY,
        D.panels.meanWidth,
        D.panels.meanHeight,
        "mean-every",
        D.cards.corner
      );
      label(
        "в среднее",
        everyMeanX + D.panels.meanWidth / T.first.step,
        D.panels.captionY,
        "middle",
        "mean-caption"
      );
      label(
        `${T.first.value} и ${T.late.value}`,
        everyMeanX + D.panels.meanWidth / T.first.step,
        D.panels.valueY,
        "middle",
        "mean-value"
      );
      label(
        "обе отдачи учтены",
        D.panels.everyX + D.panels.width / T.first.step,
        D.panels.noteY,
        "middle",
        "small"
      );
    } catch (error) {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      label(
        "Схема: first-visit учитывает только G₂ = 5, every-visit — G₂ = 5 и G₇ = 9.",
        D.fallback.x,
        D.fallback.y,
        "start",
        "error"
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
