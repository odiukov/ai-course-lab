<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Четыре парадигмы чат-ботов</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --panel-soft:#eef3f8;
  --ink:#172033;
  --muted:#596579;
  --line:#9aa8ba;
  --rule:#d86a55;
  --retrieve:#3978b8;
  --neural:#7656b5;
  --agent:#15806f;
  --arrow:#405067;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#10151e;
    --panel:#171e29;
    --panel-soft:#202a38;
    --ink:#edf2fa;
    --muted:#b4c0d0;
    --line:#637186;
    --rule:#f08a74;
    --retrieve:#69a8e8;
    --neural:#a88ae0;
    --agent:#53c4ad;
    --arrow:#aebbd0;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
figure{margin:0;background:var(--bg);overflow:hidden}
figcaption{
  padding:12px 18px 6px;
  font-size:20px;
  font-weight:750;
  letter-spacing:.01em;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:486px;
  background:var(--bg);
}
text{font-family:inherit;fill:var(--ink)}
.card{fill:var(--panel);stroke:var(--line)}
.soft{fill:var(--panel-soft)}
.axis,.connector{stroke:var(--arrow);fill:none}
.rule-stroke{stroke:var(--rule);fill:none}
.retrieve-stroke{stroke:var(--retrieve);fill:none}
.neural-stroke{stroke:var(--neural);fill:none}
.agent-stroke{stroke:var(--agent);fill:none}
.rule-fill{fill:var(--rule)}
.retrieve-fill{fill:var(--retrieve)}
.neural-fill{fill:var(--neural)}
.agent-fill{fill:var(--agent)}
.muted{fill:var(--muted)}
.white{fill:#fff}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Четыре парадигмы чат-ботов: от реплики к действию</figcaption>
  <svg id="chart" viewBox="0 0 1280 456" width="1280" height="456"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Временная линия 1966–2026: ELIZA, ALICE, retrieval и seq2seq, затем LLM-агент с циклом и инструментами">
  </svg>
</figure>
<script>
const data={
  canvas:{w:1280,h:456},
  request:{
    box:{x:170,y:8,w:940,h:46,r:18},
    anchor:{x:640,y:36},
    text:"«Посылка застряла — можешь перенести доставку на субботу?»"
  },
  timeline:{
    y:84,left:58,right:1222,
    start:{x:58,label:"1966"},
    end:{x:1222,label:"2026"},
    points:[
      {x:164,color:"rule-fill"},
      {x:466,color:"rule-fill"},
      {x:768,color:"neural-fill"},
      {x:1070,color:"agent-fill"}
    ]
  },
  cards:[
    {
      x:32,y:112,w:268,h:250,r:14,color:"rule",
      kicker:"1966 · правила",title:"ELIZA",
      metric:"около 200 шаблонов",
      lines:["ищет совпадение","вставляет фрагмент","в готовую реплику"],
      flow:["запрос","шаблон","заготовка"],
      badge:"выбрать заготовку"
    },
    {
      x:348,y:112,w:268,h:250,r:14,color:"rule",
      kicker:"1995 · больше правил",title:"ALICE",
      metric:"40 000 категорий",
      lines:["AIML: шаблон → ответ","покрытие растёт,","общность — нет"],
      flow:["запрос","категория","сценарий"],
      badge:"выбрать сценарий"
    },
    {
      x:664,y:112,w:268,h:250,r:14,color:"neural",
      kicker:"поиск → генерация",title:"Retrieval и seq2seq",
      metric:"два новых источника ответа",
      split:[
        {y:215,color:"retrieve",name:"Retrieval",lines:["найти похожий случай","вернуть сохранённый ответ"]},
        {y:278,color:"neural",name:"seq2seq",lines:["создать ответ заново","убедительно ≠ истинно"]}
      ],
      badge:"найти → создать"
    },
    {
      x:980,y:112,w:268,h:250,r:14,color:"agent",
      kicker:"2026 · действие",title:"LLM-агент",
      metric:"цикл + инструменты",
      loop:[
        {x:1000,y:215,w:104,h:40,lines:["проверить","статус"]},
        {x:1124,y:215,w:104,h:40,lines:["найти","субботу"]},
        {x:1124,y:278,w:104,h:40,lines:["проверить","результат"]},
        {x:1000,y:278,w:104,h:40,lines:["перенести","дату"]}
      ],
      badge:"изменить внешний мир"
    }
  ],
  connectors:[
    {x1:300,y1:237,x2:348,y2:237,label:"масштаб"},
    {x1:616,y1:237,x2:664,y2:237,label:"данные"},
    {x1:932,y1:237,x2:980,y2:237,label:"инструменты"}
  ],
  footer:{
    y:388,h:50,r:14,
    title:"Растёт свобода:",
    items:[
      {x:190,label:"выбрать заготовку",color:"rule-fill"},
      {x:486,label:"найти готовое",color:"retrieve-fill"},
      {x:760,label:"создать ответ",color:"neural-fill"},
      {x:1056,label:"выполнить действие",color:"agent-fill"}
    ]
  },
  geometry:{
    cardTitleY:151,kickerY:132,metricY:176,dividerY:189,
    flowY:232,flowW:68,flowH:38,flowR:10,
    flowXs:[50,132,214],flowArrowY:251,
    textYs:[290,310,330],
    badgeY:337,badgeH:25,badgeR:10,
    splitX:682,splitW:232,splitH:54,splitR:10,
    loopR:9,loopArrow:8,
    dotR:7,arrow:8,
    footerX:32,footerW:1216,
    footerTitleX:54,footerTextY:418,
    itemDotR:6
  },
  type:{small:12,body:13,metric:14,title:20,request:17,footer:14},
  line:{thin:1.5,normal:2,strong:3},
  labelPad:10
};
const origin={x:0,y:0};
const scale={x:1,y:1};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("chart");
  const ns="http://www.w3.org/2000/svg";
  const g=data.geometry;
  const make=(tag,attrs={},parent=svg)=>{
    const node=document.createElementNS(ns,tag);
    for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
    parent.appendChild(node);
    return node;
  };
  const rect=(box,cls,parent=svg)=>make("rect",{
    x:sx(box.x),y:sy(box.y),width:sx(box.w),height:sy(box.h),
    rx:sx(box.r),ry:sy(box.r),class:cls
  },parent);
  const line=(x1,y1,x2,y2,cls,width=data.line.normal,parent=svg)=>make("line",{
    x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
    class:cls,"stroke-width":width,"stroke-linecap":"round"
  },parent);
  const text=(x,y,value,size=data.type.body,anchor="start",cls="",parent=svg)=>{
    const node=make("text",{
      x:sx(x),y:sy(y),"font-size":size,"text-anchor":anchor,class:cls
    },parent);
    node.textContent=value;
    return node;
  };
  const multiline=(x,ys,values,size,anchor,cls,parent=svg)=>{
    const node=make("text",{"font-size":size,"text-anchor":anchor,class:cls},parent);
    values.forEach((value,index)=>{
      const span=make("tspan",{x:sx(x),y:sy(ys[index])},node);
      span.textContent=value;
    });
    return node;
  };
  const arrow=(x1,y1,x2,y2,cls="connector",parent=svg)=>{
    line(x1,y1,x2,y2,cls,data.line.normal,parent);
    make("polygon",{
      points:[
        [sx(x2),sy(y2)],
        [sx(x2-g.arrow),sy(y2-g.arrow)],
        [sx(x2-g.arrow),sy(y2+g.arrow)]
      ].map(point=>point.join(",")).join(" "),
      class:cls.includes("agent")?"agent-fill":"arrow-head"
    },parent);
  };
  const circle=(x,y,r,cls,parent=svg)=>make("circle",{
    cx:sx(x),cy:sy(y),r:sx(r),class:cls
  },parent);

  const style=make("style",{},svg);
  style.textContent=".arrow-head{fill:var(--arrow)}";

  rect(data.request.box,"soft");
  text(data.request.anchor.x,data.request.anchor.y,data.request.text,
       data.type.request,"middle","");

  line(data.timeline.left,data.timeline.y,data.timeline.right,data.timeline.y,
       "axis",data.line.strong);
  data.timeline.points.forEach(point=>circle(
    point.x,data.timeline.y,g.dotR,point.color
  ));
  text(data.timeline.start.x,data.timeline.y-data.labelPad,
       data.timeline.start.label,data.type.small,"start","muted");
  text(data.timeline.end.x,data.timeline.y-data.labelPad,
       data.timeline.end.label,data.type.small,"end","muted");

  data.cards.forEach(card=>{
    rect(card,"card");
    line(card.x,card.y,card.x+card.w,card.y,`${card.color}-stroke`,data.line.strong);
    text(card.x+18,g.kickerY,card.kicker,data.type.small,"start","muted");
    const title=text(card.x+18,g.cardTitleY,card.title,data.type.title,"start","");
    title.setAttribute("font-weight","700");
    text(card.x+18,g.metricY,card.metric,data.type.metric,"start",`${card.color}-fill`);
    line(card.x+18,g.dividerY,card.x+card.w-18,g.dividerY,
         `${card.color}-stroke`,data.line.thin);

    if(card.flow){
      card.flow.forEach((label,index)=>{
        const x=card.x+g.flowXs[index];
        rect({x,y:g.flowY,w:g.flowW,h:g.flowH,r:g.flowR},"soft");
        text(x+g.flowW/2,g.flowY+24,label,data.type.small,"middle","");
        if(index<card.flow.length-1){
          arrow(x+g.flowW,g.flowArrowY,x+g.flowW+14,g.flowArrowY,`${card.color}-stroke`);
        }
      });
      multiline(card.x+18,g.textYs,card.lines,data.type.body,"start","muted");
    }

    if(card.split){
      card.split.forEach(part=>{
        rect({x:g.splitX,y:part.y,w:g.splitW,h:g.splitH,r:g.splitR},"soft");
        line(g.splitX,part.y,g.splitX,part.y+g.splitH,
             `${part.color}-stroke`,data.line.strong);
        text(g.splitX+12,part.y+19,part.name,data.type.body,"start",`${part.color}-fill`)
          .setAttribute("font-weight","700");
        multiline(g.splitX+12,[part.y+36,part.y+50],part.lines,
                  data.type.small,"start","muted");
      });
    }

    if(card.loop){
      card.loop.forEach(item=>{
        rect({...item,r:g.loopR},"soft");
        multiline(item.x+item.w/2,[item.y+17,item.y+32],item.lines,
                  data.type.small,"middle","");
      });
      arrow(1104,235,1124-g.loopArrow,235,"agent-stroke");
      line(1176,255,1176,278-g.loopArrow,"agent-stroke",data.line.normal);
      make("polygon",{
        points:[
          [sx(1176),sy(278)],
          [sx(1176-g.loopArrow),sy(278-g.loopArrow)],
          [sx(1176+g.loopArrow),sy(278-g.loopArrow)]
        ].map(point=>point.join(",")).join(" "),
        class:"agent-fill"
      });
      arrow(1124,298,1104+g.loopArrow,298,"agent-stroke");
      line(1052,278,1052,255+g.loopArrow,"agent-stroke",data.line.normal);
      make("polygon",{
        points:[
          [sx(1052),sy(255)],
          [sx(1052-g.loopArrow),sy(255+g.loopArrow)],
          [sx(1052+g.loopArrow),sy(255+g.loopArrow)]
        ].map(point=>point.join(",")).join(" "),
        class:"agent-fill"
      });
    }

    rect({
      x:card.x+18,y:g.badgeY,w:card.w-36,h:g.badgeH,r:g.badgeR
    },`${card.color}-fill`);
    text(card.x+card.w/2,g.badgeY+18,card.badge,data.type.small,"middle","white");
  });

  data.connectors.forEach(connector=>{
    arrow(connector.x1,connector.y1,connector.x2-g.arrow,connector.y2);
    text(connector.x1+g.labelPad,connector.y1-data.labelPad,
         connector.label,data.type.small,"start","muted");
  });

  rect({
    x:g.footerX,y:data.footer.y,w:g.footerW,h:data.footer.h,r:data.footer.r
  },"soft");
  const footerTitle=text(g.footerTitleX,g.footerTextY,data.footer.title,
                         data.type.footer,"start","");
  footerTitle.setAttribute("font-weight","700");
  data.footer.items.forEach((item,index)=>{
    circle(item.x,data.footer.y+data.footer.h/2,g.itemDotR,item.color);
    text(item.x+g.labelPad,data.footer.y+30,item.label,
         data.type.footer,"start","");
    if(index<data.footer.items.length-1){
      arrow(item.x+174,data.footer.y+data.footer.h/2,
            item.x+222,data.footer.y+data.footer.h/2);
    }
  });
}catch(error){
  const svg=document.getElementById("chart");
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  const ns="http://www.w3.org/2000/svg";
  const fallback=document.createElementNS(ns,"text");
  fallback.setAttribute("x",sx(44));
  fallback.setAttribute("y",sy(70));
  fallback.setAttribute("font-size",data.type.title);
  fallback.setAttribute("fill","currentColor");
  const lines=[
    "Схема: 1966–2026.",
    "ELIZA: около 200 шаблонов → ALICE: 40 000 категорий →",
    "retrieval и seq2seq → LLM-агент с циклом и инструментами."
  ];
  lines.forEach((value,index)=>{
    const span=document.createElementNS(ns,"tspan");
    span.setAttribute("x",sx(44));
    span.setAttribute("y",sy(70+index*34));
    span.textContent=value;
    fallback.appendChild(span);
  });
  svg.appendChild(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
