<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта шести архитектурных ручек</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f6fb;
    --panel: #ffffff;
    --group-a: #f1f5ff;
    --group-b: #f3fbf8;
    --group-c: #fff8eb;
    --line: #8792a8;
    --border: #cbd3e1;
    --text: #172033;
    --muted: #58657a;
    --old-fill: #ffffff;
    --old-stroke: #8591a6;
    --new-fill: #e8edff;
    --new-stroke: #596bd8;
    --new-text: #263998;
    --cost-fill: #e4f6ef;
    --cost-stroke: #198461;
    --cost-text: #0e6649;
    --fixed-fill: #fff0c9;
    --fixed-stroke: #b57600;
    --fixed-text: #795000;
    --toggle-off: #a5afc0;
    --toggle-on: #5b6ddd;
    --toggle-cost: #238b69;
    --toggle-fixed: #c38513;
    --knob: #ffffff;
    --shadow: #dfe4ee;
    --fallback: #8b2635;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10131a;
      --panel: #171c26;
      --group-a: #1b2132;
      --group-b: #172722;
      --group-c: #2a2418;
      --line: #7d899e;
      --border: #374153;
      --text: #edf1fa;
      --muted: #aeb8ca;
      --old-fill: #202632;
      --old-stroke: #8490a5;
      --new-fill: #252e59;
      --new-stroke: #8d9cff;
      --new-text: #dce2ff;
      --cost-fill: #173d31;
      --cost-stroke: #55c79e;
      --cost-text: #d1f8e9;
      --fixed-fill: #493a18;
      --fixed-stroke: #e0ac42;
      --fixed-text: #ffe5a2;
      --toggle-off: #68758a;
      --toggle-on: #8292ff;
      --toggle-cost: #4bc096;
      --toggle-fixed: #dba43c;
      --knob: #f7f9ff;
      --shadow: #0d1016;
      --fallback: #ffadb9;
    }
  }

  html,
  body {
    margin: unset;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: unset;
    background: var(--panel);
    overflow: hidden;
  }

  h1 {
    margin: unset;
    padding: 12px 18px 8px;
    color: var(--text);
    font-size: 20px;
    line-height: 24px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--panel);
  }

  .canvas {
    fill: var(--panel);
  }

  .group {
    stroke: var(--border);
    stroke-width: 1.5px;
  }

  .group.operations {
    fill: var(--group-a);
  }

  .group.cost {
    fill: var(--group-b);
  }

  .group.fixed {
    fill: var(--group-c);
  }

  .group-title {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .column-title {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .row-name {
    fill: var(--text);
    font-size: 14px;
    font-weight: bold;
  }

  .number-disc {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5px;
  }

  .number {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .card {
    stroke-width: 1.5px;
  }

  .card.old {
    fill: var(--old-fill);
    stroke: var(--old-stroke);
  }

  .card.new {
    fill: var(--new-fill);
    stroke: var(--new-stroke);
  }

  .card.cost {
    fill: var(--cost-fill);
    stroke: var(--cost-stroke);
  }

  .card.fixed {
    fill: var(--fixed-fill);
    stroke: var(--fixed-stroke);
  }

  .card-text {
    font-size: 15px;
    font-weight: bold;
  }

  .card-text.old {
    fill: var(--text);
  }

  .card-text.new {
    fill: var(--new-text);
  }

  .card-text.cost {
    fill: var(--cost-text);
  }

  .card-text.fixed {
    fill: var(--fixed-text);
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .connector.cost {
    stroke: var(--cost-stroke);
  }

  .connector.fixed {
    stroke: var(--fixed-stroke);
  }

  .arrow-head {
    fill: var(--line);
  }

  .arrow-head.cost {
    fill: var(--cost-stroke);
  }

  .annotation {
    fill: var(--muted);
    font-size: 12px;
  }

  .toggle-track {
    stroke-width: 1.5px;
  }

  .toggle-track.operations {
    fill: var(--toggle-on);
    stroke: var(--toggle-on);
  }

  .toggle-track.cost {
    fill: var(--toggle-cost);
    stroke: var(--toggle-cost);
  }

  .toggle-track.fixed {
    fill: var(--toggle-fixed);
    stroke: var(--toggle-fixed);
  }

  .toggle-knob {
    fill: var(--knob);
    stroke: var(--shadow);
    stroke-width: 1.5px;
  }

  .equals {
    fill: var(--fixed-text);
    font-size: 18px;
    font-weight: bold;
  }

  #fallback {
    margin: unset;
    padding: 18px;
    color: var(--fallback);
    background: var(--panel);
    font-size: 15px;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <h1 id="diagram-heading">Карта шести архитектурных ручек</h1>
  <svg id="diagram" viewBox="0 0 1200 440" width="1200" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Шесть архитектурных переключателей</title>
    <desc id="svg-description">Сравнение отправной точки GPT-2 с вариантами современных моделей по нормализации, позиции, активации, разделению голов внимания, типу MLP и размещению нормализации.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна была показать шесть архитектурных ручек: LayerNorm → RMSNorm, выученные позиции → RoPE, GELU → SwiGLU, MHA → GQA → MQA → MLA, Dense → MoE и неизменный Pre-norm.</p>
</figure>

<script>
const DATA = {
  zero: 0,
  canvas: { left: 0, top: 0, right: 1200, bottom: 440 },
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },
  radius: { group: 12, card: 10, toggle: 11 },
  arrow: { back: 10, half: 6 },
  number: { x: 42, radius: 14 },
  label: { x: 72 },
  toggle: {
    left: 218, right: 258, halfHeight: 10,
    knobX: 250, knobRadius: 7
  },
  oldCard: { left: 278, right: 500, halfHeight: 17 },
  flow: { start: 518, end: 692 },
  modernCard: { left: 710, right: 1150, halfHeight: 17 },
  headers: [
    { text: "GPT-2 · отправная точка", x: 389, y: 25 },
    { text: "Современные варианты", x: 930, y: 25 }
  ],
  groups: [
    {
      kind: "operations", title: "ОПЕРАЦИИ ВНУТРИ БЛОКА",
      box: { x: 18, y: 38, right: 1182, bottom: 204, radius: 12 },
      titlePoint: { x: 34, y: 57 }
    },
    {
      kind: "cost", title: "УСТРОЙСТВО И СТОИМОСТЬ",
      box: { x: 18, y: 213, right: 1182, bottom: 349, radius: 12 },
      titlePoint: { x: 34, y: 232 }
    },
    {
      kind: "fixed", title: "ПОЧТИ ФИКСИРОВАНО",
      box: { x: 18, y: 358, right: 1182, bottom: 430, radius: 12 },
      titlePoint: { x: 34, y: 377 }
    }
  ],
  rows: [
    {
      number: "1", name: "Нормализация", y: 82, textY: 87,
      kind: "operations", old: "LayerNorm", modern: "RMSNorm"
    },
    {
      number: "2", name: "Позиция", y: 132, textY: 137,
      kind: "operations", old: "Выученные позиции", modern: "RoPE"
    },
    {
      number: "3", name: "Активация", y: 182, textY: 187,
      kind: "operations", old: "GELU", modern: "SwiGLU"
    },
    {
      number: "4", name: "Разделение внимания", y: 257, textY: 262,
      kind: "cost", old: "MHA", stages: [
        { text: "GQA", left: 710, right: 838 },
        { text: "MQA", left: 866, right: 994 },
        { text: "MLA", left: 1022, right: 1150 }
      ],
      stageArrows: [
        { start: 840, end: 862 },
        { start: 996, end: 1018 }
      ],
      annotation: { text: "всё меньше KV-голов", x: 930, y: 291 }
    },
    {
      number: "5", name: "Dense / MoE", y: 322, textY: 327,
      kind: "cost", old: "Dense", modern: "MoE · выбранные эксперты"
    },
    {
      number: "6", name: "Размещение", y: 404, textY: 409,
      kind: "fixed", old: "Pre-norm", modern: "Pre-norm · сохраняется",
      equals: { x: 605, y: 410 }
    }
  ]
};

const origin = DATA.origin;
const scale = DATA.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  const make = (tag, attributes, parent) => {
    const element = document.createElementNS(namespace, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      element.setAttribute(name, String(value));
    });
    (parent || svg).appendChild(element);
    return element;
  };

  const drawRect = (box, className, parent) => make("rect", {
    x: sx(box.x),
    y: sy(box.y),
    width: sx(box.right) - sx(box.x),
    height: sy(box.bottom) - sy(box.y),
    rx: sx(box.radius) - sx(DATA.zero),
    ry: sy(box.radius) - sy(DATA.zero),
    class: className
  }, parent);

  const drawText = (label, point, className, anchor, parent) => {
    const element = make("text", {
      x: sx(point.x),
      y: sy(point.y),
      class: className,
      "text-anchor": anchor
    }, parent);
    element.textContent = label;
    return element;
  };

  const drawLine = (start, end, className, parent) => make("line", {
    x1: sx(start.x),
    y1: sy(start.y),
    x2: sx(end.x),
    y2: sy(end.y),
    class: className
  }, parent);

  const drawCircle = (center, radius, className, parent) => make("circle", {
    cx: sx(center.x),
    cy: sy(center.y),
    r: sx(radius) - sx(DATA.zero),
    class: className
  }, parent);

  const drawArrow = (start, end, kind, parent) => {
    const connectorClass = kind === "cost" ? "connector cost" : "connector";
    const headClass = kind === "cost" ? "arrow-head cost" : "arrow-head";
    drawLine(start, end, connectorClass, parent);
    make("polygon", {
      points: [
        `${sx(end.x)},${sy(end.y)}`,
        `${sx(end.x - DATA.arrow.back)},${sy(end.y - DATA.arrow.half)}`,
        `${sx(end.x - DATA.arrow.back)},${sy(end.y + DATA.arrow.half)}`
      ].join(" "),
      class: headClass
    }, parent);
  };

  const drawCard = (left, right, row, text, kind, parent) => {
    const box = {
      x: left,
      y: row.y - DATA.oldCard.halfHeight,
      right: right,
      bottom: row.y + DATA.oldCard.halfHeight,
      radius: DATA.radius.card
    };
    const cardKind = kind === "operations" ? "new" : kind;
    drawRect(box, `card ${cardKind}`, parent);
    drawText(text, {
      x: left + (right - left) / DATA.scale.x / (DATA.scale.x + DATA.scale.x),
      y: row.textY
    }, `card-text ${cardKind}`, "middle", parent);
  };

  drawRect({
    x: DATA.canvas.left,
    y: DATA.canvas.top,
    right: DATA.canvas.right,
    bottom: DATA.canvas.bottom,
    radius: DATA.zero
  }, "canvas");

  DATA.groups.forEach(group => {
    drawRect(group.box, `group ${group.kind}`);
    drawText(group.title, group.titlePoint, "group-title", "start");
  });

  DATA.headers.forEach(header => {
    drawText(header.text, header, "column-title", "middle");
  });

  DATA.rows.forEach(row => {
    const rowLayer = make("g", {
      "aria-label": `${row.number}. ${row.name}`
    });

    drawCircle(
      { x: DATA.number.x, y: row.y },
      DATA.number.radius,
      "number-disc",
      rowLayer
    );
    drawText(
      row.number,
      { x: DATA.number.x, y: row.textY },
      "number",
      "middle",
      rowLayer
    );
    drawText(
      row.name,
      { x: DATA.label.x, y: row.textY },
      "row-name",
      "start",
      rowLayer
    );

    drawRect({
      x: DATA.toggle.left,
      y: row.y - DATA.toggle.halfHeight,
      right: DATA.toggle.right,
      bottom: row.y + DATA.toggle.halfHeight,
      radius: DATA.radius.toggle
    }, `toggle-track ${row.kind}`, rowLayer);

    drawCircle(
      { x: DATA.toggle.knobX, y: row.y },
      DATA.toggle.knobRadius,
      "toggle-knob",
      rowLayer
    );

    drawCard(
      DATA.oldCard.left,
      DATA.oldCard.right,
      row,
      row.old,
      "old",
      rowLayer
    );

    if (row.equals) {
      drawLine(
        { x: DATA.flow.start, y: row.y },
        { x: row.equals.x - DATA.arrow.back, y: row.y },
        "connector fixed",
        rowLayer
      );
      drawLine(
        { x: row.equals.x + DATA.arrow.back, y: row.y },
        { x: DATA.flow.end, y: row.y },
        "connector fixed",
        rowLayer
      );
      drawText("=", row.equals, "equals", "middle", rowLayer);
    } else {
      drawArrow(
        { x: DATA.flow.start, y: row.y },
        { x: DATA.flow.end, y: row.y },
        row.kind,
        rowLayer
      );
    }

    if (row.stages) {
      row.stages.forEach(stage => {
        drawCard(stage.left, stage.right, row, stage.text, "cost", rowLayer);
      });
      row.stageArrows.forEach(stageArrow => {
        drawArrow(
          { x: stageArrow.start, y: row.y },
          { x: stageArrow.end, y: row.y },
          "cost",
          rowLayer
        );
      });
      drawText(
        row.annotation.text,
        row.annotation,
        "annotation",
        "middle",
        rowLayer
      );
    } else {
      drawCard(
        DATA.modernCard.left,
        DATA.modernCard.right,
        row,
        row.modern,
        row.kind,
        rowLayer
      );
    }
  });

  fallback.hidden = true;
} catch (error) {
  const diagram = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (diagram) diagram.hidden = true;
  if (fallback) fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
