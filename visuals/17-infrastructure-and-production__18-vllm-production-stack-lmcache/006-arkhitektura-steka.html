<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь запроса через production-stack</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #eef4fb;
    --text: #172033;
    --muted: #5c6b82;
    --border: #9aaac0;
    --route: #1769aa;
    --reply: #c65d16;
    --cache: #8054b3;
    --observe: #168069;
    --control: #52657f;
    --faint: #bdc7d5;
    --white: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10151d;
      --panel: #18212d;
      --panel-soft: #202c3b;
      --text: #eef4fb;
      --muted: #b4c0d1;
      --border: #62738a;
      --route: #68b7ee;
      --reply: #f2a060;
      --cache: #c79ae8;
      --observe: #61d2b6;
      --control: #9eafc5;
      --faint: #49586b;
      --white: #10151d;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    max-width: 1200px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  .title {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-soft);
    font-size: 18px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--panel);
  }

  .box {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5px;
  }

  .soft-box {
    fill: var(--panel-soft);
    stroke: var(--border);
    stroke-width: 1.5px;
  }

  .router-box {
    fill: var(--panel-soft);
    stroke: var(--route);
    stroke-width: 2.5px;
  }

  .engine-box {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5px;
  }

  .engine-selected {
    fill: var(--panel-soft);
    stroke: var(--route);
    stroke-width: 2.5px;
  }

  .cache-box {
    fill: var(--panel-soft);
    stroke: var(--cache);
    stroke-width: 2.5px;
  }

  .observe-box {
    fill: var(--panel-soft);
    stroke: var(--observe);
    stroke-width: 1.5px;
  }

  .control-box {
    fill: var(--panel-soft);
    stroke: var(--control);
    stroke-width: 1.5px;
  }

  .route-line {
    fill: none;
    stroke: var(--route);
    stroke-width: 2.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .reply-line {
    fill: none;
    stroke: var(--reply);
    stroke-width: 2.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .cache-line {
    fill: none;
    stroke: var(--cache);
    stroke-width: 2.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .observe-line {
    fill: none;
    stroke: var(--observe);
    stroke-width: 1.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .control-line {
    fill: none;
    stroke: var(--control);
    stroke-width: 1.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .faint-line {
    fill: none;
    stroke: var(--faint);
    stroke-width: 1.5px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .route-head { fill: var(--route); }
  .reply-head { fill: var(--reply); }
  .cache-head { fill: var(--cache); }
  .observe-head { fill: var(--observe); }
  .control-head { fill: var(--control); }

  text {
    fill: var(--text);
    font-size: 14px;
  }

  .heading {
    font-size: 16px;
    font-weight: bold;
  }

  .small {
    font-size: 12px;
  }

  .tiny {
    font-size: 11px;
  }

  .muted { fill: var(--muted); }
  .route-text { fill: var(--route); font-weight: bold; }
  .reply-text { fill: var(--reply); font-weight: bold; }
  .cache-text { fill: var(--cache); font-weight: bold; }
  .observe-text { fill: var(--observe); font-weight: bold; }
  .control-text { fill: var(--control); font-weight: bold; }

  #fallback {
    display: none;
    padding: 14px;
    color: var(--text);
    background: var(--panel);
    font-size: 14px;
  }
</style>
</head>
<body>
<figure class="figure" aria-labelledby="diagram-title">
  <div class="title" id="diagram-title">Путь запроса через production-stack</div>
  <svg id="diagram" viewBox="0 0 1200 460" width="1200" height="460"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Запрос проходит через cache-aware Router к выбранному vLLM Engine; LMCache, Observability и Kubernetes control plane работают рядом с путём данных">
    <desc>Сплошные стрелки показывают запрос, ответ и перенос KV-кэша. Пунктирные стрелки показывают телеметрию и управление.</desc>
  </svg>
  <div id="fallback">Схема должна показать путь «клиент → cache-aware Router → выбранный vLLM Engine → Router → клиент», обмен KV-кэшем через LMCache, а также расположенные рядом Prometheus, Grafana, OTel и Kubernetes control plane.</div>
</figure>

<script>
const [diagram] = [{
  ns: "http://www.w3.org/2000/svg",
  origin: { x: 20, y: 10 },
  scale: { x: 1, y: 1 },
  zero: 0,
  unit: 1,
  radius: 10,
  head: 11,
  wing: 6,
  dash: { long: 9, gap: 7 },
  boxes: {
    control: { x: 230, y: 4, w: 910, h: 76 },
    client: { x: 8, y: 174, w: 140, h: 72 },
    router: { x: 235, y: 150, w: 220, h: 120 },
    engineA: { x: 590, y: 104, w: 220, h: 62 },
    engineB: { x: 590, y: 194, w: 220, h: 62 },
    engineC: { x: 590, y: 284, w: 220, h: 62 },
    cache: { x: 920, y: 182, w: 220, h: 94 },
    observe: { x: 230, y: 358, w: 910, h: 82 },
    prometheus: { x: 475, y: 397, w: 180, h: 30 },
    grafana: { x: 675, y: 397, w: 180, h: 30 },
    otel: { x: 875, y: 397, w: 180, h: 30 }
  },
  guides: {
    fanA: [{ x: 455, y: 181 }, { x: 520, y: 181 }, { x: 590, y: 135 }],
    fanC: [{ x: 455, y: 239 }, { x: 520, y: 239 }, { x: 590, y: 315 }],
    controlRouter: [{ x: 470, y: 80 }, { x: 470, y: 112 }, { x: 345, y: 150 }],
    controlEngines: [{ x: 680, y: 80 }, { x: 680, y: 104 }],
    controlCache: [{ x: 900, y: 80 }, { x: 900, y: 126 }, { x: 1030, y: 182 }],
    observeRouter: [{ x: 345, y: 270 }, { x: 345, y: 358 }],
    observeEngine: [{ x: 700, y: 256 }, { x: 700, y: 358 }],
    observeCache: [{ x: 1030, y: 276 }, { x: 1030, y: 358 }]
  },
  arrows: {
    requestIn: [{ x: 148, y: 199 }, { x: 235, y: 199 }],
    responseOut: [{ x: 235, y: 231 }, { x: 148, y: 231 }],
    requestEngine: [{ x: 455, y: 209 }, { x: 590, y: 209 }],
    responseEngine: [{ x: 590, y: 241 }, { x: 455, y: 241 }],
    cacheLoad: [{ x: 920, y: 207 }, { x: 810, y: 207 }],
    cacheOffload: [{ x: 810, y: 243 }, { x: 920, y: 243 }],
    kvEvents: [{ x: 590, y: 119 }, { x: 535, y: 92 }, { x: 455, y: 165 }]
  },
  legend: {
    solid: [{ x: 10, y: 302 }, { x: 60, y: 302 }],
    dashed: [{ x: 10, y: 329 }, { x: 60, y: 329 }]
  },
  texts: [
    { x: 250, y: 27, value: "Kubernetes control plane", cls: "heading control-text", anchor: "start" },
    { x: 250, y: 53, value: "обнаружение сервисов • конфигурация • накатывающиеся обновления", cls: "small muted", anchor: "start" },
    { x: 1120, y: 27, value: "рядом, не на пути запроса", cls: "small control-text", anchor: "end" },

    { x: 78, y: 200, value: "Клиент", cls: "heading", anchor: "middle" },
    { x: 78, y: 224, value: "вход / ответ", cls: "small muted", anchor: "middle" },

    { x: 345, y: 184, value: "cache-aware Router", cls: "heading route-text", anchor: "middle" },
    { x: 345, y: 211, value: "выбирает Engine", cls: "small", anchor: "middle" },
    { x: 345, y: 235, value: "по доступности KV-префикса", cls: "small muted", anchor: "middle" },

    { x: 700, y: 94, value: "несколько vLLM Engines", cls: "small muted", anchor: "middle" },
    { x: 700, y: 127, value: "vLLM Engine A", cls: "heading", anchor: "middle" },
    { x: 700, y: 150, value: "GPU или группа GPU", cls: "small muted", anchor: "middle" },
    { x: 700, y: 217, value: "vLLM Engine B", cls: "heading route-text", anchor: "middle" },
    { x: 700, y: 240, value: "выбран Router", cls: "small muted", anchor: "middle" },
    { x: 700, y: 307, value: "vLLM Engine C", cls: "heading", anchor: "middle" },
    { x: 700, y: 330, value: "GPU или группа TP / PP", cls: "small muted", anchor: "middle" },

    { x: 1030, y: 211, value: "LMCache", cls: "heading cache-text", anchor: "middle" },
    { x: 1030, y: 236, value: "KV cache offload", cls: "small", anchor: "middle" },
    { x: 1030, y: 258, value: "GPU ↔ другие уровни", cls: "small muted", anchor: "middle" },

    { x: 250, y: 381, value: "Observability — собирает служебные данные, но не вычисляет токены", cls: "observe-text", anchor: "start" },
    { x: 565, y: 413, value: "Prometheus", cls: "small", anchor: "middle" },
    { x: 765, y: 413, value: "Grafana", cls: "small", anchor: "middle" },
    { x: 965, y: 413, value: "OTel • метрики и трейсы", cls: "small", anchor: "middle" },

    { x: 160, y: 188, value: "запрос", cls: "small route-text", anchor: "start" },
    { x: 160, y: 249, value: "ответ", cls: "small reply-text", anchor: "start" },
    { x: 475, y: 199, value: "выбранный путь", cls: "tiny route-text", anchor: "start" },
    { x: 475, y: 257, value: "токены ответа", cls: "tiny reply-text", anchor: "start" },
    { x: 865, y: 195, value: "получить KV", cls: "tiny cache-text", anchor: "middle" },
    { x: 865, y: 260, value: "выгрузить KV", cls: "tiny cache-text", anchor: "middle" },
    { x: 530, y: 82, value: "события KV для Router", cls: "tiny cache-text", anchor: "middle" },

    { x: 72, y: 302, value: "запрос, ответ, KV", cls: "tiny", anchor: "start" },
    { x: 72, y: 329, value: "телеметрия и управление", cls: "tiny muted", anchor: "start" }
  ]
}];

const origin = Object.freeze(diagram.origin);
const scale = Object.freeze(diagram.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");

  const node = (name, attrs, parent = svg) => {
    const element = document.createElementNS(diagram.ns, name);
    for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
    parent.appendChild(element);
    return element;
  };

  const points = path => path.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

  const rect = (box, cls) => node("rect", {
    x: sx(box.x),
    y: sy(box.y),
    width: sx(box.x + box.w) - sx(box.x),
    height: sy(box.y + box.h) - sy(box.y),
    rx: sx(diagram.radius) - sx(diagram.zero),
    ry: sy(diagram.radius) - sy(diagram.zero),
    class: cls
  });

  const line = (path, cls, dashed = false) => {
    const attrs = { points: points(path), class: cls };
    if (dashed) {
      attrs["stroke-dasharray"] =
        `${sx(diagram.dash.long) - sx(diagram.zero)} ${sx(diagram.dash.gap) - sx(diagram.zero)}`;
    }
    return node("polyline", attrs);
  };

  const arrow = (path, lineClass, headClass, dashed = false) => {
    line(path, lineClass, dashed);
    const end = path.at(-diagram.unit);
    const before = path.at(-diagram.unit - diagram.unit);
    const dx = end.x - before.x;
    const dy = end.y - before.y;
    const length = Math.hypot(dx, dy) || diagram.unit;
    const ux = dx / length;
    const uy = dy / length;
    const baseX = end.x - ux * diagram.head;
    const baseY = end.y - uy * diagram.head;
    const left = {
      x: baseX - uy * diagram.wing,
      y: baseY + ux * diagram.wing
    };
    const right = {
      x: baseX + uy * diagram.wing,
      y: baseY - ux * diagram.wing
    };
    node("polygon", {
      points: points([end, left, right]),
      class: headClass
    });
  };

  const label = item => {
    const text = node("text", {
      x: sx(item.x),
      y: sy(item.y),
      class: item.cls,
      "text-anchor": item.anchor,
      "dominant-baseline": "middle"
    });
    text.textContent = item.value;
  };

  line(diagram.guides.fanA, "faint-line");
  line(diagram.guides.fanC, "faint-line");
  arrow(diagram.guides.controlRouter, "control-line", "control-head", true);
  arrow(diagram.guides.controlEngines, "control-line", "control-head", true);
  arrow(diagram.guides.controlCache, "control-line", "control-head", true);
  arrow(diagram.guides.observeRouter, "observe-line", "observe-head", true);
  arrow(diagram.guides.observeEngine, "observe-line", "observe-head", true);
  arrow(diagram.guides.observeCache, "observe-line", "observe-head", true);

  rect(diagram.boxes.control, "control-box");
  rect(diagram.boxes.client, "box");
  rect(diagram.boxes.router, "router-box");
  rect(diagram.boxes.engineA, "engine-box");
  rect(diagram.boxes.engineB, "engine-selected");
  rect(diagram.boxes.engineC, "engine-box");
  rect(diagram.boxes.cache, "cache-box");
  rect(diagram.boxes.observe, "observe-box");
  rect(diagram.boxes.prometheus, "box");
  rect(diagram.boxes.grafana, "box");
  rect(diagram.boxes.otel, "box");

  arrow(diagram.arrows.requestIn, "route-line", "route-head");
  arrow(diagram.arrows.responseOut, "reply-line", "reply-head");
  arrow(diagram.arrows.requestEngine, "route-line", "route-head");
  arrow(diagram.arrows.responseEngine, "reply-line", "reply-head");
  arrow(diagram.arrows.cacheLoad, "cache-line", "cache-head");
  arrow(diagram.arrows.cacheOffload, "cache-line", "cache-head");
  arrow(diagram.arrows.kvEvents, "cache-line", "cache-head", true);

  line(diagram.legend.solid, "route-line");
  line(diagram.legend.dashed, "control-line", true);

  for (const item of diagram.texts) label(item);
} catch (error) {
  document.getElementById("diagram").style.display = "none";
  document.getElementById("fallback").style.display = "block";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
