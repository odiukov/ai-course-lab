<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Как выгода меняется с давлением на HBM</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fbfcfe;
      --ink: #182230;
      --muted: #667085;
      --grid: #d6dce5;
      --axis: #344054;
      --baseline: #687386;
      --native: #2878c8;
      --lmcache: #d14b72;
      --low-zone: #f2f5f8;
      --high-zone: #e8f3ff;
      --threshold: #996515;
      --note-bg: #fff7df;
      --note-ink: #694b10;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111720;
        --ink: #edf2f8;
        --muted: #aab4c3;
        --grid: #344050;
        --axis: #c8d1dc;
        --baseline: #a9b2c1;
        --native: #66b4ff;
        --lmcache: #ff83a5;
        --low-zone: #18212c;
        --high-zone: #132a3c;
        --threshold: #f1c15f;
        --note-bg: #2c2617;
        --note-ink: #f3d98e;
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 16px 10px;
      background: var(--bg);
    }

    h2 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 4px 0 7px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.3;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      overflow: visible;
      background: var(--bg);
    }

    .zone-low { fill: var(--low-zone); }
    .zone-high { fill: var(--high-zone); }
    .grid {
      stroke: var(--grid);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .axis {
      stroke: var(--axis);
      stroke-width: 1.6;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .threshold {
      stroke: var(--threshold);
      stroke-width: 1.5;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .baseline {
      stroke: var(--baseline);
      stroke-width: 3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .native {
      stroke: var(--native);
      stroke-width: 3;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .lmcache {
      stroke: var(--lmcache);
      stroke-width: 3.5;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .leader {
      stroke: var(--muted);
      stroke-width: 1.2;
      fill: none;
      vector-effect: non-scaling-stroke;
    }
    .key-dot {
      fill: var(--bg);
      stroke: var(--threshold);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }
    text {
      fill: var(--ink);
      font-size: 14px;
    }
    .axis-title {
      font-size: 14px;
      font-weight: 650;
    }
    .zone-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 650;
    }
    .legend-label {
      font-size: 13px;
      font-weight: 650;
    }
    .annotation {
      font-size: 14px;
      font-weight: 650;
    }
    .threshold-label {
      fill: var(--threshold);
      font-size: 14px;
      font-weight: 720;
    }
    .footer-note {
      fill: var(--note-ink);
      font-size: 13px;
      font-weight: 650;
    }
    .note-band { fill: var(--note-bg); }

    #fallback {
      display: none;
      margin-top: 12px;
      padding: 14px;
      border: 1px solid var(--grid);
      color: var(--ink);
      background: var(--low-zone);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h2>Как выгода меняется с давлением на HBM</h2>
    <p class="subtitle">Один бенчмарк · 16 × H100 · растёт суммарный объём KV</p>

    <svg id="chart" viewBox="0 0 960 430"
         role="img"
         aria-labelledby="svg-title svg-desc"
         preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">Сравнение baseline, native CPU-offload и LMCache при росте давления на HBM</title>
      <desc id="svg-desc">При малом давлении LMCache ниже baseline на три–пять процентов. Около границы HBM линии сходятся. После превышения восьмидесяти гигабайт native-выгрузка и LMCache обгоняют baseline, причём LMCache выигрывает сильнее.</desc>
    </svg>

    <div id="fallback" role="status">
      Схема должна была показать: при малом давлении на HBM LMCache ниже baseline на 3–5%, около границы линии сходятся, а после превышения 80 ГБ CPU-offload и LMCache обгоняют baseline.
    </div>
  </main>

  <script>
    const data = [{
      origin: [118, 345],
      scale: [76, 29],
      zero: 0,
      plot: { left: 0, right: 10.6, bottom: 0, top: 9.9 },
      thresholdX: 8,
      arrow: {
        axis: 0.16,
        axisBack: 0.23,
        axisHalf: 0.12
      },
      dash: 0.11,
      dotRadius: 0.09,
      zones: [
        { left: 0, right: 4.5, bottom: 0, top: 9.15, cls: "zone-low" },
        { left: 8, right: 10.6, bottom: 0, top: 9.15, cls: "zone-high" }
      ],
      grids: [
        { y: 3.2 },
        { y: 5.5 },
        { y: 7.8 }
      ],
      series: [
        {
          cls: "baseline",
          segments: [
            ["M", 0, 5.5],
            ["C", 3.7, 5.5, 6.8, 5.5, 8, 5.5],
            ["C", 8.8, 5.42, 9.55, 4.62, 10.3, 4.02]
          ]
        },
        {
          cls: "native",
          segments: [
            ["M", 0, 5.5],
            ["C", 3.7, 5.5, 6.8, 5.5, 8, 5.5],
            ["C", 8.65, 5.72, 9.42, 6.56, 10.3, 6.9]
          ]
        },
        {
          cls: "lmcache",
          segments: [
            ["M", 0, 5.25],
            ["C", 2.4, 5.24, 5.25, 5.31, 8, 5.5],
            ["C", 8.54, 6.4, 9.35, 7.92, 10.3, 8.58]
          ]
        }
      ],
      legend: [
        { x1: 0.35, x2: 0.83, y: 8.92, tx: 0.95, text: "baseline", cls: "baseline" },
        { x1: 3.05, x2: 3.53, y: 8.92, tx: 3.65, text: "native CPU-offload", cls: "native" },
        { x1: 6.48, x2: 6.96, y: 8.92, tx: 7.08, text: "LMCache", cls: "lmcache" }
      ],
      labels: [
        {
          x: 0, y: 10.05, dx: 0, dy: 0,
          text: "Пропускная способность",
          anchor: "start", cls: "axis-title"
        },
        {
          x: 1.75, y: -0.57, dx: 0, dy: 0,
          text: "малое давление",
          anchor: "middle", cls: "zone-label"
        },
        {
          x: 5.45, y: -0.57, dx: 0, dy: 0,
          text: "среднее давление",
          anchor: "middle", cls: "zone-label"
        },
        {
          x: 9.28, y: -0.57, dx: 0, dy: 0,
          text: "KV не помещается",
          anchor: "middle", cls: "zone-label"
        },
        {
          x: 10.55, y: -1.28, dx: 0, dy: 0,
          text: "Давление на HBM / суммарный объём KV →",
          anchor: "end", cls: "axis-title"
        },
        {
          x: 8, y: 9.5, dx: 0, dy: -4,
          text: "граница HBM: 80 ГБ",
          anchor: "middle", cls: "threshold-label"
        }
      ],
      callouts: [
        {
          tail: [1.05, 4.25],
          bend: [1.42, 4.25],
          point: [2.08, 5.24],
          textAt: [1.02, 4.08],
          dx: 0, dy: 18,
          text: "накладные расходы LMCache: −3–5%",
          anchor: "start"
        },
        {
          tail: [5.65, 6.42],
          bend: [6.05, 6.42],
          point: [6.55, 5.38],
          textAt: [5.6, 6.55],
          dx: 0, dy: -5,
          text: "около границы линии сходятся",
          anchor: "middle"
        },
        {
          tail: [9.4, 7.62],
          bend: [9.4, 7.12],
          point: [9.16, 6.3],
          textAt: [9.35, 7.75],
          dx: -8, dy: -6,
          text: "offload обгоняет baseline",
          anchor: "end"
        }
      ],
      note: {
        left: 0, right: 10.6, bottom: -2.36, top: -1.62,
        x: 5.3, y: -2.02,
        text: "После 80 ГБ: CPU-offload сохраняет вытесненный KV, а LMCache ещё и делится им между движками"
      }
    }];

    const [D] = data;
    const [originX, originY] = D.origin;
    const [scaleX, scaleY] = D.scale;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("chart");
      const ns = svg.namespaceURI;

      const make = (name, attrs, parent = svg) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        parent.appendChild(node);
        return node;
      };

      const line = (x1, y1, x2, y2, cls, parent = svg) =>
        make("line", {
          x1: sx(x1), y1: sy(y1),
          x2: sx(x2), y2: sy(y2),
          class: cls
        }, parent);

      const rect = (left, right, bottom, top, cls, parent = svg) =>
        make("rect", {
          x: sx(left),
          y: sy(top),
          width: sx(right) - sx(left),
          height: sy(bottom) - sy(top),
          class: cls
        }, parent);

      const text = item => {
        const node = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          dx: item.dx,
          dy: item.dy,
          "text-anchor": item.anchor,
          class: item.cls
        });
        node.textContent = item.text;
        return node;
      };

      const pathData = segments => segments.map(segment => {
        const [kind, ...values] = segment;
        const pairs = [];
        while (values.length) {
          const x = values.shift();
          const y = values.shift();
          pairs.push(`${sx(x)} ${sy(y)}`);
        }
        return `${kind} ${pairs.join(" ")}`;
      }).join(" ");

      D.zones.forEach(zone =>
        rect(zone.left, zone.right, zone.bottom, zone.top, zone.cls)
      );

      D.grids.forEach(grid =>
        line(D.plot.left, grid.y, D.plot.right, grid.y, "grid")
      );

      rect(
        D.note.left,
        D.note.right,
        D.note.bottom,
        D.note.top,
        "note-band"
      );

      line(
        D.plot.left,
        D.plot.bottom,
        D.plot.right,
        D.plot.bottom,
        "axis"
      );
      line(
        D.plot.left,
        D.plot.bottom,
        D.plot.left,
        D.plot.top,
        "axis"
      );

      make("polyline", {
        points: [
          [D.plot.right - D.arrow.axisBack, D.arrow.axisHalf],
          [D.plot.right, D.plot.bottom],
          [D.plot.right - D.arrow.axisBack, -D.arrow.axisHalf]
        ].map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
        class: "axis"
      });

      make("polyline", {
        points: [
          [-D.arrow.axisHalf, D.plot.top - D.arrow.axisBack],
          [D.plot.left, D.plot.top],
          [D.arrow.axisHalf, D.plot.top - D.arrow.axisBack]
        ].map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
        class: "axis"
      });

      const threshold = line(
        D.thresholdX,
        D.plot.bottom,
        D.thresholdX,
        D.plot.top,
        "threshold"
      );
      threshold.setAttribute(
        "stroke-dasharray",
        `${sx(D.dash) - sx(D.zero)} ${sx(D.dash) - sx(D.zero)}`
      );

      D.series.forEach(series =>
        make("path", {
          d: pathData(series.segments.map(segment => [...segment])),
          class: series.cls
        })
      );

      make("circle", {
        cx: sx(D.thresholdX),
        cy: sy(D.grids[1].y),
        r: sx(D.dotRadius) - sx(D.zero),
        class: "key-dot"
      });

      D.legend.forEach(item => {
        line(item.x1, item.y, item.x2, item.y, item.cls);
        text({
          x: item.tx, y: item.y,
          dx: 0, dy: 5,
          text: item.text,
          anchor: "start",
          cls: "legend-label"
        });
      });

      D.labels.forEach(text);

      D.callouts.forEach(callout => {
        const [tailX, tailY] = callout.tail;
        const [bendX, bendY] = callout.bend;
        const [pointX, pointY] = callout.point;
        const [textX, textY] = callout.textAt;

        make("polyline", {
          points: [
            `${sx(tailX)},${sy(tailY)}`,
            `${sx(bendX)},${sy(bendY)}`,
            `${sx(pointX)},${sy(pointY)}`
          ].join(" "),
          class: "leader"
        });

        text({
          x: textX,
          y: textY,
          dx: callout.dx,
          dy: callout.dy,
          text: callout.text,
          anchor: callout.anchor,
          cls: "annotation"
        });
      });

      text({
        x: D.note.x,
        y: D.note.y,
        dx: 0,
        dy: 5,
        text: D.note.text,
        anchor: "middle",
        cls: "footer-note"
      });
    } catch (error) {
      document.getElementById("chart").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
