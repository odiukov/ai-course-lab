<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Маршрутизация вызов-результат</title>
<style>
  :root{
    --bg:#fdfdfb; --fg:#1b1b1b; --line:#3a3a3a; --box:#ffffff;
    --muted:#5d6470; --bad:#b3261e; --dim:#c9ccd2;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e9ecf1; --line:#a3adba; --box:#1e242d;
      --muted:#9aa4b2; --bad:#f08a80; --dim:#39414c;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 12px 12px;
        font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h3{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:500px;background:var(--bg)}
  .bx{fill:var(--box);stroke:var(--line);stroke-width:1.2}
  .grp{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:5 4}
  .ln{stroke:var(--line);stroke-width:1.4;fill:none}
  .hd{fill:var(--line);stroke:none}
  .bad .ln,.bad-ln{stroke:var(--bad);stroke-width:1.6;stroke-dasharray:7 4;fill:none}
  .bad-hd{fill:var(--bad);stroke:none}
  .sep{stroke:var(--dim);stroke-width:1}
  text{fill:var(--fg)}
  .t-hd{font-size:12px;fill:var(--muted)}
  .t-bx{font-size:13px}
  .t-ar{font-size:11px;fill:var(--muted)}
  .t-bad{font-size:12.5px;fill:var(--bad)}
  .t-lg{font-size:12px;fill:var(--muted)}
  p.fb{font-size:13px;color:var(--fg);margin:0}
</style>
<div class="wrap">
  <h3>Маршрутизация: бирка вызова возвращается вместе с результатом</h3>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    var NS="http://www.w3.org/2000/svg";

    /* --- данные схемы (единицы схемы, не пиксели) --- */
    var rows=[
      {id:"u\u2081",call:"git_status",exec:"git_status()",res:"\u0432\u0435\u0442\u043a\u0430 main, \u0447\u0438\u0441\u0442\u043e",cy:1.40},
      {id:"u\u2082",call:"search",exec:"search()",res:"\u043d\u0430\u0439\u0434\u0435\u043d\u043e 4 \u0441\u043e\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u044f",cy:2.70},
      {id:"u\u2083",call:"weather \u0422\u043e\u043a\u0438\u043e",exec:"weather()",res:"\u043f\u043e\u0433\u043e\u0434\u0430 \u0422\u043e\u043a\u0438\u043e",cy:4.00}
    ];
    var mix=[
      {id:"u\u2083",call:"\u0437\u0430\u043f\u0440\u043e\u0441: \u0422\u043e\u043a\u0438\u043e",cy:6.75},
      {id:"u\u2084",call:"\u0437\u0430\u043f\u0440\u043e\u0441: \u041b\u043e\u043d\u0434\u043e\u043d",cy:8.05}
    ];
    var mixRes=[
      {text:"\u043f\u0440\u0438\u0448\u043b\u043e: \u043f\u043e\u0433\u043e\u0434\u0430 \u041b\u043e\u043d\u0434\u043e\u043d\u0430",cy:6.75},
      {text:"\u043f\u0440\u0438\u0448\u043b\u043e: \u043f\u043e\u0433\u043e\u0434\u0430 \u0422\u043e\u043a\u0438\u043e",cy:8.05}
    ];
    var col={cL:-0.30,cR:3.20, eL:5.40,eR:8.20, rL:10.40,rR:14.60};
    var bh=0.45;              /* полувысота блока */

    /* --- одна пара функций перевода --- */
    var origin={x:26,y:16}, scale=44;
    function sx(x){return origin.x + x*scale;}
    function sy(y){return origin.y + y*scale;}

    var svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 760 470");
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(tag,attrs,txt){
      var n=document.createElementNS(NS,tag);
      for(var k in attrs) n.setAttribute(k,attrs[k]);
      if(txt!=null) n.textContent=txt;
      svg.appendChild(n); return n;
    }
    function box(x1,y1,x2,y2,cls){
      el("rect",{class:cls||"bx",x:sx(x1),y:sy(y1),
        width:sx(x2)-sx(x1),height:sy(y2)-sy(y1)});
    }
    function label(x,y,txt,anchor,cls,dy){
      el("text",{x:sx(x),y:sy(y)+(dy||0),"text-anchor":anchor,class:cls},txt);
    }
    function arrow(x1,y1,x2,y2,bad){
      var dx=x2-x1, dy=y2-y1, L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L;
      var h=0.30, w=0.13;
      var bx=x2-ux*h, by=y2-uy*h;
      el("line",{class:bad?"bad-ln":"ln",x1:sx(x1),y1:sy(y1),x2:sx(bx),y2:sy(by)});
      el("polygon",{class:bad?"bad-hd":"hd",points:
        sx(x2)+","+sy(y2)+" "+
        sx(bx-uy*w)+","+sy(by+ux*w)+" "+
        sx(bx+uy*w)+","+sy(by-ux*w)});
    }

    /* заголовки колонок */
    label((col.cL+col.cR)/2,0.42,"\u043e\u0434\u0438\u043d \u0445\u043e\u0434 \u0430\u0441\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u0430","middle","t-hd");
    label((col.eL+col.eR)/2,0.42,"\u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044c","middle","t-hd");
    label((col.rL+col.rR)/2,0.42,"tool_result","middle","t-hd");

    /* рамка хода ассистента */
    box(col.cL-0.22,0.80,col.cR+0.22,4.62,"grp");

    rows.forEach(function(r){
      box(col.cL,r.cy-bh,col.cR,r.cy+bh);
      label(col.cL+0.20,r.cy,r.id+"  "+r.call,"start","t-bx",5);
      box(col.eL,r.cy-bh,col.eR,r.cy+bh);
      label((col.eL+col.eR)/2,r.cy,r.exec,"middle","t-bx",5);
      box(col.rL,r.cy-bh,col.rR,r.cy+bh);
      label(col.rL+0.20,r.cy,r.id+"  "+r.res,"start","t-bx",5);
      arrow(col.cR,r.cy,col.eL,r.cy,false);
      arrow(col.eR,r.cy,col.rL,r.cy,false);
    });

    /* подписи стрелок — только у первого ряда, над линией */
    label((col.cR+col.eL)/2,rows[0].cy-0.42,"id \u0441 \u0432\u044b\u0437\u043e\u0432\u043e\u043c","middle","t-ar");
    label((col.eR+col.rL)/2,rows[0].cy-0.42,"id \u0441 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u043c","middle","t-ar");

    /* разделитель и перепутанный случай */
    el("line",{class:"sep",x1:sx(col.cL-0.22),y1:sy(5.30),x2:sx(col.rR),y2:sy(5.30)});
    label(col.cL-0.22,5.92,"\u0411\u0435\u0437 \u0431\u0438\u0440\u043a\u0438: \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0441\u043a\u043b\u0435\u0438\u043b\u0441\u044f \u043d\u0435 \u0441 \u0442\u0435\u043c \u0432\u044b\u0437\u043e\u0432\u043e\u043c","start","t-bad");

    mix.forEach(function(m){
      box(col.cL,m.cy-bh,col.cR,m.cy+bh);
      label(col.cL+0.20,m.cy,m.id+"  "+m.call,"start","t-bx",5);
    });
    mixRes.forEach(function(m){
      box(col.rL,m.cy-bh,col.rR,m.cy+bh);
      label(col.rL+0.20,m.cy,m.text,"start","t-bx",5);
    });
    arrow(col.cR,mix[0].cy,col.rL,mixRes[0].cy,true);
    arrow(col.cR,mix[1].cy,col.rL,mixRes[1].cy,true);
    label((col.cR+col.rL)/2,mix[0].cy-0.42,"\u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0432\u043c\u0435\u0441\u0442\u043e \u0431\u0438\u0440\u043a\u0438","middle","t-ar");

    label(col.cL-0.22,8.95,"u\u2083 \u0441\u043f\u0440\u0430\u0448\u0438\u0432\u0430\u043b \u0422\u043e\u043a\u0438\u043e \u2014 \u043f\u0440\u0438\u0448\u043b\u0430 \u043f\u043e\u0433\u043e\u0434\u0430 \u041b\u043e\u043d\u0434\u043e\u043d\u0430","start","t-bad");

    label(col.cL-0.22,9.55,"u\u2081\u2013u\u2084 \u2014 tool_use_id: \u0431\u0438\u0440\u043a\u0430 \u0435\u0434\u0435\u0442 \u0441 \u0432\u044b\u0437\u043e\u0432\u043e\u043c \u0438 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432\u043c\u0435\u0441\u0442\u0435 \u0441 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u043e\u043c.","start","t-lg");
    label(col.cL-0.22,10.05,"\u041e\u0448\u0438\u0431\u043a\u0430 \u0432\u0430\u043b\u0438\u0434\u0430\u0446\u0438\u0438 \u0438\u0434\u0451\u0442 \u0442\u0435\u043c \u0436\u0435 \u043c\u0430\u0440\u0448\u0440\u0443\u0442\u043e\u043c \u0438 \u0441 \u0442\u043e\u0439 \u0436\u0435 \u0431\u0438\u0440\u043a\u043e\u0439.","start","t-lg");

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fb">\u0421\u0445\u0435\u043c\u0430 \u043d\u0435 \u043f\u043e\u0441\u0442\u0440\u043e\u0438\u043b\u0430\u0441\u044c. \u041e\u043d\u0430 \u0434\u043e\u043b\u0436\u043d\u0430 \u0431\u044b\u043b\u0430 \u043f\u043e\u043a\u0430\u0437\u0430\u0442\u044c: \u0438\u0437 \u043e\u0434\u043d\u043e\u0433\u043e \u0445\u043e\u0434\u0430 \u0430\u0441\u0441\u0438\u0441\u0442\u0435\u043d\u0442\u0430 \u0432\u044b\u0445\u043e\u0434\u044f\u0442 \u0442\u0440\u0438 \u0432\u044b\u0437\u043e\u0432\u0430 \u0441 \u0431\u0438\u0440\u043a\u0430\u043c\u0438 u\u2081 (git_status), u\u2082 (search), u\u2083 (weather \u0422\u043e\u043a\u0438\u043e); \u043a\u0430\u0436\u0434\u044b\u0439 \u0438\u0434\u0451\u0442 \u043a \u0441\u0432\u043e\u0435\u043c\u0443 \u0438\u0441\u043f\u043e\u043b\u043d\u0438\u0442\u0435\u043b\u044e \u0438 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u0435\u0442\u0441\u044f \u0432 tool_result \u0441 \u0442\u043e\u0439 \u0436\u0435 \u0431\u0438\u0440\u043a\u043e\u0439: u\u2081 \u2014 \u00ab\u0432\u0435\u0442\u043a\u0430 main, \u0447\u0438\u0441\u0442\u043e\u00bb, u\u2082 \u2014 \u00ab\u043d\u0430\u0439\u0434\u0435\u043d\u043e 4 \u0441\u043e\u0432\u043f\u0430\u0434\u0435\u043d\u0438\u044f\u00bb, u\u2083 \u2014 \u043f\u043e\u0433\u043e\u0434\u0430 \u0422\u043e\u043a\u0438\u043e. \u041d\u0438\u0436\u0435 \u2014 \u043f\u0435\u0440\u0435\u043f\u0443\u0442\u0430\u043d\u043d\u044b\u0439 \u0441\u043b\u0443\u0447\u0430\u0439 \u0431\u0435\u0437 \u0431\u0438\u0440\u043e\u043a: \u043d\u0430 \u0437\u0430\u043f\u0440\u043e\u0441 \u043f\u0440\u043e \u0422\u043e\u043a\u0438\u043e \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442 \u043f\u043e\u0433\u043e\u0434\u0430 \u041b\u043e\u043d\u0434\u043e\u043d\u0430.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
