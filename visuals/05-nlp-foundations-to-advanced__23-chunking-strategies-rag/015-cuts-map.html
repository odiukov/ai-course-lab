<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как разные стратегии режут один и тот же фрагмент</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fb;
    --panel: #ffffff;
    --ink: #182033;
    --muted: #657086;
    --guide: #c9cfda;
    --edge: #8791a5;
    --fixed-a: #ffe1dc;
    --fixed-b: #ffc9bd;
    --recursive-a: #d9ecff;
    --recursive-b: #bfdfff;
    --sentence-a: #e4ddff;
    --sentence-b: #d1c5ff;
    --semantic-a: #d8f1e5;
    --semantic-b: #bde4d1;
    --accent: #d84d3f;
    --natural: #3478bd;
    --topic: #16825d;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151923;
      --panel: #202633;
      --ink: #edf1fa;
      --muted: #aeb8ca;
      --guide: #465064;
      --edge: #738096;
      --fixed-a: #613b3b;
      --fixed-b: #78443f;
      --recursive-a: #244867;
      --recursive-b: #2b587c;
      --sentence-a: #443b70;
      --sentence-b: #55488a;
      --semantic-a: #285a48;
      --semantic-b: #316c56;
      --accent: #ff8173;
      --natural: #76b8f2;
      --topic: #61d2a6;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: initial;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    margin: initial;
    width: 100%;
    max-height: 520px;
    overflow: hidden;
    background: var(--bg);
  }

  figcaption {
    padding: 12px 24px 8px;
    font-size: 20px;
    line-height: 1.2;
    font-weight: bold;
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 476px;
    background: var(--bg);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .source-title,
  .strategy,
  .chunk-label {
    font-weight: bold;
  }

  .source-title { font-size: 13px; }
  .source-line { font-size: 12px; }
  .strategy { font-size: 14px; }
  .chunk-label { font-size: 12px; }
  .hint { font-size: 11px; fill: var(--muted); }
  .axis-label { font-size: 11px; fill: var(--muted); }
  .badge { font-size: 11px; font-weight: bold; }
  .word-left, .word-right { font-size: 13px; font-weight: bold; }
  .legend { font-size: 11px; fill: var(--muted); }

  .panel {
    fill: var(--panel);
    stroke: var(--edge);
    stroke-width: 1px;
  }

  .guide {
    stroke: var(--guide);
    stroke-width: 1px;
    opacity: .72;
  }

  .row-base {
    fill: var(--panel);
    stroke: var(--edge);
    stroke-width: 1px;
  }

  .cut-fixed {
    stroke: var(--accent);
    stroke-width: 3px;
  }

  .cut-natural {
    stroke: var(--natural);
    stroke-width: 2px;
  }

  .cut-topic {
    stroke: var(--topic);
    stroke-width: 3px;
  }

  .leader {
    stroke: var(--accent);
    stroke-width: 1px;
    fill: none;
  }

  .fixed-a { fill: var(--fixed-a); }
  .fixed-b { fill: var(--fixed-b); }
  .recursive-a { fill: var(--recursive-a); }
  .recursive-b { fill: var(--recursive-b); }
  .sentence-a { fill: var(--sentence-a); }
  .sentence-b { fill: var(--sentence-b); }
  .semantic-a { fill: var(--semantic-a); }
  .semantic-b { fill: var(--semantic-b); }

  #fallback {
    margin: initial;
    padding: 24px;
    font-size: 16px;
    line-height: 1.4;
    color: var(--ink);
    background: var(--panel);
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Как разные стратегии режут один и тот же фрагмент</figcaption>
  <svg id="diagram" viewBox="0 0 1200 474" width="1200" height="474"
       role="img" aria-labelledby="diagram-title diagram-description"
       preserveAspectRatio="xMidYMid meet">
    <desc id="diagram-description">
      Один договорный фрагмент показан в четырёх совмещённых шкалах:
      fixed 512 разрывает слово, recursive 512 ищет естественные границы,
      окно предложений объединяет соседние предложения, semantic режет при смене темы.
    </desc>
  </svg>
  <p id="fallback" hidden>
    Здесь должна быть схема одного договорного текста с границами fixed 512,
    recursive 512, окон предложений и semantic. Fixed разрывает слово
    «расторжение», остальные стратегии используют границы предложений или тем.
  </p>
</figure>

<script>
const D = {
  zero: 0,
  one: 1,
  two: 2,
  three: 3,
  four: 4,
  five: 5,
  six: 6,
  seven: 7,
  eight: 8,
  nine: 9,
  ten: 10,
  twelve: 12,
  fourteen: 14,
  sixteen: 16,
  eighteen: 18,
  twenty: 20,
  twentyTwo: 22,
  twentyFour: 24,
  twentySix: 26,
  twentyEight: 28,
  thirty: 30,
  thirtyTwo: 32,
  thirtyFour: 34,
  thirtySix: 36,
  thirtyEight: 38,
  forty: 40,
  fortyTwo: 42,
  fortyFour: 44,
  fortySix: 46,
  fortyEight: 48,
  fifty: 50,
  fiftyTwo: 52,
  fiftyFour: 54,
  fiftySix: 56,
  fiftyEight: 58,
  sixty: 60,
  sixtyOne: 61,
  sixtyTwo: 62,
  sixtyFour: 64,
  sixtySix: 66,
  sixtyEight: 68,
  seventy: 70,
  seventyTwo: 72,
  seventyFour: 74,
  seventySix: 76,
  seventyEight: 78,
  eighty: 80,
  eightyTwo: 82,
  eightyFour: 84,
  ninety: 90,
  oneHundredTwelve: 112,
  oneHundredTwentyFive: 125,
  oneHundredFiftyNine: 159,
  oneHundredSixtyFour: 164,
  oneHundredNinetyFour: 194,
  oneHundredNinetySix: 196,
  twoHundred: 200,
  half: .5,
  soft: .72,
  source: {
    lines: [
      "Заказчик вправе расторгнуть договор, если исполнитель нарушил существенное условие.",
      "При расторжении договора исполнитель возвращает оплату в установленный договором срок.",
      "Уведомление направляется по электронной почте. Новые тарифы публикуются на сайте."
    ],
    landmarks: [
      { x: 30, x2: 80, label: "условие расторжения" },
      { x: 80, x2: 125, label: "срок возврата" },
      { x: 125, x2: 159, label: "уведомление" },
      { x: 159, x2: 194, label: "новая тема" }
    ]
  },
  rows: [
    {
      name: "fixed 512",
      note: "считает символы",
      y: 38,
      y2: 46,
      classes: ["fixed-a", "fixed-b", "fixed-a", "fixed-b"],
      chunks: [
        { x: 30, x2: 61, label: "…условие: расторж", anchor: "end" },
        { x: 61, x2: 112, label: "ение договора…", anchor: "start" },
        { x: 112, x2: 164, label: "…возврат • уведомление…", anchor: "middle" },
        { x: 164, x2: 194, label: "…новая тема", anchor: "middle" }
      ],
      cuts: [61, 112, 164],
      cutClass: "cut-fixed"
    },
    {
      name: "recursive 512",
      note: "абзац → строка → точка",
      y: 49,
      y2: 57,
      classes: ["recursive-a", "recursive-b", "recursive-a", "recursive-b"],
      chunks: [
        { x: 30, x2: 80, label: "условие целиком", anchor: "middle" },
        { x: 80, x2: 125, label: "возврат целиком", anchor: "middle" },
        { x: 125, x2: 159, label: "уведомление", anchor: "middle" },
        { x: 159, x2: 194, label: "новая тема", anchor: "middle" }
      ],
      cuts: [80, 125, 159],
      cutClass: "cut-natural"
    },
    {
      name: "окна предложений",
      note: "по два предложения",
      y: 60,
      y2: 68,
      classes: ["sentence-a", "sentence-b"],
      chunks: [
        { x: 30, x2: 125, label: "расторжение + возврат", anchor: "middle" },
        { x: 125, x2: 194, label: "уведомление + новая тема", anchor: "middle" }
      ],
      cuts: [125],
      cutClass: "cut-natural"
    },
    {
      name: "semantic",
      note: "режет при смене смысла",
      y: 71,
      y2: 79,
      classes: ["semantic-a", "semantic-b", "semantic-a"],
      chunks: [
        { x: 30, x2: 125, label: "одна тема: расторжение и возврат", anchor: "middle" },
        { x: 125, x2: 159, label: "уведомление", anchor: "middle" },
        { x: 159, x2: 194, label: "тарифы", anchor: "middle" }
      ],
      cuts: [125, 159],
      cutClass: "cut-topic"
    }
  ]
};

const origin = { x: D.zero, y: D.zero };
const scale = D.six;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = svg.namespaceURI;

  function node(name, attrs, text) {
    const el = document.createElementNS(ns, name);
    Object.entries(attrs || {}).forEach(([key, value]) => el.setAttribute(key, value));
    if (text !== undefined) el.textContent = text;
    return el;
  }

  function add(name, attrs, text, parent) {
    const el = node(name, attrs, text);
    (parent || svg).appendChild(el);
    return el;
  }

  function rect(x, y, x2, y2, className, parent) {
    return add("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x2) - sx(x),
      height: sy(y2) - sy(y),
      class: className
    }, undefined, parent);
  }

  function line(x, y, x2, y2, className, parent) {
    return add("line", {
      x1: sx(x),
      y1: sy(y),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    }, undefined, parent);
  }

  function text(x, y, value, className, anchor, parent) {
    return add("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor || "start",
      "dominant-baseline": "middle"
    }, value, parent);
  }

  const sourceGroup = add("g", { "aria-label": "Исходный фрагмент договора" });
  rect(D.four, D.one, D.oneHundredNinetySix, D.twentyTwo, "panel", sourceGroup);
  text(D.seven, D.four, "ОДИН ИСХОДНЫЙ ТЕКСТ", "source-title", "start", sourceGroup);

  D.source.lines.forEach((value, index) => {
    text(
      D.seven,
      D.nine + index * D.five,
      value,
      "source-line",
      "start",
      sourceGroup
    );
  });

  text(D.twentyEight, D.twentySix, "позиция в том же фрагменте", "axis-label", "end");

  D.source.landmarks.forEach((item, index) => {
    const middle = (item.x + item.x2) / D.two;
    line(item.x, D.twentyEight, item.x2, D.twentyEight, "guide");
    line(item.x, D.twentySeven, item.x, D.twentyNine, "guide");
    if (index === D.source.landmarks.length - D.one) {
      line(item.x2, D.twentySeven, item.x2, D.twentyNine, "guide");
    }
    text(middle, D.thirtyTwo, item.label, "axis-label", "middle");
  });

  D.source.landmarks.slice(D.one).forEach(item => {
    line(item.x, D.thirtyFour, item.x, D.eightyTwo, "guide");
  });

  D.rows.forEach(row => {
    const rowGroup = add("g", { "aria-label": row.name });
    const middleY = (row.y + row.y2) / D.two;

    text(D.twentyEight, middleY - D.one, row.name, "strategy", "end", rowGroup);
    text(D.twentyEight, middleY + D.two, row.note, "hint", "end", rowGroup);
    rect(D.thirty, row.y, D.oneHundredNinetyFour, row.y2, "row-base", rowGroup);

    row.chunks.forEach((chunk, index) => {
      rect(chunk.x, row.y, chunk.x2, row.y2, row.classes[index], rowGroup);

      if (row.name === "fixed 512" && index === D.zero) {
        text(
          chunk.x2 - D.one,
          middleY + D.one,
          chunk.label,
          "word-left",
          "end",
          rowGroup
        );
      } else if (row.name === "fixed 512" && index === D.one) {
        text(
          chunk.x + D.one,
          middleY + D.one,
          chunk.label,
          "word-right",
          "start",
          rowGroup
        );
      } else {
        text(
          (chunk.x + chunk.x2) / D.two,
          middleY,
          chunk.label,
          "chunk-label",
          chunk.anchor,
          rowGroup
        );
      }
    });

    row.cuts.forEach(cut => {
      line(cut, row.y - D.half, cut, row.y2 + D.half, row.cutClass, rowGroup);
    });
  });

  const fixedCut = D.rows[D.zero].cuts[D.zero];
  line(fixedCut, D.thirtySix, fixedCut, D.thirtyEight, "leader");
  rect(fixedCut - D.four, D.thirtyFour, fixedCut + D.four, D.thirtySeven, "panel");
  text(fixedCut, D.thirtyFive + D.half, "512", "badge", "middle");

  text(
    D.oneHundredNinetyFour,
    D.eightyTwo,
    "Серые линии — границы предложений; цветные разрезы — решения стратегии.",
    "legend",
    "end"
  );

  fallback.hidden = true;
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  svg.hidden = true;
  fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
