<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три поколения promptable-сегментации</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --ink: #172033;
      --muted: #58657a;
      --line: #667085;
      --panel-one: #eef1f5;
      --panel-one-edge: #778195;
      --panel-two: #fff5d9;
      --panel-two-edge: #d78a12;
      --panel-three: #e4f8e9;
      --panel-three-edge: #239a52;
      --node: #ffffff;
      --input: #edf4ff;
      --model: #ffffff;
      --transfer: #fff8e8;
      --output: #edf9f0;
      --shadow: #d5dbe5;
      --accent-one: #596579;
      --accent-two: #bd6f00;
      --accent-three: #178443;
      --tag: #ffffff;
      --error: #9b1c1c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151e;
        --ink: #edf2f8;
        --muted: #b5c0cf;
        --line: #a5afbd;
        --panel-one: #202936;
        --panel-one-edge: #8f9caf;
        --panel-two: #352b17;
        --panel-two-edge: #f2ae38;
        --panel-three: #173225;
        --panel-three-edge: #54ce83;
        --node: #171e29;
        --input: #18283d;
        --model: #171e29;
        --transfer: #302817;
        --output: #173024;
        --shadow: #0b0f16;
        --accent-one: #b5c0cf;
        --accent-two: #ffc45e;
        --accent-three: #70dc98;
        --tag: #111821;
        --error: #ff9c9c;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--page);
      overflow: hidden;
    }

    h1 {
      margin: 0;
      padding: 8px 20px;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: 0.01em;
      background: var(--page);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--page);
    }

    .panel,
    .node,
    .tag {
      vector-effect: non-scaling-stroke;
    }

    .panel {
      stroke-width: 2;
    }

    .lane-one {
      fill: var(--panel-one);
      stroke: var(--panel-one-edge);
    }

    .lane-two {
      fill: var(--panel-two);
      stroke: var(--panel-two-edge);
    }

    .lane-three {
      fill: var(--panel-three);
      stroke: var(--panel-three-edge);
    }

    .node {
      stroke: var(--line);
      stroke-width: 2;
    }

    .input {
      fill: var(--input);
    }

    .model {
      fill: var(--model);
    }

    .transfer {
      fill: var(--transfer);
    }

    .output {
      fill: var(--output);
    }

    .tag {
      fill: var(--tag);
      stroke-width: 1;
    }

    .tag-one {
      stroke: var(--panel-one-edge);
    }

    .tag-two {
      stroke: var(--panel-two-edge);
    }

    .tag-three {
      stroke: var(--panel-three-edge);
    }

    .flow,
    .branch,
    .divider {
      fill: none;
      stroke: var(--line);
      vector-effect: non-scaling-stroke;
    }

    .flow {
      stroke-width: 2;
    }

    .branch,
    .divider {
      stroke-width: 1;
    }

    .arrow {
      stroke: none;
    }

    .arrow-one {
      fill: var(--accent-one);
    }

    .arrow-two {
      fill: var(--accent-two);
    }

    .arrow-three {
      fill: var(--accent-three);
    }

    text {
      fill: var(--ink);
      dominant-baseline: middle;
    }

    .lane-title {
      font-weight: 760;
    }

    .lane-note,
    .caption {
      fill: var(--muted);
    }

    .node-label {
      font-weight: 650;
    }

    .small-label {
      fill: var(--muted);
      font-weight: 570;
    }

    .fallback {
      fill: var(--error);
      font-weight: 650;
    }

    noscript p {
      margin: 8px 20px;
      color: var(--error);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Три поколения promptable-сегментации</h1>
    <svg id="diagram" viewBox="0 0 1200 460"
         width="1200" height="460"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-heading diagram-description">
    </svg>
    <noscript>
      <p>Схема должна показать три маршрута: от точки или рамки, через связку детектора и SAM 2, к общей системе SAM 3.</p>
    </noscript>
  </figure>

  <script>
    const diagramData = {
      origin: { x: 0, y: 0 },
      scale: { x: 10, y: 10 },
      canvas: { width: 120, height: 46 },
      lineWidth: 2,
      font: {
        lane: 18,
        note: 13,
        node: 15,
        small: 12,
        fallback: 17
      },
      arrow: { back: 1.1, wing: 0.65 },
      panels: [
        {
          className: "lane-one",
          accent: "arrow-one",
          tagClass: "tag-one",
          box: { x: 2, y: 1, w: 116, h: 12.5 },
          title: { x: 4, y: 2.8, text: "SAM (2023)" },
          note: {
            x: 116,
            y: 2.8,
            text: "подсказка указывает конкретный объект",
            anchor: "end"
          },
          tag: {
            box: { x: 4, y: 11.7, w: 30, h: 1.2 },
            x: 5,
            y: 12.3,
            text: "одна маска для одной подсказки"
          },
          nodes: [
            {
              className: "input",
              box: { x: 5, y: 5, w: 20, h: 5.8 },
              lines: [
                { x: 15, y: 7.1, text: "Кадр + точка" },
                { x: 15, y: 9.1, text: "или рамка" }
              ]
            },
            {
              className: "model",
              box: { x: 32, y: 5, w: 16, h: 5.8 },
              lines: [
                { x: 40, y: 7.1, text: "ViT" },
                { x: 40, y: 9.1, text: "энкодер" }
              ]
            },
            {
              className: "model",
              box: { x: 55, y: 5, w: 18, h: 5.8 },
              lines: [
                { x: 64, y: 7.1, text: "Декодер" },
                { x: 64, y: 9.1, text: "маски" }
              ]
            },
            {
              className: "output",
              box: { x: 80, y: 5, w: 29, h: 5.8 },
              lines: [
                { x: 94.5, y: 7.1, text: "Маска объекта," },
                { x: 94.5, y: 9.1, text: "на который указали" }
              ]
            }
          ],
          links: [
            { points: [{ x: 25, y: 7.9 }, { x: 32, y: 7.9 }] },
            { points: [{ x: 48, y: 7.9 }, { x: 55, y: 7.9 }] },
            { points: [{ x: 73, y: 7.9 }, { x: 80, y: 7.9 }] }
          ]
        },
        {
          className: "lane-two",
          accent: "arrow-two",
          tagClass: "tag-two",
          box: { x: 2, y: 15, w: 116, h: 12.5 },
          title: { x: 4, y: 16.8, text: "Grounded SAM 2 (2024)" },
          note: {
            x: 116,
            y: 16.8,
            text: "две модели передают результат по цепочке",
            anchor: "end"
          },
          tag: {
            box: { x: 4, y: 25.7, w: 37, h: 1.2 },
            x: 5,
            y: 26.3,
            text: "ошибка рамки переходит в маску"
          },
          nodes: [
            {
              className: "input",
              box: { x: 5, y: 19, w: 13, h: 5.8 },
              lines: [
                { x: 11.5, y: 21.1, text: "Текст" },
                { x: 11.5, y: 23.1, text: "«велосипед»" }
              ]
            },
            {
              className: "model",
              box: { x: 24, y: 19, w: 19, h: 5.8 },
              lines: [
                { x: 33.5, y: 21.1, text: "Grounding" },
                { x: 33.5, y: 23.1, text: "DINO" }
              ]
            },
            {
              className: "transfer",
              box: { x: 49, y: 19, w: 10, h: 5.8 },
              lines: [
                { x: 54, y: 21.1, text: "Рамки" },
                { x: 54, y: 23.1, text: "объектов" }
              ]
            },
            {
              className: "model",
              box: { x: 65, y: 19, w: 15, h: 5.8 },
              lines: [
                { x: 72.5, y: 21.1, text: "SAM 2" },
                { x: 72.5, y: 23.1, text: "с кадром" }
              ]
            },
            {
              className: "output",
              box: { x: 86, y: 19, w: 25, h: 5.8 },
              lines: [
                { x: 98.5, y: 21.1, text: "Маски" },
                { x: 98.5, y: 23.1, text: "+ трекинг" }
              ]
            }
          ],
          links: [
            { points: [{ x: 18, y: 21.9 }, { x: 24, y: 21.9 }] },
            { points: [{ x: 43, y: 21.9 }, { x: 49, y: 21.9 }] },
            { points: [{ x: 59, y: 21.9 }, { x: 65, y: 21.9 }] },
            { points: [{ x: 80, y: 21.9 }, { x: 86, y: 21.9 }] }
          ]
        },
        {
          className: "lane-three",
          accent: "arrow-three",
          tagClass: "tag-three",
          box: { x: 2, y: 29, w: 116, h: 14.5 },
          title: { x: 4, y: 30.8, text: "SAM 3 (2025)" },
          note: {
            x: 116,
            y: 30.8,
            text: "одна система понимает концепт напрямую",
            anchor: "end"
          },
          tag: {
            box: { x: 4, y: 41.7, w: 73, h: 1.2 },
            x: 5,
            y: 42.3,
            text: "сопоставляет концепт · строит маски · сохраняет объекты"
          },
          nodes: [
            {
              className: "input",
              box: { x: 5, y: 33, w: 20, h: 7.2 },
              lines: [
                { x: 15, y: 35, text: "Текст или" },
                { x: 15, y: 37, text: "изображение-" },
                { x: 15, y: 39, text: "пример + кадр" }
              ]
            },
            {
              className: "model",
              box: { x: 32, y: 33, w: 22, h: 7.2 },
              lines: [
                { x: 43, y: 35.2, text: "Общая основа" },
                { x: 43, y: 37.7, text: "shared backbone" }
              ]
            },
            {
              className: "model",
              box: { x: 61, y: 33, w: 28, h: 7.2 },
              lines: [
                { x: 75, y: 34.8, text: "Детектор + память" },
                { x: 75, y: 36.8, text: "трекинга" },
                { x: 75, y: 38.8, text: "+ проверка наличия" }
              ]
            },
            {
              className: "output",
              box: { x: 96, y: 33, w: 17, h: 7.2 },
              lines: [
                { x: 104.5, y: 35.2, text: "Все маски" },
                { x: 104.5, y: 37.7, text: "+ ID объектов" }
              ]
            }
          ],
          links: [
            { points: [{ x: 25, y: 36.6 }, { x: 32, y: 36.6 }] },
            { points: [{ x: 54, y: 36.6 }, { x: 61, y: 36.6 }] },
            { points: [{ x: 89, y: 36.6 }, { x: 96, y: 36.6 }] }
          ]
        }
      ],
      fallback: {
        x: 60,
        y: 22,
        text: "Три маршрута: точка или рамка → две модели → единая система."
      }
    };

    const origin = diagramData.origin;
    const scale = diagramData.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const element = (name, attributes = {}) => {
        const item = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          item.setAttribute(key, value);
        }
        return item;
      };

      const addText = (parent, specification, className, fontSize) => {
        const item = element("text", {
          x: sx(specification.x),
          y: sy(specification.y),
          class: className,
          "font-size": fontSize,
          "text-anchor": specification.anchor || "middle"
        });
        item.textContent = specification.text;
        parent.appendChild(item);
      };

      const addRect = (parent, box, className) => {
        parent.appendChild(element("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.w) - sx(box.x),
          height: sy(box.y + box.h) - sy(box.y),
          class: className
        }));
      };

      const addArrow = (parent, link, accent) => {
        const pathData = link.points
          .map((point, position) =>
            `${position ? "L" : "M"} ${sx(point.x)} ${sy(point.y)}`)
          .join(" ");

        parent.appendChild(element("path", {
          d: pathData,
          class: "flow"
        }));

        const tip = link.points.at(-1);
        const triangle = [
          `${sx(tip.x)},${sy(tip.y)}`,
          `${sx(tip.x - diagramData.arrow.back)},${sy(tip.y - diagramData.arrow.wing)}`,
          `${sx(tip.x - diagramData.arrow.back)},${sy(tip.y + diagramData.arrow.wing)}`
        ].join(" ");

        parent.appendChild(element("polygon", {
          points: triangle,
          class: `arrow ${accent}`
        }));
      };

      svg.replaceChildren();

      const description = element("desc", { id: "diagram-description" });
      description.textContent =
        "Три параллельных маршрута показывают переход от подсказки точкой или рамкой в SAM 2023, через детектор Grounding DINO и SAM 2 в 2024, к общей основе SAM 3 в 2025.";
      svg.appendChild(description);

      for (const lane of diagramData.panels) {
        const group = element("g");

        addRect(group, lane.box, `panel ${lane.className}`);
        addText(group, lane.title, "lane-title", diagramData.font.lane);
        addText(group, lane.note, "lane-note", diagramData.font.note);

        for (const link of lane.links) {
          addArrow(group, link, lane.accent);
        }

        for (const node of lane.nodes) {
          addRect(group, node.box, `node ${node.className}`);
          for (const line of node.lines) {
            addText(group, line, "node-label", diagramData.font.node);
          }
        }

        addRect(group, lane.tag.box, `tag ${lane.tagClass}`);
        addText(
          group,
          {
            x: lane.tag.x,
            y: lane.tag.y,
            text: lane.tag.text,
            anchor: "start"
          },
          "small-label",
          diagramData.font.small
        );

        svg.appendChild(group);
      }
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const message = document.createElementNS(namespace, "text");
      message.setAttribute("x", sx(diagramData.fallback.x));
      message.setAttribute("y", sy(diagramData.fallback.y));
      message.setAttribute("text-anchor", "middle");
      message.setAttribute("font-size", diagramData.font.fallback);
      message.setAttribute("class", "fallback");
      message.textContent = diagramData.fallback.text;
      svg.replaceChildren(message);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
