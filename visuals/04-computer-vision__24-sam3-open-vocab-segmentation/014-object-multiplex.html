<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Object Multiplex</title>
<style>
  :root {
    --page: #f7f8fc;
    --panel: #ffffff;
    --panel-strong: #eef2ff;
    --ink: #172033;
    --muted: #5d6880;
    --line: #aeb8cc;
    --soft-line: #d8deea;
    --old: #e97862;
    --old-soft: #fff0ec;
    --new: #526fe8;
    --new-soft: #eaf0ff;
    --memory: #5b57c9;
    --memory-soft: #eeedff;
    --success: #16876f;
    --shadow: #dfe4ef;
    --fallback: #a33b31;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101522;
      --panel: #181f2f;
      --panel-strong: #222b42;
      --ink: #edf2ff;
      --muted: #aeb9d0;
      --line: #64708a;
      --soft-line: #303a50;
      --old: #ff927c;
      --old-soft: #3b2525;
      --new: #89a3ff;
      --new-soft: #202e55;
      --memory: #aaa2ff;
      --memory-soft: #302d59;
      --success: #62d4b8;
      --shadow: #0b0f19;
      --fallback: #ff9a8c;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body { margin: unset; }

  h2 {
    margin: unset;
    padding: 10px;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--page);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--soft-line);
    stroke-width: 1.5px;
  }

  .panel-old { fill: var(--old-soft); }
  .panel-new { fill: var(--new-soft); }

  .heading {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .subheading {
    fill: var(--muted);
    font-size: 13px;
  }

  .caption {
    fill: var(--muted);
    font-size: 12px;
  }

  .legend {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
  }

  .car-body {
    fill: var(--old);
    stroke: var(--ink);
    stroke-width: 1px;
  }

  .car-roof {
    fill: var(--old-soft);
    stroke: var(--ink);
    stroke-width: 1px;
  }

  .wheel { fill: var(--ink); }

  .bank {
    fill: var(--panel);
    stroke: var(--old);
    stroke-width: 1.2px;
  }

  .bank-line {
    stroke: var(--soft-line);
    stroke-width: 1px;
  }

  .pair-line {
    stroke: var(--old);
    stroke-width: 1px;
    stroke-linecap: round;
  }

  .query {
    stroke: var(--panel);
    stroke-width: 1px;
  }

  .query-link {
    stroke: var(--new);
    stroke-width: 1.3px;
    stroke-linecap: round;
  }

  .id-chip {
    fill: var(--panel);
    stroke: var(--memory);
    stroke-width: 1px;
  }

  .id-text {
    fill: var(--memory);
    font-size: 7px;
    font-weight: bold;
  }

  .memory-shell {
    fill: var(--memory-soft);
    stroke: var(--memory);
    stroke-width: 2px;
  }

  .memory-top {
    fill: var(--memory);
  }

  .memory-title {
    fill: var(--panel);
    font-size: 14px;
    font-weight: bold;
  }

  .arrow {
    fill: var(--new);
    stroke: var(--new);
    stroke-width: 1px;
  }

  .arrow-label {
    fill: var(--new);
    font-size: 14px;
    font-weight: bold;
  }

  .bus {
    fill: var(--new-soft);
    stroke: var(--new);
    stroke-width: 1.5px;
  }

  .fallback {
    fill: var(--fallback);
    font-size: 16px;
    font-weight: bold;
  }
</style>
</head>
<body>
<h2 id="diagram-title">Object Multiplex: от 40 банков памяти к одной общей памяти</h2>

<svg id="diagram"
     width="1200"
     height="460"
     viewBox="0 0 1200 460"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="diagram-title diagram-desc">
  <desc id="diagram-desc">Слева сорок машин с отдельными банками памяти. Справа сорок запросов обращаются к одной общей памяти, где сохранены идентификаторы объектов.</desc>
  <g id="scene"></g>
</svg>

<script>
const data = [{
  origin: { x: 0, y: 0 },
  scale: 1,
  zero: 0,
  canvas: { w: 1200, h: 460 },
  count: 40,
  oldPanel: { x: 24, y: 64, w: 500, h: 326, r: 18 },
  newPanel: { x: 676, y: 64, w: 500, h: 326, r: 18 },
  oldHead: { x: 48, y: 96 },
  oldSub: { x: 48, y: 120 },
  newHead: { x: 700, y: 96 },
  newSub: { x: 700, y: 120 },
  oldGrid: {
    x: 47, y: 143, cols: 8, cellW: 57, cellH: 44,
    carX: 3, carY: 12, carW: 20, carH: 8,
    roofX: 7, roofY: 7, roofW: 11, roofH: 5,
    wheelR: 2, wheelY: 22, wheelA: 7, wheelB: 19,
    bankX: 31, bankY: 7, bankW: 21, bankH: 18, bankR: 3,
    bankInset: 4, bankLineA: 7, bankLineB: 12,
    linkY: 16
  },
  transform: {
    x1: 546, x2: 654, y: 227, half: 17, head: 24,
    labelX: 600, labelY: 191
  },
  requestGrid: {
    x: 704, y: 148, cols: 5, cellW: 28, cellH: 28,
    dotX: 8, dotY: 8, dotR: 6,
    stemX1: 14, stemX2: 25, stemY: 8
  },
  queryLabel: { x: 706, y: 365 },
  bus: { x: 846, y: 240, w: 42, h: 34, r: 8 },
  busLabelA: { x: 867, y: 234 },
  busLabelB: { x: 867, y: 292 },
  busArrow: {
    x1: 888, x2: 914, y: 257, half: 10, head: 12
  },
  memory: {
    x: 914, y: 139, w: 235, h: 226, r: 14,
    topH: 38, titleX: 1032, titleY: 163,
    gridX: 929, gridY: 190, cols: 5,
    cellW: 41, cellH: 20, chipW: 34, chipH: 14, chipR: 4,
    textX: 17, textY: 10
  },
  oldLegend: { x: 48, y: 421 },
  oldLegendSub: { x: 48, y: 442 },
  newLegend: { x: 700, y: 421 },
  newLegendSub: { x: 700, y: 442 },
  fallback: { x: 600, y: 220 },
  colors: [
    "#526fe8", "#16a085", "#d767b1", "#d58b24",
    "#7457d8", "#2f92bd", "#ca5a52", "#3d9b62"
  ],
  labels: {
    oldHead: "До Multiplex",
    oldSub: "40 машин → 40 отдельных memory bank",
    newHead: "Object Multiplex",
    newSub: "40 экземпляров → одна общая память",
    transform: "объединить общую часть",
    queries: "40 запросов экземпляров",
    busA: "ключи",
    busB: "к памяти",
    memory: "ОБЩАЯ ПАМЯТЬ",
    id: "ID",
    oldLegend: "Новый объект → ещё один memory bank",
    oldLegendSub: "признаки одного кадра копируются 40 раз",
    newLegend: "Новый объект → ещё один запрос",
    newLegendSub: "общая память хранится один раз, ID остаются раздельными",
    fallback: "Схема: 40 отдельных банков памяти превращаются в одну общую память с 40 запросами и сохранёнными ID"
  }
}];

const [D] = data;
const origin = D.origin;
const scale = D.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const NS = "http://www.w3.org/2000/svg";
  const scene = document.getElementById("scene");

  const add = (tag, attrs, parent = scene, content = "") => {
    const node = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
    if (content) node.textContent = content;
    parent.appendChild(node);
    return node;
  };

  const rect = (parent, x, y, w, h, r, cls) => add("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(w) - sx(D.zero),
    height: sy(h) - sy(D.zero),
    rx: sx(r) - sx(D.zero),
    class: cls
  }, parent);

  const line = (parent, x1, y1, x2, y2, cls) => add("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: cls
  }, parent);

  const circle = (parent, x, y, r, cls, fill) => {
    const attrs = {
      cx: sx(x),
      cy: sy(y),
      r: sx(r) - sx(D.zero),
      class: cls
    };
    if (fill) attrs.fill = fill;
    return add("circle", attrs, parent);
  };

  const text = (parent, x, y, value, cls, anchor = "start") => add("text", {
    x: sx(x),
    y: sy(y),
    class: cls,
    "text-anchor": anchor
  }, parent, value);

  const polygon = (parent, points, cls) => add("polygon", {
    points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: cls
  }, parent);

  const arrow = (parent, shape, cls) => polygon(parent, [
    { x: shape.x1, y: shape.y - shape.half },
    { x: shape.x2 - shape.head, y: shape.y - shape.half },
    { x: shape.x2 - shape.head, y: shape.y - shape.half - shape.half },
    { x: shape.x2, y: shape.y },
    { x: shape.x2 - shape.head, y: shape.y + shape.half + shape.half },
    { x: shape.x2 - shape.head, y: shape.y + shape.half },
    { x: shape.x1, y: shape.y + shape.half }
  ], cls);

  rect(scene, D.zero, D.zero, D.canvas.w, D.canvas.h, D.zero, "panel");

  rect(
    scene,
    D.oldPanel.x,
    D.oldPanel.y,
    D.oldPanel.w,
    D.oldPanel.h,
    D.oldPanel.r,
    "panel panel-old"
  );

  rect(
    scene,
    D.newPanel.x,
    D.newPanel.y,
    D.newPanel.w,
    D.newPanel.h,
    D.newPanel.r,
    "panel panel-new"
  );

  text(scene, D.oldHead.x, D.oldHead.y, D.labels.oldHead, "heading");
  text(scene, D.oldSub.x, D.oldSub.y, D.labels.oldSub, "subheading");

  Array.from({ length: D.count }).forEach((unused, index) => {
    const col = index % D.oldGrid.cols;
    const row = Math.floor(index / D.oldGrid.cols);
    const x = D.oldGrid.x + col * D.oldGrid.cellW;
    const y = D.oldGrid.y + row * D.oldGrid.cellH;
    const group = add("g", {}, scene);

    line(
      group,
      x + D.oldGrid.carX + D.oldGrid.carW,
      y + D.oldGrid.linkY,
      x + D.oldGrid.bankX,
      y + D.oldGrid.linkY,
      "pair-line"
    );

    rect(
      group,
      x + D.oldGrid.carX,
      y + D.oldGrid.carY,
      D.oldGrid.carW,
      D.oldGrid.carH,
      D.oldGrid.wheelR,
      "car-body"
    );

    polygon(group, [
      {
        x: x + D.oldGrid.roofX,
        y: y + D.oldGrid.carY
      },
      {
        x: x + D.oldGrid.roofX + D.oldGrid.wheelR,
        y: y + D.oldGrid.roofY
      },
      {
        x: x + D.oldGrid.roofX + D.oldGrid.roofW - D.oldGrid.wheelR,
        y: y + D.oldGrid.roofY
      },
      {
        x: x + D.oldGrid.roofX + D.oldGrid.roofW,
        y: y + D.oldGrid.carY
      }
    ], "car-roof");

    circle(
      group,
      x + D.oldGrid.wheelA,
      y + D.oldGrid.wheelY,
      D.oldGrid.wheelR,
      "wheel"
    );

    circle(
      group,
      x + D.oldGrid.wheelB,
      y + D.oldGrid.wheelY,
      D.oldGrid.wheelR,
      "wheel"
    );

    rect(
      group,
      x + D.oldGrid.bankX,
      y + D.oldGrid.bankY,
      D.oldGrid.bankW,
      D.oldGrid.bankH,
      D.oldGrid.bankR,
      "bank"
    );

    line(
      group,
      x + D.oldGrid.bankX + D.oldGrid.bankInset,
      y + D.oldGrid.bankY + D.oldGrid.bankLineA,
      x + D.oldGrid.bankX + D.oldGrid.bankW - D.oldGrid.bankInset,
      y + D.oldGrid.bankY + D.oldGrid.bankLineA,
      "bank-line"
    );

    line(
      group,
      x + D.oldGrid.bankX + D.oldGrid.bankInset,
      y + D.oldGrid.bankY + D.oldGrid.bankLineB,
      x + D.oldGrid.bankX + D.oldGrid.bankW - D.oldGrid.bankInset,
      y + D.oldGrid.bankY + D.oldGrid.bankLineB,
      "bank-line"
    );
  });

  arrow(scene, D.transform, "arrow");
  text(
    scene,
    D.transform.labelX,
    D.transform.labelY,
    D.labels.transform,
    "arrow-label",
    "middle"
  );

  text(scene, D.newHead.x, D.newHead.y, D.labels.newHead, "heading");
  text(scene, D.newSub.x, D.newSub.y, D.labels.newSub, "subheading");

  Array.from({ length: D.count }).forEach((unused, index) => {
    const col = index % D.requestGrid.cols;
    const row = Math.floor(index / D.requestGrid.cols);
    const x = D.requestGrid.x + col * D.requestGrid.cellW;
    const y = D.requestGrid.y + row * D.requestGrid.cellH;
    const color = D.colors[index % D.colors.length];

    circle(
      scene,
      x + D.requestGrid.dotX,
      y + D.requestGrid.dotY,
      D.requestGrid.dotR,
      "query",
      color
    );

    line(
      scene,
      x + D.requestGrid.stemX1,
      y + D.requestGrid.stemY,
      x + D.requestGrid.stemX2,
      y + D.requestGrid.stemY,
      "query-link"
    );
  });

  text(
    scene,
    D.queryLabel.x,
    D.queryLabel.y,
    D.labels.queries,
    "caption"
  );

  rect(
    scene,
    D.bus.x,
    D.bus.y,
    D.bus.w,
    D.bus.h,
    D.bus.r,
    "bus"
  );

  text(
    scene,
    D.busLabelA.x,
    D.busLabelA.y,
    D.labels.busA,
    "caption",
    "middle"
  );

  text(
    scene,
    D.busLabelB.x,
    D.busLabelB.y,
    D.labels.busB,
    "caption",
    "middle"
  );

  arrow(scene, D.busArrow, "arrow");

  rect(
    scene,
    D.memory.x,
    D.memory.y,
    D.memory.w,
    D.memory.h,
    D.memory.r,
    "memory-shell"
  );

  rect(
    scene,
    D.memory.x,
    D.memory.y,
    D.memory.w,
    D.memory.topH,
    D.memory.r,
    "memory-top"
  );

  text(
    scene,
    D.memory.titleX,
    D.memory.titleY,
    D.labels.memory,
    "memory-title",
    "middle"
  );

  Array.from({ length: D.count }).forEach((unused, index) => {
    const col = index % D.memory.cols;
    const row = Math.floor(index / D.memory.cols);
    const x = D.memory.gridX + col * D.memory.cellW;
    const y = D.memory.gridY + row * D.memory.cellH;
    const color = D.colors[index % D.colors.length];

    const chip = rect(
      scene,
      x,
      y,
      D.memory.chipW,
      D.memory.chipH,
      D.memory.chipR,
      "id-chip"
    );
    chip.setAttribute("stroke", color);

    const label = text(
      scene,
      x + D.memory.textX,
      y + D.memory.textY,
      D.labels.id,
      "id-text",
      "middle"
    );
    label.setAttribute("fill", color);
  });

  text(
    scene,
    D.oldLegend.x,
    D.oldLegend.y,
    D.labels.oldLegend,
    "legend"
  );

  text(
    scene,
    D.oldLegendSub.x,
    D.oldLegendSub.y,
    D.labels.oldLegendSub,
    "caption"
  );

  text(
    scene,
    D.newLegend.x,
    D.newLegend.y,
    D.labels.newLegend,
    "legend"
  );

  text(
    scene,
    D.newLegendSub.x,
    D.newLegendSub.y,
    D.labels.newLegendSub,
    "caption"
  );
} catch (error) {
  const NS = "http://www.w3.org/2000/svg";
  const scene = document.getElementById("scene");
  while (scene.firstChild) scene.firstChild.remove();

  const message = document.createElementNS(NS, "text");
  message.setAttribute("x", sx(D.fallback.x));
  message.setAttribute("y", sy(D.fallback.y));
  message.setAttribute("class", "fallback");
  message.setAttribute("text-anchor", "middle");
  message.textContent = D.labels.fallback;
  scene.appendChild(message);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
