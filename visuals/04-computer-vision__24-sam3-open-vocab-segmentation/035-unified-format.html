<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Один формат ответа для разных бэкендов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --ink: midnightblue;
      --muted: slategray;
      --panel: white;
      --model-fill: aliceblue;
      --model-stroke: royalblue;
      --route: slateblue;
      --boundary: gray;
      --contract-fill: honeydew;
      --contract-stroke: seagreen;
      --field-fill: white;
      --accent: darkorange;
      --note-fill: lavender;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: darkslategray;
        --ink: whitesmoke;
        --muted: lightgray;
        --panel: black;
        --model-fill: midnightblue;
        --model-stroke: lightskyblue;
        --route: lightsteelblue;
        --boundary: silver;
        --contract-fill: darkgreen;
        --contract-stroke: lightgreen;
        --field-fill: black;
        --accent: orange;
        --note-fill: indigo;
      }
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      margin: auto;
      text-align: center;
      font-size: 22px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--page);
      border: 1px solid var(--boundary);
      box-sizing: border-box;
    }

    .model {
      fill: var(--model-fill);
      stroke: var(--model-stroke);
    }

    .model-band {
      fill: var(--model-stroke);
    }

    .route {
      stroke: var(--route);
      fill: none;
    }

    .arrow-head,
    .socket {
      fill: var(--route);
    }

    .boundary {
      stroke: var(--boundary);
      fill: none;
    }

    .contract {
      fill: var(--contract-fill);
      stroke: var(--contract-stroke);
    }

    .field {
      fill: var(--field-fill);
      stroke: var(--contract-stroke);
    }

    .field-mark {
      fill: var(--accent);
    }

    .note {
      fill: var(--note-fill);
      stroke: var(--boundary);
    }

    .ink {
      fill: var(--ink);
    }

    .muted {
      fill: var(--muted);
    }

    .light {
      fill: white;
    }

    .model-title,
    .contract-title,
    .field-title {
      font-weight: bold;
    }

    .model-title {
      font-size: 18px;
    }

    .model-subtitle,
    .boundary-label,
    .route-label,
    .field-subtitle,
    .note-text,
    .fallback-detail {
      font-size: 14px;
    }

    .contract-title {
      font-size: 17px;
    }

    .field-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 16px;
    }

    .fallback-title {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Один формат ответа для разных бэкендов</h1>

  <svg
    id="canvas"
    width="1000"
    height="460"
    viewBox="0 0 1000 460"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="svg-title svg-description">
    <title id="svg-title">Три бэкенда сходятся в одну структуру результата</title>
    <desc id="svg-description">
      SAM 3, Grounded SAM 2 и YOLO-World с SAM 2 после границы формата
      возвращают поля concept, instance_id, box xyxy, score и mask RLE.
    </desc>
    <g id="diagram"></g>
  </svg>

  <script>
    const DATA = {
      coordinateSystem: {
        zero: 0,
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1
      },
      canvas: {
        width: 1000,
        height: 460,
        centerX: 500
      },
      strokes: {
        thin: 1,
        regular: 2,
        strong: 3
      },
      radii: {
        card: 12,
        field: 8,
        socket: 5,
        mark: 4
      },
      arrow: {
        length: 13,
        width: 10,
        divisor: 2
      },
      dash: [9, 8],
      models: [
        {
          x: 40,
          y: 42,
          width: 230,
          height: 88,
          bandHeight: 8,
          anchorX: 155,
          titleY: 78,
          subtitleY: 105,
          title: "SAM 3",
          subtitle: "ответ своего бэкенда",
          targetX: 380,
          targetY: 210
        },
        {
          x: 350,
          y: 42,
          width: 300,
          height: 88,
          bandHeight: 8,
          anchorX: 500,
          titleY: 78,
          subtitleY: 105,
          title: "Grounded SAM 2",
          subtitle: "ответ своего бэкенда",
          targetX: 500,
          targetY: 210
        },
        {
          x: 730,
          y: 42,
          width: 230,
          height: 88,
          bandHeight: 8,
          anchorX: 845,
          titleY: 78,
          subtitleY: 105,
          title: "YOLO-World + SAM 2",
          subtitle: "ответ своего бэкенда",
          targetX: 620,
          targetY: 210
        }
      ],
      boundary: {
        x1: 40,
        x2: 960,
        y: 210,
        labelX: 48,
        labelY: 190,
        labelDx: 0,
        labelDy: 0,
        label: "граница общего формата"
      },
      merge: {
        x: 500,
        y: 254,
        labelX: 514,
        labelY: 266,
        labelDx: 8,
        labelDy: 0,
        label: "единый контракт",
        outputY: 298
      },
      contract: {
        x: 35,
        y: 298,
        width: 930,
        height: 130,
        titleX: 500,
        titleY: 325,
        title: "ОБЩАЯ СТРУКТУРА РЕЗУЛЬТАТА"
      },
      fields: [
        {
          x: 80,
          y: 340,
          width: 150,
          height: 68,
          markX: 96,
          markY: 356,
          titleX: 155,
          titleY: 365,
          subtitleX: 155,
          subtitleY: 390,
          title: "concept",
          subtitle: "метка концепта"
        },
        {
          x: 242,
          y: 340,
          width: 160,
          height: 68,
          markX: 258,
          markY: 356,
          titleX: 322,
          titleY: 365,
          subtitleX: 322,
          subtitleY: 390,
          title: "instance_id",
          subtitle: "ID экземпляра"
        },
        {
          x: 414,
          y: 340,
          width: 170,
          height: 68,
          markX: 430,
          markY: 356,
          titleX: 499,
          titleY: 365,
          subtitleX: 499,
          subtitleY: 390,
          title: "box xyxy",
          subtitle: "рамка"
        },
        {
          x: 596,
          y: 340,
          width: 130,
          height: 68,
          markX: 612,
          markY: 356,
          titleX: 661,
          titleY: 365,
          subtitleX: 661,
          subtitleY: 390,
          title: "score",
          subtitle: "уверенность"
        },
        {
          x: 738,
          y: 340,
          width: 170,
          height: 68,
          markX: 754,
          markY: 356,
          titleX: 823,
          titleY: 365,
          subtitleX: 823,
          subtitleY: 390,
          title: "mask RLE",
          subtitle: "маска"
        }
      ],
      note: {
        x: 185,
        y: 436,
        width: 630,
        height: 18,
        textX: 500,
        textY: 449,
        text: "Одинакова форма записи — не сами предсказания"
      },
      fallback: {
        x: 120,
        y: 150,
        width: 760,
        height: 150,
        titleX: 500,
        titleY: 205,
        detailX: 500,
        detailY: 245,
        title: "Схема не построилась",
        detail: "Три разных бэкенда должны сходиться в один общий формат результата."
      }
    };

    const origin = {
      x: DATA.coordinateSystem.originX,
      y: DATA.coordinateSystem.originY
    };

    const scale = {
      x: DATA.coordinateSystem.scaleX,
      y: DATA.coordinateSystem.scaleY
    };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const SVG_NS = "http://www.w3.org/2000/svg";
    const root = document.getElementById("diagram");

    function makeElement(name, attributes, className) {
      const node = document.createElementNS(SVG_NS, name);

      for (const [key, value] of Object.entries(attributes)) {
        node.setAttribute(key, String(value));
      }

      if (className) {
        node.setAttribute("class", className);
      }

      return node;
    }

    function addRect(parent, item, className, radius, strokeWidth) {
      const node = makeElement("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.width) - sx(item.x),
        height: sy(item.y + item.height) - sy(item.y),
        rx: sx(radius) - sx(DATA.coordinateSystem.zero),
        "stroke-width": strokeWidth
      }, className);

      parent.appendChild(node);
      return node;
    }

    function addText(parent, x, y, value, className, anchor, dx, dy) {
      const node = makeElement("text", {
        x: sx(x),
        y: sy(y),
        dx: sx(dx) - sx(DATA.coordinateSystem.zero),
        dy: sy(dy) - sy(DATA.coordinateSystem.zero),
        "text-anchor": anchor
      }, className);

      node.textContent = value;
      parent.appendChild(node);
      return node;
    }

    function addLine(parent, x1, y1, x2, y2, className, strokeWidth) {
      const node = makeElement("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        "stroke-width": strokeWidth,
        "stroke-linecap": "round",
        "stroke-linejoin": "round"
      }, className);

      parent.appendChild(node);
      return node;
    }

    function addArrow(parent, x1, y1, x2, y2) {
      addLine(
        parent,
        x1,
        y1,
        x2,
        y2,
        "route",
        DATA.strokes.strong
      );

      const deltaX = x2 - x1;
      const deltaY = y2 - y1;
      const distance = Math.hypot(deltaX, deltaY);
      const unitX = deltaX / distance;
      const unitY = deltaY / distance;
      const baseX = x2 - unitX * DATA.arrow.length;
      const baseY = y2 - unitY * DATA.arrow.length;
      const halfWidth = DATA.arrow.width / DATA.arrow.divisor;
      const leftX = baseX - unitY * halfWidth;
      const leftY = baseY + unitX * halfWidth;
      const rightX = baseX + unitY * halfWidth;
      const rightY = baseY - unitX * halfWidth;

      const points = [
        `${sx(x2)},${sy(y2)}`,
        `${sx(leftX)},${sy(leftY)}`,
        `${sx(rightX)},${sy(rightY)}`
      ].join(" ");

      parent.appendChild(makeElement("polygon", { points }, "arrow-head"));
    }

    function addSocket(parent, x, y, radius, className) {
      parent.appendChild(makeElement("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(radius) - sx(DATA.coordinateSystem.zero)
      }, className));
    }

    try {
      const routesLayer = makeElement("g", {}, "routes-layer");
      const modelsLayer = makeElement("g", {}, "models-layer");
      const contractLayer = makeElement("g", {}, "contract-layer");

      root.appendChild(routesLayer);
      root.appendChild(modelsLayer);
      root.appendChild(contractLayer);

      for (const model of DATA.models) {
        addRect(
          modelsLayer,
          model,
          "model",
          DATA.radii.card,
          DATA.strokes.regular
        );

        const band = {
          x: model.x,
          y: model.y,
          width: model.width,
          height: model.bandHeight
        };

        addRect(
          modelsLayer,
          band,
          "model-band",
          DATA.radii.card,
          DATA.strokes.thin
        );

        addText(
          modelsLayer,
          model.anchorX,
          model.titleY,
          model.title,
          "model-title ink",
          "middle",
          DATA.coordinateSystem.zero,
          DATA.coordinateSystem.zero
        );

        addText(
          modelsLayer,
          model.anchorX,
          model.subtitleY,
          model.subtitle,
          "model-subtitle muted",
          "middle",
          DATA.coordinateSystem.zero,
          DATA.coordinateSystem.zero
        );

        addArrow(
          routesLayer,
          model.anchorX,
          model.y + model.height,
          model.targetX,
          model.targetY
        );
      }

      const boundary = addLine(
        routesLayer,
        DATA.boundary.x1,
        DATA.boundary.y,
        DATA.boundary.x2,
        DATA.boundary.y,
        "boundary",
        DATA.strokes.regular
      );

      boundary.setAttribute(
        "stroke-dasharray",
        DATA.dash
          .map(value => sx(value) - sx(DATA.coordinateSystem.zero))
          .join(" ")
      );

      addText(
        routesLayer,
        DATA.boundary.labelX,
        DATA.boundary.labelY,
        DATA.boundary.label,
        "boundary-label muted",
        "start",
        DATA.boundary.labelDx,
        DATA.boundary.labelDy
      );

      for (const model of DATA.models) {
        addSocket(
          routesLayer,
          model.targetX,
          model.targetY,
          DATA.radii.socket,
          "socket"
        );

        addLine(
          routesLayer,
          model.targetX,
          model.targetY,
          DATA.merge.x,
          DATA.merge.y,
          "route",
          DATA.strokes.strong
        );
      }

      addSocket(
        routesLayer,
        DATA.merge.x,
        DATA.merge.y,
        DATA.radii.socket,
        "socket"
      );

      addText(
        routesLayer,
        DATA.merge.labelX,
        DATA.merge.labelY,
        DATA.merge.label,
        "route-label ink",
        "start",
        DATA.merge.labelDx,
        DATA.merge.labelDy
      );

      addArrow(
        routesLayer,
        DATA.merge.x,
        DATA.merge.y,
        DATA.merge.x,
        DATA.merge.outputY
      );

      addRect(
        contractLayer,
        DATA.contract,
        "contract",
        DATA.radii.card,
        DATA.strokes.strong
      );

      addText(
        contractLayer,
        DATA.contract.titleX,
        DATA.contract.titleY,
        DATA.contract.title,
        "contract-title ink",
        "middle",
        DATA.coordinateSystem.zero,
        DATA.coordinateSystem.zero
      );

      for (const field of DATA.fields) {
        addRect(
          contractLayer,
          field,
          "field",
          DATA.radii.field,
          DATA.strokes.regular
        );

        addSocket(
          contractLayer,
          field.markX,
          field.markY,
          DATA.radii.mark,
          "field-mark"
        );

        addText(
          contractLayer,
          field.titleX,
          field.titleY,
          field.title,
          "field-title ink",
          "middle",
          DATA.coordinateSystem.zero,
          DATA.coordinateSystem.zero
        );

        addText(
          contractLayer,
          field.subtitleX,
          field.subtitleY,
          field.subtitle,
          "field-subtitle muted",
          "middle",
          DATA.coordinateSystem.zero,
          DATA.coordinateSystem.zero
        );
      }

      addRect(
        root,
        DATA.note,
        "note",
        DATA.radii.field,
        DATA.strokes.thin
      );

      addText(
        root,
        DATA.note.textX,
        DATA.note.textY,
        DATA.note.text,
        "note-text ink",
        "middle",
        DATA.coordinateSystem.zero,
        DATA.coordinateSystem.zero
      );
    } catch (error) {
      root.replaceChildren();

      addRect(
        root,
        DATA.fallback,
        "note",
        DATA.radii.card,
        DATA.strokes.regular
      );

      addText(
        root,
        DATA.fallback.titleX,
        DATA.fallback.titleY,
        DATA.fallback.title,
        "fallback-title ink",
        "middle",
        DATA.coordinateSystem.zero,
        DATA.coordinateSystem.zero
      );

      addText(
        root,
        DATA.fallback.detailX,
        DATA.fallback.detailY,
        DATA.fallback.detail,
        "fallback-detail ink",
        "middle",
        DATA.coordinateSystem.zero,
        DATA.coordinateSystem.zero
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
