<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта выбора стека с открытым словарём</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #59657a;
      --line: #7a879d;
      --accent: #3559c7;
      --accent-soft: #e9eeff;
      --decision: #fff8dc;
      --decision-stroke: #9b7723;
      --leaf: #edf8f2;
      --leaf-stroke: #28714b;
      --warning: #fff0ec;
      --warning-stroke: #a84435;
      --gate: #eef1f6;
      --shadow: #dfe4ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #171d27;
        --ink: #edf2fb;
        --muted: #aeb9ca;
        --line: #8794a9;
        --accent: #91a9ff;
        --accent-soft: #202c50;
        --decision: #302a18;
        --decision-stroke: #d8b45b;
        --leaf: #173126;
        --leaf-stroke: #69c994;
        --warning: #38211e;
        --warning-stroke: #e28b7e;
        --gate: #202735;
        --shadow: #0b0e13;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      background: var(--panel);
    }

    h1 {
      font-size: 22px;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
      border: 1px solid var(--shadow);
    }

    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow {
      fill: var(--line);
    }

    .start-card {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .decision-card {
      fill: var(--decision);
      stroke: var(--decision-stroke);
      stroke-width: 2px;
    }

    .leaf-card {
      fill: var(--leaf);
      stroke: var(--leaf-stroke);
      stroke-width: 2px;
    }

    .conditional-card {
      fill: var(--warning);
      stroke: var(--warning-stroke);
      stroke-width: 2px;
    }

    .gate-card {
      fill: var(--gate);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .node-title {
      fill: var(--ink);
      font-size: 19px;
      font-weight: bold;
    }

    .node-copy {
      fill: var(--muted);
      font-size: 15px;
    }

    .model-title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .branch-label {
      fill: var(--accent);
      font-size: 15px;
      font-weight: bold;
    }

    .gate-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .gate-copy {
      fill: var(--muted);
      font-size: 14px;
    }

    #fallback {
      font-size: 17px;
      color: var(--ink);
      background: var(--warning);
    }
  </style>
</head>
<body>
  <main>
    <h1>Карта выбора стека с открытым словарём</h1>

    <svg
      id="diagram"
      viewBox="0 0 1400 470"
      width="1400"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <title id="diagram-title">Дерево выбора open-vocabulary стека</title>
      <desc id="diagram-description">
        Выбор между YOLO-World, SAM-MI, SAM 3 и Grounded SAM 2 по типу
        результата, сложности концепта и допустимости SAM 3.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать дерево выбора: рамки ведут к YOLO-World;
      простые концепты с масками — к SAM-MI при повторных вызовах декодера;
      составные концепты — к SAM 3, если он допустим, или к Grounded SAM 2,
      если нужен отдельный контроль детектора и лицензии.
    </p>
  </main>

  <script>
    const data = Object.freeze({
      canvas: { width: 1400, height: 470 },
      cards: [
        {
          x: 40, y: 14, w: 1320, h: 40, r: 12,
          className: "gate-card"
        },
        {
          x: 40, y: 190, w: 170, h: 80, r: 14,
          className: "start-card"
        },
        {
          x: 250, y: 170, w: 210, h: 120, r: 14,
          className: "decision-card"
        },
        {
          x: 540, y: 70, w: 250, h: 90, r: 14,
          className: "leaf-card"
        },
        {
          x: 540, y: 215, w: 220, h: 120, r: 14,
          className: "decision-card"
        },
        {
          x: 880, y: 140, w: 260, h: 116, r: 14,
          className: "conditional-card"
        },
        {
          x: 850, y: 310, w: 220, h: 100, r: 14,
          className: "decision-card"
        },
        {
          x: 1130, y: 270, w: 225, h: 92, r: 14,
          className: "leaf-card"
        },
        {
          x: 1130, y: 380, w: 225, h: 78, r: 14,
          className: "leaf-card"
        }
      ],
      edges: [
        {
          points: [
            { x: 210, y: 230 },
            { x: 240, y: 230 }
          ],
          arrow: [
            { x: 250, y: 230 },
            { x: 238, y: 222 },
            { x: 238, y: 238 }
          ]
        },
        {
          points: [
            { x: 460, y: 205 },
            { x: 500, y: 205 },
            { x: 500, y: 115 },
            { x: 530, y: 115 }
          ],
          arrow: [
            { x: 540, y: 115 },
            { x: 528, y: 107 },
            { x: 528, y: 123 }
          ]
        },
        {
          points: [
            { x: 460, y: 255 },
            { x: 500, y: 255 },
            { x: 500, y: 275 },
            { x: 530, y: 275 }
          ],
          arrow: [
            { x: 540, y: 275 },
            { x: 528, y: 267 },
            { x: 528, y: 283 }
          ]
        },
        {
          points: [
            { x: 760, y: 250 },
            { x: 820, y: 250 },
            { x: 820, y: 198 },
            { x: 870, y: 198 }
          ],
          arrow: [
            { x: 880, y: 198 },
            { x: 868, y: 190 },
            { x: 868, y: 206 }
          ]
        },
        {
          points: [
            { x: 760, y: 300 },
            { x: 805, y: 300 },
            { x: 805, y: 360 },
            { x: 840, y: 360 }
          ],
          arrow: [
            { x: 850, y: 360 },
            { x: 838, y: 352 },
            { x: 838, y: 368 }
          ]
        },
        {
          points: [
            { x: 1070, y: 340 },
            { x: 1100, y: 340 },
            { x: 1100, y: 316 },
            { x: 1120, y: 316 }
          ],
          arrow: [
            { x: 1130, y: 316 },
            { x: 1118, y: 308 },
            { x: 1118, y: 324 }
          ]
        },
        {
          points: [
            { x: 1070, y: 380 },
            { x: 1100, y: 380 },
            { x: 1100, y: 419 },
            { x: 1120, y: 419 }
          ],
          arrow: [
            { x: 1130, y: 419 },
            { x: 1118, y: 411 },
            { x: 1118, y: 427 }
          ]
        }
      ],
      labels: [
        {
          x: 70, y: 39,
          text: "Сначала фильтр лицензии:",
          className: "gate-title",
          anchor: "start"
        },
        {
          x: 275, y: 39,
          text: "несовместимый вариант выбывает до сравнения качества",
          className: "gate-copy",
          anchor: "start"
        },

        {
          x: 125, y: 222,
          text: "Требования",
          className: "node-title",
          anchor: "middle"
        },
        {
          x: 125, y: 247,
          text: "проекта",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 355, y: 207,
          text: "Что нужно",
          className: "node-title",
          anchor: "middle"
        },
        {
          x: 355, y: 232,
          text: "вернуть?",
          className: "node-title",
          anchor: "middle"
        },
        {
          x: 355, y: 264,
          text: "маски или рамки",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 665, y: 104,
          text: "YOLO-World",
          className: "model-title",
          anchor: "middle"
        },
        {
          x: 665, y: 132,
          text: "быстрые рамки • приоритет около 30 мс",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 650, y: 251,
          text: "Какой концепт?",
          className: "node-title",
          anchor: "middle"
        },
        {
          x: 650, y: 282,
          text: "простой",
          className: "node-copy",
          anchor: "middle"
        },
        {
          x: 650, y: 307,
          text: "или составной",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 1010, y: 172,
          text: "SAM-MI",
          className: "model-title",
          anchor: "middle"
        },
        {
          x: 1010, y: 201,
          text: "если узкое место — повторные",
          className: "node-copy",
          anchor: "middle"
        },
        {
          x: 1010, y: 225,
          text: "вызовы декодера",
          className: "node-copy",
          anchor: "middle"
        },
        {
          x: 1010, y: 246,
          text: "ускорение декодера ≠ всего процесса",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 960, y: 342,
          text: "Допустим ли",
          className: "node-title",
          anchor: "middle"
        },
        {
          x: 960, y: 368,
          text: "доступ SAM 3?",
          className: "node-title",
          anchor: "middle"
        },
        {
          x: 960, y: 395,
          text: "лицензия • доступ • задержка",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 1242, y: 303,
          text: "SAM 3",
          className: "model-title",
          anchor: "middle"
        },
        {
          x: 1242, y: 331,
          text: "сложный текст • короткий стек",
          className: "node-copy",
          anchor: "middle"
        },
        {
          x: 1242, y: 351,
          text: "возможна большая задержка",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 1242, y: 410,
          text: "Grounded SAM 2",
          className: "model-title",
          anchor: "middle"
        },
        {
          x: 1242, y: 438,
          text: "отдельный контроль детектора и лицензии",
          className: "node-copy",
          anchor: "middle"
        },

        {
          x: 484, y: 177,
          text: "только рамки",
          className: "branch-label",
          anchor: "end"
        },
        {
          x: 478, y: 282,
          text: "нужны маски",
          className: "branch-label",
          anchor: "end"
        },
        {
          x: 805, y: 225,
          text: "простой",
          className: "branch-label",
          anchor: "end"
        },
        {
          x: 792, y: 330,
          text: "составной",
          className: "branch-label",
          anchor: "end"
        },
        {
          x: 1090, y: 324,
          text: "да",
          className: "branch-label",
          anchor: "end"
        },
        {
          x: 1088, y: 405,
          text: "нет",
          className: "branch-label",
          anchor: "end"
        }
      ]
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const edgeLayer = document.createElementNS(namespace, "g");
      edgeLayer.setAttribute("aria-hidden", "true");

      for (const edge of data.edges) {
        const polyline = document.createElementNS(namespace, "polyline");
        polyline.setAttribute(
          "points",
          edge.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
        );
        polyline.setAttribute("class", "edge");
        edgeLayer.appendChild(polyline);

        const arrow = document.createElementNS(namespace, "polygon");
        arrow.setAttribute(
          "points",
          edge.arrow.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
        );
        arrow.setAttribute("class", "arrow");
        edgeLayer.appendChild(arrow);
      }

      svg.appendChild(edgeLayer);

      const cardLayer = document.createElementNS(namespace, "g");

      for (const card of data.cards) {
        const rectangle = document.createElementNS(namespace, "rect");
        rectangle.setAttribute("x", sx(card.x));
        rectangle.setAttribute("y", sy(card.y));
        rectangle.setAttribute("width", sx(card.w));
        rectangle.setAttribute("height", sy(card.h));
        rectangle.setAttribute("rx", sx(card.r));
        rectangle.setAttribute("ry", sy(card.r));
        rectangle.setAttribute("class", card.className);
        cardLayer.appendChild(rectangle);
      }

      svg.appendChild(cardLayer);

      const labelLayer = document.createElementNS(namespace, "g");

      for (const label of data.labels) {
        const text = document.createElementNS(namespace, "text");
        text.setAttribute("x", sx(label.x));
        text.setAttribute("y", sy(label.y));
        text.setAttribute("text-anchor", label.anchor);
        text.setAttribute("class", label.className);
        text.textContent = label.text;
        labelLayer.appendChild(text);
      }

      svg.appendChild(labelLayer);
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
