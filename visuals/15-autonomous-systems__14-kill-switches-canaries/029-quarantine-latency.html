<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Две задержки сетевого карантина</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --panel-alt: #eef3fa;
    --text: #172536;
    --muted: #58697b;
    --border: #b9c5d2;
    --accent: #315fcf;
    --accent-soft: #e8efff;
    --delivery: #c45c20;
    --delivery-soft: #fff0e5;
    --fast: #087d68;
    --fast-soft: #e1f5ef;
    --conclusion: #e7edff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111820;
      --panel: #19232e;
      --panel-alt: #202d3a;
      --text: #edf4fb;
      --muted: #aebdca;
      --border: #526272;
      --accent: #82a5ff;
      --accent-soft: #24365d;
      --delivery: #ff9b62;
      --delivery-soft: #4a2d21;
      --fast: #61d3b7;
      --fast-soft: #173f38;
      --conclusion: #27385e;
    }
  }

  html,
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body {
    margin: auto;
    max-width: 1200px;
  }

  h1 {
    color: var(--text);
    font-size: 22px;
    line-height: normal;
    text-align: center;
  }

  figure {
    margin: auto;
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--bg);
    shape-rendering: geometricPrecision;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .panel-alt {
    fill: var(--panel-alt);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .decision {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 3px;
  }

  .control {
    fill: var(--delivery-soft);
    stroke: var(--delivery);
    stroke-width: 3px;
  }

  .active,
  .honeypot {
    fill: var(--fast-soft);
    stroke: var(--fast);
    stroke-width: 3px;
  }

  .packet {
    fill: var(--panel-alt);
    stroke: var(--text);
    stroke-width: 3px;
  }

  .policy-line {
    stroke: var(--delivery);
    stroke-width: 4px;
    fill: none;
  }

  .fast-line {
    stroke: var(--fast);
    stroke-width: 4px;
    fill: none;
  }

  .delivery-track {
    stroke: var(--delivery);
    stroke-width: 9px;
    fill: none;
  }

  .separator {
    stroke: var(--border);
    stroke-width: 2px;
    fill: none;
  }

  .arrow-policy {
    fill: var(--delivery);
  }

  .arrow-fast {
    fill: var(--fast);
  }

  .conclusion-box {
    fill: var(--conclusion);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  line,
  rect,
  polygon {
    vector-effect: non-scaling-stroke;
  }

  text {
    fill: var(--text);
    font-size: 17px;
  }

  .eyebrow {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
    letter-spacing: normal;
  }

  .node-title {
    font-size: 14px;
    font-weight: bold;
  }

  .node-copy {
    font-size: 16px;
  }

  .phase-policy {
    fill: var(--delivery);
    font-size: 15px;
    font-weight: bold;
  }

  .phase-fast {
    fill: var(--fast);
    font-size: 15px;
    font-weight: bold;
  }

  .value-policy {
    fill: var(--delivery);
    font-size: 19px;
    font-weight: bold;
  }

  .value-fast {
    fill: var(--fast);
    font-size: 19px;
    font-weight: bold;
  }

  .muted {
    fill: var(--muted);
    font-size: 15px;
  }

  .conclusion {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .fallback {
    background: var(--panel);
    color: var(--text);
    font-size: 17px;
    text-align: center;
  }
</style>
</head>
<body>
<h1 id="diagram-title">Две задержки сетевого карантина</h1>
<figure aria-labelledby="diagram-title">
  <svg id="viz" width="1200" height="445" viewBox="0 0 1200 445"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">
      Решение о карантине достигает узла за 240 миллисекунд, после чего
      eBPF перенаправляет пакет в honeypot с задержкой 0,7 миллисекунды.
    </desc>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна была показать две разные задержки: 240 мс на доставку
    политики до узла и 0,7 мс на перенаправление пакета после её активации.
  </p>
  <noscript>
    <p class="fallback">
      Доставка политики занимает 240 мс; затем eBPF перенаправляет пакет
      за 0,7 мс, при P99 меньше 1 мс.
    </p>
  </noscript>
</figure>

<script>
const data = [
  {kind:"meta", origin:{x:0,y:0}, scale:{x:1,y:1}},

  {kind:"rect", x:20,y:8,w:1160,h:150,r:12, class:"panel"},
  {kind:"rect", x:20,y:170,w:1160,h:118,r:12, class:"panel"},
  {kind:"rect", x:20,y:298,w:1160,h:102,r:12, class:"panel-alt"},
  {kind:"rect", x:20,y:410,w:1160,h:29,r:8, class:"conclusion-box"},

  {kind:"rect", x:40,y:50,w:170,h:68,r:10, class:"decision"},
  {kind:"rect", x:275,y:50,w:235,h:68,r:10, class:"control"},
  {kind:"rect", x:575,y:50,w:180,h:68,r:10, class:"active"},
  {kind:"rect", x:820,y:50,w:155,h:68,r:10, class:"packet"},
  {kind:"rect", x:1035,y:50,w:125,h:68,r:10, class:"honeypot"},

  {kind:"line", x1:210,y1:84,x2:263,y2:84, class:"policy-line"},
  {kind:"poly", points:[{x:263,y:76},{x:275,y:84},{x:263,y:92}], class:"arrow-policy"},
  {kind:"line", x1:510,y1:84,x2:563,y2:84, class:"policy-line"},
  {kind:"poly", points:[{x:563,y:76},{x:575,y:84},{x:563,y:92}], class:"arrow-policy"},
  {kind:"line", x1:755,y1:84,x2:808,y2:84, class:"fast-line"},
  {kind:"poly", points:[{x:808,y:76},{x:820,y:84},{x:808,y:92}], class:"arrow-fast"},
  {kind:"line", x1:975,y1:84,x2:1023,y2:84, class:"fast-line"},
  {kind:"poly", points:[{x:1023,y:76},{x:1035,y:84},{x:1023,y:92}], class:"arrow-fast"},

  {kind:"line", x1:125,y1:244,x2:665,y2:244, class:"delivery-track"},
  {kind:"line", x1:125,y1:231,x2:125,y2:257, class:"policy-line"},
  {kind:"line", x1:665,y1:228,x2:665,y2:260, class:"fast-line"},

  {kind:"line", x1:650,y1:326,x2:650,y2:385, class:"separator"},
  {kind:"line", x1:805,y1:360,x2:1073,y2:360, class:"fast-line"},
  {kind:"line", x1:805,y1:348,x2:805,y2:372, class:"fast-line"},
  {kind:"poly", points:[{x:1073,y:352},{x:1085,y:360},{x:1073,y:368}], class:"arrow-fast"},

  {kind:"text", x:40,y:32, anchor:"start", class:"eyebrow", text:"ПОТОК СОБЫТИЙ"},
  {kind:"text", x:125,y:74, anchor:"middle", class:"node-title", text:"t = 0"},
  {kind:"text", x:125,y:99, anchor:"middle", class:"node-copy", text:"включить карантин"},
  {kind:"text", x:392.5,y:70, anchor:"middle", class:"node-title", text:"CONTROL PLANE"},
  {kind:"text", x:392.5,y:92, anchor:"middle", class:"node-copy", text:"создать · распространить"},
  {kind:"text", x:392.5,y:110, anchor:"middle", class:"muted", text:"установить политику"},
  {kind:"text", x:665,y:73, anchor:"middle", class:"node-title", text:"УЗЕЛ"},
  {kind:"text", x:665,y:97, anchor:"middle", class:"node-copy", text:"политика активна"},
  {kind:"text", x:897.5,y:73, anchor:"middle", class:"node-title", text:"СЛЕДУЮЩИЙ"},
  {kind:"text", x:897.5,y:97, anchor:"middle", class:"node-copy", text:"исходящий пакет"},
  {kind:"text", x:1097.5,y:73, anchor:"middle", class:"node-title", text:"HONEYPOT"},
  {kind:"text", x:1097.5,y:97, anchor:"middle", class:"node-copy", text:"пакет направлен сюда"},
  {kind:"text", x:392.5,y:143, anchor:"middle", class:"phase-policy", text:"медленная часть · доставка политики"},
  {kind:"text", x:925,y:143, anchor:"middle", class:"phase-fast", text:"быстрая часть · eBPF-датапат"},

  {kind:"text", x:45,y:194, anchor:"start", class:"eyebrow", text:"ШКАЛА 1 · ВРЕМЯ ДОСТАВКИ РЕШЕНИЯ"},
  {kind:"text", x:395,y:224, anchor:"middle", class:"value-policy", text:"сотни миллисекунд · в примере 240 мс"},
  {kind:"text", x:125,y:275, anchor:"start", class:"muted", text:"0 мс · решение создано"},
  {kind:"text", x:395,y:275, anchor:"middle", class:"phase-policy", text:"окно до изоляции: старые правила ещё действуют"},
  {kind:"text", x:665,y:275, anchor:"start", class:"phase-fast", text:"240 мс · политика установлена на узле"},

  {kind:"text", x:45,y:322, anchor:"start", class:"eyebrow", text:"ШКАЛА 2 · УЖЕ РАБОТАЮЩИЙ ДАТАПАТ"},
  {kind:"text", x:1155,y:322, anchor:"end", class:"eyebrow", text:"ШКАЛЫ НЕ В ОДНОМ МАСШТАБЕ"},
  {kind:"text", x:45,y:351, anchor:"start", class:"phase-fast", text:"Политика уже активна"},
  {kind:"text", x:45,y:377, anchor:"start", class:"muted", text:"измеряются накладные расходы обработки пакета"},
  {kind:"text", x:945,y:340, anchor:"middle", class:"value-fast", text:"P99 < 1 мс · TCP_RR"},
  {kind:"text", x:805,y:389, anchor:"start", class:"muted", text:"пакет вошёл"},
  {kind:"text", x:1085,y:389, anchor:"end", class:"phase-fast", text:"+0,7 мс · перенаправлен в honeypot"},

  {kind:"text", x:600,y:431, anchor:"middle", class:"conclusion", text:"Агент заперт примерно через 240 мс, а не через 0,7 мс"}
];

const origin = Object.freeze(data.find(item => item.kind === "meta").origin);
const scale = Object.freeze(data.find(item => item.kind === "meta").scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("viz");
  const ns = svg.namespaceURI;

  const append = (tag, attributes, className) => {
    const element = document.createElementNS(ns, tag);
    for (const [name, value] of Object.entries(attributes)) {
      element.setAttribute(name, String(value));
    }
    if (className) element.setAttribute("class", className);
    svg.appendChild(element);
    return element;
  };

  for (const item of data) {
    if (item.kind === "meta") continue;

    if (item.kind === "rect") {
      append("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        rx: sx(item.r) - sx(0),
        ry: sy(item.r) - sy(0)
      }, item.class);
    }

    if (item.kind === "line") {
      append("line", {
        x1: sx(item.x1),
        y1: sy(item.y1),
        x2: sx(item.x2),
        y2: sy(item.y2)
      }, item.class);
    }

    if (item.kind === "poly") {
      append("polygon", {
        points: item.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
      }, item.class);
    }

    if (item.kind === "text") {
      const label = append("text", {
        x: sx(item.x),
        y: sy(item.y),
        "text-anchor": item.anchor
      }, item.class);
      label.textContent = item.text;
    }
  }
} catch (error) {
  const failedSvg = document.getElementById("viz");
  const fallback = document.getElementById("fallback");
  if (failedSvg) failedSvg.hidden = true;
  if (fallback) fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
