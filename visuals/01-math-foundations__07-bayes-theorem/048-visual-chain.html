<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Цепочка обновлений Beta</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1c20; --muted:#5c6470;
    --line:#3a3f47; --accent:#1f6feb; --accent2:#b5730f; --box:#f2f5f9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ebef; --muted:#9aa4b2;
      --line:#aab3bf; --accent:#69a8ff; --accent2:#e0a341; --box:#1e242c;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{background:var(--bg);padding:8px 4px 4px;}
  h2{font-size:15px;margin:0 0 4px 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .fail{padding:10px;font-size:14px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Цепочка обновлений: апостериорное становится априорным</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    // ---- данные схемы ----
    var NODES = [
      {x:0,  y:0, name:"Beta(1,1)",  mean:"среднее 0.50", peak:0.9},
      {x:7,  y:0, name:"Beta(8,4)",  mean:"среднее 0.67", peak:2.1},
      {x:14, y:0, name:"Beta(13,9)", mean:"среднее 0.59", peak:3.2}
    ];
    var ARROWS = [
      {from:0, to:1, top:"7 успехов, 3 неудачи", bottom:"передаём только (a, b)"},
      {from:1, to:2, top:"5 успехов, 5 неудач",  bottom:"апостериорное = новое априорное"}
    ];

    // ---- единственное отображение ----
    var ORIGIN = {x:70, y:250};
    var SCALE  = 34;
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y - y*SCALE; }

    var W = 660, H = 300;
    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(t,a){ var e=document.createElementNS(NS,t);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var e=el("text",{x:x,y:y,"text-anchor":anchor,
        "font-size":(size||12),"fill":"var(--fg)"});
      if(cls) e.setAttribute("class",cls);
      e.textContent=s; svg.appendChild(e); return e;
    }

    var defs = el("defs",{});
    var mk = el("marker",{id:"ah",markerWidth:"9",markerHeight:"9",
      refX:"7",refY:"3.2",orient:"auto"});
    mk.appendChild(el("path",{d:"M0,0 L7,3.2 L0,6.4 z",fill:"var(--accent)"}));
    defs.appendChild(mk); svg.appendChild(defs);

    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"}));

    // фиксированные пиксельные отступы подписей
    var PAD_LBL = 14, PAD_SUB = 30, PAD_ARR = 12, LW = 1.6;

    // ---- узлы: рамка + горб плотности ----
    var halfW = 2.0, boxH = 2.7;   // в единицах данных

    NODES.forEach(function(n,i){
      var x0 = sx(n.x-halfW), x1 = sx(n.x+halfW);
      var yBase = sy(n.y), yTop = sy(n.y+boxH);

      svg.appendChild(el("rect",{x:x0,y:yTop,width:x1-x0,height:yBase-yTop,
        rx:6, fill:"var(--box)", stroke:"var(--line)","stroke-width":LW}));

      // базовая линия узла
      svg.appendChild(el("line",{x1:x0,y1:yBase,x2:x1,y2:yBase,
        stroke:"var(--line)","stroke-width":LW}));

      // горб: чем дальше по цепочке, тем уже и выше
      var d="", STEPS=40;
      var width = 1.7/(1+i*0.75);           // сужение
      var centerX = n.x + (i===0?0:(i===1?0.55:0.25));
      for(var s=0;s<=STEPS;s++){
        var t = -halfW*0.92 + (1.84*halfW)*s/STEPS;
        var u = (t-(centerX-n.x))/width;
        var h = (i===0? 0.75 : n.peak*Math.exp(-0.5*u*u));
        var px = sx(n.x+t), py = sy(n.y+0.12+h*0.62);
        d += (s?" L":"M")+px+","+py;
      }
      svg.appendChild(el("path",{d:d,fill:"none",
        stroke:"var(--accent)","stroke-width":LW+0.4}));

      // подписи: название над рамкой, среднее под базой
      txt(sx(n.x), sy(n.y+boxH)-PAD_LBL, n.name, "middle", null, 14);
      txt(sx(n.x), sy(n.y)+PAD_LBL+2, n.mean, "middle", null, 12)
        .setAttribute("fill","var(--muted)");
      txt(sx(n.x), sy(n.y)+PAD_SUB+2,
        (i===0?"старт":(i===1?"после 1-й порции":"после 2-й порции")),
        "middle", null, 11).setAttribute("fill","var(--muted)");
    });

    // ---- стрелки между узлами ----
    ARROWS.forEach(function(a){
      var A = NODES[a.from], B = NODES[a.to];
      var yA = A.y + boxH*0.5;
      var xs = sx(A.x+halfW)+4, xe = sx(B.x-halfW)-6;
      var y  = sy(yA);
      svg.appendChild(el("line",{x1:xs,y1:y,x2:xe,y2:y,
        stroke:"var(--accent)","stroke-width":LW,"marker-end":"url(#ah)"}));

      // подпись у хвоста стрелки, сверху и снизу — в разные стороны
      txt(xs, y-PAD_ARR, a.top, "start", null, 12)
        .setAttribute("fill","var(--accent2)");
      txt(xs, y+PAD_ARR+3, a.bottom, "start", null, 11)
        .setAttribute("fill","var(--muted)");
    });

    // ---- ось уверенности под цепочкой ----
    var axY = -1.35;
    var ax0 = sx(NODES[0].x-halfW), ax1 = sx(NODES[2].x+halfW);
    svg.appendChild(el("line",{x1:ax0,y1:sy(axY),x2:ax1,y2:sy(axY),
      stroke:"var(--line)","stroke-width":LW,"marker-end":"url(#ah)"}));
    NODES.forEach(function(n){
      svg.appendChild(el("line",{x1:sx(n.x),y1:sy(axY-0.16),
        x2:sx(n.x),y2:sy(axY+0.16),stroke:"var(--line)","stroke-width":LW}));
    });
    txt(ax0, sy(axY)-PAD_ARR-2, "a + b растёт, горб сужается",
      "start", null, 12).setAttribute("fill","var(--muted)");

    host.appendChild(svg);
  }catch(e){
    host.innerHTML =
      '<div class="fail">Схема должна была показать цепочку: '+
      'Beta(1,1), среднее 0.50 — после 7 успехов и 3 неудач — '+
      'Beta(8,4), среднее 0.67 — она становится априорной — '+
      'после 5 успехов и 5 неудач — Beta(13,9), среднее 0.59. '+
      'Между звеньями передаётся только пара чисел (a, b); '+
      'сумма a + b растёт, и горб кривой становится уже.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
