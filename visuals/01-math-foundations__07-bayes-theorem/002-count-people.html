<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Пересчёт на 10 000 человек</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1e293b; --muted:#64748b;
    --ok:#cbd5e1; --false:#f59e0b; --sick:#dc2626; --line:#475569;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8;
      --ok:#334155; --false:#fbbf24; --sick:#f87171; --line:#94a3b8;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);}
  .muted{fill:var(--muted);}
  .fallback{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
<div class="wrap">
  <h2>Пересчитаем 10 000 человек</h2>
  <svg id="fig" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="10 000 человек: 1 больной, 100 ложных срабатываний, 101 положительный результат"></svg>
  <div id="fb" class="fallback" hidden></div>
</div>
<script>
(function(){
  try{
    /* ---- данные схемы ---- */
    var D = {
      cols:100, rows:100,            /* 100 x 100 = 10 000 человек */
      sickCol:50, sickRow:45,        /* единственный больной */
      falsePos:100,                  /* 1% из 9 999 здоровых */
      panelCols:10, panelRows:11,    /* 101 положительный результат */
      panelX:128, panelY:0, pitch:3, panelCell:2.4,
      dot:0.62
    };

    /* ---- одна пара функций перевода ---- */
    var origin = {x:16, y:56};
    var scale = 3.4;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    function box(x,y,w,h){
      return "M"+sx(x)+" "+sy(y)+"H"+sx(x+w)+"V"+sy(y+h)+"H"+sx(x)+"Z";
    }
    function cell(col,row,size,pitch,ox,oy){
      return box(ox+col*pitch+(pitch-size)/2, oy+row*pitch+(pitch-size)/2, size, size);
    }
    var out = [];
    function txt(x,y,dx,dy,anchor,size,cls,s){
      out.push('<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+
               '" font-size="'+size+'"'+(cls?' class="'+cls+'"':'')+'>'+s+'</text>');
    }

    /* ---- кто ложно положителен: 100 разбросанных клеток ---- */
    var fp = [], k, c, r, isFP = {};
    for(k=0;k<D.falsePos;k++){
      c = (k*37+11) % D.cols;
      r = (k*7+3) % D.rows;
      fp.push([c,r]); isFP[c+"_"+r]=1;
    }

    /* ---- сетка 10 000 ---- */
    var dHealthy="", dFalse="";
    for(r=0;r<D.rows;r++){
      for(c=0;c<D.cols;c++){
        if(c===D.sickCol && r===D.sickRow) continue;
        var p = cell(c,r,D.dot,1,0,0);
        if(isFP[c+"_"+r]) dFalse += p; else dHealthy += p;
      }
    }
    out.push('<path d="'+dHealthy+'" fill="var(--ok)"/>');
    out.push('<path d="'+dFalse+'" fill="var(--false)"/>');
    out.push('<path d="'+cell(D.sickCol,D.sickRow,D.dot*2,1,0,0)+'" fill="var(--sick)"/>');
    out.push('<circle cx="'+sx(D.sickCol+0.5)+'" cy="'+sy(D.sickRow+0.5)+'" r="'+
             (sx(3)-sx(0))+'" fill="none" stroke="var(--sick)" stroke-width="1.4"/>');
    txt(D.cols/2,0,0,-8,"middle",12,"","10 000 человек — весь город");

    /* ---- стрелка «тест» ---- */
    out.push('<path d="M'+sx(104)+' '+sy(16)+'H'+sx(123.6)+'" stroke="var(--line)" stroke-width="1.4" fill="none"/>');
    out.push('<path d="M'+sx(126)+' '+sy(16)+'L'+sx(123)+' '+sy(14.4)+'L'+sx(123)+' '+sy(17.6)+'Z" fill="var(--line)"/>');
    txt(114,16,0,-6,"middle",11,"muted","тест");

    /* ---- панель: 101 положительный ---- */
    txt(D.panelX+D.panelCols*D.pitch/2,0,0,-20,"middle",12,"","Положительный результат");
    txt(D.panelX+D.panelCols*D.pitch/2,0,0,-8,"middle",12,"","у 101 человека");

    var dPanel="";
    for(k=1;k<=D.falsePos;k++){
      dPanel += cell(k%D.panelCols, Math.floor(k/D.panelCols), D.panelCell, D.pitch, D.panelX, D.panelY);
    }
    out.push('<path d="'+dPanel+'" fill="var(--false)"/>');
    out.push('<path d="'+cell(0,0,D.panelCell,D.pitch,D.panelX,D.panelY)+'" fill="var(--sick)"/>');
    out.push('<circle cx="'+sx(D.panelX+D.pitch/2)+'" cy="'+sy(D.panelY+D.pitch/2)+'" r="'+
             (sx(2.2)-sx(0))+'" fill="none" stroke="var(--sick)" stroke-width="1.2"/>');
    txt(D.panelX,D.panelY+D.pitch/2,-8,4,"end",11,"","1 больной");

    txt(D.panelX+D.panelCols*D.pitch/2,41,0,0,"middle",12,"","1 больной + 100 ложных");
    txt(D.panelX+D.panelCols*D.pitch/2,49,0,0,"middle",12,"","1 / (1 + 100) ≈ 0.01");
    txt(D.panelX+D.panelCols*D.pitch/2,57,0,0,"middle",11,"muted","болен 1 из 101 — около 1%");

    /* ---- легенда под сеткой ---- */
    var leg = [
      ["var(--sick)",  "1 больной — тест его нашёл (99 из 100)"],
      ["var(--false)", "≈100 ложных срабатываний — 1% из 9 999 здоровых"],
      ["var(--ok)",    "9 999 здоровых, у остальных тест верно молчит"]
    ];
    for(k=0;k<leg.length;k++){
      var ly = 108 + k*9;
      out.push('<path d="'+box(0, ly-1.1, 2, 2.2)+'" fill="'+leg[k][0]+'"/>');
      txt(3, ly, 4, 4, "start", 12, "", leg[k][1]);
    }

    document.getElementById("fig").innerHTML = out.join("");
  }catch(e){
    var f = document.getElementById("fb");
    f.hidden = false;
    f.textContent = "Схема: 10 000 человек. Больной — 1, тест его находит. "+
      "Здоровых — 9 999, тест ошибается на 1% из них, это ≈100 ложных срабатываний. "+
      "Всего положительных результатов 101, и болен среди них один: 1 / (1 + 100) ≈ 0.01, около 1%.";
    document.getElementById("fig").hidden = true;
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
