<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>20 интеграций против 5 карточек</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1b1f24; --muted:#5d6673;
    --node:#e8edf5; --nodeln:#3b6ea5; --arrow:#c0563a;
    --card:#eef7ef; --cardln:#2f7d4f; --rule:#c9d1db;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --ink:#e6ebf1; --muted:#9aa6b4;
      --node:#1e2833; --nodeln:#79aede; --arrow:#e88f6f;
      --card:#1b2a20; --cardln:#7ec79a; --rule:#2c3540;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:400 15px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:940px;margin:0 auto;padding:6px 8px 10px}
  .title{font-weight:600;font-size:16px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 4px}
  svg{display:block;width:100%;height:auto}
  .fb{color:var(--muted);font-size:14px}
  text{fill:var(--ink);font-family:inherit}
  .lbl{font-size:13px;fill:var(--muted)}
  .cap{font-size:15px;font-weight:600}
  .cap2{font-size:13px;fill:var(--muted)}
  .leg{font-size:12.5px;fill:var(--muted)}
  .nd{fill:var(--node);stroke:var(--nodeln);stroke-width:2}
  .ar{fill:none;stroke:var(--arrow);stroke-width:1.4;opacity:.75}
  .ah{fill:var(--arrow);opacity:.85}
  .cd{fill:var(--card);stroke:var(--cardln);stroke-width:1.6}
  .cl{stroke:var(--cardln);stroke-width:1.4;opacity:.8}
  .vr{stroke:var(--rule);stroke-width:1.4;stroke-dasharray:5 6}
</style>
<div class="wrap">
  <p class="title">5 агентов: 20 переходников против 5 карточек</p>
  <p class="sub">Слева — пара за парой. Справа — карточка на агента.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    var D = {
      agents:["поддержка","писатель","ресёрчер","переводчик","планировщик"],
      left:{cx:8,cy:7,r:5.6},
      right:{cx:30,cy:7,r:5.6},
      node:1.1, gap:0.35, bend:0.9, head:0.55,
      cardR:3.0, cardW:2.4, cardH:1.5,
      ruleX:19, ruleY0:1.0, ruleY1:12.9,
      capY:14.3, capY2:15.7, legY:17.2,
      origin:{x:96,y:40}, scale:20
    };
    var VB={w:940,h:400}, PAD=12, BASE=5, LW=1.4;

    function sx(x){ return D.origin.x + x*D.scale; }
    function sy(y){ return D.origin.y + y*D.scale; }

    function ring(c){
      var out=[], n=D.agents.length, i, a;
      for(i=0;i<n;i++){
        a = (-90 + i*360/n) * Math.PI/180;
        out.push({x:c.cx + c.r*Math.cos(a), y:c.cy + c.r*Math.sin(a),
                  ux:Math.cos(a), uy:Math.sin(a)});
      }
      return out;
    }
    var L = ring(D.left), R = ring(D.right);

    var s = [];
    function el(t,at,inner){
      var k, o = "<"+t;
      for(k in at) o += " "+k+'="'+at[k]+'"';
      return inner===undefined ? o+"/>" : o+">"+inner+"</"+t+">";
    }
    function line(p,q,cls){
      return el("line",{x1:sx(p.x),y1:sy(p.y),x2:sx(q.x),y2:sy(q.y),"class":cls});
    }
    function label(p,ux,uy,txt){
      var mid = Math.abs(ux) < 0.3;
      var an = mid ? "middle" : (ux>0 ? "start" : "end");
      var dx = mid ? 0 : (ux>0 ? PAD : -PAD);
      var dy = mid ? (uy>0 ? PAD+BASE : -PAD) : BASE;
      return el("text",{x:sx(p.x)+dx,y:sy(p.y)+dy,"text-anchor":an,"class":"lbl"},txt);
    }

    /* левая половина: 20 направленных стрелок, по две на пару */
    var i,j,dirs,p,q,ux,uy,len,st,en,mx,my,cx,cy,tx,ty,hx,hy,px,py,hw;
    for(i=0;i<L.length;i++) for(j=0;j<L.length;j++){
      if(i===j) continue;
      p=L[i]; q=L[j];
      ux=q.x-p.x; uy=q.y-p.y; len=Math.sqrt(ux*ux+uy*uy); ux/=len; uy/=len;
      st={x:p.x+ux*(D.node+D.gap), y:p.y+uy*(D.node+D.gap)};
      en={x:q.x-ux*(D.node+D.gap+D.head), y:q.y-uy*(D.node+D.gap+D.head)};
      mx=(st.x+en.x)/2; my=(st.y+en.y)/2;
      cx=mx-uy*D.bend; cy=my+ux*D.bend;
      s.push(el("path",{d:"M"+sx(st.x)+" "+sy(st.y)+" Q"+sx(cx)+" "+sy(cy)+" "+sx(en.x)+" "+sy(en.y),"class":"ar"}));
      tx=en.x-cx; ty=en.y-cy; len=Math.sqrt(tx*tx+ty*ty); tx/=len; ty/=len;
      hx=en.x+tx*D.head; hy=en.y+ty*D.head; hw=D.head*0.45;
      px=-ty*hw; py=tx*hw;
      s.push(el("polygon",{points:[sx(hx)+","+sy(hy),
        (sx(en.x+px))+","+(sy(en.y+py)), (sx(en.x-px))+","+(sy(en.y-py))].join(" "),"class":"ah"}));
    }
    for(i=0;i<L.length;i++){
      s.push(el("circle",{cx:sx(L[i].x),cy:sy(L[i].y),
        r:sx(L[i].x+D.node)-sx(L[i].x),"class":"nd"}));
      s.push(label(L[i],L[i].ux,L[i].uy,D.agents[i]));
    }

    /* разделитель */
    s.push(line({x:D.ruleX,y:D.ruleY0},{x:D.ruleX,y:D.ruleY1},"vr"));

    /* правая половина: карточки, попарных стрелок ноль */
    for(i=0;i<R.length;i++){
      var c={x:D.right.cx+R[i].ux*D.cardR, y:D.right.cy+R[i].uy*D.cardR};
      var x0=sx(c.x-D.cardW/2), x1=sx(c.x+D.cardW/2);
      var y0=sy(c.y-D.cardH/2), y1=sy(c.y+D.cardH/2);
      s.push(el("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:3,"class":"cd"}));
      s.push(line({x:c.x-D.cardW*0.32,y:c.y-D.cardH*0.18},
                  {x:c.x+D.cardW*0.32,y:c.y-D.cardH*0.18},"cl"));
      s.push(line({x:c.x-D.cardW*0.32,y:c.y+D.cardH*0.18},
                  {x:c.x+D.cardW*0.10,y:c.y+D.cardH*0.18},"cl"));
      s.push(el("circle",{cx:sx(R[i].x),cy:sy(R[i].y),
        r:sx(R[i].x+D.node)-sx(R[i].x),"class":"nd"}));
      s.push(label(R[i],R[i].ux,R[i].uy,D.agents[i]));
    }

    /* подписи половин */
    s.push(el("text",{x:sx(D.left.cx),y:sy(D.capY),"text-anchor":"middle","class":"cap"},
      "5 × 4 = 20 переходников"));
    s.push(el("text",{x:sx(D.left.cx),y:sy(D.capY2),"text-anchor":"middle","class":"cap2"},
      "рост N(N−1): шестой агент добавит 10"));
    s.push(el("text",{x:sx(D.right.cx),y:sy(D.capY),"text-anchor":"middle","class":"cap"},
      "5 карточек, 0 стрелок"));
    s.push(el("text",{x:sx(D.right.cx),y:sy(D.capY2),"text-anchor":"middle","class":"cap2"},
      "рост +1: шестой приходит со своей"));
    s.push(el("text",{x:sx((D.left.cx+D.right.cx)/2),y:sy(D.legY),"text-anchor":"middle","class":"leg"},
      "▭ у агента — Agent Card: что умеет, куда стучаться, что принимает на вход."));

    host.innerHTML = el("svg",{
      viewBox:"0 0 "+VB.w+" "+VB.h, width:VB.w, height:VB.h,
      preserveAspectRatio:"xMidYMid meet",
      xmlns:"http://www.w3.org/2000/svg",
      role:"img","aria-label":"Слева пять агентов и двадцать стрелок каждый-к-каждому, справа те же пять агентов с карточкой у каждого и без стрелок","stroke-width":LW
    }, s.join(""));
  }catch(e){
    host.innerHTML = '<p class="fb">Схема должна показывать: слева 5 агентов, соединённых 20 стрелками каждый-к-каждому (5 × 4 самописных переходника, рост N(N−1)); справа те же 5 агентов, у каждого своя Agent Card и ни одной попарной стрелки — 5 карточек, рост +1 на агента.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
