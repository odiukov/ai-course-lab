<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Строка против столбца</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1d21; --muted:#5c636e; --grid:#cfd4dc;
    --hi:#fdf1d6; --col:#7a8ba6; --row:#2f8f6b; --dash:#b23a48;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e9ecf1; --muted:#9aa3b0; --grid:#3b414a;
      --hi:#2b2617; --col:#7d94ba; --row:#4cbf94; --dash:#e0707d;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{background:var(--bg);padding:10px 12px 14px}
  h3{margin:0 0 6px;font-size:16px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .lbl{fill:var(--fg);font-size:13px}
  .mut{fill:var(--muted);font-size:12.5px}
  .hd{fill:var(--muted);font-size:12.5px;font-weight:600}
  .num{fill:var(--fg);font-size:13px;font-weight:600}
  .grid{stroke:var(--grid);stroke-width:1;fill:none}
  .mark{fill:var(--col);font-size:13px}
  .cap{fill:var(--muted);font-size:12.5px}
  .err{color:var(--fg);font-size:14px;line-height:1.5}
</style>
<div class="wrap">
  <h3>Таблица «атака × слой»: строка — про инцидент, столбец — про стройку</h3>
  <div id="host"></div>
</div>
<script>
(function(){
try{
  var DATA = {
    attacks:[
      {n:"Прямая инъекция",  inp:true,  out:false},
      {n:"Непрямая инъекция",inp:true,  out:false},
      {n:"Джейлбрейк",       inp:false, out:true, hi:true},
      {n:"Извлечение данных",inp:true,  out:false},
      {n:"Сбор PII",         inp:false, out:true}
    ],
    bars:[
      {y:7,    v:70, name:"столбец «вход»",       note:"ловит 70%",    row:false},
      {y:8.5,  v:90, name:"столбец «выход»",      note:"ловит 90%",    row:false},
      {y:10,   v:97, name:"строка: вход + выход", note:"3% пропусков", row:true}
    ]
  };

  var O = {x:330.4, y:40}, S = {x:4.4, y:30};
  function sx(x){ return O.x + x*S.x; }
  function sy(y){ return O.y + y*S.y; }

  var NS="http://www.w3.org/2000/svg";
  function el(t,a,txt){
    var e=document.createElementNS(NS,t);
    for(var k in a) e.setAttribute(k,a[k]);
    if(txt!=null) e.appendChild(document.createTextNode(txt));
    svg.appendChild(e); return e;
  }
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 960 420");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Таблица атак и слоёв: столбцы ловят 70% и 90%, строка целиком оставляет 3% пропусков");

  // ---- геометрия таблицы в единицах домена ----
  var L=-66, CIN=-28, COUT=-15, R=-2, MIN=-21.5, MOUT=-8.5;

  // подсветка строки «Джейлбрейк»
  DATA.attacks.forEach(function(a,i){
    if(!a.hi) return;
    var y=i+1;
    el("rect",{x:sx(L-1), y:sy(y-0.45), width:sx(R+1)-sx(L-1),
      height:sy(y+0.45)-sy(y-0.45), fill:"var(--hi)"});
  });

  // шапка таблицы
  el("text",{x:sx(L), y:sy(0), "text-anchor":"start",
    "dominant-baseline":"middle", "class":"hd"},"атака");
  el("text",{x:sx(MIN), y:sy(0), "text-anchor":"middle",
    "dominant-baseline":"middle", "class":"hd"},"вход");
  el("text",{x:sx(MOUT), y:sy(0), "text-anchor":"middle",
    "dominant-baseline":"middle", "class":"hd"},"выход");
  el("line",{x1:sx(L), y1:sy(0.5), x2:sx(R), y2:sy(0.5), "class":"grid"});

  // вертикальные разделители столбцов
  [CIN,COUT].forEach(function(cx){
    el("line",{x1:sx(cx), y1:sy(-0.4), x2:sx(cx), y2:sy(5.5), "class":"grid"});
  });

  // строки таблицы
  DATA.attacks.forEach(function(a,i){
    var y=i+1;
    el("text",{x:sx(L), y:sy(y), "text-anchor":"start",
      "dominant-baseline":"middle", "class":"lbl"}, a.n);
    if(a.inp) el("text",{x:sx(MIN), y:sy(y), "text-anchor":"middle",
      "dominant-baseline":"middle", "class":"mark"},"●");
    if(a.out) el("text",{x:sx(MOUT), y:sy(y), "text-anchor":"middle",
      "dominant-baseline":"middle", "class":"mark"},"●");
    el("line",{x1:sx(L), y1:sy(y+0.5), x2:sx(R), y2:sy(y+0.5), "class":"grid"});
  });

  el("text",{x:sx(L), y:sy(6.1), "text-anchor":"start",
    "dominant-baseline":"middle", "class":"cap"},"● — главная защита этой атаки");
  el("text",{x:sx(0), y:sy(6.1), "text-anchor":"start",
    "dominant-baseline":"middle", "class":"cap"},"Джейлбрейк: сколько ловит каждый слой");

  // ---- линия 100% ----
  el("line",{x1:sx(100), y1:sy(6.5), x2:sx(100), y2:sy(10.7),
    stroke:"var(--dash)", "stroke-width":1.5, "stroke-dasharray":"5 4"});
  el("text",{x:sx(100), y:sy(6.5), dy:-6, "text-anchor":"middle",
    "class":"mut", fill:"var(--dash)"},"100%");

  // ---- полосы ----
  DATA.bars.forEach(function(b){
    el("line",{x1:sx(0), y1:sy(b.y-0.55), x2:sx(0), y2:sy(b.y+0.55), "class":"grid"});
    el("rect",{x:sx(0), y:sy(b.y-0.34), width:sx(b.v)-sx(0),
      height:sy(b.y+0.34)-sy(b.y-0.34), rx:3,
      fill:b.row?"var(--row)":"var(--col)"});
    el("text",{x:sx(R), y:sy(b.y), dx:-6, "text-anchor":"end",
      "dominant-baseline":"middle", "class":"lbl"}, b.name);
    el("text",{x:sx(100), y:sy(b.y), dx:12, "text-anchor":"start",
      "dominant-baseline":"middle", "class":"num",
      fill:b.row?"var(--row)":"var(--fg)"}, b.note);
  });

  el("text",{x:sx(L), y:sy(11.2), "text-anchor":"start",
    "dominant-baseline":"middle", "class":"cap"},
    "Столбец — один слой против всех атак: сколько ни бери, до края не достаёт.");
  el("text",{x:sx(L), y:sy(11.9), "text-anchor":"start",
    "dominant-baseline":"middle", "class":"cap"},
    "Строка — весь сюжет атаки целиком: два слоя подряд оставляют 3% пропусков.");

  document.getElementById("host").appendChild(svg);
}catch(e){
  document.getElementById("host").innerHTML =
    '<div class="err">Схема (не отрисовалась): таблица «атака × слой». ' +
    'Пять атак — строки, слои защиты — столбцы. Для джейлбрейка: столбец ' +
    '«вход» ловит 70%, столбец «выход» — 90%, ни один столбец не даёт 100%. ' +
    'Строка целиком, вход плюс выход, оставляет 3% пропусков.</div>';
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
