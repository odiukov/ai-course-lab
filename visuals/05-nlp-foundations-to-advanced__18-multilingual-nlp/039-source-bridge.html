<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнение двух мостов к целевому языку</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ivory;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --border: lightsteelblue;
      --ru: darkorange;
      --ru-soft: papayawhip;
      --en: royalblue;
      --en-soft: aliceblue;
      --ua: seagreen;
      --ua-soft: honeydew;
      --note: lemonchiffon;
      --track: gainsboro;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: black;
        --ink: white;
        --muted: silver;
        --border: slategray;
        --ru: orange;
        --ru-soft: saddlebrown;
        --en: cornflowerblue;
        --en-soft: darkslateblue;
        --ua: mediumaquamarine;
        --ua-soft: darkslategray;
        --note: darkslategray;
        --track: dimgray;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: unset;
      background: var(--page);
    }

    header {
      text-align: center;
    }

    h1 {
      margin: unset;
      font-size: 24px;
      line-height: normal;
    }

    header p {
      margin: unset;
      color: var(--muted);
      font-size: 15px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--page);
    }

    #fallback {
      margin: unset;
      color: var(--ink);
      background: var(--note);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="page-title">
    <header>
      <h1 id="page-title">Сравнение двух мостов к целевому языку</h1>
      <p>Два кандидатных маршрута переноса — победитель определяется проверкой</p>
    </header>

    <p id="fallback">
      Схема показывает два моста к украинскому: от русского — через общие
      падежи, богатую морфологию и свободный порядок слов; от английского —
      через больший корпус.
    </p>

    <svg
      id="diagram"
      width="1200"
      height="430"
      viewBox="0 0 1200 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
      hidden>
      <title id="svg-title">Два моста к украинскому языку</title>
      <desc id="svg-desc">
        Русский и английский показаны как два возможных исходных языка.
        Русский разделяет с украинским падежи, богатую морфологию и свободный
        порядок слов, а преимущество английского — больший корпус.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    const DATA = Object.freeze({
      namespace: "http://www.w3.org/2000/svg",
      styles: {
        ink: "var(--ink)",
        muted: "var(--muted)",
        border: "var(--border)",
        panel: "var(--panel)",
        russian: "var(--ru)",
        russianSoft: "var(--ru-soft)",
        english: "var(--en)",
        englishSoft: "var(--en-soft)",
        ukrainian: "var(--ua)",
        ukrainianSoft: "var(--ua-soft)",
        note: "var(--note)",
        track: "var(--track)"
      },
      type: {
        title: 25,
        language: 29,
        body: 17,
        small: 14,
        route: 17,
        foot: 15
      },
      line: {
        border: 2,
        accent: 6,
        russianBridge: 18,
        englishBridge: 30,
        bridgeCore: 3,
        connector: 2,
        bullet: 5
      },
      dash: {
        length: 12,
        space: 10
      },
      radius: {
        card: 18,
        label: 13,
        bullet: 5
      },
      cards: [
        {
          x: 48,
          y: 48,
          w: 270,
          h: 168,
          fill: "russianSoft",
          accent: "russian",
          eyebrow: { x: 76, y: 76, text: "ИСХОДНЫЙ ЯЗЫК" },
          title: { x: 76, y: 105, text: "Русский" },
          facts: [
            { cx: 77, cy: 132, tx: 95, ty: 132, text: "Общие падежи" },
            { cx: 77, cy: 161, tx: 95, ty: 161, text: "Богатая морфология" },
            { cx: 77, cy: 190, tx: 95, ty: 190, text: "Свободный порядок слов" }
          ]
        },
        {
          x: 48,
          y: 268,
          w: 270,
          h: 116,
          fill: "englishSoft",
          accent: "english",
          eyebrow: { x: 76, y: 296, text: "ИСХОДНЫЙ ЯЗЫК" },
          title: { x: 76, y: 325, text: "Английский" },
          facts: [
            { cx: 77, cy: 355, tx: 95, ty: 355, text: "Больший корпус" }
          ]
        },
        {
          x: 900,
          y: 126,
          w: 252,
          h: 182,
          fill: "ukrainianSoft",
          accent: "ukrainian",
          eyebrow: { x: 932, y: 158, text: "ЦЕЛЕВОЙ ЯЗЫК" },
          title: { x: 932, y: 202, text: "Украинский" },
          facts: [
            { cx: 933, cy: 240, tx: 951, ty: 240, text: "Оба маршрута" },
            { cx: 933, cy: 269, tx: 951, ty: 269, text: "проверяются на одной" },
            { cx: 933, cy: 292, tx: 951, ty: 292, text: "целевой выборке" }
          ]
        }
      ],
      bridges: [
        {
          color: "russian",
          width: "russianBridge",
          path: {
            start: { x: 318, y: 137 },
            first: { x: 500, y: 137 },
            second: { x: 704, y: 168 },
            end: { x: 900, y: 190 }
          },
          arrow: [
            { x: 900, y: 190 },
            { x: 872, y: 174 },
            { x: 872, y: 204 }
          ],
          label: {
            x: 372,
            y: 53,
            w: 348,
            h: 66,
            fill: "russianSoft",
            accent: "russian",
            first: { x: 392, y: 78, text: "Маршрут по близости" },
            second: { x: 392, y: 103, text: "Грамматика совпадает лучше" }
          }
        },
        {
          color: "english",
          width: "englishBridge",
          path: {
            start: { x: 318, y: 329 },
            first: { x: 515, y: 329 },
            second: { x: 704, y: 264 },
            end: { x: 900, y: 240 }
          },
          arrow: [
            { x: 900, y: 240 },
            { x: 866, y: 219 },
            { x: 866, y: 261 }
          ],
          label: {
            x: 372,
            y: 326,
            w: 328,
            h: 62,
            fill: "englishSoft",
            accent: "english",
            first: { x: 392, y: 350, text: "Маршрут по масштабу" },
            second: { x: 392, y: 374, text: "Исходных текстов больше" }
          }
        }
      ],
      comparison: {
        x: 754,
        y: 365,
        w: 398,
        h: 46,
        text: { x: 953, y: 388, value: "Сравнить в одинаковых условиях" }
      },
      legend: {
        x: 48,
        y: 415,
        text: "Ширина моста показывает объём исходных данных"
      }
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const NS = DATA.namespace;

      const make = (name, attributes) => {
        const element = document.createElementNS(NS, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }
        return element;
      };

      const addText = (parent, item, options) => {
        const text = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          fill: options.fill,
          "font-size": options.size,
          "font-weight": options.weight,
          "text-anchor": options.anchor,
          "dominant-baseline": "middle"
        });
        text.textContent = item.text;
        parent.appendChild(text);
      };

      const curve = item =>
        "M " + sx(item.start.x) + " " + sy(item.start.y) +
        " C " + sx(item.first.x) + " " + sy(item.first.y) +
        " " + sx(item.second.x) + " " + sy(item.second.y) +
        " " + sx(item.end.x) + " " + sy(item.end.y);

      const polygonPoints = points =>
        points.map(point => sx(point.x) + "," + sy(point.y)).join(" ");

      for (const bridge of DATA.bridges) {
        const color = DATA.styles[bridge.color];

        drawing.appendChild(make("path", {
          d: curve(bridge.path),
          fill: "none",
          stroke: DATA.styles.track,
          "stroke-width": DATA.line[bridge.width],
          "stroke-linecap": "round"
        }));

        drawing.appendChild(make("path", {
          d: curve(bridge.path),
          fill: "none",
          stroke: color,
          "stroke-width": DATA.line.bridgeCore,
          "stroke-dasharray":
            sx(DATA.dash.length) + " " + sx(DATA.dash.space),
          "stroke-linecap": "round"
        }));

        drawing.appendChild(make("polygon", {
          points: polygonPoints(bridge.arrow),
          fill: color,
          stroke: DATA.styles.panel,
          "stroke-width": DATA.line.border,
          "stroke-linejoin": "round"
        }));
      }

      for (const card of DATA.cards) {
        const group = make("g", {});
        const accent = DATA.styles[card.accent];

        group.appendChild(make("rect", {
          x: sx(card.x),
          y: sy(card.y),
          width: sx(card.w),
          height: sy(card.h),
          rx: sx(DATA.radius.card),
          ry: sy(DATA.radius.card),
          fill: DATA.styles[card.fill],
          stroke: DATA.styles.border,
          "stroke-width": DATA.line.border
        }));

        group.appendChild(make("line", {
          x1: sx(card.x),
          y1: sy(card.y),
          x2: sx(card.x),
          y2: sy(card.y + card.h),
          stroke: accent,
          "stroke-width": DATA.line.accent,
          "stroke-linecap": "round"
        }));

        addText(group, card.eyebrow, {
          fill: accent,
          size: DATA.type.small,
          weight: "bold",
          anchor: "start"
        });

        addText(group, card.title, {
          fill: DATA.styles.ink,
          size: DATA.type.language,
          weight: "bold",
          anchor: "start"
        });

        for (const fact of card.facts) {
          group.appendChild(make("circle", {
            cx: sx(fact.cx),
            cy: sy(fact.cy),
            r: sx(DATA.radius.bullet),
            fill: accent
          }));

          addText(group, fact, {
            fill: DATA.styles.ink,
            size: DATA.type.body,
            weight: "normal",
            anchor: "start"
          });
        }

        drawing.appendChild(group);
      }

      for (const bridge of DATA.bridges) {
        const label = bridge.label;
        const group = make("g", {});

        group.appendChild(make("rect", {
          x: sx(label.x),
          y: sy(label.y),
          width: sx(label.w),
          height: sy(label.h),
          rx: sx(DATA.radius.label),
          ry: sy(DATA.radius.label),
          fill: DATA.styles[label.fill],
          stroke: DATA.styles[label.accent],
          "stroke-width": DATA.line.border
        }));

        addText(group, label.first, {
          fill: DATA.styles.ink,
          size: DATA.type.route,
          weight: "bold",
          anchor: "start"
        });

        addText(group, label.second, {
          fill: DATA.styles.muted,
          size: DATA.type.small,
          weight: "normal",
          anchor: "start"
        });

        drawing.appendChild(group);
      }

      drawing.appendChild(make("rect", {
        x: sx(DATA.comparison.x),
        y: sy(DATA.comparison.y),
        width: sx(DATA.comparison.w),
        height: sy(DATA.comparison.h),
        rx: sx(DATA.radius.label),
        ry: sy(DATA.radius.label),
        fill: DATA.styles.note,
        stroke: DATA.styles.ukrainian,
        "stroke-width": DATA.line.border
      }));

      addText(drawing, {
        x: DATA.comparison.text.x,
        y: DATA.comparison.text.y,
        text: DATA.comparison.text.value
      }, {
        fill: DATA.styles.ink,
        size: DATA.type.foot,
        weight: "bold",
        anchor: "middle"
      });

      addText(drawing, {
        x: DATA.legend.x,
        y: DATA.legend.y,
        text: DATA.legend.text
      }, {
        fill: DATA.styles.muted,
        size: DATA.type.foot,
        weight: "normal",
        anchor: "start"
      });

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
      document.getElementById("fallback").textContent =
        "Схема должна была показать два моста к украинскому: русский даёт общие падежи, богатую морфологию и свободный порядок слов, а английский — больший корпус.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
