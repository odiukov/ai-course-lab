<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переводы в общем пространстве предложений</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f7fb;
      --panel: #ffffff;
      --panel-edge: #d8deea;
      --ink: #172033;
      --muted: #657087;
      --axis: #8792a8;
      --guide: #aab3c5;
      --cluster: #e9f2ff;
      --cluster-edge: #4f83cc;
      --cat: #2367b1;
      --cat-core: #ffffff;
      --dog-halo: #fff0df;
      --dog-edge: #d27a2c;
      --dog: #b95e16;
      --dog-core: #ffffff;
      --arrow: #a35a27;
      --note: #f2f5fa;
      --error: #9f2f2f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #181e29;
        --panel-edge: #374155;
        --ink: #eef3fb;
        --muted: #aeb8ca;
        --axis: #7f8ba2;
        --guide: #6d7890;
        --cluster: #182d48;
        --cluster-edge: #79a9e7;
        --cat: #75acec;
        --cat-core: #111824;
        --dog-halo: #412b1c;
        --dog-edge: #e6a05c;
        --dog: #e7944c;
        --dog-core: #1d1713;
        --arrow: #dc9558;
        --note: #202735;
        --error: #ffaaaa;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--panel-edge);
      padding: 14px 18px 12px;
    }

    h1 {
      margin: unset;
      padding: 2px 4px 10px;
      font-size: 20px;
      font-weight: bold;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 410px;
      background: var(--panel);
      font-family: inherit;
      text-rendering: geometricPrecision;
    }

    .plot-panel {
      fill: var(--panel);
      stroke: var(--panel-edge);
      stroke-width: 1px;
    }

    .axis,
    .axis-head {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .cluster-halo {
      fill: var(--cluster);
      stroke: var(--cluster-edge);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .dog-halo {
      fill: var(--dog-halo);
      stroke: var(--dog-edge);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.5px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .comparison {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2.5px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .comparison-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 1px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .cat-dot {
      fill: var(--cat);
      stroke: var(--cat-core);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .dog-dot {
      fill: var(--dog);
      stroke: var(--dog-core);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .sentence {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .language {
      fill: var(--muted);
      font-size: 13px;
    }

    .similarity {
      fill: var(--cat);
      font-size: 15px;
      font-weight: bold;
    }

    .difference {
      fill: var(--arrow);
      font-size: 15px;
      font-weight: bold;
    }

    .meaning {
      fill: var(--ink);
      font-size: 14px;
    }

    .footer-note {
      fill: var(--muted);
      font-size: 13px;
    }

    #fallback {
      padding: 18px;
      color: var(--error);
      font-size: 16px;
      background: var(--note);
      border: 1px solid var(--panel-edge);
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1>Переводы в общем пространстве предложений</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 410"
      width="960"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Карта эмбеддингов предложений</title>
      <desc id="svg-desc">
        Четыре перевода фразы о спящей кошке расположены тесно, а английская
        фраза о лающей собаке находится заметно дальше.
      </desc>
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать тесный кластер переводов фразы о спящей
      кошке с cosine 0.85–0.95 и отдельную точку фразы о лающей собаке с
      cosine около 0.3.
    </div>
  </main>

  <script>
    const data = [
      {
        kind: "bounds",
        left: 0,
        right: 8.88,
        bottom: -0.62,
        top: 4.75
      },
      {
        kind: "x-axis",
        from: { x: 0, y: 0 },
        to: { x: 8.42, y: 0 },
        head: [
          { x: 8.42, y: 0 },
          { x: 8.18, y: 0.12 },
          { x: 8.18, y: -0.12 }
        ],
        label: {
          x: 8.42,
          y: -0.25,
          anchor: "end",
          text: "условная координата"
        }
      },
      {
        kind: "y-axis",
        from: { x: 0, y: 0 },
        to: { x: 0, y: 4.38 },
        head: [
          { x: 0, y: 4.38 },
          { x: -0.12, y: 4.14 },
          { x: 0.12, y: 4.14 }
        ],
        label: {
          x: 0.16,
          y: 4.48,
          anchor: "start",
          text: "условная координата"
        }
      },
      {
        kind: "cluster",
        center: { x: 2.83, y: 2.72 },
        radius: { x: 1.48, y: 1.28 },
        label: {
          x: 2.83,
          y: 4.35,
          anchor: "middle",
          text: "переводы · cosine 0.85–0.95"
        },
        meaning: {
          x: 2.83,
          y: 4.08,
          anchor: "middle",
          text: "один смысл: спящая кошка"
        }
      },
      {
        kind: "dog-halo",
        center: { x: 6.78, y: 1.74 },
        radius: { x: 0.52, y: 0.66 }
      },
      {
        kind: "point",
        group: "cat",
        point: { x: 2.60, y: 2.84 },
        radius: { x: 0.07, y: 0.10 },
        leader: { x: 2.05, y: 3.48 },
        title: {
          x: 1.92,
          y: 3.79,
          anchor: "end",
          text: "The cat is sleeping"
        },
        language: {
          x: 1.92,
          y: 3.55,
          anchor: "end",
          text: "английский"
        }
      },
      {
        kind: "point",
        group: "cat",
        point: { x: 3.05, y: 3.13 },
        radius: { x: 0.07, y: 0.10 },
        leader: { x: 3.62, y: 3.54 },
        title: {
          x: 3.75,
          y: 3.84,
          anchor: "start",
          text: "Le chat dort"
        },
        language: {
          x: 3.75,
          y: 3.60,
          anchor: "start",
          text: "французский"
        }
      },
      {
        kind: "point",
        group: "cat",
        point: { x: 2.52, y: 2.35 },
        radius: { x: 0.07, y: 0.10 },
        leader: { x: 2.04, y: 1.91 },
        title: {
          x: 1.92,
          y: 1.66,
          anchor: "end",
          text: "El gato está durmiendo"
        },
        language: {
          x: 1.92,
          y: 1.42,
          anchor: "end",
          text: "испанский"
        }
      },
      {
        kind: "point",
        group: "cat",
        point: { x: 3.15, y: 2.50 },
        radius: { x: 0.07, y: 0.10 },
        leader: { x: 3.66, y: 2.02 },
        title: {
          x: 3.79,
          y: 1.77,
          anchor: "start",
          text: "Die Katze schläft"
        },
        language: {
          x: 3.79,
          y: 1.53,
          anchor: "start",
          text: "немецкий"
        }
      },
      {
        kind: "point",
        group: "dog",
        point: { x: 6.78, y: 1.74 },
        radius: { x: 0.08, y: 0.11 },
        leader: { x: 6.78, y: 1.16 },
        title: {
          x: 6.78,
          y: 0.88,
          anchor: "middle",
          text: "The dog is barking"
        },
        language: {
          x: 6.78,
          y: 0.64,
          anchor: "middle",
          text: "английский, но другой смысл"
        }
      },
      {
        kind: "comparison",
        curve: [
          { x: 4.18, y: 2.73 },
          { x: 4.82, y: 3.04 },
          { x: 5.57, y: 2.35 },
          { x: 6.17, y: 1.93 }
        ],
        head: [
          { x: 6.17, y: 1.93 },
          { x: 5.96, y: 2.14 },
          { x: 5.91, y: 1.84 }
        ],
        label: {
          x: 4.86,
          y: 3.22,
          anchor: "middle",
          text: "другой смысл · cosine ≈ 0.3"
        }
      },
      {
        kind: "footer",
        label: {
          x: 4.44,
          y: -0.47,
          anchor: "middle",
          text: "Важно соседство точек; направления осей сами по себе ничего не означают"
        }
      }
    ];

    const origin = { x: 64, y: 356 };
    const scale = { x: 100, y: 72 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";
      const pick = kind => data.find(item => item.kind === kind);

      const make = (name, attributes, className) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const append = element => {
        svg.appendChild(element);
        return element;
      };

      const segment = (from, to, className) => append(make("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y)
      }, className));

      const polygon = (points, className) => append(make("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
      }, className));

      const ellipse = (center, radius, className) => append(make("ellipse", {
        cx: sx(center.x),
        cy: sy(center.y),
        rx: Math.abs(sx(center.x + radius.x) - sx(center.x)),
        ry: Math.abs(sy(center.y + radius.y) - sy(center.y))
      }, className));

      const label = (item, className) => {
        const element = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor,
          "dominant-baseline": "middle"
        }, className);
        element.textContent = item.text;
        return append(element);
      };

      const bounds = pick("bounds");
      append(make("rect", {
        x: sx(bounds.left),
        y: sy(bounds.top),
        width: Math.abs(sx(bounds.right) - sx(bounds.left)),
        height: Math.abs(sy(bounds.bottom) - sy(bounds.top))
      }, "plot-panel"));

      ["x-axis", "y-axis"].forEach(kind => {
        const axis = pick(kind);
        segment(axis.from, axis.to, "axis");
        polygon(axis.head, "axis-head");
        label(axis.label, "axis-label");
      });

      const cluster = pick("cluster");
      ellipse(cluster.center, cluster.radius, "cluster-halo");

      const dogHalo = pick("dog-halo");
      ellipse(dogHalo.center, dogHalo.radius, "dog-halo");

      const comparison = pick("comparison");
      const [start, controlA, controlB, end] = comparison.curve;
      append(make("path", {
        d: [
          `M ${sx(start.x)} ${sy(start.y)}`,
          `C ${sx(controlA.x)} ${sy(controlA.y)}`,
          `${sx(controlB.x)} ${sy(controlB.y)}`,
          `${sx(end.x)} ${sy(end.y)}`
        ].join(" ")
      }, "comparison"));
      polygon(comparison.head, "comparison-head");
      label(comparison.label, "difference");

      data.filter(item => item.kind === "point").forEach(item => {
        segment(item.point, item.leader, "leader");
      });

      data.filter(item => item.kind === "point").forEach(item => {
        ellipse(
          item.point,
          item.radius,
          item.group === "cat" ? "cat-dot" : "dog-dot"
        );
      });

      data.filter(item => item.kind === "point").forEach(item => {
        label(item.title, "sentence");
        label(item.language, "language");
      });

      label(cluster.label, "similarity");
      label(cluster.meaning, "meaning");
      label(pick("footer").label, "footer-note");

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
