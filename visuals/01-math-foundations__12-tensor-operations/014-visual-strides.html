<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Одна полка, два способа читать</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1f2b; --muted:#5b6472;
    --cell:#eef2fa; --cellline:#8fa4c4;
    --row:#1f6feb; --col:#c2410c; --tape:#f6f7f9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --fg:#e8ecf3; --muted:#9aa5b5;
      --cell:#1e2634; --cellline:#4c5f7d;
      --row:#6ea8ff; --col:#ff9b5c; --tape:#191d25;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
<div class="wrap">
  <h2>Одна полка, два способа читать</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var TAPE = ['a','b','c','d','e','f'];
    var TABLE = [['a','b','c'],['d','e','f']];
    var ROWMAJOR = { order:['a','b','c','d','e','f'], strides:'(3, 1)' };
    var COLMAJOR = { order:['a','d','b','e','c','f'], strides:'(1, 2)' };

    var W = 760, H = 430;                 // холст
    var ORIGIN = {x:70, y:26};            // пиксель точки (0,0) модели
    var SCALE  = 46;                      // пикселей на единицу модели
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y + y*SCALE; }

    var PAD = 6, LW = 1.4, FS = 13, FSM = 11.5;

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
        'font-size':size||FS,'font-family':'inherit',fill:'currentColor'});
      if(cls) t.setAttribute('class',cls); t.textContent=s; return t; }

    var svg = el('svg',{viewBox:'0 0 '+W+' '+H,
      preserveAspectRatio:'xMidYMid meet', role:'img',
      'aria-label':'Таблица 2 на 3 и та же память, читаемая по строкам и по столбцам'});
    var defs = el('defs',{});
    ['row','col'].forEach(function(k){
      var m=el('marker',{id:'ar-'+k,viewBox:'0 0 10 10',refX:'9',refY:'5',
        markerWidth:'6',markerHeight:'6',orient:'auto-start-reverse'});
      m.appendChild(el('path',{d:'M0,0 L10,5 L0,10 z',fill:'var(--'+k+')'}));
      defs.appendChild(m);
    });
    svg.appendChild(defs);

    // ---- таблица 2x3: ячейка (col,row) занимает единичный квадрат модели ----
    var gT = el('g',{});
    for(var r=0;r<TABLE.length;r++){
      for(var c=0;c<TABLE[r].length;c++){
        gT.appendChild(el('rect',{x:sx(c),y:sy(r),
          width:sx(c+1)-sx(c), height:sy(r+1)-sy(r),
          fill:'var(--cell)', stroke:'var(--cellline)','stroke-width':LW}));
        gT.appendChild(txt((sx(c)+sx(c+1))/2,(sy(r)+sy(r+1))/2+5,TABLE[r][c],'middle'));
      }
    }
    // подписи осей таблицы: слева (end) и сверху (middle)
    gT.appendChild(txt(sx(0)-PAD, (sy(0)+sy(1))/2+4, 'строка 0','end',null,FSM));
    gT.appendChild(txt(sx(0)-PAD, (sy(1)+sy(2))/2+4, 'строка 1','end',null,FSM));
    gT.appendChild(txt((sx(0)+sx(3))/2, sy(0)-PAD, 'форма (2, 3)','middle',null,FSM));
    svg.appendChild(gT);

    // ---- лента памяти ----
    var TAPE_Y = 3.3;
    var gM = el('g',{});
    for(var i=0;i<TAPE.length;i++){
      gM.appendChild(el('rect',{x:sx(i),y:sy(TAPE_Y),
        width:sx(i+1)-sx(i), height:sy(TAPE_Y+1)-sy(TAPE_Y),
        fill:'var(--tape)', stroke:'var(--cellline)','stroke-width':LW}));
      gM.appendChild(txt((sx(i)+sx(i+1))/2, (sy(TAPE_Y)+sy(TAPE_Y+1))/2+5, TAPE[i],'middle'));
      gM.appendChild(txt((sx(i)+sx(i+1))/2, sy(TAPE_Y+1)+PAD+FSM, String(i),'middle',null,FSM));
    }
    gM.appendChild(txt(sx(0)-PAD, (sy(TAPE_Y)+sy(TAPE_Y+1))/2+4, 'память','end',null,FSM));
    svg.appendChild(gM);

    // хвост: связь таблицы с лентой (подпись у хвоста, слева от середины)
    var link = el('path',{d:'M '+sx(3.15)+' '+sy(1)+' L '+sx(6.15)+' '+sy(1)+
      ' L '+sx(6.15)+' '+sy(TAPE_Y+0.5)+' L '+sx(6.05)+' '+sy(TAPE_Y+0.5),
      fill:'none',stroke:'var(--muted)','stroke-width':LW,'stroke-dasharray':'4 3'});
    svg.appendChild(link);
    svg.appendChild(txt(sx(6.2), sy(0.72), 'одна полка','start',null,FSM));

    // ---- две дуги чтения над/под лентой ----
    function reading(cfg, side, color, title, sublabel){
      var g = el('g',{});
      var yEdge = side<0 ? sy(TAPE_Y) : sy(TAPE_Y+1);
      var lift  = side<0 ? -0.62 : 0.62;
      var prev = null;
      cfg.order.forEach(function(ch,k){
        var idx = TAPE.indexOf(ch);
        var cx = (sx(idx)+sx(idx+1))/2;
        if(prev!==null){
          var mid = (prev.x+cx)/2;
          var apex = sy(TAPE_Y + (side<0 ? 0 : 1)) + (sy(TAPE_Y+lift)-sy(TAPE_Y));
          g.appendChild(el('path',{
            d:'M '+prev.x+' '+prev.y+' Q '+mid+' '+apex+' '+cx+' '+yEdge,
            fill:'none',stroke:color,'stroke-width':LW+0.4,
            'marker-end':'url(#ar-'+(side<0?'row':'col')+')'}));
        }
        prev = {x:cx,y:yEdge};
      });
      var anchorY = side<0 ? sy(TAPE_Y-0.95) : sy(TAPE_Y+2.0);
      var t1 = txt(sx(0), anchorY, title, 'start', null, FS); t1.setAttribute('fill',color);
      var t2 = txt(sx(0), anchorY + (side<0 ? -FSM-2 : FSM+3), sublabel, 'start', null, FSM);
      t2.setAttribute('fill','var(--muted)');
      g.appendChild(t1); g.appendChild(t2);
      svg.appendChild(g);
    }
    reading(ROWMAJOR, -1, 'var(--row)',
      'row-major (C): '+ROWMAJOR.order.join(' ')+'  ·  strides '+ROWMAJOR.strides,
      'шаг 1 — сосед в строке, шаг 3 — следующая строка; строки a b c / d e f');
    reading(COLMAJOR, +1, 'var(--col)',
      'column-major (F): '+COLMAJOR.order.join(' ')+'  ·  strides '+COLMAJOR.strides,
      'форма (3, 2): вдоль строки 2, вниз по столбцу 1; строки a c e / b d f');

    // нижняя мысль — у левого края, anchor start
    svg.appendChild(txt(sx(0), sy(5.9),
      'Числа не двигались: сменились только шаги и форма — это и есть транспонирование.',
      'start','',FSM));

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема должна показывать: таблицу 2×3 (a b c / d e f) '+
      'и под ней ленту памяти a b c d e f. Чтение по строкам (row-major, C order) — '+
      'порядок a b c d e f, strides (3, 1). Чтение по столбцам (column-major, F order) — '+
      'порядок a d b e c f, strides (1, 2). Данные в памяти одни и те же, меняются только шаги и форма.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
