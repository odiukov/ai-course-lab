<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Разбор по столбикам справа налево</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b1f2a; --muted:#6b7280; --line:#8d95a5;
    --band:#ecf0f6; --cell:#ffffff; --acc:#1f6feb; --accbg:#e2ecfd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --fg:#e8ebf2; --muted:#9aa3b4; --line:#79839a;
      --band:#1c2029; --cell:#171b23; --acc:#7fb0ff; --accbg:#1e2b3f;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:507px;margin:0 auto;padding:10px 8px 14px;}
  .title{margin:0 0 6px;font-size:16px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:14px;color:var(--fg);white-space:pre-line;}
</style>
</head>
<body>
<div class="wrap">
  <p class="title">Разбор по столбикам справа налево</p>
  <svg id="s" viewBox="0 0 480 456" role="img"
       aria-label="Формы (8,1,6,1) и (7,1,5) выровнены справа, B дополнена до (1,7,1,5), итог (8,7,6,5)"></svg>
  <div class="fallback" id="fb" hidden></div>
</div>
<script>
(function(){
  var svg=document.getElementById('s');
  try{
    /* ---- данные схемы ---- */
    var COLS=[
      {a:8, b:1, pad:true,  r:8},
      {a:1, b:7, pad:false, r:7},
      {a:6, b:1, pad:false, r:6},
      {a:1, b:5, pad:false, r:5}
    ];
    var ROW={a:0, b:1, r:2};
    var CW=0.4, CH=0.3;               /* полуразмер ячейки, единицы схемы */
    var BW=0.47, BT=-0.44, BB=2.44;   /* полоса столбика */
    var LX=-0.55;                     /* колонка подписей слева */
    var AY=-0.7, ATL=3.32, AHD=-0.3, AHW=0.16, ALY=-1.05; /* стрелка и её подпись */
    var EX=3.45, EYT=-0.98, EYB=2.44, ELY=2.66;           /* правый край */
    var LEG1=2.92, LEG2=3.24;

    /* ---- одна система координат ---- */
    var origin={x:132, y:130}, scale=96;
    var sx=function(u){ return origin.x + u*scale; };
    var sy=function(v){ return origin.y + v*scale; };

    var NS='http://www.w3.org/2000/svg';
    function el(n,at){var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); svg.appendChild(e); return e;}
    function txt(x,y,s,at){var e=el('text',at||{});
      e.setAttribute('x',x); e.setAttribute('y',y); e.textContent=s; return e;}

    /* полосы столбиков */
    COLS.forEach(function(c,i){
      el('rect',{x:sx(i-BW), y:sy(BT), width:sx(i+BW)-sx(i-BW), height:sy(BB)-sy(BT),
        rx:8, fill:'var(--band)'});
    });

    /* правый край выравнивания */
    el('line',{x1:sx(EX), y1:sy(EYT), x2:sx(EX), y2:sy(EYB),
      stroke:'var(--line)','stroke-width':1.5,'stroke-dasharray':'5 4'});
    txt(sx(EX)-8, sy(ELY), 'прижато вправо',
      {'text-anchor':'end','font-size':13.5, fill:'var(--muted)'});

    /* стрелка разбора */
    el('line',{x1:sx(ATL), y1:sy(AY), x2:sx(AHD+AHW), y2:sy(AY),
      stroke:'var(--acc)','stroke-width':2});
    el('polygon',{points:[
        sx(AHD)+','+sy(AY),
        sx(AHD+AHW)+','+sy(AY-AHW*0.62),
        sx(AHD+AHW)+','+sy(AY+AHW*0.62)].join(' '),
      fill:'var(--acc)'});
    txt(sx((ATL+AHD)/2), sy(ALY), 'разбор справа налево',
      {'text-anchor':'middle','font-size':14, fill:'var(--acc)'});

    /* ячейки */
    function cell(cx,cy,val,kind){
      var r=el('rect',{x:sx(cx-CW), y:sy(cy-CH),
        width:sx(cx+CW)-sx(cx-CW), height:sy(cy+CH)-sy(cy-CH),
        rx:6, stroke:'var(--line)','stroke-width':1.5,
        fill: kind==='res' ? 'var(--accbg)' : 'var(--cell)'});
      if(kind==='pad'){ r.setAttribute('stroke-dasharray','2 3'); }
      else if(kind==='one'){ r.setAttribute('stroke-dasharray','6 4'); }
      if(kind==='res'){ r.setAttribute('stroke','var(--acc)'); }
      txt(sx(cx), sy(cy), String(val), {
        'text-anchor':'middle','dominant-baseline':'central','font-size':20,
        'font-weight': kind==='res' ? 700 : 500,
        fill: kind==='res' ? 'var(--acc)' : (kind==='pad' ? 'var(--muted)' : 'var(--fg)')
      });
    }

    COLS.forEach(function(c,i){
      cell(i, ROW.a, c.a, c.a===1 ? 'one' : 'plain');
      cell(i, ROW.b, c.b, c.pad ? 'pad' : (c.b===1 ? 'one' : 'plain'));
      /* связка пары со выбранным размером */
      el('line',{x1:sx(i), y1:sy(ROW.b+CH), x2:sx(i), y2:sy(ROW.r-CH),
        stroke:'var(--acc)','stroke-width':1.5,'stroke-dasharray':'3 3'});
      cell(i, ROW.r, c.r, 'res');
    });

    /* подписи строк */
    [['форма A',ROW.a,'var(--fg)'],['форма B',ROW.b,'var(--fg)'],['итог',ROW.r,'var(--acc)']]
    .forEach(function(p){
      txt(sx(LX)-10, sy(p[1]), p[0], {'text-anchor':'end','dominant-baseline':'central',
        'font-size':15, fill:p[2], 'font-weight': p[0]==='итог' ? 600 : 400});
    });

    /* легенда */
    txt(sx(LX), sy(LEG1), 'форма B = (7, 1, 5), дописана 1 слева = (1, 7, 1, 5)',
      {'text-anchor':'start','font-size':13.5, fill:'var(--muted)'});
    txt(sx(LX), sy(LEG2), '1 растягивается до соседа; итог = (8, 7, 6, 5)',
      {'text-anchor':'start','font-size':13.5, fill:'var(--muted)'});
  }catch(e){
    svg.setAttribute('hidden','');
    var fb=document.getElementById('fb');
    fb.hidden=false;
    fb.textContent=
      'Схема не построилась. Она должна показывать:\n'+
      'форма A = (8, 1, 6, 1) и форма B = (7, 1, 5), выровненные по правому краю;\n'+
      'B дополнена единицей слева до (1, 7, 1, 5);\n'+
      'разбор идёт справа налево, под каждым столбиком выбранный размер: 8, 7, 6, 5.';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
