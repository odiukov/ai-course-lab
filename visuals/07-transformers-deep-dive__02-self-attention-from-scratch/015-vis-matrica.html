<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Матрица оценок 5×5</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1c1c1e; --muted:#6b6b73; --grid:#c3c3cc;
    --cell:#ffffff; --row:#e8f0fe; --rowline:#3b6fd4;
    --diag:#fde4d3; --diagline:#c9662a; --diagfg:#8c3f12;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16171a; --fg:#e9e9ee; --muted:#9a9aa4; --grid:#43444c;
      --cell:#1f2126; --row:#1d2c4a; --rowline:#6f9dee;
      --diag:#43291a; --diagline:#e08b4e; --diagfg:#f0b183;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:8px 4px 10px;}
  h2{font-size:15px;margin:0 0 6px;text-align:center;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;}
  .err{color:var(--muted);font-size:13px;padding:8px 14px;line-height:1.5;}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Scores = Q · Kᵀ — строка спрашивает, столбец отвечает</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var M = [
      [2.1,0.3,0.1,0.8,0.2],
      [0.4,1.9,0.7,0.1,0.3],
      [0.2,0.6,2.3,0.5,0.1],
      [0.9,0.1,0.4,1.7,0.6],
      [0.1,0.3,0.2,0.5,2.0]
    ];
    var ROWS=["q1","q2","q3","q4","q5"], COLS=["k1","k2","k3","k4","k5"];
    var HILITE_ROW = 0;

    // ---- одна система координат ----
    // x = номер столбца, y = номер строки (вниз), в клетках
    var ORIGIN = {x:150, y:78}, SCALE = 62;
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y + y*SCALE; }

    var PAD=6, LW=1.2, FS=15;

    var VB_W=640, VB_H=470;
    var svg='<svg viewBox="0 0 '+VB_W+' '+VB_H+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Матрица оценок 5 на 5">';
    svg+='<rect x="0" y="0" width="'+VB_W+'" height="'+VB_H+'" fill="var(--bg)"/>';

    // фон подсвеченной строки
    svg+='<rect x="'+sx(0)+'" y="'+sy(HILITE_ROW)+'" width="'+(sx(5)-sx(0))+'" height="'+(sy(1)-sy(0))+'" fill="var(--row)"/>';

    // клетки
    var i,j;
    for(i=0;i<5;i++){
      for(j=0;j<5;j++){
        var diag = (i===j);
        if(diag){
          svg+='<rect x="'+sx(j)+'" y="'+sy(i)+'" width="'+(sx(1)-sx(0))+'" height="'+(sy(1)-sy(0))+'" fill="var(--diag)"/>';
        }
        svg+='<rect x="'+sx(j)+'" y="'+sy(i)+'" width="'+(sx(1)-sx(0))+'" height="'+(sy(1)-sy(0))+'" fill="none" stroke="var(--grid)" stroke-width="'+LW+'"/>';
        svg+='<text x="'+sx(j+0.5)+'" y="'+sy(i+0.5)+'" text-anchor="middle" dominant-baseline="central" font-size="'+FS+'" font-weight="'+(diag?'700':'400')+'" fill="'+(diag?'var(--diagfg)':'var(--fg)')+'">'+M[i][j].toFixed(1)+'</text>';
      }
    }

    // рамки подсветки
    svg+='<rect x="'+sx(0)+'" y="'+sy(HILITE_ROW)+'" width="'+(sx(5)-sx(0))+'" height="'+(sy(1)-sy(0))+'" fill="none" stroke="var(--rowline)" stroke-width="'+(LW*2.2)+'"/>';
    for(i=0;i<5;i++){
      svg+='<rect x="'+sx(i)+'" y="'+sy(i)+'" width="'+(sx(1)-sx(0))+'" height="'+(sy(1)-sy(0))+'" fill="none" stroke="var(--diagline)" stroke-width="'+(LW*2.2)+'"/>';
    }

    // заголовки столбцов (сверху, middle)
    for(j=0;j<5;j++){
      svg+='<text x="'+sx(j+0.5)+'" y="'+(sy(0)-PAD)+'" text-anchor="middle" font-size="'+FS+'" fill="var(--muted)">'+COLS[j]+'</text>';
    }
    // заголовки строк (слева, end)
    for(i=0;i<5;i++){
      svg+='<text x="'+(sx(0)-PAD*1.6)+'" y="'+sy(i+0.5)+'" text-anchor="end" dominant-baseline="central" font-size="'+FS+'" font-weight="'+(i===HILITE_ROW?'700':'400')+'" fill="'+(i===HILITE_ROW?'var(--rowline)':'var(--muted)')+'">'+ROWS[i]+'</text>';
    }

    // подпись оси столбцов — над заголовками, middle по центру таблицы
    svg+='<text x="'+sx(2.5)+'" y="'+(sy(-0.62))+'" text-anchor="middle" font-size="'+FS+'" fill="var(--muted)">столбец — у кого спрашивают</text>';

    // подпись оси строк — слева от таблицы, вертикально, middle
    svg+='<text x="'+(sx(-0.62))+'" y="'+sy(2.5)+'" text-anchor="middle" font-size="'+FS+'" fill="var(--muted)" transform="rotate(-90 '+sx(-0.62)+' '+sy(2.5)+')">строка — кто спрашивает</text>';

    // выноска подсвеченной строки: хвост справа от таблицы
    var ax0=sx(5.55), ay0=sy(HILITE_ROW+0.5), ax1=sx(5.06), ay1=ay0;
    svg+='<path d="M '+ax0+' '+ay0+' L '+ax1+' '+ay1+'" stroke="var(--rowline)" stroke-width="'+(LW*1.6)+'" fill="none"/>';
    svg+='<path d="M '+ax1+' '+ay1+' L '+sx(5.32)+' '+sy(HILITE_ROW+0.34)+' L '+sx(5.32)+' '+sy(HILITE_ROW+0.66)+' Z" fill="var(--rowline)"/>';
    svg+='<text x="'+ax0+'" y="'+(sy(HILITE_ROW+0.5)-PAD*1.4)+'" text-anchor="start" font-size="'+FS+'" fill="var(--rowline)">q1 смотрит</text>';
    svg+='<text x="'+ax0+'" y="'+(sy(HILITE_ROW+0.5)+PAD*2.4)+'" text-anchor="start" font-size="'+FS+'" fill="var(--rowline)">на все ключи</text>';

    // асимметрия: пометки q1·k4 и q4·k1 разведены в разные стороны
    svg+='<text x="'+sx(3.5)+'" y="'+(sy(1)+PAD*1.2)+'" text-anchor="middle" font-size="'+(FS-2)+'" fill="var(--muted)">q1·k4</text>';
    svg+='<text x="'+(sx(0)-PAD*1.6)+'" y="'+sy(4.16)+'" text-anchor="end" font-size="'+(FS-2)+'" fill="var(--muted)">q4·k1</text>';

    // легенда под схемой
    var ly = sy(5.62);
    svg+='<rect x="'+sx(0)+'" y="'+(ly-SCALE*0.16)+'" width="'+(sx(0.3)-sx(0))+'" height="'+(sy(0.3)-sy(0))+'" fill="var(--row)" stroke="var(--rowline)" stroke-width="'+(LW*1.6)+'"/>';
    svg+='<text x="'+sx(0.42)+'" y="'+ly+'" text-anchor="start" dominant-baseline="central" font-size="'+(FS-1)+'" fill="var(--fg)">строка q1: 2.1 0.3 0.1 0.8 0.2</text>';
    var ly2 = sy(6.12);
    svg+='<rect x="'+sx(0)+'" y="'+(ly2-SCALE*0.16)+'" width="'+(sx(0.3)-sx(0))+'" height="'+(sy(0.3)-sy(0))+'" fill="var(--diag)" stroke="var(--diagline)" stroke-width="'+(LW*1.6)+'"/>';
    svg+='<text x="'+sx(0.42)+'" y="'+ly2+'" text-anchor="start" dominant-baseline="central" font-size="'+(FS-1)+'" fill="var(--fg)">диагональ: 2.1 1.9 2.3 1.7 2.0 — токен на себя</text>';

    svg+='</svg>';
    host.innerHTML = svg;
  }catch(e){
    host.innerHTML = '<div class="err">Схема должна была показать матрицу оценок 5×5 (Q·Kᵀ): строки q1…q5, столбцы k1…k5. Значения по строкам: 2.1 0.3 0.1 0.8 0.2 / 0.4 1.9 0.7 0.1 0.3 / 0.2 0.6 2.3 0.5 0.1 / 0.9 0.1 0.4 1.7 0.6 / 0.1 0.3 0.2 0.5 2.0. Подсвечена строка q1 (кто спрашивает) и диагональ 2.1, 1.9, 2.3, 1.7, 2.0 (токен смотрит на себя). Клетки q1·k4 = 0.8 и q4·k1 = 0.9 показывают асимметрию.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
