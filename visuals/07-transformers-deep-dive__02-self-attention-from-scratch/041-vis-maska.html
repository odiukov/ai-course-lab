<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Маска на матрице 6×6</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c1e26; --muted:#6b7280;
    --live:#2f6f4f; --live-bg:#cfe9d8; --dead:#9aa3ad; --dead-bg:#eceff2;
    --row:#b4531a; --rowbg:#ffe6cf; --grid:#c3c9d0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161b; --fg:#e8eaee; --muted:#98a1ad;
      --live:#8fdcaf; --live-bg:#1f4433; --dead:#697280; --dead-bg:#1e222a;
      --row:#ffb37a; --rowbg:#40281a; --grid:#39404a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:880px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--muted);white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Маска на матрице 6×6: строка 3 видит позиции 1, 2, 3</h2>
  <svg id="s" viewBox="0 0 620 400" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Матрица 6 на 6 с причинной маской"></svg>
  <p id="fb" class="fail" hidden></p>
</div>
<script>
(function(){
  var svg=document.getElementById("s");
  try{
    var N=6;
    var TOK=["The","cat","sat","on","the","mat"];
    var HL=3;                      // подсвеченная строка (1-based)
    var ORIGIN={x:150,y:60};       // пиксели левого-верхнего угла клетки (0,0)
    var SCALE=44;                  // пикселей на одну клетку
    function sx(x){return ORIGIN.x + x*SCALE;}
    function sy(y){return ORIGIN.y + y*SCALE;}

    var NS="http://www.w3.org/2000/svg";
    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e;}
    function txt(x,y,s,a,cls,size){
      var t=el("text",{x:x,y:y,"text-anchor":a,"font-size":size||13,
        "dominant-baseline":"middle",fill:"currentColor"});
      if(cls) t.setAttribute("class",cls);
      t.textContent=s; return t;
    }
    var g=el("g",{}); svg.appendChild(g);

    // клетки
    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        var live = c<=r;                 // ниже и на диагонали
        var inRow = (r===HL-1);
        var fill = live ? (inRow? "var(--rowbg)":"var(--live-bg)") : "var(--dead-bg)";
        g.appendChild(el("rect",{x:sx(c),y:sy(r),width:sx(1)-sx(0),height:sy(1)-sy(0),
          fill:fill,stroke:"var(--grid)","stroke-width":1}));
        var lab = live ? "0" : "−∞";
        var col = live ? (inRow? "var(--row)":"var(--live)") : "var(--dead)";
        var t=txt(sx(c+0.5),sy(r+0.5),lab,"middle",null,live?13:12);
        t.setAttribute("fill",col);
        if(live) t.setAttribute("font-weight","600");
        g.appendChild(t);
      }
    }

    // рамка подсвеченной строки
    g.appendChild(el("rect",{x:sx(0),y:sy(HL-1),width:sx(N)-sx(0),height:sy(1)-sy(0),
      fill:"none",stroke:"var(--row)","stroke-width":2.5}));

    // подписи строк (слева, anchor=end)
    for(var r=0;r<N;r++){
      var t=txt(sx(0)-10,sy(r+0.5),(r+1)+" · "+TOK[r],"end");
      t.setAttribute("fill", r===HL-1 ? "var(--row)" : "var(--muted)");
      if(r===HL-1) t.setAttribute("font-weight","600");
      g.appendChild(t);
    }
    // подписи столбцов (сверху, anchor=middle)
    for(var c=0;c<N;c++){
      var t2=txt(sx(c+0.5),sy(0)-14,String(c+1),"middle");
      t2.setAttribute("fill", (c<HL) ? "var(--row)" : "var(--muted)");
      g.appendChild(t2);
    }
    g.appendChild(txt(sx(N/2),sy(0)-36,"ключи (позиции)","middle",null,13))
      .setAttribute("fill","var(--muted)");
    var yl=txt(0,0,"запросы","middle",null,13);
    yl.setAttribute("x",sx(0)-118); yl.setAttribute("y",sy(N/2));
    yl.setAttribute("fill","var(--muted)");
    yl.setAttribute("transform","rotate(-90 "+(sx(0)-118)+" "+sy(N/2)+")");
    g.appendChild(yl);

    // выноска к подсвеченной строке — от хвоста справа
    var ax0=sx(N)+92, ay=sy(HL-0.5);
    var arrow=el("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",
      markerWidth:"6",markerHeight:"6",orient:"auto-start-reverse"});
    arrow.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--row)"}));
    var defs=el("defs",{}); defs.appendChild(arrow); svg.appendChild(defs);
    g.appendChild(el("line",{x1:ax0,y1:ay,x2:sx(N)+6,y2:ay,
      stroke:"var(--row)","stroke-width":2,"marker-end":"url(#ah)"}));
    var lt=txt(ax0+6,ay,"видит 1, 2, 3","start");
    lt.setAttribute("fill","var(--row)"); lt.setAttribute("font-weight","600");
    g.appendChild(lt);

    // легенда — отдельной строкой под схемой
    var ly=sy(N)+30;
    g.appendChild(el("rect",{x:sx(0),y:ly-9,width:18,height:18,
      fill:"var(--live-bg)",stroke:"var(--grid)","stroke-width":1}));
    var l1=txt(sx(0)+26,ly,"0 — видно: 21 клетка","start");
    l1.setAttribute("fill","var(--live)"); g.appendChild(l1);

    g.appendChild(el("rect",{x:sx(2.9),y:ly-9,width:18,height:18,
      fill:"var(--dead-bg)",stroke:"var(--grid)","stroke-width":1}));
    var l2=txt(sx(2.9)+26,ly,"−∞ — погашено: 15 клеток","start");
    l2.setAttribute("fill","var(--muted)"); g.appendChild(l2);

    var l3=txt(sx(0),sy(N)+58,"1 + 2 + 3 + 4 + 5 + 6 = 21 живая клетка из 36","start");
    l3.setAttribute("fill","var(--muted)"); g.appendChild(l3);
  }catch(e){
    svg.setAttribute("hidden","");
    var fb=document.getElementById("fb");
    fb.hidden=false;
    fb.textContent="Схема не построилась. Она должна показывать матрицу 6×6: "+
      "на диагонали и ниже — нули (21 клетка видна), выше диагонали — −∞ "+
      "(15 клеток погашены). Строка 3 («sat») подсвечена: она видит позиции 1, 2, 3.";
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
