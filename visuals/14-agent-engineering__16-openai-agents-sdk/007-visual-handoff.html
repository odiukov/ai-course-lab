<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Хендофф: triage передаёт биллингу</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1c1c1c; --muted:#5b5b5b;
    --line:#3a3a3a; --box:#ffffff; --accent:#0b6b5f; --soft:#e6efed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171a; --fg:#eceff1; --muted:#a2a9ad;
      --line:#b9c0c4; --box:#1e2226; --accent:#6ad3bf; --soft:#22302d;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:10px 12px}
  h2{font-size:15px;margin:0 0 6px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:480px;background:var(--bg)}
  .fallback{padding:10px;border:1px solid var(--line);border-radius:6px;color:var(--muted)}
  text{fill:var(--fg)}
  .mut{fill:var(--muted)}
  .acc{fill:var(--accent)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
</style>
</head>
<body>
<div class="wrap">
  <h2>Хендофф: стрелка — это рантайм, а не письмо между агентами</h2>
  <div id="host"><noscript class="fallback">Схема: у triage-агента в списке инструментов два хендоффа — <b>transfer_to_billing_agent</b> и <b>transfer_to_support_agent</b>. Стрелки идут к блокам «Биллинг» и «Поддержка». Посередине стрелки — рантайм, который делает три шага: 1) копирует контекст диалога, 2) инициализирует целевого агента, 3) продолжает прогон. Обратной стрелки нет.</noscript></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (единицы схемы) ----
    var D = {
      triage: {x:0, y:6, w:15, h:9, title:'Triage-агент'},
      tools: [
        {y:11.2, text:'transfer_to_billing_agent'},
        {y:8.8,  text:'transfer_to_support_agent'}
      ],
      runtime: {x:20, y:7.2, w:13, h:6.6, title:'Рантайм'},
      steps: [
        {n:'1', text:'копирование контекста'},
        {n:'2', text:'инициализация агента'},
        {n:'3', text:'продолжение прогона'}
      ],
      billing: {x:38, y:12, w:14, h:6, title:'Биллинг'},
      support: {x:38, y:3.5, w:14, h:6, title:'Поддержка'},
      note:    {x:20, y:0.6, text:'обратной стрелки нет'},
      stepsAt: {x:20, y:19.4}
    };

    // ---- одна пара функций перевода ----
    var origin = {x:26, y:22}, scale = 17.4;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    var VB_W = 960, VB_H = 470, LW = 1.6, FS = 13, PAD = 7;

    var svg = '';
    function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
    function box(b, cls){
      return '<rect x="'+sx(b.x)+'" y="'+sy(b.y)+'" width="'+(sx(b.x+b.w)-sx(b.x))+
        '" height="'+(sy(b.y+b.h)-sy(b.y))+'" rx="'+(sx(0.5)-sx(0))+
        '" fill="'+(cls==='soft'?'var(--soft)':'var(--box)')+
        '" stroke="'+(cls==='soft'?'var(--accent)':'var(--line)')+'" stroke-width="'+LW+'"/>';
    }
    function arrow(x1,y1,x2,y2){
      var hx = 1.0, hy = 0.45;
      var ax = sx(x2), ay = sy(y2);
      var dx = sx(x2)-sx(x1), dy = sy(y2)-sy(y1);
      var L = Math.sqrt(dx*dx+dy*dy), ux = dx/L, uy = dy/L, px = -uy, py = ux;
      var hL = sx(hx)-sx(0), hW = sy(hy)-sy(0);
      var bx = ax-ux*hL, by = ay-uy*hL;
      return '<line x1="'+sx(x1)+'" y1="'+sy(y1)+'" x2="'+bx+'" y2="'+by+
        '" stroke="var(--accent)" stroke-width="'+LW+'"/>'+
        '<path d="M'+ax+' '+ay+'L'+(bx+px*hW)+' '+(by+py*hW)+'L'+(bx-px*hW)+' '+(by-py*hW)+'Z" fill="var(--accent)"/>';
    }

    // triage + его инструменты
    var t = D.triage;
    svg += box(t,'plain');
    svg += '<text x="'+sx(t.x+t.w/2)+'" y="'+(sy(t.y)+PAD+FS)+'" text-anchor="middle" font-size="'+FS+
      '" font-weight="600">'+t.title+'</text>';
    svg += '<text x="'+sx(t.x+0.7)+'" y="'+(sy(t.y+2.6)+FS)+'" text-anchor="start" font-size="'+(FS-1)+
      '" class="mut">инструменты:</text>';
    D.tools.forEach(function(tool){
      svg += '<text x="'+sx(t.x+0.7)+'" y="'+sy(tool.y)+'" text-anchor="start" font-size="'+(FS-1)+
        '" class="mono acc">'+esc(tool.text)+'</text>';
    });

    // рантайм между стрелками
    var r = D.runtime;
    svg += box(r,'soft');
    svg += '<text x="'+sx(r.x+r.w/2)+'" y="'+(sy(r.y)+PAD+FS)+'" text-anchor="middle" font-size="'+FS+
      '" font-weight="600">'+r.title+'</text>';
    svg += '<text x="'+sx(r.x+r.w/2)+'" y="'+sy(r.y+r.h-1.6)+'" text-anchor="middle" font-size="'+(FS-1)+
      '" class="mut">меняет исполнителя</text>';

    // целевые агенты
    [D.billing, D.support].forEach(function(b){
      svg += box(b,'plain');
      svg += '<text x="'+sx(b.x+b.w/2)+'" y="'+sy(b.y+b.h/2+0.45)+'" text-anchor="middle" font-size="'+FS+
        '" font-weight="600">'+b.title+'</text>';
    });

    // стрелки: triage -> рантайм -> биллинг / поддержка
    svg += arrow(t.x+t.w, D.tools[0].y-0.35, r.x, r.y+r.h/2+1.0);
    svg += arrow(t.x+t.w, D.tools[1].y-0.35, r.x, r.y+r.h/2-1.0);
    svg += arrow(r.x+r.w, r.y+r.h/2+1.0, D.billing.x, D.billing.y+D.billing.h/2);
    svg += arrow(r.x+r.w, r.y+r.h/2-1.0, D.support.x, D.support.y+D.support.h/2);

    // подпись у хвоста правых стрелок (сбоку, не у наконечника)
    svg += '<text x="'+sx(r.x+r.w+0.6)+'" y="'+(sy(r.y+r.h/2+2.6)+FS)+'" text-anchor="start" font-size="'+(FS-1)+
      '" class="mut">вызов возвращается рантайму</text>';

    // заметка про отсутствие обратной стрелки
    svg += '<text x="'+sx(D.note.x)+'" y="'+sy(D.note.y)+'" text-anchor="start" font-size="'+(FS-1)+
      '" class="mut">'+D.note.text+': triage больше не участвует</text>';

    // три шага рантайма — строкой под схемой
    var st = D.stepsAt;
    svg += '<line x1="'+sx(st.x-26)+'" y1="'+sy(st.y-1.5)+'" x2="'+sx(st.x+26)+'" y2="'+sy(st.y-1.5)+
      '" stroke="var(--line)" stroke-width="'+(LW*0.5)+'" opacity="0.5"/>';
    D.steps.forEach(function(s,i){
      var y = st.y + i*1.65;
      svg += '<text x="'+sx(st.x-26)+'" y="'+sy(y)+'" text-anchor="start" font-size="'+(FS-1)+'">'+
        '<tspan class="acc" font-weight="600">'+s.n+'. </tspan>'+
        '<tspan class="mut">'+s.text+'</tspan></text>';
    });

    host.innerHTML = '<svg viewBox="0 0 '+VB_W+' '+VB_H+'" width="'+VB_W+'" height="'+VB_H+
      '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Triage передаёт хендофф биллингу через рантайм">'+
      svg+'</svg>';
  }catch(e){
    host.innerHTML = '<div class="fallback">Схема не построилась. Она должна показывать: у <b>triage</b> в списке инструментов два хендоффа — <span class="mono">transfer_to_billing_agent</span> и <span class="mono">transfer_to_support_agent</span>; стрелки идут к блокам «Биллинг» и «Поддержка», а посередине стоит <b>рантайм</b>, который делает три шага: 1) копирование контекста, 2) инициализация агента, 3) продолжение прогона. Обратной стрелки нет.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
