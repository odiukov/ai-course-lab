<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Одно слово, три разных числа tokens</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1d2027; --muted:#5d6470;
    --line:#3a4150; --fill:#e7ecf5; --fill2:#dbe6f7; --fill3:#e9e4f5;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151821; --fg:#e9ecf2; --muted:#9aa3b2;
      --line:#9fb0cc; --fill:#20273a; --fill2:#26304a; --fill3:#2b2740;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:10px 8px 12px}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;color:var(--fg)}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{color:var(--muted);font-size:14px;white-space:pre-line}
  text{fill:var(--fg)}
  .lbl{fill:var(--muted)}
  .cnt{font-weight:600}
  rect.cell{stroke:var(--line);stroke-width:1.5}
  line.div{stroke:var(--line);stroke-width:1.5}
</style>
<div class="wrap">
  <h2>Одно слово «running» — три зернистости, три числа tokens</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы ----
    var CHARS = 7;                       // букв в слове running
    var ROWS = [
      { row:0, label:'Уровень слов', count:'1 token',
        cuts:[], cells:[[0,7,'running']], fill:'var(--fill)' },
      { row:1, label:'Subword', count:'2 куска',
        cuts:[3], cells:[[0,3,'run'],[3,7,'ning']], fill:'var(--fill2)' },
      { row:2, label:'Символы', count:'7 tokens',
        cuts:[1,2,3,4,5,6],
        cells:[[0,1,'r'],[1,2,'u'],[2,3,'n'],[3,4,'n'],[4,5,'i'],[5,6,'n'],[6,7,'g']],
        fill:'var(--fill3)' }
    ];
    var CAPTION = 'Одно слово, три числа: 1, 2, 7';

    // ---- холст ----
    var W = 750, H = 222;

    // ---- одно начало координат и один масштаб ----
    var origin = { x:150, y:32 };
    var scale  = { x:70,  y:60 };

    // ---- единственная пара функций перевода ----
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y + y * scale.y; }

    // ---- пиксельные константы (разрешённые литералы) ----
    var PAD = 12;        // отступ подписи от точки привязки
    var LW  = 1.5;       // толщина линий
    var FS  = 15, FS_S = 13;

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    function txt(x, y, s, anchor, cls, size){
      var t = el('text', { x:x, y:y, 'text-anchor':anchor,
        'font-size':size||FS, 'font-family':'inherit' });
      if (cls) t.setAttribute('class', cls);
      t.textContent = s;
      return t;
    }

    var svg = el('svg', {
      viewBox:'0 0 ' + W + ' ' + H,
      preserveAspectRatio:'xMidYMid meet',
      role:'img',
      'aria-label':'Слово running в три ряда: 1 token на уровне слов, 2 куска run и ning у subword, 7 tokens по символам'
    });

    var HALF = 0.28;     // полувысота ячейки в единицах данных

    ROWS.forEach(function(r){
      var top = sy(r.row - HALF), bot = sy(r.row + HALF);

      svg.appendChild(el('rect', {
        'class':'cell', x:sx(0), y:top,
        width: sx(CHARS) - sx(0), height: bot - top,
        fill: r.fill, rx:4
      }));

      r.cuts.forEach(function(c){
        svg.appendChild(el('line', {
          'class':'div', x1:sx(c), y1:top, x2:sx(c), y2:bot
        }));
      });

      r.cells.forEach(function(c){
        var t = txt(sx((c[0] + c[1]) / 2), sy(r.row), c[2], 'middle', null,
                    r.cells.length === CHARS ? FS : FS);
        t.setAttribute('dominant-baseline','middle');
        t.setAttribute('font-family','ui-monospace,SFMono-Regular,Menlo,Consolas,monospace');
        svg.appendChild(t);
      });

      // подпись уровня — слева от ряда, якорь end
      var L = txt(sx(0) - PAD, sy(r.row), r.label, 'end', 'lbl', FS);
      L.setAttribute('dominant-baseline','middle');
      svg.appendChild(L);

      // число tokens — справа от ряда, якорь start
      var C = txt(sx(CHARS) + PAD, sy(r.row), r.count, 'start', 'cnt', FS);
      C.setAttribute('dominant-baseline','middle');
      svg.appendChild(C);
    });

    // подпись под схемой, по центру полосы
    svg.appendChild(txt(sx(CHARS / 2), sy(2 + HALF) + PAD * 2, CAPTION, 'middle', 'lbl', FS_S));

    host.appendChild(svg);
  } catch (e) {
    var d = document.createElement('div');
    d.className = 'fallback';
    d.textContent =
      'Схема должна была показать слово «running» в три ряда:\n' +
      '• уровень слов — 1 token: running\n' +
      '• subword — 2 куска: run + ning\n' +
      '• символы — 7 tokens: r u n n i n g\n' +
      'Одно слово, три числа: 1, 2, 7.';
    host.appendChild(d);
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
