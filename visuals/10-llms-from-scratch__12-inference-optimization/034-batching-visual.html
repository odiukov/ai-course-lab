<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пустые слоты статического батча</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: floralwhite;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --grid: lightsteelblue;
      --active: royalblue;
      --active-text: white;
      --idle: whitesmoke;
      --idle-stroke: slategray;
      --waiting: darkorange;
      --useful: seagreen;
      --lost: firebrick;
      --divider: gainsboro;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      background: var(--page);
    }

    figure {
      margin: unset;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--divider);
    }

    h1 {
      box-sizing: border-box;
      margin: unset;
      padding: 12px 16px 8px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
      shape-rendering: geometricPrecision;
    }

    .axis,
    .tick,
    .grid-line,
    .finish-line,
    .waiting-line,
    .lane-outline {
      vector-effect: non-scaling-stroke;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis {
      stroke: var(--ink);
      stroke-width: 2px;
    }

    .tick {
      stroke: var(--ink);
      stroke-width: 2px;
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: 1px;
    }

    .finish-line {
      stroke: var(--waiting);
      stroke-width: 2px;
    }

    .active {
      fill: var(--active);
      stroke: var(--active);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .idle {
      fill: var(--idle);
      stroke: var(--idle-stroke);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .lane-outline {
      stroke: var(--ink);
      stroke-width: 1px;
    }

    .waiting-line {
      stroke: var(--waiting);
      stroke-width: 3px;
    }

    .arrow-head {
      fill: var(--waiting);
      stroke: var(--waiting);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--ink);
      font-size: 16px;
      dominant-baseline: middle;
    }

    .summary {
      font-size: 16px;
      font-weight: bold;
    }

    .summary-capacity {
      fill: var(--ink);
    }

    .summary-useful {
      fill: var(--useful);
    }

    .summary-lost {
      fill: var(--lost);
    }

    .axis-label,
    .tick-label,
    .status {
      fill: var(--muted);
      font-size: 14px;
    }

    .lane-label {
      font-size: 16px;
      font-weight: bold;
    }

    .active-label {
      fill: var(--active-text);
      font-size: 15px;
      font-weight: bold;
    }

    .idle-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .waiting-label {
      fill: var(--waiting);
      font-size: 15px;
      font-weight: bold;
    }

    .footer {
      fill: var(--lost);
      font-size: 17px;
      font-weight: bold;
    }

    #fallback {
      box-sizing: border-box;
      margin: unset;
      padding: 16px;
      color: var(--lost);
      background: var(--panel);
      font-size: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --ink: aliceblue;
        --muted: lightgray;
        --grid: slateblue;
        --active: cornflowerblue;
        --active-text: midnightblue;
        --idle: darkslategray;
        --idle-stroke: lightgray;
        --waiting: goldenrod;
        --useful: mediumseagreen;
        --lost: salmon;
        --divider: slategray;
      }
    }
  </style>
</head>
<body>
  <main>
    <figure aria-labelledby="diagram-title diagram-description">
      <h1 id="diagram-title">Пустые слоты статического батча</h1>
      <svg
        id="diagram"
        viewBox="0 0 1000 430"
        width="1000"
        height="430"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="diagram-title diagram-description"
      >
        <desc id="diagram-description">
          Три запроса статического батча работают 50, 10 и 30 шагов.
          Освободившиеся слоты остаются пустыми до общего финиша на шаге 50,
          пока четвёртый запрос ждёт.
        </desc>
      </svg>
      <p id="fallback" hidden>
        Схема должна была показать три слота: R1 работает 50 шагов, R2 после
        10 шагов пустует ещё 40, R3 после 30 шагов пустует ещё 20, а R4 ждёт
        общего финиша на шаге 50.
      </p>
    </figure>
  </main>

  <script>
    "use strict";

    const DATA = [{
      ns: "http://www.w3.org/2000/svg",
      origin: { x: 170, y: 0 },
      scale: { x: 13.8, y: 1 },

      bounds: {
        start: 0,
        end: 50
      },

      summaryY: 25,
      summaryDividerY: 45,
      summary: [
        {
          x: 0,
          text: "150 возможных слот-итераций",
          className: "summary summary-capacity",
          anchor: "start",
          side: "right"
        },
        {
          x: 25,
          text: "90 полезных",
          className: "summary summary-useful",
          anchor: "middle",
          side: "none"
        },
        {
          x: 50,
          text: "60 потеряно · загрузка 60%",
          className: "summary summary-lost",
          anchor: "end",
          side: "left"
        }
      ],

      axis: {
        y: 68,
        tickTop: 64,
        tickBottom: 74,
        labelY: 53,
        tickLabelY: 84,
        title: "шаг decode"
      },

      marks: [
        { x: 10, label: "10" },
        { x: 30, label: "30" },
        { x: 50, label: "50" }
      ],

      grid: {
        top: 68,
        bottom: 268
      },

      lanes: [
        {
          id: "R1",
          total: 50,
          start: 0,
          end: 50,
          y1: 100,
          y2: 138,
          centerY: 119,
          label: "R1 · 50 шагов",
          activeLabel: "работает все 50 шагов",
          activeLabelX: 25,
          idleLabel: "",
          idleLabelX: 50,
          status: "",
          statusX: 50,
          statusY: 148
        },
        {
          id: "R2",
          total: 10,
          start: 0,
          end: 10,
          y1: 160,
          y2: 198,
          centerY: 179,
          label: "R2 · 10 шагов",
          activeLabel: "полезно 10",
          activeLabelX: 5,
          idleLabel: "пусто 40 шагов",
          idleLabelX: 30,
          status: "R2 завершён",
          statusX: 10,
          statusY: 213
        },
        {
          id: "R3",
          total: 30,
          start: 0,
          end: 30,
          y1: 230,
          y2: 268,
          centerY: 249,
          label: "R3 · 30 шагов",
          activeLabel: "полезно 30",
          activeLabelX: 15,
          idleLabel: "пусто 20 шагов",
          idleLabelX: 40,
          status: "R3 завершён",
          statusX: 30,
          statusY: 283
        }
      ],

      finish: {
        x: 50,
        top: 91,
        bottom: 350,
        labelY: 91,
        label: "общий финиш"
      },

      waiting: {
        start: 0,
        end: 50,
        y: 326,
        labelX: 0,
        labelY: 306,
        label: "R4 ждёт: слот нельзя занять раньше",
        resultX: 50,
        resultY: 350,
        result: "R4 стартует только после шага 50",
        arrowBaseX: 49.15,
        arrowTopY: 320,
        arrowBottomY: 332
      },

      footer: {
        x: 25,
        y: 394,
        text: "60 из 150 слот-итераций не обслуживают пользователей"
      },

      dash: {
        start: 0,
        end: 0.55,
        gapEnd: 1.05
      }
    }];

    const [D] = DATA;
    const origin = Object.freeze({ x: D.origin.x, y: D.origin.y });
    const scale = Object.freeze({ x: D.scale.x, y: D.scale.y });
    const LABEL_PAD = 8;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");

      const element = (name, attributes, className) => {
        const node = document.createElementNS(D.ns, name);

        if (className) {
          node.setAttribute("class", className);
        }

        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }

        return node;
      };

      const add = node => {
        svg.appendChild(node);
        return node;
      };

      const line = (x1, y1, x2, y2, className) => add(element("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2)
      }, className));

      const rect = (x1, y1, x2, y2, className) => add(element("rect", {
        x: sx(x1),
        y: sy(y1),
        width: sx(x2) - sx(x1),
        height: sy(y2) - sy(y1)
      }, className));

      const label = (
        x,
        y,
        content,
        className,
        anchor,
        horizontalSide
      ) => {
        const attributes = {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor
        };

        if (horizontalSide === "left") {
          attributes.dx = -LABEL_PAD;
        }

        if (horizontalSide === "right") {
          attributes.dx = LABEL_PAD;
        }

        const node = element("text", attributes, className);
        node.textContent = content;
        return add(node);
      };

      const idleDash = sx(D.dash.end) - sx(D.dash.start);
      const idleGap = sx(D.dash.gapEnd) - sx(D.dash.end);

      for (const item of D.summary) {
        label(
          item.x,
          D.summaryY,
          item.text,
          item.className,
          item.anchor,
          item.side
        );
      }

      line(
        D.bounds.start,
        D.summaryDividerY,
        D.bounds.end,
        D.summaryDividerY,
        "grid-line"
      );

      label(
        D.bounds.end,
        D.axis.labelY,
        D.axis.title,
        "axis-label",
        "end",
        "none"
      );

      line(
        D.bounds.start,
        D.axis.y,
        D.bounds.end,
        D.axis.y,
        "axis"
      );

      for (const mark of D.marks) {
        line(
          mark.x,
          D.grid.top,
          mark.x,
          D.grid.bottom,
          "grid-line"
        );

        line(
          mark.x,
          D.axis.tickTop,
          mark.x,
          D.axis.tickBottom,
          "tick"
        );

        label(
          mark.x,
          D.axis.tickLabelY,
          mark.label,
          "tick-label",
          "middle",
          "none"
        );
      }

      line(
        D.finish.x,
        D.finish.top,
        D.finish.x,
        D.finish.bottom,
        "finish-line"
      );

      label(
        D.finish.x,
        D.finish.labelY,
        D.finish.label,
        "waiting-label",
        "end",
        "left"
      );

      for (const lane of D.lanes) {
        label(
          D.bounds.start,
          lane.centerY,
          lane.label,
          "lane-label",
          "end",
          "left"
        );

        rect(
          lane.start,
          lane.y1,
          lane.end,
          lane.y2,
          "active"
        );

        if (lane.end < D.bounds.end) {
          const idle = rect(
            lane.end,
            lane.y1,
            D.bounds.end,
            lane.y2,
            "idle"
          );

          idle.setAttribute(
            "stroke-dasharray",
            `${idleDash} ${idleGap}`
          );
        }

        rect(
          D.bounds.start,
          lane.y1,
          D.bounds.end,
          lane.y2,
          "lane-outline"
        );

        label(
          lane.activeLabelX,
          lane.centerY,
          lane.activeLabel,
          "active-label",
          "middle",
          "none"
        );

        if (lane.idleLabel) {
          label(
            lane.idleLabelX,
            lane.centerY,
            lane.idleLabel,
            "idle-label",
            "middle",
            "none"
          );
        }

        if (lane.status) {
          label(
            lane.statusX,
            lane.statusY,
            lane.status,
            "status",
            "middle",
            "none"
          );
        }
      }

      label(
        D.waiting.labelX,
        D.waiting.labelY,
        D.waiting.label,
        "waiting-label",
        "start",
        "none"
      );

      const waitingLine = line(
        D.waiting.start,
        D.waiting.y,
        D.waiting.end,
        D.waiting.y,
        "waiting-line"
      );

      waitingLine.setAttribute(
        "stroke-dasharray",
        `${idleDash} ${idleGap}`
      );

      add(element("polygon", {
        points: [
          `${sx(D.waiting.end)},${sy(D.waiting.y)}`,
          `${sx(D.waiting.arrowBaseX)},${sy(D.waiting.arrowTopY)}`,
          `${sx(D.waiting.arrowBaseX)},${sy(D.waiting.arrowBottomY)}`
        ].join(" ")
      }, "arrow-head"));

      label(
        D.waiting.resultX,
        D.waiting.resultY,
        D.waiting.result,
        "waiting-label",
        "end",
        "none"
      );

      label(
        D.footer.x,
        D.footer.y,
        D.footer.text,
        "footer",
        "middle",
        "none"
      );
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
