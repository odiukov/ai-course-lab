<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Маршруты запуска модели</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f5f7fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#5c667a;
  --line:#9aa5b8;
  --neutral:#eef2f8;
  --ios-bg:#eaf2ff;
  --ios:#2864b7;
  --android-bg:#e8f7ee;
  --android:#25734a;
  --web-bg:#fff3df;
  --web:#9a5c09;
  --jetson-bg:#f1ebff;
  --jetson:#6842a8;
  --format:#fffdf4;
  --format-line:#8b7a3e;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111722;
    --panel:#18202d;
    --text:#edf2fb;
    --muted:#b7c0d1;
    --line:#778298;
    --neutral:#252f40;
    --ios-bg:#172f50;
    --ios:#80b5ff;
    --android-bg:#173b2a;
    --android:#78d6a0;
    --web-bg:#442f15;
    --web:#f2bd68;
    --jetson-bg:#30234d;
    --jetson:#c3a4ff;
    --format:#353222;
    --format-line:#d2bd6c;
  }
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--text)}
body{
  margin:unset;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
figure{
  margin:unset;
  background:var(--panel);
  border:1px solid var(--line);
}
h1{
  margin:unset;
  padding:8px 12px 6px;
  font-size:18px;
  line-height:normal;
}
svg{
  display:block;
  inline-size:100%;
  block-size:auto;
  max-block-size:476px;
  background:var(--panel);
}
.route{
  fill:none;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.arrow{stroke:none}
.ios.route{stroke:var(--ios)}
.ios.arrow{fill:var(--ios)}
.android.route{stroke:var(--android)}
.android.arrow{fill:var(--android)}
.web.route{stroke:var(--web)}
.web.arrow{fill:var(--web)}
.jetson.route{stroke:var(--jetson)}
.jetson.arrow{fill:var(--jetson)}
.node rect{
  stroke-width:1.5;
  vector-effect:non-scaling-stroke;
}
.node text{
  fill:var(--text);
  font-size:12px;
  font-weight:bold;
  dominant-baseline:middle;
}
.node text.small{
  fill:var(--muted);
  font-size:10px;
  font-weight:normal;
}
.node.neutral rect{fill:var(--neutral);stroke:var(--line)}
.node.ios rect{fill:var(--ios-bg);stroke:var(--ios)}
.node.android rect{fill:var(--android-bg);stroke:var(--android)}
.node.web rect{fill:var(--web-bg);stroke:var(--web)}
.node.jetson rect{fill:var(--jetson-bg);stroke:var(--jetson)}
.node.format rect{fill:var(--format);stroke:var(--format-line)}
.caption{
  fill:var(--muted);
  font-size:11px;
  font-weight:bold;
  letter-spacing:.04em;
}
.fallback{
  padding:14px;
  font-size:14px;
  color:var(--text);
}
.fallback[hidden]{display:none}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Маршруты запуска: выбирай формат от устройства</h1>
  <svg id="chart" width="1200" height="476" viewBox="0 0 1200 476"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">Дерево маршрутов одной модели для iOS, Android, браузера и устройств Jetson.</desc>
    <g id="layer"></g>
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна была показать: iOS — Core ML INT4+FP16; Android — QNN
    INT8/INT4; совместимый браузер — WebLLM q4f16_1; старый браузер —
    серверный OpenAI-совместимый API; Jetson Nano — Q4; AGX или Thor — NVFP4.
  </div>
</figure>
<script>
const diagram={
  metrics:[{radius:2,head:2.2,half:1.6}],
  captions:[
    ["ПЛАТФОРМА",59,4],
    ["УСЛОВИЕ / ДВИЖОК",119,4],
    ["ФОРМАТ",172,4],
    ["МЕСТО ЗАПУСКА",250,4]
  ],
  nodes:[
    ["neutral",2,48,37,16,[
      ["Исходная",20.5,53,""],
      ["модель",20.5,59,"small"]
    ]],

    ["ios",44,9,30,15,[["iOS",59,16.5,""]]],
    ["ios",93,9,40,15,[["Core ML",113,16.5,""]]],
    ["format",152,9,40,15,[["INT4+FP16",172,16.5,""]]],
    ["ios",211,7,77,19,[
      ["Приложение iOS",249.5,13,""],
      ["Apple CPU · GPU · ANE",249.5,20,"small"]
    ]],

    ["android",44,30,30,15,[["Android",59,37.5,""]]],
    ["android",93,30,40,15,[["QNN",113,37.5,""]]],
    ["format",152,30,40,15,[["INT8/INT4",172,37.5,""]]],
    ["android",211,28,77,19,[
      ["Приложение Android",249.5,34,""],
      ["Qualcomm CPU · GPU · NPU",249.5,41,"small"]
    ]],

    ["web",44,51,30,18,[
      ["Браузер",59,57,""],
      ["какой?",59,64,"small"]
    ]],
    ["web",84,45,41,14,[["Совместимый",104.5,52,""]]],
    ["web",139,45,40,14,[
      ["WebLLM",159,50,""],
      ["/ MLC",159,55,"small"]
    ]],
    ["format",190,45,36,14,[["q4f16_1",208,52,""]]],
    ["web",239,43,49,18,[
      ["WebGPU",263.5,49,""],
      ["GPU браузера",263.5,56,"small"]
    ]],
    ["web",84,65,41,14,[["Старый",104.5,72,""]]],
    ["web",139,65,67,14,[
      ["OpenAI-совместимый",172.5,70,""],
      ["API",172.5,75,"small"]
    ]],
    ["web",220,65,53,14,[["Сервер",246.5,72,""]]],

    ["jetson",44,88,30,18,[
      ["Jetson",59,94,""],
      ["какой?",59,101,"small"]
    ]],
    ["jetson",84,83,32,14,[["Nano",100,90,""]]],
    ["jetson",136,83,45,14,[["TensorRT-LLM",158.5,90,""]]],
    ["format",194,83,28,14,[["Q4",208,90,""]]],
    ["jetson",236,82,46,16,[
      ["CUDA",259,87,""],
      ["GPU",259,93,"small"]
    ]],
    ["jetson",84,102,41,14,[["AGX или Thor",104.5,109,""]]],
    ["jetson",136,102,45,14,[["TensorRT-LLM",158.5,109,""]]],
    ["format",194,102,28,14,[["NVFP4",208,109,""]]],
    ["jetson",236,101,46,16,[
      ["CUDA",259,106,""],
      ["GPU",259,112,"small"]
    ]]
  ],
  edges:[
    ["ios",[[39,56],[41.5,56],[41.5,16.5],[44,16.5]]],
    ["android",[[39,56],[41.5,56],[41.5,37.5],[44,37.5]]],
    ["web",[[39,56],[41.5,56],[41.5,60],[44,60]]],
    ["jetson",[[39,56],[41.5,56],[41.5,97],[44,97]]],

    ["ios",[[74,16.5],[93,16.5]]],
    ["ios",[[133,16.5],[152,16.5]]],
    ["ios",[[192,16.5],[211,16.5]]],

    ["android",[[74,37.5],[93,37.5]]],
    ["android",[[133,37.5],[152,37.5]]],
    ["android",[[192,37.5],[211,37.5]]],

    ["web",[[74,60],[79,60],[79,52],[84,52]]],
    ["web",[[74,60],[79,60],[79,72],[84,72]]],
    ["web",[[125,52],[139,52]]],
    ["web",[[179,52],[190,52]]],
    ["web",[[226,52],[239,52]]],
    ["web",[[125,72],[139,72]]],
    ["web",[[206,72],[220,72]]],

    ["jetson",[[74,97],[79,97],[79,90],[84,90]]],
    ["jetson",[[74,97],[79,97],[79,109],[84,109]]],
    ["jetson",[[116,90],[136,90]]],
    ["jetson",[[181,90],[194,90]]],
    ["jetson",[[222,90],[236,90]]],
    ["jetson",[[125,109],[136,109]]],
    ["jetson",[[181,109],[194,109]]],
    ["jetson",[[222,109],[236,109]]]
  ]
};
const origin={x:4,y:4};
const scale=4;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const ns="http://www.w3.org/2000/svg";
  const layer=document.getElementById("layer");
  const [metrics]=diagram.metrics;

  const make=(name,attributes)=>{
    const element=document.createElementNS(ns,name);
    for(const [key,value] of Object.entries(attributes)){
      element.setAttribute(key,value);
    }
    return element;
  };

  for(const [kind,points] of diagram.edges){
    const line=make("polyline",{
      class:`route ${kind}`,
      points:points.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" ")
    });
    layer.appendChild(line);

    const [endX,endY]=points.slice().pop();
    const head=make("polygon",{
      class:`arrow ${kind}`,
      points:[
        [endX,endY],
        [endX-metrics.head,endY-metrics.half],
        [endX-metrics.head,endY+metrics.half]
      ].map(([x,y])=>`${sx(x)},${sy(y)}`).join(" ")
    });
    layer.appendChild(head);
  }

  for(const [kind,x,y,w,h,labels] of diagram.nodes){
    const group=make("g",{class:`node ${kind}`});
    group.appendChild(make("rect",{
      x:sx(x),
      y:sy(y),
      width:sx(x+w)-sx(x),
      height:sy(y+h)-sy(y),
      rx:sx(metrics.radius)-sx(0),
      ry:sy(metrics.radius)-sy(0)
    }));

    for(const [value,textX,textY,textClass] of labels){
      const label=make("text",{
        x:sx(textX),
        y:sy(textY),
        "text-anchor":"middle",
        class:textClass
      });
      label.textContent=value;
      group.appendChild(label);
    }
    layer.appendChild(group);
  }

  for(const [value,x,y] of diagram.captions){
    const label=make("text",{
      x:sx(x),
      y:sy(y),
      "text-anchor":"middle",
      class:"caption"
    });
    label.textContent=value;
    layer.appendChild(label);
  }
}catch(error){
  document.getElementById("layer").replaceChildren();
  document.getElementById("fallback").hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
