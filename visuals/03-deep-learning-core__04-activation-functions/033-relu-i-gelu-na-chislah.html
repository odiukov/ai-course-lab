<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReLU и GELU на входах −1 и 1</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --ink: #182230;
      --muted: #58677a;
      --axis: #526071;
      --guide: #cbd4df;
      --relu: #d1495b;
      --gelu: #2563b9;
      --relu-soft: #fff0f2;
      --gelu-soft: #edf5ff;
      --fallback: #8b2635;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      background: var(--bg);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      line-height: normal;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--bg);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.2;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      fill: none;
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .relu-curve {
      fill: none;
      stroke: var(--relu);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .gelu-curve {
      fill: none;
      stroke: var(--gelu);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .relu-point {
      fill: var(--relu-soft);
      stroke: var(--relu);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .gelu-point {
      fill: var(--gelu-soft);
      stroke: var(--gelu);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .callout {
      fill: none;
      stroke: var(--relu);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    text {
      font-size: 16px;
      fill: var(--ink);
      paint-order: stroke;
      stroke: var(--bg);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .axis-label,
    .tick-label {
      fill: var(--muted);
      font-size: 15px;
    }

    .value-label {
      font-size: 17px;
      font-weight: 650;
    }

    .relu-text {
      fill: var(--relu);
    }

    .gelu-text {
      fill: var(--gelu);
    }

    .curve-label {
      font-size: 18px;
      font-weight: 750;
    }

    .annotation-label {
      fill: var(--relu);
      font-size: 16px;
      font-weight: 650;
    }

    #fallback {
      margin: 0;
      color: var(--fallback);
      text-align: center;
      font-size: 17px;
    }

    #fallback[hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101722;
        --ink: #edf3fa;
        --muted: #aebbc9;
        --axis: #a8b5c4;
        --guide: #394656;
        --relu: #ff7888;
        --gelu: #70adff;
        --relu-soft: #381b24;
        --gelu-soft: #142c4a;
        --fallback: #ff9baa;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">ReLU и GELU на входах −1 и 1</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 455"
      width="960"
      height="455"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <desc id="diagram-desc">
        Сравнение ReLU и GELU: ReLU имеет плоскую отрицательную половину и
        резкий угол в нуле, а GELU проходит через ноль плавно. Отмечены
        значения функций при входах −1 и 1.
      </desc>
      <g id="plot"></g>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать плоскую отрицательную половину ReLU,
      плавную кривую GELU и значения обеих функций при входах −1 и 1.
    </p>

    <noscript>
      Схема показывает: relu(−1)=0, gelu(−1)≈−0,159,
      relu(1)=1 и gelu(1)≈0,841.
    </noscript>
  </figure>

  <script>
    const diagramData = Object.freeze([
      [480, 327],
      126,
      0,
      1,
      2,
      0.5,
      0.044715,
      [-2.45, 0],
      [2.45, 0],
      [0, -0.72],
      [0, 2.35],
      [[2.45, 0], [2.33, 0.07], [2.33, -0.07]],
      [[0, 2.35], [-0.07, 2.23], [0.07, 2.23]],
      -2.15,
      2.15,
      0.025,
      0.0001,
      [[-2.15, 0], [0, 0], [2.15, 2.15]],
      [[-1, -0.35], [-1, 1.35]],
      [[1, -0.35], [1, 1.35]],
      [[-0.055, 1], [0.055, 1]],
      [[-1, -0.055], [-1, 0.055]],
      [[1, -0.055], [1, 0.055]],
      0.055,
      [
        [[-1, 0], "relu-point", "relu(−1)=0", "relu-text", "end", -18, -22],
        [[-1, -0.159], "gelu-point", "gelu(−1)≈−0,159", "gelu-text", "end", -18, 35],
        [[1, 1], "relu-point", "relu(1)=1", "relu-text", "start", 18, -24],
        [[1, 0.841], "gelu-point", "gelu(1)≈0,841", "gelu-text", "start", 18, 35]
      ],
      [
        [[-1, 0], "−1", "middle", 0, 29],
        [[0, 0], "0", "end", -9, 27],
        [[1, 0], "1", "middle", 0, 29],
        [[0, 1], "1", "end", -13, 5]
      ],
      [-1.72, 0.54],
      [-1.72, 0.08],
      [[-1.72, 0.08], [-1.79, 0.18], [-1.65, 0.18]],
      "плоская отрицательная половина",
      [
        [1.78, "ReLU", "relu-text", "start", 17, -12],
        [1.95, "GELU", "gelu-text", "start", 17, 24]
      ],
      [2.45, 0],
      [0, 2.35],
      "вход x",
      "выход",
      -7,
      -15,
      16,
      20
    ]);

    const [
      origin,
      scale,
      ZERO,
      ONE,
      TWO,
      HALF,
      GELU_CUBIC,
      xAxisStart,
      xAxisEnd,
      yAxisStart,
      yAxisEnd,
      xArrow,
      yArrow,
      curveStart,
      curveEnd,
      sampleStep,
      epsilon,
      reluPoints,
      leftGuide,
      rightGuide,
      yOneTick,
      xMinusOneTick,
      xPlusOneTick,
      pointRadius,
      valuePoints,
      tickLabels,
      calloutTail,
      calloutHead,
      calloutArrow,
      calloutLabel,
      curveLabels,
      xAxisLabelAnchor,
      yAxisLabelAnchor,
      xAxisLabel,
      yAxisLabel,
      xLabelDx,
      xLabelDy,
      yLabelDx,
      yLabelDy
    ] = diagramData;

    const toPx = ([x, y]) => [
      origin[ZERO] + x * scale,
      origin[ONE] - y * scale
    ];

    try {
      const NS = "http://www.w3.org/2000/svg";
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");

      const create = (name, className) => {
        const element = document.createElementNS(NS, name);
        if (className) element.setAttribute("class", className);
        return element;
      };

      const setAttributes = (element, attributes) => {
        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        return element;
      };

      const appendLine = (parent, start, end, className) => {
        const [x1, y1] = toPx(start);
        const [x2, y2] = toPx(end);
        const element = setAttributes(create("line", className), {
          x1,
          y1,
          x2,
          y2
        });
        parent.appendChild(element);
        return element;
      };

      const appendPolyline = (parent, points, className) => {
        const mapped = points
          .map((point) => toPx(point).join(","))
          .join(" ");
        const element = setAttributes(create("polyline", className), {
          points: mapped
        });
        parent.appendChild(element);
        return element;
      };

      const appendPath = (parent, points, className) => {
        const pathData = points
          .map((point, index) => {
            const [x, y] = toPx(point);
            return `${index === ZERO ? "M" : "L"} ${x} ${y}`;
          })
          .join(" ");
        const element = setAttributes(create("path", className), {
          d: pathData
        });
        parent.appendChild(element);
        return element;
      };

      const appendText = (
        parent,
        anchor,
        label,
        className,
        textAnchor,
        dx,
        dy
      ) => {
        const [x, y] = toPx(anchor);
        const element = setAttributes(create("text", className), {
          x,
          y,
          dx,
          dy,
          "text-anchor": textAnchor
        });
        element.textContent = label;
        parent.appendChild(element);
        return element;
      };

      const appendPoint = (parent, point, className) => {
        const [cx, cy] = toPx(point);
        const [radiusX] = toPx([pointRadius, ZERO]);
        const [zeroX] = toPx([ZERO, ZERO]);
        const element = setAttributes(create("circle", className), {
          cx,
          cy,
          r: Math.abs(radiusX - zeroX)
        });
        parent.appendChild(element);
        return element;
      };

      const gelu = (x) =>
        HALF *
        x *
        (
          ONE +
          Math.tanh(
            Math.sqrt(TWO / Math.PI) *
            (x + GELU_CUBIC * x * x * x)
          )
        );

      const geluPoints = [];
      for (
        let x = curveStart;
        x <= curveEnd + epsilon;
        x += sampleStep
      ) {
        geluPoints.push([x, gelu(x)]);
      }

      appendLine(plot, leftGuide[ZERO], leftGuide[ONE], "guide");
      appendLine(plot, rightGuide[ZERO], rightGuide[ONE], "guide");

      appendLine(plot, xAxisStart, xAxisEnd, "axis");
      appendLine(plot, yAxisStart, yAxisEnd, "axis");
      appendPolyline(plot, xArrow, "axis");
      appendPolyline(plot, yArrow, "axis");

      appendLine(plot, yOneTick[ZERO], yOneTick[ONE], "tick");
      appendLine(plot, xMinusOneTick[ZERO], xMinusOneTick[ONE], "tick");
      appendLine(plot, xPlusOneTick[ZERO], xPlusOneTick[ONE], "tick");

      appendPath(plot, geluPoints, "gelu-curve");
      appendPath(plot, reluPoints, "relu-curve");

      appendLine(plot, calloutTail, calloutHead, "callout");
      appendPolyline(plot, calloutArrow, "callout");
      appendText(
        plot,
        calloutTail,
        calloutLabel,
        "annotation-label",
        "middle",
        0,
        -12
      );

      valuePoints.forEach(
        ([point, pointClass, label, textClass, anchor, dx, dy]) => {
          appendPoint(plot, point, pointClass);
          appendText(
            plot,
            point,
            label,
            `value-label ${textClass}`,
            anchor,
            dx,
            dy
          );
        }
      );

      tickLabels.forEach(([point, label, anchor, dx, dy]) => {
        appendText(
          plot,
          point,
          label,
          "tick-label",
          anchor,
          dx,
          dy
        );
      });

      curveLabels.forEach(
        ([x, label, textClass, anchor, dx, dy]) => {
          const point = [x, label === "ReLU" ? x : gelu(x)];
          appendText(
            plot,
            point,
            label,
            `curve-label ${textClass}`,
            anchor,
            dx,
            dy
          );
        }
      );

      appendText(
        plot,
        xAxisLabelAnchor,
        xAxisLabel,
        "axis-label",
        "end",
        xLabelDx,
        xLabelDy
      );

      appendText(
        plot,
        yAxisLabelAnchor,
        yAxisLabel,
        "axis-label",
        "start",
        yLabelDx,
        yLabelDy
      );

      fallback.hidden = true;
    } catch (error) {
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      if (plot) plot.setAttribute("visibility", "hidden");
      if (fallback) fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
