<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Что остаётся от градиента после десяти sigmoid-слоёв</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --ink: #172033;
      --muted: #58657a;
      --line: #9aa8bb;
      --line-soft: #d5dde8;
      --accent: #2563eb;
      --accent-strong: #1748b3;
      --accent-soft: #dbeafe;
      --signal: #f59e0b;
      --signal-soft: #fef3c7;
      --faint: #eef2ff;
      --danger: #b42318;
      --shadow: rgba(23, 32, 51, .08);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1320;
        --panel: #151e2d;
        --panel-soft: #1b2638;
        --ink: #edf3ff;
        --muted: #aebbd0;
        --line: #708096;
        --line-soft: #334258;
        --accent: #79a8ff;
        --accent-strong: #a9c7ff;
        --accent-soft: #203b66;
        --signal: #f8bd4d;
        --signal-soft: #4a3619;
        --faint: #202c49;
        --danger: #ff9b8f;
        --shadow: rgba(0, 0, 0, .22);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 16px 12px;
      background: var(--page);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -.01em;
    }

    .frame {
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line-soft);
      box-shadow: 0 4px 18px var(--shadow);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
    }

    .intro {
      fill: var(--muted);
      font-size: 16px;
    }

    .direction {
      fill: var(--accent-strong);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: .02em;
    }

    .layer-box {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .layer-box.faint {
      fill: var(--faint);
    }

    .layer-name {
      font-size: 15px;
      font-weight: bold;
    }

    .factor {
      fill: var(--accent-strong);
      font-size: 13px;
      font-weight: bold;
    }

    .output-box {
      fill: var(--signal-soft);
      stroke: var(--signal);
    }

    .output-title {
      font-size: 15px;
      font-weight: bold;
    }

    .output-value {
      fill: var(--signal);
      font-size: 18px;
      font-weight: bold;
    }

    .flow {
      stroke: var(--accent);
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .milestone-dot {
      fill: var(--panel);
      stroke: var(--accent);
    }

    .milestone-kicker {
      fill: var(--muted);
      font-size: 12px;
    }

    .milestone-value {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .result-box {
      fill: var(--signal-soft);
      stroke: var(--signal);
    }

    .result-main {
      fill: var(--ink);
      font-size: 19px;
      font-weight: bold;
    }

    .result-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .summary-line {
      stroke: var(--line-soft);
    }

    .summary {
      fill: var(--muted);
      font-size: 14px;
    }

    #fallback {
      margin: 0;
      padding: 18px;
      color: var(--danger);
      background: var(--panel);
      font-size: 16px;
    }

    #fallback[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Что остаётся от градиента после десяти sigmoid-слоёв</h1>

    <div class="frame">
      <svg id="diagram"
           viewBox="0 0 1180 390"
           width="1180"
           height="390"
           preserveAspectRatio="xMidYMid meet"
           role="img"
           aria-labelledby="diagram-title diagram-description">
        <desc id="diagram-description">
          Обратный путь градиента величиной один через десять sigmoid-слоёв.
          Каждый слой пропускает не больше четверти сигнала, поэтому к первому
          слою приходит примерно 0,00000095.
        </desc>
      </svg>

      <p id="fallback">
        Схема должна была показать цепочку из 10 sigmoid-слоёв: на каждом
        градиент умножается не больше чем на 0,25, а у первого слоя остаётся
        0,25¹⁰ ≈ 0,00000095 исходного сигнала.
      </p>

      <noscript>
        <p>
          Цепочка из 10 sigmoid-слоёв: каждый пропускает не больше 0,25
          градиента; итог у первого слоя — 0,25¹⁰ ≈ 0,00000095.
        </p>
      </noscript>
    </div>
  </main>

  <script>
    const data = [
      {
        zero: 0,
        one: 1,
        canvas: { width: 1180, height: 390 },
        geometry: {
          flowY: 1.48,
          cardTop: 1.02,
          cardBottom: 1.94,
          cardHalf: 0.38,
          cardRound: 0.08,
          nameY: 1.38,
          factorY: 1.68,
          arrowHalf: 0.075,
          arrowLength: 0.13,
          outputX: 11.05,
          outputHalf: 0.53,
          outputTop: 0.90,
          outputBottom: 2.06,
          outputTitleY: 1.31,
          outputValueY: 1.72,
          directionY: 0.64,
          directionStart: 10.70,
          directionEnd: 8.85,
          introX: 0.02,
          introY: 0.34,
          calloutStartY: 2.10,
          calloutElbowY: 2.30,
          resultTop: 2.44,
          resultBottom: 3.18,
          resultLeft: 0.02,
          resultRight: 3.43,
          resultRound: 0.10,
          resultMainY: 2.77,
          resultNoteY: 3.02,
          milestoneY: 2.59,
          milestoneValueY: 2.83,
          milestoneKickerY: 3.06,
          summaryRuleY: 3.40,
          summaryY: 3.69,
          summaryX: 5.65,
          dotRadius: 0.055
        },
        typography: {
          intro: 16,
          direction: 14,
          layer: 15,
          factor: 13,
          outputTitle: 15,
          outputValue: 18,
          milestoneKicker: 12,
          milestoneValue: 15,
          resultMain: 19,
          resultNote: 13,
          summary: 14
        },
        strokes: {
          box: 2,
          flow: 3,
          faintFlow: 2,
          connector: 1.5,
          dot: 2,
          rule: 1
        },
        labels: {
          intro: "Градиент идёт от выхода к первому слою",
          direction: "обратный ход",
          outputTitle: "выход",
          outputValue: "градиент 1",
          factor: "× ≤ 0,25",
          resultMain: "у слоя 1: 0,25¹⁰ ≈ 0,00000095",
          resultNote: "примерно одна миллионная исходного сигнала",
          summary: "1  →  ≤ 0,25  →  ≤ 0,0625  →  ≈ 0,001  →  ≈ 0,00000095"
        }
      },
      { layer: "слой 1",  x: 0.43, alpha: "faint" },
      { layer: "слой 2",  x: 1.45, alpha: "faint" },
      { layer: "слой 3",  x: 2.47, alpha: "faint" },
      { layer: "слой 4",  x: 3.49, alpha: "faint" },
      { layer: "слой 5",  x: 4.51, alpha: "faint" },
      {
        layer: "слой 6",
        x: 5.53,
        alpha: "faint",
        milestone: { value: "≈ 0,001", kicker: "после 5 слоёв", side: "middle" }
      },
      { layer: "слой 7",  x: 6.55, alpha: "faint" },
      { layer: "слой 8",  x: 7.57, alpha: "faint" },
      {
        layer: "слой 9",
        x: 8.59,
        alpha: "",
        milestone: { value: "≤ 0,0625", kicker: "после 2 слоёв", side: "middle" }
      },
      {
        layer: "слой 10",
        x: 9.61,
        alpha: "",
        milestone: { value: "≤ 0,25", kicker: "после 1 слоя", side: "middle" }
      }
    ];

    const origin = Object.freeze({ x: 72, y: 28 });
    const scale = Object.freeze({ x: 91, y: 94 });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const [config, ...layers] = data;
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";
      const g = config.geometry;
      const labels = config.labels;
      const strokes = config.strokes;

      const make = (name, attrs, parent = svg) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        parent.appendChild(node);
        return node;
      };

      const write = (value, attrs, parent = svg) => {
        const node = make("text", attrs, parent);
        node.textContent = value;
        return node;
      };

      const roundedRect = (left, top, right, bottom, className, parent = svg) =>
        make("rect", {
          x: sx(left),
          y: sy(top),
          width: sx(right) - sx(left),
          height: sy(bottom) - sy(top),
          rx: sx(g.cardRound) - sx(config.zero),
          class: className,
          "stroke-width": strokes.box
        }, parent);

      const arrow = (startX, endX, y, faint, parent = svg) => {
        make("line", {
          x1: sx(startX),
          y1: sy(y),
          x2: sx(endX),
          y2: sy(y),
          class: "flow",
          "stroke-width": faint ? strokes.faintFlow : strokes.flow
        }, parent);

        make("polygon", {
          points: [
            [sx(endX), sy(y)],
            [sx(endX + g.arrowLength), sy(y - g.arrowHalf)],
            [sx(endX + g.arrowLength), sy(y + g.arrowHalf)]
          ].map(point => point.join(",")).join(" "),
          class: "arrow-head"
        }, parent);
      };

      const introGroup = make("g", { "aria-hidden": "true" });
      write(labels.intro, {
        x: sx(g.introX),
        y: sy(g.introY),
        class: "intro",
        "text-anchor": "start",
        "font-size": config.typography.intro
      }, introGroup);

      arrow(g.directionStart, g.directionEnd, g.directionY, false, introGroup);
      write(labels.direction, {
        x: sx(g.directionStart),
        y: sy(g.directionY),
        dx: -8,
        dy: -8,
        class: "direction",
        "text-anchor": "end",
        "font-size": config.typography.direction
      }, introGroup);

      const outputLeft = g.outputX - g.outputHalf;
      const outputRight = g.outputX + g.outputHalf;
      roundedRect(
        outputLeft,
        g.outputTop,
        outputRight,
        g.outputBottom,
        "output-box"
      );

      write(labels.outputTitle, {
        x: sx(g.outputX),
        y: sy(g.outputTitleY),
        class: "output-title",
        "text-anchor": "middle",
        "font-size": config.typography.outputTitle
      });

      write(labels.outputValue, {
        x: sx(g.outputX),
        y: sy(g.outputValueY),
        class: "output-value",
        "text-anchor": "middle",
        "font-size": config.typography.outputValue
      });

      let previousLeft = outputLeft;
      [...layers].reverse().forEach(layer => {
        const right = layer.x + g.cardHalf;
        arrow(previousLeft, right, g.flowY, layer.alpha === "faint");
        previousLeft = layer.x - g.cardHalf;
      });

      layers.forEach(layer => {
        const left = layer.x - g.cardHalf;
        const right = layer.x + g.cardHalf;
        roundedRect(
          left,
          g.cardTop,
          right,
          g.cardBottom,
          `layer-box ${layer.alpha}`.trim()
        );

        write(layer.layer, {
          x: sx(layer.x),
          y: sy(g.nameY),
          class: "layer-name",
          "text-anchor": "middle",
          "font-size": config.typography.layer
        });

        write(labels.factor, {
          x: sx(layer.x),
          y: sy(g.factorY),
          class: "factor",
          "text-anchor": "middle",
          "font-size": config.typography.factor
        });
      });

      layers.filter(layer => layer.milestone).forEach(layer => {
        const milestone = layer.milestone;

        make("polyline", {
          points: [
            [sx(layer.x), sy(g.calloutStartY)],
            [sx(layer.x), sy(g.calloutElbowY)],
            [sx(layer.x), sy(g.milestoneY)]
          ].map(point => point.join(",")).join(" "),
          class: "connector",
          "stroke-width": strokes.connector
        });

        make("circle", {
          cx: sx(layer.x),
          cy: sy(g.milestoneY),
          r: sx(g.dotRadius) - sx(config.zero),
          class: "milestone-dot",
          "stroke-width": strokes.dot
        });

        write(milestone.value, {
          x: sx(layer.x),
          y: sy(g.milestoneValueY),
          class: "milestone-value",
          "text-anchor": milestone.side,
          "font-size": config.typography.milestoneValue
        });

        write(milestone.kicker, {
          x: sx(layer.x),
          y: sy(g.milestoneKickerY),
          class: "milestone-kicker",
          "text-anchor": milestone.side,
          "font-size": config.typography.milestoneKicker
        });
      });

      roundedRect(
        g.resultLeft,
        g.resultTop,
        g.resultRight,
        g.resultBottom,
        "result-box"
      );

      write(labels.resultMain, {
        x: sx(g.resultLeft),
        y: sy(g.resultMainY),
        dx: 14,
        class: "result-main",
        "text-anchor": "start",
        "font-size": config.typography.resultMain
      });

      write(labels.resultNote, {
        x: sx(g.resultLeft),
        y: sy(g.resultNoteY),
        dx: 14,
        class: "result-note",
        "text-anchor": "start",
        "font-size": config.typography.resultNote
      });

      make("line", {
        x1: sx(g.introX),
        y1: sy(g.summaryRuleY),
        x2: sx(outputRight),
        y2: sy(g.summaryRuleY),
        class: "summary-line",
        "stroke-width": strokes.rule
      });

      write(labels.summary, {
        x: sx(g.summaryX),
        y: sy(g.summaryY),
        class: "summary",
        "text-anchor": "middle",
        "font-size": config.typography.summary
      });

      fallback.hidden = true;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
