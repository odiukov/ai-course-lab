<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Как два линейных слоя схлопываются в один</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --panel: #ffffff;
      --box: #e9efff;
      --box-strong: #dce7ff;
      --result: #dcf6e8;
      --footer: #f1edff;
      --text: #182033;
      --muted: #59657a;
      --line: #4868ad;
      --line-strong: #244b9b;
      --result-line: #168154;
      --divider: #aab4c8;
      --error: #a32626;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151923;
        --panel: #1c2230;
        --box: #253454;
        --box-strong: #2c416c;
        --result: #193d31;
        --footer: #30294a;
        --text: #edf2ff;
        --muted: #b9c3d8;
        --line: #8eaeef;
        --line-strong: #b5caff;
        --result-line: #62d6a3;
        --divider: #59657b;
        --error: #ff9b9b;
      }
    }

    html,
    body,
    figure {
      margin: unset;
      background: var(--bg);
      color: var(--text);
    }

    figure {
      border: 2px solid var(--divider);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h2 {
      margin: 8px;
      font-size: 18px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--bg);
    }

    .background {
      fill: var(--bg);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--divider);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .node {
      fill: var(--box);
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .combined {
      fill: var(--box-strong);
      stroke: var(--line-strong);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .result {
      fill: var(--result);
      stroke: var(--result-line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .footer {
      fill: var(--footer);
      stroke: var(--divider);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .divider {
      stroke: var(--divider);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .arrow {
      stroke: var(--line-strong);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--line-strong);
    }

    .label {
      fill: var(--text);
      font-size: 15px;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
    }

    .heading {
      fill: var(--text);
      font-size: 16px;
      font-weight: bold;
    }

    .formula {
      fill: var(--line-strong);
      font-size: 15px;
      font-weight: bold;
    }

    .output {
      fill: var(--result-line);
      font-size: 15px;
      font-weight: bold;
    }

    .equivalent {
      fill: var(--line-strong);
      font-size: 18px;
      font-weight: bold;
    }

    .error {
      fill: var(--error);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure>
    <h2>Два линейных слоя = один объединённый слой</h2>
    <svg
      id="diagram"
      width="1000"
      height="430"
      viewBox="0 0 1000 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <title id="diagram-title">Как два линейных слоя схлопываются в один</title>
      <desc id="diagram-description">
        Длинная цепочка x, затем W1x плюс b1, затем W2h плюс b2,
        сопоставлена с эквивалентным преобразованием Ax плюс c.
      </desc>
    </svg>
  </figure>

  <script>
    const data = [
      {
        origin: [0, 0],
        scale: [10, 10],
        background: [[0, 0], [100, 43]],
        fallbackAnchor: [50, 20],
        fallbackLines: [
          [50, 19, "Схема должна была показать:"],
          [50, 21.5, "x → W₁x + b₁ → W₂h + b₂  эквивалентно  x → Ax + c"],
          [50, 24, "A = W₂W₁,  c = W₂b₁ + b₂"]
        ]
      },
      [
        { box: [[2, 1], [48, 16.5]], className: "panel" },
        { box: [[52, 1], [98, 16.5]], className: "panel" },

        { box: [[4, 7], [10, 12]], className: "node" },
        { box: [[14, 5], [27, 14]], className: "node" },
        { box: [[33, 5], [46, 14]], className: "node" },

        { box: [[54, 7], [60, 12]], className: "node" },
        { box: [[66, 5], [92, 14]], className: "combined" },

        { box: [[2, 19], [48, 35.5]], className: "panel" },
        { box: [[52, 19], [98, 35.5]], className: "panel" },

        { box: [[4, 21], [10, 26.5]], className: "node" },
        { box: [[14, 21], [27, 26.5]], className: "node" },
        { box: [[33, 21], [46, 26.5]], className: "result" },

        { box: [[54, 21], [60, 26.5]], className: "node" },
        { box: [[66, 21], [92, 26.5]], className: "result" },

        { box: [[4, 28.5], [10, 34]], className: "node" },
        { box: [[14, 28.5], [27, 34]], className: "node" },
        { box: [[33, 28.5], [46, 34]], className: "result" },

        { box: [[54, 28.5], [60, 34]], className: "node" },
        { box: [[66, 28.5], [92, 34]], className: "result" },

        { box: [[2, 37], [98, 42]], className: "footer" }
      ],
      [
        { from: [50, 1], to: [50, 16.5], className: "divider" },
        { from: [50, 19], to: [50, 35.5], className: "divider" }
      ],
      [
        {
          shaft: [[10, 9.5], [14, 9.5]],
          head: [[14, 9.5], [13.2, 9], [13.2, 10]]
        },
        {
          shaft: [[27, 9.5], [33, 9.5]],
          head: [[33, 9.5], [32.2, 9], [32.2, 10]]
        },
        {
          shaft: [[60, 9.5], [66, 9.5]],
          head: [[66, 9.5], [65.2, 9], [65.2, 10]]
        },

        {
          shaft: [[10, 23.75], [14, 23.75]],
          head: [[14, 23.75], [13.2, 23.25], [13.2, 24.25]]
        },
        {
          shaft: [[27, 23.75], [33, 23.75]],
          head: [[33, 23.75], [32.2, 23.25], [32.2, 24.25]]
        },
        {
          shaft: [[60, 23.75], [66, 23.75]],
          head: [[66, 23.75], [65.2, 23.25], [65.2, 24.25]]
        },

        {
          shaft: [[10, 31.25], [14, 31.25]],
          head: [[14, 31.25], [13.2, 30.75], [13.2, 31.75]]
        },
        {
          shaft: [[27, 31.25], [33, 31.25]],
          head: [[33, 31.25], [32.2, 30.75], [32.2, 31.75]]
        },
        {
          shaft: [[60, 31.25], [66, 31.25]],
          head: [[66, 31.25], [65.2, 30.75], [65.2, 31.75]]
        }
      ],
      [
        {
          at: [25, 3],
          text: "Длинный маршрут: два слоя",
          anchor: "middle",
          className: "heading"
        },
        {
          at: [75, 3],
          text: "Короткий маршрут: один слой",
          anchor: "middle",
          className: "heading"
        },

        {
          at: [7, 9.5],
          text: "x",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [20.5, 7.5],
          text: "1-й слой",
          anchor: "middle",
          className: "small"
        },
        {
          at: [20.5, 10.5],
          text: "h = W₁x + b₁",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [39.5, 7.5],
          text: "2-й слой",
          anchor: "middle",
          className: "small"
        },
        {
          at: [39.5, 10.5],
          text: "y = W₂h + b₂",
          anchor: "middle",
          className: "formula"
        },

        {
          at: [57, 9.5],
          text: "x",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [79, 7.5],
          text: "объединённый слой",
          anchor: "middle",
          className: "small"
        },
        {
          at: [79, 10.5],
          text: "y = Ax + c",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [50, 9.5],
          text: "≡",
          anchor: "middle",
          className: "equivalent"
        },

        {
          at: [25, 17.8],
          text: "Сначала промежуточное h, затем выход y",
          anchor: "middle",
          className: "small"
        },
        {
          at: [75, 17.8],
          text: "Тот же выход сразу из x",
          anchor: "middle",
          className: "small"
        },

        {
          at: [7, 23.75],
          text: "4",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [20.5, 23.75],
          text: "2·4 + 1 = 9",
          anchor: "middle",
          className: "label"
        },
        {
          at: [39.5, 23.75],
          text: "3·9 = 27",
          anchor: "middle",
          className: "output"
        },
        {
          at: [57, 23.75],
          text: "4",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [79, 23.75],
          text: "6·4 + 3 = 27",
          anchor: "middle",
          className: "output"
        },

        {
          at: [7, 31.25],
          text: "7",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [20.5, 31.25],
          text: "2·7 + 1 = 15",
          anchor: "middle",
          className: "label"
        },
        {
          at: [39.5, 31.25],
          text: "3·15 = 45",
          anchor: "middle",
          className: "output"
        },
        {
          at: [57, 31.25],
          text: "7",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [79, 31.25],
          text: "6·7 + 3 = 45",
          anchor: "middle",
          className: "output"
        },

        {
          at: [17, 39.5],
          text: "A = W₂W₁",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [50, 39.5],
          text: "c = W₂b₁ + b₂",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [82, 39.5],
          text: "y = Ax + c",
          anchor: "middle",
          className: "formula"
        },
        {
          at: [50, 41.3],
          text: "Матрицы перемножаются, а сдвиги собираются — для любого входа x",
          anchor: "middle",
          className: "small"
        }
      ]
    ];

    const [
      settings,
      rectangles,
      lines,
      arrows,
      labels
    ] = data;

    const { origin, scale } = settings;

    function toPx(point) {
      const [x, y] = point;
      const [originX, originY] = origin;
      const [scaleX, scaleY] = scale;

      return {
        x: originX + x * scaleX,
        y: originY + y * scaleY
      };
    }

    const svg = document.getElementById("diagram");
    const namespace = "http://www.w3.org/2000/svg";

    try {
      function create(name, attributes, className) {
        const node = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, value);
        });

        if (className) {
          node.setAttribute("class", className);
        }

        return node;
      }

      function appendRectangle(box, className) {
        const [startPoint, endPoint] = box;
        const start = toPx(startPoint);
        const end = toPx(endPoint);

        svg.appendChild(
          create(
            "rect",
            {
              x: start.x,
              y: start.y,
              width: end.x - start.x,
              height: end.y - start.y
            },
            className
          )
        );
      }

      function appendLine(from, to, className) {
        const start = toPx(from);
        const end = toPx(to);

        svg.appendChild(
          create(
            "line",
            {
              x1: start.x,
              y1: start.y,
              x2: end.x,
              y2: end.y
            },
            className
          )
        );
      }

      function appendText(item) {
        const position = toPx(item.at);
        const text = create(
          "text",
          {
            x: position.x,
            y: position.y,
            "text-anchor": item.anchor,
            "dominant-baseline": "middle"
          },
          item.className
        );

        text.textContent = item.text;
        svg.appendChild(text);
      }

      appendRectangle(settings.background, "background");

      rectangles.forEach((item) => {
        appendRectangle(item.box, item.className);
      });

      lines.forEach((item) => {
        appendLine(item.from, item.to, item.className);
      });

      arrows.forEach((item) => {
        const [from, to] = item.shaft;
        appendLine(from, to, "arrow");

        const points = item.head
          .map((point) => {
            const position = toPx(point);
            return `${position.x},${position.y}`;
          })
          .join(" ");

        svg.appendChild(
          create("polygon", { points }, "arrow-head")
        );
      });

      labels.forEach(appendText);
    } catch (error) {
      svg.replaceChildren();

      settings.fallbackLines.forEach((line) => {
        const [x, y, message] = line;
        const position = toPx([x, y]);
        const text = document.createElementNS(namespace, "text");

        text.setAttribute("x", position.x);
        text.setAttribute("y", position.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("class", "error");
        text.textContent = message;
        svg.appendChild(text);
      });
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
