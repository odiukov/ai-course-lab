<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как размер выборки отодвигает обвал</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf6;
    --ink: #202833;
    --muted: #586574;
    --axis: #3e4b59;
    --grid: #d9dee4;
    --focus: #8b6415;
    --c1: #c9443a;
    --c2: #9151bd;
    --c3: #2475bd;
    --c4: #168258;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12171e;
      --ink: #edf1f5;
      --muted: #b5c0ca;
      --axis: #c2cbd4;
      --grid: #333d48;
      --focus: #f0c55b;
      --c1: #ff7469;
      --c2: #c98bf0;
      --c3: #68b2f2;
      --c4: #55c990;
    }
  }

  html,
  body {
    margin: unset;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .figure {
    width: 100%;
    background: var(--bg);
  }

  .heading,
  .subheading,
  .fallback {
    margin: unset;
  }

  .heading {
    font-size: 20px;
    font-weight: bold;
  }

  .subheading {
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    overflow: visible;
    background: var(--bg);
  }

  svg text {
    font-family: inherit;
  }

  [hidden] {
    display: none;
  }

  .fallback {
    color: var(--ink);
    font-size: 14px;
  }
</style>
</head>
<body>
<figure class="figure" aria-labelledby="diagram-heading diagram-summary">
  <h2 class="heading" id="diagram-heading">Как размер выборки отодвигает обвал</h2>
  <p class="subheading" id="diagram-summary">
    Больше меток удлиняет безопасный участок, но не устраняет последующее падение.
  </p>
  <svg id="diagram" width="960" height="430" viewBox="0 0 960 430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Четыре кривые золотой награды. У каждой есть пик и спад, а при увеличении числа меток пик сдвигается вправо."></svg>
  <p class="fallback" id="fallback" hidden>
    Схема должна была показать четыре кривые золотой награды для прокси на
    1 000, 3 000, 10 000 и 30 000 меток: каждая достигает пика и падает,
    причём с ростом выборки пик сдвигается вправо.
  </p>
</figure>

<script>
const data = Object.freeze({
  zero: 0,
  bounds: {
    left: -1.6, right: 11.55, top: 7.05, bottom: -1.75
  },
  plot: {
    left: 0, right: 10.15, bottom: 0, top: 5.75
  },
  gridX: [2, 4, 6, 8, 10],
  gridY: [1, 2, 3, 4, 5],
  xArrow: [
    [10.55, 0], [10.08, 0.19], [10.08, -0.19]
  ],
  yArrow: [
    [0, 6.5], [-0.18, 6.02], [0.18, 6.02]
  ],
  peakArrow: {
    shaft: [[2.1, 6.12], [8.02, 6.12]],
    head: [[8.35, 6.12], [7.94, 6.31], [7.94, 5.93]],
    label: [5.05, 6.55]
  },
  labels: {
    yAxis: [0.18, 6.78],
    xAxis: [10.48, -0.57],
    legendPrefix: [0, -1.35]
  },
  marks: {
    radius: 0.075,
    dash: 0.09
  },
  curves: [
    {
      label: "1 000 меток",
      color: "var(--c1)",
      peak: [2.1, 3.85],
      legend: {
        start: [0.25, -1.35],
        end: [0.7, -1.35],
        text: [0.84, -1.35]
      },
      points: [
        [0.28, 1.24], [0.75, 1.82], [1.25, 2.65],
        [1.72, 3.46], [2.1, 3.85], [2.52, 3.68],
        [3.15, 3.16], [4.05, 2.62], [5.15, 2.12],
        [6.45, 1.67], [7.92, 1.18], [9.6, 0.72]
      ]
    },
    {
      label: "3 000 меток",
      color: "var(--c2)",
      peak: [3.82, 4.28],
      legend: {
        start: [2.74, -1.35],
        end: [3.19, -1.35],
        text: [3.33, -1.35]
      },
      points: [
        [0.28, 1.2], [0.82, 1.78], [1.48, 2.64],
        [2.18, 3.48], [3.02, 4.08], [3.82, 4.28],
        [4.42, 4.1], [5.2, 3.7], [6.22, 3.16],
        [7.38, 2.55], [8.55, 1.93], [9.6, 1.42]
      ]
    },
    {
      label: "10 000 меток",
      color: "var(--c3)",
      peak: [5.82, 4.8],
      legend: {
        start: [5.22, -1.35],
        end: [5.67, -1.35],
        text: [5.81, -1.35]
      },
      points: [
        [0.28, 1.16], [0.86, 1.76], [1.62, 2.58],
        [2.48, 3.4], [3.5, 4.08], [4.58, 4.55],
        [5.82, 4.8], [6.58, 4.62], [7.34, 4.17],
        [8.08, 3.58], [8.82, 2.91], [9.6, 2.27]
      ]
    },
    {
      label: "30 000 меток",
      color: "var(--c4)",
      peak: [7.62, 5.26],
      legend: {
        start: [7.8, -1.35],
        end: [8.25, -1.35],
        text: [8.39, -1.35]
      },
      points: [
        [0.28, 1.12], [0.9, 1.72], [1.72, 2.5],
        [2.7, 3.3], [3.8, 3.98], [5.02, 4.56],
        [6.28, 5.02], [7.62, 5.26], [8.18, 5.17],
        [8.72, 4.91], [9.18, 4.48], [9.6, 3.88]
      ]
    }
  ]
});

const origin = Object.freeze({ x: 120, y: 340 });
const scale = Object.freeze({ x: 72, y: 44 });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

const lineWidth = Object.freeze({
  grid: 1,
  axis: 1.8,
  guide: 1.3,
  curve: 3.4,
  peakArrow: 2.2,
  legend: 3.4
});

const fontSize = Object.freeze({
  axis: 15,
  annotation: 15,
  legend: 14
});

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  const element = (name, attributes = {}) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    return node;
  };

  const appendLine = (parent, start, end, attributes = {}) => {
    const node = element("line", {
      x1: sx(start[0]),
      y1: sy(start[1]),
      x2: sx(end[0]),
      y2: sy(end[1]),
      "vector-effect": "non-scaling-stroke",
      ...attributes
    });
    parent.appendChild(node);
    return node;
  };

  const appendPolygon = (parent, points, attributes = {}) => {
    const node = element("polygon", {
      points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
      ...attributes
    });
    parent.appendChild(node);
    return node;
  };

  const appendText = (parent, point, content, attributes = {}) => {
    const node = element("text", {
      x: sx(point[0]),
      y: sy(point[1]),
      ...attributes
    });
    node.textContent = content;
    parent.appendChild(node);
    return node;
  };

  const background = element("rect", {
    x: sx(data.bounds.left),
    y: sy(data.bounds.top),
    width: sx(data.bounds.right) - sx(data.bounds.left),
    height: sy(data.bounds.bottom) - sy(data.bounds.top),
    fill: "var(--bg)"
  });
  svg.appendChild(background);

  const grid = element("g", {
    stroke: "var(--grid)",
    "stroke-width": lineWidth.grid,
    "vector-effect": "non-scaling-stroke"
  });

  data.gridX.forEach(x => {
    appendLine(
      grid,
      [x, data.plot.bottom],
      [x, data.plot.top]
    );
  });

  data.gridY.forEach(y => {
    appendLine(
      grid,
      [data.plot.left, y],
      [data.plot.right, y]
    );
  });

  svg.appendChild(grid);

  const guides = element("g", {
    fill: "none",
    "stroke-width": lineWidth.guide,
    "stroke-dasharray":
      `${sx(data.marks.dash) - sx(data.zero)} ${sx(data.marks.dash) - sx(data.zero)}`,
    "vector-effect": "non-scaling-stroke"
  });

  data.curves.forEach(curve => {
    appendLine(
      guides,
      [curve.peak[0], data.plot.bottom],
      curve.peak,
      { stroke: curve.color }
    );
  });

  svg.appendChild(guides);

  const axes = element("g", {
    stroke: "var(--axis)",
    fill: "var(--axis)",
    "stroke-width": lineWidth.axis,
    "stroke-linecap": "round",
    "stroke-linejoin": "round",
    "vector-effect": "non-scaling-stroke"
  });

  appendLine(
    axes,
    [data.plot.left, data.plot.bottom],
    [data.plot.right, data.plot.bottom]
  );
  appendPolygon(axes, data.xArrow, { stroke: "none" });

  appendLine(
    axes,
    [data.plot.left, data.plot.bottom],
    [data.plot.left, data.plot.top + data.marks.radius]
  );
  appendPolygon(axes, data.yArrow, { stroke: "none" });
  svg.appendChild(axes);

  const curveLayer = element("g", {
    fill: "none",
    "stroke-linecap": "round",
    "stroke-linejoin": "round",
    "stroke-width": lineWidth.curve,
    "vector-effect": "non-scaling-stroke"
  });

  data.curves.forEach(curve => {
    const commands = curve.points.map((point, position) => {
      const command = position === data.zero ? "M" : "L";
      return `${command} ${sx(point[0])} ${sy(point[1])}`;
    });

    curveLayer.appendChild(element("path", {
      d: commands.join(" "),
      stroke: curve.color
    }));
  });

  svg.appendChild(curveLayer);

  const peaks = element("g", {
    stroke: "var(--bg)",
    "stroke-width": lineWidth.axis,
    "vector-effect": "non-scaling-stroke"
  });

  data.curves.forEach(curve => {
    peaks.appendChild(element("circle", {
      cx: sx(curve.peak[0]),
      cy: sy(curve.peak[1]),
      r: sx(data.marks.radius) - sx(data.zero),
      fill: curve.color
    }));
  });

  svg.appendChild(peaks);

  const shiftArrow = element("g", {
    stroke: "var(--focus)",
    fill: "var(--focus)",
    "stroke-width": lineWidth.peakArrow,
    "stroke-linecap": "round",
    "stroke-linejoin": "round",
    "vector-effect": "non-scaling-stroke"
  });

  appendLine(
    shiftArrow,
    data.peakArrow.shaft[0],
    data.peakArrow.shaft[1]
  );
  appendPolygon(shiftArrow, data.peakArrow.head, { stroke: "none" });
  svg.appendChild(shiftArrow);

  const labels = element("g", {
    fill: "var(--ink)"
  });

  appendText(
    labels,
    data.labels.yAxis,
    "Золотая награда",
    {
      "font-size": fontSize.axis,
      "font-weight": "bold",
      "text-anchor": "start"
    }
  );

  appendText(
    labels,
    data.labels.xAxis,
    "Сильнее изменение модели относительно исходной →",
    {
      "font-size": fontSize.axis,
      "text-anchor": "end"
    }
  );

  appendText(
    labels,
    data.peakArrow.label,
    "с ростом выборки пик сдвигается вправо",
    {
      fill: "var(--focus)",
      "font-size": fontSize.annotation,
      "font-weight": "bold",
      "text-anchor": "middle"
    }
  );

  appendText(
    labels,
    data.labels.legendPrefix,
    "Прокси:",
    {
      fill: "var(--muted)",
      "font-size": fontSize.legend,
      "font-weight": "bold",
      "text-anchor": "end",
      "dominant-baseline": "middle"
    }
  );

  data.curves.forEach(curve => {
    appendLine(
      labels,
      curve.legend.start,
      curve.legend.end,
      {
        stroke: curve.color,
        "stroke-width": lineWidth.legend,
        "stroke-linecap": "round"
      }
    );

    appendText(
      labels,
      curve.legend.text,
      curve.label,
      {
        "font-size": fontSize.legend,
        "text-anchor": "start",
        "dominant-baseline": "middle"
      }
    );
  });

  svg.appendChild(labels);
  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
