<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Путь звука до текста</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5d6672;
    --box:#eef2f8; --stroke:#3c4a5a; --accent:#1f6feb; --accent2:#b8860b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --fg:#e6ebf2; --muted:#9aa6b5;
      --box:#1e2732; --stroke:#8ea3bb; --accent:#61a5ff; --accent2:#e0b64a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:13px;line-height:1.5;color:var(--fg);}
  text{font-family:inherit;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Путь звука до текста: 5 с аудио → 1280 → 4096 → ответ</h2>
  <div id="host"><svg id="d" viewBox="0 0 960 400" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Схема: аудио пять секунд, энкодер, векторы 1280, projector, токены 4096, LLM-декодер, текст ответа"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    var SVG=document.getElementById("d");
    var NS="http://www.w3.org/2000/svg";

    /* ---- данные схемы (единицы схемы, не пиксели) ---- */
    var DATA={
      lane:{audio:0, prompt:-3.4},              /* y-дорожки */
      boxes:[
        {id:"enc",  x:6,  w:5.2, h:2.2, t:"audio encoder", s:"кадры по 25 мс"},
        {id:"prj",  x:14, w:5.2, h:2.2, t:"projector",     s:"1280 → 4096"},
        {id:"llm",  x:24, w:6.0, h:3.6, t:"LLM-декодер",   s:"читает ряд слева направо"}
      ],
      wave:{x:0.2, w:4.2, h:2.2},
      merge:{x:22.2},
      out:{x:31.6},
      ticks:[
        {x:11.2, lab:"ширина 1280", side:"up"},
        {x:19.2, lab:"ширина 4096", side:"down"}
      ]
    };

    /* ---- одна пара функций перевода ---- */
    var ORIGIN={x:70, y:250}, SCALE={x:26, y:26};
    function sx(x){ return ORIGIN.x + x*SCALE.x; }
    function sy(y){ return ORIGIN.y - y*SCALE.y; }

    /* ---- литеральные константы оформления ---- */
    var LW=1.6, FS=13, FS_S=11, PAD=7;

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); SVG.appendChild(e); return e; }
    function txt(x,y,s,anchor,size,cls){
      var t=el("text",{x:x,y:y,"text-anchor":anchor,"font-size":size,
        "dominant-baseline":"middle"});
      if(cls) t.setAttribute("fill",cls);
      t.textContent=s; return t;
    }

    /* маркер стрелки */
    var defs=el("defs",{});
    function marker(id,color){
      var m=document.createElementNS(NS,"marker");
      m.setAttribute("id",id); m.setAttribute("viewBox","0 0 10 10");
      m.setAttribute("refX","9"); m.setAttribute("refY","5");
      m.setAttribute("markerWidth","7"); m.setAttribute("markerHeight","7");
      m.setAttribute("orient","auto-start-reverse");
      var p=document.createElementNS(NS,"path");
      p.setAttribute("d","M 0 0 L 10 5 L 0 10 z"); p.setAttribute("fill",color);
      m.appendChild(p); defs.appendChild(m);
    }
    marker("ar","var(--stroke)");
    marker("ar2","var(--accent2)");

    function box(b,laneY){
      var x0=sx(b.x), x1=sx(b.x+b.w);
      var y0=sy(laneY+b.h/2), y1=sy(laneY-b.h/2);
      el("rect",{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:8,
        fill:"var(--box)",stroke:"var(--stroke)","stroke-width":LW});
      txt((x0+x1)/2, sy(laneY)-PAD, b.t, "middle", FS);
      txt((x0+x1)/2, sy(laneY)+PAD+4, b.s, "middle", FS_S, "var(--muted)");
      return {x0:x0,x1:x1,y0:y0,y1:y1};
    }
    function arrow(x1,y1,x2,y2,color,mk){
      el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:color||"var(--stroke)",
        "stroke-width":LW,"marker-end":"url(#"+(mk||"ar")+")"});
    }

    var A=DATA.lane.audio, P=DATA.lane.prompt;

    /* --- волна: 5 секунд --- */
    var w=DATA.wave, wx0=sx(w.x), wx1=sx(w.x+w.w);
    el("rect",{x:wx0,y:sy(A+w.h/2),width:wx1-wx0,height:sy(A-w.h/2)-sy(A+w.h/2),
      rx:8,fill:"none",stroke:"var(--stroke)","stroke-width":LW,"stroke-dasharray":"4 3"});
    var d="", n=48;
    for(var i=0;i<=n;i++){
      var t=w.x+0.2+(w.w-0.4)*i/n;
      var env=(i<n*0.42)?0.62:(i<n*0.66?0.85:0.06);
      var amp=env*Math.sin(i*1.9)*Math.cos(i*0.41);
      d+=(i?" L ":"M ")+sx(t)+" "+sy(A+amp*0.75);
    }
    el("path",{d:d,fill:"none",stroke:"var(--accent)","stroke-width":LW});
    txt((wx0+wx1)/2, sy(A+w.h/2)-PAD-4, "аудио 5 с", "middle", FS);
    txt((wx0+wx1)/2, sy(A-w.h/2)+PAD+6, "лай · «stop!» · тишина", "middle", FS_S, "var(--muted)");

    /* --- блоки аудио-ветки --- */
    var enc=box(DATA.boxes[0],A), prj=box(DATA.boxes[1],A);

    /* --- ленты столбиков между блоками --- */
    function ribbon(xa,xb,hh,color){
      var k=7;
      for(var i=0;i<k;i++){
        var x=xa+(xb-xa)*(i+0.5)/k;
        el("line",{x1:sx(x),y1:sy(A+hh/2),x2:sx(x),y2:sy(A-hh/2),
          stroke:color,"stroke-width":LW,"stroke-linecap":"round","opacity":"0.85"});
      }
    }
    ribbon(11.4,13.6,1.0,"var(--accent)");
    ribbon(19.4,21.9,1.7,"var(--accent2)");

    /* --- стрелки аудио-ветки --- */
    arrow(wx1, sy(A), enc.x0, sy(A));
    arrow(enc.x1, sy(A), prj.x0, sy(A));

    /* --- подписи ширины (одна выше линии, другая ниже) --- */
    var tk=DATA.ticks;
    txt(sx(tk[0].x), sy(A+0.9)-PAD, tk[0].lab, "middle", FS_S, "var(--accent)");
    txt(sx(tk[1].x), sy(A-1.15)+PAD+4, tk[1].lab, "middle", FS_S, "var(--accent2)");

    /* --- точка слияния и LLM --- */
    var mx=sx(DATA.merge.x);
    var llm=box(DATA.boxes[2],A);
    arrow(sx(21.95), sy(A), llm.x0, sy(A), "var(--accent2)", "ar2");

    /* --- ветка промпта (нижняя дорожка) --- */
    var px0=sx(0.2), px1=sx(9.4);
    el("rect",{x:px0,y:sy(P+0.75),width:px1-px0,height:sy(P-0.75)-sy(P+0.75),
      rx:8,fill:"var(--box)",stroke:"var(--stroke)","stroke-width":LW});
    txt((px0+px1)/2, sy(P), "промпт: «человек в опасности?»", "middle", FS);
    txt(px0, sy(P-0.75)+PAD+6, "те же токены ширины 4096", "start", FS_S, "var(--muted)");

    /* ломаная промпт → точка слияния → LLM */
    var jx=sx(DATA.merge.x-1.2);
    el("path",{d:"M "+px1+" "+sy(P)+" L "+jx+" "+sy(P)+" L "+jx+" "+sy(A-0.9),
      fill:"none",stroke:"var(--accent2)","stroke-width":LW});
    arrow(jx, sy(A-0.9), jx, sy(A-0.25), "var(--accent2)", "ar2");
    txt(sx(12.6), sy(P)-PAD-2, "один ряд столбиков: сначала аудио, потом текст",
      "middle", FS_S, "var(--accent2)");

    /* --- выход --- */
    var ox=sx(DATA.out.x);
    arrow(llm.x1, sy(A), ox, sy(A));
    txt(ox+PAD, sy(A)-PAD-1, "текст ответа", "start", FS);
    txt(ox+PAD, sy(A)+PAD+3, "«похоже, человек", "start", FS_S, "var(--muted)");
    txt(ox+PAD, sy(A)+PAD+16, "зовёт на помощь»", "start", FS_S, "var(--muted)");

    /* --- легенда --- */
    var ly=sy(P-2.0);
    txt(sx(0.2), ly, "синие столбики — векторы 1280 от энкодера;   жёлтые — токены 4096 после projector'а",
      "start", FS_S, "var(--muted)");
  }catch(e){
    host.innerHTML='<p class="fallback"><b>Схема (текстом):</b> аудио 5 с (лай, «stop!», тишина) '+
      '→ audio encoder режет на кадры по 25 мс и выдаёт векторы ширины 1280 '+
      '→ projector растягивает каждый вектор до 4096 '+
      '→ токены ширины 4096 встают в один ряд с токенами промпта «человек в опасности?» '+
      '→ LLM-декодер читает ряд слева направо и выдаёт текст ответа: «похоже, человек зовёт на помощь».</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
