<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Сетка bin'ов 15.6 Hz</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1c1a; --mut:#6b6b66; --line:#3a3a36;
    --grid:#b9b9b2; --hi:#c2410c; --hiw:#fde3d3; --arr:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16171a; --fg:#e9e9e6; --mut:#9a9a94; --line:#c9c9c2;
      --grid:#4d4e52; --hi:#fb923c; --hiw:#4a2410; --arr:#8ab0ff;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  .wrap{max-width:1000px;margin:0 auto;padding:8px 10px 10px}
  h2{font:600 15px/1.3 system-ui,sans-serif;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  text{font-family:system-ui,sans-serif;fill:var(--fg)}
  .mut{fill:var(--mut)}
  .fail{font:14px/1.5 system-ui,sans-serif;color:var(--fg)}
</style>
<div class="wrap">
  <h2>Сетка bin'ов: шаг 15.6 Hz, 512 полос на 0–8 kHz</h2>
  <div id="host"></div>
</div>
<script>
(function(){
var host=document.getElementById('host');
try{
  /* ---- данные схемы ---- */
  var BINS=512, STEP=15.6, NY=8000, HIBIN=28, TONE=440;
  var ticks=[{b:0,t:"0 Hz"},{b:128,t:"2 kHz"},{b:256,t:"4 kHz"},{b:384,t:"6 kHz"},{b:512,t:"8 kHz"}];
  var zoom=[26,27,28,29,30];              /* лупа: соседи bin 28 */
  var W=980,H=470,FS=13,PAD=5,LW=1.4;     /* холст, шрифт, отступ подписи, толщина */

  /* ---- одна пара функций перевода ---- */
  var origin={x:120,y:400}, scale={x:(W-200)/BINS, y:-46};
  function sx(x){return origin.x+x*scale.x;}
  function sy(y){return origin.y+y*scale.y;}

  var s='',i,b;
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function line(x1,y1,x2,y2,col,w){s+='<line x1="'+sx(x1)+'" y1="'+sy(y1)+'" x2="'+sx(x2)+'" y2="'+sy(y2)+'" stroke="'+col+'" stroke-width="'+w+'"/>';}
  function lab(x,y,dx,dy,anc,t,cls){s+='<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anc+'" font-size="'+FS+'"'+(cls?' class="'+cls+'"':'')+'>'+esc(t)+'</text>';}

  /* ---- линейка: все 512 bin'ов ---- */
  for(i=0;i<BINS;i+=2) line(i,0,i,0.62,'var(--grid)',LW*0.6);
  s+='<rect x="'+sx(HIBIN)+'" y="'+sy(0.62)+'" width="'+(sx(HIBIN+1)-sx(HIBIN))+'" height="'+(sy(0)-sy(0.62))+'" fill="var(--hi)"/>';
  line(0,0,BINS,0,'var(--line)',LW);

  /* засечки частот */
  for(i=0;i<ticks.length;i++){
    b=ticks[i].b; line(b,0,b,-0.22,'var(--line)',LW);
    lab(b,-0.22,0,FS+PAD,'middle',ticks[i].t,'mut');
    lab(b,-0.22,0,2*FS+PAD+3,'middle','bin '+b,'mut');
  }
  lab(0,1.5,-PAD*2,0,'end','512 bin\u2019ов');
  lab(BINS,1.5,PAD*2,0,'start','Nyquist');

  /* ---- стрелка синуса 440 Hz: хвост слева сверху ---- */
  var tipX=HIBIN+3, tipY=0.85, tailX=HIBIN+95, tailY=2.55;
  line(tailX,tailY,tipX,tipY,'var(--arr)',LW*1.4);
  s+='<polygon points="'+sx(tipX)+','+sy(tipY)+' '+(sx(tipX)+13)+','+(sy(tipY)-4)+' '+(sx(tipX)+7)+','+(sy(tipY)+12)+'" fill="var(--arr)"/>';
  s+='<text x="'+(sx(tailX)+PAD)+'" y="'+(sy(tailY))+'" text-anchor="start" font-size="'+FS+'" fill="var(--arr)">синус 440 Hz \u2192 bin 28</text>';
  lab(tailX,tailY,PAD,FS+4,'start','и 445 Hz тоже сюда','mut');

  /* ---- лупа на соседей ---- */
  var zy=-1.55, zx0=HIBIN-60, zsp=42;
  function zpos(k){return zx0+k*zsp;}
  line(HIBIN,-0.05,zpos(2),zy+0.5,'var(--grid)',LW*0.7);
  line(HIBIN+1,-0.05,zpos(3),zy+0.5,'var(--grid)',LW*0.7);
  for(i=0;i<zoom.length;i++){
    b=zoom[i];
    var x0=zpos(i), x1=zpos(i+1), hot=(b===HIBIN);
    s+='<rect x="'+sx(x0)+'" y="'+sy(zy+0.5)+'" width="'+(sx(x1)-sx(x0))+'" height="'+(sy(zy)-sy(zy+0.5))+'" fill="'+(hot?'var(--hiw)':'none')+'" stroke="'+(hot?'var(--hi)':'var(--grid)')+'" stroke-width="'+(hot?LW*1.4:LW)+'"/>';
    lab((x0+x1)/2,zy,0,-PAD,'middle',String(b),hot?'':'mut');
    lab((x0+x1)/2,zy+0.5,0,FS+PAD,'middle',(b*STEP).toFixed(1),hot?'':'mut');
  }
  lab(zpos(0),zy+0.25,-PAD*2,FS/3,'end','bin');
  lab(zpos(zoom.length),zy+0.9,PAD*2,FS/3,'start','Hz');

  /* мера 15.6 Hz между bin 28 и bin 29 */
  var my=zy-1.05, a=zpos(2), c=zpos(3);
  line(a,my+0.2,a,my-0.15,'var(--hi)',LW);
  line(c,my+0.2,c,my-0.15,'var(--hi)',LW);
  line(a,my,c,my,'var(--hi)',LW);
  s+='<text x="'+sx((a+c)/2)+'" y="'+(sy(my)-PAD-2)+'" text-anchor="middle" font-size="'+FS+'" fill="var(--hi)">15.6 Hz \u2014 пусто</text>';

  /* формула снизу */
  lab(BINS/2,3.35,0,0,'middle','шаг = sr / N = 16000 / 1024 = 15.6 Hz','mut');

  var vb='0 '+sy(my-0.55)+' '+W+' '+H;
  host.innerHTML='<svg viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet" role="img" '
    +'aria-label="Линейка 0–8 kHz из 512 bin\u2019ов по 15.6 Hz, bin 28 = 437.5 Hz подсвечен, стрелка синус 440 Hz указывает в него">'+s+'</svg>';
}catch(e){
  host.innerHTML='<p class="fail">Схема должна показывать: линейку частот 0–8 kHz, разбитую на 512 bin\u2019ов с шагом 15.6 Hz (bin 0 = 0 Hz, bin 512 = 8000 Hz, Nyquist). Bin 28 = 437.5 Hz подсвечен; между ним и bin 29 = 453.1 Hz — пустой промежуток 15.6 Hz. Стрелка «синус 440 Hz» приходит в bin 28, туда же попадает и тон 445 Hz. Шаг = sr / N = 16000 / 1024 = 15.6 Hz.</p>';
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
