<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Пять шагов и их надёжность</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5b6570;
    --line:#7a8794; --box:#eef2f6; --stroke:#39424c;
    --accent:#b5462c; --accentbg:#f7e6e0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --fg:#e8edf2; --muted:#9aa6b2;
      --line:#7d8b98; --box:#212932; --stroke:#c3ccd5;
      --accent:#ea8d70; --accentbg:#38251f;
    }
  }
  html,body{margin:0}
  .fig{background:var(--bg);color:var(--fg);padding:10px 12px 14px;
       font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .fig h4{margin:0 0 6px;font-size:14px;font-weight:600}
  .fig svg{display:block;width:100%;height:auto;max-height:520px}
  .fallback{margin:0;color:var(--muted);font-size:13px}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>

<div class="fig">
  <h4>Конвейер из пяти шагов: 0.95 на каждом шаге даёт 0.77 на выходе</h4>
  <div id="host"></div>
</div>

<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---------- данные схемы ----------
    var steps = [
      {x:0, name:'PDF',      p:'0.95'},
      {x:1, name:'OCR',      p:'0.95'},
      {x:2, name:'разметка', p:'0.95'},
      {x:3, name:'таблицы',  p:'0.95'},
      {x:4, name:'правила',  p:'0.95'}
    ];
    var total = {x:5.4, p:'0.77'};
    var geom = {
      halfW:0.4, halfH:0.25,           // шаг
      tHalfW:0.55, tHalfH:0.32,        // итог
      gapIn:0.02, gapOut:0.16,         // стрелка между шагами
      headLen:0.07, headHalf:0.05,
      yTop:0.60, yFormula:-0.72, yNote:-0.98
    };

    // ---------- единственный перевод координат ----------
    var origin = {x:60, y:90}, scale = 110;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    // ---------- пиксельные литералы ----------
    var PAD_BELOW = 16, PAD_BASE = 5, LW = 1.6;
    var FS_NAME = 13, FS_NUM = 15, FS_SMALL = 12, FS_BIG = 19;

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 730 215');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Цепочка из пяти шагов по 0.95, итог 0.77');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function txt(x,y,s,anchor,size,fill,weight){
      var t=el('text',{x:x, y:y, 'text-anchor':anchor,
        'font-size':size, fill:fill, 'font-weight':weight||'400'});
      t.textContent=s; return t;
    }
    function box(cx,hw,hh,fill,stroke){
      el('rect',{x:sx(cx-hw), y:sy(hh), width:sx(cx+hw)-sx(cx-hw),
        height:sy(-hh)-sy(hh), rx:6, fill:fill, stroke:stroke, 'stroke-width':LW});
    }
    function arrow(x1,x2,y){
      el('line',{x1:sx(x1), y1:sy(y), x2:sx(x2-geom.headLen), y2:sy(y),
        stroke:'var(--line)', 'stroke-width':LW});
      el('polygon',{points:[
        sx(x2)+','+sy(y),
        sx(x2-geom.headLen)+','+sy(y+geom.headHalf),
        sx(x2-geom.headLen)+','+sy(y-geom.headHalf)].join(' '),
        fill:'var(--line)'});
    }

    // подпись сверху: якорь слева, text-anchor=start — не вылезет за край
    txt(sx(-geom.halfW), sy(geom.yTop), 'каждый шаг прав в 95 % случаев',
        'start', FS_SMALL, 'var(--muted)');

    // шаги и стрелки между ними
    steps.forEach(function(s, i){
      box(s.x, geom.halfW, geom.halfH, 'var(--box)', 'var(--stroke)');
      txt(sx(s.x), sy(0)+PAD_BASE, s.name, 'middle', FS_NAME, 'var(--fg)', '600');
      // 0.95 — под шагом, а верхняя подпись — над линией: подписи разведены
      txt(sx(s.x), sy(-geom.halfH)+PAD_BELOW, s.p, 'middle', FS_NUM, 'var(--fg)');
      if(i < steps.length - 1){
        arrow(s.x + geom.halfW + geom.gapIn, s.x + 1 - geom.halfW - geom.gapIn, 0);
      }
    });

    // стрелка к итогу
    arrow(steps[steps.length-1].x + geom.halfW + geom.gapIn,
          total.x - geom.tHalfW - geom.gapOut, 0);
    // подпись у хвоста стрелки, сбоку — не у наконечника
    txt(sx(steps[steps.length-1].x + geom.halfW + geom.gapIn),
        sy(geom.halfH), 'перемножаются', 'start', FS_SMALL, 'var(--muted)');

    // итог
    box(total.x, geom.tHalfW, geom.tHalfH, 'var(--accentbg)', 'var(--accent)');
    txt(sx(total.x), sy(0.10), 'итог', 'middle', FS_SMALL, 'var(--accent)');
    txt(sx(total.x), sy(-0.13), total.p, 'middle', FS_BIG, 'var(--accent)', '700');

    // легенда под схемой
    txt(sx(-geom.halfW), sy(geom.yFormula),
        '0.95 × 0.95 × 0.95 × 0.95 × 0.95 ≈ 0.77',
        'start', FS_NUM, 'var(--fg)');
    txt(sx(-geom.halfW), sy(geom.yNote),
        'то есть примерно каждая четвёртая страница разобрана неверно',
        'start', FS_SMALL, 'var(--muted)');

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема должна была показать цепочку из пяти шагов — ' +
      'PDF → OCR → разметка → таблицы → правила — с надёжностью 0.95 под каждым шагом ' +
      'и итогом справа: 0.95 × 0.95 × 0.95 × 0.95 × 0.95 ≈ 0.77, ' +
      'то есть примерно каждая четвёртая страница разобрана неверно.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
