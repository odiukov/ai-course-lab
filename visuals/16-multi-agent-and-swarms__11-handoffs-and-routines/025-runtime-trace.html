<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Трасса разговора после одного хендоффа</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f3f5fa;
      --ink: #172033;
      --muted: #5b667b;
      --line: #aab3c3;
      --triage: #2d5d9f;
      --triage-soft: #e7f0ff;
      --refund: #16705c;
      --refund-soft: #e2f6ef;
      --handoff: #9c5915;
      --handoff-soft: #fff0d8;
      --answer: #6b3fa0;
      --answer-soft: #f1e9fb;
      --white: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11141b;
        --panel: #181d27;
        --panel-soft: #202633;
        --ink: #eef2fa;
        --muted: #aeb8ca;
        --line: #647086;
        --triage: #91bcff;
        --triage-soft: #203554;
        --refund: #75d6bc;
        --refund-soft: #173f37;
        --handoff: #ffc477;
        --handoff-soft: #4a3219;
        --answer: #d1a8ff;
        --answer-soft: #38264d;
        --white: #10141c;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      background: var(--panel);
    }

    figcaption {
      color: var(--ink);
      font-size: 24px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .trace-frame {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .user-box {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .triage-box {
      fill: var(--triage-soft);
      stroke: var(--triage);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .refund-box {
      fill: var(--refund-soft);
      stroke: var(--refund);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .handoff-box {
      fill: var(--handoff-soft);
      stroke: var(--handoff);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .answer-box {
      fill: var(--answer-soft);
      stroke: var(--answer);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .flow-line {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .boundary-line {
      fill: none;
      stroke: var(--handoff);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .continuity-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .stop-line {
      fill: none;
      stroke: var(--answer);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--ink);
      font-size: 18px;
    }

    .small {
      fill: var(--muted);
      font-size: 15px;
    }

    .agent-triage {
      fill: var(--triage);
      font-size: 22px;
      font-weight: bold;
    }

    .agent-refund {
      fill: var(--refund);
      font-size: 22px;
      font-weight: bold;
    }

    .handoff-title {
      fill: var(--handoff);
      font-size: 22px;
      font-weight: bold;
    }

    .answer-title {
      fill: var(--answer);
      font-size: 20px;
      font-weight: bold;
    }

    .turn-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .note {
      fill: var(--muted);
      font-size: 16px;
    }

    .emphasis {
      font-weight: bold;
    }

    #fallback {
      color: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-caption">
    <figcaption id="diagram-caption">Трасса разговора после одного хендоффа</figcaption>
    <svg id="trace" viewBox="0 0 1200 470" width="1200" height="470"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Два модельных хода: triage передаёт выполнение refund, а refund отвечает пользователю и завершает прогон">
      <title>Трасса: triage → refund → ответ пользователю</title>
      <desc>Запрос поступает triage. После служебной записи перехода следующий ход выполняет refund. Обратного перехода к triage нет.</desc>
      <g id="drawing"></g>
    </svg>
    <p id="fallback" hidden>Схема должна была показать: запрос выполняет triage, рантайм записывает переход triage → refund, затем refund отвечает пользователю без возврата к triage.</p>
  </figure>

  <script>
    const diagram = Object.freeze([{
      origin: [50, 15],
      scale: [10, 9],
      zero: 0,

      boxes: [
        { kind: "trace-frame", x: 1, y: 1, w: 109, h: 48 },
        { kind: "user-box", x: 8, y: 2, w: 42, h: 6 },
        { kind: "triage-box", x: 8, y: 11, w: 42, h: 11 },
        { kind: "handoff-box", x: 18, y: 25, w: 45, h: 7 },
        { kind: "refund-box", x: 8, y: 35, w: 42, h: 11 },
        { kind: "answer-box", x: 64, y: 35, w: 39, h: 11 }
      ],

      lines: [
        { kind: "flow-line", a: [29, 8], b: [29, 11] },
        { kind: "flow-line", a: [29, 11], b: [28.2, 9.9] },
        { kind: "flow-line", a: [29, 11], b: [29.8, 9.9] },

        { kind: "flow-line", a: [29, 22], b: [29, 25] },
        { kind: "flow-line", a: [29, 25], b: [28.2, 23.9] },
        { kind: "flow-line", a: [29, 25], b: [29.8, 23.9] },

        { kind: "flow-line", a: [29, 32], b: [29, 35] },
        { kind: "flow-line", a: [29, 35], b: [28.2, 33.9] },
        { kind: "flow-line", a: [29, 35], b: [29.8, 33.9] },

        { kind: "boundary-line", a: [5, 28.5], b: [18, 28.5] },
        { kind: "boundary-line", a: [63, 28.5], b: [105, 28.5] },

        { kind: "flow-line", a: [50, 40.5], b: [64, 40.5] },
        { kind: "flow-line", a: [64, 40.5], b: [62.7, 39.6] },
        { kind: "flow-line", a: [64, 40.5], b: [62.7, 41.4] },

        { kind: "continuity-line", a: [55, 6], b: [101, 6] },
        { kind: "continuity-line", a: [101, 6], b: [101, 28.5] },

        { kind: "stop-line", a: [99, 43.4], b: [99, 44.8] },
        { kind: "stop-line", a: [97.8, 44.8], b: [100.2, 44.8] }
      ],

      labels: [
        {
          text: "Пользователь: «Хочу вернуть наушники»",
          x: 29, y: 5.1, dx: 0, dy: 0,
          anchor: "middle", kind: "emphasis"
        },
        {
          text: "один исходный запрос · один прогон",
          x: 78, y: 4.6, dx: 0, dy: 0,
          anchor: "middle", kind: "small"
        },
        {
          text: "контекст продолжается",
          x: 78, y: 7.6, dx: 0, dy: 0,
          anchor: "middle", kind: "small"
        },

        {
          text: "ПЕРВЫЙ МОДЕЛЬНЫЙ ХОД",
          x: 11, y: 13.6, dx: 0, dy: 0,
          anchor: "start", kind: "turn-label"
        },
        {
          text: "triage",
          x: 11, y: 16.8, dx: 0, dy: 0,
          anchor: "start", kind: "agent-triage"
        },
        {
          text: "текущий исполнитель",
          x: 47, y: 16.7, dx: 0, dy: 0,
          anchor: "end", kind: "small"
        },
        {
          text: "сортирует запрос",
          x: 11, y: 19.2, dx: 0, dy: 0,
          anchor: "start", kind: "note"
        },
        {
          text: "вызывает инструмент передачи",
          x: 47, y: 19.2, dx: 0, dy: 0,
          anchor: "end", kind: "note"
        },

        {
          text: "triage → refund",
          x: 40.5, y: 27.8, dx: 0, dy: 0,
          anchor: "middle", kind: "handoff-title"
        },
        {
          text: "служебная запись рантайма · не ответ пользователю",
          x: 40.5, y: 30.3, dx: 0, dy: 0,
          anchor: "middle", kind: "small"
        },
        {
          text: "вызов инструмента завершён",
          x: 66, y: 26.5, dx: 1.2, dy: 0,
          anchor: "start", kind: "small"
        },
        {
          text: "активный исполнитель меняется после записи",
          x: 66, y: 30.7, dx: 1.2, dy: 0,
          anchor: "start", kind: "small"
        },

        {
          text: "СЛЕДУЮЩИЙ МОДЕЛЬНЫЙ ХОД",
          x: 11, y: 37.6, dx: 0, dy: 0,
          anchor: "start", kind: "turn-label"
        },
        {
          text: "refund",
          x: 11, y: 40.8, dx: 0, dy: 0,
          anchor: "start", kind: "agent-refund"
        },
        {
          text: "новый активный исполнитель",
          x: 47, y: 40.7, dx: 0, dy: 0,
          anchor: "end", kind: "small"
        },
        {
          text: "продолжает тот же прогон",
          x: 11, y: 43.4, dx: 0, dy: 0,
          anchor: "start", kind: "note"
        },
        {
          text: "формирует обычный ответ",
          x: 47, y: 43.4, dx: 0, dy: 0,
          anchor: "end", kind: "note"
        },

        {
          text: "Ответ пользователю",
          x: 83.5, y: 38.8, dx: 0, dy: 0,
          anchor: "middle", kind: "answer-title"
        },
        {
          text: "прогон завершён",
          x: 83.5, y: 41.7, dx: 0, dy: 0,
          anchor: "middle", kind: "emphasis"
        },
        {
          text: "нового хендоффа нет",
          x: 83.5, y: 44.1, dx: 0, dy: 0,
          anchor: "middle", kind: "small"
        },
        {
          text: "возврата к triage нет",
          x: 61, y: 46.5, dx: 0, dy: 0,
          anchor: "middle", kind: "small"
        }
      ]
    }]);

    const [{
      origin: [originX, originY],
      scale: [scaleX, scaleY],
      zero,
      boxes,
      lines,
      labels
    }] = diagram;

    const origin = Object.freeze([originX, originY]);
    const scale = Object.freeze([scaleX, scaleY]);
    const sx = x => originX + x * scaleX;
    const sy = y => originY + y * scaleY;

    try {
      const svg = document.getElementById("trace");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = name => document.createElementNS(namespace, name);

      for (const box of boxes) {
        const node = make("rect");
        node.setAttribute("x", String(sx(box.x)));
        node.setAttribute("y", String(sy(box.y)));
        node.setAttribute("width", String(sx(box.x + box.w) - sx(box.x)));
        node.setAttribute("height", String(sy(box.y + box.h) - sy(box.y)));
        node.setAttribute("class", box.kind);
        drawing.appendChild(node);
      }

      for (const segment of lines) {
        const [ax, ay] = segment.a;
        const [bx, by] = segment.b;
        const node = make("line");
        node.setAttribute("x1", String(sx(ax)));
        node.setAttribute("y1", String(sy(ay)));
        node.setAttribute("x2", String(sx(bx)));
        node.setAttribute("y2", String(sy(by)));
        node.setAttribute("class", segment.kind);
        drawing.appendChild(node);
      }

      for (const label of labels) {
        const node = make("text");
        node.setAttribute("x", String(sx(label.x + label.dx)));
        node.setAttribute("y", String(sy(label.y + label.dy)));
        node.setAttribute("text-anchor", label.anchor);
        node.setAttribute("class", label.kind);
        node.textContent = label.text;
        drawing.appendChild(node);
      }

      if (!drawing.hasChildNodes()) {
        throw new Error("Построение не создало элементов");
      }

      fallback.hidden = true;
      svg.removeAttribute("aria-hidden");
    } catch (error) {
      const svg = document.getElementById("trace");
      const fallback = document.getElementById("fallback");
      svg.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
