<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как A2A сокращает число интеграций</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f6f8fc;
  --surface:#ffffff;
  --panel:#f8faff;
  --ink:#172033;
  --muted:#59657a;
  --line:#bcc6d8;
  --custom:#d94f70;
  --custom-soft:#fff0f3;
  --a2a:#2676d9;
  --a2a-soft:#eaf3ff;
  --card:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111722;
    --surface:#171f2d;
    --panel:#1b2534;
    --ink:#edf3ff;
    --muted:#b2bdd0;
    --line:#526078;
    --custom:#ff7893;
    --custom-soft:#3a202b;
    --a2a:#70adff;
    --a2a-soft:#193454;
    --card:#202b3d;
  }
}
html,body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:24px}
figure{background:var(--surface)}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--surface);
  border:2px solid var(--line);
}
.panel{fill:var(--panel);stroke:var(--line);stroke-width:2}
.divider{stroke:var(--line);stroke-width:2}
.arrow{fill:none;stroke:var(--custom);stroke-width:2.5;stroke-linecap:round}
.arrowhead{fill:var(--custom)}
.agent-left{fill:var(--custom-soft);stroke:var(--custom);stroke-width:3}
.agent-right{fill:var(--a2a-soft);stroke:var(--a2a);stroke-width:3}
.connector{stroke:var(--a2a);stroke-width:2}
.card{fill:var(--card);stroke:var(--a2a);stroke-width:2}
.banner-box{fill:var(--a2a-soft);stroke:var(--a2a);stroke-width:2}
.panel-title{fill:var(--ink);font-size:23px;font-weight:bold}
.count-left{fill:var(--custom);font-size:18px;font-weight:bold}
.count-right{fill:var(--a2a);font-size:18px;font-weight:bold}
.agent-label{fill:var(--ink);font-size:15px;font-weight:bold}
.card-label{fill:var(--ink);font-size:16px;font-weight:bold}
.card-note{fill:var(--muted);font-size:14px}
.banner{fill:var(--a2a);font-size:17px;font-weight:bold}
.note{fill:var(--muted);font-size:15px}
.emphasis-left{fill:var(--custom);font-size:16px;font-weight:bold}
.emphasis-right{fill:var(--a2a);font-size:16px;font-weight:bold}
#fallback{font-size:16px;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1>Как A2A сокращает число интеграций</h1>
  <figure>
    <svg id="diagram" viewBox="0 0 1200 500" width="1200" height="500"
         role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение самописных интеграций и A2A</title>
      <desc id="svg-desc">Слева четыре агента соединены двенадцатью направленными контрактами. Справа те же четыре агента поддерживают общий протокол A2A и публикуют по одной Agent Card.</desc>
      <g id="scene"></g>
    </svg>
    <p id="fallback">Схема: слева 4 агента и 12 самописных направленных контрактов; справа 4 агента, общий A2A и по одной Agent Card.</p>
  </figure>
</main>
<script>
const diagramData=[{
  origin:{x:0,y:0},
  scale:1,
  zero:0,
  two:2,
  panels:[
    {x1:24,y1:18,x2:574,y2:482,kind:"left"},
    {x1:626,y1:18,x2:1176,y2:482,kind:"right"}
  ],
  divider:{x:600,y1:32,y2:468},
  headings:{
    left:{x:299,y:54,title:"Без A2A",countY:84,count:"4 агента · 12 контрактов"},
    right:{x:901,y:54,title:"С A2A",countY:84,count:"4 агента · 4 Agent Card"}
  },
  leftAgents:[
    {key:"А",x:158,y:205,r:42},
    {key:"Б",x:440,y:205,r:42},
    {key:"В",x:158,y:350,r:42},
    {key:"Г",x:440,y:350,r:42}
  ],
  rightAgents:[
    {key:"А",x:696,y:215,r:38,card:{x:756,y:187,w:152,h:56}},
    {key:"Б",x:952,y:215,r:38,card:{x:1012,y:187,w:132,h:56}},
    {key:"В",x:696,y:344,r:38,card:{x:756,y:316,w:152,h:56}},
    {key:"Г",x:952,y:344,r:38,card:{x:1012,y:316,w:132,h:56}}
  ],
  edges:[
    {from:"А",to:"Б",bend:30},
    {from:"Б",to:"А",bend:30},
    {from:"А",to:"В",bend:28},
    {from:"В",to:"А",bend:28},
    {from:"А",to:"Г",bend:54},
    {from:"Г",to:"А",bend:54},
    {from:"Б",to:"В",bend:54},
    {from:"В",to:"Б",bend:54},
    {from:"Б",to:"Г",bend:28},
    {from:"Г",to:"Б",bend:28},
    {from:"В",to:"Г",bend:30},
    {from:"Г",to:"В",bend:30}
  ],
  arrow:{inset:48,headLength:12,headHalf:6},
  banner:{x:686,y:106,w:430,h:46,textX:901,textY:135},
  labels:{
    agentLine:5,
    agentLetter:14,
    cardMain:213,
    cardSub:234,
    cardMainLower:342,
    cardSubLower:363,
    leftNoteX:299,
    leftNoteY:432,
    leftSubY:458,
    rightNoteX:901,
    rightNoteY:432,
    rightSubY:458
  },
  notes:{
    left:"12 стрелок = 12 отдельных интеграций",
    leftSub:"свой запрос, ответ и ошибки для каждой пары",
    right:"один общий сетевой контракт",
    rightSub:"каждый агент поддерживает A2A один раз"
  },
  fallback:{x:600,y:230,subY:262}
}];

const [cfg]=diagramData;
const origin=cfg.origin;
const scale=cfg.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

const svg=document.getElementById("diagram");
const scene=document.getElementById("scene");
const fallback=document.getElementById("fallback");
const ns="http://www.w3.org/2000/svg";

function make(tag,className){
  const node=document.createElementNS(ns,tag);
  if(className) node.setAttribute("class",className);
  return node;
}
function add(parent,node){
  parent.appendChild(node);
  return node;
}
function line(parent,x1,y1,x2,y2,className){
  const node=make("line",className);
  node.setAttribute("x1",sx(x1));
  node.setAttribute("y1",sy(y1));
  node.setAttribute("x2",sx(x2));
  node.setAttribute("y2",sy(y2));
  return add(parent,node);
}
function rect(parent,x,y,w,h,className){
  const node=make("rect",className);
  node.setAttribute("x",sx(x));
  node.setAttribute("y",sy(y));
  node.setAttribute("width",sx(x+w)-sx(x));
  node.setAttribute("height",sy(y+h)-sy(y));
  return add(parent,node);
}
function circle(parent,x,y,r,className){
  const node=make("circle",className);
  node.setAttribute("cx",sx(x));
  node.setAttribute("cy",sy(y));
  node.setAttribute("r",Math.abs(sx(r)-sx(cfg.zero)));
  return add(parent,node);
}
function label(parent,value,x,y,className,anchor){
  const node=make("text",className);
  node.setAttribute("x",sx(x));
  node.setAttribute("y",sy(y));
  node.setAttribute("text-anchor",anchor);
  node.textContent=value;
  return add(parent,node);
}
function panel(parent,p){
  rect(parent,p.x1,p.y1,p.x2-p.x1,p.y2-p.y1,"panel");
}
function agentLabel(parent,agent){
  label(parent,"Агент",agent.x,agent.y-cfg.labels.agentLine,"agent-label","middle");
  label(parent,agent.key,agent.x,agent.y+cfg.labels.agentLetter,"agent-label","middle");
}
function arrow(parent,a,b,bend){
  const dx=b.x-a.x;
  const dy=b.y-a.y;
  const length=Math.hypot(dx,dy);
  const ux=dx/length;
  const uy=dy/length;
  const nx=-uy;
  const ny=ux;
  const start={
    x:a.x+ux*cfg.arrow.inset,
    y:a.y+uy*cfg.arrow.inset
  };
  const end={
    x:b.x-ux*cfg.arrow.inset,
    y:b.y-uy*cfg.arrow.inset
  };
  const control={
    x:(start.x+end.x)/cfg.two+nx*bend,
    y:(start.y+end.y)/cfg.two+ny*bend
  };
  const path=make("path","arrow");
  path.setAttribute("d",
    "M "+sx(start.x)+" "+sy(start.y)+
    " Q "+sx(control.x)+" "+sy(control.y)+
    " "+sx(end.x)+" "+sy(end.y)
  );
  add(parent,path);

  const tdx=end.x-control.x;
  const tdy=end.y-control.y;
  const tangentLength=Math.hypot(tdx,tdy);
  const tux=tdx/tangentLength;
  const tuy=tdy/tangentLength;
  const tnx=-tuy;
  const tny=tux;
  const base={
    x:end.x-tux*cfg.arrow.headLength,
    y:end.y-tuy*cfg.arrow.headLength
  };
  const left={
    x:base.x+tnx*cfg.arrow.headHalf,
    y:base.y+tny*cfg.arrow.headHalf
  };
  const right={
    x:base.x-tnx*cfg.arrow.headHalf,
    y:base.y-tny*cfg.arrow.headHalf
  };
  const head=make("polygon","arrowhead");
  head.setAttribute("points",[
    sx(end.x)+","+sy(end.y),
    sx(left.x)+","+sy(left.y),
    sx(right.x)+","+sy(right.y)
  ].join(" "));
  add(parent,head);
}
function drawLeft(parent){
  const map=new Map(cfg.leftAgents.map(agent=>[agent.key,agent]));
  const arrows=add(parent,make("g"));
  cfg.edges.forEach(edge=>{
    arrow(arrows,map.get(edge.from),map.get(edge.to),edge.bend);
  });
  const agents=add(parent,make("g"));
  cfg.leftAgents.forEach(agent=>{
    circle(agents,agent.x,agent.y,agent.r,"agent-left");
    agentLabel(agents,agent);
  });
}
function drawRight(parent){
  rect(parent,cfg.banner.x,cfg.banner.y,cfg.banner.w,cfg.banner.h,"banner-box");
  label(parent,"единый сетевой контракт A2A",
    cfg.banner.textX,cfg.banner.textY,"banner","middle");

  cfg.rightAgents.forEach(agent=>{
    const card=agent.card;
    line(parent,agent.x+agent.r,agent.y,card.x,agent.y,"connector");
    circle(parent,agent.x,agent.y,agent.r,"agent-right");
    agentLabel(parent,agent);
    rect(parent,card.x,card.y,card.w,card.h,"card");
    const mainY=agent.y<cfg.labels.cardMainLower
      ? cfg.labels.cardMain
      : cfg.labels.cardMainLower;
    const subY=agent.y<cfg.labels.cardMainLower
      ? cfg.labels.cardSub
      : cfg.labels.cardSubLower;
    label(parent,"Agent Card",card.x+card.w/cfg.two,mainY,
      "card-label","middle");
    label(parent,"одна карточка",card.x+card.w/cfg.two,subY,
      "card-note","middle");
  });
}
function draw(){
  cfg.panels.forEach(item=>panel(scene,item));
  line(scene,cfg.divider.x,cfg.divider.y1,cfg.divider.x,cfg.divider.y2,"divider");

  label(scene,cfg.headings.left.title,cfg.headings.left.x,
    cfg.headings.left.y,"panel-title","middle");
  label(scene,cfg.headings.left.count,cfg.headings.left.x,
    cfg.headings.left.countY,"count-left","middle");
  label(scene,cfg.headings.right.title,cfg.headings.right.x,
    cfg.headings.right.y,"panel-title","middle");
  label(scene,cfg.headings.right.count,cfg.headings.right.x,
    cfg.headings.right.countY,"count-right","middle");

  drawLeft(scene);
  drawRight(scene);

  label(scene,cfg.notes.left,cfg.labels.leftNoteX,
    cfg.labels.leftNoteY,"emphasis-left","middle");
  label(scene,cfg.notes.leftSub,cfg.labels.leftNoteX,
    cfg.labels.leftSubY,"note","middle");
  label(scene,cfg.notes.right,cfg.labels.rightNoteX,
    cfg.labels.rightNoteY,"emphasis-right","middle");
  label(scene,cfg.notes.rightSub,cfg.labels.rightNoteX,
    cfg.labels.rightSubY,"note","middle");
}
try{
  draw();
  fallback.hidden=true;
}catch(error){
  scene.replaceChildren();
  label(scene,"Слева: 4 агента и 12 самописных контрактов",
    cfg.fallback.x,cfg.fallback.y,"emphasis-left","middle");
  label(scene,"Справа: 4 агента, общий A2A и 4 Agent Card",
    cfg.fallback.x,cfg.fallback.subY,"emphasis-right","middle");
  fallback.textContent="Не удалось построить геометрию схемы: "+String(error);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
