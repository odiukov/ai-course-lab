<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Параллельный прогон и точка объединения</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fb;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#657086;
  --line:#8792a8;
  --guide:#d6dbe5;
  --blue:#3269d8;
  --blue-soft:#dfe9ff;
  --green:#14805e;
  --green-soft:#d9f3e9;
  --orange:#b45c14;
  --orange-soft:#ffead7;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121722;
    --panel:#1a2130;
    --ink:#edf2ff;
    --muted:#aeb8cc;
    --line:#8794ad;
    --guide:#354056;
    --blue:#80a9ff;
    --blue-soft:#253a65;
    --green:#6bd3ad;
    --green-soft:#183f36;
    --orange:#ffb876;
    --orange-soft:#55351f;
  }
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:460px;
  background:var(--bg);
}
text{fill:var(--ink);font-size:14px}
.section{fill:var(--muted);font-size:13px;font-weight:bold}
.stage{fill:var(--panel);stroke:var(--blue);stroke-width:2px}
.stage-text{font-size:15px;font-weight:bold}
.flow{fill:none;stroke:var(--line);stroke-width:2px}
.branch-a{fill:none;stroke:var(--blue);stroke-width:3px}
.branch-b{fill:none;stroke:var(--green);stroke-width:3px}
.wait{fill:none;stroke:var(--orange);stroke-width:2px}
.guide{fill:none;stroke:var(--guide);stroke-width:2px}
.join{fill:var(--orange-soft);stroke:var(--orange);stroke-width:3px}
.dot-a{fill:var(--blue)}
.dot-b{fill:var(--green)}
.bar-a{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2px}
.bar-b{fill:var(--green-soft);stroke:var(--green);stroke-width:2px}
.card{fill:var(--panel);stroke:var(--guide);stroke-width:2px}
.chip{fill:var(--blue-soft);stroke:var(--blue);stroke-width:2px}
.code{font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;font-size:13px}
.small{font-size:12px;fill:var(--muted)}
.emphasis{font-weight:bold;fill:var(--orange)}
.fallback{font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<h1 id="diagram-title">Параллельный прогон и точка объединения</h1>
<p id="fallback" class="fallback">Схема показывает последовательные стадии 01–06, параллельные 07 и 08, ожидание обеих ветвей перед 09, стадии 09–12 и выигрыш по времени относительно последовательного запуска.</p>
<svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
     preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="diagram-title diagram-desc">
  <desc id="diagram-desc">Стадии 07 и 08 выполняются одновременно и сходятся в точке объединения перед стадией 09.</desc>
</svg>
<script>
const DATA=[{
  ns:"http://www.w3.org/2000/svg",
  z:0, half:2,
  arrow:{d:9,w:6},
  stages:[
    {id:"01",x:40,y:89,w:46,h:34},{id:"02",x:105,y:89,w:46,h:34},
    {id:"03",x:170,y:89,w:46,h:34},{id:"04",x:235,y:89,w:46,h:34},
    {id:"05",x:300,y:89,w:46,h:34},{id:"06",x:365,y:89,w:46,h:34},
    {id:"07",x:500,y:56,w:48,h:34},{id:"08",x:500,y:128,w:48,h:34},
    {id:"09",x:770,y:89,w:48,h:34},{id:"10",x:850,y:89,w:48,h:34},
    {id:"11",x:930,y:89,w:48,h:34},{id:"12",x:1010,y:89,w:48,h:34}
  ],
  arrows:[
    {a:[86,106],b:[105,106],c:"flow"},{a:[151,106],b:[170,106],c:"flow"},
    {a:[216,106],b:[235,106],c:"flow"},{a:[281,106],b:[300,106],c:"flow"},
    {a:[346,106],b:[365,106],c:"flow"},{a:[411,106],b:[430,106],c:"flow"},
    {a:[731,106],b:[770,106],c:"flow"},{a:[818,106],b:[850,106],c:"flow"},
    {a:[898,106],b:[930,106],c:"flow"},{a:[978,106],b:[1010,106],c:"flow"}
  ],
  paths:[
    {p:[[430,106],[462,106],[462,73],[500,73]],c:"branch-a"},
    {p:[[430,106],[462,106],[462,145],[500,145]],c:"branch-b"},
    {p:[[548,73],[670,73]],c:"branch-a"},
    {p:[[548,145],[625,145]],c:"branch-b"},
    {p:[[670,73],[684,73],[684,106],[699,106]],c:"branch-a"},
    {p:[[625,145],[684,145],[684,106],[699,106]],c:"wait"}
  ],
  circles:[
    {x:430,y:106,r:5,c:"dot-a"},{x:670,y:73,r:5,c:"dot-a"},
    {x:625,y:145,r:5,c:"dot-b"}
  ],
  diamond:[[715,90],[731,106],[715,122],[699,106]],
  labels:[
    {x:40,y:28,dx:0,dy:0,t:"ХОД СТАДИЙ",a:"start",c:"section"},
    {x:609,y:49,dx:0,dy:0,t:"18 минут",a:"middle",c:""},
    {x:585,y:169,dx:0,dy:0,t:"11 минут",a:"middle",c:""},
    {x:715,y:28,dx:0,dy:0,t:"ТОЧКА ОБЪЕДИНЕНИЯ",a:"middle",c:"section"},
    {x:715,y:145,dx:0,dy:0,t:"09 ждёт обе ветви",a:"middle",c:"emphasis"},
    {x:40,y:232,dx:0,dy:0,t:"ВЫИГРЫШ ПО ВРЕМЕНИ",a:"start",c:"section"},
    {x:190,y:282,dx:-8,dy:0,t:"Последовательно",a:"end",c:""},
    {x:190,y:345,dx:-8,dy:0,t:"Параллельно",a:"end",c:""},
    {x:310,y:282,dx:0,dy:0,t:"07 · 18 минут",a:"middle",c:"stage-text"},
    {x:455,y:282,dx:0,dy:0,t:"08 · 11 минут",a:"middle",c:"stage-text"},
    {x:310,y:332,dx:0,dy:0,t:"07 · 18 минут",a:"middle",c:"stage-text"},
    {x:275,y:358,dx:0,dy:0,t:"08 · 11 минут",a:"middle",c:"stage-text"},
    {x:455,y:412,dx:0,dy:0,t:"выигрыш: 11 минут",a:"middle",c:"emphasis"}
  ],
  bars:[
    {x:220,y:267,w:180,h:30,c:"bar-a"},{x:400,y:267,w:110,h:30,c:"bar-b"},
    {x:220,y:317,w:180,h:30,c:"bar-a"},{x:220,y:350,w:110,h:24,c:"bar-b"}
  ],
  guides:[
    {a:[400,302],b:[400,396],c:"guide"},{a:[510,302],b:[510,396],c:"guide"},
    {a:[400,396],b:[510,396],c:"wait"},{a:[400,390],b:[400,402],c:"wait"},
    {a:[510,390],b:[510,402],c:"wait"}
  ],
  card:{x:610,y:230,w:550,h:180},
  chips:[
    {x:635,y:268,w:118,h:30,t:"stage_07"},
    {x:635,y:320,w:118,h:30,t:"stage_08"}
  ],
  cardPaths:[
    {p:[[753,283],[850,283],[850,309],[884,309]],c:"branch-a"},
    {p:[[753,335],[850,335],[850,309],[884,309]],c:"branch-b"}
  ],
  cardDiamond:[[900,293],[916,309],[900,325],[884,309]],
  cardArrow:{a:[916,309],b:[948,309],c:"flow"},
  cardLabels:[
    {x:635,y:250,dx:0,dy:0,t:"ДЕТЕРМИНИРОВАННЫЙ ВХОД 09",a:"start",c:"section"},
    {x:972,y:294,dx:0,dy:0,t:"канонизация",a:"start",c:"stage-text"},
    {x:972,y:318,dx:0,dy:0,t:"→ хеш → вход 09",a:"start",c:"stage-text"},
    {x:900,y:382,dx:0,dy:0,t:"Кто завершился первым — не влияет",a:"middle",c:"small"}
  ]
}];
const origin=Object.freeze({x:0,y:0});
const scale=Object.freeze({x:1,y:1});
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const [D]=DATA;
  const svg=document.getElementById("diagram");
  const make=(tag,attrs,parent=svg)=>{
    const node=document.createElementNS(D.ns,tag);
    for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
    parent.appendChild(node);
    return node;
  };
  const line=(a,b,c,parent=svg)=>make("line",{
    x1:sx(a[0]),y1:sy(a[1]),x2:sx(b[0]),y2:sy(b[1]),class:c
  },parent);
  const poly=(points,c,parent=svg)=>make("polyline",{
    points:points.map(point=>`${sx(point[0])},${sy(point[1])}`).join(" "),
    class:c
  },parent);
  const polygon=(points,c,parent=svg)=>make("polygon",{
    points:points.map(point=>`${sx(point[0])},${sy(point[1])}`).join(" "),
    class:c
  },parent);
  const rect=(x,y,w,h,c,parent=svg)=>make("rect",{
    x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),class:c
  },parent);
  const circle=(x,y,r,c,parent=svg)=>make("circle",{
    cx:sx(x),cy:sy(y),r:sx(x+r)-sx(x),class:c
  },parent);
  const text=({x,y,dx,dy,t,a,c},parent=svg)=>{
    const node=make("text",{
      x:sx(x),y:sy(y),dx:`${dx}px`,dy:`${dy}px`,
      "text-anchor":a,"dominant-baseline":"middle",class:c
    },parent);
    node.textContent=t;
    return node;
  };
  const arrow=(a,b,c,parent=svg)=>{
    line(a,[b[0]-D.arrow.d,b[1]],c,parent);
    polygon([
      [b[0],b[1]],
      [b[0]-D.arrow.d,b[1]-D.arrow.w],
      [b[0]-D.arrow.d,b[1]+D.arrow.w]
    ],c,parent);
  };

  for(const item of D.arrows) arrow(item.a,item.b,item.c);
  for(const item of D.paths) poly(item.p,item.c);
  for(const item of D.circles) circle(item.x,item.y,item.r,item.c);
  polygon(D.diamond,"join");

  for(const stage of D.stages){
    rect(stage.x,stage.y,stage.w,stage.h,"stage");
    text({
      x:stage.x+stage.w/D.half,
      y:stage.y+stage.h/D.half,
      dx:D.z,dy:D.z,t:stage.id,a:"middle",c:"stage-text"
    });
  }
  for(const item of D.labels) text(item);

  for(const item of D.bars) rect(item.x,item.y,item.w,item.h,item.c);
  for(const item of D.guides) line(item.a,item.b,item.c);

  rect(D.card.x,D.card.y,D.card.w,D.card.h,"card");
  for(const chip of D.chips){
    rect(chip.x,chip.y,chip.w,chip.h,"chip");
    text({
      x:chip.x+chip.w/D.half,
      y:chip.y+chip.h/D.half,
      dx:D.z,dy:D.z,t:chip.t,a:"middle",c:"code"
    });
  }
  for(const item of D.cardPaths) poly(item.p,item.c);
  polygon(D.cardDiamond,"join");
  arrow(D.cardArrow.a,D.cardArrow.b,D.cardArrow.c);
  for(const item of D.cardLabels) text(item);

  document.getElementById("fallback").hidden=true;
}catch(error){
  const fallback=document.getElementById("fallback");
  fallback.hidden=false;
  fallback.textContent="Не удалось построить схему. Она должна показать стадии 01–06 последовательно, стадии 07 и 08 одновременно, ожидание обеих ветвей перед 09, продолжение 10–12 и выигрыш в 11 минут против последовательного запуска.";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
