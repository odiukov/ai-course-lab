<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Контур релиза</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f4f7fb;
    --surface: #ffffff;
    --surface-soft: #eef3fa;
    --ink: #172033;
    --muted: #5d6980;
    --line: #68758d;
    --blue: #315fce;
    --blue-soft: #e9f0ff;
    --violet: #7048c8;
    --violet-soft: #f0eaff;
    --cyan: #087f8c;
    --cyan-soft: #e2f7f8;
    --amber: #a86408;
    --amber-soft: #fff2d9;
    --green: #177245;
    --green-soft: #e1f6e9;
    --red: #a3323b;
    --red-soft: #fde7e9;
    --gate: #242b43;
    --gate-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101521;
      --surface: #192131;
      --surface-soft: #202a3d;
      --ink: #edf2fb;
      --muted: #aeb9cc;
      --line: #8794aa;
      --blue: #7da2ff;
      --blue-soft: #202f50;
      --violet: #b497ff;
      --violet-soft: #30284a;
      --cyan: #68d5dc;
      --cyan-soft: #173a41;
      --amber: #ffc66d;
      --amber-soft: #44341d;
      --green: #79d9a6;
      --green-soft: #193b2d;
      --red: #ff9299;
      --red-soft: #48252b;
      --gate: #e7ecf6;
      --gate-ink: #172033;
    }
  }
  html, body { background: var(--page); color: var(--ink); }
  body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; color: var(--ink); }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 420px;
    background: var(--page);
    font-family: inherit;
  }
  .panel { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
  .manifest { fill: var(--blue-soft); stroke: var(--blue); }
  .orchestrator { fill: var(--violet-soft); stroke: var(--violet); }
  .stage { fill: var(--surface); stroke: var(--line); }
  .artifact { fill: var(--cyan-soft); stroke: var(--cyan); }
  .tracker { fill: var(--amber-soft); stroke: var(--amber); }
  .gate { fill: var(--gate); stroke: var(--gate); }
  .ship { fill: var(--green-soft); stroke: var(--green); }
  .rollback { fill: var(--red-soft); stroke: var(--red); }
  .note { fill: var(--surface-soft); stroke: var(--line); stroke-width: 1; }
  .accent { stroke-width: 4; stroke-linecap: round; }
  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .flow-primary { stroke: var(--blue); }
  .flow-artifact { stroke: var(--cyan); }
  .flow-tracker { stroke: var(--amber); }
  .flow-ship { stroke: var(--green); }
  .flow-rollback { stroke: var(--red); }
  .arrow { stroke: none; }
  .head-primary { fill: var(--blue); }
  .head-default { fill: var(--line); }
  .head-artifact { fill: var(--cyan); }
  .head-tracker { fill: var(--amber); }
  .head-ship { fill: var(--green); }
  .head-rollback { fill: var(--red); }
  .card-title { fill: var(--ink); font-size: 16px; font-weight: 700; }
  .card-copy { fill: var(--muted); font-size: 12px; }
  .gate-title, .gate-copy { fill: var(--gate-ink); }
  .gate-title { font-size: 16px; font-weight: 750; }
  .gate-copy { font-size: 12px; }
  .outcome-title { font-size: 15px; font-weight: 750; }
  .ship-text { fill: var(--green); }
  .rollback-text { fill: var(--red); }
  .caption { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
  .arrow-label { fill: var(--muted); font-size: 12px; font-weight: 650; }
  .note-text { fill: var(--ink); font-size: 13px; font-weight: 650; }
  .run-tag { fill: var(--blue); font-size: 12px; font-weight: 750; }
  #fallback { color: var(--red); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Как манифест, оркестратор, хранилища и гейт образуют контур релиза</h1>
  <svg id="diagram" viewBox="0 0 1260 420" width="1260" height="420"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Контур релиза одного прогона</title>
    <desc id="svg-desc">Манифест передаётся оркестратору, затем выполняются стадии 01–12. Артефакты и метрики сохраняются раздельно и объединяются в гейте оценки, который выбирает выпуск или откат.</desc>
    <g id="drawing"></g>
  </svg>
  <p id="fallback" hidden>Схема должна была показать поток «Манифест → Оркестратор → Стадии 01–12», два свидетельства — артефакты и метрики — и решение гейта: выпуск или откат.</p>
</main>
<script>
const diagram = {
  origin: {x: 0, y: 0},
  scale: {x: 1, y: 1},
  labelPad: 8,
  last: -1,
  penultimate: -2,
  headLength: 12,
  headWing: 6,
  background: {x: 0, y: 0, w: 1260, h: 420, r: 16},
  note: {x: 30, y: 374, w: 1200, h: 36, r: 12},
  captions: [
    {x: 30, y: 28, text: "ОДИН ПРОГОН", anchor: "start", cls: "run-tag"},
    {x: 115, y: 130, text: "НАМЕРЕНИЕ", anchor: "middle", cls: "caption"},
    {x: 335, y: 130, text: "КООРДИНАЦИЯ", anchor: "middle", cls: "caption"},
    {x: 570, y: 130, text: "ВЫЧИСЛЕНИЕ", anchor: "middle", cls: "caption"},
    {x: 822, y: 38, text: "ДВА РАЗНЫХ СВИДЕТЕЛЬСТВА", anchor: "middle", cls: "caption"},
    {x: 1037, y: 130, text: "ОДНО РЕШЕНИЕ", anchor: "middle", cls: "caption"}
  ],
  cards: [
    {
      x: 30, y: 150, w: 170, h: 100, r: 14, cls: "manifest",
      accent: {x1: 48, y1: 162, x2: 182, y2: 162, cls: "flow-primary"},
      lines: [
        {x: 115, y: 190, text: "Манифест", cls: "card-title"},
        {x: 115, y: 215, text: "версия • код • seed", cls: "card-copy"},
        {x: 115, y: 234, text: "набор стадий", cls: "card-copy"}
      ]
    },
    {
      x: 245, y: 150, w: 180, h: 100, r: 14, cls: "orchestrator",
      accent: {x1: 263, y1: 162, x2: 407, y2: 162, cls: "flow-primary"},
      lines: [
        {x: 335, y: 190, text: "Оркестратор", cls: "card-title"},
        {x: 335, y: 215, text: "читает рецепт", cls: "card-copy"},
        {x: 335, y: 234, text: "задаёт порядок", cls: "card-copy"}
      ]
    },
    {
      x: 470, y: 150, w: 200, h: 100, r: 14, cls: "stage",
      accent: {x1: 488, y1: 162, x2: 652, y2: 162, cls: "flow-primary"},
      lines: [
        {x: 570, y: 190, text: "Стадии 01–12", cls: "card-title"},
        {x: 570, y: 215, text: "входной → выходной хеш", cls: "card-copy"},
        {x: 570, y: 234, text: "результаты и измерения", cls: "card-copy"}
      ]
    },
    {
      x: 720, y: 55, w: 205, h: 110, r: 14, cls: "artifact",
      accent: {x1: 738, y1: 67, x2: 907, y2: 67, cls: "flow-artifact"},
      lines: [
        {x: 822, y: 96, text: "Хранилище", cls: "card-title"},
        {x: 822, y: 117, text: "артефактов", cls: "card-title"},
        {x: 822, y: 141, text: "чекпоинт • цепочка хешей", cls: "card-copy"}
      ]
    },
    {
      x: 720, y: 255, w: 205, h: 110, r: 14, cls: "tracker",
      accent: {x1: 738, y1: 267, x2: 907, y2: 267, cls: "flow-tracker"},
      lines: [
        {x: 822, y: 303, text: "Трекер экспериментов", cls: "card-title"},
        {x: 822, y: 329, text: "метрики • кривые", cls: "card-copy"},
        {x: 822, y: 348, text: "результаты проверок", cls: "card-copy"}
      ]
    },
    {
      x: 970, y: 150, w: 135, h: 100, r: 14, cls: "gate",
      lines: [
        {x: 1037, y: 186, text: "Гейт оценки", cls: "gate-title"},
        {x: 1037, y: 212, text: "происхождение", cls: "gate-copy"},
        {x: 1037, y: 231, text: "+ измерения", cls: "gate-copy"}
      ]
    },
    {
      x: 1135, y: 75, w: 100, h: 90, r: 14, cls: "ship",
      lines: [
        {x: 1185, y: 113, text: "Выпуск", cls: "outcome-title ship-text"},
        {x: 1185, y: 139, text: "пройдено", cls: "card-copy"}
      ]
    },
    {
      x: 1135, y: 255, w: 100, h: 90, r: 14, cls: "rollback",
      lines: [
        {x: 1185, y: 293, text: "Откат", cls: "outcome-title rollback-text"},
        {x: 1185, y: 319, text: "не пройдено", cls: "card-copy"}
      ]
    }
  ],
  arrows: [
    {points: [{x: 200, y: 200}, {x: 245, y: 200}], cls: "flow-primary", head: "head-primary"},
    {points: [{x: 425, y: 200}, {x: 470, y: 200}], cls: "flow-primary", head: "head-primary"},
    {points: [{x: 670, y: 190}, {x: 695, y: 190}, {x: 695, y: 110}, {x: 720, y: 110}], cls: "flow-artifact", head: "head-artifact"},
    {points: [{x: 670, y: 210}, {x: 695, y: 210}, {x: 695, y: 310}, {x: 720, y: 310}], cls: "flow-tracker", head: "head-tracker"},
    {points: [{x: 925, y: 110}, {x: 945, y: 110}, {x: 945, y: 180}, {x: 970, y: 180}], cls: "flow-artifact", head: "head-artifact"},
    {points: [{x: 925, y: 310}, {x: 945, y: 310}, {x: 945, y: 220}, {x: 970, y: 220}], cls: "flow-tracker", head: "head-tracker"},
    {points: [{x: 1105, y: 188}, {x: 1120, y: 188}, {x: 1120, y: 120}, {x: 1135, y: 120}], cls: "flow-ship", head: "head-ship"},
    {points: [{x: 1105, y: 212}, {x: 1120, y: 212}, {x: 1120, y: 300}, {x: 1135, y: 300}], cls: "flow-rollback", head: "head-rollback"}
  ],
  arrowLabels: [
    {x: 222, y: 200, dx: 0, dy: -1, text: "рецепт", anchor: "middle"},
    {x: 447, y: 200, dx: 0, dy: 1, text: "допустимый порядок", anchor: "middle"},
    {x: 695, y: 91, dx: -1, dy: 0, text: "тяжёлые результаты", anchor: "end"},
    {x: 695, y: 287, dx: -1, dy: 0, text: "метрики и кривые", anchor: "end"}
  ],
  noteText: {
    x: 630, y: 397,
    text: "Выпускается не «последняя папка», а проверенный артефакт того же самого прогона."
  }
};
const origin = diagram.origin;
const scale = diagram.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const ns = "http://www.w3.org/2000/svg";
  const root = document.getElementById("drawing");
  const make = (name, attrs, cls) => {
    const node = document.createElementNS(ns, name);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (cls) node.setAttribute("class", cls);
    root.appendChild(node);
    return node;
  };
  const rect = (item, cls) => make("rect", {
    x: sx(item.x), y: sy(item.y), width: sx(item.w), height: sy(item.h),
    rx: sx(item.r), ry: sy(item.r)
  }, cls);
  const line = (item, cls) => make("line", {
    x1: sx(item.x1), y1: sy(item.y1), x2: sx(item.x2), y2: sy(item.y2)
  }, cls);
  const text = item => {
    const node = make("text", {
      x: sx(item.x), y: sy(item.y),
      "text-anchor": item.anchor || "middle",
      "dominant-baseline": "middle"
    }, item.cls);
    node.textContent = item.text;
    return node;
  };
  const arrow = item => {
    make("polyline", {
      points: item.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
    }, `flow ${item.cls}`);
    const tip = item.points[item.points.length + diagram.last];
    const prev = item.points[item.points.length + diagram.penultimate];
    const dx = tip.x - prev.x;
    const dy = tip.y - prev.y;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const base = {
      x: tip.x - ux * diagram.headLength,
      y: tip.y - uy * diagram.headLength
    };
    const left = {
      x: base.x - uy * diagram.headWing,
      y: base.y + ux * diagram.headWing
    };
    const right = {
      x: base.x + uy * diagram.headWing,
      y: base.y - ux * diagram.headWing
    };
    make("polygon", {
      points: [tip, left, right].map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
    }, `arrow ${item.head}`);
  };

  rect(diagram.background, "panel");
  rect(diagram.note, "note");
  for (const item of diagram.arrows) arrow(item);
  for (const card of diagram.cards) {
    rect(card, `panel ${card.cls}`);
    if (card.accent) line(card.accent, `accent ${card.accent.cls}`);
    for (const item of card.lines) text(item);
  }
  for (const item of diagram.captions) text(item);
  for (const item of diagram.arrowLabels) text({
    x: item.x + item.dx * diagram.labelPad,
    y: item.y + item.dy * diagram.labelPad,
    text: item.text,
    anchor: item.anchor,
    cls: "arrow-label"
  });
  text({
    x: diagram.noteText.x,
    y: diagram.noteText.y,
    text: diagram.noteText.text,
    anchor: "middle",
    cls: "note-text"
  });
} catch (error) {
  document.getElementById("drawing").replaceChildren();
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
