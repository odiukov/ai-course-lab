<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Группы и админ-каналы вместо квадратичной связности</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --panel-alt: #f0f4ff;
    --text: #172033;
    --muted: #566079;
    --border: #cbd3e3;
    --dense: #69758f;
    --dense-soft: #69758f38;
    --agent: #486ee8;
    --agent-ring: #2447ad;
    --admin: #e87935;
    --admin-ring: #9b421c;
    --route: #d35f28;
    --good: #16856d;
    --good-soft: #16856d22;
    --shadow: #17203316;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111622;
      --panel: #192131;
      --panel-alt: #202b40;
      --text: #eef2ff;
      --muted: #b5bfd5;
      --border: #3b4861;
      --dense: #9da9c0;
      --dense-soft: #9da9c038;
      --agent: #7896ff;
      --agent-ring: #b6c5ff;
      --admin: #ff9b5d;
      --admin-ring: #ffd0af;
      --route: #ff9b5d;
      --good: #62d4b6;
      --good-soft: #62d4b622;
      --shadow: #00000035;
    }
  }

  html {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  body {
    max-width: 1000px;
  }

  h2 {
    font-size: 18px;
    font-weight: bold;
    color: var(--text);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .panel-alt {
    fill: var(--panel-alt);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .divider {
    stroke: var(--border);
    stroke-width: 2px;
  }

  .dense-link {
    stroke: var(--dense-soft);
    stroke-width: 1px;
  }

  .local-link {
    stroke: var(--agent);
    stroke-width: 1px;
  }

  .route-link {
    stroke: var(--route);
    stroke-width: 2px;
    fill: none;
  }

  .agent {
    fill: var(--agent);
    stroke: var(--agent-ring);
    stroke-width: 2px;
  }

  .admin {
    fill: var(--admin);
    stroke: var(--admin-ring);
    stroke-width: 2px;
  }

  .group-cell {
    fill: var(--panel-alt);
    stroke: var(--border);
    stroke-width: 1px;
  }

  .stat {
    fill: var(--good-soft);
    stroke: var(--good);
    stroke-width: 1px;
  }

  .heading {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .number {
    fill: var(--text);
    font-size: 22px;
    font-weight: bold;
  }

  .label {
    fill: var(--muted);
    font-size: 13px;
  }

  .small {
    fill: var(--muted);
    font-size: 12px;
  }

  .admin-label {
    fill: var(--route);
    font-size: 12px;
    font-weight: bold;
  }

  .conclusion {
    fill: var(--good);
    font-size: 14px;
    font-weight: bold;
  }
</style>
</head>
<body>
<h2 id="diagram-title">Группы и админ-каналы вместо квадратичной связности</h2>
<svg id="diagram" viewBox="0 0 1000 450" role="img"
     aria-labelledby="diagram-title diagram-description"
     preserveAspectRatio="xMidYMid meet">
  <desc id="diagram-description">
    Сравнение полной сети из тысячи агентов с группами по десять агентов
    и отдельными администраторами для межгрупповой маршрутизации.
  </desc>
</svg>

<script>
const data = [{
  origin: [0, 0],
  scale: [1, 1],
  one: 1,
  canvas: [1000, 450],
  corner: 14,
  nodeRadius: 8,
  adminRadius: 9,
  tinyRadius: 3,
  cellRadius: 3,
  labelOffset: 9,
  panels: [
    [20, 45, 455, 345],
    [525, 45, 455, 345]
  ],
  divider: [500, 55, 500, 380],
  leftNodes: [
    [120, 135], [205, 105], [300, 120], [390, 165], [405, 245],
    [345, 310], [250, 330], [155, 305], [85, 240], [235, 220]
  ],
  groupNodes: [
    [625, 120], [674, 139], [700, 181], [690, 231], [653, 264],
    [603, 264], [564, 232], [551, 182], [576, 139], [625, 198]
  ],
  groupFrame: [540, 87, 180, 204],
  adminArrow: [635, 120, 774, 120],
  grid: [792, 139, 10, 10, 15, 15, 10],
  routes: [
    [0, 0, 6, 2],
    [6, 2, 9, 6],
    [1, 8, 5, 5],
    [5, 5, 8, 9],
    [2, 4, 7, 3]
  ],
  stats: [
    [55, 338, 385, 38],
    [545, 338, 410, 38]
  ],
  marker: [0, 0, 12, 10, 10, 5],
  dash: [6, 5],
  fallback: [40, 110],
  labels: {
    leftHeading: [247, 73],
    rightHeading: [752, 73],
    leftCount: [247, 99],
    leftPairs: [247, 357],
    leftNote: [247, 374],
    groupCaption: [630, 105],
    adminName: [635, 120],
    arrowNote: [648, 120],
    gridCaption: [860, 109],
    gridNote: [860, 298],
    groupCount: [630, 313],
    groupPairs: [630, 329],
    adminCount: [860, 313],
    adminNote: [860, 329],
    leftConclusion: [247, 363],
    rightConclusion: [750, 363]
  }
}];

const [cfg] = data;
const [originX, originY] = cfg.origin;
const [scaleX, scaleY] = cfg.scale;
const origin = { x: originX, y: originY };
const scale = { x: scaleX, y: scaleY };

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

const svg = document.getElementById("diagram");
const ns = "http://www.w3.org/2000/svg";

function make(name, attrs, className, content) {
  const node = document.createElementNS(ns, name);
  Object.entries(attrs || {}).forEach(([key, value]) => node.setAttribute(key, value));
  if (className) node.setAttribute("class", className);
  if (content !== undefined) node.textContent = content;
  return node;
}

function line(parent, points, className, extra) {
  const [x1, y1, x2, y2] = points;
  parent.appendChild(make("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    ...(extra || {})
  }, className));
}

function rect(parent, box, className, radius) {
  const [x, y, width, height] = box;
  parent.appendChild(make("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(width) - sx(cfg.origin[0]),
    height: sy(height) - sy(cfg.origin[1]),
    rx: sx(radius) - sx(cfg.origin[0]),
    ry: sy(radius) - sy(cfg.origin[1])
  }, className));
}

function circle(parent, point, radius, className) {
  const [x, y] = point;
  parent.appendChild(make("circle", {
    cx: sx(x),
    cy: sy(y),
    r: sx(radius) - sx(cfg.origin[0])
  }, className));
}

function text(parent, point, value, className, anchor, dx, dy) {
  const [x, y] = point;
  parent.appendChild(make("text", {
    x: sx(x),
    y: sy(y),
    "text-anchor": anchor,
    dx: dx,
    dy: dy
  }, className, value));
}

function connectAll(parent, nodes, className) {
  nodes.forEach((from, index) => {
    nodes.slice(index + cfg.one).forEach(to => {
      line(parent, [from[0], from[1], to[0], to[1]], className);
    });
  });
}

function render() {
  const background = make("rect", {
    x: sx(cfg.origin[0]),
    y: sy(cfg.origin[1]),
    width: sx(cfg.canvas[0]) - sx(cfg.origin[0]),
    height: sy(cfg.canvas[1]) - sy(cfg.origin[1]),
    fill: "var(--bg)"
  });

  const defs = make("defs");
  const [mx, my, mw, mh, refX, refY] = cfg.marker;
  const marker = make("marker", {
    id: "arrow",
    viewBox: [
      sx(mx), sy(my),
      sx(mw) - sx(mx),
      sy(mh) - sy(my)
    ].join(" "),
    markerWidth: sx(mw) - sx(mx),
    markerHeight: sy(mh) - sy(my),
    refX: sx(refX),
    refY: sy(refY),
    orient: "auto",
    markerUnits: "userSpaceOnUse"
  });
  marker.appendChild(make("path", {
    d: [
      "M", sx(mx), sy(my),
      "L", sx(refX), sy(refY),
      "L", sx(mx), sy(mh),
      "Z"
    ].join(" "),
    fill: "var(--route)"
  }));
  defs.appendChild(marker);

  const panels = make("g");
  rect(panels, cfg.panels[0], "panel", cfg.corner);
  rect(panels, cfg.panels[1], "panel-alt", cfg.corner);
  line(panels, cfg.divider, "divider");

  const left = make("g");
  connectAll(left, cfg.leftNodes, "dense-link");
  cfg.leftNodes.forEach(point => circle(left, point, cfg.nodeRadius, "agent"));

  text(left, cfg.labels.leftHeading, "Без групп: каждый ↔ каждый",
    "heading", "middle", cfg.origin[0], cfg.origin[1]);
  text(left, cfg.labels.leftCount, "1000 агентов",
    "number", "middle", cfg.origin[0], -cfg.labelOffset);
  text(left, cfg.labels.leftPairs, "499 500 возможных пар",
    "number", "middle", cfg.origin[0], cfg.origin[1]);

  const right = make("g");
  rect(right, cfg.groupFrame, "panel", cfg.corner);
  connectAll(right, cfg.groupNodes, "local-link");
  cfg.groupNodes.forEach((point, index) => {
    circle(
      right,
      point,
      index === cfg.origin[0] ? cfg.adminRadius : cfg.nodeRadius,
      index === cfg.origin[0] ? "admin" : "agent"
    );
  });

  text(right, cfg.labels.rightHeading, "Группы по 10",
    "heading", "middle", cfg.origin[0], cfg.origin[1]);
  text(right, cfg.labels.groupCaption, "одна группа",
    "label", "middle", cfg.origin[0], -cfg.labelOffset);
  text(right, cfg.labels.adminName, "админ",
    "admin-label", "end", -cfg.labelOffset, -cfg.labelOffset);

  line(right, cfg.adminArrow, "route-link", {
    "marker-end": "url(#arrow)"
  });
  text(right, cfg.labels.arrowNote, "итог или запрос",
    "small", "start", cfg.labelOffset, -cfg.labelOffset);

  const [gx, gy, columns, rows, stepX, stepY, cellSize] = cfg.grid;
  const routeLayer = make("g");
  cfg.routes.forEach(route => {
    const [fromColumn, fromRow, toColumn, toRow] = route;
    line(routeLayer, [
      gx + fromColumn * stepX,
      gy + fromRow * stepY,
      gx + toColumn * stepX,
      gy + toRow * stepY
    ], "route-link", {
      "stroke-dasharray": [
        sx(cfg.dash[0]) - sx(cfg.origin[0]),
        sy(cfg.dash[1]) - sy(cfg.origin[1])
      ].join(" ")
    });
  });
  right.appendChild(routeLayer);

  Array.from({ length: rows }).forEach((unusedRow, row) => {
    Array.from({ length: columns }).forEach((unusedColumn, column) => {
      const x = gx + column * stepX;
      const y = gy + row * stepY;
      rect(right, [
        x - cellSize / cfg.scale[0] / cfg.scale[0],
        y - cellSize / cfg.scale[1] / cfg.scale[1],
        cellSize * cfg.scale[0],
        cellSize * cfg.scale[1]
      ], "group-cell", cfg.cellRadius);
      circle(right, [x, y], cfg.tinyRadius, "admin");
    });
  });

  text(right, cfg.labels.gridCaption, "100 администраторов",
    "admin-label", "middle", cfg.origin[0], -cfg.labelOffset);
  text(right, cfg.labels.gridNote, "редкие межгрупповые маршруты",
    "small", "middle", cfg.origin[0], cfg.labelOffset);
  text(right, cfg.labels.groupCount, "10 агентов",
    "number", "middle", cfg.origin[0], cfg.origin[1]);
  text(right, cfg.labels.groupPairs, "45 внутренних пар",
    "label", "middle", cfg.origin[0], cfg.origin[1]);
  text(right, cfg.labels.adminCount, "100 групп",
    "number", "middle", cfg.origin[0], cfg.origin[1]);
  text(right, cfg.labels.adminNote, "по 10 агентов",
    "label", "middle", cfg.origin[0], cfg.origin[1]);

  const summaries = make("g");
  rect(summaries, cfg.stats[0], "stat", cfg.corner);
  rect(summaries, cfg.stats[1], "stat", cfg.corner);
  text(summaries, cfg.labels.leftConclusion, "рост числа связей — квадратичный",
    "conclusion", "middle", cfg.origin[0], cfg.labelOffset);
  text(summaries, cfg.labels.rightConclusion, "4500 локальных пар — рост примерно линейный",
    "conclusion", "middle", cfg.origin[0], cfg.labelOffset);

  svg.replaceChildren(background, defs, panels, left, right, summaries);
}

try {
  render();
} catch (error) {
  const fallback = make("g");
  const [fx, fy] = cfg.fallback;
  text(fallback, [fx, fy],
    "Схема должна была показать: 1000 агентов образуют 499 500 пар.",
    "heading", "start", cfg.origin[0], cfg.origin[1]);
  text(fallback, [fx, fy],
    "В группах по 10 остаётся 45 внутренних пар и 100 администраторов.",
    "label", "start", cfg.origin[0], cfg.labelOffset + cfg.labelOffset + cfg.labelOffset);
  svg.replaceChildren(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
