<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Где исчезает градиент ванильной потери</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #f0f4fa;
      --ink: #182230;
      --muted: #526173;
      --line: #8290a3;
      --blue: #2368c4;
      --blue-soft: #e8f1ff;
      --amber: #a95600;
      --amber-soft: #fff0d5;
      --weak: #c43f45;
      --weak-soft: #ffeaeb;
      --strong: #087d55;
      --strong-soft: #e2f7ee;
      --shadow: #dbe1e9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192231;
        --panel-soft: #202c3c;
        --ink: #edf3fb;
        --muted: #b7c4d4;
        --line: #7d8da2;
        --blue: #75b3ff;
        --blue-soft: #203b5c;
        --amber: #ffc16d;
        --amber-soft: #49351c;
        --weak: #ff9297;
        --weak-soft: #4b292e;
        --strong: #66d7aa;
        --strong-soft: #193f34;
        --shadow: #0b1018;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--shadow);
    }

    .title {
      margin: 0;
      padding: 14px 18px 8px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: bold;
    }

    .subtitle {
      margin: 0;
      padding: 0 18px 10px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--panel);
    }

    .box {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .logit-box {
      fill: var(--blue-soft);
      stroke: var(--blue);
    }

    .sigmoid-box {
      fill: var(--panel-soft);
      stroke: var(--blue);
    }

    .gate-box {
      fill: var(--amber-soft);
      stroke: var(--amber);
      stroke-width: 3px;
    }

    .vanilla-box {
      fill: var(--weak-soft);
      stroke: var(--weak);
    }

    .non-saturating-box {
      fill: var(--strong-soft);
      stroke: var(--strong);
    }

    .result-weak {
      fill: var(--panel);
      stroke: var(--weak);
      stroke-width: 2px;
    }

    .result-strong {
      fill: var(--panel);
      stroke: var(--strong);
      stroke-width: 2px;
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .flow-blue {
      stroke: var(--blue);
    }

    .flow-weak {
      stroke: var(--weak);
      stroke-width: 2px;
    }

    .flow-strong {
      stroke: var(--strong);
      stroke-width: 5px;
    }

    .connector {
      fill: none;
      stroke: var(--amber);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .head {
      stroke: none;
    }

    .head-line {
      fill: var(--line);
    }

    .head-blue {
      fill: var(--blue);
    }

    .head-weak {
      fill: var(--weak);
    }

    .head-strong {
      fill: var(--strong);
    }

    text {
      fill: var(--ink);
      font-size: 17px;
      dominant-baseline: middle;
    }

    .small {
      fill: var(--muted);
      font-size: 14px;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .formula {
      font-size: 21px;
      font-weight: bold;
    }

    .node-title {
      font-size: 20px;
      font-weight: bold;
    }

    .weak-text {
      fill: var(--weak);
    }

    .strong-text {
      fill: var(--strong);
    }

    .amber-text {
      fill: var(--amber);
    }

    .blue-text {
      fill: var(--blue);
    }

    .conclusion {
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      margin: 0;
      padding: 24px;
      color: var(--ink);
      background: var(--panel);
      font-size: 17px;
      line-height: 1.45;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title figure-subtitle">
    <h2 class="title" id="figure-title">Где исчезает градиент ванильной потери</h2>
    <p class="subtitle" id="figure-subtitle">
      Один и тот же ответ дискриминатора даёт генератору радикально разные сигналы.
    </p>

    <svg
      id="gradient-diagram"
      viewBox="0 0 1200 480"
      width="1200"
      height="480"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Цепочка от логита через сигмоиду к ванильной и non-saturating потерям"
    ></svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать цепочку s → p = σ(s): при p = 0,01
      множитель dp/ds равен 0,0099, поэтому градиент ванильной
      log(1−p) по логиту равен −0,01, а градиент −log p равен −0,99.
    </p>
  </figure>

  <script>
    const diagram = [
      { left: -5, top: -24, right: 115, bottom: 24 },
      { x: 50, y: 240 },
      { x: 10, y: 10 },
      [
        { kind: "logit-box", left: 0, top: -5, right: 14, bottom: 5 },
        { kind: "sigmoid-box", left: 24, top: -6, right: 48, bottom: 6 },
        { kind: "gate-box", left: 24, top: 8, right: 48, bottom: 15 },
        { kind: "vanilla-box", left: 59, top: -20, right: 110, bottom: -3 },
        { kind: "non-saturating-box", left: 59, top: 3, right: 110, bottom: 20 },
        { kind: "result-weak", left: 62, top: -10.7, right: 107, bottom: -4.7 },
        { kind: "result-strong", left: 62, top: 11.2, right: 107, bottom: 17.8 }
      ],
      [
        {
          kind: "flow flow-blue",
          line: { x1: 14, y1: 0, x2: 23, y2: 0 },
          head: [
            { x: 23, y: 0 },
            { x: 21.2, y: -1.1 },
            { x: 21.2, y: 1.1 }
          ],
          headKind: "head head-blue"
        },
        {
          kind: "flow flow-weak",
          line: { x1: 48, y1: -0.8, x2: 58, y2: -11.5 },
          head: [
            { x: 58, y: -11.5 },
            { x: 55.9, y: -10.9 },
            { x: 57.2, y: -9.7 }
          ],
          headKind: "head head-weak"
        },
        {
          kind: "flow flow-strong",
          line: { x1: 48, y1: 0.8, x2: 58, y2: 11.5 },
          head: [
            { x: 58, y: 11.5 },
            { x: 57.2, y: 9.7 },
            { x: 55.9, y: 10.9 }
          ],
          headKind: "head head-strong"
        }
      ],
      [
        { kind: "connector", x1: 36, y1: 6, x2: 36, y2: 8 }
      ],
      [
        {
          x: 7, y: -1.1, anchor: "middle",
          kind: "node-title blue-text", text: "s"
        },
        {
          x: 7, y: 2.5, anchor: "middle",
          kind: "small", text: "логит"
        },
        {
          x: 18.5, y: -2.5, anchor: "middle",
          kind: "small", text: "сигмоида"
        },
        {
          x: 36, y: -2, anchor: "middle",
          kind: "formula blue-text", text: "p = σ(s)"
        },
        {
          x: 36, y: 2.3, anchor: "middle",
          kind: "node-title", text: "p = 0,01"
        },
        {
          x: 36, y: 10.2, anchor: "middle",
          kind: "eyebrow amber-text", text: "МНОЖИТЕЛЬ СИГМОИДЫ"
        },
        {
          x: 36, y: 13, anchor: "middle",
          kind: "formula amber-text", text: "dp/ds = p(1−p) = 0,0099"
        },
        {
          x: 61.5, y: -17.1, anchor: "start",
          kind: "node-title weak-text", text: "Ванильная: log(1−p)"
        },
        {
          x: 61.5, y: -13.5, anchor: "start",
          kind: "small", text: "наклон по p ≈ −1,01 — логарифм не плоский"
        },
        {
          x: 84.5, y: -8.4, anchor: "middle",
          kind: "formula weak-text", text: "dL/ds = −p = −0,01"
        },
        {
          x: 84.5, y: -5.8, anchor: "middle",
          kind: "small weak-text", text: "слабый сигнал"
        },
        {
          x: 61.5, y: 6.1, anchor: "start",
          kind: "node-title strong-text", text: "Non-saturating: −log p"
        },
        {
          x: 61.5, y: 9.5, anchor: "start",
          kind: "small", text: "тот же ответ дискриминатора: p = 0,01"
        },
        {
          x: 84.5, y: 13.9, anchor: "middle",
          kind: "formula strong-text", text: "dL/ds = −(1−p) = −0,99"
        },
        {
          x: 84.5, y: 16.7, anchor: "middle",
          kind: "small strong-text", text: "почти полный сигнал"
        },
        {
          x: 0, y: 22, anchor: "start",
          kind: "conclusion", text: "Вывод: сигнал исчезает на переходе s → p, а не в log(1−p)."
        }
      ]
    ];

    const [
      canvas,
      origin,
      scale,
      boxes,
      arrows,
      connectors,
      labels
    ] = diagram;

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("gradient-diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      svg.setAttribute(
        "viewBox",
        [
          sx(canvas.left),
          sy(canvas.top),
          sx(canvas.right) - sx(canvas.left),
          sy(canvas.bottom) - sy(canvas.top)
        ].join(" ")
      );

      const make = (tag, attributes, text) => {
        const node = document.createElementNS(namespace, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, value);
        });

        if (text !== undefined) {
          node.textContent = text;
        }

        return node;
      };

      const layerBoxes = make("g", { "aria-hidden": "true" });
      const layerFlows = make("g", { "aria-hidden": "true" });
      const layerText = make("g", { "aria-hidden": "true" });

      boxes.forEach((box) => {
        layerBoxes.appendChild(
          make("rect", {
            x: sx(box.left),
            y: sy(box.top),
            width: sx(box.right) - sx(box.left),
            height: sy(box.bottom) - sy(box.top),
            class: `box ${box.kind}`
          })
        );
      });

      connectors.forEach((connector) => {
        layerFlows.appendChild(
          make("line", {
            x1: sx(connector.x1),
            y1: sy(connector.y1),
            x2: sx(connector.x2),
            y2: sy(connector.y2),
            class: connector.kind
          })
        );
      });

      arrows.forEach((arrow) => {
        layerFlows.appendChild(
          make("line", {
            x1: sx(arrow.line.x1),
            y1: sy(arrow.line.y1),
            x2: sx(arrow.line.x2),
            y2: sy(arrow.line.y2),
            class: arrow.kind
          })
        );

        layerFlows.appendChild(
          make("polygon", {
            points: arrow.head
              .map((point) => `${sx(point.x)},${sy(point.y)}`)
              .join(" "),
            class: arrow.headKind
          })
        );
      });

      labels.forEach((label) => {
        layerText.appendChild(
          make(
            "text",
            {
              x: sx(label.x),
              y: sy(label.y),
              "text-anchor": label.anchor,
              class: label.kind
            },
            label.text
          )
        );
      });

      svg.appendChild(layerBoxes);
      svg.appendChild(layerFlows);
      svg.appendChild(layerText);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("gradient-diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
