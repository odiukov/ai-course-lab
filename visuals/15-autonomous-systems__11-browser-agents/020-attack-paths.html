<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пути вредоносной инструкции к действию агента</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #eef3f8;
    --ink: #172033;
    --muted: #596579;
    --line: #66758d;
    --border: #c8d2df;
    --context: #e3efff;
    --context-line: #3574c6;
    --model: #eee8ff;
    --model-line: #7558bd;
    --tool: #e2f5ee;
    --tool-line: #258565;
    --danger: #fff0ed;
    --danger-line: #c84b3d;
    --guard: #fff8dc;
    --guard-line: #b98718;
    --p1: #3478c7;
    --p2: #7158bd;
    --p3: #268467;
    --p4: #bf5b3f;
    --p5: #ad7619;
    --p6: #a44875;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101620;
      --panel: #182130;
      --panel-soft: #202b3b;
      --ink: #eef4ff;
      --muted: #b7c2d3;
      --line: #91a1b8;
      --border: #38475c;
      --context: #172d49;
      --context-line: #72afff;
      --model: #292341;
      --model-line: #b6a0ff;
      --tool: #17372f;
      --tool-line: #67cfaa;
      --danger: #422421;
      --danger-line: #ff8e80;
      --guard: #3a3218;
      --guard-line: #e7bd59;
      --p1: #6baeff;
      --p2: #b39cff;
      --p3: #65cfa9;
      --p4: #ff9278;
      --p5: #e8bb60;
      --p6: #ed8abd;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .diagram-shell {
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .diagram-title {
    margin: 0;
    padding: 12px 18px 8px;
    background: var(--bg);
    color: var(--ink);
    font-size: 20px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 456px;
    background: var(--bg);
  }

  .card {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2px;
  }

  .stage-context {
    fill: var(--context);
    stroke: var(--context-line);
    stroke-width: 3px;
  }

  .stage-model {
    fill: var(--model);
    stroke: var(--model-line);
    stroke-width: 3px;
  }

  .stage-tool {
    fill: var(--tool);
    stroke: var(--tool-line);
    stroke-width: 3px;
  }

  .stage-danger {
    fill: var(--danger);
    stroke: var(--danger-line);
    stroke-width: 3px;
  }

  .guard-panel {
    fill: var(--guard);
    stroke: var(--guard-line);
    stroke-width: 2px;
  }

  .branch, .chain, .impact {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .branch { stroke-width: 3px; }
  .chain { stroke: var(--line); stroke-width: 3px; }
  .impact { stroke: var(--danger-line); stroke-width: 3px; }

  .p1 { stroke: var(--p1); fill: var(--p1); }
  .p2 { stroke: var(--p2); fill: var(--p2); }
  .p3 { stroke: var(--p3); fill: var(--p3); }
  .p4 { stroke: var(--p4); fill: var(--p4); }
  .p5 { stroke: var(--p5); fill: var(--p5); }
  .p6 { stroke: var(--p6); fill: var(--p6); }

  .merge {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 3px;
  }

  .arrow-head { fill: var(--line); }
  .impact-head { fill: var(--danger-line); }

  text {
    fill: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .section-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .source-main {
    font-size: 16px;
    font-weight: bold;
  }

  .source-sub {
    fill: var(--muted);
    font-size: 13px;
  }

  .stage-main {
    font-size: 16px;
    font-weight: bold;
  }

  .stage-sub {
    fill: var(--muted);
    font-size: 13px;
  }

  .arrow-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .guard-main {
    font-size: 14px;
    font-weight: bold;
  }

  .guard-sub {
    fill: var(--muted);
    font-size: 12px;
  }

  .footer-note {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 17px;
  }
</style>
</head>
<body>
<figure class="diagram-shell" aria-labelledby="diagram-heading">
  <h2 class="diagram-title" id="diagram-heading">Пути вредоносной инструкции к действию агента</h2>
  <svg id="diagram" viewBox="0 0 1500 456" width="1500" height="456"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-heading diagram-description">
    <desc id="diagram-description">Шесть способов доставки вредоносной инструкции сходятся в контекст агента, после чего модель выбирает действие, браузерный инструмент выполняет его, а результат изменяет состояние.</desc>
  </svg>
</figure>

<script>
const diagram = Object.freeze({
  zero: 0,
  sections: [
    {x: 22, y: 15, text: "ШЕСТЬ ПОВЕРХНОСТЕЙ ДОСТАВКИ", anchor: "start"},
    {x: 472, y: 120, text: "ЕДИНАЯ ЦЕПОЧКА ИСПОЛНЕНИЯ", anchor: "start"}
  ],
  sources: [
    {
      box: [22, 28, 300, 72], stripe: [22, 28, 31, 72], tone: "p1",
      lines: [
        {x: 46, y: 48, text: "Видимый текст", className: "source-main"},
        {x: 46, y: 65, text: "инструкция на странице", className: "source-sub"}
      ],
      path: [[300, 50], [346, 50], [424, 197]]
    },
    {
      box: [22, 90, 300, 134], stripe: [22, 90, 31, 134], tone: "p2",
      lines: [
        {x: 46, y: 110, text: "URL-фрагмент", className: "source-main"},
        {x: 46, y: 127, text: "#fragment или строка запроса", className: "source-sub"}
      ],
      path: [[300, 112], [360, 112], [424, 197]]
    },
    {
      box: [22, 152, 300, 196], stripe: [22, 152, 31, 196], tone: "p3",
      lines: [
        {x: 46, y: 172, text: "Постоянная память", className: "source-main"},
        {x: 46, y: 189, text: "заряд из прошлой сессии", className: "source-sub"}
      ],
      path: [[300, 174], [379, 174], [424, 197]]
    },
    {
      box: [22, 214, 300, 258], stripe: [22, 214, 31, 258], tone: "p4",
      lines: [
        {x: 46, y: 234, text: "CSRF", className: "source-main"},
        {x: 46, y: 251, text: "в авторизованной сессии", className: "source-sub"}
      ],
      path: [[300, 236], [379, 236], [424, 197]]
    },
    {
      box: [22, 276, 300, 320], stripe: [22, 276, 31, 320], tone: "p5",
      lines: [
        {x: 46, y: 296, text: "Кнопка в один клик", className: "source-main"},
        {x: 46, y: 313, text: "безобидный переход с зарядом", className: "source-sub"}
      ],
      path: [[300, 298], [360, 298], [424, 197]]
    },
    {
      box: [22, 338, 300, 382], stripe: [22, 338, 31, 382], tone: "p6",
      lines: [
        {x: 46, y: 358, text: "Дыра CSP", className: "source-main"},
        {x: 46, y: 375, text: "в поверхности хоста агента", className: "source-sub"}
      ],
      path: [[300, 360], [346, 360], [424, 197]]
    }
  ],
  merge: {x: 424, y: 197, r: 8},
  stages: [
    {
      box: [472, 155, 678, 239], className: "stage-context",
      lines: [
        {x: 575, y: 184, text: "КОНТЕКСТ АГЕНТА", className: "stage-main", anchor: "middle"},
        {x: 575, y: 208, text: "недоверенная строка", className: "stage-sub", anchor: "middle"},
        {x: 575, y: 226, text: "включена в ввод", className: "stage-sub", anchor: "middle"}
      ]
    },
    {
      box: [738, 155, 920, 239], className: "stage-model",
      lines: [
        {x: 829, y: 184, text: "МОДЕЛЬ", className: "stage-main", anchor: "middle"},
        {x: 829, y: 208, text: "принимает строку", className: "stage-sub", anchor: "middle"},
        {x: 829, y: 226, text: "за указание", className: "stage-sub", anchor: "middle"}
      ]
    },
    {
      box: [980, 155, 1192, 239], className: "stage-tool",
      lines: [
        {x: 1086, y: 182, text: "БРАУЗЕРНЫЙ", className: "stage-main", anchor: "middle"},
        {x: 1086, y: 202, text: "ИНСТРУМЕНТ", className: "stage-main", anchor: "middle"},
        {x: 1086, y: 226, text: "имеет полномочия", className: "stage-sub", anchor: "middle"}
      ]
    },
    {
      box: [1252, 155, 1478, 239], className: "stage-danger",
      lines: [
        {x: 1365, y: 184, text: "ДЕЙСТВИЕ", className: "stage-main", anchor: "middle"},
        {x: 1365, y: 208, text: "отправка формы", className: "stage-sub", anchor: "middle"},
        {x: 1365, y: 226, text: "или переход по ссылке", className: "stage-sub", anchor: "middle"}
      ]
    },
    {
      box: [1252, 300, 1478, 374], className: "stage-danger",
      lines: [
        {x: 1365, y: 329, text: "ПОСЛЕДСТВИЯ", className: "stage-main", anchor: "middle"},
        {x: 1365, y: 353, text: "реальное изменение", className: "stage-sub", anchor: "middle"}
      ]
    }
  ],
  arrows: [
    {line: [424, 197, 462, 197], head: [[452, 190], [462, 197], [452, 204]]},
    {line: [678, 197, 728, 197], head: [[718, 190], [728, 197], [718, 204]]},
    {line: [920, 197, 970, 197], head: [[960, 190], [970, 197], [960, 204]]},
    {line: [1192, 197, 1242, 197], head: [[1232, 190], [1242, 197], [1232, 204]]}
  ],
  arrowLabels: [
    {x: 433, y: 143, text: "попадает в", anchor: "start"},
    {x: 703, y: 143, text: "считается командой", anchor: "middle"},
    {x: 945, y: 143, text: "выбирает действие", anchor: "middle"},
    {x: 1217, y: 143, text: "выполняет", anchor: "middle"}
  ],
  impact: {
    line: [1365, 239, 1365, 290],
    head: [[1357, 279], [1365, 290], [1373, 279]],
    label: {x: 1345, y: 273, text: "изменяет состояние", anchor: "end"}
  },
  guard: {
    box: [472, 286, 1192, 394],
    lines: [
      {x: 492, y: 312, text: "ГДЕ РАЗОРВАТЬ ЦЕПЬ", className: "section-label"},
      {x: 492, y: 341, text: "Фильтр контекста", className: "guard-main"},
      {x: 492, y: 362, text: "Не включать недоверенный", className: "guard-sub"},
      {x: 492, y: 379, text: "фрагмент во ввод", className: "guard-sub"},
      {x: 726, y: 341, text: "Разделение ролей", className: "guard-main"},
      {x: 726, y: 362, text: "Не считать содержимое", className: "guard-sub"},
      {x: 726, y: 379, text: "запросом пользователя", className: "guard-sub"},
      {x: 958, y: 341, text: "Подтверждение", className: "guard-main"},
      {x: 958, y: 362, text: "Остановить чувствительное", className: "guard-sub"},
      {x: 958, y: 379, text: "действие до выполнения", className: "guard-sub"}
    ]
  },
  footer: {
    x: 750, y: 432,
    text: "Шесть способов доставки — один механизм выполнения.",
    anchor: "middle"
  },
  fallback: [
    {x: 52, y: 190, text: "Шесть входов должны были сойтись в контекст агента,"},
    {x: 52, y: 220, text: "а затем пройти через модель и браузерный инструмент к действию с последствиями."}
  ]
});

const origin = Object.freeze({x: 0, y: 0});
const scale = Object.freeze({x: 1, y: 1});
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const make = name => document.createElementNS(svg.namespaceURI, name);
const set = (element, attributes) => {
  for (const [name, value] of Object.entries(attributes)) {
    element.setAttribute(name, value);
  }
  return element;
};
const append = element => svg.appendChild(element);

const rect = (box, className) => append(set(make("rect"), {
  x: sx(box[0]),
  y: sy(box[1]),
  width: sx(box[2]) - sx(box[0]),
  height: sy(box[3]) - sy(box[1]),
  class: className
}));

const textLine = (line, inheritedClass) => {
  const element = set(make("text"), {
    x: sx(line.x),
    y: sy(line.y),
    class: line.className || inheritedClass,
    "text-anchor": line.anchor || "start"
  });
  element.textContent = line.text;
  return append(element);
};

const polyline = (points, className) => append(set(make("polyline"), {
  points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
  class: className
}));

const segment = (line, className) => append(set(make("line"), {
  x1: sx(line[0]),
  y1: sy(line[1]),
  x2: sx(line[2]),
  y2: sy(line[3]),
  class: className
}));

try {
  for (const label of diagram.sections) {
    textLine({...label, className: "section-label"});
  }

  for (const source of diagram.sources) {
    rect(source.box, "card");
    rect(source.stripe, source.tone);
    polyline(source.path, `branch ${source.tone}`);
    for (const line of source.lines) textLine(line);
  }

  append(set(make("circle"), {
    cx: sx(diagram.merge.x),
    cy: sy(diagram.merge.y),
    r: sx(diagram.merge.r) - sx(diagram.zero),
    class: "merge"
  }));

  for (const stage of diagram.stages) {
    rect(stage.box, stage.className);
    for (const line of stage.lines) textLine(line);
  }

  for (const arrow of diagram.arrows) {
    segment(arrow.line, "chain");
    polyline(arrow.head, "arrow-head");
  }

  for (const label of diagram.arrowLabels) {
    textLine({...label, className: "arrow-label"});
  }

  segment(diagram.impact.line, "impact");
  polyline(diagram.impact.head, "impact-head");
  textLine({...diagram.impact.label, className: "arrow-label"});

  rect(diagram.guard.box, "guard-panel");
  for (const line of diagram.guard.lines) textLine(line);

  textLine({...diagram.footer, className: "footer-note"});
} catch (error) {
  svg.replaceChildren();
  for (const line of diagram.fallback) {
    textLine({...line, className: "fallback"});
  }
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
