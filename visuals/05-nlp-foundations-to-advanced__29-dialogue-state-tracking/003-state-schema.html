<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как реплики превращаются в состояние бронирования</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f4ed;
    --panel: #fffdf8;
    --panel-strong: #f0eadf;
    --ink: #292823;
    --muted: #666158;
    --line: #aaa398;
    --accent: #176b5d;
    --accent-bg: #dff2eb;
    --change: #a34d15;
    --change-bg: #f8e6d8;
    --final: #2856a3;
    --final-bg: #e3ebfa;
    --shadow: #ded8cd;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171a19;
      --panel: #202524;
      --panel-strong: #292f2d;
      --ink: #f2eee6;
      --muted: #bbb5aa;
      --line: #716f69;
      --accent: #76d9c1;
      --accent-bg: #173e36;
      --change: #f0a36f;
      --change-bg: #4a2d1e;
      --final: #9dbbf5;
      --final-bg: #243958;
      --shadow: #101211;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: unset;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    max-height: 520px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  .title {
    margin: unset;
    padding: 10px 14px 8px;
    font-size: 21px;
    line-height: normal;
    font-weight: bold;
    color: var(--ink);
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  .guide {
    stroke: var(--line);
    stroke-width: 2px;
    fill: none;
  }

  .arrow {
    stroke: var(--accent);
    stroke-width: 3px;
    fill: none;
  }

  .transition {
    stroke: var(--line);
    stroke-width: 2px;
    fill: none;
  }

  .card {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .card-final {
    fill: var(--panel);
    stroke: var(--final);
    stroke-width: 3px;
  }

  .speech {
    fill: var(--panel-strong);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .state {
    fill: var(--panel);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .state-final {
    fill: var(--final-bg);
    stroke: var(--final);
    stroke-width: 3px;
  }

  .change-add {
    fill: var(--accent-bg);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .change-replace {
    fill: var(--change-bg);
    stroke: var(--change);
    stroke-width: 2px;
  }

  .flow-box {
    fill: var(--panel);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .flow-final {
    fill: var(--final-bg);
    stroke: var(--final);
    stroke-width: 2px;
  }

  .turn {
    font-size: 15px;
    font-weight: bold;
    fill: var(--muted);
  }

  .speech-text {
    font-size: 17px;
    font-weight: bold;
    fill: var(--ink);
  }

  .caption {
    font-size: 13px;
    fill: var(--muted);
  }

  .state-title {
    font-size: 14px;
    font-weight: bold;
    fill: var(--accent);
  }

  .state-title-final {
    font-size: 14px;
    font-weight: bold;
    fill: var(--final);
  }

  .code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 16px;
    fill: var(--ink);
  }

  .change-text {
    font-size: 13px;
    font-weight: bold;
    fill: var(--ink);
  }

  .flow-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 15px;
    font-weight: bold;
    fill: var(--ink);
  }

  .flow-source {
    font-size: 15px;
    font-weight: bold;
    fill: var(--ink);
  }

  .fallback {
    font-size: 17px;
    fill: var(--ink);
  }
</style>
</head>
<body>
<main class="figure">
  <h1 class="title" id="diagram-title">Как реплики превращаются в состояние бронирования</h1>
  <svg id="diagram"
       viewBox="0 0 1180 440"
       width="1180"
       height="440"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">Три последовательные реплики изменяют словарь состояния бронирования: сначала задаются низкая цена и северный район, затем цена меняется на среднюю, после чего добавляется итальянская кухня.</desc>
  </svg>
</main>

<script>
const DATA = [
  {
    kind: "config",
    origin: [0, 0],
    scale: [1, 1],
    zero: 0,
    labelPad: 12,
    columns: {
      y: 26,
      w: 350,
      h: 268,
      xs: [25, 415, 805]
    },
    speech: { y: 58, h: 68 },
    state: { y: 151, h: 104 },
    change: { y: 263, h: 23 },
    transition: { y: 203, starts: [375, 765], ends: [407, 797] },
    marker: {
      width: 10,
      height: 10,
      refX: 9,
      refY: 5,
      viewW: 10,
      viewH: 10,
      points: [[0, 0], [10, 5], [0, 10]]
    },
    flow: {
      titleX: 25,
      titleY: 325,
      y: 341,
      h: 69,
      boxes: [
        { x: 25, w: 245 },
        { x: 319, w: 185 },
        { x: 553, w: 185 },
        { x: 787, w: 368 }
      ],
      arrowY: 375,
      arrowStarts: [278, 512, 746],
      arrowEnds: [311, 545, 779]
    },
    fallback: {
      x: 30,
      ys: [100, 130]
    }
  },
  {
    kind: "turn",
    label: "Реплика 1",
    speech: ["«Нужен недорогой ресторан", "на севере»"],
    stateTitle: "Заполнить две графы",
    state: ["{ price: cheap,", "  area: north }"],
    change: "добавлены price и area",
    changeClass: "change-add",
    cardClass: "card"
  },
  {
    kind: "turn",
    label: "Реплика 2",
    speech: ["«Нет, пусть цена", "будет средней»"],
    stateTitle: "Сохранить area, заменить price",
    state: ["{ price: moderate,", "  area: north }"],
    change: "price: cheap → moderate",
    changeClass: "change-replace",
    cardClass: "card"
  },
  {
    kind: "turn",
    label: "Реплика 3",
    speech: ["«И пусть будет", "итальянский»"],
    stateTitle: "Добавить cuisine",
    state: ["{ price: moderate, area: north,", "  cuisine: italian }"],
    change: "cuisine добавлен",
    changeClass: "change-add",
    cardClass: "card-final",
    final: true
  },
  {
    kind: "flow",
    title: "Путь одного фрагмента",
    items: [
      { value: "«итальянский»", caption: "слова пользователя", className: "flow-box", valueClass: "flow-source" },
      { value: "italian", caption: "распознано", className: "flow-box", valueClass: "flow-value" },
      { value: "cuisine", caption: "графа (slot)", className: "flow-box", valueClass: "flow-value" },
      { value: "{ …, cuisine: italian }", caption: "структурированное состояние", className: "flow-final", valueClass: "flow-value" }
    ]
  }
];

const CONFIG = DATA.find(item => item.kind === "config");
const origin = CONFIG.origin;
const scale = CONFIG.scale;
const [originX, originY] = origin;
const [scaleX, scaleY] = scale;
const sx = x => originX + x * scaleX;
const sy = y => originY + y * scaleY;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  const zero = CONFIG.zero;
  const pad = CONFIG.labelPad;

  const make = (name, attributes, parent = svg) => {
    const node = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
    parent.appendChild(node);
    return node;
  };

  const rect = (x, y, w, h, className, parent = svg) =>
    make("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(w) - sx(zero),
      height: sy(h) - sy(zero),
      class: className
    }, parent);

  const line = (x1, y1, x2, y2, className, marker, parent = svg) => {
    const attributes = {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    };
    if (marker) attributes["marker-end"] = "url(#arrowhead)";
    return make("line", attributes, parent);
  };

  const text = (x, y, value, className, anchor = "start", parent = svg) => {
    const node = make("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, parent);
    node.textContent = value;
    return node;
  };

  const multiline = (x, ys, values, className, anchor = "start", parent = svg) => {
    const node = make("text", {
      class: className,
      "text-anchor": anchor
    }, parent);
    values.forEach((value, index) => {
      const span = make("tspan", {
        x: sx(x),
        y: sy(ys[index])
      }, node);
      span.textContent = value;
    });
    return node;
  };

  const defs = make("defs", {});
  const marker = make("marker", {
    id: "arrowhead",
    markerWidth: sx(CONFIG.marker.width) - sx(zero),
    markerHeight: sy(CONFIG.marker.height) - sy(zero),
    refX: sx(CONFIG.marker.refX),
    refY: sy(CONFIG.marker.refY),
    viewBox: [
      sx(zero),
      sy(zero),
      sx(CONFIG.marker.viewW) - sx(zero),
      sy(CONFIG.marker.viewH) - sy(zero)
    ].join(" "),
    orient: "auto",
    markerUnits: "userSpaceOnUse"
  }, defs);

  const [tipStart, tipPoint, tipEnd] = CONFIG.marker.points;
  make("path", {
    d: [
      "M", sx(tipStart[0]), sy(tipStart[1]),
      "L", sx(tipPoint[0]), sy(tipPoint[1]),
      "L", sx(tipEnd[0]), sy(tipEnd[1]),
      "Z"
    ].join(" "),
    fill: "var(--accent)"
  }, marker);

  const turns = DATA.filter(item => item.kind === "turn");
  const columnXs = CONFIG.columns.xs;
  const speechLineYs = [
    CONFIG.speech.y + pad + pad,
    CONFIG.speech.y + pad + pad + pad + pad
  ];
  const stateLineYs = [
    CONFIG.state.y + pad + pad + pad,
    CONFIG.state.y + pad + pad + pad + pad + pad
  ];

  turns.forEach((turn, index) => {
    const x = columnXs[index];
    const group = make("g", {});

    rect(x, CONFIG.columns.y, CONFIG.columns.w, CONFIG.columns.h, turn.cardClass, group);
    text(x + pad, CONFIG.columns.y + pad + pad, turn.label, "turn", "start", group);

    rect(x + pad, CONFIG.speech.y, CONFIG.columns.w - pad - pad, CONFIG.speech.h, "speech", group);
    multiline(
      x + pad + pad,
      speechLineYs,
      turn.speech,
      "speech-text",
      "start",
      group
    );

    const stateClass = turn.final ? "state-final" : "state";
    rect(x + pad, CONFIG.state.y, CONFIG.columns.w - pad - pad, CONFIG.state.h, stateClass, group);
    text(
      x + pad + pad,
      CONFIG.state.y + pad + pad,
      turn.stateTitle,
      turn.final ? "state-title-final" : "state-title",
      "start",
      group
    );
    multiline(
      x + pad + pad,
      stateLineYs,
      turn.state,
      "code",
      "start",
      group
    );

    rect(
      x + pad,
      CONFIG.change.y,
      CONFIG.columns.w - pad - pad,
      CONFIG.change.h,
      turn.changeClass,
      group
    );
    text(
      x + CONFIG.columns.w - pad - pad,
      CONFIG.change.y + pad + pad / scaleX,
      turn.change,
      "change-text",
      "end",
      group
    );
  });

  CONFIG.transition.starts.forEach((start, index) => {
    line(
      start,
      CONFIG.transition.y,
      CONFIG.transition.ends[index],
      CONFIG.transition.y,
      "transition",
      true
    );
  });

  const flow = DATA.find(item => item.kind === "flow");
  text(CONFIG.flow.titleX, CONFIG.flow.titleY, flow.title, "turn");

  flow.items.forEach((item, index) => {
    const box = CONFIG.flow.boxes[index];
    const middleX = box.x + box.w / scaleX / scaleX;
    rect(box.x, CONFIG.flow.y, box.w, CONFIG.flow.h, item.className);
    text(
      middleX,
      CONFIG.flow.y + pad + pad,
      item.value,
      item.valueClass,
      "middle"
    );
    text(
      middleX,
      CONFIG.flow.y + CONFIG.flow.h - pad,
      item.caption,
      "caption",
      "middle"
    );
  });

  CONFIG.flow.arrowStarts.forEach((start, index) => {
    line(
      start,
      CONFIG.flow.arrowY,
      CONFIG.flow.arrowEnds[index],
      CONFIG.flow.arrowY,
      "arrow",
      true
    );
  });
} catch (error) {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";
  const messages = [
    "Схема должна была показать три последовательных обновления:",
    "{price: cheap, area: north} → {price: moderate, area: north, cuisine: italian}"
  ];
  messages.forEach((message, index) => {
    const node = document.createElementNS(namespace, "text");
    node.setAttribute("x", sx(CONFIG.fallback.x));
    node.setAttribute("y", sy(CONFIG.fallback.ys[index]));
    node.setAttribute("class", "fallback");
    node.textContent = message;
    svg.appendChild(node);
  });
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
