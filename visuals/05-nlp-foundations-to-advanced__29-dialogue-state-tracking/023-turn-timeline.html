<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>История четырёх обновлений одного состояния</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --panel-soft: #f1f4fa;
      --ink: #172033;
      --muted: #667085;
      --line: #9aa6ba;
      --border: #cfd6e4;
      --accent: #3157d5;
      --accent-soft: #e8edff;
      --add: #16794b;
      --add-soft: #e5f6ed;
      --replace: #a45a00;
      --replace-soft: #fff0d9;
      --clear: #a93545;
      --clear-soft: #fde8eb;
      --kept: #536174;
      --shadow: rgba(24, 36, 60, .09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111723;
        --panel: #192231;
        --panel-soft: #202b3d;
        --ink: #eef2fa;
        --muted: #aeb8ca;
        --line: #738097;
        --border: #3d4a60;
        --accent: #91a7ff;
        --accent-soft: #27365c;
        --add: #72d7a5;
        --add-soft: #183d31;
        --replace: #ffc56f;
        --replace-soft: #4c351b;
        --clear: #ff9aa8;
        --clear-soft: #4b2730;
        --kept: #bdc6d5;
        --shadow: rgba(0, 0, 0, .25);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    figure {
      width: min(100%, 1180px);
      margin: 0;
      padding: 16px 18px 14px;
      background: var(--page);
    }

    h1 {
      margin: 0 0 5px;
      font-size: 22px;
      line-height: 1.2;
      text-align: center;
      letter-spacing: -.01em;
    }

    .subtitle {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      overflow: visible;
      background: var(--page);
    }

    #fallback {
      margin: 16px auto;
      max-width: 760px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.45;
      text-align: center;
    }

    .timeline {
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      fill: none;
    }

    .tick {
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .card {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2px;
      filter: drop-shadow(0 5px 6px var(--shadow));
    }

    .card-head {
      fill: var(--panel-soft);
    }

    .divider {
      stroke: var(--border);
      stroke-width: 2px;
    }

    .turn {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 750;
    }

    .utterance {
      fill: var(--muted);
      font-size: 13px;
      font-style: italic;
    }

    .slot {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .value {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 700;
    }

    .empty {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 650;
    }

    .changed-add {
      fill: var(--add-soft);
      stroke: var(--add);
      stroke-width: 2px;
    }

    .changed-replace {
      fill: var(--replace-soft);
      stroke: var(--replace);
      stroke-width: 2px;
    }

    .changed-clear {
      fill: var(--clear-soft);
      stroke: var(--clear);
      stroke-width: 2px;
    }

    .change-add {
      fill: var(--add);
    }

    .change-replace {
      fill: var(--replace);
    }

    .change-clear {
      fill: var(--clear);
    }

    .arrow {
      stroke: var(--accent);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .arrow-label {
      fill: var(--accent);
      font-size: 13px;
      font-weight: 750;
    }

    .arrow-note {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .baseline {
      fill: var(--panel-soft);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .baseline-title {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .baseline-value {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .legend-line {
      stroke: var(--border);
      stroke-width: 2px;
    }

    .legend-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 14px;
    }

    .legend-strong {
      fill: var(--ink);
      font-weight: 750;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-subtitle">
    <h1 id="diagram-title">История четырёх обновлений одного состояния</h1>
    <p class="subtitle" id="diagram-subtitle">
      Каждый turn меняет одно поле, а карточка показывает полный актуальный снимок.
    </p>
    <svg id="diagram" viewBox="0 0 1120 430" width="1120" height="430"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Временная шкала из четырёх состояний: заполнение кухни, добавление района, замена цены и очистка кухни">
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать четыре последовательных снимка одного состояния:
      кухня заполняется, район добавляется, цена заменяется, а затем очищается
      только кухня — остальные поля сохраняются.
    </p>
  </figure>

  <script>
    const data = {
      zero: 0,
      canvas: { width: 1120, height: 430 },
      timeline: { x1: 65, x2: 1055, y: 64, tickTop: 55, tickBottom: 73 },
      baseline: {
        x: 35, y: 12, width: 208, height: 32, radius: 9,
        titleX: 48, valueX: 137, textY: 33,
        title: "До turn 1:", value: "цена = низкая"
      },
      card: {
        y: 92, width: 236, height: 244, radius: 13,
        headHeight: 61, dividerY: 153,
        turnY: 118, utteranceY: 140,
        rowTop: 171, rowGap: 52, rowHeight: 37,
        slotOffset: 16, valueOffset: 112,
        highlightX: 102, highlightWidth: 119, highlightRadius: 8,
        textAdjust: 25
      },
      cards: [
        {
          x: 35, center: 153, turn: "turn 1", utterance: "«Итальянская кухня»",
          change: "add", changedSlot: "кухня",
          rows: [
            { slot: "кухня", value: "итальянская", empty: false },
            { slot: "район", value: "не задан", empty: true },
            { slot: "цена", value: "низкая", empty: false }
          ]
        },
        {
          x: 306, center: 424, turn: "turn 2", utterance: "«На севере»",
          change: "add", changedSlot: "район",
          rows: [
            { slot: "кухня", value: "итальянская", empty: false },
            { slot: "район", value: "север", empty: false },
            { slot: "цена", value: "низкая", empty: false }
          ]
        },
        {
          x: 577, center: 695, turn: "turn 3", utterance: "«Цена высокая»",
          change: "replace", changedSlot: "цена",
          rows: [
            { slot: "кухня", value: "итальянская", empty: false },
            { slot: "район", value: "север", empty: false },
            { slot: "цена", value: "высокая", empty: false }
          ]
        },
        {
          x: 848, center: 966, turn: "turn 4", utterance: "«Кухня неважна»",
          change: "clear", changedSlot: "кухня",
          rows: [
            { slot: "кухня", value: "очищено", empty: true },
            { slot: "район", value: "север", empty: false },
            { slot: "цена", value: "высокая", empty: false }
          ]
        }
      ],
      arrows: [
        {
          x1: 246, x2: 298, y: 64, headBack: 288, headTop: 58, headBottom: 70,
          labelX: 272, labelY: 28, noteX: 272, noteY: 47,
          label: "добавить", note: "район"
        },
        {
          x1: 517, x2: 569, y: 64, headBack: 559, headTop: 58, headBottom: 70,
          labelX: 543, labelY: 28, noteX: 543, noteY: 47,
          label: "заменить", note: "цену"
        },
        {
          x1: 788, x2: 840, y: 64, headBack: 830, headTop: 58, headBottom: 70,
          labelX: 814, labelY: 28, noteX: 814, noteY: 47,
          label: "очистить", note: "кухню"
        }
      ],
      legend: {
        lineX1: 35, lineX2: 1085, lineY: 363,
        titleX: 35, titleY: 391,
        textX: 214, textY: 391,
        strongX: 35, strongY: 416,
        restX: 164, restY: 416,
        title: "Что делает трекер:",
        text: "копирует прошлый снимок и обновляет только названный slot.",
        strong: "Не затронуто →",
        rest: "сохранить без изменений."
      },
      labelPad: 8
    };

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      const node = (name, attrs, text) => {
        const el = document.createElementNS(ns, name);
        for (const [key, value] of Object.entries(attrs)) {
          el.setAttribute(key, value);
        }
        if (text !== undefined) el.textContent = text;
        return el;
      };

      const add = (name, attrs, text, parent = svg) => {
        const el = node(name, attrs, text);
        parent.appendChild(el);
        return el;
      };

      const rect = (x, y, width, height, radius, className, parent = svg) =>
        add("rect", {
          x: sx(x), y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(radius) - sx(data.zero),
          class: className
        }, undefined, parent);

      const line = (x1, y1, x2, y2, className, parent = svg) =>
        add("line", {
          x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2),
          class: className
        }, undefined, parent);

      const text = (x, y, value, className, anchor = "start", parent = svg) =>
        add("text", {
          x: sx(x), y: sy(y),
          class: className,
          "text-anchor": anchor
        }, value, parent);

      const polygon = (points, className, parent = svg) =>
        add("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        }, undefined, parent);

      rect(
        data.baseline.x, data.baseline.y,
        data.baseline.width, data.baseline.height,
        data.baseline.radius, "baseline"
      );
      text(
        data.baseline.titleX, data.baseline.textY,
        data.baseline.title, "baseline-title"
      );
      text(
        data.baseline.valueX, data.baseline.textY,
        data.baseline.value, "baseline-value"
      );

      line(
        data.timeline.x1, data.timeline.y,
        data.timeline.x2, data.timeline.y,
        "timeline"
      );

      for (const card of data.cards) {
        line(
          card.center, data.timeline.tickTop,
          card.center, data.timeline.tickBottom,
          "tick"
        );
      }

      for (const arrow of data.arrows) {
        line(arrow.x1, arrow.y, arrow.x2, arrow.y, "arrow");
        polygon([
          { x: arrow.x2, y: arrow.y },
          { x: arrow.headBack, y: arrow.headTop },
          { x: arrow.headBack, y: arrow.headBottom }
        ], "arrow-head");
        text(
          arrow.labelX, arrow.labelY,
          arrow.label, "arrow-label", "middle"
        );
        text(
          arrow.noteX, arrow.noteY,
          arrow.note, "arrow-note", "middle"
        );
      }

      for (const card of data.cards) {
        const group = add("g", {
          "aria-label": `${card.turn}: ${card.utterance}`
        });

        rect(
          card.x, data.card.y,
          data.card.width, data.card.height,
          data.card.radius, "card", group
        );

        add("path", {
          d: [
            `M ${sx(card.x + data.card.radius)} ${sy(data.card.y)}`,
            `H ${sx(card.x + data.card.width - data.card.radius)}`,
            `Q ${sx(card.x + data.card.width)} ${sy(data.card.y)} ${sx(card.x + data.card.width)} ${sy(data.card.y + data.card.radius)}`,
            `V ${sy(data.card.y + data.card.headHeight)}`,
            `H ${sx(card.x)}`,
            `V ${sy(data.card.y + data.card.radius)}`,
            `Q ${sx(card.x)} ${sy(data.card.y)} ${sx(card.x + data.card.radius)} ${sy(data.card.y)}`,
            "Z"
          ].join(" "),
          class: "card-head"
        }, undefined, group);

        line(
          card.x, data.card.dividerY,
          card.x + data.card.width, data.card.dividerY,
          "divider", group
        );

        text(
          card.center, data.card.turnY,
          card.turn, "turn", "middle", group
        );
        text(
          card.center, data.card.utteranceY,
          card.utterance, "utterance", "middle", group
        );

        let rowY = data.card.rowTop;
        for (const row of card.rows) {
          const isChanged = row.slot === card.changedSlot;
          if (isChanged) {
            rect(
              card.x + data.card.highlightX,
              rowY,
              data.card.highlightWidth,
              data.card.rowHeight,
              data.card.highlightRadius,
              `changed-${card.change}`,
              group
            );
          }

          text(
            card.x + data.card.slotOffset,
            rowY + data.card.textAdjust,
            row.slot,
            "slot",
            "start",
            group
          );

          const valueClass = isChanged
            ? `value change-${card.change}`
            : row.empty ? "empty" : "value";

          text(
            card.x + data.card.valueOffset,
            rowY + data.card.textAdjust,
            row.value,
            valueClass,
            "start",
            group
          );

          rowY += data.card.rowGap;
        }
      }

      line(
        data.legend.lineX1, data.legend.lineY,
        data.legend.lineX2, data.legend.lineY,
        "legend-line"
      );
      text(
        data.legend.titleX, data.legend.titleY,
        data.legend.title, "legend-title"
      );
      text(
        data.legend.textX, data.legend.textY,
        data.legend.text, "legend-text"
      );
      text(
        data.legend.strongX, data.legend.strongY,
        data.legend.strong, "legend-text legend-strong"
      );
      text(
        data.legend.restX, data.legend.restY,
        data.legend.rest, "legend-text"
      );
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
