<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь данных от трейса до расследования</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --border: #ccd3df;
      --flow: #526174;
      --lane: #e9edf5;
      --one: #2878d0;
      --one-soft: #e6f1fc;
      --two: #6d55c5;
      --two-soft: #eeeafd;
      --three: #16856b;
      --three-soft: #e3f5ef;
      --four: #d06b20;
      --four-soft: #fbecdf;
      --five: #b43d69;
      --five-soft: #fae6ed;
      --signal: #d24242;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192230;
        --ink: #edf2f8;
        --muted: #aab6c6;
        --border: #3b485a;
        --flow: #9aa9bb;
        --lane: #222d3d;
        --one: #67aff7;
        --one-soft: #183451;
        --two: #a996f4;
        --two-soft: #30294f;
        --three: #58c8a9;
        --three-soft: #193d36;
        --four: #f1a466;
        --four-soft: #49301f;
        --five: #ee82aa;
        --five-soft: #472536;
        --signal: #ff7878;
      }
    }

    figure {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      border: 1px solid var(--border);
    }

    h2 {
      text-align: center;
      color: var(--ink);
    }

    .diagram {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .diagram[hidden] {
      display: none;
    }

    .fallback {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .bg { fill: var(--page); }
    .card { stroke: var(--border); }
    .tone-one { fill: var(--one-soft); }
    .tone-two { fill: var(--two-soft); }
    .tone-three { fill: var(--three-soft); }
    .tone-four { fill: var(--four-soft); }
    .tone-five { fill: var(--five-soft); }
    .stroke-one { stroke: var(--one); fill: none; }
    .stroke-two { stroke: var(--two); fill: none; }
    .stroke-three { stroke: var(--three); fill: none; }
    .stroke-four { stroke: var(--four); fill: none; }
    .stroke-five { stroke: var(--five); fill: none; }
    .fill-one { fill: var(--one); }
    .fill-two { fill: var(--two); }
    .fill-three { fill: var(--three); }
    .fill-four { fill: var(--four); }
    .fill-five { fill: var(--five); }
    .flow { stroke: var(--flow); fill: none; }
    .arrow { fill: var(--flow); }
    .lane { fill: var(--lane); stroke: var(--border); }
    .ink { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .signal { fill: var(--signal); }
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .heading { font-weight: bold; letter-spacing: .04em; }
    .title { font-weight: bold; }
    line, polyline, polygon, rect, circle {
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Путь данных от трейса до расследования</h2>
    <div id="diagram-fallback" class="fallback">
      OTel-спаны проходят через сессии и оценки к дашборду регрессий, где связываются с версией промпта.
    </div>
    <svg id="diagram" class="diagram" hidden
         viewBox="0 0 960 410"
         width="960" height="410"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc"></svg>
  </figure>

  <script>
    const diagramData = {
      failure: "Схема должна показать путь: OTel-спаны → сессии → оценки → дашборд и регрессии → связь с версией промпта.",
      background: { x: -18, y: -22, w: 960, h: 410 },
      headings: [
        { x: 280, y: 10, text: "СБОР И ОЦЕНКА" },
        { x: 755, y: 10, text: "РАССЛЕДОВАНИЕ" }
      ],
      cards: [
        {
          x: 10, y: 42, w: 160, h: 204, r: 12, tone: "one",
          titles: [{ x: 90, y: 130, text: "OTel-спаны" }],
          notes: [
            { x: 90, y: 166, text: "поиск и инструменты" },
            { x: 90, y: 188, text: "вызов модели" },
            { x: 90, y: 210, text: "финальный ответ" }
          ],
          marks: [
            { kind: "line", x1: 42, y1: 72, x2: 132, y2: 72 },
            { kind: "line", x1: 56, y1: 90, x2: 122, y2: 90 },
            { kind: "line", x1: 36, y1: 108, x2: 110, y2: 108 },
            { kind: "circle", x: 42, y: 72, r: 5, fill: true },
            { kind: "circle", x: 56, y: 90, r: 5, fill: true },
            { kind: "circle", x: 36, y: 108, r: 5, fill: true }
          ]
        },
        {
          x: 200, y: 42, w: 160, h: 204, r: 12, tone: "two",
          titles: [{ x: 280, y: 130, text: "Сессии" }],
          notes: [
            { x: 280, y: 166, text: "единый трейс" },
            { x: 280, y: 188, text: "время • модель" },
            { x: 280, y: 210, text: "версия • стоимость" }
          ],
          marks: [
            { kind: "line", x1: 240, y1: 90, x2: 280, y2: 72 },
            { kind: "line", x1: 280, y1: 72, x2: 320, y2: 96 },
            { kind: "line", x1: 240, y1: 90, x2: 280, y2: 110 },
            { kind: "circle", x: 240, y: 90, r: 8 },
            { kind: "circle", x: 280, y: 72, r: 8 },
            { kind: "circle", x: 320, y: 96, r: 8 },
            { kind: "circle", x: 280, y: 110, r: 8 }
          ]
        },
        {
          x: 390, y: 42, w: 160, h: 204, r: 12, tone: "three",
          titles: [{ x: 470, y: 130, text: "Оценки" }],
          notes: [
            { x: 470, y: 166, text: "автопроверки" },
            { x: 470, y: 188, text: "опора на источник" },
            { x: 470, y: 210, text: "низкая оценка" }
          ],
          marks: [
            { kind: "circle", x: 470, y: 88, r: 34 },
            { kind: "polyline", points: [
              { x: 449, y: 88 }, { x: 464, y: 103 }, { x: 493, y: 72 }
            ]}
          ]
        },
        {
          x: 580, y: 42, w: 160, h: 204, r: 12, tone: "four",
          titles: [
            { x: 660, y: 122, text: "Дашборд" },
            { x: 660, y: 142, text: "и регрессии" }
          ],
          notes: [
            { x: 660, y: 174, text: "группы запусков" },
            { x: 660, y: 196, text: "сравнение версий" },
            { x: 660, y: 218, text: "сигнал ухудшения" }
          ],
          marks: [
            { kind: "line", x1: 620, y1: 108, x2: 620, y2: 68 },
            { kind: "line", x1: 620, y1: 108, x2: 702, y2: 108 },
            { kind: "polyline", points: [
              { x: 626, y: 96 }, { x: 646, y: 82 },
              { x: 666, y: 88 }, { x: 690, y: 60 }
            ]},
            { kind: "circle", x: 690, y: 60, r: 5, fill: true }
          ]
        },
        {
          x: 770, y: 42, w: 160, h: 204, r: 12, tone: "five",
          titles: [{ x: 850, y: 130, text: "Версия промпта" }],
          notes: [
            { x: 850, y: 166, text: "какой промпт изменён" },
            { x: 850, y: 188, text: "с каким запуском связан" },
            { x: 850, y: 210, text: "где возникло расхождение" }
          ],
          marks: [
            { kind: "rect", x: 804, y: 64, w: 58, h: 34, r: 7 },
            { kind: "rect", x: 838, y: 84, w: 58, h: 34, r: 7 },
            { kind: "line", x1: 822, y1: 76, x2: 848, y2: 76 },
            { kind: "line", x1: 852, y1: 96, x2: 880, y2: 96 }
          ]
        }
      ],
      arrows: [
        { x1: 170, y1: 144, x2: 195, y2: 144, head: [
          { x: 195, y: 144 }, { x: 187, y: 138 }, { x: 187, y: 150 }
        ]},
        { x1: 360, y1: 144, x2: 385, y2: 144, head: [
          { x: 385, y: 144 }, { x: 377, y: 138 }, { x: 377, y: 150 }
        ]},
        { x1: 550, y1: 144, x2: 575, y2: 144, head: [
          { x: 575, y: 144 }, { x: 567, y: 138 }, { x: 567, y: 150 }
        ]},
        { x1: 740, y1: 144, x2: 765, y2: 144, head: [
          { x: 765, y: 144 }, { x: 757, y: 138 }, { x: 757, y: 150 }
        ]}
      ],
      lane: { x: 48, y: 278, w: 844, h: 92, r: 14 },
      laneTitle: { x: 470, y: 300, text: "ОТ СИГНАЛА К КОНКРЕТНОЙ ПРИЧИНЕ" },
      laneLine: { x1: 110, y1: 326, x2: 830, y2: 326 },
      chevrons: [
        [{ x: 218, y: 320 }, { x: 226, y: 326 }, { x: 218, y: 332 }],
        [{ x: 408, y: 320 }, { x: 416, y: 326 }, { x: 408, y: 332 }],
        [{ x: 598, y: 320 }, { x: 606, y: 326 }, { x: 598, y: 332 }]
      ],
      stages: [
        { x: 110, y: 326, labelY: 354, text: "низкая оценка", tone: "signal" },
        { x: 300, y: 326, labelY: 354, text: "нужный трейс", tone: "two" },
        { x: 490, y: 326, labelY: 354, text: "конкретный спан", tone: "one" },
        { x: 680, y: 326, labelY: 354, text: "место расхождения", tone: "four" },
        { x: 830, y: 326, labelY: 354, text: "версия промпта", tone: "five" }
      ]
    };

    const origin = { x: 18, y: 22 };
    const scale = { x: 1, y: 1 };

    const LABEL_PAD = 4;
    const LINE_THIN = 1.5;
    const LINE_MAIN = 2.5;
    const FONT_SMALL = 12;
    const FONT_BODY = 13;
    const FONT_TITLE = 16;
    const FONT_HEADING = 12;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("diagram-fallback");
    const ns = "http://www.w3.org/2000/svg";

    function put(tag, attrs, parent) {
      const node = document.createElementNS(ns, tag);
      for (const [name, value] of Object.entries(attrs)) {
        node.setAttribute(name, value);
      }
      (parent || svg).appendChild(node);
      return node;
    }

    function rect(item, className, parent) {
      return put("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        rx: sx(item.x + item.r) - sx(item.x),
        ry: sy(item.y + item.r) - sy(item.y),
        class: className,
        "stroke-width": LINE_THIN
      }, parent);
    }

    function line(item, className, parent) {
      return put("line", {
        x1: sx(item.x1), y1: sy(item.y1),
        x2: sx(item.x2), y2: sy(item.y2),
        class: className,
        "stroke-width": LINE_MAIN
      }, parent);
    }

    function polyline(points, className, parent) {
      return put("polyline", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className,
        "stroke-width": LINE_MAIN
      }, parent);
    }

    function text(item, className, size, parent) {
      const node = put("text", {
        x: sx(item.x),
        y: sy(item.y) + LABEL_PAD,
        "text-anchor": "middle",
        class: className,
        "font-size": size
      }, parent);
      node.textContent = item.text;
      return node;
    }

    try {
      const title = put("title", { id: "svg-title" });
      title.textContent = "Путь данных от трейса до расследования";

      const desc = put("desc", { id: "svg-desc" });
      desc.textContent = diagramData.failure;

      rect(diagramData.background, "bg");

      for (const heading of diagramData.headings) {
        text(heading, "heading muted", FONT_HEADING);
      }

      for (const arrow of diagramData.arrows) {
        line(arrow, "flow");
        put("polygon", {
          points: arrow.head.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: "arrow"
        });
      }

      for (const card of diagramData.cards) {
        const group = put("g", {});
        rect(card, `card tone-${card.tone}`, group);

        for (const mark of card.marks) {
          const strokeClass = `stroke-${card.tone}`;
          const fillClass = `fill-${card.tone}`;

          if (mark.kind === "line") {
            line(mark, strokeClass, group);
          } else if (mark.kind === "polyline") {
            polyline(mark.points, strokeClass, group);
          } else if (mark.kind === "circle") {
            put("circle", {
              cx: sx(mark.x),
              cy: sy(mark.y),
              r: sx(mark.x + mark.r) - sx(mark.x),
              class: mark.fill ? fillClass : strokeClass,
              "stroke-width": LINE_MAIN
            }, group);
          } else if (mark.kind === "rect") {
            rect(mark, strokeClass, group);
          }
        }

        for (const titleLine of card.titles) {
          text(titleLine, "title ink", FONT_TITLE, group);
        }
        for (const note of card.notes) {
          text(note, "muted", FONT_SMALL, group);
        }
      }

      rect(diagramData.lane, "lane");
      text(diagramData.laneTitle, "heading muted", FONT_HEADING);
      line(diagramData.laneLine, "flow");

      for (const points of diagramData.chevrons) {
        polyline(points, "flow");
      }

      for (const stage of diagramData.stages) {
        put("circle", {
          cx: sx(stage.x),
          cy: sy(stage.y),
          r: sx(stage.x + 7) - sx(stage.x),
          class: stage.tone === "signal" ? "signal" : `fill-${stage.tone}`
        });
        text(
          { x: stage.x, y: stage.labelY, text: stage.text },
          "ink",
          FONT_BODY
        );
      }

      svg.hidden = false;
      fallback.hidden = true;
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent = diagramData.failure;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
