<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Один интерфейс детекции, разные сигналы</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f7f8fc;
  --panel:#ffffff;
  --panel-soft:#f1f4f9;
  --ink:#172033;
  --muted:#5e6a7f;
  --line:#8390a7;
  --border:#cbd3df;
  --api:#6658d3;
  --api-soft:#eeecff;
  --text:#19795a;
  --text-soft:#e6f6ef;
  --image:#b55b16;
  --image-soft:#fff0e3;
  --audio:#236fc2;
  --audio-soft:#e7f2ff;
  --video:#a3427d;
  --video-soft:#f9e9f3;
  --success:#217a4b;
  --success-soft:#e7f6ed;
  --absent:#9b4650;
  --absent-soft:#fae9eb;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111722;
    --panel:#1a2230;
    --panel-soft:#202a3a;
    --ink:#edf2fa;
    --muted:#afbacb;
    --line:#8491a6;
    --border:#3b485b;
    --api:#a69cff;
    --api-soft:#292548;
    --text:#65caa4;
    --text-soft:#183a31;
    --image:#efaa68;
    --image-soft:#422d1d;
    --audio:#76b7fa;
    --audio-soft:#183653;
    --video:#e58bc1;
    --video-soft:#43263a;
    --success:#72d49d;
    --success-soft:#193b2b;
    --absent:#ef9da6;
    --absent-soft:#43252b;
  }
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:22px;color:var(--ink)}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--page);
}
.card{
  fill:var(--panel);
  stroke:var(--border);
  stroke-width:2px;
}
.api-card{fill:var(--api-soft);stroke:var(--api)}
.result-card{fill:var(--panel-soft)}
.inner-tag{fill:var(--panel);stroke:var(--border);stroke-width:2px}
.glyph-ring{stroke-width:2px}
.flow{
  fill:none;
  stroke-width:2px;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.flow.text{stroke:var(--text)}
.flow.image{stroke:var(--image)}
.flow.audio{stroke:var(--audio)}
.flow.video{stroke:var(--video)}
.arrow-head.text{fill:var(--text)}
.arrow-head.image{fill:var(--image)}
.arrow-head.audio{fill:var(--audio)}
.arrow-head.video{fill:var(--video)}
.accent.text,.glyph-ring.text{fill:var(--text-soft);stroke:var(--text)}
.accent.image,.glyph-ring.image{fill:var(--image-soft);stroke:var(--image)}
.accent.audio,.glyph-ring.audio{fill:var(--audio-soft);stroke:var(--audio)}
.accent.video,.glyph-ring.video{fill:var(--video-soft);stroke:var(--video)}
.accent{stroke:none}
.title{font-size:18px;font-weight:bold;fill:var(--ink)}
.detail{font-size:14px;fill:var(--muted)}
.small{font-size:13px;fill:var(--muted)}
.glyph{font-size:16px;font-weight:bold}
.glyph.text{fill:var(--text)}
.glyph.image{fill:var(--image)}
.glyph.audio{fill:var(--audio)}
.glyph.video{fill:var(--video)}
.api-title{font-size:18px;font-weight:bold;fill:var(--api)}
.tag-text{font-size:13px;font-weight:bold;fill:var(--ink)}
.result-title{font-size:18px;font-weight:bold;fill:var(--ink)}
.found{fill:var(--success-soft);stroke:var(--success);stroke-width:2px}
.absent{fill:var(--absent-soft);stroke:var(--absent);stroke-width:2px}
.found-text{font-size:14px;font-weight:bold;fill:var(--success)}
.absent-text{font-size:14px;font-weight:bold;fill:var(--absent)}
.footer{font-size:14px;font-weight:bold;fill:var(--muted)}
.fallback{font-size:16px;color:var(--ink);border:2px solid var(--border)}
</style>
</head>
<body>
<h1>Один интерфейс детекции, разные сигналы по модальностям</h1>

<svg id="diagram" viewBox="0 0 1200 410" width="1200" height="410"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Единый API SynthID направляет разные типы файлов к специализированным проверкам</title>
  <desc id="svgDesc">Текст, изображение, аудио и видео входят в единый интерфейс, но используют разные механизмы сигнала и устойчивости, после чего возвращают ответ общей формы.</desc>
</svg>

<div id="fallback" class="fallback" hidden>
  Схема должна была показать, как текст, изображение, аудио и видео входят в единый API SynthID, проходят разные специализированные проверки и возвращают общий ответ.
</div>

<script>
const DATA={
  transform:{originX:0,originY:0,scale:1},
  radius:{card:14,tag:9,glyph:18},
  arrow:{length:12,width:6},
  inputs:[
    {kind:"text",glyph:"Т",title:"Текст",detail:"абзац",x:20,y:15,w:190,h:72,cx:55,cy:51,tx:88,ty:45,dy:67},
    {kind:"image",glyph:"И",title:"Изображение",detail:"фотография",x:20,y:111,w:190,h:72,cx:55,cy:147,tx:88,ty:141,dy:163},
    {kind:"audio",glyph:"А",title:"Аудио",detail:"аудиозапись",x:20,y:207,w:190,h:72,cx:55,cy:243,tx:88,ty:237,dy:259},
    {kind:"video",glyph:"В",title:"Видео",detail:"ролик",x:20,y:303,w:190,h:72,cx:55,cy:339,tx:88,ty:333,dy:355}
  ],
  api:{
    x:260,y:106,w:200,h:195,cx:360,
    titleY:136,detailY:163,
    tags:[
      {label:"Текст",x:285,y:180,w:150,h:24,cy:192},
      {label:"Изображение",x:285,y:208,w:150,h:24,cy:220},
      {label:"Аудио",x:285,y:236,w:150,h:24,cy:248},
      {label:"Видео",x:285,y:264,w:150,h:24,cy:276}
    ]
  },
  mechanisms:[
    {kind:"text",title:"Текст",line:"выбор токенов → статистический след",stability:"своя устойчивость к правкам",x:550,y:15,w:340,h:72,cx:575,cy:51,tx:603,titleY:38,lineY:59,stableY:78},
    {kind:"image",title:"Изображение",line:"сигнал в визуальных данных",stability:"своя устойчивость к преобразованиям",x:550,y:111,w:340,h:72,cx:575,cy:147,tx:603,titleY:134,lineY:155,stableY:174},
    {kind:"audio",title:"Аудио",line:"сигнал во временной структуре",stability:"своя устойчивость к изменениям звука",x:550,y:207,w:340,h:72,cx:575,cy:243,tx:603,titleY:230,lineY:251,stableY:270},
    {kind:"video",title:"Видео",line:"сигнал в кадрах и их последовательности",stability:"своя устойчивость к монтажным изменениям",x:550,y:303,w:340,h:72,cx:575,cy:339,tx:603,titleY:326,lineY:347,stableY:366}
  ],
  result:{
    x:975,y:106,w:205,h:195,cx:1077.5,
    titleY:139,detailY:166,
    found:{x:995,y:188,w:165,h:38,cy:207},
    absent:{x:995,y:244,w:165,h:38,cy:263}
  },
  flows:[
    {kind:"text",a:{x:210,y:51},b:{x:260,y:135}},
    {kind:"image",a:{x:210,y:147},b:{x:260,y:183}},
    {kind:"audio",a:{x:210,y:243},b:{x:260,y:231}},
    {kind:"video",a:{x:210,y:339},b:{x:260,y:267}},
    {kind:"text",a:{x:460,y:135},b:{x:550,y:51}},
    {kind:"image",a:{x:460,y:183},b:{x:550,y:147}},
    {kind:"audio",a:{x:460,y:231},b:{x:550,y:243}},
    {kind:"video",a:{x:460,y:267},b:{x:550,y:339}},
    {kind:"text",a:{x:890,y:51},b:{x:975,y:135}},
    {kind:"image",a:{x:890,y:147},b:{x:975,y:183}},
    {kind:"audio",a:{x:890,y:243},b:{x:975,y:231}},
    {kind:"video",a:{x:890,y:339},b:{x:975,y:267}}
  ],
  footer:{x:600,y:399,label:"Один интерфейс • разные измерительные приборы"}
};
const CANVAS={width:1200,height:410};
const LABEL_PAD=8;
const STROKE_WIDTH=2;
const FONT_SIZE={title:18,detail:14,small:13};
const origin=Object.freeze({x:DATA.transform.originX,y:DATA.transform.originY});
const scale=DATA.transform.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("diagram");
  const ns="http://www.w3.org/2000/svg";

  function node(name,attrs,parent=svg){
    const item=document.createElementNS(ns,name);
    Object.entries(attrs).forEach(([key,value])=>item.setAttribute(key,String(value)));
    parent.appendChild(item);
    return item;
  }

  function label(value,x,y,className,anchor="start"){
    const item=node("text",{
      x:sx(x),y:sy(y),class:className,
      "text-anchor":anchor,
      "dominant-baseline":"middle"
    });
    item.textContent=value;
    return item;
  }

  function roundedRect(item,className){
    return node("rect",{
      x:sx(item.x),y:sy(item.y),
      width:sx(item.x+item.w)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(DATA.radius.card)-sx(0),
      class:className
    });
  }

  function circle(x,y,r,className){
    return node("circle",{
      cx:sx(x),cy:sy(y),
      r:sx(r)-sx(0),
      class:className
    });
  }

  function flow(item){
    node("line",{
      x1:sx(item.a.x),y1:sy(item.a.y),
      x2:sx(item.b.x),y2:sy(item.b.y),
      class:`flow ${item.kind}`
    });
    const dx=item.b.x-item.a.x;
    const dy=item.b.y-item.a.y;
    const distance=Math.hypot(dx,dy);
    const ux=dx/distance;
    const uy=dy/distance;
    const px=-uy;
    const py=ux;
    const backX=item.b.x-ux*DATA.arrow.length;
    const backY=item.b.y-uy*DATA.arrow.length;
    const points=[
      `${sx(item.b.x)},${sy(item.b.y)}`,
      `${sx(backX+px*DATA.arrow.width)},${sy(backY+py*DATA.arrow.width)}`,
      `${sx(backX-px*DATA.arrow.width)},${sy(backY-py*DATA.arrow.width)}`
    ].join(" ");
    node("polygon",{points,class:`arrow-head ${item.kind}`});
  }

  DATA.flows.forEach(flow);

  DATA.inputs.forEach(item=>{
    roundedRect(item,"card");
    node("rect",{
      x:sx(item.x),y:sy(item.y),
      width:sx(item.x+LABEL_PAD)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(DATA.radius.tag)-sx(0),
      class:`accent ${item.kind}`
    });
    circle(item.cx,item.cy,DATA.radius.glyph,`glyph-ring ${item.kind}`);
    label(item.glyph,item.cx,item.cy,`glyph ${item.kind}`,"middle");
    label(item.title,item.tx,item.ty,"title");
    label(item.detail,item.tx,item.dy,"detail");
  });

  roundedRect(DATA.api,"card api-card");
  label("Единый API SynthID",DATA.api.cx,DATA.api.titleY,"api-title","middle");
  label("распознаёт модальность",DATA.api.cx,DATA.api.detailY,"detail","middle");
  DATA.api.tags.forEach(tag=>{
    node("rect",{
      x:sx(tag.x),y:sy(tag.y),
      width:sx(tag.x+tag.w)-sx(tag.x),
      height:sy(tag.y+tag.h)-sy(tag.y),
      rx:sx(DATA.radius.tag)-sx(0),
      class:"inner-tag"
    });
    label(tag.label,DATA.api.cx,tag.cy,"tag-text","middle");
  });

  DATA.mechanisms.forEach(item=>{
    roundedRect(item,"card");
    node("rect",{
      x:sx(item.x),y:sy(item.y),
      width:sx(item.x+LABEL_PAD)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(DATA.radius.tag)-sx(0),
      class:`accent ${item.kind}`
    });
    circle(item.cx,item.cy,DATA.radius.glyph,`glyph-ring ${item.kind}`);
    label(item.title,item.tx,item.titleY,"title");
    label(item.line,item.tx,item.lineY,"detail");
    label(item.stability,item.tx,item.stableY,"small");
  });

  roundedRect(DATA.result,"card result-card");
  label("Общий ответ",DATA.result.cx,DATA.result.titleY,"result-title","middle");
  label("одинаковая форма результата",DATA.result.cx,DATA.result.detailY,"detail","middle");

  node("rect",{
    x:sx(DATA.result.found.x),y:sy(DATA.result.found.y),
    width:sx(DATA.result.found.x+DATA.result.found.w)-sx(DATA.result.found.x),
    height:sy(DATA.result.found.y+DATA.result.found.h)-sy(DATA.result.found.y),
    rx:sx(DATA.radius.tag)-sx(0),
    class:"found"
  });
  label("Сигнал найден",DATA.result.cx,DATA.result.found.cy,"found-text","middle");

  node("rect",{
    x:sx(DATA.result.absent.x),y:sy(DATA.result.absent.y),
    width:sx(DATA.result.absent.x+DATA.result.absent.w)-sx(DATA.result.absent.x),
    height:sy(DATA.result.absent.y+DATA.result.absent.h)-sy(DATA.result.absent.y),
    rx:sx(DATA.radius.tag)-sx(0),
    class:"absent"
  });
  label("Сигнал не найден",DATA.result.cx,DATA.result.absent.cy,"absent-text","middle");

  label(DATA.footer.label,DATA.footer.x,DATA.footer.y,"footer","middle");

  svg.setAttribute("data-width",String(CANVAS.width));
  svg.setAttribute("data-height",String(CANVAS.height));
  svg.style.setProperty("--diagram-stroke",`${STROKE_WIDTH}px`);
  svg.style.setProperty("--diagram-title-size",`${FONT_SIZE.title}px`);
  svg.style.setProperty("--diagram-detail-size",`${FONT_SIZE.detail}px`);
  svg.style.setProperty("--diagram-small-size",`${FONT_SIZE.small}px`);
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
