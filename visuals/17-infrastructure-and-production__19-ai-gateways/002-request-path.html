<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Как шлюз сокращает число точек интеграции</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --panel-alt: ghostwhite;
      --text: midnightblue;
      --muted: slategray;
      --border: lightsteelblue;
      --direct: tomato;
      --gateway-link: seagreen;
      --service-fill: aliceblue;
      --provider-fill: linen;
      --gateway-fill: honeydew;
      --metric-fill: lavender;
      --node-stroke: steelblue;
      --provider-stroke: darkorange;
      --gateway-stroke: seagreen;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --panel-alt: darkslateblue;
        --text: whitesmoke;
        --muted: lightsteelblue;
        --border: slategray;
        --direct: coral;
        --gateway-link: lightgreen;
        --service-fill: steelblue;
        --provider-fill: saddlebrown;
        --gateway-fill: seagreen;
        --metric-fill: darkslategray;
        --node-stroke: lightblue;
        --provider-stroke: orange;
        --gateway-stroke: palegreen;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h1 {
      margin-block: unset;
      font-size: 22px;
      font-weight: bold;
    }

    figure {
      margin: unset;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--panel);
    }

    .panel {
      fill: var(--panel-alt);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .divider {
      stroke: var(--border);
      stroke-width: 2px;
    }

    .direct-link {
      stroke: var(--direct);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .gateway-link {
      stroke: var(--gateway-link);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .service-node {
      fill: var(--service-fill);
      stroke: var(--node-stroke);
      stroke-width: 2px;
    }

    .provider-node {
      fill: var(--provider-fill);
      stroke: var(--provider-stroke);
      stroke-width: 2px;
    }

    .gateway-node {
      fill: var(--gateway-fill);
      stroke: var(--gateway-stroke);
      stroke-width: 3px;
    }

    .metric {
      fill: var(--metric-fill);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .panel-title {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .column-title {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .node-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .gateway-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .metric-main {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .metric-note {
      fill: var(--muted);
      font-size: 14px;
    }

    #fallback {
      color: var(--text);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Как шлюз сокращает число точек интеграции</h1>
    <figure>
      <svg
        id="diagram"
        viewBox="0 0 1200 450"
        width="1200"
        height="450"
        role="img"
        aria-labelledby="svg-title svg-description"
        preserveAspectRatio="xMidYMid meet"
      >
        <title id="svg-title">Прямые интеграции и интеграции через шлюз</title>
        <desc id="svg-description">
          Слева пять сервисов имеют пятнадцать прямых связей с тремя
          провайдерами. Справа те же пять сервисов обращаются к одному шлюзу,
          а шлюз подключён к трём провайдерам.
        </desc>
        <g id="drawing"></g>
      </svg>
      <p id="fallback" hidden>
        Схема должна была показать: слева 5 сервисов напрямую подключены к 3
        провайдерам и образуют 15 интеграций; справа те же 5 сервисов
        подключены к одному шлюзу, а шлюз — к 3 провайдерам.
      </p>
    </figure>
  </main>

  <script>
    const data = [
      { x: 0, y: 0 },
      1,
      0,
      0.5,
      { x: 0, y: 0, w: 1200, h: 450 },
      {
        left: { x: 20, y: 8, w: 560, h: 430, r: 14 },
        right: { x: 620, y: 8, w: 560, h: 430, r: 14 },
        divider: { x: 600, y1: 20, y2: 430 }
      },
      {
        left: { text: "Без шлюза", x: 300, y: 38 },
        right: { text: "Со шлюзом", x: 900, y: 38 }
      },
      [
        {
          key: "catalog",
          label: "Каталог",
          left: { x: 45, y: 92, w: 150, h: 38, r: 9 },
          right: { x: 645, y: 92, w: 145, h: 38, r: 9 }
        },
        {
          key: "search",
          label: "Поиск",
          left: { x: 45, y: 145, w: 150, h: 38, r: 9 },
          right: { x: 645, y: 145, w: 145, h: 38, r: 9 }
        },
        {
          key: "support",
          label: "Поддержка",
          left: { x: 45, y: 198, w: 150, h: 38, r: 9 },
          right: { x: 645, y: 198, w: 145, h: 38, r: 9 }
        },
        {
          key: "analytics",
          label: "Аналитика",
          left: { x: 45, y: 251, w: 150, h: 38, r: 9 },
          right: { x: 645, y: 251, w: 145, h: 38, r: 9 }
        },
        {
          key: "recommendations",
          label: "Рекомендации",
          left: { x: 45, y: 304, w: 150, h: 38, r: 9 },
          right: { x: 645, y: 304, w: 145, h: 38, r: 9 }
        }
      ],
      [
        {
          key: "openai",
          label: "OpenAI",
          left: { x: 430, y: 98, w: 125, h: 48, r: 9 },
          right: { x: 1040, y: 98, w: 125, h: 48, r: 9 }
        },
        {
          key: "anthropic",
          label: "Anthropic",
          left: { x: 430, y: 192, w: 125, h: 48, r: 9 },
          right: { x: 1040, y: 192, w: 125, h: 48, r: 9 }
        },
        {
          key: "llama",
          label: "Llama",
          left: { x: 430, y: 286, w: 125, h: 48, r: 9 },
          right: { x: 1040, y: 286, w: 125, h: 48, r: 9 }
        }
      ],
      {
        x: 875,
        y: 88,
        w: 115,
        h: 254,
        r: 14,
        labels: [
          { text: "Шлюз", x: 932.5, y: 190 },
          { text: "единый API", x: 932.5, y: 216 },
          { text: "1 конфиг", x: 932.5, y: 242 }
        ]
      },
      {
        leftServices: { text: "5 сервисов", x: 120, y: 73 },
        leftProviders: { text: "3 провайдера", x: 492.5, y: 73 },
        rightServices: { text: "Те же 5 сервисов", x: 717.5, y: 73 },
        gateway: { text: "Шлюз", x: 932.5, y: 73 },
        rightProviders: { text: "3 провайдера", x: 1102.5, y: 73 }
      },
      {
        left: {
          box: { x: 45, y: 362, w: 510, h: 61, r: 10 },
          main: {
            text: "15 разных связок «сервис — провайдер»",
            x: 300,
            y: 386
          },
          note: {
            text: "Новый сервис добавит ещё 3 интеграции",
            x: 300,
            y: 410
          }
        },
        right: {
          box: { x: 645, y: 362, w: 510, h: 61, r: 10 },
          main: {
            text: "5 интеграций с API + 1 конфигурация",
            x: 900,
            y: 386
          },
          note: {
            text: "Новый сервис добавит 1 интеграцию",
            x: 900,
            y: 410
          }
        }
      }
    ];

    const [
      origin,
      scale,
      zero,
      half,
      canvas,
      panels,
      panelTitles,
      services,
      providers,
      gateway,
      columnTitles,
      metrics
    ] = data;

    function sx(x) {
      return origin.x + x * scale;
    }

    function sy(y) {
      return origin.y + y * scale;
    }

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("diagram");
    const drawing = document.getElementById("drawing");
    const fallback = document.getElementById("fallback");

    function element(name, attributes, text) {
      const node = document.createElementNS(NS, name);

      for (const [key, value] of Object.entries(attributes)) {
        node.setAttribute(key, String(value));
      }

      if (text !== undefined) {
        node.textContent = text;
      }

      return node;
    }

    function addRect(parent, box, className) {
      parent.appendChild(
        element("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.w) - sx(zero),
          height: sy(box.h) - sy(zero),
          rx: sx(box.r) - sx(zero),
          ry: sy(box.r) - sy(zero),
          class: className
        })
      );
    }

    function addLine(parent, start, end, className) {
      parent.appendChild(
        element("line", {
          x1: sx(start.x),
          y1: sy(start.y),
          x2: sx(end.x),
          y2: sy(end.y),
          class: className
        })
      );
    }

    function addText(parent, item, className, anchor) {
      parent.appendChild(
        element(
          "text",
          {
            x: sx(item.x),
            y: sy(item.y),
            class: className,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          item.text
        )
      );
    }

    function centerOf(box) {
      return {
        x: box.x + box.w * half,
        y: box.y + box.h * half
      };
    }

    function drawNode(parent, box, label, className) {
      addRect(parent, box, className);
      addText(
        parent,
        {
          text: label,
          x: centerOf(box).x,
          y: centerOf(box).y
        },
        "node-label",
        "middle"
      );
    }

    try {
      if (!svg || !drawing || !fallback) {
        throw new Error("Контейнер схемы не найден");
      }

      drawing.replaceChildren();

      const panelLayer = element("g", { "aria-hidden": "true" });
      const edgeLayer = element("g", { "aria-hidden": "true" });
      const nodeLayer = element("g", {});
      const labelLayer = element("g", {});

      addRect(panelLayer, panels.left, "panel");
      addRect(panelLayer, panels.right, "panel");
      addLine(
        panelLayer,
        { x: panels.divider.x, y: panels.divider.y1 },
        { x: panels.divider.x, y: panels.divider.y2 },
        "divider"
      );

      for (const service of services) {
        for (const provider of providers) {
          addLine(
            edgeLayer,
            {
              x: service.left.x + service.left.w,
              y: centerOf(service.left).y
            },
            {
              x: provider.left.x,
              y: centerOf(provider.left).y
            },
            "direct-link"
          );
        }
      }

      for (const service of services) {
        addLine(
          edgeLayer,
          {
            x: service.right.x + service.right.w,
            y: centerOf(service.right).y
          },
          {
            x: gateway.x,
            y: centerOf(service.right).y
          },
          "gateway-link"
        );
      }

      for (const provider of providers) {
        addLine(
          edgeLayer,
          {
            x: gateway.x + gateway.w,
            y: centerOf(provider.right).y
          },
          {
            x: provider.right.x,
            y: centerOf(provider.right).y
          },
          "gateway-link"
        );
      }

      for (const service of services) {
        drawNode(
          nodeLayer,
          service.left,
          service.label,
          "service-node"
        );
        drawNode(
          nodeLayer,
          service.right,
          service.label,
          "service-node"
        );
      }

      for (const provider of providers) {
        drawNode(
          nodeLayer,
          provider.left,
          provider.label,
          "provider-node"
        );
        drawNode(
          nodeLayer,
          provider.right,
          provider.label,
          "provider-node"
        );
      }

      addRect(nodeLayer, gateway, "gateway-node");

      for (const label of gateway.labels) {
        addText(nodeLayer, label, "gateway-label", "middle");
      }

      addRect(nodeLayer, metrics.left.box, "metric");
      addRect(nodeLayer, metrics.right.box, "metric");

      addText(labelLayer, panelTitles.left, "panel-title", "middle");
      addText(labelLayer, panelTitles.right, "panel-title", "middle");

      for (const item of Object.values(columnTitles)) {
        addText(labelLayer, item, "column-title", "middle");
      }

      addText(labelLayer, metrics.left.main, "metric-main", "middle");
      addText(labelLayer, metrics.left.note, "metric-note", "middle");
      addText(labelLayer, metrics.right.main, "metric-main", "middle");
      addText(labelLayer, metrics.right.note, "metric-note", "middle");

      drawing.appendChild(panelLayer);
      drawing.appendChild(edgeLayer);
      drawing.appendChild(nodeLayer);
      drawing.appendChild(labelLayer);

      svg.setAttribute(
        "viewBox",
        [
          sx(canvas.x),
          sy(canvas.y),
          sx(canvas.w) - sx(zero),
          sy(canvas.h) - sy(zero)
        ].join(" ")
      );
    } catch (error) {
      svg.setAttribute("hidden", "");
      fallback.removeAttribute("hidden");
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
