<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Чувствительность компонентов трансформера</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --surface-soft: #f1f4f8;
      --ink: #182230;
      --muted: #5c6878;
      --line: #c8d0db;
      --rail: #758195;
      --green: #16875b;
      --green-soft: #e5f5ee;
      --amber: #b86a00;
      --amber-soft: #fff1d8;
      --red: #ca3d4c;
      --red-soft: #fde8eb;
      --deep-red: #9c1830;
      --deep-red-soft: #f8dce2;
      --focus: #334155;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151d;
        --surface: #171e28;
        --surface-soft: #202936;
        --ink: #f2f5f9;
        --muted: #aeb9c8;
        --line: #3a4656;
        --rail: #8896aa;
        --green: #65d5a5;
        --green-soft: #173b30;
        --amber: #ffc267;
        --amber-soft: #44331d;
        --red: #ff8490;
        --red-soft: #47262d;
        --deep-red: #ff6078;
        --deep-red-soft: #4b202c;
        --focus: #d6deea;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    figcaption {
      padding: 16px 24px 10px;
      background: var(--surface);
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--surface);
    }

    .edge-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .axis-caption {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.1em;
    }

    .card,
    .note-card {
      fill: var(--surface-soft);
      stroke: var(--line);
    }

    .card-title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .card-level {
      fill: var(--muted);
      font-size: 13px;
    }

    .format-label {
      font-size: 14px;
      font-weight: bold;
    }

    .note-kicker {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 0.09em;
    }

    .note-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .footer-text {
      fill: var(--focus);
      font-size: 15px;
      font-weight: bold;
    }

    .tone-green .accent-fill {
      fill: var(--green);
    }

    .tone-green .accent-soft {
      fill: var(--green-soft);
      stroke: var(--green);
    }

    .tone-green .accent-text {
      fill: var(--green);
    }

    .tone-amber .accent-fill {
      fill: var(--amber);
    }

    .tone-amber .accent-soft {
      fill: var(--amber-soft);
      stroke: var(--amber);
    }

    .tone-amber .accent-text {
      fill: var(--amber);
    }

    .tone-red .accent-fill {
      fill: var(--red);
    }

    .tone-red .accent-soft {
      fill: var(--red-soft);
      stroke: var(--red);
    }

    .tone-red .accent-text {
      fill: var(--red);
    }

    .tone-deep-red .accent-fill {
      fill: var(--deep-red);
    }

    .tone-deep-red .accent-soft {
      fill: var(--deep-red-soft);
      stroke: var(--deep-red);
    }

    .tone-deep-red .accent-text {
      fill: var(--deep-red);
    }

    #fallback {
      margin: 0;
      padding: 26px 24px 30px;
      color: var(--ink);
      background: var(--surface);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-subtitle">
    <figcaption>
      <h2 id="diagram-title">Чувствительность к ошибке квантизации</h2>
      <p class="subtitle" id="diagram-subtitle">
        Движение вправо означает рост риска, а не порядок вычислений
      </p>
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 1200 420"
      width="1200"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Веса, активации, KV-кэш и логиты attention расположены слева направо по возрастанию чувствительности к ошибке квантизации"
    ></svg>

    <p id="fallback" hidden>
      Схема должна была показать: веса — INT4, активации — INT8,
      KV-кэш — FP8/INT8, логиты attention — FP16. Слева направо
      чувствительность к ошибке квантизации растёт.
    </p>
  </figure>

  <script>
    const diagramData = Object.freeze([
      {
        origin: [0, 0],
        scale: [1, 1],
        zero: 0,
        rail: {
          start: 56,
          end: 1144,
          tipBase: 1122,
          y: 211,
          tipTop: 199,
          tipBottom: 223,
          captionX: 600,
          captionY: 196
        },
        edgeLabels: {
          leftX: 28,
          rightX: 1172,
          y: 28
        },
        card: {
          y: 50,
          width: 270,
          height: 116,
          radius: 14,
          titleY: 82,
          levelY: 106,
          pillY: 121,
          pillHeight: 30,
          pillRadius: 15
        },
        connector: {
          fromY: 166,
          toY: 201,
          nodeRadius: 8,
          stemFromY: 221,
          stemToY: 238
        },
        note: {
          y: 238,
          width: 270,
          height: 96,
          radius: 12,
          kickerY: 260,
          firstLineY: 286,
          secondLineY: 309
        },
        footer: {
          x: 160,
          y: 354,
          width: 880,
          height: 48,
          radius: 12,
          textX: 600,
          textY: 384
        },
        lineWidths: {
          rail: 5,
          segment: 7,
          connector: 2,
          card: 2,
          node: 2,
          footer: 2
        },
        labelPadding: 12
      },
      {
        tone: "tone-green",
        x: 155,
        cardX: 20,
        title: "Веса",
        level: "низкая чувствительность",
        format: "INT4",
        pillX: 94,
        pillWidth: 122,
        noteX: 20,
        kicker: "ПОСЛЕДСТВИЕ ОШИБКИ",
        lines: ["Обычно остаётся", "локальной"]
      },
      {
        tone: "tone-amber",
        x: 445,
        cardX: 310,
        title: "Активации",
        level: "умеренная чувствительность",
        format: "INT8",
        pillX: 384,
        pillWidth: 122,
        noteX: 310,
        kicker: "ПОСЛЕДСТВИЕ ОШИБКИ",
        lines: ["Выбросы растягивают", "шкалу"]
      },
      {
        tone: "tone-red",
        x: 735,
        cardX: 600,
        title: "KV-кэш",
        level: "высокая чувствительность",
        format: "FP8 / INT8",
        pillX: 652,
        pillWidth: 166,
        noteX: 600,
        kicker: "ПОСЛЕДСТВИЕ ОШИБКИ",
        lines: ["Неточность возвращается", "в следующих токенах"]
      },
      {
        tone: "tone-deep-red",
        x: 1025,
        cardX: 890,
        title: "Логиты attention",
        level: "самая высокая чувствительность",
        format: "FP16",
        pillX: 964,
        pillWidth: 122,
        noteX: 890,
        kicker: "ПОСЛЕДСТВИЕ ОШИБКИ",
        lines: ["Softmax усиливает", "малый сдвиг"]
      }
    ]);

    const [config, ...items] = diagramData;
    const [originX, originY] = config.origin;
    const [scaleX, scaleY] = config.scale;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = logicalX => origin.x + logicalX * scale.x;
    const sy = logicalY => origin.y + logicalY * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      const make = (name, attributes, parent) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        parent.appendChild(element);
        return element;
      };

      const addText = (parent, value, x, y, className, anchor) => {
        const text = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        }, parent);
        text.textContent = value;
        return text;
      };

      const backgroundLayer = make("g", {
        "aria-hidden": "true"
      }, svg);

      addText(
        backgroundLayer,
        "НИЖЕ РИСК",
        config.edgeLabels.leftX,
        config.edgeLabels.y,
        "edge-label",
        "start"
      );

      addText(
        backgroundLayer,
        "ВЫШЕ РИСК",
        config.edgeLabels.rightX,
        config.edgeLabels.y,
        "edge-label",
        "end"
      );

      addText(
        backgroundLayer,
        "РОСТ ЧУВСТВИТЕЛЬНОСТИ К ОШИБКЕ",
        config.rail.captionX,
        config.rail.captionY,
        "axis-caption",
        "middle"
      );

      make("line", {
        x1: sx(config.rail.start),
        y1: sy(config.rail.y),
        x2: sx(config.rail.tipBase),
        y2: sy(config.rail.y),
        stroke: "var(--rail)",
        "stroke-width": config.lineWidths.rail,
        "stroke-linecap": "round"
      }, backgroundLayer);

      const segments = items.slice();
      const segmentPairs = segments.map((item, position, collection) => {
        const next = collection.find(candidate => candidate.x > item.x);
        return next ? { from: item, to: next } : null;
      }).filter(Boolean);

      segmentPairs.forEach(pair => {
        make("line", {
          x1: sx(pair.from.x),
          y1: sy(config.rail.y),
          x2: sx(pair.to.x),
          y2: sy(config.rail.y),
          class: pair.to.tone + " accent-fill",
          stroke: pair.to.tone === "tone-amber"
            ? "var(--amber)"
            : pair.to.tone === "tone-red"
              ? "var(--red)"
              : "var(--deep-red)",
          "stroke-width": config.lineWidths.segment,
          "stroke-linecap": "round"
        }, backgroundLayer);
      });

      make("polygon", {
        points: [
          [config.rail.end, config.rail.y],
          [config.rail.tipBase, config.rail.tipTop],
          [config.rail.tipBase, config.rail.tipBottom]
        ].map(point => sx(point.shift()) + "," + sy(point.pop())).join(" "),
        fill: "var(--deep-red)"
      }, backgroundLayer);

      items.forEach(item => {
        const group = make("g", {
          class: item.tone
        }, svg);

        make("rect", {
          x: sx(item.cardX),
          y: sy(config.card.y),
          width: sx(config.card.width) - sx(config.zero),
          height: sy(config.card.height) - sy(config.zero),
          rx: sx(config.card.radius) - sx(config.zero),
          ry: sy(config.card.radius) - sy(config.zero),
          class: "card",
          "stroke-width": config.lineWidths.card
        }, group);

        make("rect", {
          x: sx(item.cardX),
          y: sy(config.card.y),
          width: sx(config.labelPadding) - sx(config.zero),
          height: sy(config.card.height) - sy(config.zero),
          class: "accent-fill"
        }, group);

        addText(
          group,
          item.title,
          item.x,
          config.card.titleY,
          "card-title",
          "middle"
        );

        addText(
          group,
          item.level,
          item.x,
          config.card.levelY,
          "card-level",
          "middle"
        );

        make("rect", {
          x: sx(item.pillX),
          y: sy(config.card.pillY),
          width: sx(item.pillWidth) - sx(config.zero),
          height: sy(config.card.pillHeight) - sy(config.zero),
          rx: sx(config.card.pillRadius) - sx(config.zero),
          ry: sy(config.card.pillRadius) - sy(config.zero),
          class: "accent-soft",
          "stroke-width": config.lineWidths.card
        }, group);

        addText(
          group,
          item.format,
          item.x,
          config.card.pillY + config.card.pillHeight - config.labelPadding,
          "format-label accent-text",
          "middle"
        );

        make("line", {
          x1: sx(item.x),
          y1: sy(config.connector.fromY),
          x2: sx(item.x),
          y2: sy(config.connector.toY),
          stroke: "var(--line)",
          "stroke-width": config.lineWidths.connector
        }, group);

        make("circle", {
          cx: sx(item.x),
          cy: sy(config.rail.y),
          r: sy(config.connector.nodeRadius) - sy(config.zero),
          class: "accent-fill",
          stroke: "var(--surface)",
          "stroke-width": config.lineWidths.node
        }, group);

        make("line", {
          x1: sx(item.x),
          y1: sy(config.connector.stemFromY),
          x2: sx(item.x),
          y2: sy(config.connector.stemToY),
          stroke: "var(--line)",
          "stroke-width": config.lineWidths.connector
        }, group);

        make("rect", {
          x: sx(item.noteX),
          y: sy(config.note.y),
          width: sx(config.note.width) - sx(config.zero),
          height: sy(config.note.height) - sy(config.zero),
          rx: sx(config.note.radius) - sx(config.zero),
          ry: sy(config.note.radius) - sy(config.zero),
          class: "note-card",
          "stroke-width": config.lineWidths.card
        }, group);

        addText(
          group,
          item.kicker,
          item.x,
          config.note.kickerY,
          "note-kicker",
          "middle"
        );

        const [firstLine, secondLine] = item.lines;

        addText(
          group,
          firstLine,
          item.x,
          config.note.firstLineY,
          "note-text",
          "middle"
        );

        addText(
          group,
          secondLine,
          item.x,
          config.note.secondLineY,
          "note-text",
          "middle"
        );
      });

      const footerGroup = make("g", {}, svg);

      make("rect", {
        x: sx(config.footer.x),
        y: sy(config.footer.y),
        width: sx(config.footer.width) - sx(config.zero),
        height: sy(config.footer.height) - sy(config.zero),
        rx: sx(config.footer.radius) - sx(config.zero),
        ry: sy(config.footer.radius) - sy(config.zero),
        fill: "var(--surface-soft)",
        stroke: "var(--line)",
        "stroke-width": config.lineWidths.footer
      }, footerGroup);

      addText(
        footerGroup,
        "Вправо → одной и той же погрешности труднее остаться незаметной",
        config.footer.textX,
        config.footer.textY,
        "footer-text",
        "middle"
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
