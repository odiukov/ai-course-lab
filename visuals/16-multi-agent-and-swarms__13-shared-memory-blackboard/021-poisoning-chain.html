<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Распространение отравленного факта</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f5f0;
      --panel: #fffdf8;
      --panel-soft: #f0ece3;
      --ink: #25241f;
      --muted: #656158;
      --line: #aaa397;
      --source: #327c75;
      --source-soft: #dcefeb;
      --poison: #bd3d4e;
      --poison-soft: #f8dfe3;
      --spread: #9a5a23;
      --spread-soft: #f5e6d6;
      --decision: #7652a4;
      --decision-soft: #eae1f4;
      --report: #4e5665;
      --report-soft: #e4e7ed;
      --shadow: rgba(50, 42, 31, .12);
      --focus: #fff6cd;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      place-items: start stretch;
      padding: 12px;
    }

    .figure {
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .figure__header {
      position: relative;
      z-index: 1;
      padding: 14px 18px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-soft);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
      font-weight: 760;
      letter-spacing: .01em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .frame {
      fill: none;
      stroke: var(--line);
      stroke-width: 1px;
    }

    .guide {
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--line);
    }

    .card {
      stroke-width: 3px;
      filter: drop-shadow(0 4px 5px var(--shadow));
    }

    .card--source {
      fill: var(--source-soft);
      stroke: var(--source);
    }

    .card--poison {
      fill: var(--poison-soft);
      stroke: var(--poison);
    }

    .card--spread {
      fill: var(--spread-soft);
      stroke: var(--spread);
    }

    .card--decision {
      fill: var(--decision-soft);
      stroke: var(--decision);
    }

    .card--report {
      fill: var(--report-soft);
      stroke: var(--report);
    }

    .chip {
      stroke-width: 1px;
    }

    .chip--source {
      fill: var(--source);
      stroke: var(--source);
    }

    .chip--poison {
      fill: var(--poison);
      stroke: var(--poison);
    }

    .chip--spread {
      fill: var(--spread);
      stroke: var(--spread);
    }

    .chip--decision {
      fill: var(--decision);
      stroke: var(--decision);
    }

    .chip--report {
      fill: var(--report);
      stroke: var(--report);
    }

    .chip-text {
      fill: #fff;
      font-size: 13px;
      font-weight: 760;
      letter-spacing: .035em;
    }

    .card-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 760;
    }

    .card-kicker {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 620;
    }

    .number {
      fill: var(--ink);
      font-size: 38px;
      font-weight: 820;
      letter-spacing: -.025em;
    }

    .number--source {
      fill: var(--source);
    }

    .number--poison {
      fill: var(--poison);
    }

    .number--spread {
      fill: var(--spread);
    }

    .number--decision {
      fill: var(--decision);
    }

    .number--report {
      fill: var(--report);
    }

    .detail {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 620;
    }

    .annotation {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 610;
    }

    .poison-mark {
      fill: var(--poison);
      font-size: 14px;
      font-weight: 790;
    }

    .flow-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 680;
    }

    .legend-box {
      fill: var(--focus);
      stroke: var(--poison);
      stroke-width: 2px;
    }

    .legend-dot {
      fill: var(--poison);
    }

    .legend-main {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 720;
    }

    .legend-accent {
      fill: var(--poison);
      font-size: 15px;
      font-weight: 820;
    }

    #fallback {
      display: none;
      margin: 16px;
      padding: 14px;
      border: 2px solid var(--poison);
      border-radius: 10px;
      background: var(--poison-soft);
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #151719;
        --panel: #1d2023;
        --panel-soft: #25292d;
        --ink: #f2eee5;
        --muted: #bcb5aa;
        --line: #62666a;
        --source: #72c9be;
        --source-soft: #173a37;
        --poison: #ff7c8c;
        --poison-soft: #46242b;
        --spread: #e9a462;
        --spread-soft: #432f20;
        --decision: #c7a1f2;
        --decision-soft: #352746;
        --report: #b8c2d5;
        --report-soft: #303640;
        --shadow: rgba(0, 0, 0, .32);
        --focus: #40391f;
      }
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-title diagram-subtitle">
    <figcaption class="figure__header">
      <h1 id="diagram-title">Как отравленный факт проходит через трёх агентов</h1>
      <p class="subtitle" id="diagram-subtitle">
        Проследи слева направо не агентов, а число.
      </p>
    </figcaption>

    <svg id="diagram"
         viewBox="0 0 1500 390"
         width="1500"
         height="390"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Цепочка распространения ошибки от 4,2% к 42%</title>
      <desc id="svg-description">
        Источник сообщает 4,2 процента. Агент A ошибочно записывает 42 процента.
        Агент B называет прирост большим, агент C рекомендует внедрение,
        а итоговый отчёт повторяет 42 процента.
      </desc>
      <g id="drawing"></g>
    </svg>

    <div id="fallback" role="img">
      Схема должна была показать цепочку: источник сообщает 4,2%; retrieval-агент
      A записывает 42%; агент B называет прирост большим; агент C рекомендует
      внедрение; итоговый отчёт повторяет 42%.
    </div>
  </figure>

  <script>
    const DATA = [
      {
        origin: { x: 20, y: 14 },
        scale: { x: 1, y: 1 },
        frame: { left: 8, top: 8, right: 1452, bottom: 354, radius: 12 },
        card: { top: 58, bottom: 264, radius: 14 },
        chip: { top: 76, bottom: 104, radius: 8 },
        lineY: 161,
        arrow: { inset: 12, wing: 11 },
        flowY: 42,
        legend: {
          left: 252,
          top: 290,
          right: 1208,
          bottom: 338,
          radius: 12,
          dotX: 280,
          dotY: 314,
          dotRadius: 7,
          firstX: 302,
          secondX: 668,
          textY: 320
        }
      },
      {
        id: "source",
        kind: "source",
        left: 18,
        right: 242,
        chipLeft: 38,
        chipRight: 130,
        chip: "ИСТОЧНИК",
        title: "Страница",
        kicker: "исходный факт",
        number: "4,2%",
        detail: "рост точности",
        note: "первичная запись",
        titleY: 132,
        kickerY: 153,
        numberY: 202,
        detailY: 228,
        noteY: 250
      },
      {
        id: "agent-a",
        kind: "poison",
        left: 314,
        right: 538,
        chipLeft: 334,
        chipRight: 448,
        chip: "АГЕНТ A",
        title: "Retrieval",
        kicker: "пишет в память",
        number: "42%",
        detail: "рост точности",
        note: "точка отравления",
        titleY: 132,
        kickerY: 153,
        numberY: 202,
        detailY: 228,
        noteY: 250
      },
      {
        id: "agent-b",
        kind: "spread",
        left: 610,
        right: 834,
        chipLeft: 630,
        chipRight: 744,
        chip: "АГЕНТ B",
        title: "Суммаризатор",
        kicker: "читает запись A",
        number: "42%",
        detail: "«большой прирост»",
        note: "источник: A",
        titleY: 132,
        kickerY: 153,
        numberY: 202,
        detailY: 228,
        noteY: 250
      },
      {
        id: "agent-c",
        kind: "decision",
        left: 906,
        right: 1130,
        chipLeft: 926,
        chipRight: 1040,
        chip: "АГЕНТ C",
        title: "Аналитик",
        kicker: "читает вывод B",
        number: "42%",
        detail: "«рекомендую внедрять»",
        note: "ошибка стала решением",
        titleY: 132,
        kickerY: 153,
        numberY: 202,
        detailY: 228,
        noteY: 250
      },
      {
        id: "report",
        kind: "report",
        left: 1202,
        right: 1434,
        chipLeft: 1222,
        chipRight: 1354,
        chip: "РЕЗУЛЬТАТ",
        title: "Итоговый отчёт",
        kicker: "повторяет вывод",
        number: "42%",
        detail: "готовый факт",
        note: "исходника для него нет",
        titleY: 132,
        kickerY: 153,
        numberY: 202,
        detailY: 228,
        noteY: 250
      }
    ];

    const [settings, ...steps] = DATA;
    const origin = settings.origin;
    const scale = settings.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const LABEL_PAD = 8;
    const LINE_THICKNESS = 3;
    const FONT_SIZE = 14;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      const make = (name, attrs, text) => {
        const node = document.createElementNS(svg.namespaceURI, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const rect = (box, className, radius) => make("rect", {
        x: sx(box.left),
        y: sy(box.top),
        width: sx(box.right) - sx(box.left),
        height: sy(box.bottom) - sy(box.top),
        rx: sx(radius) - sx(0),
        class: className
      });

      const textAt = (value, x, y, className, anchor = "middle") => make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, value);

      drawing.appendChild(rect(
        settings.frame,
        "frame",
        settings.frame.radius
      ));

      steps.slice(0, -1).forEach((step, index) => {
        const next = steps[index + 1];
        const tail = step.right;
        const tip = next.left - settings.arrow.inset;
        const wing = settings.arrow.wing;

        drawing.appendChild(make("line", {
          x1: sx(tail),
          y1: sy(settings.lineY),
          x2: sx(tip),
          y2: sy(settings.lineY),
          class: "guide",
          "stroke-width": LINE_THICKNESS
        }));

        drawing.appendChild(make("polygon", {
          points: [
            [sx(tip), sy(settings.lineY)],
            [sx(tip - wing), sy(settings.lineY - wing)],
            [sx(tip - wing), sy(settings.lineY + wing)]
          ].map(point => point.join(",")).join(" "),
          class: "arrow-head"
        }));
      });

      const flowLabels = [
        { x: 278, text: "ошибка чтения" },
        { x: 574, text: "запись A" },
        { x: 870, text: "вывод B" },
        { x: 1166, text: "в отчёт" }
      ];

      flowLabels.forEach(label => {
        drawing.appendChild(textAt(
          label.text,
          label.x,
          settings.flowY,
          "flow-label"
        ));
      });

      steps.forEach(step => {
        const group = make("g", {
          "aria-label": [
            step.title,
            step.kicker,
            step.number,
            step.detail,
            step.note
          ].join(". ")
        });

        group.appendChild(rect({
          left: step.left,
          top: settings.card.top,
          right: step.right,
          bottom: settings.card.bottom
        }, `card card--${step.kind}`, settings.card.radius));

        group.appendChild(rect({
          left: step.chipLeft,
          top: settings.chip.top,
          right: step.chipRight,
          bottom: settings.chip.bottom
        }, `chip chip--${step.kind}`, settings.chip.radius));

        group.appendChild(textAt(
          step.chip,
          (step.chipLeft + step.chipRight) / scale.x / (scale.x + scale.x),
          settings.chip.bottom - LABEL_PAD,
          "chip-text"
        ));

        const center = (step.left + step.right) / scale.x / (scale.x + scale.x);

        group.appendChild(textAt(
          step.title,
          center,
          step.titleY,
          "card-title"
        ));

        group.appendChild(textAt(
          step.kicker,
          center,
          step.kickerY,
          "card-kicker"
        ));

        group.appendChild(textAt(
          step.number,
          center,
          step.numberY,
          `number number--${step.kind}`
        ));

        group.appendChild(textAt(
          step.detail,
          center,
          step.detailY,
          "detail"
        ));

        group.appendChild(textAt(
          step.note,
          center,
          step.noteY,
          step.kind === "poison" ? "poison-mark" : "annotation"
        ));

        drawing.appendChild(group);
      });

      drawing.appendChild(rect(
        settings.legend,
        "legend-box",
        settings.legend.radius
      ));

      drawing.appendChild(make("circle", {
        cx: sx(settings.legend.dotX),
        cy: sy(settings.legend.dotY),
        r: sx(settings.legend.dotRadius) - sx(0),
        class: "legend-dot"
      }));

      drawing.appendChild(textAt(
        "Искажение появляется у A;",
        settings.legend.firstX,
        settings.legend.textY,
        "legend-accent",
        "start"
      ));

      drawing.appendChild(textAt(
        "дальше меняется смысл, но не число.",
        settings.legend.secondX,
        settings.legend.textY,
        "legend-main",
        "start"
      ));

      drawing.style.fontSize = `${FONT_SIZE}px`;
      fallback.style.display = "none";
    } catch (error) {
      document.getElementById("diagram").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
