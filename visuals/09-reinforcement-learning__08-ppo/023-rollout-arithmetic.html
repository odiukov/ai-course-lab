<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сколько обновлений извлекается из одного ролаута</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #eef2ff;
      --surface-warm: #fff7e6;
      --surface-green: #eaf8f1;
      --ink: #182033;
      --muted: #5f6b7d;
      --line: #8a96aa;
      --accent: #4967d8;
      --accent-strong: #304ebc;
      --warm: #d48618;
      --green: #19865b;
      --result: #6b46c1;
      --footer: #edf0f7;
      --shadow: #dfe4ee;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #121621;
        --surface: #1b2130;
        --surface-soft: #222c4b;
        --surface-warm: #392c19;
        --surface-green: #17372d;
        --ink: #edf1fb;
        --muted: #b2bdd0;
        --line: #71809a;
        --accent: #8ea4ff;
        --accent-strong: #b1c0ff;
        --warm: #f1b755;
        --green: #62d3a5;
        --result: #c1a5ff;
        --footer: #202737;
        --shadow: #0b0e15;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      background: var(--page);
      padding: 12px 16px 14px;
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 21px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--surface);
      border: 1px solid var(--shadow);
    }

    .panel {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .panel-rollout {
      fill: var(--surface-warm);
      stroke: var(--warm);
    }

    .panel-batches {
      fill: var(--surface-soft);
      stroke: var(--accent);
    }

    .panel-epochs {
      fill: var(--surface-green);
      stroke: var(--green);
    }

    .panel-result {
      fill: var(--surface-soft);
      stroke: var(--result);
      stroke-width: 3px;
    }

    .footer-panel {
      fill: var(--footer);
      stroke: var(--line);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .lane {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .lane-dot {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .batch {
      fill: var(--accent);
      stroke: var(--accent-strong);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .epoch {
      fill: var(--green);
      stroke: var(--green);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .arrow-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--line);
      stroke: none;
    }

    text {
      fill: var(--ink);
      font-size: 16px;
      dominant-baseline: middle;
    }

    .stage-title {
      font-size: 18px;
      font-weight: 750;
      text-anchor: middle;
    }

    .stage-note {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 550;
      text-anchor: middle;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
      text-anchor: start;
    }

    .number {
      font-size: 32px;
      font-weight: 800;
      text-anchor: middle;
      letter-spacing: -0.02em;
    }

    .rollout-number {
      fill: var(--warm);
    }

    .result-number {
      fill: var(--result);
      font-size: 36px;
    }

    .result-label {
      font-size: 15px;
      font-weight: 700;
      text-anchor: middle;
    }

    .formula {
      font-size: 18px;
      font-weight: 750;
      text-anchor: middle;
    }

    .distinction {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 550;
      text-anchor: middle;
    }

    #fallback {
      margin: 0;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--shadow);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
      text-align: center;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Сколько обновлений извлекается из одного ролаута</h1>

    <svg
      id="diagram"
      viewBox="0 0 1200 420"
      width="1200"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Поток вычислений PPO из одного ролаута</title>
      <desc id="svg-desc">
        Восемь сред по сто двадцать восемь шагов дают тысячу двадцать
        четыре перехода. Они образуют шестнадцать минибатчей по шестьдесят
        четыре перехода в каждой из десяти эпох, что даёт сто шестьдесят
        шагов оптимизатора.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden>
      8 сред × 128 шагов дают 1024 перехода. Ролаут делится на
      16 минибатчей по 64 перехода и проходит 10 эпох, поэтому оптимизатор
      выполняет 160 шагов.
    </p>
  </main>

  <script>
    const DATA = [{
      origin: { x: 20, y: 10 },
      scale: { x: 10, y: 9 },

      arrow: { head: 1.15, half: 0.72 },

      environments: {
        box: { x: 3, y: 5, w: 22, h: 26 },
        lineStart: 5.5,
        lineEnd: 22.5,
        dotRadius: 0.34,
        rows: [
          { y: 11 }, { y: 13 }, { y: 15 }, { y: 17 },
          { y: 19 }, { y: 21 }, { y: 23 }, { y: 25 }
        ],
        title: { x: 14, y: 8 },
        note: { x: 14, y: 29 }
      },

      rollout: {
        box: { x: 31, y: 9, w: 14, h: 19 },
        number: { x: 38, y: 15 },
        label: { x: 38, y: 20 },
        note: { x: 38, y: 24.5 }
      },

      minibatches: {
        box: { x: 51, y: 5, w: 25, h: 26 },
        title: { x: 63.5, y: 8 },
        cellWidth: 2.15,
        cellHeight: 3.6,
        cells: [
          { x: 53, y: 11 }, { x: 55.9, y: 11 },
          { x: 58.8, y: 11 }, { x: 61.7, y: 11 },
          { x: 64.6, y: 11 }, { x: 67.5, y: 11 },
          { x: 70.4, y: 11 }, { x: 73.3, y: 11 },
          { x: 53, y: 16 }, { x: 55.9, y: 16 },
          { x: 58.8, y: 16 }, { x: 61.7, y: 16 },
          { x: 64.6, y: 16 }, { x: 67.5, y: 16 },
          { x: 70.4, y: 16 }, { x: 73.3, y: 16 }
        ],
        count: { x: 63.5, y: 23 },
        note: { x: 63.5, y: 28 }
      },

      epochs: {
        box: { x: 82, y: 5, w: 14, h: 26 },
        title: { x: 89, y: 8 },
        barX: 85,
        barWidth: 8,
        barHeight: 0.82,
        bars: [
          { y: 10.6 }, { y: 12.15 }, { y: 13.7 }, { y: 15.25 },
          { y: 16.8 }, { y: 18.35 }, { y: 19.9 }, { y: 21.45 },
          { y: 23 }, { y: 24.55 }
        ],
        formula: { x: 89, y: 28.5 }
      },

      result: {
        box: { x: 102, y: 9, w: 15, h: 19 },
        number: { x: 109.5, y: 15 },
        first: { x: 109.5, y: 20.5 },
        second: { x: 109.5, y: 24.5 }
      },

      arrows: [
        {
          x1: 26, y1: 18, x2: 30, y2: 18,
          labelX: 26.15, labelY: 14, label: "8 × 128"
        },
        {
          x1: 46, y1: 18, x2: 50, y2: 18,
          labelX: 46.05, labelY: 14, label: "делим по 64"
        },
        {
          x1: 77, y1: 18, x2: 81, y2: 18,
          labelX: 77.05, labelY: 14, label: "повторяем"
        },
        {
          x1: 97, y1: 18, x2: 101, y2: 18,
          labelX: 97.05, labelY: 14, label: "всего"
        }
      ],

      footer: {
        box: { x: 3, y: 34, w: 114, h: 9 },
        formula: { x: 60, y: 37 },
        distinction: { x: 60, y: 40.7 }
      },

      text: {
        environmentsTitle: "8 сред",
        environmentsNote: "по 128 шагов",
        rolloutNumber: "1024",
        rolloutLabel: "перехода",
        rolloutNote: "один ролаут",
        minibatchesTitle: "1 эпоха",
        minibatchesCount: "16 минибатчей",
        minibatchesNote: "по 64 перехода",
        epochsTitle: "10 эпох",
        epochsFormula: "16 × 10",
        resultNumber: "160",
        resultFirst: "шагов",
        resultSecond: "оптимизатора",
        formula: "8 × 128 = 1024  →  1024 / 64 = 16  →  16 × 10 = 160",
        distinction:
          "Каждый переход используется 10 раз; весь ролаут даёт 160 шагов оптимизатора"
      }
    }];

    const [diagram] = DATA;
    const origin = Object.freeze(diagram.origin);
    const scale = Object.freeze(diagram.scale);

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const namespace = svg.namespaceURI;

      const make = (name, attributes, content) => {
        const node = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }
        if (content !== undefined) node.textContent = content;
        drawing.appendChild(node);
        return node;
      };

      const rectangle = (box, className) => make("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        class: className
      });

      const label = (point, content, className) => make("text", {
        x: sx(point.x),
        y: sy(point.y),
        class: className
      }, content);

      const line = (x1, y1, x2, y2, className) => make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      });

      const circle = (x, y, radius, className) => make("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(radius) - sx(0),
        class: className
      });

      const arrow = item => {
        line(item.x1, item.y1, item.x2, item.y2, "arrow-line");
        const head = diagram.arrow.head;
        const half = diagram.arrow.half;
        make("polygon", {
          points: [
            sx(item.x2) + "," + sy(item.y2),
            sx(item.x2 - head) + "," + sy(item.y2 - half),
            sx(item.x2 - head) + "," + sy(item.y2 + half)
          ].join(" "),
          class: "arrow-head"
        });
        label(
          { x: item.labelX, y: item.labelY },
          item.label,
          "arrow-label"
        );
      };

      rectangle(diagram.environments.box, "panel");
      label(
        diagram.environments.title,
        diagram.text.environmentsTitle,
        "stage-title"
      );

      for (const row of diagram.environments.rows) {
        line(
          diagram.environments.lineStart,
          row.y,
          diagram.environments.lineEnd,
          row.y,
          "lane"
        );
        circle(
          diagram.environments.lineStart,
          row.y,
          diagram.environments.dotRadius,
          "lane-dot"
        );
        circle(
          diagram.environments.lineEnd,
          row.y,
          diagram.environments.dotRadius,
          "lane-dot"
        );
      }

      label(
        diagram.environments.note,
        diagram.text.environmentsNote,
        "stage-note"
      );

      rectangle(diagram.rollout.box, "panel panel-rollout");
      label(
        diagram.rollout.number,
        diagram.text.rolloutNumber,
        "number rollout-number"
      );
      label(
        diagram.rollout.label,
        diagram.text.rolloutLabel,
        "stage-title"
      );
      label(
        diagram.rollout.note,
        diagram.text.rolloutNote,
        "stage-note"
      );

      rectangle(diagram.minibatches.box, "panel panel-batches");
      label(
        diagram.minibatches.title,
        diagram.text.minibatchesTitle,
        "stage-title"
      );

      for (const cell of diagram.minibatches.cells) {
        rectangle({
          x: cell.x,
          y: cell.y,
          w: diagram.minibatches.cellWidth,
          h: diagram.minibatches.cellHeight
        }, "batch");
      }

      label(
        diagram.minibatches.count,
        diagram.text.minibatchesCount,
        "stage-title"
      );
      label(
        diagram.minibatches.note,
        diagram.text.minibatchesNote,
        "stage-note"
      );

      rectangle(diagram.epochs.box, "panel panel-epochs");
      label(
        diagram.epochs.title,
        diagram.text.epochsTitle,
        "stage-title"
      );

      for (const bar of diagram.epochs.bars) {
        rectangle({
          x: diagram.epochs.barX,
          y: bar.y,
          w: diagram.epochs.barWidth,
          h: diagram.epochs.barHeight
        }, "epoch");
      }

      label(
        diagram.epochs.formula,
        diagram.text.epochsFormula,
        "stage-note"
      );

      rectangle(diagram.result.box, "panel panel-result");
      label(
        diagram.result.number,
        diagram.text.resultNumber,
        "number result-number"
      );
      label(
        diagram.result.first,
        diagram.text.resultFirst,
        "result-label"
      );
      label(
        diagram.result.second,
        diagram.text.resultSecond,
        "result-label"
      );

      for (const item of diagram.arrows) arrow(item);

      rectangle(diagram.footer.box, "footer-panel");
      label(
        diagram.footer.formula,
        diagram.text.formula,
        "formula"
      );
      label(
        diagram.footer.distinction,
        diagram.text.distinction,
        "distinction"
      );
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
