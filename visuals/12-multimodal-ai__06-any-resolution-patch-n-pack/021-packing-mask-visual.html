<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Маска упаковки</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1c2530; --muted:#5b6b7d; --frame:#8fa0b3;
    --cell0:#eaeef4; --cell1:#2f6fb5; --onblock:#ffffff; --row:#c0392b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --ink:#e6ecf3; --muted:#a3b1c2; --frame:#4a5665;
      --cell0:#212832; --cell1:#5a9bd8; --onblock:#0e1319; --row:#ef7a8b;
    }
  }
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.4 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:8px 10px 12px}
  h2{font-size:15px;margin:0 0 4px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .lbl{font-size:11px;fill:var(--muted)}
  .ax{font-size:11px;fill:var(--ink)}
  .blab{font-size:11px;fill:var(--onblock);font-weight:600}
  .bsub{font-size:10px;fill:var(--onblock)}
  .rowl{font-size:11px;fill:var(--row)}
  .fail{font-size:12px;color:var(--ink);padding:6px 0}
</style>
<div class="wrap">
  <h2>Маска упаковки: три блока по диагонали на поле 1600×1600</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    // ---- данные схемы ----
    var OFFSETS=[0,576,832,1600];
    var NAMES=["чек","график","скриншот"];
    var SIZES=[576,256,768];
    var N=1600;
    var ROW=700;                 // строка, по которой идём пальцем
    var CELLS=[[700,200],[200,700]];  // [строка, столбец]

    // ---- холст ----
    var W=700, H=500, PLOT=380;

    // ---- единственные origin и scale ----
    var origin={x:150,y:60};
    var scale=PLOT/N;

    // ---- единственная пара функций перевода ----
    function sx(x){return origin.x + x*scale;}
    function sy(y){return origin.y + y*scale;}

    var NS="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 "+W+" "+H);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(n,a,t){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]);
      if(t!=null)e.textContent=t; svg.appendChild(e); return e;}
    function line(x1,y1,x2,y2,st,w,d){
      var a={x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:st,"stroke-width":w};
      if(d)a["stroke-dasharray"]=d; return el("line",a);}
    function box(x,y,x2,y2,f,st,w){
      var a={x:sx(x),y:sy(y),width:sx(x2)-sx(x),height:sy(y2)-sy(y),fill:f};
      if(st){a.stroke=st;a["stroke-width"]=w;} return el("rect",a);}
    function txt(x,y,dx,dy,s,cls,anchor){
      return el("text",{x:sx(x)+dx,y:sy(y)+dy,class:cls,"text-anchor":anchor},s);}

    // фон
    el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"});

    // поле маски: всё светлое = нули
    box(0,0,N,N,"var(--cell0)");

    // три блока по диагонали
    for(var b=0;b<3;b++){
      var a0=OFFSETS[b], a1=OFFSETS[b+1], c=(a0+a1)/2;
      box(a0,a0,a1,a1,"var(--cell1)");
      txt(c,c,0,-2,NAMES[b],"blab","middle");
      txt(c,c,0,11,SIZES[b]+"×"+SIZES[b],"bsub","middle");
    }

    // рамка поля
    box(0,0,N,N,"none","var(--frame)",1);

    // засечки и подписи границ из offsets
    for(var i=0;i<OFFSETS.length;i++){
      var v=OFFSETS[i];
      line(v,0,v,-40,"var(--frame)",1);
      txt(v,0,0,-10,v,"lbl","middle");
      line(0,v,-40,v,"var(--frame)",1);
      txt(0,v,-8,4,v,"lbl","end");
    }

    // названия осей
    txt(N/2,-140,0,0,"столбец j — на кого смотрит","ax","middle");
    el("text",{class:"ax","text-anchor":"middle",
      transform:"translate("+sx(-190)+","+sy(N/2)+") rotate(-90)"})
      .textContent="строка i — кто смотрит";

    // строка 700
    line(0,ROW,N,ROW,"var(--row)",1,"5 4");
    line(1900,ROW,1620,ROW,"var(--row)",1);
    el("polygon",{points:[sx(1620),sy(ROW),sx(1740),sy(ROW)-14,sx(1740),sy(ROW)+14].join(" "),
      fill:"var(--row)"});
    txt(1780,ROW,0,-9,"строка "+ROW,"rowl","middle");

    // две светлые клетки: маска симметрична
    var d=30;
    box(CELLS[0][1]-d,CELLS[0][0]-d,CELLS[0][1]+d,CELLS[0][0]+d,"none","var(--ink)",1);
    txt(CELLS[0][1],CELLS[0][0]+d,0,15,"(700, 200)","lbl","middle");
    box(CELLS[1][1]-d,CELLS[1][0]-d,CELLS[1][1]+d,CELLS[1][0]+d,"none","var(--ink)",1);
    txt(CELLS[1][1]+d,CELLS[1][0],8,4,"(200, 700)","lbl","start");

    // легенда
    box(0,1740,60,1800,"var(--cell1)");
    txt(75,1785,0,0,"1 — смотреть можно","lbl","start");
    box(450,1740,510,1800,"var(--cell0)","var(--frame)",1);
    txt(525,1785,0,0,"0 — нельзя","lbl","start");
    txt(N,1785,0,0,"offsets [0, 576, 832, 1600]","lbl","end");

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема не построилась. Она должна показывать поле 1600×1600: '+
      'три закрашенных квадрата по диагонали — 576×576 (чек), 256×256 (график), 768×768 (скриншот), '+
      'углами друг к другу, границы из offsets [0, 576, 832, 1600]; всё остальное поле — нули. '+
      'Строка 700 закрашена только с 576 по 831; клетки (700, 200) и (200, 700) обе светлые.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
