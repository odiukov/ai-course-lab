<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дрейф политики при разных значениях beta</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --panel: #f1f3f9;
      --ink: #202536;
      --muted: #697086;
      --grid: #c9cede;
      --anchor: #858ca1;
      --a-fill: #9d86f5;
      --a-line: #5539c9;
      --b-fill: #69c9d4;
      --b-line: #157a88;
      --c-fill: #f4bd62;
      --c-line: #a96508;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #151720;
        --surface: #1d202b;
        --panel: #242835;
        --ink: #f1f3fa;
        --muted: #b0b6c8;
        --grid: #50566a;
        --anchor: #969db1;
        --a-fill: #765fd4;
        --a-line: #c0b2ff;
        --b-fill: #318d99;
        --b-line: #8ce3ec;
        --c-fill: #b87a25;
        --c-line: #ffd28a;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: unset;
      background: var(--surface);
      overflow: hidden;
    }

    h1 {
      margin: unset;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      background: var(--surface);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
    }

    .panel-title {
      font-size: 19px;
      font-weight: bold;
    }

    .panel-subtitle,
    .axis-label,
    .time-label,
    .legend-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .summary {
      font-size: 13px;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--grid);
      stroke-width: 1.5;
    }

    .axis,
    .tick,
    .guide {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .guide {
      stroke-dasharray: 5 5;
    }

    .anchor-outline {
      fill: none;
      stroke: var(--anchor);
      stroke-width: 2;
      stroke-dasharray: 5 4;
      vector-effect: non-scaling-stroke;
    }

    .bar-a {
      fill: var(--a-fill);
    }

    .bar-b {
      fill: var(--b-fill);
    }

    .bar-c {
      fill: var(--c-fill);
    }

    .line-a {
      fill: none;
      stroke: var(--a-line);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .line-b {
      fill: none;
      stroke: var(--b-line);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .line-c {
      fill: none;
      stroke: var(--c-line);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .dot-a {
      fill: var(--surface);
      stroke: var(--a-line);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .dot-b {
      fill: var(--surface);
      stroke: var(--b-line);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .dot-c {
      fill: var(--surface);
      stroke: var(--c-line);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      font-size: 16px;
      color: var(--ink);
      background: var(--surface);
    }
  </style>
</head>
<body>
  <figure aria-labelledby="scheme-heading">
    <h1 id="scheme-heading">Дрейф политики при разных значениях beta</h1>
    <svg
      id="scheme"
      width="1200"
      height="430"
      viewBox="0 0 1200 430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="scheme-heading scheme-description"
    >
      <desc id="scheme-description">
        Три запуска начинаются с одной SFT-политики. При beta = 0 распределение
        схлопывается к действию A, при beta = 0.1 дрейф умеренный, а при beta = 10
        политика почти не отходит от SFT.
      </desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать три запуска из одной SFT-политики: при beta = 0
      распределение схлопывается к действию A, при beta = 0.1 дрейф остаётся
      умеренным, а при beta = 10 политика почти не отходит от SFT-якоря.
    </p>
  </figure>

  <script>
    const data = Object.freeze({
      zero: 0,
      one: 1,
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      canvas: { width: 1200, height: 430 },
      geometry: {
        panelY: 65,
        panelW: 330,
        panelH: 320,
        panelRx: 12,
        panelXs: [65, 435, 805],
        titleY: 25,
        subtitleY: 49,
        plotTop: 88,
        plotBottom: 278,
        barStart: 38,
        barStep: 62,
        barW: 30,
        outlineGap: 5,
        dot: 4,
        axisX: 50,
        tickLeft: 44,
        axisLabelX: 23,
        axisLabelY: 183,
        turn: -90,
        timeY: 305,
        summaryFirstY: 345,
        summarySecondY: 367,
        legendY: 412,
        swatch: 14,
        legendXs: [330, 455, 580],
        legendTextX: 70,
        legendNoteX: 745
      },
      offsets: {
        centered: { dx: 0, dy: 0 },
        below: { dx: 0, dy: 4 },
        afterSwatch: { dx: 9, dy: 5 }
      },
      actions: [
        { name: "A", barClass: "bar-a", lineClass: "line-a", dotClass: "dot-a" },
        { name: "B", barClass: "bar-b", lineClass: "line-b", dotClass: "dot-b" },
        { name: "C", barClass: "bar-c", lineClass: "line-c", dotClass: "dot-c" }
      ],
      runs: [
        {
          beta: "beta = 0",
          subtitle: "свободный дрейф → схлопывание в A",
          reward: "награда растёт быстрее",
          kl: "KL растёт быстрее",
          frames: [
            [0.60, 0.25, 0.15],
            [0.70, 0.20, 0.10],
            [0.82, 0.12, 0.06],
            [0.93, 0.05, 0.02],
            [1.00, 0.00, 0.00]
          ]
        },
        {
          beta: "beta = 0.1",
          subtitle: "пружина сдерживает дрейф",
          reward: "награда растёт умеренно",
          kl: "KL растёт медленнее",
          frames: [
            [0.60, 0.25, 0.15],
            [0.64, 0.23, 0.13],
            [0.68, 0.20, 0.12],
            [0.72, 0.18, 0.10],
            [0.76, 0.16, 0.08]
          ]
        },
        {
          beta: "beta = 10",
          subtitle: "жёсткая пружина → почти SFT",
          reward: "рост награды замедлен",
          kl: "KL почти не растёт",
          frames: [
            [0.600, 0.250, 0.150],
            [0.603, 0.248, 0.149],
            [0.607, 0.246, 0.147],
            [0.610, 0.245, 0.145],
            [0.612, 0.244, 0.144]
          ]
        }
      ]
    });

    const origin = Object.freeze(data.origin);
    const scale = Object.freeze(data.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("scheme");
      const ns = "http://www.w3.org/2000/svg";

      const make = (tag, attributes, parent = svg) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const label = (
        value,
        x,
        y,
        className,
        anchor,
        offset = data.offsets.centered,
        parent = svg
      ) => {
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          dx: offset.dx,
          dy: offset.dy,
          class: className,
          "text-anchor": anchor
        }, parent);
        node.textContent = value;
        return node;
      };

      const pathFrom = points =>
        points.map((point, index) =>
          `${index === data.zero ? "M" : "L"} ${sx(point.x)} ${sy(point.y)}`
        ).join(" ");

      make("line", {
        x1: sx(data.geometry.axisX),
        y1: sy(data.geometry.plotTop),
        x2: sx(data.geometry.axisX),
        y2: sy(data.geometry.plotBottom),
        class: "axis"
      });

      [data.geometry.plotTop, data.geometry.plotBottom].forEach(y => {
        make("line", {
          x1: sx(data.geometry.tickLeft),
          y1: sy(y),
          x2: sx(data.geometry.axisX),
          y2: sy(y),
          class: "tick"
        });
      });

      const axisLabel = label(
        "вероятность действия",
        data.geometry.axisLabelX,
        data.geometry.axisLabelY,
        "axis-label",
        "middle"
      );
      axisLabel.setAttribute(
        "transform",
        `rotate(${data.geometry.turn} ${sx(data.geometry.axisLabelX)} ${sy(data.geometry.axisLabelY)})`
      );

      data.runs.forEach((run, runIndex) => {
        const panelX = data.geometry.panelXs.at(runIndex);
        const group = make("g", {
          "aria-label": `${run.beta}: ${run.subtitle}`
        });

        make("rect", {
          x: sx(panelX),
          y: sy(data.geometry.panelY),
          width: sx(panelX + data.geometry.panelW) - sx(panelX),
          height: sy(data.geometry.panelY + data.geometry.panelH) - sy(data.geometry.panelY),
          rx: sx(data.geometry.panelRx) - sx(data.zero),
          class: "panel"
        }, group);

        label(
          run.beta,
          panelX + data.geometry.panelW * 0.5,
          data.geometry.titleY,
          "panel-title",
          "middle",
          data.offsets.centered,
          group
        );

        label(
          run.subtitle,
          panelX + data.geometry.panelW * 0.5,
          data.geometry.subtitleY,
          "panel-subtitle",
          "middle",
          data.offsets.centered,
          group
        );

        make("line", {
          x1: sx(panelX + data.geometry.barStart),
          y1: sy(data.geometry.plotTop),
          x2: sx(panelX + data.geometry.barStart),
          y2: sy(data.geometry.plotBottom),
          class: "guide"
        }, group);

        const actionPaths = data.actions.map(() => []);

        run.frames.forEach((frame, frameIndex) => {
          const barX =
            panelX +
            data.geometry.barStart +
            frameIndex * data.geometry.barStep;
          const centerX = barX + data.geometry.barW * 0.5;
          const plotHeight =
            data.geometry.plotBottom - data.geometry.plotTop;
          let cumulative = data.zero;

          frame.forEach((probability, actionIndex) => {
            const top =
              data.geometry.plotBottom -
              (cumulative + probability) * plotHeight;
            const action = data.actions.at(actionIndex);

            make("rect", {
              x: sx(barX),
              y: sy(top),
              width: sx(barX + data.geometry.barW) - sx(barX),
              height: sy(top + probability * plotHeight) - sy(top),
              class: action.barClass
            }, group);

            actionPaths.at(actionIndex).push({
              x: centerX,
              y: data.geometry.plotBottom - probability * plotHeight
            });

            cumulative += probability;
          });

          if (frameIndex === data.zero) {
            make("rect", {
              x: sx(barX - data.geometry.outlineGap),
              y: sy(data.geometry.plotTop - data.geometry.outlineGap),
              width:
                sx(barX + data.geometry.barW + data.geometry.outlineGap) -
                sx(barX - data.geometry.outlineGap),
              height:
                sy(data.geometry.plotBottom + data.geometry.outlineGap) -
                sy(data.geometry.plotTop - data.geometry.outlineGap),
              class: "anchor-outline"
            }, group);
          }
        });

        actionPaths.forEach((points, actionIndex) => {
          const action = data.actions.at(actionIndex);

          make("path", {
            d: pathFrom(points),
            class: action.lineClass
          }, group);

          points.forEach(point => {
            make("circle", {
              cx: sx(point.x),
              cy: sy(point.y),
              r: sx(data.geometry.dot) - sx(data.zero),
              class: action.dotClass
            }, group);
          });
        });

        const firstCenter =
          panelX +
          data.geometry.barStart +
          data.geometry.barW * 0.5;
        const lastCenter =
          panelX +
          data.geometry.barStart +
          (run.frames.length - data.one) * data.geometry.barStep +
          data.geometry.barW * 0.5;

        label(
          "SFT-якорь",
          firstCenter,
          data.geometry.timeY,
          "time-label",
          "middle",
          data.offsets.below,
          group
        );

        label(
          "после PPO",
          lastCenter,
          data.geometry.timeY,
          "time-label",
          "middle",
          data.offsets.below,
          group
        );

        label(
          run.reward,
          panelX + data.geometry.panelW * 0.5,
          data.geometry.summaryFirstY,
          "summary",
          "middle",
          data.offsets.centered,
          group
        );

        label(
          run.kl,
          panelX + data.geometry.panelW * 0.5,
          data.geometry.summarySecondY,
          "summary",
          "middle",
          data.offsets.centered,
          group
        );
      });

      label(
        "действия:",
        data.geometry.legendTextX,
        data.geometry.legendY,
        "legend-note",
        "start",
        data.offsets.afterSwatch
      );

      data.actions.forEach((action, index) => {
        const legendX = data.geometry.legendXs.at(index);

        make("rect", {
          x: sx(legendX),
          y: sy(data.geometry.legendY - data.geometry.swatch),
          width: sx(legendX + data.geometry.swatch) - sx(legendX),
          height:
            sy(data.geometry.legendY) -
            sy(data.geometry.legendY - data.geometry.swatch),
          class: action.barClass
        });

        label(
          action.name,
          legendX + data.geometry.swatch,
          data.geometry.legendY - data.geometry.swatch * 0.5,
          "legend-note",
          "start",
          data.offsets.afterSwatch
        );
      });

      label(
        "все запуски начинают с одной SFT-политики",
        data.geometry.legendNoteX,
        data.geometry.legendY,
        "legend-note",
        "start",
        data.offsets.afterSwatch
      );
    } catch (error) {
      document.getElementById("scheme").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
