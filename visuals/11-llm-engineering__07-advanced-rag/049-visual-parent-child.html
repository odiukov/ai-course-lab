<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Parent-child chunking</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1c2230; --muted:#5c6880;
    --line:#3a4a68; --dash:#b1651f; --pbox:#e5ecfa; --cbox:#f2f4f8;
    --hit:#fff0dd; --stroke:#8896b0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161e; --fg:#e6ebf5; --muted:#98a4bc;
      --line:#96abd4; --dash:#f0a35a; --pbox:#1e2a44; --cbox:#1a1f2b;
      --hit:#3a2a15; --stroke:#4a5670;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .fail{font-size:13px;line-height:1.5;color:var(--muted);}
  text{fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Parent-child: искали по 128 токенам, в промпт ушли 512</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  var W=1000,H=470,FS=13,FSS=11.5,LW=1.8,PAD=7;

  // ---- данные схемы (единицы схемы) ----
  var DATA={
    parent:{x:34,y:26,w:44,h:9,tokens:512,
      title:"Родительский чанк P — 512 токенов",
      sub:"весь раздел про возвраты"},
    children:[
      {id:"C1",x:6, y:52,w:19,h:11,t:"C1 · 128 токенов",l1:"Standard plan:",l2:"30-day refund"},
      {id:"C2",x:29,y:52,w:19,h:11,t:"C2 · 128 токенов",l1:"Enterprise:",l2:"60-day pro-rated",hit:true},
      {id:"C3",x:52,y:52,w:19,h:11,t:"C3 · 128 токенов",l1:"Processing time:",l2:"5–7 days"},
      {id:"C4",x:75,y:52,w:19,h:11,t:"C4 · 128 токенов",l1:"How to submit",l2:"a request"}
    ],
    query:{x:2,y:26,w:24,h:9,t:"Запрос: «enterprise refund?»"},
    unit:{y:70}
  };
  var ORIGIN={x:16,y:14}, SCALE=9.6;
  function sx(x){return ORIGIN.x+x*SCALE;}
  function sy(y){return ORIGIN.y+y*SCALE;}

  function el(n,a){var e=document.createElementNS("http://www.w3.org/2000/svg",n);
    for(var k in a)e.setAttribute(k,a[k]);return e;}
  function box(g,b,fill){
    g.appendChild(el("rect",{x:sx(b.x),y:sy(b.y),width:sx(b.x+b.w)-sx(b.x),
      height:sy(b.y+b.h)-sy(b.y),rx:sx(1)-sx(0),fill:fill,
      stroke:b.hit?"var(--dash)":"var(--stroke)","stroke-width":b.hit?LW+0.6:LW}));
  }
  function txt(g,x,y,s,o){o=o||{};
    var t=el("text",{x:x,y:y,"text-anchor":o.a||"middle",
      "font-size":o.fs||FS,"font-weight":o.w||"400",fill:o.fill||"var(--fg)"});
    t.textContent=s;g.appendChild(t);return t;}

  try{
    var svg=el("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMid meet",
      role:"img","aria-label":"Родитель 512 токенов и четыре ребёнка по 128"});
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"}));
    var defs=el("defs");
    ["solid","dash"].forEach(function(k){
      var m=el("marker",{id:"ah-"+k,viewBox:"0 0 10 10",refX:"9",refY:"5",
        markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
      m.appendChild(el("path",{d:"M0,0.5 L10,5 L0,9.5 z",
        fill:k==="dash"?"var(--dash)":"var(--line)"}));
      defs.appendChild(m);});
    svg.appendChild(defs);
    var g=el("g");svg.appendChild(g);

    var P=DATA.parent, Q=DATA.query, CH=DATA.children;

    // родитель
    box(g,P,"var(--pbox)");
    txt(g,sx(P.x+P.w/2),sy(P.y)+PAD+FS*0.9,P.title,{w:"600"});
    txt(g,sx(P.x+P.w/2),sy(P.y+P.h)-PAD,P.sub,{fs:FSS,fill:"var(--muted)"});

    // сплошные стрелки вниз: разрезание
    CH.forEach(function(c){
      var x1=sx(P.x+P.w/2), y1=sy(P.y+P.h), x2=sx(c.x+c.w/2), y2=sy(c.y);
      var my=sy((P.y+P.h+c.y)/2);
      g.appendChild(el("path",{d:"M"+x1+","+y1+" L"+x1+","+my+" L"+x2+","+my+" L"+x2+","+y2,
        fill:"none",stroke:"var(--line)","stroke-width":LW,"marker-end":"url(#ah-solid)"}));
    });
    txt(g,sx(P.x+P.w+1),sy((P.y+P.h+CH[0].y)/2)-PAD,"сплошные вниз: разрезание, 512 → 4×128",
      {a:"start",fs:FSS,fill:"var(--line)"});

    // дети
    CH.forEach(function(c){
      box(g,c,c.hit?"var(--hit)":"var(--cbox)");
      txt(g,sx(c.x+c.w/2),sy(c.y)+PAD+FSS,c.t,{fs:FSS,w:"600"});
      txt(g,sx(c.x+c.w/2),sy(c.y+c.h/2)+FS*0.55,c.l1,{fs:FSS,fill:"var(--muted)"});
      txt(g,sx(c.x+c.w/2),sy(c.y+c.h)-PAD,c.l2,{fs:FSS,fill:"var(--muted)"});
    });

    // запрос
    box(g,Q,"var(--cbox)");
    txt(g,sx(Q.x+Q.w/2),sy(Q.y+Q.h/2)+FS*0.4,Q.t,{fs:FSS,w:"600"});

    // пунктир 1: запрос -> C2 (по низу запроса вниз, вбок к C2)
    var c2=CH[1];
    var qx=sx(Q.x+Q.w/2), qy=sy(Q.y+Q.h);
    var tx=sx(c2.x), ty=sy(c2.y+c2.h/2);
    g.appendChild(el("path",{d:"M"+qx+","+qy+" L"+qx+","+ty+" L"+tx+","+ty,
      fill:"none",stroke:"var(--dash)","stroke-width":LW,"stroke-dasharray":"7 5",
      "marker-end":"url(#ah-dash)"}));
    txt(g,sx(Q.x+Q.w/2)+PAD,sy((Q.y+Q.h+c2.y)/2),"① поиск идёт по 128",
      {a:"start",fs:FSS,fill:"var(--dash)"});

    // пунктир 2: C2 -> P (справа от C2 наверх к правому краю P)
    var ux=sx(c2.x+c2.w), uy=sy(c2.y+c2.h/2);
    var ridge=sx(P.x+P.w-3), py=sy(P.y+P.h);
    g.appendChild(el("path",{d:"M"+ux+","+uy+" L"+ridge+","+uy+" L"+ridge+","+py,
      fill:"none",stroke:"var(--dash)","stroke-width":LW,"stroke-dasharray":"7 5",
      "marker-end":"url(#ah-dash)"}));
    txt(g,sx(c2.x+c2.w)+PAD,sy(c2.y+c2.h/2)-PAD,"② в промпт уходят 512",
      {a:"start",fs:FSS,fill:"var(--dash)"});

    // легенда
    var ly=sy(DATA.unit.y);
    g.appendChild(el("line",{x1:sx(6),y1:ly,x2:sx(11),y2:ly,
      stroke:"var(--line)","stroke-width":LW,"marker-end":"url(#ah-solid)"}));
    txt(g,sx(12),ly+FSS*0.36,"стрелка вниз — для индекса",{a:"start",fs:FSS,fill:"var(--muted)"});
    g.appendChild(el("line",{x1:sx(46),y1:ly,x2:sx(51),y2:ly,
      stroke:"var(--dash)","stroke-width":LW,"stroke-dasharray":"7 5","marker-end":"url(#ah-dash)"}));
    txt(g,sx(52),ly+FSS*0.36,"пунктир вверх — для LLM: C2 показывает на P",
      {a:"start",fs:FSS,fill:"var(--muted)"});

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема не построилась. Что она показывала: '+
      'родительский чанк P — 512 токенов, весь раздел про возвраты. Под ним четыре '+
      'дочерних по 128: C1 «Standard plan: 30-day refund», C2 «Enterprise: 60-day '+
      'pro-rated», C3 «Processing time: 5–7 days», C4 «How to submit a request». '+
      'Сплошные стрелки вниз — разрезание раздела на четыре кусочка. Запрос '+
      '«enterprise refund?» пунктиром попадает только в C2 (там 128 токенов, мало шума). '+
      'Вторая пунктирная стрелка ведёт от C2 обратно к P: в промпт уезжают все 512 токенов.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
