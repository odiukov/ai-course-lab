<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Два способа прийти к оптимальной политике</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --panel-alt: #f1f5ff;
    --ink: #172033;
    --muted: #526079;
    --line: #60708d;
    --left: #3767c7;
    --left-soft: #e8efff;
    --right: #a24c80;
    --right-soft: #f8e8f2;
    --goal: #177b62;
    --goal-soft: #e1f5ee;
    --shadow: #dbe1ec;
  }

  html,
  body {
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .panel {
    fill: var(--panel);
    stroke: var(--shadow);
    stroke-width: 2px;
  }

  .left-node {
    fill: var(--left-soft);
    stroke: var(--left);
    stroke-width: 2px;
  }

  .right-node {
    fill: var(--right-soft);
    stroke: var(--right);
    stroke-width: 2px;
  }

  .goal-node {
    fill: var(--goal-soft);
    stroke: var(--goal);
    stroke-width: 3px;
  }

  .left-flow,
  .right-flow,
  .goal-flow {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 3px;
  }

  .left-flow {
    stroke: var(--left);
  }

  .right-flow {
    stroke: var(--right);
  }

  .goal-flow {
    stroke: var(--goal);
  }

  .left-head {
    fill: var(--left);
  }

  .right-head {
    fill: var(--right);
  }

  .goal-head {
    fill: var(--goal);
  }

  text {
    fill: var(--ink);
  }

  .main-title {
    font-size: 28px;
    font-weight: bold;
  }

  .panel-title {
    font-size: 22px;
    font-weight: bold;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 16px;
  }

  .node-title {
    font-size: 17px;
    font-weight: bold;
  }

  .formula {
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    font-size: 18px;
  }

  .node-note {
    fill: var(--muted);
    font-size: 15px;
  }

  .decision {
    font-size: 17px;
    font-weight: bold;
  }

  .branch {
    fill: var(--muted);
    font-size: 15px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--bg);
    stroke-width: 4px;
  }

  .goal-title {
    fill: var(--goal);
    font-size: 18px;
    font-weight: bold;
  }

  .fallback {
    fill: var(--ink);
    font-size: 18px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --panel: #192231;
      --panel-alt: #1d2940;
      --ink: #edf2ff;
      --muted: #aebbd1;
      --line: #91a0ba;
      --left: #86aaff;
      --left-soft: #20345b;
      --right: #e49ac6;
      --right-soft: #4a2940;
      --goal: #69d6b7;
      --goal-soft: #173e36;
      --shadow: #354156;
    }
  }
</style>
</head>
<body>
<svg id="diagram" width="1200" height="500" viewBox="0 0 1200 500"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="chart-title chart-desc">
  <title id="chart-desc">Сравнение циклов итерации по политике и итерации по ценности</title>
  <text id="chart-title" class="main-title">Два способа прийти к оптимальной политике</text>
  <g id="scene"></g>
</svg>

<script>
const diagramData = [{
  origin: {x: 0, y: 0},
  scale: {x: 1, y: 1},
  zero: 0,
  namespace: "http://www.w3.org/2000/svg",
  title: {x: 600, y: 37, anchor: "middle"},
  panels: [
    {x: 30, y: 62, w: 540, h: 356, r: 18, className: "panel"},
    {x: 630, y: 62, w: 540, h: 356, r: 18, className: "panel"}
  ],
  nodes: [
    {shape: "rect", x: 95, y: 130, w: 420, h: 74, r: 14, className: "left-node"},
    {shape: "rect", x: 120, y: 236, w: 370, h: 58, r: 14, className: "left-node"},
    {shape: "polygon", points: [
      {x: 305, y: 305}, {x: 425, y: 345},
      {x: 305, y: 385}, {x: 185, y: 345}
    ], className: "left-node"},
    {shape: "rect", x: 685, y: 130, w: 420, h: 74, r: 14, className: "right-node"},
    {shape: "polygon", points: [
      {x: 895, y: 220}, {x: 1030, y: 260},
      {x: 895, y: 300}, {x: 760, y: 260}
    ], className: "right-node"},
    {shape: "rect", x: 730, y: 332, w: 330, h: 58, r: 14, className: "right-node"},
    {shape: "rect", x: 350, y: 444, w: 500, h: 42, r: 15, className: "goal-node"}
  ],
  flows: [
    {className: "left-flow", points: [
      {x: 305, y: 204}, {x: 305, y: 236}
    ], headClass: "left-head", head: [
      {x: 305, y: 236}, {x: 296, y: 224}, {x: 314, y: 224}
    ]},
    {className: "left-flow", points: [
      {x: 305, y: 294}, {x: 305, y: 305}
    ], headClass: "left-head", head: [
      {x: 305, y: 305}, {x: 296, y: 293}, {x: 314, y: 293}
    ]},
    {className: "left-flow", points: [
      {x: 185, y: 345}, {x: 68, y: 345},
      {x: 68, y: 167}, {x: 95, y: 167}
    ], headClass: "left-head", head: [
      {x: 95, y: 167}, {x: 83, y: 158}, {x: 83, y: 176}
    ]},
    {className: "goal-flow", points: [
      {x: 305, y: 385}, {x: 305, y: 430},
      {x: 470, y: 430}, {x: 470, y: 444}
    ], headClass: "goal-head", head: [
      {x: 470, y: 444}, {x: 461, y: 432}, {x: 479, y: 432}
    ]},
    {className: "right-flow", points: [
      {x: 895, y: 204}, {x: 895, y: 220}
    ], headClass: "right-head", head: [
      {x: 895, y: 220}, {x: 886, y: 208}, {x: 904, y: 208}
    ]},
    {className: "right-flow", points: [
      {x: 1030, y: 260}, {x: 1135, y: 260},
      {x: 1135, y: 167}, {x: 1105, y: 167}
    ], headClass: "right-head", head: [
      {x: 1105, y: 167}, {x: 1117, y: 158}, {x: 1117, y: 176}
    ]},
    {className: "right-flow", points: [
      {x: 895, y: 300}, {x: 895, y: 332}
    ], headClass: "right-head", head: [
      {x: 895, y: 332}, {x: 886, y: 320}, {x: 904, y: 320}
    ]},
    {className: "goal-flow", points: [
      {x: 895, y: 390}, {x: 895, y: 430},
      {x: 730, y: 430}, {x: 730, y: 444}
    ], headClass: "goal-head", head: [
      {x: 730, y: 444}, {x: 721, y: 432}, {x: 739, y: 432}
    ]}
  ],
  labels: [
    {x: 305, y: 91, text: "Итерация по политике", className: "panel-title", anchor: "middle"},
    {x: 305, y: 113, text: "оценка отделена от улучшения", className: "subtitle", anchor: "middle"},
    {x: 305, y: 153, text: "ОЦЕНКА V^π ДО СХОДИМОСТИ", className: "node-title", anchor: "middle"},
    {x: 305, y: 179, text: "V^π ← T^πV", className: "formula", anchor: "middle"},
    {x: 305, y: 195, text: "повторять до устойчивого результата", className: "node-note", anchor: "middle"},
    {x: 305, y: 260, text: "ЖАДНОЕ УЛУЧШЕНИЕ π", className: "node-title", anchor: "middle"},
    {x: 305, y: 283, text: "π ← greedy(V^π)", className: "formula", anchor: "middle"},
    {x: 305, y: 340, text: "Политика", className: "decision", anchor: "middle"},
    {x: 305, y: 361, text: "стабильна?", className: "decision", anchor: "middle"},
    {x: 82, y: 250, text: "нет", className: "branch", anchor: "start"},
    {x: 82, y: 269, text: "снова оценить", className: "branch", anchor: "start"},
    {x: 326, y: 408, text: "да", className: "branch", anchor: "start"},

    {x: 895, y: 91, text: "Итерация по ценности", className: "panel-title", anchor: "middle"},
    {x: 895, y: 113, text: "улучшение спрятано внутри max", className: "subtitle", anchor: "middle"},
    {x: 895, y: 153, text: "ОДИН MAX-БЭКАП V ЗА ПРОХОД", className: "node-title", anchor: "middle"},
    {x: 895, y: 181, text: "V ← maxₐ Σ P [r + γV]", className: "formula", anchor: "middle"},
    {x: 895, y: 253, text: "‖Vнов − V‖∞", className: "decision", anchor: "middle"},
    {x: 895, y: 275, text: "< 1e-6 ?", className: "formula", anchor: "middle"},
    {x: 1118, y: 306, text: "нет", className: "branch", anchor: "end"},
    {x: 1118, y: 325, text: "следующий проход", className: "branch", anchor: "end"},
    {x: 915, y: 318, text: "да", className: "branch", anchor: "start"},
    {x: 895, y: 354, text: "ИЗВЛЕЧЬ ПОЛИТИКУ", className: "node-title", anchor: "middle"},
    {x: 895, y: 379, text: "π ← greedy(V)", className: "formula", anchor: "middle"},

    {x: 600, y: 471, text: "Одна и та же цель: оптимальная политика π*", className: "goal-title", anchor: "middle"}
  ],
  fallback: [
    {x: 600, y: 220, text: "Слева: оценка V^π до сходимости → жадное улучшение → проверка стабильности."},
    {x: 600, y: 255, text: "Справа: один max-бэкап за проход → порог sup-нормы 1e-6 → извлечение политики."},
    {x: 600, y: 290, text: "Оба цикла ведут к одной оптимальной политике π*."}
  ]
}];

const [data] = diagramData;
const origin = Object.freeze(data.origin);
const scale = Object.freeze(data.scale);

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

const svg = document.getElementById("diagram");
const scene = document.getElementById("scene");
const title = document.getElementById("chart-title");

try {
  title.setAttribute("x", sx(data.title.x));
  title.setAttribute("y", sy(data.title.y));
  title.setAttribute("text-anchor", data.title.anchor);

  for (const panel of data.panels) {
    const rect = document.createElementNS(data.namespace, "rect");
    rect.setAttribute("x", sx(panel.x));
    rect.setAttribute("y", sy(panel.y));
    rect.setAttribute("width", sx(panel.x + panel.w) - sx(panel.x));
    rect.setAttribute("height", sy(panel.y + panel.h) - sy(panel.y));
    rect.setAttribute("rx", sx(panel.r) - sx(data.zero));
    rect.setAttribute("ry", sy(panel.r) - sy(data.zero));
    rect.setAttribute("class", panel.className);
    scene.appendChild(rect);
  }

  for (const flow of data.flows) {
    const line = document.createElementNS(data.namespace, "polyline");
    line.setAttribute("points", flow.points.map(point =>
      sx(point.x) + "," + sy(point.y)
    ).join(" "));
    line.setAttribute("class", flow.className);
    scene.appendChild(line);

    const head = document.createElementNS(data.namespace, "polygon");
    head.setAttribute("points", flow.head.map(point =>
      sx(point.x) + "," + sy(point.y)
    ).join(" "));
    head.setAttribute("class", flow.headClass);
    scene.appendChild(head);
  }

  for (const node of data.nodes) {
    const element = document.createElementNS(data.namespace, node.shape);
    if (node.shape === "rect") {
      element.setAttribute("x", sx(node.x));
      element.setAttribute("y", sy(node.y));
      element.setAttribute("width", sx(node.x + node.w) - sx(node.x));
      element.setAttribute("height", sy(node.y + node.h) - sy(node.y));
      element.setAttribute("rx", sx(node.r) - sx(data.zero));
      element.setAttribute("ry", sy(node.r) - sy(data.zero));
    } else {
      element.setAttribute("points", node.points.map(point =>
        sx(point.x) + "," + sy(point.y)
      ).join(" "));
    }
    element.setAttribute("class", node.className);
    scene.appendChild(element);
  }

  for (const label of data.labels) {
    const text = document.createElementNS(data.namespace, "text");
    text.setAttribute("x", sx(label.x));
    text.setAttribute("y", sy(label.y));
    text.setAttribute("text-anchor", label.anchor);
    text.setAttribute("class", label.className);
    text.textContent = label.text;
    scene.appendChild(text);
  }
} catch (error) {
  scene.replaceChildren();
  title.setAttribute("x", sx(data.title.x));
  title.setAttribute("y", sy(data.title.y));
  title.setAttribute("text-anchor", data.title.anchor);

  for (const item of data.fallback) {
    const text = document.createElementNS(data.namespace, "text");
    text.setAttribute("x", sx(item.x));
    text.setAttribute("y", sy(item.y));
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("class", "fallback");
    text.textContent = item.text;
    scene.appendChild(text);
  }

  svg.setAttribute("aria-label",
    "Схема двух способов прийти к оптимальной политике не построилась; показано её текстовое описание.");
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
