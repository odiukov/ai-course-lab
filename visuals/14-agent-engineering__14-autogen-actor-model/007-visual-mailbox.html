<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Два актора и их ящики</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --actor: #f8fafc;
      --runtime: #eef2ff;
      --queue: #ffffff;
      --mailbox: #fff7d6;
      --handler: #e8f7ef;
      --state: #eaf3ff;
      --ink: #172033;
      --muted: #5e687b;
      --line: #64748b;
      --border: #a9b4c5;
      --accent: #6d4aff;
      --accent-soft: #ddd7ff;
      --mail-accent: #d97706;
      --success: #16845b;
      --shadow: rgba(28, 39, 60, 0.09);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #17202d;
        --panel-soft: #1d2837;
        --actor: #182332;
        --runtime: #202443;
        --queue: #171c31;
        --mailbox: #392f18;
        --handler: #173329;
        --state: #172d45;
        --ink: #edf2f8;
        --muted: #aeb9c9;
        --line: #9ba8ba;
        --border: #4c5a6d;
        --accent: #a897ff;
        --accent-soft: #413a72;
        --mail-accent: #f6b84a;
        --success: #62d5a6;
        --shadow: rgba(0, 0, 0, 0.24);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      background: var(--panel);
      overflow: hidden;
      box-shadow: 0 8px 28px var(--shadow);
    }

    h1 {
      margin: 0;
      padding: 16px 24px 13px;
      border-bottom: 1px solid var(--border);
      font-size: 20px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .actor-boundary {
      fill: var(--actor);
      stroke: var(--border);
      stroke-width: 2;
    }

    .runtime-boundary {
      fill: var(--runtime);
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 9 7;
    }

    .state-box {
      fill: var(--state);
      stroke: var(--border);
      stroke-width: 1.5;
    }

    .handler-box {
      fill: var(--handler);
      stroke: var(--success);
      stroke-width: 1.5;
    }

    .mailbox-box {
      fill: var(--mailbox);
      stroke: var(--mail-accent);
      stroke-width: 2;
    }

    .queue-box {
      fill: var(--queue);
      stroke: var(--accent);
      stroke-width: 1.5;
    }

    .queue-slot {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1.5;
    }

    .message-card {
      fill: var(--mailbox);
      stroke: var(--mail-accent);
      stroke-width: 1.5;
    }

    .flow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .separation {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.5;
      stroke-dasharray: 5 6;
    }

    .arrow-head {
      fill: var(--accent);
    }

    .mail-line {
      fill: none;
      stroke: var(--mail-accent);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: 750;
    }

    .runtime-title {
      fill: var(--accent);
      font-size: 17px;
      font-weight: 750;
    }

    .box-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .small {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }

    .flow-label {
      fill: var(--accent);
      font-size: 14px;
      font-weight: 720;
    }

    .endpoint-label {
      fill: var(--mail-accent);
      font-size: 13px;
      font-weight: 720;
    }

    .note {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 650;
    }

    .note-muted {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 520;
    }

    .fallback {
      display: none;
      padding: 22px 24px 26px;
      background: var(--panel);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }

    noscript {
      display: block;
      padding: 22px 24px 26px;
      background: var(--panel);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="diagram">
    <h1>Схема: два актора и их ящики</h1>
    <svg
      id="actor-diagram"
      viewBox="0 0 1120 640"
      role="img"
      aria-labelledby="svg-title svg-description"
      preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">ReviewerAgent отправляет сообщение в ящик ChecklistAgent</title>
      <desc id="svg-description">
        Два изолированных актора имеют собственные состояние, обработчик и ящик.
        Сообщение проходит через общую очередь рантайма и заканчивает путь в ящике
        ChecklistAgent, не вызывая его обработчик напрямую.
      </desc>
    </svg>
    <div id="fallback" class="fallback" role="status">
      Схема должна была показать два изолированных актора — ReviewerAgent и
      ChecklistAgent. У каждого свой ящик, состояние и обработчик. Между акторами
      находится рантайм с общей очередью, а стрелка сообщения заканчивается в
      ящике ChecklistAgent, не у его обработчика.
    </div>
    <noscript>
      Схема показывает ReviewerAgent и ChecklistAgent с отдельными ящиками,
      состояниями и обработчиками. Между ними расположен рантайм с общей очередью:
      сообщение приходит в ящик ChecklistAgent, а обработчик забирает его позже.
    </noscript>
  </main>

  <script>
    const data = Object.freeze({
      canvas: { x: 0, y: 0, w: 1120, h: 640, scaleX: 1, scaleY: 1 },
      radius: 16,
      actors: [
        {
          x: 35, y: 76, w: 300, h: 438,
          name: "ReviewerAgent",
          subtitle: "актор A · готовит черновик",
          state: { x: 68, y: 171, w: 234, h: 70 },
          handler: { x: 68, y: 286, w: 234, h: 80 },
          mailbox: { x: 157, y: 412, w: 145, h: 70 },
          stateTitle: "приватное состояние",
          stateText: "черновик и контекст",
          handlerTitle: "обработчик",
          handlerText: "receive(message)",
          mailboxTitle: "свой ящик",
          mailboxText: "входящие для A"
        },
        {
          x: 785, y: 76, w: 300, h: 438,
          name: "ChecklistAgent",
          subtitle: "актор B · проверяет позже",
          state: { x: 818, y: 171, w: 234, h: 70 },
          handler: { x: 818, y: 286, w: 234, h: 80 },
          mailbox: { x: 818, y: 412, w: 145, h: 70 },
          stateTitle: "приватное состояние",
          stateText: "чек-лист и результат",
          handlerTitle: "обработчик",
          handlerText: "receive(message)",
          mailboxTitle: "свой ящик",
          mailboxText: "сообщение ждёт"
        }
      ],
      runtime: { x: 360, y: 115, w: 400, h: 367 },
      queue: { x: 402, y: 220, w: 316, h: 146 },
      slots: [
        { x: 429, y: 276, w: 68, h: 48 },
        { x: 526, y: 276, w: 68, h: 48 },
        { x: 623, y: 276, w: 68, h: 48 }
      ],
      message: { x: 535, y: 283, w: 50, h: 34 },
      flow: [
        { x: 302, y: 326 },
        { x: 383, y: 326 },
        { x: 383, y: 300 },
        { x: 718, y: 300 },
        { x: 744, y: 300 },
        { x: 744, y: 447 },
        { x: 818, y: 447 }
      ],
      arrow: [
        { x: 818, y: 447 },
        { x: 797, y: 434 },
        { x: 797, y: 460 }
      ],
      gaps: [
        { x1: 229, y1: 366, x2: 229, y2: 412 },
        { x1: 890, y1: 366, x2: 890, y2: 412 }
      ],
      notes: {
        send: {
          x: 315, y: 326, dx: 10, dy: -12,
          text: "отправить черновик"
        },
        runtime: {
          x: 560, y: 151, dx: 0, dy: 0,
          text: "рантайм"
        },
        runtimeSub: {
          x: 560, y: 179, dx: 0, dy: 0,
          text: "доставляет сообщения независимо от обработки"
        },
        queue: {
          x: 560, y: 249, dx: 0, dy: 0,
          text: "общая очередь сообщений"
        },
        endpoint: {
          x: 808, y: 447, dx: -10, dy: -14,
          text: "доставка завершена здесь"
        },
        gapLeft: {
          x: 229, y: 389, dx: -12, dy: 4,
          text: "не вызов"
        },
        gapRight: {
          x: 890, y: 389, dx: 12, dy: 4,
          text: "заберёт позже"
        }
      },
      footer: { x: 35, y: 545, w: 1050, h: 66 },
      footerTitle: {
        x: 560, y: 571, dx: 0, dy: 0,
        text: "Сообщение пересекает границы. Состояние и обработчики — нет."
      },
      footerText: {
        x: 560, y: 594, dx: 0, dy: 0,
        text: "A продолжает работу, пока B занят, остановлен или ещё не начал проверку."
      },
      labels: {
        actorNameY: 111,
        actorSubtitleY: 139,
        stateTitleOffset: 28,
        stateTextOffset: 51,
        handlerTitleOffset: 31,
        handlerTextOffset: 57,
        mailboxTitleOffset: 29,
        mailboxTextOffset: 53
      },
      envelope: {
        insetX: 7,
        insetY: 7,
        foldY: 18
      }
    });

    const origin = Object.freeze({
      x: data.canvas.x,
      y: data.canvas.y
    });

    const scale = Object.freeze({
      x: data.canvas.scaleX,
      y: data.canvas.scaleY
    });

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const svg = document.getElementById("actor-diagram");
      const ns = "http://www.w3.org/2000/svg";

      function node(name, attributes, parent = svg) {
        const element = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        parent.appendChild(element);
        return element;
      }

      function box(parent, item, className) {
        return node("rect", {
          x: sx(item.x),
          y: sy(item.y),
          width: sx(item.x + item.w) - sx(item.x),
          height: sy(item.y + item.h) - sy(item.y),
          rx: sx(data.radius) - sx(0),
          ry: sy(data.radius) - sy(0),
          class: className
        }, parent);
      }

      function label(parent, item, className, anchor) {
        const text = node("text", {
          x: sx(item.x),
          y: sy(item.y),
          dx: item.dx,
          dy: item.dy,
          class: className,
          "text-anchor": anchor
        }, parent);
        text.textContent = item.text;
        return text;
      }

      function centeredText(parent, x, y, value, className) {
        const text = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": "middle"
        }, parent);
        text.textContent = value;
        return text;
      }

      function drawEnvelope(parent, item) {
        const left = item.x + data.envelope.insetX;
        const right = item.x + item.w - data.envelope.insetX;
        const top = item.y + data.envelope.insetY;
        const bottom = item.y + item.h - data.envelope.insetY;
        const middle = item.x + item.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX);
        const fold = item.y + data.envelope.foldY;

        node("path", {
          d: [
            "M", sx(left), sy(top),
            "L", sx(middle), sy(fold),
            "L", sx(right), sy(top),
            "L", sx(right), sy(bottom),
            "L", sx(left), sy(bottom),
            "Z"
          ].join(" "),
          class: "mail-line"
        }, parent);

        node("path", {
          d: [
            "M", sx(left), sy(bottom),
            "L", sx(middle), sy(fold),
            "L", sx(right), sy(bottom)
          ].join(" "),
          class: "mail-line"
        }, parent);
      }

      const runtimeGroup = node("g", { "aria-label": "Общий рантайм" });
      box(runtimeGroup, data.runtime, "runtime-boundary");
      label(runtimeGroup, data.notes.runtime, "runtime-title", "middle");
      label(runtimeGroup, data.notes.runtimeSub, "small", "middle");
      box(runtimeGroup, data.queue, "queue-box");
      label(runtimeGroup, data.notes.queue, "box-title", "middle");

      data.slots.forEach((slot) => {
        box(runtimeGroup, slot, "queue-slot");
      });

      box(runtimeGroup, data.message, "message-card");
      drawEnvelope(runtimeGroup, data.message);

      const actorGroup = node("g", { "aria-label": "Два изолированных актора" });

      data.actors.forEach((actor) => {
        const group = node("g", { "aria-label": actor.name }, actorGroup);
        box(group, actor, "actor-boundary");

        centeredText(
          group,
          actor.x + actor.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          data.labels.actorNameY,
          actor.name,
          "title"
        );

        centeredText(
          group,
          actor.x + actor.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          data.labels.actorSubtitleY,
          actor.subtitle,
          "small"
        );

        box(group, actor.state, "state-box");
        centeredText(
          group,
          actor.state.x + actor.state.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          actor.state.y + data.labels.stateTitleOffset,
          actor.stateTitle,
          "box-title"
        );
        centeredText(
          group,
          actor.state.x + actor.state.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          actor.state.y + data.labels.stateTextOffset,
          actor.stateText,
          "small"
        );

        box(group, actor.handler, "handler-box");
        centeredText(
          group,
          actor.handler.x + actor.handler.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          actor.handler.y + data.labels.handlerTitleOffset,
          actor.handlerTitle,
          "box-title"
        );
        centeredText(
          group,
          actor.handler.x + actor.handler.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          actor.handler.y + data.labels.handlerTextOffset,
          actor.handlerText,
          "small"
        );

        box(group, actor.mailbox, "mailbox-box");
        centeredText(
          group,
          actor.mailbox.x + actor.mailbox.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          actor.mailbox.y + data.labels.mailboxTitleOffset,
          actor.mailboxTitle,
          "box-title"
        );
        centeredText(
          group,
          actor.mailbox.x + actor.mailbox.w / data.canvas.scaleX / (data.canvas.scaleX + data.canvas.scaleX),
          actor.mailbox.y + data.labels.mailboxTextOffset,
          actor.mailboxText,
          "small"
        );
      });

      const separationGroup = node("g", {
        "aria-label": "Ящики отделены от обработчиков"
      });

      data.gaps.forEach((gap) => {
        node("line", {
          x1: sx(gap.x1),
          y1: sy(gap.y1),
          x2: sx(gap.x2),
          y2: sy(gap.y2),
          class: "separation"
        }, separationGroup);
      });

      label(separationGroup, data.notes.gapLeft, "small", "end");
      label(separationGroup, data.notes.gapRight, "small", "start");

      const flowGroup = node("g", {
        "aria-label": "Сообщение приходит в ящик ChecklistAgent"
      });

      node("polyline", {
        points: data.flow.map((point) => (
          sx(point.x) + "," + sy(point.y)
        )).join(" "),
        class: "flow"
      }, flowGroup);

      node("polygon", {
        points: data.arrow.map((point) => (
          sx(point.x) + "," + sy(point.y)
        )).join(" "),
        class: "arrow-head"
      }, flowGroup);

      label(flowGroup, data.notes.send, "flow-label", "start");
      label(flowGroup, data.notes.endpoint, "endpoint-label", "end");

      const footerGroup = node("g", { "aria-label": "Главный вывод" });
      box(footerGroup, data.footer, "queue-box");
      label(footerGroup, data.footerTitle, "note", "middle");
      label(footerGroup, data.footerText, "note-muted", "middle");
    } catch (error) {
      const svg = document.getElementById("actor-diagram");
      const fallback = document.getElementById("fallback");
      if (svg) svg.style.display = "none";
      if (fallback) fallback.style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
