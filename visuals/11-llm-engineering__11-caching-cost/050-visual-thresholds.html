<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Пробки в щитке бюджета</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1c2330; --dim:#5b6676; --rule:#98a2b3;
    --z1:#2f9e5e; --z2:#d19b18; --z3:#e2701d; --z4:#cf3030;
    --now:#1c2330; --spent:#1c2330;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d; --ink:#e8edf4; --dim:#9aa6b6; --rule:#5a6575;
      --z1:#4fc281; --z2:#e8bb45; --z3:#f28c4a; --z4:#f2605c;
      --now:#e8edf4; --spent:#e8edf4;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{background:var(--bg);padding:10px 12px 12px;box-sizing:border-box;}
  .ttl{margin:0 0 6px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .fail{color:var(--dim);font-size:13px;white-space:pre-line;}
  .bar{stroke:var(--rule);stroke-width:1;}
  .z1{fill:var(--z1);} .z2{fill:var(--z2);} .z3{fill:var(--z3);} .z4{fill:var(--z4);}
  .zone{opacity:.30;stroke:none;}
  .sw{opacity:.85;stroke:none;}
  .spent{fill:var(--spent);opacity:.22;stroke:none;}
  .frame{fill:none;stroke:var(--rule);stroke-width:1.5;}
  .mark{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:5 3;}
  .now{stroke:var(--now);stroke-width:2.5;}
  .axis{stroke:var(--rule);stroke-width:1.5;}
  .lead{stroke:var(--dim);stroke-width:1;stroke-dasharray:3 3;}
  .arw{stroke:var(--dim);stroke-width:1.5;}
  .head{fill:var(--dim);stroke:none;}
  .tip{fill:var(--now);stroke:none;}
  text{font-family:inherit;fill:var(--ink);}
  .tmark{font-size:13px;font-weight:600;}
  .tax{font-size:12px;fill:var(--dim);}
  .tnow{font-size:13px;font-weight:600;}
  .tgap{font-size:12px;fill:var(--dim);}
  .tres{font-size:12px;font-weight:600;fill:var(--z4);}
  .tleg{font-size:12.5px;}
  .tnum{font-size:11px;font-weight:700;fill:var(--bg);}
  .tzone{font-size:12px;font-weight:700;fill:var(--ink);opacity:.75;}
</style>
<div class="wrap">
  <div class="ttl">Пробки в щитке: шкала бюджета $1000 с тремя засечками</div>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var D={
      budget:1000, spent:712, gap:138,
      marks:[{v:700,l:'$700'},{v:850,l:'$850'},{v:950,l:'$950'}],
      zones:[
        {a:0,b:700,n:'1',c:'z1'},
        {a:700,b:850,n:'2',c:'z2'},
        {a:850,b:950,n:'3',c:'z3'},
        {a:950,b:1000,n:'4',c:'z4'}
      ],
      legend:[
        {n:'1',c:'z1',t:'$0–$700 — норма: доступны все модели'},
        {n:'2',c:'z2',t:'$700 = 70% warning — алерт команде'},
        {n:'3',c:'z3',t:'$850 = 85% throttle — только дешёвые модели'},
        {n:'4',c:'z4',t:'$950 = 95% stop — отказ новым запросам, отдаём кэш'}
      ]
    };
    /* ---- вертикальная разметка в тех же единицах, что и доллары ---- */
    var Y={barTop:70,barBot:0,zoneNum:26,tickTop:88,tickBot:-10,markLab:104,
           resLab:140,leadTop:132,leadBot:74,leadX:985,
           axis:-22,capUp:-16,capDn:-28,axLab:-40,triBase:-14,
           gapLine:-58,gapLab:-74,leg0:-100,legStep:-22};

    /* ---- ОДИН origin, ОДИН scale, ОДНА пара переводов ---- */
    var originX=90, originY=123, scale=0.72;
    function sx(x){return originX + x*scale;}
    function sy(y){return originY - y*scale;}

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 900 258');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Шкала бюджета 1000 долларов с засечками 700, 850, 950 и запасом 50');

    function el(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function line(x1,y1,x2,y2,c){return el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),'class':c});}
    function box(a,b,yT,yB,c){return el('rect',{x:sx(a),y:sy(yT),width:sx(b)-sx(a),height:sy(yB)-sy(yT),'class':c});}
    function txt(x,y,s,an,c){var t=el('text',{x:sx(x),y:sy(y),'text-anchor':an,'class':c});t.textContent=s;return t;}
    function poly(pts,c){return el('polygon',{points:pts.map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' '),'class':c});}

    /* фон холста */
    el('rect',{x:0,y:0,width:900,height:258,fill:'var(--bg)'});

    /* зоны и потраченное */
    D.zones.forEach(function(z){
      box(z.a,z.b,Y.barTop,Y.barBot,'zone '+z.c);
      txt((z.a+z.b)/2,Y.zoneNum,z.n,'middle','tzone');
    });
    box(0,D.spent,Y.barTop,Y.barBot,'spent');
    box(0,D.budget,Y.barTop,Y.barBot,'frame');

    /* засечки: линия сквозь полосу, подпись СВЕРХУ */
    D.marks.forEach(function(m){
      line(m.v,Y.tickBot,m.v,Y.tickTop,'mark');
      txt(m.v,Y.markLab,m.l,'middle','tmark');
    });

    /* запас $50: выноска вторым рядом сверху, якорь end у правого края */
    line(Y.leadX,Y.leadBot,Y.leadX,Y.leadTop,'lead');
    txt(D.budget,Y.resLab,'запас $50 — на уже улетевшие запросы','end','tres');

    /* ось бюджета под полосой */
    line(0,Y.axis,D.budget,Y.axis,'axis');
    line(0,Y.capDn,0,Y.capUp,'axis');
    line(D.budget,Y.capDn,D.budget,Y.capUp,'axis');
    txt(0,Y.axLab,'$0','start','tax');
    txt(D.budget,Y.axLab,'$1000 — весь бюджет','end','tax');

    /* текущая трата: линия в полосе + указатель снизу, подпись СНИЗУ */
    line(D.spent,Y.barBot,D.spent,Y.barTop,'now');
    poly([[D.spent,Y.barBot],[D.spent-8,Y.triBase],[D.spent+8,Y.triBase]],'tip');
    txt(D.spent+10,Y.axLab,'$712 — сейчас','start','tnow');

    /* зазор до второй засечки */
    line(D.spent,Y.gapLine,D.spent+D.gap,Y.gapLine,'arw');
    poly([[D.spent,Y.gapLine],[D.spent+13,Y.gapLine+6],[D.spent+13,Y.gapLine-6]],'head');
    poly([[D.spent+D.gap,Y.gapLine],[D.spent+D.gap-13,Y.gapLine+6],[D.spent+D.gap-13,Y.gapLine-6]],'head');
    txt(D.spent+D.gap/2,Y.gapLab,'$138 — время на реакцию','middle','tgap');

    /* легенда отдельной строкой под схемой */
    D.legend.forEach(function(g,i){
      var b=Y.leg0+i*Y.legStep;
      box(0,22,b+12,b-4,'sw '+g.c);
      txt(11,b,g.n,'middle','tnum');
      txt(32,b,g.t,'start','tleg');
    });

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<div class="fail">Схема не построилась. Она должна показывать: '+
      'полосу бюджета от $0 до $1000; три засечки — $700 (70%, warning), $850 (85%, throttle), '+
      '$950 (95%, stop); текущую трату $712 внутри первой зоны; зазор $138 от $712 до второй '+
      'засечки; и последний отрезок $950–$1000 — запас $50 на уже отправленные запросы.</div>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
