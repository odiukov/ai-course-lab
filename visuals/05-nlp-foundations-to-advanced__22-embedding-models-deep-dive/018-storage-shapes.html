<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цена точности multi-vector</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-strong: #eef3fa;
    --text: #172033;
    --muted: #5c677d;
    --line: #9aa8bd;
    --dense: #2878c8;
    --dense-soft: #dcecff;
    --multi: #8a4bd0;
    --multi-soft: #eee1ff;
    --accent: #d45c28;
    --accent-text: #ffffff;
    --cell-a: #9b65d5;
    --cell-b: #be95e8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #192231;
      --panel-strong: #202c3e;
      --text: #edf3ff;
      --muted: #afbdd1;
      --line: #68778d;
      --dense: #63adf2;
      --dense-soft: #193a59;
      --multi: #c18af3;
      --multi-soft: #3b2752;
      --accent: #e47b48;
      --accent-text: #15100d;
      --cell-a: #ae75df;
      --cell-b: #76509b;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: unset;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .diagram-heading {
    margin: unset;
    padding: 14px 20px 8px;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--page);
  }

  .card {
    fill: var(--panel);
    stroke: var(--line);
  }

  .card-band {
    fill: var(--panel-strong);
  }

  .dense-fill {
    fill: var(--dense);
  }

  .dense-soft {
    fill: var(--dense-soft);
    stroke: var(--dense);
  }

  .multi-fill {
    fill: var(--multi);
  }

  .multi-soft {
    fill: var(--multi-soft);
    stroke: var(--multi);
  }

  .cell-a {
    fill: var(--cell-a);
  }

  .cell-b {
    fill: var(--cell-b);
  }

  .guide {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .comparison {
    fill: none;
    stroke: var(--accent);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .comparison-badge {
    fill: var(--accent);
  }

  text {
    fill: var(--text);
    font-family: inherit;
  }

  .context {
    fill: var(--muted);
    font-size: 16px;
  }

  .card-title {
    font-size: 22px;
    font-weight: bold;
  }

  .tag {
    fill: var(--muted);
    font-size: 15px;
  }

  .formula {
    font-size: 21px;
    font-weight: bold;
  }

  .result {
    font-size: 17px;
  }

  .short-label {
    fill: var(--muted);
    font-size: 14px;
  }

  .badge-label {
    fill: var(--accent-text);
    font-size: 18px;
    font-weight: bold;
  }

  .storage {
    font-size: 16px;
    font-weight: bold;
  }

  .storage-note {
    fill: var(--muted);
    font-size: 14px;
  }

  .fallback {
    margin: unset;
    padding: 28px;
    background: var(--panel);
    color: var(--text);
    font-size: 17px;
    text-align: center;
  }
</style>
</head>
<body>
<h1 class="diagram-heading">Цена точности multi-vector</h1>

<svg
  id="scene"
  viewBox="0 0 1000 430"
  width="1000"
  height="430"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="diagramTitle diagramDescription">
  <title id="diagramTitle">Сравнение памяти dense и multi-vector</title>
  <desc id="diagramDescription">Dense хранит 1024 числа, а multi-vector для 200 токенов хранит 204800 чисел — в 200 раз больше.</desc>
</svg>

<script>
const diagram = Object.freeze({
  canvas: { width: 1000, height: 430 },
  mapping: [0, 0, 1, 1],
  values: {
    one: 1,
    tokens: 200,
    dimensions: 1024,
    multiTotal: 204800,
    denseBytes: 4,
    multiBytes: 800,
    denseMillion: 4,
    multiMillion: 800
  },
  layout: {
    background: { x: 0, y: 0, width: 1000, height: 430 },
    context: { x: 500, y: 25 },
    cards: {
      y: 48,
      height: 285,
      radius: 18,
      bandHeight: 91,
      dense: { x: 35, width: 370, center: 220 },
      multi: { x: 435, width: 530, center: 700 }
    },
    titles: { y: 82, tagY: 111 },
    denseVector: {
      x: 78,
      y: 158,
      width: 284,
      height: 42,
      radius: 8,
      segments: 16,
      gap: 4,
      labelY: 224
    },
    multiGrid: {
      x: 485,
      y: 145,
      columns: 20,
      cellWidth: 14,
      cellHeight: 8,
      gapX: 2,
      gapY: 3,
      radius: 2,
      braceX: 819,
      braceTick: 10,
      labelX: 842,
      labelY: 198
    },
    formulas: {
      denseY: 265,
      multiY: 265,
      resultY: 296
    },
    comparison: {
      x1: 255,
      x2: 745,
      y: 366,
      badgeX: 359,
      badgeY: 344,
      badgeWidth: 282,
      badgeHeight: 43,
      badgeRadius: 21,
      textX: 500,
      textY: 371,
      arrowLength: 16,
      arrowHalfHeight: 9
    },
    storage: {
      denseX: 220,
      multiX: 700,
      mainY: 409,
      noteY: 427
    }
  },
  style: {
    cardLine: 2,
    vectorLine: 2,
    guideLine: 2,
    comparisonLine: 4
  },
  copy: {
    context: "Фрагмент: 200 токенов · размерность: 1 024",
    denseTitle: "Dense",
    denseTag: "один вектор на весь фрагмент",
    denseVector: "1 вектор",
    denseFormula: "1 × 1 024 = 1 024",
    denseResult: "число на фрагмент",
    multiTitle: "Multi-vector",
    multiTag: "отдельный вектор для каждого токена",
    multiGrid: "200 векторов",
    multiFormula: "200 × 1 024 = 204 800",
    multiResult: "чисел на фрагмент",
    comparison: "в 200 раз больше памяти",
    denseStorage: "≈ 4 КБ на фрагмент",
    multiStorage: "≈ 800 КБ на фрагмент",
    denseMillion: "≈ 4 ГБ на миллион",
    multiMillion: "≈ 800 ГБ на миллион",
    fallback: "Dense должен был показать 1 × 1 024 числа, а multi-vector — 200 × 1 024 = 204 800 чисел, то есть в 200 раз больше."
  }
});

const [originX, originY, scaleX, scaleY] = diagram.mapping;
const origin = Object.freeze({ x: originX, y: originY });
const scale = Object.freeze({ x: scaleX, y: scaleY });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const NS = "http://www.w3.org/2000/svg";
const scene = document.getElementById("scene");

function element(name, attributes, parent = scene) {
  const item = document.createElementNS(NS, name);
  Object.entries(attributes).forEach(([key, value]) => {
    item.setAttribute(key, String(value));
  });
  parent.appendChild(item);
  return item;
}

function rectangle(x, y, width, height, radius, className, lineWidth) {
  return element("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(width),
    height: sy(height),
    rx: sx(radius),
    ry: sy(radius),
    class: className,
    "stroke-width": lineWidth
  });
}

function line(x1, y1, x2, y2, className, lineWidth) {
  return element("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className,
    "stroke-width": lineWidth
  });
}

function polygon(points, className) {
  const mapped = points
    .map(([x, y]) => `${sx(x)},${sy(y)}`)
    .join(" ");
  return element("polygon", { points: mapped, class: className });
}

function label(x, y, content, className, anchor = "middle") {
  const item = element("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor
  });
  item.textContent = content;
  return item;
}

try {
  const { layout, style, copy, values } = diagram;
  const { cards, titles, denseVector, multiGrid, formulas, comparison, storage } = layout;

  rectangle(
    layout.background.x,
    layout.background.y,
    layout.background.width,
    layout.background.height,
    layout.background.x,
    "",
    layout.background.x
  );

  label(layout.context.x, layout.context.y, copy.context, "context");

  rectangle(
    cards.dense.x,
    cards.y,
    cards.dense.width,
    cards.height,
    cards.radius,
    "card",
    style.cardLine
  );
  rectangle(
    cards.multi.x,
    cards.y,
    cards.multi.width,
    cards.height,
    cards.radius,
    "card",
    style.cardLine
  );

  rectangle(
    cards.dense.x,
    cards.y,
    cards.dense.width,
    cards.bandHeight,
    cards.radius,
    "card-band",
    layout.background.x
  );
  rectangle(
    cards.multi.x,
    cards.y,
    cards.multi.width,
    cards.bandHeight,
    cards.radius,
    "card-band",
    layout.background.x
  );

  label(cards.dense.center, titles.y, copy.denseTitle, "card-title");
  label(cards.dense.center, titles.tagY, copy.denseTag, "tag");
  label(cards.multi.center, titles.y, copy.multiTitle, "card-title");
  label(cards.multi.center, titles.tagY, copy.multiTag, "tag");

  rectangle(
    denseVector.x,
    denseVector.y,
    denseVector.width,
    denseVector.height,
    denseVector.radius,
    "dense-soft",
    style.vectorLine
  );

  const denseInnerWidth =
    denseVector.width - denseVector.gap * (denseVector.segments + values.one);
  const denseCellWidth = denseInnerWidth / denseVector.segments;

  Array.from({ length: denseVector.segments }, (_, item) => {
    const cellX =
      denseVector.x +
      denseVector.gap +
      item * (denseCellWidth + denseVector.gap);
    rectangle(
      cellX,
      denseVector.y + denseVector.gap,
      denseCellWidth,
      denseVector.height - denseVector.gap - denseVector.gap,
      denseVector.radius - denseVector.gap,
      "dense-fill",
      layout.background.x
    );
  });

  label(
    cards.dense.center,
    denseVector.labelY,
    copy.denseVector,
    "short-label"
  );

  const gridRows = values.tokens / multiGrid.columns;
  const gridBottom =
    multiGrid.y +
    gridRows * multiGrid.cellHeight +
    (gridRows - values.one) * multiGrid.gapY;

  Array.from({ length: values.tokens }, (_, item) => {
    const column = item % multiGrid.columns;
    const row = Math.floor(item / multiGrid.columns);
    const cellX =
      multiGrid.x + column * (multiGrid.cellWidth + multiGrid.gapX);
    const cellY =
      multiGrid.y + row * (multiGrid.cellHeight + multiGrid.gapY);
    const className =
      item % style.cardLine === layout.background.x ? "cell-a" : "cell-b";

    rectangle(
      cellX,
      cellY,
      multiGrid.cellWidth,
      multiGrid.cellHeight,
      multiGrid.radius,
      className,
      layout.background.x
    );
  });

  line(
    multiGrid.braceX,
    multiGrid.y,
    multiGrid.braceX,
    gridBottom,
    "guide",
    style.guideLine
  );
  line(
    multiGrid.braceX - multiGrid.braceTick,
    multiGrid.y,
    multiGrid.braceX,
    multiGrid.y,
    "guide",
    style.guideLine
  );
  line(
    multiGrid.braceX - multiGrid.braceTick,
    gridBottom,
    multiGrid.braceX,
    gridBottom,
    "guide",
    style.guideLine
  );
  label(
    multiGrid.labelX,
    multiGrid.labelY,
    copy.multiGrid,
    "short-label",
    "start"
  );

  label(
    cards.dense.center,
    formulas.denseY,
    copy.denseFormula,
    "formula"
  );
  label(
    cards.dense.center,
    formulas.resultY,
    copy.denseResult,
    "result"
  );
  label(
    cards.multi.center,
    formulas.multiY,
    copy.multiFormula,
    "formula"
  );
  label(
    cards.multi.center,
    formulas.resultY,
    copy.multiResult,
    "result"
  );

  line(
    comparison.x1,
    comparison.y,
    comparison.x2,
    comparison.y,
    "comparison",
    style.comparisonLine
  );
  polygon(
    [
      [comparison.x2, comparison.y],
      [
        comparison.x2 - comparison.arrowLength,
        comparison.y - comparison.arrowHalfHeight
      ],
      [
        comparison.x2 - comparison.arrowLength,
        comparison.y + comparison.arrowHalfHeight
      ]
    ],
    "comparison-badge"
  );

  rectangle(
    comparison.badgeX,
    comparison.badgeY,
    comparison.badgeWidth,
    comparison.badgeHeight,
    comparison.badgeRadius,
    "comparison-badge",
    layout.background.x
  );
  label(
    comparison.textX,
    comparison.textY,
    copy.comparison,
    "badge-label"
  );

  label(
    storage.denseX,
    storage.mainY,
    copy.denseStorage,
    "storage"
  );
  label(
    storage.multiX,
    storage.mainY,
    copy.multiStorage,
    "storage"
  );
  label(
    storage.denseX,
    storage.noteY,
    copy.denseMillion,
    "storage-note"
  );
  label(
    storage.multiX,
    storage.noteY,
    copy.multiMillion,
    "storage-note"
  );
} catch (error) {
  const fallback = document.createElement("p");
  fallback.className = "fallback";
  fallback.textContent = diagram.copy.fallback;
  scene.replaceWith(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
