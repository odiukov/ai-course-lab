<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Q-Former против MLP</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1d1d1f; --muted:#6b6b70;
    --qf:#b4581f; --mlp:#1f6f9c; --grid:#d8d6d0; --band:#f1efe9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15161a; --fg:#eceef2; --muted:#9a9ea8;
      --qf:#e29a5c; --mlp:#69b6e0; --grid:#33363d; --band:#1d1f25;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  h2 span{color:var(--muted);font-weight:400;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);white-space:pre-wrap;}
  text{font-family:inherit;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Q-Former против MLP <span>— шесть строк, счёт 5:1 в пользу MLP</span></h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  var W = 900, H = 470;          // холст
  var PAD = 4;                   // отступ подписи от якоря, px
  var LW = 1;                    // толщина линий
  var FS = 13;                   // размер шрифта

  // ---- данные схемы: строка, значение Q-Former, значение MLP, победитель
  var ROWS = [
    ["Токенов на картинку", "32", "576 / 2880", "qf"],
    ["Обучаемых параметров", "188M", "22M", "mlp"],
    ["Лосс стадии 1", "ITC + ITM + ITG", "LM", "mlp"],
    ["Смена LLM", "переобучение", "drop-in", "mlp"],
    ["Несколько картинок", "неуклюже", "конкатенация", "mlp"],
    ["Видео", "неуклюже", "конкатенация", "mlp"]
  ];

  // ---- одна система координат: origin + scale, дальше не меняются
  var ORIGIN = { x: 30, y: 26 };   // px левого-верхнего угла сетки
  var SCALE  = { x: 62, y: 52 };   // px на единицу по x и по y
  function sx(x){ return ORIGIN.x + x * SCALE.x; }
  function sy(y){ return ORIGIN.y + y * SCALE.y; }

  // геометрия в единицах: x 0..13.5, y 0..8
  var X_NAME = 0, X_NAME_R = 4.6, X_QF = 6.6, X_MID = 8.6, X_MLP = 11.1, X_R = 13.6;
  var Y_HEAD = 0, Y_BASE = 1, Y_FOOT = 7.35, Y_LEG = 8.15;

  function el(n, a){
    var e = document.createElementNS("http://www.w3.org/2000/svg", n);
    for (var k in a) e.setAttribute(k, a[k]);
    return e;
  }
  function txt(x, y, s, anchor, opt){
    var t = el("text", {x:x, y:y, "text-anchor":anchor, "font-size":(opt&&opt.fs)||FS});
    if (opt && opt.fill) t.setAttribute("fill", opt.fill);
    if (opt && opt.w) t.setAttribute("font-weight", opt.w);
    t.textContent = s;
    return t;
  }

  try {
    var svg = el("svg", {viewBox:"0 0 "+W+" "+H, preserveAspectRatio:"xMidYMid meet",
                         role:"img", "aria-label":"Сравнение Q-Former и MLP по шести пунктам"});
    svg.appendChild(el("rect", {x:0, y:0, width:W, height:H, fill:"var(--bg)"}));

    // --- полосы-подложки у строк, где выигрывает MLP
    ROWS.forEach(function(r, i){
      if (r[3] !== "mlp") return;
      svg.appendChild(el("rect", {
        x:sx(X_MID), y:sy(Y_BASE + i) - SCALE.y * 0.62,
        width:sx(X_R) - sx(X_MID), height:SCALE.y * 0.82,
        fill:"var(--band)"}));
    });
    // строка, где выигрывает Q-Former
    ROWS.forEach(function(r, i){
      if (r[3] !== "qf") return;
      svg.appendChild(el("rect", {
        x:sx(X_NAME_R), y:sy(Y_BASE + i) - SCALE.y * 0.62,
        width:sx(X_MID) - sx(X_NAME_R), height:SCALE.y * 0.82,
        fill:"var(--band)"}));
    });

    // --- шапка колонок
    svg.appendChild(txt(sx(X_QF), sy(Y_HEAD), "Q-Former (BLIP-2)", "middle",
                        {fs:FS+1, w:600, fill:"var(--qf)"}));
    svg.appendChild(txt(sx(X_MLP), sy(Y_HEAD), "MLP-проектор (LLaVA)", "middle",
                        {fs:FS+1, w:600, fill:"var(--mlp)"}));

    // --- линия под шапкой и разделитель колонок
    svg.appendChild(el("line", {x1:sx(X_NAME), y1:sy(Y_HEAD) + PAD*2,
      x2:sx(X_R), y2:sy(Y_HEAD) + PAD*2, stroke:"var(--grid)", "stroke-width":LW*1.5}));
    svg.appendChild(el("line", {x1:sx(X_MID), y1:sy(Y_HEAD) + PAD*2,
      x2:sx(X_MID), y2:sy(Y_FOOT) - SCALE.y*0.55, stroke:"var(--grid)", "stroke-width":LW}));

    // --- строки
    ROWS.forEach(function(r, i){
      var y = sy(Y_BASE + i);
      // название строки — слева от границы, якорь end
      svg.appendChild(txt(sx(X_NAME_R) - PAD*2, y, (i+1) + ". " + r[0], "end",
                          {fill:"var(--muted)"}));
      // значения — по центру своих колонок
      svg.appendChild(txt(sx(X_QF), y, r[1], "middle",
                          {w:(r[3]==="qf"?600:400), fill:"var(--qf)"}));
      svg.appendChild(txt(sx(X_MLP), y, r[2], "middle",
                          {w:(r[3]==="mlp"?600:400), fill:"var(--mlp)"}));
      // галочка у победителя — у правого края его полосы
      var wx = (r[3]==="mlp") ? sx(X_R) - PAD*2 : sx(X_MID) - PAD*2;
      svg.appendChild(txt(wx, y, "✓", "end",
                          {fs:FS+1, w:600, fill:(r[3]==="mlp"?"var(--mlp)":"var(--qf)")}));
      // тонкая линейка между строками
      if (i < ROWS.length - 1)
        svg.appendChild(el("line", {x1:sx(X_NAME), y1:y + SCALE.y*0.2,
          x2:sx(X_R), y2:y + SCALE.y*0.2, stroke:"var(--grid)", "stroke-width":LW*0.5}));
    });

    // --- итоговая строка
    svg.appendChild(el("line", {x1:sx(X_NAME), y1:sy(Y_FOOT) - SCALE.y*0.55,
      x2:sx(X_R), y2:sy(Y_FOOT) - SCALE.y*0.55, stroke:"var(--grid)", "stroke-width":LW*1.5}));
    svg.appendChild(txt(sx(X_NAME_R) - PAD*2, sy(Y_FOOT), "Счёт", "end", {w:600}));
    svg.appendChild(txt(sx(X_QF), sy(Y_FOOT), "1 из 6", "middle", {w:600, fill:"var(--qf)"}));
    svg.appendChild(txt(sx(X_MLP), sy(Y_FOOT), "5 из 6", "middle", {w:600, fill:"var(--mlp)"}));

    // --- легенда одной строкой под схемой
    svg.appendChild(txt(sx(X_NAME), sy(Y_LEG),
      "Единственная строка за Q-Former — бюджет токенов: 576 против 32 — это 28% окна в 2048",
      "start", {fs:FS-1, fill:"var(--muted)"}));

    host.appendChild(svg);
  } catch (e) {
    var d = document.createElement("div");
    d.className = "fail";
    d.textContent =
      "Схема не построилась. Она должна была показать шесть строк сравнения:\n" +
      "1. Токенов на картинку: Q-Former 32, MLP 576 / 2880 — выигрывает Q-Former.\n" +
      "2. Обучаемых параметров: 188M против 22M — выигрывает MLP.\n" +
      "3. Лосс стадии 1: ITC+ITM+ITG против одного LM — выигрывает MLP.\n" +
      "4. Смена LLM: переобучение против drop-in — выигрывает MLP.\n" +
      "5. Несколько картинок: неуклюже против конкатенации — выигрывает MLP.\n" +
      "6. Видео: неуклюже против конкатенации — выигрывает MLP.\n" +
      "Счёт 5:1 в пользу MLP; единственный плюс Q-Former — бюджет токенов (28% окна в 2048).";
    host.appendChild(d);
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
