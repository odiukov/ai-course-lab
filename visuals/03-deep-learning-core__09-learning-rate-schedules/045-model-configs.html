<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LR-конфигурации опубликованных моделей</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --card: #ffffff;
    --card-border: #d9deea;
    --text: #172033;
    --muted: #657086;
    --axis: #a7b0c2;
    --grid: #dfe4ee;
    --resnet: #e36b2c;
    --bert: #7b61d1;
    --gpt: #2778c8;
    --llama: #16866a;
    --note-bg: #edf1f8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111722;
      --card: #192131;
      --card-border: #344057;
      --text: #edf2fa;
      --muted: #aab5c8;
      --axis: #71809a;
      --grid: #2a3548;
      --resnet: #ff9358;
      --bert: #ad96ff;
      --gpt: #67adf2;
      --llama: #56c6a3;
      --note-bg: #202a3c;
    }
  }

  html,
  body {
    margin: unset;
    padding: unset;
    background: var(--bg);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--bg);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .main-title {
    fill: var(--text);
    font-size: 24px;
    font-weight: bold;
    text-anchor: middle;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 15px;
    text-anchor: middle;
  }

  .card {
    fill: var(--card);
    stroke: var(--card-border);
    stroke-width: 1.5px;
  }

  .card-title {
    fill: var(--text);
    font-size: 18px;
    font-weight: bold;
  }

  .detail {
    fill: var(--text);
    font-size: 14px;
  }

  .detail-muted {
    fill: var(--muted);
    font-size: 13px;
  }

  .axis {
    fill: none;
    stroke: var(--axis);
    stroke-width: 1.5px;
    stroke-linecap: round;
  }

  .guide {
    fill: none;
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .tick-label,
  .unit-label {
    fill: var(--muted);
    font-size: 12px;
  }

  .tick-label {
    text-anchor: middle;
  }

  .unit-label {
    text-anchor: end;
  }

  .schedule {
    fill: none;
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .resnet-stroke { stroke: var(--resnet); }
  .bert-stroke { stroke: var(--bert); }
  .gpt-stroke { stroke: var(--gpt); }
  .llama-stroke { stroke: var(--llama); }

  .resnet-fill { fill: var(--resnet); }
  .bert-fill { fill: var(--bert); }
  .gpt-fill { fill: var(--gpt); }
  .llama-fill { fill: var(--llama); }

  .annotation {
    font-size: 12px;
    font-weight: bold;
  }

  .resnet-text { fill: var(--resnet); }
  .bert-text { fill: var(--bert); }
  .gpt-text { fill: var(--gpt); }
  .llama-text { fill: var(--llama); }

  .fallback {
    display: none;
    fill: var(--text);
    font-size: 16px;
    text-anchor: middle;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1200 500" width="1200" height="500"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="main-title diagram-desc">
  <title>Сравнение LR-конфигураций ResNet-50, BERT, GPT-3 и Llama 3</title>
  <desc id="diagram-desc">Четыре карточки показывают пиковый learning rate, warmup и форму затухания для опубликованных моделей.</desc>
  <text id="main-title" class="main-title">LR-конфигурации опубликованных моделей</text>
  <text id="subtitle" class="subtitle">0,1 ≈ 333 × 3e-4 — но пиковые LR нельзя сравнивать без всего рецепта</text>
  <g id="diagram"></g>
  <text id="fallback" class="fallback">Схема должна показать LR, warmup и расписания ResNet-50, BERT, GPT-3 и Llama 3.</text>
</svg>

<script>
const DATA = [
  {
    title: [600, 27],
    subtitle: [600, 51],
    fallback: [600, 250],
    radius: 15,
    stripe: 7,
    tick: 5,
    dot: 4
  },
  {
    name: "ResNet-50",
    tone: "resnet",
    card: [25, 68, 560, 198],
    title: [55, 96],
    chart: {
      left: 55,
      right: 345,
      top: 127,
      bottom: 225,
      labelY: 246,
      unit: "эпохи",
      ticks: [
        [145, "30"],
        [235, "60"],
        [315, "90"]
      ],
      segments: [
        { cmd: "M", pts: [[55, 140]] },
        { cmd: "L", pts: [[145, 140], [145, 163], [235, 163], [235, 187], [315, 187], [315, 211], [345, 211]] }
      ]
    },
    points: [
      [55, 140]
    ],
    annotations: [
      { at: [55, 140], dx: 8, dy: -9, anchor: "start", text: "пик 0,1" }
    ],
    details: {
      at: [375, 126],
      gap: 22,
      lines: [
        ["Пик: 0,1", "detail"],
        ["Warmup: нет", "detail"],
        ["Step decay: LR / 10", "detail"],
        ["после эпох 30, 60, 90", "detail"],
        ["Оптимизатор: SGD", "detail-muted"]
      ]
    }
  },
  {
    name: "BERT",
    tone: "bert",
    card: [615, 68, 560, 198],
    title: [645, 96],
    chart: {
      left: 645,
      right: 935,
      top: 127,
      bottom: 225,
      labelY: 246,
      unit: "шаги",
      ticks: [
        [704, "10K"]
      ],
      segments: [
        { cmd: "M", pts: [[645, 225]] },
        { cmd: "L", pts: [[704, 140], [935, 225]] }
      ]
    },
    points: [
      [704, 140]
    ],
    annotations: [
      { at: [704, 140], dx: 0, dy: -9, anchor: "middle", text: "пик 1e-4" }
    ],
    details: {
      at: [965, 126],
      gap: 22,
      lines: [
        ["Пик: 1e-4", "detail"],
        ["Warmup: 10K шагов", "detail"],
        ["Линейное снижение", "detail"],
        ["после warmup", "detail"],
        ["Адаптивный оптимизатор", "detail-muted"]
      ]
    }
  },
  {
    name: "GPT-3",
    tone: "gpt",
    card: [25, 274, 560, 208],
    title: [55, 302],
    chart: {
      left: 55,
      right: 345,
      top: 333,
      bottom: 430,
      labelY: 453,
      unit: "токены",
      ticks: [
        [105, "375 млн"]
      ],
      segments: [
        { cmd: "M", pts: [[55, 430]] },
        { cmd: "L", pts: [[105, 346]] },
        { cmd: "C", pts: [[170, 346], [174, 369], [225, 387]] },
        { cmd: "C", pts: [[278, 407], [300, 430], [345, 430]] }
      ]
    },
    points: [
      [105, 346],
      [345, 430]
    ],
    annotations: [
      { at: [105, 346], dx: 0, dy: -9, anchor: "middle", text: "пик 6e-4" },
      { at: [345, 430], dx: -9, dy: -8, anchor: "end", text: "до нуля" }
    ],
    details: {
      at: [375, 332],
      gap: 22,
      lines: [
        ["Пик: 6e-4", "detail"],
        ["Warmup: 375 млн токенов", "detail"],
        ["Cosine decay", "detail"],
        ["до нуля", "detail"],
        ["Адаптивный оптимизатор", "detail-muted"]
      ]
    }
  },
  {
    name: "Llama 3",
    tone: "llama",
    card: [615, 274, 560, 208],
    title: [645, 302],
    chart: {
      left: 645,
      right: 935,
      top: 333,
      bottom: 430,
      labelY: 453,
      unit: "шаги",
      ticks: [
        [704, "2000"]
      ],
      segments: [
        { cmd: "M", pts: [[645, 430]] },
        { cmd: "L", pts: [[704, 346]] },
        { cmd: "C", pts: [[765, 346], [775, 365], [825, 382]] },
        { cmd: "C", pts: [[870, 398], [894, 414], [935, 414]] }
      ]
    },
    points: [
      [704, 346],
      [935, 414]
    ],
    annotations: [
      { at: [704, 346], dx: 0, dy: -9, anchor: "middle", text: "пик 3e-4" },
      { at: [935, 414], dx: -9, dy: -8, anchor: "end", text: "3e-5" }
    ],
    details: {
      at: [965, 332],
      gap: 22,
      lines: [
        ["Пик: 3e-4", "detail"],
        ["Warmup: 2000 шагов", "detail"],
        ["Cosine decay", "detail"],
        ["Финиш: 3e-5", "detail"],
        ["Адаптивный оптимизатор", "detail-muted"]
      ]
    }
  }
];

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const [layout, ...cards] = DATA;
const namespace = "http://www.w3.org/2000/svg";
const diagram = document.getElementById("diagram");
const heading = document.getElementById("main-title");
const subtitle = document.getElementById("subtitle");
const fallback = document.getElementById("fallback");

function el(tag, attrs = {}, content = "") {
  const node = document.createElementNS(namespace, tag);
  Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
  if (content) node.textContent = content;
  return node;
}

function addText(parent, x, y, content, className, anchor = "start", dx = "", dy = "") {
  const attrs = {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor
  };
  if (dx !== "") attrs.dx = dx;
  if (dy !== "") attrs.dy = dy;
  parent.appendChild(el("text", attrs, content));
}

function line(parent, x1, y1, x2, y2, className) {
  parent.appendChild(el("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  }));
}

function schedulePath(segments) {
  return segments.map(({ cmd, pts }) =>
    cmd + " " + pts.map(([x, y]) => sx(x) + " " + sy(y)).join(" ")
  ).join(" ");
}

try {
  const [titleX, titleY] = layout.title;
  const [subtitleX, subtitleY] = layout.subtitle;

  heading.setAttribute("x", sx(titleX));
  heading.setAttribute("y", sy(titleY));
  subtitle.setAttribute("x", sx(subtitleX));
  subtitle.setAttribute("y", sy(subtitleY));

  cards.forEach(card => {
    const group = el("g", {
      role: "group",
      "aria-label": card.name
    });

    const [cardX, cardY, cardW, cardH] = card.card;
    const [titleAtX, titleAtY] = card.title;
    const chart = card.chart;

    group.appendChild(el("rect", {
      x: sx(cardX),
      y: sy(cardY),
      width: sx(cardX + cardW) - sx(cardX),
      height: sy(cardY + cardH) - sy(cardY),
      rx: sx(layout.radius) - sx(origin.x),
      ry: sy(layout.radius) - sy(origin.y),
      class: "card"
    }));

    group.appendChild(el("rect", {
      x: sx(cardX),
      y: sy(cardY),
      width: sx(cardX + layout.stripe) - sx(cardX),
      height: sy(cardY + cardH) - sy(cardY),
      rx: sx(layout.radius) - sx(origin.x),
      ry: sy(layout.radius) - sy(origin.y),
      class: card.tone + "-fill"
    }));

    addText(group, titleAtX, titleAtY, card.name, "card-title");

    line(group, chart.left, chart.top, chart.left, chart.bottom, "axis");
    line(group, chart.left, chart.bottom, chart.right, chart.bottom, "axis");
    line(group, chart.left, chart.top, chart.right, chart.top, "guide");

    chart.ticks.forEach(([tickX, tickText]) => {
      line(group, tickX, chart.bottom, tickX, chart.bottom + layout.tick, "axis");
      addText(group, tickX, chart.labelY, tickText, "tick-label", "middle");
    });

    addText(group, chart.right, chart.labelY, chart.unit, "unit-label", "end");

    group.appendChild(el("path", {
      d: schedulePath(chart.segments),
      class: "schedule " + card.tone + "-stroke"
    }));

    card.points.forEach(([pointX, pointY]) => {
      group.appendChild(el("circle", {
        cx: sx(pointX),
        cy: sy(pointY),
        r: sx(layout.dot) - sx(origin.x),
        class: card.tone + "-fill"
      }));
    });

    card.annotations.forEach(annotation => {
      const [anchorX, anchorY] = annotation.at;
      addText(
        group,
        anchorX,
        anchorY,
        annotation.text,
        "annotation " + card.tone + "-text",
        annotation.anchor,
        annotation.dx,
        annotation.dy
      );
    });

    const [detailX, detailY] = card.details.at;
    card.details.lines.forEach(([content, className], index) => {
      addText(
        group,
        detailX,
        detailY + index * card.details.gap,
        content,
        className
      );
    });

    diagram.appendChild(group);
  });
} catch (error) {
  diagram.replaceChildren();
  const [fallbackX, fallbackY] = layout.fallback;
  fallback.setAttribute("x", sx(fallbackX));
  fallback.setAttribute("y", sy(fallbackY));
  fallback.setAttribute("display", "inline");
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
