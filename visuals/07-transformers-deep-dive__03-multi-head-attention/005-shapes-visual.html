<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Формы на конкретных числах</title>
<style>
  :root{
    --bg:#fbfbfa; --ink:#1f2328; --dim:#5b6472; --line:#aab2bd;
    --panel:#ffffff; --edge:#404a56; --accent:#b0322a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --ink:#e6e9ec; --dim:#9aa5b1; --line:#3f4854;
      --panel:#1d2126; --edge:#8b97a5; --accent:#ff7a6e;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:8px 6px 10px}
  .cap{font-size:14px;font-weight:600;text-align:center;margin:0 0 4px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{font-size:13px;line-height:1.5;color:var(--ink)}
  text{fill:var(--ink)}
  .t-title{font-size:13px;font-weight:600}
  .t-shape{font-size:14px;font-weight:700;font-family:ui-monospace,Menlo,Consolas,monospace}
  .t-sub{font-size:11px;fill:var(--dim)}
  .t-count{font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .t-head{font-size:9px;fill:var(--dim)}
  .t-arr{font-size:11px;fill:var(--dim)}
  .t-big{font-size:17px;font-weight:700}
  .t-leg{font-size:11px;fill:var(--dim)}
  .box{fill:var(--panel);stroke:var(--edge);stroke-width:1.4}
  .row{stroke:var(--line);stroke-width:.7}
  .cut{stroke:var(--edge);stroke-width:1.1;stroke-dasharray:3 2}
  .arr{stroke:var(--dim);stroke-width:1.6;fill:none}
  .arrh{fill:var(--dim)}
  .mark{fill:var(--accent);stroke:none}
</style>
<div class="wrap">
  <p class="cap">Формы на конкретных числах: 10 x 512 → 10 x 8 x 64 → 8 x 10 x 64</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var D={
      rows:10, dModel:512, heads:8, dHead:64,
      unitsW:16,            /* ширина таблицы 512 в единицах схемы */
      gap:5, cardGap:0.6,
      markTok:3, markCol:400, markW:0.5,
      y:{title:-3.0, shape:-1.6, head:-0.4, top:0, bot:10, sub:11.3, count:12.8, big:14.8, leg:16.6, mid:5}
    };
    /* ---- один origin, один scale, одна пара функций ---- */
    var SCALE=14, ORIGIN={x:40,y:68};
    function sx(x){return ORIGIN.x+x*SCALE;}
    function sy(y){return ORIGIN.y+y*SCALE;}

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 950 312');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    function el(t,a,txt){var n=document.createElementNS(NS,t);
      for(var k in a)n.setAttribute(k,a[k]);
      if(txt!=null)n.textContent=txt; svg.appendChild(n); return n;}
    function line(x1,y1,x2,y2,c){el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),'class':c});}
    function rect(x,y,w,h,c){el('rect',{x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),'class':c});}
    function txt(x,y,c,anchor,s){el('text',{x:sx(x),y:sy(y),'class':c,'text-anchor':anchor},s);}

    var cardW=D.unitsW/D.heads;                 /* 2 единицы = 64 признака */
    var p1=0, p2=D.unitsW+D.gap, p3=p2+D.unitsW+D.gap;
    var p3w=D.heads*cardW+(D.heads-1)*D.cardGap;
    var right=p3+p3w, mid=right/2;
    var markHead=Math.floor(D.markCol/D.dHead);
    var markOff=D.markCol%D.dHead;
    var markRow=D.markTok-1;

    function rows(x0,w){for(var i=1;i<D.rows;i++)line(x0,i,x0+w,i,'row');}
    function mark(cx){rect(cx-D.markW/2,markRow,D.markW,1,'mark');}

    /* панель 1: одна таблица 10 x 512 */
    rect(p1,D.y.top,D.unitsW,D.rows,'box'); rows(p1,D.unitsW);
    mark(p1+D.markCol/D.dModel*D.unitsW);
    txt(p1+D.unitsW/2,D.y.title,'t-title','middle','Таблица X (и Q, K, V)');
    txt(p1+D.unitsW/2,D.y.shape,'t-shape','middle','10 x 512');
    txt(p1+D.unitsW/2,D.y.sub,'t-sub','middle','одна таблица, все 512 признаков');
    txt(p1+D.unitsW/2,D.y.count,'t-count','middle','10 · 512 = 5120');

    /* панель 2: та же таблица, разрезана на 8 блоков по 64 */
    rect(p2,D.y.top,D.unitsW,D.rows,'box'); rows(p2,D.unitsW);
    for(var j=1;j<D.heads;j++)line(p2+j*cardW,D.y.top,p2+j*cardW,D.y.bot,'cut');
    mark(p2+D.markCol/D.dModel*D.unitsW);
    txt(p2+D.unitsW/2,D.y.title,'t-title','middle','После reshape');
    txt(p2+D.unitsW/2,D.y.shape,'t-shape','middle','10 x 8 x 64');
    txt(p2+D.unitsW/2,D.y.sub,'t-sub','middle','тот же прямоугольник, 8 блоков по 64');
    txt(p2+D.unitsW/2,D.y.count,'t-count','middle','10 · 8 · 64 = 5120');

    /* панель 3: 8 отдельных табличек 10 x 64 */
    for(var h=0;h<D.heads;h++){
      var cx0=p3+h*(cardW+D.cardGap);
      rect(cx0,D.y.top,cardW,D.rows,'box'); rows(cx0,cardW);
      txt(cx0+cardW/2,D.y.head,'t-head','middle','г'+(h+1));
      if(h===markHead)mark(cx0+markOff/D.dHead*cardW);
    }
    txt(p3+p3w/2,D.y.title,'t-title','middle','После transpose');
    txt(p3+p3w/2,D.y.shape,'t-shape','middle','8 x 10 x 64');
    txt(p3+p3w/2,D.y.sub,'t-sub','middle','8 отдельных табличек 10 x 64 (г1…г8)');
    txt(p3+p3w/2,D.y.count,'t-count','middle','8 · 10 · 64 = 5120');

    /* стрелки */
    function arrow(xa,xb,top,bottom){
      line(xa,D.y.mid,xb-0.45,D.y.mid,'arr');
      el('polygon',{'class':'arrh',points:
        sx(xb)+','+sy(D.y.mid)+' '+sx(xb-0.55)+','+sy(D.y.mid-0.28)+' '+sx(xb-0.55)+','+sy(D.y.mid+0.28)});
      var c=(xa+xb)/2;
      txt(c,D.y.mid-0.9,'t-arr','middle',top);
      txt(c,D.y.mid+1.6,'t-arr','middle',bottom);
    }
    arrow(D.unitsW+0.5,p2-0.5,'reshape','512 = 8 · 64');
    arrow(p2+D.unitsW+0.5,p3-0.5,'transpose','оси местами');

    /* итог и легенда */
    txt(mid,D.y.big,'t-big','middle','всюду 5120 чисел');
    txt(mid,D.y.leg,'t-leg','middle',
      'красная клетка — одно и то же число: «токен 3, колонка 400» стало «голова 7, токен 3, колонка 16»');

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fb">Схема должна показывать: таблица 10 x 512 (5120 чисел) → '+
      'reshape в 10 x 8 x 64 (10 · 8 · 64 = 5120) → transpose в 8 x 10 x 64 '+
      '(восемь табличек 10 x 64, 8 · 10 · 64 = 5120). Всюду 5120 чисел; одно и то же число '+
      'из «токен 3, колонка 400» переезжает в «голова 7, токен 3, колонка 16».</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
