<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Один путь отчёта как источник истины</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --text: #172033;
      --muted: #5d687b;
      --line: #7c8aa5;
      --accent: #2563eb;
      --accent-soft: #dbeafe;
      --accent-text: #1648a5;
      --success: #087f5b;
      --success-soft: #d8f5e9;
      --danger: #b42318;
      --danger-soft: #fee4e2;
      --shadow: #c9d2e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #1d2737;
        --panel-soft: #263246;
        --text: #eef4ff;
        --muted: #b5c0d2;
        --line: #8190aa;
        --accent: #75a7ff;
        --accent-soft: #173d78;
        --accent-text: #d9e8ff;
        --success: #5ee0b2;
        --success-soft: #164d40;
        --danger: #ff9b93;
        --danger-soft: #642923;
        --shadow: #090d14;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    figure {
      margin: 0;
      padding: 18px;
      background: var(--page);
    }

    figcaption {
      padding: 0 0 12px;
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      overflow: visible;
      background: var(--panel);
      border: 1px solid var(--shadow);
    }

    #fallback {
      margin: 0;
      padding: 28px;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--shadow);
      font-size: 17px;
    }

    .card {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2;
    }

    .report {
      fill: var(--panel);
      stroke: var(--accent);
      stroke-width: 3;
    }

    .report-accent {
      fill: var(--accent);
    }

    .icon-disc {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2;
    }

    .orchestrator-disc {
      fill: var(--success-soft);
      stroke: var(--success);
      stroke-width: 2;
    }

    .status {
      fill: var(--danger-soft);
      stroke: var(--danger);
      stroke-width: 2;
    }

    .flow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .write-flow {
      fill: none;
      stroke: var(--success);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-read {
      fill: var(--accent);
    }

    .arrow-write {
      fill: var(--success);
    }

    .title {
      fill: var(--text);
      font-size: 22px;
      font-weight: 700;
    }

    .label {
      fill: var(--text);
      font-size: 18px;
      font-weight: 650;
    }

    .body {
      fill: var(--muted);
      font-size: 16px;
    }

    .small {
      fill: var(--muted);
      font-size: 15px;
    }

    .path {
      fill: var(--accent-text);
      font-size: 19px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
    }

    .status-text {
      fill: var(--danger);
      font-size: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 700;
    }

    .icon-letter {
      fill: var(--accent-text);
      font-size: 17px;
      font-weight: 750;
    }

    .orchestrator-letter {
      fill: var(--success);
      font-size: 18px;
      font-weight: 750;
    }

    .footer {
      fill: var(--text);
      font-size: 17px;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">Один путь отчёта как источник истины</figcaption>
    <p id="fallback">
      Схема: оркестратор записывает итог задачи 482 в
      outputs/verification/482.json, а агент-ревьюер, CI и оператор читают
      этот же единственный файл.
    </p>
    <svg
      id="diagram"
      width="1200"
      height="420"
      viewBox="0 0 1200 420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
      hidden>
      <title id="svg-title">Единый путь verification-отчёта</title>
      <desc id="svg-description">
        Оркестратор записывает один итоговый JSON-файл. Агент-ревьюер,
        CI и оператор читают этот же файл вместо независимых вердиктов.
      </desc>
    </svg>
  </figure>

  <script>
    const DATA = Object.freeze({
      origin: { x: 0, y: 0 },
      scale: 1,
      canvas: { width: 1200, height: 420 },
      labelPadding: 10,
      radius: 12,
      iconRadius: 25,
      arrow: { length: 11, halfHeight: 7 },
      heading: {
        point: { x: 600, y: 40 },
        text: "Один официальный адрес итогового вердикта"
      },
      orchestrator: {
        box: { x: 28, y: 158, width: 252, height: 104 },
        icon: { x: 70, y: 210 },
        label: { x: 108, y: 198 },
        detail: { x: 108, y: 227 },
        mark: "О",
        title: "Оркестратор",
        subtitle: "создаёт итоговый отчёт"
      },
      report: {
        box: { x: 360, y: 105, width: 430, height: 205 },
        stripe: { x: 360, y: 105, width: 12, height: 205 },
        title: { x: 575, y: 142 },
        path: { x: 575, y: 180 },
        statusBox: { x: 422, y: 207, width: 306, height: 48 },
        statusText: { x: 575, y: 237 },
        detail: { x: 575, y: 282 },
        titleText: "verification_report.json",
        pathText: "outputs/verification/482.json",
        status: "passed: false",
        detailText: "найдена блокирующая проблема"
      },
      writeArrow: {
        points: [
          { x: 280, y: 210 },
          { x: 348, y: 210 }
        ],
        end: { x: 348, y: 210 },
        label: { x: 314, y: 190 },
        labelText: "записывает"
      },
      readArrows: [
        {
          points: [
            { x: 790, y: 157 },
            { x: 842, y: 157 },
            { x: 842, y: 64 },
            { x: 888, y: 64 }
          ],
          end: { x: 888, y: 64 }
        },
        {
          points: [
            { x: 790, y: 207 },
            { x: 888, y: 207 }
          ],
          end: { x: 888, y: 207 }
        },
        {
          points: [
            { x: 790, y: 258 },
            { x: 842, y: 258 },
            { x: 842, y: 350 },
            { x: 888, y: 350 }
          ],
          end: { x: 888, y: 350 }
        }
      ],
      readers: [
        {
          box: { x: 900, y: 20, width: 272, height: 88 },
          icon: { x: 940, y: 64 },
          label: { x: 978, y: 55 },
          detail: { x: 978, y: 80 },
          mark: "А",
          title: "Агент-ревьюер",
          subtitle: "читает этот файл"
        },
        {
          box: { x: 900, y: 163, width: 272, height: 88 },
          icon: { x: 940, y: 207 },
          label: { x: 978, y: 198 },
          detail: { x: 978, y: 223 },
          mark: "CI",
          title: "CI",
          subtitle: "читает этот файл"
        },
        {
          box: { x: 900, y: 306, width: 272, height: 88 },
          icon: { x: 940, y: 350 },
          label: { x: 978, y: 341 },
          detail: { x: 978, y: 366 },
          mark: "О",
          title: "Оператор",
          subtitle: "читает этот файл"
        }
      ],
      footer: {
        point: { x: 575, y: 392 },
        text: "Один путь → один итог для всех"
      }
    });

    const origin = Object.freeze(DATA.origin);
    const scale = DATA.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, className) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (className) node.setAttribute("class", className);
        return node;
      };

      const addRect = (box, className, radius = DATA.radius) => {
        const node = make("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.width) - sx(box.x),
          height: sy(box.y + box.height) - sy(box.y),
          rx: sx(box.x + radius) - sx(box.x),
          ry: sy(box.y + radius) - sy(box.y)
        }, className);
        svg.appendChild(node);
        return node;
      };

      const addCircle = (point, className) => {
        const node = make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: sx(point.x + DATA.iconRadius) - sx(point.x)
        }, className);
        svg.appendChild(node);
        return node;
      };

      const addText = (point, content, className, anchor = "start") => {
        const node = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          "text-anchor": anchor
        }, className);
        node.textContent = content;
        svg.appendChild(node);
        return node;
      };

      const addArrow = (definition, lineClass, headClass) => {
        const points = definition.points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        svg.appendChild(make("polyline", { points }, lineClass));

        const end = definition.end;
        const arrowPoints = [
          {
            x: end.x,
            y: end.y
          },
          {
            x: end.x - DATA.arrow.length,
            y: end.y - DATA.arrow.halfHeight
          },
          {
            x: end.x - DATA.arrow.length,
            y: end.y + DATA.arrow.halfHeight
          }
        ]
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        svg.appendChild(make("polygon", { points: arrowPoints }, headClass));
      };

      addText(DATA.heading.point, DATA.heading.text, "title", "middle");

      addRect(DATA.orchestrator.box, "card");
      addCircle(DATA.orchestrator.icon, "orchestrator-disc");
      addText(
        DATA.orchestrator.icon,
        DATA.orchestrator.mark,
        "orchestrator-letter",
        "middle"
      ).setAttribute(
        "dy",
        sy(DATA.orchestrator.icon.y + DATA.labelPadding) -
          sy(DATA.orchestrator.icon.y)
      );
      addText(
        DATA.orchestrator.label,
        DATA.orchestrator.title,
        "label",
        "start"
      );
      addText(
        DATA.orchestrator.detail,
        DATA.orchestrator.subtitle,
        "body",
        "start"
      );

      addArrow(DATA.writeArrow, "write-flow", "arrow-write");
      addText(
        DATA.writeArrow.label,
        DATA.writeArrow.labelText,
        "small",
        "middle"
      );

      addRect(DATA.report.box, "report");
      addRect(DATA.report.stripe, "report-accent", DATA.radius);
      addText(
        DATA.report.title,
        DATA.report.titleText,
        "label",
        "middle"
      );
      addText(
        DATA.report.path,
        DATA.report.pathText,
        "path",
        "middle"
      );
      addRect(DATA.report.statusBox, "status", DATA.radius);
      addText(
        DATA.report.statusText,
        DATA.report.status,
        "status-text",
        "middle"
      );
      addText(
        DATA.report.detail,
        DATA.report.detailText,
        "body",
        "middle"
      );

      DATA.readArrows.forEach(arrow => {
        addArrow(arrow, "flow", "arrow-read");
      });

      DATA.readers.forEach(reader => {
        addRect(reader.box, "card");
        addCircle(reader.icon, "icon-disc");
        addText(
          reader.icon,
          reader.mark,
          "icon-letter",
          "middle"
        ).setAttribute(
          "dy",
          sy(reader.icon.y + DATA.labelPadding) - sy(reader.icon.y)
        );
        addText(reader.label, reader.title, "label", "start");
        addText(reader.detail, reader.subtitle, "body", "start");
      });

      addText(DATA.footer.point, DATA.footer.text, "footer", "middle");

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать: оркестратор записывает итог задачи 482 в outputs/verification/482.json, а агент-ревьюер, CI и оператор читают этот же единственный файл.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
