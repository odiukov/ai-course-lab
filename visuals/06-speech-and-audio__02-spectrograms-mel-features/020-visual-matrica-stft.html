<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Матрица (998, 201)</title>
<style>
  :root { --bg:#ffffff; --fg:#1a1a1a; --muted:#6b6b6b; --grid:#c8c8c8; --accent:#c2410c; --accent2:#1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8e8e8; --muted:#9aa0a6; --grid:#3a3f47; --accent:#fb923c; --accent2:#7aa2ff; }
  }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); }
  .wrap { background:var(--bg); max-height:520px; }
  h3 { font:600 15px/1.3 system-ui,sans-serif; margin:0 0 6px; padding:8px 10px 0; color:var(--fg); }
  svg { display:block; width:100%; height:auto; max-height:492px; }
  text { font-family:system-ui,sans-serif; fill:var(--fg); }
  .mut { fill:var(--muted); }
  .fail { font:14px/1.5 system-ui,sans-serif; padding:10px; color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h3>Матрица (998, 201): строка — кадр, столбец — частота</h3>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById('host');
  try {
    // ---- данные схемы ----
    var FRAMES = 998;      // кадров по 10 ms
    var BINS   = 201;      // бинов от 0 до 8000 Hz
    var HZ_MAX = 8000;
    var HZ_STEP = 40;      // 16000 / 400
    var COL = 25;          // столбец 25 ≈ 1000 Hz
    var ROW = 400;         // произвольный кадр для подсветки строки

    // ---- холст (литералы: viewBox/размеры) ----
    var W = 900, H = 470;
    var FS = 13, FS_SM = 11, LW = 1.4, PAD = 6;

    // ---- один origin и один scale ----
    var origin = { x: 150, y: 360 };          // точка (0 кадр, 0 Hz)
    var scale  = { x: 0.62, y: -0.0378 };     // px на кадр, px на Hz (вверх)

    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y + y * scale.y; }

    // вспомогательное: перевод номера бина в Hz
    function binHz(i) { return i * HZ_STEP; }

    var svg = [];
    function el(s) { svg.push(s); }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function txt(x, y, s, anchor, cls, size) {
      el('<text x="' + x + '" y="' + y + '" text-anchor="' + anchor + '" class="' + (cls||'') +
         '" font-size="' + (size||FS) + '">' + esc(s) + '</text>');
    }

    // ---- поле матрицы: заливка «энергии» полосами ----
    var L = sx(0), R = sx(FRAMES), B = sy(0), T = sy(HZ_MAX);
    el('<rect x="' + L + '" y="' + T + '" width="' + (R - L) + '" height="' + (B - T) +
       '" fill="var(--grid)" fill-opacity="0.18" stroke="var(--muted)" stroke-width="' + LW + '"/>');

    // псевдо-энергия: горизонтальные полосы формант + вертикальные вспышки
    for (var i = 0; i < BINS; i += 4) {
      var hz = binHz(i);
      for (var f = 0; f < FRAMES; f += 16) {
        var e = Math.exp(-hz / 2600) * (0.55 + 0.45 * Math.sin(f / 70) * Math.cos(hz / 900 + f / 260));
        if (e <= 0.06) continue;
        var y0 = sy(hz), y1 = sy(binHz(i + 4));
        var x0 = sx(f), x1 = sx(f + 16);
        el('<rect x="' + x0 + '" y="' + Math.min(y0, y1) + '" width="' + (x1 - x0) +
           '" height="' + Math.abs(y1 - y0) + '" fill="var(--fg)" fill-opacity="' +
           (0.08 + 0.6 * Math.min(e, 1)).toFixed(3) + '"/>');
    } }

    // ---- подсвеченная строка (один кадр) ----
    var ry0 = sy(binHz(0)), ry1 = sy(binHz(BINS - 1));
    el('<rect x="' + sx(ROW) + '" y="' + ry1 + '" width="' + (sx(ROW + 14) - sx(ROW)) +
       '" height="' + (ry0 - ry1) + '" fill="none" stroke="var(--accent)" stroke-width="' + (LW * 1.6) + '"/>');

    // ---- подсвеченный столбец (одна частота, бин 25 ≈ 1000 Hz) ----
    var cy0 = sy(binHz(COL)), cy1 = sy(binHz(COL + 1));
    el('<rect x="' + sx(0) + '" y="' + Math.min(cy0, cy1) + '" width="' + (sx(FRAMES) - sx(0)) +
       '" height="' + Math.max(Math.abs(cy0 - cy1), 3) + '" fill="none" stroke="var(--accent2)" stroke-width="' + (LW * 1.6) + '"/>');

    // ---- ось времени (горизонталь) ----
    el('<line x1="' + sx(0) + '" y1="' + sy(0) + '" x2="' + sx(FRAMES) + '" y2="' + sy(0) +
       '" stroke="var(--fg)" stroke-width="' + LW + '"/>');
    [0, 998].forEach(function (t) {
      el('<line x1="' + sx(t) + '" y1="' + sy(0) + '" x2="' + sx(t) + '" y2="' + sy(-260) +
         '" stroke="var(--fg)" stroke-width="' + LW + '"/>');
      txt(sx(t), sy(-620), t + (t ? ' кадр' : ''), 'middle', 'mut', FS_SM);
    });
    txt(sx(FRAMES / 2), sy(-1550), 'время: 998 кадров по 10 ms', 'middle', '', FS);

    // ---- ось частоты (вертикаль) ----
    el('<line x1="' + sx(0) + '" y1="' + sy(0) + '" x2="' + sx(0) + '" y2="' + sy(HZ_MAX) +
       '" stroke="var(--fg)" stroke-width="' + LW + '"/>');
    [0, 1000, 8000].forEach(function (hz) {
      el('<line x1="' + sx(0) + '" y1="' + sy(hz) + '" x2="' + sx(-18) + '" y2="' + sy(hz) +
         '" stroke="var(--fg)" stroke-width="' + LW + '"/>');
      txt(sx(-26), sy(hz) + PAD * 0.7, hz + ' Hz', 'end', 'mut', FS_SM);
    });
    el('<text transform="translate(' + sx(-120) + ',' + sy(HZ_MAX / 2) + ') rotate(-90)" ' +
       'text-anchor="middle" font-size="' + FS + '">частота: 201 бин, шаг 40 Hz</text>');

    // ---- подпись строки: справа от поля, у хвоста короткой выноски ----
    var rowMidY = sy(HZ_MAX / 2);
    el('<line x1="' + sx(ROW + 14) + '" y1="' + rowMidY + '" x2="' + sx(FRAMES + 90) + '" y2="' + sy(HZ_MAX + 900) +
       '" stroke="var(--accent)" stroke-width="' + LW + '"/>');
    txt(sx(FRAMES + 100), sy(HZ_MAX + 900) - PAD, 'строка = 1 кадр:', 'start', '', FS_SM);
    txt(sx(FRAMES + 100), sy(HZ_MAX + 900) + PAD * 2, '25 ms → 201 число', 'start', 'mut', FS_SM);

    // ---- подпись столбца: справа, ниже, у хвоста своей выноски ----
    el('<line x1="' + sx(FRAMES) + '" y1="' + sy(binHz(COL)) + '" x2="' + sx(FRAMES + 90) + '" y2="' + sy(2400) +
       '" stroke="var(--accent2)" stroke-width="' + LW + '"/>');
    txt(sx(FRAMES + 100), sy(2400) - PAD, 'столбец 25 ≈ 1000 Hz:', 'start', '', FS_SM);
    txt(sx(FRAMES + 100), sy(2400) + PAD * 2, '998 кадров одной полосы', 'start', 'mut', FS_SM);

    // ---- нижняя строка: яркость и объём ----
    txt(sx(0), sy(-2100), 'яркость клетки = энергия', 'start', 'mut', FS_SM);
    txt(sx(FRAMES), sy(-2100), '998 × 201 ≈ 200 000 чисел (сырых сэмплов было 160 000)', 'end', 'mut', FS_SM);

    host.innerHTML =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H +
      '" preserveAspectRatio="xMidYMid meet" role="img" ' +
      'aria-label="Матрица 998 на 201: время по горизонтали, частота по вертикали">' +
      '<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="var(--bg)"/>' +
      svg.join('') + '</svg>';
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема: прямоугольник матрицы. По горизонтали — время, ' +
      '998 кадров по 10 ms. По вертикали — частота, 201 бин от 0 до 8000 Hz с шагом 40 Hz. ' +
      'Яркость клетки — энергия. Одна строка = один кадр 25 ms (201 число). ' +
      'Один столбец = бин 25 ≈ 1000 Hz на протяжении всех 998 кадров. ' +
      'Всего 998 × 201 ≈ 200 000 чисел против 160 000 сырых сэмплов.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
