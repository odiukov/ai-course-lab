<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три точки проверки в пути запроса</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5a657a;
      --line: #667085;
      --flow: #5268d8;
      --flow-soft: #edf0ff;
      --input: #e8f6ef;
      --input-stroke: #27865a;
      --output: #fff0e8;
      --output-stroke: #c45d2f;
      --model: #f0ecff;
      --model-stroke: #7054bf;
      --domain: #e8f4ff;
      --domain-stroke: #2475aa;
      --badge-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111522;
        --panel: #181e2d;
        --text: #edf1fa;
        --muted: #b1bbce;
        --line: #9aa6bd;
        --flow: #91a3ff;
        --flow-soft: #252d4c;
        --input: #18372b;
        --input-stroke: #66c99a;
        --output: #452a20;
        --output-stroke: #ef9a72;
        --model: #2d2748;
        --model-stroke: #b7a2ff;
        --domain: #18354a;
        --domain-stroke: #72bce9;
        --badge-text: #111522;
      }
    }

    html,
    body,
    figure,
    svg {
      background: var(--background);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      max-width: 1200px;
    }

    h1 {
      font-size: 22px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      font-family: inherit;
    }

    .frame {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .card {
      stroke-width: 2px;
    }

    .user-in {
      fill: var(--input);
      stroke: var(--input-stroke);
    }

    .gate-in {
      fill: var(--flow-soft);
      stroke: var(--input-stroke);
    }

    .model {
      fill: var(--model);
      stroke: var(--model-stroke);
    }

    .gate-out {
      fill: var(--flow-soft);
      stroke: var(--output-stroke);
    }

    .user-out {
      fill: var(--output);
      stroke: var(--output-stroke);
    }

    .domain {
      fill: var(--domain);
      stroke: var(--domain-stroke);
      stroke-width: 3px;
    }

    .flow-line {
      fill: none;
      stroke: var(--flow);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .flow-head {
      fill: var(--flow);
      stroke: none;
    }

    .domain-link {
      fill: none;
      stroke: var(--domain-stroke);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .domain-dot {
      fill: var(--domain-stroke);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .badge-in {
      fill: var(--input-stroke);
    }

    .badge-out {
      fill: var(--output-stroke);
    }

    .badge-domain {
      fill: var(--domain-stroke);
    }

    .badge-number {
      fill: var(--badge-text);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .primary {
      fill: var(--text);
      font-size: 20px;
      font-weight: bold;
      text-anchor: middle;
    }

    .secondary {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .action {
      fill: var(--text);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .domain-title {
      fill: var(--text);
      font-size: 19px;
      font-weight: bold;
      text-anchor: start;
    }

    .domain-copy {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: start;
    }

    .domain-note {
      fill: var(--domain-stroke);
      font-size: 12px;
      font-weight: bold;
      text-anchor: end;
    }

    .fallback {
      fill: var(--text);
      font-size: 16px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Три точки проверки в пути запроса</h1>
    <svg
      id="diagram"
      viewBox="0 0 1200 420"
      width="1200"
      height="420"
      role="img"
      aria-label="Цепочка пользователь, проверка входа, модель, проверка выхода, пользователь. Доменные правила связаны с обеими проверками."
    >
      <desc>
        Проверка входа стоит до модели, проверка выхода — после модели,
        а доменные правила продукта применяются в обеих точках.
      </desc>
      <g id="art"></g>
    </svg>
  </figure>

  <script>
    const data = [
      {
        kind: "meta",
        ns: "http://www.w3.org/2000/svg",
        zero: 0,
        fallback: {
          x: 600,
          y: 190,
          text: "Схема: пользователь → проверка входа → модель → проверка выхода → пользователь; доменные правила действуют в обеих точках."
        }
      },
      {
        kind: "frame",
        from: { x: 16, y: 18 },
        to: { x: 1184, y: 405 },
        className: "frame"
      },
      {
        kind: "connector",
        points: [
          { x: 347.5, y: 320 },
          { x: 347.5, y: 285 }
        ],
        className: "domain-link"
      },
      {
        kind: "connector",
        points: [
          { x: 852.5, y: 320 },
          { x: 852.5, y: 285 }
        ],
        className: "domain-link"
      },
      {
        kind: "arrow",
        from: { x: 200, y: 190 },
        to: { x: 265, y: 190 },
        head: [
          { x: 265, y: 190 },
          { x: 251, y: 181 },
          { x: 251, y: 199 }
        ]
      },
      {
        kind: "arrow",
        from: { x: 430, y: 190 },
        to: { x: 495, y: 190 },
        head: [
          { x: 495, y: 190 },
          { x: 481, y: 181 },
          { x: 481, y: 199 }
        ]
      },
      {
        kind: "arrow",
        from: { x: 705, y: 190 },
        to: { x: 770, y: 190 },
        head: [
          { x: 770, y: 190 },
          { x: 756, y: 181 },
          { x: 756, y: 199 }
        ]
      },
      {
        kind: "arrow",
        from: { x: 935, y: 190 },
        to: { x: 1000, y: 190 },
        head: [
          { x: 1000, y: 190 },
          { x: 986, y: 181 },
          { x: 986, y: 199 }
        ]
      },
      {
        kind: "card",
        from: { x: 30, y: 125 },
        to: { x: 200, y: 255 },
        className: "card user-in"
      },
      {
        kind: "card",
        from: { x: 265, y: 95 },
        to: { x: 430, y: 285 },
        className: "card gate-in"
      },
      {
        kind: "card",
        from: { x: 495, y: 125 },
        to: { x: 705, y: 255 },
        className: "card model"
      },
      {
        kind: "card",
        from: { x: 770, y: 95 },
        to: { x: 935, y: 285 },
        className: "card gate-out"
      },
      {
        kind: "card",
        from: { x: 1000, y: 125 },
        to: { x: 1170, y: 255 },
        className: "card user-out"
      },
      {
        kind: "card",
        from: { x: 250, y: 320 },
        to: { x: 950, y: 392 },
        className: "domain"
      },
      {
        kind: "dot",
        center: { x: 347.5, y: 302 },
        radius: 7,
        className: "domain-dot"
      },
      {
        kind: "dot",
        center: { x: 852.5, y: 302 },
        radius: 7,
        className: "domain-dot"
      },
      {
        kind: "badge",
        center: { x: 290, y: 120 },
        radius: 17,
        className: "badge-in",
        number: "1",
        numberAt: { x: 290, y: 125 }
      },
      {
        kind: "badge",
        center: { x: 795, y: 120 },
        radius: 17,
        className: "badge-out",
        number: "2",
        numberAt: { x: 795, y: 125 }
      },
      {
        kind: "badge",
        center: { x: 278, y: 346 },
        radius: 17,
        className: "badge-domain",
        number: "3",
        numberAt: { x: 278, y: 351 }
      },
      {
        kind: "label",
        at: { x: 115, y: 159 },
        text: "ПОЛЬЗОВАТЕЛЬ",
        className: "eyebrow"
      },
      {
        kind: "label",
        at: { x: 115, y: 198 },
        text: "Запрос",
        className: "primary"
      },
      {
        kind: "label",
        at: { x: 115, y: 225 },
        text: "то, что отправлено",
        className: "secondary"
      },
      {
        kind: "label",
        at: { x: 347.5, y: 153 },
        text: "ПРОВЕРКА ВХОДА",
        className: "eyebrow"
      },
      {
        kind: "label",
        at: { x: 347.5, y: 192 },
        text: "До модели",
        className: "primary"
      },
      {
        kind: "label",
        at: { x: 347.5, y: 221 },
        text: "проверяет запрос",
        className: "secondary"
      },
      {
        kind: "label",
        at: { x: 347.5, y: 254 },
        text: "стоп • уточнить • вручную",
        className: "action"
      },
      {
        kind: "label",
        at: { x: 600, y: 159 },
        text: "МОДЕЛЬ",
        className: "eyebrow"
      },
      {
        kind: "label",
        at: { x: 600, y: 198 },
        text: "Генерация",
        className: "primary"
      },
      {
        kind: "label",
        at: { x: 600, y: 225 },
        text: "может добавить лишнее",
        className: "secondary"
      },
      {
        kind: "label",
        at: { x: 852.5, y: 153 },
        text: "ПРОВЕРКА ВЫХОДА",
        className: "eyebrow"
      },
      {
        kind: "label",
        at: { x: 852.5, y: 192 },
        text: "После модели",
        className: "primary"
      },
      {
        kind: "label",
        at: { x: 852.5, y: 221 },
        text: "до показа ответа",
        className: "secondary"
      },
      {
        kind: "label",
        at: { x: 852.5, y: 254 },
        text: "скрыть • исправить • вручную",
        className: "action"
      },
      {
        kind: "label",
        at: { x: 1085, y: 159 },
        text: "ПОЛЬЗОВАТЕЛЬ",
        className: "eyebrow"
      },
      {
        kind: "label",
        at: { x: 1085, y: 198 },
        text: "Ответ",
        className: "primary"
      },
      {
        kind: "label",
        at: { x: 1085, y: 225 },
        text: "только после проверки",
        className: "secondary"
      },
      {
        kind: "label",
        at: { x: 232.5, y: 174 },
        text: "запрос",
        className: "arrow-label"
      },
      {
        kind: "label",
        at: { x: 462.5, y: 213 },
        text: "в модель",
        className: "arrow-label"
      },
      {
        kind: "label",
        at: { x: 737.5, y: 174 },
        text: "ответ",
        className: "arrow-label"
      },
      {
        kind: "label",
        at: { x: 967.5, y: 213 },
        text: "к показу",
        className: "arrow-label"
      },
      {
        kind: "label",
        at: { x: 310, y: 350 },
        text: "Доменные правила продукта",
        className: "domain-title"
      },
      {
        kind: "label",
        at: { x: 310, y: 376 },
        text: "роль сервиса • возраст аудитории • доступные действия",
        className: "domain-copy"
      },
      {
        kind: "label",
        at: { x: 925, y: 350 },
        text: "применяются в обеих точках",
        className: "domain-note"
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = 1;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const meta = data.find(item => item.kind === "meta");
    const art = document.getElementById("art");

    function make(tag, attributes, className, text) {
      const node = document.createElementNS(meta.ns, tag);

      Object.entries(attributes).forEach(([name, value]) => {
        node.setAttribute(name, String(value));
      });

      if (className) {
        node.setAttribute("class", className);
      }

      if (text) {
        node.textContent = text;
      }

      return node;
    }

    function rectangle(item) {
      return make("rect", {
        x: sx(item.from.x),
        y: sy(item.from.y),
        width: sx(item.to.x) - sx(item.from.x),
        height: sy(item.to.y) - sy(item.from.y)
      }, item.className);
    }

    function circle(item) {
      return make("circle", {
        cx: sx(item.center.x),
        cy: sy(item.center.y),
        r: sx(item.radius) - sx(meta.zero)
      }, item.className);
    }

    function points(items) {
      return items.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");
    }

    try {
      data.filter(item => item.kind === "frame").forEach(item => {
        art.append(rectangle(item));
      });

      data.filter(item => item.kind === "connector").forEach(item => {
        art.append(make("polyline", {
          points: points(item.points)
        }, item.className));
      });

      data.filter(item => item.kind === "arrow").forEach(item => {
        art.append(make("line", {
          x1: sx(item.from.x),
          y1: sy(item.from.y),
          x2: sx(item.to.x),
          y2: sy(item.to.y)
        }, "flow-line"));

        art.append(make("polygon", {
          points: points(item.head)
        }, "flow-head"));
      });

      data.filter(item => item.kind === "card").forEach(item => {
        art.append(rectangle(item));
      });

      data.filter(item => item.kind === "dot").forEach(item => {
        art.append(circle(item));
      });

      data.filter(item => item.kind === "badge").forEach(item => {
        art.append(circle(item));
        art.append(make("text", {
          x: sx(item.numberAt.x),
          y: sy(item.numberAt.y)
        }, "badge-number", item.number));
      });

      data.filter(item => item.kind === "label").forEach(item => {
        art.append(make("text", {
          x: sx(item.at.x),
          y: sy(item.at.y)
        }, item.className, item.text));
      });
    } catch (error) {
      art.replaceChildren(
        make("text", {
          x: sx(meta.fallback.x),
          y: sy(meta.fallback.y)
        }, "fallback", meta.fallback.text)
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
