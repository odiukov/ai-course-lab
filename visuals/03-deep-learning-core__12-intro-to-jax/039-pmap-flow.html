<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Батч на восьми устройствах</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #566078;
      --line: #77829a;
      --flow: #5967d8;
      --flow-soft: #e9ebff;
      --batch: #fff1c7;
      --batch-line: #b87800;
      --shard: #e5f4ff;
      --shard-line: #2978a8;
      --meet: #eee8ff;
      --meet-line: #7755c7;
      --result: #dcf6e7;
      --result-line: #238454;
      --slot-a: #ffcc66;
      --slot-b: #ffd98c;
      --shadow: #d9deea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111522;
        --panel: #171c2b;
        --text: #f1f4ff;
        --muted: #b6bed2;
        --line: #8994ad;
        --flow: #9aa5ff;
        --flow-soft: #292e58;
        --batch: #493918;
        --batch-line: #f0bd57;
        --shard: #17364b;
        --shard-line: #69b8e8;
        --meet: #332650;
        --meet-line: #b59aea;
        --result: #173d2d;
        --result-line: #64d99b;
        --slot-a: #dca83e;
        --slot-b: #b98227;
        --shadow: #0b0e17;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--shadow);
      overflow: hidden;
    }

    .figure-title {
      margin: unset;
      padding: 12px 20px 8px;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
    }

    .batch-box {
      fill: var(--batch);
      stroke: var(--batch-line);
      stroke-width: 2px;
    }

    .batch-slot {
      stroke: var(--batch-line);
      stroke-width: 1px;
    }

    .batch-slot-a {
      fill: var(--slot-a);
    }

    .batch-slot-b {
      fill: var(--slot-b);
    }

    .device-box {
      fill: var(--panel);
      stroke: var(--shard-line);
      stroke-width: 2px;
    }

    .shard-box {
      fill: var(--shard);
      stroke: var(--shard-line);
      stroke-width: 1px;
    }

    .collector-box {
      fill: var(--meet);
      stroke: var(--meet-line);
      stroke-width: 2px;
    }

    .result-box {
      fill: var(--result);
      stroke: var(--result-line);
      stroke-width: 2px;
    }

    .flow-line {
      fill: none;
      stroke: var(--flow);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow-head {
      fill: var(--flow);
      stroke: var(--flow);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .device-rule {
      stroke: var(--shadow);
      stroke-width: 1px;
    }

    text {
      fill: var(--text);
      dominant-baseline: middle;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .batch-label {
      font-size: 18px;
      font-weight: bold;
    }

    .device-label {
      font-size: 13px;
      font-weight: bold;
    }

    .portion-label {
      font-size: 13px;
      font-weight: bold;
    }

    .gradient-label {
      font-size: 12px;
      fill: var(--muted);
    }

    .annotation {
      font-size: 14px;
      fill: var(--muted);
    }

    .code-label {
      font-size: 17px;
      font-weight: bold;
    }

    .collector-label {
      font-size: 14px;
      fill: var(--muted);
    }

    .result-label {
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      padding: 20px;
      font-size: 16px;
      color: var(--text);
      background: var(--panel);
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <h2 class="figure-title" id="figure-title">Батч на восьми устройствах</h2>

    <svg
      id="diagram"
      viewBox="0 0 1120 448"
      width="1120"
      height="448"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="figure-title diagram-description"
    >
      <desc id="diagram-description">
        Батч из 1024 примеров делится между 8 устройствами на порции по
        128 примеров. Устройства независимо вычисляют градиенты, после чего
        pmean усредняет их для одного согласованного шага.
      </desc>
      <g id="drawing"></g>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Батч из 1024 примеров делится на 8 порций по 128. Каждое устройство
      вычисляет свой градиент, а pmean объединяет их в один средний градиент
      для согласованного шага.
    </div>
  </main>

  <script>
    const diagramData = [{
      zero: 0,
      originX: 24,
      originY: 8,
      scaleX: 1,
      scaleY: 1,

      batch: { x: 330, y: 6, w: 400, h: 56, r: 12 },
      batchTextY: 25,
      slotY: 42,
      slotW: 38,
      slotH: 8,
      slotR: 3,
      slotStart: 353,

      busY: 102,
      busStartX: 76,
      busEndX: 1000,
      formulaX: 16,
      formulaY: 91,
      pmapX: 550,
      pmapY: 88,
      labelGap: 14,

      cardY: 126,
      cardW: 120,
      cardH: 92,
      cardR: 10,
      cardTitleY: 145,
      shardY: 158,
      shardInset: 10,
      shardH: 28,
      shardR: 6,
      gradientY: 203,

      collector: { x: 54, y: 282, w: 968, h: 62, r: 12 },
      collectorCodeY: 300,
      collectorTextY: 324,

      result: { x: 280, y: 382, w: 500, h: 46, r: 12 },
      resultTextY: 405,

      arrowHead: 8,
      arrowHalf: 5,
      batchArrowStartY: 62,
      cardArrowStartY: 218,
      outputArrowStartY: 344,

      labels: {
        batch: "Батч: 1024 примера",
        formula: "1024 = 8 × 128",
        pmap: "pmap делит батч по оси устройств",
        device: "Устройство",
        portion: "128 примеров",
        gradient: "свой градиент ∇",
        code: "pmean(…, axis_name=\"devices\")",
        collector: "точка встречи: среднее 8 градиентов",
        result: "Один средний градиент → согласованный шаг"
      },

      devices: [
        { x: 16, center: 76, slotX: 353, slotClass: "batch-slot-a" },
        { x: 148, center: 208, slotX: 397, slotClass: "batch-slot-b" },
        { x: 280, center: 340, slotX: 441, slotClass: "batch-slot-a" },
        { x: 412, center: 472, slotX: 485, slotClass: "batch-slot-b" },
        { x: 544, center: 604, slotX: 529, slotClass: "batch-slot-a" },
        { x: 676, center: 736, slotX: 573, slotClass: "batch-slot-b" },
        { x: 808, center: 868, slotX: 617, slotClass: "batch-slot-a" },
        { x: 940, center: 1000, slotX: 661, slotClass: "batch-slot-b" }
      ]
    }];

    const [d] = diagramData;
    const origin = Object.freeze({ x: d.originX, y: d.originY });
    const scale = Object.freeze({ x: d.scaleX, y: d.scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const drawing = document.getElementById("drawing");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function node(name, attributes, parent = drawing) {
      const element = document.createElementNS(namespace, name);

      for (const [key, value] of Object.entries(attributes)) {
        element.setAttribute(key, value);
      }

      parent.appendChild(element);
      return element;
    }

    function roundedRect(box, className) {
      return node("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        rx: sx(box.r) - sx(d.zero),
        ry: sy(box.r) - sy(d.zero),
        class: className
      });
    }

    function line(xStart, yStart, xEnd, yEnd, className) {
      return node("line", {
        x1: sx(xStart),
        y1: sy(yStart),
        x2: sx(xEnd),
        y2: sy(yEnd),
        class: className
      });
    }

    function label(value, x, y, className, anchor) {
      const element = node("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      });

      element.textContent = value;
      return element;
    }

    function downArrow(x, yStart, yEnd) {
      line(x, yStart, x, yEnd - d.arrowHead, "flow-line");

      const points = [
        { x: x, y: yEnd },
        { x: x - d.arrowHalf, y: yEnd - d.arrowHead },
        { x: x + d.arrowHalf, y: yEnd - d.arrowHead }
      ];

      node("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: "flow-head"
      });
    }

    function render() {
      roundedRect(d.batch, "batch-box");

      for (const device of d.devices) {
        roundedRect({
          x: device.slotX,
          y: d.slotY,
          w: d.slotW,
          h: d.slotH,
          r: d.slotR
        }, `batch-slot ${device.slotClass}`);
      }

      label(
        d.labels.batch,
        d.batch.x + d.batch.w / d.scaleX / (d.scaleX + d.scaleX),
        d.batchTextY,
        "batch-label",
        "middle"
      );

      downArrow(
        d.batch.x + d.batch.w / d.scaleX / (d.scaleX + d.scaleX),
        d.batchArrowStartY,
        d.busY
      );

      line(d.busStartX, d.busY, d.busEndX, d.busY, "flow-line");

      label(
        d.labels.formula,
        d.formulaX,
        d.formulaY,
        "annotation",
        "start"
      );

      label(
        d.labels.pmap,
        d.pmapX + d.labelGap,
        d.pmapY,
        "annotation",
        "start"
      );

      for (const device of d.devices) {
        downArrow(device.center, d.busY, d.cardY);

        roundedRect({
          x: device.x,
          y: d.cardY,
          w: d.cardW,
          h: d.cardH,
          r: d.cardR
        }, "device-box");

        label(
          d.labels.device,
          device.center,
          d.cardTitleY,
          "device-label",
          "middle"
        );

        roundedRect({
          x: device.x + d.shardInset,
          y: d.shardY,
          w: d.cardW - d.shardInset - d.shardInset,
          h: d.shardH,
          r: d.shardR
        }, "shard-box");

        label(
          d.labels.portion,
          device.center,
          d.shardY + d.shardH / d.scaleY / (d.scaleY + d.scaleY),
          "portion-label",
          "middle"
        );

        line(
          device.x + d.shardInset,
          d.shardY + d.shardH + d.shardInset,
          device.x + d.cardW - d.shardInset,
          d.shardY + d.shardH + d.shardInset,
          "device-rule"
        );

        label(
          d.labels.gradient,
          device.center,
          d.gradientY,
          "gradient-label",
          "middle"
        );

        downArrow(
          device.center,
          d.cardArrowStartY,
          d.collector.y
        );
      }

      roundedRect(d.collector, "collector-box");

      label(
        d.labels.code,
        d.collector.x + d.collector.w / d.scaleX / (d.scaleX + d.scaleX),
        d.collectorCodeY,
        "code-label",
        "middle"
      );

      label(
        d.labels.collector,
        d.collector.x + d.collector.w / d.scaleX / (d.scaleX + d.scaleX),
        d.collectorTextY,
        "collector-label",
        "middle"
      );

      downArrow(
        d.result.x + d.result.w / d.scaleX / (d.scaleX + d.scaleX),
        d.outputArrowStartY,
        d.result.y
      );

      roundedRect(d.result, "result-box");

      label(
        d.labels.result,
        d.result.x + d.result.w / d.scaleX / (d.scaleX + d.scaleX),
        d.resultTextY,
        "result-label",
        "middle"
      );
    }

    try {
      render();
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
