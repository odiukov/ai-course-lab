<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обновление массива без мутации</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --surface: #ffffff;
      --surface-soft: #f1f4fa;
      --text: #172033;
      --muted: #58647a;
      --line: #9aa7bb;
      --line-strong: #607089;
      --code-bg: #e9eef8;
      --source-fill: #fff4cf;
      --source-stroke: #b27a00;
      --result-fill: #dcf8e8;
      --result-stroke: #16804b;
      --accent: #315bd6;
      --accent-soft: #e6edff;
      --shadow: #d8deea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111725;
        --surface: #192132;
        --surface-soft: #202a3e;
        --text: #eef3ff;
        --muted: #b4bfd3;
        --line: #69778e;
        --line-strong: #a6b3c8;
        --code-bg: #27324a;
        --source-fill: #493b17;
        --source-stroke: #f0bd46;
        --result-fill: #153f2d;
        --result-stroke: #5bd49a;
        --accent: #87a5ff;
        --accent-soft: #25365f;
        --shadow: #0b0f18;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
    }

    h1 {
      box-sizing: border-box;
      max-width: 1000px;
      margin: 0 auto;
      padding: 18px 20px 10px;
      font-size: 24px;
      line-height: 1.2;
    }

    .figure {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--page);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--page);
      font-family: inherit;
    }

    .frame {
      fill: var(--surface);
      stroke: var(--shadow);
      stroke-width: 2px;
    }

    .array-shell {
      fill: var(--surface-soft);
      stroke: var(--line-strong);
      stroke-width: 2px;
    }

    .cell-separator {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
    }

    .source-target {
      fill: var(--source-fill);
      stroke: var(--source-stroke);
      stroke-width: 2px;
    }

    .result-target {
      fill: var(--result-fill);
      stroke: var(--result-stroke);
      stroke-width: 2px;
    }

    .operation {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .arrow,
    .leader {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--line-strong);
      stroke: none;
    }

    .leader-dot {
      fill: var(--line-strong);
      stroke: none;
    }

    .note-source {
      fill: var(--source-fill);
      stroke: var(--source-stroke);
      stroke-width: 2px;
    }

    .note-result {
      fill: var(--result-fill);
      stroke: var(--result-stroke);
      stroke-width: 2px;
    }

    .heading {
      fill: var(--muted);
      font-size: 18px;
      font-weight: bold;
    }

    .cell-value {
      fill: var(--text);
      font-size: 28px;
      font-weight: bold;
    }

    .operation-text {
      fill: var(--text);
      font-size: 19px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: bold;
    }

    .selection-label {
      fill: var(--source-stroke);
      font-size: 16px;
      font-weight: bold;
    }

    .note-title {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .note-array {
      fill: var(--text);
      font-size: 19px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .fallback {
      box-sizing: border-box;
      max-width: 1000px;
      margin: 0 auto;
      padding: 22px;
      background: var(--surface);
      color: var(--text);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Обновление массива без мутации</h1>

  <main class="figure">
    <svg
      id="diagram"
      viewBox="0 0 1000 390"
      width="1000"
      height="390"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Исходный и обновлённый массивы</title>
      <desc id="svg-description">
        Массив [1, 2, 3] остаётся прежним. Операция a.at[0].set(5)
        возвращает новый массив [5, 2, 3].
      </desc>
    </svg>

    <div id="fallback" class="fallback" hidden>
      Исходный массив [1, 2, 3] остаётся прежним, а операция
      a.at[0].set(5) создаёт новый массив [5, 2, 3].
    </div>
  </main>

  <script>
    const diagramData = Object.freeze({
      source: Object.freeze([1, 2, 3]),
      result: Object.freeze([5, 2, 3]),
      operation: Object.freeze({
        index: 0,
        value: 5,
        text: "a.at[0].set(5)"
      }),
      layout: Object.freeze({
        zero: 0,
        originX: 20,
        originY: 15,
        scaleX: 10,
        scaleY: 10,
        frame: Object.freeze({ x1: 0, y1: 0, x2: 96, y2: 36 }),
        radius: 1.2,
        cellRadius: 0.7,
        cellInset: 0.45,
        source: Object.freeze({
          x1: 4,
          y1: 8,
          x2: 34,
          y2: 18,
          cell: 10,
          centerY: 13
        }),
        operationBox: Object.freeze({
          x1: 38,
          y1: 10,
          x2: 59,
          y2: 16
        }),
        result: Object.freeze({
          x1: 64,
          y1: 8,
          x2: 94,
          y2: 18,
          cell: 10,
          centerY: 13
        }),
        headings: Object.freeze({
          source: Object.freeze({ x: 19, y: 6, offset: -1 }),
          operation: Object.freeze({ x: 48.5, y: 8, offset: -1 }),
          result: Object.freeze({ x: 79, y: 6, offset: -1 })
        }),
        selectedLabel: Object.freeze({
          x: 9,
          y: 19,
          offset: 1
        }),
        arrows: Object.freeze([
          Object.freeze({
            from: Object.freeze({ x: 34.5, y: 13 }),
            to: Object.freeze({ x: 37.5, y: 13 })
          }),
          Object.freeze({
            from: Object.freeze({ x: 59.5, y: 13 }),
            to: Object.freeze({ x: 63.5, y: 13 })
          })
        ]),
        arrowHeadX: 0.9,
        arrowHeadY: 0.65,
        sourceLeader: Object.freeze({
          from: Object.freeze({ x: 19, y: 18.5 }),
          to: Object.freeze({ x: 19, y: 26 })
        }),
        resultLeader: Object.freeze({
          from: Object.freeze({ x: 79, y: 18.5 }),
          to: Object.freeze({ x: 79, y: 26 })
        }),
        dotRadius: 0.28,
        sourceNote: Object.freeze({
          x1: 4,
          y1: 26,
          x2: 45,
          y2: 34.5,
          title: Object.freeze({ x: 24.5, y: 29 }),
          array: Object.freeze({ x: 24.5, y: 32.3 })
        }),
        resultNote: Object.freeze({
          x1: 53,
          y1: 26,
          x2: 94,
          y2: 34.5,
          title: Object.freeze({ x: 73.5, y: 29 }),
          array: Object.freeze({ x: 73.5, y: 32.3 })
        })
      })
    });

    const canvas = Object.freeze({ width: 1000, height: 390 });
    const labelPadding = 8;
    const lineWidth = Object.freeze({ thin: 2, strong: 3 });
    const fontSize = Object.freeze({
      heading: 18,
      value: 28,
      operation: 19,
      note: 17
    });

    const origin = Object.freeze({
      x: diagramData.layout.originX,
      y: diagramData.layout.originY
    });

    const scale = Object.freeze({
      x: diagramData.layout.scaleX,
      y: diagramData.layout.scaleY
    });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const D = diagramData.layout;
      const NS = "http://www.w3.org/2000/svg";

      function make(tag, attributes, content) {
        const element = document.createElementNS(NS, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      }

      function drawRect(parent, box, className, radius) {
        const element = make("rect", {
          x: sx(box.x1),
          y: sy(box.y1),
          width: sx(box.x2) - sx(box.x1),
          height: sy(box.y2) - sy(box.y1),
          rx: sx(radius) - sx(D.zero),
          ry: sy(radius) - sy(D.zero),
          class: className
        });

        parent.appendChild(element);
        return element;
      }

      function drawLine(parent, from, to, className) {
        const element = make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        });

        parent.appendChild(element);
        return element;
      }

      function drawText(parent, point, content, className, anchor, offset) {
        const element = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          dy: offset * labelPadding,
          "text-anchor": anchor,
          "dominant-baseline": "middle",
          class: className
        }, content);

        parent.appendChild(element);
        return element;
      }

      function drawArray(parent, values, row, selectedClass) {
        const group = make("g", {
          "aria-label": values.join(", ")
        });

        drawRect(group, row, "array-shell", D.radius);

        values.forEach((value, index) => {
          const cellX1 = row.x1 + index * row.cell;
          const cellX2 = cellX1 + row.cell;

          if (index === diagramData.operation.index) {
            drawRect(group, {
              x1: cellX1 + D.cellInset,
              y1: row.y1 + D.cellInset,
              x2: cellX2 - D.cellInset,
              y2: row.y2 - D.cellInset
            }, selectedClass, D.cellRadius);
          }

          if (index !== D.zero) {
            drawLine(group, {
              x: cellX1,
              y: row.y1
            }, {
              x: cellX1,
              y: row.y2
            }, "cell-separator");
          }

          drawText(group, {
            x: cellX1 + row.cell / diagramData.source.length,
            y: row.centerY
          }, String(value), "cell-value", "middle", D.zero);
        });

        parent.appendChild(group);
      }

      function drawArrow(parent, arrow) {
        drawLine(parent, arrow.from, arrow.to, "arrow");

        const points = [
          `${sx(arrow.to.x)},${sy(arrow.to.y)}`,
          `${sx(arrow.to.x - D.arrowHeadX)},${sy(arrow.to.y - D.arrowHeadY)}`,
          `${sx(arrow.to.x - D.arrowHeadX)},${sy(arrow.to.y + D.arrowHeadY)}`
        ].join(" ");

        parent.appendChild(make("polygon", {
          points,
          class: "arrow-head"
        }));
      }

      function drawLeader(parent, leader) {
        drawLine(parent, leader.from, leader.to, "leader");

        parent.appendChild(make("circle", {
          cx: sx(leader.from.x),
          cy: sy(leader.from.y),
          r: sx(D.dotRadius) - sx(D.zero),
          class: "leader-dot"
        }));
      }

      const scene = make("g", {
        "aria-label": "Схема создания новой версии массива"
      });

      drawRect(scene, D.frame, "frame", D.radius);

      drawText(
        scene,
        D.headings.source,
        "исходный массив",
        "heading",
        "middle",
        D.headings.source.offset
      );

      drawText(
        scene,
        D.headings.operation,
        "точечная замена",
        "heading",
        "middle",
        D.headings.operation.offset
      );

      drawText(
        scene,
        D.headings.result,
        "новый массив",
        "heading",
        "middle",
        D.headings.result.offset
      );

      drawArray(
        scene,
        diagramData.source,
        D.source,
        "source-target"
      );

      drawRect(
        scene,
        D.operationBox,
        "operation",
        D.radius
      );

      drawText(scene, {
        x: (D.operationBox.x1 + D.operationBox.x2) / diagramData.source.length,
        y: (D.operationBox.y1 + D.operationBox.y2) / diagramData.source.length
      }, diagramData.operation.text, "operation-text", "middle", D.zero);

      drawArray(
        scene,
        diagramData.result,
        D.result,
        "result-target"
      );

      D.arrows.forEach((arrow) => {
        drawArrow(scene, arrow);
      });

      drawText(
        scene,
        D.selectedLabel,
        "выбран индекс 0",
        "selection-label",
        "middle",
        D.selectedLabel.offset
      );

      drawLeader(scene, D.sourceLeader);
      drawLeader(scene, D.resultLeader);

      drawRect(
        scene,
        D.sourceNote,
        "note-source",
        D.radius
      );

      drawText(
        scene,
        D.sourceNote.title,
        "исходник остаётся прежним",
        "note-title",
        "middle",
        D.zero
      );

      drawText(
        scene,
        D.sourceNote.array,
        "[1, 2, 3]",
        "note-array",
        "middle",
        D.zero
      );

      drawRect(
        scene,
        D.resultNote,
        "note-result",
        D.radius
      );

      drawText(
        scene,
        D.resultNote.title,
        "возвращается новая версия",
        "note-title",
        "middle",
        D.zero
      );

      drawText(
        scene,
        D.resultNote.array,
        "[5, 2, 3]",
        "note-array",
        "middle",
        D.zero
      );

      svg.appendChild(scene);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Массив [1, 2, 3] остаётся прежним, а операция " +
        "a.at[0].set(5) создаёт результат [5, 2, 3].";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
