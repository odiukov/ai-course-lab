<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Путь от высокой потери ко дну</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1b2330; --muted:#5b6676;
    --curve:#94a3b8; --path:#c2410c; --dot:#c2410c;
    --start:#1d4ed8; --min:#047857; --axis:#8b97a8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11161d; --ink:#e6ecf3; --muted:#9aa7b8;
      --curve:#4b5768; --path:#fb923c; --dot:#fb923c;
      --start:#7dabff; --min:#4ade80; --axis:#5a6676;
    }
  }
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  figure{margin:0;padding:10px 12px 12px;background:var(--bg);}
  figcaption{font-size:15px;font-weight:600;margin-bottom:6px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  text{font-family:inherit;fill:var(--ink);}
  .muted{fill:var(--muted);}
  .fallback{font-size:14px;line-height:1.5;color:var(--ink);}
</style>
<figure>
  <figcaption>Путь от высокой потери ко дну</figcaption>
  <svg id="plot" viewBox="0 0 720 360" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Склон функции потерь: старт наверху, шаги против градиента, минимум внизу"></svg>
  <div id="fb" class="fallback" hidden></div>
</figure>
<script>
(function(){
  var svg=document.getElementById("plot");
  try{
    /* ---------- данные схемы ---------- */
    var D={
      curve:{a:1,b:0.35,w:3},              // L(x)=a*x^2 + b*sin(w*x)
      xMin:-3.2,xMax:3.0,yMin:-0.5,yMax:11,
      start:-3.0,lr:0.115,steps:9,
      sample:0.05,
      leader:{x:1.25,y:0.55}               // точка выноски подписи «дно»
    };
    /* ---------- холст ---------- */
    var VB={w:720,h:360},PAD={l:100,r:32,t:40,b:33};
    var FS=13,LW=1.6,OFF=9,HEAD={len:11,half:4.5},R=3.6;

    /* ---------- единственный перевод координат ---------- */
    var scale={x:(VB.w-PAD.l-PAD.r)/(D.xMax-D.xMin),
               y:(VB.h-PAD.t-PAD.b)/(D.yMax-D.yMin)};
    var origin={x:PAD.l-D.xMin*scale.x, y:(VB.h-PAD.b)+D.yMin*scale.y};
    function sx(x){return origin.x+x*scale.x;}
    function sy(y){return origin.y-y*scale.y;}

    /* ---------- модель склона ---------- */
    function L(x){return D.curve.a*x*x+D.curve.b*Math.sin(D.curve.w*x);}
    function g(x){return 2*D.curve.a*x+D.curve.b*D.curve.w*Math.cos(D.curve.w*x);}

    /* ---------- рисование ---------- */
    var NS="http://www.w3.org/2000/svg";
    function add(tag,attrs,txt){
      var e=document.createElementNS(NS,tag);
      for(var k in attrs) e.setAttribute(k,attrs[k]);
      if(txt!=null) e.textContent=txt;
      svg.appendChild(e); return e;
    }
    function line(x1,y1,x2,y2,color,w){
      add("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
        stroke:color,"stroke-width":w||LW,"stroke-linecap":"round"});
    }
    function label(x,y,dx,dy,anchor,txt,cls){
      add("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,
        "font-size":FS,class:cls||""},txt);
    }
    // наконечник: пиксельная форма, но все вершины — через sx/sy
    function arrowHead(x,y,dx,dy,color){
      var vx=dx*scale.x, vy=-dy*scale.y, len=Math.hypot(vx,vy);
      if(!len) return;
      var ux=vx/len, uy=vy/len, nx=-uy, ny=ux, p=[];
      function corner(sgn){
        var ox=-ux*HEAD.len+sgn*nx*HEAD.half,
            oy=-uy*HEAD.len+sgn*ny*HEAD.half;
        return sx(x+ox/scale.x)+","+sy(y-oy/scale.y);
      }
      p.push(sx(x)+","+sy(y),corner(1),corner(-1));
      add("polygon",{points:p.join(" "),fill:color});
    }

    /* оси */
    line(D.xMin,D.yMin,D.xMax,D.yMin,"var(--axis)",1.2);
    line(D.xMin,D.yMin,D.xMin,D.yMax,"var(--axis)",1.2);
    arrowHead(D.xMin,D.yMax,0,1,"var(--axis)");
    label(D.xMin,D.yMax,0,-OFF-3,"middle","потеря L","muted");
    label(D.xMax,D.yMin,0,OFF+9,"end","вес w","muted");

    /* склон */
    var pts=[],x;
    for(x=D.xMin;x<=D.xMax+1e-9;x+=D.sample) pts.push(sx(x)+","+sy(L(x)));
    add("polyline",{points:pts.join(" "),fill:"none",
      stroke:"var(--curve)","stroke-width":2.2});

    /* спуск: шаги против градиента */
    var walk=[D.start];
    for(var i=0;i<D.steps;i++){var c=walk[i];walk.push(c-D.lr*g(c));}
    for(i=0;i<walk.length-1;i++){
      var x0=walk[i],x1=walk[i+1],y0=L(x0),y1=L(x1);
      var pxLen=Math.hypot((x1-x0)*scale.x,(y1-y0)*scale.y);
      line(x0,y0,x1,y1,"var(--path)",2);
      if(pxLen>HEAD.len*2) arrowHead(x1,y1,x1-x0,y1-y0,"var(--path)");
      add("circle",{cx:sx(x0),cy:sy(y0),r:R,fill:"var(--dot)"});
    }

    /* старт */
    var xs=D.start;
    add("circle",{cx:sx(xs),cy:sy(L(xs)),r:R+2,fill:"var(--start)"});
    label(xs,L(xs),OFF+4,-OFF,"start","старт: высокая потеря","");

    /* длинный шаг на крутом участке */
    var xm=walk[1];
    label(xm,L(xm),OFF+5,FS,"start","шаг = lr · g","");

    /* дно */
    var xe=walk[walk.length-1],ye=L(xe);
    add("circle",{cx:sx(xe),cy:sy(ye),r:R+2.5,fill:"var(--min)"});
    line(xe,ye,D.leader.x,D.leader.y,"var(--min)",1.1);
    label(D.leader.x,D.leader.y,OFF,FS/3,"start","дно: градиент ≈ 0","");

    /* пояснение под осью */
    label((D.xMin+D.xMax)/2,D.yMin,0,OFF+22,"middle",
      "ближе ко дну склон ровнее — шаги сами сжимаются","muted");
  }catch(e){
    svg.setAttribute("hidden","");
    var fb=document.getElementById("fb");
    fb.hidden=false;
    fb.textContent="Схема должна показывать склон функции потерь: точка старта наверху "+
      "(высокая потеря), цепочка стрелок вниз по склону против градиента — длинные шаги "+
      "на крутом участке и всё более короткие ближе ко дну, — и точка минимума внизу, "+
      "где градиент ≈ 0 и движение прекращается само.";
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
