<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фронт Trusted Editing и Untrusted Monitoring</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5d687b;
      --axis: #344054;
      --grid: #dbe3ef;
      --trusted: #2563eb;
      --trusted-soft: #dbeafe;
      --monitor: #d97706;
      --monitor-soft: #ffedd5;
      --guide: #738197;
      --border: #d4ddea;
      --fallback: #8a341f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151f;
        --panel: #171e2b;
        --ink: #edf3ff;
        --muted: #aeb9cb;
        --axis: #c9d4e6;
        --grid: #303b4d;
        --trusted: #67a4ff;
        --trusted-soft: #203b68;
        --monitor: #f5ad55;
        --monitor-soft: #5a3a1b;
        --guide: #94a3b8;
        --border: #354155;
        --fallback: #ffb4a2;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 14px;
    }

    .plate {
      width: 100%;
      max-width: 960px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 8px 28px rgba(21, 32, 51, 0.08);
    }

    .heading {
      padding: 16px 24px 8px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      overflow: visible;
      background: var(--panel);
    }

    .grid {
      stroke: var(--grid);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: var(--axis);
      vector-effect: non-scaling-stroke;
    }

    .axis-label {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 650;
    }

    .edge-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 550;
    }

    .trusted-curve {
      fill: none;
      stroke: var(--trusted);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .monitor-curve {
      fill: none;
      stroke: var(--monitor);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .trusted-point {
      fill: var(--trusted-soft);
      stroke: var(--trusted);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .monitor-point {
      fill: var(--monitor-soft);
      stroke: var(--monitor);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .comparison {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 5 5;
      vector-effect: non-scaling-stroke;
    }

    .comparison-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .legend-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 650;
    }

    .legend-trusted {
      stroke: var(--trusted);
      stroke-width: 5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .legend-monitor {
      stroke: var(--monitor);
      stroke-width: 5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      margin: 12px 24px 22px;
      padding: 14px 16px;
      color: var(--fallback);
      font-size: 16px;
      line-height: 1.45;
      border: 1px solid currentColor;
      border-radius: 8px;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <main class="plate">
    <header class="heading">
      <h1>Trusted Editing выше при одинаковой безопасности</h1>
      <p class="subtitle">Сравниваем форму внешней границы, а не численные результаты статьи.</p>
    </header>

    <svg
      id="chart"
      viewBox="0 0 960 400"
      width="960"
      height="400"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Фронт безопасности и полезности</title>
      <desc id="svg-description">
        Кривая Trusted Editing проходит выше кривой Untrusted Monitoring
        при каждом одинаковом уровне безопасности.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать график «безопасность — полезность», на котором
      граница Trusted Editing везде выше границы Untrusted Monitoring при
      одинаковой безопасности.
    </p>
  </main>

  <script>
    "use strict";

    const data = Object.freeze({
      layout: Object.freeze({
        zero: 0,
        originX: 140,
        originY: 320,
        scaleX: 105,
        scaleY: 40
      }),

      axes: Object.freeze({
        xStart: Object.freeze({ x: 0, y: 0 }),
        xEnd: Object.freeze({ x: 7.08, y: 0 }),
        yStart: Object.freeze({ x: 0, y: 0 }),
        yEnd: Object.freeze({ x: 0, y: 6.9 }),
        xArrow: Object.freeze([
          Object.freeze({ x: 7.08, y: 0 }),
          Object.freeze({ x: 6.88, y: 0.16 }),
          Object.freeze({ x: 6.88, y: -0.16 })
        ]),
        yArrow: Object.freeze([
          Object.freeze({ x: 0, y: 6.9 }),
          Object.freeze({ x: -0.16, y: 6.7 }),
          Object.freeze({ x: 0.16, y: 6.7 })
        ]),
        xLabel: Object.freeze({ x: 6.95, y: -0.48 }),
        yLabel: Object.freeze({ x: -0.16, y: 6.36 }),
        lowLabel: Object.freeze({ x: 0.12, y: -0.48 }),
        gridX: Object.freeze([1, 2, 3, 4, 5, 6]),
        gridY: Object.freeze([1, 2, 3, 4, 5, 6]),
        gridTop: 6.55,
        gridRight: 6.75
      }),

      trustedCurve: Object.freeze([
        Object.freeze({ kind: "move", x: 0.62, y: 6.02 }),
        Object.freeze({
          kind: "curve",
          c1: Object.freeze({ x: 1.36, y: 5.98 }),
          c2: Object.freeze({ x: 2.08, y: 5.66 }),
          end: Object.freeze({ x: 2.72, y: 5.18 })
        }),
        Object.freeze({
          kind: "curve",
          c1: Object.freeze({ x: 3.46, y: 4.68 }),
          c2: Object.freeze({ x: 4.36, y: 4.05 }),
          end: Object.freeze({ x: 5.12, y: 3.38 })
        }),
        Object.freeze({
          kind: "curve",
          c1: Object.freeze({ x: 5.58, y: 2.97 }),
          c2: Object.freeze({ x: 6.04, y: 2.55 }),
          end: Object.freeze({ x: 6.42, y: 2.34 })
        })
      ]),

      monitorCurve: Object.freeze([
        Object.freeze({ kind: "move", x: 0.62, y: 4.98 }),
        Object.freeze({
          kind: "curve",
          c1: Object.freeze({ x: 1.38, y: 4.9 }),
          c2: Object.freeze({ x: 2.08, y: 4.46 }),
          end: Object.freeze({ x: 2.72, y: 4 })
        }),
        Object.freeze({
          kind: "curve",
          c1: Object.freeze({ x: 3.48, y: 3.48 }),
          c2: Object.freeze({ x: 4.36, y: 2.88 }),
          end: Object.freeze({ x: 5.12, y: 2.34 })
        }),
        Object.freeze({
          kind: "curve",
          c1: Object.freeze({ x: 5.6, y: 1.95 }),
          c2: Object.freeze({ x: 6.04, y: 1.54 }),
          end: Object.freeze({ x: 6.42, y: 1.24 })
        })
      ]),

      trustedPoints: Object.freeze([
        Object.freeze({ x: 0.82, y: 5.85 }),
        Object.freeze({ x: 1.3, y: 5.64 }),
        Object.freeze({ x: 1.75, y: 5.71 }),
        Object.freeze({ x: 2.2, y: 5.28 }),
        Object.freeze({ x: 2.76, y: 5.05 }),
        Object.freeze({ x: 3.18, y: 4.46 }),
        Object.freeze({ x: 3.72, y: 4.18 }),
        Object.freeze({ x: 4.2, y: 3.7 }),
        Object.freeze({ x: 4.72, y: 3.35 }),
        Object.freeze({ x: 5.18, y: 2.98 }),
        Object.freeze({ x: 5.7, y: 2.57 }),
        Object.freeze({ x: 6.2, y: 2.18 })
      ]),

      monitorPoints: Object.freeze([
        Object.freeze({ x: 0.82, y: 4.78 }),
        Object.freeze({ x: 1.28, y: 4.55 }),
        Object.freeze({ x: 1.78, y: 4.51 }),
        Object.freeze({ x: 2.18, y: 4.08 }),
        Object.freeze({ x: 2.7, y: 3.82 }),
        Object.freeze({ x: 3.16, y: 3.27 }),
        Object.freeze({ x: 3.7, y: 2.96 }),
        Object.freeze({ x: 4.2, y: 2.54 }),
        Object.freeze({ x: 4.72, y: 2.2 }),
        Object.freeze({ x: 5.18, y: 1.93 }),
        Object.freeze({ x: 5.7, y: 1.48 }),
        Object.freeze({ x: 6.2, y: 1.08 })
      ]),

      comparison: Object.freeze({
        x: 5.42,
        capLeft: 5.28,
        capRight: 5.56,
        high: 3.14,
        low: 2.02,
        guideTop: 4.78,
        label: Object.freeze({ x: 5.42, y: 5.7 }),
        secondLine: Object.freeze({ x: 5.42, y: 5.28 })
      }),

      legend: Object.freeze({
        y: -1.32,
        trustedStart: 0.55,
        trustedEnd: 1.08,
        trustedLabel: 1.25,
        monitorStart: 3.72,
        monitorEnd: 4.25,
        monitorLabel: 4.42
      }),

      geometry: Object.freeze({
        pointRadius: 0.055
      })
    });

    const origin = Object.freeze({
      x: data.layout.originX,
      y: data.layout.originY
    });

    const scale = Object.freeze({
      x: data.layout.scaleX,
      y: data.layout.scaleY
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, attributes, content) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          node.textContent = content;
        }
        return node;
      };

      const addLine = (group, start, end, className) => {
        group.appendChild(make("line", {
          x1: sx(start.x),
          y1: sy(start.y),
          x2: sx(end.x),
          y2: sy(end.y),
          class: className
        }));
      };

      const addText = (group, point, content, className, anchor) => {
        group.appendChild(make("text", {
          x: sx(point.x),
          y: sy(point.y),
          class: className,
          "text-anchor": anchor
        }, content));
      };

      const curvePath = parts => parts.map(part => {
        if (part.kind === "move") {
          return `M ${sx(part.x)} ${sy(part.y)}`;
        }
        return [
          "C",
          sx(part.c1.x),
          sy(part.c1.y),
          sx(part.c2.x),
          sy(part.c2.y),
          sx(part.end.x),
          sy(part.end.y)
        ].join(" ");
      }).join(" ");

      const grid = make("g", { "aria-hidden": "true" });
      data.axes.gridX.forEach(x => {
        addLine(
          grid,
          { x, y: data.layout.zero },
          { x, y: data.axes.gridTop },
          "grid"
        );
      });
      data.axes.gridY.forEach(y => {
        addLine(
          grid,
          { x: data.layout.zero, y },
          { x: data.axes.gridRight, y },
          "grid"
        );
      });
      svg.appendChild(grid);

      const axes = make("g", { "aria-hidden": "true" });
      addLine(axes, data.axes.xStart, data.axes.xEnd, "axis");
      addLine(axes, data.axes.yStart, data.axes.yEnd, "axis");
      axes.appendChild(make("polygon", {
        points: data.axes.xArrow
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: "axis"
      }));
      axes.appendChild(make("polygon", {
        points: data.axes.yArrow
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: "axis"
      }));
      svg.appendChild(axes);

      const labels = make("g", {});
      addText(labels, data.axes.xLabel, "Безопасность", "axis-label", "end");
      addText(labels, data.axes.yLabel, "Полезность U", "axis-label", "end");
      addText(labels, data.axes.lowLabel, "меньше", "edge-label", "start");
      svg.appendChild(labels);

      const clouds = make("g", {});
      data.trustedPoints.forEach(point => {
        clouds.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: Math.abs(
            sx(data.geometry.pointRadius) - sx(data.layout.zero)
          ),
          class: "trusted-point"
        }));
      });
      data.monitorPoints.forEach(point => {
        clouds.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: Math.abs(
            sx(data.geometry.pointRadius) - sx(data.layout.zero)
          ),
          class: "monitor-point"
        }));
      });
      svg.appendChild(clouds);

      const frontiers = make("g", {});
      frontiers.appendChild(make("path", {
        d: curvePath(data.trustedCurve),
        class: "trusted-curve"
      }));
      frontiers.appendChild(make("path", {
        d: curvePath(data.monitorCurve),
        class: "monitor-curve"
      }));
      svg.appendChild(frontiers);

      const comparison = make("g", {});
      addLine(
        comparison,
        { x: data.comparison.x, y: data.comparison.guideTop },
        { x: data.comparison.x, y: data.comparison.low },
        "comparison"
      );
      addLine(
        comparison,
        { x: data.comparison.capLeft, y: data.comparison.high },
        { x: data.comparison.capRight, y: data.comparison.high },
        "comparison"
      );
      addLine(
        comparison,
        { x: data.comparison.capLeft, y: data.comparison.low },
        { x: data.comparison.capRight, y: data.comparison.low },
        "comparison"
      );
      addText(
        comparison,
        data.comparison.label,
        "при одинаковой безопасности",
        "comparison-label",
        "middle"
      );
      addText(
        comparison,
        data.comparison.secondLine,
        "синяя граница выше",
        "comparison-label",
        "middle"
      );
      svg.appendChild(comparison);

      const legend = make("g", {});
      addLine(
        legend,
        { x: data.legend.trustedStart, y: data.legend.y },
        { x: data.legend.trustedEnd, y: data.legend.y },
        "legend-trusted"
      );
      addText(
        legend,
        { x: data.legend.trustedLabel, y: data.legend.y },
        "Trusted Editing",
        "legend-label",
        "start"
      );
      addLine(
        legend,
        { x: data.legend.monitorStart, y: data.legend.y },
        { x: data.legend.monitorEnd, y: data.legend.y },
        "legend-monitor"
      );
      addText(
        legend,
        { x: data.legend.monitorLabel, y: data.legend.y },
        "Untrusted Monitoring",
        "legend-label",
        "start"
      );
      svg.appendChild(legend);

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("chart").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
