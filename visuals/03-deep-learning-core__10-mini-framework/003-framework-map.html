<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта компонентов мини-фреймворка</title>
<style>
  :root{
    color-scheme:light dark;
    --bg:#f7f9fc;
    --panel:#ffffff;
    --panel-soft:#eef3f9;
    --text:#172033;
    --muted:#5c687d;
    --line:#9aa8bc;
    --blue:#2869c7;
    --blue-soft:#e7f0ff;
    --violet:#7255c7;
    --violet-soft:#f0ebff;
    --orange:#b85b12;
    --orange-soft:#fff0df;
    --green:#237a4b;
    --green-soft:#e4f6eb;
    --red:#b53e46;
    --red-soft:#fdebed;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#10151f;
      --panel:#171e2a;
      --panel-soft:#202938;
      --text:#edf2fa;
      --muted:#aeb9ca;
      --line:#65748b;
      --blue:#76adff;
      --blue-soft:#182c49;
      --violet:#b7a2ff;
      --violet-soft:#292344;
      --orange:#ffad69;
      --orange-soft:#40291a;
      --green:#79d6a2;
      --green-soft:#173426;
      --red:#ff9299;
      --red-soft:#401f25;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  figure{
    margin:0;
    background:var(--bg);
    overflow:hidden;
  }
  figcaption{
    padding:14px 22px 6px;
    font-size:20px;
    font-weight:700;
    letter-spacing:.01em;
  }
  .lead{
    margin:0;
    padding:0 22px 8px;
    color:var(--muted);
    font-size:13px;
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    max-height:520px;
    background:var(--bg);
  }
  .fallback{
    padding:28px;
    color:var(--text);
    font-size:15px;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Карта компонентов мини-фреймворка</figcaption>
  <p class="lead">Один цикл обучения: подать данные → получить прогноз → измерить ошибку → исправить параметры</p>
  <svg id="map" viewBox="0 0 960 440" width="960" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="DataLoader передаёт данные в Sequential из Linear и активаций, функция потерь запускает backward, а оптимизатор обновляет параметры"></svg>
</figure>
<script>
"use strict";

const D = Object.freeze({
  origin:{x:0,y:0},
  scale:{x:1,y:1},
  canvas:{w:960,h:440},
  zero:0,
  one:1,
  radius:12,
  stroke:{normal:2,strong:3,dash:8,gap:6},
  font:{title:16,body:13,small:12,tiny:11,mono:12},
  gap:{line:18,small:15},
  arrow:{view:10,size:8,ref:9,mid:5,tip:10},
  dataBox:{x:28,y:116,w:164,h:142},
  seqBox:{x:238,y:70,w:354,h:238},
  lossBox:{x:650,y:54,w:280,h:182},
  optBox:{x:650,y:290,w:280,h:114},
  module:{
    y:151,w:88,h:76,
    linearX:258,reluX:378,sigmoidX:498,
    arrowY:189,
    extraY:264
  },
  cards:{
    innerPad:16,
    headY:96,
    dataHeadY:143,
    dataTextY:181,
    dataBadgeX:52,
    dataBadgeY:215,
    dataBadgeW:116,
    dataBadgeH:25,
    lossHeadY:81,
    lossOneY:112,
    lossTwoY:162,
    lossX:672,
    lossW:236,
    lossH:38,
    optHeadY:317,
    optOneX:672,
    optTwoX:792,
    optY:342,
    optW:110,
    optH:40
  },
  routes:{
    feedFromX:192,feedToX:238,feedY:188,
    predFromX:592,predToX:650,predY:126,
    backFromX:650,backFromY:216,
    backC1X:626,backC1Y:246,
    backC2X:622,backC2Y:274,
    backToX:592,backToY:274,
    updateFromX:650,updateFromY:370,
    updateC1X:624,updateC1Y:370,
    updateC2X:620,updateC2Y:300,
    updateToX:592,updateToY:300,
    moduleAFromX:346,moduleAToX:378,
    moduleBFromX:466,moduleBToX:498
  },
  labels:{
    feedX:197,feedY:174,
    predX:596,predY:112,
    backX:624,backY:249,
    updateX:624,updateY:356
  },
  legend:{
    lineY:420,
    x1:112,x2:370,x3:650,
    dot1:91,dot2:349,dot3:629,
    dotR:5
  },
  opacity:{soft:.7}
});

const origin = Object.freeze(D.origin);
const scale = Object.freeze(D.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try{
  const svg=document.getElementById("map");
  const NS="http://www.w3.org/2000/svg";
  const el=(name,attrs={})=>{
    const node=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
    return node;
  };
  const add=node=>svg.appendChild(node);
  const group=()=>el("g");

  const text=(parent,x,y,lines,options={})=>{
    const node=el("text",{
      x:sx(x),y:sy(y),
      fill:options.fill||"var(--text)",
      "font-size":sx(options.size||D.font.body),
      "font-weight":options.weight||"400",
      "text-anchor":options.anchor||"start",
      "font-family":options.mono?"ui-monospace, SFMono-Regular, Menlo, monospace":
        "system-ui, -apple-system, Segoe UI, sans-serif"
    });
    lines.forEach((line,index)=>{
      const span=el("tspan",{
        x:sx(x),
        dy:index===D.zero?sy(D.zero):sy(options.gap||D.gap.line)
      });
      span.textContent=line;
      node.appendChild(span);
    });
    parent.appendChild(node);
    return node;
  };

  const box=(parent,b,fill,stroke)=>{
    parent.appendChild(el("rect",{
      x:sx(b.x),y:sy(b.y),width:sx(b.w),height:sy(b.h),
      rx:sx(D.radius),ry:sy(D.radius),
      fill,stroke,"stroke-width":sx(D.stroke.normal)
    }));
  };

  const pill=(parent,b,label,fill,stroke)=>{
    parent.appendChild(el("rect",{
      x:sx(b.x),y:sy(b.y),width:sx(b.w),height:sy(b.h),
      rx:sx(D.radius),ry:sy(D.radius),
      fill,stroke,"stroke-width":sx(D.stroke.normal)
    }));
    text(parent,b.x+b.w/D.arrow.mid,b.y+b.h/D.arrow.mid+[D.font.small][D.zero],
      [label],{anchor:"middle",size:D.font.small,weight:"650"});
  };

  const path=(parent,d,color,marker,dash)=>{
    const attrs={
      d,fill:"none",stroke:color,
      "stroke-width":sx(D.stroke.strong),
      "stroke-linecap":"round",
      "stroke-linejoin":"round"
    };
    if(marker) attrs["marker-end"]=`url(#${marker})`;
    if(dash) attrs["stroke-dasharray"]=`${sx(D.stroke.dash)} ${sx(D.stroke.gap)}`;
    parent.appendChild(el("path",attrs));
  };

  const defs=el("defs");
  const marker=(id,color)=>{
    const m=el("marker",{
      id,
      viewBox:`${sx(D.zero)} ${sy(D.zero)} ${sx(D.arrow.view)} ${sy(D.arrow.view)}`,
      markerWidth:sx(D.arrow.size),markerHeight:sy(D.arrow.size),
      refX:sx(D.arrow.ref),refY:sy(D.arrow.mid),
      orient:"auto-start-reverse"
    });
    m.appendChild(el("path",{
      d:`M ${sx(D.zero)} ${sy(D.zero)} L ${sx(D.arrow.tip)} ${sy(D.arrow.mid)} L ${sx(D.zero)} ${sy(D.arrow.tip)} z`,
      fill:color
    }));
    defs.appendChild(m);
  };
  marker("blue-arrow","var(--blue)");
  marker("red-arrow","var(--red)");
  marker("green-arrow","var(--green)");
  add(defs);

  const regions=group();
  add(regions);
  box(regions,D.dataBox,"var(--blue-soft)","var(--blue)");
  box(regions,D.seqBox,"var(--panel)","var(--violet)");
  box(regions,D.lossBox,"var(--red-soft)","var(--red)");
  box(regions,D.optBox,"var(--green-soft)","var(--green)");

  text(regions,D.dataBox.x+D.cards.innerPad,D.cards.dataHeadY,
    ["DataLoader"],{size:D.font.title,weight:"750",fill:"var(--blue)"});
  text(regions,D.dataBox.x+D.cards.innerPad,D.cards.dataTextY,
    ["выдаёт порции данных","и может перемешивать"],{size:D.font.small,fill:"var(--muted)"});
  pill(regions,{
    x:D.cards.dataBadgeX,y:D.cards.dataBadgeY,
    w:D.cards.dataBadgeW,h:D.cards.dataBadgeH
  },"batch: x, target","var(--panel)","var(--blue)");

  text(regions,D.seqBox.x+D.cards.innerPad,D.cards.headY,
    ["Sequential · цепочка модулей"],{size:D.font.title,weight:"750",fill:"var(--violet)"});

  const moduleCard=(x,name,formula,accent)=>{
    const g=group();
    regions.appendChild(g);
    box(g,{x,y:D.module.y,w:D.module.w,h:D.module.h},"var(--panel-soft)",accent);
    text(g,x+D.module.w/D.arrow.mid,D.module.y+D.cards.innerPad+D.font.small,
      [name],{anchor:"middle",size:D.font.body,weight:"700"});
    text(g,x+D.module.w/D.arrow.mid,D.module.y+D.cards.innerPad+D.font.small+D.gap.line,
      [formula],{anchor:"middle",size:D.font.tiny,fill:"var(--muted)",mono:true});
  };
  moduleCard(D.module.linearX,"Linear","W·x + b","var(--violet)");
  moduleCard(D.module.reluX,"ReLU","max(0, x)","var(--orange)");
  moduleCard(D.module.sigmoidX,"Sigmoid","σ(x)","var(--orange)");

  text(regions,D.seqBox.x+D.seqBox.w/D.arrow.mid,D.module.extraY,
    ["Другие модули: Dropout · BatchNorm"],
    {anchor:"middle",size:D.font.small,fill:"var(--muted)"});

  text(regions,D.lossBox.x+D.cards.innerPad,D.cards.lossHeadY,
    ["Функция потерь"],{size:D.font.title,weight:"750",fill:"var(--red)"});
  pill(regions,{
    x:D.cards.lossX,y:D.cards.lossOneY,
    w:D.cards.lossW,h:D.cards.lossH
  },"MSELoss · числовой прогноз","var(--panel)","var(--red)");
  pill(regions,{
    x:D.cards.lossX,y:D.cards.lossTwoY,
    w:D.cards.lossW,h:D.cards.lossH
  },"BCELoss · два варианта","var(--panel)","var(--red)");

  text(regions,D.optBox.x+D.cards.innerPad,D.cards.optHeadY,
    ["Оптимизатор"],{size:D.font.title,weight:"750",fill:"var(--green)"});
  pill(regions,{
    x:D.cards.optOneX,y:D.cards.optY,
    w:D.cards.optW,h:D.cards.optH
  },"SGD","var(--panel)","var(--green)");
  pill(regions,{
    x:D.cards.optTwoX,y:D.cards.optY,
    w:D.cards.optW,h:D.cards.optH
  },"Adam","var(--panel)","var(--green)");

  const arrows=group();
  add(arrows);
  path(arrows,
    `M ${sx(D.routes.moduleAFromX)} ${sy(D.routes.module.arrowY||D.module.arrowY)} L ${sx(D.routes.moduleAToX)} ${sy(D.module.arrowY)}`,
    "var(--orange)","blue-arrow");
  path(arrows,
    `M ${sx(D.routes.moduleBFromX)} ${sy(D.module.arrowY)} L ${sx(D.routes.moduleBToX)} ${sy(D.module.arrowY)}`,
    "var(--orange)","blue-arrow");
  path(arrows,
    `M ${sx(D.routes.feedFromX)} ${sy(D.routes.feedY)} L ${sx(D.routes.feedToX)} ${sy(D.routes.feedY)}`,
    "var(--blue)","blue-arrow");
  path(arrows,
    `M ${sx(D.routes.predFromX)} ${sy(D.routes.predY)} L ${sx(D.routes.predToX)} ${sy(D.routes.predY)}`,
    "var(--blue)","blue-arrow");
  path(arrows,
    `M ${sx(D.routes.backFromX)} ${sy(D.routes.backFromY)} C ${sx(D.routes.backC1X)} ${sy(D.routes.backC1Y)}, ${sx(D.routes.backC2X)} ${sy(D.routes.backC2Y)}, ${sx(D.routes.backToX)} ${sy(D.routes.backToY)}`,
    "var(--red)","red-arrow",true);
  path(arrows,
    `M ${sx(D.routes.updateFromX)} ${sy(D.routes.updateFromY)} C ${sx(D.routes.updateC1X)} ${sy(D.routes.updateC1Y)}, ${sx(D.routes.updateC2X)} ${sy(D.routes.updateC2Y)}, ${sx(D.routes.updateToX)} ${sy(D.routes.updateToY)}`,
    "var(--green)","green-arrow");

  text(arrows,D.labels.feedX,D.labels.feedY,
    ["подаёт x"],{size:D.font.tiny,fill:"var(--blue)",anchor:"start",weight:"650"});
  text(arrows,D.labels.predX,D.labels.predY,
    ["прогноз"],{size:D.font.tiny,fill:"var(--blue)",anchor:"start",weight:"650"});
  text(arrows,D.labels.backX,D.labels.backY,
    ["loss.backward()","считает градиенты"],
    {size:D.font.tiny,fill:"var(--red)",anchor:"end",weight:"650",gap:D.gap.small});
  text(arrows,D.labels.updateX,D.labels.updateY,
    ["обновляет параметры"],{size:D.font.tiny,fill:"var(--green)",anchor:"end",weight:"650"});

  const legend=group();
  add(legend);
  legend.appendChild(el("line",{
    x1:sx(D.dataBox.x),y1:sy(D.legend.lineY),
    x2:sx(D.lossBox.x+D.lossBox.w),y2:sy(D.legend.lineY),
    stroke:"var(--line)","stroke-width":sx(D.stroke.normal)
  }));
  const legendItem=(dotX,labelX,color,label)=>{
    legend.appendChild(el("circle",{
      cx:sx(dotX),cy:sy(D.legend.lineY),r:sx(D.legend.dotR),fill:color
    }));
    text(legend,labelX,D.legend.lineY+D.font.small/D.arrow.mid,
      [label],{size:D.font.small,fill:"var(--muted)",anchor:"start",weight:"600"});
  };
  legendItem(D.legend.dot1,D.legend.x1,"var(--blue)","forward: данные → прогноз");
  legendItem(D.legend.dot2,D.legend.x2,"var(--red)","backward: ошибка → градиенты");
  legendItem(D.legend.dot3,D.legend.x3,"var(--green)","step: градиенты → новые параметры");
}catch(error){
  const svg=document.getElementById("map");
  svg.replaceChildren();
  const message=document.createElementNS("http://www.w3.org/2000/svg","text");
  message.setAttribute("x",sx(D.canvas.w/D.arrow.mid));
  message.setAttribute("y",sy(D.canvas.h/D.arrow.mid));
  message.setAttribute("text-anchor","middle");
  message.setAttribute("fill","var(--text)");
  message.setAttribute("font-size",sx(D.font.body));
  message.textContent="Схема: DataLoader подаёт данные в Sequential, loss запускает backward, optimizer обновляет параметры.";
  svg.appendChild(message);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
