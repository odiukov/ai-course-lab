<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Схема экосистемы</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1d1f22; --muted:#6b7078;
    --chain:#1f5f8b; --fan:#2e7d5b; --ext:#9a5b12; --otel:#7a4fa3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171a; --fg:#e9ecef; --muted:#a0a6ae;
      --chain:#6fb6e8; --fan:#6fcf9b; --ext:#e3a95b; --otel:#c3a0e8;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  .wrap{max-width:980px;margin:0 auto;padding:10px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  .hint{font-size:12px;color:var(--muted);margin:0 0 8px;}
  svg{width:100%;height:auto;max-height:520px;display:block;background:var(--bg);}
  .fail{font-size:13px;line-height:1.5;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Экосистема: маршрут запроса и каталог сервера</h2>
  <p class="hint">Сплошные линии — кто кого вызывает. Пунктирные — что узел умеет (веер, не очередь).</p>
  <div id="slot"></div>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ——— данные схемы (координатная сетка) ———
    var CHAIN = [
      {x:0,  y:0, label:'user',                     lab:'пользователь'},
      {x:5,  y:0, label:'client',                   lab:'клиент'},
      {x:11, y:0, label:'gateway (OAuth 2.1 + RBAC)',lab:'шлюз'},
      {x:19, y:0, label:'research MCP server',      lab:'сервер'}
    ];
    var HUB = {x:19, y:0};
    var FAN = [
      {y:2,  kind:'fan', label:'tool: arxiv_search'},
      {y:3,  kind:'fan', label:'resource: notes://recent'},
      {y:4,  kind:'fan', label:'prompt: /research_topic'},
      {y:5,  kind:'fan', label:'task: generate_report'},
      {y:6,  kind:'fan', label:'ui://report/current'},
      {y:7,  kind:'ext', label:'a2a: writer-agent'},
      {y:8.4,kind:'otel',label:'OTel GenAI спаны'}
    ];
    var STEM = 15.4;   // x вертикального ствола веера
    var TIP  = 17.2;   // x конца ветки
    var EXT  = 22.5;   // x внешнего агента

    // ——— единственный перевод координат ———
    var ORIGIN = {x:56, y:44}, SCALE = {x:38, y:36};
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y + y * SCALE.y; }

    var W = 980, H = 400, FS = 12.5, PAD = 8, LW = 1.6;

    var s = [];
    function esc(t){ return t.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function line(x1,y1,x2,y2,cls,head){
      s.push('<line x1="'+sx(x1)+'" y1="'+sy(y1)+'" x2="'+sx(x2)+'" y2="'+sy(y2)+
        '" class="'+cls+'"'+(head?' marker-end="url(#'+head+')"':'')+'/>');
    }
    function txt(x,y,dx,dy,anchor,t,cls){
      s.push('<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+
        '" class="'+cls+'">'+esc(t)+'</text>');
    }
    function dot(x,y,cls){
      s.push('<circle cx="'+sx(x)+'" cy="'+sy(y)+'" r="4" class="'+cls+'"/>');
    }

    // цепочка вызовов: узлы + стрелки
    for(var i=0;i<CHAIN.length;i++){
      var n = CHAIN[i];
      dot(n.x, n.y, 'nd chain');
      txt(n.x, n.y, 0, -14, i===0?'start':(i===CHAIN.length-1?'end':'middle'), n.label, 'lab');
      txt(n.x, n.y, 0, 22, i===0?'start':(i===CHAIN.length-1?'end':'middle'), n.lab, 'sub');
      if(i>0) line(CHAIN[i-1].x+0.35, 0, n.x-0.55, 0, 'ln chain', 'ah-chain');
    }

    // ствол веера + ветки
    line(HUB.x, HUB.y+0.3, HUB.x, 1.05, 'ln fan');
    line(HUB.x, 1.05, STEM, 1.05, 'ln fan');
    line(STEM, 1.05, STEM, FAN[FAN.length-1].y, 'ln fan');

    for(var j=0;j<FAN.length;j++){
      var f = FAN[j], cls = f.kind==='otel' ? 'otel' : (f.kind==='ext' ? 'ext' : 'fan');
      line(STEM, f.y, TIP, f.y, 'ln dash '+cls);
      dot(TIP, f.y, 'nd '+cls);
      txt(TIP, f.y, PAD, 4, 'start', f.label, 'lab '+cls);
    }

    // единственная линия наружу — A2A
    var a2a = FAN[5];
    line(TIP+3.6, a2a.y, EXT-0.55, a2a.y, 'ln ext', 'ah-ext');
    dot(EXT, a2a.y, 'nd ext');
    txt(EXT, a2a.y, 0, -13, 'middle', 'внешний агент', 'sub ext');

    // OTel: запись, а не путь
    txt(TIP, FAN[6].y, PAD, 20, 'start', 'не вызов — запись о произошедшем', 'sub');

    // подписи двух типов линий
    txt(2.5, 0, 0, -34, 'middle', 'маршрут запроса', 'cap chain');
    txt(STEM, 1.05, -PAD, -6, 'end', 'каталог сервера: 5 веток + A2A', 'cap fan');

    var svg =
      '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="Маршрут запроса от пользователя к MCP-серверу и веер возможностей сервера">'+
      '<defs>'+
        '<marker id="ah-chain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" '+
        'markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mk chain"/></marker>'+
        '<marker id="ah-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" '+
        'markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="mk ext"/></marker>'+
      '</defs>'+
      '<style>'+
        '.ln{stroke-width:'+LW+';fill:none}'+
        '.dash{stroke-dasharray:5 4}'+
        '.chain{stroke:var(--chain)}.fan{stroke:var(--fan)}'+
        '.ext{stroke:var(--ext)}.otel{stroke:var(--otel)}'+
        '.nd{stroke-width:2}.nd.chain{fill:var(--chain)}.nd.fan{fill:var(--fan)}'+
        '.nd.ext{fill:var(--ext)}.nd.otel{fill:var(--otel)}'+
        '.mk{stroke:none}.mk.chain{fill:var(--chain)}.mk.ext{fill:var(--ext)}'+
        'text{font-family:inherit;font-size:'+FS+'px;fill:var(--fg);stroke:none}'+
        '.sub{font-size:11px;fill:var(--muted);stroke:none}'+
        '.cap{font-size:11.5px;font-weight:600;stroke:none}'+
        'text.chain{fill:var(--chain)}text.fan{fill:var(--fan)}'+
        'text.ext{fill:var(--ext)}text.otel{fill:var(--otel)}'+
      '</style>'+ s.join('') + '</svg>';

    slot.innerHTML = svg;
  }catch(e){
    slot.innerHTML = '<p class="fail">Схема должна была показать маршрут запроса: '+
      'пользователь → клиент → шлюз (OAuth 2.1 + RBAC) → research MCP server. '+
      'От сервера — веер из пяти возможностей каталога: tool arxiv_search, '+
      'resource notes://recent, prompt /research_topic, task generate_report, '+
      'ui://report/current; отдельно ветка a2a: writer-agent (единственная линия наружу) '+
      'и ветка OTel GenAI спанов — запись о произошедшем, а не вызов.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
