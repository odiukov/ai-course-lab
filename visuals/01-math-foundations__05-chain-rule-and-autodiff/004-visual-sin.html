<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Разбор sin(x^2) на два звена</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f23; --muted:#5a6673;
    --node:#f1f5f9; --nodeb:#334155; --acc:#b45309; --acc2:#1d4ed8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1418; --fg:#e6edf3; --muted:#9aa7b4;
      --node:#1c2630; --nodeb:#8aa0b6; --acc:#f0b429; --acc2:#7aa2f7;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .err{font-size:13px;color:var(--muted);white-space:pre-wrap;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Разбор <code>sin(x^2)</code> на два звена</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var W = 760, H = 300;              // холст
    var PAD = 10;                      // отступ подписи от точки
    var LW = 1.6;                      // толщина линий
    var FS = 14;                       // размер шрифта

    // ---- данные схемы (в своих единицах) ----
    var data = {
      nodes: [
        {id:'x', x:0,  y:0, label:'x',        deriv:null},
        {id:'g', x:3,  y:0, label:'g = x²',   deriv:"g′ = 2x"},
        {id:'f', x:6,  y:0, label:'f = sin(g)', deriv:"f′ = cos(g)"}
      ],
      edges: [
        {from:'x', to:'g', label:'возвести в квадрат'},
        {from:'g', to:'f', label:'взять синус'}
      ],
      box:   {w:2.0, h:0.9},           // полразмер узла: ширина/высота
      point: {x:7.6, y:0},             // якорь блока результата
      note:  {x:4.5, y:1.55}           // якорь пояснения про точку cos
    };

    // ---- единственный перевод координат ----
    var origin = {x:60, y:110};
    var scale  = 88;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    var svgns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(svgns,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Цепочка x, g равно x в квадрате, f равно синус g; локальные производные 2x и cos(g); произведение cos(x²)·2x');

    function el(n,a){ var e=document.createElementNS(svgns,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
        'font-size':(size||FS),'font-family':'inherit','fill':'var(--fg)'});
      if(cls) t.setAttribute('fill',cls);
      t.textContent=s; svg.appendChild(t); return t;
    }
    function byId(id){ for(var i=0;i<data.nodes.length;i++)
      if(data.nodes[i].id===id) return data.nodes[i]; return null; }

    // ---- узлы ----
    data.nodes.forEach(function(n){
      var x0=sx(n.x-data.box.w/2), x1=sx(n.x+data.box.w/2);
      var y0=sy(n.y-data.box.h/2), y1=sy(n.y+data.box.h/2);
      svg.appendChild(el('rect',{x:x0,y:y0,width:x1-x0,height:y1-y0,rx:8,
        fill:'var(--node)',stroke:'var(--nodeb)','stroke-width':LW}));
      txt(sx(n.x), sy(n.y)+FS*0.35, n.label, 'middle');
      if(n.deriv){ // локальная производная под звеном
        txt(sx(n.x), sy(n.y+data.box.h/2)+PAD+FS, n.deriv, 'middle', 'var(--acc)');
      }
    });

    // ---- стрелки между звеньями ----
    data.edges.forEach(function(e){
      var a=byId(e.from), b=byId(e.to);
      var xa=sx(a.x+data.box.w/2), xb=sx(b.x-data.box.w/2), y=sy(a.y);
      var head=sx(0.16)-sx(0), hh=sy(0.09)-sy(0);
      svg.appendChild(el('line',{x1:xa,y1:y,x2:xb-head,y2:y,
        stroke:'var(--nodeb)','stroke-width':LW}));
      svg.appendChild(el('polygon',{points:
        (xb)+','+y+' '+(xb-head)+','+(y-hh)+' '+(xb-head)+','+(y+hh),
        fill:'var(--nodeb)'}));
      // подпись у хвоста стрелки, выше линии
      txt(xa+PAD, y-PAD, e.label, 'start', 'var(--muted)', FS-2);
    });

    // ---- результат справа ----
    var f = byId('f');
    var rx = sx(data.point.x), ry = sy(data.point.y);
    var xa2 = sx(f.x+data.box.w/2), head2 = sx(0.16)-sx(0), hh2 = sy(0.09)-sy(0);
    svg.appendChild(el('line',{x1:xa2,y1:ry,x2:rx-head2,y2:ry,
      stroke:'var(--acc2)','stroke-width':LW}));
    svg.appendChild(el('polygon',{points:
      (rx)+','+ry+' '+(rx-head2)+','+(ry-hh2)+' '+(rx-head2)+','+(ry+hh2),
      fill:'var(--acc2)'}));
    txt(rx-PAD, ry-PAD, 'перемножить', 'end', 'var(--muted)', FS-2);
    txt(rx+PAD, ry+FS*0.35, 'cos(x²) · 2x', 'start', 'var(--acc2)', FS+1);

    // ---- пояснение про точку, в которой берётся cos ----
    txt(sx(data.note.x), sy(data.note.y), 'cos берётся в x², а не в x', 'middle',
        'var(--muted)', FS-1);

    host.appendChild(svg);
  }catch(err){
    host.innerHTML = '<p class="err">Схема должна была показать цепочку: '+
      'x → g = x² → f = sin(g). Под внутренним звеном локальная производная '+
      "g′ = 2x, под внешним — f′ = cos(g). Их произведение справа: "+
      'cos(x²) · 2x. Косинус берётся в точке x², а не в x.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
