<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Карта пяти семейств генеративных моделей</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: floralwhite;
      --panel: white;
      --ink: midnightblue;
      --muted: dimgray;
      --line: slategray;
      --soft: aliceblue;
      --divider: gainsboro;
      --tractable: royalblue;
      --approximate: seagreen;
      --implicit: darkorange;
      --continuous: mediumpurple;
      --tokens: crimson;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslategray;
        --ink: whitesmoke;
        --muted: lightgray;
        --line: lightslategray;
        --soft: darkslateblue;
        --divider: slategray;
        --tractable: lightskyblue;
        --approximate: lightgreen;
        --implicit: orange;
        --continuous: plum;
        --tokens: lightcoral;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .frame {
      width: 100%;
      max-width: 1200px;
      max-height: 520px;
      margin: auto;
      padding: 12px;
      overflow: hidden;
      background: var(--page);
      border: 1px solid var(--divider);
    }

    h1 {
      margin: auto;
      padding: 4px 4px 10px;
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 455px;
      background: var(--page);
      font-family: inherit;
    }

    svg[hidden],
    .fallback[hidden] {
      display: none;
    }

    .fallback {
      margin: auto;
      padding: 16px;
      color: var(--ink);
      background: var(--soft);
      border: 1px solid var(--line);
      font-size: 14px;
      text-align: center;
    }

    .root-box {
      fill: var(--soft);
      stroke: var(--ink);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .root-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .root-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .branch {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .card {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .accent {
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .tone-tractable {
      stroke: var(--tractable);
      fill: var(--tractable);
    }

    .tone-approximate {
      stroke: var(--approximate);
      fill: var(--approximate);
    }

    .tone-implicit {
      stroke: var(--implicit);
      fill: var(--implicit);
    }

    .tone-continuous {
      stroke: var(--continuous);
      fill: var(--continuous);
    }

    .tone-tokens {
      stroke: var(--tokens);
      fill: var(--tokens);
    }

    .number {
      font-size: 18px;
      font-weight: bold;
    }

    .family-title {
      fill: var(--ink);
      font-size: 12px;
      font-weight: bold;
    }

    .divider {
      stroke: var(--divider);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .section-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .value {
      fill: var(--ink);
      font-size: 12px;
    }

    .example {
      fill: var(--muted);
      font-size: 11px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1>Карта пяти семейств генеративных моделей</h1>

    <p class="fallback" id="fallback">
      Схема должна была показать пять ветвей: точную и приближённую явную
      плотность, неявную плотность, score/continuous-time и авторегрессию
      по дискретным кодам — с доступностью log p и способом сэмплирования.
    </p>

    <svg id="diagram"
         hidden
         width="1200"
         height="455"
         viewBox="0 0 1200 455"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Пять семейств генеративных моделей</title>
      <desc id="svg-description">
        Дерево из пяти ветвей сравнивает доступность log p и путь получения
        образца у явных, неявных, непрерывных и токенных моделей.
      </desc>
    </svg>
  </main>

  <script>
    const diagramData = [
      {
        role: "settings",
        origin: { x: 0, y: 0 },
        scale: { x: 1, y: 1 },
        rootFrom: { x: 365, y: 18 },
        rootTo: { x: 835, y: 102 },
        rootCenter: 600,
        rootTitleY: 48,
        rootNoteY: 76,
        trunkFromY: 102,
        busY: 142,
        busFromX: 128,
        busToX: 1072,
        cardTop: 180,
        cardBottom: 440,
        textInset: 14,
        titleInset: 40,
        numberInset: 17,
        numberY: 215,
        headerDividerY: 260,
        logLabelY: 281,
        logValueYs: [302, 319],
        sampleDividerY: 334,
        sampleLabelY: 355,
        sampleValueYs: [377, 395],
        exampleY: 422
      },
      {
        number: "1",
        tone: "tractable",
        left: 18,
        right: 238,
        center: 128,
        titleYs: [207, 226],
        title: ["ТОЧНАЯ ЯВНАЯ", "ПЛОТНОСТЬ"],
        log: ["точный и прямой"],
        sample: ["по одному элементу", "или обратимый поток"],
        example: "PixelCNN · WaveNet · Glow"
      },
      {
        number: "2",
        tone: "approximate",
        left: 254,
        right: 474,
        center: 364,
        titleYs: [207, 226],
        title: ["ПРИБЛИЖЁННАЯ", "ЯВНАЯ ПЛОТНОСТЬ"],
        log: ["не напрямую;", "вычислима ELBO"],
        sample: ["z → декодер или", "итерации удаления шума"],
        example: "VAE · DDPM"
      },
      {
        number: "3",
        tone: "implicit",
        left: 490,
        right: 710,
        center: 600,
        titleYs: [207, 226],
        title: ["НЕЯВНАЯ", "ПЛОТНОСТЬ"],
        log: ["недоступен"],
        sample: ["один проход G(z)"],
        example: "GAN · StyleGAN"
      },
      {
        number: "4",
        tone: "continuous",
        left: 726,
        right: 946,
        center: 836,
        titleYs: [207, 226],
        title: ["SCORE /", "CONTINUOUS-TIME"],
        log: ["восстанавливается", "интегрированием ODE"],
        sample: ["интегрирование", "ODE / SDE"],
        example: "score · flow matching"
      },
      {
        number: "5",
        tone: "tokens",
        left: 962,
        right: 1182,
        center: 1072,
        titleYs: [201, 219, 237],
        title: ["АВТОРЕГРЕССИЯ", "ПО ДИСКРЕТНЫМ", "КОДАМ"],
        log: ["точный для токенов;", "не для исходного x"],
        sample: ["токен за токеном", "→ декодер"],
        example: "VQ-VAE + Transformer"
      }
    ];

    const [settings, ...families] = diagramData;
    const origin = Object.freeze(settings.origin);
    const scale = Object.freeze(settings.scale);

    function toPx(point) {
      return {
        x: origin.x + point.x * scale.x,
        y: origin.y + point.y * scale.y
      };
    }

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function make(tag, attributes = {}, content = "") {
      const node = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        node.setAttribute(name, value);
      });
      if (content) node.textContent = content;
      return node;
    }

    function addRect(parent, from, to, className) {
      const start = toPx(from);
      const finish = toPx(to);
      parent.appendChild(make("rect", {
        x: start.x,
        y: start.y,
        width: finish.x - start.x,
        height: finish.y - start.y,
        class: className
      }));
    }

    function addLine(parent, from, to, className) {
      const start = toPx(from);
      const finish = toPx(to);
      parent.appendChild(make("line", {
        x1: start.x,
        y1: start.y,
        x2: finish.x,
        y2: finish.y,
        class: className
      }));
    }

    function addText(parent, content, point, className, anchor) {
      const position = toPx(point);
      parent.appendChild(make("text", {
        x: position.x,
        y: position.y,
        class: className,
        "text-anchor": anchor
      }, content));
    }

    function addTextLines(parent, lines, x, ys, className, anchor) {
      lines.forEach((line, lineIndex) => {
        addText(
          parent,
          line,
          { x: x, y: ys[lineIndex] },
          className,
          anchor
        );
      });
    }

    try {
      const connectors = make("g", { "aria-hidden": "true" });

      addLine(
        connectors,
        { x: settings.rootCenter, y: settings.trunkFromY },
        { x: settings.rootCenter, y: settings.busY },
        "branch"
      );

      addLine(
        connectors,
        { x: settings.busFromX, y: settings.busY },
        { x: settings.busToX, y: settings.busY },
        "branch"
      );

      families.forEach((family) => {
        addLine(
          connectors,
          { x: family.center, y: settings.busY },
          { x: family.center, y: settings.cardTop },
          "branch"
        );
      });

      svg.appendChild(connectors);

      const rootGroup = make("g");
      addRect(
        rootGroup,
        settings.rootFrom,
        settings.rootTo,
        "root-box"
      );

      addText(
        rootGroup,
        "Где доступна плотность — и как появляется образец?",
        { x: settings.rootCenter, y: settings.rootTitleY },
        "root-title",
        "middle"
      );

      addText(
        rootGroup,
        "Классифицируй механизм, а не название модели",
        { x: settings.rootCenter, y: settings.rootNoteY },
        "root-note",
        "middle"
      );

      svg.appendChild(rootGroup);

      families.forEach((family) => {
        const group = make("g");
        const textX = family.left + settings.textInset;
        const titleX = family.left + settings.titleInset;
        const numberX = family.left + settings.numberInset;

        addRect(
          group,
          { x: family.left, y: settings.cardTop },
          { x: family.right, y: settings.cardBottom },
          "card"
        );

        addLine(
          group,
          { x: family.left, y: settings.cardTop },
          { x: family.right, y: settings.cardTop },
          `accent tone-${family.tone}`
        );

        addText(
          group,
          family.number,
          { x: numberX, y: settings.numberY },
          `number tone-${family.tone}`,
          "middle"
        );

        addTextLines(
          group,
          family.title,
          titleX,
          family.titleYs,
          "family-title",
          "start"
        );

        addLine(
          group,
          { x: family.left, y: settings.headerDividerY },
          { x: family.right, y: settings.headerDividerY },
          "divider"
        );

        addText(
          group,
          "ДОСТУПНОСТЬ log p",
          { x: textX, y: settings.logLabelY },
          "section-label",
          "start"
        );

        addTextLines(
          group,
          family.log,
          textX,
          settings.logValueYs,
          "value",
          "start"
        );

        addLine(
          group,
          { x: family.left, y: settings.sampleDividerY },
          { x: family.right, y: settings.sampleDividerY },
          "divider"
        );

        addText(
          group,
          "СЭМПЛИРОВАНИЕ →",
          { x: textX, y: settings.sampleLabelY },
          "section-label",
          "start"
        );

        addTextLines(
          group,
          family.sample,
          textX,
          settings.sampleValueYs,
          "value",
          "start"
        );

        addText(
          group,
          family.example,
          { x: textX, y: settings.exampleY },
          "example",
          "start"
        );

        svg.appendChild(group);
      });

      svg.removeAttribute("hidden");
      fallback.hidden = true;
    } catch (error) {
      svg.setAttribute("hidden", "");
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать пять семейств генеративных моделей: " +
        "где доступен log p и каким путём каждое семейство создаёт образец.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
