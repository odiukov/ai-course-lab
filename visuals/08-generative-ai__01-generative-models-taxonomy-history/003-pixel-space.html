<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Изображение как точка в огромном пространстве</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: ghostwhite;
    --panel: white;
    --ink: midnightblue;
    --muted: slategray;
    --grid: lightsteelblue;
    --accent: royalblue;
    --accent-soft: aliceblue;
    --surface: lavender;
    --sample: mediumvioletred;
    --noise: darkorange;
    --sky: powderblue;
    --hair: darkslateblue;
    --skin: peachpuff;
    --feature: midnightblue;
    --mouth: palevioletred;
    --shirt: mediumseagreen;
    --red: lightcoral;
    --green: lightgreen;
    --blue: lightskyblue;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }

  header {
    color: var(--ink);
    font-size: 24px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  .frame, .space-frame, .grid-line, .arrow-line, .pointer {
    fill: none;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .frame {
    fill: var(--panel);
    stroke: var(--ink);
    stroke-width: 3px;
  }

  .space-back {
    fill: var(--accent-soft);
    stroke: var(--grid);
    stroke-width: 2px;
  }

  .space-frame {
    stroke: var(--ink);
    stroke-width: 2px;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .vector-shell {
    fill: var(--panel);
    stroke: var(--ink);
    stroke-width: 3px;
  }

  .channel-red { fill: var(--red); }
  .channel-green { fill: var(--green); }
  .channel-blue { fill: var(--blue); }

  .sky { fill: var(--sky); }
  .hair { fill: var(--hair); }
  .skin { fill: var(--skin); }
  .feature { fill: var(--feature); }
  .mouth { fill: var(--mouth); }
  .shirt { fill: var(--shirt); }

  .arrow-line {
    stroke: var(--accent);
    stroke-width: 3px;
  }

  .arrow-head { fill: var(--accent); }

  .manifold {
    fill: var(--surface);
    stroke: var(--accent);
    stroke-width: 3px;
    vector-effect: non-scaling-stroke;
    stroke-linejoin: round;
  }

  .sample {
    fill: var(--sample);
    stroke: var(--panel);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .focus {
    fill: var(--accent);
    stroke: var(--panel);
    stroke-width: 3px;
    vector-effect: non-scaling-stroke;
  }

  .noise {
    fill: var(--noise);
    stroke: var(--panel);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .pointer {
    stroke: var(--noise);
    stroke-width: 2px;
  }

  .section-label {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
  }

  .label {
    fill: var(--ink);
    font-size: 17px;
  }

  .strong-label {
    fill: var(--ink);
    font-size: 19px;
    font-weight: bold;
  }

  .small-label {
    fill: var(--muted);
    font-size: 15px;
  }

  .noise-label {
    fill: var(--noise);
    font-size: 16px;
    font-weight: bold;
  }

  #fallback {
    color: var(--ink);
    font-size: 18px;
  }

  [hidden] { display: none; }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: midnightblue;
      --panel: darkslategray;
      --ink: whitesmoke;
      --muted: lightsteelblue;
      --grid: slateblue;
      --accent: lightskyblue;
      --accent-soft: darkslateblue;
      --surface: indigo;
      --sample: hotpink;
      --noise: orange;
      --feature: black;
    }
  }
</style>
</head>
<body>
<header id="diagram-title">Изображение как точка в огромном пространстве</header>

<svg id="diagram" width="1180" height="470" viewBox="0 0 1180 470"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="diagram-title diagram-description">
  <title>Изображение разворачивается в длинный вектор и становится точкой</title>
  <desc id="diagram-description">Картинка 512 на 512 на 3 превращается в вектор из 786 432 чисел. Обучающие примеры лежат редкими точками на тонком многообразии.</desc>
</svg>

<p id="fallback" hidden>Схема должна была показать, как изображение 512 × 512 × 3 разворачивается в вектор из 786 432 чисел, а 10 миллионов обучающих примеров образуют редкие точки на тонком многообразии.</p>

<script>
const data = [{
  image: {x:3, y:8, w:22, h:22, r:0.6},
  tiles: [
    [4,9,"sky"],[8,9,"hair"],[12,9,"hair"],[16,9,"hair"],[20,9,"sky"],
    [4,13,"hair"],[8,13,"skin"],[12,13,"skin"],[16,13,"skin"],[20,13,"hair"],
    [4,17,"hair"],[8,17,"feature"],[12,17,"skin"],[16,17,"feature"],[20,17,"hair"],
    [4,21,"hair"],[8,21,"skin"],[12,21,"mouth"],[16,21,"skin"],[20,21,"hair"],
    [4,25,"sky"],[8,25,"shirt"],[12,25,"shirt"],[16,25,"shirt"],[20,25,"sky"]
  ],
  tileSize: {w:4, h:4},
  vector: {x:39, y:13, w:27, h:10, r:0.7},
  cells: [
    [40,"channel-red"],[41.7,"channel-green"],[43.4,"channel-blue"],
    [45.1,"channel-red"],[46.8,"channel-green"],[48.5,"channel-blue"],
    [50.2,"channel-red"],[51.9,"channel-green"],[53.6,"channel-blue"],
    [55.3,"channel-red"],[57,"channel-green"],[58.7,"channel-blue"],
    [60.4,"channel-red"],[62.1,"channel-green"],[63.8,"channel-blue"]
  ],
  cell: {y:14, w:1.25, h:8, r:0.2},
  arrows: [
    {
      from:{x:27.5,y:19}, to:{x:37,y:19},
      head:[{x:37,y:19},{x:35.4,y:17.8},{x:35.4,y:20.2}]
    },
    {
      from:{x:68,y:19}, to:{x:84.4,y:26.5},
      head:[{x:84.4,y:26.5},{x:82.4,y:26.7},{x:83.2,y:24.9}]
    }
  ],
  space: {
    back:{x:78.5,y:7.5,w:30.5,h:23.5},
    front:{x:82,y:10.5,w:31,h:23.5},
    connectors:[
      [{x:78.5,y:7.5},{x:82,y:10.5}],
      [{x:109,y:7.5},{x:113,y:10.5}],
      [{x:109,y:31},{x:113,y:34}],
      [{x:78.5,y:31},{x:82,y:34}]
    ],
    grid:[
      [{x:88,y:10.5},{x:88,y:34}],
      [{x:94,y:10.5},{x:94,y:34}],
      [{x:100,y:10.5},{x:100,y:34}],
      [{x:106,y:10.5},{x:106,y:34}],
      [{x:82,y:16.5},{x:113,y:16.5}],
      [{x:82,y:22.5},{x:113,y:22.5}],
      [{x:82,y:28.5},{x:113,y:28.5}]
    ]
  },
  manifold: [
    {kind:"M",points:[{x:83.5,y:27.5}]},
    {kind:"C",points:[{x:86,y:21},{x:90,y:17},{x:94,y:20.5}]},
    {kind:"C",points:[{x:98,y:24},{x:101,y:12.5},{x:110.5,y:13}]},
    {kind:"L",points:[{x:111.5,y:16.5}]},
    {kind:"C",points:[{x:103,y:16},{x:101,y:30},{x:94,y:25}]},
    {kind:"C",points:[{x:90,y:22},{x:87,y:29.5},{x:83.5,y:30.5}]},
    {kind:"Z",points:[]}
  ],
  samples: [
    {x:84.4,y:26.5,r:0.65,kind:"focus"},
    {x:86.5,y:23.2,r:0.45,kind:"sample"},
    {x:89.2,y:20.4,r:0.45,kind:"sample"},
    {x:92.1,y:20.2,r:0.45,kind:"sample"},
    {x:94.8,y:22.8,r:0.45,kind:"sample"},
    {x:97.4,y:22.1,r:0.45,kind:"sample"},
    {x:99.4,y:18.4,r:0.45,kind:"sample"},
    {x:101.4,y:15.2,r:0.45,kind:"sample"},
    {x:104.4,y:14.1,r:0.45,kind:"sample"},
    {x:107.4,y:14.2,r:0.45,kind:"sample"},
    {x:109.6,y:14.6,r:0.45,kind:"sample"}
  ],
  noise: {x:108.8,y:27.1,r:0.65},
  pointer: [{x:107.3,y:28.3},{x:108.2,y:27.5}],
  labels: [
    {x:14,y:5.2,dx:0,dy:0,anchor:"middle",text:"ИЗОБРАЖЕНИЕ",kind:"section-label"},
    {x:14,y:33,dx:0,dy:3,anchor:"middle",text:"512 × 512 × 3",kind:"strong-label"},
    {x:28,y:16.2,dx:2,dy:-4,anchor:"start",text:"развернуть",kind:"small-label"},
    {x:52.5,y:9.3,dx:0,dy:-2,anchor:"middle",text:"ВЕКТОР ПИКСЕЛЕЙ",kind:"section-label"},
    {x:52.5,y:26.1,dx:0,dy:4,anchor:"middle",text:"786 432 числа",kind:"strong-label"},
    {x:68,y:15.8,dx:3,dy:-4,anchor:"start",text:"один «адрес»",kind:"small-label"},
    {x:95.5,y:4.2,dx:0,dy:-2,anchor:"middle",text:"ОГРОМНОЕ ПРОСТРАНСТВО",kind:"section-label"},
    {x:107.3,y:28.7,dx:-8,dy:4,anchor:"end",text:"шум",kind:"noise-label"},
    {x:95.5,y:38.1,dx:0,dy:2,anchor:"middle",text:"10 миллионов обучающих примеров",kind:"strong-label"},
    {x:95.5,y:41.2,dx:0,dy:1,anchor:"middle",text:"редкие точки на тонком многообразии",kind:"label"},
    {x:51,y:39.5,dx:-2,dy:2,anchor:"middle",text:"случайный адрес почти всегда → шум",kind:"noise-label"},
    {x:58,y:45.2,dx:0,dy:0,anchor:"middle",text:"Модель учит форму поверхности, а не запоминает отдельные точки",kind:"label"}
  ]
}];

const origin = {x:10, y:5};
const scale = 10;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const [d] = data;
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");

  function node(tag, attributes, text) {
    const element = document.createElementNS(svg.namespaceURI, tag);
    for (const [name, value] of Object.entries(attributes)) {
      element.setAttribute(name, value);
    }
    if (text) element.textContent = text;
    return element;
  }

  function rect(item, className) {
    return node("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.x + item.w) - sx(item.x),
      height: sy(item.y + item.h) - sy(item.y),
      rx: sx(item.r) - sx(0),
      ry: sy(item.r) - sy(0),
      "class": className
    });
  }

  function line(points, className) {
    return node("line", {
      x1: sx(points[0].x),
      y1: sy(points[0].y),
      x2: sx(points[1].x),
      y2: sy(points[1].y),
      "class": className
    });
  }

  function polygon(points, className) {
    return node("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      "class": className
    });
  }

  function path(commands, className) {
    const shape = commands.map(command => {
      if (command.kind === "Z") return "Z";
      const coordinates = command.points
        .map(point => `${sx(point.x)} ${sy(point.y)}`)
        .join(" ");
      return `${command.kind} ${coordinates}`;
    }).join(" ");
    return node("path", {d: shape, "class": className});
  }

  svg.append(rect(d.space.back, "space-back"));
  svg.append(rect(d.space.front, "space-frame"));

  for (const connector of d.space.connectors) {
    svg.append(line(connector, "space-frame"));
  }
  for (const gridLine of d.space.grid) {
    svg.append(line(gridLine, "grid-line"));
  }

  svg.append(path(d.manifold, "manifold"));

  for (const point of d.samples) {
    svg.append(node("circle", {
      cx: sx(point.x),
      cy: sy(point.y),
      r: sx(point.r) - sx(0),
      "class": point.kind
    }));
  }

  svg.append(node("circle", {
    cx: sx(d.noise.x),
    cy: sy(d.noise.y),
    r: sx(d.noise.r) - sx(0),
    "class": "noise"
  }));
  svg.append(line(d.pointer, "pointer"));

  svg.append(rect(d.image, "frame"));
  for (const [x, y, className] of d.tiles) {
    svg.append(rect({
      x:x, y:y, w:d.tileSize.w, h:d.tileSize.h, r:d.cell.r
    }, className));
  }

  svg.append(rect(d.vector, "vector-shell"));
  for (const [x, className] of d.cells) {
    svg.append(rect({
      x:x, y:d.cell.y, w:d.cell.w, h:d.cell.h, r:d.cell.r
    }, className));
  }

  for (const arrow of d.arrows) {
    svg.append(line([arrow.from, arrow.to], "arrow-line"));
    svg.append(polygon(arrow.head, "arrow-head"));
  }

  for (const label of d.labels) {
    svg.append(node("text", {
      x: sx(label.x),
      y: sy(label.y),
      dx: `${label.dx}px`,
      dy: `${label.dy}px`,
      "text-anchor": label.anchor,
      "class": label.kind
    }, label.text));
  }

  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
