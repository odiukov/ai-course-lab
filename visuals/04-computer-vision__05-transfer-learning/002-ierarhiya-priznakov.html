<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Какие признаки хранят разные глубины CNN</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: white;
    --ink: midnightblue;
    --muted: slategray;
    --line: lightsteelblue;
    --transfer: royalblue;
    --transfer-soft: aliceblue;
    --specific: darkorange;
    --specific-soft: oldlace;
    --panel: whitesmoke;
    --node: white;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: midnightblue;
      --ink: ghostwhite;
      --muted: lightsteelblue;
      --line: lightslategray;
      --transfer: lightskyblue;
      --transfer-soft: darkslategray;
      --specific: orange;
      --specific-soft: saddlebrown;
      --panel: darkslateblue;
      --node: midnightblue;
    }
  }

  html, body {
    background: var(--bg);
  }

  body {
    margin: 0;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 500px;
    background: var(--bg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .title {
    fill: var(--ink);
    font-size: 25px;
    font-weight: bold;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 14px;
  }

  .rule,
  .connector,
  .bracket,
  .question-axis {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .question-axis {
    stroke: var(--muted);
  }

  .transfer-block {
    fill: var(--transfer);
    stroke: var(--transfer);
    stroke-width: 2px;
  }

  .specific-block {
    fill: var(--specific);
    stroke: var(--specific);
    stroke-width: 2px;
  }

  .transfer-card {
    fill: var(--transfer-soft);
    stroke: var(--transfer);
    stroke-width: 2px;
  }

  .specific-card {
    fill: var(--specific-soft);
    stroke: var(--specific);
    stroke-width: 2px;
  }

  .card-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .card-note,
  .question,
  .legend {
    fill: var(--muted);
    font-size: 14px;
  }

  .side-label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .transfer-label {
    fill: var(--transfer);
  }

  .specific-label {
    fill: var(--specific);
  }

  .feature {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .feature-accent {
    fill: none;
    stroke: var(--specific);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .question-node {
    fill: var(--node);
    stroke: var(--muted);
    stroke-width: 2px;
  }

  .fallback {
    fill: var(--ink);
    font-size: 17px;
  }
</style>
</head>
<body>
<svg id="diagram"
     viewBox="0 0 1000 500"
     width="1000"
     height="500"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="diagram-title diagram-description">
  <title id="diagram-description">Иерархия признаков ResNet: от краёв и текстур к частям объектов и комбинациям классов ImageNet. Первые 90% иерархии отмечены как хорошо переносимые.</title>
  <rect class="backdrop" width="1000" height="500"></rect>
  <text id="diagram-title" class="title">Какие признаки хранят разные глубины CNN</text>
  <g id="stage"></g>
</svg>

<script>
const data = {
  title: { x: 2, y: 4 },
  subtitle: { x: 2, y: 8, text: "ResNet строит смысл снизу вверх — от локальной границы к целому объекту" },
  rule: { x1: 2, y1: 10, x2: 102, y2: 10 },

  cards: [
    {
      x: 31, y: 13, w: 43, h: 15, kind: "specific-card",
      lines: [
        { x: 47, y: 18, text: "Комбинации классов" },
        { x: 47, y: 22, text: "ImageNet" }
      ],
      note: { x: 47, y: 26, text: "целая конфигурация → одна из 1000 категорий" }
    },
    {
      x: 31, y: 31, w: 43, h: 15, kind: "transfer-card",
      lines: [
        { x: 47, y: 37, text: "Части объектов" }
      ],
      note: { x: 47, y: 43, text: "колесо, руль, сиденье" }
    },
    {
      x: 31, y: 49, w: 43, h: 15, kind: "transfer-card",
      lines: [
        { x: 47, y: 55, text: "Текстуры и узоры" }
      ],
      note: { x: 47, y: 61, text: "спицы, рифление, металлический блеск" }
    },
    {
      x: 31, y: 67, w: 43, h: 15, kind: "transfer-card",
      lines: [
        { x: 47, y: 72, text: "Края и габороподобные" },
        { x: 47, y: 76, text: "фильтры" }
      ],
      note: { x: 47, y: 80, text: "наклон, контраст, смена яркости" }
    }
  ],

  blocks: [
    { x: 19, y: 13, w: 8, h: 6, kind: "specific-block" },
    { x: 19, y: 20, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 27, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 34, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 41, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 48, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 55, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 62, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 69, w: 8, h: 6, kind: "transfer-block" },
    { x: 19, y: 76, w: 8, h: 6, kind: "transfer-block" }
  ],

  bracket: {
    x: 16, top: 20, bottom: 82, cap: 18,
    labels: [
      { x: 2, y: 47, text: "Хорошо" },
      { x: 2, y: 52, text: "переносятся" },
      { x: 2, y: 57, text: "первые 90%" }
    ]
  },

  specificLabels: [
    { x: 2, y: 16, text: "Верхние 10%" },
    { x: 2, y: 21, text: "специфичны классам" }
  ],

  connectors: [
    { x: 27, y: 16, x2: 31, y2: 20 },
    { x: 27, y: 37, x2: 31, y2: 38 },
    { x: 27, y: 56, x2: 31, y2: 56 },
    { x: 27, y: 76, x2: 31, y2: 74 }
  ],

  questionAxis: {
    x: 78, tail: 80, tip: 15, wingLeft: 76.8, wingRight: 79.2, wingY: 18,
    heading: { x: 81, y: 14, text: "Вопрос слоя" },
    tailLabel: { x: 78, y: 87, text: "глубже ↑" }
  },

  questions: [
    { x: 78, y: 22, tx: 81, ty: 23, text: "Что это может быть?" },
    { x: 78, y: 40, tx: 81, ty: 41, text: "Какая часть?" },
    { x: 78, y: 58, tx: 81, ty: 59, text: "Какой узор?" },
    { x: 78, y: 76, tx: 81, ty: 77, text: "Где граница?" }
  ],

  edges: [
    { x1: 34, y1: 78, x2: 39, y2: 70 },
    { x1: 37, y1: 80, x2: 42, y2: 72 },
    { x1: 40, y1: 80, x2: 44, y2: 74 }
  ],

  gabor: [
    { d: [["M", 34, 74], ["Q", 36, 70, 38, 74], ["Q", 40, 78, 42, 74]] },
    { d: [["M", 34, 77], ["Q", 36, 73, 38, 77], ["Q", 40, 81, 42, 77]] }
  ],

  textureLines: [
    { x1: 34, y1: 53, x2: 34, y2: 61 },
    { x1: 36, y1: 52, x2: 36, y2: 62 },
    { x1: 38, y1: 53, x2: 38, y2: 61 },
    { x1: 40, y1: 52, x2: 40, y2: 62 },
    { x1: 42, y1: 53, x2: 42, y2: 61 },
    { x1: 33, y1: 55, x2: 43, y2: 55 },
    { x1: 33, y1: 59, x2: 43, y2: 59 }
  ],

  part: {
    wheel: { cx: 37, cy: 39, r: 3.4 },
    lines: [
      { x1: 37, y1: 39, x2: 42, y2: 35 },
      { x1: 42, y1: 35, x2: 44, y2: 36 },
      { x1: 41, y1: 34, x2: 44, y2: 34 }
    ]
  },

  bicycle: {
    wheels: [
      { cx: 35, cy: 24, r: 2.2 },
      { cx: 43, cy: 24, r: 2.2 }
    ],
    lines: [
      { x1: 35, y1: 24, x2: 38, y2: 18 },
      { x1: 38, y1: 18, x2: 41, y2: 24 },
      { x1: 41, y1: 24, x2: 35, y2: 24 },
      { x1: 38, y1: 18, x2: 43, y2: 24 },
      { x1: 38, y1: 18, x2: 37, y2: 16 },
      { x1: 36, y1: 16, x2: 39, y2: 16 },
      { x1: 43, y1: 24, x2: 42, y2: 17 },
      { x1: 42, y1: 17, x2: 44, y2: 16 }
    ]
  },

  legend: [
    { x1: 19, y1: 91, x2: 23, y2: 91, tx: 25, ty: 92, kind: "transfer", text: "переносимый backbone" },
    { x1: 50, y1: 91, x2: 54, y2: 91, tx: 56, ty: 92, kind: "specific", text: "классовая специализация" }
  ],

  radii: { card: 1.2, node: 0.55 },
  fallback: { x: 4, y: 20 }
};

const origin = { x: 40, y: 24 };
const scale = { x: 9.2, y: 4.65 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const stage = document.getElementById("stage");
  const title = document.getElementById("diagram-title");

  const make = (name, attrs, textValue) => {
    const element = document.createElementNS(svg.namespaceURI, name);
    for (const [key, value] of Object.entries(attrs || {})) {
      element.setAttribute(key, value);
    }
    if (textValue !== undefined) element.textContent = textValue;
    element.setAttribute("data-dynamic", "true");
    return element;
  };

  const add = element => stage.appendChild(element);

  const line = (item, className) => add(make("line", {
    x1: sx(item.x1), y1: sy(item.y1),
    x2: sx(item.x2), y2: sy(item.y2),
    class: className
  }));

  const text = (item, className, anchor) => add(make("text", {
    x: sx(item.x), y: sy(item.y),
    class: className,
    "text-anchor": anchor || "start"
  }, item.text));

  const rect = (item, className) => add(make("rect", {
    x: sx(item.x),
    y: sy(item.y),
    width: sx(item.x + item.w) - sx(item.x),
    height: sy(item.y + item.h) - sy(item.y),
    rx: sx(data.radii.card) - sx(0),
    class: className
  }));

  const circle = (item, className) => add(make("circle", {
    cx: sx(item.cx),
    cy: sy(item.cy),
    r: sx(item.r) - sx(0),
    class: className
  }));

  const pathFrom = item => {
    const commands = item.d.map(command => {
      const [kind, x, y, x2, y2] = command;
      if (x2 === undefined) return `${kind} ${sx(x)} ${sy(y)}`;
      return `${kind} ${sx(x)} ${sy(y)} ${sx(x2)} ${sy(y2)}`;
    }).join(" ");
    add(make("path", { d: commands, class: "feature" }));
  };

  title.setAttribute("x", sx(data.title.x));
  title.setAttribute("y", sy(data.title.y));

  text(data.subtitle, "subtitle");
  line(data.rule, "rule");

  for (const block of data.blocks) rect(block, block.kind);

  line(
    { x1: data.bracket.x, y1: data.bracket.top, x2: data.bracket.x, y2: data.bracket.bottom },
    "bracket"
  );
  line(
    { x1: data.bracket.x, y1: data.bracket.top, x2: data.bracket.cap, y2: data.bracket.top },
    "bracket"
  );
  line(
    { x1: data.bracket.x, y1: data.bracket.bottom, x2: data.bracket.cap, y2: data.bracket.bottom },
    "bracket"
  );

  for (const label of data.bracket.labels) text(label, "side-label transfer-label");
  for (const label of data.specificLabels) text(label, "side-label specific-label");

  for (const connector of data.connectors) line(connector, "connector");

  for (const card of data.cards) {
    rect(card, card.kind);
    for (const heading of card.lines) text(heading, "card-title");
    text(card.note, "card-note");
  }

  for (const edge of data.edges) line(edge, "feature");
  for (const wave of data.gabor) pathFrom(wave);
  for (const texture of data.textureLines) line(texture, "feature");

  circle(data.part.wheel, "feature");
  for (const partLine of data.part.lines) line(partLine, "feature");

  for (const wheel of data.bicycle.wheels) circle(wheel, "feature-accent");
  for (const bikeLine of data.bicycle.lines) line(bikeLine, "feature-accent");

  line(
    {
      x1: data.questionAxis.x,
      y1: data.questionAxis.tail,
      x2: data.questionAxis.x,
      y2: data.questionAxis.tip
    },
    "question-axis"
  );
  line(
    {
      x1: data.questionAxis.x,
      y1: data.questionAxis.tip,
      x2: data.questionAxis.wingLeft,
      y2: data.questionAxis.wingY
    },
    "question-axis"
  );
  line(
    {
      x1: data.questionAxis.x,
      y1: data.questionAxis.tip,
      x2: data.questionAxis.wingRight,
      y2: data.questionAxis.wingY
    },
    "question-axis"
  );

  text(data.questionAxis.heading, "side-label");
  text(data.questionAxis.tailLabel, "side-label", "middle");

  for (const question of data.questions) {
    circle(
      { cx: question.x, cy: question.y, r: data.radii.node },
      "question-node"
    );
    text(
      { x: question.tx, y: question.ty, text: question.text },
      "question"
    );
  }

  for (const item of data.legend) {
    line(item, item.kind === "transfer" ? "transfer-block" : "specific-block");
    text(
      { x: item.tx, y: item.ty, text: item.text },
      "legend"
    );
  }
} catch (error) {
  const svg = document.getElementById("diagram");
  const stage = document.getElementById("stage");
  const title = document.getElementById("diagram-title");

  title.setAttribute("x", sx(data.title.x));
  title.setAttribute("y", sy(data.title.y));

  while (stage.firstChild) stage.removeChild(stage.firstChild);

  const fallback = document.createElementNS(svg.namespaceURI, "text");
  fallback.setAttribute("x", sx(data.fallback.x));
  fallback.setAttribute("y", sy(data.fallback.y));
  fallback.setAttribute("class", "fallback");
  fallback.textContent = "Схема должна показать иерархию ResNet: края → текстуры → части объектов → комбинации классов ImageNet; первые 90% хорошо переносятся.";
  stage.appendChild(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
