<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как растёт число совместных действий</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #657087;
      --axis: #34405a;
      --guide: #d9dfeb;
      --stem: #aeb9cc;
      --area: #e7e4ff;
      --line: #6657d9;
      --point: #5647c7;
      --point-core: #ffffff;
      --badge: #4537af;
      --halo: #ffffff;
      --border: #dfe4ee;
      --fallback: #8a2f45;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --panel: #171c2a;
        --text: #eef1f8;
        --muted: #aab3c5;
        --axis: #c9d0df;
        --guide: #31394b;
        --stem: #56627a;
        --area: #2c2851;
        --line: #a89cff;
        --point: #b3a8ff;
        --point-core: #171c2a;
        --badge: #c0b8ff;
        --halo: #171c2a;
        --border: #30384a;
        --fallback: #ff9fb3;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 10px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 7px 0 5px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .lead strong {
      color: var(--text);
      font-weight: 700;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 410px;
      overflow: visible;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: var(--axis);
      vector-effect: non-scaling-stroke;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .stem {
      stroke: var(--stem);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .area {
      fill: var(--area);
      stroke: none;
    }

    .growth-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .point-ring {
      fill: var(--panel);
      stroke: var(--point);
      stroke-width: 4;
      vector-effect: non-scaling-stroke;
    }

    .point-core {
      fill: var(--point);
      stroke: var(--point-core);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .value-label,
    .multiply-label {
      paint-order: stroke fill;
      stroke: var(--halo);
      stroke-width: 7;
      stroke-linejoin: round;
    }

    .value-label {
      fill: var(--text);
      font-size: 21px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .agent-label {
      fill: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .multiply-label {
      fill: var(--badge);
      font-size: 17px;
      font-weight: 800;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .caption {
      fill: var(--muted);
      font-size: 14px;
    }

    #fallback {
      display: none;
      margin: 18px 4px 10px;
      color: var(--fallback);
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <h1>Как растёт число совместных действий</h1>
    <p class="lead">
      У каждого агента <strong>4 действия</strong>. Каждый новый агент
      умножает всё пространство комбинаций ещё на 4.
    </p>

    <svg
      id="diagram"
      viewBox="0 0 960 410"
      width="960"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    ></svg>

    <p id="fallback">
      При 4 действиях на агента пространство растёт так:
      2 агента — 16 комбинаций, 3 — 64, 4 — 256, 5 — 1024.
    </p>
  </main>

  <script>
    const DATA = Object.freeze([
      Object.freeze({
        agents: 2,
        combinations: 16,
        x: 0.30,
        valueDx: 0,
        valueDy: -21,
        valueAnchor: "middle",
        agentDx: 0,
        agentDy: 29
      }),
      Object.freeze({
        agents: 3,
        combinations: 64,
        x: 1.30,
        valueDx: 0,
        valueDy: -21,
        valueAnchor: "middle",
        agentDx: 0,
        agentDy: 29
      }),
      Object.freeze({
        agents: 4,
        combinations: 256,
        x: 2.30,
        valueDx: 0,
        valueDy: -21,
        valueAnchor: "middle",
        agentDx: 0,
        agentDy: 29
      }),
      Object.freeze({
        agents: 5,
        combinations: 1024,
        x: 3.30,
        valueDx: 0,
        valueDy: -22,
        valueAnchor: "middle",
        agentDx: 0,
        agentDy: 29
      })
    ]);

    const ORIGIN = Object.freeze({ x: 112, y: 342 });
    const SCALE = Object.freeze({ x: 218, y: 0.255 });

    const LAYOUT = Object.freeze({
      zero: 0,
      firstIndex: 0,
      lastIndex: -1,
      axisEndX: 3.66,
      axisTopY: 1132,
      xHeadBase: 3.53,
      xHeadHalfHeight: 25,
      yHeadBase: 1080,
      yHeadHalfWidth: 0.055,
      tickHalfWidth: 0.035,
      tickHeight: 18,
      ringRadius: 0.045,
      coreRadius: 0.021,
      axisTitleX: 0,
      axisTitleY: 1132,
      axisTitleDx: 13,
      axisTitleDy: 5,
      xTitleX: 3.62,
      xTitleY: 0,
      xTitleDx: 0,
      xTitleDy: 31,
      captionX: 1.81,
      captionY: -191,
      captionDx: 0,
      captionDy: 0,
      multiplyDy: -14,
      expectedCount: 4
    });

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    const sx = x => ORIGIN.x + x * SCALE.x;
    const sy = y => ORIGIN.y - y * SCALE.y;

    try {
      if (!svg || !fallback || DATA.length !== LAYOUT.expectedCount) {
        throw new Error("Недостаточно данных для построения схемы");
      }

      const make = (name, attributes, className) => {
        const node = document.createElementNS(NS, name);

        Object.entries(attributes || {}).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });

        if (className) {
          node.setAttribute("class", className);
        }

        return node;
      };

      const addText = ({
        text,
        x,
        y,
        dx,
        dy,
        anchor,
        className
      }) => {
        const node = make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            dx,
            dy,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          className
        );

        node.textContent = text;
        svg.appendChild(node);
        return node;
      };

      const title = make("title", { id: "svg-title" });
      title.textContent = "Экспоненциальный рост совместных действий";
      svg.appendChild(title);

      const description = make("desc", { id: "svg-description" });
      description.textContent =
        "Ломаная растёт всё круче: для двух агентов показано 16 комбинаций, для трёх 64, для четырёх 256, для пяти 1024.";
      svg.appendChild(description);

      const areaPoints = [
        `${sx(DATA.at(LAYOUT.firstIndex).x)},${sy(LAYOUT.zero)}`,
        ...DATA.map(
          item => `${sx(item.x)},${sy(item.combinations)}`
        ),
        `${sx(DATA.at(LAYOUT.lastIndex).x)},${sy(LAYOUT.zero)}`
      ].join(" ");

      svg.appendChild(
        make("polygon", { points: areaPoints }, "area")
      );

      DATA.forEach(item => {
        svg.appendChild(
          make(
            "line",
            {
              x1: sx(LAYOUT.zero),
              y1: sy(item.combinations),
              x2: sx(item.x),
              y2: sy(item.combinations)
            },
            "guide"
          )
        );

        svg.appendChild(
          make(
            "line",
            {
              x1: sx(item.x),
              y1: sy(LAYOUT.zero),
              x2: sx(item.x),
              y2: sy(item.combinations)
            },
            "stem"
          )
        );
      });

      svg.appendChild(
        make(
          "line",
          {
            x1: sx(LAYOUT.zero),
            y1: sy(LAYOUT.zero),
            x2: sx(LAYOUT.axisEndX),
            y2: sy(LAYOUT.zero)
          },
          "axis"
        )
      );

      svg.appendChild(
        make(
          "polygon",
          {
            points: [
              `${sx(LAYOUT.axisEndX)},${sy(LAYOUT.zero)}`,
              `${sx(LAYOUT.xHeadBase)},${sy(LAYOUT.xHeadHalfHeight)}`,
              `${sx(LAYOUT.xHeadBase)},${sy(-LAYOUT.xHeadHalfHeight)}`
            ].join(" ")
          },
          "axis"
        )
      );

      svg.appendChild(
        make(
          "line",
          {
            x1: sx(LAYOUT.zero),
            y1: sy(LAYOUT.zero),
            x2: sx(LAYOUT.zero),
            y2: sy(LAYOUT.axisTopY)
          },
          "axis"
        )
      );

      svg.appendChild(
        make(
          "polygon",
          {
            points: [
              `${sx(LAYOUT.zero)},${sy(LAYOUT.axisTopY)}`,
              `${sx(-LAYOUT.yHeadHalfWidth)},${sy(LAYOUT.yHeadBase)}`,
              `${sx(LAYOUT.yHeadHalfWidth)},${sy(LAYOUT.yHeadBase)}`
            ].join(" ")
          },
          "axis"
        )
      );

      DATA.forEach(item => {
        svg.appendChild(
          make(
            "line",
            {
              x1: sx(item.x),
              y1: sy(LAYOUT.tickHeight),
              x2: sx(item.x),
              y2: sy(-LAYOUT.tickHeight)
            },
            "axis"
          )
        );

        svg.appendChild(
          make(
            "line",
            {
              x1: sx(-LAYOUT.tickHalfWidth),
              y1: sy(item.combinations),
              x2: sx(LAYOUT.tickHalfWidth),
              y2: sy(item.combinations)
            },
            "axis"
          )
        );
      });

      const growthPoints = DATA.map(
        item => `${sx(item.x)},${sy(item.combinations)}`
      ).join(" ");

      svg.appendChild(
        make("polyline", { points: growthPoints }, "growth-line")
      );

      DATA.forEach(item => {
        svg.appendChild(
          make(
            "circle",
            {
              cx: sx(item.x),
              cy: sy(item.combinations),
              r: sx(LAYOUT.ringRadius) - sx(LAYOUT.zero)
            },
            "point-ring"
          )
        );

        svg.appendChild(
          make(
            "circle",
            {
              cx: sx(item.x),
              cy: sy(item.combinations),
              r: sx(LAYOUT.coreRadius) - sx(LAYOUT.zero)
            },
            "point-core"
          )
        );

        addText({
          text: String(item.combinations),
          x: item.x,
          y: item.combinations,
          dx: item.valueDx,
          dy: item.valueDy,
          anchor: item.valueAnchor,
          className: "value-label"
        });

        addText({
          text: `${item.agents} агента`,
          x: item.x,
          y: LAYOUT.zero,
          dx: item.agentDx,
          dy: item.agentDy,
          anchor: "middle",
          className: "agent-label"
        });
      });

      DATA.slice(LAYOUT.firstIndex, LAYOUT.lastIndex).forEach(
        (item, index) => {
          const next = DATA[index - LAYOUT.lastIndex];
          const middleX = (item.x + next.x) / LAYOUT.expectedCount * DATA[LAYOUT.firstIndex].agents;
          const middleY =
            (item.combinations + next.combinations) /
            DATA[LAYOUT.firstIndex].agents;

          addText({
            text: "×4",
            x: middleX,
            y: middleY,
            dx: LAYOUT.zero,
            dy: LAYOUT.multiplyDy,
            anchor: "middle",
            className: "multiply-label"
          });
        }
      );

      addText({
        text: "совместные комбинации",
        x: LAYOUT.axisTitleX,
        y: LAYOUT.axisTitleY,
        dx: LAYOUT.axisTitleDx,
        dy: LAYOUT.axisTitleDy,
        anchor: "start",
        className: "axis-label"
      });

      addText({
        text: "число агентов",
        x: LAYOUT.xTitleX,
        y: LAYOUT.xTitleY,
        dx: LAYOUT.xTitleDx,
        dy: LAYOUT.xTitleDy,
        anchor: "end",
        className: "axis-label"
      });

      addText({
        text: "Равный шаг вправо — всё больший скачок вверх",
        x: LAYOUT.captionX,
        y: LAYOUT.captionY,
        dx: LAYOUT.captionDx,
        dy: LAYOUT.captionDy,
        anchor: "middle",
        className: "caption"
      });
    } catch (error) {
      svg.style.display = "none";
      fallback.style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
