<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Политика соперника как движущаяся мишень</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #eef2f7;
    --ink: #172033;
    --muted: #58657a;
    --border: #cbd5e1;
    --blue: #2474d8;
    --blue-soft: #e8f2ff;
    --orange: #d96a18;
    --orange-soft: #fff0e5;
    --violet: #7653c6;
    --violet-soft: #f1ecff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: unset;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .figure {
    width: 100%;
    max-width: 960px;
    max-height: 520px;
    margin-inline: auto;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  h1 {
    margin: unset;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
    color: var(--ink);
    background: var(--panel);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--panel);
  }

  .card {
    stroke: var(--border);
    stroke-width: 2px;
  }

  .agent-a {
    fill: var(--blue-soft);
    stroke: var(--blue);
  }

  .agent-b {
    fill: var(--orange-soft);
    stroke: var(--orange);
  }

  .environment {
    fill: var(--violet-soft);
    stroke: var(--violet);
  }

  .conclusion {
    fill: var(--panel-soft);
    stroke: var(--border);
  }

  .title {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .body-text {
    fill: var(--ink);
    font-size: 15px;
  }

  .small-text {
    fill: var(--muted);
    font-size: 14px;
  }

  .blue-text {
    fill: var(--blue);
    font-size: 14px;
    font-weight: bold;
  }

  .orange-text {
    fill: var(--orange);
    font-size: 14px;
    font-weight: bold;
  }

  .violet-text {
    fill: var(--violet);
    font-size: 14px;
    font-weight: bold;
  }

  .outcome {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .arrow-a {
    fill: none;
    stroke: var(--blue);
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-b {
    fill: none;
    stroke: var(--orange);
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-a-head {
    fill: var(--blue);
  }

  .arrow-b-head {
    fill: var(--orange);
  }

  .guide {
    fill: none;
    stroke: var(--border);
    stroke-width: 2px;
  }

  .halo {
    paint-order: stroke fill;
    stroke: var(--panel);
    stroke-width: 5px;
    stroke-linejoin: round;
  }

  #fallback {
    color: var(--ink);
    background: var(--panel);
    font-size: 16px;
    text-align: center;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10151f;
      --panel: #171e2a;
      --panel-soft: #202a39;
      --ink: #eef4ff;
      --muted: #aebbd0;
      --border: #435168;
      --blue: #69a9ff;
      --blue-soft: #172d49;
      --orange: #ff9a52;
      --orange-soft: #44291d;
      --violet: #b69aff;
      --violet-soft: #2b2544;
    }
  }
</style>
</head>
<body>
<main class="figure">
  <h1>Политика соперника как движущаяся мишень</h1>
  <svg id="diagram"
       width="960"
       height="470"
       viewBox="0 0 960 470"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Два обучающихся агента в общей среде</title>
    <desc id="svg-desc">
      Обновление политики первого агента меняет переходы для второго,
      а обновление политики второго меняет переходы для первого.
    </desc>
    <g id="stage"></g>
  </svg>
  <p id="fallback" hidden>
    Два агента действуют в одной среде: когда один обновляет политику,
    переходы и результаты действий другого меняются.
  </p>
</main>

<script>
const data = [
  {
    zero: 0,
    corner: 14,
    dot: 5,
    dash: [8, 7],
    labelOffset: 8,
    cards: [
      { x: -440, y: 70, w: 310, h: 125, r: 14, kind: "agent-a" },
      { x: 130, y: 70, w: 310, h: 125, r: 14, kind: "agent-b" },
      { x: -155, y: -65, w: 310, h: 90, r: 14, kind: "environment" },
      { x: -360, y: -210, w: 720, h: 65, r: 14, kind: "conclusion" }
    ],
    texts: [
      { x: -285, y: 168, text: "Первый агент", className: "title", anchor: "middle" },
      { x: -285, y: 141, text: "политика πA обновляется", className: "blue-text", anchor: "middle" },
      { x: -285, y: 113, text: "тот же удар влево", className: "body-text", anchor: "middle" },
      { x: -285, y: 86, text: "8 из 10  →  3 из 10", className: "outcome", anchor: "middle" },

      { x: 285, y: 168, text: "Второй агент", className: "title", anchor: "middle" },
      { x: 285, y: 141, text: "политика πB обновляется", className: "orange-text", anchor: "middle" },
      { x: 285, y: 113, text: "замечает закономерность", className: "body-text", anchor: "middle" },
      { x: 285, y: 86, text: "чаще закрывает левый угол", className: "body-text", anchor: "middle" },

      { x: 0, y: 3, text: "Одна общая среда", className: "title", anchor: "middle" },
      { x: 0, y: -27, text: "исход зависит от действий обоих", className: "small-text", anchor: "middle" },

      { x: 0, y: -169, text: "Движущаяся мишень", className: "title", anchor: "middle" },
      { x: 0, y: -197, text: "каждое обновление меняет задачу другого агента", className: "body-text", anchor: "middle" }
    ],
    actions: [
      {
        className: "arrow-a",
        headClass: "arrow-a-head",
        start: { x: -270, y: 70 },
        c1: { x: -252, y: 52 },
        c2: { x: -165, y: 34 },
        end: { x: -102, y: 24 },
        head: [
          { x: -102, y: 24 },
          { x: -122, y: 34 },
          { x: -118, y: 16 }
        ],
        label: {
          x: -193, y: 53, dx: -8, dy: -8,
          text: "действие первого",
          className: "blue-text halo",
          anchor: "middle"
        }
      },
      {
        className: "arrow-b",
        headClass: "arrow-b-head",
        start: { x: 270, y: 70 },
        c1: { x: 252, y: 52 },
        c2: { x: 165, y: 34 },
        end: { x: 102, y: 24 },
        head: [
          { x: 102, y: 24 },
          { x: 122, y: 34 },
          { x: 118, y: 16 }
        ],
        label: {
          x: 193, y: 53, dx: 8, dy: -8,
          text: "действие второго",
          className: "orange-text halo",
          anchor: "middle"
        }
      }
    ],
    effects: [
      {
        className: "arrow-b",
        headClass: "arrow-b-head",
        start: { x: -92, y: -65 },
        c1: { x: -226, y: -101 },
        c2: { x: -432, y: -27 },
        end: { x: -405, y: 70 },
        head: [
          { x: -405, y: 70 },
          { x: -419, y: 50 },
          { x: -394, y: 53 }
        ],
        labels: [
          {
            x: -322, y: -77, dx: -8, dy: -8,
            text: "πB меняет",
            className: "orange-text halo",
            anchor: "middle"
          },
          {
            x: -322, y: -104, dx: -8, dy: 8,
            text: "переходы для первого",
            className: "body-text halo",
            anchor: "middle"
          }
        ]
      },
      {
        className: "arrow-a",
        headClass: "arrow-a-head",
        start: { x: 92, y: -65 },
        c1: { x: 226, y: -101 },
        c2: { x: 432, y: -27 },
        end: { x: 405, y: 70 },
        head: [
          { x: 405, y: 70 },
          { x: 419, y: 50 },
          { x: 394, y: 53 }
        ],
        labels: [
          {
            x: 322, y: -77, dx: 8, dy: -8,
            text: "πA меняет",
            className: "blue-text halo",
            anchor: "middle"
          },
          {
            x: 322, y: -104, dx: 8, dy: 8,
            text: "переходы для второго",
            className: "body-text halo",
            anchor: "middle"
          }
        ]
      }
    ],
    guide: {
      start: { x: -120, y: -122 },
      c1: { x: -72, y: -137 },
      c2: { x: 72, y: -137 },
      end: { x: 120, y: -122 }
    },
    guideText: {
      x: 0, y: -119, dx: 0, dy: -8,
      text: "обе политики продолжают учиться",
      className: "violet-text halo",
      anchor: "middle"
    },
    dots: [
      { x: -270, y: 70, className: "arrow-a-head", r: 5 },
      { x: 270, y: 70, className: "arrow-b-head", r: 5 },
      { x: -92, y: -65, className: "arrow-b-head", r: 5 },
      { x: 92, y: -65, className: "arrow-a-head", r: 5 }
    ]
  }
];

const origin = { x: 480, y: 235 };
const scale = 1;
const sx = x => origin.x + x * scale;
const sy = y => origin.y - y * scale;

try {
  const model = data.find(Boolean);
  const svg = document.getElementById("diagram");
  const stage = document.getElementById("stage");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  const create = (tag, attributes, parent = stage) => {
    const element = document.createElementNS(namespace, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      element.setAttribute(name, String(value));
    });
    parent.appendChild(element);
    return element;
  };

  const drawRect = item => {
    const left = sx(item.x);
    const right = sx(item.x + item.w);
    const top = sy(item.y + item.h);
    const bottom = sy(item.y);
    create("rect", {
      x: left,
      y: top,
      width: Math.abs(right - left),
      height: Math.abs(bottom - top),
      rx: Math.abs(sx(item.r) - sx(model.zero)),
      ry: Math.abs(sy(item.r) - sy(model.zero)),
      class: `card ${item.kind}`
    });
  };

  const drawText = item => {
    const text = create("text", {
      x: sx(item.x),
      y: sy(item.y),
      dx: item.dx ?? model.zero,
      dy: item.dy ?? model.zero,
      "text-anchor": item.anchor,
      class: item.className
    });
    text.textContent = item.text;
  };

  const curveData = item =>
    `M ${sx(item.start.x)} ${sy(item.start.y)} ` +
    `C ${sx(item.c1.x)} ${sy(item.c1.y)}, ` +
    `${sx(item.c2.x)} ${sy(item.c2.y)}, ` +
    `${sx(item.end.x)} ${sy(item.end.y)}`;

  const drawHead = item => {
    create("polygon", {
      points: item.head
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" "),
      class: item.headClass
    });
  };

  const drawArrow = item => {
    create("path", {
      d: curveData(item),
      class: item.className
    });
    drawHead(item);
  };

  model.cards.forEach(drawRect);

  create("path", {
    d: curveData(model.guide),
    class: "guide",
    "stroke-dasharray": model.dash.join(" ")
  });

  model.actions.forEach(drawArrow);
  model.effects.forEach(drawArrow);

  model.dots.forEach(item => {
    create("circle", {
      cx: sx(item.x),
      cy: sy(item.y),
      r: Math.abs(sx(item.r) - sx(model.zero)),
      class: item.className
    });
  });

  model.texts.forEach(drawText);
  model.actions.forEach(item => drawText(item.label));
  model.effects.forEach(item => item.labels.forEach(drawText));
  drawText(model.guideText);

  fallback.hidden = true;
  svg.hidden = false;
} catch (error) {
  const svg = document.getElementById("diagram");
  const stage = document.getElementById("stage");
  const fallback = document.getElementById("fallback");
  if (stage) stage.replaceChildren();
  if (svg) svg.hidden = true;
  if (fallback) fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
