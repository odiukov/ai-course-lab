<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Откуда берётся 70 проходов</title>
<style>
  :root{
    --bg:#fbfbf8; --fg:#1c1c1c; --muted:#6a6a6a;
    --text:#2f6fb5; --img:#b5622f; --bad:#b03030; --grid:#d6d6d0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e8e8e6; --muted:#9a9a96;
      --text:#6fa8e0; --img:#e0a06f; --bad:#e07070; --grid:#33363c;
    }
  }
  html,body{margin:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:8px 4px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 4px;text-align:center;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;}
  .fail{color:var(--bad);font-size:13px;padding:8px;line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Откуда берётся 70 проходов</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---------- данные ----------
    var D = {
      textSteps: 50,      // текстовых токенов = проходов
      patches: 256,       // патчей в картинке
      diffSteps: 20,      // шагов расшумления = проходов
      wrong: 5120,
      total: 70
    };

    // ---------- холст ----------
    var VBW = 900, VBH = 470;
    var PAD = 6, FS = 13, FSB = 16, FSS = 11.5;

    // ---------- одна система координат ----------
    var origin = {x: 62, y: 300};   // sx(0), sy(0)
    var scale  = 4.4;               // пикселей на единицу
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,cls,anchor,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor||'middle',
        'font-size':size||FS,class:cls||''});
      t.textContent=s; return t;
    }

    var svg = el('svg',{viewBox:'0 0 '+VBW+' '+VBH,
      preserveAspectRatio:'xMidYMid meet',
      xmlns:NS,'font-family':'inherit'});
    svg.appendChild(el('rect',{x:0,y:0,width:VBW,height:VBH,fill:'var(--bg)'}));

    // ---------- полоса проходов ----------
    // ось X в единицах: 0..70 проходов. Y: уровни в тех же единицах.
    var Y_BAR = 0, H_BAR = 9;          // полоса проходов
    var Y_PATCH = 26;                  // ряд патчей над картиночной частью

    // 50 текстовых проходов — по одному токену
    var g = el('g',{});
    for(var i=0;i<D.textSteps;i++){
      g.appendChild(el('rect',{
        x:sx(i)+0.7, y:sy(Y_BAR+H_BAR),
        width:sx(1)-sx(0)-1.4, height:sy(Y_BAR)-sy(Y_BAR+H_BAR),
        fill:'var(--text)','fill-opacity':0.75}));
    }
    // 20 проходов расшумления — каждый на все 256 патчей
    for(var j=0;j<D.diffSteps;j++){
      var x0 = D.textSteps + j;
      g.appendChild(el('rect',{
        x:sx(x0)+0.7, y:sy(Y_BAR+H_BAR),
        width:sx(1)-sx(0)-1.4, height:sy(Y_BAR)-sy(Y_BAR+H_BAR),
        fill:'var(--img)','fill-opacity':0.85}));
    }
    svg.appendChild(g);

    // рамка-разделитель между частями
    svg.appendChild(el('line',{x1:sx(D.textSteps),y1:sy(Y_BAR-6),
      x2:sx(D.textSteps),y2:sy(Y_PATCH+13),
      stroke:'var(--grid)','stroke-width':1.5,'stroke-dasharray':'4 4'}));

    // ---------- скобки под частями ----------
    function brace(a,b,yTop,yBot,color){
      var p='M'+sx(a)+' '+sy(yTop)+' L'+sx(a)+' '+sy(yBot)+
            ' L'+sx(b)+' '+sy(yBot)+' L'+sx(b)+' '+sy(yTop);
      svg.appendChild(el('path',{d:p,fill:'none',stroke:color,'stroke-width':1.5}));
    }
    brace(0,D.textSteps,Y_BAR-2,Y_BAR-7,'var(--text)');
    brace(D.textSteps,D.textSteps+D.diffSteps,Y_BAR-2,Y_BAR-7,'var(--img)');

    // подписи под скобками: текст — влево-центр, картинка — вправо-центр
    svg.appendChild(txt(sx(D.textSteps/2), sy(Y_BAR-7)+FSB+PAD,
      '50 текстовых шагов', 'lbl-text','middle',FSB));
    var tt=svg.lastChild; tt.setAttribute('fill','var(--text)');
    tt.setAttribute('font-weight','600');
    svg.appendChild(txt(sx(D.textSteps/2), sy(Y_BAR-7)+FSB+PAD+FS+4,
      'по одному токену за проход','','middle',FSS));
    svg.lastChild.setAttribute('fill','var(--muted)');

    svg.appendChild(txt(sx(D.textSteps+D.diffSteps/2), sy(Y_BAR-7)+FSB+PAD,
      '20 шагов расшумления','','middle',FSB));
    var ti=svg.lastChild; ti.setAttribute('fill','var(--img)');
    ti.setAttribute('font-weight','600');
    svg.appendChild(txt(sx(D.textSteps+D.diffSteps/2), sy(Y_BAR-7)+FSB+PAD+FS+4,
      'все 256 патчей сразу','','middle',FSS));
    svg.lastChild.setAttribute('fill','var(--muted)');

    // ---------- ряд из 256 патчей над диффузионной частью ----------
    // 16 x 16 сетка, вписана в ширину 20 проходов
    var gridN = 16, cellW = D.diffSteps/gridN, cellH = 0.75;
    var gx0 = D.textSteps, gy0 = Y_PATCH;
    var gp = el('g',{});
    for(var r=0;r<gridN;r++){
      for(var c=0;c<gridN;c++){
        gp.appendChild(el('rect',{
          x:sx(gx0+c*cellW)+0.35, y:sy(gy0+(gridN-r)*cellH)+0.35,
          width:sx(cellW)-sx(0)-0.7, height:sy(0)-sy(cellH)-0.7,
          fill:'var(--img)','fill-opacity':0.28}));
      }
    }
    svg.appendChild(gp);

    // стрелка: все патчи -> один проход. Ставим у ХВОСТА подпись.
    var arrX = D.textSteps + D.diffSteps/2;
    var aTop = gy0, aBot = Y_BAR + H_BAR + 3.5;
    svg.appendChild(el('line',{x1:sx(arrX),y1:sy(aTop),x2:sx(arrX),y2:sy(aBot+2.2),
      stroke:'var(--img)','stroke-width':1.6}));
    var hw=1.6, hh=2.6;
    svg.appendChild(el('path',{
      d:'M'+sx(arrX)+' '+sy(aBot)+' L'+sx(arrX-hw)+' '+sy(aBot+hh)+
        ' L'+sx(arrX+hw)+' '+sy(aBot+hh)+' Z',
      fill:'var(--img)'}));
    // подпись сбоку от хвоста стрелки
    svg.appendChild(txt(sx(arrX)-PAD, sy(aTop)-PAD,
      '256 патчей — один проход','','end',FSS));
    svg.lastChild.setAttribute('fill','var(--img)');

    // подпись к сетке патчей, справа от неё
    svg.appendChild(txt(sx(gx0+D.diffSteps)+PAD, sy(gy0+gridN*cellH/2),
      '256 патчей','','start',FS));
    svg.lastChild.setAttribute('fill','var(--muted)');
    svg.lastChild.setAttribute('dominant-baseline','middle');

    // ---------- цепочка текстовых токенов над текстовой частью ----------
    var tY = gy0 + 3;
    for(var k=0;k<D.textSteps;k++){
      svg.appendChild(el('rect',{
        x:sx(k)+0.7, y:sy(tY+2.4),
        width:sx(1)-sx(0)-1.4, height:sy(tY)-sy(tY+2.4),
        fill:'var(--text)','fill-opacity':0.3}));
    }
    // стрелка вниз от цепочки: подпись у хвоста, слева
    var tArrX = D.textSteps/2;
    svg.appendChild(el('line',{x1:sx(tArrX),y1:sy(tY),x2:sx(tArrX),y2:sy(aBot+2.2),
      stroke:'var(--text)','stroke-width':1.6}));
    svg.appendChild(el('path',{
      d:'M'+sx(tArrX)+' '+sy(aBot)+' L'+sx(tArrX-hw)+' '+sy(aBot+hh)+
        ' L'+sx(tArrX+hw)+' '+sy(aBot+hh)+' Z',
      fill:'var(--text)'}));
    svg.appendChild(txt(sx(tArrX)-PAD, sy(tY)-PAD,
      'токен за токеном','','end',FSS));
    svg.lastChild.setAttribute('fill','var(--text)');

    // ---------- итог справа ----------
    var sumX = D.textSteps + D.diffSteps + 3.5;
    svg.appendChild(txt(sx(sumX), sy(Y_BAR+H_BAR+1),
      '50 + 20 = 70','','start',20));
    svg.lastChild.setAttribute('fill','var(--fg)');
    svg.lastChild.setAttribute('font-weight','700');
    svg.appendChild(txt(sx(sumX), sy(Y_BAR+H_BAR+1)+FS+5,
      'проходов трансформера','','start',FSS));
    svg.lastChild.setAttribute('fill','var(--muted)');

    // ---------- зачёркнутое 5120 сбоку ----------
    var wX = sumX, wY = Y_PATCH + 6;
    var wt = txt(sx(wX), sy(wY), '5120','','start',22);
    wt.setAttribute('fill','var(--bad)');
    wt.setAttribute('font-weight','700');
    svg.appendChild(wt);
    var wLen = 52;
    svg.appendChild(el('line',{
      x1:sx(wX)-4, y1:sy(wY)-7, x2:sx(wX)+wLen, y2:sy(wY)-7,
      stroke:'var(--bad)','stroke-width':2.4}));
    svg.appendChild(txt(sx(wX), sy(wY)+FS+3,
      '256 · 20 — так не считают','','start',FSS));
    svg.lastChild.setAttribute('fill','var(--bad)');

    // ---------- легенда строкой под схемой ----------
    var legY = sy(Y_BAR-7)+FSB+PAD+FS+4 + 30;
    var lx = sx(0);
    svg.appendChild(el('rect',{x:lx,y:legY-9,width:11,height:11,
      fill:'var(--text)','fill-opacity':0.75}));
    svg.appendChild(txt(lx+16, legY, '— проход по тексту (1 токен)','','start',FSS));
    svg.lastChild.setAttribute('fill','var(--muted)');
    var lx2 = lx + 210;
    svg.appendChild(el('rect',{x:lx2,y:legY-9,width:11,height:11,
      fill:'var(--img)','fill-opacity':0.85}));
    svg.appendChild(txt(lx2+16, legY,
      '— проход расшумления (все 256 патчей)','','start',FSS));
    svg.lastChild.setAttribute('fill','var(--muted)');

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<div class="fail">Схема не построилась. Она должна была '+
      'показать полосу проходов: 50 клеток текста (по одному токену за проход) '+
      'плюс 20 клеток расшумления, где каждая клетка обрабатывает все 256 патчей '+
      'сразу, итог 50 + 20 = 70 проходов, а сбоку — зачёркнутое 5120.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
