<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Векторный перенос отношения man → king к слову woman</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ghostwhite;
      --panel: white;
      --text: midnightblue;
      --muted: slategray;
      --grid: lightsteelblue;
      --axis: slategray;
      --first: royalblue;
      --second: mediumvioletred;
      --construction: darkgray;
      --point-fill: white;
      --formula-fill: aliceblue;
      --formula-stroke: cornflowerblue;
      --error: darkred;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      justify-items: center;
      padding: 10px;
    }

    figure {
      width: 100%;
      max-width: 920px;
      margin: 0;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    h1 {
      margin: 0;
      padding: 12px 16px 8px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    .grid-line {
      stroke: var(--grid);
    }

    .axis-line {
      stroke: var(--axis);
    }

    .construction-line {
      stroke: var(--construction);
    }

    .first-vector {
      stroke: var(--first);
      fill: var(--first);
    }

    .second-vector {
      stroke: var(--second);
      fill: var(--second);
    }

    .point {
      stroke: var(--text);
      fill: var(--point-fill);
    }

    .point-core {
      fill: var(--text);
    }

    .formula-box {
      fill: var(--formula-fill);
      stroke: var(--formula-stroke);
    }

    .label,
    .caption,
    .vector-label,
    .formula,
    .formula-note {
      fill: var(--text);
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .word {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: bold;
    }

    .caption,
    .formula-note {
      fill: var(--muted);
      font-weight: normal;
    }

    .vector-label {
      font-weight: bold;
    }

    .formula {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: bold;
    }

    .status {
      margin: 0;
      padding: 18px;
      color: var(--error);
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --text: ghostwhite;
        --muted: lightgray;
        --grid: darkslategray;
        --axis: lightsteelblue;
        --first: deepskyblue;
        --second: hotpink;
        --construction: slategray;
        --point-fill: midnightblue;
        --formula-fill: darkslateblue;
        --formula-stroke: lightskyblue;
        --error: lightsalmon;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Одна стрелка, другая стартовая точка</h1>

    <svg
      id="diagram"
      viewBox="0 0 920 440"
      width="920"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Перенос вектора man → king к точке woman</title>
      <desc id="svg-description">
        На двумерной плоскости показаны точки man, king, woman и queen.
        Стрелки man → king и woman → queen параллельны и имеют одинаковую
        длину. Справа записано king минус man плюс woman приблизительно равно
        queen.
      </desc>
    </svg>

    <p id="status" class="status">
      Схема должна показать одинаковый векторный сдвиг от man к king и от
      woman к queen, а также формулу king − man + woman ≈ queen.
    </p>
  </figure>

  <script>
    const diagramData = [
      {
        kind: "canvas",
        width: 920,
        height: 440
      },
      {
        kind: "style",
        gridWidth: 1,
        axisWidth: 2,
        constructionWidth: 2,
        vectorWidth: 5,
        pointWidth: 2,
        pointRadius: 0.12,
        pointCoreRadius: 0.04,
        axisHeadLength: 0.18,
        axisHeadWidth: 0.12,
        vectorHeadLength: 0.32,
        vectorHeadWidth: 0.22,
        labelFont: 19,
        captionFont: 15,
        vectorFont: 16,
        formulaFont: 24,
        noteFont: 16,
        dashA: 7,
        dashB: 7
      },
      {
        kind: "point",
        id: "man",
        x: 1.1,
        y: 1.1,
        label: "man",
        labelDx: -12,
        labelDy: 24,
        anchor: "end"
      },
      {
        kind: "point",
        id: "king",
        x: 4.4,
        y: 2.9,
        label: "king",
        labelDx: 12,
        labelDy: -14,
        anchor: "start"
      },
      {
        kind: "point",
        id: "woman",
        x: 1.9,
        y: 4.1,
        label: "woman",
        labelDx: -12,
        labelDy: -14,
        anchor: "end"
      },
      {
        kind: "point",
        id: "queen",
        x: 5.2,
        y: 5.9,
        label: "queen",
        labelDx: 12,
        labelDy: -14,
        anchor: "start"
      },
      {
        kind: "axis",
        id: "horizontal",
        from: { x: 0, y: 0 },
        to: { x: 6.5, y: 0 }
      },
      {
        kind: "axis",
        id: "vertical",
        from: { x: 0, y: 0 },
        to: { x: 0, y: 6.7 }
      },
      {
        kind: "grid",
        from: { x: 1, y: 0 },
        to: { x: 1, y: 6.5 }
      },
      {
        kind: "grid",
        from: { x: 2, y: 0 },
        to: { x: 2, y: 6.5 }
      },
      {
        kind: "grid",
        from: { x: 3, y: 0 },
        to: { x: 3, y: 6.5 }
      },
      {
        kind: "grid",
        from: { x: 4, y: 0 },
        to: { x: 4, y: 6.5 }
      },
      {
        kind: "grid",
        from: { x: 5, y: 0 },
        to: { x: 5, y: 6.5 }
      },
      {
        kind: "grid",
        from: { x: 6, y: 0 },
        to: { x: 6, y: 6.5 }
      },
      {
        kind: "grid",
        from: { x: 0, y: 1 },
        to: { x: 6.3, y: 1 }
      },
      {
        kind: "grid",
        from: { x: 0, y: 2 },
        to: { x: 6.3, y: 2 }
      },
      {
        kind: "grid",
        from: { x: 0, y: 3 },
        to: { x: 6.3, y: 3 }
      },
      {
        kind: "grid",
        from: { x: 0, y: 4 },
        to: { x: 6.3, y: 4 }
      },
      {
        kind: "grid",
        from: { x: 0, y: 5 },
        to: { x: 6.3, y: 5 }
      },
      {
        kind: "grid",
        from: { x: 0, y: 6 },
        to: { x: 6.3, y: 6 }
      },
      {
        kind: "construction",
        fromId: "man",
        toId: "woman"
      },
      {
        kind: "construction",
        fromId: "king",
        toId: "queen"
      },
      {
        kind: "vector",
        fromId: "man",
        toId: "king",
        className: "first-vector",
        label: "тот же сдвиг",
        labelPoint: { x: 2.15, y: 1.72 },
        labelDx: 0,
        labelDy: 24,
        anchor: "middle"
      },
      {
        kind: "vector",
        fromId: "woman",
        toId: "queen",
        className: "second-vector",
        label: "тот же сдвиг",
        labelPoint: { x: 2.95, y: 4.72 },
        labelDx: 0,
        labelDy: -16,
        anchor: "middle"
      },
      {
        kind: "caption",
        point: { x: 3.25, y: -0.62 },
        text: "условная двумерная проекция",
        anchor: "middle",
        dx: 0,
        dy: 0
      },
      {
        kind: "caption",
        point: { x: 5.86, y: 4.22 },
        text: "перенос без поворота",
        anchor: "start",
        dx: 12,
        dy: 0
      },
      {
        kind: "formulaBox",
        from: { x: 7.25, y: 1.25 },
        to: { x: 15.55, y: 5.9 }
      },
      {
        kind: "formulaText",
        point: { x: 11.4, y: 5.15 },
        text: "Векторная запись",
        className: "formula-note",
        fontKey: "noteFont",
        anchor: "middle",
        dx: 0,
        dy: 0
      },
      {
        kind: "formulaText",
        point: { x: 11.4, y: 3.85 },
        text: "king − man + woman",
        className: "formula",
        fontKey: "formulaFont",
        anchor: "middle",
        dx: 0,
        dy: 0
      },
      {
        kind: "formulaText",
        point: { x: 11.4, y: 3.05 },
        text: "≈ queen",
        className: "formula",
        fontKey: "formulaFont",
        anchor: "middle",
        dx: 0,
        dy: 0
      },
      {
        kind: "formulaText",
        point: { x: 11.4, y: 1.95 },
        text: "конец оказывается рядом с queen",
        className: "formula-note",
        fontKey: "noteFont",
        anchor: "middle",
        dx: 0,
        dy: 0
      }
    ];

    const origin = Object.freeze({ x: 110, y: 365 });
    const scale = Object.freeze({ x: 48, y: 48 });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y - y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("diagram");
      const status = document.getElementById("status");
      const styles = diagramData.find((item) => item.kind === "style");
      const points = diagramData.filter((item) => item.kind === "point");

      if (!svg || !status || !styles) {
        throw new Error("Не найдены обязательные элементы схемы");
      }

      const element = (name, attributes, text) => {
        const node = document.createElementNS(namespace, name);

        Object.entries(attributes || {}).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });

        if (text !== undefined) {
          node.textContent = text;
        }

        return node;
      };

      const pointById = (id) => {
        const point = points.find((item) => item.id === id);

        if (!point) {
          throw new Error("Не найдена точка схемы");
        }

        return point;
      };

      const line = (from, to, className, width, extra) =>
        element("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className,
          "stroke-width": width,
          "stroke-linecap": "round",
          ...extra
        });

      const arrow = (
        from,
        to,
        className,
        width,
        headLength,
        headWidth
      ) => {
        const group = element("g", {});
        const deltaX = to.x - from.x;
        const deltaY = to.y - from.y;
        const length = Math.hypot(deltaX, deltaY);
        const unitX = deltaX / length;
        const unitY = deltaY / length;
        const base = {
          x: to.x - unitX * headLength,
          y: to.y - unitY * headLength
        };
        const left = {
          x: base.x - unitY * headWidth,
          y: base.y + unitX * headWidth
        };
        const right = {
          x: base.x + unitY * headWidth,
          y: base.y - unitX * headWidth
        };

        group.append(
          line(from, base, className, width),
          element("polygon", {
            points: [to, left, right]
              .map((point) => `${sx(point.x)},${sy(point.y)}`)
              .join(" "),
            class: className
          })
        );

        return group;
      };

      const textAt = (
        point,
        value,
        className,
        fontSize,
        anchor,
        dx,
        dy
      ) =>
        element(
          "text",
          {
            x: sx(point.x),
            y: sy(point.y),
            dx,
            dy,
            class: className,
            "font-size": fontSize,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          value
        );

      const root = element("g", {
        "aria-hidden": "true"
      });

      diagramData
        .filter((item) => item.kind === "grid")
        .forEach((item) => {
          root.append(
            line(
              item.from,
              item.to,
              "grid-line",
              styles.gridWidth
            )
          );
        });

      diagramData
        .filter((item) => item.kind === "formulaBox")
        .forEach((item) => {
          root.append(
            element("rect", {
              x: sx(item.from.x),
              y: sy(item.to.y),
              width: sx(item.to.x) - sx(item.from.x),
              height: sy(item.from.y) - sy(item.to.y),
              class: "formula-box",
              "stroke-width": styles.pointWidth
            })
          );
        });

      diagramData
        .filter((item) => item.kind === "axis")
        .forEach((item) => {
          root.append(
            arrow(
              item.from,
              item.to,
              "axis-line",
              styles.axisWidth,
              styles.axisHeadLength,
              styles.axisHeadWidth
            )
          );
        });

      diagramData
        .filter((item) => item.kind === "construction")
        .forEach((item) => {
          root.append(
            line(
              pointById(item.fromId),
              pointById(item.toId),
              "construction-line",
              styles.constructionWidth,
              {
                "stroke-dasharray":
                  `${styles.dashA} ${styles.dashB}`
              }
            )
          );
        });

      diagramData
        .filter((item) => item.kind === "vector")
        .forEach((item) => {
          root.append(
            arrow(
              pointById(item.fromId),
              pointById(item.toId),
              item.className,
              styles.vectorWidth,
              styles.vectorHeadLength,
              styles.vectorHeadWidth
            )
          );
        });

      points.forEach((item) => {
        root.append(
          element("circle", {
            cx: sx(item.x),
            cy: sy(item.y),
            r: Math.abs(sx(styles.pointRadius) - sx(0)),
            class: "point",
            "stroke-width": styles.pointWidth
          }),
          element("circle", {
            cx: sx(item.x),
            cy: sy(item.y),
            r: Math.abs(sx(styles.pointCoreRadius) - sx(0)),
            class: "point-core"
          })
        );
      });

      points.forEach((item) => {
        root.append(
          textAt(
            item,
            item.label,
            "label word",
            styles.labelFont,
            item.anchor,
            item.labelDx,
            item.labelDy
          )
        );
      });

      diagramData
        .filter((item) => item.kind === "vector")
        .forEach((item) => {
          root.append(
            textAt(
              item.labelPoint,
              item.label,
              "vector-label",
              styles.vectorFont,
              item.anchor,
              item.labelDx,
              item.labelDy
            )
          );
        });

      diagramData
        .filter((item) => item.kind === "caption")
        .forEach((item) => {
          root.append(
            textAt(
              item.point,
              item.text,
              "caption",
              styles.captionFont,
              item.anchor,
              item.dx,
              item.dy
            )
          );
        });

      diagramData
        .filter((item) => item.kind === "formulaText")
        .forEach((item) => {
          root.append(
            textAt(
              item.point,
              item.text,
              item.className,
              styles[item.fontKey],
              item.anchor,
              item.dx,
              item.dy
            )
          );
        });

      svg.append(root);
      status.hidden = true;
    } catch (error) {
      const status = document.getElementById("status");

      if (status) {
        status.hidden = false;
        status.textContent =
          "Схема должна показать точки man, king, woman и queen, " +
          "одинаковые параллельные стрелки man → king и woman → queen " +
          "и формулу king − man + woman ≈ queen.";
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
