<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Три вектора в одной плоскости</title>
<style>
  :root{
    --bg:#fbfaf6; --fg:#23262b; --muted:#6d7278; --axis:#9a9a90;
    --plane:#3f7cc4; --planefill:rgba(63,124,196,.12);
    --c1:#1f6fb2; --c2:#c06414; --c3:#9c3070; --bad:#c62828;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b; --fg:#e8e8e4; --muted:#9aa0a6; --axis:#6b6f74;
      --plane:#7fb3ee; --planefill:rgba(127,179,238,.14);
      --c1:#6fb6f0; --c2:#f0a35a; --c3:#e07ab4; --bad:#ff7a70;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:580px;margin:0 auto;padding:10px 12px 12px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;background:var(--bg);}
  .legend{margin-top:6px;color:var(--muted);font-size:12.5px;}
  .legend b{color:var(--fg);font-weight:600;}
  .fail{color:var(--bad);font-size:13px;}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Три вектора в одной плоскости: v₃ = 2·v₁ + v₂</h2>
  <svg id="fig" viewBox="0 0 580 305" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Три вектора в плоскости xy и недостижимая точка [0,0,1]"></svg>
  <div class="legend" id="lg">
    <b>v₁ = [1,0,0]</b> · <b>v₂ = [0,1,0]</b> · <b>v₃ = [2,1,0] = 2·v₁ + v₂</b> —
    все три лежат в плоскости xy. Точка <b>[0,0,1]</b> над плоскостью недостижима.
  </div>
</div>
<script>
(function(){
  var svg = document.getElementById('fig');
  try{
    /* ---------- данные схемы ---------- */
    var VECTORS = [
      {id:'v₁', v:[1,0,0], perp:[0,1,0],  cls:'c1', lab:[ 0, 16], anc:'middle'},
      {id:'v₂', v:[0,1,0], perp:[-1,0,0], cls:'c2', lab:[-6,-8], anc:'end'},
      {id:'v₃', v:[2,1,0], perp:[-1,2,0], cls:'c3', lab:[ 0, 18], anc:'middle'}
    ];
    var TARGET = [0,0,1];
    var AXES = [
      {id:'x', dir:[1,0,0], len:3.1, perp:[0,1,0], lab:[ 6, 16], anc:'start'},
      {id:'y', dir:[0,1,0], len:2.0, perp:[1,0,0], lab:[ 8, -6], anc:'start'},
      {id:'z', dir:[0,0,1], len:1.4, perp:[1,0,0], lab:[ 0,-10], anc:'middle'}
    ];
    var PLANE = {x0:-0.5, x1:2.9, y0:-0.5, y1:1.9, gx:[0,1,2], gy:[0,1]};
    var PLANE_LABEL = [1.6,-0.45,0];
    var ORIGIN_LABEL = [0,0,0];
    var HEAD_LEN = 0.22, HEAD_W = 0.09, TICK = 0.07;

    /* ---------- одна система перевода ---------- */
    var origin = {x:100, y:158};
    var scale = 90;
    var EX = [0.90, 0.40], EY = [0.90, -0.40], EZ = [0.00, -1.00];
    function toPx(p){
      return {
        x: origin.x + scale*(EX[0]*p[0] + EY[0]*p[1] + EZ[0]*p[2]),
        y: origin.y + scale*(EX[1]*p[0] + EY[1]*p[1] + EZ[1]*p[2])
      };
    }
    /* ---------- вектора данных (не пиксели) ---------- */
    function add(a,b,k){ return [a[0]+b[0]*k, a[1]+b[1]*k, a[2]+b[2]*k]; }
    function unit(a){
      var n = Math.hypot(a[0],a[1],a[2]) || 1;
      return [a[0]/n, a[1]/n, a[2]/n];
    }
    /* ---------- рисование ---------- */
    var NS='http://www.w3.org/2000/svg';
    function el(n,at){ var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); svg.appendChild(e); return e; }
    function line(a,b,at){
      var p=toPx(a), q=toPx(b);
      at.x1=p.x; at.y1=p.y; at.x2=q.x; at.y2=q.y; return el('line',at);
    }
    function label(pt,dx,dy,anc,txt,cls,size){
      var p=toPx(pt);
      var t=el('text',{x:p.x+dx, y:p.y+dy, 'text-anchor':anc,
        'font-size':(size||13), fill:cls});
      t.textContent=txt; return t;
    }
    function arrow(tail, tip, perp, cls, w){
      line(tail, tip, {stroke:cls,'stroke-width':w,'stroke-linecap':'round'});
      var d = unit(add(tip, tail, -1)), pu = unit(perp);
      var base = add(tip, d, -HEAD_LEN);
      var L = add(base, pu,  HEAD_W), R = add(base, pu, -HEAD_W);
      var a=toPx(tip), b=toPx(L), c=toPx(R);
      el('polygon',{points:a.x+','+a.y+' '+b.x+','+b.y+' '+c.x+','+c.y, fill:cls});
    }
    var COL = {
      axis:getComputedStyle(document.body).getPropertyValue('--axis').trim(),
      fg:'currentColor', muted:'var(--muted)', plane:'var(--plane)',
      c1:'var(--c1)', c2:'var(--c2)', c3:'var(--c3)', bad:'var(--bad)'
    };

    /* плоскость xy */
    var corners=[[PLANE.x0,PLANE.y0,0],[PLANE.x1,PLANE.y0,0],
                 [PLANE.x1,PLANE.y1,0],[PLANE.x0,PLANE.y1,0]]
      .map(toPx).map(function(p){return p.x+','+p.y;}).join(' ');
    el('polygon',{points:corners, fill:'var(--planefill)',
      stroke:'var(--plane)','stroke-width':1.2});
    PLANE.gx.forEach(function(x){
      line([x,PLANE.y0,0],[x,PLANE.y1,0],
        {stroke:'var(--plane)','stroke-width':.7,opacity:.5});
    });
    PLANE.gy.forEach(function(y){
      line([PLANE.x0,y,0],[PLANE.x1,y,0],
        {stroke:'var(--plane)','stroke-width':.7,opacity:.5});
    });

    /* оси + засечки */
    AXES.forEach(function(a){
      var d=unit(a.dir), tip=add([0,0,0],d,a.len);
      arrow(add([0,0,0],d,-0.35), tip, a.perp, 'var(--axis)', 1.1);
      var pu=unit(a.perp);
      for(var k=1;k<=Math.floor(a.len);k++){
        var c=add([0,0,0],d,k);
        line(add(c,pu,TICK), add(c,pu,-TICK), {stroke:'var(--axis)','stroke-width':1.1});
      }
      label(tip,a.lab[0],a.lab[1],a.anc,a.id,'var(--axis)',13);
    });

    /* векторы */
    VECTORS.forEach(function(o){
      arrow([0,0,0], o.v, o.perp, 'var(--'+o.cls+')', 2.6);
      var mid=add([0,0,0],o.v,0.5);
      label(mid,o.lab[0],o.lab[1],o.anc,o.id,'var(--'+o.cls+')',14);
    });

    /* недостижимая точка */
    line([0,0,0], TARGET, {stroke:'var(--bad)','stroke-width':1.2,
      'stroke-dasharray':'4 4', opacity:.8});
    var tp=toPx(TARGET);
    el('circle',{cx:tp.x, cy:tp.y, r:5, fill:'var(--bg)',
      stroke:'var(--bad)','stroke-width':2});
    var m=3.5;
    el('line',{x1:tp.x-m,y1:tp.y-m,x2:tp.x+m,y2:tp.y+m,
      stroke:'var(--bad)','stroke-width':1.6});
    el('line',{x1:tp.x-m,y1:tp.y+m,x2:tp.x+m,y2:tp.y-m,
      stroke:'var(--bad)','stroke-width':1.6});
    label(TARGET,14,-4,'start','[0,0,1] — недостижима','var(--bad)',13);

    /* подписи плоскости и начала координат */
    label(PLANE_LABEL,0,0,'middle','плоскость xy','var(--plane)',13);
    label(ORIGIN_LABEL,-11,5,'end','0','var(--muted)',12.5);
    var op=toPx(ORIGIN_LABEL);
    el('circle',{cx:op.x, cy:op.y, r:3, fill:'currentColor'});
  }catch(e){
    svg.parentNode.removeChild(svg);
    var d=document.createElement('p');
    d.className='fail';
    d.textContent='Схема не построилась. Она должна была показать: три стрелки '+
      'из начала координат — v₁=[1,0,0], v₂=[0,1,0] и v₃=[2,1,0] — все лежат '+
      'в плоскости xy («на полу»), а точка [0,0,1] висит над этой плоскостью '+
      'и недостижима никакой их комбинацией.';
    document.getElementById('lg').parentNode.insertBefore(d, document.getElementById('lg'));
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
