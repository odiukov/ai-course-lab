<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Здоровый и затухающий поток градиента</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #eef3f8;
      --ink: #172033;
      --muted: #526078;
      --border: #cbd5e1;
      --healthy: #16845b;
      --healthy-soft: #dcf6e9;
      --healthy-line: #31a879;
      --vanish-strong: #c64b40;
      --vanish-mid: #d9794f;
      --vanish-faint: #d99d68;
      --vanish-tiny: #b9a994;
      --vanish-soft: #fff0e8;
      --guide: #8a98aa;
      --focus: #6c4fd3;
      --focus-soft: #eee9ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--page);
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--page);
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      fill: var(--ink);
    }

    .direction-label,
    .small-note {
      font-size: 13px;
      fill: var(--muted);
    }

    .layer-label {
      font-size: 14px;
      font-weight: bold;
      fill: var(--ink);
    }

    .metric-label {
      font-size: 12px;
      fill: var(--muted);
    }

    .metric-value {
      font-size: 21px;
      font-weight: bold;
      fill: var(--ink);
    }

    .summary-title {
      font-size: 15px;
      font-weight: bold;
      fill: var(--ink);
    }

    .summary-text {
      font-size: 14px;
      fill: var(--muted);
    }

    .card {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .healthy-card {
      fill: var(--healthy-soft);
      stroke: var(--healthy);
    }

    .vanish-card {
      fill: var(--vanish-soft);
    }

    .healthy-line {
      stroke: var(--healthy-line);
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .healthy-head {
      fill: var(--healthy-line);
    }

    .direction-line {
      stroke: var(--guide);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .direction-head {
      fill: var(--guide);
    }

    .tone-strong {
      stroke: var(--vanish-strong);
      fill: var(--vanish-strong);
    }

    .tone-mid {
      stroke: var(--vanish-mid);
      fill: var(--vanish-mid);
    }

    .tone-faint {
      stroke: var(--vanish-faint);
      fill: var(--vanish-faint);
    }

    .tone-tiny {
      stroke: var(--vanish-tiny);
      fill: var(--vanish-tiny);
    }

    .vanish-line {
      stroke-width: 4px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .value-bar {
      stroke: none;
    }

    .healthy-bar {
      fill: var(--healthy);
    }

    .summary-panel {
      fill: var(--panel-soft);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .summary-accent {
      fill: var(--focus);
    }

    .summary-badge {
      fill: var(--focus-soft);
      stroke: var(--focus);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .summary-badge-text {
      font-size: 13px;
      font-weight: bold;
      fill: var(--focus);
    }

    .divider {
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .fallback {
      font-size: 16px;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--border);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192231;
        --panel-soft: #202b3b;
        --ink: #f0f5fb;
        --muted: #b5c1d1;
        --border: #415067;
        --healthy: #54d39d;
        --healthy-soft: #173d32;
        --healthy-line: #54d39d;
        --vanish-strong: #ff7b70;
        --vanish-mid: #f49a6d;
        --vanish-faint: #d8aa7b;
        --vanish-tiny: #8f8b84;
        --vanish-soft: #3c2928;
        --guide: #9aa8bb;
        --focus: #b2a0ff;
        --focus-soft: #2c2850;
      }
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <div class="title" id="diagram-title">Здоровый и затухающий поток градиента</div>
    <svg
      id="diagram"
      width="1000"
      height="470"
      viewBox="0 0 1000 470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Сравнение потока градиента в двух цепочках из четырёх слоёв</title>
      <desc id="svg-description">
        В здоровой цепочке градиенты всех слоёв одного порядка. В затухающей
        цепочке сигнал ослабевает при движении от четвёртого слоя к первому.
      </desc>
      <g id="drawing"></g>
    </svg>
    <p class="fallback" id="fallback" hidden>
      Схема должна была показать две цепочки из четырёх слоёв: здоровый поток
      с градиентами 0,05, 0,04, 0,06, 0,05 и затухающий поток с градиентами
      0,0001, 0,003, 0,02, 0,08.
    </p>
  </main>

  <script>
    const data = [
      {
        kind: "layout",
        cardWidth: 18,
        cardHeight: 9,
        cardCenterY: 4.5,
        cardRadius: 1.1,
        cardInset: 0.7,
        barHeight: 0.55,
        layerTextY: 2.2,
        metricTextY: 4.25,
        valueTextY: 6.9,
        headingX: 3,
        directionTailX: 90,
        directionHeadX: 74,
        directionTextX: 82,
        directionTextLift: 1.15,
        arrowHeadLength: 1.05,
        arrowHeadHalf: 0.55,
        connectorInset: 0.4,
        noteX: 3,
        noteDrop: 1.7,
        dividerX1: 3,
        dividerX2: 90,
        summaryX: 3,
        summaryY: 38,
        summaryWidth: 87,
        summaryHeight: 5.8,
        summaryRadius: 1.1,
        summaryAccentWidth: 0.7,
        summaryBadgeX: 5,
        summaryBadgeY: 39.2,
        summaryBadgeWidth: 14.5,
        summaryBadgeHeight: 3.35,
        summaryBadgeRadius: 0.8,
        summaryBadgeTextX: 6,
        summaryBadgeTextY: 41.35,
        summaryTitleX: 21.5,
        summaryTitleY: 40.35,
        summaryTextX: 21.5,
        summaryTextY: 42.15,
        labelOffset: 6
      },
      {
        kind: "row",
        id: "healthy",
        title: "Здоровый поток",
        direction: "градиент идёт назад",
        note: "Значения немного различаются, но остаются одного порядка",
        headingY: 2.5,
        y: 4.5,
        noteY: 15.7,
        nodes: [
          { x: 3, layer: "Слой 1", value: "0,05", tone: "healthy" },
          { x: 26, layer: "Слой 2", value: "0,04", tone: "healthy" },
          { x: 49, layer: "Слой 3", value: "0,06", tone: "healthy" },
          { x: 72, layer: "Слой 4", value: "0,05", tone: "healthy" }
        ]
      },
      {
        kind: "row",
        id: "vanishing",
        title: "Затухающий поток",
        direction: "градиент идёт назад",
        note: "К ранним слоям обучающий сигнал последовательно ослабевает",
        headingY: 20.5,
        y: 22.5,
        noteY: 33.7,
        nodes: [
          { x: 3, layer: "Слой 1", value: "0,0001", tone: "tiny" },
          { x: 26, layer: "Слой 2", value: "0,003", tone: "faint" },
          { x: 49, layer: "Слой 3", value: "0,02", tone: "mid" },
          { x: 72, layer: "Слой 4", value: "0,08", tone: "strong" }
        ]
      }
    ];

    const origin = Object.freeze({ x: 50, y: 15 });
    const scale = 10;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const root = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const layout = data.find(item => item.kind === "layout");
      const rows = data.filter(item => item.kind === "row");
      const namespace = "http://www.w3.org/2000/svg";

      const element = (name, attributes, parent = root) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const text = (label, x, y, className, anchor = "start", extra = {}) => {
        const node = element("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          ...extra
        });
        node.textContent = label;
        return node;
      };

      const rect = (x, y, width, height, radius, className, parent = root) =>
        element("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(width) - sx(0),
          height: sy(height) - sy(0),
          rx: sx(radius) - sx(0),
          ry: sy(radius) - sy(0),
          class: className
        }, parent);

      const line = (x1, y1, x2, y2, className, parent = root) =>
        element("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        }, parent);

      const leftArrow = (tailX, headX, y, lineClass, headClass, parent = root) => {
        const shaftEnd = headX + layout.arrowHeadLength;
        line(tailX, y, shaftEnd, y, lineClass, parent);
        element("polygon", {
          points: [
            `${sx(headX)},${sy(y)}`,
            `${sx(shaftEnd)},${sy(y - layout.arrowHeadHalf)}`,
            `${sx(shaftEnd)},${sy(y + layout.arrowHeadHalf)}`
          ].join(" "),
          class: headClass
        }, parent);
      };

      const toneClass = tone => `tone-${tone}`;

      const drawDirection = (row, parent) => {
        leftArrow(
          layout.directionTailX,
          layout.directionHeadX,
          row.headingY,
          "direction-line",
          "direction-head",
          parent
        );
        text(
          row.direction,
          layout.directionTextX,
          row.headingY - layout.directionTextLift,
          "direction-label",
          "middle"
        );
      };

      const drawConnectors = (row, parent) => {
        row.nodes.reduce((previous, current) => {
          if (previous) {
            const tail = current.x - layout.connectorInset;
            const head = previous.x + layout.cardWidth + layout.connectorInset;
            const centerY = row.y + layout.cardCenterY;
            const lineClass = row.id === "healthy"
              ? "healthy-line"
              : `vanish-line ${toneClass(previous.tone)}`;
            const headClass = row.id === "healthy"
              ? "healthy-head"
              : toneClass(previous.tone);

            leftArrow(tail, head, centerY, lineClass, headClass, parent);
          }
          return current;
        }, null);
      };

      const drawNode = (row, node, parent) => {
        const cardClass = row.id === "healthy"
          ? "card healthy-card"
          : "card vanish-card";

        rect(
          node.x,
          row.y,
          layout.cardWidth,
          layout.cardHeight,
          layout.cardRadius,
          cardClass,
          parent
        );

        rect(
          node.x + layout.cardInset,
          row.y + layout.cardHeight - layout.cardInset - layout.barHeight,
          layout.cardWidth - layout.cardInset - layout.cardInset,
          layout.barHeight,
          layout.cardRadius,
          row.id === "healthy"
            ? "value-bar healthy-bar"
            : `value-bar ${toneClass(node.tone)}`,
          parent
        );

        const centerX = node.x + layout.cardWidth / layout.cardCenterY;
        text(
          node.layer,
          centerX,
          row.y + layout.layerTextY,
          "layer-label",
          "middle"
        );
        text(
          "средний градиент",
          centerX,
          row.y + layout.metricTextY,
          "metric-label",
          "middle"
        );
        text(
          node.value,
          centerX,
          row.y + layout.valueTextY,
          "metric-value",
          "middle"
        );
      };

      rows.forEach(row => {
        const group = element("g", {
          "aria-label": `${row.title}: ${row.nodes.map(node => node.value).join(", ")}`
        });

        text(row.title, layout.headingX, row.headingY, "section-title", "start");
        drawDirection(row, group);
        drawConnectors(row, group);
        row.nodes.forEach(node => drawNode(row, node, group));
        text(row.note, layout.noteX, row.noteY, "small-note", "start");
      });

      line(
        layout.dividerX1,
        layout.summaryY - layout.noteDrop,
        layout.dividerX2,
        layout.summaryY - layout.noteDrop,
        "divider"
      );

      rect(
        layout.summaryX,
        layout.summaryY,
        layout.summaryWidth,
        layout.summaryHeight,
        layout.summaryRadius,
        "summary-panel"
      );

      rect(
        layout.summaryX,
        layout.summaryY,
        layout.summaryAccentWidth,
        layout.summaryHeight,
        layout.summaryRadius,
        "summary-accent"
      );

      rect(
        layout.summaryBadgeX,
        layout.summaryBadgeY,
        layout.summaryBadgeWidth,
        layout.summaryBadgeHeight,
        layout.summaryBadgeRadius,
        "summary-badge"
      );

      text(
        "Смотри на ряд",
        layout.summaryBadgeTextX,
        layout.summaryBadgeTextY,
        "summary-badge-text",
        "start",
        { dx: layout.labelOffset }
      );

      text(
        "Ровный ряд → здоровый поток",
        layout.summaryTitleX,
        layout.summaryTitleY,
        "summary-title"
      );

      text(
        "Падение к слою 1 → начало сети почти не обновляется",
        layout.summaryTextX,
        layout.summaryTextY,
        "summary-text"
      );

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
