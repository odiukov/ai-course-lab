<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один цикл в трёх конвертах</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#1d2026; --dim:#5d6472; --line:#8b93a3;
    --card:#ffffff; --edge:#c2c8d4; --cyc:#1c5fa8; --hl:#fff2c9;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --ink:#e7e9ee; --dim:#a2aab8; --line:#7d8persist;
      --card:#1c1f25; --edge:#39404c; --cyc:#7db6f0; --hl:#3a3520;
    }
  }
  @media (prefers-color-scheme: dark){ :root{ --line:#7d8593; } }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:8px 10px 4px;}
  h2{font-size:15px;margin:0 0 4px;font-weight:600;}
  figure{margin:0;}
  svg{display:block;width:100%;height:auto;max-height:460px;background:var(--bg);}
  .fb{color:var(--ink);font-size:13px;}
  text{fill:var(--ink);font-family:inherit;font-size:12px;}
  .ttl{font-size:13px;font-weight:600;}
  .row{font-size:12px;cursor:default;}
  .num{fill:var(--dim);font-weight:600;}
  .fld{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;}
  .node{font-size:11.5px;fill:var(--cyc);}
  .mid{font-size:12px;fill:var(--dim);}
  .lg{font-size:12px;fill:var(--dim);}
  .lgt{font-size:12px;font-weight:600;}
  .note{font-size:12px;fill:var(--dim);}
  .box{fill:var(--card);stroke:var(--edge);stroke-width:1.2;}
  .flap{fill:none;stroke:var(--edge);stroke-width:1.2;}
  .link{stroke:var(--line);stroke-width:1;stroke-dasharray:4 4;fill:none;}
  .arc{stroke:var(--cyc);stroke-width:1.6;fill:none;}
  .head{fill:var(--cyc);}
  .circ{fill:var(--bg);stroke:var(--cyc);stroke-width:1.4;}
  .hl text,text.hl{fill:var(--ink);}
  .hlbg{fill:var(--hl);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Один цикл, три конверта: пять одинаковых граф</h2>
  <figure>
    <svg id="s" viewBox="0 20 960 466" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Цикл описать–решить–выполнить–наблюдать в центре и три конверта провайдеров с пятью графами"></svg>
    <p id="fb" class="fb" hidden>В центре цикл: описать → решить → выполнить → наблюдать. Вокруг три конверта — OpenAI, Anthropic, Gemini, — и в каждом одни и те же пять граф: список инструментов, выбор инструмента, выдача вызова, номер вызова, вклейка результата. Меняются только подписи полей.</p>
  </figure>
</div>
<script>
(function(){
try{
  /* ——— данные схемы ——— */
  var SCALE = 40, ORIGIN = {x:480, y:175};
  var sx = function(u){ return ORIGIN.x + u*SCALE; };
  var sy = function(v){ return ORIGIN.y + v*SCALE; };

  var CARDS = [
    {n:"OpenAI",    x0:-11.5, x1:-5,  y0:-3.6, y1:0.4, ax:-5, ay:-1.6, at:"start",
     f:["tools","tool_choice","tool_calls","id","сообщение с ролью tool"]},
    {n:"Anthropic", x0:5,     x1:11.5,y0:-3.6, y1:0.4, ax:5,  ay:-1.6, at:"start",
     f:["tools","tool_choice","блок tool_use","tool_use_id","блок tool_result"]},
    {n:"Gemini",    x0:-3.2,  x1:3.2, y0:3.5,  y1:7.5, ax:0,  ay:3.5,  at:"start",
     f:["functionDeclarations","functionCallingConfig","functionCall","нет — имя и порядок","functionResponse"]}
  ];
  var NODES = [
    {x:0,    y:-2.2, t:"описать"},
    {x:2.2,  y:0,    t:"решить"},
    {x:0,    y:2.2,  t:"выполнить"},
    {x:-2.2, y:0,    t:"наблюдать"}
  ];
  var LEG = ["список инструментов — tool list","выбор инструмента — tool choice",
             "выдача вызова — call emission","номер вызова — call id",
             "вклейка результата — result injection"];
  var NOTES = [[4.0,"Ни у кого нет графы,"],[4.62,"которой нет у других."],
               [5.6,"Пять мест — три набора подписей."],[6.22,"Переписываются только подписи."]];
  var R = 0.95;

  /* ——— всё через sx/sy ——— */
  var NS = "http://www.w3.org/2000/svg", S = document.getElementById("s");
  function el(n,a,p){ var e=document.createElementNS(NS,n);
    for(var k in a) e.setAttribute(k,a[k]); (p||S).appendChild(e); return e; }
  function text(x,y,s,cls,anchor,p){
    var t=el("text",{x:sx(x),y:sy(y),class:cls,"text-anchor":anchor},p);
    t.textContent=s; return t; }
  function seg(a,b,cls){ el("line",{x1:sx(a.x),y1:sy(a.y),x2:sx(b.x),y2:sy(b.y),class:cls}); }
  function head(tip,ux,uy){
    var b={x:tip.x-ux*0.3, y:tip.y-uy*0.3};
    var p1={x:b.x-uy*0.15, y:b.y+ux*0.15}, p2={x:b.x+uy*0.15, y:b.y-ux*0.15};
    el("polygon",{class:"head",points:[tip,p1,p2].map(function(p){return sx(p.x)+","+sy(p.y);}).join(" ")});
  }
  function arrow(p,q,trim){
    var dx=q.x-p.x, dy=q.y-p.y, L=Math.sqrt(dx*dx+dy*dy), ux=dx/L, uy=dy/L;
    var a={x:p.x+ux*trim, y:p.y+uy*trim}, b={x:q.x-ux*trim, y:q.y-uy*trim};
    seg(a,b,"arc"); head(b,ux,uy);
  }

  /* конверты */
  var rows=[];
  CARDS.forEach(function(c){
    el("rect",{class:"box",x:sx(c.x0),y:sy(c.y0),
      width:sx(c.x1)-sx(c.x0), height:sy(c.y1)-sy(c.y0), rx:sx(c.x0+0.15)-sx(c.x0)});
    var mx=(c.x0+c.x1)/2;
    el("path",{class:"flap",d:"M"+sx(c.x0)+","+sy(c.y0)+" L"+sx(mx)+","+sy(c.y0+0.5)+" L"+sx(c.x1)+","+sy(c.y0)});
    text(c.x0+0.32, c.y0+0.95, c.n, "ttl", "start");
    for(var i=0;i<5;i++){
      var t=text(c.x0+0.32, c.y0+1.62+i*0.62, "", "row", "start");
      var n=el("tspan",{class:"num"},t); n.textContent=(i+1)+"  ";
      var f=el("tspan",{class:"fld"},t); f.textContent=c.f[i];
      t.setAttribute("data-i",i); rows.push(t);
    }
    /* пунктир конверт — цикл */
    var L=Math.sqrt(c.ax*c.ax+c.ay*c.ay);
    seg({x:c.ax/L*3.15, y:c.ay/L*3.15}, {x:c.ax, y:c.ay}, "link");
  });

  /* цикл */
  for(var k=0;k<NODES.length;k++) arrow(NODES[k], NODES[(k+1)%NODES.length], R+0.14);
  NODES.forEach(function(n){
    el("circle",{class:"circ",cx:sx(n.x),cy:sy(n.y),r:sx(n.x+R)-sx(n.x)});
    text(n.x, n.y+0.1, n.t, "node", "middle");
  });
  text(0,-0.15,"один цикл","mid","middle");
  text(0, 0.4,"на всех","mid","middle");

  /* легенда */
  text(-11.5, 4.0, "Пять граф бланка — у каждого:", "lgt", "start");
  LEG.forEach(function(s,i){
    var t=text(-11.5, 4.68+i*0.68, (i+1)+" · "+s, "lg", "start");
    t.setAttribute("data-i",i); rows.push(t);
  });

  /* заметки справа */
  NOTES.forEach(function(p){ text(11.5, p[0], p[1], "note", "end"); });

  /* одна графа — сразу во всех трёх конвертах */
  function mark(i,on){
    rows.forEach(function(t){
      if(t.getAttribute("data-i")===String(i)) t.classList.toggle("hl",on);
      });
  }
  rows.forEach(function(t){
    var i=t.getAttribute("data-i");
    t.addEventListener("mouseenter",function(){ mark(i,true); });
    t.addEventListener("mouseleave",function(){ mark(i,false); });
  });
}catch(e){
  var s=document.getElementById("s"), f=document.getElementById("fb");
  if(s) s.setAttribute("hidden","");
  if(f) f.removeAttribute("hidden");
}
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
