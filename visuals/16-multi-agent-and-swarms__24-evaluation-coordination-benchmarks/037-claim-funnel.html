<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Шесть фильтров громкого результата</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ivory;
      --canvas: white;
      --ink: midnightblue;
      --muted: slategray;
      --border: steelblue;
      --accent: darkorange;
      --claim: navy;
      --result: seagreen;
      --note: aliceblue;
      --stage-a: aliceblue;
      --stage-b: lavender;
      --stage-c: mistyrose;
      --stage-d: lemonchiffon;
      --stage-e: honeydew;
      --stage-f: lightcyan;
      --on-strong: white;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --canvas: darkslategray;
        --ink: white;
        --muted: gainsboro;
        --border: lightsteelblue;
        --accent: gold;
        --claim: darkblue;
        --result: darkgreen;
        --note: midnightblue;
        --stage-a: darkslateblue;
        --stage-b: indigo;
        --stage-c: darkred;
        --stage-d: saddlebrown;
        --stage-e: darkgreen;
        --stage-f: teal;
        --on-strong: white;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .title {
      margin: initial;
      font-size: 24px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--canvas);
    }

    .canvas {
      fill: var(--canvas);
    }

    .stage {
      stroke: var(--border);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .stage-a { fill: var(--stage-a); }
    .stage-b { fill: var(--stage-b); }
    .stage-c { fill: var(--stage-c); }
    .stage-d { fill: var(--stage-d); }
    .stage-e { fill: var(--stage-e); }
    .stage-f { fill: var(--stage-f); }

    .guide {
      stroke: var(--border);
      stroke-width: 2;
    }

    .badge {
      fill: var(--canvas);
      stroke: var(--accent);
      stroke-width: 3;
    }

    .badge-text {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .filter-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .filter-question {
      fill: var(--muted);
      font-size: 13px;
    }

    .connector {
      fill: none;
      stroke: var(--accent);
      stroke-width: 5;
      stroke-linecap: round;
    }

    .arrowhead {
      fill: var(--accent);
    }

    .claim-card {
      fill: var(--claim);
      stroke: var(--accent);
      stroke-width: 3;
    }

    .result-card {
      fill: var(--result);
      stroke: var(--accent);
      stroke-width: 3;
    }

    .card-kicker {
      fill: var(--on-strong);
      font-size: 14px;
      font-weight: bold;
    }

    .claim-value {
      fill: var(--on-strong);
      font-size: 38px;
      font-weight: bold;
    }

    .result-label {
      fill: var(--on-strong);
      font-size: 18px;
      font-weight: bold;
    }

    .result-note {
      fill: var(--on-strong);
      font-size: 13px;
    }

    .note-panel {
      fill: var(--note);
      stroke: var(--border);
      stroke-width: 2;
    }

    .note-text {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    #fallback {
      background: var(--canvas);
      color: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1 class="title">Шесть фильтров громкого результата</h1>

  <svg id="diagram"
       viewBox="0 0 1420 400"
       width="1420"
       height="400"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <title id="diagram-title">Воронка из шести последовательных фильтров</title>
    <desc id="diagram-description">
      Заявление о результате 82 процента проходит проверки бенчмарка и split,
      загрязнения, baseline, статистической значимости, разнообразия задач и
      раскрытия стоимости.
    </desc>
  </svg>

  <p id="fallback" hidden>
    Схема должна была показать, как заявление «82%» проходит слева направо
    через шесть фильтров: бенчмарк и split, загрязнение, baseline,
    статистическую значимость, разнообразие задач и раскрытие стоимости.
  </p>

  <noscript>
    <p>
      Заявление «82%» нужно последовательно проверить по бенчмарку и split,
      загрязнению, baseline, статистической значимости, разнообразию задач
      и раскрытию стоимости.
    </p>
  </noscript>

  <script>
    const data = [
      {
        zero: 0,
        origin: { x: 0, y: 0 },
        scale: { x: 1, y: 1 },
        canvas: { w: 1420, h: 400 },
        centerY: 200,
        half: 0.5,
        badgeRadius: 14,
        badgeGap: 29,
        arrowLength: 13,
        arrowHalfHeight: 9,
        claim: {
          x: 25, y: 132, w: 160, h: 136,
          textX: 105,
          lines: [
            { text: "ГРОМКОЕ", y: 164, className: "card-kicker" },
            { text: "ЗАЯВЛЕНИЕ", y: 188, className: "card-kicker" },
            { text: "82%", y: 235, className: "claim-value" }
          ]
        },
        firstArrow: { x1: 185, x2: 237, y: 200 },
        lastArrow: { x1: 1195, x2: 1222, y: 200 },
        result: {
          x: 1230, y: 143, w: 165, h: 114,
          textX: 1312.5,
          lines: [
            { text: "СИЛЬНЫЙ", y: 178, className: "result-label" },
            { text: "РЕЗУЛЬТАТ", y: 203, className: "result-label" },
            { text: "после всех проверок", y: 234, className: "result-note" }
          ]
        },
        note: {
          x: 245, y: 346, w: 1150, h: 43,
          textX: 820, textY: 373,
          text: "Не прошёл фильтр → снизь уверенность и назови недостающее доказательство"
        }
      },
      {
        x0: 245, x1: 402, h0: 125, h1: 112,
        className: "stage-a", badge: "1",
        lines: [
          { text: "Бенчмарк", dy: -15 },
          { text: "и split", dy: 7 }
        ],
        question: { text: "где получено?", dy: 39 }
      },
      {
        x0: 402, x1: 559, h0: 112, h1: 99,
        className: "stage-b", badge: "2",
        lines: [
          { text: "Загрязнение", dy: -15 },
          { text: "(contamination)", dy: 7 }
        ],
        question: { text: "задачи знакомы?", dy: 39 }
      },
      {
        x0: 559, x1: 716, h0: 99, h1: 86,
        className: "stage-c", badge: "3",
        lines: [
          { text: "Базовая линия", dy: -15 },
          { text: "(baseline)", dy: 7 }
        ],
        question: { text: "с кем сравнили?", dy: 39 }
      },
      {
        x0: 716, x1: 873, h0: 86, h1: 73,
        className: "stage-d", badge: "4",
        lines: [
          { text: "Статистическая", dy: -15 },
          { text: "значимость", dy: 7 }
        ],
        question: { text: "серия прогонов?", dy: 39 }
      },
      {
        x0: 873, x1: 1030, h0: 73, h1: 60,
        className: "stage-e", badge: "5",
        lines: [
          { text: "Разнообразие", dy: -15 },
          { text: "задач", dy: 7 }
        ],
        question: { text: "много типов?", dy: 39 }
      },
      {
        x0: 1030, x1: 1187, h0: 60, h1: 47,
        className: "stage-f", badge: "6",
        lines: [
          { text: "Раскрытие", dy: -15 },
          { text: "стоимости", dy: 7 }
        ],
        question: { text: "сколько стоит?", dy: 39 }
      }
    ];

    const [scene, ...filters] = data;
    const origin = scene.origin;
    const scale = scene.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (name, attributes, text) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, value);
        });
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      };

      const rectangle = (parent, box, className) => {
        parent.appendChild(node("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.w) - sx(box.x),
          height: sy(box.y + box.h) - sy(box.y),
          class: className
        }));
      };

      const centeredText = (parent, x, y, text, className) => {
        parent.appendChild(node("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": "middle",
          "dominant-baseline": "middle",
          class: className
        }, text));
      };

      const horizontalArrow = (parent, arrow) => {
        const baseX = arrow.x2 - scene.arrowLength;
        parent.appendChild(node("line", {
          x1: sx(arrow.x1),
          y1: sy(arrow.y),
          x2: sx(baseX),
          y2: sy(arrow.y),
          class: "connector"
        }));
        parent.appendChild(node("polygon", {
          points: [
            { x: arrow.x2, y: arrow.y },
            { x: baseX, y: arrow.y - scene.arrowHalfHeight },
            { x: baseX, y: arrow.y + scene.arrowHalfHeight }
          ].map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: "arrowhead"
        }));
      };

      const background = node("g", {});
      rectangle(background, {
        x: scene.zero,
        y: scene.zero,
        w: scene.canvas.w,
        h: scene.canvas.h
      }, "canvas");
      svg.appendChild(background);

      const noteGroup = node("g", {});
      rectangle(noteGroup, scene.note, "note-panel");
      centeredText(
        noteGroup,
        scene.note.textX,
        scene.note.textY,
        scene.note.text,
        "note-text"
      );
      svg.appendChild(noteGroup);

      const funnelGroup = node("g", {});

      filters.forEach(filter => {
        const polygonPoints = [
          { x: filter.x0, y: scene.centerY - filter.h0 },
          { x: filter.x1, y: scene.centerY - filter.h1 },
          { x: filter.x1, y: scene.centerY + filter.h1 },
          { x: filter.x0, y: scene.centerY + filter.h0 }
        ];

        funnelGroup.appendChild(node("polygon", {
          points: polygonPoints
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: `stage ${filter.className}`
        }));

        const middleX = (filter.x0 + filter.x1) * scene.half;
        const topMiddleY =
          scene.centerY - (filter.h0 + filter.h1) * scene.half;
        const badgeY = topMiddleY - scene.badgeGap;

        funnelGroup.appendChild(node("line", {
          x1: sx(middleX),
          y1: sy(badgeY + scene.badgeRadius),
          x2: sx(middleX),
          y2: sy(topMiddleY),
          class: "guide"
        }));

        funnelGroup.appendChild(node("circle", {
          cx: sx(middleX),
          cy: sy(badgeY),
          r: sx(scene.badgeRadius) - sx(scene.zero),
          class: "badge"
        }));

        centeredText(
          funnelGroup,
          middleX,
          badgeY,
          filter.badge,
          "badge-text"
        );

        filter.lines.forEach(line => {
          centeredText(
            funnelGroup,
            middleX,
            scene.centerY + line.dy,
            line.text,
            "filter-label"
          );
        });

        centeredText(
          funnelGroup,
          middleX,
          scene.centerY + filter.question.dy,
          filter.question.text,
          "filter-question"
        );
      });

      svg.appendChild(funnelGroup);

      const flowGroup = node("g", {});
      rectangle(flowGroup, scene.claim, "claim-card");
      scene.claim.lines.forEach(line => {
        centeredText(
          flowGroup,
          scene.claim.textX,
          line.y,
          line.text,
          line.className
        );
      });

      horizontalArrow(flowGroup, scene.firstArrow);
      horizontalArrow(flowGroup, scene.lastArrow);

      rectangle(flowGroup, scene.result, "result-card");
      scene.result.lines.forEach(line => {
        centeredText(
          flowGroup,
          scene.result.textX,
          line.y,
          line.text,
          line.className
        );
      });

      svg.appendChild(flowGroup);
      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
