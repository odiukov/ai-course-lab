<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Прямой и обратный путь по графу y = wx + b</title>
  <style>
    :root {
      --bg: #f7fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #526078;
      --border: #aeb9ca;
      --leaf: #dff6ef;
      --leaf-stroke: #16866f;
      --operation: #e4edff;
      --operation-stroke: #3d68c5;
      --result: #fff1c9;
      --result-stroke: #b77500;
      --loss: #f0e5ff;
      --loss-stroke: #7d48b5;
      --forward: #15805f;
      --backward: #c43d71;
      --pad: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #192231;
        --ink: #edf3ff;
        --muted: #b8c5d9;
        --border: #56647a;
        --leaf: #173b35;
        --leaf-stroke: #58d0b2;
        --operation: #1d3156;
        --operation-stroke: #83a8ff;
        --result: #453817;
        --result-stroke: #f0bd56;
        --loss: #39264d;
        --loss-stroke: #c996ff;
        --forward: #61d5ad;
        --backward: #ff81ae;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure,
    h1,
    p {
      margin: unset;
    }

    figure {
      background: var(--bg);
    }

    h1 {
      box-sizing: border-box;
      padding: var(--pad);
      font-size: 22px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--bg);
    }

    .frame {
      fill: var(--panel);
      stroke: var(--border);
    }

    .node {
      stroke-linejoin: round;
    }

    .leaf {
      fill: var(--leaf);
      stroke: var(--leaf-stroke);
    }

    .operation {
      fill: var(--operation);
      stroke: var(--operation-stroke);
    }

    .result {
      fill: var(--result);
      stroke: var(--result-stroke);
    }

    .loss {
      fill: var(--loss);
      stroke: var(--loss-stroke);
    }

    .forward-line {
      fill: none;
      stroke: var(--forward);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .backward-line {
      fill: none;
      stroke: var(--backward);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .forward-head {
      fill: var(--forward);
    }

    .backward-head {
      fill: var(--backward);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
    }

    .main-label,
    .operator-label,
    .section-label {
      font-weight: bold;
    }

    .sub-label {
      fill: var(--muted);
    }

    .forward-label {
      fill: var(--forward);
      font-weight: bold;
    }

    .backward-label {
      fill: var(--backward);
      font-weight: bold;
    }

    #fallback,
    noscript {
      display: block;
      box-sizing: border-box;
      padding: var(--pad);
      color: var(--ink);
      background: var(--panel);
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Прямой и обратный путь по графу y = wx + b</h1>
    <svg id="diagram" viewBox="0 0 1200 480" width="1200" height="480"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Вычислительный граф с листовыми тензорами x, w и b, прямым вычислением y и обратными стрелками градиентов"></svg>
    <p id="fallback" hidden>
      Схема должна была показать прямой путь: x = 2 и w = 3 дают 6, затем b = 1 даёт y = 7; обратный путь ведёт градиенты от loss через сложение и умножение к листовым тензорам.
    </p>
    <noscript>
      Прямой путь: x = 2 и w = 3 → умножение → 6; затем b = 1 → сложение → y = 7 → loss. Обратный путь идёт от loss к y, сложению, b, умножению, w и x.
    </noscript>
  </figure>

  <script>
    const data = [
      { type: "frame", x: 0, y: 0, w: 104, h: 44, r: 1 },

      {
        type: "arrow", direction: "forward",
        points: [[16, 12], [20, 12], [20, 18], [24, 18]],
        head: [[24, 18], [22.8, 17.3], [22.8, 18.7]]
      },
      {
        type: "arrow", direction: "forward",
        points: [[16, 26], [20, 26], [20, 22], [24, 22]],
        head: [[24, 22], [22.8, 21.3], [22.8, 22.7]]
      },
      {
        type: "arrow", direction: "forward",
        points: [[34, 20], [48, 20]],
        head: [[48, 20], [46.8, 19.3], [46.8, 20.7]]
      },
      {
        type: "arrow", direction: "forward",
        points: [[48.5, 28], [48.5, 26.5], [53, 26.5], [53, 25]],
        head: [[53, 25], [52.3, 26.2], [53.7, 26.2]]
      },
      {
        type: "arrow", direction: "forward",
        points: [[58, 20], [68, 20]],
        head: [[68, 20], [66.8, 19.3], [66.8, 20.7]]
      },
      {
        type: "arrow", direction: "forward",
        points: [[81, 20], [88, 20]],
        head: [[88, 20], [86.8, 19.3], [86.8, 20.7]]
      },

      {
        type: "arrow", direction: "backward",
        points: [[88, 18], [81, 18]],
        head: [[81, 18], [82.2, 17.3], [82.2, 18.7]]
      },
      {
        type: "arrow", direction: "backward",
        points: [[74.5, 15.5], [74.5, 6], [53, 6], [53, 15]],
        head: [[53, 15], [52.3, 13.8], [53.7, 13.8]]
      },
      {
        type: "arrow", direction: "backward",
        points: [[48, 17], [43, 10.5], [34, 10.5], [34, 17]],
        head: [[34, 17], [33.3, 15.8], [34.7, 15.8]]
      },
      {
        type: "arrow", direction: "backward",
        points: [[28, 15], [28, 5], [10, 5], [10, 8]],
        head: [[10, 8], [9.3, 6.8], [10.7, 6.8]]
      },
      {
        type: "arrow", direction: "backward",
        points: [[28, 25], [28, 36], [9.5, 36], [9.5, 30]],
        head: [[9.5, 30], [8.8, 31.2], [10.2, 31.2]]
      },
      {
        type: "arrow", direction: "backward",
        points: [[55, 25], [58.5, 27], [52, 27], [52, 28]],
        head: [[52, 28], [51.3, 26.8], [52.7, 26.8]]
      },

      {
        type: "node", palette: "leaf", x: 3, y: 8, w: 13, h: 8, r: 1,
        texts: [
          { text: "x = 2", x: 9.5, y: 11.1, role: "main" },
          { text: "листовой тензор", x: 9.5, y: 13.7, role: "sub" }
        ]
      },
      {
        type: "node", palette: "leaf", x: 3, y: 22, w: 13, h: 8, r: 1,
        texts: [
          { text: "w = 3", x: 9.5, y: 25.1, role: "main" },
          { text: "листовой тензор", x: 9.5, y: 27.7, role: "sub" }
        ]
      },
      {
        type: "node", palette: "operation", x: 24, y: 15, w: 10, h: 10, r: 1,
        texts: [
          { text: "×", x: 29, y: 18.2, role: "operator" },
          { text: "2 × 3 = 6", x: 29, y: 22.4, role: "sub" }
        ]
      },
      {
        type: "node", palette: "leaf", x: 42, y: 28, w: 13, h: 8, r: 1,
        texts: [
          { text: "b = 1", x: 48.5, y: 31.1, role: "main" },
          { text: "листовой тензор", x: 48.5, y: 33.7, role: "sub" }
        ]
      },
      {
        type: "node", palette: "operation", x: 48, y: 15, w: 10, h: 10, r: 1,
        texts: [
          { text: "+", x: 53, y: 18.2, role: "operator" },
          { text: "6 + 1", x: 53, y: 22.4, role: "sub" }
        ]
      },
      {
        type: "node", palette: "result", x: 68, y: 15.5, w: 13, h: 9, r: 1,
        texts: [
          { text: "y = 7", x: 74.5, y: 19, role: "main" },
          { text: "результат", x: 74.5, y: 21.9, role: "sub" }
        ]
      },
      {
        type: "node", palette: "loss", x: 88, y: 15.5, w: 14, h: 9, r: 1,
        texts: [
          { text: "loss", x: 95, y: 18.8, role: "main" },
          { text: "итог слишком велик", x: 95, y: 21.8, role: "sub" }
        ]
      },

      { type: "label", text: "ОБРАТНЫЙ ПУТЬ ← ГРАДИЕНТЫ", x: 2, y: 2.3, anchor: "start", tone: "backward", role: "section" },
      { type: "label", text: "ПРЯМОЙ ПУТЬ →", x: 88, y: 2.3, anchor: "end", tone: "forward", role: "section" },
      { type: "label", text: "6", x: 41, y: 19, anchor: "middle", tone: "forward", role: "small" },
      { type: "label", text: "7", x: 63, y: 19, anchor: "middle", tone: "forward", role: "small" },
      { type: "label", text: "градиент от loss", x: 69, y: 5.1, anchor: "middle", tone: "backward", role: "small" },
      { type: "label", text: "назад через сложение", x: 41, y: 9.4, anchor: "middle", tone: "backward", role: "small" },
      { type: "label", text: "к x", x: 17, y: 4.1, anchor: "middle", tone: "backward", role: "small" },
      { type: "label", text: "к w", x: 18, y: 37.6, anchor: "middle", tone: "backward", role: "small" },
      { type: "label", text: "к b", x: 59, y: 28.5, anchor: "start", tone: "backward", role: "small" },

      {
        type: "legend", direction: "forward",
        points: [[4, 41], [11, 41]],
        text: "прямой путь: 2 × 3 → 6; 6 + 1 → 7",
        x: 12.5, y: 41, anchor: "start"
      },
      {
        type: "legend", direction: "backward",
        points: [[57, 41], [50, 41]],
        head: [[50, 41], [51.2, 40.3], [51.2, 41.7]],
        text: "обратный путь: от loss к листовым тензорам",
        x: 58.5, y: 41, anchor: "start"
      }
    ];

    const origin = Object.freeze({ x: 24, y: 20 });
    const scale = Object.freeze({ x: 11, y: 10 });
    const labelPadding = 10;
    const lineThickness = 2;
    const fontSize = 17;
    const smallFontSize = 13;
    const operatorFontSize = 28;

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    try {
      document.documentElement.style.setProperty("--pad", `${labelPadding}px`);

      function element(tag, attributes, parent = svg) {
        const node = document.createElementNS(namespace, tag);
        for (const [name, value] of Object.entries(attributes)) {
          node.setAttribute(name, value);
        }
        parent.appendChild(node);
        return node;
      }

      function pathData(points) {
        let first = true;
        return points.map(([x, y]) => {
          const command = first ? "M" : "L";
          first = false;
          return `${command} ${sx(x)} ${sy(y)}`;
        }).join(" ");
      }

      function polygonData(points) {
        return points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");
      }

      function drawArrow(item) {
        const backward = item.direction === "backward";
        const path = element("path", {
          d: pathData(item.points),
          class: backward ? "backward-line" : "forward-line",
          "stroke-width": lineThickness
        });

        if (backward) {
          path.setAttribute(
            "stroke-dasharray",
            `${sx(0.7) - sx(0)} ${sx(0.45) - sx(0)}`
          );
        }

        if (item.head) {
          element("polygon", {
            points: polygonData(item.head),
            class: backward ? "backward-head" : "forward-head"
          });
        }
      }

      function drawText(item, parent = svg) {
        const roleClass = item.role === "operator"
          ? "operator-label"
          : item.role === "sub"
            ? "sub-label"
            : item.role === "section"
              ? "section-label"
              : "main-label";

        const toneClass = item.tone === "forward"
          ? " forward-label"
          : item.tone === "backward"
            ? " backward-label"
            : "";

        const size = item.role === "operator"
          ? operatorFontSize
          : item.role === "sub" || item.role === "small" || item.role === "section"
            ? smallFontSize
            : fontSize;

        const text = element("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor || "middle",
          "dominant-baseline": "middle",
          "font-size": size,
          class: `${roleClass}${toneClass}`
        }, parent);

        text.textContent = item.text;
      }

      function drawNode(item) {
        const group = element("g", {
          "aria-label": item.texts.map(({ text }) => text).join(", ")
        });

        element("rect", {
          x: sx(item.x),
          y: sy(item.y),
          width: sx(item.w) - sx(0),
          height: sy(item.h) - sy(0),
          rx: sx(item.r) - sx(0),
          class: `node ${item.palette}`,
          "stroke-width": lineThickness
        }, group);

        for (const textItem of item.texts) {
          drawText(textItem, group);
        }
      }

      const frame = data.find(({ type }) => type === "frame");
      element("rect", {
        x: sx(frame.x),
        y: sy(frame.y),
        width: sx(frame.w) - sx(0),
        height: sy(frame.h) - sy(0),
        rx: sx(frame.r) - sx(0),
        class: "frame",
        "stroke-width": lineThickness
      });

      for (const item of data.filter(({ type }) => type === "arrow")) {
        drawArrow(item);
      }

      for (const item of data.filter(({ type }) => type === "node")) {
        drawNode(item);
      }

      for (const item of data.filter(({ type }) => type === "label")) {
        drawText(item);
      }

      for (const item of data.filter(({ type }) => type === "legend")) {
        drawArrow(item);
        drawText({
          text: item.text,
          x: item.x,
          y: item.y,
          anchor: item.anchor,
          tone: item.direction,
          role: "small"
        });
      }
    } catch (error) {
      svg.setAttribute("hidden", "");
      fallback.hidden = false;
      console.error(error);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
