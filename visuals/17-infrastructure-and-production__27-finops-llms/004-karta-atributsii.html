<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Один доллар в трёх разрезах</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --panel-soft: aliceblue;
      --ink: midnightblue;
      --muted: slategray;
      --line: steelblue;
      --accent: royalblue;
      --accent-soft: lightcyan;
      --money: darkgreen;
      --money-soft: honeydew;
      --frame: lightsteelblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslategray;
        --panel-soft: slategray;
        --ink: white;
        --muted: gainsboro;
        --line: lightskyblue;
        --accent: deepskyblue;
        --accent-soft: darkslateblue;
        --money: palegreen;
        --money-soft: darkgreen;
        --frame: steelblue;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: auto;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: auto;
      background: var(--panel);
    }

    figcaption {
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      max-height: 520px;
      background: var(--panel);
      font-family: inherit;
    }

    .frame {
      fill: var(--panel);
      stroke: var(--frame);
      stroke-width: 2px;
    }

    .event-card {
      fill: var(--panel-soft);
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .dimension-card {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .dimension-rail {
      stroke: var(--accent);
      stroke-width: 5px;
      stroke-linecap: round;
    }

    .connector,
    .trunk {
      fill: none;
      stroke: var(--line);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrowhead {
      fill: var(--line);
    }

    .junction {
      fill: var(--accent);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .money-chip {
      fill: var(--money-soft);
      stroke: var(--money);
      stroke-width: 2px;
    }

    .event-title {
      fill: var(--ink);
      font-size: 27px;
      font-weight: bold;
    }

    .event-copy {
      fill: var(--ink);
      font-size: 18px;
    }

    .event-note {
      fill: var(--muted);
      font-size: 16px;
    }

    .question {
      fill: var(--accent);
      font-size: 18px;
      font-weight: bold;
    }

    .value {
      fill: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 17px;
    }

    .same-money {
      fill: var(--money);
      font-size: 16px;
      font-weight: bold;
    }

    .flow-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .principle {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">Один доллар в трёх разрезах</figcaption>
    <svg
      id="diagram"
      viewBox="0 0 1200 440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Один LLM-вызов стоимостью один доллар связан одновременно с
        пользователем, функцией продукта и клиентом. Во всех трёх отчётах
        показан один и тот же расход.
      </desc>
    </svg>
  </figure>

  <script>
    const data = [
      {
        kind: "layout",
        origin: { x: 18, y: 18 },
        scale: 1,
        frame: { x: 0, y: 0, w: 1164, h: 402, r: 18 },
        junction: { x: 540, y: 190, r: 8 },
        trunk: [
          { x: 375, y: 190 },
          { x: 540, y: 190 }
        ],
        flowLabels: [
          {
            text: "одно событие",
            anchor: { x: 445, y: 190 },
            side: "top"
          },
          {
            text: "три подписи",
            anchor: { x: 540, y: 190 },
            side: "bottom"
          }
        ],
        principle: {
          text: "Меняется вопрос к расходу, а не сам расход: всего $1",
          anchor: { x: 582, y: 386 }
        },
        fallback: [
          {
            text: "Один LLM-вызов за $1 имеет три подписи:",
            anchor: { x: 582, y: 176 }
          },
          {
            text: "user_id=u_42 · task_id=task_classify_doc · route=model_haiku · tenant_id=t_7",
            anchor: { x: 582, y: 214 }
          }
        ]
      },
      {
        kind: "event",
        box: { x: 48, y: 105, w: 327, h: 170, r: 18 },
        title: {
          text: "$1 · один LLM-вызов",
          anchor: { x: 75, y: 149 }
        },
        copy: {
          text: "одно событие расхода",
          anchor: { x: 75, y: 188 }
        },
        notes: [
          {
            text: "видно в разных отчётах",
            anchor: { x: 75, y: 225 }
          },
          {
            text: "оплачивается один раз",
            anchor: { x: 75, y: 250 }
          }
        ]
      },
      {
        kind: "dimension",
        box: { x: 735, y: 16, w: 388, h: 90, r: 15 },
        rail: {
          from: { x: 735, y: 31 },
          to: { x: 735, y: 91 }
        },
        question: {
          text: "«кто»",
          anchor: { x: 762, y: 47 }
        },
        values: [
          {
            text: "user_id=u_42",
            anchor: { x: 762, y: 78 }
          }
        ],
        chip: { x: 1014, y: 35, w: 84, h: 44, r: 14 },
        chipText: {
          text: "тот же $1",
          anchor: { x: 1056, y: 62 }
        },
        path: [
          { x: 540, y: 190 },
          { x: 650, y: 61 },
          { x: 735, y: 61 }
        ],
        arrow: [
          { x: 735, y: 61 },
          { x: 717, y: 51 },
          { x: 717, y: 71 }
        ]
      },
      {
        kind: "dimension",
        box: { x: 735, y: 136, w: 388, h: 110, r: 15 },
        rail: {
          from: { x: 735, y: 151 },
          to: { x: 735, y: 231 }
        },
        question: {
          text: "«какая функция»",
          anchor: { x: 762, y: 166 }
        },
        values: [
          {
            text: "task_id=task_classify_doc",
            anchor: { x: 762, y: 199 }
          },
          {
            text: "route=model_haiku",
            anchor: { x: 762, y: 226 }
          }
        ],
        chip: { x: 1014, y: 157, w: 84, h: 44, r: 14 },
        chipText: {
          text: "тот же $1",
          anchor: { x: 1056, y: 184 }
        },
        path: [
          { x: 540, y: 190 },
          { x: 650, y: 191 },
          { x: 735, y: 191 }
        ],
        arrow: [
          { x: 735, y: 191 },
          { x: 717, y: 181 },
          { x: 717, y: 201 }
        ]
      },
      {
        kind: "dimension",
        box: { x: 735, y: 276, w: 388, h: 90, r: 15 },
        rail: {
          from: { x: 735, y: 291 },
          to: { x: 735, y: 351 }
        },
        question: {
          text: "«какой клиент»",
          anchor: { x: 762, y: 307 }
        },
        values: [
          {
            text: "tenant_id=t_7",
            anchor: { x: 762, y: 338 }
          }
        ],
        chip: { x: 1014, y: 295, w: 84, h: 44, r: 14 },
        chipText: {
          text: "тот же $1",
          anchor: { x: 1056, y: 322 }
        },
        path: [
          { x: 540, y: 190 },
          { x: 650, y: 321 },
          { x: 735, y: 321 }
        ],
        arrow: [
          { x: 735, y: 321 },
          { x: 717, y: 311 },
          { x: 717, y: 331 }
        ]
      }
    ];

    const [layout, event, ...dimensions] = data;
    const origin = layout.origin;
    const scale = layout.scale;
    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    const labelOffset = 12;
    const svg = document.getElementById("diagram");
    const namespace = svg.namespaceURI;

    function element(name, attributes, content) {
      const node = document.createElementNS(namespace, name);

      for (const [attribute, value] of Object.entries(attributes)) {
        node.setAttribute(attribute, String(value));
      }

      if (content !== undefined) {
        node.textContent = content;
      }

      return node;
    }

    function append(name, attributes, content) {
      const node = element(name, attributes, content);
      svg.appendChild(node);
      return node;
    }

    function rect(box, className) {
      append("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        rx: sx(box.r) - sx(0),
        class: className
      });
    }

    function line(from, to, className) {
      append("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className
      });
    }

    function polyline(points, className) {
      append("polyline", {
        points: points
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: className
      });
    }

    function polygon(points, className) {
      append("polygon", {
        points: points
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: className
      });
    }

    function text(label, className, anchor = "start") {
      append(
        "text",
        {
          x: sx(label.anchor.x),
          y: sy(label.anchor.y),
          "text-anchor": anchor,
          class: className
        },
        label.text
      );
    }

    function offsetText(label, className) {
      const gap = labelOffset / scale;
      let x = label.anchor.x;
      let y = label.anchor.y;
      let anchor = "middle";

      if (label.side === "top") {
        y -= gap;
      } else if (label.side === "bottom") {
        y += gap + gap;
      } else if (label.side === "left") {
        x -= gap;
        anchor = "end";
      } else if (label.side === "right") {
        x += gap;
        anchor = "start";
      }

      text(
        {
          text: label.text,
          anchor: { x, y }
        },
        className,
        anchor
      );
    }

    function drawDimension(dimension) {
      polyline(dimension.path, "connector");
      polygon(dimension.arrow, "arrowhead");
      rect(dimension.box, "dimension-card");
      line(dimension.rail.from, dimension.rail.to, "dimension-rail");

      text(dimension.question, "question");

      for (const value of dimension.values) {
        text(value, "value");
      }

      rect(dimension.chip, "money-chip");
      text(dimension.chipText, "same-money", "middle");
    }

    function draw() {
      if (!svg || !layout || event.kind !== "event") {
        throw new Error("Недостаточно данных для построения схемы");
      }

      rect(layout.frame, "frame");
      rect(event.box, "event-card");

      text(event.title, "event-title");
      text(event.copy, "event-copy");

      for (const note of event.notes) {
        text(note, "event-note");
      }

      line(layout.trunk.shift(), layout.trunk.pop(), "trunk");

      for (const dimension of dimensions) {
        drawDimension(dimension);
      }

      append("circle", {
        cx: sx(layout.junction.x),
        cy: sy(layout.junction.y),
        r: sx(layout.junction.r) - sx(0),
        class: "junction"
      });

      for (const flowLabel of layout.flowLabels) {
        offsetText(flowLabel, "flow-label");
      }

      text(layout.principle, "principle", "middle");
    }

    try {
      draw();
    } catch (error) {
      while (svg.firstChild) {
        svg.removeChild(svg.firstChild);
      }

      for (const fallbackLine of layout.fallback) {
        text(fallbackLine, "fallback", "middle");
      }

      console.error(error);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
