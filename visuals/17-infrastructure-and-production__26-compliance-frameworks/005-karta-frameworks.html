<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта семи фреймворков и клиентских сегментов</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --surface: #ffffff;
      --panel: #f1f4f8;
      --border: #cbd3df;
      --text: #172033;
      --muted: #596579;
      --guide: #d7dde7;
      --soc: #2563eb;
      --hipaa: #059669;
      --gdpr: #7c3aed;
      --pci: #dc6b19;
      --eu: #c026d3;
      --colorado: #d13f4e;
      --iso: #087f8c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141c;
        --surface: #171d28;
        --panel: #202837;
        --border: #3c485c;
        --text: #f0f4fb;
        --muted: #b2bed0;
        --guide: #344054;
        --soc: #6ea8ff;
        --hipaa: #45d6a2;
        --gdpr: #b898ff;
        --pci: #ffad66;
        --eu: #ee86f6;
        --colorado: #ff7f8c;
        --iso: #55cad2;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 14px;
    }

    figure {
      margin: 0;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    figcaption {
      padding: 13px 16px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: normal;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .intro {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--surface);
    }

    .column-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .map-note {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .route {
      fill: none;
      stroke-width: 3.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .node,
    .client {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 1.2;
      vector-effect: non-scaling-stroke;
    }

    .framework-name {
      fill: var(--text);
      font-size: 14px;
      font-weight: 730;
    }

    .framework-scope {
      fill: var(--muted);
      font-size: 11.5px;
      font-weight: 500;
    }

    .client-title {
      fill: var(--text);
      font-size: 15px;
      font-weight: 750;
    }

    .client-data {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 520;
    }

    .client-note {
      fill: var(--muted);
      font-size: 10.5px;
      font-weight: 620;
    }

    .entry-ring {
      fill: var(--surface);
      stroke-width: 2.8;
      vector-effect: non-scaling-stroke;
    }

    .accent {
      stroke-width: 4.6;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      margin: 0;
      padding: 24px;
      color: var(--muted);
      background: var(--surface);
      font-size: 14px;
      line-height: normal;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title" aria-describedby="diagram-intro">
    <figcaption>
      <h1 id="diagram-title">Карта семи фреймворков и клиентских сегментов</h1>
      <p class="intro" id="diagram-intro">
        Маршрут задают клиент, география и данные; обычно складываются 2–3 слоя.
      </p>
    </figcaption>

    <svg
      id="map"
      viewBox="0 0 1180 460"
      width="1180"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Семь фреймворков соединены с клиникой США, европейским банком, платёжным сервисом и обычным B2B SaaS"
    >
      <title>
        Клиентские маршруты через SOC 2 Type II, HIPAA, GDPR, PCI-DSS,
        EU AI Act, Colorado AI Act и ISO 42001
      </title>
    </svg>

    <p id="fallback" role="status">
      Схема должна показать, как семь фреймворков накладываются для клиники
      США, европейского банка, платёжного сервиса и обычного B2B SaaS.
    </p>
  </figure>

  <script>
    const diagram = {
      layout: {
        frameworkX: 0,
        frameworkWidth: 19.5,
        frameworkHeight: 5.3,
        frameworkAccentStart: 0.65,
        frameworkAccentEnd: 1.55,
        frameworkTextX: 2.45,
        frameworkNameShift: -0.35,
        frameworkScopeShift: 1.25,
        routeStartX: 19.5,
        routeControlOneX: 28,
        routeControlTwoX: 36.5,
        clientX: 45.5,
        clientWidth: 16.5,
        clientTextX: 47.15,
        clientTitleShift: 3,
        clientDataShift: 5.25,
        clientNoteShift: 7.2,
        radius: 0.5,
        dotRadius: 0.39,
        headingY: -1.05,
        frameworksHeadingX: 0,
        routeHeadingX: 31.5,
        clientsHeadingX: 45.5,
        dash: 0.55,
        gap: 0.36
      },
      frameworks: [
        {
          key: "soc",
          name: "SOC 2 Type II",
          scope: "база B2B · контроли работают 6–12 месяцев",
          y: 4,
          clients: [
            { key: "clinic", y: 4.55 },
            { key: "bank", y: 16.8 },
            { key: "payment", y: 29.8 },
            { key: "saas", y: 41.25 }
          ]
        },
        {
          key: "hipaa",
          name: "HIPAA",
          scope: "клиника США · BAA и защита PHI",
          y: 10.6,
          clients: [
            { key: "clinic", y: 7.25 }
          ]
        },
        {
          key: "gdpr",
          name: "GDPR",
          scope: "ЕС · удаление PII, права, статья 30",
          y: 17.2,
          clients: [
            { key: "bank", y: 19.45 }
          ]
        },
        {
          key: "pci",
          name: "PCI-DSS",
          scope: "платежи · настройки системы и договоры",
          y: 23.8,
          clients: [
            { key: "payment", y: 32.45 }
          ]
        },
        {
          key: "eu",
          name: "EU AI Act",
          scope: "ЕС · класс риска, документация, журналы",
          y: 30.4,
          clients: [
            { key: "bank", y: 22.1 }
          ]
        },
        {
          key: "colorado",
          name: "Colorado AI Act",
          scope: "жители Колорадо · оценка и оспаривание",
          y: 37,
          conditional: true,
          clients: [
            { key: "saas", y: 43.9 }
          ]
        },
        {
          key: "iso",
          name: "ISO 42001",
          scope: "управление ИИ · вместе с ISO 27001",
          y: 43.6,
          clients: [
            { key: "saas", y: 46.55 }
          ]
        }
      ],
      clients: [
        {
          key: "clinic",
          title: "Клиника США",
          data: "медицинские данные PHI",
          note: "база + HIPAA",
          y: 1.55,
          height: 8.65
        },
        {
          key: "bank",
          title: "Европейский банк",
          data: "пользователи ЕС · решения ИИ",
          note: "SOC 2 + GDPR + EU AI Act",
          y: 13.75,
          height: 10.05
        },
        {
          key: "payment",
          title: "Платёжный сервис",
          data: "ИИ касается платежей",
          note: "база + PCI-DSS",
          y: 26.8,
          height: 8.65
        },
        {
          key: "saas",
          title: "Обычный B2B SaaS",
          data: "база + системное управление ИИ",
          note: "Colorado — если есть жители штата",
          y: 38.25,
          height: 10.75
        }
      ]
    };

    const origin = { x: 40, y: 28 };
    const scale = { x: 17.5, y: 8.5 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("map");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";
      const group = document.createElementNS(ns, "g");
      const L = diagram.layout;

      const make = (name, attributes, content) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([attribute, value]) => {
          element.setAttribute(attribute, value);
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const spanX = (x, width) => sx(x + width) - sx(x);
      const spanY = (y, height) => sy(y + height) - sy(y);
      const radius = value => sx(value) - sx(0);

      const addText = (className, x, y, anchor, content) => {
        group.appendChild(
          make(
            "text",
            {
              class: className,
              x: sx(x),
              y: sy(y),
              "text-anchor": anchor
            },
            content
          )
        );
      };

      addText(
        "column-label",
        L.frameworksHeadingX,
        L.headingY,
        "start",
        "Фреймворки"
      );
      addText(
        "map-note",
        L.routeHeadingX,
        L.headingY,
        "middle",
        "маршрут = сегмент + данные"
      );
      addText(
        "column-label",
        L.clientsHeadingX,
        L.headingY,
        "start",
        "Клиентские сегменты"
      );

      diagram.frameworks.forEach(framework => {
        framework.clients.forEach(target => {
          const path = make("path", {
            class: "route",
            d: [
              "M",
              sx(L.routeStartX),
              sy(framework.y),
              "C",
              sx(L.routeControlOneX),
              sy(framework.y),
              sx(L.routeControlTwoX),
              sy(target.y),
              sx(L.clientX),
              sy(target.y)
            ].join(" "),
            stroke: `var(--${framework.key})`
          });

          if (framework.conditional) {
            path.setAttribute(
              "stroke-dasharray",
              [
                spanX(0, L.dash),
                spanX(0, L.gap)
              ].join(" ")
            );
          }

          group.appendChild(path);
        });
      });

      diagram.frameworks.forEach(framework => {
        const row = make("g", {
          "aria-label": `${framework.name}: ${framework.scope}`
        });
        const top = framework.y - L.frameworkHeight / scale.x;

        row.appendChild(
          make("rect", {
            class: "node",
            x: sx(L.frameworkX),
            y: sy(top),
            width: spanX(L.frameworkX, L.frameworkWidth),
            height: spanY(top, L.frameworkHeight / scale.x),
            rx: radius(L.radius)
          })
        );

        row.appendChild(
          make("line", {
            class: "accent",
            x1: sx(L.frameworkAccentStart),
            y1: sy(framework.y),
            x2: sx(L.frameworkAccentEnd),
            y2: sy(framework.y),
            stroke: `var(--${framework.key})`
          })
        );

        row.appendChild(
          make(
            "text",
            {
              class: "framework-name",
              x: sx(L.frameworkTextX),
              y: sy(framework.y + L.frameworkNameShift),
              "text-anchor": "start"
            },
            framework.name
          )
        );

        row.appendChild(
          make(
            "text",
            {
              class: "framework-scope",
              x: sx(L.frameworkTextX),
              y: sy(framework.y + L.frameworkScopeShift),
              "text-anchor": "start"
            },
            framework.scope
          )
        );

        row.appendChild(
          make("circle", {
            cx: sx(L.routeStartX),
            cy: sy(framework.y),
            r: radius(L.dotRadius),
            fill: `var(--${framework.key})`
          })
        );

        group.appendChild(row);
      });

      diagram.clients.forEach(client => {
        group.appendChild(
          make("rect", {
            class: "client",
            x: sx(L.clientX),
            y: sy(client.y),
            width: spanX(L.clientX, L.clientWidth),
            height: spanY(client.y, client.height),
            rx: radius(L.radius)
          })
        );

        addText(
          "client-title",
          L.clientTextX,
          client.y + L.clientTitleShift,
          "start",
          client.title
        );
        addText(
          "client-data",
          L.clientTextX,
          client.y + L.clientDataShift,
          "start",
          client.data
        );
        addText(
          "client-note",
          L.clientTextX,
          client.y + L.clientNoteShift,
          "start",
          client.note
        );
      });

      diagram.frameworks.forEach(framework => {
        framework.clients.forEach(target => {
          group.appendChild(
            make("circle", {
              class: "entry-ring",
              cx: sx(L.clientX),
              cy: sy(target.y),
              r: radius(L.dotRadius),
              stroke: `var(--${framework.key})`
            })
          );
        });
      });

      svg.appendChild(group);
      fallback.hidden = true;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      fallback.textContent =
        "Не удалось построить карту. Она должна была показать маршруты семи фреймворков для клиники США, европейского банка, платёжного сервиса и обычного B2B SaaS.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
