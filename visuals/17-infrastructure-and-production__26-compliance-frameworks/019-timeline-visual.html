<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Календарь EU AI Act и Colorado AI Act</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --axis: #98a2b3;
      --eu: #2563eb;
      --eu-soft: #dbeafe;
      --ban: #c2415d;
      --ban-soft: #ffe4e8;
      --co: #b45309;
      --co-soft: #ffedd5;
      --rule: #d0d5dd;
      --focus: #7c2d12;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      background: var(--panel);
      padding: 16px;
    }

    h1 {
      margin: unset;
      padding-bottom: 12px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      overflow: visible;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      fill: var(--axis);
    }

    .tick {
      stroke: var(--axis);
    }

    .event-eu {
      stroke: var(--eu);
      fill: var(--eu);
    }

    .event-ban {
      stroke: var(--ban);
      fill: var(--ban);
    }

    .event-co {
      stroke: var(--co);
      fill: var(--co);
    }

    .halo-co {
      fill: var(--co-soft);
      stroke: var(--co);
    }

    .tag-eu {
      fill: var(--eu);
    }

    .tag-ban {
      fill: var(--ban);
    }

    .tag-co {
      fill: var(--co);
    }

    .date {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .tag {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .axis-label,
    .note {
      fill: var(--muted);
      font-size: 14px;
    }

    .summary {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .summary-accent {
      fill: var(--focus);
      font-size: 15px;
      font-weight: bold;
    }

    .footer-rule {
      stroke: var(--rule);
    }

    #fallback {
      padding: 16px;
      background: var(--panel);
      color: var(--ink);
      font-size: 15px;
    }

    [hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0b1020;
        --panel: #111827;
        --ink: #f3f4f6;
        --muted: #a7b0c0;
        --axis: #667085;
        --eu: #60a5fa;
        --eu-soft: #172554;
        --ban: #fb7185;
        --ban-soft: #4c1725;
        --co: #fbbf24;
        --co-soft: #422006;
        --rule: #344054;
        --focus: #fbbf24;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-heading">Календарь EU AI Act и Colorado AI Act</h1>

    <svg
      id="timeline"
      viewBox="0 0 1000 400"
      width="1000"
      height="400"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
    >
      <title>Временная шкала EU AI Act и Colorado AI Act</title>
      <desc id="diagram-description">
        Календарь показывает вступление EU AI Act в силу, начало применения
        запретов, дату Colorado AI Act и этапы требований к высокорисковым
        системам.
      </desc>
      <g id="drawing"></g>
    </svg>

    <div id="fallback" hidden>
      Схема должна была показать календарь: 1 августа 2024 года — вступление
      EU AI Act в силу; 2 февраля 2025 года — запреты; 30 июня 2026 года —
      Colorado AI Act; 2 августа 2026 года и август 2027 года — требования
      к высокорисковым системам.
    </div>
  </main>

  <script>
    (() => {
      const data = [
        {
          type: "layout",
          axis: {
            from: { x: 30, y: 180 },
            to: { x: 910, y: 180 },
            arrow: [
              { x: 910, y: 180 },
              { x: 893, y: 170 },
              { x: 893, y: 190 }
            ],
            label: { x: 30, y: 160, text: "Общий календарь", anchor: "start" }
          },
          footer: {
            rule: {
              from: { x: 30, y: 337 },
              to: { x: 910, y: 337 }
            },
            summary: {
              x: 470,
              y: 362,
              text: "Один продукт · две юрисдикции · разные даты применения",
              anchor: "middle"
            },
            accent: {
              x: 470,
              y: 384,
              text: "Готовность считают от первой применимой даты",
              anchor: "middle"
            }
          }
        },
        {
          type: "event",
          jurisdiction: "eu",
          point: { x: 50, y: 180 },
          radius: 7,
          tick: {
            from: { x: 50, y: 169 },
            to: { x: 50, y: 191 }
          },
          stem: {
            from: { x: 50, y: 180 },
            to: { x: 50, y: 112 },
            capFrom: { x: 50, y: 112 },
            capTo: { x: 61, y: 112 }
          },
          labels: [
            {
              x: 61,
              y: 50,
              text: "EU AI ACT",
              anchor: "start",
              className: "tag tag-eu"
            },
            {
              x: 61,
              y: 76,
              text: "1 августа 2024",
              anchor: "start",
              className: "date"
            },
            {
              x: 61,
              y: 101,
              text: "Вступление в силу",
              anchor: "start",
              className: "label"
            }
          ]
        },
        {
          type: "event",
          jurisdiction: "ban",
          point: { x: 215, y: 180 },
          radius: 7,
          tick: {
            from: { x: 215, y: 169 },
            to: { x: 215, y: 191 }
          },
          stem: {
            from: { x: 215, y: 180 },
            to: { x: 215, y: 237 },
            capFrom: { x: 204, y: 237 },
            capTo: { x: 215, y: 237 }
          },
          labels: [
            {
              x: 215,
              y: 260,
              text: "EU AI ACT",
              anchor: "middle",
              className: "tag tag-ban"
            },
            {
              x: 215,
              y: 286,
              text: "2 февраля 2025",
              anchor: "middle",
              className: "date"
            },
            {
              x: 215,
              y: 311,
              text: "Запреты",
              anchor: "middle",
              className: "label"
            }
          ]
        },
        {
          type: "event",
          jurisdiction: "co",
          point: { x: 520, y: 180 },
          radius: 8,
          haloRadius: 16,
          tick: {
            from: { x: 520, y: 167 },
            to: { x: 520, y: 193 }
          },
          stem: {
            from: { x: 520, y: 180 },
            to: { x: 520, y: 237 },
            capFrom: { x: 509, y: 237 },
            capTo: { x: 520, y: 237 }
          },
          labels: [
            {
              x: 520,
              y: 260,
              text: "COLORADO AI ACT",
              anchor: "middle",
              className: "tag tag-co"
            },
            {
              x: 520,
              y: 286,
              text: "30 июня 2026",
              anchor: "middle",
              className: "date"
            },
            {
              x: 520,
              y: 311,
              text: "Высокорисковый ИИ",
              anchor: "middle",
              className: "label"
            }
          ]
        },
        {
          type: "event",
          jurisdiction: "eu",
          point: { x: 665, y: 180 },
          radius: 8,
          tick: {
            from: { x: 665, y: 167 },
            to: { x: 665, y: 193 }
          },
          stem: {
            from: { x: 665, y: 180 },
            to: { x: 665, y: 112 },
            capFrom: { x: 654, y: 112 },
            capTo: { x: 665, y: 112 }
          },
          labels: [
            {
              x: 665,
              y: 28,
              text: "EU AI ACT",
              anchor: "middle",
              className: "tag tag-eu"
            },
            {
              x: 665,
              y: 54,
              text: "2 августа 2026",
              anchor: "middle",
              className: "date"
            },
            {
              x: 665,
              y: 79,
              text: "Требования к высокорисковым",
              anchor: "middle",
              className: "label"
            },
            {
              x: 665,
              y: 101,
              text: "системам",
              anchor: "middle",
              className: "label"
            }
          ]
        },
        {
          type: "event",
          jurisdiction: "eu",
          point: { x: 870, y: 180 },
          radius: 7,
          tick: {
            from: { x: 870, y: 169 },
            to: { x: 870, y: 191 }
          },
          stem: {
            from: { x: 870, y: 180 },
            to: { x: 870, y: 237 },
            capFrom: { x: 859, y: 237 },
            capTo: { x: 870, y: 237 }
          },
          labels: [
            {
              x: 870,
              y: 260,
              text: "EU AI ACT",
              anchor: "end",
              className: "tag tag-eu"
            },
            {
              x: 870,
              y: 286,
              text: "август 2027",
              anchor: "end",
              className: "date"
            },
            {
              x: 870,
              y: 311,
              text: "Высокорисковые системы",
              anchor: "end",
              className: "label"
            },
            {
              x: 870,
              y: 331,
              text: "в регулируемых продуктах",
              anchor: "end",
              className: "label"
            }
          ]
        }
      ];

      const origin = Object.freeze({ x: 40, y: 0 });
      const scale = Object.freeze({ x: 1, y: 1 });

      const sx = (x) => origin.x + x * scale.x;
      const sy = (y) => origin.y + y * scale.y;

      const labelPadding = 8;
      const lineWidth = 2;
      const fontSize = 15;

      try {
        const namespace = "http://www.w3.org/2000/svg";
        const svg = document.getElementById("timeline");
        const drawing = document.getElementById("drawing");
        const fallback = document.getElementById("fallback");
        const layout = data.find((item) => item.type === "layout");
        const events = data.filter((item) => item.type === "event");

        const make = (name, attributes, className, text) => {
          const node = document.createElementNS(namespace, name);

          Object.entries(attributes).forEach(([key, value]) => {
            node.setAttribute(key, String(value));
          });

          if (className) {
            node.setAttribute("class", className);
          }

          if (text) {
            node.textContent = text;
          }

          return node;
        };

        const axis = make(
          "line",
          {
            x1: sx(layout.axis.from.x),
            y1: sy(layout.axis.from.y),
            x2: sx(layout.axis.to.x),
            y2: sy(layout.axis.to.y),
            "stroke-width": lineWidth,
            "stroke-linecap": "round"
          },
          "axis"
        );
        drawing.appendChild(axis);

        const arrowPoints = layout.axis.arrow
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        drawing.appendChild(
          make("polygon", { points: arrowPoints }, "axis")
        );

        drawing.appendChild(
          make(
            "text",
            {
              x: sx(layout.axis.label.x),
              y: sy(layout.axis.label.y),
              "text-anchor": layout.axis.label.anchor,
              "font-size": fontSize
            },
            "axis-label",
            layout.axis.label.text
          )
        );

        events.forEach((event) => {
          const eventClass = `event-${event.jurisdiction}`;

          if (event.haloRadius) {
            drawing.appendChild(
              make(
                "circle",
                {
                  cx: sx(event.point.x),
                  cy: sy(event.point.y),
                  r: sx(event.haloRadius) - sx(0),
                  "stroke-width": lineWidth
                },
                "halo-co"
              )
            );
          }

          drawing.appendChild(
            make(
              "line",
              {
                x1: sx(event.tick.from.x),
                y1: sy(event.tick.from.y),
                x2: sx(event.tick.to.x),
                y2: sy(event.tick.to.y),
                "stroke-width": lineWidth,
                "stroke-linecap": "round"
              },
              `tick ${eventClass}`
            )
          );

          drawing.appendChild(
            make(
              "line",
              {
                x1: sx(event.stem.from.x),
                y1: sy(event.stem.from.y),
                x2: sx(event.stem.to.x),
                y2: sy(event.stem.to.y),
                "stroke-width": lineWidth,
                "stroke-linecap": "round"
              },
              eventClass
            )
          );

          drawing.appendChild(
            make(
              "line",
              {
                x1: sx(event.stem.capFrom.x),
                y1: sy(event.stem.capFrom.y),
                x2: sx(event.stem.capTo.x),
                y2: sy(event.stem.capTo.y),
                "stroke-width": lineWidth,
                "stroke-linecap": "round"
              },
              eventClass
            )
          );

          drawing.appendChild(
            make(
              "circle",
              {
                cx: sx(event.point.x),
                cy: sy(event.point.y),
                r: sx(event.radius) - sx(0),
                "stroke-width": lineWidth
              },
              eventClass
            )
          );

          event.labels.forEach((label) => {
            drawing.appendChild(
              make(
                "text",
                {
                  x: sx(label.x),
                  y: sy(label.y),
                  "text-anchor": label.anchor,
                  "font-size": fontSize,
                  "data-label-padding": labelPadding
                },
                label.className,
                label.text
              )
            );
          });
        });

        drawing.appendChild(
          make(
            "line",
            {
              x1: sx(layout.footer.rule.from.x),
              y1: sy(layout.footer.rule.from.y),
              x2: sx(layout.footer.rule.to.x),
              y2: sy(layout.footer.rule.to.y),
              "stroke-width": lineWidth
            },
            "footer-rule"
          )
        );

        drawing.appendChild(
          make(
            "text",
            {
              x: sx(layout.footer.summary.x),
              y: sy(layout.footer.summary.y),
              "text-anchor": layout.footer.summary.anchor,
              "font-size": fontSize
            },
            "summary",
            layout.footer.summary.text
          )
        );

        drawing.appendChild(
          make(
            "text",
            {
              x: sx(layout.footer.accent.x),
              y: sy(layout.footer.accent.y),
              "text-anchor": layout.footer.accent.anchor,
              "font-size": fontSize
            },
            "summary-accent",
            layout.footer.accent.text
          )
        );

        fallback.hidden = true;
      } catch (error) {
        document.getElementById("timeline").hidden = true;
        document.getElementById("fallback").hidden = false;
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
