<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один переход — две TD-цели</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --surface: #ffffff;
    --surface-soft: #f1f5f9;
    --ink: #172033;
    --muted: #5d687c;
    --line: #8793a8;
    --shared: #52647f;
    --q: #176b87;
    --q-soft: #e5f6fb;
    --sarsa: #8a4b12;
    --sarsa-soft: #fff1dd;
    --best: #18794e;
    --best-soft: #e8f7ef;
    --chosen: #7253a3;
    --chosen-soft: #f1ebfb;
    --shadow: #d7dce7;
    --danger: #a33a3a;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #192231;
      --surface-soft: #202c3d;
      --ink: #f3f6fb;
      --muted: #b8c1d1;
      --line: #7f8da4;
      --shared: #a6b4ca;
      --q: #69c8e6;
      --q-soft: #183744;
      --sarsa: #f2b66f;
      --sarsa-soft: #402d1d;
      --best: #70d69f;
      --best-soft: #173a2a;
      --chosen: #c3a5f2;
      --chosen-soft: #35294a;
      --shadow: #0b1018;
      --danger: #ff9b9b;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  .figure {
    width: 100%;
    padding: 14px;
    background: var(--page);
  }

  h1 {
    margin: 0 0 10px;
    font-size: 21px;
    line-height: 1.2;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--surface);
    border: 1px solid var(--shadow);
  }

  .panel,
  .target,
  .shared-pill,
  .value-row {
    stroke-width: 2px;
  }

  .panel {
    fill: var(--surface-soft);
    stroke: var(--line);
  }

  .target.q {
    fill: var(--q-soft);
    stroke: var(--q);
  }

  .target.sarsa {
    fill: var(--sarsa-soft);
    stroke: var(--sarsa);
  }

  .shared-pill {
    fill: var(--surface-soft);
    stroke: var(--shared);
  }

  .state {
    fill: var(--surface);
    stroke: var(--shared);
    stroke-width: 3px;
  }

  .shaft,
  .branch {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .shaft {
    stroke: var(--shared);
    stroke-width: 3px;
  }

  .branch.q {
    stroke: var(--q);
    stroke-width: 3px;
  }

  .branch.sarsa {
    stroke: var(--sarsa);
    stroke-width: 3px;
  }

  .arrow.shared {
    fill: var(--shared);
  }

  .arrow.q {
    fill: var(--q);
  }

  .arrow.sarsa {
    fill: var(--sarsa);
  }

  .value-row {
    fill: var(--surface);
    stroke: var(--shadow);
  }

  .value-row.best {
    fill: var(--best-soft);
    stroke: var(--best);
  }

  .value-row.chosen {
    fill: var(--chosen-soft);
    stroke: var(--chosen);
    stroke-dasharray: 6px 5px;
  }

  text {
    fill: var(--ink);
    font-size: 16px;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .caption {
    fill: var(--muted);
    font-size: 15px;
  }

  .heading {
    font-size: 17px;
    font-weight: bold;
  }

  .state-label {
    font-size: 21px;
    font-weight: bold;
  }

  .value {
    font-size: 19px;
    font-weight: bold;
  }

  .best-text {
    fill: var(--best);
    font-weight: bold;
  }

  .chosen-text {
    fill: var(--chosen);
    font-weight: bold;
  }

  .q-text {
    fill: var(--q);
    font-weight: bold;
  }

  .sarsa-text {
    fill: var(--sarsa);
    font-weight: bold;
  }

  .formula {
    font-size: 18px;
    font-weight: bold;
  }

  .result {
    font-size: 21px;
    font-weight: bold;
  }

  .fallback {
    margin: 0;
    padding: 18px;
    color: var(--danger);
    background: var(--surface);
    border: 2px solid var(--danger);
    font-size: 16px;
  }

  [hidden] {
    display: none;
  }
</style>
</head>
<body>
<main class="figure">
  <h1 id="diagram-title">Один переход — две TD-цели</h1>
  <svg id="diagram"
       viewBox="0 0 1000 500"
       width="1000"
       height="500"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      После одного общего перехода Q-learning подставляет максимум 7,
      а SARSA — оценку выбранного действия вверх, равную 2.
    </desc>
    <g id="drawing"></g>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна была показать: для оценок действий «вверх: 2, вниз: 7,
    влево: 1, вправо: 3» Q-learning берёт максимум 7 и получает TD-цель
    5,3, а SARSA при выбранном действии «вверх» использует 2 и получает
    TD-цель 0,8.
  </p>
</main>

<script>
const diagramData = [{
  origin: { x: 42, y: 470 },
  scale: { x: 90, y: 60 },
  zero: 0,
  lineGap: 22,
  common: {
    heading: { x: 1.85, y: 6.35, text: "Общие данные перехода" },
    state: { x: 1.05, y: 4.45, r: 0.43, text: "s" },
    arrow: {
      line: { x1: 1.55, y1: 4.45, x2: 3.25, y2: 4.45 },
      tip: [
        { x: 3.25, y: 4.45 },
        { x: 3.02, y: 4.60 },
        { x: 3.02, y: 4.30 }
      ]
    },
    action: {
      x: 2.36, y: 4.82, dx: 0, dy: -8,
      anchor: "middle", text: "действие a"
    },
    reward: {
      x: 2.36, y: 4.08, dx: 0, dy: 8,
      anchor: "middle", text: "награда r = −1"
    },
    pill: { x: 0.42, y: 2.12, w: 2.70, h: 0.74, r: 0.14 },
    pillText: {
      x: 1.77, y: 2.49, dx: 0, dy: 5,
      anchor: "middle", text: "обновляется Q(s, a)"
    }
  },
  valuesPanel: {
    box: { x: 3.38, y: 0.98, w: 2.82, h: 6.02, r: 0.16 },
    heading: {
      x: 4.79, y: 6.58, dx: 0, dy: 5,
      anchor: "middle", text: "В состоянии s′"
    },
    subheading: {
      x: 4.79, y: 6.16, dx: 0, dy: 5,
      anchor: "middle", text: "Q(s′, ·)"
    },
    rows: [
      {
        box: { x: 3.66, y: 5.08, w: 2.26, h: 0.72, r: 0.10 },
        kind: "chosen",
        action: {
          x: 3.86, y: 5.44, dx: 0, dy: 6,
          anchor: "start", text: "↑ вверх"
        },
        note: {
          x: 5.17, y: 5.44, dx: 0, dy: 5,
          anchor: "end", text: "выбрано"
        },
        value: {
          x: 5.72, y: 5.44, dx: 0, dy: 7,
          anchor: "end", text: "2"
        }
      },
      {
        box: { x: 3.66, y: 4.02, w: 2.26, h: 0.72, r: 0.10 },
        kind: "best",
        action: {
          x: 3.86, y: 4.38, dx: 0, dy: 6,
          anchor: "start", text: "↓ вниз"
        },
        note: {
          x: 5.17, y: 4.38, dx: 0, dy: 5,
          anchor: "end", text: "max"
        },
        value: {
          x: 5.72, y: 4.38, dx: 0, dy: 7,
          anchor: "end", text: "7"
        }
      },
      {
        box: { x: 3.66, y: 2.96, w: 2.26, h: 0.72, r: 0.10 },
        kind: "",
        action: {
          x: 3.86, y: 3.32, dx: 0, dy: 6,
          anchor: "start", text: "← влево"
        },
        value: {
          x: 5.72, y: 3.32, dx: 0, dy: 7,
          anchor: "end", text: "1"
        }
      },
      {
        box: { x: 3.66, y: 1.90, w: 2.26, h: 0.72, r: 0.10 },
        kind: "",
        action: {
          x: 3.86, y: 2.26, dx: 0, dy: 6,
          anchor: "start", text: "→ вправо"
        },
        value: {
          x: 5.72, y: 2.26, dx: 0, dy: 7,
          anchor: "end", text: "3"
        }
      }
    ]
  },
  qBranch: {
    path: [
      { x: 6.20, y: 5.24 },
      { x: 6.48, y: 5.78 },
      { x: 6.70, y: 5.80 },
      { x: 6.93, y: 5.48 }
    ],
    tip: [
      { x: 6.93, y: 5.48 },
      { x: 6.68, y: 5.51 },
      { x: 6.82, y: 5.27 }
    ],
    label: {
      x: 6.31, y: 6.08, dx: 0, dy: -7,
      anchor: "start", text: "смотрит на все действия"
    },
    box: { x: 7.04, y: 4.18, w: 3.54, h: 2.44, r: 0.16 },
    heading: {
      x: 7.29, y: 6.18, dx: 0, dy: 5,
      anchor: "start", text: "Q-learning"
    },
    choice: {
      x: 10.31, y: 6.18, dx: 0, dy: 5,
      anchor: "end", text: "берёт max = 7"
    },
    formula: {
      x: 8.81, y: 5.30, dx: 0, dy: 6,
      anchor: "middle", text: "−1 + 0,9 × 7"
    },
    result: {
      x: 8.81, y: 4.62, dx: 0, dy: 7,
      anchor: "middle", text: "TD-цель = 5,3"
    }
  },
  sarsaBranch: {
    path: [
      { x: 6.20, y: 2.30 },
      { x: 6.48, y: 1.68 },
      { x: 6.70, y: 1.62 },
      { x: 6.93, y: 1.94 }
    ],
    tip: [
      { x: 6.93, y: 1.94 },
      { x: 6.82, y: 2.16 },
      { x: 6.68, y: 1.91 }
    ],
    label: {
      x: 6.31, y: 1.30, dx: 0, dy: 8,
      anchor: "start", text: "берёт выбранное a′"
    },
    box: { x: 7.04, y: 0.42, w: 3.54, h: 2.44, r: 0.16 },
    heading: {
      x: 7.29, y: 2.42, dx: 0, dy: 5,
      anchor: "start", text: "SARSA"
    },
    choice: {
      x: 10.31, y: 2.42, dx: 0, dy: 5,
      anchor: "end", text: "вверх = 2"
    },
    formula: {
      x: 8.81, y: 1.54, dx: 0, dy: 6,
      anchor: "middle", text: "−1 + 0,9 × 2"
    },
    result: {
      x: 8.81, y: 0.86, dx: 0, dy: 7,
      anchor: "middle", text: "TD-цель = 0,8"
    }
  }
}];

const [{ origin, scale }] = diagramData;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y - y * scale.y;

try {
  const [D] = diagramData;
  const root = document.getElementById("drawing");
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  const add = (tag, attrs, content) => {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([name, value]) => {
      if (value !== undefined && value !== "") node.setAttribute(name, value);
    });
    if (content !== undefined) node.textContent = content;
    root.appendChild(node);
    return node;
  };

  const drawRect = (box, className) => add("rect", {
    x: sx(box.x),
    y: sy(box.y + box.h),
    width: sx(box.x + box.w) - sx(box.x),
    height: sy(box.y) - sy(box.y + box.h),
    rx: sx(box.r) - sx(D.zero),
    class: className
  });

  const drawText = (item, className) => add("text", {
    x: sx(item.x),
    y: sy(item.y),
    dx: item.dx,
    dy: item.dy,
    "text-anchor": item.anchor,
    class: className
  }, item.text);

  const drawTip = (points, className) => add("polygon", {
    points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: className
  });

  const drawCurve = (points, className) => {
    const [start, controlA, controlB, end] = points;
    add("path", {
      d: `M ${sx(start.x)} ${sy(start.y)} C ${sx(controlA.x)} ${sy(controlA.y)} ${sx(controlB.x)} ${sy(controlB.y)} ${sx(end.x)} ${sy(end.y)}`,
      class: className
    });
  };

  drawText(D.common.heading, "heading");
  add("circle", {
    cx: sx(D.common.state.x),
    cy: sy(D.common.state.y),
    r: sx(D.common.state.r) - sx(D.zero),
    class: "state"
  });
  drawText({
    x: D.common.state.x,
    y: D.common.state.y,
    dx: D.zero,
    dy: D.common.reward.dy,
    anchor: "middle",
    text: D.common.state.text
  }, "state-label");

  add("line", {
    x1: sx(D.common.arrow.line.x1),
    y1: sy(D.common.arrow.line.y1),
    x2: sx(D.common.arrow.line.x2),
    y2: sy(D.common.arrow.line.y2),
    class: "shaft"
  });
  drawTip(D.common.arrow.tip, "arrow shared");
  drawText(D.common.action, "caption");
  drawText(D.common.reward, "caption");
  drawRect(D.common.pill, "shared-pill");
  drawText(D.common.pillText, "heading");

  drawRect(D.valuesPanel.box, "panel");
  drawText(D.valuesPanel.heading, "heading");
  drawText(D.valuesPanel.subheading, "caption");

  D.valuesPanel.rows.forEach(row => {
    drawRect(row.box, `value-row ${row.kind}`);
    drawText(
      row.action,
      row.kind === "chosen" ? "chosen-text" :
      row.kind === "best" ? "best-text" : ""
    );
    if (row.note) {
      drawText(
        row.note,
        row.kind === "chosen" ? "small chosen-text" : "small best-text"
      );
    }
    drawText(
      row.value,
      row.kind === "chosen" ? "value chosen-text" :
      row.kind === "best" ? "value best-text" : "value"
    );
  });

  drawCurve(D.qBranch.path, "branch q");
  drawTip(D.qBranch.tip, "arrow q");
  drawText(D.qBranch.label, "small q-text");
  drawRect(D.qBranch.box, "target q");
  drawText(D.qBranch.heading, "heading q-text");
  drawText(D.qBranch.choice, "small q-text");
  drawText(D.qBranch.formula, "formula");
  drawText(D.qBranch.result, "result q-text");

  drawCurve(D.sarsaBranch.path, "branch sarsa");
  drawTip(D.sarsaBranch.tip, "arrow sarsa");
  drawText(D.sarsaBranch.label, "small sarsa-text");
  drawRect(D.sarsaBranch.box, "target sarsa");
  drawText(D.sarsaBranch.heading, "heading sarsa-text");
  drawText(D.sarsaBranch.choice, "small sarsa-text");
  drawText(D.sarsaBranch.formula, "formula");
  drawText(D.sarsaBranch.result, "result sarsa-text");
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
