<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>600 токенов вместо 60 000</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1d1d1f; --mut:#6b6b70;
    --thick:#c0392b; --thin:#1e8a5a; --box:#e8e8e4; --line:#9a9a9e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#eceef2; --mut:#9aa0aa;
      --thick:#e8705f; --thin:#4fc48c; --box:#23262c; --line:#565b64;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:1100px;margin:0 auto;padding:8px 10px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  text{fill:var(--fg);font-family:inherit;}
  .mut{fill:var(--mut);}
  .fail{padding:10px;border:1px solid var(--line);border-radius:6px;color:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>600 токенов вместо 60 000: мусор читает субагент, а не оркестратор</h2>
  <div id="host">
    <svg id="s" viewBox="0 0 900 430" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Слева двадцать толстых стрелок по 3000 токенов идут в окно оркестратора, справа двадцать субагентов читают мусор у себя и отдают наверх строки по 30 токенов">
    </svg>
  </div>
</div>
<script>
(function(){
  var svg = document.getElementById("s");
  try{
    // ---- данные схемы -------------------------------------------------
    var DATA = {
      n: 20,              // модулей / субагентов
      junk: 3000,         // токенов мусора на один поиск
      line: 30,           // токенов в строке результата
      naive: 60000,       // 20 * 3000
      subs: 600           // 20 * 30
    };

    // ---- одна система координат --------------------------------------
    var ORIGIN = {x: 60, y: 400};   // sx(0), sy(0)
    var SCALE  = {x: 8, y: 8};
    function sx(x){ return ORIGIN.x + x * SCALE.x; }
    function sy(y){ return ORIGIN.y - y * SCALE.y; }

    // ---- литералы-разрешённые: пиксели -------------------------------
    var PAD = 6, PAD2 = 12, THIN = 1, FS = 13, FSS = 11.5, FSB = 14;

    var NS = "http://www.w3.org/2000/svg";
    function el(t, a){ var e=document.createElementNS(NS,t);
      for(var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
    function txt(x,y,s,anchor,size,cls){
      var e=el("text",{x:x,y:y,"text-anchor":anchor||"middle",
        "font-size":size||FS,"class":cls||""}); e.textContent=s; return e; }

    // ---- сетка панелей в единицах данных -----------------------------
    var PW = 44;                 // ширина панели
    var LX = 0, RX = 60;         // левый край панелей
    var TOP = 42, MID = 27, BOT = 8;   // ярусы: окно, стрелки, источники

    // рамка окна оркестратора
    function window_(x, y, w, h){
      el("rect",{x:sx(x),y:sy(y+h),width:sx(x+w)-sx(x),height:sy(y)-sy(y+h),
        rx:sx(1)-sx(0),fill:"var(--box)",stroke:"var(--line)","stroke-width":THIN});
    }

    // стрелка снизу вверх, толщина в единицах данных
    function arrow(x, y0, y1, wUnits, color){
      var w = sx(wUnits)-sx(0);
      var head = sx(1.6)-sx(0);
      el("line",{x1:sx(x),y1:sy(y0),x2:sx(x),y2:sy(y1)+head,
        stroke:color,"stroke-width":w,"stroke-linecap":"butt"});
      el("path",{d:"M "+sx(x)+" "+sy(y1)+
        " L "+(sx(x)-head)+" "+(sy(y1)+head)+
        " L "+(sx(x)+head)+" "+(sy(y1)+head)+" Z",fill:color});
    }

    // ---- ЛЕВО: всё валится в одно окно -------------------------------
    window_(LX, TOP, PW, 12);
    txt(sx(LX+PW/2), sy(TOP+8), "Окно оркестратора", "middle", FSB);
    txt(sx(LX+PW/2), sy(TOP+4), DATA.naive.toLocaleString("ru-RU")+" токенов внутри",
        "middle", FS, "mut");
    txt(sx(LX+PW/2), sy(TOP+1), "окно кончится на 14-м модуле — сжатие контекста",
        "middle", FSS, "mut");

    var step = PW/DATA.n;
    for(var i=0;i<DATA.n;i++){
      var x = LX + step*(i+0.5);
      arrow(x, BOT, TOP, 1.15, "var(--thick)");
      el("rect",{x:sx(x-step/2)+THIN,y:sy(BOT),
        width:sx(step)-sx(0)-THIN*2,height:sy(0)-sy(BOT-0),
        fill:"none"});
    }
    // подписи слева — у ХВОСТА стрелок
    txt(sx(LX)-PAD, sy(BOT+3), "20 поисков", "end", FS);
    txt(sx(LX)-PAD, sy(BOT), "по "+DATA.junk.toLocaleString("ru-RU")+" токенов", "end", FSS, "mut");
    txt(sx(LX+PW/2), sy(MID-2), "толстые: весь мусор наверх", "middle", FSS, "mut");
    txt(sx(LX+PW/2), sy(BOT-4), "без субагентов", "middle", FSB);

    // ---- ПРАВО: субагенты --------------------------------------------
    window_(RX, TOP, PW, 12);
    txt(sx(RX+PW/2), sy(TOP+8), "Окно оркестратора", "middle", FSB);
    txt(sx(RX+PW/2), sy(TOP+4), DATA.subs+" токенов внутри", "middle", FS, "mut");
    txt(sx(RX+PW/2), sy(TOP+1), "в этом окне не заметны", "middle", FSS, "mut");

    for(var j=0;j<DATA.n;j++){
      var xr = RX + step*(j+0.5);
      // своё окно субагента: мусор прочитан и остался внизу
      el("rect",{x:sx(xr-step/2)+THIN, y:sy(BOT+9),
        width:sx(step)-sx(0)-THIN*2, height:sy(BOT)-sy(BOT+9),
        fill:"var(--box)",stroke:"var(--line)","stroke-width":THIN});
      el("line",{x1:sx(xr-step/2)+THIN,y1:sy(BOT+2),
        x2:sx(xr+step/2)-THIN,y2:sy(BOT+2),
        stroke:"var(--thick)","stroke-width":sx(1.6)-sx(0),opacity:0.55});
      arrow(xr, BOT+9, TOP, 0.16, "var(--thin)");
    }
    txt(sx(RX+PW)+PAD, sy(BOT+11), "20 субагентов", "start", FS);
    txt(sx(RX+PW)+PAD, sy(BOT+8), "у каждого своё окно", "start", FSS, "mut");
    txt(sx(RX+PW)+PAD, sy(BOT+5), "внутри "+DATA.junk.toLocaleString("ru-RU")+" токенов", "start", FSS, "mut");
    txt(sx(RX+PW)+PAD, sy(BOT+2), "мусора — и он остаётся тут", "start", FSS, "mut");
    txt(sx(RX+PW/2), sy(MID-2), "тонкие: строка по "+DATA.line+" токенов", "middle", FSS, "mut");
    txt(sx(RX+PW/2), sy(BOT-4), "с субагентами", "middle", FSB);

    // ---- итог между панелями ------------------------------------------
    var gx = (LX+PW + RX)/2;
    txt(sx(gx), sy(MID+4), "×100", "middle", 18);
    txt(sx(gx), sy(MID+1), "стрелок", "middle", FSS, "mut");
    txt(sx(gx), sy(MID-1), "столько же —", "middle", FSS, "mut");
    txt(sx(gx), sy(MID-3), "толщина другая", "middle", FSS, "mut");

    // ---- легенда строкой под схемой ------------------------------------
    txt(sx(LX), sy(BOT-8),
      "Толщина стрелки = токены, доехавшие до оркестратора: "+
      DATA.n+"×"+DATA.junk.toLocaleString("ru-RU")+" = "+DATA.naive.toLocaleString("ru-RU")+
      "   против   "+DATA.n+"×"+DATA.line+" = "+DATA.subs,
      "start", FSS, "mut");
  }catch(e){
    document.getElementById("host").innerHTML =
      '<div class="fail">Схема не построилась. Она должна показывать две панели. ' +
      'Слева: 20 толстых стрелок по 3 000 токенов валятся прямо в окно оркестратора — ' +
      '60 000 токенов, окно кончается на 14-м модуле. Справа: те же 20 стрелок, но ' +
      'каждый субагент читает свои 3 000 токенов в своём окне и отдаёт наверх строку ' +
      'на 30 токенов — 600 токенов у оркестратора. Стрелок столько же, разница в толщине.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
