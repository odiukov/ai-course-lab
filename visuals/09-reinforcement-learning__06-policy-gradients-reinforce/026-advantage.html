<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Преимущество — отклонение от ожидания</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --text: #172033;
      --muted: #637083;
      --axis: #8490a3;
      --guide: #bdc5d1;
      --base: #52647d;
      --base-fill: #edf1f7;
      --positive: #16845b;
      --positive-fill: #e8f7f0;
      --positive-border: #83cbae;
      --negative: #c34456;
      --negative-fill: #fff0f2;
      --negative-border: #e8a3ad;
      --formula: #6653c7;
      --formula-fill: #f0edff;
      --formula-border: #b9afea;
      --shadow: rgba(31, 42, 68, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
    }

    body {
      padding: 16px;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .figure {
      width: min(100%, 960px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid #d9dee8;
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 6px 22px var(--shadow);
    }

    .heading {
      padding: 18px 22px 8px;
      text-align: center;
    }

    .heading h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .heading p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    .canvas {
      width: 100%;
      padding: 0 10px 12px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 350px;
      overflow: visible;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-linecap: round;
    }

    .tick {
      stroke: var(--axis);
      stroke-linecap: round;
    }

    .guide {
      stroke: var(--guide);
      stroke-dasharray: 5 5;
      stroke-linecap: round;
    }

    .positive-line {
      stroke: var(--positive);
      stroke-linecap: round;
    }

    .negative-line {
      stroke: var(--negative);
      stroke-linecap: round;
    }

    .positive-head,
    .positive-point {
      fill: var(--positive);
    }

    .negative-head,
    .negative-point {
      fill: var(--negative);
    }

    .base-point {
      fill: var(--panel);
      stroke: var(--base);
    }

    .formula-box {
      fill: var(--formula-fill);
      stroke: var(--formula-border);
    }

    .negative-box {
      fill: var(--negative-fill);
      stroke: var(--negative-border);
    }

    .positive-box {
      fill: var(--positive-fill);
      stroke: var(--positive-border);
    }

    .formula-text {
      fill: var(--formula);
      font-weight: 700;
    }

    .main-text {
      fill: var(--text);
    }

    .muted-text {
      fill: var(--muted);
    }

    .base-text {
      fill: var(--base);
      font-weight: 700;
    }

    .positive-text {
      fill: var(--positive);
      font-weight: 700;
    }

    .negative-text {
      fill: var(--negative);
      font-weight: 700;
    }

    .card-title {
      font-weight: 700;
    }

    .card-result {
      font-weight: 800;
    }

    #fallback {
      display: none;
      margin: 14px 20px 22px;
      padding: 16px;
      border: 1px solid var(--negative-border);
      border-radius: 12px;
      background: var(--negative-fill);
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11151d;
        --panel: #191f2a;
        --panel-soft: #202735;
        --text: #f2f5fa;
        --muted: #aeb8c8;
        --axis: #8d99aa;
        --guide: #596477;
        --base: #bac7da;
        --base-fill: #293344;
        --positive: #62d5a2;
        --positive-fill: #163a30;
        --positive-border: #347e64;
        --negative: #ff8998;
        --negative-fill: #45232a;
        --negative-border: #8e4854;
        --formula: #c4b9ff;
        --formula-fill: #302c50;
        --formula-border: #6d62a7;
        --shadow: rgba(0, 0, 0, 0.28);
      }

      .figure {
        border-color: #303949;
      }
    }
  </style>
</head>
<body>
  <main class="figure">
    <header class="heading">
      <h1 id="figure-title">Преимущество — отклонение от ожидания</h1>
      <p>Один baseline, два возврата и противоположные обновления политики</p>
    </header>

    <div class="canvas">
      <svg
        id="diagram"
        viewBox="0 0 960 350"
        width="960"
        height="350"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="figure-title figure-description"
      >
        <desc id="figure-description">
          При baseline 3,0 возврат 5,0 даёт преимущество плюс 2,0
          и повышает вероятность действия, а возврат 1,0 даёт
          преимущество минус 2,0 и понижает её.
        </desc>
        <g id="drawing"></g>
      </svg>

      <div id="fallback" role="note">
        При baseline 3,0 возврат 5,0 даёт advantage +2,0 и повышает
        вероятность действия. Возврат 1,0 даёт advantage −2,0 и
        понижает вероятность действия.
      </div>
    </div>
  </main>

  <script>
    const diagramData = [{
      formulaBox: { left: 5.15, right: 11.15, top: 0.12, bottom: 0.98 },
      formulaAt: { x: 8.15, y: 0.56 },

      axis: { left: 1.05, right: 15.25, y: 3.18 },
      tickHalf: 0.15,

      low: { x: 4.05, value: "1,0" },
      baseline: { x: 8.15, value: "3,0" },
      high: { x: 12.25, value: "5,0" },

      positiveArrow: {
        start: { x: 8.15, y: 1.78 },
        end: { x: 12.25, y: 1.78 },
        head: [
          { x: 12.25, y: 1.78 },
          { x: 11.94, y: 1.59 },
          { x: 11.94, y: 1.97 }
        ]
      },

      negativeArrow: {
        start: { x: 8.15, y: 4.42 },
        end: { x: 4.05, y: 4.42 },
        head: [
          { x: 4.05, y: 4.42 },
          { x: 4.36, y: 4.23 },
          { x: 4.36, y: 4.61 }
        ]
      },

      positiveGuide: {
        start: { x: 12.25, y: 1.78 },
        end: { x: 12.25, y: 3.18 }
      },

      negativeGuide: {
        start: { x: 4.05, y: 3.18 },
        end: { x: 4.05, y: 4.42 }
      },

      baseGuideTop: {
        start: { x: 8.15, y: 1.78 },
        end: { x: 8.15, y: 3.18 }
      },

      baseGuideBottom: {
        start: { x: 8.15, y: 3.18 },
        end: { x: 8.15, y: 4.42 }
      },

      positiveMathAt: { x: 10.2, y: 1.38 },
      positiveMeaningAt: { x: 10.2, y: 2.18 },
      negativeMathAt: { x: 6.1, y: 4.03 },
      negativeMeaningAt: { x: 6.1, y: 4.84 },

      baselineLabelAt: { x: 8.15, y: 2.78 },
      lowLabelAt: { x: 4.05, y: 3.69 },
      highLabelAt: { x: 12.25, y: 3.69 },

      pointRadius: 0.1,
      baseRadius: 0.13,

      negativeBox: {
        left: 0.92,
        right: 7.42,
        top: 5.35,
        bottom: 7.18
      },

      positiveBox: {
        left: 8.88,
        right: 15.38,
        top: 5.35,
        bottom: 7.18
      },

      negativeCardTitleAt: { x: 4.17, y: 5.88 },
      negativeCardMathAt: { x: 4.17, y: 6.39 },
      negativeCardResultAt: { x: 4.17, y: 6.88 },

      positiveCardTitleAt: { x: 12.13, y: 5.88 },
      positiveCardMathAt: { x: 12.13, y: 6.39 },
      positiveCardResultAt: { x: 12.13, y: 6.88 },

      cornerRadius: 0.22
    }];

    const origin = { x: 50, y: 13 };
    const scale = { x: 56, y: 45 };
    const canvasSize = { width: 960, height: 350 };
    const labelPadding = 9;
    const lineWidth = 2;
    const fontSize = 16;

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const [layout] = diagramData;
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (name, attributes = {}, text = "") => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (text) element.textContent = text;
        return element;
      };

      const add = element => {
        drawing.appendChild(element);
        return element;
      };

      const line = (from, to, className, width = lineWidth) => add(node("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className,
        "stroke-width": width
      }));

      const rect = (box, className) => add(node("rect", {
        x: sx(box.left),
        y: sy(box.top),
        width: sx(box.right) - sx(box.left),
        height: sy(box.bottom) - sy(box.top),
        rx: sx(layout.cornerRadius) - sx(0),
        ry: sy(layout.cornerRadius) - sy(0),
        class: className,
        "stroke-width": lineWidth
      }));

      const circle = (point, radius, className, width = lineWidth) => add(node("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: sx(radius) - sx(0),
        class: className,
        "stroke-width": width
      }));

      const polygon = (points, className) => add(node("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      }));

      const text = (
        point,
        content,
        className,
        anchor = "middle",
        size = fontSize
      ) => add(node("text", {
        x: sx(point.x),
        y: sy(point.y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle",
        "font-size": size
      }, content));

      rect(layout.formulaBox, "formula-box");
      text(layout.formulaAt, "A = G − V̂(s)", "formula-text");

      line(
        { x: layout.axis.left, y: layout.axis.y },
        { x: layout.axis.right, y: layout.axis.y },
        "axis"
      );

      [layout.low, layout.baseline, layout.high].forEach(mark => {
        line(
          { x: mark.x, y: layout.axis.y - layout.tickHalf },
          { x: mark.x, y: layout.axis.y + layout.tickHalf },
          "tick"
        );
      });

      line(
        layout.baseGuideTop.start,
        layout.baseGuideTop.end,
        "guide"
      );
      line(
        layout.baseGuideBottom.start,
        layout.baseGuideBottom.end,
        "guide"
      );
      line(
        layout.positiveGuide.start,
        layout.positiveGuide.end,
        "guide"
      );
      line(
        layout.negativeGuide.start,
        layout.negativeGuide.end,
        "guide"
      );

      line(
        layout.positiveArrow.start,
        layout.positiveArrow.end,
        "positive-line",
        lineWidth + lineWidth
      );
      polygon(layout.positiveArrow.head, "positive-head");

      line(
        layout.negativeArrow.start,
        layout.negativeArrow.end,
        "negative-line",
        lineWidth + lineWidth
      );
      polygon(layout.negativeArrow.head, "negative-head");

      circle(
        { x: layout.high.x, y: layout.axis.y },
        layout.pointRadius,
        "positive-point"
      );
      circle(
        { x: layout.low.x, y: layout.axis.y },
        layout.pointRadius,
        "negative-point"
      );
      circle(
        { x: layout.baseline.x, y: layout.axis.y },
        layout.baseRadius,
        "base-point",
        lineWidth + lineWidth
      );

      text(
        layout.positiveMathAt,
        "5,0 − 3,0 = +2,0",
        "positive-text"
      );
      text(
        layout.positiveMeaningAt,
        "лучше ожидания",
        "muted-text"
      );

      text(
        layout.negativeMathAt,
        "1,0 − 3,0 = −2,0",
        "negative-text"
      );
      text(
        layout.negativeMeaningAt,
        "хуже ожидания",
        "muted-text"
      );

      text(
        layout.baselineLabelAt,
        "baseline 3,0",
        "base-text"
      );
      text(
        layout.lowLabelAt,
        "возврат 1,0",
        "negative-text"
      );
      text(
        layout.highLabelAt,
        "возврат 5,0",
        "positive-text"
      );

      rect(layout.negativeBox, "negative-box");
      rect(layout.positiveBox, "positive-box");

      text(
        layout.negativeCardTitleAt,
        "Результат хуже ожидаемого",
        "main-text card-title"
      );
      text(
        layout.negativeCardMathAt,
        "advantage −2,0",
        "negative-text"
      );
      text(
        layout.negativeCardResultAt,
        "вероятность действия понижается ↓",
        "negative-text card-result"
      );

      text(
        layout.positiveCardTitleAt,
        "Результат лучше ожидаемого",
        "main-text card-title"
      );
      text(
        layout.positiveCardMathAt,
        "advantage +2,0",
        "positive-text"
      );
      text(
        layout.positiveCardResultAt,
        "вероятность действия повышается ↑",
        "positive-text card-result"
      );

      svg.setAttribute(
        "viewBox",
        `${sx(0) - origin.x} ${sy(0) - origin.y} ${canvasSize.width} ${canvasSize.height}`
      );
      drawing.setAttribute("data-label-padding", labelPadding);
      fallback.style.display = "none";
    } catch (error) {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (diagram) diagram.style.display = "none";
      if (fallback) fallback.style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
