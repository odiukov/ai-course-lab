<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как вероятность траектории распадается на решения политики</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5f6b7d;
      --line: #98a3b3;
      --policy: #087f71;
      --policy-soft: #dff7f1;
      --policy-line: #20a38f;
      --environment: #657184;
      --environment-soft: #edf0f5;
      --environment-line: #8994a5;
      --state: #315ca8;
      --state-soft: #e8efff;
      --action: #a55c0a;
      --action-soft: #fff1dc;
      --example: #f4f0ff;
      --example-line: #8871c3;
      --divider: #d9dee7;
      --shadow: rgba(31, 43, 65, .10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #18202d;
        --ink: #edf2fa;
        --muted: #aeb9c9;
        --line: #748095;
        --policy: #63d7c5;
        --policy-soft: #173d3a;
        --policy-line: #50c7b5;
        --environment: #c0c8d5;
        --environment-soft: #293343;
        --environment-line: #8692a5;
        --state: #91b5ff;
        --state-soft: #263b62;
        --action: #ffc277;
        --action-soft: #53391e;
        --example: #302a48;
        --example-line: #a897dd;
        --divider: #354052;
        --shadow: rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--divider);
      border-radius: 14px;
      box-shadow: 0 8px 24px var(--shadow);
    }

    h2 {
      margin: 0;
      padding: 14px 22px 10px;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 750;
      letter-spacing: -.015em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .canvas-bg { fill: var(--panel); }
    .section-rule { stroke: var(--divider); stroke-width: 1.5; }
    .trajectory { stroke-width: 3; stroke-linecap: round; }
    .policy-stroke { stroke: var(--policy-line); }
    .environment-stroke { stroke: var(--environment-line); }
    .policy-head { fill: var(--policy-line); }
    .environment-head { fill: var(--environment-line); }
    .state-node { fill: var(--state-soft); stroke: var(--state); stroke-width: 2.5; }
    .action-node { fill: var(--action-soft); stroke: var(--action); stroke-width: 2.5; }
    .policy-pill { fill: var(--policy-soft); stroke: var(--policy-line); stroke-width: 1.5; }
    .environment-pill {
      fill: var(--environment-soft);
      stroke: var(--environment-line);
      stroke-width: 1.5;
    }
    .formula-policy { fill: var(--policy-soft); stroke: var(--policy-line); stroke-width: 2; }
    .formula-environment {
      fill: var(--environment-soft);
      stroke: var(--environment-line);
      stroke-width: 2;
    }
    .example-card { fill: var(--example); stroke: var(--example-line); stroke-width: 1.5; }
    .legend-line { stroke-width: 4; stroke-linecap: round; }
    .text { fill: var(--ink); }
    .muted { fill: var(--muted); }
    .policy-text { fill: var(--policy); }
    .environment-text { fill: var(--environment); }
    .state-text { fill: var(--state); }
    .action-text { fill: var(--action); }
    .eyebrow { font-size: 12px; font-weight: bold; letter-spacing: .08em; }
    .node-label { font-size: 18px; font-weight: bold; }
    .factor { font-size: 14px; font-weight: 700; }
    .factor-note { font-size: 11px; font-weight: 650; }
    .legend-title { font-size: 14px; font-weight: bold; }
    .legend-copy { font-size: 12px; }
    .formula-label { font-size: 14px; font-weight: bold; }
    .formula-main { font-size: 19px; font-weight: 700; }
    .formula-prefix { font-size: 20px; font-weight: bold; }
    .example-label { font-size: 13px; font-weight: bold; }
    .example-value { font-size: 20px; font-weight: 750; }
    .example-copy { font-size: 13px; }

    #fallback {
      margin: 0;
      padding: 18px 22px 24px;
      color: var(--muted);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Как вероятность траектории распадается на решения политики</h2>
    <svg id="diagram" viewBox="0 0 1200 470" preserveAspectRatio="xMidYMid meet"
         role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Разложение вероятности траектории</title>
      <desc id="svg-desc">
        Три последовательных решения политики чередуются с переходами среды.
        Только множители политики зависят от параметров тета.
      </desc>
      <g id="drawing"></g>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать три шага траектории: произведение решений
      политики πθ(a₀|s₀), πθ(a₁|s₁), πθ(a₂|s₂) и переходов среды,
      которые не зависят от θ.
    </p>
  </figure>

  <script>
    const data = {
      zero: 0,
      canvas: { w: 1200, h: 470 },
      math: { half: 2 },
      arrow: { length: 10, halfHeight: 6 },
      stateRadius: 28,
      action: { w: 70, h: 46, radius: 12 },
      pill: { policyW: 158, policyH: 39, environmentW: 158, environmentH: 43, radius: 10 },
      states: [
        { id: "s₀", x: 70, y: 126, caption: "старт" },
        { id: "s₁", x: 340, y: 126, caption: "" },
        { id: "s₂", x: 610, y: 126, caption: "" },
        { id: "s₃", x: 880, y: 126, caption: "траектория продолжена" }
      ],
      actions: [
        { id: "a₀", x: 205, y: 126 },
        { id: "a₁", x: 475, y: 126 },
        { id: "a₂", x: 745, y: 126 }
      ],
      steps: [
        {
          from: "s₀", action: "a₀", to: "s₁",
          policy: "πθ(a₀ | s₀)", environment: "p(s₁ | s₀, a₀)"
        },
        {
          from: "s₁", action: "a₁", to: "s₂",
          policy: "πθ(a₁ | s₁)", environment: "p(s₂ | s₁, a₁)"
        },
        {
          from: "s₂", action: "a₂", to: "s₃",
          policy: "πθ(a₂ | s₂)", environment: "p(s₃ | s₂, a₂)"
        }
      ],
      layout: {
        eyebrow: { x: 38, y: 20 },
        policyPillY: 38,
        environmentPillY: 174,
        captionY: 166,
        legendRule: { x: 930, y1: 36, y2: 229 },
        legendPolicy: { x1: 960, x2: 1000, y: 72 },
        legendEnvironment: { x1: 960, x2: 1000, y: 145 },
        legendPolicyTitle: { x: 1015, y: 68 },
        legendPolicyCopy: { x: 1015, y: 88 },
        legendEnvironmentTitle: { x: 1015, y: 141 },
        legendEnvironmentCopy: { x: 1015, y: 161 },
        ruleY: 247,
        formulaHeading: { x: 38, y: 274 },
        formulaPrefix: { x: 38, y: 326 },
        environmentBox: { x: 155, y: 294, w: 477, h: 58, r: 12 },
        multiply: { x: 651, y: 328 },
        policyBox: { x: 675, y: 294, w: 487, h: 58, r: 12 },
        environmentCaption: { x: 393, y: 287 },
        policyCaption: { x: 918, y: 287 },
        environmentFormula: { x: 393, y: 329 },
        policyFormula: { x: 918, y: 329 },
        example: { x: 38, y: 373, w: 1124, h: 78, r: 12 },
        exampleLabel: { x: 58, y: 397 },
        exampleValue: { x: 58, y: 429 },
        exampleCopyTop: { x: 590, y: 411 },
        exampleCopyBottom: { x: 590, y: 434 }
      },
      offsets: {
        none: { x: 0, y: 0 },
        policyTitle: { x: 0, y: 0 },
        policyNote: { x: 0, y: 14 },
        environmentTitle: { x: 0, y: 0 },
        environmentNote: { x: 0, y: 14 }
      }
    };

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    function sx(x) { return origin.x + x * scale.x; }
    function sy(y) { return origin.y + y * scale.y; }

    try {
      const ns = "http://www.w3.org/2000/svg";
      const root = document.getElementById("drawing");

      function add(tag, attrs, content) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs || {}).forEach(([name, value]) => node.setAttribute(name, String(value)));
        if (content !== undefined) node.textContent = content;
        root.appendChild(node);
        return node;
      }

      function rect(box, className) {
        return add("rect", {
          x: sx(box.x), y: sy(box.y),
          width: sx(box.w) - sx(data.zero),
          height: sy(box.h) - sy(data.zero),
          rx: sx(box.r) - sx(data.zero),
          class: className
        });
      }

      function label(spec, content, className, anchor, offset) {
        const move = offset || data.offsets.none;
        return add("text", {
          x: sx(spec.x + move.x / scale.x),
          y: sy(spec.y + move.y / scale.y),
          class: className,
          "text-anchor": anchor || "start",
          "dominant-baseline": "middle"
        }, content);
      }

      function arrow(from, to, kind) {
        add("line", {
          x1: sx(from.x), y1: sy(from.y),
          x2: sx(to.x), y2: sy(to.y),
          class: "trajectory " + kind + "-stroke"
        });
        const points = [
          [to.x, to.y],
          [to.x - data.arrow.length, to.y - data.arrow.halfHeight],
          [to.x - data.arrow.length, to.y + data.arrow.halfHeight]
        ].map(point => sx(point.shift()) + "," + sy(point.pop())).join(" ");
        add("polygon", { points, class: kind + "-head" });
      }

      rect({ x: data.zero, y: data.zero, w: data.canvas.w, h: data.canvas.h, r: data.zero }, "canvas-bg");
      label(data.layout.eyebrow, "ТРИ ШАГА ОДНОЙ ТРАЕКТОРИИ", "muted eyebrow", "start");

      add("line", {
        x1: sx(data.layout.legendRule.x), y1: sy(data.layout.legendRule.y1),
        x2: sx(data.layout.legendRule.x), y2: sy(data.layout.legendRule.y2),
        class: "section-rule"
      });

      data.steps.forEach(step => {
        const state = data.states.find(item => item.id === step.from);
        const action = data.actions.find(item => item.id === step.action);
        const next = data.states.find(item => item.id === step.to);
        const actionHalf = data.action.w / data.math.half;

        arrow(
          { x: state.x + data.stateRadius, y: state.y },
          { x: action.x - actionHalf, y: action.y },
          "policy"
        );
        arrow(
          { x: action.x + actionHalf, y: action.y },
          { x: next.x - data.stateRadius, y: next.y },
          "environment"
        );

        const policyBox = {
          x: action.x - data.pill.policyW / data.math.half,
          y: data.layout.policyPillY,
          w: data.pill.policyW,
          h: data.pill.policyH,
          r: data.pill.radius
        };
        rect(policyBox, "policy-pill");
        label(
          { x: action.x, y: data.layout.policyPillY + data.pill.policyH / data.math.half },
          step.policy, "policy-text factor", "middle", data.offsets.policyTitle
        );

        const envCenter = (action.x + next.x) / data.math.half;
        const envBox = {
          x: envCenter - data.pill.environmentW / data.math.half,
          y: data.layout.environmentPillY,
          w: data.pill.environmentW,
          h: data.pill.environmentH,
          r: data.pill.radius
        };
        rect(envBox, "environment-pill");
        label(
          { x: envCenter, y: data.layout.environmentPillY + data.pill.environmentH / data.math.half - data.offsets.environmentNote.y / data.math.half },
          step.environment, "environment-text factor", "middle", data.offsets.environmentTitle
        );
        label(
          { x: envCenter, y: data.layout.environmentPillY + data.pill.environmentH / data.math.half - data.offsets.environmentNote.y / data.math.half },
          "переход среды · без θ", "environment-text factor-note", "middle", data.offsets.environmentNote
        );
      });

      data.states.forEach(state => {
        add("circle", {
          cx: sx(state.x), cy: sy(state.y),
          r: sx(data.stateRadius) - sx(data.zero),
          class: "state-node"
        });
        label(state, state.id, "state-text node-label", "middle");
        if (state.caption) {
          label(
            { x: state.x, y: data.layout.captionY },
            state.caption, "muted factor-note", "middle"
          );
        }
      });

      data.actions.forEach(action => {
        rect({
          x: action.x - data.action.w / data.math.half,
          y: action.y - data.action.h / data.math.half,
          w: data.action.w,
          h: data.action.h,
          r: data.action.radius
        }, "action-node");
        label(action, action.id, "action-text node-label", "middle");
      });

      add("line", {
        x1: sx(data.layout.legendPolicy.x1), y1: sy(data.layout.legendPolicy.y),
        x2: sx(data.layout.legendPolicy.x2), y2: sy(data.layout.legendPolicy.y),
        class: "legend-line policy-stroke"
      });
      label(data.layout.legendPolicyTitle, "решение политики", "policy-text legend-title", "start");
      label(data.layout.legendPolicyCopy, "зависит от θ", "policy-text legend-copy", "start");

      add("line", {
        x1: sx(data.layout.legendEnvironment.x1), y1: sy(data.layout.legendEnvironment.y),
        x2: sx(data.layout.legendEnvironment.x2), y2: sy(data.layout.legendEnvironment.y),
        class: "legend-line environment-stroke"
      });
      label(data.layout.legendEnvironmentTitle, "реакция среды", "environment-text legend-title", "start");
      label(data.layout.legendEnvironmentCopy, "не зависит от θ", "environment-text legend-copy", "start");

      add("line", {
        x1: sx(data.layout.eyebrow.x), y1: sy(data.layout.ruleY),
        x2: sx(data.canvas.w - data.layout.eyebrow.x), y2: sy(data.layout.ruleY),
        class: "section-rule"
      });

      label(data.layout.formulaHeading, "ОДНО ПРОИЗВЕДЕНИЕ, ДВА ИСТОЧНИКА СЛУЧАЙНОСТИ", "muted eyebrow", "start");
      label(data.layout.formulaPrefix, "P(τ; θ) =", "text formula-prefix", "start");

      rect(data.layout.environmentBox, "formula-environment");
      label(data.layout.environmentCaption, "не зависит от θ", "environment-text formula-label", "middle");
      label(
        data.layout.environmentFormula,
        "ρ(s₀) · p(s₁|s₀,a₀) · p(s₂|s₁,a₁) · p(s₃|s₂,a₂)",
        "environment-text formula-main", "middle"
      );

      label(data.layout.multiply, "×", "muted formula-prefix", "middle");

      rect(data.layout.policyBox, "formula-policy");
      label(data.layout.policyCaption, "зависит от θ", "policy-text formula-label", "middle");
      label(
        data.layout.policyFormula,
        "πθ(a₀|s₀) · πθ(a₁|s₁) · πθ(a₂|s₂)",
        "policy-text formula-main", "middle"
      );

      rect(data.layout.example, "example-card");
      label(data.layout.exampleLabel, "ЧИСЛОВОЙ ПРИМЕР ИЗ ТЕКСТА · ДВА ШАГА", "muted example-label", "start");
      label(data.layout.exampleValue, "1 · 0,8 · 0,5 · 0,6 · 0,9 = 0,216", "text example-value", "start");
      label(
        data.layout.exampleCopyTop,
        "Если 0,8 → 0,4, траектория вдвое менее вероятна.",
        "text example-copy", "start"
      );
      label(
        data.layout.exampleCopyBottom,
        "Переходы 0,5 и 0,9 при этом не меняются.",
        "environment-text example-copy", "start"
      );
    } catch (error) {
      document.getElementById("diagram").style.display = "none";
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
