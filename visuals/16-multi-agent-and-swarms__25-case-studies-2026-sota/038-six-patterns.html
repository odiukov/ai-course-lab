<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шесть общих паттернов в трёх независимых кейсах</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f5f2eb;
    --panel: #fffdf8;
    --stripe: #eeeae1;
    --label: #ddd7cb;
    --header: #e7e1d6;
    --ink: #202832;
    --muted: #5d6772;
    --grid: #b8b1a5;
    --anthropic: #c45e43;
    --metagpt: #356d9d;
    --openclaw: #7159a6;
    --error: #8b2d22;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #171a1f;
      --panel: #22262d;
      --stripe: #292e36;
      --label: #323841;
      --header: #2b3038;
      --ink: #f2eee6;
      --muted: #b7bec8;
      --grid: #505762;
      --anthropic: #ef8b70;
      --metagpt: #75add8;
      --openclaw: #ad98df;
      --error: #ffaaa0;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    max-width: 1180px;
    margin: auto;
  }

  h1 {
    font-size: 20px;
    text-align: center;
    color: var(--ink);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--page);
    shape-rendering: geometricPrecision;
  }

  .cell-a { fill: var(--panel); }
  .cell-b { fill: var(--stripe); }
  .row-label { fill: var(--label); }
  .header { fill: var(--header); }
  .outline,
  .grid-line {
    fill: none;
    stroke: var(--grid);
    stroke-width: 1.2;
    vector-effect: non-scaling-stroke;
  }

  .column-name {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .pattern-name {
    fill: var(--ink);
    font-size: 13px;
    font-weight: bold;
  }

  .pattern-question {
    fill: var(--muted);
    font-size: 11px;
  }

  .answer {
    fill: var(--ink);
    font-size: 12.5px;
    font-weight: bold;
  }

  .anthropic-fill { fill: var(--anthropic); }
  .metagpt-fill { fill: var(--metagpt); }
  .openclaw-fill { fill: var(--openclaw); }

  #fallback {
    color: var(--error);
    font-size: 16px;
    padding: 12px;
    background: var(--panel);
    border: 1.2px solid var(--grid);
  }
</style>
</head>
<body>
<main>
  <h1 id="diagram-heading">Шесть общих паттернов в трёх независимых кейсах</h1>

  <svg id="diagram"
       viewBox="0 0 1180 440"
       width="1180"
       height="440"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-heading diagram-description">
    <desc id="diagram-description">
      Матрица из шести инженерных вопросов и трёх независимых кейсов:
      Anthropic Research, MetaGPT и OpenClaw.
    </desc>
  </svg>

  <p id="fallback" hidden>
    Схема должна была показать матрицу: три независимых кейса сопоставлены по
    оркестрации, контрактам передачи, проверке, топологии и субстрату,
    стоимости и безопасности.
  </p>
</main>

<script>
const data = {
  frame: { x: 0, y: 0, w: 124, h: 92 },
  header: { x: 0, y: 0, w: 124, h: 14 },
  labelColumn: { x: 0, w: 34 },
  columns: [
    {
      name: "Anthropic Research",
      x: 34,
      center: 49,
      w: 30,
      accent: "anthropic-fill"
    },
    {
      name: "MetaGPT",
      x: 64,
      center: 79,
      w: 30,
      accent: "metagpt-fill"
    },
    {
      name: "OpenClaw",
      x: 94,
      center: 109,
      w: 30,
      accent: "openclaw-fill"
    }
  ],
  rows: [
    {
      y: 14,
      h: 13,
      tone: "cell-a",
      pattern: "Оркестрация",
      question: "Кто управляет работой?",
      answers: [
        ["Явный", "supervisor"],
        ["PM в роли", "supervisor"],
        ["Платформа", "и сетевые эффекты"]
      ]
    },
    {
      y: 27,
      h: 13,
      tone: "cell-b",
      pattern: "Handoff-контракты",
      question: "В каком формате результат?",
      answers: [
        ["Описание задачи", "для субагента"],
        ["PRD и документы", "по архитектуре"],
        ["A2A-артефакт"]
      ]
    },
    {
      y: 40,
      h: 13,
      tone: "cell-a",
      pattern: "Проверка",
      question: "Кто проверяет независимо?",
      answers: [
        ["Отдельный", "проверяющий"],
        ["QA Engineer"],
        ["Сетевые", "валидаторы"]
      ]
    },
    {
      y: 53,
      h: 13,
      tone: "cell-b",
      pattern: "Топология и субстрат",
      question: "Что выдерживает масштаб?",
      answers: [
        ["Радужные", "развёртывания"],
        ["DAG", "в MacNet"],
        ["Платформа", "популяционного", "масштаба"]
      ]
    },
    {
      y: 66,
      h: 13,
      tone: "cell-a",
      pattern: "Стоимость",
      question: "Где учтена реальная цена?",
      answers: [
        ["15× токенов"],
        ["Бюджет", "на роль"],
        ["Цена взаимодействия", "в Moltbook"]
      ]
    },
    {
      y: 79,
      h: 13,
      tone: "cell-b",
      pattern: "Безопасность",
      question: "Какие угрозы признаны?",
      answers: [
        ["Песочницы"],
        ["Ограничения", "ролей"],
        ["Prompt-injection —", "поверхность атаки"]
      ]
    }
  ],
  gridX: [0, 34, 64, 94, 124],
  gridY: [0, 14, 27, 40, 53, 66, 79, 92],
  layout: {
    headerTextY: 8.8,
    headerBarY: 0,
    headerBarH: 1.2,
    labelTextX: 2.1,
    patternTextY: 4.8,
    questionTextY: 9.1,
    cellBarX: 1.1,
    cellBarY: 2,
    cellBarW: 0.65,
    cellBarH: 9,
    answerTextX: 3.1,
    answerTextY: 4.4,
    answerGap: 3.25
  }
};

const origin = { x: 20, y: 10 };
const scale = { x: 9.15, y: 4.5 };

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  const node = (name, attributes) => {
    const item = document.createElementNS(namespace, name);
    for (const key in attributes) {
      item.setAttribute(key, attributes[key]);
    }
    return item;
  };

  const rectangle = (parent, x, y, w, h, className) => {
    const item = node("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x + w) - sx(x),
      height: sy(y + h) - sy(y),
      class: className
    });
    parent.appendChild(item);
    return item;
  };

  const segment = (parent, x1, y1, x2, y2, className) => {
    const item = node("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    });
    parent.appendChild(item);
    return item;
  };

  const textBlock = (parent, x, y, lines, className, anchor, gap) => {
    const item = node("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    });

    let first = true;
    for (const line of lines) {
      const spanAttributes = { x: sx(x) };
      if (!first) {
        spanAttributes.dy = sy(gap) - sy(0);
      }
      const span = node("tspan", spanAttributes);
      span.textContent = line;
      item.appendChild(span);
      first = false;
    }

    parent.appendChild(item);
    return item;
  };

  const fills = node("g", { "aria-hidden": "true" });
  const labels = node("g", {});
  const rules = node("g", { "aria-hidden": "true" });

  svg.appendChild(fills);
  svg.appendChild(labels);
  svg.appendChild(rules);

  rectangle(
    fills,
    data.header.x,
    data.header.y,
    data.header.w,
    data.header.h,
    "header"
  );

  for (const row of data.rows) {
    rectangle(
      fills,
      data.labelColumn.x,
      row.y,
      data.labelColumn.w,
      row.h,
      "row-label"
    );

    for (const column of data.columns) {
      rectangle(
        fills,
        column.x,
        row.y,
        column.w,
        row.h,
        row.tone
      );

      rectangle(
        fills,
        column.x + data.layout.cellBarX,
        row.y + data.layout.cellBarY,
        data.layout.cellBarW,
        data.layout.cellBarH,
        column.accent
      );
    }
  }

  for (const column of data.columns) {
    rectangle(
      fills,
      column.x,
      data.layout.headerBarY,
      column.w,
      data.layout.headerBarH,
      column.accent
    );

    textBlock(
      labels,
      column.center,
      data.layout.headerTextY,
      [column.name],
      "column-name",
      "middle",
      data.layout.answerGap
    );
  }

  for (const row of data.rows) {
    textBlock(
      labels,
      data.layout.labelTextX,
      row.y + data.layout.patternTextY,
      [row.pattern],
      "pattern-name",
      "start",
      data.layout.answerGap
    );

    textBlock(
      labels,
      data.layout.labelTextX,
      row.y + data.layout.questionTextY,
      [row.question],
      "pattern-question",
      "start",
      data.layout.answerGap
    );

    for (const column of data.columns) {
      const answer = row.answers.shift();

      textBlock(
        labels,
        column.x + data.layout.answerTextX,
        row.y + data.layout.answerTextY,
        answer,
        "answer",
        "start",
        data.layout.answerGap
      );
    }
  }

  for (const x of data.gridX) {
    segment(
      rules,
      x,
      data.frame.y,
      x,
      data.frame.y + data.frame.h,
      "grid-line"
    );
  }

  for (const y of data.gridY) {
    segment(
      rules,
      data.frame.x,
      y,
      data.frame.x + data.frame.w,
      y,
      "grid-line"
    );
  }

  rectangle(
    rules,
    data.frame.x,
    data.frame.y,
    data.frame.w,
    data.frame.h,
    "outline"
  );
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  svg.setAttribute("hidden", "");
  fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
