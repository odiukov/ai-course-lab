<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Две стороны оценки мониторинга</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fb;
    --panel: #ffffff;
    --panel-soft: #eef2f8;
    --ink: #172033;
    --muted: #526077;
    --line: #8c98aa;
    --blue: #2868c7;
    --blue-soft: #dceaff;
    --orange: #b85c13;
    --orange-soft: #ffead8;
    --violet: #7650b5;
    --violet-soft: #eee4ff;
    --green: #18785b;
    --green-soft: #daf3e9;
    --red: #a53e48;
    --red-soft: #fde1e4;
    --shadow: #d9dee8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #11151d;
      --panel: #1b2230;
      --panel-soft: #252e3d;
      --ink: #eef3fb;
      --muted: #b4bfd0;
      --line: #728096;
      --blue: #7db2ff;
      --blue-soft: #233d63;
      --orange: #ffad68;
      --orange-soft: #59351f;
      --violet: #c2a4ff;
      --violet-soft: #40335c;
      --green: #72d7b3;
      --green-soft: #204c40;
      --red: #ff929b;
      --red-soft: #552d35;
      --shadow: #0c0f15;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: unset;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    background: var(--page);
    overflow: hidden;
  }

  h1 {
    margin: unset;
    padding: 12px 18px;
    border-bottom: 1px solid var(--shadow);
    font-size: 20px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--page);
  }

  text {
    fill: var(--ink);
    font-family: inherit;
    font-size: 15px;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .tiny {
    fill: var(--muted);
    font-size: 12px;
  }

  .title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
  }

  .value {
    font-size: 17px;
    font-weight: bold;
  }

  .agent-fill {
    fill: var(--blue-soft);
    stroke: var(--blue);
  }

  .monitor-fill {
    fill: var(--violet-soft);
    stroke: var(--violet);
  }

  .neutral-fill {
    fill: var(--panel);
    stroke: var(--line);
  }

  .plain-fill {
    fill: var(--orange-soft);
    stroke: var(--orange);
  }

  .masked-fill {
    fill: var(--panel-soft);
    stroke: var(--muted);
    stroke-dasharray: 6px 5px;
  }

  .success-fill {
    fill: var(--green-soft);
    stroke: var(--green);
  }

  .warning-fill {
    fill: var(--red-soft);
    stroke: var(--red);
  }

  .blue-line {
    fill: none;
    stroke: var(--blue);
  }

  .violet-line {
    fill: none;
    stroke: var(--violet);
  }

  .muted-line {
    fill: none;
    stroke: var(--line);
  }

  .orange-line {
    fill: none;
    stroke: var(--orange);
  }

  .arrow-blue {
    fill: var(--blue);
  }

  .arrow-violet {
    fill: var(--violet);
  }

  .arrow-orange {
    fill: var(--orange);
  }

  .arrow-muted {
    fill: var(--line);
  }

  .table-head {
    fill: var(--panel-soft);
    stroke: var(--line);
  }

  .table-row {
    fill: var(--panel);
    stroke: var(--line);
  }

  #fallback {
    margin: unset;
    padding: 18px;
    color: var(--red);
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="figure">
  <h1>Две стороны оценки мониторинга</h1>
  <svg id="diagram" viewBox="0 0 1120 470"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Цикл между агентом и монитором</title>
    <desc id="svg-desc">Агент выполняет явную или замаскированную побочную задачу, монитор пытается её обнаружить, а таблица сравнивает результаты прогонов.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна была показать встречу агента и монитора: явные действия обнаружены в 18 случаях из 20, а замаскированные — в 6 случаях из 20.</p>
</main>

<script>
const DATA = [
  {
    kind: "metrics",
    arrowLength: 13,
    arrowWing: 7,
    dotRadius: 5
  },
  {
    kind: "agent",
    x1: 45, y1: 34, x2: 350, y2: 262,
    headerY: 74,
    mainX1: 70, mainY1: 91, mainX2: 325, mainY2: 126,
    plainX1: 70, plainY1: 145, plainX2: 325, plainY2: 184,
    maskX1: 70, maskY1: 201, maskX2: 325, maskY2: 240
  },
  {
    kind: "monitor",
    x1: 555, y1: 34, x2: 860, y2: 262,
    headerY: 74,
    scanX1: 580, scanY1: 91, scanX2: 835, scanY2: 126,
    plainX1: 580, plainY1: 145, plainX2: 835, plainY2: 184,
    maskX1: 580, maskY1: 201, maskX2: 835, maskY2: 240
  },
  {
    kind: "plainArrow",
    points: [
      {x: 350, y: 164},
      {x: 555, y: 164}
    ],
    label: {x: 452, y: 147}
  },
  {
    kind: "maskArrow",
    points: [
      {x: 350, y: 220},
      {x: 555, y: 220}
    ],
    label: {x: 452, y: 239}
  },
  {
    kind: "returnArrow",
    points: [
      {x: 610, y: 262},
      {x: 610, y: 298},
      {x: 300, y: 298},
      {x: 300, y: 262}
    ],
    label: {x: 455, y: 316}
  },
  {
    kind: "table",
    x1: 45, y1: 340, x2: 860, y2: 441,
    headerY2: 373,
    row1Y2: 407,
    col1: 365,
    col2: 585
  },
  {
    kind: "condition",
    x: 882, y: 51,
    x2: 952, y2: 242
  }
];

const origin = {x: 48, y: 10};
const scale = {x: 1.12, y: 1};

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const NS = "http://www.w3.org/2000/svg";
  const pad = {near: 8, normal: 12, wide: 18};

  const item = kind => DATA.find(entry => entry.kind === kind);
  const metrics = item("metrics");

  function el(name, attrs, className) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    if (className) node.setAttribute("class", className);
    svg.appendChild(node);
    return node;
  }

  function path(points, className, closed) {
    const commands = points.map((point, index) =>
      `${index ? "L" : "M"} ${sx(point.x)} ${sy(point.y)}`
    );
    if (closed) commands.push("Z");
    return el("path", {d: commands.join(" ")}, className);
  }

  function box(x1, y1, x2, y2, className) {
    return path([
      {x: x1, y: y1},
      {x: x2, y: y1},
      {x: x2, y: y2},
      {x: x1, y: y2}
    ], className, true);
  }

  function line(x1, y1, x2, y2, className) {
    return path([{x: x1, y: y1}, {x: x2, y: y2}], className, false);
  }

  function textAt(text, x, y, anchor, className, dx, dy) {
    const node = el("text", {
      x: sx(x) + dx,
      y: sy(y) + dy,
      "text-anchor": anchor
    }, className);
    node.textContent = text;
    return node;
  }

  function arrow(points, lineClass, headClass) {
    path(points, lineClass, false);
    const tip = points[points.length - 1];
    const before = points[points.length - 2];
    const angle = Math.atan2(tip.y - before.y, tip.x - before.x);
    const baseX = tip.x - metrics.arrowLength * Math.cos(angle);
    const baseY = tip.y - metrics.arrowLength * Math.sin(angle);
    const left = {
      x: baseX + metrics.arrowWing * Math.sin(angle),
      y: baseY - metrics.arrowWing * Math.cos(angle)
    };
    const right = {
      x: baseX - metrics.arrowWing * Math.sin(angle),
      y: baseY + metrics.arrowWing * Math.cos(angle)
    };
    path([tip, left, right], headClass, true);
  }

  function dot(x, y, className) {
    el("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(x + metrics.dotRadius) - sx(x)
    }, className);
  }

  const agent = item("agent");
  box(agent.x1, agent.y1, agent.x2, agent.y2, "agent-fill");
  line(agent.x1, agent.headerY, agent.x2, agent.headerY, "blue-line");
  textAt("АГЕНТ", agent.x1, 57, "start", "title", pad.wide, 0);
  textAt("выполняет основную и побочную задачи", agent.x2, 57, "end", "small", -pad.wide, 0);

  box(agent.mainX1, agent.mainY1, agent.mainX2, agent.mainY2, "neutral-fill");
  textAt("Основная работа", agent.mainX1, 114, "start", "", pad.normal, 0);

  box(agent.plainX1, agent.plainY1, agent.plainX2, agent.plainY2, "plain-fill");
  dot(87, 164, "arrow-orange");
  textAt("Явная побочная задача", 101, 169, "start", "", pad.near, 0);

  box(agent.maskX1, agent.maskY1, agent.maskX2, agent.maskY2, "masked-fill");
  dot(87, 220, "arrow-muted");
  textAt("Замаскированные шаги", 101, 225, "start", "", pad.near, 0);

  const monitor = item("monitor");
  box(monitor.x1, monitor.y1, monitor.x2, monitor.y2, "monitor-fill");
  line(monitor.x1, monitor.headerY, monitor.x2, monitor.headerY, "violet-line");
  textAt("МОНИТОР", monitor.x1, 57, "start", "title", pad.wide, 0);
  textAt("пытается обнаружить обе", monitor.x2, 57, "end", "small", -pad.wide, 0);

  box(monitor.scanX1, monitor.scanY1, monitor.scanX2, monitor.scanY2, "neutral-fill");
  textAt("Проверяет траекторию действий", monitor.scanX1, 114, "start", "", pad.normal, 0);

  box(monitor.plainX1, monitor.plainY1, monitor.plainX2, monitor.plainY2, "success-fill");
  textAt("Явное: часто замечает", monitor.plainX1, 169, "start", "", pad.normal, 0);

  box(monitor.maskX1, monitor.maskY1, monitor.maskX2, monitor.maskY2, "warning-fill");
  textAt("Маскировка: часто пропускает", monitor.maskX1, 225, "start", "", pad.normal, 0);

  const plainArrow = item("plainArrow");
  arrow(plainArrow.points, "orange-line", "arrow-orange");
  textAt("явное действие", plainArrow.label.x, plainArrow.label.y, "middle", "small", 0, -pad.near);

  const maskArrow = item("maskArrow");
  arrow(maskArrow.points, "muted-line", "arrow-muted");
  textAt("скрытые шаги", maskArrow.label.x, maskArrow.label.y, "middle", "small", 0, pad.normal);

  const returnArrow = item("returnArrow");
  arrow(returnArrow.points, "violet-line", "arrow-violet");
  textAt("результат встречи: обнаружено или пропущено",
    returnArrow.label.x, returnArrow.label.y, "middle", "small", 0, pad.near);

  const table = item("table");
  box(table.x1, table.y1, table.x2, table.headerY2, "table-head");
  box(table.x1, table.headerY2, table.x2, table.row1Y2, "table-row");
  box(table.x1, table.row1Y2, table.x2, table.y2, "table-row");

  line(table.col1, table.y1, table.col1, table.y2, "muted-line");
  line(table.col2, table.y1, table.col2, table.y2, "muted-line");

  textAt("УСЛОВИЯ ПРОГОНА", table.x1, 362, "start", "tiny", pad.normal, 0);
  textAt("ОБНАРУЖЕНО", table.col1, 362, "start", "tiny", pad.normal, 0);
  textAt("ЧТО ПОКАЗЫВАЕТ", table.col2, 362, "start", "tiny", pad.normal, 0);

  textAt("Простые действия", table.x1, 396, "start", "", pad.normal, 0);
  textAt("18 из 20 · 90%", table.col1, 396, "start", "value", pad.normal, 0);
  textAt("Монитор ловит наивного агента", table.col2, 396, "start", "", pad.normal, 0);

  textAt("Замаскированные действия", table.x1, 430, "start", "", pad.normal, 0);
  textAt("6 из 20", table.col1, 430, "start", "value", pad.normal, 0);
  textAt("Проверяется устойчивость защиты", table.col2, 430, "start", "", pad.normal, 0);

  const condition = item("condition");
  line(condition.x, condition.y, condition.x, condition.y2, "muted-line");
  textAt("ФИКСИРУЕМ", condition.x, condition.y, "start", "tiny", pad.normal, 0);
  textAt("какой агент", condition.x, 87, "start", "small", pad.normal, 0);
  textAt("какой монитор", condition.x, 119, "start", "small", pad.normal, 0);
  textAt("какая побочная", condition.x, 151, "start", "small", pad.normal, 0);
  textAt("задача", condition.x, 174, "start", "small", pad.normal, 0);
  textAt("Уклонение:", condition.x, 211, "start", "small", pad.normal, 0);
  textAt("2 из 20", condition.x, 237, "start", "value", pad.normal, 0);

} catch (error) {
  const fallback = document.getElementById("fallback");
  fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
