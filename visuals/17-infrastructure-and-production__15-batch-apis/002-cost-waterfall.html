<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как ночной счёт уменьшается с $2000 до $180</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --panel-soft: #f0f3f8;
      --ink: #172033;
      --muted: #59657a;
      --line: #aeb8c8;
      --initial: #68758c;
      --batch: #5b5bd6;
      --batch-soft: #e8e8ff;
      --cache: #13866f;
      --cache-soft: #daf4ec;
      --saving: #dbe1ea;
      --final: #13866f;
      --shadow: rgba(23, 32, 51, 0.09);
      --error: #a22d38;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    figure {
      width: min(1040px, 100%);
      margin: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 28px var(--shadow);
    }

    figcaption {
      padding: 18px 22px 8px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: bold;
      letter-spacing: -0.02em;
    }

    .intro {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .stage {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .stage.batch-stage {
      fill: var(--batch-soft);
      stroke: var(--batch);
    }

    .stage.cache-stage {
      fill: var(--cache-soft);
      stroke: var(--cache);
    }

    .step-line {
      fill: none;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .batch-line {
      stroke: var(--batch);
    }

    .cache-line {
      stroke: var(--cache);
    }

    .batch-head {
      fill: var(--batch);
    }

    .cache-head {
      fill: var(--cache);
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .amount {
      fill: var(--ink);
      font-size: 38px;
      font-weight: bold;
    }

    .stage-note {
      fill: var(--muted);
      font-size: 15px;
    }

    .lever-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .lever-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .discount {
      font-size: 22px;
      font-weight: bold;
    }

    .batch-text {
      fill: var(--batch);
    }

    .cache-text {
      fill: var(--cache);
    }

    .divider {
      stroke: var(--line);
      stroke-width: 1px;
    }

    .check-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .check-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .track {
      fill: var(--saving);
    }

    .remaining {
      fill: var(--final);
    }

    .track-outline {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
    }

    .bar-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .bar-label-light {
      fill: #ffffff;
      font-size: 14px;
      font-weight: bold;
    }

    .brace {
      fill: none;
      stroke: var(--initial);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .summary {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--error);
      font-size: 17px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --panel-soft: #202837;
        --ink: #f1f4fa;
        --muted: #aab5c7;
        --line: #445168;
        --initial: #9aa7ba;
        --batch: #9999ff;
        --batch-soft: #29294a;
        --cache: #4fd3b1;
        --cache-soft: #173b35;
        --saving: #374256;
        --final: #39b99a;
        --shadow: rgba(0, 0, 0, 0.28);
        --error: #ff8c97;
      }
    }

    @media (max-width: 680px) {
      body {
        padding: 8px;
      }

      figcaption {
        padding: 14px 16px 6px;
      }

      h1 {
        font-size: 20px;
      }

      .intro {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-intro">
    <figcaption>
      <h1 id="diagram-title">Как ночной счёт уменьшается с $2000 до $180</h1>
      <p class="intro" id="diagram-intro">
        Два последовательных рычага экономии: сначала batch, затем кэш общего префикса.
      </p>
    </figcaption>
    <svg
      id="diagram"
      viewBox="0 0 1040 390"
      width="1040"
      height="390"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="$2000 без кэша уменьшаются до $1000 после скидки batch 50%, а затем до $180 после кэширования общего системного промпта. Итог — 9% исходного счёта."
    ></svg>
  </figure>

  <script>
    const data = [{
      zero: 0,
      originX: 0,
      originY: 0,
      scaleX: 1,
      scaleY: 1,

      leftX: 32,
      cardY: 30,
      cardW: 242,
      cardH: 134,
      cardGap: 125,
      middleX: 399,
      rightX: 766,

      cardInsetX: 24,
      eyebrowY: 58,
      amountY: 105,
      noteY: 139,

      arrowY: 97,
      arrowHead: 11,
      arrowTailGap: 24,
      arrowLabelY: 49,
      arrowDetailY: 72,
      discountY: 137,

      dividerX1: 32,
      dividerX2: 1008,
      dividerY: 194,

      checkTitleX: 32,
      checkTitleY: 225,
      checkNoteX: 32,
      checkNoteY: 248,

      trackX: 32,
      trackY: 275,
      trackW: 976,
      trackH: 42,
      finalW: 88,
      labelInset: 14,
      trackLabelY: 301,

      braceY: 336,
      braceDrop: 10,
      braceTextY: 365,
      summaryX: 1008,
      summaryY: 365,

      fallbackX: 40,
      fallbackY: 92,
      fallbackLineY: 122,

      radius: 14,
      smallRadius: 8,
      batchPercent: "50%",
      initialAmount: "$2000",
      batchAmount: "$1000",
      finalAmount: "$180",
      finalPercent: "9%",
      savedPercent: "91%"
    }];

    const [D] = data;
    const origin = Object.freeze({ x: D.originX, y: D.originY });
    const scale = Object.freeze({ x: D.scaleX, y: D.scaleY });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const NS = "http://www.w3.org/2000/svg";

    try {
      const make = (name, attrs, content) => {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (content !== undefined) node.textContent = content;
        return node;
      };

      const add = node => {
        svg.appendChild(node);
        return node;
      };

      const rect = (x, y, w, h, className, radius) => add(make("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + w) - sx(x),
        height: sy(y + h) - sy(y),
        rx: sx(radius) - sx(D.zero),
        ry: sy(radius) - sy(D.zero),
        class: className
      }));

      const line = (x1, y1, x2, y2, className) => add(make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));

      const text = (x, y, value, className, anchor) => add(make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, value));

      const arrow = (x1, x2, y, lineClass, headClass) => {
        const tipX = x2;
        const baseX = x2 - D.arrowHead;
        line(x1, y, baseX, y, `step-line ${lineClass}`);
        add(make("polygon", {
          points: [
            `${sx(tipX)},${sy(y)}`,
            `${sx(baseX)},${sy(y - D.arrowHead)}`,
            `${sx(baseX)},${sy(y + D.arrowHead)}`
          ].join(" "),
          class: headClass
        }));
      };

      const stage = (x, className, eyebrow, amount, note) => {
        rect(x, D.cardY, D.cardW, D.cardH, `stage ${className}`, D.radius);
        text(
          x + D.cardInsetX,
          D.eyebrowY,
          eyebrow,
          "eyebrow",
          "start"
        );
        text(
          x + D.cardInsetX,
          D.amountY,
          amount,
          "amount",
          "start"
        );
        text(
          x + D.cardInsetX,
          D.noteY,
          note,
          "stage-note",
          "start"
        );
      };

      stage(
        D.leftX,
        "",
        "ИСХОДНЫЙ СЧЁТ",
        D.initialAmount,
        "синхронно · без кэша"
      );

      stage(
        D.middleX,
        "batch-stage",
        "ПОСЛЕ BATCH",
        D.batchAmount,
        "ночное выполнение"
      );

      stage(
        D.rightX,
        "cache-stage",
        "ПОСЛЕ КЭША",
        D.finalAmount,
        "общий префикс сохранён"
      );

      const firstArrowStart = D.leftX + D.cardW + D.arrowTailGap;
      const firstArrowEnd = D.middleX - D.arrowTailGap;
      const firstArrowMiddle = (firstArrowStart + firstArrowEnd) / (D.scaleX + D.scaleX);

      arrow(
        firstArrowStart,
        firstArrowEnd,
        D.arrowY,
        "batch-line",
        "batch-head"
      );
      text(
        firstArrowMiddle,
        D.arrowLabelY,
        "Batch",
        "lever-title",
        "middle"
      );
      text(
        firstArrowMiddle,
        D.arrowDetailY,
        "результат к сроку",
        "lever-note",
        "middle"
      );
      text(
        firstArrowMiddle,
        D.discountY,
        `−${D.batchPercent}`,
        "discount batch-text",
        "middle"
      );

      const secondArrowStart = D.middleX + D.cardW + D.arrowTailGap;
      const secondArrowEnd = D.rightX - D.arrowTailGap;
      const secondArrowMiddle = (secondArrowStart + secondArrowEnd) / (D.scaleX + D.scaleX);

      arrow(
        secondArrowStart,
        secondArrowEnd,
        D.arrowY,
        "cache-line",
        "cache-head"
      );
      text(
        secondArrowMiddle,
        D.arrowLabelY,
        "Кэш префикса",
        "lever-title",
        "middle"
      );
      text(
        secondArrowMiddle,
        D.arrowDetailY,
        "не оплачивать заново",
        "lever-note",
        "middle"
      );
      text(
        secondArrowMiddle,
        D.discountY,
        "ещё −$820",
        "discount cache-text",
        "middle"
      );

      line(
        D.dividerX1,
        D.dividerY,
        D.dividerX2,
        D.dividerY,
        "divider"
      );

      text(
        D.checkTitleX,
        D.checkTitleY,
        "Проверка относительно исходного счёта",
        "check-title",
        "start"
      );
      text(
        D.checkNoteX,
        D.checkNoteY,
        "$180 — это 9% от $2000",
        "check-note",
        "start"
      );

      rect(
        D.trackX,
        D.trackY,
        D.trackW,
        D.trackH,
        "track",
        D.smallRadius
      );

      rect(
        D.trackX + D.trackW - D.finalW,
        D.trackY,
        D.finalW,
        D.trackH,
        "remaining",
        D.smallRadius
      );

      add(make("rect", {
        x: sx(D.trackX),
        y: sy(D.trackY),
        width: sx(D.trackX + D.trackW) - sx(D.trackX),
        height: sy(D.trackY + D.trackH) - sy(D.trackY),
        rx: sx(D.smallRadius) - sx(D.zero),
        ry: sy(D.smallRadius) - sy(D.zero),
        class: "track-outline"
      }));

      text(
        D.trackX + D.labelInset,
        D.trackLabelY,
        `сокращение расходов ≈ ${D.savedPercent}`,
        "bar-label",
        "start"
      );

      text(
        D.trackX + D.trackW - D.finalW / (D.scaleX + D.scaleX),
        D.trackLabelY,
        D.finalPercent,
        "bar-label-light",
        "middle"
      );

      const braceRight = D.trackX + D.trackW;
      const braceLeft = D.trackX;
      const braceMiddle = (braceLeft + braceRight) / (D.scaleX + D.scaleX);

      add(make("path", {
        d: [
          `M ${sx(braceLeft)} ${sy(D.braceY)}`,
          `L ${sx(braceLeft)} ${sy(D.braceY + D.braceDrop)}`,
          `L ${sx(braceMiddle)} ${sy(D.braceY + D.braceDrop)}`,
          `L ${sx(braceRight)} ${sy(D.braceY + D.braceDrop)}`,
          `L ${sx(braceRight)} ${sy(D.braceY)}`
        ].join(" "),
        class: "brace"
      }));

      text(
        D.trackX,
        D.braceTextY,
        "два рычага применены последовательно",
        "summary",
        "start"
      );

      text(
        D.summaryX,
        D.summaryY,
        "$2000 → $1000 → $180",
        "summary",
        "end"
      );
    } catch (error) {
      svg.replaceChildren();
      const fallback = document.createElementNS(NS, "text");
      fallback.setAttribute("x", String(sx(D.fallbackX)));
      fallback.setAttribute("y", String(sy(D.fallbackY)));
      fallback.setAttribute("class", "fallback");
      fallback.textContent = "Схема должна показать каскад стоимости:";
      svg.appendChild(fallback);

      const fallbackLine = document.createElementNS(NS, "text");
      fallbackLine.setAttribute("x", String(sx(D.fallbackX)));
      fallbackLine.setAttribute("y", String(sy(D.fallbackLineY)));
      fallbackLine.setAttribute("class", "fallback");
      fallbackLine.textContent = "$2000 → batch 50% → $1000 → кэш общего префикса → $180.";
      svg.appendChild(fallbackLine);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
