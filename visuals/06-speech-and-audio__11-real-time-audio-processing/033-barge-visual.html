<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Таймлайн перебивания</title>
<style>
  :root{
    --bg:#fbfbfd; --ink:#1b2130; --dim:#5d6577; --grid:#c3c9d6;
    --bot:#2b5fb0; --botsoft:#8fb0e0; --user:#a85a1e; --cut:#c02f3c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --ink:#e7ebf3; --dim:#9aa3b6; --grid:#3a4152;
      --bot:#7fa8ec; --botsoft:#3f5b86; --user:#e0a065; --cut:#f0707c;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--ink);padding:10px 12px 6px;
    font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2{margin:0 0 4px;font-size:14px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{color:var(--dim);font-size:12px;margin:6px 2px}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
</style>
<div class="wrap">
  <h2>Перебивание на оси времени: где рождаются лишние полслова</h2>
  <svg id="s" viewBox="0 86 700 214" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Две дорожки времени: бот говорит, пользователь начинает поверх, cancel на 60 мс, хвост TTS обрезан на 100 мс"></svg>
  <div id="fb"></div>
</div>
<script>
(function(){
  var svg=document.getElementById('s');
  try{
    /* ---- данные схемы (единственные литеральные числа) ---- */
    var D={
      tMax:170,
      ticks:[0,20,60,100],
      guides:[0,20,60],
      row:{axis:0,userLo:0.50,userHi:1.05,botLo:1.75,botHi:2.40},
      bot:{start:-30,cancel:60,flush:100,ghostEnd:120},
      user:{start:0,end:168},
      hatchStep:4,
      head:{len:5,half:0.16}
    };
    var origin={x:130,y:232}, scale={x:3.05,y:46};
    /* ---- единственный перевод координат ---- */
    function sx(t){return origin.x+t*scale.x;}
    function sy(r){return origin.y-r*scale.y;}

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function add(n,a){var e=el(n,a);svg.appendChild(e);return e;}
    function line(t1,r1,t2,r2,a){a=a||{};a.x1=sx(t1);a.y1=sy(r1);a.x2=sx(t2);a.y2=sy(r2);return add('line',a);}
    function box(t1,t2,rLo,rHi,a){a=a||{};a.x=sx(t1);a.y=sy(rHi);a.width=sx(t2)-sx(t1);a.height=sy(rLo)-sy(rHi);return add('rect',a);}
    function txt(t,r,s,anchor,dx,dy,a){
      a=a||{};a.x=sx(t)+dx;a.y=sy(r)+dy;a['text-anchor']=anchor;
      var e=add('text',a);e.textContent=s;return e;}
    function arrow(t1,r,t2,a){
      line(t1,r,t2-D.head.len*0.5,r,a);
      add('polygon',{points:[sx(t2),sy(r),sx(t2-D.head.len),sy(r+D.head.half),
                             sx(t2-D.head.len),sy(r-D.head.half)].join(' '),
                     fill:a.stroke});
    }
    function hatch(t1,t2,op){
      for(var t=t1;t<=t2;t+=D.hatchStep)
        line(t,D.row.botLo,t,D.row.botHi,{stroke:'var(--bot)','stroke-width':1.4,opacity:op});
    }

    /* ---- ось времени ---- */
    arrow(0,D.row.axis,D.tMax,{stroke:'var(--grid)','stroke-width':1.4});
    D.ticks.forEach(function(t){
      line(t,D.row.axis,t,D.row.axis+D.head.half,{stroke:'var(--grid)','stroke-width':1.4});
      txt(t,D.row.axis,String(t),'middle',0,15,{'font-size':11.5,fill:'var(--dim)'});
    });
    txt(D.tMax,D.row.axis,'время, мс','end',0,15,{'font-size':11.5,fill:'var(--dim)'});
    D.guides.forEach(function(t){
      line(t,D.row.axis,t,D.row.botHi,{stroke:'var(--grid)','stroke-width':1,'stroke-dasharray':'3 4'});
    });

    /* ---- дорожка бота ---- */
    box(D.bot.start,D.bot.cancel,D.row.botLo,D.row.botHi,{fill:'var(--bot)',opacity:0.9});
    txt((D.bot.start+D.bot.cancel)/2,(D.row.botLo+D.row.botHi)/2,'бот говорит','middle',0,4,
        {'font-size':11.5,fill:'var(--bg)','font-weight':600});
    hatch(D.bot.cancel,D.bot.flush,0.55);
    box(D.bot.cancel,D.bot.flush,D.row.botLo,D.row.botHi,{fill:'none',stroke:'var(--bot)','stroke-width':1.2});
    hatch(D.bot.flush,D.bot.ghostEnd,0.16);
    box(D.bot.flush,D.bot.ghostEnd,D.row.botLo,D.row.botHi,
        {fill:'none',stroke:'var(--bot)','stroke-width':1,'stroke-dasharray':'3 4',opacity:0.5});

    /* ---- дорожка пользователя ---- */
    box(D.user.start,D.user.end,D.row.userLo,D.row.userHi,{fill:'var(--user)',opacity:0.85});
    txt((D.user.start+D.user.end)/2,(D.row.userLo+D.row.userHi)/2,'ты говоришь поверх','middle',0,4,
        {'font-size':11.5,fill:'var(--bg)','font-weight':600});
    txt(20,D.row.userLo,'кадр собран','start',4,-8,{'font-size':11,fill:'var(--dim)'});
    txt(60,D.row.userLo,'флаг VAD','start',4,-8,{'font-size':11,fill:'var(--user)'});

    /* ---- cancel и сброс очереди ---- */
    txt(D.bot.cancel,D.row.botHi+D.head.half*3.6,'cancel() на 60 мс: отмена TTS и LLM','end',-5,0,
        {'font-size':11.5,fill:'var(--ink)'});
    arrow(D.bot.cancel,D.row.botHi+D.head.half*1.4,D.bot.flush,{stroke:'var(--bot)','stroke-width':1.3});
    txt((D.bot.cancel+D.bot.flush)/2,D.row.botHi+D.head.half*1.4,'уже в очереди: 40-60 мс','middle',0,-7,
        {'font-size':11,fill:'var(--bot)'});
    line(D.bot.flush,D.row.botLo,D.bot.flush,D.row.botHi,{stroke:'var(--cut)','stroke-width':2.6});
    txt(D.bot.flush,D.row.botHi+D.head.half*3.6,'100 мс — предел терпения','start',6,0,
        {'font-size':11.5,fill:'var(--cut)'});
    txt(D.bot.flush,D.row.botLo,'хвост обрезан сбросом','start',6,-7,{'font-size':11,fill:'var(--cut)'});

    /* ---- легенда ---- */
    txt(0,D.row.axis,'0 — голос коснулся микрофона · 20 мс — кадр собран · 60 мс — два-три речевых кадра подряд, флаг «человек говорит»',
        'start',-origin.x+8,39,{'font-size':11,fill:'var(--dim)'});
    txt(0,D.row.axis,'60 мс — cancel() гасит задачи TTS и LLM (микросекунды) · 100 мс — очередь аудио сброшена отдельной командой',
        'start',-origin.x+8,57,{'font-size':11,fill:'var(--dim)'});
  }catch(e){
    svg.remove();
    document.getElementById('fb').className='fb';
    document.getElementById('fb').textContent=
      'Схема не построилась. Она показывает две дорожки одной оси времени: бот говорит, ты начинаешь поверх на 0, '+
      'кадр собран к 20 мс, флаг «человек говорит» к 60 мс, там же cancel() отменяет TTS и LLM — но 40-60 мс уже '+
      'отрендеренного аудио продолжают играть, пока на 100 мс очередь не сброшена; хвост TTS обрезан ровно на этой метке.';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
