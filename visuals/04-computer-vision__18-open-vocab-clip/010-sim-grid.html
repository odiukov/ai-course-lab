<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Матрица похожести батча</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --grid: #cbd3df;
      --axis: #344054;
      --negative: #edf0f5;
      --negative-mark: #98a2b3;
      --positive: #18794e;
      --positive-soft: #d7f5e5;
      --positive-text: #ffffff;
      --accent: #2459a9;
      --accent-soft: #e3edff;
      --note-border: #a9bad5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182130;
        --text: #f2f4f7;
        --muted: #aab4c3;
        --grid: #536071;
        --axis: #d5dbe5;
        --negative: #283343;
        --negative-mark: #748195;
        --positive: #42b883;
        --positive-soft: #173e31;
        --positive-text: #071b13;
        --accent: #8db8ff;
        --accent-soft: #203858;
        --note-border: #526b91;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--panel);
    }

    .diagram-title {
      margin: 0;
      padding: 10px 18px 5px;
      font-size: 18px;
      line-height: 1.25;
      font-weight: 750;
      letter-spacing: -0.01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 482px;
      background: var(--panel);
    }

    .cell {
      stroke: var(--grid);
      stroke-width: 1.25;
      vector-effect: non-scaling-stroke;
    }

    .cell-negative {
      fill: var(--negative);
    }

    .cell-positive {
      fill: var(--positive);
      stroke: var(--positive);
    }

    .outer-frame,
    .guide,
    .leader,
    .sample {
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .outer-frame {
      stroke: var(--axis);
      stroke-width: 2;
    }

    .guide {
      stroke: var(--positive);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 5 5;
    }

    .leader {
      stroke: var(--note-border);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .sample {
      stroke: var(--axis);
      stroke-width: 1.5;
    }

    .axis-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: 700;
    }

    .item-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 650;
    }

    .cell-mark-negative {
      fill: var(--negative-mark);
      font-size: 15px;
      font-weight: 650;
    }

    .cell-mark-positive {
      fill: var(--positive-text);
      font-size: 17px;
      font-weight: 800;
    }

    .legend-heading {
      fill: var(--text);
      font-size: 17px;
      font-weight: 780;
    }

    .legend-main {
      fill: var(--text);
      font-size: 16px;
      font-weight: 720;
    }

    .legend-detail {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .reading-band {
      fill: var(--accent-soft);
      stroke: var(--note-border);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .reading-title {
      fill: var(--accent);
      font-size: 14px;
      font-weight: 760;
    }

    .reading-text {
      fill: var(--text);
      font-size: 14px;
      font-weight: 520;
    }

    .fallback {
      margin: 8px 18px 18px;
      padding: 14px;
      border: 1.5px solid var(--note-border);
      color: var(--text);
      background: var(--accent-soft);
      font-size: 15px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="diagram" aria-labelledby="diagram-title">
    <h1 class="diagram-title" id="diagram-title">Матрица похожести батча</h1>
    <svg
      id="matrix"
      viewBox="0 0 960 460"
      width="960"
      height="460"
      role="img"
      aria-labelledby="svg-title svg-desc"
      preserveAspectRatio="xMidYMid meet"
    >
      <title id="svg-title">Тепловая карта восемь на восемь</title>
      <desc id="svg-desc">
        Восемь позитивных пар картинка–подпись выделены на диагонали,
        остальные пятьдесят шесть клеток показаны как негативные пары.
      </desc>
      <g id="drawing"></g>
    </svg>
    <noscript>
      <p class="fallback">
        Схема должна показать матрицу похожести 8×8: 8 позитивных пар
        на диагонали и 56 негативных пар вне диагонали.
      </p>
    </noscript>
  </main>

  <script>
    const schemeData = [
      ["И₁", "П₁"],
      ["И₂", "П₂"],
      ["И₃", "П₃"],
      ["И₄", "П₄"],
      ["И₅", "П₅"],
      ["И₆", "П₆"],
      ["И₇", "П₇"],
      ["И₈", "П₈"]
    ];

    const canvas = { width: 960, height: 460 };
    const origin = { x: 178, y: 42 };
    const scale = { x: 34, y: 34 };

    const [
      gridX,
      gridY,
      legendX,
      legendTop,
      legendGap,
      legendSample,
      headingY,
      columnLabelY,
      rowTextX,
      bandX,
      bandY,
      bandWidth,
      bandHeight,
      bandSplit,
      bandTitleX,
      bandTextX,
      diagonalLeadX,
      diagonalLeadY
    ] = [
      2,
      2,
      12.5,
      3,
      3.2,
      0.7,
      0.55,
      1.55,
      1.65,
      -4.55,
      11.35,
      26.3,
      1.75,
      13.1,
      -4.1,
      2.6,
      11.1,
      6.1
    ];

    const LABEL_PAD = 8;
    const SVG_NS = "http://www.w3.org/2000/svg";
    const ZERO = schemeData.length - schemeData.length;
    const ONE = schemeData.length / schemeData.length;
    const NEG_ONE = ZERO - ONE;
    const TWO = ONE + ONE;
    const HALF = ONE / TWO;
    const QUARTER = HALF * HALF;
    const EIGHTH = QUARTER * HALF;

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y + y * scale.y;
    }

    try {
      const drawing = document.getElementById("drawing");
      const n = schemeData.length;
      const negativeCount = n * n - n;

      function make(tag, attrs, textValue) {
        const node = document.createElementNS(SVG_NS, tag);

        Object.entries(attrs || {}).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });

        if (textValue !== undefined) {
          node.textContent = textValue;
        }

        return node;
      }

      function add(tag, attrs, textValue, parent) {
        const node = make(tag, attrs, textValue);
        (parent || drawing).appendChild(node);
        return node;
      }

      function centeredText(className, x, y, value) {
        return add("text", {
          class: className,
          x: sx(x),
          y: sy(y),
          "text-anchor": "middle",
          "dominant-baseline": "middle"
        }, value);
      }

      function leftText(className, x, y, value, dy) {
        return add("text", {
          class: className,
          x: sx(x),
          y: sy(y),
          dx: LABEL_PAD,
          dy: dy === undefined ? ZERO : dy,
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, value);
      }

      function roundedRect(className, x, y, width, height) {
        return add("rect", {
          class: className,
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(EIGHTH) - sx(ZERO),
          ry: sy(EIGHTH) - sy(ZERO)
        });
      }

      centeredText(
        "axis-label",
        gridX + n / TWO,
        headingY,
        `${n} подписей`
      );

      add("text", {
        class: "axis-label",
        x: sx(gridX - HALF),
        y: sy(gridY + n / TWO),
        dx: NEG_ONE * LABEL_PAD,
        "text-anchor": "end",
        "dominant-baseline": "middle",
        transform:
          `rotate(${ZERO - sx(QUARTER) + sx(ZERO)} ` +
          `${sx(gridX - HALF)} ${sy(gridY + n / TWO)})`
      }, `${n} картинок`);

      for (let column = ZERO; column < n; column += ONE) {
        centeredText(
          "item-label",
          gridX + column + HALF,
          columnLabelY,
          schemeData[column][ONE]
        );
      }

      for (let row = ZERO; row < n; row += ONE) {
        add("text", {
          class: "item-label",
          x: sx(rowTextX),
          y: sy(gridY + row + HALF),
          dx: NEG_ONE * LABEL_PAD,
          "text-anchor": "end",
          "dominant-baseline": "middle"
        }, schemeData[row][ZERO]);

        for (let column = ZERO; column < n; column += ONE) {
          const isPositive = row === column;
          const cellX = gridX + column;
          const cellY = gridY + row;

          add("rect", {
            class: `cell ${isPositive ? "cell-positive" : "cell-negative"}`,
            x: sx(cellX),
            y: sy(cellY),
            width: sx(cellX + ONE) - sx(cellX),
            height: sy(cellY + ONE) - sy(cellY)
          });

          centeredText(
            isPositive ? "cell-mark-positive" : "cell-mark-negative",
            cellX + HALF,
            cellY + HALF,
            isPositive ? "✓" : "·"
          );
        }
      }

      add("rect", {
        class: "outer-frame",
        x: sx(gridX),
        y: sy(gridY),
        width: sx(gridX + n) - sx(gridX),
        height: sy(gridY + n) - sy(gridY)
      });

      add("line", {
        class: "guide",
        x1: sx(gridX + HALF),
        y1: sy(gridY + HALF),
        x2: sx(gridX + n - HALF),
        y2: sy(gridY + n - HALF)
      });

      add("line", {
        class: "leader",
        x1: sx(gridX + n - HALF),
        y1: sy(gridY + n - HALF),
        x2: sx(diagonalLeadX),
        y2: sy(diagonalLeadY)
      });

      leftText(
        "legend-heading",
        legendX,
        legendTop - ONE,
        "Все пары батча"
      );

      roundedRect(
        "cell-positive",
        legendX,
        legendTop,
        legendSample,
        legendSample
      );

      leftText(
        "legend-main",
        legendX + legendSample,
        legendTop + QUARTER,
        `${n} позитивов`
      );

      leftText(
        "legend-detail",
        legendX + legendSample,
        legendTop + legendSample,
        "совпадающие пары на диагонали"
      );

      roundedRect(
        "cell-negative sample",
        legendX,
        legendTop + legendGap,
        legendSample,
        legendSample
      );

      centeredText(
        "cell-mark-negative",
        legendX + legendSample / TWO,
        legendTop + legendGap + legendSample / TWO,
        "·"
      );

      leftText(
        "legend-main",
        legendX + legendSample,
        legendTop + legendGap + QUARTER,
        `${negativeCount} негативных пар`
      );

      leftText(
        "legend-detail",
        legendX + legendSample,
        legendTop + legendGap + legendSample,
        "несовпадающие варианты вне диагонали"
      );

      leftText(
        "legend-detail",
        diagonalLeadX,
        diagonalLeadY,
        "диагональ — правильные соответствия"
      );

      roundedRect(
        "reading-band",
        bandX,
        bandY,
        bandWidth,
        bandHeight
      );

      leftText(
        "reading-title",
        bandTitleX,
        bandY + HALF,
        "По строке"
      );

      leftText(
        "reading-text",
        bandTitleX,
        bandY + ONE + QUARTER,
        "какая подпись лучше подходит картинке?"
      );

      add("line", {
        class: "leader",
        x1: sx(bandSplit),
        y1: sy(bandY + QUARTER),
        x2: sx(bandSplit),
        y2: sy(bandY + bandHeight - QUARTER)
      });

      leftText(
        "reading-title",
        bandTextX,
        bandY + HALF,
        "По столбцу"
      );

      leftText(
        "reading-text",
        bandTextX,
        bandY + ONE + QUARTER,
        "какая картинка лучше соответствует подписи?"
      );

      if (canvas.width <= ZERO || canvas.height <= ZERO) {
        throw new Error("Некорректный размер холста");
      }
    } catch (error) {
      const svg = document.getElementById("matrix");
      svg.hidden = true;

      const fallback = document.createElement("p");
      fallback.className = "fallback";
      fallback.textContent =
        "Схема должна показать матрицу похожести 8×8: " +
        "8 позитивных пар на диагонали и 56 негативных пар вне диагонали.";
      document.querySelector(".diagram").appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
