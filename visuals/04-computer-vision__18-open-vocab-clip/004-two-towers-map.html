<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маршрут картинки и текста в общее пространство</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --border: #cbd5e1;
      --guide: #94a3b8;
      --image-fill: #e8f1ff;
      --image-stroke: #3974c6;
      --image-pill: #d5e7ff;
      --text-fill: #fff3d9;
      --text-stroke: #c88416;
      --text-pill: #ffe8b3;
      --space-fill: #f4efff;
      --space-stroke: #8065bf;
      --result-fill: #e6f7ed;
      --result-stroke: #278453;
      --note-fill: #eef2f7;
      --dog: #c77b42;
      --dog-light: #f1c39c;
      --dog-dark: #533522;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .diagram-shell {
      max-width: 1280px;
      margin: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1.5px solid var(--border);
    }

    h1 {
      margin: unset;
      padding: 14px 18px;
      font-size: 20px;
      font-weight: 700;
      background: var(--panel);
      border-bottom: 1.5px solid var(--border);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--panel);
    }

    .card,
    .encoder,
    .embedding,
    .result,
    .pill,
    .photo {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .card {
      fill: var(--panel);
      stroke: var(--border);
    }

    .image-encoder {
      fill: var(--image-fill);
      stroke: var(--image-stroke);
    }

    .text-encoder {
      fill: var(--text-fill);
      stroke: var(--text-stroke);
    }

    .image-pill {
      fill: var(--image-pill);
      stroke: var(--image-stroke);
    }

    .text-pill {
      fill: var(--text-pill);
      stroke: var(--text-stroke);
    }

    .space {
      fill: var(--space-fill);
      stroke: var(--space-stroke);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .embedding {
      fill: var(--panel);
      stroke: var(--space-stroke);
    }

    .result {
      fill: var(--result-fill);
      stroke: var(--result-stroke);
      stroke-width: 3px;
    }

    .route-image,
    .route-text,
    .mini-link,
    .guide {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .route-image {
      stroke: var(--image-stroke);
      stroke-width: 3px;
    }

    .route-text {
      stroke: var(--text-stroke);
      stroke-width: 3px;
    }

    .mini-link {
      stroke: var(--muted);
      stroke-width: 2px;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1.5px;
    }

    text {
      fill: var(--ink);
      dominant-baseline: middle;
    }

    .section-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: middle;
      fill: var(--muted);
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      text-anchor: middle;
    }

    .subtitle {
      font-size: 13px;
      text-anchor: middle;
      fill: var(--muted);
    }

    .pill-label {
      font-size: 12px;
      font-weight: 600;
      text-anchor: middle;
    }

    .input-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-anchor: start;
      fill: var(--muted);
    }

    .input-copy {
      font-size: 14px;
      font-weight: 600;
      text-anchor: start;
    }

    .dimension {
      font-size: 17px;
      font-weight: 700;
      text-anchor: middle;
      fill: var(--space-stroke);
    }

    .formula {
      font-size: 20px;
      font-weight: 700;
      text-anchor: middle;
      fill: var(--result-stroke);
    }

    .note {
      font-size: 13px;
      font-weight: 600;
      text-anchor: middle;
      fill: var(--muted);
    }

    .fallback {
      padding: 18px;
      font-size: 14px;
      color: var(--ink);
      background: var(--panel);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1320;
        --panel: #151d2c;
        --ink: #edf2f7;
        --muted: #aeb9ca;
        --border: #40506a;
        --guide: #718096;
        --image-fill: #172d4b;
        --image-stroke: #78aef4;
        --image-pill: #21426e;
        --text-fill: #3c2d15;
        --text-stroke: #edb654;
        --text-pill: #55401d;
        --space-fill: #2b2341;
        --space-stroke: #b9a1f2;
        --result-fill: #173929;
        --result-stroke: #65c992;
        --note-fill: #202b3b;
        --dog: #d78d52;
        --dog-light: #f1c39c;
        --dog-dark: #3b261b;
      }
    }
  </style>
</head>
<body>
  <main class="diagram-shell" id="diagramWrap">
    <h1>Маршрут картинки и текста в общее пространство</h1>
    <svg id="diagram" viewBox="0 0 1280 420" width="1280" height="420"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svgTitle svgDesc">
      <title id="svgTitle">Две параллельные башни CLIP</title>
      <desc id="svgDesc">Изображение проходит через ViT-L/14, подпись — через текстовый Transformer. Нормированные векторы длины 768 сходятся в узле косинусного сходства.</desc>
      <g id="scene"></g>
    </svg>
  </main>

  <script>
    const data = {
      zero: 0,
      corner: 12,
      smallCorner: 8,
      arrow: { tip: 12, half: 7 },
      dash: { long: 8, gap: 8 },
      space: { x: 690, y: 38, w: 300, h: 350, labelX: 840, labelY: 54 },
      separator: {
        leftA: 260, leftB: 350, rightA: 530, rightB: 600,
        y: 210, labelX: 440, labelY: 210
      },
      similarity: {
        x: 1085, y: 135, w: 165, h: 150,
        titleX: 1167, titleY1: 162, titleY2: 180,
        formulaY: 215, copyY1: 246, copyY2: 264,
        topPortY: 180, bottomPortY: 240
      },
      note: { x: 640, y: 404 },
      dog: {
        photoX: 53, photoY: 88, photoR: 30,
        faceX: 79, faceY: 120, faceR: 22,
        leftEar: [{ x: 61, y: 105 }, { x: 65, y: 80 }, { x: 79, y: 103 }],
        rightEar: [{ x: 80, y: 103 }, { x: 94, y: 80 }, { x: 98, y: 106 }],
        leftEyeX: 72, rightEyeX: 86, eyeY: 116, eyeR: 3,
        muzzleX: 79, muzzleY: 128, muzzleR: 9,
        noseX: 79, noseY: 125, noseR: 3
      },
      routes: [
        {
          kind: "image",
          routeClass: "route-image",
          encoderClass: "encoder image-encoder",
          pillClass: "pill image-pill",
          input: { x: 30, y: 70, w: 190, h: 100, cy: 120 },
          inputTitle: "ИЗОБРАЖЕНИЕ",
          inputLine1: "Фотография",
          inputLine2: "корги",
          inputTextX: 118,
          inputTitleY: 94,
          inputLine1Y: 120,
          inputLine2Y: 142,
          encoder: { x: 260, y: 60, w: 340, h: 120, cy: 120 },
          encoderTitle: "ВИЗУАЛЬНАЯ БАШНЯ",
          encoderSubtitle: "image encoder · ViT-L/14",
          titleY: 82,
          subtitleY: 103,
          pillY: 132,
          pillH: 30,
          pills: [
            { x: 278, w: 92, label: "патчи" },
            { x: 382, w: 92, label: "ViT-L/14" },
            { x: 486, w: 96, label: "проекция" }
          ],
          miniLinks: [
            { x1: 370, x2: 382 },
            { x1: 474, x2: 486 }
          ],
          embedding: { x: 718, y: 68, w: 250, h: 104, cy: 120 },
          embeddingTitle: "Вектор изображения",
          embeddingY1: 92,
          embeddingY2: 117,
          embeddingY3: 146,
          firstArrow: { x1: 220, x2: 260, y: 120 },
          secondArrow: { x1: 600, x2: 718, y: 120 },
          elbow: { x1: 968, y1: 120, kneeX: 1028, y2: 180, x2: 1085 }
        },
        {
          kind: "text",
          routeClass: "route-text",
          encoderClass: "encoder text-encoder",
          pillClass: "pill text-pill",
          input: { x: 30, y: 250, w: 190, h: 100, cy: 300 },
          inputTitle: "ПОДПИСЬ",
          inputLine1: "«собака",
          inputLine2: "на траве»",
          inputTextX: 118,
          inputTitleY: 274,
          inputLine1Y: 300,
          inputLine2Y: 322,
          quoteX: 78,
          quoteY: 302,
          encoder: { x: 260, y: 240, w: 340, h: 120, cy: 300 },
          encoderTitle: "ТЕКСТОВАЯ БАШНЯ",
          encoderSubtitle: "text encoder · Transformer",
          titleY: 262,
          subtitleY: 283,
          pillY: 312,
          pillH: 30,
          pills: [
            { x: 278, w: 92, label: "токены" },
            { x: 382, w: 92, label: "Transformer" },
            { x: 486, w: 96, label: "проекция" }
          ],
          miniLinks: [
            { x1: 370, x2: 382 },
            { x1: 474, x2: 486 }
          ],
          embedding: { x: 718, y: 248, w: 250, h: 104, cy: 300 },
          embeddingTitle: "Вектор подписи",
          embeddingY1: 272,
          embeddingY2: 297,
          embeddingY3: 326,
          firstArrow: { x1: 220, x2: 260, y: 300 },
          secondArrow: { x1: 600, x2: 718, y: 300 },
          elbow: { x1: 968, y1: 300, kneeX: 1028, y2: 240, x2: 1085 }
        }
      ]
    };
    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const scene = document.getElementById("scene");
      const ns = "http://www.w3.org/2000/svg";

      function add(tag, attrs, parent = scene) {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
        parent.appendChild(node);
        return node;
      }

      function rect(box, className, radius = data.corner) {
        return add("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.w) - sx(box.x),
          height: sy(box.y + box.h) - sy(box.y),
          rx: sx(box.x + radius) - sx(box.x),
          class: className
        });
      }

      function circle(cx, cy, r, className) {
        return add("circle", {
          cx: sx(cx),
          cy: sy(cy),
          r: sx(cx + r) - sx(cx),
          class: className
        });
      }

      function polygon(points, className) {
        return add("polygon", {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        });
      }

      function label(x, y, value, className, anchor) {
        const node = add("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        });
        node.textContent = value;
        return node;
      }

      function arrowHead(x, y, className) {
        polygon([
          { x: x, y: y },
          { x: x - data.arrow.tip, y: y - data.arrow.half },
          { x: x - data.arrow.tip, y: y + data.arrow.half }
        ], className);
      }

      function horizontalArrow(spec, className) {
        add("line", {
          x1: sx(spec.x1),
          y1: sy(spec.y),
          x2: sx(spec.x2),
          y2: sy(spec.y),
          class: className
        });
        arrowHead(spec.x2, spec.y, className);
      }

      function elbowArrow(spec, className) {
        add("path", {
          d: `M ${sx(spec.x1)} ${sy(spec.y1)} H ${sx(spec.kneeX)} V ${sy(spec.y2)} H ${sx(spec.x2)}`,
          class: className
        });
        arrowHead(spec.x2, spec.y2, className);
      }

      rect(data.space, "space");
      label(
        data.space.labelX,
        data.space.labelY,
        "ОБЩЕЕ СМЫСЛОВОЕ ПРОСТРАНСТВО",
        "section-label",
        "middle"
      );

      add("line", {
        x1: sx(data.separator.leftA),
        y1: sy(data.separator.y),
        x2: sx(data.separator.leftB),
        y2: sy(data.separator.y),
        class: "guide",
        "stroke-dasharray": `${sx(data.dash.long) - sx(data.zero)} ${sx(data.dash.gap) - sx(data.zero)}`
      });
      add("line", {
        x1: sx(data.separator.rightA),
        y1: sy(data.separator.y),
        x2: sx(data.separator.rightB),
        y2: sy(data.separator.y),
        class: "guide",
        "stroke-dasharray": `${sx(data.dash.long) - sx(data.zero)} ${sx(data.dash.gap) - sx(data.zero)}`
      });
      label(
        data.separator.labelX,
        data.separator.labelY,
        "маршруты независимы",
        "subtitle",
        "middle"
      );

      data.routes.forEach(route => {
        horizontalArrow(route.firstArrow, route.routeClass);
        horizontalArrow(route.secondArrow, route.routeClass);
        elbowArrow(route.elbow, route.routeClass);
      });

      data.routes.forEach(route => {
        rect(route.input, "card");
        rect(route.encoder, route.encoderClass);
        rect(route.embedding, "embedding");

        label(
          route.inputTextX,
          route.inputTitleY,
          route.inputTitle,
          "input-title",
          "start"
        );
        label(
          route.inputTextX,
          route.inputLine1Y,
          route.inputLine1,
          "input-copy",
          "start"
        );
        label(
          route.inputTextX,
          route.inputLine2Y,
          route.inputLine2,
          "input-copy",
          "start"
        );

        label(
          route.encoder.x + route.encoder.w - route.encoder.w + route.encoder.w / scale.x / scale.x,
          route.titleY,
          route.encoderTitle,
          "title",
          "middle"
        ).setAttribute("x", sx(route.encoder.x + route.encoder.w / (scale.x + scale.x)));

        label(
          route.encoder.x + route.encoder.w / (scale.x + scale.x),
          route.subtitleY,
          route.encoderSubtitle,
          "subtitle",
          "middle"
        );

        route.miniLinks.forEach(link => {
          add("line", {
            x1: sx(link.x1),
            y1: sy(route.pillY + route.pillH / (scale.y + scale.y)),
            x2: sx(link.x2),
            y2: sy(route.pillY + route.pillH / (scale.y + scale.y)),
            class: "mini-link"
          });
        });

        route.pills.forEach(pill => {
          rect(
            { x: pill.x, y: route.pillY, w: pill.w, h: route.pillH },
            route.pillClass,
            data.smallCorner
          );
          label(
            pill.x + pill.w / (scale.x + scale.x),
            route.pillY + route.pillH / (scale.y + scale.y),
            pill.label,
            "pill-label",
            "middle"
          );
        });

        label(
          route.embedding.x + route.embedding.w / (scale.x + scale.x),
          route.embeddingY1,
          route.embeddingTitle,
          "title",
          "middle"
        );
        label(
          route.embedding.x + route.embedding.w / (scale.x + scale.x),
          route.embeddingY2,
          "нормированный вектор",
          "subtitle",
          "middle"
        );
        label(
          route.embedding.x + route.embedding.w / (scale.x + scale.x),
          route.embeddingY3,
          "длина 768",
          "dimension",
          "middle"
        );

        if (route.kind === "image") {
          circle(data.dog.photoX + data.dog.photoR, data.dog.photoY + data.dog.photoR, data.dog.photoR, "photo");
          polygon(data.dog.leftEar, "dog");
          polygon(data.dog.rightEar, "dog");
          circle(data.dog.faceX, data.dog.faceY, data.dog.faceR, "dog");
          circle(data.dog.leftEyeX, data.dog.eyeY, data.dog.eyeR, "dog-eye");
          circle(data.dog.rightEyeX, data.dog.eyeY, data.dog.eyeR, "dog-eye");
          circle(data.dog.muzzleX, data.dog.muzzleY, data.dog.muzzleR, "dog-muzzle");
          circle(data.dog.noseX, data.dog.noseY, data.dog.noseR, "dog-eye");
        } else {
          label(data.routes.find(item => item.kind === "text").quoteX, route.quoteY, "«Аа»", "formula", "middle");
        }
      });

      rect(data.similarity, "result");
      label(data.similarity.titleX, data.similarity.titleY1, "КОСИНУСНОЕ", "section-label", "middle");
      label(data.similarity.titleX, data.similarity.titleY2, "СХОДСТВО", "section-label", "middle");
      label(data.similarity.titleX, data.similarity.formulaY, "cos(θ)", "formula", "middle");
      label(data.similarity.titleX, data.similarity.copyY1, "сравнение", "subtitle", "middle");
      label(data.similarity.titleX, data.similarity.copyY2, "по углу", "subtitle", "middle");

      label(
        data.note.x,
        data.note.y,
        "Картинка не превращается в предложение: обе башни выдают сопоставимые числа",
        "note",
        "middle"
      );

      const style = add("style", {}, svg);
      style.textContent = `
        .photo{fill:var(--image-pill);stroke:var(--image-stroke)}
        .dog{fill:var(--dog);stroke:var(--dog-dark);stroke-width:2px}
        .dog-eye{fill:var(--dog-dark);stroke:none}
        .dog-muzzle{fill:var(--dog-light);stroke:none}
      `;
    } catch (error) {
      const svg = document.getElementById("diagram");
      svg.hidden = true;
      const fallback = document.createElement("div");
      fallback.className = "fallback";
      fallback.textContent = "Схема должна была показать два независимых маршрута: изображение через ViT-L/14 и подпись через текстовый Transformer превращаются в нормированные векторы длины 768, а затем сходятся в косинусном сходстве.";
      document.getElementById("diagramWrap").appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
