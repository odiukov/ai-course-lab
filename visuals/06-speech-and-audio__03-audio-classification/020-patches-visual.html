<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Нарезка спектрограммы на патчи 16×16</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1a2430; --muted:#5d6b7a;
    --frame:#26313d; --grid:#c3ccd6; --fill:#eef3f8; --hi:#e8973f; --hi-line:#a9601c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12171d; --ink:#e8eef5; --muted:#9aa8b6;
      --frame:#d5dde6; --grid:#3c4855; --fill:#1c242d; --hi:#d9862c; --hi-line:#f0b169;
    }
  }
  html,body{margin:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--ink);padding:10px 12px 14px;
        font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  text{fill:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .muted{fill:var(--muted);}
  .sum{font-weight:700;}
  #fallback{display:none;color:var(--ink);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Нарезка log-mel 1024 × 128 на патчи 16 × 16</h2>
  <svg id="d" viewBox="0 0 1120 272" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Прямоугольник 1024 на 128, разрезанный сеткой 16 на 16: 64 столбца и 8 рядов, всего 512 токенов"></svg>
  <p id="fallback">Схема: прямоугольник log-mel 1024 × 128, разрезанный сеткой на патчи
  16 × 16 — 64 столбца по времени и 8 рядов по частоте, 64 × 8 = 512 токенов.</p>
</div>
<script>
(function(){
  var svg = document.getElementById("d");
  try{
    /* ---- данные схемы ---- */
    var D = { width:1024, height:128, patch:16 };
    var cols = D.width / D.patch;    /* 64 */
    var rows = D.height / D.patch;   /*  8 */

    /* ---- одна система координат ---- */
    var origin = { x:62, y:154 }, scale = 1;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var NS = "http://www.w3.org/2000/svg";
    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
    function line(x1,y1,x2,y2,cls,w){ return el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
      stroke:cls,"stroke-width":w}); }
    function label(x,y,dx,dy,t,anchor,size,cls){
      var e = el("text",{x:sx(x)+dx, y:sy(y)+dy, "text-anchor":anchor, "font-size":size});
      if(cls) e.setAttribute("class", cls);
      e.textContent = t; return e;
    }

    /* ---- поле спектрограммы ---- */
    el("rect",{ x:sx(0), y:sy(D.height), width:sx(D.width)-sx(0), height:sy(0)-sy(D.height),
                fill:"var(--fill)" });

    /* выделенный патч: верхний ряд, первый столбец */
    el("rect",{ x:sx(0), y:sy(D.height), width:sx(D.patch)-sx(0),
                height:sy(D.height-D.patch)-sy(D.height),
                fill:"var(--hi)", "fill-opacity":"0.55",
                stroke:"var(--hi-line)", "stroke-width":1.5 });

    /* сетка 16 × 16 */
    var i;
    for(i=1;i<cols;i++) line(i*D.patch,0,i*D.patch,D.height,"var(--grid)",0.7);
    for(i=1;i<rows;i++) line(0,i*D.patch,D.width,i*D.patch,"var(--grid)",0.7);

    /* рамка */
    el("rect",{ x:sx(0), y:sy(D.height), width:sx(D.width)-sx(0), height:sy(0)-sy(D.height),
                fill:"none", stroke:"var(--frame)", "stroke-width":1.6 });

    /* ---- ось времени под полем, наконечник справа ---- */
    var ay = -1.75 * D.patch;
    line(0, ay, D.width, ay, "var(--frame)", 1.2);
    el("polygon",{ points:[
        sx(D.width)+","+sy(ay),
        sx(D.width-0.8*D.patch)+","+sy(ay+0.35*D.patch),
        sx(D.width-0.8*D.patch)+","+sy(ay-0.35*D.patch)].join(" "),
      fill:"var(--frame)" });
    /* засечки оси — по границам столбцов, каждый 8-й */
    for(i=0;i<=cols;i+=8) line(i*D.patch, ay+0.3*D.patch, i*D.patch, ay-0.3*D.patch,"var(--frame)",1);

    /* ---- ось частоты слева, наконечник сверху ---- */
    var ax = -1.75 * D.patch;
    line(ax, 0, ax, D.height, "var(--frame)", 1.2);
    el("polygon",{ points:[
        sx(ax)+","+sy(D.height),
        sx(ax-0.35*D.patch)+","+sy(D.height-0.8*D.patch),
        sx(ax+0.35*D.patch)+","+sy(D.height-0.8*D.patch)].join(" "),
      fill:"var(--frame)" });
    for(i=0;i<=rows;i+=4) line(ax-0.3*D.patch, i*D.patch, ax+0.3*D.patch, i*D.patch,"var(--frame)",1);

    /* ---- подписи ---- */
    /* патч — над полем слева, у самого патча */
    label(0, D.height, 0, -8, "патч 16 × 16", "start", 13);

    /* ось времени — под серединой оси */
    label(D.width/2, ay, 0, 18, "время: 1024 кадра — 64 столбца", "middle", 13);

    /* ось частоты — сбоку от середины, повёрнута */
    var yl = label(ax, D.height/2, -10, 0, "128 mel — 8 рядов", "middle", 13);
    yl.setAttribute("transform", "rotate(-90 "+(sx(ax)-10)+" "+sy(D.height/2)+")");
    yl.setAttribute("dy", "4");

    /* итог — под осью, по центру */
    label(D.width/2, ay, 0, 44, cols+" × "+rows+" = 512 токенов", "middle", 17, "sum");
    label(D.width/2, ay, 0, 63, "патч 16 × 16 = 256 чисел, токен — вектор 768", "middle", 13, "muted");
    label(D.width/2, ay, 0, 80, "к каждому токену прибавляют позиционный эмбеддинг: его ряд и столбец", "middle", 12, "muted");
  }catch(e){
    svg.style.display = "none";
    document.getElementById("fallback").style.display = "block";
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
