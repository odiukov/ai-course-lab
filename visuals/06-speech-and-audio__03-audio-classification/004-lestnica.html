<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Лестница подходов</title>
<style>
  :root{
    --bg:#fbfbfd; --ink:#1b1f2a; --dim:#5b6376; --line:#8b93a7;
    --s1:#4b7bd6; --s2:#3f9e77; --s3:#c98a2e; --s4:#a05ac4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171f; --ink:#e8ecf5; --dim:#9aa3b8; --line:#5c6478;
      --s1:#7ea8f0; --s2:#5fc396; --s3:#e0aa52; --s4:#c288e0;
    }
  }
  html,body{margin:0;background:var(--bg)}
  .wrap{max-width:100%;background:var(--bg);color:var(--ink);
    font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2{margin:0 0 2px;padding:8px 10px 0;font-size:15px;font-weight:650}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{padding:8px 12px;color:var(--dim);font-size:13px}
</style>
<div class="wrap">
  <h2>Лестница подходов: снизу вверх, как серия замеров</h2>
  <svg id="d" viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Четыре ступени: k-NN на MFCC, CNN на log-mel, AST на патчах 16x16, BEATs"></svg>
  <div id="fb" class="fail" hidden>
    Схема: четыре ступени слева-вправо — k-NN на MFCC (1990s, вход MFCC-вектор),
    2D CNN на log-mel (2015-2019, вход log-mel), AST на патчах 16×16 (2021-2024),
    BEATs self-supervised (2024-2026). Каждая выше предыдущей.
  </div>
</div>
<script>
(function(){
try{
  // ---- данные ----
  var STEPS=[
    {x:0,y:0,label:"k-NN на MFCC",input:"вход: вектор MFCC",year:"1990s",c:"var(--s1)"},
    {x:1,y:1,label:"2D CNN на log-mel",input:"вход: log-mel (T×n_mels)",year:"2015-2019",c:"var(--s2)"},
    {x:2,y:2,label:"AST",input:"вход: патчи 16×16",year:"2021-2024",c:"var(--s3)"},
    {x:3,y:3,label:"BEATs, self-supervised",input:"вход: log-mel, предобучение",year:"2024-2026",c:"var(--s4)"}
  ];
  var TREAD=0.72, RISE=0.62;           // размеры ступени в единицах данных
  var ORIGIN={x:118,y:352}, SCALE={x:158,y:74};
  function sx(x){return ORIGIN.x+x*SCALE.x}
  function sy(y){return ORIGIN.y-y*SCALE.y}

  var NS="http://www.w3.org/2000/svg", svg=document.getElementById("d");
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}
  function txt(x,y,s,o){var t=el("text",{x:x,y:y,"text-anchor":o.a||"start",
    "font-size":o.fs||12,fill:o.f||"var(--ink)"});
    if(o.w)t.setAttribute("font-weight",o.w); t.textContent=s; svg.appendChild(t); return t}

  var d=el("defs",{});
  d.innerHTML='<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"'+
    ' markerHeight="7" orient="auto-start-reverse">'+
    '<path d="M0 0 L10 5 L0 10 z" fill="var(--line)"/></marker>';
  svg.appendChild(d);
  svg.appendChild(el("rect",{x:0,y:0,width:760,height:400,fill:"var(--bg)"}));

  // ---- ось: читаем снизу вверх (стрелка качества) ----
  svg.appendChild(el("line",{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(3.55),
    stroke:"var(--line)","stroke-width":1.2,"marker-end":"url(#ah)"}));
  var qh=el("text",{x:sx(0)-10,y:sy(1.9),"text-anchor":"middle","font-size":12,
    fill:"var(--dim)",transform:"rotate(-90 "+(sx(0)-10)+" "+sy(1.9)+")"});
  qh.textContent="качество и цена"; svg.appendChild(qh);
  svg.appendChild(el("line",{x1:sx(0),y1:sy(0),x2:sx(3.62),y2:sy(0),
    stroke:"var(--line)","stroke-width":1.2,"marker-end":"url(#ah)"}));
  txt(sx(3.6),sy(0)+22,"время",{a:"end",f:"var(--dim)"});

  // ---- ступени ----
  STEPS.forEach(function(s,i){
    var y0=s.y, y1=s.y+RISE, x0=s.x, x1=s.x+TREAD;
    // проступь + подступёнок
    svg.appendChild(el("path",{d:"M"+sx(x0)+" "+sy(y0)+" L"+sx(x0)+" "+sy(y1)+
      " L"+sx(x1)+" "+sy(y1)+" L"+sx(x1)+" "+sy(y0)+" z",
      fill:s.c,"fill-opacity":0.14,stroke:s.c,"stroke-width":1.6}));
    // засечка года на оси времени
    svg.appendChild(el("line",{x1:sx(x0),y1:sy(0),x2:sx(x0),y2:sy(-0.09),
      stroke:"var(--line)","stroke-width":1}));
    // подпись ступени — над проступью, по центру
    var cx=sx(x0+TREAD/2);
    txt(cx,sy(y1)-22,(i+1)+". "+s.label,{a:"middle",fs:12.5,w:650});
    txt(cx,sy(y1)-8,s.year,{a:"middle",fs:11,f:"var(--dim)"});
    // вход — под проступью, внутри блока
    txt(cx,sy(y0)-9,s.input,{a:"middle",fs:11,f:"var(--dim)"});
    // связь с предыдущей ступенью
    if(i>0){
      var p=STEPS[i-1];
      svg.appendChild(el("line",{x1:sx(p.x+TREAD),y1:sy(p.y+RISE),
        x2:sx(s.x),y2:sy(s.y+RISE),stroke:"var(--line)","stroke-width":1,
        "stroke-dasharray":"3 3"}));
    }
  });

  // ---- направление чтения: от нижней ступени вверх ----
  var ax0={x:0.30,y:RISE+0.30}, ax1={x:2.72,y:3+RISE+0.30};
  svg.appendChild(el("line",{x1:sx(ax0.x),y1:sy(ax0.y),x2:sx(ax1.x),y2:sy(ax1.y),
    stroke:"var(--line)","stroke-width":1.4,"stroke-dasharray":"6 4",
    "marker-end":"url(#ah)"}));
  txt(sx(ax0.x)+8,sy(ax0.y)-6,"читают снизу вверх: каждая ступень — замер",
    {a:"start",fs:11.5,f:"var(--dim)"});

  // ---- линейка у нижней ступени ----
  txt(sx(0.06),sy(-0.42),"нижняя ступень — линейка: без неё верхние цифры не с чем сопоставить",
    {a:"start",fs:11.5,f:"var(--dim)"});
}catch(e){
  document.getElementById("d").setAttribute("hidden","");
  document.getElementById("fb").removeAttribute("hidden");
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
