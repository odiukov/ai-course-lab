<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь предложения через encoder и decoder</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#eef3fa;
  --panel-strong:#e1eaf6;
  --text:#172033;
  --muted:#56647a;
  --line:#718096;
  --encoder:#3478c8;
  --encoder-fill:#dcecff;
  --context:#a65f00;
  --context-fill:#fff0c7;
  --decoder:#20805e;
  --decoder-fill:#d9f4e9;
  --feedback:#8661b4;
  --target-fill:#e5f6ed;
}
*{box-sizing:border-box}
body{
  margin:unset;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}
figure{
  margin:unset;
  background:var(--bg);
}
h2{
  margin:unset;
  padding:12px 24px 6px;
  font-size:20px;
  line-height:normal;
  font-weight:700;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--bg);
}
.region{
  fill:var(--panel);
  stroke:var(--line);
  stroke-width:1.5px;
}
.region-decoder{fill:var(--panel-strong)}
.box{
  stroke-width:2px;
}
.source,.encoder-state{
  fill:var(--encoder-fill);
  stroke:var(--encoder);
}
.context{
  fill:var(--context-fill);
  stroke:var(--context);
  stroke-width:3px;
}
.previous{
  fill:var(--panel);
  stroke:var(--feedback);
}
.decoder-state{
  fill:var(--decoder-fill);
  stroke:var(--decoder);
}
.target{
  fill:var(--target-fill);
  stroke:var(--decoder);
}
.flow-encoder{
  fill:var(--encoder);
  stroke:var(--encoder);
  stroke-width:2px;
}
.flow-transfer{
  fill:var(--context);
  stroke:var(--context);
  stroke-width:3px;
}
.flow-decoder{
  fill:var(--decoder);
  stroke:var(--decoder);
  stroke-width:2px;
}
.flow-feedback{
  fill:var(--feedback);
  stroke:var(--feedback);
  stroke-width:2px;
}
.flow-feedback-path{
  fill:none;
  stroke:var(--feedback);
  stroke-width:2px;
}
.label{
  fill:var(--text);
  font-size:14px;
  dominant-baseline:middle;
}
.section{
  font-size:16px;
  font-weight:700;
}
.small{
  fill:var(--muted);
  font-size:13px;
}
.token{
  font-size:15px;
  font-weight:650;
}
.cell{
  font-size:13px;
  font-weight:650;
}
.context-label{
  fill:var(--context);
  font-size:14px;
  font-weight:700;
}
.note{
  fill:var(--muted);
  font-size:14px;
}
#fallback{
  padding:16px 24px;
  font-size:16px;
  color:var(--text);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10151f;
    --panel:#182231;
    --panel-strong:#1c2938;
    --text:#edf3fb;
    --muted:#aebbd0;
    --line:#617087;
    --encoder:#75b7ff;
    --encoder-fill:#173553;
    --context:#ffc45e;
    --context-fill:#493715;
    --decoder:#69d6ad;
    --decoder-fill:#173e34;
    --feedback:#c7a4f4;
    --target-fill:#194638;
  }
}
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h2 id="diagram-title">Путь предложения через encoder и decoder</h2>
  <svg id="scheme" viewBox="0 0 1200 450"
       width="1200" height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Исходные токены проходят через encoder, сжимаются в context vector из 256 чисел, после чего decoder порождает токены от BOS до EOS">
    <g id="drawing"></g>
  </svg>
  <p id="fallback">Исходные токены переменной длины проходят через encoder, превращаются в один context vector из 256 чисел, а decoder порождает перевод от &lt;BOS&gt; до &lt;EOS&gt;.</p>
</figure>
<script>
const DATA=[
  {kind:"config",origin:{x:34,y:12},scale:9.4,zero:0,
   corner:1.15,arrowLength:1.1,arrowHalf:.62},
  {kind:"region",x:1,y:3.6,w:40.5,h:34.2,cls:"region"},
  {kind:"region",x:63.5,y:3.6,w:55.5,h:34.2,cls:"region region-decoder"},

  {kind:"arrow",x1:8,y1:13,x2:8,y2:16.5,cls:"flow-encoder"},
  {kind:"arrow",x1:21.5,y1:13,x2:21.5,y2:16.5,cls:"flow-encoder"},
  {kind:"arrow",x1:35,y1:13,x2:35,y2:16.5,cls:"flow-encoder"},
  {kind:"arrow",x1:13,y1:20,x2:16.5,y2:20,cls:"flow-encoder"},
  {kind:"arrow",x1:26.5,y1:20,x2:30,y2:20,cls:"flow-encoder"},
  {kind:"arrow",x1:40,y1:20,x2:44.5,y2:20,cls:"flow-transfer"},
  {kind:"arrow",x1:59.5,y1:20,x2:64.5,y2:20,cls:"flow-transfer"},

  {kind:"arrow",x1:69,y1:13,x2:69,y2:16.5,cls:"flow-decoder"},
  {kind:"arrow",x1:84,y1:13,x2:84,y2:16.5,cls:"flow-decoder"},
  {kind:"arrow",x1:99,y1:13,x2:99,y2:16.5,cls:"flow-decoder"},
  {kind:"arrow",x1:114,y1:13,x2:114,y2:16.5,cls:"flow-decoder"},
  {kind:"arrow",x1:73.5,y1:20,x2:79.5,y2:20,cls:"flow-decoder"},
  {kind:"arrow",x1:88.5,y1:20,x2:94.5,y2:20,cls:"flow-decoder"},
  {kind:"arrow",x1:103.5,y1:20,x2:109.5,y2:20,cls:"flow-decoder"},
  {kind:"arrow",x1:69,y1:23.5,x2:69,y2:28.5,cls:"flow-decoder"},
  {kind:"arrow",x1:84,y1:23.5,x2:84,y2:28.5,cls:"flow-decoder"},
  {kind:"arrow",x1:99,y1:23.5,x2:99,y2:28.5,cls:"flow-decoder"},
  {kind:"arrow",x1:114,y1:23.5,x2:114,y2:28.5,cls:"flow-decoder"},

  {kind:"curve",start:{x:73.5,y:31},c1:{x:76,y:34.5},
   c2:{x:77,y:7.8},end:{x:79.5,y:10.5}},
  {kind:"curve",start:{x:88.5,y:31},c1:{x:91,y:34.5},
   c2:{x:92,y:7.8},end:{x:94.5,y:10.5}},
  {kind:"curve",start:{x:103.5,y:31},c1:{x:106,y:34.5},
   c2:{x:107,y:7.8},end:{x:109.5,y:10.5}},

  {kind:"box",cx:8,cy:10.5,w:10,h:5,cls:"box source"},
  {kind:"box",cx:21.5,cy:10.5,w:10,h:5,cls:"box source"},
  {kind:"box",cx:35,cy:10.5,w:10,h:5,cls:"box source"},
  {kind:"box",cx:8,cy:20,w:10,h:7,cls:"box encoder-state"},
  {kind:"box",cx:21.5,cy:20,w:10,h:7,cls:"box encoder-state"},
  {kind:"box",cx:35,cy:20,w:10,h:7,cls:"box encoder-state"},
  {kind:"box",cx:52,cy:20,w:15,h:10,cls:"box context"},

  {kind:"box",cx:69,cy:10.5,w:9,h:5,cls:"box previous"},
  {kind:"box",cx:84,cy:10.5,w:9,h:5,cls:"box previous"},
  {kind:"box",cx:99,cy:10.5,w:9,h:5,cls:"box previous"},
  {kind:"box",cx:114,cy:10.5,w:9,h:5,cls:"box previous"},
  {kind:"box",cx:69,cy:20,w:9,h:7,cls:"box decoder-state"},
  {kind:"box",cx:84,cy:20,w:9,h:7,cls:"box decoder-state"},
  {kind:"box",cx:99,cy:20,w:9,h:7,cls:"box decoder-state"},
  {kind:"box",cx:114,cy:20,w:9,h:7,cls:"box decoder-state"},
  {kind:"box",cx:69,cy:31,w:9,h:5,cls:"box target"},
  {kind:"box",cx:84,cy:31,w:9,h:5,cls:"box target"},
  {kind:"box",cx:99,cy:31,w:9,h:5,cls:"box target"},
  {kind:"box",cx:114,cy:31,w:9,h:5,cls:"box target"},

  {kind:"text",x:21.25,y:6.1,value:"ENCODER",anchor:"middle",cls:"label section"},
  {kind:"text",x:91.25,y:6.1,value:"DECODER",anchor:"middle",cls:"label section"},
  {kind:"text",x:8,y:10.5,value:"Я",anchor:"middle",cls:"label token"},
  {kind:"text",x:21.5,y:10.5,value:"люблю",anchor:"middle",cls:"label token"},
  {kind:"text",x:35,y:10.5,value:"чай",anchor:"middle",cls:"label token"},
  {kind:"text",x:8,y:20,value:"state",anchor:"middle",cls:"label cell"},
  {kind:"text",x:21.5,y:20,value:"state",anchor:"middle",cls:"label cell"},
  {kind:"text",x:35,y:20,value:"state",anchor:"middle",cls:"label cell"},
  {kind:"text",x:21.25,y:26.5,value:"hidden state обновляется после каждого токена",
   anchor:"middle",cls:"label small"},
  {kind:"text",x:21.25,y:30,value:"последний state хранит смысл всего входа",
   anchor:"middle",cls:"label small"},
  {kind:"text",x:21.25,y:35,value:"исходные токены • переменная длина",
   anchor:"middle",cls:"label note"},

  {kind:"text",x:52,y:17.8,value:"context",anchor:"middle",cls:"label context-label"},
  {kind:"text",x:52,y:20.2,value:"vector",anchor:"middle",cls:"label context-label"},
  {kind:"text",x:52,y:22.8,value:"256 чисел",anchor:"middle",cls:"label context-label"},
  {kind:"text",x:52,y:27.2,value:"один вектор",anchor:"middle",cls:"label small"},

  {kind:"text",x:69,y:10.5,value:"<BOS>",anchor:"middle",cls:"label token"},
  {kind:"text",x:84,y:10.5,value:"I",anchor:"middle",cls:"label token"},
  {kind:"text",x:99,y:10.5,value:"like",anchor:"middle",cls:"label token"},
  {kind:"text",x:114,y:10.5,value:"tea",anchor:"middle",cls:"label token"},
  {kind:"text",x:69,y:20,value:"decoder",anchor:"middle",cls:"label cell"},
  {kind:"text",x:84,y:20,value:"decoder",anchor:"middle",cls:"label cell"},
  {kind:"text",x:99,y:20,value:"decoder",anchor:"middle",cls:"label cell"},
  {kind:"text",x:114,y:20,value:"decoder",anchor:"middle",cls:"label cell"},
  {kind:"text",x:69,y:31,value:"I",anchor:"middle",cls:"label token"},
  {kind:"text",x:84,y:31,value:"like",anchor:"middle",cls:"label token"},
  {kind:"text",x:99,y:31,value:"tea",anchor:"middle",cls:"label token"},
  {kind:"text",x:114,y:31,value:"<EOS>",anchor:"middle",cls:"label token"},
  {kind:"text",x:91.25,y:35.5,
   value:"выбранный токен возвращается на вход следующего шага",
   anchor:"middle",cls:"label small"},
  {kind:"text",x:60,y:41.8,
   value:"Decoder сам выбирает длину: генерация идёт до <EOS> или максимальной длины",
   anchor:"middle",cls:"label note"}
];

const [{origin:originData,scale,zero,corner,arrowLength,arrowHalf},...diagram]=DATA;
const origin=Object.freeze({x:originData.x,y:originData.y});
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const NS="http://www.w3.org/2000/svg";
  const root=document.getElementById("drawing");
  const fallback=document.getElementById("fallback");

  const make=(name,attrs,text)=>{
    const node=document.createElementNS(NS,name);
    Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
    if(text!==undefined) node.textContent=text;
    return node;
  };

  const head=(tx,ty,x,y,cls)=>{
    const dx=x-tx,dy=y-ty,length=Math.hypot(dx,dy);
    const ux=dx/length,uy=dy/length;
    const bx=x-ux*arrowLength,by=y-uy*arrowLength;
    const p1={x,y};
    const p2={x:bx-uy*arrowHalf,y:by+ux*arrowHalf};
    const p3={x:bx+uy*arrowHalf,y:by-ux*arrowHalf};
    root.append(make("polygon",{
      points:[p1,p2,p3].map(p=>`${sx(p.x)},${sy(p.y)}`).join(" "),
      class:cls
    }));
  };

  diagram.filter(item=>item.kind==="region").forEach(item=>{
    root.append(make("rect",{
      x:sx(item.x),y:sy(item.y),
      width:sx(item.x+item.w)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(corner)-sx(zero),ry:sy(corner)-sy(zero),
      class:item.cls
    }));
  });

  diagram.filter(item=>item.kind==="arrow").forEach(item=>{
    root.append(make("line",{
      x1:sx(item.x1),y1:sy(item.y1),x2:sx(item.x2),y2:sy(item.y2),
      class:item.cls
    }));
    head(item.x1,item.y1,item.x2,item.y2,item.cls);
  });

  diagram.filter(item=>item.kind==="curve").forEach(item=>{
    const {start,c1,c2,end}=item;
    const path=`M ${sx(start.x)} ${sy(start.y)} C ${sx(c1.x)} ${sy(c1.y)} ${sx(c2.x)} ${sy(c2.y)} ${sx(end.x)} ${sy(end.y)}`;
    root.append(make("path",{d:path,class:"flow-feedback-path"}));
    head(c2.x,c2.y,end.x,end.y,"flow-feedback");
  });

  diagram.filter(item=>item.kind==="box").forEach(item=>{
    const x=item.cx-item.w/scale*scale/scale;
    const y=item.cy-item.h/scale*scale/scale;
    root.append(make("rect",{
      x:sx(x),y:sy(y),
      width:sx(x+item.w)-sx(x),
      height:sy(y+item.h)-sy(y),
      rx:sx(corner)-sx(zero),ry:sy(corner)-sy(zero),
      class:item.cls
    }));
  });

  diagram.filter(item=>item.kind==="text").forEach(item=>{
    root.append(make("text",{
      x:sx(item.x),y:sy(item.y),
      "text-anchor":item.anchor,
      class:item.cls
    },item.value));
  });

  fallback.hidden=true;
}catch(error){
  document.getElementById("drawing").replaceChildren();
  document.getElementById("fallback").hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
