<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Формы тензоров encoder</title>
<style>
  :root {
    color-scheme: light dark;
    --page: ghostwhite;
    --surface: white;
    --panel: aliceblue;
    --ink: midnightblue;
    --muted: slategray;
    --grid: lightslategray;
    --state: royalblue;
    --state-soft: lightblue;
    --selected: darkorange;
    --selected-soft: moccasin;
    --hidden: seagreen;
    --hidden-soft: palegreen;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: midnightblue;
      --surface: darkslategray;
      --panel: darkslateblue;
      --ink: whitesmoke;
      --muted: lightgray;
      --grid: lightslategray;
      --state: lightskyblue;
      --state-soft: steelblue;
      --selected: lightsalmon;
      --selected-soft: sienna;
      --hidden: mediumaquamarine;
      --hidden-soft: seagreen;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    overflow: hidden;
    background: var(--surface);
  }

  .figure-title {
    margin: 14px 22px 8px;
    color: var(--ink);
    font-size: 24px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--surface);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--grid);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .badge {
    fill: var(--surface);
    stroke: var(--grid);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .row-base {
    fill: var(--state-soft);
    stroke: var(--state);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .selected-cell {
    fill: var(--selected-soft);
    stroke: var(--selected);
    stroke-width: 3px;
    vector-effect: non-scaling-stroke;
  }

  .hidden-vector {
    fill: var(--hidden-soft);
    stroke: var(--hidden);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .division,
  .axis {
    fill: none;
    stroke: var(--grid);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .arrow-line {
    fill: none;
    stroke: var(--selected);
    stroke-width: 3px;
    vector-effect: non-scaling-stroke;
  }

  .arrow-head,
  .legend-selected {
    fill: var(--selected);
  }

  .legend-state {
    fill: var(--state);
  }

  .legend-hidden {
    fill: var(--hidden);
  }

  text {
    fill: var(--ink);
    dominant-baseline: middle;
  }

  .title-text {
    font-size: 18px;
    font-weight: bold;
  }

  .shape-text {
    font-size: 18px;
    font-weight: bold;
  }

  .badge-text,
  .row-text,
  .vector-text {
    font-size: 16px;
    font-weight: bold;
  }

  .axis-text,
  .note-text {
    fill: var(--muted);
    font-size: 14px;
  }

  .arrow-text {
    fill: var(--selected);
    font-size: 14px;
    font-weight: bold;
  }

  .legend-text {
    font-size: 13px;
  }

  .summary-text {
    fill: var(--hidden);
    font-size: 18px;
    font-weight: bold;
  }

  .fallback-text {
    font-size: 18px;
  }
</style>
</head>
<body>
<main class="figure">
  <h1 class="figure-title">Формы тензоров encoder</h1>
  <svg id="diagram"
       viewBox="0 0 1180 430"
       width="1180"
       height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Сжатие outputs до последнего hidden</title>
    <desc id="svg-description">
      Для пакета из двух последовательностей длиной двадцать показан тензор
      outputs формы два на двадцать на двести пятьдесят шесть. Последнее
      состояние каждой последовательности образует hidden формы два на
      двести пятьдесят шесть.
    </desc>
  </svg>
</main>

<script>
(() => {
  const [data] = Object.freeze([{
    batch: 2,
    seq: 20,
    hidden: 256,
    zero: 0,
    unit: 1,
    canvas: { width: 1180, height: 430 },
    badge: {
      y: 18,
      height: 38,
      xs: [185, 465, 745],
      widths: [210, 220, 250],
      labels: ["batch = 2", "seq_len = 20", "hidden_dim = 256"]
    },
    outputs: {
      panelX: 145,
      panelY: 112,
      panelWidth: 650,
      panelHeight: 226,
      x1: 185,
      x2: 765,
      rowYs: [174, 260],
      rowHeight: 58,
      rowNames: ["предложение А", "предложение Б"],
      titleX: 185,
      titleY: 86,
      shapeX: 287,
      bracketY: 142,
      bracketTickY: 152,
      sideBracketX: 166,
      sideTickX: 176,
      batchLabelX: 24,
      batchLabelY: 246
    },
    hiddenBox: {
      panelX: 905,
      panelY: 112,
      panelWidth: 248,
      panelHeight: 226,
      x1: 936,
      x2: 1125,
      rowYs: [174, 260],
      rowHeight: 58,
      titleX: 905,
      titleY: 82,
      shapeX: 905,
      shapeY: 101,
      rowLabelX: 926,
      rowNames: ["А", "Б"]
    },
    arrow: {
      fromX: 776,
      toX: 928,
      headLength: 12,
      headHalf: 7,
      labelX: 852,
      labelY: 135
    },
    legend: {
      y: 365,
      swatchY: 357,
      swatchWidth: 18,
      swatchHeight: 16,
      stateX: 185,
      stateTextX: 213,
      selectedX: 455,
      selectedTextX: 483,
      hiddenX: 765,
      hiddenTextX: 793,
      summaryX: 590,
      summaryY: 408
    },
    pad: {
      row: 10,
      label: 8
    },
    fallback: {
      x: 54,
      y1: 194,
      y2: 230
    }
  }]);

  const origin = Object.freeze({ x: 0, y: 0 });
  const scale = Object.freeze({ x: 1, y: 1 });

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const svg = document.getElementById("diagram");
  const namespace = svg.namespaceURI;

  const node = (name, attributes, className) => {
    const element = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => {
      element.setAttribute(key, String(value));
    });
    if (className) element.setAttribute("class", className);
    return element;
  };

  const rect = (x, y, width, height, className) => node("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y)
  }, className);

  const line = (x1, y1, x2, y2, className) => node("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2)
  }, className);

  const polygon = (points, className) => node("polygon", {
    points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ")
  }, className);

  const label = (x, y, value, anchor, className) => {
    const element = node("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": anchor
    }, className);
    element.textContent = value;
    return element;
  };

  const group = className => node("g", {}, className);

  const arrow = (fromX, y, toX) => {
    const result = group("arrow");
    const baseX = toX - data.arrow.headLength;
    result.append(
      line(fromX, y, baseX, y, "arrow-line"),
      polygon([
        [toX, y],
        [baseX, y - data.arrow.headHalf],
        [baseX, y + data.arrow.headHalf]
      ], "arrow-head")
    );
    return result;
  };

  const fallback = () => {
    svg.replaceChildren();
    svg.append(
      label(
        data.fallback.x,
        data.fallback.y1,
        "Схема должна была показать: outputs [2, 20, 256]",
        "start",
        "fallback-text"
      ),
      label(
        data.fallback.x,
        data.fallback.y2,
        "и выбранный последний hidden [2, 256].",
        "start",
        "fallback-text"
      )
    );
  };

  try {
    const badges = group("badges");
    data.badge.labels.forEach((value, index) => {
      const x = data.badge.xs[index];
      const width = data.badge.widths[index];
      badges.append(
        rect(x, data.badge.y, width, data.badge.height, "badge"),
        label(
          x + width / data.batch,
          data.badge.y + data.badge.height / data.batch,
          value,
          "middle",
          "badge-text"
        )
      );
    });

    const outputPanel = rect(
      data.outputs.panelX,
      data.outputs.panelY,
      data.outputs.panelWidth,
      data.outputs.panelHeight,
      "panel"
    );

    const hiddenPanel = rect(
      data.hiddenBox.panelX,
      data.hiddenBox.panelY,
      data.hiddenBox.panelWidth,
      data.hiddenBox.panelHeight,
      "panel"
    );

    const outputTitles = group("output-titles");
    outputTitles.append(
      label(
        data.outputs.titleX,
        data.outputs.titleY,
        "outputs",
        "start",
        "title-text"
      ),
      label(
        data.outputs.shapeX,
        data.outputs.titleY,
        "[2, 20, 256]",
        "start",
        "shape-text"
      )
    );

    const hiddenTitles = group("hidden-titles");
    hiddenTitles.append(
      label(
        data.hiddenBox.titleX,
        data.hiddenBox.titleY,
        "выбранный последний hidden",
        "start",
        "title-text"
      ),
      label(
        data.hiddenBox.shapeX,
        data.hiddenBox.shapeY,
        "[2, 256]",
        "start",
        "shape-text"
      )
    );

    const axes = group("axes");
    axes.append(
      line(
        data.outputs.x1,
        data.outputs.bracketY,
        data.outputs.x2,
        data.outputs.bracketY,
        "axis"
      ),
      line(
        data.outputs.x1,
        data.outputs.bracketY,
        data.outputs.x1,
        data.outputs.bracketTickY,
        "axis"
      ),
      line(
        data.outputs.x2,
        data.outputs.bracketY,
        data.outputs.x2,
        data.outputs.bracketTickY,
        "axis"
      ),
      label(
        (data.outputs.x1 + data.outputs.x2) / data.batch,
        data.outputs.bracketY - data.pad.label,
        "20 позиций токенов",
        "middle",
        "axis-text"
      ),
      line(
        data.outputs.sideBracketX,
        data.outputs.rowYs[data.zero],
        data.outputs.sideBracketX,
        data.outputs.rowYs[data.unit] + data.outputs.rowHeight,
        "axis"
      ),
      line(
        data.outputs.sideBracketX,
        data.outputs.rowYs[data.zero],
        data.outputs.sideTickX,
        data.outputs.rowYs[data.zero],
        "axis"
      ),
      line(
        data.outputs.sideBracketX,
        data.outputs.rowYs[data.unit] + data.outputs.rowHeight,
        data.outputs.sideTickX,
        data.outputs.rowYs[data.unit] + data.outputs.rowHeight,
        "axis"
      ),
      label(
        data.outputs.batchLabelX,
        data.outputs.batchLabelY,
        "пакет: 2 предложения",
        "start",
        "axis-text"
      )
    );

    const rows = group("output-rows");
    const cellWidth =
      (data.outputs.x2 - data.outputs.x1) / data.seq;
    const lastCellX = data.outputs.x2 - cellWidth;
    const innerPositions = Array.from(
      { length: data.seq - data.unit },
      (_, index) => index + data.unit
    );

    data.outputs.rowYs.forEach((rowY, index) => {
      rows.append(
        label(
          data.outputs.x1 - data.pad.row,
          rowY + data.outputs.rowHeight / data.batch,
          data.outputs.rowNames[index],
          "end",
          "row-text"
        ),
        rect(
          data.outputs.x1,
          rowY,
          data.outputs.x2 - data.outputs.x1,
          data.outputs.rowHeight,
          "row-base"
        ),
        rect(
          lastCellX,
          rowY,
          cellWidth,
          data.outputs.rowHeight,
          "selected-cell"
        )
      );

      innerPositions.forEach(position => {
        const divisionX = data.outputs.x1 + cellWidth * position;
        rows.append(
          line(
            divisionX,
            rowY,
            divisionX,
            rowY + data.outputs.rowHeight,
            "division"
          )
        );
      });
    });

    const arrows = group("selection-arrows");
    data.outputs.rowYs.forEach(rowY => {
      const centerY = rowY + data.outputs.rowHeight / data.batch;
      arrows.append(
        arrow(data.arrow.fromX, centerY, data.arrow.toX)
      );
    });
    arrows.append(
      label(
        data.arrow.labelX,
        data.arrow.labelY,
        "берём последнее состояние",
        "middle",
        "arrow-text"
      )
    );

    const hiddenRows = group("hidden-rows");
    data.hiddenBox.rowYs.forEach((rowY, index) => {
      hiddenRows.append(
        label(
          data.hiddenBox.rowLabelX,
          rowY + data.hiddenBox.rowHeight / data.batch,
          data.hiddenBox.rowNames[index],
          "end",
          "row-text"
        ),
        rect(
          data.hiddenBox.x1,
          rowY,
          data.hiddenBox.x2 - data.hiddenBox.x1,
          data.hiddenBox.rowHeight,
          "hidden-vector"
        ),
        label(
          (data.hiddenBox.x1 + data.hiddenBox.x2) / data.batch,
          rowY + data.hiddenBox.rowHeight / data.batch,
          "256 чисел",
          "middle",
          "vector-text"
        )
      );
    });

    const legend = group("legend");
    legend.append(
      rect(
        data.legend.stateX,
        data.legend.swatchY,
        data.legend.swatchWidth,
        data.legend.swatchHeight,
        "legend-state"
      ),
      label(
        data.legend.stateTextX,
        data.legend.y,
        "состояние токена: 256 чисел",
        "start",
        "legend-text"
      ),
      rect(
        data.legend.selectedX,
        data.legend.swatchY,
        data.legend.swatchWidth,
        data.legend.swatchHeight,
        "legend-selected"
      ),
      label(
        data.legend.selectedTextX,
        data.legend.y,
        "последний токен выбран",
        "start",
        "legend-text"
      ),
      rect(
        data.legend.hiddenX,
        data.legend.swatchY,
        data.legend.swatchWidth,
        data.legend.swatchHeight,
        "legend-hidden"
      ),
      label(
        data.legend.hiddenTextX,
        data.legend.y,
        "по одному вектору на предложение",
        "start",
        "legend-text"
      ),
      label(
        data.legend.summaryX,
        data.legend.summaryY,
        "для каждого предложения: 20 × 256 → 256 чисел",
        "middle",
        "summary-text"
      )
    );

    svg.append(
      badges,
      outputPanel,
      hiddenPanel,
      outputTitles,
      hiddenTitles,
      axes,
      rows,
      arrows,
      hiddenRows,
      legend
    );
  } catch (error) {
    fallback();
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
