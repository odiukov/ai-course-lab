<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь Ollama → llama.cpp → vLLM или SGLang</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #edf3f8;
    --surface: #f8fbfe;
    --ink: #172235;
    --muted: #526176;
    --line: #7890aa;
    --border: #b8c6d5;
    --dev-fill: #e4f5ec;
    --dev-stroke: #287c5b;
    --stage-fill: #e9f0ff;
    --stage-stroke: #426caf;
    --prod-fill: #f3eaff;
    --prod-stroke: #7a4cac;
    --prep-fill: #fff3d6;
    --prep-stroke: #a86812;
    --gguf-fill: #eaf7f1;
    --safe-fill: #f5edff;
    --arrow: #526b86;
    --white: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101721;
      --surface: #151f2b;
      --ink: #edf5ff;
      --muted: #b1bfd0;
      --line: #7790ab;
      --border: #35465a;
      --dev-fill: #17382d;
      --dev-stroke: #68c59d;
      --stage-fill: #1c304e;
      --stage-stroke: #82aaf0;
      --prod-fill: #38254b;
      --prod-stroke: #c096ef;
      --prep-fill: #47351c;
      --prep-stroke: #e2ae55;
      --gguf-fill: #193329;
      --safe-fill: #322441;
      --arrow: #91a8c0;
      --white: #ffffff;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    background: var(--surface);
    border: solid 1px var(--border);
    color: var(--ink);
    margin: auto;
    overflow: hidden;
  }

  figcaption {
    background: var(--surface);
    border-bottom: solid 1px var(--border);
    color: var(--ink);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    background: var(--surface);
    display: block;
    height: auto;
    max-height: 520px;
    width: 100%;
  }

  [hidden] {
    display: none;
  }

  .card,
  .format-card,
  .preparation {
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .card-dev {
    fill: var(--dev-fill);
    stroke: var(--dev-stroke);
  }

  .card-stage {
    fill: var(--stage-fill);
    stroke: var(--stage-stroke);
  }

  .card-prod {
    fill: var(--prod-fill);
    stroke: var(--prod-stroke);
  }

  .preparation {
    fill: var(--prep-fill);
    stroke: var(--prep-stroke);
  }

  .format-gguf {
    fill: var(--gguf-fill);
    stroke: var(--dev-stroke);
  }

  .format-safe {
    fill: var(--safe-fill);
    stroke: var(--prod-stroke);
  }

  .flow,
  .association,
  .separator {
    fill: none;
    stroke: var(--arrow);
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .separator {
    stroke: var(--prep-stroke);
    stroke-width: 1px;
  }

  .arrow-head {
    fill: var(--arrow);
    stroke: none;
  }

  .question {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .environment {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .engine {
    fill: var(--ink);
    font-size: 26px;
    font-weight: bold;
  }

  .description {
    fill: var(--muted);
    font-size: 15px;
  }

  .prep-tag {
    fill: var(--prep-stroke);
    font-size: 13px;
    font-weight: bold;
  }

  .prep-title {
    fill: var(--ink);
    font-size: 21px;
    font-weight: bold;
  }

  .prep-copy {
    fill: var(--muted);
    font-size: 14px;
  }

  .format-name {
    fill: var(--ink);
    font-size: 21px;
    font-weight: bold;
  }

  .format-family {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
  }

  .format-engines {
    fill: var(--ink);
    font-size: 15px;
  }

  .legend {
    fill: var(--muted);
    font-size: 15px;
    font-weight: bold;
  }

  .fallback {
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<figure>
  <figcaption>Путь проекта: Ollama → llama.cpp → vLLM или SGLang</figcaption>
  <svg id="diagram"
       viewBox="0 0 1200 420"
       width="1200"
       height="420"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
    <title id="diagram-title">Смена движков между разработкой, проверкой и продакшеном</title>
    <desc id="diagram-description">Ollama используется в разработке, llama.cpp — в проверочной среде, а vLLM или SGLang — в продакшене. Между GGUF для CPU-семейства и safetensors для GPU-движков выделен отдельный шаг подготовки весов.</desc>
  </svg>
  <p id="fallback" class="fallback">
    Схема должна показать путь от Ollama в разработке через llama.cpp в проверочной среде к vLLM или SGLang в продакшене, а также отдельную подготовку весов между GGUF и safetensors.
  </p>
</figure>

<script>
const data = [
  { x: 36, y: 8 },
  { x: 1, y: 1 },
  {
    zero: 0,
    corner: 14,
    arrowDepth: 12,
    arrowHalf: 7,
    questionY: 34,
    stageY: 62,
    stageH: 160,
    flowY: 142,
    bandY: 270,
    bandH: 80,
    bandFlowY: 310,
    legendY: 397,
    associationTop: 222,
    associationBottom: 270
  },
  [
    {
      x: 0,
      y: 62,
      w: 250,
      h: 160,
      questionX: 125,
      question: ["Быстро попробовать идею?"],
      environmentY: 91,
      environment: ["РАЗРАБОТКА"],
      engineY: 132,
      engine: ["Ollama"],
      copyY: 177,
      copyGap: 24,
      copy: ["ноутбук", "быстрые итерации"],
      className: "card card-dev",
      associationX: 125
    },
    {
      x: 330,
      y: 62,
      w: 250,
      h: 160,
      questionX: 455,
      question: ["Повторяется ли результат?"],
      environmentY: 91,
      environment: ["ПРОВЕРКА"],
      engineY: 132,
      engine: ["llama.cpp"],
      copyY: 177,
      copyGap: 24,
      copy: ["контролируемая среда", "настройки и ограничения"],
      className: "card card-stage",
      associationX: 455
    },
    {
      x: 860,
      y: 62,
      w: 270,
      h: 160,
      questionX: 995,
      question: ["Выдержит ли сервис нагрузку?"],
      environmentY: 87,
      environment: ["ПРОДАКШЕН"],
      engineY: 123,
      engineGap: 31,
      engine: ["vLLM или", "SGLang"],
      copyY: 187,
      copyGap: 22,
      copy: ["параллельные запросы", "задержка и загрузка GPU"],
      className: "card card-prod",
      associationX: 995
    }
  ],
  {
    x: 635,
    y: 62,
    w: 170,
    h: 298,
    tagY: 89,
    tag: ["ОТДЕЛЬНЫЙ ШАГ"],
    titleY: 122,
    titleGap: 26,
    title: ["Подготовка", "весов"],
    upperCopyY: 181,
    upperCopyGap: 21,
    upperCopy: ["сменить формат", "сверить артефакт"],
    separatorY: 230,
    lowerTagY: 264,
    lowerTag: ["МЕЖДУ СЕМЕЙСТВАМИ"],
    lowerCopyY: 297,
    lowerCopyGap: 23,
    lowerCopy: ["сохранить проверенную", "квантизацию"]
  },
  [
    {
      x: 0,
      y: 270,
      w: 580,
      h: 80,
      nameX: 22,
      nameY: 294,
      name: ["GGUF"],
      familyY: 318,
      family: ["CPU-семейство"],
      enginesY: 340,
      engines: ["Ollama + llama.cpp"],
      className: "format-card format-gguf"
    },
    {
      x: 860,
      y: 270,
      w: 270,
      h: 80,
      nameX: 882,
      nameY: 294,
      name: ["safetensors"],
      familyY: 318,
      family: ["GPU-движки"],
      enginesY: 340,
      engines: ["vLLM или SGLang"],
      className: "format-card format-safe"
    }
  ],
  [
    { x1: 250, y: 142, x2: 330, className: "flow" },
    { x1: 580, y: 142, x2: 635, className: "flow" },
    { x1: 805, y: 142, x2: 860, className: "flow" },
    { x1: 580, y: 310, x2: 635, className: "flow" },
    { x1: 805, y: 310, x2: 860, className: "flow" }
  ],
  {
    x: 565,
    y: 397,
    text: ["Один проект · разные движки · единый проверяемый результат"]
  }
];

const [origin, scale, geometry, stages, preparation, formats, arrows, legend] = data;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");

try {
  const node = (name, attributes, content) => {
    const element = document.createElementNS(svg.namespaceURI, name);
    for (const [key, value] of Object.entries(attributes || {})) {
      element.setAttribute(key, value);
    }
    if (content) element.textContent = content;
    return element;
  };

  const add = element => svg.appendChild(element);

  const rectangle = (x, y, width, height, className) => add(node("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y),
    rx: sx(geometry.corner) - sx(geometry.zero),
    class: className
  }));

  const line = (x1, y1, x2, y2, className) => add(node("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2),
    y2: sy(y2),
    class: className
  }));

  const label = (x, y, lines, className, anchor, gap) => {
    const text = node("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    });
    for (const [index, value] of lines.entries()) {
      text.appendChild(node("tspan", {
        x: sx(x),
        y: sy(y + index * (gap || geometry.zero))
      }, value));
    }
    add(text);
  };

  const arrow = ({ x1, y, x2, className }) => {
    line(x1, y, x2 - geometry.arrowDepth, y, className);
    add(node("polygon", {
      points: [
        `${sx(x2)},${sy(y)}`,
        `${sx(x2 - geometry.arrowDepth)},${sy(y - geometry.arrowHalf)}`,
        `${sx(x2 - geometry.arrowDepth)},${sy(y + geometry.arrowHalf)}`
      ].join(" "),
      class: "arrow-head"
    }));
  };

  for (const item of arrows) arrow(item);

  for (const stage of stages) {
    line(
      stage.associationX,
      geometry.associationTop,
      stage.associationX,
      geometry.associationBottom,
      "association"
    );
  }

  for (const stage of stages) {
    rectangle(stage.x, stage.y, stage.w, stage.h, stage.className);
    label(stage.questionX, geometry.questionY, stage.question, "question", "middle", geometry.zero);
    label(stage.x + stage.w / scale.x / (scale.x + scale.x), stage.environmentY,
      stage.environment, "environment", "middle", geometry.zero);
    label(stage.x + stage.w / scale.x / (scale.x + scale.x), stage.engineY,
      stage.engine, "engine", "middle", stage.engineGap || geometry.zero);
    label(stage.x + stage.w / scale.x / (scale.x + scale.x), stage.copyY,
      stage.copy, "description", "middle", stage.copyGap);
  }

  for (const format of formats) {
    rectangle(format.x, format.y, format.w, format.h, format.className);
    label(format.nameX, format.nameY, format.name, "format-name", "start", geometry.zero);
    label(format.nameX, format.familyY, format.family, "format-family", "start", geometry.zero);
    label(format.nameX, format.enginesY, format.engines, "format-engines", "start", geometry.zero);
  }

  rectangle(
    preparation.x,
    preparation.y,
    preparation.w,
    preparation.h,
    "preparation"
  );

  const preparationCenter =
    preparation.x + preparation.w / scale.x / (scale.x + scale.x);

  label(preparationCenter, preparation.tagY, preparation.tag,
    "prep-tag", "middle", geometry.zero);
  label(preparationCenter, preparation.titleY, preparation.title,
    "prep-title", "middle", preparation.titleGap);
  label(preparationCenter, preparation.upperCopyY, preparation.upperCopy,
    "prep-copy", "middle", preparation.upperCopyGap);

  line(
    preparation.x,
    preparation.separatorY,
    preparation.x + preparation.w,
    preparation.separatorY,
    "separator"
  );

  label(preparationCenter, preparation.lowerTagY, preparation.lowerTag,
    "prep-tag", "middle", geometry.zero);
  label(preparationCenter, preparation.lowerCopyY, preparation.lowerCopy,
    "prep-copy", "middle", preparation.lowerCopyGap);

  label(legend.x, legend.y, legend.text, "legend", "middle", geometry.zero);

  fallback.hidden = true;
  svg.hidden = false;
} catch (error) {
  svg.hidden = true;
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна показать три среды: разработку на Ollama, проверку на llama.cpp и продакшен на vLLM или SGLang. Между GGUF для CPU-семейства и safetensors для GPU-движков расположен отдельный шаг подготовки весов.";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
