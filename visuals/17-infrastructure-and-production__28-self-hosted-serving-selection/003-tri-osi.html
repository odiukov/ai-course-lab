<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <title>Порядок выбора: железо → масштаб → нагрузка</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --ink: midnightblue;
      --muted: slategray;
      --border: lightsteelblue;
      --card: aliceblue;
      --hardware: royalblue;
      --hardware-fill: lavender;
      --scale: seagreen;
      --scale-fill: honeydew;
      --load: darkorange;
      --load-fill: oldlace;
      --footer: ghostwhite;
      --line: slategray;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101722;
        --ink: aliceblue;
        --muted: lightsteelblue;
        --border: #52647a;
        --card: #172333;
        --hardware: lightskyblue;
        --hardware-fill: #203451;
        --scale: lightgreen;
        --scale-fill: #183b32;
        --load: navajowhite;
        --load-fill: #49331f;
        --footer: #172333;
        --line: #9aabc0;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: auto;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      margin: auto;
      overflow: hidden;
      background: var(--page);
      border: 2px solid var(--border);
    }

    figcaption {
      padding: 14px;
      background: var(--footer);
      border-bottom: 2px solid var(--border);
    }

    h1 {
      margin: auto;
      font-size: 22px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .card {
      fill: var(--card);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .route,
    .pipeline {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .pipeline {
      stroke-width: 3px;
    }

    .hardware-route,
    .hardware-dot {
      stroke: var(--hardware);
      fill: var(--hardware);
    }

    .scale-route,
    .scale-dot {
      stroke: var(--scale);
      fill: var(--scale);
    }

    .load-route,
    .load-dot {
      stroke: var(--load);
      fill: var(--load);
    }

    .hardware-node {
      fill: var(--hardware-fill);
      stroke: var(--hardware);
    }

    .scale-node {
      fill: var(--scale-fill);
      stroke: var(--scale);
    }

    .load-node {
      fill: var(--load-fill);
      stroke: var(--load);
    }

    .choice {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .arrowhead {
      stroke: none;
    }

    .stage-title {
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .stage-prompt {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .choice-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .connector-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .footer-box {
      fill: var(--footer);
      stroke: var(--border);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .footer-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
    }

    .fallback-detail {
      fill: var(--muted);
      font-size: 15px;
      text-anchor: middle;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption>
      <h1 id="diagram-title">Порядок выбора: железо → масштаб → нагрузка</h1>
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 1200 420"
      width="1200"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <desc id="diagram-desc">
        Три последовательные развилки: выбор железа, масштаба пользователей и типа нагрузки.
      </desc>
    </svg>
  </figure>

  <script>
    const data = [
      {
        kind: "config",
        origin: [0, 0],
        scale: [1, 1],
        canvas: [1200, 420],
        zero: 0,
        cardY: 18,
        cardWidth: 370,
        cardHeight: 334,
        cardCenter: 185,
        cardRadius: 12,
        titleY: 48,
        promptY: 73,
        entryOffset: 20,
        branchOffset: 44,
        choiceOffset: 83,
        choiceWidth: 204,
        choiceHeight: 40,
        choiceRadius: 12,
        mergeOffset: 326,
        decisionY: 207,
        dotRadius: 6,
        arrowLength: 10,
        arrowHalf: 5,
        connectorLabelY: 190,
        footerX: 20,
        footerY: 366,
        footerWidth: 1160,
        footerHeight: 40,
        footerRadius: 12,
        footerTextX: 600,
        footerTextY: 386,
        fallbackX: 600,
        fallbackTitleY: 178,
        fallbackDetailY: 218,
        fallbackLastY: 250
      },
      {
        kind: "stage",
        x: 20,
        tone: "hardware",
        title: "СНАЧАЛА · ЖЕЛЕЗО",
        prompt: "может ли движок работать?",
        connector: "затем",
        connectorX: 382,
        options: [
          { label: "CPU", y: 111 },
          { label: "AMD", y: 175 },
          { label: "NVIDIA", y: 239 },
          { label: "Apple", y: 303 }
        ]
      },
      {
        kind: "stage",
        x: 415,
        tone: "scale",
        title: "ЗАТЕМ · МАСШТАБ",
        prompt: "может ли система расти?",
        connector: "потом",
        connectorX: 777,
        options: [
          { label: "1 пользователь", y: 111 },
          { label: "10–100 пользователей", y: 175 },
          { label: "100–10 000 пользователей", y: 239 },
          { label: "10 000+ пользователей", y: 303 }
        ]
      },
      {
        kind: "stage",
        x: 810,
        tone: "load",
        title: "ПОТОМ · НАГРУЗКА",
        prompt: "подходит ли для этой работы?",
        connector: "",
        connectorX: 1172,
        options: [
          { label: "чат", y: 111 },
          { label: "агент", y: 175 },
          { label: "RAG", y: 239 },
          { label: "длинный контекст", y: 303 }
        ]
      }
    ];

    const [config, ...stages] = data;
    const [originX, originY] = config.origin;
    const [scaleX, scaleY] = config.scale;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const root = document.getElementById("diagram");
    const description = document.getElementById("diagram-desc");
    const namespace = "http://www.w3.org/2000/svg";

    function element(name, attributes, content) {
      const node = document.createElementNS(namespace, name);

      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });

      if (content) {
        node.textContent = content;
      }

      return node;
    }

    function rectangle(x, y, width, height, radius, className) {
      return element("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(x + radius) - sx(x),
        ry: sy(y + radius) - sy(y),
        class: className
      });
    }

    function line(xStart, yStart, xEnd, yEnd, className) {
      return element("line", {
        x1: sx(xStart),
        y1: sy(yStart),
        x2: sx(xEnd),
        y2: sy(yEnd),
        class: className
      });
    }

    function dot(x, y, className) {
      return element("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(config.zero + config.dotRadius) - sx(config.zero),
        class: className
      });
    }

    function label(x, y, value, className, anchor) {
      return element("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, value);
    }

    function arrow(xStart, yStart, xEnd, yEnd, lineClass, headClass) {
      const group = element("g", {});
      const deltaX = xEnd - xStart;
      const deltaY = yEnd - yStart;
      const length = Math.hypot(deltaX, deltaY);
      const unitX = deltaX / length;
      const unitY = deltaY / length;
      const baseX = xEnd - unitX * config.arrowLength;
      const baseY = yEnd - unitY * config.arrowLength;
      const sideX = -unitY * config.arrowHalf;
      const sideY = unitX * config.arrowHalf;

      const points = [
        `${sx(xEnd)},${sy(yEnd)}`,
        `${sx(baseX + sideX)},${sy(baseY + sideY)}`,
        `${sx(baseX - sideX)},${sy(baseY - sideY)}`
      ].join(" ");

      group.append(
        line(xStart, yStart, xEnd, yEnd, lineClass),
        element("polygon", {
          points,
          class: `arrowhead ${headClass}`
        })
      );

      return group;
    }

    try {
      const cardsLayer = element("g", { "aria-hidden": "true" });
      const routesLayer = element("g", { "aria-hidden": "true" });
      const nodesLayer = element("g", {});
      const labelsLayer = element("g", {});

      stages.forEach(stage => {
        cardsLayer.append(
          rectangle(
            stage.x,
            config.cardY,
            config.cardWidth,
            config.cardHeight,
            config.cardRadius,
            "card"
          )
        );
      });

      stages.slice(config.zero, -scale.x).forEach((stage, index) => {
        const nextStage = stages[index + scale.x];
        const mergeX = stage.x + config.mergeOffset;
        const entryX = nextStage.x + config.entryOffset;

        routesLayer.append(
          arrow(
            mergeX,
            config.decisionY,
            entryX,
            config.decisionY,
            "pipeline",
            `${nextStage.tone}-dot`
          )
        );

        labelsLayer.append(
          label(
            stage.connectorX,
            config.connectorLabelY,
            stage.connector,
            "connector-label",
            "middle"
          )
        );
      });

      stages.forEach(stage => {
        const entryX = stage.x + config.entryOffset;
        const branchX = stage.x + config.branchOffset;
        const choiceX = stage.x + config.choiceOffset;
        const choiceEndX = choiceX + config.choiceWidth;
        const mergeX = stage.x + config.mergeOffset;
        const centerX = stage.x + config.cardCenter;
        const routeClass = `route ${stage.tone}-route`;
        const dotClass = `${stage.tone}-dot`;
        const nodeClass = `choice ${stage.tone}-node`;

        routesLayer.append(
          arrow(
            entryX,
            config.decisionY,
            branchX,
            config.decisionY,
            routeClass,
            dotClass
          )
        );

        stage.options.forEach(option => {
          const optionTop = option.y - config.choiceHeight / scale.x;

          routesLayer.append(
            arrow(
              branchX,
              config.decisionY,
              choiceX,
              option.y,
              routeClass,
              dotClass
            ),
            line(
              choiceEndX,
              option.y,
              mergeX,
              config.decisionY,
              routeClass
            )
          );

          nodesLayer.append(
            rectangle(
              choiceX,
              optionTop,
              config.choiceWidth,
              config.choiceHeight,
              config.choiceRadius,
              nodeClass
            )
          );

          labelsLayer.append(
            label(
              choiceX + config.choiceWidth / scale.y,
              option.y,
              option.label,
              "choice-label",
              "middle"
            )
          );
        });

        nodesLayer.append(
          dot(entryX, config.decisionY, dotClass),
          dot(branchX, config.decisionY, dotClass),
          dot(mergeX, config.decisionY, dotClass)
        );

        labelsLayer.append(
          label(
            centerX,
            config.titleY,
            stage.title,
            `stage-title ${stage.tone}-dot`,
            "middle"
          ),
          label(
            centerX,
            config.promptY,
            stage.prompt,
            "stage-prompt",
            "middle"
          )
        );
      });

      const footerLayer = element("g", {});
      footerLayer.append(
        rectangle(
          config.footerX,
          config.footerY,
          config.footerWidth,
          config.footerHeight,
          config.footerRadius,
          "footer-box"
        ),
        label(
          config.footerTextX,
          config.footerTextY,
          "Отсеиваем по порядку: совместимость → масштабирование → профиль запросов",
          "footer-text",
          "middle"
        )
      );

      root.append(
        cardsLayer,
        routesLayer,
        nodesLayer,
        labelsLayer,
        footerLayer
      );
    } catch (error) {
      const fallbackTitle = label(
        config.fallbackX,
        config.fallbackTitleY,
        "Сначала железо, затем масштаб, потом нагрузка",
        "fallback",
        "middle"
      );

      const fallbackDetail = label(
        config.fallbackX,
        config.fallbackDetailY,
        "Железо: CPU, AMD, NVIDIA или Apple · Масштаб: от 1 до 10 000+ пользователей",
        "fallback-detail",
        "middle"
      );

      const fallbackLast = label(
        config.fallbackX,
        config.fallbackLastY,
        "Нагрузка: чат, агент, RAG или длинный контекст",
        "fallback-detail",
        "middle"
      );

      root.replaceChildren(
        description,
        fallbackTitle,
        fallbackDetail,
        fallbackLast
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
