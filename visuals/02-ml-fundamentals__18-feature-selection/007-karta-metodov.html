<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта методов отбора признаков</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f8fc;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --ink: #172033;
    --muted: #5f6b7d;
    --border: #cbd5e1;
    --root-fill: #172033;
    --root-ink: #ffffff;
    --filter: #16836f;
    --filter-soft: #e4f5f0;
    --wrapper: #7657c8;
    --wrapper-soft: #f0ebff;
    --embedded: #c66b20;
    --embedded-soft: #fff0df;
    --fallback: #a33a45;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101521;
      --panel: #171e2c;
      --panel-soft: #1c2535;
      --ink: #eef3fb;
      --muted: #b3bfd0;
      --border: #3b485c;
      --root-fill: #e8eef8;
      --root-ink: #172033;
      --filter: #58cdb6;
      --filter-soft: #153c37;
      --wrapper: #aa91f0;
      --wrapper-soft: #30284d;
      --embedded: #f0a15e;
      --embedded-soft: #4a3020;
      --fallback: #ff9aa5;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: auto;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    margin: auto;
    max-width: 1000px;
    background: var(--panel);
    border: 1px solid var(--border);
  }

  figcaption {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--ink);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--panel);
  }

  .connector {
    fill: none;
    stroke-linecap: round;
    stroke-width: 2px;
  }

  .connector.filter { stroke: var(--filter); }
  .connector.wrapper { stroke: var(--wrapper); }
  .connector.embedded { stroke: var(--embedded); }

  .root-card {
    fill: var(--root-fill);
    stroke: var(--root-fill);
    stroke-width: 2px;
  }

  .root-title {
    fill: var(--root-ink);
    font-size: 18px;
    font-weight: bold;
  }

  .root-note {
    fill: var(--root-ink);
    font-size: 12px;
  }

  .category-card,
  .method-card {
    stroke-width: 2px;
  }

  .category-card.filter,
  .method-card.filter {
    fill: var(--filter-soft);
    stroke: var(--filter);
  }

  .category-card.wrapper,
  .method-card.wrapper {
    fill: var(--wrapper-soft);
    stroke: var(--wrapper);
  }

  .category-card.embedded,
  .method-card.embedded {
    fill: var(--embedded-soft);
    stroke: var(--embedded);
  }

  .category-title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .category-note {
    fill: var(--muted);
    font-size: 12px;
  }

  .method-label {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .method-note {
    fill: var(--muted);
    font-size: 12px;
  }

  .junction.filter { fill: var(--filter); }
  .junction.wrapper { fill: var(--wrapper); }
  .junction.embedded { fill: var(--embedded); }

  .fallback {
    fill: var(--fallback);
    font-size: 16px;
    font-weight: bold;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <figcaption id="diagram-title">Карта методов отбора признаков</figcaption>
  <svg id="map"
       width="1000"
       height="440"
       viewBox="0 0 1000 440"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">
      Дерево делит методы отбора признаков на фильтры, обёртки и встроенные
      методы — по моменту и механизму принятия решения.
    </desc>
  </svg>
</figure>

<script>
const diagram = Object.freeze({
  canvas: { width: 1000, height: 440 },
  origin: { x: 24, y: 8 },
  scale: { x: 1, y: 1 },
  metrics: {
    zero: 0,
    radius: 10,
    junctionRadius: 4,
    lineWidth: 2,
    labelPadding: 8,
    fontSize: 14
  },
  root: {
    x: 336, y: 12, x2: 616, y2: 68,
    cx: 476, titleY: 34, noteY: 52,
    title: "Отбор признаков",
    note: "когда и кто принимает решение"
  },
  categories: [
    {
      kind: "filter",
      x: 40, y: 106, x2: 324, y2: 178,
      cx: 182, titleY: 130, noteY: 153,
      title: "Фильтры",
      note: "до итоговой модели · статистика"
    },
    {
      kind: "wrapper",
      x: 334, y: 106, x2: 618, y2: 178,
      cx: 476, titleY: 130, noteY: 153,
      title: "Обёртки",
      note: "по качеству модели · переобучения"
    },
    {
      kind: "embedded",
      x: 628, y: 106, x2: 912, y2: 178,
      cx: 770, titleY: 130, noteY: 153,
      title: "Встроенные",
      note: "во время обучения · механизм модели"
    }
  ],
  methods: [
    {
      kind: "filter",
      x: 40, y: 216, x2: 324, y2: 258,
      cx: 182, cy: 237,
      label: "Порог дисперсии"
    },
    {
      kind: "filter",
      x: 40, y: 270, x2: 324, y2: 312,
      cx: 182, cy: 291,
      label: "Корреляционный фильтр"
    },
    {
      kind: "filter",
      x: 40, y: 324, x2: 324, y2: 366,
      cx: 182, cy: 345,
      label: "Взаимная информация"
    },
    {
      kind: "filter",
      x: 40, y: 378, x2: 324, y2: 420,
      cx: 182, cy: 399,
      label: "Хи-квадрат"
    },
    {
      kind: "wrapper",
      x: 334, y: 244, x2: 618, y2: 298,
      cx: 476, labelY: 263, noteY: 282,
      label: "RFE",
      note: "рекурсивное исключение"
    },
    {
      kind: "wrapper",
      x: 334, y: 326, x2: 618, y2: 380,
      cx: 476, labelY: 345, noteY: 364,
      label: "Прямой отбор",
      note: "добавление признаков"
    },
    {
      kind: "embedded",
      x: 628, y: 244, x2: 912, y2: 298,
      cx: 770, labelY: 263, noteY: 282,
      label: "L1 / Lasso",
      note: "обнуление коэффициентов"
    },
    {
      kind: "embedded",
      x: 628, y: 326, x2: 912, y2: 380,
      cx: 770, labelY: 345, noteY: 364,
      label: "Важность признаков в деревьях",
      note: "полезность разбиений"
    }
  ],
  categoryLinks: [
    {
      kind: "filter",
      points: [
        { x: 476, y: 68 },
        { x: 476, y: 88 },
        { x: 182, y: 84 },
        { x: 182, y: 106 }
      ]
    },
    {
      kind: "wrapper",
      points: [
        { x: 476, y: 68 },
        { x: 476, y: 86 },
        { x: 476, y: 88 },
        { x: 476, y: 106 }
      ]
    },
    {
      kind: "embedded",
      points: [
        { x: 476, y: 68 },
        { x: 476, y: 88 },
        { x: 770, y: 84 },
        { x: 770, y: 106 }
      ]
    }
  ],
  methodLinks: [
    {
      kind: "filter",
      points: [
        { x: 182, y: 178 },
        { x: 182, y: 194 },
        { x: 182, y: 200 },
        { x: 182, y: 216 }
      ]
    },
    {
      kind: "filter",
      points: [
        { x: 182, y: 178 },
        { x: 150, y: 206 },
        { x: 150, y: 242 },
        { x: 182, y: 270 }
      ]
    },
    {
      kind: "filter",
      points: [
        { x: 182, y: 178 },
        { x: 118, y: 226 },
        { x: 118, y: 276 },
        { x: 182, y: 324 }
      ]
    },
    {
      kind: "filter",
      points: [
        { x: 182, y: 178 },
        { x: 86, y: 246 },
        { x: 86, y: 310 },
        { x: 182, y: 378 }
      ]
    },
    {
      kind: "wrapper",
      points: [
        { x: 476, y: 178 },
        { x: 476, y: 202 },
        { x: 476, y: 220 },
        { x: 476, y: 244 }
      ]
    },
    {
      kind: "wrapper",
      points: [
        { x: 476, y: 178 },
        { x: 432, y: 224 },
        { x: 432, y: 280 },
        { x: 476, y: 326 }
      ]
    },
    {
      kind: "embedded",
      points: [
        { x: 770, y: 178 },
        { x: 770, y: 202 },
        { x: 770, y: 220 },
        { x: 770, y: 244 }
      ]
    },
    {
      kind: "embedded",
      points: [
        { x: 770, y: 178 },
        { x: 814, y: 224 },
        { x: 814, y: 280 },
        { x: 770, y: 326 }
      ]
    }
  ],
  junctions: [
    { kind: "filter", x: 182, y: 194 },
    { kind: "wrapper", x: 476, y: 202 },
    { kind: "embedded", x: 770, y: 202 }
  ],
  fallback: {
    x: 476,
    y: 220,
    text: "Схема: отбор признаков → Фильтры, Обёртки и Встроенные методы"
  }
});

const origin = diagram.origin;
const scale = diagram.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("map");
  const namespace = "http://www.w3.org/2000/svg";

  const make = (name, attributes, content) => {
    const node = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, value]) => {
      node.setAttribute(key, String(value));
    });
    if (content !== undefined) node.textContent = content;
    return node;
  };

  const roundedRect = (item, className) => make("rect", {
    x: sx(item.x),
    y: sy(item.y),
    width: sx(item.x2) - sx(item.x),
    height: sy(item.y2) - sy(item.y),
    rx: sx(diagram.metrics.radius) - sx(diagram.metrics.zero),
    class: className
  });

  const centeredText = (x, y, className, content) => make("text", {
    x: sx(x),
    y: sy(y),
    "text-anchor": "middle",
    "dominant-baseline": "middle",
    class: className
  }, content);

  const curve = link => {
    const [start, firstControl, secondControl, end] = link.points;
    return make("path", {
      d: [
        "M", sx(start.x), sy(start.y),
        "C", sx(firstControl.x), sy(firstControl.y),
        sx(secondControl.x), sy(secondControl.y),
        sx(end.x), sy(end.y)
      ].join(" "),
      class: `connector ${link.kind}`
    });
  };

  const linkLayer = make("g", { "aria-hidden": "true" });
  diagram.categoryLinks.forEach(link => linkLayer.append(curve(link)));
  diagram.methodLinks.forEach(link => linkLayer.append(curve(link)));
  diagram.junctions.forEach(point => {
    linkLayer.append(make("circle", {
      cx: sx(point.x),
      cy: sy(point.y),
      r: sx(diagram.metrics.junctionRadius) - sx(diagram.metrics.zero),
      class: `junction ${point.kind}`
    }));
  });
  svg.append(linkLayer);

  const rootLayer = make("g", {});
  rootLayer.append(roundedRect(diagram.root, "root-card"));
  rootLayer.append(centeredText(
    diagram.root.cx,
    diagram.root.titleY,
    "root-title",
    diagram.root.title
  ));
  rootLayer.append(centeredText(
    diagram.root.cx,
    diagram.root.noteY,
    "root-note",
    diagram.root.note
  ));
  svg.append(rootLayer);

  const categoryLayer = make("g", {});
  diagram.categories.forEach(item => {
    const group = make("g", {});
    group.append(roundedRect(item, `category-card ${item.kind}`));
    group.append(centeredText(
      item.cx,
      item.titleY,
      "category-title",
      item.title
    ));
    group.append(centeredText(
      item.cx,
      item.noteY,
      "category-note",
      item.note
    ));
    categoryLayer.append(group);
  });
  svg.append(categoryLayer);

  const methodLayer = make("g", {});
  diagram.methods.forEach(item => {
    const group = make("g", {});
    group.append(roundedRect(item, `method-card ${item.kind}`));
    group.append(centeredText(
      item.cx,
      item.labelY === undefined ? item.cy : item.labelY,
      "method-label",
      item.label
    ));
    if (item.note !== undefined) {
      group.append(centeredText(
        item.cx,
        item.noteY,
        "method-note",
        item.note
      ));
    }
    methodLayer.append(group);
  });
  svg.append(methodLayer);
} catch (error) {
  const svg = document.getElementById("map");
  const namespace = "http://www.w3.org/2000/svg";
  const fallback = document.createElementNS(namespace, "text");
  fallback.setAttribute("x", String(sx(diagram.fallback.x)));
  fallback.setAttribute("y", String(sy(diagram.fallback.y)));
  fallback.setAttribute("text-anchor", "middle");
  fallback.setAttribute("dominant-baseline", "middle");
  fallback.setAttribute("class", "fallback");
  fallback.textContent = diagram.fallback.text;
  svg.append(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
