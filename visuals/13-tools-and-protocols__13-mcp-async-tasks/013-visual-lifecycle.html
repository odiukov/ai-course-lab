<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Жизненный цикл задачи</title>
<style>
  :root{
    --bg:#fbfbfd; --ink:#1d2430; --muted:#5b6675;
    --line:#3a4658; --start:#1f6feb; --startbg:#e8f0fe;
    --loop:#8a6100; --loopbg:#fdf3dc;
    --term:#a4262c; --termbg:#fbeaea;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161c; --ink:#e6ebf2; --muted:#9aa6b6;
      --line:#8b98aa; --start:#79b0ff; --startbg:#17263c;
      --loop:#e2b649; --loopbg:#2e2513;
      --term:#ff9b96; --termbg:#33191a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{background:var(--bg);padding:10px 12px 6px;max-width:1000px}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fb{color:var(--muted);font-size:13px;white-space:pre-wrap}
  text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  text.ru{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
</style>
<div class="wrap">
  <h2>Жизненный цикл задачи: одна точка входа, пять стрелок</h2>
  <svg id="d" viewBox="0 0 720 340" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Схема переходов состояний задачи"></svg>
  <div class="fb" id="fb" hidden></div>
</div>
<script>
(function(){
  var svg=document.getElementById("d"), fb=document.getElementById("fb");
  try{
    /* ---- данные схемы (логические координаты) ---- */
    var NODES=[
      {label:"working",        x: 0.0, y: 0.0, w:2.0, h:0.7, kind:"start"},
      {label:"input_required", x:-3.5, y: 0.0, w:2.5, h:0.7, kind:"loop"},
      {label:"completed",      x: 3.4, y: 1.4, w:2.3, h:0.7, kind:"term"},
      {label:"failed",         x: 3.4, y: 0.0, w:2.3, h:0.7, kind:"term"},
      {label:"cancelled",      x: 3.4, y:-1.4, w:2.3, h:0.7, kind:"term"}
    ];
    var EDGES=[
      {n:"1", a:[-1.00, 0.18], b:[-2.25, 0.18], badge:[-1.625, 0.52], kind:"loop"},
      {n:"2", a:[ 1.00, 0.28], b:[ 2.25, 1.12], badge:[ 1.35, 0.98], kind:"term"},
      {n:"3", a:[ 1.00, 0.00], b:[ 2.25, 0.00], badge:[ 1.62, 0.24], kind:"term"},
      {n:"4", a:[ 1.00,-0.28], b:[ 2.25,-1.12], badge:[ 1.35,-0.98], kind:"term"},
      {n:"5", a:[-2.25,-0.18], b:[-1.00,-0.18], badge:[-1.625,-0.52], kind:"loop"}
    ];
    var ENTRY={a:[0,1.85], b:[0,0.35]};
    var LEGEND=[
      {at:[-4.75,-2.02], t:"Стрелок пять. 1 — в input_required, 2 — в completed, 3 — в failed, 4 — в cancelled, 5 — обратно в working."},
      {at:[-4.75,-2.32], t:"completed / failed / cancelled — терминальные, обратных стрелок нет. Пунктир — точка входа, а не переход."}
    ];
    var HEAD=0.22, HALF=0.11, RB=0.15;   /* наконечник и бэйдж, логические единицы */

    /* ---- одна пара функций перевода ---- */
    var origin={x:360, y:165}, scale=70;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    function el(n,a){var e=document.createElementNS("http://www.w3.org/2000/svg",n);
      for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function txt(n,x,y,s,anchor,size,cls){
      var t=el("text",{x:x,y:y,"text-anchor":anchor,"font-size":size,fill:"var(--"+cls+")"});
      if(n)t.setAttribute("class",n); t.textContent=s; return t;}

    /* фон — явный, чтобы подписи не пропали */
    el("rect",{x:0,y:0,width:720,height:340,fill:"var(--bg)"});

    /* стрелки */
    EDGES.concat([{n:null,a:ENTRY.a,b:ENTRY.b,kind:"entry"}]).forEach(function(e){
      var col = e.kind==="entry" ? "muted" : (e.kind==="loop" ? "loop" : "term");
      var dx=e.b[0]-e.a[0], dy=e.b[1]-e.a[1], len=Math.sqrt(dx*dx+dy*dy);
      var ux=dx/len, uy=dy/len, px=-uy, py=ux;
      var base=[e.b[0]-ux*HEAD, e.b[1]-uy*HEAD];
      var l=el("line",{x1:sx(e.a[0]),y1:sy(e.a[1]),x2:sx(base[0]),y2:sy(base[1]),
        stroke:"var(--"+col+")","stroke-width":2,"stroke-linecap":"round"});
      if(e.kind==="entry")l.setAttribute("stroke-dasharray","6 5");
      el("polygon",{fill:"var(--"+col+")",points:
        sx(e.b[0])+","+sy(e.b[1])+" "+
        sx(base[0]+px*HALF)+","+sy(base[1]+py*HALF)+" "+
        sx(base[0]-px*HALF)+","+sy(base[1]-py*HALF)});
    });

    /* бэйджи номеров: у хвоста/сбоку, не у наконечника */
    EDGES.forEach(function(e){
      var r=sx(RB)-sx(0);
      el("circle",{cx:sx(e.badge[0]),cy:sy(e.badge[1]),r:r,
        fill:"var(--bg)",stroke:"var(--"+(e.kind==="loop"?"loop":"term")+")","stroke-width":1.5});
      var t=txt(null,sx(e.badge[0]),sy(e.badge[1]),e.n,"middle",11,"ink");
      t.setAttribute("dominant-baseline","central");
    });

    /* узлы */
    NODES.forEach(function(n){
      var x0=sx(n.x-n.w/2), y0=sy(n.y+n.h/2);
      var c = n.kind==="start"?"start":(n.kind==="loop"?"loop":"term");
      el("rect",{x:x0,y:y0,
        width:sx(n.x+n.w/2)-x0, height:sy(n.y-n.h/2)-y0,
        rx:sx(0.12)-sx(0),
        fill:"var(--"+c+"bg)", stroke:"var(--"+c+")",
        "stroke-width": n.kind==="term"?2.5:2});
      var t=txt(null,sx(n.x),sy(n.y),n.label,"middle",15,"ink");
      t.setAttribute("dominant-baseline","central");
    });

    /* подпись точки входа — над хвостом пунктирной стрелки */
    txt("ru",sx(ENTRY.a[0]),sy(ENTRY.a[1])-8,'точка входа: _meta.task → state "working"',"middle",12,"muted");

    /* легенда */
    LEGEND.forEach(function(g){ txt("ru",sx(g.at[0]),sy(g.at[1]),g.t,"start",12,"muted"); });
  }catch(err){
    svg.setAttribute("hidden","");
    fb.removeAttribute("hidden");
    fb.textContent=
      "Схема не построилась. Что она должна показывать:\n"+
      "• точка входа одна: запрос с _meta.task рождает задачу в состоянии working;\n"+
      "• из working четыре стрелки: в input_required, completed, failed, cancelled;\n"+
      "• обратная стрелка одна: из input_required назад в working (петля elicitation);\n"+
      "• completed, failed, cancelled терминальные — стрелок из них нет.";
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
