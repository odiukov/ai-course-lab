<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>78% против 85% на GSM8K</title>
<style>
  :root{
    --bg:#f6f7fb; --fg:#1a1a2e; --muted:#5a6072; --grid:#c8cddb;
    --zero:#e94560; --few:#2f9e52; --zerofill:#f7d3da; --fewfill:#cdead6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12131c; --fg:#eef0f7; --muted:#9aa1b5; --grid:#343a4d;
      --zero:#e94560; --few:#51cf66; --zerofill:#3a1d27; --fewfill:#1d3626;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:12px 14px 16px}
  h2{font-size:16px;margin:0 0 8px;font-weight:650}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fallback{font-size:14px;line-height:1.5;color:var(--muted)}
</style>
<div class="wrap">
  <h2>Zero-shot 78% против few-shot 85% на GSM8K</h2>
  <div id="host"><noscript class="fallback">Zero-shot («Classify this review») — 78% на GSM8K, 22 задачи из 100 в брак. Few-shot («Here are 3 examples…») — 85%, 15 задач в брак.</noscript></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    var DATA = [
      {key:'z', x:1, acc:78, name:'Zero-shot', prompt:'«Classify this review»', fail:22, cls:'zero'},
      {key:'f', x:3, acc:85, name:'Few-shot',  prompt:'«Here are 3 examples…»', fail:15, cls:'few'}
    ];

    var W = 900, H = 470;                 // холст
    var PAD = 6, LW = 1.6, FS = 14, FSB = 26, FSS = 12;

    var origin = {x:150, y:400};          // sx(0), sy(0)
    var scale  = {x:150, y:3.6};

    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function txt(x,y,s,a,o){
      var t=el('text',{x:x,y:y,'text-anchor':a.anchor||'middle','font-size':a.size||FS,
        'font-weight':a.weight||400,fill:a.fill||'currentColor'});
      t.textContent=s; o.appendChild(t); return t;
    }

    var svg = el('svg',{viewBox:'0 0 '+W+' '+H,preserveAspectRatio:'xMidYMid meet',
      role:'img','aria-label':'Zero-shot 78 процентов против few-shot 85 процентов на GSM8K'});
    svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'var(--bg)'}));

    // сетка и ось значений
    var TICKS=[0,25,50,75,100];
    TICKS.forEach(function(v){
      svg.appendChild(el('line',{x1:sx(0),y1:sy(v),x2:sx(4),y2:sy(v),
        stroke:'var(--grid)','stroke-width':LW,'stroke-dasharray':v?'4 6':''}));
      txt(sx(0)-PAD*2, sy(v)+5, v+'%', {anchor:'end',size:FSS,fill:'var(--muted)'}, svg);
    });
    svg.appendChild(el('line',{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(100),
      stroke:'var(--grid)','stroke-width':LW}));

    var HW = 0.42; // полуширина колонки в единицах x

    DATA.forEach(function(d){
      var c='var(--'+d.cls+')', f='var(--'+d.cls+'fill)';
      svg.appendChild(el('rect',{x:sx(d.x-HW),y:sy(d.acc),
        width:sx(d.x+HW)-sx(d.x-HW),height:sy(0)-sy(d.acc),
        fill:f,stroke:c,'stroke-width':LW,rx:4}));
      txt(sx(d.x), sy(d.acc)-PAD*3, d.acc+'%', {size:FSB,weight:700,fill:c}, svg);
      txt(sx(d.x), sy(0)+PAD*4, d.name, {size:FS,weight:650}, svg);
      txt(sx(d.x), sy(0)+PAD*7, d.prompt, {size:FSS,fill:'var(--muted)'}, svg);
      txt(sx(d.x), sy(0)+PAD*10, 'брак: '+d.fail+' из 100', {size:FSS,fill:c}, svg);
    });

    // разрыв: скоба между вершинами колонок
    var yz=sy(DATA[0].acc), yf=sy(DATA[1].acc), xb=sx(2);
    svg.appendChild(el('path',{d:'M '+sx(DATA[0].x+HW)+' '+yz+' H '+xb+' V '+yf+' H '+sx(DATA[1].x-HW),
      fill:'none',stroke:'var(--muted)','stroke-width':LW,'stroke-dasharray':'3 5'}));

    // стрелка разрыва: хвост внизу, подпись у хвоста
    var ax=sx(2), a0=sy(DATA[0].acc), a1=sy(DATA[1].acc), head=7;
    svg.appendChild(el('line',{x1:ax,y1:a0,x2:ax,y2:a1+head,
      stroke:'var(--few)','stroke-width':LW+0.6}));
    svg.appendChild(el('polygon',{
      points:[ax,a1, ax-head*0.75,a1+head, ax+head*0.75,a1+head].join(' '),
      fill:'var(--few)'}));
    txt(ax+PAD*2, a0-PAD, '+7 пунктов', {anchor:'start',size:FS,weight:650,fill:'var(--few)'}, svg);

    // вывод: подпись у хвоста, ниже колонок, в две строки
    txt(sx(2), sy(-14), 'треть брака исчезла: 22 ошибки → 15',
      {size:FS,weight:650}, svg);
    txt(sx(2), sy(-21), 'та же модель, тот же вопрос — только три разобранных примера в начале',
      {size:FSS,fill:'var(--muted)'}, svg);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема не построилась. Она должна показывать две колонки на GSM8K: '
      + 'zero-shot («Classify this review») — 78%, то есть 22 ошибки из 100; '
      + 'few-shot («Here are 3 examples…») — 85%, то есть 15 ошибок. '
      + 'Разрыв 7 пунктов = треть брака исчезла.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
