<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>GSM8K: 78 → 91 → 95</title>
<style>
  :root{
    --bg:#ffffff; --fg:#161a24; --muted:#5a6072; --grid:#dfe3ea;
    --c0:#8b98ab; --c1:#e8850c; --c2:#2f9e50; --inbar:#ffffff; --arrow:#c2185b;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#11131a; --fg:#eef1f6; --muted:#a3abbd; --grid:#2a3040;
      --c0:#5f6d83; --c1:#ffa94d; --c2:#51cf66; --inbar:#0e1016; --arrow:#ff6b9d;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg); color:var(--fg); padding:10px 12px 14px;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .ttl{margin:0 0 6px; font-size:15px; font-weight:600}
  .sub{margin:0 0 8px; font-size:12px; color:var(--muted)}
  svg{display:block; width:100%; height:auto; max-height:520px}
  .fb{font-size:13px; line-height:1.5; color:var(--fg); white-space:pre-wrap}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
<div class="wrap">
  <h2 class="ttl">GSM8K: где у приёма есть куда расти</h2>
  <p class="sub">Прирост от CoT тем больше, чем больше нерешённых задач оставалось до него.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var DATA = [
      { model:'GPT-4o',      v:[78,91,95] },
      { model:'GPT-5',       v:[94,97,98] },
      { model:'Llama 4 70B', v:[80,89,94] }
    ];
    var COLS  = ['Zero-Shot','Zero-Shot CoT','Few-Shot CoT'];
    var TICKS = [0,25,50,75,100];

    /* ---- единственный origin и единственный scale ---- */
    var origin = [90, 430];
    var scale  = 4;
    function sx(x){ return origin[0] + x * scale; }
    function sy(y){ return origin[1] - y * scale; }

    /* ---- раскладка в единицах данных ---- */
    var GROUP=50, BAR=10, STEP=13, PAD=12, XMAX=150;
    var TRIM=1.6, HEAD=3, HW=1.9;

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 720 490');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function line(x1,y1,x2,y2,stroke,w){
      el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:stroke,'stroke-width':w,'stroke-linecap':'round'});
    }
    function txt(x,y,s,anchor,fill,size,dx,dy,weight){
      var t=el('text',{x:sx(x)+(dx||0),y:sy(y)+(dy||0),'text-anchor':anchor,
        fill:fill,'font-size':size,'font-weight':weight||'400'});
      t.appendChild(document.createTextNode(s)); return t;
    }
    function rect(x,y,w,h,fill){
      el('rect',{x:sx(x),y:sy(y+h),width:sx(x+w)-sx(x),height:sy(y)-sy(y+h),fill:fill,rx:2});
    }
    function arrow(ax,ay,bx,by,stroke,w){
      var dx=bx-ax, dy=by-ay, L=Math.hypot(dx,dy);
      var ux=dx/L, uy=dy/L, px=-uy, py=ux;
      var s=[ax+ux*TRIM, ay+uy*TRIM], e=[bx-ux*TRIM, by-uy*TRIM];
      var b=[e[0]-ux*HEAD, e[1]-uy*HEAD];
      line(s[0],s[1],b[0],b[1],stroke,w);
      el('polygon',{fill:stroke,points:
        sx(e[0])+','+sy(e[1])+' '+
        sx(b[0]+px*HW)+','+sy(b[1]+py*HW)+' '+
        sx(b[0]-px*HW)+','+sy(b[1]-py*HW)});
    }

    var C=['var(--c0)','var(--c1)','var(--c2)'];
    var FG='var(--fg)', MU='var(--muted)', GR='var(--grid)', AR='var(--arrow)', IN='var(--inbar)';

    /* сетка + шкала слева */
    TICKS.forEach(function(t){
      line(0,t,XMAX,t,GR,1);
      txt(0,t,t+'%','end',MU,12,-8,4);
    });
    /* оси */
    line(0,0,XMAX,0,MU,1.5);
    line(0,0,0,TICKS[TICKS.length-1],MU,1.5);
    var lab=txt(0,TICKS[TICKS.length-1]/2,'точность, %','middle',MU,12,0,0);
    lab.setAttribute('x',sx(-14)); lab.setAttribute('y',sy(TICKS[TICKS.length-1]/2));
    lab.setAttribute('transform','rotate(-90 '+sx(-14)+' '+sy(TICKS[TICKS.length-1]/2)+')');

    /* столбики, значения, приросты */
    DATA.forEach(function(row,g){
      var g0=g*GROUP;
      row.v.forEach(function(val,i){
        var cx=g0+PAD+i*STEP;
        rect(cx-BAR/2, 0, BAR, val, C[i]);
        txt(cx, val, String(val), 'middle', IN, 12, 0, 15, '600');
      });
      for(var i=0;i<row.v.length-1;i++){
        var x1=g0+PAD+i*STEP, x2=g0+PAD+(i+1)*STEP;
        var y1=row.v[i], y2=row.v[i+1];
        arrow(x1,y1,x2,y2,AR,1.6);
        txt((x1+x2)/2, Math.max(y1,y2)+4, '+'+(y2-y1), 'middle', AR, 12, 0, 0, '700');
      }
      txt(g0+PAD+STEP, 0, row.model, 'middle', FG, 13, 0, 20, '600');
    });

    /* легенда отдельной строкой под схемой */
    COLS.forEach(function(name,i){
      var lx=i*(GROUP-2)+2;
      rect(lx, -12, 5, 4, C[i]);
      txt(lx+7, -12, name, 'start', MU, 12, 0, -2);
    });

    host.appendChild(svg);
  }catch(err){
    host.innerHTML='';
    var p=document.createElement('div');
    p.className='fb';
    p.textContent=
      'Схема (не отрисовалась) — GSM8K, точность в %:\n'+
      'GPT-4o: Zero-Shot 78 → Zero-Shot CoT 91 (+13) → Few-Shot CoT 95 (+4)\n'+
      'GPT-5: 94 → 97 (+3) → 98 (+1)\n'+
      'Llama 4 70B: 80 → 89 (+9) → 94 (+5)\n'+
      'Смысл: второй столбец даёт больший прирост, чем третий, и тем больший, '+
      'чем ниже стартовая точность — приём забирает свободное место, а не создаёт его.';
    host.appendChild(p);
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
