<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Спектр температуры</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1a2e; --muted:#5b6472; --line:#8892a4;
    --cold:#2563eb; --mid:#0d9488; --warm:#d97706; --hot:#db2777; --danger:#e94560;
    --card:#f6f8fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#111219; --fg:#eef1f6; --muted:#a7b0c0; --line:#6b7688;
      --cold:#60a5fa; --mid:#51cf66; --warm:#ffa500; --hot:#ff6b81; --danger:#ff6b81;
      --card:#1a1a2e;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:12px;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .ttl{font-size:15px;font-weight:600;margin:0 0 6px}
  .sub{font-size:12px;color:var(--muted);margin:0 0 10px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{font-size:13px;color:var(--fg);background:var(--card);padding:10px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <p class="ttl">Спектр температуры</p>
  <p class="sub">Один правильный ответ — влево. Много допустимых — вправо.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var TICKS = [
      {t:0,   s:'0.0'}, {t:0.2, s:'0.2'}, {t:0.3, s:'0.3'},
      {t:0.5, s:'0.5'}, {t:0.7, s:'0.7'}, {t:1.0, s:'1.0'}, {t:1.5, s:'1.5'}
    ];
    var ZONES = [
      {a:0,   b:0.2, at:0,   anchor:'start', row:0.50, c:'var(--cold)',
       s:'0.0–0.2 · детерминизм: извлечение, классификация, код'},
      {a:0.3, b:0.5, at:0.3, anchor:'start', row:0.38, c:'var(--mid)',
       s:'0.3–0.5 · код, переписывание, краткие пересказы'},
      {a:0.6, b:0.8, at:0.6, anchor:'start', row:0.26, c:'var(--warm)',
       s:'0.7 · диалог, объяснения, письма'},
      {a:1.0, b:1.5, at:1.5, anchor:'end',   row:0.14, c:'var(--hot)',
       s:'1.0 и выше · брейншторм, слоганы, идеи, двадцать вариантов'}
    ];
    var DANGER = {a:1.5, b:1.6, s:'1.5+ · никогда в продакшене'};
    var AXIS   = {from:0, to:1.6};
    var GEO = {
      bar:0.012, tick:-0.045, num:-0.075, note:-0.14, hint:-0.20,
      bandLo:0.025, bandHi:0.075, head:0.03
    };
    var HINTS = [
      {at:AXIS.from, anchor:'start', s:'два прогона разошлись — это баг'},
      {at:AXIS.to,   anchor:'end',   s:'два прогона разошлись — это цель'}
    ];

    /* ---- холст, один origin, один scale, одна пара переводов ---- */
    var W = 760, H = 310;
    var origin = {x:70, y:220};
    var scale  = 400;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var PAD = 6, FS = 13, FST = 12, LW = 1.6;
    var out = [];
    function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function line(x1,y1,x2,y2,st,w){
      out.push('<line x1="'+sx(x1)+'" y1="'+sy(y1)+'" x2="'+sx(x2)+'" y2="'+sy(y2)+
               '" stroke="'+st+'" stroke-width="'+(w||LW)+'" stroke-linecap="round"/>');
    }
    function rect(x1,y1,x2,y2,fill,st){
      out.push('<rect x="'+sx(x1)+'" y="'+sy(y2)+'" width="'+(sx(x2)-sx(x1))+
               '" height="'+(sy(y1)-sy(y2))+'" fill="'+fill+'" fill-opacity="0.18" stroke="'+
               st+'" stroke-width="'+LW+'"/>');
    }
    function label(x,y,dx,dy,anchor,fill,size,s){
      out.push('<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+
               '" fill="'+fill+'" font-size="'+size+'" font-family="inherit">'+esc(s)+'</text>');
    }

    /* шкала */
    rect(AXIS.from, -GEO.bar, AXIS.to, GEO.bar, 'var(--line)', 'var(--line)');
    /* наконечник стрелки — тоже через sx/sy */
    out.push('<polygon points="'+
      sx(AXIS.to)+','+sy(0)+' '+
      sx(AXIS.to-GEO.head)+','+sy(GEO.head)+' '+
      sx(AXIS.to-GEO.head)+','+sy(-GEO.head)+
      '" fill="var(--line)"/>');

    /* засечки и числа */
    TICKS.forEach(function(t){
      line(t.t, -GEO.bar, t.t, GEO.tick, 'var(--line)');
      label(t.t, GEO.num, 0, 0, 'middle', 'var(--muted)', FST, t.s);
    });

    /* зоны, выноски, подписи */
    ZONES.forEach(function(z){
      rect(z.a, GEO.bandLo, z.b, GEO.bandHi, z.c, z.c);
      line(z.at, GEO.bandHi, z.at, z.row, z.c, LW);
      label(z.at, z.row, (z.anchor === 'end' ? -PAD : PAD), -PAD, z.anchor, 'var(--fg)', FS, z.s);
    });

    /* красная зона */
    rect(DANGER.a, GEO.bandLo, DANGER.b, GEO.bandHi, 'var(--danger)', 'var(--danger)');
    line(DANGER.b, GEO.bandLo, DANGER.b, GEO.note, 'var(--danger)', LW);
    label(DANGER.b, GEO.note, -PAD, 0, 'end', 'var(--danger)', FS, DANGER.s);

    /* нижние подсказки */
    HINTS.forEach(function(h){
      label(h.at, GEO.hint, 0, 0, h.anchor, 'var(--muted)', FST, h.s);
    });

    host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+
      '" role="img" aria-label="Шкала температуры от 0.0 до 1.5 и выше">'+out.join('')+'</svg>';
  }catch(e){
    host.innerHTML = '<div class="fb"><b>Схема не построилась.</b> Она показывает шкалу ' +
      'температуры: 0.0–0.2 — детерминизм (извлечение, классификация, код); 0.3–0.5 — код, ' +
      'переписывание, краткие пересказы; 0.7 — диалог, объяснения, письма; 1.0 и выше — ' +
      'брейншторм, слоганы, идеи; 1.5+ — никогда в продакшене.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
