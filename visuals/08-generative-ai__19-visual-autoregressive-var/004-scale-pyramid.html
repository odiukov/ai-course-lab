<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Пирамида генерации от общей структуры к деталям</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5c667a;
      --grid: #526078;
      --arrow: #6d4aff;
      --tone-summary: #8b7ee8;
      --tone-sky: #dce8ff;
      --tone-light: #f0e6d2;
      --tone-ground: #536176;
      --tone-ground-soft: #718097;
      --tone-object: #69507e;
      --tone-accent: #e69b58;
      --tone-detail: #302c45;
      --fallback: #fff0d6;
      --fallback-border: #bd792f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #111621;
        --panel: #18202d;
        --text: #f2f5fb;
        --muted: #b7c0d0;
        --grid: #aab5c8;
        --arrow: #aa96ff;
        --tone-summary: #7668d2;
        --tone-sky: #536784;
        --tone-light: #81745e;
        --tone-ground: #293345;
        --tone-ground-soft: #3d4a5f;
        --tone-object: #8f6ba2;
        --tone-accent: #e59a57;
        --tone-detail: #171622;
        --fallback: #332819;
        --fallback-border: #d79b56;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: initial;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      margin: initial;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--grid);
    }

    .diagram-title {
      color: var(--text);
      background: var(--panel);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .cell {
      stroke: none;
    }

    .tone-summary {
      fill: var(--tone-summary);
    }

    .tone-sky {
      fill: var(--tone-sky);
    }

    .tone-light {
      fill: var(--tone-light);
    }

    .tone-ground {
      fill: var(--tone-ground);
    }

    .tone-ground-soft {
      fill: var(--tone-ground-soft);
    }

    .tone-object {
      fill: var(--tone-object);
    }

    .tone-accent {
      fill: var(--tone-accent);
    }

    .tone-detail {
      fill: var(--tone-detail);
    }

    .grid-line {
      fill: none;
      stroke: var(--grid);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
      shape-rendering: crispEdges;
    }

    .grid-frame {
      fill: none;
      stroke: var(--grid);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
      shape-rendering: crispEdges;
    }

    .flow-line {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: none;
    }

    .scale-label {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
    }

    .meaning-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .fallback {
      color: var(--text);
      background: var(--fallback);
      border: 2px solid var(--fallback-border);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <figcaption class="diagram-title" id="diagram-title">
      Пирамида генерации: от общей структуры к деталям
    </figcaption>

    <svg
      id="pyramid"
      viewBox="0 0 1200 250"
      width="1200"
      height="250"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Четыре последовательно уточняющиеся сетки: сводка один на один,
        грубая структура два на два, формы четыре на четыре и детали восемь
        на восемь. Стрелки показывают движение от общего представления к
        пространственным деталям.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать последовательность:
      1×1 «сводка» → 2×2 «грубая структура» →
      4×4 «формы» → 8×8 «детали».
    </p>
  </figure>

  <script>
    const data = Object.freeze([
      {
        kind: "grid",
        x: 40,
        y: 20,
        size: 124,
        n: 1,
        cells: [
          ["tone-summary"]
        ],
        labels: [
          {
            text: "1×1",
            className: "scale-label",
            x: 102,
            y: 150,
            dx: 0,
            dy: 18,
            anchor: "middle"
          },
          {
            text: "сводка",
            className: "meaning-label",
            x: 102,
            y: 181,
            dx: 0,
            dy: 18,
            anchor: "middle"
          }
        ]
      },
      {
        kind: "grid",
        x: 310,
        y: 20,
        size: 124,
        n: 2,
        cells: [
          ["tone-sky", "tone-light"],
          ["tone-ground", "tone-object"]
        ],
        labels: [
          {
            text: "2×2",
            className: "scale-label",
            x: 372,
            y: 150,
            dx: 0,
            dy: 18,
            anchor: "middle"
          },
          {
            text: "грубая структура",
            className: "meaning-label",
            x: 372,
            y: 181,
            dx: 0,
            dy: 18,
            anchor: "middle"
          }
        ]
      },
      {
        kind: "grid",
        x: 580,
        y: 20,
        size: 124,
        n: 4,
        cells: [
          ["tone-sky", "tone-sky", "tone-light", "tone-light"],
          ["tone-sky", "tone-object", "tone-object", "tone-light"],
          ["tone-ground", "tone-object", "tone-object", "tone-ground-soft"],
          ["tone-ground", "tone-ground", "tone-accent", "tone-ground-soft"]
        ],
        labels: [
          {
            text: "4×4",
            className: "scale-label",
            x: 642,
            y: 150,
            dx: 0,
            dy: 18,
            anchor: "middle"
          },
          {
            text: "формы",
            className: "meaning-label",
            x: 642,
            y: 181,
            dx: 0,
            dy: 18,
            anchor: "middle"
          }
        ]
      },
      {
        kind: "grid",
        x: 850,
        y: 20,
        size: 124,
        n: 8,
        cells: [
          [
            "tone-sky", "tone-sky", "tone-sky", "tone-light",
            "tone-light", "tone-light", "tone-sky", "tone-sky"
          ],
          [
            "tone-sky", "tone-sky", "tone-light", "tone-object",
            "tone-object", "tone-light", "tone-light", "tone-sky"
          ],
          [
            "tone-sky", "tone-light", "tone-object", "tone-object",
            "tone-object", "tone-object", "tone-light", "tone-sky"
          ],
          [
            "tone-ground-soft", "tone-light", "tone-object", "tone-detail",
            "tone-detail", "tone-object", "tone-light", "tone-ground-soft"
          ],
          [
            "tone-ground-soft", "tone-ground-soft", "tone-object", "tone-accent",
            "tone-object", "tone-object", "tone-ground-soft", "tone-ground-soft"
          ],
          [
            "tone-ground", "tone-ground", "tone-object", "tone-object",
            "tone-object", "tone-object", "tone-ground-soft", "tone-ground-soft"
          ],
          [
            "tone-ground", "tone-ground", "tone-ground", "tone-object",
            "tone-object", "tone-ground-soft", "tone-ground-soft", "tone-ground"
          ],
          [
            "tone-ground", "tone-detail", "tone-ground", "tone-ground",
            "tone-accent", "tone-ground", "tone-detail", "tone-ground"
          ]
        ],
        labels: [
          {
            text: "8×8",
            className: "scale-label",
            x: 912,
            y: 150,
            dx: 0,
            dy: 18,
            anchor: "middle"
          },
          {
            text: "детали",
            className: "meaning-label",
            x: 912,
            y: 181,
            dx: 0,
            dy: 18,
            anchor: "middle"
          }
        ]
      },
      {
        kind: "arrow",
        x1: 190,
        y1: 82,
        x2: 282,
        y2: 82,
        head: 13,
        wing: 9
      },
      {
        kind: "arrow",
        x1: 460,
        y1: 82,
        x2: 552,
        y2: 82,
        head: 13,
        wing: 9
      },
      {
        kind: "arrow",
        x1: 730,
        y1: 82,
        x2: 822,
        y2: 82,
        head: 13,
        wing: 9
      }
    ]);

    const origin = Object.freeze({ x: 30, y: 18 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("pyramid");
      const fallback = document.getElementById("fallback");

      const make = (name, attributes) => {
        const node = document.createElementNS(svg.namespaceURI, name);

        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }

        return node;
      };

      const appendCell = (group, grid, row, column, tone) => {
        const left = grid.x + column * grid.size / grid.n;
        const top = grid.y + row * grid.size / grid.n;
        const right = grid.x + (column + grid.n / grid.n) * grid.size / grid.n;
        const bottom = grid.y + (row + grid.n / grid.n) * grid.size / grid.n;

        group.appendChild(make("rect", {
          class: `cell ${tone}`,
          x: sx(left),
          y: sy(top),
          width: sx(right) - sx(left),
          height: sy(bottom) - sy(top)
        }));
      };

      const appendGridLines = (group, grid) => {
        for (const index of grid.cells.keys()) {
          if (index === grid.cells.length - grid.n / grid.n) {
            continue;
          }

          const vertical = grid.x +
            (index + grid.n / grid.n) * grid.size / grid.n;
          const horizontal = grid.y +
            (index + grid.n / grid.n) * grid.size / grid.n;

          group.appendChild(make("line", {
            class: "grid-line",
            x1: sx(vertical),
            y1: sy(grid.y),
            x2: sx(vertical),
            y2: sy(grid.y + grid.size)
          }));

          group.appendChild(make("line", {
            class: "grid-line",
            x1: sx(grid.x),
            y1: sy(horizontal),
            x2: sx(grid.x + grid.size),
            y2: sy(horizontal)
          }));
        }

        group.appendChild(make("rect", {
          class: "grid-frame",
          x: sx(grid.x),
          y: sy(grid.y),
          width: sx(grid.x + grid.size) - sx(grid.x),
          height: sy(grid.y + grid.size) - sy(grid.y)
        }));
      };

      const appendLabels = (group, labels) => {
        for (const label of labels) {
          const text = make("text", {
            class: label.className,
            x: sx(label.x),
            y: sy(label.y),
            dx: label.dx,
            dy: label.dy,
            "text-anchor": label.anchor
          });

          text.textContent = label.text;
          group.appendChild(text);
        }
      };

      const appendGrid = grid => {
        const group = make("g", {
          "aria-label": `${grid.labels[0].text}: ${grid.labels[1].text}`
        });

        for (const [row, line] of grid.cells.entries()) {
          for (const [column, tone] of line.entries()) {
            appendCell(group, grid, row, column, tone);
          }
        }

        appendGridLines(group, grid);
        appendLabels(group, grid.labels);
        svg.appendChild(group);
      };

      const appendArrow = arrow => {
        const group = make("g", { "aria-hidden": "true" });

        group.appendChild(make("line", {
          class: "flow-line",
          x1: sx(arrow.x1),
          y1: sy(arrow.y1),
          x2: sx(arrow.x2),
          y2: sy(arrow.y2)
        }));

        const tip = `${sx(arrow.x2)},${sy(arrow.y2)}`;
        const upper = `${sx(arrow.x2 - arrow.head)},${sy(arrow.y2 - arrow.wing)}`;
        const lower = `${sx(arrow.x2 - arrow.head)},${sy(arrow.y2 + arrow.wing)}`;

        group.appendChild(make("polygon", {
          class: "arrow-head",
          points: `${tip} ${upper} ${lower}`
        }));

        svg.appendChild(group);
      };

      for (const item of data) {
        if (item.kind === "grid") {
          appendGrid(item);
        }
      }

      for (const item of data) {
        if (item.kind === "arrow") {
          appendArrow(item);
        }
      }

      fallback.setAttribute("hidden", "");
    } catch (error) {
      const svg = document.getElementById("pyramid");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.setAttribute("hidden", "");
      }

      if (fallback) {
        fallback.removeAttribute("hidden");
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
