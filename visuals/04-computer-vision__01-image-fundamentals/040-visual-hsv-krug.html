<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Круг оттенков</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a5a5a;
    --line: #333333;
    --accent: #c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --fg: #e8e8e8;
      --muted: #a0a4ad;
      --line: #c8ccd4;
      --accent: #ff9d5c;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .wrap {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 8px 10px 10px;
    box-sizing: border-box;
    max-width: 760px;
  }
  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; max-height: 470px; background: var(--bg); }
  .lbl { font-size: 11px; fill: var(--fg); }
  .mut { font-size: 10px; fill: var(--muted); }
  .acc { font-size: 11px; fill: var(--accent); font-weight: 600; }
  .fail { font-size: 12px; color: var(--fg); line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Круг оттенков: hue 0–360°, saturation — радиус</h2>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById("host");
  try {
    // ---- данные схемы ----
    var HUES = [
      { deg: 0,   name: "красный 0°",  side: "right" },
      { deg: 120, name: "зелёный 120°", side: "upleft" },
      { deg: 240, name: "синий 240°",  side: "downleft" }
    ];
    var POINT = { deg: 30, sat: 0.3, val: 1.0 };
    var R = 1.0;            // радиус круга в единицах данных (saturation = 1)
    var TICKS = [0, 120, 240];

    // холст (литералы разрешены)
    var W = 620, H = 400;
    var PAD = 6, FS = 11, LW = 1.5;

    // ---- один origin, один scale ----
    var origin = { x: 200, y: 200 };
    var scale = 150;

    function sx(x) { return origin.x + x * scale; }
    function sy(y) { return origin.y - y * scale; }

    // полярное в декартово (в единицах данных, не в пикселях)
    function polar(deg, r) {
      var a = deg * Math.PI / 180;
      return { x: r * Math.cos(a), y: r * Math.sin(a) };
    }

    var NS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("role", "img");

    function el(n, a) {
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      svg.appendChild(e);
      return e;
    }
    function txt(x, y, s, cls, anchor) {
      var t = el("text", { x: x, y: y, class: cls, "text-anchor": anchor });
      t.appendChild(document.createTextNode(s));
      return t;
    }

    // ---- цветное кольцо: секторы по 5° ----
    var ringOut = R, ringIn = R * 0.82;
    for (var d = 0; d < 360; d += 5) {
      var a0 = polar(d, ringIn), b0 = polar(d, ringOut);
      var a1 = polar(d + 5.4, ringIn), b1 = polar(d + 5.4, ringOut);
      el("path", {
        d: "M" + sx(b0.x) + " " + sy(b0.y) +
           "L" + sx(b1.x) + " " + sy(b1.y) +
           "L" + sx(a1.x) + " " + sy(a1.y) +
           "L" + sx(a0.x) + " " + sy(a0.y) + "Z",
        fill: "hsl(" + d + ",85%,52%)"
      });
    }

    // круг saturation: контур и центр
    var c0 = polar(0, 0);
    el("circle", {
      cx: sx(c0.x), cy: sy(c0.y),
      r: sx(R) - sx(0),
      fill: "none", stroke: "var(--line)", "stroke-width": LW
    });
    el("circle", { cx: sx(c0.x), cy: sy(c0.y), r: LW * 1.6, fill: "var(--line)" });

    // ---- засечки и подписи основных hue ----
    HUES.forEach(function (h) {
      var inn = polar(h.deg, ringIn * 0.9), out = polar(h.deg, ringOut);
      el("line", {
        x1: sx(c0.x), y1: sy(c0.y), x2: sx(out.x), y2: sy(out.y),
        stroke: "var(--line)", "stroke-width": LW, "stroke-dasharray": "3 3", opacity: "0.7"
      });
      el("circle", { cx: sx(inn.x), cy: sy(inn.y), r: LW * 1.3, fill: "var(--line)" });

      var p = polar(h.deg, ringOut);
      if (h.side === "right")      txt(sx(p.x) + PAD * 2, sy(p.y) + PAD * 3.4, h.name, "lbl", "start");
      else if (h.side === "upleft")   txt(sx(p.x) - PAD, sy(p.y) - PAD * 1.6, h.name, "lbl", "middle");
      else                            txt(sx(p.x) - PAD, sy(p.y) + PAD * 3.4, h.name, "lbl", "middle");
    });

    // шов 0/360: подпись под сектором красного
    var seam = polar(0, ringOut);
    txt(sx(seam.x) + PAD * 2, sy(seam.y) - PAD * 1.4, "= 360° (шов)", "mut", "start");

    // ---- точка «оранжевый блёклый» ----
    var pt = polar(POINT.deg, POINT.sat);
    el("line", {
      x1: sx(c0.x), y1: sy(c0.y), x2: sx(pt.x), y2: sy(pt.y),
      stroke: "var(--accent)", "stroke-width": LW
    });
    el("circle", { cx: sx(pt.x), cy: sy(pt.y), r: LW * 3, fill: "var(--accent)" });
    txt(sx(pt.x) + PAD, sy(pt.y) - PAD * 1.6, "оранжевый блёклый", "acc", "start");

    // подпись радиуса — сбоку от середины отрезка, у хвоста
    var mid = polar(POINT.deg, POINT.sat / 2);
    txt(sx(mid.x) + PAD * 1.5, sy(mid.y) + PAD * 2.6, "saturation 0.3", "mut", "start");

    // центр — серый
    txt(sx(c0.x) - PAD, sy(c0.y) + PAD * 2.8, "центр: saturation 0", "mut", "end");

    // ---- ось saturation вправо-вниз от центра к краю (270°) ----
    var edge = polar(270, R);
    txt(sx(edge.x), sy(edge.y) + PAD * 2.6, "край: saturation 1", "mut", "middle");

    // ---- легенда справа: value ----
    var legX = R * 1.55;
    var legTop = polar(0, 0);
    txt(sx(legX), sy(legTop.y + R * 0.62), "value 1.0 — яркость;", "mut", "start");
    txt(sx(legX), sy(legTop.y + R * 0.44), "оттенок от неё не меняется", "mut", "start");
    txt(sx(legX), sy(legTop.y + R * 0.10), "зелёное: hue 90…150 —", "lbl", "start");
    txt(sx(legX), sy(legTop.y - R * 0.08), "один диапазон", "lbl", "start");
    txt(sx(legX), sy(legTop.y - R * 0.40), "красное: hue > 350", "lbl", "start");
    txt(sx(legX), sy(legTop.y - R * 0.58), "или hue < 10 — два куска", "lbl", "start");
    txt(sx(legX), sy(legTop.y - R * 0.90), "OpenCV 8 бит: hue 0–179", "mut", "start");

    host.appendChild(svg);
  } catch (e) {
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна показывать: ' +
      'круг hue от 0 до 360 градусов, замкнутый в кольцо; на нём подписаны ' +
      'красный 0°, зелёный 120°, синий 240°, причём 0° и 360° — одна и та же точка (шов). ' +
      'Saturation — расстояние от центра (0) к краю (1). ' +
      'Отмечена точка «оранжевый блёклый»: hue 30°, saturation 0.3, value 1.0 — ' +
      'она лежит на луче 30° примерно на трети радиуса.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
