<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Сцена → сетка детекторов → числа</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1c1c1c; --muted:#5d5d5d;
    --line:#2b2b2b; --grid:#8a8a8a; --cell:#ffffff;
    --accent:#b4531f; --scene1:#f2d79a; --scene2:#6f5a3a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#eceef1; --muted:#a4abb5;
      --line:#d7dbe0; --grid:#7f8794; --cell:#1e2228;
      --accent:#ffab6b; --scene1:#d8b46a; --scene2:#3a3226;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:8px 10px 10px}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  text{fill:var(--fg)}
  .mut{fill:var(--muted)}
  .fail{padding:10px;color:var(--fg)}
</style>
<div class="wrap">
  <h2>Один раз на съёмке: сцена → сетка детекторов → таблица чисел</h2>
  <div id="host"><svg id="s" viewBox="0 0 900 380" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Непрерывная сцена, сетка 5 на 5 детекторов и таблица 25 чисел от 108 до 210"></svg></div>
</div>
<script>
(function(){
try{
  /* ---- данные схемы ---- */
  var VALUES=[
    [210,198,180,155,120],
    [205,195,178,152,118],
    [200,190,175,150,115],
    [195,185,170,148,112],
    [188,180,165,145,108]
  ];
  var N=5;
  var SCENE_X=0, GRID_X=8.2, NUM_X=16.4;   // левые края трёх стадий, в юнитах
  var TOP=0, BOX=5;                        // высота стадии = 5 юнитов (клетка = 1)
  var ORIGIN={x:60,y:60}, SCALE=44;        // единственный origin и scale

  function sx(x){ return ORIGIN.x + x*SCALE; }
  function sy(y){ return ORIGIN.y + y*SCALE; }

  var svg=document.getElementById('s');
  var NS='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function txt(x,y,s,anch,cls,size){
    var t=el('text',{x:sx(x),y:sy(y),'text-anchor':anch||'middle','font-size':size||13});
    if(cls)t.setAttribute('class',cls);
    t.appendChild(document.createTextNode(s));return t;
  }
  function shift(t,dx,dy){ t.setAttribute('x',+t.getAttribute('x')+dx); t.setAttribute('y',+t.getAttribute('y')+dy); return t; }

  var defs=el('defs',{});
  var mk=document.createElementNS(NS,'marker');
  mk.setAttribute('id','ah');mk.setAttribute('markerWidth','8');mk.setAttribute('markerHeight','8');
  mk.setAttribute('refX','7');mk.setAttribute('refY','4');mk.setAttribute('orient','auto');
  var pth=document.createElementNS(NS,'path');
  pth.setAttribute('d','M0,0 L8,4 L0,8 z');pth.setAttribute('fill','var(--accent)');
  mk.appendChild(pth);defs.appendChild(mk);

  /* ---- стадия 1: непрерывная сцена ---- */
  var gw=BOX; // ширина стадии 1 в юнитах = 5
  var grad=document.createElementNS(NS,'linearGradient');
  grad.setAttribute('id','g1');grad.setAttribute('x1','0');grad.setAttribute('x2','1');
  grad.setAttribute('y1','0');grad.setAttribute('y2','0.35');
  [['0','var(--scene1)'],['1','var(--scene2)']].forEach(function(p){
    var st=document.createElementNS(NS,'stop');st.setAttribute('offset',p[0]);st.setAttribute('stop-color',p[1]);
    grad.appendChild(st);
  });
  defs.appendChild(grad);
  el('rect',{x:sx(SCENE_X),y:sy(TOP),width:sx(SCENE_X+gw)-sx(SCENE_X),height:sy(TOP+BOX)-sy(TOP),
    fill:'url(#g1)',stroke:'var(--line)','stroke-width':1.5});
  // непрерывность: плавные линии яркости внутри сцены
  for(var i=1;i<=4;i++){
    var d='', k;
    for(k=0;k<=20;k++){
      var xx=SCENE_X+gw*k/20;
      var yy=TOP+BOX*i/5 + 0.18*Math.sin(k/20*Math.PI*2+i);
      d+=(k?'L':'M')+sx(xx)+' '+sy(yy)+' ';
    }
    el('path',{d:d,fill:'none',stroke:'var(--line)','stroke-width':0.8,opacity:0.35});
  }
  shift(txt(SCENE_X,TOP,'Реальная сцена','start'),0,-24);
  shift(txt(SCENE_X,TOP,'свет непрерывный','start','mut',12),0,-8);
  shift(txt(SCENE_X+gw/2,TOP+BOX,'между двумя точками — ещё точки','middle','mut',12),0,20);
  shift(txt(SCENE_X+gw/2,TOP+BOX,'деталей бесконечно много','middle','mut',12),0,36);

  /* ---- стадия 2: сетка 5×5 детекторов ---- */
  var r,c;
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    el('rect',{x:sx(GRID_X+c),y:sy(TOP+r),
      width:sx(GRID_X+c+1)-sx(GRID_X+c),height:sy(TOP+r+1)-sy(TOP+r),
      fill:'var(--cell)',stroke:'var(--grid)','stroke-width':1});
    // «ведро»: заряд ячейки как уровень заливки
    var v=VALUES[r][c], f=(v-108)/(210-108);
    el('rect',{x:sx(GRID_X+c+0.18),y:sy(TOP+r+1-0.64*f-0.18),
      width:sx(GRID_X+c+0.82)-sx(GRID_X+c+0.18),
      height:sy(TOP+r+1-0.18)-sy(TOP+r+1-0.64*f-0.18),
      fill:'var(--accent)',opacity:0.55});
  }
  shift(txt(GRID_X,TOP,'Сетка детекторов 5×5','start'),0,-24);
  shift(txt(GRID_X,TOP,'каждый копит заряд','start','mut',12),0,-8);
  shift(txt(GRID_X+N/2,TOP+BOX,'25 «вёдер» под дождём из света','middle','mut',12),0,20);
  shift(txt(GRID_X+N/2,TOP+BOX,'больше света — больше заряд','middle','mut',12),0,36);

  /* ---- стадия 3: таблица чисел ---- */
  el('rect',{x:sx(NUM_X),y:sy(TOP),width:sx(NUM_X+N)-sx(NUM_X),height:sy(TOP+BOX)-sy(TOP),
    fill:'none',stroke:'var(--line)','stroke-width':1.5});
  for(r=0;r<N;r++)for(c=0;c<N;c++){
    txt(NUM_X+c+0.5,TOP+r+0.62,String(VALUES[r][c]),'middle',null,13);
  }
  shift(txt(NUM_X,TOP,'Цифровая картинка','start'),0,-24);
  shift(txt(NUM_X,TOP,'25 целых чисел, 108…210','start','mut',12),0,-8);
  shift(txt(NUM_X+N/2,TOP+BOX,'слева ярче, справа темнее','middle','mut',12),0,20);
  shift(txt(NUM_X+N/2,TOP+BOX,'перепад тот же, что на сцене','middle','mut',12),0,36);

  /* ---- стрелки между стадиями ---- */
  function arrow(x1,x2,y,label){
    el('line',{x1:sx(x1),y1:sy(y),x2:sx(x2),y2:sy(y),
      stroke:'var(--accent)','stroke-width':2,'marker-end':'url(#ah)'});
    // подпись у хвоста, над линией
    shift(txt(x1,y,label,'start','mut',12),2,-10);
  }
  arrow(SCENE_X+gw+0.35, GRID_X-0.35, TOP+BOX/2, 'замер');
  arrow(NUM_X-2.95, NUM_X-0.35, TOP+BOX/2, 'заряд → число');

}catch(e){
  document.getElementById('host').innerHTML=
   '<p class="fail">Схема должна была показать три стадии со стрелками: слева непрерывная сцена '+
   '(свет непрерывный, деталей бесконечно много), в середине сетка 5×5 детекторов '+
   '(25 «вёдер», каждое копит заряд), справа таблица 5×5 целых чисел от 108 до 210 '+
   '(слева ярче, справа темнее). Превращение происходит один раз, на съёмке.</p>';
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
