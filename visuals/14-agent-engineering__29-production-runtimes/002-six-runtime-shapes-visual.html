<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шесть форм продакшен-рантайма</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f8fc;--panel:#ffffff;--ink:#172033;--muted:#667085;
  --line:#cbd2df;--halo:#e7eaf2;--blue:#2563eb;--cyan:#0891b2;
  --violet:#7c3aed;--amber:#c76a08;--rose:#db2777;--green:#16835d;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#11151d;--panel:#1b2130;--ink:#f1f4fa;--muted:#a9b2c3;
    --line:#465064;--halo:#293142;--blue:#73a5ff;--cyan:#52cee6;
    --violet:#b59aff;--amber:#f4b55d;--rose:#ff83bd;--green:#58d3a5;
  }
}
*{box-sizing:border-box}
html,body{margin:unset;background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
figure{margin:unset;background:var(--bg)}
header{text-align:center}
h1{margin:unset;font-size:20px;line-height:normal}
header p{margin:unset;color:var(--muted);font-size:14px}
svg{display:block;width:100%;height:auto;max-height:455px;background:var(--bg)}
.card{fill:var(--panel);stroke:currentColor}
.link{fill:none;stroke:currentColor;stroke-linecap:round}
.arrow{fill:currentColor}
.halo{fill:none;stroke:var(--halo)}
.core{fill:var(--panel);stroke:var(--ink)}
.core-band{fill:var(--ink)}
.mark{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.mark-fill{fill:currentColor;stroke:none}
.node-title,.core-title{fill:var(--ink);font-weight:700}
.node-detail,.core-sub{fill:var(--muted)}
.core-note{fill:var(--ink);font-weight:600}
[data-tone="request"]{color:var(--blue)}
[data-tone="stream"]{color:var(--cyan)}
[data-tone="durable"]{color:var(--violet)}
[data-tone="queue"]{color:var(--amber)}
[data-tone="event"]{color:var(--rose)}
[data-tone="schedule"]{color:var(--green)}
#fallback{text-align:center;color:var(--ink);font-size:14px}
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
<header>
  <h1 id="diagram-heading">Шесть форм продакшен-рантайма</h1>
  <p>Одна задача — разные свойства выполнения</p>
</header>
<svg id="diagram" viewBox="0 0 1200 455" width="1200" height="455"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Одна задача в центре и шесть форм выполнения вокруг неё">
  <title>Одна задача и шесть совместимых форм продакшен-рантайма</title>
</svg>
<p id="fallback" hidden>Схема должна была показать одну задачу в центре и шесть оболочек вокруг неё: запрос — ответ, потоковую выдачу, надёжное выполнение, очередь, запуск по событию и запуск по расписанию.</p>
</figure>
<script>
const data=[
 {kind:"config",zero:0,half:.5,round:.22,coreW:2.55,coreH:1.28,
  coreRound:.32,halo:[1.13,1.39],arrowLength:.17,arrowWing:.09,
  titleY:.3,detailY:-.04,coreTitleY:.24,coreSubY:-.08,coreNoteY:-.39},
 {kind:"node",tone:"request",x:-3.7,y:1.75,w:3.2,h:1.3,
  title:"Запрос — ответ",detail:"Вопрос → ответ · < 30 с",
  tail:{x:-1.06,y:.46},head:{x:-2.1,y:1.1},
  glyph:[
   {type:"path",points:[[-.48,-.4],[.18,-.4],[.07,-.29]]},
   {type:"path",points:[[.48,-.52],[-.18,-.52],[-.07,-.63]]}
  ]},
 {kind:"node",tone:"stream",x:0,y:1.75,w:3.2,h:1.3,
  title:"Потоковая выдача",detail:"Длинный отчёт · отдавать частями",
  tail:{x:0,y:.66},head:{x:0,y:1.1},
  glyph:[
   {type:"circle",center:[-.4,-.46],radius:.045},
   {type:"circle",center:[-.14,-.46],radius:.045},
   {type:"circle",center:[.14,-.46],radius:.045},
   {type:"path",points:[[.38,-.46],[.55,-.46],[.46,-.37]]}
  ]},
 {kind:"node",tone:"durable",x:3.7,y:1.75,w:3.2,h:1.3,
  title:"Надёжное выполнение",detail:"Сбой на шаге 37 · продолжить",
  tail:{x:1.06,y:.46},head:{x:2.1,y:1.1},
  glyph:[
   {type:"path",points:[[-.5,-.46],[-.19,-.46],[.1,-.46],[.42,-.46]]},
   {type:"circle",center:[-.19,-.46],radius:.055},
   {type:"circle",center:[.1,-.46],radius:.055},
   {type:"path",points:[[.42,-.46],[.52,-.36],[.52,-.57]]}
  ]},
 {kind:"node",tone:"queue",x:-3.7,y:-1.75,w:3.2,h:1.3,
  title:"Очередь / фон",detail:"1000 файлов · свободный воркер",
  tail:{x:-1.06,y:-.46},head:{x:-2.1,y:-1.1},
  glyph:[
   {type:"circle",center:[-.46,-.46],radius:.055},
   {type:"circle",center:[-.21,-.46],radius:.055},
   {type:"circle",center:[.04,-.46],radius:.055},
   {type:"path",points:[[.14,-.46],[.52,-.46],[.41,-.35]]}
  ]},
 {kind:"node",tone:"event",x:0,y:-1.75,w:3.2,h:1.3,
  title:"По событию",detail:"Пришло письмо · запустить",
  tail:{x:0,y:-.66},head:{x:0,y:-1.1},
  glyph:[
   {type:"path",closed:true,points:[[-.31,-.59],[-.31,-.33],[.18,-.33],[.18,-.59]]},
   {type:"path",points:[[-.31,-.33],[-.06,-.51],[.18,-.33]]},
   {type:"path",points:[[.31,-.35],[.45,-.28],[.53,-.42]]}
  ]},
 {kind:"node",tone:"schedule",x:3.7,y:-1.75,w:3.2,h:1.3,
  title:"По расписанию",detail:"Каждую ночь · запустить",
  tail:{x:1.06,y:-.46},head:{x:2.1,y:-1.1},
  glyph:[
   {type:"circle",center:[0,-.46],radius:.19},
   {type:"path",points:[[0,-.46],[0,-.33]]},
   {type:"path",points:[[0,-.46],[.13,-.53]]},
   {type:"path",points:[[-.31,-.28],[-.19,-.2]]}
  ]}
];
const origin=Object.freeze({x:600,y:228});
const scale=92;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y-y*scale;
const toPx=point=>`${sx(point.x)} ${sy(point.y)}`;
const lineWidth=2;
const fineLineWidth=1.5;
const titleFontSize=16;
const detailFontSize=13;
const noteFontSize=12;

try{
 const svg=document.querySelector("#diagram");
 const fallback=document.querySelector("#fallback");
 const cfg=data.find(item=>item.kind==="config");
 const nodes=data.filter(item=>item.kind==="node");
 const ns=svg.namespaceURI;
 const make=(name,attrs={})=>{
   const element=document.createElementNS(ns,name);
   for(const [key,value] of Object.entries(attrs)) element.setAttribute(key,value);
   return element;
 };
 const append=(parent,name,attrs={})=>{
   const element=make(name,attrs);
   parent.append(element);
   return element;
 };
 const radius=value=>Math.abs(sx(value)-sx(cfg.zero));
 const point=(x,y)=>({x,y});
 const path=(points,closed=false)=>{
   const [first,...rest]=points;
   return `M ${toPx(first)}${rest.map(item=>` L ${toPx(item)}`).join("")}${closed?" Z":""}`;
 };
 const roundedBox=(cx,cy,w,h,r)=>{
   const left=cx-w*cfg.half,right=cx+w*cfg.half;
   const top=cy+h*cfg.half,bottom=cy-h*cfg.half;
   return [
    `M ${toPx(point(left+r,top))}`,
    `L ${toPx(point(right-r,top))}`,
    `Q ${toPx(point(right,top))} ${toPx(point(right,top-r))}`,
    `L ${toPx(point(right,bottom+r))}`,
    `Q ${toPx(point(right,bottom))} ${toPx(point(right-r,bottom))}`,
    `L ${toPx(point(left+r,bottom))}`,
    `Q ${toPx(point(left,bottom))} ${toPx(point(left,bottom+r))}`,
    `L ${toPx(point(left,top-r))}`,
    `Q ${toPx(point(left,top))} ${toPx(point(left+r,top))} Z`
   ].join(" ");
 };
 const text=(parent,value,x,y,className,size)=>{
   const element=append(parent,"text",{
    x:sx(x),y:sy(y),class:className,"font-size":size,
    "text-anchor":"middle","dominant-baseline":"middle"
   });
   element.textContent=value;
   return element;
 };
 const layerHalo=append(svg,"g",{"aria-hidden":"true"});
 for(const ring of cfg.halo){
   append(layerHalo,"circle",{
    cx:sx(cfg.zero),cy:sy(cfg.zero),r:radius(ring),
    class:"halo","stroke-width":fineLineWidth
   });
 }
 const layerLinks=append(svg,"g",{"aria-hidden":"true"});
 for(const node of nodes){
   const group=append(layerLinks,"g",{"data-tone":node.tone});
   append(group,"path",{
    d:path([node.tail,node.head]),class:"link","stroke-width":lineWidth
   });
   const dx=node.head.x-node.tail.x,dy=node.head.y-node.tail.y;
   const length=Math.hypot(dx,dy),ux=dx/length,uy=dy/length;
   const base=point(
    node.head.x-ux*cfg.arrowLength,
    node.head.y-uy*cfg.arrowLength
   );
   const left=point(
    base.x-uy*cfg.arrowWing,
    base.y+ux*cfg.arrowWing
   );
   const right=point(
    base.x+uy*cfg.arrowWing,
    base.y-ux*cfg.arrowWing
   );
   append(group,"path",{d:path([node.head,left,right],true),class:"arrow"});
 }
 const layerNodes=append(svg,"g");
 for(const node of nodes){
   const group=append(layerNodes,"g",{"data-tone":node.tone});
   append(group,"path",{
    d:roundedBox(node.x,node.y,node.w,node.h,cfg.round),
    class:"card","stroke-width":lineWidth
   });
   text(group,node.title,node.x,node.y+cfg.titleY,"node-title",titleFontSize);
   text(group,node.detail,node.x,node.y+cfg.detailY,"node-detail",detailFontSize);
   for(const mark of node.glyph){
     if(mark.type==="path"){
       const points=mark.points.map(([x,y])=>point(node.x+x,node.y+y));
       append(group,"path",{
        d:path(points,Boolean(mark.closed)),class:"mark",
        "stroke-width":fineLineWidth
       });
     }
     if(mark.type==="circle"){
       const [x,y]=mark.center;
       append(group,"circle",{
        cx:sx(node.x+x),cy:sy(node.y+y),r:radius(mark.radius),
        class:"mark-fill"
       });
     }
   }
 }
 const core=append(svg,"g");
 append(core,"path",{
  d:roundedBox(cfg.zero,cfg.zero,cfg.coreW,cfg.coreH,cfg.coreRound),
  class:"core","stroke-width":lineWidth
 });
 append(core,"path",{
  d:path([
   point(-cfg.coreW*cfg.half+cfg.coreRound,cfg.coreH*cfg.half),
   point(cfg.coreW*cfg.half-cfg.coreRound,cfg.coreH*cfg.half)
  ]),
  class:"core-band","stroke-width":fineLineWidth
 });
 text(core,"ОДНА ЗАДАЧА",cfg.zero,cfg.coreTitleY,"core-title",titleFontSize);
 text(core,"тот же агент",cfg.zero,cfg.coreSubY,"core-sub",detailFontSize);
 text(core,"формы можно наслаивать",cfg.zero,cfg.coreNoteY,"core-note",noteFontSize);
 fallback.hidden=true;
}catch(error){
 const svg=document.querySelector("#diagram");
 const fallback=document.querySelector("#fallback");
 if(svg) svg.hidden=true;
 if(fallback) fallback.hidden=false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
