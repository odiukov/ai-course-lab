<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Дуга MMAU за два года</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1c1c1c; --muted:#6b6b6b; --axis:#4a4a4a;
    --line:#b5451f; --dash:#7a6a2f; --dot:#b5451f; --grid:#e2ded4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e9e7e2; --muted:#9d9a94; --axis:#8d8d8d;
      --line:#e8794a; --dash:#d6c06a; --dot:#e8794a; --grid:#2a2d33;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:12px 8px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fallback{font-size:14px;line-height:1.5;color:var(--fg);}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Дуга оценок MMAU: +17 пунктов за два года</h2>
  <div id="slot">
    <div class="fallback" id="fallback">
      MMAU: SALMONN 0.55 (конец 2023) → Qwen-Audio 0.60 (конец 2023) → Audio Flamingo 3 0.72 (июль 2025).
      Пунктиром — проприетарный фронтир 0.78. Первый шаг +0.05, второй +0.12.
    </div>
  </div>
</div>
<script>
(function(){
  try{
    var DATA = [
      {x:0, y:0.55, name:"SALMONN",     year:"конец 2023"},
      {x:1, y:0.60, name:"Qwen-Audio",  year:"конец 2023"},
      {x:2, y:0.72, name:"AF3",         year:"июль 2025"}
    ];
    var FRONTIER = 0.78;
    var TICKS = [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80];

    var W = 900, H = 430;
    var PAD = 4, FS = 13, FSS = 12, LW = 2;

    var origin = {px: 170, py: 380};
    var scale  = {x: 210, y: -900};

    function sx(x){ return origin.px + x * scale.x; }
    function sy(y){ return origin.py + (y - 0.50) * scale.y; }

    var ns = "http://www.w3.org/2000/svg";
    function el(n, a){ var e = document.createElementNS(ns, n);
      for(var k in a){ e.setAttribute(k, a[k]); } return e; }
    function txt(x, y, s, anchor, cls, size){
      var t = el("text", {x:x, y:y, "text-anchor":anchor||"middle",
        "font-size":(size||FS), fill:"var(--fg)"});
      if(cls){ t.setAttribute("fill", cls); }
      t.textContent = s; return t;
    }

    var svg = el("svg", {viewBox:"0 0 "+W+" "+H,
      preserveAspectRatio:"xMidYMid meet", role:"img",
      "aria-label":"Линия оценок MMAU по годам"});

    var g = el("g", {});
    svg.appendChild(g);

    // горизонтальные линии сетки по засечкам оси Y
    TICKS.forEach(function(v){
      g.appendChild(el("line", {x1:sx(-0.25), y1:sy(v), x2:sx(2.45), y2:sy(v),
        stroke:"var(--grid)", "stroke-width":1}));
    });

    // ось Y
    g.appendChild(el("line", {x1:sx(-0.25), y1:sy(0.80), x2:sx(-0.25), y2:sy(0.50),
      stroke:"var(--axis)", "stroke-width":LW}));
    TICKS.forEach(function(v){
      g.appendChild(el("line", {x1:sx(-0.25), y1:sy(v), x2:sx(-0.19), y2:sy(v),
        stroke:"var(--axis)", "stroke-width":LW}));
      var t = txt(sx(-0.25) - PAD*2, sy(v) + PAD, v.toFixed(2), "end", "var(--muted)", FSS);
      g.appendChild(t);
    });
    g.appendChild(txt(sx(-0.25) - PAD*2, sy(0.80) - PAD*4, "MMAU", "end", "var(--muted)", FSS));

    // ось X
    g.appendChild(el("line", {x1:sx(-0.25), y1:sy(0.50), x2:sx(2.45), y2:sy(0.50),
      stroke:"var(--axis)", "stroke-width":LW}));

    // проприетарный фронтир — пунктир
    g.appendChild(el("line", {x1:sx(-0.25), y1:sy(FRONTIER), x2:sx(2.45), y2:sy(FRONTIER),
      stroke:"var(--dash)", "stroke-width":LW, "stroke-dasharray":"8 6"}));
    g.appendChild(txt(sx(2.45), sy(FRONTIER) - PAD*2,
      "проприетарный фронтир 0.78", "end", "var(--dash)", FSS));

    // ломаная по точкам
    var d = DATA.map(function(p, i){
      return (i ? "L" : "M") + sx(p.x) + " " + sy(p.y);
    }).join(" ");
    g.appendChild(el("path", {d:d, fill:"none", stroke:"var(--line)",
      "stroke-width":LW+1, "stroke-linejoin":"round"}));

    // приросты между точками — подписи сбоку от середины отрезка
    for(var i = 1; i < DATA.length; i++){
      var a = DATA[i-1], b = DATA[i];
      var mx = sx((a.x + b.x) / 2), my = sy((a.y + b.y) / 2);
      var delta = "+" + (b.y - a.y).toFixed(2);
      g.appendChild(txt(mx + PAD*3, my + PAD*4, delta, "start", "var(--line)", FSS));
    }

    // точки и подписи: год снизу, модель со значением сверху
    DATA.forEach(function(p, i){
      g.appendChild(el("circle", {cx:sx(p.x), cy:sy(p.y), r:5,
        fill:"var(--dot)", stroke:"var(--bg)", "stroke-width":2}));
      var anchor = (i === 0) ? "start" : (i === DATA.length - 1 ? "end" : "middle");
      g.appendChild(txt(sx(p.x), sy(p.y) - PAD*4,
        p.name + " " + p.y.toFixed(2), anchor, "var(--fg)", FS));
      g.appendChild(el("line", {x1:sx(p.x), y1:sy(p.y), x2:sx(p.x), y2:sy(0.50),
        stroke:"var(--grid)", "stroke-width":1}));
      g.appendChild(txt(sx(p.x), sy(0.50) + PAD*5, p.year, "middle", "var(--muted)", FSS));
    });

    // общий прирост — вертикальная стрелка слева от первой точки, подпись у хвоста
    var ax = sx(-0.12);
    g.appendChild(el("line", {x1:ax, y1:sy(0.55), x2:ax, y2:sy(0.72),
      stroke:"var(--muted)", "stroke-width":LW}));
    g.appendChild(el("path", {
      d:"M" + ax + " " + sy(0.72) +
        " L" + sx(-0.155) + " " + sy(0.705) +
        " L" + sx(-0.085) + " " + sy(0.705) + " Z",
      fill:"var(--muted)"}));
    g.appendChild(txt(ax - PAD, sy(0.55) + PAD*3, "+0.17", "end", "var(--muted)", FSS));

    // легенда одной строкой под схемой
    g.appendChild(txt(sx(-0.25), sy(0.50) + PAD*11,
      "Архитектура та же: Whisper + BEATs + Q-former на 64 запроса + LLM. Растут данные.",
      "start", "var(--muted)", FSS));

    var slot = document.getElementById("slot");
    slot.innerHTML = "";
    slot.appendChild(svg);
  }catch(e){
    var f = document.getElementById("fallback");
    if(f){ f.style.display = "block"; }
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
