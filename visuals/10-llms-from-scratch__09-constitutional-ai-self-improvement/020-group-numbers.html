<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Групповое преимущество на четырёх наградах</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --axis: #98a2b3;
      --guide: #475467;
      --positive: #16835b;
      --positive-fill: #dff5e9;
      --positive-solid: #1f9d6a;
      --negative: #c43d4d;
      --negative-fill: #fde8eb;
      --track: #d6dce7;
      --formula: #eef2f8;
      --shadow: #dbe2ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #192231;
        --ink: #edf2f7;
        --muted: #aab4c3;
        --axis: #697589;
        --guide: #c1cad7;
        --positive: #6ee7ad;
        --positive-fill: #173d31;
        --positive-solid: #238b64;
        --negative: #ff8795;
        --negative-fill: #47242b;
        --track: #455166;
        --formula: #202b3d;
        --shadow: #0b1018;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
    }

    body {
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    figure {
      margin: 0;
      width: 100%;
      background: var(--bg);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      overflow: visible;
      background: var(--bg);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
      text-rendering: geometricPrecision;
    }

    .title {
      font-size: 22px;
      font-weight: 760;
      letter-spacing: -0.3px;
    }

    .subtitle {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 520;
    }

    .answer-label {
      font-size: 14px;
      font-weight: 700;
    }

    .reward-caption {
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.2px;
    }

    .reward-number {
      font-size: 27px;
      font-weight: 800;
    }

    .mean-label,
    .sigma-label {
      font-size: 13px;
      font-weight: 750;
    }

    .advantage-caption {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1px;
    }

    .advantage-number {
      font-size: 22px;
      font-weight: 820;
    }

    .formula {
      font-size: 17px;
      font-weight: 720;
      font-variant-numeric: tabular-nums;
    }

    .direction-note {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .mean-line {
      stroke: var(--guide);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .sigma-bracket {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .reward-track {
      fill: var(--panel);
      stroke: var(--track);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .reward-positive {
      fill: var(--positive-solid);
      stroke: var(--positive);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .reward-zero-cap {
      stroke: var(--negative);
      stroke-width: 5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .positive-text {
      fill: var(--positive);
    }

    .negative-text {
      fill: var(--negative);
    }

    .reward-on-fill {
      fill: #ffffff;
    }

    .advantage-positive {
      fill: var(--positive-fill);
      stroke: var(--positive);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .advantage-negative {
      fill: var(--negative-fill);
      stroke: var(--negative);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .formula-panel {
      fill: var(--formula);
      stroke: var(--shadow);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    #fallback {
      margin: 12px;
      padding: 12px;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--negative);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title diagram-desc">
    <svg
      id="diagram"
      viewBox="0 0 760 420"
      width="760"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <title id="diagram-desc">
        Четыре ответа с наградами 1, 0, 0 и 1. Среднее и стандартное
        отклонение равны 0,5. Групповые преимущества равны плюс 1,
        минус 1, минус 1 и плюс 1.
      </title>
      <text id="diagram-title" class="title">
        Групповое преимущество на четырёх наградах
      </text>
      <text id="diagram-subtitle" class="subtitle">
        Один промпт · среднее 0,5 · стандартное отклонение 0,5
      </text>
      <g id="drawing"></g>
    </svg>

    <div id="fallback" hidden>
      Схема должна показать награды [1, 0, 0, 1], среднее 0,5,
      стандартное отклонение 0,5 и преимущества [+1, −1, −1, +1].
    </div>
  </figure>

  <script>
    const data = [
      { answer: "А", reward: 1, advantage: +1, x: 2 },
      { answer: "Б", reward: 0, advantage: -1, x: 4 },
      { answer: "В", reward: 0, advantage: -1, x: 6 },
      { answer: "Г", reward: 1, advantage: +1, x: 8 }
    ];
    const stats = [
      { label: "среднее", value: 0.5 },
      { label: "стандартное отклонение", value: 0.5 }
    ];
    const layout = [
      1.72, 1.43, 1.14, 0.42, 0.78, 0.30,
      0.15, 9.02, 9.36, 9.18, 0.76, 9.48,
      -0.30, -0.86, -0.45, -0.69,
      0.72, 0.11, -1.16, -1.43, -1.61,
      0.08
    ];
    const origin = { x: 52, y: 224 };
    const scale = { x: 72, y: 112 };
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const VIEW_WIDTH = 760;
    const VIEW_HEIGHT = 420;
    const LABEL_PADDING = 8;
    const LINE_THICKNESS = 2;
    const SVG_NS = "http://www.w3.org/2000/svg";

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const title = document.getElementById("diagram-title");
      const subtitle = document.getElementById("diagram-subtitle");

      if (!svg || !drawing || !title || !subtitle) {
        throw new Error("Не найдены элементы схемы");
      }

      const [
        titleY, subtitleY, answerY, barHalf, rewardCaptionY, rewardNumberY,
        meanLabelX, sigmaLabelX, sigmaX, sigmaTickX, sigmaLabelY, axisEndX,
        advantageTopY, advantageBottomY, advantageCaptionY, advantageNumberY,
        advantageHalf, cornerRadius, formulaY, noteY, panelBottomY,
        panelSideInset
      ] = layout;

      const zero = Math.min(...data.map(item => item.reward));
      const one = Math.max(...data.map(item => item.reward));
      const mean = stats.find(item => item.label === "среднее").value;
      const deviation = stats.find(
        item => item.label === "стандартное отклонение"
      ).value;
      const firstX = Math.min(...data.map(item => item.x));
      const lastX = Math.max(...data.map(item => item.x));
      const labelPadX = LABEL_PADDING / scale.x;
      const labelPadY = LABEL_PADDING / scale.y;

      const make = (tag, attributes, content) => {
        const element = document.createElementNS(SVG_NS, tag);
        Object.entries(attributes || {}).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const add = element => {
        drawing.appendChild(element);
        return element;
      };

      const line = (x1, y1, x2, y2, className) =>
        add(make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        }));

      const rect = (left, bottom, right, top, className, rounded) => {
        const attributes = {
          x: sx(left),
          y: sy(top),
          width: Math.abs(sx(right) - sx(left)),
          height: Math.abs(sy(bottom) - sy(top)),
          class: className
        };

        if (rounded) {
          attributes.rx = Math.abs(sx(cornerRadius) - sx(zero));
          attributes.ry = Math.abs(sy(cornerRadius) - sy(zero));
        }

        return add(make("rect", attributes));
      };

      const text = (
        content,
        x,
        y,
        className,
        anchor = "middle",
        parent = drawing
      ) => {
        const element = make("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        }, content);
        parent.appendChild(element);
        return element;
      };

      title.setAttribute("x", String(sx(meanLabelX)));
      title.setAttribute("y", String(sy(titleY)));
      title.setAttribute("text-anchor", "start");

      subtitle.setAttribute("x", String(sx(meanLabelX)));
      subtitle.setAttribute("y", String(sy(subtitleY)));
      subtitle.setAttribute("text-anchor", "start");

      line(zero, zero, axisEndX, zero, "axis");
      line(zero, mean, sigmaTickX, mean, "mean-line");

      text(
        "μ = 0,5",
        meanLabelX,
        mean + labelPadY,
        "mean-label",
        "start"
      );

      line(sigmaX, mean, sigmaX, one, "sigma-bracket");
      line(sigmaTickX, mean, sigmaX, mean, "sigma-bracket");
      line(sigmaTickX, one, sigmaX, one, "sigma-bracket");

      text(
        "σ = 0,5",
        sigmaLabelX,
        sigmaLabelY,
        "sigma-label",
        "end"
      );

      data.forEach(item => {
        const left = item.x - barHalf;
        const right = item.x + barHalf;
        const isPositive = item.advantage > zero;

        text(
          `Ответ ${item.answer}`,
          item.x,
          answerY,
          "answer-label",
          "middle"
        );

        rect(left, zero, right, one, "reward-track", true);

        if (item.reward > zero) {
          rect(
            left,
            zero,
            right,
            item.reward,
            "reward-positive",
            true
          );
          text(
            "награда",
            item.x,
            rewardCaptionY,
            "reward-caption reward-on-fill",
            "middle"
          );
          text(
            String(item.reward),
            item.x,
            rewardNumberY,
            "reward-number reward-on-fill",
            "middle"
          );
        } else {
          line(
            left + labelPadX,
            zero,
            right - labelPadX,
            zero,
            "reward-zero-cap"
          );
          text(
            "награда",
            item.x,
            rewardCaptionY,
            "reward-caption negative-text",
            "middle"
          );
          text(
            String(item.reward),
            item.x,
            rewardNumberY,
            "reward-number negative-text",
            "middle"
          );
        }

        rect(
          item.x - advantageHalf,
          advantageBottomY,
          item.x + advantageHalf,
          advantageTopY,
          isPositive ? "advantage-positive" : "advantage-negative",
          true
        );

        text(
          "преимущество",
          item.x,
          advantageCaptionY,
          `advantage-caption ${isPositive ? "positive-text" : "negative-text"}`,
          "middle"
        );

        text(
          isPositive ? "+1 ↑" : "−1 ↓",
          item.x,
          advantageNumberY,
          `advantage-number ${isPositive ? "positive-text" : "negative-text"}`,
          "middle"
        );
      });

      rect(
        meanLabelX,
        panelBottomY,
        axisEndX,
        formulaY + labelPadY,
        "formula-panel",
        true
      );

      text(
        "[1, 0, 0, 1]   →   [+1, −1, −1, +1]",
        (firstX + lastX) * mean,
        formulaY,
        "formula",
        "middle"
      );

      text(
        "выше среднего — чаще ↑    ·    ниже среднего — реже ↓",
        (firstX + lastX) * mean,
        noteY,
        "direction-note",
        "middle"
      );

      svg.setAttribute("data-rendered", String(LINE_THICKNESS));
      svg.setAttribute("data-canvas", `${VIEW_WIDTH}×${VIEW_HEIGHT}`);
      svg.setAttribute("data-deviation", String(deviation));
      svg.setAttribute("data-panel-inset", String(panelSideInset));
    } catch (error) {
      const fallback = document.getElementById("fallback");
      if (fallback) {
        fallback.hidden = false;
        fallback.textContent =
          "Схема должна показать награды [1, 0, 0, 1], среднее 0,5, " +
          "стандартное отклонение 0,5 и преимущества [+1, −1, −1, +1].";
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
