<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Схема модели сверху вниз</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1d1f24; --muted:#5d636e; --line:#3a4250;
    --box:#ffffff; --stack:#eef2fa; --stackline:#4a6fb5; --accent:#b5541f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --fg:#e8eaee; --muted:#a3abb8; --line:#9aa4b4;
      --box:#1d2128; --stack:#1b2331; --stackline:#7fa6e8; --accent:#e2915a;
    }
  }
  html,body{margin:0}
  .fig{background:var(--bg);color:var(--fg);padding:10px 8px;
       font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;text-align:center}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto}
  .l{fill:var(--fg);font-size:12px}
  .m{fill:var(--muted);font-size:11px}
  .sh{fill:var(--accent);font-size:11.5px;font-family:ui-monospace,Menlo,monospace}
  .fail{color:var(--muted);font-size:13px;white-space:pre-wrap}
</style>
<div class="fig">
  <h2>Путь тензора сверху вниз: форма внутри стопки не меняется</h2>
  <div id="host"></div>
</div>
<script>
(function(){
var host=document.getElementById('host');
try{
  // ---- данные схемы -------------------------------------------------
  // y растёт вниз, в единицах схемы; x — центр колонки
  var CX=0;
  var nodes=[
    {y:0,  t:"input (B, N)",              s:"(B, N)",      k:"io"},
    {y:1,  t:"token + pos embedding",     s:"(B, N, d)",   k:"box"},
    {y:3.4,t:"RMSNorm",                   s:"",            k:"in"},
    {y:4.4,t:"causal MHA",                s:"",            k:"in"},
    {y:5.4,t:"residual",                  s:"",            k:"in"},
    {y:6.4,t:"RMSNorm",                   s:"",            k:"in"},
    {y:7.4,t:"SwiGLU",                    s:"",            k:"in"},
    {y:8.4,t:"residual",                  s:"",            k:"in"},
    {y:10.6,t:"final RMSNorm",            s:"(B, N, d)",   k:"box"},
    {y:11.9,t:"lm_head",                  s:"",            k:"box"},
    {y:13.2,t:"logits (B, N, 65)",        s:"(B, N, 65)",  k:"io"}
  ];
  var stack={y0:2.75,y1:9.1,label:"блок × L",inShape:"(B, N, d)",outShape:"(B, N, d)"};
  var halfW=2.6, halfWin=1.9, halfH=0.34, halfHin=0.32, stackHalf=3.05;

  // ---- один origin и один scale -------------------------------------
  var origin={x:250,y:26}, scale={x:52,y:33};
  function sx(x){return origin.x+x*scale.x;}
  function sy(y){return origin.y+y*scale.y;}

  // ---- рисование ----------------------------------------------------
  var NS="http://www.w3.org/2000/svg";
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  var svg=el("svg",{viewBox:"0 0 500 490",preserveAspectRatio:"xMidYMid meet",
                    role:"img","aria-label":"Схема GPT сверху вниз"});
  svg.appendChild(el("rect",{x:0,y:0,width:500,height:490,fill:"var(--bg)"}));

  var defs=el("defs",{});
  var mk=el("marker",{id:"ar",markerWidth:7,markerHeight:7,refX:6,refY:3.5,orient:"auto"});
  mk.appendChild(el("path",{d:"M0,0 L7,3.5 L0,7 Z",fill:"var(--line)"}));
  defs.appendChild(mk);svg.appendChild(defs);

  function txt(x,y,s,cls,anch,dx,dy){
    var t=el("text",{x:x+(dx||0),y:y+(dy||0),class:cls,"text-anchor":anch||"middle"});
    t.textContent=s;svg.appendChild(t);return t;
  }
  function line(x1,y1,x2,y2,arrow){
    svg.appendChild(el("line",{x1:x1,y1:y1,x2:x2,y2:y2,stroke:"var(--line)","stroke-width":1.4,
      "marker-end":arrow?"url(#ar)":null}));
  }

  // корпус стопки
  svg.appendChild(el("rect",{
    x:sx(CX-stackHalf),y:sy(stack.y0),
    width:sx(CX+stackHalf)-sx(CX-stackHalf),
    height:sy(stack.y1)-sy(stack.y0),
    rx:8,fill:"var(--stack)",stroke:"var(--stackline)","stroke-width":1.4,"stroke-dasharray":"6 4"}));
  txt(sx(CX-stackHalf),sy(stack.y0),stack.label,"l","start",6,16);

  // блоки
  nodes.forEach(function(n){
    var inner=n.k==="in", hw=inner?halfWin:halfW, hh=inner?halfHin:halfH;
    svg.appendChild(el("rect",{
      x:sx(CX-hw),y:sy(n.y-hh),
      width:sx(CX+hw)-sx(CX-hw),height:sy(n.y+hh)-sy(n.y-hh),
      rx:inner?5:7,fill:inner?"var(--bg)":"var(--box)",
      stroke:n.k==="io"?"var(--accent)":"var(--line)","stroke-width":n.k==="io"?1.6:1.2}));
    txt(sx(CX),sy(n.y),n.t,inner?"m":"l","middle",0,4);
  });

  // стрелки между узлами (по краям прямоугольников)
  function connect(a,b){
    var ah=a.k==="in"?halfHin:halfH, bh=b.k==="in"?halfHin:halfH;
    line(sx(CX),sy(a.y+ah),sx(CX),sy(b.y-bh)-1,true);
  }
  for(var i=0;i<nodes.length-1;i++) connect(nodes[i],nodes[i+1]);

  // подписи форм: справа от узла, у хвоста стрелки, разведены по стороне
  function shape(y,s,side){
    var sgn=side==="right"?1:-1, hw=halfW;
    txt(sx(CX+sgn*hw),sy(y),s,"sh",side==="right"?"start":"end",sgn*8,4);
  }
  shape(nodes[0].y,"(B, N)","right");
  shape(nodes[1].y,"(B, N, d)","right");
  shape(nodes[8].y,"(B, N, d)","right");
  shape(nodes[10].y,"(B, N, 65)","right");

  // вход/выход стопки — форма одна и та же, слева
  txt(sx(CX-stackHalf),sy(stack.y0),stack.inShape,"sh","end",-8,-4);
  txt(sx(CX-stackHalf),sy(stack.y1),stack.outShape,"sh","end",-8,12);
  txt(sx(CX-stackHalf),sy((stack.y0+stack.y1)/2),"форма","m","end",-8,-6);
  txt(sx(CX-stackHalf),sy((stack.y0+stack.y1)/2),"не меняется","m","end",-8,7);

  // подпись к последней стрелке — у её хвоста, сбоку
  txt(sx(CX+halfW),sy((nodes[9].y+nodes[10].y)/2),"65 оценок на позицию","m","start",8,4);

  host.appendChild(svg);
}catch(e){
  host.innerHTML='<p class="fail">Схема должна показывать путь тензора сверху вниз: '+
    'input (B, N) → token + pos embedding → (B, N, d) → стопка из L блоков '+
    '(RMSNorm, causal MHA, residual, RMSNorm, SwiGLU, residual), вход и выход блока — '+
    'одинаковые (B, N, d) → final RMSNorm → lm_head → logits (B, N, 65).</p>';
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
