<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Карта форматов экспорта и конечных вьюеров</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f8fc;
    --panel: #ffffff;
    --text: #172033;
    --muted: #566078;
    --line: #66728d;
    --guide: #c8cfdd;
    --scene: #4f67d8;
    --ply: #b76a20;
    --splat: #16856f;
    --gltf: #8058c7;
    --usd: #3474b9;
    --label-bg: #f7f8fc;
    --warn: #9a4f23;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111521;
      --panel: #1a2030;
      --text: #edf1fa;
      --muted: #aeb8ce;
      --line: #9aa7c2;
      --guide: #424b61;
      --scene: #8192ef;
      --ply: #e2a25e;
      --splat: #50bca4;
      --gltf: #b195ec;
      --usd: #71a9e2;
      --label-bg: #111521;
      --warn: #e1a373;
    }
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  h1 {
    font-size: 22px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--bg);
  }

  .column {
    fill: var(--muted);
    font-size: 12px;
    font-weight: bold;
    letter-spacing: .08em;
  }

  .guide {
    stroke: var(--guide);
    stroke-width: 1px;
  }

  .route,
  .branch {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .branch {
    stroke-width: 2.5px;
  }

  .arrow {
    fill: var(--line);
  }

  .junction {
    fill: var(--line);
  }

  .card {
    fill: var(--panel);
    stroke: var(--guide);
    stroke-width: 1.5px;
  }

  .card-title {
    fill: var(--text);
    font-size: 16px;
    font-weight: bold;
  }

  .card-detail {
    fill: var(--muted);
    font-size: 12px;
  }

  .card-code {
    fill: var(--text);
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 13px;
    font-weight: bold;
  }

  .route-label {
    fill: var(--muted);
    font-size: 11px;
    font-weight: bold;
    paint-order: stroke;
    stroke: var(--label-bg);
    stroke-width: 5px;
    stroke-linejoin: round;
  }

  .footer {
    fill: var(--text);
    font-size: 13px;
    font-weight: bold;
  }

  .footer-accent {
    fill: var(--warn);
  }

  .fallback {
    font-size: 16px;
    color: var(--text);
  }

  .tone-scene { fill: var(--scene); }
  .tone-ply { fill: var(--ply); }
  .tone-splat { fill: var(--splat); }
  .tone-gltf { fill: var(--gltf); }
  .tone-usd { fill: var(--usd); }
</style>
</head>
<body>
<h1>Карта форматов экспорта и конечных вьюеров</h1>

<svg id="map" viewBox="0 0 1200 440" width="1200" height="440"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Маршруты экспорта обученной Gaussian Splatting-сцены</title>
  <desc id="svg-desc">Обученная сцена ветвится к форматам PLY, splat, glTF с KHR_gaussian_splatting и OpenUSD с UsdVolParticleField3DGaussianSplat, а затем к подходящим вьюерам.</desc>
  <g id="drawing"></g>
</svg>

<p id="fallback" class="fallback" hidden>
  Схема должна была показать маршрут: обученная сцена → .ply, .splat, glTF или OpenUSD → конечный вьюер, который понимает выбранный формат или схему.
</p>

<script>
const data = [
  {
    kind: "meta",
    origin: [39, 24],
    scale: 9.45,
    zero: 0,
    headBack: 1.05,
    headWing: 0.65,
    dotRadius: 0.31
  },
  {
    kind: "guide",
    points: [[2, 3.25], [119, 3.25]]
  },
  {
    kind: "label",
    className: "column",
    anchor: "middle",
    at: [13.5, 1.45],
    text: "ОБУЧЕННАЯ СЦЕНА"
  },
  {
    kind: "label",
    className: "column",
    anchor: "middle",
    at: [56, 1.45],
    text: "ФОРМАТ"
  },
  {
    kind: "label",
    className: "column",
    anchor: "middle",
    at: [103.5, 1.45],
    text: "КОНЕЧНЫЙ ВЬЮЕР"
  },
  {
    kind: "branch",
    points: [[24, 20.75], [32, 20.75]]
  },
  {
    kind: "branch",
    points: [[32, 8.25], [32, 34.25]]
  },
  {
    kind: "dot",
    at: [32, 20.75]
  },
  {
    kind: "route",
    points: [[32, 8.25], [39.5, 8.25]],
    head: [39.5, 8.25]
  },
  {
    kind: "route",
    points: [[32, 16.95], [39.5, 16.95]],
    head: [39.5, 16.95]
  },
  {
    kind: "route",
    points: [[32, 25.65], [39.5, 25.65]],
    head: [39.5, 25.65]
  },
  {
    kind: "route",
    points: [[32, 34.25], [39.5, 34.25]],
    head: [39.5, 34.25]
  },
  {
    kind: "route",
    points: [[73, 8.25], [88, 8.25]],
    head: [88, 8.25]
  },
  {
    kind: "route",
    points: [[73, 16.95], [88, 16.95]],
    head: [88, 16.95]
  },
  {
    kind: "route",
    points: [[73, 25.65], [88, 25.65]],
    head: [88, 25.65]
  },
  {
    kind: "route",
    points: [[73, 34.25], [88, 34.25]],
    head: [88, 34.25]
  },
  {
    kind: "label",
    className: "route-label",
    anchor: "middle",
    at: [80.5, 7.05],
    text: "сырые данные"
  },
  {
    kind: "label",
    className: "route-label",
    anchor: "middle",
    at: [80.5, 15.75],
    text: "для web"
  },
  {
    kind: "label",
    className: "route-label",
    anchor: "middle",
    at: [80.5, 24.45],
    text: "glTF"
  },
  {
    kind: "label",
    className: "route-label",
    anchor: "middle",
    at: [80.5, 33.05],
    text: "USD"
  },
  {
    kind: "node",
    tone: "tone-scene",
    box: [3, 16.25, 24, 25.25],
    stripe: [3, 16.25, 3.85, 25.25],
    lines: [
      ["card-title", 13.5, 19.25, "Обученная сцена"],
      ["card-detail", 13.5, 21.35, "одни и те же гауссианы"],
      ["card-detail", 13.5, 23.15, "разные маршруты экспорта"]
    ]
  },
  {
    kind: "node",
    tone: "tone-ply",
    box: [39.5, 4.85, 73, 11.65],
    stripe: [39.5, 4.85, 40.3, 11.65],
    lines: [
      ["card-title", 56.25, 6.45, ".ply"],
      ["card-detail", 56.25, 8.25, "сырые параметры гауссиан"],
      ["card-detail", 56.25, 10.05, "переносимый мастер-файл • больше места"]
    ]
  },
  {
    kind: "node",
    tone: "tone-splat",
    box: [39.5, 13.55, 73, 20.35],
    stripe: [39.5, 13.55, 40.3, 20.35],
    lines: [
      ["card-title", 56.25, 15.15, ".splat"],
      ["card-detail", 56.25, 16.95, "квантованный формат"],
      ["card-detail", 56.25, 18.75, "меньше размер • часть точности"]
    ]
  },
  {

    tone: "tone-gltf",
    box: [39.5, 22.25, 73, 29.05],
    stripe: [39.5, 22.25, 40.3, 29.05],
    lines: [
      ["card-title", 56.25, 23.85, "glTF"],
      ["card-code", 56.25, 25.65, "KHR_gaussian_splatting"],
      ["card-detail", 56.25, 27.45, "release candidate • февраль 2026"]
    ]
  },
  {
    kind: "node",
    tone: "tone-usd",
    box: [39.5, 30.85, 73, 37.65],
    stripe: [39.5, 30.85, 40.3, 37.65],
    lines: [
      ["card-title", 56.25, 32.35, "OpenUSD"],
      ["card-code", 56.25, 34.25, "UsdVolParticleField3DGaussianSplat"],
      ["card-detail", 56.25, 36.05, "схема для USD-пайплайна"]
    ]
  },
  {
    kind: "node",
    tone: "tone-ply",
    box: [88, 4.85, 118, 11.65],
    stripe: [88, 4.85, 88.8, 11.65],
    lines: [
      ["card-title", 103, 6.45, "Инструменты обработки"],
      ["card-detail", 103, 8.25, "обмен между инструментами"],
      ["card-detail", 103, 10.05, "повторная обработка сцены"]
    ]
  },
  {
    kind: "node",
    tone: "tone-splat",
    box: [88, 13.55, 118, 20.35],
    stripe: [88, 13.55, 88.8, 20.35],
    lines: [
      ["card-title", 103, 15.15, "SuperSplat"],
      ["card-detail", 103, 16.95, "PlayCanvas • браузерный стек"],
      ["card-detail", 103, 18.75, "редактирование и web-публикация"]
    ]
  },
  {
    kind: "node",
    tone: "tone-gltf",
    box: [88, 22.25, 118, 29.05],
    stripe: [88, 22.25, 88.8, 29.05],
    lines: [
      ["card-title", 103, 23.85, "Совместимые glTF-вьюеры"],
      ["card-detail", 103, 25.65, "обмен между 3D-вьюерами"],
      ["card-detail", 103, 27.45, "проверить поддержку версии"]
    ]
  },
  {
    kind: "node",
    tone: "tone-usd",
    box: [88, 30.85, 118, 37.65],
    stripe: [88, 30.85, 88.8, 37.65],
    lines: [
      ["card-title", 103, 32.35, "USD-приложения"],
      ["card-detail", 103, 34.25, "NVIDIA Omniverse"],
      ["card-detail", 103, 36.05, "Vision Pro • пространственные приложения"]
    ]
  },
  {
    kind: "label",
    className: "footer footer-accent",
    anchor: "middle",
    at: [60.5, 40.55],
    text: "Маршрут определяет конечный вьюер: он должен понимать формат или схему"
  }
];

const [meta, ...items] = data;
const [originX, originY] = meta.origin;
const origin = Object.freeze({ x: originX, y: originY });
const scale = meta.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("map");
  const root = document.getElementById("drawing");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  const element = (name, attributes, className) => {
    const node = document.createElementNS(namespace, name);
    for (const [key, value] of Object.entries(attributes)) {
      node.setAttribute(key, String(value));
    }
    if (className) node.setAttribute("class", className);
    return node;
  };

  const pathData = points => points.map(([x, y], command) => {
    const prefix = command ? "L" : "M";
    return `${prefix} ${sx(x)} ${sy(y)}`;
  }).join(" ");

  const drawArrow = item => {
    const [headX, headY] = item.head;
    const polygon = element("polygon", {
      points: [
        `${sx(headX)},${sy(headY)}`,
        `${sx(headX - meta.headBack)},${sy(headY - meta.headWing)}`,
        `${sx(headX - meta.headBack)},${sy(headY + meta.headWing)}`
      ].join(" ")
    }, "arrow");
    root.appendChild(polygon);
  };

  for (const item of items) {
    if (item.kind === "guide") {
      root.appendChild(element("path", { d: pathData(item.points) }, "guide"));
    }
  }

  for (const item of items) {
    if (item.kind === "branch" || item.kind === "route") {
      root.appendChild(element("path", { d: pathData(item.points) }, item.kind));
      if (item.kind === "route") drawArrow(item);
    }

    if (item.kind === "dot") {
      const [x, y] = item.at;
      root.appendChild(element("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(meta.dotRadius) - sx(meta.zero)
      }, "junction"));
    }
  }

  for (const item of items) {
    if (item.kind !== "node") continue;

    const [left, top, right, bottom] = item.box;
    const [stripeLeft, stripeTop, stripeRight, stripeBottom] = item.stripe;

    root.appendChild(element("rect", {
      x: sx(left),
      y: sy(top),
      width: sx(right) - sx(left),
      height: sy(bottom) - sy(top)
    }, "card"));

    root.appendChild(element("rect", {
      x: sx(stripeLeft),
      y: sy(stripeTop),
      width: sx(stripeRight) - sx(stripeLeft),
      height: sy(stripeBottom) - sy(stripeTop)
    }, item.tone));

    for (const [className, x, y, content] of item.lines) {
      const text = element("text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, className);
      text.textContent = content;
      root.appendChild(text);
    }
  }

  for (const item of items) {
    if (item.kind !== "label") continue;
    const [x, y] = item.at;
    const text = element("text", {
      x: sx(x),
      y: sy(y),
      "text-anchor": item.anchor,
      "dominant-baseline": "middle"
    }, item.className);
    text.textContent = item.text;
    root.appendChild(text);
  }

  fallback.hidden = true;
} catch (error) {
  document.getElementById("map").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
