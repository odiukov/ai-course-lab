<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как растёт вложенность моделей убеждений</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --surface: #ffffff;
      --surface-soft: #eef3f8;
      --ink: #172033;
      --muted: #5d6a7d;
      --line: #a7b3c3;
      --accent: #315fcb;
      --accent-soft: #e8efff;
      --second: #8a4fbe;
      --second-soft: #f2eafa;
      --fact: #18745f;
      --fact-soft: #e4f5ef;
      --arrow: #657389;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .diagram {
      width: 100%;
      background: var(--surface);
      padding: 16px;
    }

    h2 {
      margin: unset;
      padding: 2px 4px 12px;
      font-size: 22px;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
      background: var(--surface);
    }

    .panel {
      fill: var(--surface);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .observation {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .action {
      fill: var(--fact-soft);
      stroke: var(--fact);
      stroke-width: 2px;
    }

    .anya-frame {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .boris-frame {
      fill: var(--second-soft);
      stroke: var(--second);
      stroke-width: 3px;
    }

    .fact {
      fill: var(--surface);
      stroke: var(--fact);
      stroke-width: 2px;
    }

    .summary {
      fill: var(--surface-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .connector {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .arrowhead {
      fill: var(--arrow);
    }

    text {
      fill: var(--ink);
      font-size: 17px;
    }

    .order {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: .04em;
    }

    .descriptor,
    .note {
      fill: var(--muted);
      font-size: 15px;
    }

    .frame-label {
      font-size: 16px;
      font-weight: bold;
    }

    .core {
      font-size: 19px;
      font-weight: bold;
    }

    .small-core {
      font-size: 17px;
      font-weight: bold;
    }

    .accent-text {
      fill: var(--accent);
    }

    .second-text {
      fill: var(--second);
    }

    .fact-text {
      fill: var(--fact);
    }

    .summary-text {
      font-size: 17px;
      font-weight: bold;
    }

    #fallback {
      margin: unset;
      background: var(--surface-soft);
      color: var(--ink);
      padding: 18px;
      font-size: 17px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #171f2c;
        --surface-soft: #222d3d;
        --ink: #edf2fa;
        --muted: #aab7ca;
        --line: #526177;
        --accent: #86a8ff;
        --accent-soft: #20345f;
        --second: #d3a0f1;
        --second-soft: #402852;
        --fact: #70d5b8;
        --fact-soft: #193d36;
        --arrow: #9aa9bd;
      }
    }
  </style>
</head>
<body>
  <main class="diagram" aria-labelledby="diagram-title">
    <h2 id="diagram-title">Как растёт вложенность моделей убеждений</h2>
    <svg id="belief-diagram"
         viewBox="0 0 1200 430"
         width="1200"
         height="430"
         role="img"
         aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        Три уровня модели убеждений: действие по собственному наблюдению,
        мнение Ани о Борисе и мнение Ани о модели Бориса о Вере.
      </desc>
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать три порядка: агент действует по своему
      наблюдению; Аня моделирует выбор Бориса; Аня моделирует, что Борис
      думает о полученном Верой обновлении.
    </p>
  </main>

  <script>
    const diagram = [{
      canvas: { left: 0, top: 0, right: 1200, bottom: 430 },
      rectangles: [
        { left: 18, top: 92, right: 362, bottom: 374, className: "panel" },
        { left: 58, top: 151, right: 322, bottom: 241, className: "observation" },
        { left: 58, top: 288, right: 322, bottom: 339, className: "action" },

        { left: 426, top: 92, right: 790, bottom: 374, className: "anya-frame" },
        { left: 478, top: 173, right: 738, bottom: 301, className: "fact" },

        { left: 850, top: 92, right: 1182, bottom: 374, className: "anya-frame" },
        { left: 892, top: 156, right: 1142, bottom: 342, className: "boris-frame" },
        { left: 930, top: 218, right: 1106, bottom: 303, className: "fact" },

        { left: 18, top: 390, right: 1182, bottom: 426, className: "summary" }
      ],
      segments: [
        { x1: 190, y1: 248, x2: 190, y2: 277, className: "connector" },
        { x1: 374, y1: 235, x2: 414, y2: 235, className: "connector" },
        { x1: 802, y1: 235, x2: 838, y2: 235, className: "connector" }
      ],
      arrowheads: [
        {
          className: "arrowhead",
          points: [
            { x: 190, y: 285 },
            { x: 182, y: 273 },
            { x: 198, y: 273 }
          ]
        },
        {
          className: "arrowhead",
          points: [
            { x: 422, y: 235 },
            { x: 410, y: 227 },
            { x: 410, y: 243 }
          ]
        },
        {
          className: "arrowhead",
          points: [
            { x: 846, y: 235 },
            { x: 834, y: 227 },
            { x: 834, y: 243 }
          ]
        }
      ],
      labels: [
        {
          anchor: "middle",
          className: "order",
          lines: [{ x: 190, y: 31, value: "0 · НУЛЕВОЙ ПОРЯДОК" }]
        },
        {
          anchor: "middle",
          className: "descriptor",
          lines: [{ x: 190, y: 61, value: "только собственное наблюдение" }]
        },
        {
          anchor: "middle",
          className: "frame-label",
          lines: [{ x: 190, y: 126, value: "АНЯ ВИДИТ" }]
        },
        {
          anchor: "middle",
          className: "note",
          lines: [{ x: 190, y: 181, value: "сообщение" }]
        },
        {
          anchor: "middle",
          className: "core fact-text",
          lines: [{ x: 190, y: 216, value: "«комната 4»" }]
        },
        {
          anchor: "middle",
          className: "small-core fact-text",
          lines: [{ x: 190, y: 320, value: "выбирает комнату 4" }]
        },
        {
          anchor: "middle",
          className: "note",
          lines: [{ x: 190, y: 361, value: "чужой перспективы ещё нет" }]
        },

        {
          anchor: "middle",
          className: "order",
          lines: [{ x: 608, y: 31, value: "1 · ПЕРВЫЙ ПОРЯДОК" }]
        },
        {
          anchor: "middle",
          className: "descriptor",
          lines: [{ x: 608, y: 61, value: "одна рамка чужой перспективы" }]
        },
        {
          anchor: "start",
          className: "frame-label accent-text",
          lines: [{ x: 451, y: 126, value: "АНЯ СЧИТАЕТ" }]
        },
        {
          anchor: "middle",
          className: "note",
          lines: [{ x: 608, y: 207, value: "что Борис" }]
        },
        {
          anchor: "middle",
          className: "core",
          lines: [
            { x: 608, y: 243, value: "выберет" },
            { x: 608, y: 274, value: "комнату 4" }
          ]
        },
        {
          anchor: "middle",
          className: "note",
          lines: [{ x: 608, y: 351, value: "Аня → Борис → выбор" }]
        },

        {
          anchor: "middle",
          className: "order",
          lines: [{ x: 1016, y: 31, value: "2 · ВТОРОЙ ПОРЯДОК" }]
        },
        {
          anchor: "middle",
          className: "descriptor",
          lines: [{ x: 1016, y: 61, value: "две вложенные рамки перспективы" }]
        },
        {
          anchor: "start",
          className: "frame-label accent-text",
          lines: [{ x: 874, y: 126, value: "АНЯ СЧИТАЕТ" }]
        },
        {
          anchor: "start",
          className: "frame-label second-text",
          lines: [{ x: 914, y: 190, value: "ЧТО БОРИС СЧИТАЕТ" }]
        },
        {
          anchor: "middle",
          className: "small-core fact-text",
          lines: [
            { x: 1018, y: 252, value: "Вера получила" },
            { x: 1018, y: 280, value: "обновление" }
          ]
        },
        {
          anchor: "middle",
          className: "note",
          lines: [{ x: 1018, y: 325, value: "Борис → Вера → сообщение" }]
        },
        {
          anchor: "middle",
          className: "note",
          lines: [{ x: 1016, y: 360, value: "Аня → Борис → Вера" }]
        },

        {
          anchor: "middle",
          className: "summary-text",
          lines: [{
            x: 600,
            y: 414,
            value: "Добавилась рамка перспективы → порядок вырос на один"
          }]
        }
      ]
    }];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const svg = document.querySelector("#belief-diagram");
      const fallback = document.querySelector("#fallback");
      const model = diagram.values().next().value;

      const make = name => document.createElementNS(namespace, name);

      const addRectangle = item => {
        const element = make("rect");
        element.setAttribute("x", sx(item.left));
        element.setAttribute("y", sy(item.top));
        element.setAttribute("width", sx(item.right) - sx(item.left));
        element.setAttribute("height", sy(item.bottom) - sy(item.top));
        element.setAttribute("class", item.className);
        svg.append(element);
      };

      const addSegment = item => {
        const element = make("line");
        element.setAttribute("x1", sx(item.x1));
        element.setAttribute("y1", sy(item.y1));
        element.setAttribute("x2", sx(item.x2));
        element.setAttribute("y2", sy(item.y2));
        element.setAttribute("class", item.className);
        svg.append(element);
      };

      const addArrowhead = item => {
        const element = make("polygon");
        const mapped = [];
        for (const point of item.points) {
          mapped.push(`${sx(point.x)},${sy(point.y)}`);
        }
        element.setAttribute("points", mapped.join(" "));
        element.setAttribute("class", item.className);
        svg.append(element);
      };

      const addLabel = item => {
        const element = make("text");
        element.setAttribute("text-anchor", item.anchor);
        element.setAttribute("class", item.className);
        for (const line of item.lines) {
          const span = make("tspan");
          span.setAttribute("x", sx(line.x));
          span.setAttribute("y", sy(line.y));
          span.textContent = line.value;
          element.append(span);
        }
        svg.append(element);
      };

      const background = {
        left: model.canvas.left,
        top: model.canvas.top,
        right: model.canvas.right,
        bottom: model.canvas.bottom,
        className: "diagram-background"
      };
      const backgroundElement = make("rect");
      backgroundElement.setAttribute("x", sx(0));
      backgroundElement.setAttribute("y", sy(0));
      backgroundElement.setAttribute(
        "width",
        sx(background.right) - sx(background.left)
      );
      backgroundElement.setAttribute(
        "height",
        sy(background.bottom) - sy(background.top)
      );
      backgroundElement.setAttribute("fill", "var(--surface)");
      svg.prepend(backgroundElement);

      for (const rectangle of model.rectangles) addRectangle(rectangle);
      for (const segment of model.segments) addSegment(segment);
      for (const arrowhead of model.arrowheads) addArrowhead(arrowhead);
      for (const label of model.labels) addLabel(label);

      fallback.hidden = true;
    } catch (error) {
      const svg = document.querySelector("#belief-diagram");
      const fallback = document.querySelector("#fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать три уровня: действие Ани по сообщению «комната 4»; мнение Ани о выборе Бориса; мнение Ани о том, что Борис думает о полученном Верой обновлении.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
