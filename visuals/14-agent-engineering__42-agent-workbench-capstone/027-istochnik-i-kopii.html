<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Источник истины и множество установленных копий</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --panel: #f8fafc;
      --local: #eef2ff;
      --ink: #172033;
      --muted: #5b6578;
      --line: #aab3c2;
      --blue: #2764d8;
      --blue-soft: #e7efff;
      --green: #18794e;
      --green-soft: #e3f5ec;
      --amber: #996515;
      --amber-soft: #fff2cc;
      --red: #b33a3a;
      --red-soft: #fde8e7;
      --violet: #6842c2;
      --violet-soft: #eee8ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #171f2c;
        --panel: #1c2635;
        --local: #202a45;
        --ink: #f1f5fb;
        --muted: #aeb8ca;
        --line: #59667a;
        --blue: #78a6ff;
        --blue-soft: #20365f;
        --green: #65d39a;
        --green-soft: #193c31;
        --amber: #f3c96b;
        --amber-soft: #443719;
        --red: #ff9292;
        --red-soft: #4b272b;
        --violet: #b69cff;
        --violet-soft: #35295c;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: unset;
    }

    .figure {
      background: var(--surface);
    }

    h1 {
      box-sizing: border-box;
      margin: unset;
      padding: 8px 12px;
      font-size: 22px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-size: 13px;
      dominant-baseline: middle;
    }

    .title-text {
      font-size: 16px;
      font-weight: bold;
    }

    .box-title {
      font-size: 14px;
      font-weight: bold;
    }

    .small {
      font-size: 12px;
    }

    .tiny {
      font-size: 11px;
    }

    .muted {
      fill: var(--muted);
    }

    .surface {
      fill: var(--surface);
    }

    .source-box {
      fill: var(--blue-soft);
      stroke: var(--blue);
      stroke-width: 2px;
    }

    .install-box {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .local-zone {
      fill: var(--local);
    }

    .divider {
      stroke: var(--line);
      stroke-width: 1px;
    }

    .flow {
      fill: none;
      stroke: var(--blue);
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head,
    .junction {
      fill: var(--blue);
    }

    .channel {
      fill: var(--surface);
      stroke: var(--blue);
      stroke-width: 1px;
    }

    .channel-text {
      fill: var(--blue);
      font-size: 12px;
      font-weight: bold;
    }

    .fresh {
      fill: var(--green);
    }

    .drift {
      fill: var(--red);
    }

    .delayed {
      fill: var(--amber);
    }

    .untouched {
      fill: var(--muted);
    }

    .source-accent {
      fill: var(--blue);
    }

    .accent-a {
      fill: var(--green);
    }

    .accent-b {
      fill: var(--amber);
    }

    .accent-c {
      fill: var(--violet);
    }

    .legend-box {
      fill: var(--blue-soft);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .legend-arrow {
      fill: none;
      stroke: var(--blue);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .legend-state {
      fill: var(--violet);
    }

    #fallback {
      box-sizing: border-box;
      margin: unset;
      padding: 16px;
      background: var(--surface);
      color: var(--ink);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Источник истины и множество установленных копий</h1>
    <svg
      id="diagram"
      viewBox="0 0 960 470"
      width="960"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
    ></svg>
    <p id="fallback" hidden>
      Схема должна была показать один канонический репозиторий пака, три
      односторонних канала установки и независимые копии: репозиторий A с
      VERSION 3, репозитории B и C с VERSION 2 и собственным локальным
      состоянием.
    </p>
    <noscript>
      Схема: канонический пак создаёт независимые копии через cp -r, template
      repo и SkillKit; изменения и локальное состояние копий не возвращаются в
      источник автоматически.
    </noscript>
  </main>

  <script>
    const data = [{
      base: 0,
      origin: { x: 10, y: 10 },
      scale: 10,
      field: { x: 0, y: 0, w: 94, h: 44, r: 1.4 },

      source: {
        box: { x: 29, y: 1, w: 36, h: 8, r: 1.2 },
        accent: { x: 29, y: 1, w: 36, h: 0.7, r: 0.3 },
        texts: [
          {
            x: 47, y: 4, anchor: "middle",
            className: "title-text",
            value: "Канонический репозиторий пака"
          },
          {
            x: 47, y: 6.7, anchor: "middle",
            className: "small muted",
            value: "VERSION 3 · единственное место изменений"
          }
        ]
      },

      trunk: {
        from: { x: 47, y: 9 },
        to: { x: 47, y: 12 },
        junction: { x: 47, y: 12, r: 0.45 }
      },

      routes: [
        {
          points: [
            { x: 47, y: 12 },
            { x: 16.25, y: 17.4 },
            { x: 16.25, y: 20.5 }
          ],
          head: [
            { x: 16.25, y: 20.5 },
            { x: 15.35, y: 18.9 },
            { x: 17.15, y: 18.9 }
          ],
          labelBox: { x: 25, y: 12.6, w: 9.5, h: 3.1, r: 0.8 },
          label: {
            x: 29.75, y: 14.15, anchor: "middle",
            className: "channel-text", value: "cp -r"
          }
        },
        {
          points: [
            { x: 47, y: 12 },
            { x: 47, y: 20.5 }
          ],
          head: [
            { x: 47, y: 20.5 },
            { x: 46.1, y: 18.9 },
            { x: 47.9, y: 18.9 }
          ],
          labelBox: { x: 48.5, y: 13.2, w: 14, h: 3.1, r: 0.8 },
          label: {
            x: 55.5, y: 14.75, anchor: "middle",
            className: "channel-text", value: "template repo"
          }
        },
        {
          points: [
            { x: 47, y: 12 },
            { x: 77.75, y: 17.4 },
            { x: 77.75, y: 20.5 }
          ],
          head: [
            { x: 77.75, y: 20.5 },
            { x: 76.85, y: 18.9 },
            { x: 78.65, y: 18.9 }
          ],
          labelBox: { x: 61.5, y: 12.6, w: 11.5, h: 3.1, r: 0.8 },
          label: {
            x: 67.25, y: 14.15, anchor: "middle",
            className: "channel-text", value: "SkillKit"
          }
        }
      ],

      installs: [
        {
          box: { x: 2, y: 20.5, w: 28.5, h: 16.5, r: 1.1 },
          accent: { x: 2, y: 20.5, w: 28.5, h: 0.65, r: 0.3 },
          accentClass: "accent-a",
          local: { x: 2.2, y: 31.1, w: 28.1, h: 5.7, r: 0.8 },
          dividers: [
            { from: { x: 3.2, y: 24.5 }, to: { x: 29.3, y: 24.5 } },
            { from: { x: 3.2, y: 31.1 }, to: { x: 29.3, y: 31.1 } }
          ],
          texts: [
            {
              x: 16.25, y: 23.1, anchor: "middle",
              className: "box-title", value: "Репозиторий A"
            },
            {
              x: 3.5, y: 27, anchor: "start",
              className: "small fresh", value: "слепок пака · VERSION 3"
            },
            {
              x: 3.5, y: 29.4, anchor: "start",
              className: "tiny drift", value: "правило изменено локально"
            },
            {
              x: 3.5, y: 33.5, anchor: "start",
              className: "tiny", value: "agent_state.json · текущая задача"
            },
            {
              x: 3.5, y: 35.5, anchor: "start",
              className: "tiny muted", value: "собственная история запусков"
            }
          ]
        },
        {
          box: { x: 32.75, y: 20.5, w: 28.5, h: 16.5, r: 1.1 },
          accent: { x: 32.75, y: 20.5, w: 28.5, h: 0.65, r: 0.3 },
          accentClass: "accent-b",
          local: { x: 32.95, y: 31.1, w: 28.1, h: 5.7, r: 0.8 },
          dividers: [
            { from: { x: 33.95, y: 24.5 }, to: { x: 60.05, y: 24.5 } },
            { from: { x: 33.95, y: 31.1 }, to: { x: 60.05, y: 31.1 } }
          ],
          texts: [
            {
              x: 47, y: 23.1, anchor: "middle",
              className: "box-title", value: "Репозиторий B"
            },
            {
              x: 34.25, y: 27, anchor: "start",
              className: "small delayed", value: "слепок пака · VERSION 2"
            },
            {
              x: 34.25, y: 29.4, anchor: "start",
              className: "tiny delayed", value: "обновление осознанно отложено"
            },
            {
              x: 34.25, y: 33.5, anchor: "start",
              className: "tiny", value: "agent_state.json · текущая задача"
            },
            {
              x: 34.25, y: 35.5, anchor: "start",
              className: "tiny muted", value: "собственная история запусков"
            }
          ]
        },
        {
          box: { x: 63.5, y: 20.5, w: 28.5, h: 16.5, r: 1.1 },
          accent: { x: 63.5, y: 20.5, w: 28.5, h: 0.65, r: 0.3 },
          accentClass: "accent-c",
          local: { x: 63.7, y: 31.1, w: 28.1, h: 5.7, r: 0.8 },
          dividers: [
            { from: { x: 64.7, y: 24.5 }, to: { x: 90.8, y: 24.5 } },
            { from: { x: 64.7, y: 31.1 }, to: { x: 90.8, y: 31.1 } }
          ],
          texts: [
            {
              x: 77.75, y: 23.1, anchor: "middle",
              className: "box-title", value: "Репозиторий C"
            },
            {
              x: 65, y: 27, anchor: "start",
              className: "small delayed", value: "слепок пака · VERSION 2"
            },
            {
              x: 65, y: 29.4, anchor: "start",
              className: "tiny untouched", value: "установленные файлы не тронуты"
            },
            {
              x: 65, y: 33.5, anchor: "start",
              className: "tiny", value: "agent_state.json · текущая задача"
            },
            {
              x: 65, y: 35.5, anchor: "start",
              className: "tiny muted", value: "собственная история запусков"
            }
          ]
        }
      ],

      legend: {
        box: { x: 2, y: 39, w: 90, h: 4.2, r: 1 },
        arrow: {
          from: { x: 4, y: 41.1 },
          to: { x: 7, y: 41.1 },
          head: [
            { x: 7, y: 41.1 },
            { x: 6.25, y: 40.45 },
            { x: 6.25, y: 41.75 }
          ]
        },
        stateDot: { x: 51.5, y: 41.1, r: 0.55 },
        texts: [
          {
            x: 8.2, y: 41.1, anchor: "start",
            className: "small", value: "Только наружу: источник → новая установка"
          },
          {
            x: 53, y: 41.1, anchor: "start",
            className: "small", value: "Состояние и история остаются в копии"
          }
        ]
      }
    }];

    const [spec] = data;
    const origin = Object.freeze(spec.origin);
    const scale = spec.scale;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const diagram = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (name, attributes, parent = diagram) => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, value);
        }
        parent.appendChild(element);
        return element;
      };

      const rect = (box, className) => node("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        rx: sx(box.r) - sx(spec.base),
        ry: sy(box.r) - sy(spec.base),
        class: className
      });

      const line = (from, to, className) => node("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className
      });

      const polygon = (points, className) => node("polygon", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      });

      const polyline = (points, className) => node("polyline", {
        points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
        class: className
      });

      const label = text => {
        const element = node("text", {
          x: sx(text.x),
          y: sy(text.y),
          "text-anchor": text.anchor,
          class: text.className
        });
        element.textContent = text.value;
        return element;
      };

      const description = node("desc", { id: "diagram-description" });
      description.textContent =
        "Один канонический репозиторий пака создаёт три независимые установки через cp -r, template repo и SkillKit. У каждой копии своя версия и своё локальное состояние.";

      rect(spec.field, "surface");

      line(spec.trunk.from, spec.trunk.to, "flow");
      for (const route of spec.routes) {
        polyline(route.points, "flow");
      }

      for (const install of spec.installs) {
        rect(install.box, "install-box");
        rect(install.local, "local-zone");
        rect(install.accent, install.accentClass);
        for (const divider of install.dividers) {
          line(divider.from, divider.to, "divider");
        }
        for (const text of install.texts) {
          label(text);
        }
      }

      rect(spec.source.box, "source-box");
      rect(spec.source.accent, "source-accent");
      for (const text of spec.source.texts) {
        label(text);
      }

      for (const route of spec.routes) {
        polygon(route.head, "arrow-head");
        rect(route.labelBox, "channel");
        label(route.label);
      }

      node("circle", {
        cx: sx(spec.trunk.junction.x),
        cy: sy(spec.trunk.junction.y),
        r: sx(spec.trunk.junction.r) - sx(spec.base),
        class: "junction"
      });

      rect(spec.legend.box, "legend-box");
      line(spec.legend.arrow.from, spec.legend.arrow.to, "legend-arrow");
      polygon(spec.legend.arrow.head, "arrow-head");
      node("circle", {
        cx: sx(spec.legend.stateDot.x),
        cy: sy(spec.legend.stateDot.y),
        r: sx(spec.legend.stateDot.r) - sx(spec.base),
        class: "legend-state"
      });
      for (const text of spec.legend.texts) {
        label(text);
      }

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
