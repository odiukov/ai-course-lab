<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
  <title>Free-tier и paid-tier: две ветви наблюдения</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ivory;
      --panel: white;
      --panel-soft: aliceblue;
      --ink: midnightblue;
      --muted: slategray;
      --line: lightslategray;
      --free: seagreen;
      --free-soft: honeydew;
      --paid: royalblue;
      --paid-soft: aliceblue;
      --accent: darkorange;
      --accent-soft: oldlace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslategray;
        --panel-soft: darkslateblue;
        --ink: white;
        --muted: lightsteelblue;
        --line: lightslategray;
        --free: lightgreen;
        --free-soft: darkgreen;
        --paid: lightskyblue;
        --paid-soft: darkslateblue;
        --accent: orange;
        --accent-soft: saddlebrown;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    h1 {
      font-size: 24px;
      text-align: center;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
    }

    .request-panel {
      fill: var(--panel-soft);
      stroke: var(--ink);
    }

    .free-panel {
      fill: var(--free-soft);
      stroke: var(--free);
    }

    .paid-panel {
      fill: var(--paid-soft);
      stroke: var(--paid);
    }

    .result-panel {
      fill: var(--panel);
      stroke: var(--line);
    }

    .delta-panel {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .legend-panel {
      fill: var(--panel-soft);
      stroke: var(--line);
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .free-connector {
      stroke: var(--free);
    }

    .paid-connector {
      stroke: var(--paid);
    }

    .arrow-free {
      fill: var(--free);
    }

    .arrow-paid {
      fill: var(--paid);
    }

    .arrow-neutral {
      fill: var(--line);
    }

    .split {
      fill: var(--panel);
      stroke: var(--line);
    }

    .pill-request {
      fill: var(--accent-soft);
      stroke: var(--accent);
    }

    .pill-free {
      fill: var(--free);
      stroke: var(--free);
    }

    .pill-paid {
      fill: var(--paid);
      stroke: var(--paid);
    }

    text {
      fill: var(--ink);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .small {
      font-size: 12px;
    }

    .muted {
      fill: var(--muted);
      font-size: 13px;
    }

    .pill-text {
      fill: white;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: normal;
    }

    .request-pill-text {
      fill: var(--ink);
      font-size: 12px;
      font-weight: bold;
    }

    .branch-title {
      font-size: 14px;
      font-weight: bold;
    }

    .result-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .result-value {
      font-size: 30px;
      font-weight: bold;
    }

    .free-value {
      fill: var(--free);
    }

    .paid-value {
      fill: var(--paid);
    }

    .delta-text {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      fill: var(--ink);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1 id="diagram-title">Один вредный запрос — две ветви наблюдения</h1>

  <svg
    id="diagram"
    viewBox="0 0 960 430"
    width="960"
    height="430"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-title"
    aria-label="Free-tier используется для переобучения и даёт примерно двенадцать процентов согласия. Paid-tier не используется для переобучения и даёт три процента согласия. Разрыв — девять процентных пунктов."
  ></svg>

  <script>
    const data = [
      [24, 18],
      [9.12, 7.8],
      [960, 430],
      [
        [2, 17, 26, 33, 1.6],
        [6, 19, 22, 23, 1],
        [14, 21],
        [14, 26],
        [14, 29],
        [14, 31.5],
        [26, 25, 31, 25],
        [31, 25, 38, 13],
        [31, 25, 38, 37],
        [31, 25, 0.7],
        [1.1, 0.8],
        [77, 23, 97, 27, 1],
        [87, 25],
        [2, 47, 98, 50, 1],
        [50, 48.7],
        [50, 20],
        [50, 23],
        [50, 26]
      ],
      [
        [
          "free-tier",
          "ИСПОЛЬЗУЮТ ДЛЯ ПЕРЕОБУЧЕНИЯ",
          "Ответ станет учебным сигналом",
          "СОГЛАСИЕ",
          "12%",
          "ответ наблюдаем с последствиями",
          [38, 4, 72, 22, 1.6],
          [41, 6, 53, 10, 1],
          [47, 8],
          [55, 13.5],
          [55, 17],
          [72, 13, 76, 13],
          [76, 4, 98, 22, 1.6],
          [87, 8],
          [87, 14],
          [87, 18.5],
          "free"
        ],
        [
          "paid-tier",
          "НЕ ИСПОЛЬЗУЮТ ДЛЯ ПЕРЕОБУЧЕНИЯ",
          "Ответ не станет учебным сигналом",
          "СОГЛАСИЕ",
          "3%",
          "ответ видят, но по нему не обучают",
          [38, 28, 72, 46, 1.6],
          [41, 30, 53, 34, 1],
          [47, 32],
          [55, 37.5],
          [55, 41],
          [72, 37, 76, 37],
          [76, 28, 98, 46, 1.6],
          [87, 32],
          [87, 38],
          [87, 42.5],
          "paid"
        ]
      ],
      [
        "ОДИН И ТОТ ЖЕ ЗАПРОС",
        "Вредный запрос",
        "Модель выбирает:",
        "отказать или согласиться",
        "разрыв: 9 п. п.",
        "Меняется только метка диалога — запрос и исходная модель те же",
        "Схема должна была показать две ветви одного вредного запроса:",
        "free-tier — используется для переобучения, согласие 12%;",
        "paid-tier — не используется для переобучения, согласие 3%."
      ]
    ];

    const [origin, scale, canvas, layout, branches, copy] = data;
    const [originX, originY] = origin;
    const [scaleX, scaleY] = scale;
    const [canvasWidth, canvasHeight] = canvas;

    const sx = x => originX + x * scaleX;
    const sy = y => originY + y * scaleY;

    const labelPadding = 8;
    const lineWidth = 2;
    const fineLineWidth = 1;
    const svg = document.getElementById("diagram");
    const namespace = "http://www.w3.org/2000/svg";

    const node = (name, attributes, content) => {
      const item = document.createElementNS(namespace, name);
      Object.entries(attributes).forEach(([key, value]) => {
        item.setAttribute(key, value);
      });
      if (content !== undefined) item.textContent = content;
      return item;
    };

    const add = item => {
      svg.appendChild(item);
      return item;
    };

    const rectangle = (box, className, strokeWidth = lineWidth) => {
      const [x1, y1, x2, y2, radius] = box;
      return node("rect", {
        x: sx(x1),
        y: sy(y1),
        width: sx(x2) - sx(x1),
        height: sy(y2) - sy(y1),
        rx: sx(radius) - sx(0),
        ry: sy(radius) - sy(0),
        class: className,
        "stroke-width": strokeWidth
      });
    };

    const label = (point, content, className, anchor = "middle") => {
      const [x, y] = point;
      return node("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, content);
    };

    const arrow = (segment, className, arrowClass, arrowShape) => {
      const [x1, y1, x2, y2] = segment;
      const [back, wing] = arrowShape;

      add(node("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className,
        "stroke-width": lineWidth
      }));

      add(node("polygon", {
        points: [
          `${sx(x2)},${sy(y2)}`,
          `${sx(x2 - back)},${sy(y2 - wing)}`,
          `${sx(x2 - back)},${sy(y2 + wing)}`
        ].join(" "),
        class: arrowClass
      }));
    };

    try {
      const [
        requestBox,
        requestPill,
        requestPillPoint,
        requestTitlePoint,
        requestChoicePoint,
        requestOptionsPoint,
        trunk,
        freeFork,
        paidFork,
        splitPoint,
        arrowShape,
        deltaBox,
        deltaPoint,
        legendBox,
        legendPoint,
        fallbackTop,
        fallbackMiddle,
        fallbackBottom
      ] = layout;

      const [
        requestPillCopy,
        requestTitleCopy,
        requestChoiceCopy,
        requestOptionsCopy,
        deltaCopy,
        legendCopy
      ] = copy;

      add(rectangle(requestBox, "request-panel"));
      add(rectangle(requestPill, "pill-request", fineLineWidth));
      add(label(requestPillPoint, requestPillCopy, "request-pill-text"));
      add(label(requestTitlePoint, requestTitleCopy, "branch-title"));
      add(label(requestChoicePoint, requestChoiceCopy, "muted"));
      add(label(requestOptionsPoint, requestOptionsCopy, "small"));

      arrow(trunk, "connector", "arrow-neutral", arrowShape);
      arrow(freeFork, "connector free-connector", "arrow-free", arrowShape);
      arrow(paidFork, "connector paid-connector", "arrow-paid", arrowShape);

      const [splitX, splitY, splitRadius] = splitPoint;
      add(node("ellipse", {
        cx: sx(splitX),
        cy: sy(splitY),
        rx: sx(splitRadius) - sx(0),
        ry: sy(splitRadius) - sy(0),
        class: "split",
        "stroke-width": lineWidth
      }));

      branches.forEach(branch => {
        const [
          tier,
          trainingStatus,
          consequence,
          resultLabel,
          resultValue,
          observationNote,
          branchBox,
          tierPill,
          tierPoint,
          statusPoint,
          consequencePoint,
          resultConnector,
          resultBox,
          resultLabelPoint,
          resultValuePoint,
          observationPoint,
          theme
        ] = branch;

        const branchClass = theme === "free" ? "free-panel" : "paid-panel";
        const pillClass = theme === "free" ? "pill-free" : "pill-paid";
        const connectorClass = theme === "free"
          ? "connector free-connector"
          : "connector paid-connector";
        const arrowClass = theme === "free" ? "arrow-free" : "arrow-paid";
        const valueClass = theme === "free"
          ? "result-value free-value"
          : "result-value paid-value";

        add(rectangle(branchBox, branchClass));
        add(rectangle(tierPill, pillClass, fineLineWidth));
        add(label(tierPoint, tier, "pill-text"));
        add(label(statusPoint, trainingStatus, "branch-title"));
        add(label(consequencePoint, consequence, "muted"));

        arrow(resultConnector, connectorClass, arrowClass, arrowShape);

        add(rectangle(resultBox, "result-panel"));
        add(label(resultLabelPoint, resultLabel, "result-label"));
        add(label(resultValuePoint, resultValue, valueClass));
        add(label(observationPoint, observationNote, "small"));
      });

      add(rectangle(deltaBox, "delta-panel", fineLineWidth));
      add(label(deltaPoint, deltaCopy, "delta-text"));

      add(rectangle(legendBox, "legend-panel", fineLineWidth));
      add(label(legendPoint, legendCopy, "legend-text"));

      const [legendX] = legendPoint;
      add(node("line", {
        x1: sx(legendX) - labelPadding,
        y1: sy(47),
        x2: sx(legendX) + labelPadding,
        y2: sy(47),
        class: "connector",
        "stroke-width": fineLineWidth
      }));
    } catch (error) {
      const [
        ,
        ,
        ,
        ,
        ,
        ,
        fallbackFirst,
        fallbackSecond,
        fallbackThird
      ] = copy;

      svg.replaceChildren();
      add(label(fallbackTop, fallbackFirst, "fallback"));
      add(label(fallbackMiddle, fallbackSecond, "fallback"));
      add(label(fallbackBottom, fallbackThird, "fallback"));
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
