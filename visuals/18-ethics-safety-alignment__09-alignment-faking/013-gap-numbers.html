<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разрыв 12% против 3%</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef1f7;
      --surface: #ffffff;
      --surface-soft: #f2f4fa;
      --track: #e4e8f1;
      --ink: #17213a;
      --muted: #657089;
      --guide: #cbd2df;
      --baseline: #8b95aa;
      --free: #7257d9;
      --free-cap: #5035bb;
      --paid: #36a17b;
      --paid-cap: #207b5c;
      --gap: #d34f71;
      --gap-soft: #fff0f4;
      --outline: #d8deea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --surface: #181e2a;
        --surface-soft: #202736;
        --track: #2b3445;
        --ink: #f2f5fb;
        --muted: #aab4c8;
        --guide: #384357;
        --baseline: #69758c;
        --free: #9a83f2;
        --free-cap: #c0b0ff;
        --paid: #55c99d;
        --paid-cap: #8be2c1;
        --gap: #ff7c9e;
        --gap-soft: #39212d;
        --outline: #303a4d;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .figure {
      background: var(--surface);
      border: 2px solid var(--outline);
    }

    h1 {
      font-size: 22px;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--surface);
    }

    .label,
    .value,
    .annotation,
    .eyebrow {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .value {
      font-weight: bold;
      fill: var(--ink);
    }

    .label {
      fill: var(--ink);
    }

    .secondary {
      fill: var(--muted);
    }

    .eyebrow {
      fill: var(--muted);
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .annotation {
      fill: var(--gap);
      font-weight: bold;
    }

    .fallback {
      font-size: 17px;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <figure class="figure" aria-labelledby="diagram-heading">
      <h1 id="diagram-heading">Разрыв 12% против 3%</h1>

      <svg
        id="diagram"
        viewBox="0 0 960 360"
        width="960"
        height="360"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
      >
        <title id="svg-title">Сравнение доли согласий в free-tier и paid-tier</title>
        <desc id="svg-description">
          В бесплатном уровне доля согласий равна 12%, в платном — 3%.
          Compliance gap составляет 9 процентных пунктов: согласие встречается
          примерно в 4 раза чаще.
        </desc>
      </svg>

      <p id="fallback" class="fallback" hidden>
        Схема должна была показать два столбца согласия: free-tier — 12%,
        paid-tier — 3%. Между ними: compliance gap = 9 процентных пунктов;
        примерно в 4 раза чаще.
      </p>
    </figure>
  </main>

  <script>
    /*
      Все числа, определяющие геометрию, типографику и линии рисунка,
      собраны в единственном массиве данных. SVG получает координаты только
      через неизменяемое отображение sx/sy.
    */
    const diagramData = [{
      origin: { x: 72, y: 276 },
      scale: 1,

      frame: {
        left: -70,
        right: 886,
        top: 274,
        bottom: -82,
        radius: 18,
        zero: 0
      },

      chart: {
        baselineY: 0,
        axisLeft: 30,
        axisRight: 786,
        maximumHeight: 204,
        guideStart: 30,
        guideEnd: 786,
        eyebrow: { x: 30, y: 252 }
      },

      bars: [
        {
          key: "free",
          left: 70,
          right: 250,
          center: 160,
          base: 0,
          top: 204,
          valueAnchor: { x: 160, y: 232 },
          tierAnchor: { x: 160, y: -30 },
          kindAnchor: { x: 160, y: -54 },
          value: "12%",
          tier: "бесплатный уровень (free-tier)",
          kind: "согласие",
          fill: "var(--free)",
          cap: "var(--free-cap)"
        },
        {
          key: "paid",
          left: 566,
          right: 746,
          center: 656,
          base: 0,
          top: 51,
          valueAnchor: { x: 656, y: 79 },
          tierAnchor: { x: 656, y: -30 },
          kindAnchor: { x: 656, y: -54 },
          value: "3%",
          tier: "платный уровень (paid-tier)",
          kind: "согласие",
          fill: "var(--paid)",
          cap: "var(--paid-cap)"
        }
      ],

      guides: [
        { y: 204 },
        { y: 51 }
      ],

      arrow: {
        tail: { x: 266, y: 195 },
        head: { x: 550, y: 60 },
        headShape: [
          { x: 550, y: 60 },
          { x: 527, y: 61 },
          { x: 538, y: 81 }
        ],
        labelFirst: { x: 408, y: 190 },
        labelSecond: { x: 408, y: 166 },
        labelFirstText: "compliance gap = 9 процентных пунктов;",
        labelSecondText: "примерно в 4 раза чаще"
      },

      cap: {
        inset: 12
      },

      fonts: {
        eyebrow: 14,
        value: 34,
        tier: 17,
        kind: 15,
        annotation: 17,
        fallback: 17
      },

      lines: {
        frame: 2,
        guide: 2,
        baseline: 3,
        cap: 5,
        arrow: 5
      }
    }];

    const [D] = diagramData;
    const origin = Object.freeze(D.origin);
    const scale = D.scale;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      if (!svg || !fallback || !Number.isFinite(scale)) {
        throw new Error("Не удалось подготовить область схемы");
      }

      const make = (tag, attributes, parent) => {
        const element = document.createElementNS(namespace, tag);

        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, String(value));
        }

        parent.appendChild(element);
        return element;
      };

      const write = (content, attributes, parent) => {
        const element = make("text", attributes, parent);
        element.textContent = content;
        return element;
      };

      const root = make("g", {
        "aria-hidden": "true"
      }, svg);

      /*
        Явный фон гарантирует контраст и в светлой, и в тёмной теме.
        Его границы также проходят через то же координатное отображение.
      */
      make("rect", {
        x: sx(D.frame.left),
        y: sy(D.frame.top),
        width: sx(D.frame.right) - sx(D.frame.left),
        height: sy(D.frame.bottom) - sy(D.frame.top),
        rx: sx(D.frame.radius) - sx(D.frame.zero),
        fill: "var(--surface)",
        stroke: "var(--outline)",
        "stroke-width": D.lines.frame
      }, root);

      write("ДОЛЯ СОГЛАСИЙ", {
        x: sx(D.chart.eyebrow.x),
        y: sy(D.chart.eyebrow.y),
        class: "eyebrow",
        "font-size": D.fonts.eyebrow,
        "text-anchor": "start"
      }, root);

      /*
        Две ненумерованные направляющие связывают верхушки столбцов.
        Числа на экране остаются только теми, которые даны в уроке.
      */
      for (const guide of D.guides) {
        make("line", {
          x1: sx(D.chart.guideStart),
          y1: sy(guide.y),
          x2: sx(D.chart.guideEnd),
          y2: sy(guide.y),
          stroke: "var(--guide)",
          "stroke-width": D.lines.guide
        }, root);
      }

      make("line", {
        x1: sx(D.chart.axisLeft),
        y1: sy(D.chart.baselineY),
        x2: sx(D.chart.axisRight),
        y2: sy(D.chart.baselineY),
        stroke: "var(--baseline)",
        "stroke-width": D.lines.baseline,
        "stroke-linecap": "round"
      }, root);

      /*
        Одинаковые фоновые дорожки делают пропорцию видимой:
        paid-tier занимает четверть высоты free-tier, не вводя новых
        числовых подписей.
      */
      for (const bar of D.bars) {
        make("rect", {
          x: sx(bar.left),
          y: sy(D.chart.maximumHeight),
          width: sx(bar.right) - sx(bar.left),
          height: sy(bar.base) - sy(D.chart.maximumHeight),
          rx: sx(D.frame.radius) - sx(D.frame.zero),
          fill: "var(--track)"
        }, root);

        make("rect", {
          x: sx(bar.left),
          y: sy(bar.top),
          width: sx(bar.right) - sx(bar.left),
          height: sy(bar.base) - sy(bar.top),
          rx: sx(D.frame.radius) - sx(D.frame.zero),
          fill: bar.fill
        }, root);

        make("line", {
          x1: sx(bar.left + D.cap.inset),
          y1: sy(bar.top),
          x2: sx(bar.right - D.cap.inset),
          y2: sy(bar.top),
          stroke: bar.cap,
          "stroke-width": D.lines.cap,
          "stroke-linecap": "round"
        }, root);

        write(bar.value, {
          x: sx(bar.valueAnchor.x),
          y: sy(bar.valueAnchor.y),
          class: "value",
          "font-size": D.fonts.value,
          "text-anchor": "middle"
        }, root);

        write(bar.tier, {
          x: sx(bar.tierAnchor.x),
          y: sy(bar.tierAnchor.y),
          class: "label",
          "font-size": D.fonts.tier,
          "text-anchor": "middle"
        }, root);

        write(bar.kind, {
          x: sx(bar.kindAnchor.x),
          y: sy(bar.kindAnchor.y),
          class: "label secondary",
          "font-size": D.fonts.kind,
          "text-anchor": "middle"
        }, root);
      }

      /*
        Стрелка идёт от более высокого столбца к более низкому.
        Подпись вынесена над серединой отрезка, в стороне от наконечника
        и обеих числовых меток.
      */
      make("line", {
        x1: sx(D.arrow.tail.x),
        y1: sy(D.arrow.tail.y),
        x2: sx(D.arrow.head.x),
        y2: sy(D.arrow.head.y),
        stroke: "var(--gap)",
        "stroke-width": D.lines.arrow,
        "stroke-linecap": "round"
      }, root);

      make("polygon", {
        points: D.arrow.headShape
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        fill: "var(--gap)"
      }, root);

      write(D.arrow.labelFirstText, {
        x: sx(D.arrow.labelFirst.x),
        y: sy(D.arrow.labelFirst.y),
        class: "annotation",
        "font-size": D.fonts.annotation,
        "text-anchor": "middle"
      }, root);

      write(D.arrow.labelSecondText, {
        x: sx(D.arrow.labelSecond.x),
        y: sy(D.arrow.labelSecond.y),
        class: "annotation",
        "font-size": D.fonts.annotation,
        "text-anchor": "middle"
      }, root);
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
