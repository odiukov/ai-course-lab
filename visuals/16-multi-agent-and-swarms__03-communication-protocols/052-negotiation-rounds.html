<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <title>Раунды согласования мета-протокола</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --panel: ghostwhite;
      --ink: midnightblue;
      --muted: slategray;
      --line: steelblue;
      --soft-line: lightsteelblue;
      --agent-fill: aliceblue;
      --badge-fill: lavender;
      --decision-fill: white;
      --accepted-fill: honeydew;
      --accepted-line: seagreen;
      --rejected-fill: mistyrose;
      --rejected-line: firebrick;
      --timeout-fill: lightyellow;
      --timeout-line: darkgoldenrod;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #172033;
        --ink: #eef4ff;
        --muted: #b7c2d4;
        --line: #82bfff;
        --soft-line: #53667f;
        --agent-fill: #1d3552;
        --badge-fill: #342d59;
        --decision-fill: #172033;
        --accepted-fill: #183c31;
        --accepted-line: lightgreen;
        --rejected-fill: #49262c;
        --rejected-line: salmon;
        --timeout-fill: #40391d;
        --timeout-line: khaki;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .schema-title {
      font-size: 20px;
      font-weight: bold;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
      border: 1px solid var(--soft-line);
    }

    .agent-box {
      fill: var(--agent-fill);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .agent-name {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .agent-role,
    .minor-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .lifeline {
      stroke: var(--soft-line);
      stroke-width: 2px;
    }

    .message-line {
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .message-head {
      fill: var(--line);
    }

    .message-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .message-meta {
      fill: var(--muted);
      font-size: 13px;
    }

    .round-badge {
      fill: var(--badge-fill);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .round-text {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .convergence {
      fill: none;
      stroke: var(--soft-line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .decision {
      fill: var(--decision-fill);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .branch-line {
      fill: none;
      stroke: var(--muted);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .branch-head {
      fill: var(--muted);
    }

    .outcome {
      stroke-width: 2px;
    }

    .accepted {
      fill: var(--accepted-fill);
      stroke: var(--accepted-line);
    }

    .rejected {
      fill: var(--rejected-fill);
      stroke: var(--rejected-line);
    }

    .timeout {
      fill: var(--timeout-fill);
      stroke: var(--timeout-line);
    }

    .status-name {
      fill: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 17px;
      font-weight: bold;
    }

    .status-detail {
      fill: var(--ink);
      font-size: 13px;
    }

    #fallback {
      display: none;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--soft-line);
      font-size: 16px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="schema-title">Раунды согласования мета-протокола</div>

  <svg id="schema"
       viewBox="0 0 1000 460"
       width="1000"
       height="460"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Раунды согласования мета-протокола</title>
    <desc id="svg-description">Два агента обмениваются предложениями и контрпредложениями, пока переговоры явно не завершатся статусом accepted, rejected или timeout. Предел — десять раундов.</desc>
  </svg>

  <div id="fallback">
    Схема должна была показать обмен предложением и контрпредложениями между
    агентами A и B до явного результата accepted, rejected или timeout.
    Предел переговоров — 10 раундов.
  </div>

  <script>
    const data = Object.freeze({
      frame: { left: 0, top: 0, right: 100, bottom: 46 },
      agents: [
        {
          x: 5, y: 2.4, width: 22, height: 6.2,
          centerX: 16, titleY: 5.1, roleY: 7.1,
          name: "Агент A", role: "инициатор"
        },
        {
          x: 73, y: 2.4, width: 22, height: 6.2,
          centerX: 84, titleY: 5.1, roleY: 7.1,
          name: "Агент B", role: "партнёр"
        }
      ],
      badge: {
        x: 37.5, y: 3.5, width: 25, height: 4,
        textX: 50, textY: 6.1,
        text: "предел: 10 раундов"
      },
      lifelines: [
        { x: 16, fromY: 8.6, toY: 26.4 },
        { x: 84, fromY: 8.6, toY: 26.4 }
      ],
      messages: [
        {
          from: { x: 16, y: 13.6 },
          to: { x: 84, y: 13.6 },
          label: { x: 18, y: 11.6, anchor: "start" },
          meta: { x: 18, y: 13, anchor: "start" },
          title: "предложение · sequenceId: 0",
          detail: "candidateProtocols: 3 варианта"
        },
        {
          from: { x: 84, y: 18.5 },
          to: { x: 16, y: 18.5 },
          label: { x: 82, y: 16.5, anchor: "end" },
          meta: { x: 82, y: 17.9, anchor: "end" },
          title: "контрпредложение",
          detail: "REST · изменить поля и передачу дат"
        },
        {
          from: { x: 16, y: 23.4 },
          to: { x: 84, y: 23.4 },
          label: { x: 18, y: 21.4, anchor: "start" },
          meta: { x: 18, y: 22.8, anchor: "start" },
          title: "следующая версия · negotiating",
          detail: "новый sequenceId · modificationSummary"
        }
      ],
      arrow: { length: 1.5, wing: 0.7 },
      continuation: {
        x: 50, y: 25.8,
        text: "каждый ответ открывает следующий раунд"
      },
      convergence: [
        { from: { x: 16, y: 26.4 }, to: { x: 48.5, y: 29.9 } },
        { from: { x: 84, y: 26.4 }, to: { x: 51.5, y: 29.9 } }
      ],
      decision: {
        center: { x: 50, y: 31.1 },
        halfWidth: 1.7,
        halfHeight: 1.4
      },
      branch: {
        start: { x: 50, y: 32.5 },
        junctionY: 34.2,
        arrowLength: 1.2,
        arrowWing: 0.6
      },
      outcomes: [
        {
          x: 4, y: 36, width: 27, height: 8.5,
          centerX: 17.5, titleY: 39.6, detailY: 42.2,
          status: "accepted", detail: "предложение явно принято",
          className: "accepted"
        },
        {
          x: 36.5, y: 36, width: 27, height: 8.5,
          centerX: 50, titleY: 39.6, detailY: 42.2,
          status: "rejected", detail: "переговоры завершены отказом",
          className: "rejected"
        },
        {
          x: 69, y: 36, width: 27, height: 8.5,
          centerX: 82.5, titleY: 39.6, detailY: 42.2,
          status: "timeout", detail: "нет согласия после 10 раундов",
          className: "timeout"
        }
      ]
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = 10;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("schema");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (tag, attributes, content) => {
        const node = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, value);
        });
        if (content !== undefined) {
          node.textContent = content;
        }
        return node;
      };

      const addText = (parent, spec, className, content) => {
        parent.appendChild(make("text", {
          x: sx(spec.x),
          y: sy(spec.y),
          "text-anchor": spec.anchor || "middle",
          class: className
        }, content));
      };

      const addRect = (parent, spec, className) => {
        parent.appendChild(make("rect", {
          x: sx(spec.x),
          y: sy(spec.y),
          width: sx(spec.x + spec.width) - sx(spec.x),
          height: sy(spec.y + spec.height) - sy(spec.y),
          class: className
        }));
      };

      const addLine = (parent, from, to, className) => {
        parent.appendChild(make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        }));
      };

      const addHorizontalArrow = (parent, message) => {
        addLine(parent, message.from, message.to, "message-line");

        const direction = Math.sign(message.to.x - message.from.x);
        const baseX = message.to.x - direction * data.arrow.length;
        const points = [
          `${sx(message.to.x)},${sy(message.to.y)}`,
          `${sx(baseX)},${sy(message.to.y - data.arrow.wing)}`,
          `${sx(baseX)},${sy(message.to.y + data.arrow.wing)}`
        ].join(" ");

        parent.appendChild(make("polygon", {
          points: points,
          class: "message-head"
        }));

        addText(parent, message.label, "message-label", message.title);
        addText(parent, message.meta, "message-meta", message.detail);
      };

      const addVerticalArrow = (parent, from, to) => {
        addLine(parent, from, to, "branch-line");

        const direction = Math.sign(to.y - from.y);
        const baseY = to.y - direction * data.branch.arrowLength;
        const points = [
          `${sx(to.x)},${sy(to.y)}`,
          `${sx(to.x - data.branch.arrowWing)},${sy(baseY)}`,
          `${sx(to.x + data.branch.arrowWing)},${sy(baseY)}`
        ].join(" ");

        parent.appendChild(make("polygon", {
          points: points,
          class: "branch-head"
        }));
      };

      const root = make("g", {});

      data.lifelines.forEach(line => {
        addLine(
          root,
          { x: line.x, y: line.fromY },
          { x: line.x, y: line.toY },
          "lifeline"
        );
      });

      data.agents.forEach(agent => {
        addRect(root, agent, "agent-box");
        addText(
          root,
          { x: agent.centerX, y: agent.titleY, anchor: "middle" },
          "agent-name",
          agent.name
        );
        addText(
          root,
          { x: agent.centerX, y: agent.roleY, anchor: "middle" },
          "agent-role",
          agent.role
        );
      });

      addRect(root, data.badge, "round-badge");
      addText(
        root,
        { x: data.badge.textX, y: data.badge.textY, anchor: "middle" },
        "round-text",
        data.badge.text
      );

      data.messages.forEach(message => {
        addHorizontalArrow(root, message);
      });

      addText(
        root,
        {
          x: data.continuation.x,
          y: data.continuation.y,
          anchor: "middle"
        },
        "minor-label",
        data.continuation.text
      );

      data.convergence.forEach(segment => {
        addLine(root, segment.from, segment.to, "convergence");
      });

      const decision = data.decision;
      const decisionPoints = [
        `${sx(decision.center.x)},${sy(decision.center.y - decision.halfHeight)}`,
        `${sx(decision.center.x + decision.halfWidth)},${sy(decision.center.y)}`,
        `${sx(decision.center.x)},${sy(decision.center.y + decision.halfHeight)}`,
        `${sx(decision.center.x - decision.halfWidth)},${sy(decision.center.y)}`
      ].join(" ");

      root.appendChild(make("polygon", {
        points: decisionPoints,
        class: "decision"
      }));

      addLine(
        root,
        data.branch.start,
        { x: data.branch.start.x, y: data.branch.junctionY },
        "branch-line"
      );

      data.outcomes.forEach(outcome => {
        addLine(
          root,
          { x: data.branch.start.x, y: data.branch.junctionY },
          { x: outcome.centerX, y: data.branch.junctionY },
          "branch-line"
        );

        addVerticalArrow(
          root,
          { x: outcome.centerX, y: data.branch.junctionY },
          { x: outcome.centerX, y: outcome.y }
        );

        addRect(root, outcome, `outcome ${outcome.className}`);

        addText(
          root,
          { x: outcome.centerX, y: outcome.titleY, anchor: "middle" },
          "status-name",
          outcome.status
        );

        addText(
          root,
          { x: outcome.centerX, y: outcome.detailY, anchor: "middle" },
          "status-detail",
          outcome.detail
        );
      });

      svg.appendChild(root);
    } catch (error) {
      document.getElementById("schema").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
