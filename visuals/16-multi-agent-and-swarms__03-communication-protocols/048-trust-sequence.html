<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Из чего складывается доверие ANP</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --surface: #ffffff;
    --surface-soft: #eef2ff;
    --text: #172033;
    --muted: #58647a;
    --line: #9aa7bd;
    --blue: #315bd6;
    --blue-soft: #e6edff;
    --green: #167553;
    --green-soft: #e2f6ee;
    --amber: #a85d08;
    --amber-soft: #fff0d8;
    --danger: #a23d49;
    --danger-soft: #fde8eb;
    --shadow: #d7ddeb;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #192131;
      --surface-soft: #222c42;
      --text: #f0f3fa;
      --muted: #b0bbce;
      --line: #71809a;
      --blue: #91adff;
      --blue-soft: #253765;
      --green: #78d8b3;
      --green-soft: #193f35;
      --amber: #ffc06e;
      --amber-soft: #4a341b;
      --danger: #ff9ba7;
      --danger-soft: #4c2730;
      --shadow: #0b0f17;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    background: var(--page);
    color: var(--text);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    background: var(--page);
  }

  h2 {
    color: var(--text);
    font-size: 24px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--surface);
  }

  .frame,
  .panel,
  .browser,
  .document,
  .token,
  .chip,
  .summary {
    stroke: var(--line);
    vector-effect: non-scaling-stroke;
  }

  .frame {
    fill: var(--surface);
  }

  .panel {
    fill: var(--surface);
  }

  .panel-rule,
  .connector,
  .icon-line,
  .key-line,
  .signature-line {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .connector,
  .arrow-head {
    stroke: var(--blue);
  }

  .arrow-head {
    fill: var(--blue);
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .badge {
    fill: var(--blue);
    stroke: var(--blue);
    vector-effect: non-scaling-stroke;
  }

  .badge-text {
    fill: #ffffff;
    font-weight: bold;
  }

  .title {
    fill: var(--text);
    font-weight: bold;
  }

  .question,
  .caption,
  .arrow-label {
    fill: var(--muted);
  }

  .browser {
    fill: var(--blue-soft);
  }

  .browser-bar {
    stroke: var(--blue);
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  .lock,
  .verified {
    fill: var(--green-soft);
    stroke: var(--green);
    stroke-linecap: round;
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .document {
    fill: var(--surface-soft);
  }

  .document-fold {
    fill: var(--blue-soft);
    stroke: var(--line);
    stroke-linejoin: round;
    vector-effect: non-scaling-stroke;
  }

  .key {
    fill: var(--amber-soft);
    stroke: var(--amber);
    vector-effect: non-scaling-stroke;
  }

  .key-line {
    stroke: var(--amber);
  }

  .signature-line {
    stroke: var(--blue);
  }

  .token {
    fill: var(--amber-soft);
    stroke: var(--amber);
  }

  .token-hole {
    fill: var(--surface);
    stroke: var(--amber);
    vector-effect: non-scaling-stroke;
  }

  .allowed {
    fill: var(--green-soft);
    stroke: var(--green);
  }

  .blocked {
    fill: var(--danger-soft);
    stroke: var(--danger);
  }

  .allowed-text {
    fill: var(--green);
    font-weight: bold;
  }

  .blocked-text {
    fill: var(--danger);
  }

  .result {
    fill: var(--green);
    font-weight: bold;
  }

  .summary {
    fill: var(--surface-soft);
  }

  .summary-text {
    fill: var(--text);
    font-weight: bold;
  }

  .summary-note {
    fill: var(--muted);
  }

  text {
    dominant-baseline: middle;
  }
</style>
</head>
<body>
<figure>
  <h2 id="diagram-heading">Из чего складывается доверие ANP</h2>
  <svg id="diagram" viewBox="0 0 1200 430" width="1200" height="430"
       role="img" aria-labelledby="diagram-heading diagram-description"
       preserveAspectRatio="xMidYMid meet">
    <desc id="diagram-description">Последовательность из трёх проверок: HTTPS-домен DID-документа, криптографическая подпись и токен с минимальными правами.</desc>
    <g id="generated"></g>
  </svg>
</figure>

<script>
const diagramData = [
  {
    kind: "frame",
    zero: 0,
    x1: 4, y1: 4, x2: 1196, y2: 426,
    fallbackX: 600, fallbackY: 215,
    summary: {
      x1: 48, y1: 356, x2: 1152, y2: 406,
      titleX: 600, titleY: 374,
      noteX: 600, noteY: 394,
      title: "Доверие = проверенный домен + подпись + узкие права",
      note: "Каждое взаимодействие проверяется заново — без цепочки поручителей"
    }
  },
  {
    kind: "domain",
    step: "1",
    x1: 48, y1: 34, x2: 376, y2: 338,
    badge: { x: 82, y: 70, r: 19 },
    titleX: 112, titleY: 66,
    questionX: 344, questionY: 91,
    title: "HTTPS-домен",
    question: "Откуда взят ключ?",
    rule: { x1: 72, y: 111, x2: 352, y: 111 },
    browser: { x1: 76, y1: 132, x2: 348, y2: 198, barY: 153 },
    lock: {
      bodyX1: 91, bodyY1: 160, bodyX2: 115, bodyY2: 184,
      arcX1: 95, arcY1: 160, arcX2: 111, arcY2: 146
    },
    domainTextX: 129, domainTextY: 174,
    domainText: "домен из did:wba",
    downArrow: { x1: 212, y1: 198, x2: 212, y2: 220, head: 7 },
    document: {
      x1: 127, y1: 222, x2: 297, y2: 282,
      foldX: 270, foldY: 222, foldEndX: 297, foldEndY: 249
    },
    documentTextX: 212, documentTextY: 256,
    documentText: "DID-документ",
    resultX: 212, resultY: 314,
    result: "Источник ключа подтверждён"
  },
  {
    kind: "signature",
    step: "2",
    x1: 436, y1: 34, x2: 764, y2: 338,
    badge: { x: 470, y: 70, r: 19 },
    titleX: 500, titleY: 66,
    questionX: 732, questionY: 91,
    title: "Подпись",
    question: "Кто вы?",
    rule: { x1: 460, y: 111, x2: 740, y2: 111 },
    key: {
      cx: 504, cy: 167, r: 20,
      shaftX1: 522, shaftY1: 167, shaftX2: 585, shaftY2: 167,
      toothA: { x1: 556, y1: 167, x2: 556, y2: 184 },
      toothB: { x1: 574, y1: 167, x2: 574, y2: 179 }
    },
    keyTextX: 606, keyTextY: 167,
    keyText: "ключ authentication",
    request: { x1: 476, y1: 211, x2: 724, y2: 274 },
    requestTextX: 500, requestTextY: 230,
    requestText: "запрос агента",
    signaturePoints: [
      { x: 500, y: 255 }, { x: 526, y: 244 }, { x: 545, y: 263 },
      { x: 568, y: 240 }, { x: 595, y: 258 }, { x: 624, y: 246 },
      { x: 653, y: 257 }, { x: 692, y: 250 }
    ],
    check: { cx: 699, cy: 224, r: 16 },
    checkPoints: [
      { x: 689, y: 224 }, { x: 696, y: 232 }, { x: 710, y: 215 }
    ],
    resultX: 600, resultY: 314,
    result: "Владелец DID подтверждён"
  },
  {
    kind: "token",
    step: "3",
    x1: 824, y1: 34, x2: 1152, y2: 338,
    badge: { x: 858, y: 70, r: 19 },
    titleX: 888, titleY: 66,
    questionX: 1120, questionY: 91,
    title: "Минимальные права",
    question: "Что разрешено?",
    rule: { x1: 848, y: 111, x2: 1128, y2: 111 },
    tokenPoints: [
      { x: 862, y: 137 }, { x: 1051, y: 137 }, { x: 1082, y: 168 },
      { x: 1051, y: 199 }, { x: 862, y: 199 }
    ],
    tokenHole: { cx: 1052, cy: 168, r: 9 },
    tokenTextX: 953, tokenTextY: 168,
    tokenText: "токен доступа",
    allowed: { x1: 854, y1: 218, x2: 1122, y2: 256 },
    allowedTextX: 988, allowedTextY: 237,
    allowedText: "✓ читать даты поставок",
    blockedA: { x1: 854, y1: 266, x2: 983, y2: 294 },
    blockedATextX: 918, blockedATextY: 280,
    blockedAText: "не менять",
    blockedB: { x1: 993, y1: 266, x2: 1122, y2: 294 },
    blockedBTextX: 1057, blockedBTextY: 280,
    blockedBText: "без счетов",
    resultX: 988, resultY: 314,
    result: "Разрешено только нужное"
  },
  {
    kind: "arrow",
    x1: 376, y1: 185, x2: 436, y2: 185, head: 10,
    labelX: 387, labelY: 164, label: "затем"
  },
  {
    kind: "arrow",
    x1: 764, y1: 185, x2: 824, y2: 185, head: 10,
    labelX: 775, labelY: 164, label: "дальше"
  }
];

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });

const lineWidth = 2;
const strongLineWidth = 3;
const fontSmall = 14;
const fontBody = 16;
const fontTitle = 20;
const fontBadge = 18;
const labelPadding = 8;

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const layer = document.getElementById("generated");
  const namespace = "http://www.w3.org/2000/svg";
  const frameData = diagramData.find(item => item.kind === "frame");

  function add(tag, attributes, className, parent) {
    const node = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attributes)) {
      node.setAttribute(name, String(value));
    }
    if (className) node.setAttribute("class", className);
    (parent || layer).appendChild(node);
    return node;
  }

  function rect(parent, box, className, width) {
    return add("rect", {
      x: sx(box.x1),
      y: sy(box.y1),
      width: sx(box.x2) - sx(box.x1),
      height: sy(box.y2) - sy(box.y1),
      "stroke-width": width
    }, className, parent);
  }

  function line(parent, item, className, width) {
    return add("line", {
      x1: sx(item.x1),
      y1: sy(item.y1),
      x2: sx(item.x2),
      y2: sy(item.y2),
      "stroke-width": width
    }, className, parent);
  }

  function polyline(parent, points, className, width) {
    return add("polyline", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      "stroke-width": width
    }, className, parent);
  }

  function polygon(parent, points, className, width) {
    return add("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      "stroke-width": width
    }, className, parent);
  }

  function text(parent, x, y, value, className, size, anchor) {
    const node = add("text", {
      x: sx(x),
      y: sy(y),
      "font-size": size,
      "text-anchor": anchor
    }, className, parent);
    node.textContent = value;
    return node;
  }

  function circle(parent, item, className, width) {
    return add("circle", {
      cx: sx(item.cx),
      cy: sy(item.cy),
      r: sx(item.r) - sx(frameData.zero),
      "stroke-width": width
    }, className, parent);
  }

  function arrow(parent, item) {
    line(parent, item, "connector", strongLineWidth);
    polygon(parent, [
      { x: item.x2, y: item.y2 },
      { x: item.x2 - item.head, y: item.y2 - item.head },
      { x: item.x2 - item.head, y: item.y2 + item.head }
    ], "arrow-head", lineWidth);
  }

  function panelBase(item) {
    const group = add("g", {}, "", layer);
    rect(group, item, "panel", lineWidth);
    line(group, item.rule, "panel-rule", lineWidth);
    circle(group, {
      cx: item.badge.x,
      cy: item.badge.y,
      r: item.badge.r
    }, "badge", lineWidth);
    text(group, item.badge.x, item.badge.y, item.step,
      "badge-text", fontBadge, "middle");
    text(group, item.titleX, item.titleY, item.title,
      "title", fontTitle, "start");
    text(group, item.questionX, item.questionY, item.question,
      "question", fontSmall, "end");
    return group;
  }

  function drawDomain(item) {
    const group = panelBase(item);
    rect(group, item.browser, "browser", lineWidth);
    line(group, {
      x1: item.browser.x1,
      y1: item.browser.barY,
      x2: item.browser.x2,
      y2: item.browser.barY
    }, "browser-bar", lineWidth);

    rect(group, {
      x1: item.lock.bodyX1,
      y1: item.lock.bodyY1,
      x2: item.lock.bodyX2,
      y2: item.lock.bodyY2
    }, "lock", lineWidth);

    add("path", {
      d: `M ${sx(item.lock.arcX1)} ${sy(item.lock.arcY1)}
          C ${sx(item.lock.arcX1)} ${sy(item.lock.arcY2)}
            ${sx(item.lock.arcX2)} ${sy(item.lock.arcY2)}
            ${sx(item.lock.arcX2)} ${sy(item.lock.arcY1)}`,
      "stroke-width": lineWidth
    }, "lock", group);

    text(group, item.domainTextX, item.domainTextY, item.domainText,
      "title", fontBody, "start");

    arrow(group, {
      x1: item.downArrow.x1,
      y1: item.downArrow.y1,
      x2: item.downArrow.x2,
      y2: item.downArrow.y2,
      head: item.downArrow.head
    });

    rect(group, item.document, "document", lineWidth);
    polygon(group, [
      { x: item.document.foldX, y: item.document.foldY },
      { x: item.document.foldEndX, y: item.document.foldEndY },
      { x: item.document.foldX, y: item.document.foldEndY }
    ], "document-fold", lineWidth);

    text(group, item.documentTextX, item.documentTextY, item.documentText,
      "title", fontBody, "middle");
    text(group, item.resultX, item.resultY, item.result,
      "result", fontBody, "middle");
  }

  function drawSignature(item) {
    const group = panelBase(item);
    circle(group, item.key, "key", lineWidth);
    line(group, {
      x1: item.key.shaftX1,
      y1: item.key.shaftY1,
      x2: item.key.shaftX2,
      y2: item.key.shaftY2
    }, "key-line", strongLineWidth);
    line(group, item.key.toothA, "key-line", strongLineWidth);
    line(group, item.key.toothB, "key-line", strongLineWidth);

    text(group, item.keyTextX, item.keyTextY, item.keyText,
      "caption", fontSmall, "start");

    rect(group, item.request, "document", lineWidth);
    text(group, item.requestTextX, item.requestTextY, item.requestText,
      "caption", fontSmall, "start");
    polyline(group, item.signaturePoints, "signature-line", strongLineWidth);

    circle(group, item.check, "verified", lineWidth);
    polyline(group, item.checkPoints, "icon-line", strongLineWidth);
    text(group, item.resultX, item.resultY, item.result,
      "result", fontBody, "middle");
  }

  function drawToken(item) {
    const group = panelBase(item);
    polygon(group, item.tokenPoints, "token", lineWidth);
    circle(group, item.tokenHole, "token-hole", lineWidth);
    text(group, item.tokenTextX, item.tokenTextY, item.tokenText,
      "title", fontBody, "middle");

    rect(group, item.allowed, "chip allowed", lineWidth);
    text(group, item.allowedTextX, item.allowedTextY, item.allowedText,
      "allowed-text", fontBody, "middle");

    rect(group, item.blockedA, "chip blocked", lineWidth);
    rect(group, item.blockedB, "chip blocked", lineWidth);
    text(group, item.blockedATextX, item.blockedATextY, item.blockedAText,
      "blocked-text", fontSmall, "middle");
    text(group, item.blockedBTextX, item.blockedBTextY, item.blockedBText,
      "blocked-text", fontSmall, "middle");

    text(group, item.resultX, item.resultY, item.result,
      "result", fontBody, "middle");
  }

  rect(layer, frameData, "frame", lineWidth);

  for (const item of diagramData) {
    if (item.kind === "domain") drawDomain(item);
    if (item.kind === "signature") drawSignature(item);
    if (item.kind === "token") drawToken(item);
  }

  for (const item of diagramData) {
    if (item.kind === "arrow") {
      arrow(layer, item);
      text(layer, item.labelX, item.labelY - labelPadding, item.label,
        "arrow-label", fontSmall, "start");
    }
  }

  rect(layer, frameData.summary, "summary", lineWidth);
  text(layer, frameData.summary.titleX, frameData.summary.titleY,
    frameData.summary.title, "summary-text", fontBody, "middle");
  text(layer, frameData.summary.noteX, frameData.summary.noteY,
    frameData.summary.note, "summary-note", fontSmall, "middle");
} catch (error) {
  const layer = document.getElementById("generated");
  const namespace = "http://www.w3.org/2000/svg";
  const frameData = diagramData.find(item => item.kind === "frame");
  while (layer.firstChild) layer.removeChild(layer.firstChild);
  const fallback = document.createElementNS(namespace, "text");
  fallback.setAttribute("x", String(sx(frameData.fallbackX)));
  fallback.setAttribute("y", String(sy(frameData.fallbackY)));
  fallback.setAttribute("text-anchor", "middle");
  fallback.setAttribute("font-size", String(fontBody));
  fallback.setAttribute("fill", "currentColor");
  fallback.textContent = "Три проверки: HTTPS-домен DID-документа → подпись → токен с минимальными правами";
  layer.appendChild(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
