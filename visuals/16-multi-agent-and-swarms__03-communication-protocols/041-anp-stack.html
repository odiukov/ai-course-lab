<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три слоя ANP</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f8fafc;
      --ink: #172033;
      --muted: #586579;
      --line: #768398;
      --dependency: #48566d;

      --app-bg: #f4edff;
      --app-stroke: #8156c7;
      --app-accent: #6f42b5;
      --app-card: #fcfaff;

      --meta-bg: #eaf3ff;
      --meta-stroke: #3775be;
      --meta-accent: #225f9f;
      --meta-card: #f8fbff;

      --identity-bg: #e7f8ef;
      --identity-stroke: #23865e;
      --identity-accent: #126c48;
      --identity-card: #f8fffb;

      --shadow: rgba(41, 53, 72, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #10151e;
        --ink: #edf2f8;
        --muted: #aeb9c8;
        --line: #8995a7;
        --dependency: #b8c3d2;

        --app-bg: #271d39;
        --app-stroke: #a77ce4;
        --app-accent: #c09af1;
        --app-card: #312344;

        --meta-bg: #162a40;
        --meta-stroke: #67a0df;
        --meta-accent: #89b9eb;
        --meta-card: #1c344d;

        --identity-bg: #153429;
        --identity-stroke: #58b88e;
        --identity-accent: #76d0a8;
        --identity-card: #1a4032;

        --shadow: rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
    }

    header {
      padding: 12px 22px 2px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -.02em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 438px;
      background: var(--canvas);
    }

    .panel {
      stroke-width: 2;
      filter: drop-shadow(0 4px 7px var(--shadow));
    }

    .panel.app {
      fill: var(--app-bg);
      stroke: var(--app-stroke);
    }

    .panel.meta {
      fill: var(--meta-bg);
      stroke: var(--meta-stroke);
    }

    .panel.identity {
      fill: var(--identity-bg);
      stroke: var(--identity-stroke);
    }

    .stripe.app { fill: var(--app-accent); }
    .stripe.meta { fill: var(--meta-accent); }
    .stripe.identity { fill: var(--identity-accent); }

    .card {
      stroke-width: 2;
    }

    .card.app {
      fill: var(--app-card);
      stroke: var(--app-stroke);
    }

    .card.meta {
      fill: var(--meta-card);
      stroke: var(--meta-stroke);
    }

    .card.identity {
      fill: var(--identity-card);
      stroke: var(--identity-stroke);
    }

    .badge.app {
      fill: var(--app-accent);
      stroke: var(--app-accent);
    }

    .badge.meta {
      fill: var(--meta-accent);
      stroke: var(--meta-accent);
    }

    .badge.identity {
      fill: var(--identity-accent);
      stroke: var(--identity-accent);
    }

    text {
      fill: var(--ink);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .kicker {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .08em;
    }

    .kicker.app { fill: var(--app-accent); }
    .kicker.meta { fill: var(--meta-accent); }
    .kicker.identity { fill: var(--identity-accent); }

    .question {
      fill: var(--muted);
      font-size: 13px;
      font-style: italic;
    }

    .card-title {
      font-size: 15px;
      font-weight: bold;
    }

    .card-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .badge-text {
      fill: var(--canvas);
      font-size: 11px;
      font-weight: bold;
    }

    .flow,
    .dependency,
    .guide {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .flow {
      stroke-width: 2;
    }

    .flow.meta { stroke: var(--meta-accent); }

    .dependency,
    .guide {
      stroke: var(--dependency);
      stroke-width: 2;
    }

    .arrow-head {
      stroke: none;
    }

    .arrow-head.meta { fill: var(--meta-accent); }
    .arrow-head.dependency,
    .arrow-head.guide { fill: var(--dependency); }

    .dependency-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .guide-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: .06em;
    }

    #fallback {
      margin: 14px 22px 22px;
      padding: 16px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: var(--canvas);
      color: var(--ink);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <header>
      <h1 id="diagram-title">Три слоя ANP</h1>
    </header>

    <svg id="diagram" viewBox="0 0 960 438" width="960" height="438"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Три зависимых слоя протокола ANP</title>
      <desc id="svg-desc">Снизу расположены DID, подпись и HPKE, выше — согласование метапротокола, наверху — Agent Description и discovery. Стрелки направлены от верхних слоёв к основаниям, от которых они зависят.</desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать три зависимых слоя: внизу DID, подписи и
      HPKE; в центре согласование метапротокола; наверху Agent Description
      и discovery. Верхние слои опираются на нижние.
    </p>
  </figure>

  <script>
    const diagramData = Object.freeze([
      {
        type: "layer",
        theme: "app",
        panel: { x1: 8, y1: 5, x2: 84, y2: 29, round: 2 },
        stripe: { x1: 8, y1: 5, x2: 9, y2: 29, round: 1 },
        kicker: { x: 12, y: 10, text: "ПРИКЛАДНОЙ СЛОЙ", anchor: "start" },
        question: {
          x: 80, y: 10, text: "что умеет агент и где его найти?",
          anchor: "end"
        },
        cards: [
          {
            box: { x1: 12, y1: 15, x2: 45, y2: 25.5, round: 1.4 },
            badge: { cx: 16, cy: 20.25, rx: 2.2, ry: 2.8, text: "AD" },
            title: {
              x: 20, y: 18.7, text: "Agent Description", anchor: "start"
            },
            note: {
              x: 20, y: 22.3, text: "услуги и возможности", anchor: "start"
            }
          },
          {
            box: { x1: 49, y1: 15, x2: 80, y2: 25.5, round: 1.4 },
            badge: { cx: 53, cy: 20.25, rx: 2.2, ry: 2.8, text: "D" },
            title: { x: 57, y: 18.7, text: "Discovery", anchor: "start" },
            note: {
              x: 57, y: 22.3, text: "точки обнаружения", anchor: "start"
            }
          }
        ]
      },
      {
        type: "layer",
        theme: "meta",
        panel: { x1: 8, y1: 36, x2: 84, y2: 62, round: 2 },
        stripe: { x1: 8, y1: 36, x2: 9, y2: 62, round: 1 },
        kicker: { x: 12, y: 41, text: "МЕТАПРОТОКОЛ", anchor: "start" },
        question: {
          x: 80, y: 41, text: "как понимать сообщения друг друга?",
          anchor: "end"
        },
        cards: [
          {
            box: { x1: 12, y1: 47, x2: 31, y2: 58, round: 1.4 },
            badge: { cx: 21.5, cy: 50.8, rx: 2.2, ry: 2.5, text: "…" },
            title: {
              x: 21.5, y: 54.8, text: "Предлагают форматы",
              anchor: "middle"
            }
          },
          {
            box: { x1: 37, y1: 47, x2: 57, y2: 58, round: 1.4 },
            badge: { cx: 47, cy: 50.8, rx: 2.2, ry: 2.5, text: "✓" },
            title: {
              x: 47, y: 54.8, text: "Выбирают общий",
              anchor: "middle"
            }
          },
          {
            box: { x1: 63, y1: 47, x2: 80, y2: 58, round: 1.4 },
            badge: { cx: 71.5, cy: 50.8, rx: 2.2, ry: 2.5, text: "{ }" },
            title: {
              x: 71.5, y: 54.8, text: "Создают адаптер",
              anchor: "middle"
            }
          }
        ],
        arrows: [
          {
            line: { x1: 31.8, y1: 52.5, x2: 35.8, y2: 52.5 },
            head: [
              { x: 35.8, y: 51.4 },
              { x: 37, y: 52.5 },
              { x: 35.8, y: 53.6 }
            ]
          },
          {
            line: { x1: 57.8, y1: 52.5, x2: 61.8, y2: 52.5 },
            head: [
              { x: 61.8, y: 51.4 },
              { x: 63, y: 52.5 },
              { x: 61.8, y: 53.6 }
            ]
          }
        ]
      },
      {
        type: "layer",
        theme: "identity",
        panel: { x1: 8, y1: 69, x2: 84, y2: 94, round: 2 },
        stripe: { x1: 8, y1: 69, x2: 9, y2: 94, round: 1 },
        kicker: {
          x: 12, y: 74, text: "ИДЕНТИЧНОСТЬ И ЗАЩИЩЁННАЯ СВЯЗЬ",
          anchor: "start"
        },
        question: {
          x: 80, y: 74, text: "с кем я говорю и безопасно ли?",
          anchor: "end"
        },
        cards: [
          {
            box: { x1: 12, y1: 80, x2: 31, y2: 90.5, round: 1.4 },
            badge: { cx: 16, cy: 85.25, rx: 2.2, ry: 2.8, text: "ID" },
            title: { x: 20, y: 83.7, text: "DID", anchor: "start" },
            note: {
              x: 20, y: 87.3, text: "личность агента", anchor: "start"
            }
          },
          {
            box: { x1: 36, y1: 80, x2: 56, y2: 90.5, round: 1.4 },
            badge: { cx: 40, cy: 85.25, rx: 2.2, ry: 2.8, text: "✓" },
            title: { x: 44, y: 83.7, text: "Подпись", anchor: "start" },
            note: {
              x: 44, y: 87.3, text: "проверка автора", anchor: "start"
            }
          },
          {
            box: { x1: 61, y1: 80, x2: 80, y2: 90.5, round: 1.4 },
            badge: { cx: 65, cy: 85.25, rx: 2.2, ry: 2.8, text: "◆" },
            title: { x: 69, y: 83.7, text: "HPKE", anchor: "start" },
            note: {
              x: 69, y: 87.3, text: "шифрование", anchor: "start"
            }
          }
        ]
      },
      {
        type: "dependency",
        line: { x1: 89, y1: 28.5, x2: 89, y2: 34.7 },
        head: [
          { x: 87.8, y: 34.7 },
          { x: 89, y: 36 },
          { x: 90.2, y: 34.7 }
        ],
        label: {
          x: 91, y: 31, text: "зависит от", anchor: "start"
        }
      },
      {
        type: "dependency",
        line: { x1: 89, y1: 61.5, x2: 89, y2: 67.7 },
        head: [
          { x: 87.8, y: 67.7 },
          { x: 89, y: 69 },
          { x: 90.2, y: 67.7 }
        ],
        label: {
          x: 91, y: 64, text: "зависит от", anchor: "start"
        }
      },
      {
        type: "guide",
        line: { x1: 4, y1: 90, x2: 4, y2: 9 },
        head: [
          { x: 2.8, y: 10.3 },
          { x: 4, y: 8 },
          { x: 5.2, y: 10.3 }
        ],
        label: {
          x: 4, y: 97.5, text: "СМОТРИ СНИЗУ ВВЕРХ",
          anchor: "start"
        }
      }
    ]);

    const origin = Object.freeze({ x: 44, y: -3 });
    const scale = Object.freeze({ x: 9, y: 4.28 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    function make(tag, attributes, content) {
      const element = document.createElementNS(svg.namespaceURI, tag);
      Object.entries(attributes || {}).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });
      if (content !== undefined) element.textContent = content;
      return element;
    }

    function rectAttributes(box) {
      return {
        x: sx(box.x1),
        y: sy(box.y1),
        width: sx(box.x2) - sx(box.x1),
        height: sy(box.y2) - sy(box.y1),
        rx: sx(box.round) - sx(0),
        ry: sy(box.round) - sy(0)
      };
    }

    function points(vertices) {
      return vertices.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");
    }

    function addText(parent, item, className) {
      parent.appendChild(make("text", {
        x: sx(item.x),
        y: sy(item.y),
        "text-anchor": item.anchor,
        class: className
      }, item.text));
    }

    function drawCard(parent, card, theme) {
      parent.appendChild(make("rect", {
        ...rectAttributes(card.box),
        class: `card ${theme}`
      }));

      parent.appendChild(make("ellipse", {
        cx: sx(card.badge.cx),
        cy: sy(card.badge.cy),
        rx: sx(card.badge.rx) - sx(0),
        ry: sy(card.badge.ry) - sy(0),
        class: `badge ${theme}`
      }));

      addText(parent, {
        x: card.badge.cx,
        y: card.badge.cy,
        text: card.badge.text,
        anchor: "middle"
      }, "badge-text");

      addText(parent, card.title, "card-title");
      if (card.note) addText(parent, card.note, "card-note");
    }

    function drawLayer(layer) {
      const group = make("g", {
        class: `layer ${layer.theme}`,
        "aria-label": layer.kicker.text
      });

      group.appendChild(make("rect", {
        ...rectAttributes(layer.panel),
        class: `panel ${layer.theme}`
      }));

      group.appendChild(make("rect", {
        ...rectAttributes(layer.stripe),
        class: `stripe ${layer.theme}`
      }));

      addText(group, layer.kicker, `kicker ${layer.theme}`);
      addText(group, layer.question, "question");
      layer.cards.forEach(card => drawCard(group, card, layer.theme));

      (layer.arrows || []).forEach(arrow => {
        group.appendChild(make("line", {
          x1: sx(arrow.line.x1),
          y1: sy(arrow.line.y1),
          x2: sx(arrow.line.x2),
          y2: sy(arrow.line.y2),
          class: `flow ${layer.theme}`
        }));
        group.appendChild(make("polygon", {
          points: points(arrow.head),
          class: `arrow-head ${layer.theme}`
        }));
      });

      svg.appendChild(group);
    }

    function drawDependency(item) {
      svg.appendChild(make("line", {
        x1: sx(item.line.x1),
        y1: sy(item.line.y1),
        x2: sx(item.line.x2),
        y2: sy(item.line.y2),
        class: "dependency"
      }));
      svg.appendChild(make("polygon", {
        points: points(item.head),
        class: "arrow-head dependency"
      }));
      addText(svg, item.label, "dependency-label");
    }

    function drawGuide(item) {
      svg.appendChild(make("line", {
        x1: sx(item.line.x1),
        y1: sy(item.line.y1),
        x2: sx(item.line.x2),
        y2: sy(item.line.y2),
        class: "guide"
      }));
      svg.appendChild(make("polygon", {
        points: points(item.head),
        class: "arrow-head guide"
      }));
      addText(svg, item.label, "guide-label");
    }

    try {
      diagramData.forEach(item => {
        if (item.type === "layer") drawLayer(item);
        if (item.type === "dependency") drawDependency(item);
        if (item.type === "guide") drawGuide(item);
      });
    } catch (error) {
      svg.style.display = "none";
      svg.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
