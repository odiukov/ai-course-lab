<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Слои MCP, ACP, A2A и ANP</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f8fafc;
    --surface: #ffffff;
    --text: #172033;
    --muted: #526078;
    --frame: #cbd5e1;
    --guide: #64748b;

    --mcp-fill: #d9f7e9;
    --mcp-edge: #087a55;
    --mcp-badge: #b8ecd4;

    --acp-fill: #fff1c9;
    --acp-edge: #ad6509;
    --acp-badge: #f8d98a;

    --a2a-fill: #dcecff;
    --a2a-edge: #245fc2;
    --a2a-badge: #b9d7ff;

    --anp-fill: #efe2ff;
    --anp-edge: #7138b8;
    --anp-badge: #d9baff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10141d;
      --surface: #161c28;
      --text: #f1f5f9;
      --muted: #b8c2d2;
      --frame: #39465a;
      --guide: #9aa9bd;

      --mcp-fill: #123e32;
      --mcp-edge: #55d6a3;
      --mcp-badge: #1b5947;

      --acp-fill: #493613;
      --acp-edge: #f3bd55;
      --acp-badge: #685020;

      --a2a-fill: #18345c;
      --a2a-edge: #77adff;
      --a2a-badge: #244d82;

      --anp-fill: #382253;
      --anp-edge: #c69aff;
      --anp-badge: #543477;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: unset; background: var(--page); color: var(--text); }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 {
    margin: unset;
    font-size: 20px;
    font-weight: 750;
    text-align: center;
    color: var(--text);
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--surface);
    border: 1px solid var(--frame);
  }
  .panel { stroke-width: 2px; }
  .badge { stroke-width: 1px; }
  .layer-title { font-size: 19px; font-weight: 750; fill: var(--text); }
  .question { font-size: 14px; fill: var(--muted); }
  .acronym { font-size: 22px; font-weight: 800; fill: currentColor; }
  .icon-label { font-size: 12px; font-weight: 650; fill: currentColor; }
  .guide-label { font-size: 13px; font-weight: 700; fill: var(--guide); }
  .footer-label { font-size: 14px; font-weight: 650; fill: var(--muted); }
  .stroke-current {
    fill: none;
    stroke: currentColor;
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .fill-current { fill: currentColor; stroke: none; }
  .guide-stroke {
    fill: none;
    stroke: var(--guide);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .mcp { color: var(--mcp-edge); }
  .mcp .panel { fill: var(--mcp-fill); stroke: var(--mcp-edge); }
  .mcp .badge { fill: var(--mcp-badge); stroke: var(--mcp-edge); }
  .acp { color: var(--acp-edge); }
  .acp .panel { fill: var(--acp-fill); stroke: var(--acp-edge); }
  .acp .badge { fill: var(--acp-badge); stroke: var(--acp-edge); }
  .a2a { color: var(--a2a-edge); }
  .a2a .panel { fill: var(--a2a-fill); stroke: var(--a2a-edge); }
  .a2a .badge { fill: var(--a2a-badge); stroke: var(--a2a-edge); }
  .anp { color: var(--anp-edge); }
  .anp .panel { fill: var(--anp-fill); stroke: var(--anp-edge); }
  .anp .badge { fill: var(--anp-badge); stroke: var(--anp-edge); }
  #fallback {
    font-size: 16px;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--frame);
  }
</style>
</head>
<body>
<h1>Слои MCP, ACP, A2A и ANP</h1>

<svg id="diagram" viewBox="0 0 960 452" width="960" height="452"
     role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Четыре уровня взаимодействия агентов</title>
  <desc id="svg-desc">
    Схема читается снизу вверх: MCP даёт доступ к инструментам,
    ACP сохраняет ход работы, A2A согласует задачи между агентами,
    а ANP устанавливает доверие между незнакомыми агентами.
  </desc>
</svg>

<p id="fallback" hidden>
  Схема должна была показать четыре этажа снизу вверх: MCP — инструменты;
  ACP — аудит; A2A — задачи между агентами; ANP — доверие незнакомым агентам.
</p>

<script>
"use strict";

const diagramData = [{
  canvas: { x: -48, y: -18, w: 960, h: 452 },
  metrics: {
    corner: 12,
    badgeCorner: 9,
    arrowLength: 10,
    arrowHalf: 5,
    agentHead: 7,
    agentShoulder: 13
  },
  guide: {
    x: 25,
    yBottom: 372,
    yTop: 37,
    labelX: 0,
    labelY: 383
  },
  card: { x: 110, w: 782, h: 75, badgeX: 130, badgeW: 92 },
  text: { titleX: 248, titleDy: 30, questionX: 248, questionDy: 54 },
  layers: [
    {
      key: "anp",
      acronym: "ANP",
      y: 35,
      title: "Доверие незнакомым агентам",
      question: "Как установить личности и защищённую связь?"
    },
    {
      key: "a2a",
      acronym: "A2A",
      y: 125,
      title: "Задачи между агентами",
      question: "Как согласовать общую цель и состояние задачи?"
    },
    {
      key: "acp",
      acronym: "ACP",
      y: 215,
      title: "Аудит и продолжение работы",
      question: "Как сохранить запуск, историю и сессию?"
    },
    {
      key: "mcp",
      acronym: "MCP",
      y: 305,
      title: "Инструменты",
      question: "Как помощник использует конкретный инструмент?"
    }
  ],
  icons: {
    anp: {
      leftAgent: { x: 668, y: 64 },
      rightAgent: { x: 844, y: 64 },
      shield: [[744, 47], [766, 47], [766, 65], [755, 77], [744, 65]],
      lock: { x: 749, y: 55, w: 12, h: 12, archX1: 751, archY1: 55, archX2: 759, archY2: 55, archTop: 50 },
      leftLine: { x1: 689, y1: 64, x2: 740, y2: 64 },
      rightLine: { x1: 770, y1: 64, x2: 823, y2: 64 },
      label: { x: 755, y: 96, text: "личность + защищённый канал" }
    },
    a2a: {
      leftAgent: { x: 670, y: 154 },
      rightAgent: { x: 842, y: 154 },
      goal: { x: 735, y: 143, w: 42, h: 22 },
      leftFlow: { x1: 692, y1: 154, x2: 730, y2: 154 },
      rightFlow: { x1: 820, y1: 154, x2: 782, y2: 154 },
      label: { x: 756, y: 186, text: "общая цель и состояние" }
    },
    acp: {
      line: { x1: 652, y1: 244, x2: 756, y2: 244 },
      dots: [
        { x: 665, y: 244, r: 5 },
        { x: 705, y: 244, r: 5 },
        { x: 745, y: 244, r: 5 }
      ],
      session: { x: 789, y: 230, w: 58, h: 31 },
      sessionLines: [
        { x1: 800, y1: 240, x2: 836, y2: 240 },
        { x1: 800, y1: 250, x2: 827, y2: 250 }
      ],
      flow: { x1: 758, y1: 244, x2: 784, y2: 244 },
      label: { x: 750, y: 276, text: "запуск · история · сессия" }
    },
    mcp: {
      agent: { x: 674, y: 334 },
      flow: { x1: 696, y1: 334, x2: 758, y2: 334 },
      calendar: { x: 765, y: 319, w: 66, h: 36 },
      bar: { x1: 765, y1: 329, x2: 831, y2: 329 },
      rings: [
        { x1: 780, y1: 314, x2: 780, y2: 324 },
        { x1: 816, y1: 314, x2: 816, y2: 324 }
      ],
      cells: [
        { x: 780, y: 340, r: 3 },
        { x: 797, y: 340, r: 3 },
        { x: 814, y: 340, r: 3 }
      ],
      label: { x: 798, y: 367, text: "календарь" }
    }
  },
  footer: {
    x: 501,
    y: 414,
    text: "Каждый верхний слой добавляет новый вопрос и сохраняет нижние"
  }
}];

const origin = { x: 48, y: 18 };
const scale = 1;

function sx(x) { return origin.x + x * scale; }
function sy(y) { return origin.y + y * scale; }

const labelPad = 8;

try {
  const [D] = diagramData;
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";

  function el(name, attrs, text) {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function rect(group, item, className, corner) {
    group.appendChild(el("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.x + item.w) - sx(item.x),
      height: sy(item.y + item.h) - sy(item.y),
      rx: sx(corner) - sx(0),
      ry: sy(corner) - sy(0),
      class: className
    }));
  }

  function line(group, item, className) {
    group.appendChild(el("line", {
      x1: sx(item.x1), y1: sy(item.y1),
      x2: sx(item.x2), y2: sy(item.y2),
      class: className
    }));
  }

  function circle(group, item, className) {
    group.appendChild(el("circle", {
      cx: sx(item.x),
      cy: sy(item.y),
      r: sx(item.r) - sx(0),
      class: className
    }));
  }

  function polygon(group, points, className) {
    group.appendChild(el("polygon", {
      points: points.map(({ x, y }) => `${sx(x)},${sy(y)}`).join(" "),
      class: className
    }));
  }

  function arrow(group, item, lineClass, headClass) {
    line(group, item, lineClass);
    const dx = item.x2 - item.x1;
    const dy = item.y2 - item.y1;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const bx = item.x2 - ux * D.metrics.arrowLength;
    const by = item.y2 - uy * D.metrics.arrowLength;
    polygon(group, [
      { x: item.x2, y: item.y2 },
      { x: bx - uy * D.metrics.arrowHalf, y: by + ux * D.metrics.arrowHalf },
      { x: bx + uy * D.metrics.arrowHalf, y: by - ux * D.metrics.arrowHalf }
    ], headClass);
  }

  function text(group, x, y, value, className, anchor) {
    group.appendChild(el("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, value));
  }

  function agent(group, item, unknown) {
    circle(group, {
      x: item.x,
      y: item.y - D.metrics.agentShoulder,
      r: D.metrics.agentHead
    }, "stroke-current");
    group.appendChild(el("path", {
      d: `M ${sx(item.x - D.metrics.agentShoulder)} ${sy(item.y + D.metrics.agentHead)}
          Q ${sx(item.x)} ${sy(item.y - D.metrics.agentHead)}
            ${sx(item.x + D.metrics.agentShoulder)} ${sy(item.y + D.metrics.agentHead)}`,
      class: "stroke-current"
    }));
    if (unknown) {
      text(group, item.x, item.y - D.metrics.agentShoulder + D.metrics.arrowHalf,
        "?", "icon-label", "middle");
    }
  }

  const backdrop = el("rect", {
    x: sx(D.canvas.x),
    y: sy(D.canvas.y),
    width: sx(D.canvas.x + D.canvas.w) - sx(D.canvas.x),
    height: sy(D.canvas.y + D.canvas.h) - sy(D.canvas.y),
    fill: "var(--surface)"
  });
  svg.appendChild(backdrop);

  const guideGroup = el("g", {});
  arrow(guideGroup, {
    x1: D.guide.x,
    y1: D.guide.yBottom,
    x2: D.guide.x,
    y2: D.guide.yTop
  }, "guide-stroke", "fill-current");
  guideGroup.setAttribute("color", "var(--guide)");
  const guideText = el("text", {
    x: sx(D.guide.labelX),
    y: sy(D.guide.labelY),
    dx: labelPad,
    dy: -labelPad,
    class: "guide-label",
    "text-anchor": "start"
  }, "Читать снизу вверх");
  guideGroup.appendChild(guideText);
  svg.appendChild(guideGroup);

  D.layers.forEach(layer => {
    const group = el("g", { class: layer.key });
    const card = {
      x: D.card.x,
      y: layer.y,
      w: D.card.w,
      h: D.card.h
    };
    const badge = {
      x: D.card.badgeX,
      y: layer.y + D.metrics.corner,
      w: D.card.badgeW,
      h: D.card.h - D.metrics.corner - D.metrics.corner
    };

    rect(group, card, "panel", D.metrics.corner);
    rect(group, badge, "badge", D.metrics.badgeCorner);

    text(group,
      D.card.badgeX + D.card.badgeW / scale / scale,
      layer.y + D.text.titleDy + D.metrics.arrowHalf,
      layer.acronym, "acronym", "middle");

    text(group, D.text.titleX, layer.y + D.text.titleDy,
      layer.title, "layer-title", "start");
    text(group, D.text.questionX, layer.y + D.text.questionDy,
      layer.question, "question", "start");

    const icon = D.icons[layer.key];

    if (layer.key === "mcp") {
      agent(group, icon.agent, false);
      arrow(group, icon.flow, "stroke-current", "fill-current");
      rect(group, icon.calendar, "stroke-current", D.metrics.badgeCorner);
      line(group, icon.bar, "stroke-current");
      icon.rings.forEach(item => line(group, item, "stroke-current"));
      icon.cells.forEach(item => circle(group, item, "fill-current"));
    }

    if (layer.key === "acp") {
      line(group, icon.line, "stroke-current");
      icon.dots.forEach(item => circle(group, item, "fill-current"));
      arrow(group, icon.flow, "stroke-current", "fill-current");
      rect(group, icon.session, "stroke-current", D.metrics.badgeCorner);
      icon.sessionLines.forEach(item => line(group, item, "stroke-current"));
    }

    if (layer.key === "a2a") {
      agent(group, icon.leftAgent, false);
      agent(group, icon.rightAgent, false);
      arrow(group, icon.leftFlow, "stroke-current", "fill-current");
      arrow(group, icon.rightFlow, "stroke-current", "fill-current");
      rect(group, icon.goal, "badge", D.metrics.badgeCorner);
      text(group,
        icon.goal.x + icon.goal.w / scale / scale,
        icon.goal.y + icon.goal.h - D.metrics.arrowHalf,
        "цель", "icon-label", "middle");
    }

    if (layer.key === "anp") {
      agent(group, icon.leftAgent, true);
      agent(group, icon.rightAgent, false);
      line(group, icon.leftLine, "stroke-current");
      line(group, icon.rightLine, "stroke-current");
      polygon(group,
        icon.shield.map(([x, y]) => ({ x, y })),
        "stroke-current");
      rect(group, icon.lock, "stroke-current", D.metrics.badgeCorner);
      group.appendChild(el("path", {
        d: `M ${sx(icon.lock.archX1)} ${sy(icon.lock.archY1)}
            Q ${sx((icon.lock.archX1 + icon.lock.archX2) / scale / scale)}
              ${sy(icon.lock.archTop)}
              ${sx(icon.lock.archX2)} ${sy(icon.lock.archY2)}`,
        class: "stroke-current"
      }));
    }

    text(group, icon.label.x, icon.label.y,
      icon.label.text, "icon-label", "middle");
    svg.appendChild(group);
  });

  text(svg, D.footer.x, D.footer.y, D.footer.text,
    "footer-label", "middle");

} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (svg) svg.setAttribute("hidden", "");
  if (fallback) fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
