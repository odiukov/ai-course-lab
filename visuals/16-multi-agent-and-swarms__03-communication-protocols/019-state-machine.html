<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Допустимые переходы задачи A2A</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5f6b7d;
    --line: #53657d;
    --active: #eaf2ff;
    --active-stroke: #3974c5;
    --pause: #fff6d8;
    --pause-stroke: #b98518;
    --terminal: #fbeaec;
    --terminal-stroke: #b84a59;
    --success: #e8f6ed;
    --success-stroke: #2c8a55;
    --halo: #ffffff;
    --note: #eef2f7;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  body { padding: 14px; }

  main {
    width: 100%;
    max-width: 1120px;
    margin: 0 auto;
    overflow: hidden;
    border: 1px solid #cfd7e3;
    background: var(--panel);
    box-shadow: 0 5px 18px rgba(33, 46, 68, 0.08);
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 20px 10px;
    border-bottom: 1px solid #dce2eb;
  }

  h1 {
    margin: 0;
    font-size: 21px;
    line-height: 1.25;
    font-weight: 720;
    letter-spacing: -0.01em;
  }

  .hint {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.3;
    text-align: right;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--panel);
  }

  .edge {
    fill: none;
    stroke: var(--line);
    stroke-width: 2.2;
    stroke-linecap: round;
  }

  .edge.pause-edge {
    stroke: var(--pause-stroke);
  }

  .edge.terminal-edge {
    stroke: var(--terminal-stroke);
  }

  .arrow {
    fill: var(--line);
  }

  .arrow.pause-edge {
    fill: var(--pause-stroke);
  }

  .arrow.terminal-edge {
    fill: var(--terminal-stroke);
  }

  .node {
    stroke-width: 2.2;
    vector-effect: non-scaling-stroke;
  }

  .node.active {
    fill: var(--active);
    stroke: var(--active-stroke);
  }

  .node.pause {
    fill: var(--pause);
    stroke: var(--pause-stroke);
  }

  .node.terminal {
    fill: var(--terminal);
    stroke: var(--terminal-stroke);
  }

  .node.success {
    fill: var(--success);
    stroke: var(--success-stroke);
  }

  .terminal-cap {
    fill: var(--terminal-stroke);
  }

  .node-title {
    fill: var(--ink);
    font-size: 16px;
    font-weight: 700;
    text-anchor: middle;
  }

  .node-code {
    fill: var(--muted);
    font-size: 12px;
    font-weight: 650;
    text-anchor: middle;
    letter-spacing: 0.02em;
  }

  .edge-label {
    fill: var(--ink);
    stroke: var(--halo);
    stroke-width: 5px;
    paint-order: stroke fill;
    stroke-linejoin: round;
    font-size: 12px;
    font-weight: 650;
  }

  .section-label {
    fill: var(--terminal-stroke);
    font-size: 12px;
    font-weight: 750;
    letter-spacing: 0.08em;
  }

  .footer-band {
    fill: var(--note);
    stroke: #d7dee8;
    stroke-width: 1.4;
  }

  .footer-text {
    fill: var(--ink);
    font-size: 13px;
    font-weight: 650;
    text-anchor: middle;
  }

  .fallback {
    fill: var(--ink);
    font-size: 16px;
    text-anchor: middle;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10151e;
      --panel: #171e29;
      --ink: #eef3fa;
      --muted: #aab6c7;
      --line: #9aabc0;
      --active: #172b47;
      --active-stroke: #6ba6f0;
      --pause: #392f16;
      --pause-stroke: #e1b64f;
      --terminal: #3a2026;
      --terminal-stroke: #ee8290;
      --success: #173328;
      --success-stroke: #65c98e;
      --halo: #171e29;
      --note: #202936;
    }

    main {
      border-color: #394555;
      box-shadow: none;
    }

    header { border-bottom-color: #344050; }
    .footer-band { stroke: #394656; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Допустимые переходы задачи A2A</h1>
    <p class="hint">Стрелка означает разрешённое изменение состояния</p>
  </header>

  <svg id="diagram"
       viewBox="0 0 1120 500"
       width="1120"
       height="500"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Граф допустимых состояний задачи A2A</title>
    <desc id="svg-desc">Из submitted задача переходит в working или rejected. Из working она может запросить данные или аутентификацию, а затем вернуться в работу, либо завершиться состоянием completed, failed или canceled. Все четыре конечных состояния неизменяемы.</desc>
    <g id="drawing"></g>
  </svg>
</main>

<script>
const scheme = Object.freeze({
  geometry: {
    half: 0.5,
    nodeHeight: 0.72,
    normalWidth: 1.72,
    pauseWidth: 2.08,
    terminalWidth: 1.62,
    capWidth: 0.055,
    titleShift: -0.075,
    codeShift: 0.19,
    arrowLength: 0.15,
    arrowHalf: 0.075,
    footerX: 0.18,
    footerY: 5.17,
    footerWidth: 7.65,
    footerHeight: 0.55,
    footerTextY: 5.455,
    terminalHeadingX: 6.28,
    terminalHeadingY: 0.13,
    fallbackX: 3.95,
    fallbackY: 2.65
  },
  nodes: [
    { id: "submitted", x: 1.18, y: 2.55, w: 1.72, kind: "active",
      title: "Принята", code: "submitted" },
    { id: "working", x: 3.92, y: 2.55, w: 1.72, kind: "active",
      title: "В работе", code: "working" },
    { id: "input-required", x: 3.92, y: 0.72, w: 2.08, kind: "pause",
      title: "Нужны данные", code: "input-required" },
    { id: "auth-required", x: 3.92, y: 4.35, w: 2.08, kind: "pause",
      title: "Нужен доступ", code: "auth-required" },
    { id: "completed", x: 7.18, y: 0.72, w: 1.62, kind: "success",
      title: "Завершена", code: "completed" },
    { id: "failed", x: 7.18, y: 2.02, w: 1.62, kind: "terminal",
      title: "Ошибка", code: "failed" },
    { id: "canceled", x: 7.18, y: 3.32, w: 1.62, kind: "terminal",
      title: "Отменена", code: "canceled" },
    { id: "rejected", x: 1.18, y: 4.35, w: 1.72, kind: "terminal",
      title: "Отклонена", code: "rejected" }
  ],
  edges: [
    { x1: 2.04, y1: 2.55, x2: 3.06, y2: 2.55, kind: "",
      label: "начать", lx: 2.22, ly: 2.38, anchor: "start" },
    { x1: 1.18, y1: 2.91, x2: 1.18, y2: 3.99, kind: "terminal-edge",
      label: "отказ", lx: 1.31, ly: 3.18, anchor: "start" },

    { x1: 3.56, y1: 2.19, x2: 3.56, y2: 1.08, kind: "pause-edge",
      label: "нужны сведения", lx: 3.43, ly: 1.92, anchor: "end" },
    { x1: 4.28, y1: 1.08, x2: 4.28, y2: 2.19, kind: "pause-edge",
      label: "данные получены", lx: 4.41, ly: 1.38, anchor: "start" },

    { x1: 3.56, y1: 2.91, x2: 3.56, y2: 3.99, kind: "pause-edge",
      label: "нужна аутентификация", lx: 3.43, ly: 3.24, anchor: "end" },
    { x1: 4.28, y1: 3.99, x2: 4.28, y2: 2.91, kind: "pause-edge",
      label: "доступ подтверждён", lx: 4.41, ly: 3.72, anchor: "start" },

    { x1: 4.78, y1: 2.34, x2: 6.37, y2: 0.72, kind: "terminal-edge",
      label: "успех", lx: 4.98, ly: 1.98, anchor: "start" },
    { x1: 4.78, y1: 2.51, x2: 6.37, y2: 2.02, kind: "terminal-edge",
      label: "ошибка", lx: 5.08, ly: 2.34, anchor: "start" },
    { x1: 4.78, y1: 2.71, x2: 6.37, y2: 3.32, kind: "terminal-edge",
      label: "отмена клиентом", lx: 5.03, ly: 3.02, anchor: "start" }
  ],
  labels: {
    terminal: "ТЕРМИНАЛЬНЫЕ СОСТОЯНИЯ",
    footer: "После completed, failed, canceled или rejected продолжение возможно только новой задачей"
  }
});

const origin = Object.freeze({ x: 42, y: 29 });
const scale = Object.freeze({ x: 139, y: 84 });

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svgNS = "http://www.w3.org/2000/svg";
  const root = document.getElementById("drawing");
  const g = scheme.geometry;

  const element = (name, attributes, className, content) => {
    const item = document.createElementNS(svgNS, name);
    for (const [key, value] of Object.entries(attributes)) {
      item.setAttribute(key, value);
    }
    if (className) item.setAttribute("class", className);
    if (content) item.textContent = content;
    return item;
  };

  const drawArrow = edge => {
    const dx = edge.x2 - edge.x1;
    const dy = edge.y2 - edge.y1;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const bx = edge.x2 - ux * g.arrowLength;
    const by = edge.y2 - uy * g.arrowLength;
    const px = -uy * g.arrowHalf;
    const py = ux * g.arrowHalf;
    const points = [
      `${sx(edge.x2)},${sy(edge.y2)}`,
      `${sx(bx + px)},${sy(by + py)}`,
      `${sx(bx - px)},${sy(by - py)}`
    ].join(" ");
    root.appendChild(element("polygon", { points }, `arrow ${edge.kind}`));
  };

  root.appendChild(element("text", {
    x: sx(g.terminalHeadingX),
    y: sy(g.terminalHeadingY),
    "text-anchor": "start"
  }, "section-label", scheme.labels.terminal));

  for (const edge of scheme.edges) {
    root.appendChild(element("line", {
      x1: sx(edge.x1),
      y1: sy(edge.y1),
      x2: sx(edge.x2),
      y2: sy(edge.y2)
    }, `edge ${edge.kind}`));
    drawArrow(edge);
  }

  for (const edge of scheme.edges) {
    root.appendChild(element("text", {
      x: sx(edge.lx),
      y: sy(edge.ly),
      "text-anchor": edge.anchor
    }, "edge-label", edge.label));
  }

  for (const node of scheme.nodes) {
    const left = node.x - node.w * g.half;
    const top = node.y - g.nodeHeight * g.half;

    root.appendChild(element("rect", {
      x: sx(left),
      y: sy(top),
      width: sx(node.w) - sx(0),
      height: sy(g.nodeHeight) - sy(0)
    }, `node ${node.kind}`));

    if (node.kind === "terminal" || node.kind === "success") {
      root.appendChild(element("rect", {
        x: sx(left),
        y: sy(top),
        width: sx(g.capWidth) - sx(0),
        height: sy(g.nodeHeight) - sy(0)
      }, "terminal-cap"));
    }

    root.appendChild(element("text", {
      x: sx(node.x),
      y: sy(node.y + g.titleShift)
    }, "node-title", node.title));

    root.appendChild(element("text", {
      x: sx(node.x),
      y: sy(node.y + g.codeShift)
    }, "node-code", node.code));
  }

  root.appendChild(element("rect", {
    x: sx(g.footerX),
    y: sy(g.footerY),
    width: sx(g.footerWidth) - sx(0),
    height: sy(g.footerHeight) - sy(0)
  }, "footer-band"));

  root.appendChild(element("text", {
    x: sx(g.footerX + g.footerWidth * g.half),
    y: sy(g.footerTextY)
  }, "footer-text", scheme.labels.footer));
} catch (error) {
  const root = document.getElementById("drawing");
  while (root.firstChild) root.removeChild(root.firstChild);
  const fallback = document.createElementNS("http://www.w3.org/2000/svg", "text");
  fallback.setAttribute("x", sx(scheme.geometry.fallbackX));
  fallback.setAttribute("y", sy(scheme.geometry.fallbackY));
  fallback.setAttribute("class", "fallback");
  fallback.textContent = "Схема должна показывать допустимые переходы и четыре неизменяемых конечных состояния.";
  root.appendChild(fallback);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
