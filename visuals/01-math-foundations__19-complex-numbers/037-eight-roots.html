<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <title>Восемь корней из единицы</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --ink: #172033;
      --muted: #667085;
      --axis: #98a2b3;
      --circle: #475467;
      --spoke: #d0d5dd;
      --polygon: #7f56d9;
      --point: #175cd3;
      --cardinal: #b42318;
      --accent: #d92d20;
      --soft: #f2f4f7;
      --border: #d0d5dd;
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      max-width: 800px;
      margin-inline: auto;
    }

    h1 {
      font-size: 24px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 420px;
      background: var(--page);
      border: 1px solid var(--border);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .unit-circle {
      fill: var(--soft);
      stroke: var(--circle);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .spoke {
      stroke: var(--spoke);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .octagon {
      fill: none;
      stroke: var(--polygon);
      stroke-width: 2;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .root-point {
      fill: var(--point);
      stroke: var(--page);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .root-point.cardinal {
      fill: var(--cardinal);
    }

    .origin-point {
      fill: var(--axis);
    }

    .angle-arc,
    .angle-arrow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .angle-arrow {
      fill: var(--accent);
    }

    .root-label {
      fill: var(--ink);
      stroke: var(--page);
      stroke-width: 4;
      paint-order: stroke fill;
      font-size: 15px;
      font-weight: 650;
    }

    .step-label {
      fill: var(--accent);
      stroke: var(--page);
      stroke-width: 4;
      paint-order: stroke fill;
      font-size: 15px;
      font-weight: 700;
    }

    .caption {
      fill: var(--muted);
      stroke: var(--page);
      stroke-width: 4;
      paint-order: stroke fill;
      font-size: 14px;
    }

    #fallback {
      font-size: 16px;
      text-align: center;
      color: var(--ink);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: #f2f4f7;
        --muted: #b9c0cc;
        --axis: #667085;
        --circle: #d0d5dd;
        --spoke: #344054;
        --polygon: #b692f6;
        --point: #84adff;
        --cardinal: #f97066;
        --accent: #fdb022;
        --soft: #1d2939;
        --border: #475467;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Восемь корней из единицы</h1>

    <svg
      id="diagram"
      viewBox="0 0 800 420"
      width="800"
      height="420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Единичная окружность с восемью равномерно расположенными корнями
        из единицы и угловым шагом пи на четыре.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать единичную окружность, восемь равномерных
      корней от k = 0 до k = 7 и одинаковый угловой шаг π/4.
    </p>
  </main>

  <script>
    const data = [
      {
        origin: { x: 400, y: 202 },
        scale: 134,
        zero: 0,
        one: 1,
        two: 2,
        four: 4,
        radius: 1,
        axisExtent: 1.42,
        pointRadius: 0.052,
        originRadius: 0.018,
        arcRadius: 0.54,
        arcLabelRadius: 0.72,
        arcLabelFactor: 0.5,
        arrowLength: 0.075,
        arrowHalfWidth: 0.035,
        caption: { x: 0, y: -1.48 },
        namespace: "http://www.w3.org/2000/svg",
        angleStep: 1,
        angleText: "один шаг: π/4 = 45°",
        captionText:
          "восемь равных направлений — вершины правильного восьмиугольника"
      },
      {
        k: 0,
        angleFactor: 0,
        label: "k = 0 · 0π/4 · 1",
        dx: 18,
        dy: 5,
        anchor: "start",
        cardinal: true
      },
      {
        k: 1,
        angleFactor: 1,
        label: "k = 1 · π/4",
        dx: 18,
        dy: -10,
        anchor: "start",
        cardinal: false
      },
      {
        k: 2,
        angleFactor: 2,
        label: "k = 2 · 2π/4 · i",
        dx: 0,
        dy: -15,
        anchor: "middle",
        cardinal: true
      },
      {
        k: 3,
        angleFactor: 3,
        label: "k = 3 · 3π/4",
        dx: -18,
        dy: -10,
        anchor: "end",
        cardinal: false
      },
      {
        k: 4,
        angleFactor: 4,
        label: "k = 4 · 4π/4 · −1",
        dx: -18,
        dy: 5,
        anchor: "end",
        cardinal: true
      },
      {
        k: 5,
        angleFactor: 5,
        label: "k = 5 · 5π/4",
        dx: -18,
        dy: 21,
        anchor: "end",
        cardinal: false
      },
      {
        k: 6,
        angleFactor: 6,
        label: "k = 6 · 6π/4 · −i",
        dx: 0,
        dy: 25,
        anchor: "middle",
        cardinal: true
      },
      {
        k: 7,
        angleFactor: 7,
        label: "k = 7 · 7π/4",
        dx: 18,
        dy: 21,
        anchor: "start",
        cardinal: false
      }
    ];

    const [config, ...roots] = data;
    const origin = config.origin;
    const scale = config.scale;
    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y - y * scale;

    try {
      const drawing = document.getElementById("drawing");

      const element = (name, className) => {
        const node = document.createElementNS(config.namespace, name);
        if (className) node.setAttribute("class", className);
        return node;
      };

      const line = (x1, y1, x2, y2, className) => {
        const node = element("line", className);
        node.setAttribute("x1", sx(x1));
        node.setAttribute("y1", sy(y1));
        node.setAttribute("x2", sx(x2));
        node.setAttribute("y2", sy(y2));
        return node;
      };

      const circle = (x, y, radius, className) => {
        const node = element("circle", className);
        node.setAttribute("cx", sx(x));
        node.setAttribute("cy", sy(y));
        node.setAttribute(
          "r",
          Math.abs(sx(radius) - sx(config.zero))
        );
        return node;
      };

      const text = (
        x,
        y,
        value,
        className,
        anchor,
        dx,
        dy
      ) => {
        const node = element("text", className);
        node.setAttribute("x", sx(x));
        node.setAttribute("y", sy(y));
        node.setAttribute("text-anchor", anchor);
        node.setAttribute("dx", dx);
        node.setAttribute("dy", dy);
        node.textContent = value;
        return node;
      };

      const positionedRoots = roots.map((root) => {
        const angle =
          root.angleFactor * Math.PI / config.four;

        return {
          ...root,
          x: config.radius * Math.cos(angle),
          y: config.radius * Math.sin(angle)
        };
      });

      drawing.append(
        circle(
          config.zero,
          config.zero,
          config.radius,
          "unit-circle"
        )
      );

      drawing.append(
        line(
          -config.axisExtent,
          config.zero,
          config.axisExtent,
          config.zero,
          "axis"
        ),
        line(
          config.zero,
          -config.axisExtent,
          config.zero,
          config.axisExtent,
          "axis"
        )
      );

      positionedRoots.forEach((root) => {
        drawing.append(
          line(
            config.zero,
            config.zero,
            root.x,
            root.y,
            "spoke"
          )
        );
      });

      const octagonPath = positionedRoots
        .map((root, position) => {
          const command = position === config.zero ? "M" : "L";
          return `${command} ${sx(root.x)} ${sy(root.y)}`;
        })
        .join(" ");

      const octagon = element("path", "octagon");
      octagon.setAttribute("d", `${octagonPath} Z`);
      drawing.append(octagon);

      const arcStartAngle = config.zero;
      const arcEndAngle =
        config.angleStep * Math.PI / config.four;
      const arcStart = {
        x: config.arcRadius * Math.cos(arcStartAngle),
        y: config.arcRadius * Math.sin(arcStartAngle)
      };
      const arcEnd = {
        x: config.arcRadius * Math.cos(arcEndAngle),
        y: config.arcRadius * Math.sin(arcEndAngle)
      };
      const arcPixelRadius = Math.abs(
        sx(config.arcRadius) - sx(config.zero)
      );

      const arc = element("path", "angle-arc");
      arc.setAttribute(
        "d",
        [
          "M",
          sx(arcStart.x),
          sy(arcStart.y),
          "A",
          arcPixelRadius,
          arcPixelRadius,
          config.zero,
          config.zero,
          config.zero,
          sx(arcEnd.x),
          sy(arcEnd.y)
        ].join(" ")
      );
      drawing.append(arc);

      const tangent = {
        x: -Math.sin(arcEndAngle),
        y: Math.cos(arcEndAngle)
      };
      const normal = {
        x: Math.cos(arcEndAngle),
        y: Math.sin(arcEndAngle)
      };
      const arrowBase = {
        x: arcEnd.x - tangent.x * config.arrowLength,
        y: arcEnd.y - tangent.y * config.arrowLength
      };
      const arrowLeft = {
        x:
          arrowBase.x +
          normal.x * config.arrowHalfWidth,
        y:
          arrowBase.y +
          normal.y * config.arrowHalfWidth
      };
      const arrowRight = {
        x:
          arrowBase.x -
          normal.x * config.arrowHalfWidth,
        y:
          arrowBase.y -
          normal.y * config.arrowHalfWidth
      };

      const arrow = element("polygon", "angle-arrow");
      arrow.setAttribute(
        "points",
        [
          `${sx(arcEnd.x)},${sy(arcEnd.y)}`,
          `${sx(arrowLeft.x)},${sy(arrowLeft.y)}`,
          `${sx(arrowRight.x)},${sy(arrowRight.y)}`
        ].join(" ")
      );
      drawing.append(arrow);

      const arcLabelAngle =
        arcEndAngle * config.arcLabelFactor;
      const arcLabel = {
        x:
          config.arcLabelRadius *
          Math.cos(arcLabelAngle),
        y:
          config.arcLabelRadius *
          Math.sin(arcLabelAngle)
      };

      drawing.append(
        text(
          arcLabel.x,
          arcLabel.y,
          config.angleText,
          "step-label",
          "middle",
          config.zero,
          config.zero
        )
      );

      drawing.append(
        circle(
          config.zero,
          config.zero,
          config.originRadius,
          "origin-point"
        )
      );

      positionedRoots.forEach((root) => {
        drawing.append(
          circle(
            root.x,
            root.y,
            config.pointRadius,
            root.cardinal
              ? "root-point cardinal"
              : "root-point"
          )
        );

        drawing.append(
          text(
            root.x,
            root.y,
            root.label,
            "root-label",
            root.anchor,
            root.dx,
            root.dy
          )
        );
      });

      drawing.append(
        text(
          config.caption.x,
          config.caption.y,
          config.captionText,
          "caption",
          "middle",
          config.zero,
          config.zero
        )
      );
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
