<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Комплексная экспонента обходит единичную окружность</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef3f8;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #657087;
      --axis: #aab4c5;
      --orbit: #2563eb;
      --accent: #e85d2a;
      --point-fill: #ffffff;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
    }

    h1 {
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    #status {
      color: var(--muted);
      font-size: 16px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .orbit {
      fill: none;
      stroke: var(--orbit);
      stroke-width: 4;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .route-arrow {
      fill: var(--orbit);
      stroke: var(--panel);
      stroke-width: 1.5;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .point {
      fill: var(--point-fill);
      stroke: var(--accent);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .return-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .center-dot {
      fill: var(--ink);
    }

    text {
      fill: var(--ink);
      user-select: none;
    }

    .formula {
      font-size: 18px;
      font-weight: bold;
    }

    .coordinate {
      fill: var(--muted);
      font-size: 15px;
      font-weight: normal;
    }

    .circle-name {
      fill: var(--muted);
      font-size: 16px;
      font-weight: bold;
    }

    .direction-note {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 6;
      stroke-linejoin: round;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0b1120;
        --panel: #111827;
        --ink: #f1f5f9;
        --muted: #aab6ca;
        --axis: #526077;
        --orbit: #60a5fa;
        --accent: #fb835f;
        --point-fill: #111827;
        --border: #334155;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Комплексная экспонента обходит единичную окружность</h1>

    <p id="status">
      Схема должна показать четыре остановки комплексной экспоненты
      на единичной окружности и обход против часовой стрелки.
    </p>

    <svg
      id="diagram"
      width="840"
      height="420"
      viewBox="0 0 840 420"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Комплексная экспонента на единичной окружности</title>
      <desc id="svg-description">
        Точки один, i, минус один и минус i расположены справа, сверху,
        слева и снизу. Стрелки показывают движение против часовой стрелки.
      </desc>
      <g id="diagram-root"></g>
    </svg>
  </main>

  <script>
    const data = {
      zero: 0,
      unit: 1,
      pointRadius: 0.055,
      returnRadius: 0.09,
      centerRadius: 0.025,

      axes: [
        {
          from: { x: -2.3, y: 0 },
          to: { x: 2.3, y: 0 }
        },
        {
          from: { x: 0, y: -1.25 },
          to: { x: 0, y: 1.25 }
        }
      ],

      points: [
        {
          x: 1,
          y: 0,
          formula: "e^(i·0) = 1",
          coordinate: "(1, 0)",
          label: {
            dx: 18,
            dy: -22,
            line: 22,
            anchor: "start"
          },
          returnPoint: true
        },
        {
          x: 0,
          y: 1,
          formula: "e^(i·π/2) = i",
          coordinate: "(0, 1)",
          label: {
            dx: 18,
            dy: -28,
            line: 22,
            anchor: "start"
          },
          returnPoint: false
        },
        {
          x: -1,
          y: 0,
          formula: "e^(i·π) = −1",
          coordinate: "(−1, 0)",
          label: {
            dx: -18,
            dy: -22,
            line: 22,
            anchor: "end"
          },
          returnPoint: false
        },
        {
          x: 0,
          y: -1,
          formula: "e^(i·3π/2) = −i",
          coordinate: "(0, −1)",
          label: {
            dx: 18,
            dy: 28,
            line: 22,
            anchor: "start"
          },
          returnPoint: false
        }
      ],

      routeArrows: [
        [
          { x: 0.58, y: 0.815 },
          { x: 0.731, y: 0.769 },
          { x: 0.673, y: 0.687 }
        ],
        [
          { x: -0.815, y: 0.58 },
          { x: -0.769, y: 0.731 },
          { x: -0.687, y: 0.673 }
        ],
        [
          { x: -0.58, y: -0.815 },
          { x: -0.731, y: -0.769 },
          { x: -0.673, y: -0.687 }
        ],
        [
          { x: 0.815, y: -0.58 },
          { x: 0.769, y: -0.731 },
          { x: 0.687, y: -0.673 }
        ]
      ],

      circleLabel: {
        from: { x: -0.67, y: 0.74 },
        to: { x: -1.02, y: 1.08 },
        dx: -14,
        dy: -6,
        anchor: "end",
        text: "единичная окружность"
      },

      directionLabel: {
        anchor: { x: 0, y: -0.22 },
        line: 20,
        first: "θ растёт",
        second: "против часовой стрелки"
      }
    };

    const origin = { x: 420, y: 210 };
    const scale = 130;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const root = document.getElementById("diagram-root");
      const status = document.getElementById("status");

      function makeElement(name, attributes, content) {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([attribute, value]) => {
          element.setAttribute(attribute, String(value));
        });

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      }

      function makeLine(segment, className) {
        return makeElement("line", {
          x1: sx(segment.from.x),
          y1: sy(segment.from.y),
          x2: sx(segment.to.x),
          y2: sy(segment.to.y),
          class: className
        });
      }

      const geometryLayer = makeElement("g", {
        "aria-hidden": "true"
      });

      data.axes.forEach(axis => {
        geometryLayer.appendChild(makeLine(axis, "axis"));
      });

      const orbitRadius = sx(data.unit) - sx(data.zero);

      geometryLayer.appendChild(
        makeElement("circle", {
          cx: sx(data.zero),
          cy: sy(data.zero),
          r: orbitRadius,
          class: "orbit"
        })
      );

      data.routeArrows.forEach(triangle => {
        const vertices = triangle
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        geometryLayer.appendChild(
          makeElement("polygon", {
            points: vertices,
            class: "route-arrow"
          })
        );
      });

      geometryLayer.appendChild(
        makeLine(
          {
            from: data.circleLabel.from,
            to: data.circleLabel.to
          },
          "leader"
        )
      );

      geometryLayer.appendChild(
        makeElement("circle", {
          cx: sx(data.zero),
          cy: sy(data.zero),
          r: sx(data.centerRadius) - sx(data.zero),
          class: "center-dot"
        })
      );

      root.appendChild(geometryLayer);

      const pointLayer = makeElement("g", {
        "aria-label": "Четыре остановки на окружности"
      });

      data.points.forEach(point => {
        if (point.returnPoint) {
          pointLayer.appendChild(
            makeElement("circle", {
              cx: sx(point.x),
              cy: sy(point.y),
              r: sx(data.returnRadius) - sx(data.zero),
              class: "return-ring"
            })
          );
        }

        pointLayer.appendChild(
          makeElement("circle", {
            cx: sx(point.x),
            cy: sy(point.y),
            r: sx(data.pointRadius) - sx(data.zero),
            class: "point"
          })
        );
      });

      root.appendChild(pointLayer);

      const labelLayer = makeElement("g", {
        "aria-label": "Подписи точек"
      });

      data.points.forEach(point => {
        const label = makeElement("text", {
          x: sx(point.x),
          y: sy(point.y),
          dx: point.label.dx,
          dy: point.label.dy,
          "text-anchor": point.label.anchor,
          class: "formula"
        });

        label.appendChild(
          makeElement("tspan", {}, point.formula)
        );

        label.appendChild(
          makeElement(
            "tspan",
            {
              x: sx(point.x),
              dx: point.label.dx,
              dy: point.label.line,
              class: "coordinate"
            },
            point.coordinate
          )
        );

        labelLayer.appendChild(label);
      });

      labelLayer.appendChild(
        makeElement(
          "text",
          {
            x: sx(data.circleLabel.to.x),
            y: sy(data.circleLabel.to.y),
            dx: data.circleLabel.dx,
            dy: data.circleLabel.dy,
            "text-anchor": data.circleLabel.anchor,
            class: "circle-name"
          },
          data.circleLabel.text
        )
      );

      const direction = makeElement("text", {
        x: sx(data.directionLabel.anchor.x),
        y: sy(data.directionLabel.anchor.y),
        "text-anchor": "middle",
        class: "direction-note"
      });

      direction.appendChild(
        makeElement("tspan", {}, data.directionLabel.first)
      );

      direction.appendChild(
        makeElement(
          "tspan",
          {
            x: sx(data.directionLabel.anchor.x),
            dy: data.directionLabel.line
          },
          data.directionLabel.second
        )
      );

      labelLayer.appendChild(direction);
      root.appendChild(labelLayer);
      status.hidden = true;
    } catch (error) {
      const root = document.getElementById("diagram-root");
      const status = document.getElementById("status");

      if (root) {
        root.replaceChildren();
      }

      if (status) {
        status.hidden = false;
        status.textContent =
          "Схема должна показать единичную окружность с точками 1, i, −1 и −i, соединёнными направлением обхода против часовой стрелки.";
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
