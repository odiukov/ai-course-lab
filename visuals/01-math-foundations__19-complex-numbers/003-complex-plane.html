<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Число 3 + 2i как точка и вектор</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --surface: white;
      --ink: midnightblue;
      --muted: slategray;
      --axis: midnightblue;
      --guide: lightsteelblue;
      --vector: royalblue;
      --point: darkorange;
      --point-ring: moccasin;
      --border: gainsboro;
      --error: firebrick;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
    }

    body {
      width: 100%;
    }

    figure {
      margin: auto;
      max-width: 720px;
      background: var(--surface);
    }

    h1 {
      margin: unset;
      padding: 14px 18px;
      font-size: 22px;
      font-weight: 700;
      line-height: normal;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: unset;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      overflow: visible;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .tick {
      fill: none;
      stroke: var(--axis);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-dasharray: 7px 7px;
      vector-effect: non-scaling-stroke;
    }

    .component {
      fill: none;
      stroke: var(--muted);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .vector {
      fill: none;
      stroke: var(--vector);
      stroke-width: 5px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .axis-head {
      fill: var(--axis);
      stroke: var(--axis);
      stroke-width: 1px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .vector-head {
      fill: var(--vector);
      stroke: var(--vector);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .origin-ring {
      fill: var(--surface);
      stroke: var(--axis);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .target-ring {
      fill: var(--point-ring);
      stroke: var(--surface);
      stroke-width: 4px;
      vector-effect: non-scaling-stroke;
    }

    .target-core {
      fill: var(--point);
      stroke: var(--surface);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    text {
      font-family: inherit;
      dominant-baseline: alphabetic;
      pointer-events: none;
    }

    .axis-label {
      fill: var(--axis);
      font-size: 17px;
      font-weight: 650;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 600;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .component-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 650;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .vector-label {
      fill: var(--vector);
      font-size: 18px;
      font-weight: 750;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .point-label {
      fill: var(--point);
      font-size: 19px;
      font-weight: 800;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 7px;
      stroke-linejoin: round;
    }

    .coordinate-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 650;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .fallback {
      margin: unset;
      padding: 18px;
      color: var(--error);
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 17px;
    }

    [hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --surface: midnightblue;
        --ink: aliceblue;
        --muted: lightsteelblue;
        --axis: aliceblue;
        --guide: slategray;
        --vector: deepskyblue;
        --point: gold;
        --point-ring: darkgoldenrod;
        --border: slategray;
        --error: lightsalmon;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h1 id="diagram-title">Число 3 + 2i как точка и вектор</h1>

    <svg
      id="plane"
      viewBox="0 0 720 400"
      width="720"
      height="400"
      role="img"
      aria-labelledby="svg-title svg-description"
      preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">Комплексное число 3 + 2i на комплексной плоскости</title>
      <desc id="svg-description">
        Вещественная горизонтальная и мнимая вертикальная оси.
        Стрелка идёт из начала координат в точку с координатами 3, 2.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна показать комплексную плоскость, точку 3 + 2i в координатах
      (3, 2) и вектор из начала координат (0, 0) к этой точке.
    </p>

    <noscript>
      <p class="fallback">
        Схема показывает комплексную плоскость, точку 3 + 2i в координатах
        (3, 2) и стрелку из (0, 0) в (3, 2). Для отрисовки требуется JavaScript.
      </p>
    </noscript>
  </figure>

  <script>
    const data = Object.freeze({
      origin: Object.freeze({ x: 150, y: 292 }),
      scale: 68,
      zero: 0,
      bounds: Object.freeze({
        xMin: -1.45,
        xMax: 7.55,
        yMin: -0.82,
        yMax: 3.72
      }),
      start: Object.freeze({ x: 0, y: 0 }),
      target: Object.freeze({ x: 3, y: 2 }),
      horizontalEnd: Object.freeze({ x: 3, y: 0 }),
      verticalStart: Object.freeze({ x: 3, y: 0 }),
      vectorLabelAnchor: Object.freeze({ x: 1.35, y: 0.9 }),
      horizontalLabelAnchor: Object.freeze({ x: 1.5, y: -0.34 }),
      verticalLabelAnchor: Object.freeze({ x: 3, y: 0.92 }),
      tickHalf: 0.09,
      originRadius: 0.07,
      pointRingRadius: 0.18,
      pointCoreRadius: 0.09,
      arrowHead: Object.freeze({ length: 0.34, width: 0.18 }),
      axisHead: Object.freeze({ length: 0.21, width: 0.11 }),
      xTicks: Object.freeze([
        Object.freeze({ value: 3, label: "3", dx: 0, dy: 27, anchor: "middle" })
      ]),
      yTicks: Object.freeze([
        Object.freeze({ value: 2, label: "2", dx: -17, dy: 6, anchor: "end" })
      ]),
      labels: Object.freeze([
        Object.freeze({
          text: "0",
          point: Object.freeze({ x: 0, y: 0 }),
          dx: -13,
          dy: 27,
          anchor: "end",
          className: "tick-label"
        }),
        Object.freeze({
          text: "вещественная ось",
          point: Object.freeze({ x: 7.55, y: 0 }),
          dx: -16,
          dy: -15,
          anchor: "end",
          className: "axis-label"
        }),
        Object.freeze({
          text: "мнимая ось",
          point: Object.freeze({ x: 0, y: 3.72 }),
          dx: 17,
          dy: 22,
          anchor: "start",
          className: "axis-label"
        }),
        Object.freeze({
          text: "3 вправо",
          point: Object.freeze({ x: 1.5, y: -0.34 }),
          dx: 0,
          dy: 18,
          anchor: "middle",
          className: "component-label"
        }),
        Object.freeze({
          text: "2 вверх",
          point: Object.freeze({ x: 3, y: 0.92 }),
          dx: 23,
          dy: 6,
          anchor: "start",
          className: "component-label"
        }),
        Object.freeze({
          text: "вектор: 3 + 2i",
          point: Object.freeze({ x: 1.35, y: 0.9 }),
          dx: -8,
          dy: 34,
          anchor: "middle",
          className: "vector-label"
        }),
        Object.freeze({
          text: "точка: 3 + 2i",
          point: Object.freeze({ x: 3, y: 2 }),
          dx: 24,
          dy: -24,
          anchor: "start",
          className: "point-label"
        }),
        Object.freeze({
          text: "координаты (3, 2)",
          point: Object.freeze({ x: 3, y: 2 }),
          dx: 24,
          dy: 4,
          anchor: "start",
          className: "coordinate-label"
        })
      ])
    });

    const origin = Object.freeze(data.origin);
    const scale = data.scale;

    function sx(x) {
      return origin.x + x * scale;
    }

    function sy(y) {
      return origin.y - y * scale;
    }

    try {
      const svg = document.getElementById("plane");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      function element(name, attributes, content) {
        const item = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          if (typeof value === "number" && !Number.isFinite(value)) {
            throw new Error("Некорректная координата");
          }
          item.setAttribute(key, String(value));
        });

        if (content !== undefined) {
          item.textContent = content;
        }

        return item;
      }

      function group(className) {
        return element("g", { class: className });
      }

      function line(from, to, className) {
        return element("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        });
      }

      function circle(point, radius, className) {
        return element("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: Math.abs(sx(radius) - sx(data.zero)),
          class: className
        });
      }

      function polygon(points, className) {
        const coordinates = points
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        return element("polygon", {
          points: coordinates,
          class: className
        });
      }

      function arrowHead(tail, tip, size, className) {
        const deltaX = tip.x - tail.x;
        const deltaY = tip.y - tail.y;
        const distance = Math.hypot(deltaX, deltaY);

        if (!distance) {
          throw new Error("Стрелке требуется направление");
        }

        const unitX = deltaX / distance;
        const unitY = deltaY / distance;
        const baseX = tip.x - unitX * size.length;
        const baseY = tip.y - unitY * size.length;
        const normalX = -unitY * size.width;
        const normalY = unitX * size.width;

        return polygon([
          tip,
          { x: baseX + normalX, y: baseY + normalY },
          { x: baseX - normalX, y: baseY - normalY }
        ], className);
      }

      function label(item) {
        return element("text", {
          x: sx(item.point.x) + item.dx,
          y: sy(item.point.y) + item.dy,
          "text-anchor": item.anchor,
          class: item.className
        }, item.text);
      }

      const axes = group("axes");
      const guides = group("guides");
      const vector = group("vector-layer");
      const markers = group("markers");
      const labels = group("labels");

      const horizontalAxisStart = {
        x: data.bounds.xMin,
        y: data.zero
      };
      const horizontalAxisTip = {
        x: data.bounds.xMax,
        y: data.zero
      };
      const horizontalAxisTail = {
        x: data.bounds.xMax - data.axisHead.length,
        y: data.zero
      };
      const verticalAxisStart = {
        x: data.zero,
        y: data.bounds.yMin
      };
      const verticalAxisTip = {
        x: data.zero,
        y: data.bounds.yMax
      };
      const verticalAxisTail = {
        x: data.zero,
        y: data.bounds.yMax - data.axisHead.length
      };

      axes.append(
        line(horizontalAxisStart, horizontalAxisTip, "axis"),
        line(verticalAxisStart, verticalAxisTip, "axis"),
        arrowHead(
          horizontalAxisTail,
          horizontalAxisTip,
          data.axisHead,
          "axis-head"
        ),
        arrowHead(
          verticalAxisTail,
          verticalAxisTip,
          data.axisHead,
          "axis-head"
        )
      );

      data.xTicks.forEach((tick) => {
        axes.append(
          line(
            { x: tick.value, y: -data.tickHalf },
            { x: tick.value, y: data.tickHalf },
            "tick"
          )
        );

        labels.append(
          label({
            text: tick.label,
            point: { x: tick.value, y: data.zero },
            dx: tick.dx,
            dy: tick.dy,
            anchor: tick.anchor,
            className: "tick-label"
          })
        );
      });

      data.yTicks.forEach((tick) => {
        axes.append(
          line(
            { x: -data.tickHalf, y: tick.value },
            { x: data.tickHalf, y: tick.value },
            "tick"
          )
        );

        labels.append(
          label({
            text: tick.label,
            point: { x: data.zero, y: tick.value },
            dx: tick.dx,
            dy: tick.dy,
            anchor: tick.anchor,
            className: "tick-label"
          })
        );
      });

      guides.append(
        line(data.horizontalEnd, data.target, "guide"),
        line(
          { x: data.zero, y: data.target.y },
          data.target,
          "guide"
        ),
        line(
          {
            x: data.start.x,
            y: data.horizontalLabelAnchor.y
          },
          {
            x: data.horizontalEnd.x,
            y: data.horizontalLabelAnchor.y
          },
          "component"
        )
      );

      vector.append(
        line(data.start, data.target, "vector"),
        arrowHead(
          data.start,
          data.target,
          data.arrowHead,
          "vector-head"
        )
      );

      markers.append(
        circle(data.start, data.originRadius, "origin-ring"),
        circle(data.target, data.pointRingRadius, "target-ring"),
        circle(data.target, data.pointCoreRadius, "target-core")
      );

      data.labels.forEach((item) => {
        labels.append(label(item));
      });

      svg.append(axes, guides, vector, markers, labels);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("plane");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
