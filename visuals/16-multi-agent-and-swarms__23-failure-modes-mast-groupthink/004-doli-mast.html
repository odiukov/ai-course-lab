<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Распределение отказов между категориями MAST</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5d687b;
      --border: #d8deea;
      --spec: #536dfe;
      --coord: #e58a2b;
      --verify: #25a17a;
      --sum-bg: #eef2ff;
      --sum-border: #aebcff;
      --separator: #ffffff;
      --shadow: #c8d0df;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #18202d;
        --ink: #f1f4fa;
        --muted: #b8c1d1;
        --border: #354054;
        --spec: #8193ff;
        --coord: #f0a451;
        --verify: #48c69d;
        --sum-bg: #222d4b;
        --sum-border: #7388e8;
        --separator: #18202d;
        --shadow: #0b0f17;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 16px;
    }

    .diagram {
      width: 100%;
      max-width: 960px;
      margin-inline: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 4px 18px var(--shadow);
    }

    .diagram-header {
      padding: 18px 22px 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: normal;
      letter-spacing: normal;
    }

    .subtitle {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .sector {
      stroke: var(--separator);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .sector-value {
      fill: #ffffff;
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
      paint-order: stroke;
      stroke: #172033;
      stroke-width: 2px;
      stroke-linejoin: round;
    }

    .guide {
      fill: none;
      stroke: var(--border);
      stroke-width: 1px;
    }

    .legend-title {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .legend-name {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .legend-value {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-anchor: end;
    }

    .legend-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .legend-rule {
      stroke: var(--border);
      stroke-width: 1px;
    }

    .sum-card {
      fill: var(--sum-bg);
      stroke: var(--sum-border);
      stroke-width: 2px;
    }

    .sum-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: bold;
    }

    .sum-value {
      fill: var(--ink);
      font-size: 25px;
      font-weight: bold;
      text-anchor: end;
    }

    .sum-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      margin: 16px 22px 22px;
      padding: 16px;
      color: var(--ink);
      background: var(--sum-bg);
      border: 1px solid var(--sum-border);
      border-radius: 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <main class="diagram">
    <header class="diagram-header">
      <h1>Как распределяются отказы между категориями MAST</h1>
      <p class="subtitle">Доля каждой категории среди всех неудачных запусков</p>
    </header>

    <svg
      id="chart"
      viewBox="0 0 960 390"
      width="960"
      height="390"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Распределение отказов между тремя категориями MAST</title>
      <desc id="svg-desc">
        Проблемы постановки — 41,77 процента, сбои координации — 36,94 процента,
        пробелы в проверке — 21,30 процента. Сумма равна 100,01 процента из-за округления.
      </desc>
    </svg>
  </main>

  <script>
    const data = Object.freeze([
      Object.freeze({
        name: "Проблемы постановки",
        sourceName: "Specification Problems",
        value: 41.77,
        display: "41,77%",
        color: "var(--spec)"
      }),
      Object.freeze({
        name: "Сбои координации",
        sourceName: "Coordination Failures",
        value: 36.94,
        display: "36,94%",
        color: "var(--coord)"
      }),
      Object.freeze({
        name: "Пробелы в проверке",
        sourceName: "Verification Gaps",
        value: 21.30,
        display: "21,30%",
        color: "var(--verify)"
      })
    ]);

    const canvas = Object.freeze({ width: 960, height: 390 });
    const origin = Object.freeze({ x: 480, y: 195 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const layout = Object.freeze({
      zero: 0,
      one: 1,
      half: 0.5,
      fullTurn: 2,
      pie: Object.freeze({
        centerX: -245,
        centerY: -5,
        radius: 146,
        labelRadius: 88
      }),
      legend: Object.freeze({
        left: 12,
        right: 410,
        titleY: -137,
        firstY: -83,
        rowGap: 73,
        swatchX: 12,
        swatchWidth: 18,
        nameX: 44,
        valueX: 405,
        sourceY: 24,
        ruleY: 40
      }),
      sum: Object.freeze({
        x: 12,
        y: 78,
        width: 398,
        height: 91,
        radius: 11,
        labelX: 34,
        labelY: 110,
        valueX: 388,
        valueY: 111,
        noteX: 34,
        noteY: 142
      }),
      guide: Object.freeze({
        radiusExtra: 8
      }),
      percentage: Object.freeze({
        total: 100.01,
        display: "100,01%"
      })
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    (() => {
      const svg = document.getElementById("chart");
      const namespace = "http://www.w3.org/2000/svg";

      const node = (tag, attributes, text) => {
        const element = document.createElementNS(namespace, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });

        if (text !== undefined) {
          element.textContent = text;
        }

        return element;
      };

      const logicalPoint = (centerX, centerY, radius, angle) => ({
        x: centerX + radius * Math.cos(angle),
        y: centerY + radius * Math.sin(angle)
      });

      const pointText = point => `${sx(point.x)} ${sy(point.y)}`;

      const sectorPath = (center, radius, startAngle, endAngle) => {
        const start = logicalPoint(center.x, center.y, radius, startAngle);
        const end = logicalPoint(center.x, center.y, radius, endAngle);
        const arcRadiusX = sx(radius) - sx(layout.zero);
        const arcRadiusY = sy(radius) - sy(layout.zero);
        const largeArc = endAngle - startAngle > Math.PI
          ? layout.one
          : layout.zero;

        return [
          "M", sx(center.x), sy(center.y),
          "L", pointText(start),
          "A", arcRadiusX, arcRadiusY,
          layout.zero, largeArc, layout.one,
          pointText(end),
          "Z"
        ].join(" ");
      };

      try {
        const center = {
          x: layout.pie.centerX,
          y: layout.pie.centerY
        };
        const sum = data.reduce(
          (result, item) => result + item.value,
          layout.zero
        );
        const startAngle = -Math.PI / layout.fullTurn;
        let cursor = startAngle;

        const guideRadius =
          layout.pie.radius + layout.guide.radiusExtra;

        svg.appendChild(node("circle", {
          class: "guide",
          cx: sx(center.x),
          cy: sy(center.y),
          r: sx(guideRadius) - sx(layout.zero)
        }));

        data.forEach(item => {
          const angle =
            Math.PI * layout.fullTurn * item.value / sum;
          const endAngle = cursor + angle;
          const middleAngle = cursor + angle * layout.half;
          const labelPoint = logicalPoint(
            center.x,
            center.y,
            layout.pie.labelRadius,
            middleAngle
          );

          svg.appendChild(node("path", {
            class: "sector",
            d: sectorPath(
              center,
              layout.pie.radius,
              cursor,
              endAngle
            ),
            fill: item.color
          }));

          svg.appendChild(node("text", {
            class: "sector-value",
            x: sx(labelPoint.x),
            y: sy(labelPoint.y)
          }, item.display));

          cursor = endAngle;
        });

        svg.appendChild(node("text", {
          class: "legend-title",
          x: sx(layout.legend.left),
          y: sy(layout.legend.titleY)
        }, "Категории отказов"));

        data.forEach((item, index) => {
          const rowY =
            layout.legend.firstY +
            layout.legend.rowGap * index;

          svg.appendChild(node("rect", {
            x: sx(layout.legend.swatchX),
            y: sy(rowY),
            width:
              sx(layout.legend.swatchWidth) -
              sx(layout.zero),
            height:
              sy(layout.legend.swatchWidth) -
              sy(layout.zero),
            rx:
              sx(layout.legend.swatchWidth * layout.half) -
              sx(layout.zero),
            fill: item.color
          }));

          svg.appendChild(node("text", {
            class: "legend-name",
            x: sx(layout.legend.nameX),
            y: sy(rowY)
          }, item.name));

          svg.appendChild(node("text", {
            class: "legend-value",
            x: sx(layout.legend.valueX),
            y: sy(rowY)
          }, item.display));

          svg.appendChild(node("text", {
            class: "legend-note",
            x: sx(layout.legend.nameX),
            y: sy(rowY + layout.legend.sourceY)
          }, item.sourceName));

          if (index < data.length - layout.one) {
            svg.appendChild(node("line", {
              class: "legend-rule",
              x1: sx(layout.legend.left),
              y1: sy(rowY + layout.legend.ruleY),
              x2: sx(layout.legend.right),
              y2: sy(rowY + layout.legend.ruleY)
            }));
          }
        });

        svg.appendChild(node("rect", {
          class: "sum-card",
          x: sx(layout.sum.x),
          y: sy(layout.sum.y),
          width: sx(layout.sum.width) - sx(layout.zero),
          height: sy(layout.sum.height) - sy(layout.zero),
          rx: sx(layout.sum.radius) - sx(layout.zero)
        }));

        svg.appendChild(node("text", {
          class: "sum-label",
          x: sx(layout.sum.labelX),
          y: sy(layout.sum.labelY)
        }, "Сумма подписей"));

        svg.appendChild(node("text", {
          class: "sum-value",
          x: sx(layout.sum.valueX),
          y: sy(layout.sum.valueY)
        }, layout.percentage.display));

        svg.appendChild(node("text", {
          class: "sum-note",
          x: sx(layout.sum.noteX),
          y: sy(layout.sum.noteY)
        }, "Лишняя 0,01% появилась только из-за округления"));
      } catch (error) {
        svg.remove();
        const fallback = document.createElement("p");
        fallback.className = "fallback";
        fallback.textContent =
          "Схема должна была показать три категории: проблемы постановки — " +
          data[layout.zero].display +
          ", сбои координации — " +
          data[layout.one].display +
          ", пробелы в проверке — " +
          data[data.length - layout.one].display +
          ". Сумма подписей — " +
          layout.percentage.display +
          " из-за округления.";
        document.querySelector(".diagram").appendChild(fallback);
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
