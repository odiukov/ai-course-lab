<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Турнир Hyperband: от 81 конфигурации до одной</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #64708a;
      --line: #7685a5;
      --soft-line: #d6ddea;
      --accent: #5269d8;
      --accent-deep: #344bb7;
      --accent-soft: #e9edff;
      --funnel: #eef1ff;
      --badge: #f4f6fb;
      --winner: #df951f;
      --winner-deep: #a85f00;
      --winner-soft: #fff1d2;
      --shadow: #c7d0e4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111522;
        --panel: #171d2d;
        --text: #edf1fb;
        --muted: #a7b2ca;
        --line: #8493b5;
        --soft-line: #39435b;
        --accent: #91a2ff;
        --accent-deep: #c1caff;
        --accent-soft: #27315c;
        --funnel: #20294d;
        --badge: #202738;
        --winner: #ffc35b;
        --winner-deep: #ffe0a0;
        --winner-soft: #493716;
        --shadow: #0d101a;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--soft-line);
    }

    .figure-header {
      background: var(--panel);
      border-bottom: 1px solid var(--soft-line);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 22px;
      font-weight: bold;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    #plot {
      width: 100%;
      background: var(--panel);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
    }

    .funnel {
      fill: var(--funnel);
      stroke: var(--soft-line);
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-line {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      fill: var(--line);
    }

    .stage {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .stage-winner {
      fill: var(--winner-soft);
      stroke: var(--winner);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .count {
      fill: var(--accent-deep);
      font-size: 32px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .count-winner {
      fill: var(--winner-deep);
    }

    .count-label {
      fill: var(--text);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
      text-anchor: middle;
    }

    .budget-caption {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      text-anchor: middle;
    }

    .budget-value {
      fill: var(--text);
      font-size: 20px;
      font-weight: bold;
      text-anchor: middle;
    }

    .load-badge {
      fill: var(--badge);
      stroke: var(--soft-line);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .load-badge-winner {
      fill: var(--winner-soft);
      stroke: var(--winner);
    }

    .load-caption {
      fill: var(--muted);
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      text-anchor: middle;
    }

    .formula {
      fill: var(--text);
      font-size: 13px;
      font-weight: bold;
      text-anchor: middle;
    }

    .equal-rule {
      stroke: var(--soft-line);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .equal-dot {
      fill: var(--accent);
    }

    .equal-dot-winner {
      fill: var(--winner);
    }

    .footer-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
      text-anchor: middle;
    }

    .fallback {
      color: var(--text);
      background: var(--panel);
      border-top: 1px solid var(--soft-line);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="figure">
    <header class="figure-header">
      <h1 id="diagram-title">Турнир Hyperband: 81 → 27 → 9 → 3 → 1</h1>
      <p class="subtitle">Участников втрое меньше · бюджет каждому втрое больше</p>
    </header>

    <div id="plot">
      <svg
        id="diagram"
        viewBox="0 0 1100 360"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="diagram-title diagram-description">
        <desc id="diagram-description">
          Воронка Hyperband из пяти раундов. Число конфигураций уменьшается
          от 81 до одной, бюджет растёт от одной до 81 эпохи, а нагрузка
          каждого раунда остаётся равной 81 вычисленной эпохе.
        </desc>
      </svg>
      <noscript>
        <p class="fallback">
          Схема должна показать воронку 81 → 27 → 9 → 3 → 1,
          бюджеты 1 → 3 → 9 → 27 → 81 эпох и одинаковую нагрузку:
          81 вычисленная эпоха на каждом раунде.
        </p>
      </noscript>
    </div>
  </main>

  <script>
    const data = [
      ["layout", 2.15, 0.14, 0.08, 0.16, 0.13, 0.38, 0.72, 0.15,
        0.58, 3.52, 4.08, 4.72, 5.18, 6.18, 5.52, 5.91, 6.58, 7.08],
      ["stage", 0.58, 81, 1, "конфигураций", "эпоха",
        0.47, 1.12, "81 × 1 = 81 эпоха", "regular"],
      ["stage", 2.46, 27, 3, "конфигураций", "эпохи",
        0.41, 0.98, "27 × 3 = 81 эпоха", "regular"],
      ["stage", 4.34, 9, 9, "конфигураций", "эпох",
        0.35, 0.84, "9 × 9 = 81 эпоха", "regular"],
      ["stage", 6.22, 3, 27, "конфигурации", "эпох",
        0.30, 0.71, "3 × 27 = 81 эпоха", "regular"],
      ["stage", 8.10, 1, 81, "конфигурация", "эпоха",
        0.25, 0.58, "1 × 81 = 81 эпоха", "winner"]
    ];

    const origin = Object.freeze({ x: 55, y: 8 });
    const scale = Object.freeze({ x: 112, y: 46 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    (() => {
      "use strict";

      const svg = document.getElementById("diagram");
      const plot = document.getElementById("plot");
      const namespace = "http://www.w3.org/2000/svg";

      try {
        const [layout, ...stages] = data;
        const [
          layoutTag,
          centerY,
          funnelPad,
          arrowGap,
          headLength,
          headHalfHeight,
          labelRatio,
          badgeHalfWidth,
          badgeRadius,
          arrowTopLabelY,
          arrowBottomLabelY,
          budgetCaptionY,
          budgetValueY,
          badgeTopY,
          badgeBottomY,
          loadCaptionY,
          formulaY,
          equalRuleY,
          footerY
        ] = layout;

        if (layoutTag !== "layout" || stages.length === Number.NaN) {
          throw new Error("Некорректные данные схемы");
        }

        const create = (name, attributes, className, content) => {
          const element = document.createElementNS(namespace, name);

          for (const [key, value] of Object.entries(attributes)) {
            element.setAttribute(key, String(value));
          }

          if (className) {
            element.setAttribute("class", className);
          }

          if (content !== undefined) {
            element.textContent = content;
          }

          return element;
        };

        const appendText = (parent, x, y, className, content, anchor) => {
          parent.appendChild(create("text", {
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor
          }, className, content));
        };

        const funnelPoints = [];
        for (const stage of stages) {
          const [, x, , , , , , radiusY] = stage;
          funnelPoints.push(
            `${sx(x)},${sy(centerY - radiusY - funnelPad)}`
          );
        }

        for (const stage of [...stages].reverse()) {
          const [, x, , , , , , radiusY] = stage;
          funnelPoints.push(
            `${sx(x)},${sy(centerY + radiusY + funnelPad)}`
          );
        }

        svg.appendChild(create("polygon", {
          points: funnelPoints.join(" ")
        }, "funnel"));

        let previousStage;

        for (const stage of stages) {
          if (previousStage) {
            const [, previousX, , , , , previousRadiusX] = previousStage;
            const [, currentX, , , , , currentRadiusX] = stage;
            const startX = previousX + previousRadiusX + arrowGap;
            const tipX = currentX - currentRadiusX - arrowGap;
            const shaftEndX = tipX - headLength;
            const labelX = startX + (tipX - startX) * labelRatio;

            svg.appendChild(create("line", {
              x1: sx(startX),
              y1: sy(centerY),
              x2: sx(shaftEndX),
              y2: sy(centerY)
            }, "arrow-line"));

            svg.appendChild(create("polygon", {
              points: [
                `${sx(tipX)},${sy(centerY)}`,
                `${sx(shaftEndX)},${sy(centerY - headHalfHeight)}`,
                `${sx(shaftEndX)},${sy(centerY + headHalfHeight)}`
              ].join(" ")
            }, "arrow-head"));

            appendText(
              svg,
              labelX,
              arrowTopLabelY,
              "arrow-label",
              "лучшая треть",
              "middle"
            );

            appendText(
              svg,
              labelX,
              arrowBottomLabelY,
              "arrow-label",
              "бюджет ×3",
              "middle"
            );
          }

          previousStage = stage;
        }

        for (const stage of stages) {
          const [
            stageTag,
            x,
            count,
            budget,
            countWord,
            budgetWord,
            radiusX,
            radiusY,
            formula,
            kind
          ] = stage;

          if (stageTag !== "stage") {
            throw new Error("Некорректный раунд");
          }

          const winner = kind === "winner";
          const stageClass = winner ? "stage-winner" : "stage";
          const countClass = winner ? "count count-winner" : "count";
          const badgeClass = winner
            ? "load-badge load-badge-winner"
            : "load-badge";

          svg.appendChild(create("ellipse", {
            cx: sx(x),
            cy: sy(centerY),
            rx: sx(radiusX) - sx(0),
            ry: sy(radiusY) - sy(0)
          }, stageClass));

          appendText(
            svg,
            x,
            centerY,
            countClass,
            String(count),
            "middle"
          );

          appendText(
            svg,
            x,
            centerY + radiusY + funnelPad,
            "count-label",
            countWord,
            "middle"
          );

          appendText(
            svg,
            x,
            budgetCaptionY,
            "budget-caption",
            "БЮДЖЕТ",
            "middle"
          );

          appendText(
            svg,
            x,
            budgetValueY,
            "budget-value",
            `${budget} ${budgetWord}`,
            "middle"
          );

          svg.appendChild(create("rect", {
            x: sx(x - badgeHalfWidth),
            y: sy(badgeTopY),
            width: sx(x + badgeHalfWidth) - sx(x - badgeHalfWidth),
            height: sy(badgeBottomY) - sy(badgeTopY),
            rx: sx(badgeRadius) - sx(0),
            ry: sy(badgeRadius) - sy(0)
          }, badgeClass));

          appendText(
            svg,
            x,
            loadCaptionY,
            "load-caption",
            "НАГРУЗКА РАУНДА",
            "middle"
          );

          appendText(
            svg,
            x,
            formulaY,
            "formula",
            formula,
            "middle"
          );
        }

        const [firstStage, , , , lastStage] = stages;
        const [, firstX] = firstStage;
        const [, lastX] = lastStage;

        svg.appendChild(create("line", {
          x1: sx(firstX),
          y1: sy(equalRuleY),
          x2: sx(lastX),
          y2: sy(equalRuleY)
        }, "equal-rule"));

        for (const stage of stages) {
          const [, x, , , , , , , , kind] = stage;
          svg.appendChild(create("circle", {
            cx: sx(x),
            cy: sy(equalRuleY),
            r: sx(arrowGap) - sx(0)
          }, kind === "winner" ? "equal-dot equal-dot-winner" : "equal-dot"));
        }

        appendText(
          svg,
          (firstX + lastX) / scale.y,
          footerY,
          "footer-label",
          "Одинаковая нагрузка: 81 эпоха вычислений на каждом раунде",
          "middle"
        );
      } catch (error) {
        svg.remove();
        const fallback = document.createElement("p");
        fallback.className = "fallback";
        fallback.textContent =
          "Схема должна показать воронку 81 → 27 → 9 → 3 → 1, " +
          "бюджеты 1 → 3 → 9 → 27 → 81 эпох и по 81 вычисленной " +
          "эпохе на каждом раунде.";
        plot.appendChild(fallback);
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
