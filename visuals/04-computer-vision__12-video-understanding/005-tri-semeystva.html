<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Три места, где модель может учитывать время</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f8fafc;
    --panel: #ffffff;
    --text: #172033;
    --muted: #5f6b7a;
    --line: #9aa7b7;
    --soft-line: #d7dee8;
    --blue: #2563eb;
    --blue-fill: #dbeafe;
    --amber: #b45309;
    --amber-fill: #fef3c7;
    --green: #15803d;
    --green-fill: #dcfce7;
    --neutral-fill: #eef2f7;
    --output-fill: #f1f5f9;
    --label-pad: 10px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #101620;
      --panel: #18212e;
      --text: #edf3fb;
      --muted: #aeb9c8;
      --line: #718096;
      --soft-line: #344154;
      --blue: #79a8ff;
      --blue-fill: #173463;
      --amber: #f5bd63;
      --amber-fill: #533813;
      --green: #6fda91;
      --green-fill: #173f2a;
      --neutral-fill: #222d3b;
      --output-fill: #222d3b;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .diagram {
    margin: auto;
    padding: var(--label-pad);
    background: var(--page);
  }

  h1 {
    margin: 0 0 var(--label-pad);
    font-size: 22px;
    line-height: 1.2;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--panel);
  }

  .branch-card,
  .source-card,
  .output-card,
  .mini-frame,
  .token,
  .feature {
    vector-effect: non-scaling-stroke;
    stroke-width: 2px;
  }

  .branch-card,
  .source-card {
    fill: var(--panel);
    stroke: var(--soft-line);
  }

  .output-card {
    fill: var(--output-fill);
  }

  .connector,
  .inner-line,
  .attention-link {
    fill: none;
    vector-effect: non-scaling-stroke;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .connector {
    stroke: var(--line);
    stroke-width: 2px;
  }

  .inner-line {
    stroke-width: 2px;
  }

  .attention-link {
    stroke-width: 2px;
    opacity: .75;
  }

  .arrow-head {
    stroke: none;
  }

  text {
    fill: var(--text);
    font-size: 15px;
    dominant-baseline: middle;
  }

  .title {
    font-size: 18px;
    font-weight: 700;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 14px;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .badge-text {
    font-size: 13px;
    font-weight: 700;
  }

  .output-text {
    font-size: 14px;
    font-weight: 700;
  }

  .blue-stroke { stroke: var(--blue); }
  .blue-fill { fill: var(--blue-fill); }
  .blue-solid { fill: var(--blue); }
  .amber-stroke { stroke: var(--amber); }
  .amber-fill { fill: var(--amber-fill); }
  .amber-solid { fill: var(--amber); }
  .green-stroke { stroke: var(--green); }
  .green-fill { fill: var(--green-fill); }
  .green-solid { fill: var(--green); }
  .neutral-fill { fill: var(--neutral-fill); }
  .neutral-stroke { stroke: var(--line); }

  #fallback {
    margin: 0;
    padding: var(--label-pad);
    color: var(--text);
    background: var(--panel);
    font-size: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="diagram">
  <h1>Три места, где модель может учитывать время</h1>
  <svg id="scheme"
       viewBox="0 0 980 450"
       width="980"
       height="450"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svgTitle svgDesc">
    <title id="svgTitle">Три архитектурных способа учитывать время в видео</title>
    <desc id="svgDesc">Один видеоклип из T кадров расходится к независимой обработке кадров с усреднением, трёхмерной свёртке и пространственно-временному вниманию. Каждая ветка выдаёт логиты классов.</desc>
  </svg>
  <p id="fallback" hidden>Один видеоклип из T кадров должен расходиться в три ветки: отдельная 2D CNN для каждого кадра с усреднением по времени, 3D-свёртка по T × H × W и внимание по пространственно-временным токенам. Все три ветки заканчиваются логитами классов.</p>
</main>

<script>
const data = [{
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },
  canvas: { left: 0, top: 0, right: 980, bottom: 450 },
  lineWidth: 2,
  fontSize: 15,
  labelOffset: 10,
  arrowHead: 9,

  source: { x1: 28, y1: 154, x2: 176, y2: 302, rx: 16 },
  split: { x: 218, y: 228, r: 6 },

  cards: [
    {
      key: "blue",
      x1: 278, y1: 38, x2: 744, y2: 148, rx: 16,
      cy: 93,
      title: "2D CNN + усреднение",
      subtitle: "каждый кадр обрабатывается независимо",
      badge: "время встречается в конце",
      badgeBox: { x1: 526, y1: 108, x2: 724, y2: 136, rx: 14 },
      output: { x1: 816, y1: 68, x2: 950, y2: 118, rx: 16 }
    },
    {
      key: "amber",
      x1: 278, y1: 170, x2: 744, y2: 280, rx: 16,
      cy: 225,
      title: "3D-свёртка",
      subtitle: "свёртка по T × H × W",
      badge: "время живёт внутри ядра",
      badgeBox: { x1: 526, y1: 240, x2: 724, y2: 268, rx: 14 },
      output: { x1: 816, y1: 200, x2: 950, y2: 250, rx: 16 }
    },
    {
      key: "green",
      x1: 278, y1: 302, x2: 744, y2: 412, rx: 16,
      cy: 357,
      title: "Пространственно-временное внимание",
      subtitle: "внимание по токенам разных кадров",
      badge: "любой момент видит любой другой",
      badgeBox: { x1: 498, y1: 372, x2: 724, y2: 400, rx: 14 },
      output: { x1: 816, y1: 332, x2: 950, y2: 382, rx: 16 }
    }
  ],

  inputRoutes: [
    [[176, 228], [218, 228], [218, 93], [278, 93]],
    [[176, 228], [278, 228]],
    [[176, 228], [218, 228], [218, 357], [278, 357]]
  ],

  outputRoutes: [
    [[744, 93], [816, 93]],
    [[744, 225], [816, 225]],
    [[744, 357], [816, 357]]
  ],

  frames: [
    { x1: 52, y1: 178, x2: 132, y2: 232, rx: 7, shift: "back" },
    { x1: 60, y1: 187, x2: 140, y2: 241, rx: 7, shift: "middle" },
    { x1: 68, y1: 196, x2: 148, y2: 250, rx: 7, shift: "front" }
  ],

  frameMarks: [
    [[85, 223], [105, 211], [125, 223]],
    [[105, 211], [105, 232]]
  ],

  features: [
    { x1: 302, y1: 70, x2: 334, y2: 94, rx: 5 },
    { x1: 342, y1: 70, x2: 374, y2: 94, rx: 5 },
    { x1: 382, y1: 70, x2: 414, y2: 94, rx: 5 }
  ],

  pool: { cx: 438, cy: 82, r: 17 },
  featureLinks: [
    [[334, 82], [342, 82]],
    [[374, 82], [382, 82]],
    [[414, 82], [421, 82]]
  ],

  kernel: {
    back: { x1: 308, y1: 205, x2: 372, y2: 247, rx: 5 },
    front: { x1: 322, y1: 193, x2: 386, y2: 235, rx: 5 },
    window: { x1: 340, y1: 202, x2: 372, y2: 226, rx: 4 }
  },

  tokens: [
    { cx: 310, cy: 338, r: 7 },
    { cx: 338, cy: 338, r: 7 },
    { cx: 366, cy: 338, r: 7 },
    { cx: 310, cy: 368, r: 7 },
    { cx: 338, cy: 368, r: 7 },
    { cx: 366, cy: 368, r: 7 }
  ],

  attentionLinks: [
    [[310, 338], [366, 368]],
    [[338, 338], [310, 368]],
    [[366, 338], [338, 368]]
  ]
}];

const d = data.values().next().value;
const origin = d.origin;
const scale = d.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("scheme");
  const fallback = document.getElementById("fallback");
  const ns = svg.namespaceURI;

  const make = (tag, attrs = {}, textValue = "") => {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
    if (textValue) node.textContent = textValue;
    return node;
  };

  const add = node => svg.appendChild(node);

  const rect = (box, className) => add(make("rect", {
    x: sx(box.x1),
    y: sy(box.y1),
    width: sx(box.x2) - sx(box.x1),
    height: sy(box.y2) - sy(box.y1),
    rx: sx(box.rx) - sx(0),
    class: className
  }));

  const circle = (item, className) => add(make("circle", {
    cx: sx(item.cx),
    cy: sy(item.cy),
    r: sx(item.r) - sx(0),
    class: className
  }));

  const label = (x, y, value, className, anchor = "start") => add(make("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor
  }, value));

  const polyline = (points, className) => add(make("polyline", {
    points: points.map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
    class: className
  }));

  const arrow = (points, colorClass) => {
    polyline(points, `connector ${colorClass}-stroke`);
    const tip = points.at(-1);
    const head = d.arrowHead;
    add(make("polygon", {
      points: [
        [tip[0], tip[1]],
        [tip[0] - head, tip[1] - head],
        [tip[0] - head, tip[1] + head]
      ].map(point => `${sx(point[0])},${sy(point[1])}`).join(" "),
      class: `arrow-head ${colorClass}-solid`
    }));
  };

  d.inputRoutes.forEach((route, index) => {
    const key = d.cards[index].key;
    arrow(route, key);
  });

  d.outputRoutes.forEach((route, index) => {
    const key = d.cards[index].key;
    arrow(route, key);
  });

  rect(d.source, "source-card");
  label(102, 174, "Видеоклип", "title", "middle");

  d.frames.forEach((frame, index) => {
    const tone = index === d.frames.length - d.scale.x
      ? "mini-frame blue-fill blue-stroke"
      : "mini-frame neutral-fill neutral-stroke";
    rect(frame, tone);
  });

  d.frameMarks.forEach(points => polyline(points, "inner-line blue-stroke"));
  label(108, 270, "T кадров", "title", "middle");
  label(108, 289, "одно действие", "small", "middle");

  circle(d.split, "blue-solid");
  label(218, 214, "один клип — три пути", "small", "middle");

  d.cards.forEach(card => {
    rect(card, `branch-card ${card.key}-stroke`);
    rect(card.badgeBox, `${card.key}-fill ${card.key}-stroke`);
    label(
      (card.badgeBox.x1 + card.badgeBox.x2) / (d.scale.x + d.scale.x),
      card.badgeBox.y1 + d.labelOffset + d.scale.y + d.scale.y + d.scale.y,
      card.badge,
      "badge-text",
      "middle"
    );

    rect(card.output, `output-card ${card.key}-stroke`);
    label(
      (card.output.x1 + card.output.x2) / (d.scale.x + d.scale.x),
      card.cy,
      "Логиты классов",
      "output-text",
      "middle"
    );
  });

  d.features.forEach(feature => rect(feature, "feature blue-fill blue-stroke"));
  d.featureLinks.forEach(points => polyline(points, "inner-line blue-stroke"));
  circle(d.pool, "blue-fill blue-stroke");
  label(d.pool.cx, d.pool.cy, "avg", "badge-text", "middle");
  label(466, 67, d.cards[0].title, "title", "start");
  label(466, 91, d.cards[0].subtitle, "subtitle", "start");

  rect(d.kernel.back, "feature amber-fill amber-stroke");
  rect(d.kernel.front, "feature amber-fill amber-stroke");
  rect(d.kernel.window, "feature amber-solid amber-stroke");
  label(420, 199, d.cards[1].title, "title", "start");
  label(420, 224, d.cards[1].subtitle, "subtitle", "start");

  d.attentionLinks.forEach(points => polyline(points, "attention-link green-stroke"));
  d.tokens.forEach(token => circle(token, "token green-fill green-stroke"));
  label(402, 331, d.cards[2].title, "title", "start");
  label(402, 356, d.cards[2].subtitle, "subtitle", "start");

  fallback.hidden = true;
} catch (error) {
  document.getElementById("scheme").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
