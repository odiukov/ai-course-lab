<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Две матрицы результата LDA</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --text:#172033;
  --muted:#657089;
  --line:#cbd4e3;
  --soft:#edf2f8;
  --doc:#7758d6;
  --doc-fill:#eee9ff;
  --word:#078a82;
  --word-fill:#dcf7f3;
  --link:#df7a24;
  --link-fill:#fff0df;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111722;
    --panel:#182131;
    --text:#eef3fb;
    --muted:#aeb9cc;
    --line:#42506a;
    --soft:#222e42;
    --doc:#b7a3ff;
    --doc-fill:#332c55;
    --word:#62d7cc;
    --word-fill:#173f40;
    --link:#ffb36b;
    --link-fill:#4b3222;
  }
}
*{box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
main{
  max-width:1200px;
  padding:10px 14px;
  margin:auto;
}
h1{
  margin:0;
  padding:4px 0 8px;
  text-align:center;
  font-size:22px;
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:440px;
  background:var(--bg);
}
text{fill:var(--text);font-size:16px}
.title{font-size:21px;font-weight:bold}
.subtitle{font-size:15px;fill:var(--muted)}
.small{font-size:14px}
.tiny{font-size:13px;fill:var(--muted)}
.value{font-size:15px;font-weight:bold}
.sum{font-size:15px;font-weight:bold}
.doc-text{fill:var(--doc)}
.word-text{fill:var(--word)}
.link-text{fill:var(--link);font-weight:bold}
.card{fill:var(--panel);stroke:var(--line)}
.cell{fill:var(--soft);stroke:var(--line)}
.doc-cell{fill:var(--doc-fill);stroke:var(--doc)}
.topic-row{fill:var(--word-fill);stroke:var(--word)}
.word-cell{fill:var(--soft)}
.word-active{fill:var(--word-fill)}
.guide{fill:none;stroke:var(--line)}
.connector{fill:none;stroke:var(--link);stroke-linecap:round;stroke-linejoin:round}
.arrow-head{fill:var(--link)}
.flow-box{fill:var(--panel);stroke:var(--line)}
.flow-mid{fill:var(--link-fill);stroke:var(--link)}
.fallback{font-size:18px;fill:var(--text)}
</style>
</head>
<body>
<main>
<h1>Две матрицы результата LDA</h1>
<svg id="diagram" viewBox="0 0 1200 440" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Матрицы doc_topic и topic_word</title>
  <desc id="svgDesc">Первая матрица связывает документы с пятью темами, вторая — пять тем со словами словаря. Строки обеих матриц суммируются в один.</desc>
</svg>
</main>
<script>
const data=[{
  zero:0,originX:0,originY:0,scale:1,line:2,
  canvas:{cx:600,cy:220},
  left:{x:34,y:22,w:492,h:306,rx:18,titleX:60,titleY:58,subY:84},
  right:{x:674,y:22,w:492,h:306,rx:18,titleX:700,titleY:58,subY:84},
  doc:{
    x:112,y:132,cw:72,rh:50,rx:8,
    headsY:118,heads:["тема 1","тема 2","тема 3","тема 4","тема 5"],
    rows:[
      {y:132,label:"документ",values:["0.60","0.25","0.10","0.03","0.02"],example:true},
      {y:192,label:"…",values:["…","…","…","…","…"],example:false},
      {y:252,label:"100",values:["…","…","…","…","…"],example:false}
    ],
    sumX:490,labelX:98,exampleY:315
  },
  topic:{
    labelX:754,x:770,y:118,rowW:278,rowH:36,gap:8,rx:8,
    rows:[
      {y:118,label:"тема 1",active:false,bars:[34,20,42,15]},
      {y:162,label:"тема 2",active:false,bars:[18,39,24,31]},
      {y:206,label:"тема 3",active:true,bars:[41,29,17,36]},
      {y:250,label:"тема 4",active:false,bars:[23,15,40,28]},
      {y:294,label:"тема 5",active:false,bars:[28,37,19,24]}
    ],
    cellsX:[786,846,906,966],cellW:48,barY:11,barH:14,
    dotsX:1032,sumX:1134
  },
  link:{
    path:[
      {x:526,y:224},{x:570,y:224},{x:630,y:224},{x:674,y:224}
    ],
    head:[{x:674,y:224},{x:658,y:214},{x:658,y:234}],
    labelX:600,labelY:196
  },
  flow:{
    y:360,h:56,rx:15,
    boxes:[
      {x:248,w:190,text:"документ"},
      {x:505,w:190,text:"вес темы"},
      {x:762,w:190,text:"слова этой темы"}
    ],
    arrows:[
      {a:{x:438,y:388},b:{x:505,y:388},head:[{x:505,y:388},{x:491,y:379},{x:491,y:397}]},
      {a:{x:695,y:388},b:{x:762,y:388},head:[{x:762,y:388},{x:748,y:379},{x:748,y:397}]}
    ]
  },
  fallback:{x:600,y:205,subY:238}
}];

const [D]=data;
const origin={x:D.originX,y:D.originY};
const scale=D.scale;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

try{
  const svg=document.getElementById("diagram");
  const NS="http://www.w3.org/2000/svg";
  const Z=D.zero;

  const add=(tag,attrs,text)=>{
    const el=document.createElementNS(NS,tag);
    Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));
    if(text!==undefined) el.textContent=text;
    svg.appendChild(el);
    return el;
  };

  const rect=(x,y,w,h,rx,cls)=>{
    add("rect",{
      x:sx(x),y:sy(y),
      width:sx(w)-sx(Z),height:sy(h)-sy(Z),
      rx:sx(rx)-sx(Z),class:cls,
      "stroke-width":D.line
    });
  };

  const label=(x,y,text,cls,anchor)=>{
    add("text",{x:sx(x),y:sy(y),class:cls,"text-anchor":anchor},text);
  };

  const line=(a,b,cls)=>{
    add("line",{
      x1:sx(a.x),y1:sy(a.y),x2:sx(b.x),y2:sy(b.y),
      class:cls,"stroke-width":D.line
    });
  };

  const polygon=(points,cls)=>{
    add("polygon",{
      points:points.map(p=>`${sx(p.x)},${sy(p.y)}`).join(" "),
      class:cls
    });
  };

  rect(D.left.x,D.left.y,D.left.w,D.left.h,D.left.rx,"card");
  rect(D.right.x,D.right.y,D.right.w,D.right.h,D.right.rx,"card");

  label(D.left.titleX,D.left.titleY,"doc_topic","title doc-text","start");
  label(D.left.titleX,D.left.subY,"100 × 5 = n_docs × 5","subtitle","start");
  label(D.right.titleX,D.right.titleY,"topic_word","title word-text","start");
  label(D.right.titleX,D.right.subY,"5 × 800 = 5 × vocab_size","subtitle","start");

  D.doc.heads.forEach((head,index)=>{
    const x=D.doc.x+D.doc.cw*index+D.doc.cw/D.scale/D.scale;
    const center=x-D.doc.cw/D.scale/D.scale+D.doc.cw/D.line;
    label(center,D.doc.headsY,head,index===D.line?"small link-text":"small","middle");
  });

  D.doc.rows.forEach(row=>{
    label(D.doc.labelX,row.y+D.doc.rh/D.line+D.line,row.label,"small","end");
    row.values.forEach((value,index)=>{
      const cellX=D.doc.x+D.doc.cw*index;
      const cls=index===D.line?"doc-cell":"cell";
      rect(cellX,row.y,D.doc.cw,D.doc.rh,D.doc.rx,cls);
      label(
        cellX+D.doc.cw/D.line,
        row.y+D.doc.rh/D.line+D.line+D.line,
        value,
        row.example?"value":"subtitle",
        "middle"
      );
    });
    label(
      D.doc.sumX,
      row.y+D.doc.rh/D.line+D.line+D.line,
      "Σ = 1",
      row.example?"sum doc-text":"sum",
      "middle"
    );
  });

  label(
    D.left.titleX,D.doc.exampleY,
    "[0.60, 0.25, 0.10, 0.03, 0.02]  →  сумма 1",
    "small doc-text","start"
  );

  D.topic.rows.forEach(row=>{
    label(
      D.topic.labelX,
      row.y+D.topic.rowH/D.line+D.line,
      row.label,
      row.active?"small link-text":"small",
      "end"
    );
    rect(
      D.topic.x,row.y,D.topic.rowW,D.topic.rowH,D.topic.rx,
      row.active?"topic-row":"cell"
    );

    row.bars.forEach((bar,index)=>{
      const bx=D.topic.cellsX[index];
      rect(
        bx,row.y+D.topic.barY,D.topic.cellW,D.topic.barH,D.topic.rx,
        row.active?"word-active":"word-cell"
      );
      rect(
        bx,row.y+D.topic.barY,bar,D.topic.barH,D.topic.rx,
        row.active?"topic-row":"guide"
      );
    });

    label(
      D.topic.dotsX,
      row.y+D.topic.rowH/D.line+D.line,
      "…",
      "value","middle"
    );
    label(
      D.topic.sumX,
      row.y+D.topic.rowH/D.line+D.line,
      "Σ = 1",
      row.active?"sum word-text":"sum",
      "middle"
    );
  });

  const [pStart,pControlA,pControlB,pEnd]=D.link.path;
  add("path",{
    d:`M ${sx(pStart.x)} ${sy(pStart.y)} C ${sx(pControlA.x)} ${sy(pControlA.y)}, ${sx(pControlB.x)} ${sy(pControlB.y)}, ${sx(pEnd.x)} ${sy(pEnd.y)}`,
    class:"connector","stroke-width":D.line
  });
  polygon(D.link.head,"arrow-head");
  label(D.link.labelX,D.link.labelY,"общий индекс: тема 3","small link-text","middle");

  D.flow.boxes.forEach((box,index)=>{
    rect(
      box.x,D.flow.y,box.w,D.flow.h,D.flow.rx,
      index===D.scale?"flow-mid":"flow-box"
    );
    label(
      box.x+box.w/D.line,
      D.flow.y+D.flow.h/D.line+D.line+D.line,
      box.text,
      index===D.scale?"link-text":"",
      "middle"
    );
  });

  D.flow.arrows.forEach(arrow=>{
    line(arrow.a,arrow.b,"connector");
    polygon(arrow.head,"arrow-head");
  });

  label(
    D.canvas.cx,
    D.flow.y-D.flow.h/D.line,
    "сначала выбираем заметную тему документа, затем читаем её распределение слов",
    "tiny","middle"
  );
}catch(error){
  const svg=document.getElementById("diagram");
  while(svg.lastChild) svg.removeChild(svg.lastChild);
  const NS="http://www.w3.org/2000/svg";
  const main=document.createElementNS(NS,"text");
  main.setAttribute("x",sx(D.fallback.x));
  main.setAttribute("y",sy(D.fallback.y));
  main.setAttribute("text-anchor","middle");
  main.setAttribute("class","fallback");
  main.textContent="Схема должна была показать две матрицы результата LDA.";
  svg.appendChild(main);
  const sub=document.createElementNS(NS,"text");
  sub.setAttribute("x",sx(D.fallback.x));
  sub.setAttribute("y",sy(D.fallback.subY));
  sub.setAttribute("text-anchor","middle");
  sub.setAttribute("class","subtitle");
  sub.textContent="doc_topic: документы × 5 тем; topic_word: 5 тем × слова; каждая строка суммируется в 1.";
  svg.appendChild(sub);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
