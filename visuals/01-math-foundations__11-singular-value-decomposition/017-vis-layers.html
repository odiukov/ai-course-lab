<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Портрет по слоям</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1c1a17; --muted:#6b6660; --frame:#c9c2b8;
    --hi:#b4532a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e8e6e2; --muted:#9a948c; --frame:#3c4149;
      --hi:#e08a5c;
    }
  }
  html,body{margin:0;padding:0;background:var(--bg);}
  .wrap{background:var(--bg);max-width:100%;}
  h2{font:600 15px/1.3 system-ui,sans-serif;color:var(--fg);
     margin:0;padding:10px 12px 0;}
  svg{display:block;width:100%;height:auto;max-height:470px;}
  .fallback{font:14px/1.5 system-ui,sans-serif;color:var(--fg);padding:12px;}
  text{font-family:system-ui,sans-serif;fill:var(--fg);}
  .muted{fill:var(--muted);}
  .hi{fill:var(--hi);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Портрет по слоям: k = 1, 2, 3, 10</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---------- данные схемы ----------
    var PANELS = [1,2,3,10];          // сколько слоёв оставлено
    var GRID   = 24;                  // пикселей портрета по стороне
    var PW     = 4;                   // ширина панели в единицах данных
    var GAP    = 1.2;                 // зазор между панелями
    var W = 900, H = 380;             // холст (литерал: размер холста)
    var PAD_LBL = 8;                  // отступ подписи от якоря (px)
    var STROKE  = 1.5;
    var FS      = 13;

    // ---------- одна система координат ----------
    var scale  = 52;
    var origin = {x: 40, y: 300};
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    // ---------- модель "портрета": сумма слоёв ранга 1 ----------
    // u_i(r), v_i(c) — гладкие моды; sigma убывает
    function u(i,t){ return Math.cos((i+0.5)*Math.PI*t) * (i? 1 : 1); }
    function v(i,t){ return Math.cos((i+0.35)*Math.PI*t + i*0.4); }
    function face(r,c){ // "истинный" портрет: овал + глаза + рот
      var x=(c-0.5)*2, y=(r-0.5)*2, val=0;
      val += Math.exp(-(x*x/0.34 + (y+0.05)*(y+0.05)/0.62))*1.0;
      val -= Math.exp(-(((x+0.36)*(x+0.36))/0.012 + ((y+0.22)*(y+0.22))/0.012))*0.75;
      val -= Math.exp(-(((x-0.36)*(x-0.36))/0.012 + ((y+0.22)*(y+0.22))/0.012))*0.75;
      val -= Math.exp(-((x*x)/0.09 + ((y-0.42)*(y-0.42))/0.006))*0.55;
      return val;
    }
    // дискретная SVD-подобная развёртка: проекции face на моды
    var K = 10, sig = [], U = [], V = [];
    for(var i=0;i<K;i++){
      var uu=[], vv=[], s=0;
      for(var r=0;r<GRID;r++) uu.push(u(i,(r+0.5)/GRID));
      for(var c=0;c<GRID;c++) vv.push(v(i,(c+0.5)/GRID));
      for(var r2=0;r2<GRID;r2++) for(var c2=0;c2<GRID;c2++)
        s += face((r2+0.5)/GRID,(c2+0.5)/GRID)*uu[r2]*vv[c2];
      s /= (GRID*GRID/4);
      U.push(uu); V.push(vv); sig.push(s);
    }
    function approx(k){
      var m=[], lo=1e9, hi=-1e9;
      for(var r=0;r<GRID;r++){ m.push([]);
        for(var c=0;c<GRID;c++){
          var val=0;
          for(var i=0;i<k;i++) val += sig[i]*U[i][r]*V[i][c];
          m[r].push(val); if(val<lo)lo=val; if(val>hi)hi=val;
        }
      }
      return {m:m, lo:lo, hi:hi};
    }

    // ---------- отрисовка ----------
    var NS='http://www.w3.org/2000/svg';
    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    var svg = el('svg',{viewBox:'0 0 '+W+' '+H,
      preserveAspectRatio:'xMidYMid meet',role:'img',
      'aria-label':'Один портрет, восстановленный из 1, 2, 3 и 10 слоёв SVD'});
    svg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'var(--bg)'}));

    PANELS.forEach(function(k, idx){
      var x0 = idx*(PW+GAP);        // левый край панели в единицах данных
      var g = el('g',{});
      var A = approx(k), span = (A.hi-A.lo)||1;
      var cell = PW/GRID;
      for(var r=0;r<GRID;r++) for(var c=0;c<GRID;c++){
        var t = (A.m[r][c]-A.lo)/span;
        var lum = Math.round(18 + t*222);
        g.appendChild(el('rect',{
          x: sx(x0 + c*cell),
          y: sy(PW - r*cell),
          width:  sx(x0+cell)-sx(x0),
          height: sy(PW-cell)-sy(PW),
          fill:'rgb('+lum+','+lum+','+lum+')'
        }));
      }
      g.appendChild(el('rect',{
        x:sx(x0), y:sy(PW),
        width: sx(x0+PW)-sx(x0), height: sy(0)-sy(PW),
        fill:'none', stroke:'var(--frame)','stroke-width':STROKE}));
      // подпись k — над рамкой, по центру панели
      var t1 = el('text',{x:sx(x0+PW/2), y:sy(PW)-PAD_LBL,
        'text-anchor':'middle','font-size':FS+3,'font-weight':'600'});
      t1.textContent = 'k = '+k;
      g.appendChild(t1);
      // подпись формулы — под рамкой, по центру
      var t2 = el('text',{x:sx(x0+PW/2), y:sy(0)+PAD_LBL+FS,
        'text-anchor':'middle','font-size':FS,'class':'muted'});
      t2.textContent = (k===1 ? 'σ₁u₁v₁ᵀ'
                     : k===2 ? '+ σ₂u₂v₂ᵀ'
                     : k===3 ? '+ σ₃u₃v₃ᵀ'
                     : '+ … + σ₁₀u₁₀v₁₀ᵀ');
      g.appendChild(t2);
      svg.appendChild(g);
    });

    // стрелка прироста: хвост у первой панели, остриё у последней
    var yArr = -0.62;
    var xTail = 0 + PW/2, xHead = 3*(PW+GAP) + PW/2;
    svg.appendChild(el('line',{x1:sx(xTail),y1:sy(yArr),
      x2:sx(xHead),y2:sy(yArr),stroke:'var(--hi)','stroke-width':STROKE}));
    var hd = el('polygon',{fill:'var(--hi)', points:[
      sx(xHead)+','+sy(yArr),
      sx(xHead-0.28)+','+sy(yArr+0.13),
      sx(xHead-0.28)+','+sy(yArr-0.13)].join(' ')});
    svg.appendChild(hd);
    // подпись у ХВОСТА стрелки
    var ta = el('text',{x:sx(xTail)-PAD_LBL, y:sy(yArr)+FS/3,
      'text-anchor':'end','font-size':FS,'class':'hi'});
    ta.textContent = 'слоёв больше';
    svg.appendChild(ta);
    // пояснение прироста — под стрелкой, по центру, middle
    var tb = el('text',{x:sx((xTail+xHead)/2), y:sy(yArr)+PAD_LBL+FS,
      'text-anchor':'middle','font-size':FS,'class':'muted'});
    tb.textContent = 'прирост от слоя к слою падает: σ₁ ≥ σ₂ ≥ …';
    svg.appendChild(tb);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема должна была показать один и '+
      'тот же портрет, восстановленный из k = 1, 2, 3 и 10 слоёв SVD: '+
      'при k = 1 — размытые полосы и светлое пятно лица, при k = 2 и 3 — '+
      'проступают контуры и черты, при k = 10 — узнаваемое лицо. '+
      'Прирост от слоя к слою убывает, потому что σ₁ ≥ σ₂ ≥ …</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
