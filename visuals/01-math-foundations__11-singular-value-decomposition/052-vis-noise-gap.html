<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обрыв в спектре сингулярных чисел</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --axis: #98a2b3;
      --guide: #475467;
      --signal: #2563eb;
      --signal-soft: #dbeafe;
      --noise: #d97706;
      --noise-soft: #ffedd5;
      --near-zero: #94a3b8;
      --rule: #d0d5dd;
      --fallback: #b42318;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --panel: #182234;
        --text: #f3f4f6;
        --muted: #aeb8c8;
        --axis: #64748b;
        --guide: #cbd5e1;
        --signal: #60a5fa;
        --signal-soft: #18375d;
        --noise: #fbbf24;
        --noise-soft: #4b3514;
        --near-zero: #94a3b8;
        --rule: #344054;
        --fallback: #fda29b;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 14px 18px 16px;
    }

    main {
      width: 100%;
      max-width: 1100px;
      margin-inline: auto;
      background: var(--panel);
      border: 1px solid var(--rule);
    }

    h1 {
      margin: 0;
      padding: 14px 18px 6px;
      font-size: 20px;
      line-height: 1.2;
    }

    .lead {
      margin: 0;
      padding: 0 18px 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 452px;
      overflow: visible;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .separator {
      stroke: var(--guide);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .signal-bar {
      stroke: var(--signal);
      stroke-width: 30;
      stroke-linecap: butt;
      vector-effect: non-scaling-stroke;
    }

    .noise-bar {
      stroke: var(--noise);
      stroke-width: 30;
      stroke-linecap: butt;
      vector-effect: non-scaling-stroke;
    }

    .zero-bar {
      stroke: var(--near-zero);
      stroke-width: 30;
      stroke-linecap: butt;
      vector-effect: non-scaling-stroke;
    }

    .signal-key {
      stroke: var(--signal);
      stroke-width: 8;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .noise-key {
      stroke: var(--noise);
      stroke-width: 8;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .zero-key {
      stroke: var(--near-zero);
      stroke-width: 8;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow {
      stroke: var(--guide);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .panel-rule {
      stroke: var(--rule);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .panel-title {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .panel-note,
    .bar-label,
    .legend-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .bar-label {
      fill: var(--text);
      font-size: 15px;
    }

    .gap-label {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .signal-note {
      fill: var(--signal);
      font-size: 14px;
      font-weight: bold;
    }

    .noise-note {
      fill: var(--noise);
      font-size: 14px;
      font-weight: bold;
    }

    .fallback {
      fill: var(--fallback);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Обрыв в спектре: где кончается музыка и начинается шипение</h1>
    <p class="lead">Сравни высоту столбиков до и после границы.</p>

    <svg
      id="spectrum"
      viewBox="0 0 960 500"
      width="960"
      height="500"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svgTitle svgDescription"
    >
      <title id="svgTitle">Сравнение чистого и зашумлённого спектров</title>
      <desc id="svgDescription">
        В обоих спектрах первые три сингулярных числа велики. После сигма три
        происходит резкий обрыв. У чистого сигнала сигма четыре и сигма пять
        почти равны нулю, а у зашумлённого сигма четыре — сигма семь малы,
        но не равны нулю.
      </desc>
    </svg>
  </main>

  <script>
    const data = [
      {
        role: "clean",
        title: "Чистый сигнал",
        note: "После обрыва значения почти исчезают",
        titlePoint: { x: 0.18, y: 0.72 },
        notePoint: { x: 0.18, y: 1.14 },
        axis: {
          start: { x: 0.42, y: 4.38 },
          end: { x: 8.95, y: 4.38 }
        },
        bars: [
          {
            label: "σ₁",
            kind: "signal",
            start: { x: 1.02, y: 1.38 },
            end: { x: 1.02, y: 4.38 },
            labelPoint: { x: 1.02, y: 4.76 }
          },
          {
            label: "σ₂",
            kind: "signal",
            start: { x: 2.02, y: 1.92 },
            end: { x: 2.02, y: 4.38 },
            labelPoint: { x: 2.02, y: 4.76 }
          },
          {
            label: "σ₃",
            kind: "signal",
            start: { x: 3.02, y: 2.64 },
            end: { x: 3.02, y: 4.38 },
            labelPoint: { x: 3.02, y: 4.76 }
          },
          {
            label: "σ₄",
            kind: "zero",
            start: { x: 4.22, y: 4.24 },
            end: { x: 4.22, y: 4.38 },
            labelPoint: { x: 4.22, y: 4.76 }
          },
          {
            label: "σ₅",
            kind: "zero",
            start: { x: 5.22, y: 4.27 },
            end: { x: 5.22, y: 4.38 },
            labelPoint: { x: 5.22, y: 4.76 }
          }
        ]
      },
      {
        role: "noisy",
        title: "Зашумлённый сигнал",
        note: "Шум добавляет малый хвост",
        titlePoint: { x: 0.18, y: 5.62 },
        notePoint: { x: 0.18, y: 6.04 },
        axis: {
          start: { x: 0.42, y: 9.66 },
          end: { x: 8.95, y: 9.66 }
        },
        bars: [
          {
            label: "σ₁",
            kind: "signal",
            start: { x: 1.02, y: 6.58 },
            end: { x: 1.02, y: 9.66 },
            labelPoint: { x: 1.02, y: 10.04 }
          },
          {
            label: "σ₂",
            kind: "signal",
            start: { x: 2.02, y: 7.12 },
            end: { x: 2.02, y: 9.66 },
            labelPoint: { x: 2.02, y: 10.04 }
          },
          {
            label: "σ₃",
            kind: "signal",
            start: { x: 3.02, y: 7.84 },
            end: { x: 3.02, y: 9.66 },
            labelPoint: { x: 3.02, y: 10.04 }
          },
          {
            label: "σ₄",
            kind: "noise",
            start: { x: 4.22, y: 9.08 },
            end: { x: 4.22, y: 9.66 },
            labelPoint: { x: 4.22, y: 10.04 }
          },
          {
            label: "σ₅",
            kind: "noise",
            start: { x: 5.22, y: 9.16 },
            end: { x: 5.22, y: 9.66 },
            labelPoint: { x: 5.22, y: 10.04 }
          },
          {
            label: "σ₆",
            kind: "noise",
            start: { x: 6.22, y: 9.11 },
            end: { x: 6.22, y: 9.66 },
            labelPoint: { x: 6.22, y: 10.04 }
          },
          {
            label: "σ₇",
            kind: "noise",
            start: { x: 7.22, y: 9.2 },
            end: { x: 7.22, y: 9.66 },
            labelPoint: { x: 7.22, y: 10.04 }
          }
        ]
      },
      {
        separator: {
          start: { x: 3.61, y: 0.82 },
          end: { x: 3.61, y: 10.32 },
          label: "обрыв после σ₃",
          labelPoint: { x: 3.61, y: 0.42 }
        },
        cleanTail: {
          label: "σ₄ и σ₅ — около нуля",
          labelPoint: { x: 7.95, y: 2.68 },
          arrowStart: { x: 7.66, y: 2.9 },
          arrowEnd: { x: 5.3, y: 4.05 },
          headUpper: { x: 5.48, y: 3.79 },
          headLower: { x: 5.62, y: 4.1 }
        },
        noisyTail: {
          label: "σ₄…σ₇ — малые, но не нулевые",
          labelPoint: { x: 8.92, y: 7.18 },
          arrowStart: { x: 8.56, y: 7.42 },
          arrowEnd: { x: 7.34, y: 9.02 },
          headUpper: { x: 7.38, y: 8.7 },
          headLower: { x: 7.67, y: 8.9 }
        },
        middleRule: {
          start: { x: 0.18, y: 5.14 },
          end: { x: 9.42, y: 5.14 }
        },
        legendRule: {
          start: { x: 0.18, y: 10.56 },
          end: { x: 9.42, y: 10.56 }
        },
        legends: [
          {
            kind: "signal",
            start: { x: 0.44, y: 11.18 },
            end: { x: 0.88, y: 11.18 },
            label: "музыка — первые три слоя",
            labelPoint: { x: 1.08, y: 11.18 }
          },
          {
            kind: "noise",
            start: { x: 4.46, y: 11.18 },
            end: { x: 4.9, y: 11.18 },
            label: "шипение — малый хвост",
            labelPoint: { x: 5.1, y: 11.18 }
          },
          {
            kind: "zero",
            start: { x: 0.44, y: 11.82 },
            end: { x: 0.88, y: 11.82 },
            label: "в чистом сигнале хвост около нуля",
            labelPoint: { x: 1.08, y: 11.82 }
          }
        ],
        fallbackPoint: { x: 0.42, y: 2.2 }
      }
    ];

    const origin = Object.freeze({ x: 36, y: 12 });
    const scale = Object.freeze({ x: 96, y: 39 });
    const labelPad = Object.freeze({ x: 8, y: 5 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    (() => {
      const svg = document.getElementById("spectrum");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, className) => {
        const node = document.createElementNS(ns, name);
        if (className) node.setAttribute("class", className);
        return node;
      };

      const addLine = (start, end, className) => {
        const line = make("line", className);
        line.setAttribute("x1", sx(start.x));
        line.setAttribute("y1", sy(start.y));
        line.setAttribute("x2", sx(end.x));
        line.setAttribute("y2", sy(end.y));
        svg.appendChild(line);
        return line;
      };

      const addText = (point, value, className, anchor, dx, dy) => {
        const text = make("text", className);
        text.setAttribute("x", sx(point.x));
        text.setAttribute("y", sy(point.y));
        text.setAttribute("text-anchor", anchor);
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("dx", dx);
        text.setAttribute("dy", dy);
        text.textContent = value;
        svg.appendChild(text);
        return text;
      };

      try {
        const clean = data.find(item => item.role === "clean");
        const noisy = data.find(item => item.role === "noisy");
        const annotations = data.find(item => item.separator);

        addLine(
          annotations.middleRule.start,
          annotations.middleRule.end,
          "panel-rule"
        );
        addLine(
          annotations.legendRule.start,
          annotations.legendRule.end,
          "panel-rule"
        );

        for (const panel of [clean, noisy]) {
          addText(
            panel.titlePoint,
            panel.title,
            "panel-title",
            "start",
            labelPad.x,
            labelPad.y
          );
          addText(
            panel.notePoint,
            panel.note,
            "panel-note",
            "start",
            labelPad.x,
            labelPad.y
          );
          addLine(panel.axis.start, panel.axis.end, "axis");

          for (const bar of panel.bars) {
            addLine(bar.start, bar.end, `${bar.kind}-bar`);
            addText(
              bar.labelPoint,
              bar.label,
              "bar-label",
              "middle",
              labelPad.x - labelPad.x,
              labelPad.y
            );
          }
        }

        addLine(
          annotations.separator.start,
          annotations.separator.end,
          "separator"
        );
        addText(
          annotations.separator.labelPoint,
          annotations.separator.label,
          "gap-label",
          "middle",
          labelPad.x - labelPad.x,
          labelPad.y
        );

        addText(
          annotations.cleanTail.labelPoint,
          annotations.cleanTail.label,
          "signal-note",
          "end",
          -labelPad.x,
          -labelPad.y
        );
        addLine(
          annotations.cleanTail.arrowStart,
          annotations.cleanTail.arrowEnd,
          "arrow"
        );
        addLine(
          annotations.cleanTail.arrowEnd,
          annotations.cleanTail.headUpper,
          "arrow"
        );
        addLine(
          annotations.cleanTail.arrowEnd,
          annotations.cleanTail.headLower,
          "arrow"
        );

        addText(
          annotations.noisyTail.labelPoint,
          annotations.noisyTail.label,
          "noise-note",
          "end",
          -labelPad.x,
          -labelPad.y
        );
        addLine(
          annotations.noisyTail.arrowStart,
          annotations.noisyTail.arrowEnd,
          "arrow"
        );
        addLine(
          annotations.noisyTail.arrowEnd,
          annotations.noisyTail.headUpper,
          "arrow"
        );
        addLine(
          annotations.noisyTail.arrowEnd,
          annotations.noisyTail.headLower,
          "arrow"
        );

        for (const legend of annotations.legends) {
          addLine(legend.start, legend.end, `${legend.kind}-key`);
          addText(
            legend.labelPoint,
            legend.label,
            "legend-label",
            "start",
            labelPad.x,
            labelPad.y - labelPad.y
          );
        }
      } catch (error) {
        const title = svg.querySelector("title");
        const description = svg.querySelector("desc");
        svg.replaceChildren();
        if (title) svg.appendChild(title);
        if (description) svg.appendChild(description);

        const fallback = make("text", "fallback");
        const point = data.find(item => item.separator).fallbackPoint;
        fallback.setAttribute("x", sx(point.x));
        fallback.setAttribute("y", sy(point.y));
        fallback.setAttribute("text-anchor", "start");
        fallback.textContent =
          "Схема должна показать резкий обрыв после σ₃: дальше у чистого сигнала значения около нуля, а у зашумлённого остаётся малый хвост.";
        svg.appendChild(fallback);
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
