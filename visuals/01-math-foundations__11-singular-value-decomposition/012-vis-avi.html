<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Путь вектора v₁ через матрицу</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2330; --muted:#5d6a7d; --axis:#9aa7b8;
    --vin:#2563eb; --vout:#c2410c; --grid:#e4e9f0; --box:#f4f7fb;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d; --fg:#e8edf5; --muted:#9aa7b8; --axis:#4c5666;
      --vin:#6ea8ff; --vout:#ff9a5c; --grid:#222a35; --box:#1a2029;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);}
  .wrap{background:var(--bg);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:6px 0;}
  h2{font-size:15px;margin:0 0 4px;text-align:center;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:470px;margin:0 auto;}
  .fail{padding:10px 14px;color:var(--fg);font-size:13px;}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Путь одного вектора: A·v₁ = σ₁·u₁</h2>
  <div id="host"><svg id="d" viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Единичный вектор v1 во входном пространстве и вектор sigma1 u1 в выходном"></svg></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    /* ---------- данные схемы ---------- */
    var D={
      sigma1: 2.1,              // множитель растяжения σ₁ (>1)
      v1:[1,0],                 // единичный вектор v₁ (вход)
      v2:[0,1],                 // второй правый сингулярный вектор
      u1:[0.80,0.60],           // единичный вектор u₁ (выход)
      u2:[-0.60,0.80],
      inCenter:[-2.6,0],        // центр входной картинки
      outCenter:[2.9,0],        // центр выходной картинки
      axis:1.6,                 // полудлина осей
      tick:0.12,                // высота засечки
      arrowLen:0.30, arrowWide:0.13,
      band:[-0.35,0.35],        // вертикальная полоса для стрелки "A"
      legendY:-2.35
    };
    var origin=[380,205], scale=68;   // одна пара origin/scale, дальше не меняется
    function sx(x){ return origin[0]+x*scale; }
    function sy(y){ return origin[1]-y*scale; }

    /* ---------- утилиты рисования (все координаты только через sx/sy) ---------- */
    var svg=document.getElementById("d"), NS="http://www.w3.org/2000/svg";
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
    function add(p,q){return [p[0]+q[0],p[1]+q[1]];}
    function mul(p,k){return [p[0]*k,p[1]*k];}
    function line(p,q,st,w,dash){
      var a={x1:sx(p[0]),y1:sy(p[1]),x2:sx(q[0]),y2:sy(q[1]),stroke:st,"stroke-width":w,"stroke-linecap":"round"};
      if(dash)a["stroke-dasharray"]=dash; el("line",a);
    }
    function arrow(p,q,st,w){
      var d=[q[0]-p[0],q[1]-p[1]], L=Math.hypot(d[0],d[1]); if(!L)return;
      var u=[d[0]/L,d[1]/L], n=[-u[1],u[0]];
      var base=add(q,mul(u,-D.arrowLen));
      line(p,base,st,w);
      el("polygon",{points:[
        sx(q[0])+","+sy(q[1]),
        sx(base[0]+n[0]*D.arrowWide)+","+sy(base[1]+n[1]*D.arrowWide),
        sx(base[0]-n[0]*D.arrowWide)+","+sy(base[1]-n[1]*D.arrowWide)
      ].join(" "),fill:st});
    }
    function label(p,txt,anchor,dx,dy,fill,size,weight){
      var t=el("text",{x:sx(p[0])+dx,y:sy(p[1])+dy,"text-anchor":anchor,
        "font-size":size||13,fill:fill||"var(--fg)","font-weight":weight||"400"});
      t.textContent=txt; return t;
    }
    function axes(c){
      line(add(c,[-D.axis,0]),add(c,[D.axis,0]),"var(--axis)",1);
      line(add(c,[0,-D.axis]),add(c,[0,D.axis]),"var(--axis)",1);
      // засечка единицы по каждой оси
      line(add(c,[1,-D.tick]),add(c,[1,D.tick]),"var(--axis)",1);
      line(add(c,[-D.tick,1]),add(c,[D.tick,1]),"var(--axis)",1);
      el("circle",{cx:sx(c[0]),cy:sy(c[1]),r:2.5,fill:"var(--axis)"});
    }
    function unitCircle(c){
      el("circle",{cx:sx(c[0]),cy:sy(c[1]),r:scale,fill:"none",
        stroke:"var(--grid)","stroke-width":1.5,"stroke-dasharray":"4 4"});
    }

    /* ---------- вход ---------- */
    var C=D.inCenter;
    unitCircle(C); axes(C);
    label(add(C,[0,D.axis]),"вход: R\u207F","middle",0,-8,"var(--muted)",12);
    // v₂ бледно, для контекста
    arrow(C,add(C,D.v2),"var(--axis)",1.5);
    label(add(C,D.v2),"v\u2082","start",8,-2,"var(--muted)",12);
    // v₁ — единичной длины
    arrow(C,add(C,D.v1),"var(--vin)",2.6);
    label(add(C,mul(D.v1,0.5)),"v\u2081","middle",0,20,"var(--vin)",14,"600");
    label(add(C,[1,0]),"длина 1","middle",0,38,"var(--muted)",12);

    /* ---------- выход ---------- */
    var K=D.outCenter;
    unitCircle(K); axes(K);
    label(add(K,[0,D.axis]),"выход: R\u1D50","middle",0,-8,"var(--muted)",12);
    // u₁ единичный — пунктиром, затем растянутый σ₁·u₁
    var u1end=add(K,D.u1), s1end=add(K,mul(D.u1,D.sigma1));
    line(K,u1end,"var(--axis)",1.5,"3 3");
    label(u1end,"u\u2081","end",-6,16,"var(--muted)",12);
    arrow(K,s1end,"var(--vout)",2.6);
    // подпись у хвоста/сбоку середины, не у наконечника
    label(add(K,mul(D.u1,0.55)),"\u03C3\u2081\u00B7u\u2081","start",14,4,"var(--vout)",14,"600");
    // засечка длины: скобка от конца u₁ до конца σ₁u₁
    label(s1end,"длина \u03C3\u2081","start",10,-8,"var(--vout)",12);

    /* ---------- стрелка "A = U Σ Vᵗ" между картинками ---------- */
    var mid=(C[0]+K[0])/2;
    arrow([mid-0.55,D.band[0]+0.35],[mid+0.55,D.band[0]+0.35],"var(--fg)",2);
    label([mid,D.band[1]+0.30],"A = U \u03A3 V\u1D40","middle",0,-4,"var(--fg)",13,"600");
    label([mid,D.band[0]+0.25],"растяжение в \u03C3\u2081 раз","middle",0,20,"var(--muted)",12);

    /* ---------- легенда строкой под схемой ---------- */
    label([mid,D.legendY],"V\u1D40: v\u2081 \u2192 (1, 0, \u2026, 0)   \u2022   \u03A3: 1 \u2192 \u03C3\u2081   \u2022   U: первая ось \u2192 u\u2081",
      "middle",0,0,"var(--muted)",12);
    label([mid,D.legendY-0.38],"итог: A\u00B7v\u2081 = \u03C3\u2081\u00B7u\u2081","middle",0,0,"var(--fg)",13,"600");
  }catch(e){
    host.innerHTML='<div class="fail"><b>Схема не построилась.</b> Она должна показывать: '+
      'слева единичный вектор v\u2081 во входном пространстве (длина 1), справа вектор \u03C3\u2081\u00B7u\u2081 '+
      'в выходном пространстве — то же направление u\u2081, но длиной \u03C3\u2081, — и стрелку A = U \u03A3 V\u1D40 между ними, '+
      'подписанную коэффициентом растяжения \u03C3\u2081. Итог: A\u00B7v\u2081 = \u03C3\u2081\u00B7u\u2081.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
