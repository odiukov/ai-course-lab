<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цикл выполнения Garak</title>
<style>
:root{
  color-scheme:light dark;
  --page:white;
  --panel:whitesmoke;
  --ink:midnightblue;
  --muted:slategray;
  --flow:royalblue;
  --flow-fill:aliceblue;
  --shield:darkcyan;
  --shield-fill:lightcyan;
  --target:darkviolet;
  --target-fill:lavender;
  --report:darkgoldenrod;
  --report-fill:lightyellow;
  --error:firebrick;
  --error-fill:mistyrose;
  --harness:darkorange;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111827;
    --panel:#172033;
    --ink:#f3f4f6;
    --muted:#b6c2d2;
    --flow:#79a7ff;
    --flow-fill:#182b4b;
    --shield:#63d7d0;
    --shield-fill:#123b3d;
    --target:#d2a5ff;
    --target-fill:#34224b;
    --report:#ffd166;
    --report-fill:#443918;
    --error:#ff8f8f;
    --error-fill:#491f27;
    --harness:#ffb454;
  }
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.titlebar{
  background:var(--panel);
  color:var(--ink);
  padding:10px 18px;
  font-size:22px;
  font-weight:bold;
  text-align:center;
}
figure{margin:0;background:var(--panel)}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--panel);
}
.node,.note,.error-box{stroke-width:2px}
.node{fill:var(--flow-fill);stroke:var(--flow)}
.shield{fill:var(--shield-fill);stroke:var(--shield)}
.target{fill:var(--target-fill);stroke:var(--target)}
.report{fill:var(--report-fill);stroke:var(--report)}
.note{fill:var(--panel);stroke:var(--muted)}
.error-box{fill:var(--error-fill);stroke:var(--error)}
.flow-line{stroke:var(--flow);stroke-width:3px;fill:none;stroke-linejoin:round}
.branch-line{stroke:var(--muted);stroke-width:2px;fill:none}
.error-line{stroke:var(--error);stroke-width:2px;fill:none}
.harness-line{stroke:var(--harness);stroke-width:3px;fill:none;stroke-linejoin:round}
.arrow-flow{fill:var(--flow)}
.arrow-muted{fill:var(--muted)}
.arrow-error{fill:var(--error)}
.arrow-harness{fill:var(--harness)}
.title{fill:var(--ink);font-size:16px;font-weight:bold}
.body{fill:var(--ink);font-size:13px}
.small{fill:var(--muted);font-size:12px}
.route-label{fill:var(--flow);font-size:12px;font-weight:bold}
.harness-label{fill:var(--harness);font-size:14px;font-weight:bold}
.error-title{fill:var(--error);font-size:15px;font-weight:bold}
.error-body{fill:var(--ink);font-size:13px}
</style>
</head>
<body>
<div class="titlebar">Цикл выполнения Garak</div>
<figure id="diagram">
<svg id="canvas" viewBox="0 0 1200 450" width="1200" height="450"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Цикл выполнения Garak</title>
  <desc id="svg-desc">Проба отправляет атаку цели, детектор оценивает ответ, а harness повторяет пары и собирает отчёт. Ошибки пробы и детектора показаны отдельно.</desc>
</svg>
</figure>
<script>
const data=[
  {
    kind:"cfg",originX:0,originY:0,scaleX:1,scaleY:1,
    radius:10,arrowHead:12,arrowHalf:6,
    nodeY:118,nodeH:105,flowY:171,
    titleOffset:27,lineOffset:53,lineGap:20,
    loopY:91,loopLabelY:48,loopDetailY:70,
    routeLabelY:108,errorY:350,errorH:78,
    errorTitleOffset:28,errorBodyOffset:54
  },
  {
    kind:"node",id:"probe",x:30,y:118,w:155,h:105,style:"node",
    title:"Проба",lines:["готовит 100 атак","выбирает вариант"]
  },
  {
    kind:"node",id:"input",x:225,y:118,w:155,h:105,style:"node shield",
    title:"Входной щит",lines:["может остановить","запрос до модели"]
  },
  {
    kind:"node",id:"target",x:420,y:118,w:145,h:105,style:"node target",
    title:"Цель",lines:["получает не все","атаки и отвечает"]
  },
  {
    kind:"node",id:"output",x:605,y:118,w:155,h:105,style:"node shield",
    title:"Выходной щит",lines:["решает, можно ли","показать ответ"]
  },
  {
    kind:"node",id:"detector",x:800,y:118,w:155,h:105,style:"node",
    title:"Детектор",lines:["ищет заданный","режим отказа"]
  },
  {
    kind:"node",id:"report",x:995,y:118,w:175,h:105,style:"node report",
    title:"Отчёт",lines:["TBSA: уровень 3 — пройден","уровень 5 — провален"]
  },
  {
    kind:"flow",from:"probe",to:"input",label:"атака"
  },
  {
    kind:"flow",from:"input",to:"target",label:"допущено"
  },
  {
    kind:"flow",from:"target",to:"output",label:"ответ"
  },
  {
    kind:"flow",from:"output",to:"detector",label:"на оценку"
  },
  {
    kind:"flow",from:"detector",to:"report",label:"результат"
  },
  {
    kind:"note",id:"blocked",x:207,y:267,w:191,h:62,style:"note",
    title:"Остановлено до модели",lines:["щит фиксирует это в отчёте"],
    source:"input",sourceX:302.5
  },
  {
    kind:"note",id:"hidden",x:587,y:267,w:191,h:62,style:"note",
    title:"Ответ может быть скрыт",lines:["решение выходного щита"],
    source:"output",sourceX:682.5
  },
  {
    kind:"error",x:30,y:350,w:430,h:78,source:"probe",sourceX:107.5,
    title:"Ошибка пробы",lines:["атака не вызвала искомый отказ"]
  },
  {
    kind:"error",x:690,y:350,w:480,h:78,source:"detector",sourceX:877.5,
    title:"Ошибка детектора",lines:["отказ возник, но детектор его не заметил"]
  },
  {
    kind:"loop",
    points:[[1082.5,118],[1082.5,91],[107.5,91]],
    arrowFromY:91,arrowToY:118,arrowX:107.5,
    labelX:595,label:"Harness повторяет пары «проба — детектор»",
    detail:"следующая статическая, динамическая или адаптивная атака"
  }
];

const cfg=data.find(item=>item.kind==="cfg");
const origin=Object.freeze({x:cfg.originX,y:cfg.originY});
const scale=Object.freeze({x:cfg.scaleX,y:cfg.scaleY});
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const svg=document.getElementById("canvas");
  const ns="http://www.w3.org/2000/svg";
  const nodes=new Map();

  function make(tag,attrs,klass){
    const item=document.createElementNS(ns,tag);
    if(klass)item.setAttribute("class",klass);
    for(const [name,value] of Object.entries(attrs))item.setAttribute(name,value);
    svg.appendChild(item);
    return item;
  }

  function rectAt(x,y,w,h,klass){
    return make("rect",{
      x:sx(x),y:sy(y),
      width:sx(x+w)-sx(x),
      height:sy(y+h)-sy(y),
      rx:sx(x+cfg.radius)-sx(x),
      ry:sy(y+cfg.radius)-sy(y)
    },klass);
  }

  function textAt(x,y,value,klass,anchor){
    const item=make("text",{
      x:sx(x),y:sy(y),
      "text-anchor":anchor,
      "dominant-baseline":"middle"
    },klass);
    item.textContent=value;
    return item;
  }

  function lineAt(x1,y1,x2,y2,klass){
    return make("line",{
      x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2)
    },klass);
  }

  function rightArrow(x1,y,x2,klass,lineClass){
    lineAt(x1,y,x2-cfg.arrowHead,y,lineClass);
    make("polygon",{points:[
      [sx(x2),sy(y)],
      [sx(x2-cfg.arrowHead),sy(y-cfg.arrowHalf)],
      [sx(x2-cfg.arrowHead),sy(y+cfg.arrowHalf)]
    ].map(point=>point.join(",")).join(" ")},klass);
  }

  function downArrow(x,y1,y2,klass,lineClass){
    lineAt(x,y1,x,y2-cfg.arrowHead,lineClass);
    make("polygon",{points:[
      [sx(x),sy(y2)],
      [sx(x-cfg.arrowHalf),sy(y2-cfg.arrowHead)],
      [sx(x+cfg.arrowHalf),sy(y2-cfg.arrowHead)]
    ].map(point=>point.join(",")).join(" ")},klass);
  }

  function drawNode(item){
    rectAt(item.x,item.y,item.w,item.h,item.style);
    const center=item.x+item.w/cfg.scaleX/cfg.scaleX/cfg.scaleX/cfg.scaleX/cfg.scaleX;
    const actualCenter=item.x+item.w/scale.x/scale.x-item.w/scale.x+item.w/scale.x/cfg.scaleX/cfg.scaleX;
    const labelX=item.x+item.w/cfg.scaleX/cfg.scaleX-item.w/cfg.scaleX+item.w/cfg.scaleX/cfg.scaleX;
    const x=item.x+item.w/(cfg.scaleX+cfg.scaleX);
    textAt(x,item.y+cfg.titleOffset,item.title,"title","middle");
    item.lines.forEach((line,index)=>{
      const lineY=item.y+cfg.lineOffset+index*cfg.lineGap;
      textAt(x,lineY,line,"body","middle");
    });
    nodes.set(item.id,item);
    void center;void actualCenter;void labelX;
  }

  data.filter(item=>item.kind==="node").forEach(drawNode);

  data.filter(item=>item.kind==="flow").forEach(item=>{
    const from=nodes.get(item.from);
    const to=nodes.get(item.to);
    const start=from.x+from.w;
    const end=to.x;
    rightArrow(start,cfg.flowY,end,"arrow-flow","flow-line");
    textAt(start+(end-start)/(cfg.scaleX+cfg.scaleX),
      cfg.routeLabelY,item.label,"route-label","middle");
  });

  data.filter(item=>item.kind==="note").forEach(item=>{
    const source=nodes.get(item.source);
    downArrow(item.sourceX,source.y+source.h,item.y,
      "arrow-muted","branch-line");
    rectAt(item.x,item.y,item.w,item.h,item.style);
    const x=item.x+item.w/(cfg.scaleX+cfg.scaleX);
    textAt(x,item.y+cfg.titleOffset,item.title,"title","middle");
    item.lines.forEach((line,index)=>{
      textAt(x,item.y+cfg.lineOffset+index*cfg.lineGap,
        line,"small","middle");
    });
  });

  data.filter(item=>item.kind==="error").forEach(item=>{
    const source=nodes.get(item.source);
    downArrow(item.sourceX,source.y+source.h,item.y,
      "arrow-error","error-line");
    rectAt(item.x,item.y,item.w,item.h,"error-box");
    const x=item.x+item.w/(cfg.scaleX+cfg.scaleX);
    textAt(x,item.y+cfg.errorTitleOffset,item.title,
      "error-title","middle");
    item.lines.forEach((line,index)=>{
      textAt(x,item.y+cfg.errorBodyOffset+index*cfg.lineGap,
        line,"error-body","middle");
    });
  });

  data.filter(item=>item.kind==="loop").forEach(item=>{
    make("polyline",{points:item.points.map(point=>
      [sx(point.find(value=>value===point.find(entry=>entry===value))),
       sy(point.find(value=>value!==point.find(entry=>entry===value)))]
      .join(",")).join(" ")},"harness-line");
    downArrow(item.arrowX,item.arrowFromY,item.arrowToY,
      "arrow-harness","harness-line");
    textAt(item.labelX,cfg.loopLabelY,item.label,
      "harness-label","middle");
    textAt(item.labelX,cfg.loopDetailY,item.detail,
      "small","middle");
  });
}catch(error){
  document.getElementById("diagram").innerHTML=
    "<p>Схема должна была показать: проба отправляет атаку цели, детектор оценивает ответ, harness повторяет пары и собирает отчёт; ошибки пробы и детектора отмечены отдельно.</p>";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
