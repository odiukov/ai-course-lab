<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Карта продакшен-стека red-teaming</title>
<style>
  :root {
    color-scheme: light dark;
    --page: white;
    --ink: midnightblue;
    --muted: slategray;
    --live-fill: aliceblue;
    --live-line: royalblue;
    --guard-fill: lightcyan;
    --guard-line: teal;
    --model-fill: lavender;
    --model-line: rebeccapurple;
    --garak-fill: ivory;
    --garak-line: darkorange;
    --pyrit-fill: ghostwhite;
    --pyrit-line: mediumvioletred;
    --arrow: midnightblue;
    --rhythm-fill: whitesmoke;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: midnightblue;
      --ink: white;
      --muted: lightsteelblue;
      --live-fill: darkslateblue;
      --live-line: deepskyblue;
      --guard-fill: darkslategray;
      --guard-line: turquoise;
      --model-fill: indigo;
      --model-line: violet;
      --garak-fill: darkgoldenrod;
      --garak-line: gold;
      --pyrit-fill: darkmagenta;
      --pyrit-line: hotpink;
      --arrow: white;
      --rhythm-fill: darkslategray;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    max-width: 1200px;
    margin-inline: auto;
    background: var(--page);
  }

  h1 {
    font-size: 22px;
    text-align: center;
    margin-block: initial;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--page);
  }

  .contour,
  .node,
  .badge,
  .tool-chip,
  .rhythm-panel,
  .rhythm-divider,
  .arrow-shaft,
  .arrow-head,
  .guide {
    vector-effect: non-scaling-stroke;
  }

  .contour {
    stroke-width: 2px;
  }

  .contour-pyrit {
    fill: var(--pyrit-fill);
    stroke: var(--pyrit-line);
  }

  .contour-garak {
    fill: var(--garak-fill);
    stroke: var(--garak-line);
  }

  .contour-live {
    fill: var(--live-fill);
    stroke: var(--live-line);
  }

  .badge {
    stroke-width: 2px;
  }

  .badge-pyrit {
    fill: var(--pyrit-fill);
    stroke: var(--pyrit-line);
  }

  .badge-garak {
    fill: var(--garak-fill);
    stroke: var(--garak-line);
  }

  .badge-live {
    fill: var(--live-fill);
    stroke: var(--live-line);
  }

  .node {
    stroke-width: 2px;
  }

  .node-edge {
    fill: var(--page);
    stroke: var(--live-line);
  }

  .node-guard {
    fill: var(--guard-fill);
    stroke: var(--guard-line);
  }

  .node-model {
    fill: var(--model-fill);
    stroke: var(--model-line);
  }

  .tool-chip {
    stroke-width: 2px;
  }

  .tool-garak {
    fill: var(--garak-fill);
    stroke: var(--garak-line);
  }

  .tool-pyrit {
    fill: var(--pyrit-fill);
    stroke: var(--pyrit-line);
  }

  .arrow-shaft {
    stroke: var(--arrow);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .arrow-head {
    fill: var(--arrow);
    stroke: var(--arrow);
    stroke-width: 2px;
    stroke-linejoin: round;
  }

  .guide {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .rhythm-panel {
    fill: var(--rhythm-fill);
    stroke: var(--ink);
    stroke-width: 2px;
  }

  .rhythm-divider {
    stroke: var(--muted);
    stroke-width: 2px;
  }

  text {
    fill: var(--ink);
    font-family: inherit;
  }

  .badge-text {
    font-size: 13px;
    font-weight: bold;
  }

  .node-main {
    font-size: 17px;
    font-weight: bold;
  }

  .node-sub {
    font-size: 13px;
    fill: var(--muted);
  }

  .tool-name {
    font-size: 17px;
    font-weight: bold;
  }

  .note-main {
    font-size: 16px;
    font-weight: bold;
  }

  .note-sub {
    font-size: 13px;
    fill: var(--muted);
  }

  .rhythm-main {
    font-size: 14px;
    font-weight: bold;
  }

  .rhythm-sub {
    font-size: 13px;
    fill: var(--muted);
  }

  .fallback {
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<main>
  <h1>Карта продакшен-стека red-teaming</h1>

  <svg id="diagram"
       viewBox="0 0 1200 460"
       width="1200"
       height="460"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Карта продакшен-стека red-teaming</title>
    <desc id="svg-desc">Запрос проходит через входной Llama Guard, модель и выходной Llama Guard. Garak проверяет сборку каждую ночь, а PyRIT запускается перед релизом.</desc>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Запрос проходит через входной Llama Guard, LLM и выходной Llama Guard.
    Garak выполняет ночной регрессионный прогон, а PyRIT — глубокий прогон
    перед релизом.
  </p>
</main>

<script>
(() => {
  const data = Object.freeze([
    {
      kind: "metrics",
      contourRadius: 1.3,
      nodeRadius: 1,
      edgeRadius: 3,
      badgeRadius: 0.8,
      chipRadius: 0.8,
      rhythmRadius: 0.9,
      dash: [0.7, 0.55],
      labelPadding: 7
    },
    {
      kind: "contour",
      className: "contour-pyrit",
      x: 0,
      y: 1,
      width: 110,
      height: 37
    },
    {
      kind: "contour",
      className: "contour-garak",
      x: 4,
      y: 5.2,
      width: 102,
      height: 27.2
    },
    {
      kind: "contour",
      className: "contour-live",
      x: 8,
      y: 9.4,
      width: 94,
      height: 17.2
    },
    {
      kind: "badge",
      className: "badge-pyrit",
      x: 3,
      y: 0.2,
      width: 24,
      height: 3.7,
      label: "ПЕРЕД РЕЛИЗОМ"
    },
    {
      kind: "badge",
      className: "badge-garak",
      x: 7,
      y: 4.4,
      width: 23,
      height: 3.6,
      label: "КАЖДУЮ НОЧЬ"
    },
    {
      kind: "badge",
      className: "badge-live",
      x: 11,
      y: 8.6,
      width: 26,
      height: 3.6,
      label: "КАЖДЫЙ ЗАПРОС"
    },
    {
      kind: "node",
      className: "node-edge",
      x: 11,
      y: 14.1,
      width: 12,
      height: 8.1,
      lines: ["Запрос"]
    },
    {
      kind: "node",
      className: "node-guard",
      x: 27,
      y: 14.1,
      width: 17,
      height: 8.1,
      lines: ["Llama Guard", "вход"]
    },
    {
      kind: "node",
      className: "node-model",
      x: 49,
      y: 14.1,
      width: 12,
      height: 8.1,
      lines: ["LLM"]
    },
    {
      kind: "node",
      className: "node-guard",
      x: 66,
      y: 14.1,
      width: 17,
      height: 8.1,
      lines: ["Llama Guard", "выход"]
    },
    {
      kind: "node",
      className: "node-edge",
      x: 87,
      y: 14.1,
      width: 12,
      height: 8.1,
      lines: ["Безопасный", "ответ"]
    },
    {
      kind: "arrow",
      tail: {x: 23.7, y: 18.15},
      tip: {x: 26.3, y: 18.15},
      upper: {x: 25.2, y: 17.45},
      lower: {x: 25.2, y: 18.85}
    },
    {
      kind: "arrow",
      tail: {x: 44.7, y: 18.15},
      tip: {x: 48.3, y: 18.15},
      upper: {x: 47.2, y: 17.45},
      lower: {x: 47.2, y: 18.85}
    },
    {
      kind: "arrow",
      tail: {x: 61.7, y: 18.15},
      tip: {x: 65.3, y: 18.15},
      upper: {x: 64.2, y: 17.45},
      lower: {x: 64.2, y: 18.85}
    },
    {
      kind: "arrow",
      tail: {x: 83.7, y: 18.15},
      tip: {x: 86.3, y: 18.15},
      upper: {x: 85.2, y: 17.45},
      lower: {x: 85.2, y: 18.85}
    },
    {
      kind: "live-note",
      x: 55,
      y: 24.55,
      text: "Проверка входа и выхода работает постоянно"
    },
    {
      kind: "tool",
      className: "tool-garak",
      x: 7,
      y: 27.8,
      width: 13,
      height: 3.4,
      name: "Garak",
      main: "Ночной прогон текущей сборки",
      sub: "Широкий набор проб ищет возврат известных слабостей",
      textX: 22,
      mainY: 29.05,
      subY: 30.65
    },
    {
      kind: "tool",
      className: "tool-pyrit",
      x: 4,
      y: 33.5,
      width: 13,
      height: 3.4,
      name: "PyRIT",
      main: "Глубокая кампания перед релизом",
      sub: "Долгие сценарии, участие команды, несколько дней работы",
      textX: 19,
      mainY: 34.75,
      subY: 36.35
    },
    {
      kind: "guide",
      from: {x: 2, y: 39.5},
      to: {x: 108, y: 39.5}
    },
    {
      kind: "rhythm",
      x: 0,
      y: 40,
      width: 36,
      height: 4.4,
      main: "КАЖДЫЙ ЗАПРОС",
      sub: "Llama Guard · постоянно"
    },
    {
      kind: "rhythm",
      x: 36,
      y: 40,
      width: 37,
      height: 4.4,
      main: "КАЖДУЮ НОЧЬ",
      sub: "Garak · регрессия"
    },
    {
      kind: "rhythm",
      x: 73,
      y: 40,
      width: 37,
      height: 4.4,
      main: "КАЖДЫЙ РЕЛИЗ",
      sub: "PyRIT · глубокая проверка"
    }
  ]);

  const origin = Object.freeze({x: 50, y: 10});
  const scale = Object.freeze({x: 10, y: 10});

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y + y * scale.y;

  const diagram = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");

  try {
    const metrics = data.find(item => item.kind === "metrics");

    const create = (name, attributes, className) => {
      const element = document.createElementNS(diagram.namespaceURI, name);
      for (const [key, value] of Object.entries(attributes)) {
        element.setAttribute(key, value);
      }
      if (className) element.setAttribute("class", className);
      return element;
    };

    const addRect = (item, baseClass) => {
      const rect = create("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.width) - sx(item.x),
        height: sy(item.y + item.height) - sy(item.y),
        rx: sx(item.radius ?? metrics.contourRadius) - sx(0),
        ry: sy(item.radius ?? metrics.contourRadius) - sy(0)
      }, `${baseClass} ${item.className}`);
      diagram.append(rect);
      return rect;
    };

    const addText = (text, x, y, className, anchor, baseline) => {
      const label = create("text", {
        x: sx(x),
        y: sy(y),
        "text-anchor": anchor,
        "dominant-baseline": baseline
      }, className);
      label.textContent = text;
      diagram.append(label);
      return label;
    };

    for (const item of data.filter(entry => entry.kind === "contour")) {
      addRect(item, "contour");
    }

    for (const item of data.filter(entry => entry.kind === "badge")) {
      addRect({...item, radius: metrics.badgeRadius}, "badge");
      addText(
        item.label,
        item.x + item.width / (sx(2) - sx(0)),
        item.y + item.height / (sy(2) - sy(0)),
        "badge-text",
        "middle",
        "middle"
      );
    }

    for (const item of data.filter(entry => entry.kind === "node")) {
      const radius = item.className === "node-edge"
        ? metrics.edgeRadius
        : metrics.nodeRadius;

      addRect({...item, radius}, "node");

      const centerX = item.x + item.width / (sx(2) - sx(0));
      const centerY = item.y + item.height / (sy(2) - sy(0));

      if (item.lines.length === sx(1) - sx(0)) {
        addText(item.lines.at(-sx(1) + sx(0)), centerX, centerY, "node-main", "middle", "middle");
      } else {
        addText(item.lines.at(-sx(2) + sx(0)), centerX, centerY - 0.85, "node-main", "middle", "middle");
        addText(item.lines.at(-sx(1) + sx(0)), centerX, centerY + 1.15, "node-sub", "middle", "middle");
      }
    }

    for (const item of data.filter(entry => entry.kind === "arrow")) {
      diagram.append(create("line", {
        x1: sx(item.tail.x),
        y1: sy(item.tail.y),
        x2: sx(item.tip.x),
        y2: sy(item.tip.y)
      }, "arrow-shaft"));

      diagram.append(create("polygon", {
        points: [
          `${sx(item.tip.x)},${sy(item.tip.y)}`,
          `${sx(item.upper.x)},${sy(item.upper.y)}`,
          `${sx(item.lower.x)},${sy(item.lower.y)}`
        ].join(" ")
      }, "arrow-head"));
    }

    for (const item of data.filter(entry => entry.kind === "live-note")) {
      addText(item.text, item.x, item.y, "note-sub", "middle", "middle");
    }

    for (const item of data.filter(entry => entry.kind === "tool")) {
      addRect({...item, radius: metrics.chipRadius}, "tool-chip");
      addText(
        item.name,
        item.x + item.width / (sx(2) - sx(0)),
        item.y + item.height / (sy(2) - sy(0)),
        "tool-name",
        "middle",
        "middle"
      );
      addText(item.main, item.textX, item.mainY, "note-main", "start", "middle");
      addText(item.sub, item.textX, item.subY, "note-sub", "start", "middle");
    }

    for (const item of data.filter(entry => entry.kind === "guide")) {
      diagram.append(create("line", {
        x1: sx(item.from.x),
        y1: sy(item.from.y),
        x2: sx(item.to.x),
        y2: sy(item.to.y),
        "stroke-dasharray": `${sx(metrics.dash.at(-sx(2) + sx(0))) - sx(0)} ${sx(metrics.dash.at(-sx(1) + sx(0))) - sx(0)}`
      }, "guide"));
    }

    for (const item of data.filter(entry => entry.kind === "rhythm")) {
      addRect({...item, radius: metrics.rhythmRadius, className: ""}, "rhythm-panel");

      const centerX = item.x + item.width / (sx(2) - sx(0));
      addText(item.main, centerX, item.y + 1.45, "rhythm-main", "middle", "middle");
      addText(item.sub, centerX, item.y + 3.05, "rhythm-sub", "middle", "middle");
    }
  } catch (error) {
    diagram.setAttribute("hidden", "");
    fallback.hidden = false;
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
