<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три слоя защиты голоса</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#2a2724; --muted:#6b645c; --line:#b3aba0;
    --wm:#2f7d6b; --c2:#8a6d1f; --det:#9c3f2f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171a; --ink:#e7e4df; --muted:#a19a91; --line:#4e545b;
      --wm:#5ec9ad; --c2:#d9b24d; --det:#e58d74;
    }
  }
  html,body{margin:0}
  figure{margin:0;background:var(--bg);color:var(--ink);padding:12px 14px 10px;
    font:400 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
  figcaption{font-weight:600;margin:0 0 6px}
  #c svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  #c p{color:var(--muted);margin:6px 0}
</style>
<figure>
  <figcaption>Три слоя защиты: не этапы конвейера, а три разные точки приложения</figcaption>
  <div id="c"></div>
</figure>
<script>
(function(){
  var host=document.getElementById('c');
  try{
    var DATA={
      blocks:[
        {x0:0.6,x1:3.4,y0:1,y1:4.0,cls:'wm',t:'Водяной знак',
         sub:'ставит твой генератор',note:'часть волны: MP3, обрезка, шум — знак цел',dash:0},
        {x0:4.4,x1:7.2,y0:1,y1:5.6,cls:'c2',t:'C2PA — подпись',
         sub:'лежит рядом, в метаданных',note:'один пересохран — и подписи нет',dash:1},
        {x0:8.8,x1:11.6,y0:1,y1:2.6,cls:'det',t:'Детектор',
         sub:'смотрит на входящее аудио',note:'ответ только «да / нет»',dash:0}
      ],
      wave:{x0:0.9,x1:3.1,y:2.5,a:0.45,n:46},
      link:{x0:3.4,x1:4.4,y:3.3,t:'сбоку'},
      divider:{x:8,y0:0.4,y1:7.0},
      sides:[{x:7.75,y:7.15,t:'сделал ты',a:'end'},{x:8.25,y:7.15,t:'сделал кто-то другой',a:'start'}],
      attack:{tail:{x:0.5,y:6.6},bend:{x:10.2,y:6.6},tip:{x:10.2,y:2.6},hw:0.2,hl:0.45,t:'злоумышленник'},
      legend:[
        {x:0.2,y:-0.5,t:'Слева — твоя сторона: знак встраивается в момент синтеза, подпись кладётся рядом с файлом.'},
        {x:0.2,y:-1.1,t:'Справа — чужое аудио: ни знака, ни подписи, решение принимается по самому звуку.'},
        {x:0.2,y:-1.7,t:'Высота блока — сколько информации он несёт: провенанс самый информативный и самый хрупкий.'}
      ]
    };
    var origin={x:40,y:400}, scale=50;
    function sx(x){return origin.x + x*scale;}
    function sy(y){return origin.y - y*scale;}

    var s='<svg viewBox="0 0 700 500" preserveAspectRatio="xMidYMid meet" role="img" '+
          'aria-label="Три слоя защиты: водяной знак и C2PA на своей стороне, детектор на чужой">';
    s+='<style>'+
       '.bx{fill-opacity:.12;stroke-width:2}.wm{stroke:var(--wm);fill:var(--wm)}'+
       '.c2{stroke:var(--c2);fill:var(--c2)}.det{stroke:var(--det);fill:var(--det)}'+
       'text{font:400 13px system-ui,sans-serif;fill:var(--ink)}'+
       '.ttl{font-weight:600;font-size:15px}.mut{fill:var(--muted)}'+
       '.ln{stroke:var(--line);fill:none}'+
       '</style>';

    // разделительная линия «своё / чужое»
    s+='<line class="ln" stroke-dasharray="7 6" stroke-width="1.5" x1="'+sx(DATA.divider.x)+'" y1="'+
       sy(DATA.divider.y0)+'" x2="'+sx(DATA.divider.x)+'" y2="'+sy(DATA.divider.y1)+'"/>';
    DATA.sides.forEach(function(l){
      s+='<text class="mut" x="'+sx(l.x)+'" y="'+sy(l.y)+'" text-anchor="'+l.a+'">'+l.t+'</text>';
    });

    // блоки
    DATA.blocks.forEach(function(b){
      var x=sx(b.x0), y=sy(b.y1), w=sx(b.x1)-sx(b.x0), h=sy(b.y0)-sy(b.y1);
      s+='<rect class="bx '+b.cls+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="4"'+
         (b.dash?' stroke-dasharray="6 5"':'')+'/>';
      var cx=sx((b.x0+b.x1)/2);
      s+='<text class="ttl" x="'+cx+'" y="'+(sy(b.y1)-10)+'" text-anchor="middle">'+b.t+'</text>';
      s+='<text x="'+cx+'" y="'+(sy(b.y0)+20)+'" text-anchor="middle">'+b.sub+'</text>';
      s+='<text class="mut" x="'+cx+'" y="'+(sy(b.y0)+38)+'" text-anchor="middle">'+b.note+'</text>';
    });

    // волна внутри водяного знака
    var wv=DATA.wave, pts=[];
    for(var i=0;i<=wv.n;i++){
      var t=i/wv.n, wx=wv.x0+(wv.x1-wv.x0)*t, wy=wv.y+wv.a*Math.sin(t*Math.PI*6);
      pts.push(sx(wx)+','+sy(wy));
    }
    s+='<polyline class="ln" stroke="var(--wm)" stroke-width="1.6" points="'+pts.join(' ')+'"/>';

    // подпись прикреплена сбоку, не внутри
    s+='<line class="ln" stroke-dasharray="2 4" stroke-width="1.5" x1="'+sx(DATA.link.x0)+'" y1="'+
       sy(DATA.link.y)+'" x2="'+sx(DATA.link.x1)+'" y2="'+sy(DATA.link.y)+'"/>';
    s+='<text class="mut" x="'+sx((DATA.link.x0+DATA.link.x1)/2)+'" y="'+(sy(DATA.link.y)-8)+
       '" text-anchor="middle">'+DATA.link.t+'</text>';

    // стрелка злоумышленника: мимо знака и подписи — в детектор
    var a=DATA.attack;
    s+='<polyline class="ln" stroke="var(--det)" stroke-width="2" points="'+
       sx(a.tail.x)+','+sy(a.tail.y)+' '+sx(a.bend.x)+','+sy(a.bend.y)+' '+
       sx(a.tip.x)+','+sy(a.tip.y+a.hl)+'"/>';
    s+='<polygon fill="var(--det)" points="'+
       sx(a.tip.x)+','+sy(a.tip.y)+' '+
       sx(a.tip.x-a.hw)+','+sy(a.tip.y+a.hl)+' '+
       sx(a.tip.x+a.hw)+','+sy(a.tip.y+a.hl)+'"/>';
    s+='<text x="'+sx(a.tail.x)+'" y="'+(sy(a.tail.y)-9)+'" text-anchor="start" fill="var(--det)">'+a.t+'</text>';

    // легенда
    DATA.legend.forEach(function(l){
      s+='<text class="mut" x="'+sx(l.x)+'" y="'+sy(l.y)+'" text-anchor="start">'+l.t+'</text>';
    });

    s+='</svg>';
    host.innerHTML=s;
  }catch(e){
    host.innerHTML='<p>Схема должна показывать три блока по одной линии «твоё / чужое». '+
      'Слева, на твоей стороне: водяной знак внутри волны (ставит твой генератор, переживает MP3 и обрезку) '+
      'и подпись C2PA рядом с файлом, в метаданных (самая информативная и самая хрупкая — исчезает при пересохранении). '+
      'Справа, на чужой: детектор, который смотрит на входящее аудио и отвечает только «да / нет». '+
      'Стрелка злоумышленника идёт мимо водяного знака и подписи и упирается в детектор.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
