<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>99,98 % словаря — ошибка</title>
<style>
  :root{ --bg:#ffffff; --fg:#1a1a2e; --muted:#5a6472; --bad:#ff6b6b; --good:#2f9e44; --grid:#d5dbe3; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12121c; --fg:#eef1f6; --muted:#9aa5b5; --bad:#ff8787; --good:#51cf66; --grid:#2c3344; }
  }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap{ max-width:900px; margin:0 auto; padding:8px 10px 12px; background:var(--bg); }
  h2{ font-size:15px; margin:0 0 6px; font-weight:600; }
  svg{ display:block; width:100%; height:auto; max-height:520px; background:var(--bg); }
  .fail{ color:var(--muted); font-size:13px; line-height:1.5; }
  text{ font-family:inherit; fill:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <h2>После <code>{"price":</code> — 20 допустимых токенов из 100 000</h2>
  <div id="slot"><noscript class="fail">Из словаря в 100 000 токенов после <code>{"price":</code> допустимы ~20 (цифры, кавычка, минус, true, false, null) — это 0,02 %. Остальные 99 980 токенов, то есть 99,98 %, ломают JSON.</noscript></div>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ---- данные схемы ----
    var VOCAB = 100000, OK = 20;          // токенов в словаре / допустимых
    var COLS = 100, ROWS = 100;           // сетка точек: 1 точка = 10 токенов
    var OK_CELLS = 1;                     // 1 клетка из 10 000 ≈ 0,02 %
    var BARS = [
      { key:'ok',  label:'допустимо: 0,02 %',   frac: OK/VOCAB,      cls:'good' },
      { key:'bad', label:'ошибка: 99,98 %',     frac: (VOCAB-OK)/VOCAB, cls:'bad' }
    ];
    var TOKENS = ['0…9', '"', '−', 'true', 'false', 'null'];

    // ---- холст (литералы: только размеры) ----
    var W = 900, H = 430;

    // ---- одна система координат ----
    var ORIGIN = { x: 250, y: 40 };  // пиксели точки (0,0) схемы
    var SCALE  = 3.0;                // пикселей на единицу схемы
    function sx(x){ return ORIGIN.x + x * SCALE; }
    function sy(y){ return ORIGIN.y + y * SCALE; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); } return e; }
    function txt(x, y, s, anchor, size, fill, weight){
      var t = el('text', { x:x, y:y, 'text-anchor':anchor, 'font-size':size,
                           fill:fill||'currentColor', 'font-weight':weight||'400' });
      t.textContent = s; return t;
    }

    var svg = el('svg', { viewBox:'0 0 '+W+' '+H, preserveAspectRatio:'xMidYMid meet',
                          role:'img', 'aria-label':'99,98 процента словаря ведут в невалидный JSON' });
    svg.appendChild(el('rect', { x:0, y:0, width:W, height:H, fill:'var(--bg)' }));

    // ---- поле точек: 100 x 100 = 100 000 токенов, 1 точка = 10 токенов ----
    var STEP = 1;                         // шаг сетки в единицах схемы
    var R = 0.28;                         // радиус точки в единицах схемы
    var g = el('g', {});
    for(var r = 0; r < ROWS; r++){
      for(var c = 0; c < COLS; c++){
        var isOk = (r === 0 && c < OK_CELLS);
        g.appendChild(el('circle', {
          cx: sx(c*STEP), cy: sy(r*STEP),
          r: sx(R) - sx(0),
          fill: isOk ? 'var(--good)' : 'var(--bad)',
          opacity: isOk ? 1 : 0.42
        }));
      }
    }
    svg.appendChild(g);

    // рамка поля
    svg.appendChild(el('rect', {
      x: sx(-2), y: sy(-2),
      width: sx(COLS+1) - sx(-2), height: sy(ROWS+1) - sy(-2),
      fill:'none', stroke:'var(--grid)', 'stroke-width':1
    }));

    // ---- подпись поля: сверху по центру ----
    svg.appendChild(txt(sx((COLS-1)/2), sy(-2) - 10,
      'словарь: 100 000 токенов (1 точка = 10 токенов)', 'middle', 13, 'var(--muted)'));

    // ---- стрелка к зелёной клетке: хвост слева, подпись у хвоста ----
    var TIP  = { x: OK_CELLS - 0.6, y: 0 };
    var TAIL = { x: -22, y: -6 };
    svg.appendChild(el('path', {
      d: 'M '+sx(TAIL.x)+' '+sy(TAIL.y)+' L '+sx(TIP.x)+' '+sy(TIP.y),
      stroke:'var(--good)', 'stroke-width':1.6, fill:'none'
    }));
    var AW = 1.4, AH = 0.9;               // наконечник в единицах схемы
    svg.appendChild(el('polygon', {
      points: sx(TIP.x)+','+sy(TIP.y)+' '+
              sx(TIP.x-AW)+','+sy(TIP.y-AH)+' '+
              sx(TIP.x-AW)+','+sy(TIP.y+AH),
      fill:'var(--good)'
    }));
    svg.appendChild(txt(sx(TAIL.x) - 8, sy(TAIL.y) + 4,
      '20 токенов = 0,02 %', 'end', 14, 'var(--good)', '600'));

    // список допустимых токенов — под подписью стрелки, тот же якорь end
    for(var i = 0; i < TOKENS.length; i++){
      svg.appendChild(txt(sx(TAIL.x) - 8, sy(TAIL.y + 4 + i*3.2) + 4,
        TOKENS[i], 'end', 13, 'var(--muted)'));
    }

    // ---- подпись красной массы: справа от поля, якорь start ----
    svg.appendChild(txt(sx(COLS+2) + 10, sy(ROWS*0.42),
      '99 980 токенов', 'start', 14, 'var(--bad)', '600'));
    svg.appendChild(txt(sx(COLS+2) + 10, sy(ROWS*0.42 + 6),
      '= 99,98 % ломают JSON', 'start', 13, 'var(--bad)'));
    svg.appendChild(txt(sx(COLS+2) + 10, sy(ROWS*0.42 + 13),
      'dollars, перевод строки,', 'start', 12, 'var(--muted)'));
    svg.appendChild(txt(sx(COLS+2) + 10, sy(ROWS*0.42 + 18),
      '{, эмодзи, approximately', 'start', 12, 'var(--muted)'));

    // ---- позиция генерации: под полем слева, якорь start ----
    svg.appendChild(txt(sx(0), sy(ROWS+1) + 24,
      'следующий токен после  {"price":', 'start', 14, 'var(--fg)', '600'));

    slot.innerHTML = '';
    slot.appendChild(svg);
  }catch(e){
    slot.innerHTML = '<p class="fail">Схема не построилась. Она должна показывать: ' +
      'словарь из 100 000 токенов как поле точек; после <code>{"price":</code> допустимы ' +
      'только ~20 из них (цифры 0–9, кавычка, минус, true, false, null) — 0,02 % поля; ' +
      'остальные 99 980 токенов, 99,98 %, ведут в невалидный JSON.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
