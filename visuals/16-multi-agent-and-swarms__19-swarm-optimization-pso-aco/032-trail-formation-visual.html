<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как одинаковые феромоны превращаются в устойчивое предпочтение маршрута</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f4ed;
    --panel: #fffdf7;
    --text: #25241f;
    --muted: #67645b;
    --grid: #aaa69b;
    --cell: #f1eee5;
    --initial: #e5e9ef;
    --initial-text: #34404f;
    --grow: #d9ead2;
    --grow-strong: #94c47d;
    --grow-text: #214c20;
    --fade: #eee8df;
    --fade-text: #777066;
    --best: #7dbb67;
    --best-text: #153d18;
    --low: #e4dfd6;
    --low-text: #666158;
    --accent: #397b36;
    --arrow: #766f62;
    --outline: #d2cdc1;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #181a1d;
      --panel: #202328;
      --text: #f1eee6;
      --muted: #b9b5aa;
      --grid: #686d73;
      --cell: #292d32;
      --initial: #303a47;
      --initial-text: #e1e9f3;
      --grow: #29432b;
      --grow-strong: #4e7d49;
      --grow-text: #e1f3dd;
      --fade: #302f2d;
      --fade-text: #aaa69e;
      --best: #487841;
      --best-text: #effbea;
      --low: #343330;
      --low-text: #c2beb5;
      --accent: #8acb78;
      --arrow: #aaa397;
      --outline: #45494d;
    }
  }

  html {
    background: var(--page);
  }

  body {
    background: var(--page);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  figure {
    background: var(--panel);
    border: 1px solid var(--outline);
  }

  h2 {
    color: var(--text);
    font-size: 20px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 420px;
    background: var(--panel);
  }

  text {
    fill: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  }

  .frame-title {
    font-size: 18px;
    font-weight: bold;
  }

  .frame-caption {
    fill: var(--muted);
    font-size: 13px;
  }

  .column-label,
  .row-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .cell-text {
    font-size: 15px;
    font-weight: bold;
  }

  .cell {
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .cell.initial {
    fill: var(--initial);
  }

  .cell.initial + text {
    fill: var(--initial-text);
  }

  .cell.grow {
    fill: var(--grow);
    stroke: var(--grow-strong);
    stroke-width: 3px;
  }

  .cell.grow + text {
    fill: var(--grow-text);
  }

  .cell.fade {
    fill: var(--fade);
  }

  .cell.fade + text {
    fill: var(--fade-text);
  }

  .cell.best {
    fill: var(--best);
    stroke: var(--accent);
    stroke-width: 3px;
  }

  .cell.best + text {
    fill: var(--best-text);
  }

  .cell.low {
    fill: var(--low);
  }

  .cell.low + text {
    fill: var(--low-text);
  }

  .arrow-shaft {
    stroke: var(--arrow);
    stroke-width: 2px;
  }

  .arrow-head {
    fill: var(--arrow);
  }

  .arrow-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .legend-label {
    fill: var(--muted);
    font-size: 14px;
  }

  .legend-best {
    fill: var(--best);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .legend-low {
    fill: var(--low);
    stroke: var(--grid);
    stroke-width: 1px;
  }

  .conclusion {
    fill: var(--accent);
    font-size: 16px;
    font-weight: bold;
  }

  #fallback {
    color: var(--text);
    font-size: 15px;
  }

  #fallback[hidden] {
    display: none;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h2 id="diagram-title">Как одинаковые феромоны превращаются в устойчивое предпочтение маршрута</h2>
  <svg id="diagram" viewBox="0 0 1200 420" width="1200" height="420"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">Три снимка матрицы из четырёх типов задач и трёх агентов: сначала все двенадцать значений равны единице, затем правильные клетки усиливаются, а после ста задач содержат около девяти против примерно половины в остальных клетках.</desc>
  </svg>
  <p id="fallback" hidden>Схема должна показать три снимка матрицы 4 × 3: все значения начинают с 1.0, правильные клетки усиливаются, а после 100 задач достигают примерно 9 против примерно 0.5 в остальных клетках.</p>
</figure>

<script>
"use strict";

const diagramData = [
  ["Код", "A"],
  ["Текст", "B"],
  ["Данные", "C"],
  ["Изображения", "A"]
];

const columnData = [
  ["A", "Агент A"],
  ["B", "Агент B"],
  ["C", "Агент C"]
];

const frameData = [
  [42, "Старт", "все 12 клеток равны", "initial"],
  [446, "После обновлений", "правильные клетки усиливаются", "learning"],
  [850, "После 100 задач", "предпочтение стабилизировалось", "final"]
];

const origin = [0, 0];
const scale = [1, 1];

const layout = [
  0, 1, 2, 0.5,
  110, 114, 104, 62, 48,
  98, 20, 10, 8,
  290, 17, 24, 7,
  205, 180,
  32, 350, 18, 128,
  460, 350, 610, 350,
  730, 350, 858, 350,
  600, 398,
  349, 429, 753, 833,
  212, 190
];

const [
  zero, one, two, half,
  matrixTop, matrixY, rowLabelWidth, cellWidth, cellHeight,
  columnLabelY, cellInset, labelGap, cornerRadius,
  matrixWidth, arrowTailGap, arrowHeadLength, arrowHalfHeight,
  arrowY, arrowLabelY,
  legendSwatchWidth, legendY, legendSwatchHeight, legendTextGap,
  legendBestX, legendBestY, legendBestTextX, legendBestTextY,
  legendLowX, legendLowY, legendLowTextX, legendLowTextY,
  conclusionX, conclusionY,
  firstArrowTailX, firstArrowHeadX, secondArrowTailX, secondArrowHeadX,
  arrowTextY, arrowLineY
] = layout;

const [originX, originY] = origin;
const [scaleX, scaleY] = scale;

const sx = x => originX + x * scaleX;
const sy = y => originY + y * scaleY;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");
const namespace = "http://www.w3.org/2000/svg";

function makeElement(tag, className) {
  const node = document.createElementNS(namespace, tag);
  if (className) node.setAttribute("class", className);
  return node;
}

function addText(x, y, value, className, anchor) {
  const node = makeElement("text", className);
  node.setAttribute("x", sx(x));
  node.setAttribute("y", sy(y));
  node.setAttribute("text-anchor", anchor);
  node.setAttribute("dominant-baseline", "middle");
  node.textContent = value;
  svg.appendChild(node);
  return node;
}

function addRect(x, y, width, height, className) {
  const node = makeElement("rect", className);
  node.setAttribute("x", sx(x));
  node.setAttribute("y", sy(y));
  node.setAttribute("width", sx(width) - sx(zero));
  node.setAttribute("height", sy(height) - sy(zero));
  node.setAttribute("rx", sx(cornerRadius) - sx(zero));
  node.setAttribute("ry", sy(cornerRadius) - sy(zero));
  svg.appendChild(node);
  return node;
}

function addLine(xStart, yStart, xEnd, yEnd, className) {
  const node = makeElement("line", className);
  node.setAttribute("x1", sx(xStart));
  node.setAttribute("y1", sy(yStart));
  node.setAttribute("x2", sx(xEnd));
  node.setAttribute("y2", sy(yEnd));
  svg.appendChild(node);
  return node;
}

function addPolygon(points, className) {
  const node = makeElement("polygon", className);
  node.setAttribute(
    "points",
    points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ")
  );
  svg.appendChild(node);
  return node;
}

function addArrow(tailX, headX, y, label) {
  const shaftEnd = headX - arrowHeadLength;
  addLine(tailX, y, shaftEnd, y, "arrow-shaft");
  addPolygon([
    [headX, y],
    [shaftEnd, y - arrowHalfHeight],
    [shaftEnd, y + arrowHalfHeight]
  ], "arrow-head");
  addText((tailX + headX) / two, arrowTextY, label, "arrow-label", "middle");
}

function cellPresentation(mode, correct) {
  if (mode === "initial") return ["initial", "1.0"];
  if (mode === "learning" && correct) return ["grow", "↑"];
  if (mode === "learning") return ["fade", "↓"];
  if (mode === "final" && correct) return ["best", "≈ 9"];
  return ["low", "≈ 0.5"];
}

function drawFrame(frame) {
  const [frameX, title, caption, mode] = frame;

  addText(
    frameX + matrixWidth / two,
    matrixTop - cellHeight - labelGap,
    title,
    "frame-title",
    "middle"
  );

  addText(
    frameX + matrixWidth / two,
    matrixTop - cellHeight / two,
    caption,
    "frame-caption",
    "middle"
  );

  columnData.forEach((column, columnIndex) => {
    const [, label] = column;
    const centerX =
      frameX + rowLabelWidth + columnIndex * cellWidth + cellWidth / two;
    addText(centerX, columnLabelY, label, "column-label", "middle");
  });

  diagramData.forEach((row, rowIndex) => {
    const [rowLabel, correctAgent] = row;
    const rowY = matrixY + rowIndex * cellHeight;
    const centerY = rowY + cellHeight / two;

    addText(
      frameX + rowLabelWidth - labelGap,
      centerY,
      rowLabel,
      "row-label",
      "end"
    );

    columnData.forEach((column, columnIndex) => {
      const [agentKey] = column;
      const correct = agentKey === correctAgent;
      const [stateClass, value] = cellPresentation(mode, correct);
      const cellX = frameX + rowLabelWidth + columnIndex * cellWidth;

      addRect(
        cellX + cellInset / two,
        rowY + cellInset / two,
        cellWidth - cellInset,
        cellHeight - cellInset,
        `cell ${stateClass}`
      );

      addText(
        cellX + cellWidth / two,
        centerY,
        value,
        "cell-text",
        "middle"
      );
    });
  });
}

try {
  frameData.forEach(drawFrame);

  addArrow(firstArrowTailX, firstArrowHeadX, arrowLineY, "удачный тур");
  addArrow(secondArrowTailX, secondArrowHeadX, arrowLineY, "100 задач");

  addRect(
    legendBestX,
    legendBestY,
    legendSwatchWidth,
    legendSwatchHeight,
    "legend-best"
  );
  addText(
    legendBestTextX,
    legendBestTextY + legendSwatchHeight / two,
    "правильный агент: след растёт",
    "legend-label",
    "start"
  );

  addRect(
    legendLowX,
    legendLowY,
    legendSwatchWidth,
    legendSwatchHeight,
    "legend-low"
  );
  addText(
    legendLowTextX,
    legendLowTextY + legendSwatchHeight / two,
    "остальные агенты: след испаряется",
    "legend-label",
    "start"
  );

  addText(
    conclusionX,
    conclusionY,
    "Случай нарушает равенство → качество закрепляет предпочтение",
    "conclusion",
    "middle"
  );
} catch (error) {
  svg.setAttribute("hidden", "");
  fallback.hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
