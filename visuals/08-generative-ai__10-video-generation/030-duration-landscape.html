<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Карта доступной длительности видеомоделей</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef1f7;
      --surface: #ffffff;
      --ink: #182033;
      --muted: #647087;
      --grid: #d8deea;
      --axis: #7a8498;
      --closed: #6754d9;
      --closed-soft: #f0edff;
      --open: #13856d;
      --open-soft: #e8f7f2;
      --target: #d34b55;
      --target-soft: #fff0f1;
      --border: #cfd6e3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111620;
        --surface: #171d29;
        --ink: #eef2fb;
        --muted: #aab4c7;
        --grid: #30394a;
        --axis: #818da3;
        --closed: #a797ff;
        --closed-soft: #24223b;
        --open: #55d6b4;
        --open-soft: #18332e;
        --target: #ff7d86;
        --target-soft: #3a2027;
        --border: #394255;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 12px;
    }

    .figure {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .heading {
      padding: 12px 16px 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--surface);
      color: var(--ink);
      shape-rendering: geometricPrecision;
    }

    svg text {
      fill: currentColor;
      font-family: inherit;
    }

    .panel-closed {
      fill: var(--closed-soft);
    }

    .panel-open {
      fill: var(--open-soft);
    }

    .grid-line {
      stroke: var(--grid);
    }

    .axis-line,
    .tick-mark {
      stroke: var(--axis);
    }

    .closed-line,
    .closed-cap,
    .closed-swatch {
      stroke: var(--closed);
    }

    .open-line,
    .open-cap,
    .open-swatch {
      stroke: var(--open);
    }

    .target-line,
    .target-cap {
      stroke: var(--target);
    }

    .model-name {
      fill: var(--ink);
      font-weight: bold;
    }

    .value-closed,
    .group-closed {
      fill: var(--closed);
      font-weight: bold;
    }

    .value-open,
    .group-open {
      fill: var(--open);
      font-weight: bold;
    }

    .tick-label,
    .group-note {
      fill: var(--muted);
    }

    .target-label,
    .footer-label {
      fill: var(--target);
      font-weight: bold;
    }

    .footer-rule {
      stroke: var(--target);
    }

    .failed {
      display: none;
    }

    .fallback {
      margin: 0;
      padding: 24px;
      background: var(--target-soft);
      color: var(--ink);
      font-size: 16px;
    }

    .fallback[hidden] {
      display: none;
    }

    noscript p {
      margin: 0;
      padding: 24px;
      background: var(--target-soft);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <header class="heading">
      <h1>Карта доступной длительности видеомоделей</h1>
      <p class="subtitle">Максимум непрерывного действия за одну генерацию</p>
    </header>

    <svg
      id="diagram"
      viewBox="0 0 1100 450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
    >
      <title id="svg-title">Сравнение максимальной длительности видеомоделей</title>
      <desc id="svg-desc">
        Закрытые модели охватывают диапазон от пяти до шестидесяти секунд.
        Открытые CogVideoX, HunyuanVideo, Mochi-1 и WAN 2.2 находятся между
        пятью и десятью секундами.
      </desc>
      <g id="plot"></g>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать: закрытые видеомодели доступны в диапазоне
      5–60 секунд, а открытые CogVideoX, HunyuanVideo, Mochi-1 и WAN 2.2 —
      преимущественно в диапазоне 5–10 секунд.
    </p>

    <noscript>
      <p>
        Закрытые видеомодели: 5–60 секунд. Открытые CogVideoX, HunyuanVideo,
        Mochi-1 и WAN 2.2: преимущественно 5–10 секунд.
      </p>
    </noscript>
  </main>

  <script>
    const data = [
      {
        kind: "layout",
        nameX: -2,
        groupSwatchX1: -24,
        groupSwatchX2: -22.5,
        groupTextX: -21.7,
        groupNoteX: 66,
        panelX1: -25.5,
        panelX2: 68,
        capHalf: 0.18,
        gridY1: 0.48,
        gridY2: 9.45,
        tickY1: -0.16,
        tickY2: 0.16,
        tickLabelY: -0.28
      },
      {
        kind: "panel",
        tone: "closed",
        x1: -25.5,
        x2: 68,
        y1: 0.48,
        y2: 4.5
      },
      {
        kind: "panel",
        tone: "open",
        x1: -25.5,
        x2: 68,
        y1: 5.45,
        y2: 9.45
      },
      {
        kind: "axis",
        x1: 0,
        x2: 60,
        y: 0
      },
      {
        kind: "group",
        tone: "closed",
        y: -1.2,
        label: "ЗАКРЫТЫЕ МОДЕЛИ",
        note: "диапазон 5–60 секунд"
      },
      {
        kind: "group",
        tone: "open",
        y: 5.08,
        label: "ОТКРЫТЫЕ МОДЕЛИ",
        note: "преимущественно 5–10 секунд"
      },
      {
        kind: "tick",
        value: 5
      },
      {
        kind: "tick",
        value: 10
      },
      {
        kind: "tick",
        value: 20
      },
      {
        kind: "tick",
        value: 60
      },
      {
        kind: "model",
        tone: "closed",
        label: "Sora",
        from: 0,
        to: 60,
        y: 1
      },
      {
        kind: "model",
        tone: "closed",
        label: "Sora Turbo",
        from: 0,
        to: 20,
        y: 2
      },
      {
        kind: "model",
        tone: "closed",
        label: "Veo 3",
        from: 0,
        to: 15,
        y: 3
      },
      {
        kind: "model",
        tone: "closed",
        label: "Другие закрытые",
        from: 5,
        to: 10,
        y: 4,
        range: true
      },
      {
        kind: "model",
        tone: "open",
        label: "CogVideoX",
        from: 0,
        to: 10,
        y: 6
      },
      {
        kind: "model",
        tone: "open",
        label: "Mochi-1",
        from: 0,
        to: 5.4,
        y: 7
      },
      {
        kind: "model",
        tone: "open",
        label: "HunyuanVideo",
        from: 0,
        to: 5,
        y: 8
      },
      {
        kind: "model",
        tone: "open",
        label: "WAN 2.2",
        from: 0,
        to: 5,
        y: 9
      },
      {
        kind: "target",
        x: 18,
        y1: -0.08,
        y2: 9.45,
        labelY: -1.2,
        label: "замысел: 18 секунд"
      },
      {
        kind: "footer",
        x: 30,
        y: 10.2,
        ruleX1: 0,
        ruleX2: 60,
        ruleY: 9.82,
        label: "18 секунд → 5 с: 4 клипа   •   10 с: 2 клипа   •   20 с: 1 клип"
      }
    ];

    const origin = { x: 310, y: 80 };
    const scale = { x: 11.4, y: 34 };
    const canvas = { width: 1100, height: 450 };
    const labelPad = 8;
    const lineWidth = {
      hair: 1,
      axis: 2,
      bar: 12,
      cap: 2,
      target: 2,
      footer: 2
    };
    const fontSize = {
      group: 15,
      note: 14,
      model: 16,
      value: 15,
      tick: 13,
      target: 15,
      footer: 15
    };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";
      const layout = data.find(item => item.kind === "layout");
      const axis = data.find(item => item.kind === "axis");

      if (!svg || !plot || !fallback || !layout || !axis) {
        throw new Error("Недостаточно данных для построения схемы");
      }

      const add = (name, attributes, text) => {
        const node = document.createElementNS(ns, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }
        if (text !== undefined) {
          node.textContent = text;
        }
        plot.appendChild(node);
        return node;
      };

      const duration = item => {
        const end = item.to.toLocaleString("ru-RU");
        if (item.range) {
          const start = item.from.toLocaleString("ru-RU");
          return `${start}–${end} с`;
        }
        return `${end} с`;
      };

      for (const item of data.filter(entry => entry.kind === "panel")) {
        add("rect", {
          x: sx(item.x1),
          y: sy(item.y1),
          width: sx(item.x2) - sx(item.x1),
          height: sy(item.y2) - sy(item.y1),
          class: `panel-${item.tone}`
        });
      }

      for (const item of data.filter(entry => entry.kind === "tick")) {
        add("line", {
          x1: sx(item.value),
          y1: sy(layout.gridY1),
          x2: sx(item.value),
          y2: sy(layout.gridY2),
          class: "grid-line",
          "stroke-width": lineWidth.hair
        });
      }

      add("line", {
        x1: sx(axis.x1),
        y1: sy(axis.y),
        x2: sx(axis.x2),
        y2: sy(axis.y),
        class: "axis-line",
        "stroke-width": lineWidth.axis
      });

      for (const item of data.filter(entry => entry.kind === "tick")) {
        add("line", {
          x1: sx(item.value),
          y1: sy(layout.tickY1),
          x2: sx(item.value),
          y2: sy(layout.tickY2),
          class: "tick-mark",
          "stroke-width": lineWidth.axis
        });

        add("text", {
          x: sx(item.value),
          y: sy(layout.tickLabelY),
          dy: -labelPad,
          class: "tick-label",
          "font-size": fontSize.tick,
          "text-anchor": "middle"
        }, `${item.value.toLocaleString("ru-RU")} с`);
      }

      for (const item of data.filter(entry => entry.kind === "group")) {
        add("line", {
          x1: sx(layout.groupSwatchX1),
          y1: sy(item.y),
          x2: sx(layout.groupSwatchX2),
          y2: sy(item.y),
          class: `${item.tone}-swatch`,
          "stroke-width": lineWidth.bar
        });

        add("text", {
          x: sx(layout.groupTextX),
          y: sy(item.y),
          class: `group-${item.tone}`,
          "font-size": fontSize.group,
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, item.label);

        add("text", {
          x: sx(layout.groupNoteX),
          y: sy(item.y),
          class: "group-note",
          "font-size": fontSize.note,
          "text-anchor": "end",
          "dominant-baseline": "middle"
        }, item.note);
      }

      for (const item of data.filter(entry => entry.kind === "model")) {
        add("text", {
          x: sx(layout.nameX),
          y: sy(item.y),
          dx: -labelPad,
          class: "model-name",
          "font-size": fontSize.model,
          "text-anchor": "end",
          "dominant-baseline": "middle"
        }, item.label);

        add("line", {
          x1: sx(item.from),
          y1: sy(item.y),
          x2: sx(item.to),
          y2: sy(item.y),
          class: `${item.tone}-line`,
          "stroke-width": lineWidth.bar,
          "stroke-linecap": "round"
        });

        if (item.range) {
          add("line", {
            x1: sx(item.from),
            y1: sy(item.y - layout.capHalf),
            x2: sx(item.from),
            y2: sy(item.y + layout.capHalf),
            class: `${item.tone}-cap`,
            "stroke-width": lineWidth.cap
          });
        }

        add("line", {
          x1: sx(item.to),
          y1: sy(item.y - layout.capHalf),
          x2: sx(item.to),
          y2: sy(item.y + layout.capHalf),
          class: `${item.tone}-cap`,
          "stroke-width": lineWidth.cap
        });

        add("text", {
          x: sx(item.to),
          y: sy(item.y),
          dx: labelPad,
          class: `value-${item.tone}`,
          "font-size": fontSize.value,
          "text-anchor": "start",
          "dominant-baseline": "middle"
        }, duration(item));
      }

      const target = data.find(item => item.kind === "target");

      add("line", {
        x1: sx(target.x),
        y1: sy(target.y1),
        x2: sx(target.x),
        y2: sy(target.y2),
        class: "target-line",
        "stroke-width": lineWidth.target,
        "stroke-dasharray":
          `${lineWidth.target * lineWidth.axis} ${lineWidth.target * lineWidth.axis}`
      });

      add("line", {
        x1: sx(target.x - layout.capHalf),
        y1: sy(target.y1),
        x2: sx(target.x + layout.capHalf),
        y2: sy(target.y1),
        class: "target-cap",
        "stroke-width": lineWidth.target
      });

      add("text", {
        x: sx(target.x),
        y: sy(target.labelY),
        class: "target-label",
        "font-size": fontSize.target,
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, target.label);

      const footer = data.find(item => item.kind === "footer");

      add("line", {
        x1: sx(footer.ruleX1),
        y1: sy(footer.ruleY),
        x2: sx(footer.ruleX2),
        y2: sy(footer.ruleY),
        class: "footer-rule",
        "stroke-width": lineWidth.footer
      });

      add("text", {
        x: sx(footer.x),
        y: sy(footer.y),
        class: "footer-label",
        "font-size": fontSize.footer,
        "text-anchor": "middle",
        "dominant-baseline": "middle"
      }, footer.label);

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.classList.add("failed");
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
