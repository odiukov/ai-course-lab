<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сравнение полного и факторизованного внимания</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5d6878;
    --line: #c8d1df;
    --full: #6657e8;
    --full-soft: #e7e4ff;
    --spatial: #2478d4;
    --spatial-soft: #dcebff;
    --temporal: #d66b20;
    --temporal-soft: #ffe6d3;
    --good: #147653;
    --good-soft: #dff5eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141d;
      --panel: #181e29;
      --ink: #eef2f8;
      --muted: #aab4c3;
      --line: #3a4556;
      --full: #a99fff;
      --full-soft: #302b60;
      --spatial: #75b8ff;
      --spatial-soft: #18395c;
      --temporal: #ffad70;
      --temporal-soft: #5a321d;
      --good: #73d9ae;
      --good-soft: #173f33;
    }
  }
  html, body {
    margin: 0;
    background: var(--bg);
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  figure {
    margin: 0;
    background: var(--bg);
    max-width: 1100px;
  }
  h1 {
    margin: 0;
    padding: 12px 20px 6px;
    font-size: 22px;
    line-height: 1.25;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 440px;
    background: var(--bg);
  }
  .panel, .banner {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }
  .matrix-base {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2px;
  }
  .full-cell {
    fill: var(--full-soft);
    stroke: var(--full);
    stroke-width: 1px;
  }
  .spatial-cell {
    fill: var(--spatial-soft);
    stroke: var(--spatial);
    stroke-width: 2px;
  }
  .temporal-cell {
    fill: var(--temporal-soft);
    stroke: var(--temporal);
    stroke-width: 1px;
  }
  .grid-line {
    stroke: var(--line);
    stroke-width: 1px;
  }
  .route {
    fill: none;
    stroke: var(--temporal);
    stroke-width: 3px;
  }
  .arrow-head {
    fill: var(--temporal);
  }
  .full-bar {
    fill: var(--full);
  }
  .factor-bar {
    fill: var(--good);
  }
  .total-box {
    fill: var(--good-soft);
    stroke: var(--good);
    stroke-width: 2px;
  }
  text {
    fill: var(--ink);
    dominant-baseline: middle;
  }
  .section {
    font-size: 18px;
    font-weight: bold;
  }
  .formula {
    font-size: 21px;
    font-weight: bold;
  }
  .large {
    font-size: 25px;
    font-weight: bold;
  }
  .label {
    font-size: 14px;
  }
  .small {
    fill: var(--muted);
    font-size: 13px;
  }
  .axis {
    fill: var(--muted);
    font-size: 12px;
  }
  .full-text {
    fill: var(--full);
  }
  .spatial-text {
    fill: var(--spatial);
  }
  .temporal-text {
    fill: var(--temporal);
  }
  .good-text {
    fill: var(--good);
  }
  .fallback {
    font-size: 18px;
    font-weight: bold;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Полное и факторизованное внимание</h1>
  <svg viewBox="0 0 1100 440" width="1100" height="440"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-desc">
    <desc id="diagram-desc">Полное внимание обрабатывает 640 000 пар, а два этапа факторизованного внимания — 86 400 пар.</desc>
    <g id="plot"></g>
  </svg>
</figure>
<script>
const DATA = Object.freeze({
  origin: { x: 0, y: 0 },
  scale: 1,
  canvas: { width: 1100, height: 440 },
  zero: 0,
  one: 1,
  two: 2,
  angle: -90,
  frames: 8,
  patches: 100,
  tokens: 800,
  fullPairs: 640000,
  spatialPairs: 80000,
  temporalPairs: 6400,
  factorPairs: 86400,
  ratio: 7,
  banner: { x: 24, y: 10, w: 1052, h: 44, tx: 550, ty: 33 },
  left: { x: 24, y: 68, w: 486, h: 244, titleX: 267, titleY: 94 },
  right: { x: 526, y: 68, w: 550, h: 244, titleX: 801, titleY: 94 },
  fullMatrix: { x: 76, y: 126, size: 148 },
  fullCopy: {
    axisLeftX: 55, axisLeftY: 200, axisBottomX: 150, axisBottomY: 292,
    textX: 300, lineOneY: 145, lineTwoY: 177, lineThreeY: 222
  },
  spatialMatrix: { x: 566, y: 133, size: 124 },
  spatialCopy: {
    titleX: 628, titleY: 116, axisLeftX: 548, axisLeftY: 195,
    axisBottomX: 628, axisBottomY: 274, formulaX: 628, formulaY: 296
  },
  arrow: {
    x1: 711, y1: 194, x2: 770, y2: 194, labelX: 715, labelY: 174,
    back: 13, half: 8
  },
  temporalMatrix: { x: 792, y: 151, size: 88 },
  temporalCopy: {
    titleX: 836, titleY: 134, axisLeftX: 777, axisLeftY: 195,
    axisBottomX: 836, axisBottomY: 256, formulaX: 836, formulaY: 281
  },
  total: {
    x: 906, y: 126, w: 146, h: 154, titleX: 979, titleY: 149,
    sumX: 979, sumOneY: 181, sumTwoY: 207, resultY: 239, ratioY: 263
  },
  compare: {
    x: 24, y: 326, w: 1052, h: 102, titleX: 40, titleY: 347,
    labelX: 40, barX: 205, fullY: 363, factorY: 397, barW: 590,
    barH: 18, valueGap: 15, fullTextY: 372, factorTextY: 406,
    badgeX: 845, badgeY: 381, badgeW: 207, badgeH: 34,
    badgeTextX: 948, badgeTextY: 398
  },
  fallback: { x: 550, y1: 202, y2: 236 }
});

const origin = DATA.origin;
const scale = DATA.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const NS = "http://www.w3.org/2000/svg";
  const root = document.getElementById("plot");
  const format = value => new Intl.NumberFormat("ru-RU").format(value);

  const make = (tag, attributes, content) => {
    const element = document.createElementNS(NS, tag);
    Object.entries(attributes).forEach(([name, value]) => {
      element.setAttribute(name, String(value));
    });
    if (content !== undefined) element.textContent = content;
    return element;
  };

  const addRect = (parent, x, y, width, height, className) => {
    const element = make("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x + width) - sx(x),
      height: sy(y + height) - sy(y),
      class: className
    });
    parent.append(element);
    return element;
  };

  const addLine = (parent, x1, y1, x2, y2, className) => {
    const element = make("line", {
      x1: sx(x1), y1: sy(y1), x2: sx(x2), y2: sy(y2), class: className
    });
    parent.append(element);
    return element;
  };

  const addText = (parent, x, y, content, className, anchor) => {
    const element = make("text", {
      x: sx(x), y: sy(y), class: className, "text-anchor": anchor
    }, content);
    parent.append(element);
    return element;
  };

  const addRotatedText = (parent, x, y, content, className) => {
    const element = addText(parent, x, y, content, className, "middle");
    element.setAttribute(
      "transform",
      `rotate(${DATA.angle} ${sx(x)} ${sy(y)})`
    );
    return element;
  };

  const addGrid = (parent, matrix, filledClass, diagonalOnly) => {
    const cell = matrix.size / DATA.frames;
    addRect(parent, matrix.x, matrix.y, matrix.size, matrix.size, "matrix-base");

    for (let row = DATA.zero; row < DATA.frames; row += DATA.one) {
      for (let column = DATA.zero; column < DATA.frames; column += DATA.one) {
        if (!diagonalOnly || row === column) {
          addRect(
            parent,
            matrix.x + column * cell,
            matrix.y + row * cell,
            cell,
            cell,
            filledClass
          );
        }
      }
    }

    for (let index = DATA.zero; index <= DATA.frames; index += DATA.one) {
      const offset = index * cell;
      addLine(
        parent,
        matrix.x + offset,
        matrix.y,
        matrix.x + offset,
        matrix.y + matrix.size,
        "grid-line"
      );
      addLine(
        parent,
        matrix.x,
        matrix.y + offset,
        matrix.x + matrix.size,
        matrix.y + offset,
        "grid-line"
      );
    }
  };

  const b = DATA.banner;
  addRect(root, b.x, b.y, b.w, b.h, "banner");
  addText(
    root, b.tx, b.ty,
    `${DATA.frames} кадров × ${DATA.patches} патчей = ${DATA.tokens} токенов`,
    "formula", "middle"
  );

  const left = DATA.left;
  addRect(root, left.x, left.y, left.w, left.h, "panel");
  addText(
    root, left.titleX, left.titleY,
    "Полное 3D-внимание", "section full-text", "middle"
  );

  addGrid(root, DATA.fullMatrix, "full-cell", false);
  const fc = DATA.fullCopy;
  addRotatedText(root, fc.axisLeftX, fc.axisLeftY, `${DATA.tokens} токенов`, "axis");
  addText(root, fc.axisBottomX, fc.axisBottomY, `${DATA.tokens} токенов`, "axis", "middle");
  addText(root, fc.textX, fc.lineOneY, "каждый токен ↔ каждый", "label", "start");
  addText(
    root, fc.textX, fc.lineTwoY,
    `${DATA.tokens} × ${DATA.tokens}`, "formula full-text", "start"
  );
  addText(
    root, fc.textX, fc.lineThreeY,
    `${DATA.tokens}² = ${format(DATA.fullPairs)} пар`,
    "large full-text", "start"
  );

  const right = DATA.right;
  addRect(root, right.x, right.y, right.w, right.h, "panel");
  addText(
    root, right.titleX, right.titleY,
    "Факторизованное внимание: два этапа", "section", "middle"
  );

  addGrid(root, DATA.spatialMatrix, "spatial-cell", true);
  const sc = DATA.spatialCopy;
  addText(root, sc.titleX, sc.titleY, "Пространство", "label spatial-text", "middle");
  addRotatedText(root, sc.axisLeftX, sc.axisLeftY, `${DATA.patches} патчей`, "axis");
  addText(root, sc.axisBottomX, sc.axisBottomY, `${DATA.patches} патчей`, "axis", "middle");
  addText(
    root, sc.formulaX, sc.formulaY,
    `${DATA.frames} × ${DATA.patches}² = ${format(DATA.spatialPairs)}`,
    "label spatial-text", "middle"
  );

  const a = DATA.arrow;
  addLine(root, a.x1, a.y1, a.x2, a.y2, "route");
  const arrowPoints = [
    `${sx(a.x2)},${sy(a.y2)}`,
    `${sx(a.x2 - a.back)},${sy(a.y2 - a.half)}`,
    `${sx(a.x2 - a.back)},${sy(a.y2 + a.half)}`
  ].join(" ");
  root.append(make("polygon", { points: arrowPoints, class: "arrow-head" }));
  addText(root, a.labelX, a.labelY, "затем", "small temporal-text", "start");

  addGrid(root, DATA.temporalMatrix, "temporal-cell", false);
  const tc = DATA.temporalCopy;
  addText(root, tc.titleX, tc.titleY, "Время", "label temporal-text", "middle");
  addRotatedText(root, tc.axisLeftX, tc.axisLeftY, `${DATA.frames} кадров`, "axis");
  addText(root, tc.axisBottomX, tc.axisBottomY, `${DATA.frames} кадров`, "axis", "middle");
  addText(
    root, tc.formulaX, tc.formulaY,
    `${DATA.patches} × ${DATA.frames}² = ${format(DATA.temporalPairs)}`,
    "label temporal-text", "middle"
  );

  const total = DATA.total;
  addRect(root, total.x, total.y, total.w, total.h, "total-box");
  addText(root, total.titleX, total.titleY, "Итого", "section good-text", "middle");
  addText(
    root, total.sumX, total.sumOneY,
    `${format(DATA.spatialPairs)} +`, "label", "middle"
  );
  addText(
    root, total.sumX, total.sumTwoY,
    `${format(DATA.temporalPairs)} =`, "label", "middle"
  );
  addText(
    root, total.sumX, total.resultY,
    `${format(DATA.factorPairs)} пар`, "formula good-text", "middle"
  );
  addText(
    root, total.sumX, total.ratioY,
    `≈ в ${DATA.ratio} раз меньше`, "small good-text", "middle"
  );

  const c = DATA.compare;
  addRect(root, c.x, c.y, c.w, c.h, "panel");
  addText(root, c.titleX, c.titleY, "Число допустимых пар", "section", "start");

  addText(root, c.labelX, c.fullTextY, "Полное", "label", "start");
  addRect(root, c.barX, c.fullY, c.barW, c.barH, "full-bar");
  addText(
    root,
    c.barX + c.barW + c.valueGap,
    c.fullTextY,
    format(DATA.fullPairs),
    "label full-text",
    "start"
  );

  const factorWidth = c.barW * DATA.factorPairs / DATA.fullPairs;
  addText(root, c.labelX, c.factorTextY, "Факторизованное", "label", "start");
  addRect(root, c.barX, c.factorY, factorWidth, c.barH, "factor-bar");
  addText(
    root,
    c.barX + factorWidth + c.valueGap,
    c.factorTextY,
    format(DATA.factorPairs),
    "label good-text",
    "start"
  );

  addRect(root, c.badgeX, c.badgeY, c.badgeW, c.badgeH, "total-box");
  addText(
    root, c.badgeTextX, c.badgeTextY,
    `примерно в ${DATA.ratio} раз меньше`,
    "label good-text", "middle"
  );
} catch (error) {
  const root = document.getElementById("plot");
  root.replaceChildren();
  const NS = "http://www.w3.org/2000/svg";
  const first = document.createElementNS(NS, "text");
  first.setAttribute("x", String(sx(DATA.fallback.x)));
  first.setAttribute("y", String(sy(DATA.fallback.y1)));
  first.setAttribute("text-anchor", "middle");
  first.setAttribute("class", "fallback");
  first.textContent = `${formatFallback(DATA.fullPairs)} пар полного внимания`;
  root.append(first);

  const second = document.createElementNS(NS, "text");
  second.setAttribute("x", String(sx(DATA.fallback.x)));
  second.setAttribute("y", String(sy(DATA.fallback.y2)));
  second.setAttribute("text-anchor", "middle");
  second.setAttribute("class", "fallback");
  second.textContent = `против ${formatFallback(DATA.factorPairs)} пар факторизованного`;
  root.append(second);

  function formatFallback(value) {
    return String(value).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
