<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Числовая и категориальная ветки предобработки</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --ink: #172033;
      --muted: #52637a;
      --flow: #65758b;
      --rule: #b9c5d4;
      --num-fill: #e6f0ff;
      --num-stroke: #316dc2;
      --cat-fill: #f6e9ff;
      --cat-stroke: #8951b2;
      --merge-fill: #fff1d6;
      --merge-stroke: #b87518;
      --out-fill: #e4f6ec;
      --out-stroke: #25845c;
      --model-fill: #d8f1e4;
      --model-stroke: #176947;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101722;
        --ink: #edf3fa;
        --muted: #afbdd0;
        --flow: #91a2b9;
        --rule: #435267;
        --num-fill: #172d4b;
        --num-stroke: #6ca7f2;
        --cat-fill: #342142;
        --cat-stroke: #c38de3;
        --merge-fill: #3b2b14;
        --merge-stroke: #e0a84e;
        --out-fill: #17372a;
        --out-stroke: #64c897;
        --model-fill: #164332;
        --model-stroke: #72d4a5;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure-title {
      color: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--bg);
    }

    .box {
      stroke-width: 2px;
    }

    .numeric {
      fill: var(--num-fill);
      stroke: var(--num-stroke);
    }

    .categorical {
      fill: var(--cat-fill);
      stroke: var(--cat-stroke);
    }

    .merge {
      fill: var(--merge-fill);
      stroke: var(--merge-stroke);
    }

    .output {
      fill: var(--out-fill);
      stroke: var(--out-stroke);
    }

    .model {
      fill: var(--model-fill);
      stroke: var(--model-stroke);
    }

    .flow {
      fill: none;
      stroke: var(--flow);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--flow);
      stroke: var(--flow);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .rule {
      stroke: var(--rule);
      stroke-width: 1px;
    }

    .branch-line {
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .num-line {
      stroke: var(--num-stroke);
    }

    .cat-line {
      stroke: var(--cat-stroke);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
      dominant-baseline: middle;
    }

    .section-label {
      font-size: 15px;
      font-weight: bold;
    }

    .column-label {
      font-size: 15px;
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    }

    .process-label {
      font-size: 15px;
      font-weight: bold;
    }

    .secondary-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      fill: var(--ink);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="figure-title" id="figure-title">
    Числовая и категориальная ветки предобработки
  </div>

  <svg
    id="diagram"
    viewBox="0 0 1100 345"
    width="1100"
    height="345"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="figure-title"
    aria-describedby="figure-description"
  >
    <desc id="figure-description">
      Числовые колонки age, income и score проходят медианное заполнение и
      масштабирование. Категориальные колонки city, gender и plan проходят
      заполнение самым частым значением и one-hot-кодирование. Затем ветки
      склеиваются перед моделью.
    </desc>
  </svg>

  <script>
    const diagram = {
      zero: 0,
      one: 1,
      background: { x1: -18, y1: -14, x2: 1082, y2: 331 },
      radius: { x: 10, y: 10 },
      sections: [
        {
          text: "ЧИСЛОВАЯ ВЕТКА",
          x: 40,
          y: 22,
          x1: 40,
          x2: 210,
          lineY: 32,
          lineClass: "branch-line num-line"
        },
        {
          text: "КАТЕГОРИАЛЬНАЯ ВЕТКА",
          x: 40,
          y: 188,
          x1: 40,
          x2: 210,
          lineY: 198,
          lineClass: "branch-line cat-line"
        }
      ],
      boxes: [
        { x1: 40, y1: 40, x2: 210, y2: 145, className: "box numeric" },
        { x1: 280, y1: 56, x2: 430, y2: 129, className: "box numeric" },
        { x1: 500, y1: 56, x2: 650, y2: 129, className: "box numeric" },

        { x1: 40, y1: 205, x2: 210, y2: 310, className: "box categorical" },
        { x1: 280, y1: 221, x2: 430, y2: 295, className: "box categorical" },
        { x1: 500, y1: 221, x2: 650, y2: 295, className: "box categorical" },

        { x1: 715, y1: 150, x2: 805, y2: 216, className: "box merge" },
        { x1: 840, y1: 150, x2: 955, y2: 216, className: "box output" },
        { x1: 990, y1: 160, x2: 1070, y2: 206, className: "box model" }
      ],
      rules: [
        { x1: 40, y1: 75, x2: 210, y2: 75 },
        { x1: 40, y1: 108, x2: 210, y2: 108 },
        { x1: 40, y1: 240, x2: 210, y2: 240 },
        { x1: 40, y1: 273, x2: 210, y2: 273 }
      ],
      routes: [
        {
          points: [[210, 92], [280, 92]],
          head: [[280, 92], [268, 86], [268, 98]]
        },
        {
          points: [[430, 92], [500, 92]],
          head: [[500, 92], [488, 86], [488, 98]]
        },
        {
          points: [[210, 258], [280, 258]],
          head: [[280, 258], [268, 252], [268, 264]]
        },
        {
          points: [[430, 258], [500, 258]],
          head: [[500, 258], [488, 252], [488, 264]]
        },
        {
          points: [[650, 92], [680, 92], [680, 168], [715, 168]],
          head: [[715, 168], [703, 162], [703, 174]]
        },
        {
          points: [[650, 258], [690, 258], [690, 198], [715, 198]],
          head: [[715, 198], [703, 192], [703, 204]]
        },
        {
          points: [[805, 183], [840, 183]],
          head: [[840, 183], [828, 177], [828, 189]]
        },
        {
          points: [[955, 183], [990, 183]],
          head: [[990, 183], [978, 177], [978, 189]]
        }
      ],
      labels: [
        { text: "age", x: 125, y: 64, anchor: "middle", className: "column-label" },
        { text: "income", x: 125, y: 97, anchor: "middle", className: "column-label" },
        { text: "score", x: 125, y: 130, anchor: "middle", className: "column-label" },

        { text: "Медианное", x: 355, y: 82, anchor: "middle", className: "process-label" },
        { text: "заполнение", x: 355, y: 108, anchor: "middle", className: "secondary-label" },

        { text: "Приведение", x: 575, y: 82, anchor: "middle", className: "process-label" },
        { text: "к одному масштабу", x: 575, y: 108, anchor: "middle", className: "secondary-label" },

        { text: "city", x: 125, y: 229, anchor: "middle", className: "column-label" },
        { text: "gender", x: 125, y: 262, anchor: "middle", className: "column-label" },
        { text: "plan", x: 125, y: 295, anchor: "middle", className: "column-label" },

        { text: "Заполнение", x: 355, y: 247, anchor: "middle", className: "process-label" },
        { text: "самым частым", x: 355, y: 273, anchor: "middle", className: "secondary-label" },

        { text: "Разложение", x: 575, y: 247, anchor: "middle", className: "process-label" },
        { text: "в индикаторы 0/1", x: 575, y: 273, anchor: "middle", className: "secondary-label" },

        { text: "Склейка", x: 760, y: 170, anchor: "middle", className: "process-label" },
        { text: "по строкам", x: 760, y: 196, anchor: "middle", className: "secondary-label" },

        { text: "Единая числовая", x: 897, y: 170, anchor: "middle", className: "process-label" },
        { text: "таблица признаков", x: 897, y: 196, anchor: "middle", className: "secondary-label" },

        { text: "Модель", x: 1030, y: 183, anchor: "middle", className: "process-label" }
      ],
      fallback: [
        { text: "Не удалось построить схему.", x: 550, y: 115 },
        { text: "age, income, score → медиана → масштабирование", x: 550, y: 165 },
        { text: "city, gender, plan → частое значение → one-hot", x: 550, y: 205 },
        { text: "Обе ветки склеиваются перед моделью.", x: 550, y: 255 }
      ]
    };

    const origin = { x: 18, y: 14 };
    const scale = 1;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const svg = document.getElementById("diagram");
    const namespace = "http://www.w3.org/2000/svg";

    const make = (name, attributes, text) => {
      const node = document.createElementNS(namespace, name);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      if (text !== undefined) {
        node.textContent = text;
      }
      return node;
    };

    const pathData = points =>
      points
        .map((point, index) => {
          const command = index === diagram.zero ? "M" : "L";
          return `${command} ${sx(point[diagram.zero])} ${sy(point[diagram.one])}`;
        })
        .join(" ");

    const polygonData = points =>
      points
        .map(point => `${sx(point[diagram.zero])},${sy(point[diagram.one])}`)
        .join(" ");

    try {
      const background = make("rect", {
        x: sx(diagram.background.x1),
        y: sy(diagram.background.y1),
        width: sx(diagram.background.x2) - sx(diagram.background.x1),
        height: sy(diagram.background.y2) - sy(diagram.background.y1),
        fill: "var(--bg)"
      });
      svg.appendChild(background);

      const routeLayer = make("g", { "aria-hidden": "true" });

      diagram.routes.forEach(route => {
        routeLayer.appendChild(
          make("path", {
            d: pathData(route.points),
            class: "flow"
          })
        );
        routeLayer.appendChild(
          make("polygon", {
            points: polygonData(route.head),
            class: "arrow-head"
          })
        );
      });

      svg.appendChild(routeLayer);

      const boxLayer = make("g", { "aria-hidden": "true" });

      diagram.boxes.forEach(box => {
        boxLayer.appendChild(
          make("rect", {
            x: sx(box.x1),
            y: sy(box.y1),
            width: sx(box.x2) - sx(box.x1),
            height: sy(box.y2) - sy(box.y1),
            rx: sx(diagram.radius.x) - sx(diagram.zero),
            ry: sy(diagram.radius.y) - sy(diagram.zero),
            class: box.className
          })
        );
      });

      diagram.rules.forEach(rule => {
        boxLayer.appendChild(
          make("line", {
            x1: sx(rule.x1),
            y1: sy(rule.y1),
            x2: sx(rule.x2),
            y2: sy(rule.y2),
            class: "rule"
          })
        );
      });

      diagram.sections.forEach(section => {
        boxLayer.appendChild(
          make("line", {
            x1: sx(section.x1),
            y1: sy(section.lineY),
            x2: sx(section.x2),
            y2: sy(section.lineY),
            class: section.lineClass
          })
        );
      });

      svg.appendChild(boxLayer);

      const textLayer = make("g", {});

      diagram.sections.forEach(section => {
        textLayer.appendChild(
          make(
            "text",
            {
              x: sx(section.x),
              y: sy(section.y),
              "text-anchor": "start",
              class: "section-label"
            },
            section.text
          )
        );
      });

      diagram.labels.forEach(label => {
        textLayer.appendChild(
          make(
            "text",
            {
              x: sx(label.x),
              y: sy(label.y),
              "text-anchor": label.anchor,
              class: label.className
            },
            label.text
          )
        );
      });

      svg.appendChild(textLayer);
    } catch (error) {
      svg.replaceChildren();

      diagram.fallback.forEach(line => {
        svg.appendChild(
          make(
            "text",
            {
              x: sx(line.x),
              y: sy(line.y),
              "text-anchor": "middle",
              class: "fallback"
            },
            line.text
          )
        );
      });
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
