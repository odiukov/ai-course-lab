<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь от исследовательского ноутбука до деплоя</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-red: #fff0f1;
      --surface-blue: #eef5ff;
      --surface-amber: #fff7e7;
      --surface-green: #eaf8f1;
      --text: #172437;
      --muted: #586a80;
      --line: #8499b2;
      --line-soft: #c9d4e0;
      --blue: #2868c7;
      --red: #c64d59;
      --amber: #bc7815;
      --green: #24815c;
      --fallback: #8d2d39;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101722;
        --surface: #182332;
        --surface-red: #352127;
        --surface-blue: #192d48;
        --surface-amber: #352b1c;
        --surface-green: #17362d;
        --text: #eef4fa;
        --muted: #b4c1cf;
        --line: #8295aa;
        --line-soft: #405166;
        --blue: #72a8f5;
        --red: #f08089;
        --amber: #efb85f;
        --green: #6ed0a2;
        --fallback: #ff9ca5;
      }
    }

    html,
    body {
      background: var(--bg);
      color: var(--text);
      font-family:
        system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    #diagram {
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--line-soft);
    }

    #diagram-title {
      padding: 14px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--line-soft);
      color: var(--text);
      font-size: 19px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--bg);
      shape-rendering: geometricPrecision;
    }

    .rail,
    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    .rail {
      stroke: var(--blue);
    }

    .arrow-head {
      fill: var(--line);
      stroke: none;
    }

    .rail-head {
      fill: var(--blue);
      stroke: none;
    }

    .card {
      stroke: var(--line-soft);
      stroke-width: 2;
    }

    .card-start {
      fill: var(--surface-red);
      stroke: var(--red);
    }

    .card-build {
      fill: var(--surface-blue);
      stroke: var(--blue);
    }

    .card-gate {
      fill: var(--surface-amber);
      stroke: var(--amber);
    }

    .card-finish {
      fill: var(--surface-green);
      stroke: var(--green);
    }

    .accent-start {
      fill: var(--red);
    }

    .accent-build {
      fill: var(--blue);
    }

    .accent-gate {
      fill: var(--amber);
    }

    .accent-finish {
      fill: var(--green);
    }

    .divider {
      fill: none;
      stroke: var(--line-soft);
      stroke-width: 1;
    }

    .stage-title {
      fill: var(--text);
      font-size: 17px;
      font-weight: bold;
    }

    .detail {
      fill: var(--muted);
      font-size: 13px;
    }

    .outcome-label {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    .outcome {
      fill: var(--text);
      font-size: 13px;
      font-weight: bold;
    }

    .rail-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .footer {
      fill: var(--text);
      font-size: 15px;
      font-weight: bold;
    }

    .footer-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      fill: var(--fallback);
      font-size: 16px;
      font-weight: bold;
    }

    noscript {
      display: block;
      padding: 16px;
      color: var(--fallback);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <section id="diagram" aria-labelledby="diagram-title">
    <header id="diagram-title">
      Путь от исследовательского ноутбука до деплоя
    </header>

    <svg
      id="pipeline-map"
      viewBox="0 0 1440 400"
      width="1440"
      height="400"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">
        Восемь последовательных стадий от ноутбука до деплоя
      </title>
      <desc id="svg-description">
        Ноутбук превращается в функции, пайплайн, конфиг,
        отслеживаемый эксперимент, проверенные данные, протестированный
        артефакт и развёрнутый сервис.
      </desc>
    </svg>

    <noscript>
      Схема должна была показать путь: ноутбук → функции → пайплайн →
      конфиг → трекинг экспериментов → проверка данных → тесты → деплой.
    </noscript>
  </section>

  <script>
    const DIAGRAM = Object.freeze([
      {
        kind: "geometry",
        zero: 0,
        unit: 1,
        cardY: 72,
        cardW: 142,
        cardH: 212,
        accentH: 8,
        titleY: 112,
        firstDividerY: 137,
        detailY: 169,
        secondDividerY: 220,
        outcomeLabelY: 244,
        outcomeY: 268,
        connectorY: 178,
        connectorPad: 5,
        arrowBack: 10,
        arrowWing: 6,
        railStart: 0,
        railEnd: 1360,
        railY: 36,
        railLabelY: 10,
        railArrowBack: 16,
        railArrowWing: 8,
        footerY: 326,
        footerNoteY: 351,
        centerX: 680,
        labelPad: 10,
        fallbackX: 680,
        fallbackY: 172,
        fallbackLineGap: 25,
        fallback: [
          {
            text: "Схема должна была показать путь от ноутбука",
            dy: 0
          },
          {
            text: "через функции, проверки и тесты к деплою.",
            dy: 25
          }
        ]
      },
      {
        x: 0,
        cardClass: "card-start",
        accentClass: "accent-start",
        title: [
          { text: "Ноутбук", dy: 0 }
        ],
        detail: [
          { text: "идеи · графики", dy: -9 },
          { text: "хорошая метрика", dy: 9 }
        ],
        outcome: [
          { text: "порядок ячеек", dy: 0 }
        ]
      },
      {
        x: 174,
        cardClass: "card-build",
        accentClass: "accent-build",
        title: [
          { text: "Функции", dy: 0 }
        ],
        detail: [
          { text: "загрузка · признаки", dy: -9 },
          { text: "обучение · оценка", dy: 9 }
        ],
        outcome: [
          { text: "границы шагов", dy: 0 }
        ]
      },
      {
        x: 348,
        cardClass: "card-build",
        accentClass: "accent-build",
        title: [
          { text: "Пайплайн", dy: 0 }
        ],
        detail: [
          { text: "преобразования", dy: -9 },
          { text: "и модель вместе", dy: 9 }
        ],
        outcome: [
          { text: "единая цепочка", dy: 0 }
        ]
      },
      {
        x: 522,
        cardClass: "card-build",
        accentClass: "accent-build",
        title: [
          { text: "Конфиг", dy: 0 }
        ],
        detail: [
          { text: "YAML или JSON", dy: -9 },
          { text: "настройки запуска", dy: 9 }
        ],
        outcome: [
          { text: "параметры", dy: 0 }
        ]
      },
      {
        x: 696,
        cardClass: "card-build",
        accentClass: "accent-build",
        title: [
          { text: "Трекинг", dy: -9 },
          { text: "экспериментов", dy: 9 }
        ],
        detail: [
          { text: "настройки · метрики", dy: -9 },
          { text: "модель запуска", dy: 9 }
        ],
        outcome: [
          { text: "история запусков", dy: 0 }
        ]
      },
      {
        x: 870,
        cardClass: "card-gate",
        accentClass: "accent-gate",
        title: [
          { text: "Проверка", dy: -9 },
          { text: "данных", dy: 9 }
        ],
        detail: [
          { text: "схема · пропуски", dy: -9 },
          { text: "распределения", dy: 9 }
        ],
        outcome: [
          { text: "версия данных", dy: 0 }
        ]
      },
      {
        x: 1044,
        cardClass: "card-gate",
        accentClass: "accent-gate",
        title: [
          { text: "Тесты", dy: 0 }
        ],
        detail: [
          { text: "юнит-проверки", dy: -9 },
          { text: "интеграция цепочки", dy: 9 }
        ],
        outcome: [
          { text: "ворота качества", dy: 0 }
        ]
      },
      {
        x: 1218,
        cardClass: "card-finish",
        accentClass: "accent-finish",
        title: [
          { text: "Деплой", dy: 0 }
        ],
        detail: [
          { text: "сериализация · API", dy: -9 },
          { text: "контейнер", dy: 9 }
        ],
        outcome: [
          { text: "готовый сервис", dy: 0 }
        ]
      }
    ]);

    const origin = Object.freeze({ x: 40, y: 28 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("pipeline-map");
    const [g, ...stages] = DIAGRAM;
    const SVG_NS = "http://www.w3.org/2000/svg";

    function svgElement(name, attributes) {
      const element = document.createElementNS(SVG_NS, name);
      for (const [key, value] of Object.entries(attributes)) {
        element.setAttribute(key, String(value));
      }
      return element;
    }

    function addLine(parent, x1, y1, x2, y2, className) {
      parent.appendChild(svgElement("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));
    }

    function addRect(parent, x, y, width, height, className) {
      parent.appendChild(svgElement("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        class: className
      }));
    }

    function addArrow(parent, fromX, toX, y, className, headClass, back, wing) {
      addLine(parent, fromX, y, toX, y, className);

      const points = [
        `${sx(toX)},${sy(y)}`,
        `${sx(toX - back)},${sy(y - wing)}`,
        `${sx(toX - back)},${sy(y + wing)}`
      ].join(" ");

      parent.appendChild(svgElement("polygon", {
        points: points,
        class: headClass
      }));
    }

    function addText(parent, x, y, lines, className, anchor) {
      const text = svgElement("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      });

      for (const line of lines) {
        const tspan = svgElement("tspan", {
          x: sx(x),
          y: sy(y + line.dy)
        });
        tspan.textContent = line.text;
        text.appendChild(tspan);
      }

      parent.appendChild(text);
    }

    function drawRail(parent) {
      addText(
        parent,
        g.railStart,
        g.railLabelY,
        [{ text: "СКРЫТЫЕ ЗАВИСИМОСТИ", dy: g.zero }],
        "rail-label",
        "start"
      );

      addText(
        parent,
        g.railEnd,
        g.railLabelY,
        [{ text: "ВОСПРОИЗВОДИМЫЙ АРТЕФАКТ", dy: g.zero }],
        "rail-label",
        "end"
      );

      addArrow(
        parent,
        g.railStart,
        g.railEnd,
        g.railY,
        "rail",
        "rail-head",
        g.railArrowBack,
        g.railArrowWing
      );
    }

    function drawConnectors(parent) {
      for (const stage of stages.slice(g.unit)) {
        const currentIndex = stages.indexOf(stage);
        const previous = stages[currentIndex - g.unit];

        addArrow(
          parent,
          previous.x + g.cardW + g.connectorPad,
          stage.x - g.connectorPad,
          g.connectorY,
          "connector",
          "arrow-head",
          g.arrowBack,
          g.arrowWing
        );
      }
    }

    function drawCard(parent, stage) {
      addRect(
        parent,
        stage.x,
        g.cardY,
        g.cardW,
        g.cardH,
        `card ${stage.cardClass}`
      );

      addRect(
        parent,
        stage.x,
        g.cardY,
        g.cardW,
        g.accentH,
        stage.accentClass
      );

      const cardCenter = stage.x + g.cardW / (g.unit + g.unit);

      addText(
        parent,
        cardCenter,
        g.titleY,
        stage.title,
        "stage-title",
        "middle"
      );

      addLine(
        parent,
        stage.x + g.labelPad,
        g.firstDividerY,
        stage.x + g.cardW - g.labelPad,
        g.firstDividerY,
        "divider"
      );

      addText(
        parent,
        cardCenter,
        g.detailY,
        stage.detail,
        "detail",
        "middle"
      );

      addLine(
        parent,
        stage.x + g.labelPad,
        g.secondDividerY,
        stage.x + g.cardW - g.labelPad,
        g.secondDividerY,
        "divider"
      );

      addText(
        parent,
        cardCenter,
        g.outcomeLabelY,
        [{ text: "СТАНОВИТСЯ ЯВНЫМ", dy: g.zero }],
        "outcome-label",
        "middle"
      );

      addText(
        parent,
        cardCenter,
        g.outcomeY,
        stage.outcome,
        "outcome",
        "middle"
      );
    }

    function drawFooter(parent) {
      addText(
        parent,
        g.centerX,
        g.footerY,
        [{
          text: "Не прыжок в продакшен, а последовательное устранение скрытых зависимостей",
          dy: g.zero
        }],
        "footer",
        "middle"
      );

      addText(
        parent,
        g.centerX,
        g.footerNoteY,
        [{
          text: "Ноутбук остаётся местом для идей; повторяемый маршрут становится сервисом.",
          dy: g.zero
        }],
        "footer-note",
        "middle"
      );
    }

    function render() {
      const railLayer = svgElement("g", { "aria-hidden": "true" });
      const connectorLayer = svgElement("g", { "aria-hidden": "true" });
      const cardLayer = svgElement("g", { "aria-hidden": "true" });
      const footerLayer = svgElement("g", { "aria-hidden": "true" });

      drawRail(railLayer);
      drawConnectors(connectorLayer);

      for (const stage of stages) {
        drawCard(cardLayer, stage);
      }

      drawFooter(footerLayer);

      svg.appendChild(railLayer);
      svg.appendChild(connectorLayer);
      svg.appendChild(cardLayer);
      svg.appendChild(footerLayer);
    }

    try {
      render();
    } catch (error) {
      svg.replaceChildren();

      const fallbackTitle = svgElement("title", {});
      fallbackTitle.textContent =
        "Не удалось построить схему пути от ноутбука до деплоя";
      svg.appendChild(fallbackTitle);

      addText(
        svg,
        g.fallbackX,
        g.fallbackY,
        g.fallback,
        "fallback",
        "middle"
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
