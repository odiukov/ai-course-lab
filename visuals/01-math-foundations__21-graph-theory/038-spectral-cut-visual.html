<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Спектральный разрез через слабое ребро</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: snow;
      --panel: ivory;
      --ink: midnightblue;
      --muted: slategray;
      --edge: lightslategray;
      --left-fill: aliceblue;
      --left-node: royalblue;
      --left-text: white;
      --right-fill: mistyrose;
      --right-node: firebrick;
      --right-text: white;
      --bridge: darkorange;
      --cut: mediumvioletred;
      --outline: steelblue;
      --note: darkslategray;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #172033;
        --ink: #eef4ff;
        --muted: #b8c4d8;
        --edge: #8fa0b8;
        --left-fill: #172e4f;
        --left-node: #69a9ff;
        --left-text: #07121f;
        --right-fill: #4a222d;
        --right-node: #ff8c8c;
        --right-text: #241012;
        --bridge: #ffb347;
        --cut: #ff70bd;
        --outline: #7387a5;
        --note: #d9e2f2;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      background: var(--panel);
      border: 1.5px solid var(--outline);
      overflow: hidden;
    }

    h2 {
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 410px;
      background: var(--panel);
    }

    .zone {
      stroke: var(--outline);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .zone-left {
      fill: var(--left-fill);
    }

    .zone-right {
      fill: var(--right-fill);
    }

    .inner-edge {
      fill: none;
      stroke: var(--edge);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .bridge-underlay {
      fill: none;
      stroke: var(--panel);
      stroke-width: 9;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .bridge {
      fill: none;
      stroke: var(--bridge);
      stroke-width: 5;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .cut-line {
      fill: none;
      stroke: var(--cut);
      stroke-width: 3;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .node {
      stroke: var(--panel);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .node-left {
      fill: var(--left-node);
    }

    .node-right {
      fill: var(--right-node);
    }

    .node-name {
      font-size: 17px;
      font-weight: bold;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .node-name-left {
      fill: var(--left-text);
    }

    .node-name-right {
      fill: var(--right-text);
    }

    .cluster-label {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .value-label {
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
    }

    .value-positive {
      fill: var(--left-node);
    }

    .value-negative {
      fill: var(--right-node);
    }

    .bridge-label {
      fill: var(--bridge);
      font-size: 16px;
      font-weight: bold;
      paint-order: stroke fill;
      stroke: var(--panel);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .cut-label {
      fill: var(--cut);
      font-size: 15px;
      font-weight: bold;
      paint-order: stroke fill;
      stroke: var(--panel);
      stroke-width: 5;
      stroke-linejoin: round;
    }

    .caption {
      fill: var(--note);
      font-size: 15px;
      text-anchor: middle;
    }

    .caption-strong {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
    }

    #fallback {
      color: var(--ink);
      font-size: 16px;
      text-align: center;
    }

    [hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Спектральный разрез через слабое ребро</h2>

    <svg
      id="diagram"
      viewBox="0 0 920 410"
      width="920"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
    >
      <desc id="diagram-desc">
        Две плотные тройки узлов соединены одним мостом. Под узлами слева
        стоят положительные знаки вектора Фидлера, а справа — отрицательные.
        Граница спектрального разреза проходит через единственное ребро.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden>
      Схема должна показать две плотные тройки узлов, соединённые одним
      слабым ребром: значения вектора Фидлера слева положительны, справа
      отрицательны, поэтому граница проходит через мост.
    </p>
  </figure>

  <script>
    const data = Object.freeze([
      { x: 50, y: 34 },
      { x: 65, y: 65 },
      {
        zero: 0,
        bounds: { x: -0.4, y: -0.18, w: 13.2, h: 5.72 },
        zones: [
          {
            x: 0.45,
            y: 0.18,
            w: 4.55,
            h: 4.02,
            rx: 0.24,
            className: "zone zone-left"
          },
          {
            x: 7.6,
            y: 0.18,
            w: 4.55,
            h: 4.02,
            rx: 0.24,
            className: "zone zone-right"
          }
        ],
        nodes: [
          {
            id: "а",
            x: 1.18,
            y: 2.42,
            r: 0.34,
            side: "left",
            sign: "+",
            signX: 1.18,
            signY: 3.24
          },
          {
            id: "б",
            x: 2.72,
            y: 2.42,
            r: 0.34,
            side: "left",
            sign: "+",
            signX: 2.72,
            signY: 3.24
          },
          {
            id: "в",
            x: 4.26,
            y: 2.42,
            r: 0.34,
            side: "left",
            sign: "+",
            signX: 4.26,
            signY: 3.24
          },
          {
            id: "г",
            x: 8.34,
            y: 2.42,
            r: 0.34,
            side: "right",
            sign: "−",
            signX: 8.34,
            signY: 3.24
          },
          {
            id: "д",
            x: 9.88,
            y: 2.42,
            r: 0.34,
            side: "right",
            sign: "−",
            signX: 9.88,
            signY: 3.24
          },
          {
            id: "е",
            x: 11.42,
            y: 2.42,
            r: 0.34,
            side: "right",
            sign: "−",
            signX: 11.42,
            signY: 3.24
          }
        ],
        straightEdges: [
          { x1: 1.18, y1: 2.42, x2: 2.72, y2: 2.42 },
          { x1: 2.72, y1: 2.42, x2: 4.26, y2: 2.42 },
          { x1: 8.34, y1: 2.42, x2: 9.88, y2: 2.42 },
          { x1: 9.88, y1: 2.42, x2: 11.42, y2: 2.42 }
        ],
        curvedEdges: [
          {
            x1: 1.18,
            y1: 2.42,
            cx: 2.72,
            cy: 1.12,
            x2: 4.26,
            y2: 2.42
          },
          {
            x1: 8.34,
            y1: 2.42,
            cx: 9.88,
            cy: 1.12,
            x2: 11.42,
            y2: 2.42
          }
        ],
        bridge: { x1: 4.26, y1: 2.42, x2: 8.34, y2: 2.42 },
        cut: {
          x1: 6.3,
          y1: 1.34,
          x2: 6.3,
          y2: 3.62,
          dash: [0.11, 0.1]
        },
        labels: [
          {
            text: "Плотная часть: положительный знак",
            x: 2.72,
            y: 0.63,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "cluster-label"
          },
          {
            text: "Плотная часть: отрицательный знак",
            x: 9.88,
            y: 0.63,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "cluster-label"
          },
          {
            text: "одно ребро без запасного пути",
            x: 6.08,
            y: 1.02,
            dx: -8,
            dy: 0,
            anchor: "end",
            className: "bridge-label"
          },
          {
            text: "граница по знаку",
            x: 6.52,
            y: 1.48,
            dx: 8,
            dy: 0,
            anchor: "start",
            className: "cut-label"
          },
          {
            text: "Значения вектора Фидлера под узлами",
            x: 6.3,
            y: 4.62,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "caption-strong"
          },
          {
            text: "Внутри групп значения близки; переход от плюса к минусу оплачивается только на мосту.",
            x: 6.3,
            y: 4.98,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "caption"
          },
          {
            text: "Граница внутри плотной части пересекла бы сразу несколько рёбер.",
            x: 6.3,
            y: 5.29,
            dx: 0,
            dy: 0,
            anchor: "middle",
            className: "caption"
          }
        ]
      }
    ]);

    const [origin, scale, scene] = data;
    Object.freeze(origin);
    Object.freeze(scale);

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svgNamespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      const make = (tag, attributes, text) => {
        const element = document.createElementNS(svgNamespace, tag);

        Object.entries(attributes).forEach(([name, value]) => {
          element.setAttribute(name, String(value));
        });

        if (text !== undefined) {
          element.textContent = text;
        }

        return element;
      };

      const background = make("rect", {
        x: sx(scene.bounds.x),
        y: sy(scene.bounds.y),
        width:
          sx(scene.bounds.x + scene.bounds.w) -
          sx(scene.bounds.x),
        height:
          sy(scene.bounds.y + scene.bounds.h) -
          sy(scene.bounds.y),
        fill: "var(--panel)"
      });
      drawing.appendChild(background);

      scene.zones.forEach((zone) => {
        drawing.appendChild(
          make("rect", {
            x: sx(zone.x),
            y: sy(zone.y),
            width: sx(zone.x + zone.w) - sx(zone.x),
            height: sy(zone.y + zone.h) - sy(zone.y),
            rx: Math.abs(sx(zone.rx) - sx(scene.zero)),
            class: zone.className
          })
        );
      });

      scene.straightEdges.forEach((edge) => {
        drawing.appendChild(
          make("line", {
            x1: sx(edge.x1),
            y1: sy(edge.y1),
            x2: sx(edge.x2),
            y2: sy(edge.y2),
            class: "inner-edge"
          })
        );
      });

      scene.curvedEdges.forEach((edge) => {
        drawing.appendChild(
          make("path", {
            d:
              "M " +
              sx(edge.x1) +
              " " +
              sy(edge.y1) +
              " Q " +
              sx(edge.cx) +
              " " +
              sy(edge.cy) +
              " " +
              sx(edge.x2) +
              " " +
              sy(edge.y2),
            class: "inner-edge"
          })
        );
      });

      drawing.appendChild(
        make("line", {
          x1: sx(scene.bridge.x1),
          y1: sy(scene.bridge.y1),
          x2: sx(scene.bridge.x2),
          y2: sy(scene.bridge.y2),
          class: "bridge-underlay"
        })
      );

      drawing.appendChild(
        make("line", {
          x1: sx(scene.bridge.x1),
          y1: sy(scene.bridge.y1),
          x2: sx(scene.bridge.x2),
          y2: sy(scene.bridge.y2),
          class: "bridge"
        })
      );

      drawing.appendChild(
        make("line", {
          x1: sx(scene.cut.x1),
          y1: sy(scene.cut.y1),
          x2: sx(scene.cut.x2),
          y2: sy(scene.cut.y2),
          "stroke-dasharray":
            Math.abs(sx(scene.cut.dash[scene.zero]) - sx(scene.zero)) +
            " " +
            Math.abs(sx(scene.cut.dash.at(-scene.cut.dash.length)) - sx(scene.zero)),
          class: "cut-line"
        })
      );

      scene.nodes.forEach((node) => {
        const nodeClass =
          node.side === "left" ? "node node-left" : "node node-right";
        const nameClass =
          node.side === "left"
            ? "node-name node-name-left"
            : "node-name node-name-right";
        const valueClass =
          node.side === "left"
            ? "value-label value-positive"
            : "value-label value-negative";

        drawing.appendChild(
          make("circle", {
            cx: sx(node.x),
            cy: sy(node.y),
            r: Math.abs(sx(node.r) - sx(scene.zero)),
            class: nodeClass
          })
        );

        drawing.appendChild(
          make(
            "text",
            {
              x: sx(node.x),
              y: sy(node.y),
              class: nameClass
            },
            node.id
          )
        );

        drawing.appendChild(
          make(
            "text",
            {
              x: sx(node.signX),
              y: sy(node.signY),
              class: valueClass
            },
            "f: " + node.sign
          )
        );
      });

      scene.labels.forEach((label) => {
        drawing.appendChild(
          make(
            "text",
            {
              x: sx(label.x) + label.dx,
              y: sy(label.y) + label.dy,
              "text-anchor": label.anchor,
              class: label.className
            },
            label.text
          )
        );
      });

      fallback.hidden = true;
    } catch (error) {
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      if (drawing) {
        drawing.replaceChildren();
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
