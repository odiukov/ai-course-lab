<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Четыре сочетания направления и веса</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: whitesmoke;
      color: darkslategray;
    }

    body {
      background: whitesmoke;
      color: darkslategray;
    }

    main {
      background: white;
    }

    h1 {
      font-size: 20px;
      text-align: center;
      color: darkslategray;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: white;
    }

    .panel {
      fill: aliceblue;
      stroke: lightslategray;
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .panel-title {
      fill: darkslategray;
      font-size: 16px;
      font-weight: bold;
    }

    .panel-subtitle {
      fill: slategray;
      font-size: 13px;
    }

    .edge {
      fill: none;
      stroke: royalblue;
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .arrowhead {
      fill: royalblue;
      stroke: royalblue;
      stroke-width: 2px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .node {
      fill: white;
      stroke: royalblue;
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .node-label {
      fill: darkslategray;
      font-size: 15px;
      font-weight: bold;
    }

    .weight {
      fill: darkslategray;
      stroke: aliceblue;
      stroke-width: 5px;
      paint-order: stroke fill;
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      font-size: 16px;
      color: darkslategray;
      background: white;
    }

    .fallback[hidden] {
      display: none;
    }

    @media (prefers-color-scheme: dark) {
      :root,
      body {
        background: black;
        color: whitesmoke;
      }

      main,
      svg,
      .fallback {
        background: darkslategray;
        color: whitesmoke;
      }

      h1,
      .panel-title,
      .node-label,
      .weight {
        color: whitesmoke;
        fill: whitesmoke;
      }

      .panel {
        fill: midnightblue;
        stroke: lightslategray;
      }

      .panel-subtitle {
        fill: lightgray;
      }

      .edge {
        stroke: lightskyblue;
      }

      .arrowhead {
        fill: lightskyblue;
        stroke: lightskyblue;
      }

      .node {
        fill: darkslategray;
        stroke: lightskyblue;
      }

      .weight {
        stroke: midnightblue;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Четыре сочетания направления и веса</h1>

    <svg
      id="diagram"
      viewBox="0 0 960 440"
      width="960"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Четыре мини-графа показывают независимые сочетания направления и веса.
        На взвешенных рёбрах указаны веса 2 и 5.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden></p>
  </main>

  <script>
    const diagramData = [
      {
        canvas: [960, 440],
        origin: [0, 0],
        scale: 1,
        panelSize: [440, 204],
        panelTitle: [20, 28],
        panelSubtitle: [20, 52],
        nodes: [
          { id: "a", label: "А", point: [95, 116] },
          { id: "b", label: "Б", point: [345, 116] },
          { id: "c", label: "В", point: [220, 172] }
        ],
        edges: [
          {
            from: "a",
            to: "b",
            weight: "2",
            labelPoint: [220, 116],
            labelSide: "above"
          },
          {
            from: "b",
            to: "c",
            weight: "5",
            labelPoint: [282.5, 144],
            labelSide: "right"
          }
        ],
        nodeRadius: 18,
        arrowLength: 14,
        arrowHalfWidth: 7,
        labelPadding: 10
      },
      {
        position: [20, 8],
        title: "Неориентированный, невзвешенный",
        subtitle: "направление: нет · вес: нет",
        directed: false,
        weighted: false
      },
      {
        position: [500, 8],
        title: "Ориентированный, невзвешенный",
        subtitle: "направление: есть · вес: нет",
        directed: true,
        weighted: false
      },
      {
        position: [20, 228],
        title: "Неориентированный, взвешенный",
        subtitle: "направление: нет · вес: есть",
        directed: false,
        weighted: true
      },
      {
        position: [500, 228],
        title: "Ориентированный, взвешенный",
        subtitle: "направление: есть · вес: есть",
        directed: true,
        weighted: true
      }
    ];

    const [settings, ...panels] = diagramData;
    const [originX, originY] = settings.origin;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = settings.scale;

    const sx = (x) => origin.x + x * scale;
    const sy = (y) => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const [panelWidth, panelHeight] = settings.panelSize;
      const [titleX, titleY] = settings.panelTitle;
      const [subtitleX, subtitleY] = settings.panelSubtitle;
      const radius = settings.nodeRadius;
      const arrowLength = settings.arrowLength;
      const arrowHalfWidth = settings.arrowHalfWidth;
      const labelPadding = settings.labelPadding;

      const makeElement = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);

        for (const [attribute, value] of Object.entries(attributes)) {
          if (value !== undefined && value !== null) {
            element.setAttribute(attribute, String(value));
          }
        }

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      };

      const translatedPoint = (pair, panelPosition) => {
        const [x, y] = pair;
        const [panelX, panelY] = panelPosition;
        return { x: panelX + x, y: panelY + y };
      };

      const pointList = (points) =>
        points.map((point) => `${sx(point.x)},${sy(point.y)}`).join(" ");

      const appendText = (
        parent,
        point,
        content,
        className,
        textAnchor,
        side
      ) => {
        let dx;
        let dy;

        if (side === "left") {
          dx = -labelPadding;
        } else if (side === "right") {
          dx = labelPadding;
        } else if (side === "above") {
          dy = -labelPadding;
        } else if (side === "below") {
          dy = labelPadding;
        }

        parent.appendChild(
          makeElement(
            "text",
            {
              x: sx(point.x),
              y: sy(point.y),
              dx,
              dy,
              class: className,
              "text-anchor": textAnchor,
              "dominant-baseline": "middle"
            },
            content
          )
        );
      };

      const edgeGeometry = (source, target) => {
        const deltaX = target.x - source.x;
        const deltaY = target.y - source.y;
        const length = Math.hypot(deltaX, deltaY);

        if (!Number.isFinite(length) || !length) {
          throw new Error("Некорректное ребро");
        }

        const unitX = deltaX / length;
        const unitY = deltaY / length;
        const start = {
          x: source.x + unitX * radius,
          y: source.y + unitY * radius
        };
        const tip = {
          x: target.x - unitX * radius,
          y: target.y - unitY * radius
        };
        const base = {
          x: tip.x - unitX * arrowLength,
          y: tip.y - unitY * arrowLength
        };
        const normalX = -unitY;
        const normalY = unitX;
        const arrowLeft = {
          x: base.x + normalX * arrowHalfWidth,
          y: base.y + normalY * arrowHalfWidth
        };
        const arrowRight = {
          x: base.x - normalX * arrowHalfWidth,
          y: base.y - normalY * arrowHalfWidth
        };

        return { start, tip, base, arrowLeft, arrowRight };
      };

      const radiusInPixels = sx(radius) - sx(origin.x);
      const panelWidthInPixels = sx(panelWidth) - sx(origin.x);
      const panelHeightInPixels = sy(panelHeight) - sy(origin.y);

      for (const panel of panels) {
        const group = makeElement("g", {
          class: "mini-graph",
          "aria-label": panel.title
        });
        const [panelX, panelY] = panel.position;

        group.appendChild(
          makeElement("rect", {
            x: sx(panelX),
            y: sy(panelY),
            width: panelWidthInPixels,
            height: panelHeightInPixels,
            class: "panel"
          })
        );

        appendText(
          group,
          { x: panelX + titleX, y: panelY + titleY },
          panel.title,
          "panel-title",
          "start"
        );

        appendText(
          group,
          { x: panelX + subtitleX, y: panelY + subtitleY },
          panel.subtitle,
          "panel-subtitle",
          "start"
        );

        const nodeMap = new Map();

        for (const node of settings.nodes) {
          nodeMap.set(node.id, {
            definition: node,
            point: translatedPoint(node.point, panel.position)
          });
        }

        for (const edge of settings.edges) {
          const sourceEntry = nodeMap.get(edge.from);
          const targetEntry = nodeMap.get(edge.to);

          if (!sourceEntry || !targetEntry) {
            throw new Error("У ребра отсутствует вершина");
          }

          const geometry = edgeGeometry(
            sourceEntry.point,
            targetEntry.point
          );
          const lineEnd = panel.directed ? geometry.base : geometry.tip;

          group.appendChild(
            makeElement("line", {
              x1: sx(geometry.start.x),
              y1: sy(geometry.start.y),
              x2: sx(lineEnd.x),
              y2: sy(lineEnd.y),
              class: "edge"
            })
          );

          if (panel.directed) {
            group.appendChild(
              makeElement("polygon", {
                points: pointList([
                  geometry.tip,
                  geometry.arrowLeft,
                  geometry.arrowRight
                ]),
                class: "arrowhead"
              })
            );
          }

          if (panel.weighted) {
            const labelPoint = translatedPoint(
              edge.labelPoint,
              panel.position
            );
            const textAnchor =
              edge.labelSide === "left"
                ? "end"
                : edge.labelSide === "right"
                  ? "start"
                  : "middle";

            appendText(
              group,
              labelPoint,
              edge.weight,
              "weight",
              textAnchor,
              edge.labelSide
            );
          }
        }

        for (const node of settings.nodes) {
          const entry = nodeMap.get(node.id);

          group.appendChild(
            makeElement("circle", {
              cx: sx(entry.point.x),
              cy: sy(entry.point.y),
              r: radiusInPixels,
              class: "node"
            })
          );

          appendText(
            group,
            entry.point,
            node.label,
            "node-label",
            "middle"
          );
        }

        svg.appendChild(group);
      }

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать четыре мини-графа: ориентированный и неориентированный, каждый в невзвешенном и взвешенном варианте с числами 2 и 5.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
