<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Узлы на уровнях BFS</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: ghostwhite;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --edge: lightslategray;
      --outline: midnightblue;
      --zero: gold;
      --one: cornflowerblue;
      --two: mediumseagreen;
      --zero-band: cornsilk;
      --one-band: aliceblue;
      --two-band: honeydew;
      --node-text: white;
      --zero-text: midnightblue;
      --queue-track: whitesmoke;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslategray;
        --ink: white;
        --muted: lightsteelblue;
        --edge: silver;
        --outline: lightsteelblue;
        --zero: gold;
        --one: royalblue;
        --two: seagreen;
        --zero-band: darkgoldenrod;
        --one-band: darkslateblue;
        --two-band: darkgreen;
        --node-text: white;
        --zero-text: midnightblue;
        --queue-track: darkslategray;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .diagram {
      margin: 0;
      background: var(--page);
    }

    .diagram-title {
      margin: 0;
      padding: 12px 18px 8px;
      font-size: 21px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .panel,
    .layer-band,
    .queue-slot {
      stroke: var(--outline);
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
    }

    .panel {
      fill: var(--panel);
    }

    .band-zero {
      fill: var(--zero-band);
    }

    .band-one {
      fill: var(--one-band);
    }

    .band-two {
      fill: var(--two-band);
    }

    .edge {
      stroke: var(--edge);
      stroke-width: 3px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .separator {
      stroke: var(--edge);
      stroke-width: 1px;
      vector-effect: non-scaling-stroke;
    }

    .node,
    .queue-node {
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .level-zero {
      fill: var(--zero);
    }

    .level-one {
      fill: var(--one);
    }

    .level-two {
      fill: var(--two);
    }

    .node-label,
    .queue-value {
      fill: var(--node-text);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .level-zero + .node-label,
    .level-zero + .queue-value {
      fill: var(--zero-text);
    }

    .layer-title {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .layer-members {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .panel-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: start;
      dominant-baseline: middle;
    }

    .panel-note,
    .row-label,
    .graph-note {
      fill: var(--muted);
      font-size: 14px;
      dominant-baseline: middle;
    }

    .panel-note {
      text-anchor: start;
    }

    .row-label {
      fill: var(--ink);
      text-anchor: start;
    }

    .graph-note {
      text-anchor: middle;
    }

    .queue-slot {
      fill: var(--queue-track);
    }

    .empty-value {
      fill: var(--muted);
      font-size: 14px;
      font-style: italic;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .fallback {
      margin: 0;
      padding: 18px;
      background: var(--panel);
      color: var(--ink);
      border: 1px solid var(--outline);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-title">
    <figcaption class="diagram-title" id="diagram-title">
      Узлы на уровнях BFS
    </figcaption>

    <svg
      id="bfs-diagram"
      viewBox="0 0 960 480"
      width="960"
      height="480"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Уровни обхода графа в ширину</title>
      <desc id="svg-description">
        Стартовый узел 0 находится на уровне 0, узлы 1 и 2 — на уровне 1,
        узлы 3 и 4 — на уровне 2. Справа показаны состояния очереди BFS.
      </desc>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать граф со стартом 0: уровень 0 — [0],
      уровень 1 — [1, 2], уровень 2 — [3, 4]. Очередь последовательно
      содержит [0], затем [1, 2], затем [3, 4] и после обхода становится
      пустой.
    </p>
  </figure>

  <script>
    const DATA = [
      [42, 22],
      [68, 60],
      [
        [0, 1.25, 3.55, "level-zero"],
        [1, 3.72, 2.25, "level-one"],
        [2, 3.72, 4.85, "level-one"],
        [3, 6.25, 1.85, "level-two"],
        [4, 6.25, 4.15, "level-two"]
      ],
      [
        [1.25, 3.55, 3.72, 2.25],
        [1.25, 3.55, 3.72, 4.85],
        [3.72, 2.25, 6.25, 1.85],
        [3.72, 2.25, 6.25, 4.15],
        [3.72, 4.85, 6.25, 4.15],
        [6.25, 1.85, 6.25, 4.15]
      ],
      [
        [0.35, 0.58, 1.8, 5.65, 0.16, "band-zero", "уровень 0", "[0]", 1.25],
        [2.77, 0.58, 1.9, 5.65, 0.16, "band-one", "уровень 1", "[1, 2]", 3.72],
        [5.27, 0.58, 1.95, 5.65, 0.16, "band-two", "уровень 2", "[3, 4]", 6.25]
      ],
      [
        7.65, 0.58, 5.82, 6.65, 0.18,
        8.02, 1.06, 8.02, 1.49,
        8.02, 2.13, 13.08, 2.13,
        2.62, 3.73, 4.84, 6.08
      ],
      [
        ["старт", 2.62, [[0, 10.72, "level-zero"]], false],
        ["после уровня 0", 3.73, [[1, 10.38, "level-one"], [2, 11.27, "level-one"]], false],
        ["после уровня 1", 4.84, [[3, 10.38, "level-two"], [4, 11.27, "level-two"]], false],
        ["после уровня 2", 6.08, [], true]
      ],
      [
        0.34, 0.59, 0.72, 0.13,
        8.02, 9.93, 2.58, 0.82, 0.14,
        12.25, 6.64, 11.09, 6.66,
        0, -8, 0, 14
      ]
    ];

    const [
      originPair,
      scalePair,
      nodes,
      edges,
      layers,
      panel,
      queueRows,
      metrics
    ] = DATA;

    const [originX, originY] = originPair;
    const [scaleX, scaleY] = scalePair;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("bfs-diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const [
        nodeRadius,
        queueRadius,
        queueHeight,
        cornerRadius,
        rowLabelX,
        slotX,
        slotWidth,
        slotHeight,
        slotRadius,
        emptyX,
        graphNoteY,
        panelNoteX,
        panelNoteY,
        labelDx,
        labelDyAbove,
        labelDyBelow,
        noteDy
      ] = metrics;

      const [
        panelX,
        panelY,
        panelWidth,
        panelHeight,
        panelRadius,
        titleX,
        titleY,
        subtitleX,
        subtitleY,
        separatorX1,
        separatorY,
        separatorX2,
        separatorY2
      ] = panel;

      function make(tag, attributes, text) {
        const element = document.createElementNS(namespace, tag);
        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, String(value));
        }
        if (text !== undefined) {
          element.textContent = text;
        }
        return element;
      }

      function add(parent, tag, attributes, text) {
        const element = make(tag, attributes, text);
        parent.appendChild(element);
        return element;
      }

      function rectangle(parent, x, y, width, height, radius, className) {
        return add(parent, "rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(x + radius) - sx(x),
          class: className
        });
      }

      function line(parent, x1, y1, x2, y2, className) {
        return add(parent, "line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });
      }

      function label(parent, x, y, text, className, anchor, dx, dy) {
        return add(parent, "text", {
          x: sx(x),
          y: sy(y),
          dx,
          dy,
          class: className,
          "text-anchor": anchor
        }, text);
      }

      function circle(parent, x, y, radius, className) {
        return add(parent, "circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(x + radius) - sx(x),
          class: className
        });
      }

      const layerGroup = add(svg, "g", {
        "aria-label": "Цветные уровни BFS"
      });

      for (const [
        x, y, width, height, radius, bandClass,
        title, members, centerX
      ] of layers) {
        rectangle(
          layerGroup,
          x,
          y,
          width,
          height,
          radius,
          `layer-band ${bandClass}`
        );
        label(
          layerGroup,
          centerX,
          y,
          title,
          "layer-title",
          "middle",
          labelDx,
          labelDyBelow
        );
        label(
          layerGroup,
          centerX,
          y,
          members,
          "layer-members",
          "middle",
          labelDx,
          noteDy
        );
      }

      const edgeGroup = add(svg, "g", {
        "aria-label": "Связи графа"
      });

      for (const [x1, y1, x2, y2] of edges) {
        line(edgeGroup, x1, y1, x2, y2, "edge");
      }

      const nodeGroup = add(svg, "g", {
        "aria-label": "Вершины графа"
      });

      for (const [value, x, y, levelClass] of nodes) {
        const group = add(nodeGroup, "g", {
          "aria-label": `Узел ${value}`
        });
        circle(group, x, y, nodeRadius, `node ${levelClass}`);
        label(
          group,
          x,
          y,
          value,
          "node-label",
          "middle",
          labelDx,
          labelDx
        );
      }

      label(
        svg,
        3.72,
        graphNoteY,
        "первое обнаружение определяет слой",
        "graph-note",
        "middle",
        labelDx,
        labelDyAbove
      );

      const queueGroup = add(svg, "g", {
        "aria-label": "Состояния очереди BFS"
      });

      rectangle(
        queueGroup,
        panelX,
        panelY,
        panelWidth,
        panelHeight,
        panelRadius,
        "panel"
      );

      label(
        queueGroup,
        titleX,
        titleY,
        "Очередь BFS",
        "panel-title",
        "start",
        labelDx,
        labelDx
      );

      label(
        queueGroup,
        subtitleX,
        subtitleY,
        "слева — начало очереди",
        "panel-note",
        "start",
        labelDx,
        labelDx
      );

      line(
        queueGroup,
        separatorX1,
        separatorY,
        separatorX2,
        separatorY2,
        "separator"
      );

      for (const [rowName, rowY, values, isEmpty] of queueRows) {
        label(
          queueGroup,
          rowLabelX,
          rowY,
          rowName,
          "row-label",
          "start",
          labelDx,
          labelDx
        );

        rectangle(
          queueGroup,
          slotX,
          rowY - slotHeight / queueHeight,
          slotWidth,
          slotHeight,
          slotRadius,
          "queue-slot"
        );

        if (isEmpty) {
          label(
            queueGroup,
            emptyX,
            rowY,
            "пусто",
            "empty-value",
            "middle",
            labelDx,
            labelDx
          );
        }

        for (const [value, x, levelClass] of values) {
          const group = add(queueGroup, "g", {
            "aria-label": `В очереди узел ${value}`
          });
          circle(group, x, rowY, queueRadius, `queue-node ${levelClass}`);
          label(
            group,
            x,
            rowY,
            value,
            "queue-value",
            "middle",
            labelDx,
            labelDx
          );
        }
      }

      label(
        queueGroup,
        panelNoteX,
        panelNoteY,
        "текущая волна заканчивается раньше следующей",
        "panel-note",
        "middle",
        labelDx,
        labelDx
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("bfs-diagram");
      const fallback = document.getElementById("fallback");
      if (svg) {
        svg.hidden = true;
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
