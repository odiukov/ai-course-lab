<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разные маршруты обучающей и валидационной выборок</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --ink: #172033;
      --muted: #596579;
      --frame: #cbd4e1;
      --panel: #ffffff;
      --train-bg: #eef8f2;
      --train-box: #d8f0e1;
      --train-line: #168456;
      --validation-bg: #f1f5fb;
      --validation-box: #e0e8f5;
      --validation-line: #4269a9;
      --common-bg: #fff4cf;
      --common-line: #b17a00;
      --arrow: #536074;
      --shadow: #dce3ed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --ink: #edf2fa;
        --muted: #b2bdcc;
        --frame: #3d4859;
        --panel: #192130;
        --train-bg: #142b24;
        --train-box: #1d4435;
        --train-line: #5ed19a;
        --validation-bg: #172438;
        --validation-box: #213653;
        --validation-line: #8db4f2;
        --common-bg: #3a3016;
        --common-line: #f2c14f;
        --arrow: #aab6c7;
        --shadow: #0b1018;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1120px;
      margin: auto;
      background: var(--page);
      border: 1px solid var(--frame);
      box-shadow: 0 1px 0 var(--shadow);
      overflow: hidden;
    }

    .figure-title {
      margin: 0;
      padding: 12px 18px;
      border-bottom: 1px solid var(--frame);
      background: var(--panel);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 456px;
      background: var(--page);
    }

    .panel {
      stroke: var(--frame);
      stroke-width: 1.5;
    }

    .dataset {
      fill: var(--panel);
      stroke: var(--ink);
      stroke-width: 2;
    }

    .train-panel {
      fill: var(--train-bg);
    }

    .validation-panel {
      fill: var(--validation-bg);
    }

    .train-box {
      fill: var(--train-box);
      stroke: var(--train-line);
      stroke-width: 1.5;
    }

    .validation-box {
      fill: var(--validation-box);
      stroke: var(--validation-line);
      stroke-width: 1.5;
    }

    .common-box {
      fill: var(--common-bg);
      stroke: var(--common-line);
      stroke-width: 1.5;
    }

    .pill {
      fill: var(--panel);
      stroke-width: 1.5;
    }

    .train-pill {
      stroke: var(--train-line);
    }

    .validation-pill {
      stroke: var(--validation-line);
    }

    .divider {
      stroke: var(--frame);
      stroke-width: 1.5;
    }

    .connector {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrowhead {
      fill: var(--arrow);
    }

    .accent-train {
      fill: var(--train-line);
    }

    .accent-validation {
      fill: var(--validation-line);
    }

    text {
      fill: var(--ink);
      font-size: 15px;
      dominant-baseline: middle;
    }

    .dataset-label {
      font-size: 19px;
      font-weight: bold;
    }

    .panel-title {
      font-size: 17px;
      font-weight: bold;
    }

    .route-label,
    .arrow-label,
    .secondary {
      fill: var(--muted);
      font-size: 13px;
    }

    .box-label,
    .pill-label,
    .common-label {
      font-size: 15px;
      font-weight: bold;
    }

    .train-text {
      fill: var(--train-line);
    }

    .validation-text {
      fill: var(--validation-line);
    }

    .fallback {
      margin: 0;
      padding: 18px;
      color: var(--ink);
      background: var(--page);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure class="figure">
    <h2 class="figure-title">Разные маршруты обучающей и валидационной выборок</h2>
    <svg
      id="diagram"
      width="1120"
      height="456"
      viewBox="0 0 1120 456"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Разделение датасета на обучающий и валидационный маршруты</title>
      <desc id="svg-description">
        Из 5000 изображений 4500 проходят shuffle, случайный flip, случайный crop
        и standardize. Оставшиеся 500 проходят только standardize без shuffle.
        Оба маршрута дают модели тензоры одинаковой формы и масштаба.
      </desc>
    </svg>
    <p id="fallback" class="fallback" hidden>
      Схема должна была показать: 5000 изображений делятся на 4500 обучающих
      с shuffle, flip, crop и standardize и 500 валидационных только со
      standardize без shuffle.
    </p>
    <noscript>
      <p class="fallback">
        5000 изображений: 4500 для обучения с shuffle, flip, crop и standardize;
        500 для валидации только со standardize без shuffle.
      </p>
    </noscript>
  </figure>

  <script>
    const data = [{
      origin: { x: 16, y: 4 },
      scale: { x: 1, y: 1 },
      line: { thin: 1.5, normal: 2 },
      font: { small: 13, normal: 15, panel: 17, dataset: 19 },
      labelPadding: { near: 8, far: 12 },
      arrow: { head: 11, wing: 5 },
      accentHeight: 5,
      dataset: {
        x: 404, y: 8, w: 280, h: 62,
        label: { x: 544, y: 39, text: "Датасет · 5000 изображений" }
      },
      split: {
        start: { x: 544, y: 70 },
        joint: { x: 544, y: 101 },
        trainTarget: { x: 345, y: 130 },
        validationTarget: { x: 885, y: 130 },
        label: { x: 552, y: 88, dx: 8, text: "разделение выборки" }
      },
      panels: [
        {
          kind: "train",
          x: 20, y: 130, w: 650, h: 270, dividerY: 181,
          title: { x: 44, y: 151, text: "Обучение · 4500 изображений" },
          route: { x: 44, y: 170, text: "случайный маршрут" }
        },
        {
          kind: "validation",
          x: 700, y: 130, w: 370, h: 270, dividerY: 181,
          title: { x: 724, y: 151, text: "Валидация · 500 изображений" },
          route: { x: 724, y: 170, text: "детерминированный маршрут" }
        }
      ],
      pills: [
        {
          kind: "train", x: 44, y: 193, w: 170, h: 30,
          label: { x: 129, y: 208, text: "shuffle включён" }
        },
        {
          kind: "validation", x: 724, y: 193, w: 178, h: 30,
          label: { x: 813, y: 208, text: "shuffle выключен" }
        }
      ],
      operators: [
        {
          kind: "train", x: 44, y: 237, w: 160, h: 66,
          accent: true,
          label: { x: 124, y: 259, text: "случайный flip" },
          note: { x: 124, y: 282, text: "новый вариант" }
        },
        {
          kind: "train", x: 252, y: 237, w: 160, h: 66,
          accent: true,
          label: { x: 332, y: 259, text: "случайный crop" },
          note: { x: 332, y: 282, text: "новая обрезка" }
        },
        {
          kind: "train", x: 460, y: 237, w: 180, h: 66,
          accent: false,
          label: { x: 550, y: 259, text: "standardize" },
          note: { x: 550, y: 282, text: "статистики датасета" }
        },
        {
          kind: "validation", x: 790, y: 237, w: 190, h: 66,
          accent: false,
          label: { x: 885, y: 259, text: "standardize" },
          note: { x: 885, y: 282, text: "статистики датасета" }
        }
      ],
      outputs: [
        {
          kind: "train", x: 170, y: 330, w: 350, h: 46,
          label: { x: 345, y: 353, text: "тензор для модели" }
        },
        {
          kind: "validation", x: 735, y: 330, w: 300, h: 46,
          label: { x: 885, y: 353, text: "тензор для модели" }
        }
      ],
      processArrows: [
        { from: { x: 204, y: 270 }, to: { x: 252, y: 270 } },
        { from: { x: 412, y: 270 }, to: { x: 460, y: 270 } },
        { from: { x: 550, y: 303 }, to: { x: 345, y: 330 } },
        { from: { x: 885, y: 303 }, to: { x: 885, y: 330 } }
      ],
      finalArrows: [
        { from: { x: 345, y: 376 }, to: { x: 390, y: 414 } },
        { from: { x: 885, y: 376 }, to: { x: 700, y: 414 } }
      ],
      common: {
        x: 250, y: 414, w: 590, h: 30,
        label: {
          x: 545, y: 429,
          text: "Одинаковая форма и масштаб на входе модели"
        }
      }
    }];

    const [D] = data;
    const origin = D.origin;
    const scale = D.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    try {
      const make = (tag, attributes, parent) => {
        const node = document.createElementNS(namespace, tag);
        for (const [name, value] of Object.entries(attributes)) {
          node.setAttribute(name, String(value));
        }
        (parent || svg).appendChild(node);
        return node;
      };

      const connectors = make("g", { "aria-hidden": "true" });
      const shapes = make("g", { "aria-hidden": "true" });
      const labels = make("g", { "aria-hidden": "true" });

      const rect = (item, className) => make("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.x + item.w) - sx(item.x),
        height: sy(item.y + item.h) - sy(item.y),
        class: className
      }, shapes);

      const line = (from, to, className) => make("line", {
        x1: sx(from.x),
        y1: sy(from.y),
        x2: sx(to.x),
        y2: sy(to.y),
        class: className
      }, connectors);

      const text = (item, className, anchor, dx) => {
        const node = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          dx: dx || "",
          class: className,
          "text-anchor": anchor || "middle"
        }, labels);
        node.textContent = item.text;
        return node;
      };

      const arrow = (from, to) => {
        const vx = to.x - from.x;
        const vy = to.y - from.y;
        const length = Math.hypot(vx, vy);
        const ux = vx / length;
        const uy = vy / length;
        const base = {
          x: to.x - ux * D.arrow.head,
          y: to.y - uy * D.arrow.head
        };
        const left = {
          x: base.x - uy * D.arrow.wing,
          y: base.y + ux * D.arrow.wing
        };
        const right = {
          x: base.x + uy * D.arrow.wing,
          y: base.y - ux * D.arrow.wing
        };

        line(from, base, "connector");
        make("polygon", {
          points: [to, left, right]
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: "arrowhead"
        }, connectors);
      };

      line(D.split.start, D.split.joint, "connector");
      arrow(D.split.joint, D.split.trainTarget);
      arrow(D.split.joint, D.split.validationTarget);

      for (const item of D.processArrows) {
        arrow(item.from, item.to);
      }

      for (const item of D.finalArrows) {
        arrow(item.from, item.to);
      }

      for (const panel of D.panels) {
        rect(panel, `panel ${panel.kind}-panel`);
        line(
          { x: panel.x, y: panel.dividerY },
          { x: panel.x + panel.w, y: panel.dividerY },
          "divider"
        );
      }

      rect(D.dataset, "dataset");

      for (const pill of D.pills) {
        rect(pill, `pill ${pill.kind}-pill`);
      }

      for (const operator of D.operators) {
        rect(operator, `${operator.kind}-box`);
        if (operator.accent) {
          rect({
            x: operator.x,
            y: operator.y,
            w: operator.w,
            h: D.accentHeight
          }, `accent-${operator.kind}`);
        }
      }

      for (const output of D.outputs) {
        rect(output, `${output.kind}-box`);
      }

      rect(D.common, "common-box");

      text(D.dataset.label, "dataset-label");
      text(D.split.label, "arrow-label", "start", D.split.label.dx);

      for (const panel of D.panels) {
        text(panel.title, "panel-title", "start");
        text(
          panel.route,
          `route-label ${panel.kind}-text`,
          "start"
        );
      }

      for (const pill of D.pills) {
        text(
          pill.label,
          `pill-label ${pill.kind}-text`
        );
      }

      for (const operator of D.operators) {
        text(operator.label, "box-label");
        text(operator.note, "secondary");
      }

      for (const output of D.outputs) {
        text(output.label, "box-label");
      }

      text(D.common.label, "common-label");
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
