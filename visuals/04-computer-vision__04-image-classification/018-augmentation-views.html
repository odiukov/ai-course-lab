<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Один объект в разных допустимых представлениях</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f3ec;
    --panel: #fffdf8;
    --card: #ffffff;
    --image: #e8edf2;
    --ink: #202631;
    --muted: #687382;
    --line: #b7c0cb;
    --accent: #287a5b;
    --accent-soft: #dcefe6;
    --dog: #a9683f;
    --dog-dark: #5b3728;
    --dog-light: #d89a6e;
    --warm-bg: #ffe0aa;
    --warm-dog: #c66c32;
    --cover: #50627a;
    --white: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #171a20;
      --panel: #20242c;
      --card: #282d36;
      --image: #343b47;
      --ink: #f1f3f5;
      --muted: #b4bdc9;
      --line: #596575;
      --accent: #6bd0a4;
      --accent-soft: #294c40;
      --dog: #c68151;
      --dog-dark: #39241d;
      --dog-light: #efad7d;
      --warm-bg: #654927;
      --warm-dog: #df8246;
      --cover: #8194ae;
      --white: #ffffff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .sheet {
    max-width: 1200px;
    margin: auto;
    padding: 12px;
    background: var(--panel);
  }

  h1 {
    margin: 0;
    padding: 4px 8px;
    font-size: 20px;
    font-weight: bold;
  }

  .lead {
    margin: 0;
    padding: 2px 8px 8px;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--panel);
  }

  .card {
    fill: var(--card);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .image-field { fill: var(--image); }
  .warm-field { fill: var(--warm-bg); }
  .dog-body { fill: var(--dog); }
  .warm-dog { fill: var(--warm-dog); }
  .dog-light { fill: var(--dog-light); }
  .dog-detail {
    fill: none;
    stroke: var(--dog-dark);
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .dog-dark { fill: var(--dog-dark); }
  .cover { fill: var(--cover); }

  .card-title {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .card-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .label-pill {
    fill: var(--accent-soft);
    stroke: var(--accent);
    stroke-width: 2px;
  }

  .label-text {
    fill: var(--accent);
    font-size: 14px;
    font-weight: bold;
  }

  .rail {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .rail-dot { fill: var(--accent); }

  .common-label {
    fill: var(--accent);
    font-size: 16px;
    font-weight: bold;
  }

  .fallback {
    padding: 16px;
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="sheet">
  <h1>Один объект — разные допустимые представления</h1>
  <p class="lead">Пиксели меняются, но правильный ответ остаётся тем же.</p>
  <div id="diagram">
    <svg id="scene" width="1200" height="430" viewBox="0 0 1200 430"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Пять представлений одной собаки</title>
      <desc id="svg-desc">Исходная собака, отражение, поворот на 15 градусов, тёплый цвет и частичное перекрытие квадратом имеют одну метку — собака.</desc>
    </svg>
  </div>
</main>

<script>
const diagram = [{
  cards: [
    { x: 24,  title: "Исходное",          note: "собака смотрит влево", kind: "original" },
    { x: 260, title: "Отражение",          note: "собака смотрит вправо", kind: "flip" },
    { x: 496, title: "Поворот на 15°",     note: "контуры чуть наклонены", kind: "rotate" },
    { x: 732, title: "Тёплый цвет",        note: "изменилось освещение", kind: "warm" },
    { x: 968, title: "Квадрат поверх",     note: "часть объекта скрыта", kind: "cover" }
  ],
  card: { y: 24, w: 208, h: 306, radius: 14 },
  field: { x: 12, y: 76, w: 184, h: 158, radius: 10 },
  titleY: 52,
  noteY: 72,
  pill: { x: 26, y: 252, w: 156, h: 36, radius: 18, textY: 276 },
  dog: {
    body: { x: 112, y: 161, rx: 47, ry: 29 },
    head: { x: 69, y: 145, r: 27 },
    snout: { x: 45, y: 154, rx: 20, ry: 13 },
    ear: [{ x: 70, y: 122 }, { x: 91, y: 132 }, { x: 77, y: 159 }],
    tail: [{ x: 153, y: 148 }, { x: 174, y: 129 }, { x: 184, y: 139 }],
    frontLeg: [{ x: 91, y: 181 }, { x: 88, y: 209 }, { x: 79, y: 211 }],
    backLeg: [{ x: 132, y: 181 }, { x: 136, y: 209 }, { x: 146, y: 211 }],
    collar: [{ x: 83, y: 147 }, { x: 84, y: 166 }],
    eye: { x: 57, y: 140, r: 3 },
    nose: { x: 25, y: 153, r: 5 },
    highlight: { x: 107, y: 151, rx: 25, ry: 12 }
  },
  rotation: { angle: 15, cx: 600, cy: 174 },
  cover: { x: 86, y: 139, size: 64, radius: 3 },
  rail: { top: 330, y: 356, left: 128, right: 1072, dot: 5 },
  common: { y: 398 }
}];

const origin = { x: 0, y: 0 };
const scale = { x: 1, y: 1 };
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const [D] = diagram;
  const svg = document.getElementById("scene");
  const ns = "http://www.w3.org/2000/svg";

  function add(parent, tag, attrs, text) {
    const node = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
    if (text !== undefined) node.textContent = text;
    parent.appendChild(node);
    return node;
  }

  function label(parent, x, y, value, className, anchor) {
    return add(parent, "text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    }, value);
  }

  function dog(parent, card, flipped, warm) {
    const g = D.dog;
    const group = add(parent, "g", {});
    const px = value => sx(card.x + (flipped ? D.card.w - value : value));
    const py = value => sy(D.card.y + value);
    const bodyClass = warm ? "dog-body warm-dog" : "dog-body";

    add(group, "polyline", {
      points: g.tail.map(point => px(point.x) + "," + py(point.y)).join(" "),
      class: "dog-detail"
    });

    add(group, "polyline", {
      points: g.frontLeg.map(point => px(point.x) + "," + py(point.y)).join(" "),
      class: "dog-detail"
    });

    add(group, "polyline", {
      points: g.backLeg.map(point => px(point.x) + "," + py(point.y)).join(" "),
      class: "dog-detail"
    });

    add(group, "ellipse", {
      cx: px(g.body.x),
      cy: py(g.body.y),
      rx: sx(g.body.rx),
      ry: sy(g.body.ry),
      class: bodyClass
    });

    add(group, "ellipse", {
      cx: px(g.highlight.x),
      cy: py(g.highlight.y),
      rx: sx(g.highlight.rx),
      ry: sy(g.highlight.ry),
      class: "dog-light"
    });

    add(group, "circle", {
      cx: px(g.head.x),
      cy: py(g.head.y),
      r: sx(g.head.r),
      class: bodyClass
    });

    add(group, "ellipse", {
      cx: px(g.snout.x),
      cy: py(g.snout.y),
      rx: sx(g.snout.rx),
      ry: sy(g.snout.ry),
      class: bodyClass
    });

    add(group, "polygon", {
      points: g.ear.map(point => px(point.x) + "," + py(point.y)).join(" "),
      class: "dog-dark"
    });

    add(group, "polyline", {
      points: g.collar.map(point => px(point.x) + "," + py(point.y)).join(" "),
      class: "dog-detail"
    });

    add(group, "circle", {
      cx: px(g.eye.x),
      cy: py(g.eye.y),
      r: sx(g.eye.r),
      class: "dog-dark"
    });

    add(group, "circle", {
      cx: px(g.nose.x),
      cy: py(g.nose.y),
      r: sx(g.nose.r),
      class: "dog-dark"
    });

    return group;
  }

  D.cards.forEach(card => {
    const group = add(svg, "g", {});

    add(group, "rect", {
      x: sx(card.x),
      y: sy(D.card.y),
      width: sx(D.card.w),
      height: sy(D.card.h),
      rx: sx(D.card.radius),
      class: "card"
    });

    add(group, "rect", {
      x: sx(card.x + D.field.x),
      y: sy(D.card.y + D.field.y),
      width: sx(D.field.w),
      height: sy(D.field.h),
      rx: sx(D.field.radius),
      class: card.kind === "warm" ? "warm-field" : "image-field"
    });

    label(group, card.x + D.card.w / scale.x / (scale.x + scale.x),
      D.card.y + D.titleY, card.title, "card-title", "middle");

    label(group, card.x + D.card.w / scale.x / (scale.x + scale.x),
      D.card.y + D.noteY, card.note, "card-note", "middle");

    const animal = dog(group, card, card.kind === "flip", card.kind === "warm");

    if (card.kind === "rotate") {
      animal.setAttribute("transform",
        "rotate(" + D.rotation.angle + " " +
        sx(D.rotation.cx) + " " + sy(D.rotation.cy) + ")");
    }

    if (card.kind === "cover") {
      add(group, "rect", {
        x: sx(card.x + D.cover.x),
        y: sy(D.card.y + D.cover.y),
        width: sx(D.cover.size),
        height: sy(D.cover.size),
        rx: sx(D.cover.radius),
        class: "cover"
      });
    }

    add(group, "rect", {
      x: sx(card.x + D.pill.x),
      y: sy(D.card.y + D.pill.y),
      width: sx(D.pill.w),
      height: sy(D.pill.h),
      rx: sx(D.pill.radius),
      class: "label-pill"
    });

    label(group, card.x + D.card.w / scale.x / (scale.x + scale.x),
      D.card.y + D.pill.textY, "метка «собака»", "label-text", "middle");

    const center = card.x + D.card.w / scale.x / (scale.x + scale.x);
    add(svg, "line", {
      x1: sx(center),
      y1: sy(D.rail.top),
      x2: sx(center),
      y2: sy(D.rail.y),
      class: "rail"
    });

    add(svg, "circle", {
      cx: sx(center),
      cy: sy(D.rail.y),
      r: sx(D.rail.dot),
      class: "rail-dot"
    });
  });

  add(svg, "line", {
    x1: sx(D.rail.left),
    y1: sy(D.rail.y),
    x2: sx(D.rail.right),
    y2: sy(D.rail.y),
    class: "rail"
  });

  label(svg,
    (D.rail.left + D.rail.right) / (scale.x + scale.x),
    D.common.y,
    "ОДНА ЦЕЛЕВАЯ МЕТКА: «СОБАКА»",
    "common-label",
    "middle"
  );
} catch (error) {
  const host = document.getElementById("diagram");
  host.className = "fallback";
  host.textContent = "Схема должна была показать исходную собаку и четыре варианта — отражение, поворот на 15°, тёплый цвет и перекрытие квадратом — с одной меткой «собака».";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
