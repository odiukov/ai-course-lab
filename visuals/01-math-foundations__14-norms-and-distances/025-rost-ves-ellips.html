<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обычная и необычная комбинации роста и веса</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --axis: #475467;
      --cloud: #5b8def;
      --cloud-fill: #dce8ff;
      --usual: #16845b;
      --unusual: #d13f4b;
      --distance: #667085;
      --halo: #ffffff;
      --border: #d8dee9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --text: #edf2f7;
        --muted: #aab4c4;
        --axis: #aab4c4;
        --cloud: #77a3ff;
        --cloud-fill: #24395f;
        --usual: #54d6a0;
        --unusual: #ff7b86;
        --distance: #aab4c4;
        --halo: #171d28;
        --border: #344054;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    figure {
      width: 100%;
      margin: 0;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.2;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .axis,
    .axis-head,
    .distance,
    .cloud-outline,
    .mean-cross {
      vector-effect: non-scaling-stroke;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .axis,
    .axis-head {
      stroke: var(--axis);
      fill: none;
    }

    .cloud-area {
      fill: var(--cloud-fill);
      stroke: none;
    }

    .cloud-outline {
      fill: none;
      stroke: var(--cloud);
      stroke-dasharray: 7 7;
    }

    .cloud-point {
      fill: var(--cloud);
      opacity: 0.58;
    }

    .distance {
      fill: none;
      stroke: var(--distance);
      stroke-dasharray: 8 6;
    }

    .mean-cross {
      stroke: var(--text);
    }

    .usual-point {
      fill: var(--usual);
      stroke: var(--halo);
    }

    .unusual-point {
      fill: var(--unusual);
      stroke: var(--halo);
    }

    text {
      font-family: inherit;
      fill: var(--text);
    }

    .axis-label,
    .note,
    .distance-label,
    .mean-label,
    .point-label {
      paint-order: stroke fill;
      stroke: var(--halo);
      stroke-linejoin: round;
    }

    .axis-label {
      fill: var(--muted);
    }

    .note {
      font-weight: bold;
    }

    .distance-label {
      fill: var(--muted);
    }

    .mean-label {
      font-weight: bold;
    }

    .usual-label {
      fill: var(--usual);
      font-weight: bold;
    }

    .unusual-label {
      fill: var(--unusual);
      font-weight: bold;
    }

    #fallback {
      margin: 12px;
      font-size: 16px;
      color: var(--text);
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Обычная и необычная комбинации роста и веса</h1>

    <svg id="diagram"
         viewBox="0 0 960 440"
         width="960"
         height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Связь роста и веса и две комбинации признаков</title>
      <desc id="svg-description">
        Наклонное облако точек показывает связь роста и веса. Точка 188 сантиметров
        и 82 килограмма лежит внутри облака, а точка 152 сантиметра и 82 килограмма
        находится далеко поперёк его обычного направления.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать наклонное облако связанных значений роста и веса:
      комбинация 188 см / 82 кг находится внутри облака, а 152 см / 82 кг —
      далеко от него, хотя вес у точек одинаковый.
    </p>
  </figure>

  <script>
    const DATA = Object.freeze([
      {
        origin: Object.freeze({ x: 105, y: 385 }),
        scale: 72,
        zero: 0,
        turn: 6.283185307179586,
        contourSamples: 72,
        loopStep: 1,
        divisor: 2,
        axes: Object.freeze({
          xEnd: 10.35,
          yEnd: 4.85,
          xHead: Object.freeze([[10.35, 0], [10.08, 0.13], [10.08, -0.13]]),
          yHead: Object.freeze([[0, 4.85], [-0.13, 4.58], [0.13, 4.58]])
        }),
        ellipse: Object.freeze({
          x: 5.35,
          y: 2.62,
          major: 3.46,
          minor: 0.82,
          angle: 0.49
        }),
        mean: Object.freeze({ x: 5.2, y: 2.8, radius: 0.12 }),
        usual: Object.freeze({ x: 7.2, y: 4.05, radius: 0.14 }),
        unusual: Object.freeze({ x: 3.2, y: 4.05, radius: 0.14 }),
        lineWidth: Object.freeze({
          axis: 2,
          outline: 2,
          distance: 2,
          point: 3,
          cross: 2
        }),
        fontSize: Object.freeze({
          axis: 16,
          note: 17,
          point: 18,
          distance: 15,
          mean: 15
        }),
        labelOffset: Object.freeze({
          axisX: Object.freeze({ dx: -8, dy: 34 }),
          axisY: Object.freeze({ dx: 14, dy: 6 }),
          note: Object.freeze({ dx: 0, dy: 0 }),
          usual: Object.freeze({ dx: 15, dy: -14 }),
          unusual: Object.freeze({ dx: -15, dy: -14 }),
          mean: Object.freeze({ dx: 13, dy: 23 }),
          usualDistance: Object.freeze({ dx: 18, dy: 22 }),
          unusualDistance: Object.freeze({ dx: -16, dy: -16 })
        }),
        labelAnchor: Object.freeze({
          start: "start",
          middle: "middle",
          end: "end"
        }),
        labelPoints: Object.freeze({
          axisX: Object.freeze({ x: 10.25, y: 0 }),
          axisY: Object.freeze({ x: 0, y: 4.7 }),
          note: Object.freeze({ x: 5.3, y: 4.72 })
        })
      },
      Object.freeze([
        [2.02, 1.04], [2.25, 1.28], [2.49, 1.18], [2.58, 1.52],
        [2.82, 1.45], [2.96, 1.83], [3.18, 1.68], [3.34, 2.02],
        [3.55, 1.92], [3.72, 2.21], [3.91, 2.08], [4.08, 2.49],
        [4.29, 2.31], [4.46, 2.67], [4.66, 2.52], [4.83, 2.88],
        [5.05, 2.69], [5.22, 3.02], [5.43, 2.91], [5.62, 3.25],
        [5.84, 3.09], [6.02, 3.44], [6.23, 3.29], [6.39, 3.64],
        [6.58, 3.46], [6.78, 3.82], [6.96, 3.67], [7.18, 4.01],
        [7.37, 3.88], [7.54, 4.18], [7.77, 4.05], [7.94, 4.39],
        [8.18, 4.28], [8.42, 4.55], [4.01, 2.74], [5.73, 2.79],
        [6.72, 3.28], [3.11, 2.22], [7.58, 3.56]
      ])
    ]);

    const [layout, cloud] = DATA;
    const origin = Object.freeze(layout.origin);
    const scale = layout.scale;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const make = (name, attributes, parent = svg) => {
        const node = document.createElementNS(svg.namespaceURI, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }
        parent.appendChild(node);
        return node;
      };

      const write = (content, point, options) => {
        const node = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          dx: options.dx,
          dy: options.dy,
          "text-anchor": options.anchor,
          "font-size": options.size,
          "stroke-width": options.halo,
          class: options.className
        });
        node.textContent = content;
        return node;
      };

      const radius = value => Math.abs(sx(value) - sx(layout.zero));

      const contourPoint = angle => {
        const cosAngle = Math.cos(layout.ellipse.angle);
        const sinAngle = Math.sin(layout.ellipse.angle);
        const localX = layout.ellipse.major * Math.cos(angle);
        const localY = layout.ellipse.minor * Math.sin(angle);

        return {
          x: layout.ellipse.x + localX * cosAngle - localY * sinAngle,
          y: layout.ellipse.y + localX * sinAngle + localY * cosAngle
        };
      };

      let contourPath = "";
      for (
        let sample = layout.zero;
        sample <= layout.contourSamples;
        sample += layout.loopStep
      ) {
        const angle = layout.turn * sample / layout.contourSamples;
        const point = contourPoint(angle);
        const command = sample === layout.zero ? "M" : "L";
        contourPath += `${command} ${sx(point.x)} ${sy(point.y)} `;
      }
      contourPath += "Z";

      make("path", { d: contourPath, class: "cloud-area" });
      make("path", {
        d: contourPath,
        class: "cloud-outline",
        "stroke-width": layout.lineWidth.outline
      });

      for (const [x, y] of cloud) {
        make("circle", {
          cx: sx(x),
          cy: sy(y),
          r: radius(layout.mean.radius),
          class: "cloud-point"
        });
      }

      make("line", {
        x1: sx(layout.zero),
        y1: sy(layout.zero),
        x2: sx(layout.axes.xEnd),
        y2: sy(layout.zero),
        class: "axis",
        "stroke-width": layout.lineWidth.axis
      });

      make("line", {
        x1: sx(layout.zero),
        y1: sy(layout.zero),
        x2: sx(layout.zero),
        y2: sy(layout.axes.yEnd),
        class: "axis",
        "stroke-width": layout.lineWidth.axis
      });

      for (const head of [layout.axes.xHead, layout.axes.yHead]) {
        const [tip, firstWing, secondWing] = head;
        make("path", {
          d:
            `M ${sx(firstWing[layout.zero])} ${sy(firstWing[layout.loopStep])} ` +
            `L ${sx(tip[layout.zero])} ${sy(tip[layout.loopStep])} ` +
            `L ${sx(secondWing[layout.zero])} ${sy(secondWing[layout.loopStep])}`,
          class: "axis-head",
          "stroke-width": layout.lineWidth.axis
        });
      }

      const drawDistance = point => make("line", {
        x1: sx(layout.mean.x),
        y1: sy(layout.mean.y),
        x2: sx(point.x),
        y2: sy(point.y),
        class: "distance",
        "stroke-width": layout.lineWidth.distance
      });

      drawDistance(layout.usual);
      drawDistance(layout.unusual);

      const midpoint = point => ({
        x: (layout.mean.x + point.x) / layout.divisor,
        y: (layout.mean.y + point.y) / layout.divisor
      });

      const crossRadius = layout.mean.radius;
      make("line", {
        x1: sx(layout.mean.x - crossRadius),
        y1: sy(layout.mean.y),
        x2: sx(layout.mean.x + crossRadius),
        y2: sy(layout.mean.y),
        class: "mean-cross",
        "stroke-width": layout.lineWidth.cross
      });
      make("line", {
        x1: sx(layout.mean.x),
        y1: sy(layout.mean.y - crossRadius),
        x2: sx(layout.mean.x),
        y2: sy(layout.mean.y + crossRadius),
        class: "mean-cross",
        "stroke-width": layout.lineWidth.cross
      });

      make("circle", {
        cx: sx(layout.usual.x),
        cy: sy(layout.usual.y),
        r: radius(layout.usual.radius),
        class: "usual-point",
        "stroke-width": layout.lineWidth.point
      });

      make("circle", {
        cx: sx(layout.unusual.x),
        cy: sy(layout.unusual.y),
        r: radius(layout.unusual.radius),
        class: "unusual-point",
        "stroke-width": layout.lineWidth.point
      });

      write("рост", layout.labelPoints.axisX, {
        ...layout.labelOffset.axisX,
        anchor: layout.labelAnchor.end,
        size: layout.fontSize.axis,
        halo: layout.lineWidth.point,
        className: "axis-label"
      });

      write("вес", layout.labelPoints.axisY, {
        ...layout.labelOffset.axisY,
        anchor: layout.labelAnchor.start,
        size: layout.fontSize.axis,
        halo: layout.lineWidth.point,
        className: "axis-label"
      });

      write("Одинаковое отклонение от среднего — разный смысл", layout.labelPoints.note, {
        ...layout.labelOffset.note,
        anchor: layout.labelAnchor.middle,
        size: layout.fontSize.note,
        halo: layout.lineWidth.point,
        className: "note"
      });

      write("обычная: 188 см / 82 кг", layout.usual, {
        ...layout.labelOffset.usual,
        anchor: layout.labelAnchor.start,
        size: layout.fontSize.point,
        halo: layout.lineWidth.point,
        className: "point-label usual-label"
      });

      write("необычная: 152 см / 82 кг", layout.unusual, {
        ...layout.labelOffset.unusual,
        anchor: layout.labelAnchor.end,
        size: layout.fontSize.point,
        halo: layout.lineWidth.point,
        className: "point-label unusual-label"
      });

      write("среднее", layout.mean, {
        ...layout.labelOffset.mean,
        anchor: layout.labelAnchor.start,
        size: layout.fontSize.mean,
        halo: layout.lineWidth.point,
        className: "mean-label"
      });

      write("вдоль типичного направления", midpoint(layout.usual), {
        ...layout.labelOffset.usualDistance,
        anchor: layout.labelAnchor.start,
        size: layout.fontSize.distance,
        halo: layout.lineWidth.point,
        className: "distance-label"
      });

      write("поперёк облака", midpoint(layout.unusual), {
        ...layout.labelOffset.unusualDistance,
        anchor: layout.labelAnchor.end,
        size: layout.fontSize.distance,
        halo: layout.lineWidth.point,
        className: "distance-label"
      });
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
