<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каждая часть по очереди становится проверочной</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: white;
      --ink: midnightblue;
      --muted: slategray;
      --outline: lightsteelblue;
      --row: aliceblue;
      --train: lightcyan;
      --train-line: teal;
      --validation: moccasin;
      --validation-line: darkorange;
      --validation-ink: saddlebrown;
      --connector: darkorange;
      --score: white;
      --score-line: steelblue;
      --hard: mistyrose;
      --hard-line: crimson;
      --hard-ink: darkred;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --ink: whitesmoke;
        --muted: lightsteelblue;
        --outline: slategray;
        --row: #172235;
        --train: #123b43;
        --train-line: turquoise;
        --validation: #513816;
        --validation-line: orange;
        --validation-ink: cornsilk;
        --connector: orange;
        --score: #172235;
        --score-line: lightskyblue;
        --hard: #4b1d2a;
        --hard-line: lightcoral;
        --hard-ink: mistyrose;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      margin: 0;
    }

    figure {
      margin: 0;
      background: var(--page);
    }

    h2 {
      box-sizing: border-box;
      margin: 0;
      padding: 12px 20px 4px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
    }

    .canvas {
      fill: var(--page);
    }

    .summary {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .column-label,
    .score-heading {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .row-band {
      fill: var(--row);
      stroke: var(--outline);
      stroke-width: 1px;
    }

    .train-cell {
      fill: var(--train);
      stroke: var(--train-line);
      stroke-width: 2px;
    }

    .validation-cell {
      fill: var(--validation);
      stroke: var(--validation-line);
      stroke-width: 3px;
    }

    .connector {
      fill: none;
      stroke: var(--connector);
      stroke-width: 2px;
      stroke-dasharray: 5 5;
    }

    .pass-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .cell-role {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .validation-role {
      fill: var(--validation-ink);
    }

    .cell-count {
      fill: var(--muted);
      font-size: 12px;
    }

    .validation-count {
      fill: var(--validation-ink);
    }

    .score-box {
      fill: var(--score);
      stroke: var(--score-line);
      stroke-width: 2px;
    }

    .score-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .hard-score {
      fill: var(--hard);
      stroke: var(--hard-line);
      stroke-width: 3px;
    }

    .hard-text {
      fill: var(--hard-ink);
    }

    .legend-text {
      fill: var(--ink);
      font-size: 13px;
    }

    .legend-train {
      fill: var(--train);
      stroke: var(--train-line);
      stroke-width: 2px;
    }

    .legend-validation {
      fill: var(--validation);
      stroke: var(--validation-line);
      stroke-width: 3px;
    }

    .conclusion {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    #fallback {
      display: none;
      box-sizing: border-box;
      margin: 12px 20px;
      padding: 16px;
      border: 2px solid var(--hard-line);
      background: var(--hard);
      color: var(--hard-ink);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Каждая часть по очереди становится проверочной</h2>
    <svg id="diagram"
         viewBox="0 0 960 440"
         width="960"
         height="440"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Пять проходов K-fold cross-validation</title>
      <desc id="svg-description">
        Пять строк для трёхсот объектов при K равном пяти. В каждой строке
        одна новая часть из шестидесяти объектов используется для проверки,
        а остальные четыре части — для обучения.
      </desc>
    </svg>
    <p id="fallback">
      Схема должна была показать пять проходов: каждый из пяти блоков по
      60 объектов один раз становится проверочным, пока остальные четыре
      блока используются для обучения.
    </p>
  </figure>

  <script>
    const data = [
      {
        kind: "layout",
        canvasLeft: 0,
        canvasTop: 0,
        canvasRight: 960,
        canvasBottom: 440,
        summaryX: 480,
        summaryY: 22,
        headerY: 55,
        rowX: 18,
        rowRight: 942,
        firstRowY: 72,
        rowHeight: 50,
        rowStep: 59,
        passX: 126,
        gridX: 144,
        cellWidth: 120,
        cellGap: 6,
        scoreX: 817,
        scoreWidth: 88,
        scoreInset: 9,
        roleLift: 8,
        countDrop: 10,
        connectorInset: 2,
        legendY: 386,
        legendBoxY: 374,
        legendBoxWidth: 34,
        legendBoxHeight: 24,
        legendTrainX: 294,
        legendTrainTextX: 338,
        legendValidationX: 500,
        legendValidationTextX: 544,
        conclusionX: 480,
        conclusionY: 422,
        zero: 0,
        five: 5,
        sixty: 60,
        threeHundred: 300,
        hardPass: 4
      },
      { kind: "row", pass: 1, validation: 1, score: "0,91" },
      { kind: "row", pass: 2, validation: 2, score: "0,89" },
      { kind: "row", pass: 3, validation: 3, score: "0,90" },
      { kind: "row", pass: 4, validation: 4, score: "0,62" },
      { kind: "row", pass: 5, validation: 5, score: "0,90" }
    ];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const L = data.find((item) => item.kind === "layout");
      const rows = data.filter((item) => item.kind === "row");
      const ns = svg.namespaceURI;

      const make = (tag, attributes, className, textValue) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, value);
        });
        if (className) node.setAttribute("class", className);
        if (textValue !== undefined) node.textContent = textValue;
        return node;
      };

      const addText = (parent, x, y, className, value, anchor) => {
        const node = make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          className,
          value
        );
        parent.appendChild(node);
        return node;
      };

      const addRect = (parent, left, top, right, bottom, className) => {
        const node = make(
          "rect",
          {
            x: sx(left),
            y: sy(top),
            width: sx(right) - sx(left),
            height: sy(bottom) - sy(top)
          },
          className
        );
        parent.appendChild(node);
        return node;
      };

      const drawing = make("g", {}, "drawing");
      svg.appendChild(drawing);

      addRect(
        drawing,
        L.canvasLeft,
        L.canvasTop,
        L.canvasRight,
        L.canvasBottom,
        "canvas"
      );

      addText(
        drawing,
        L.summaryX,
        L.summaryY,
        "summary",
        `${L.threeHundred} объектов • K = ${L.five} • ${L.five} частей по ${L.sixty}`,
        "middle"
      );

      rows.forEach((row) => {
        const index = row.pass - rows[0].pass;
        const next = rows.find((candidate) => candidate.pass === row.pass + rows[0].pass);

        if (next) {
          const nextIndex = next.pass - rows[0].pass;
          const fromCell = row.validation - rows[0].pass;
          const toCell = next.validation - rows[0].pass;
          const fromX =
            L.gridX +
            fromCell * (L.cellWidth + L.cellGap) +
            L.cellWidth / L.connectorInset;
          const toX =
            L.gridX +
            toCell * (L.cellWidth + L.cellGap) +
            L.cellWidth / L.connectorInset;
          const fromY = L.firstRowY + index * L.rowStep + L.rowHeight;
          const toY = L.firstRowY + nextIndex * L.rowStep;

          drawing.appendChild(
            make(
              "line",
              {
                x1: sx(fromX),
                y1: sy(fromY),
                x2: sx(toX),
                y2: sy(toY)
              },
              "connector"
            )
          );
        }
      });

      rows.forEach((row) => {
        const column = row.pass - rows[0].pass;
        const center =
          L.gridX +
          column * (L.cellWidth + L.cellGap) +
          L.cellWidth / L.connectorInset;

        addText(
          drawing,
          center,
          L.headerY,
          "column-label",
          `часть ${row.pass}`,
          "middle"
        );
      });

      addText(
        drawing,
        L.scoreX + L.scoreWidth / L.connectorInset,
        L.headerY,
        "score-heading",
        "оценка",
        "middle"
      );

      rows.forEach((row) => {
        const index = row.pass - rows[0].pass;
        const top = L.firstRowY + index * L.rowStep;
        const bottom = top + L.rowHeight;
        const centerY = top + L.rowHeight / L.connectorInset;

        addRect(drawing, L.rowX, top, L.rowRight, bottom, "row-band");

        addText(
          drawing,
          L.passX,
          centerY,
          "pass-label",
          `проход ${row.pass}`,
          "end"
        );

        rows.forEach((columnRow) => {
          const column = columnRow.pass - rows[0].pass;
          const left = L.gridX + column * (L.cellWidth + L.cellGap);
          const right = left + L.cellWidth;
          const centerX = left + L.cellWidth / L.connectorInset;
          const isValidation = columnRow.pass === row.validation;

          addRect(
            drawing,
            left,
            top,
            right,
            bottom,
            isValidation ? "validation-cell" : "train-cell"
          );

          addText(
            drawing,
            centerX,
            centerY - L.roleLift,
            isValidation ? "cell-role validation-role" : "cell-role",
            isValidation ? "проверка" : "обучение",
            "middle"
          );

          addText(
            drawing,
            centerX,
            centerY + L.countDrop,
            isValidation ? "cell-count validation-count" : "cell-count",
            `${L.sixty} объектов`,
            "middle"
          );
        });

        const scoreLeft = L.scoreX;
        const scoreRight = L.scoreX + L.scoreWidth;
        const scoreTop = top + L.scoreInset;
        const scoreBottom = bottom - L.scoreInset;
        const isHard = row.pass === L.hardPass;

        addRect(
          drawing,
          scoreLeft,
          scoreTop,
          scoreRight,
          scoreBottom,
          isHard ? "score-box hard-score" : "score-box"
        );

        addText(
          drawing,
          scoreLeft + L.scoreWidth / L.connectorInset,
          centerY,
          isHard ? "score-text hard-text" : "score-text",
          row.score,
          "middle"
        );
      });

      addRect(
        drawing,
        L.legendTrainX,
        L.legendBoxY,
        L.legendTrainX + L.legendBoxWidth,
        L.legendBoxY + L.legendBoxHeight,
        "legend-train"
      );

      addText(
        drawing,
        L.legendTrainTextX,
        L.legendY,
        "legend-text",
        `обучение: ${L.sixty} объектов`,
        "start"
      );

      addRect(
        drawing,
        L.legendValidationX,
        L.legendBoxY,
        L.legendValidationX + L.legendBoxWidth,
        L.legendBoxY + L.legendBoxHeight,
        "legend-validation"
      );

      addText(
        drawing,
        L.legendValidationTextX,
        L.legendY,
        "legend-text",
        `проверка: ${L.sixty} объектов`,
        "start"
      );

      addText(
        drawing,
        L.conclusionX,
        L.conclusionY,
        "conclusion",
        "Каждый объект ровно один раз проверяет модель",
        "middle"
      );

      fallback.style.display = "none";
    } catch (error) {
      document.getElementById("diagram").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
