<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Две кривые качества при росте выборки</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: ivory;
      --surface: whitesmoke;
      --ink: midnightblue;
      --muted: slategray;
      --guide: lightgray;
      --border: darkgray;
      --train: darkorange;
      --validation: royalblue;
      --gap: mediumvioletred;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: midnightblue;
        --surface: darkslateblue;
        --ink: whitesmoke;
        --muted: lightsteelblue;
        --guide: slategray;
        --border: lightslategray;
        --train: orange;
        --validation: deepskyblue;
        --gap: hotpink;
      }
    }

    html,
    body {
      background: var(--background);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .title {
      font-size: 20px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--background);
    }

    svg:empty {
      display: none;
    }

    .panel {
      fill: var(--surface);
      stroke: var(--border);
      stroke-width: 1.5;
    }

    .guide {
      fill: none;
      stroke: var(--guide);
      stroke-width: 1;
    }

    .axis {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tick {
      stroke: var(--muted);
      stroke-width: 1.4;
    }

    .curve {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .train {
      stroke: var(--train);
    }

    .validation {
      stroke: var(--validation);
    }

    .point {
      stroke: var(--surface);
      stroke-width: 2;
    }

    .gap {
      fill: none;
      stroke: var(--gap);
      stroke-width: 2;
      stroke-linecap: round;
    }

    .panel-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .axis-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .legend-label {
      fill: var(--ink);
      font-size: 15px;
    }

    .gap-label {
      fill: var(--gap);
      font-size: 15px;
      font-weight: bold;
    }

    #fallback {
      color: var(--ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="title" id="diagram-heading">Две кривые качества при росте выборки</div>

  <svg
    id="diagram"
    viewBox="0 0 1200 470"
    width="1200"
    height="470"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-heading diagram-description"
  ></svg>

  <p id="fallback">
    Схема должна показывать два графика train и validation: слева кривые
    сходятся на низком качестве, справа между ними сохраняется большой разрыв.
  </p>

  <script>
    const data = Object.freeze([
      {
        origin: [0, 470],
        scale: [10, -10],
        zero: 0,
        markerRadius: 0.36,
        arrow: { back: 1.2, wing: 0.58 },
        axisBottom: 12,
        axisTop: 39.2,
        tickBottom: 11.35,
        tickLabelY: 9.55,
        axisCaptionY: 6.55,
        qualityLabelY: 40.25,
        guides: [18, 25, 32],
        legendY: 45.35,
        legend: [
          {
            from: 29,
            to: 34,
            point: 31.5,
            textX: 35.3,
            text: "train — обучение",
            className: "train"
          },
          {
            from: 65,
            to: 70,
            point: 67.5,
            textX: 71.3,
            text: "validation — проверка",
            className: "validation"
          }
        ]
      },
      {
        id: "low",
        title: "Кривые сходятся низко",
        box: { left: 3.5, right: 59, bottom: 2.5, top: 43.35 },
        titlePoint: { x: 31.25, y: 42.05 },
        axis: { left: 7.2, right: 56.2 },
        train: [
          { x: 11, y: 35.2, label: "10%" },
          { x: 19, y: 31.4, label: "20%" },
          { x: 27, y: 28.4, label: "40%" },
          { x: 35, y: 26.3, label: "60%" },
          { x: 43, y: 24.9, label: "80%" },
          { x: 51, y: 24.1, label: "100%" }
        ],
        validation: [
          { x: 11, y: 16.1 },
          { x: 19, y: 19.1 },
          { x: 27, y: 21.2 },
          { x: 35, y: 22.4 },
          { x: 43, y: 23.2 },
          { x: 51, y: 23.7 }
        ],
        gap: {
          x: 53.15,
          capLeft: 52.55,
          capRight: 53.75,
          top: 24.1,
          bottom: 23.7
        }
      },
      {
        id: "wide",
        title: "Большой разрыв сохраняется",
        box: { left: 61, right: 116.5, bottom: 2.5, top: 43.35 },
        titlePoint: { x: 88.75, y: 42.05 },
        axis: { left: 64.7, right: 113.7 },
        train: [
          { x: 68.5, y: 38.2, label: "10%" },
          { x: 76.5, y: 37.5, label: "20%" },
          { x: 84.5, y: 36.8, label: "40%" },
          { x: 92.5, y: 35.9, label: "60%" },
          { x: 100.5, y: 35.1, label: "80%" },
          { x: 108.5, y: 34.2, label: "100%" }
        ],
        validation: [
          { x: 68.5, y: 14.5 },
          { x: 76.5, y: 17.2 },
          { x: 84.5, y: 19.8 },
          { x: 92.5, y: 22.1 },
          { x: 100.5, y: 24.0 },
          { x: 108.5, y: 25.2 }
        ],
        gap: {
          x: 110.65,
          capLeft: 110.05,
          capRight: 111.25,
          top: 34.2,
          bottom: 25.2,
          labelX: 109.4,
          labelY: 29.7,
          label: "большой разрыв"
        }
      }
    ]);

    const [settings, leftPanel, rightPanel] = data;
    const {
      origin: [originX, originY],
      scale: [scaleX, scaleY]
    } = settings;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    function makeNode(tag, attributes, content) {
      const element = document.createElementNS(namespace, tag);

      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });

      if (content !== undefined) {
        element.textContent = content;
      }

      return element;
    }

    function addLine(parent, x1, y1, x2, y2, className) {
      parent.appendChild(makeNode("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }));
    }

    function addPolyline(parent, points, className) {
      const encoded = points
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");

      parent.appendChild(makeNode("polyline", {
        points: encoded,
        class: className
      }));
    }

    function addText(parent, point, content, className, anchor) {
      parent.appendChild(makeNode("text", {
        x: sx(point.x),
        y: sy(point.y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, content));
    }

    function addCircle(parent, point, className) {
      parent.appendChild(makeNode("circle", {
        cx: sx(point.x),
        cy: sy(point.y),
        r: Math.abs(sx(settings.markerRadius) - sx(settings.zero)),
        class: `point ${className}`
      }));
    }

    function addHorizontalArrow(parent, startX, endX, y) {
      addLine(parent, startX, y, endX, y, "axis");

      addPolyline(parent, [
        {
          x: endX - settings.arrow.back,
          y: y + settings.arrow.wing
        },
        { x: endX, y },
        {
          x: endX - settings.arrow.back,
          y: y - settings.arrow.wing
        }
      ], "axis");
    }

    function addVerticalArrow(parent, x, startY, endY) {
      addLine(parent, x, startY, x, endY, "axis");

      addPolyline(parent, [
        {
          x: x - settings.arrow.wing,
          y: endY - settings.arrow.back
        },
        { x, y: endY },
        {
          x: x + settings.arrow.wing,
          y: endY - settings.arrow.back
        }
      ], "axis");
    }

    function drawLegend(parent) {
      settings.legend.forEach(item => {
        addLine(
          parent,
          item.from,
          settings.legendY,
          item.to,
          settings.legendY,
          `curve ${item.className}`
        );

        addCircle(
          parent,
          { x: item.point, y: settings.legendY },
          item.className
        );

        addText(
          parent,
          { x: item.textX, y: settings.legendY },
          item.text,
          "legend-label",
          "start"
        );
      });
    }

    function drawPanel(panel) {
      const group = makeNode("g", {
        "aria-label": panel.title
      });

      group.appendChild(makeNode("rect", {
        x: sx(panel.box.left),
        y: sy(panel.box.top),
        width: sx(panel.box.right) - sx(panel.box.left),
        height: sy(panel.box.bottom) - sy(panel.box.top),
        class: "panel"
      }));

      settings.guides.forEach(guideY => {
        addLine(
          group,
          panel.axis.left,
          guideY,
          panel.axis.right,
          guideY,
          "guide"
        );
      });

      addHorizontalArrow(
        group,
        panel.axis.left,
        panel.axis.right,
        settings.axisBottom
      );

      addVerticalArrow(
        group,
        panel.axis.left,
        settings.axisBottom,
        settings.axisTop
      );

      panel.train.forEach(point => {
        addLine(
          group,
          point.x,
          settings.axisBottom,
          point.x,
          settings.tickBottom,
          "tick"
        );

        addText(
          group,
          { x: point.x, y: settings.tickLabelY },
          point.label,
          "tick-label",
          "middle"
        );
      });

      addText(
        group,
        panel.titlePoint,
        panel.title,
        "panel-title",
        "middle"
      );

      addText(
        group,
        {
          x: panel.axis.left,
          y: settings.qualityLabelY
        },
        "Качество",
        "axis-label",
        "start"
      );

      addText(
        group,
        {
          x: panel.titlePoint.x,
          y: settings.axisCaptionY
        },
        "Размер обучающей выборки",
        "axis-label",
        "middle"
      );

      addPolyline(group, panel.train, "curve train");
      addPolyline(group, panel.validation, "curve validation");

      panel.train.forEach(point => addCircle(group, point, "train"));
      panel.validation.forEach(point => addCircle(group, point, "validation"));

      addLine(
        group,
        panel.gap.x,
        panel.gap.bottom,
        panel.gap.x,
        panel.gap.top,
        "gap"
      );

      addLine(
        group,
        panel.gap.capLeft,
        panel.gap.top,
        panel.gap.capRight,
        panel.gap.top,
        "gap"
      );

      addLine(
        group,
        panel.gap.capLeft,
        panel.gap.bottom,
        panel.gap.capRight,
        panel.gap.bottom,
        "gap"
      );

      if (panel.gap.label) {
        addText(
          group,
          {
            x: panel.gap.labelX,
            y: panel.gap.labelY
          },
          panel.gap.label,
          "gap-label",
          "end"
        );
      }

      svg.appendChild(group);
    }

    try {
      svg.appendChild(makeNode(
        "desc",
        { id: "diagram-description" },
        "Слева train и validation сходятся на низком качестве. Справа train остаётся заметно выше validation даже при росте выборки."
      ));

      drawLegend(svg);
      drawPanel(leftPanel);
      drawPanel(rightPanel);
      fallback.hidden = true;
    } catch (error) {
      svg.replaceChildren();
      fallback.hidden = false;
      fallback.textContent =
        "Не удалось построить схему. Она должна показывать два графика train и validation: слева кривые сходятся на низком качестве, справа между ними сохраняется большой разрыв.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
