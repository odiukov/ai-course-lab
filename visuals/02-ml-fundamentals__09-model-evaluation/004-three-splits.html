<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Разделение данных на train, validation и test</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: snow;
      --ink: midnightblue;
      --muted: slategray;
      --arrow: steelblue;
      --source-fill: lavender;
      --source-stroke: slateblue;
      --train-fill: aliceblue;
      --train-stroke: royalblue;
      --validation-fill: cornsilk;
      --validation-stroke: darkorange;
      --test-fill: honeydew;
      --test-stroke: seagreen;
      --process-fill: white;
      --joint: royalblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: midnightblue;
        --ink: snow;
        --muted: lightsteelblue;
        --arrow: lightskyblue;
        --source-fill: darkslateblue;
        --source-stroke: plum;
        --train-fill: darkslateblue;
        --train-stroke: lightskyblue;
        --validation-fill: saddlebrown;
        --validation-stroke: orange;
        --test-fill: darkgreen;
        --test-stroke: lightgreen;
        --process-fill: darkslategray;
        --joint: lightskyblue;
      }
    }

    html,
    body {
      background: var(--background);
      color: var(--ink);
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    h2 {
      color: var(--ink);
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--background);
    }

    .source,
    .card,
    .process {
      stroke-width: 2;
    }

    .source {
      fill: var(--source-fill);
      stroke: var(--source-stroke);
    }

    .train {
      fill: var(--train-fill);
      stroke: var(--train-stroke);
    }

    .validation {
      fill: var(--validation-fill);
      stroke: var(--validation-stroke);
    }

    .test {
      fill: var(--test-fill);
      stroke: var(--test-stroke);
    }

    .process {
      fill: var(--process-fill);
    }

    .arrow {
      fill: none;
      stroke: var(--arrow);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--arrow);
      stroke: var(--arrow);
      stroke-width: 2;
      stroke-linejoin: round;
    }

    .joint {
      fill: var(--joint);
    }

    .title-text {
      fill: var(--ink);
      font-size: 20px;
      font-weight: bold;
    }

    .section-name {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .count {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .description {
      fill: var(--muted);
      font-size: 14px;
    }

    .process-title {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .process-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .arrow-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .loop-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    #fallback {
      color: var(--ink);
      background: var(--background);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h2>Разделение данных до обучения</h2>

    <svg
      id="scheme"
      viewBox="0 0 940 450"
      width="940"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="scheme-title scheme-description"
    >
      <title id="scheme-title">Разделение 300 объектов на три выборки</title>
      <desc id="scheme-description">
        Из 300 объектов заранее выделены 180 объектов для обучения,
        60 для настройки и 60 для одной финальной оценки.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" hidden>
      Схема должна показать, как 300 объектов заранее делятся на
      180 train, 60 validation и 60 test: на train модель обучают,
      по validation её настраивают, а test используют один раз для
      финальной оценки.
    </p>
  </main>

  <script>
    (() => {
      const diagram = [
        {
          kind: "mapping",
          originX: 0,
          originY: 0,
          scaleX: 1,
          scaleY: 1
        },

        {
          kind: "rect",
          x: 275,
          y: 25,
          w: 390,
          h: 62,
          className: "source"
        },
        {
          kind: "text",
          x: 470,
          y: 52,
          value: "ВСЕ ДАННЫЕ · 300 ОБЪЕКТОВ",
          className: "title-text",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 470,
          y: 76,
          value: "разделяем заранее — до обучения",
          className: "description",
          anchor: "middle"
        },

        {
          kind: "polyline",
          points: [
            { x: 470, y: 87 },
            { x: 470, y: 125 },
            { x: 195, y: 125 },
            { x: 195, y: 170 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 195, y: 170 },
            { x: 187, y: 158 },
            { x: 203, y: 158 }
          ],
          className: "arrow-head"
        },
        {
          kind: "polyline",
          points: [
            { x: 470, y: 87 },
            { x: 470, y: 125 },
            { x: 495, y: 125 },
            { x: 495, y: 170 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 495, y: 170 },
            { x: 487, y: 158 },
            { x: 503, y: 158 }
          ],
          className: "arrow-head"
        },
        {
          kind: "polyline",
          points: [
            { x: 470, y: 87 },
            { x: 470, y: 125 },
            { x: 770, y: 125 },
            { x: 770, y: 170 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 770, y: 170 },
            { x: 762, y: 158 },
            { x: 778, y: 158 }
          ],
          className: "arrow-head"
        },
        {
          kind: "circle",
          x: 470,
          y: 125,
          r: 5,
          className: "joint"
        },

        {
          kind: "rect",
          x: 45,
          y: 170,
          w: 300,
          h: 95,
          className: "card train"
        },
        {
          kind: "text",
          x: 195,
          y: 197,
          value: "TRAIN · ОБУЧАЮЩАЯ",
          className: "section-name",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 195,
          y: 225,
          value: "180 объектов",
          className: "count",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 195,
          y: 249,
          value: "модель видит эти примеры",
          className: "description",
          anchor: "middle"
        },

        {
          kind: "rect",
          x: 370,
          y: 170,
          w: 250,
          h: 95,
          className: "card validation"
        },
        {
          kind: "text",
          x: 495,
          y: 197,
          value: "VALIDATION · ПРОВЕРОЧНАЯ",
          className: "section-name",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 495,
          y: 225,
          value: "60 объектов",
          className: "count",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 495,
          y: 249,
          value: "по ней принимают решения",
          className: "description",
          anchor: "middle"
        },

        {
          kind: "rect",
          x: 645,
          y: 170,
          w: 250,
          h: 95,
          className: "card test"
        },
        {
          kind: "text",
          x: 770,
          y: 197,
          value: "TEST · ТЕСТОВАЯ",
          className: "section-name",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 770,
          y: 225,
          value: "60 объектов",
          className: "count",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 770,
          y: 249,
          value: "остаётся запечатанной",
          className: "description",
          anchor: "middle"
        },

        {
          kind: "polyline",
          points: [
            { x: 195, y: 265 },
            { x: 195, y: 330 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 195, y: 330 },
            { x: 187, y: 318 },
            { x: 203, y: 318 }
          ],
          className: "arrow-head"
        },
        {
          kind: "polyline",
          points: [
            { x: 495, y: 265 },
            { x: 495, y: 330 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 495, y: 330 },
            { x: 487, y: 318 },
            { x: 503, y: 318 }
          ],
          className: "arrow-head"
        },
        {
          kind: "polyline",
          points: [
            { x: 770, y: 265 },
            { x: 770, y: 330 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 770, y: 330 },
            { x: 762, y: 318 },
            { x: 778, y: 318 }
          ],
          className: "arrow-head"
        },

        {
          kind: "rect",
          x: 75,
          y: 330,
          w: 240,
          h: 70,
          className: "process train"
        },
        {
          kind: "text",
          x: 195,
          y: 358,
          value: "ОБУЧЕНИЕ МОДЕЛИ",
          className: "process-title",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 195,
          y: 383,
          value: "учимся на train",
          className: "process-note",
          anchor: "middle"
        },

        {
          kind: "rect",
          x: 390,
          y: 330,
          w: 210,
          h: 70,
          className: "process validation"
        },
        {
          kind: "text",
          x: 495,
          y: 358,
          value: "НАСТРОЙКА",
          className: "process-title",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 495,
          y: 383,
          value: "сверяемся с validation",
          className: "process-note",
          anchor: "middle"
        },

        {
          kind: "rect",
          x: 670,
          y: 330,
          w: 200,
          h: 70,
          className: "process test"
        },
        {
          kind: "text",
          x: 770,
          y: 356,
          value: "ОДНА ФИНАЛЬНАЯ ОЦЕНКА",
          className: "process-title",
          anchor: "middle"
        },
        {
          kind: "text",
          x: 770,
          y: 382,
          value: "на test · в самом конце",
          className: "process-note",
          anchor: "middle"
        },

        {
          kind: "polyline",
          points: [
            { x: 315, y: 365 },
            { x: 390, y: 365 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 390, y: 365 },
            { x: 378, y: 357 },
            { x: 378, y: 373 }
          ],
          className: "arrow-head"
        },
        {
          kind: "text",
          x: 352,
          y: 317,
          value: "смотрим метрику",
          className: "arrow-label",
          anchor: "middle"
        },

        {
          kind: "polyline",
          points: [
            { x: 600, y: 365 },
            { x: 670, y: 365 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 670, y: 365 },
            { x: 658, y: 357 },
            { x: 658, y: 373 }
          ],
          className: "arrow-head"
        },
        {
          kind: "text",
          x: 635,
          y: 317,
          value: "модель выбрана",
          className: "arrow-label",
          anchor: "middle"
        },

        {
          kind: "curve",
          points: [
            { x: 495, y: 400 },
            { x: 495, y: 430 },
            { x: 195, y: 430 },
            { x: 195, y: 400 }
          ],
          className: "arrow"
        },
        {
          kind: "polygon",
          points: [
            { x: 195, y: 400 },
            { x: 187, y: 412 },
            { x: 203, y: 412 }
          ],
          className: "arrow-head"
        },
        {
          kind: "text",
          x: 345,
          y: 446,
          value: "цикл: обучаем → проверяем → настраиваем",
          className: "loop-label",
          anchor: "middle"
        }
      ];

      const [mapping, ...items] = diagram;
      const origin = {
        x: mapping.originX,
        y: mapping.originY
      };
      const scale = {
        x: mapping.scaleX,
        y: mapping.scaleY
      };

      const sx = x => origin.x + x * scale.x;
      const sy = y => origin.y + y * scale.y;

      const svg = document.getElementById("scheme");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");

      const make = tag => document.createElementNS(svg.namespaceURI, tag);

      const setCommon = (element, item) => {
        element.setAttribute("class", item.className);
        return element;
      };

      const pointList = points =>
        points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

      try {
        for (const item of items) {
          let element;

          if (item.kind === "rect") {
            element = make("rect");
            element.setAttribute("x", sx(item.x));
            element.setAttribute("y", sy(item.y));
            element.setAttribute("width", sx(item.x + item.w) - sx(item.x));
            element.setAttribute("height", sy(item.y + item.h) - sy(item.y));
          }

          if (item.kind === "circle") {
            element = make("circle");
            element.setAttribute("cx", sx(item.x));
            element.setAttribute("cy", sy(item.y));
            element.setAttribute("r", sx(item.x + item.r) - sx(item.x));
          }

          if (item.kind === "polyline") {
            element = make("polyline");
            element.setAttribute("points", pointList(item.points));
          }

          if (item.kind === "polygon") {
            element = make("polygon");
            element.setAttribute("points", pointList(item.points));
          }

          if (item.kind === "curve") {
            const [start, firstControl, secondControl, end] = item.points;
            element = make("path");
            element.setAttribute(
              "d",
              [
                "M",
                sx(start.x),
                sy(start.y),
                "C",
                sx(firstControl.x),
                sy(firstControl.y),
                sx(secondControl.x),
                sy(secondControl.y),
                sx(end.x),
                sy(end.y)
              ].join(" ")
            );
          }

          if (item.kind === "text") {
            element = make("text");
            element.setAttribute("x", sx(item.x));
            element.setAttribute("y", sy(item.y));
            element.setAttribute("text-anchor", item.anchor);
            element.textContent = item.value;
          }

          if (!element) {
            throw new Error("Неизвестный элемент схемы");
          }

          drawing.appendChild(setCommon(element, item));
        }
      } catch (error) {
        svg.hidden = true;
        fallback.hidden = false;
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
