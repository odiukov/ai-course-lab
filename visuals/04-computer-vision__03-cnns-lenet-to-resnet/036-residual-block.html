<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Основной и обходной пути residual-блока</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #526078;
      --main: #2563eb;
      --main-soft: #e8f1ff;
      --main-band: #f5f8ff;
      --skip: #d97706;
      --skip-soft: #fff3d6;
      --skip-band: #fffaf0;
      --merge: #7c3aed;
      --merge-soft: #f2eaff;
      --result: #168453;
      --result-soft: #e3f8ec;
      --border: #cbd5e1;
      --note: #eef2f7;
      --shadow: #17203318;
      --line-width: 3px;
      --minor-line-width: 2px;
      --title-size: 22px;
      --body-size: 18px;
      --small-size: 15px;
      --symbol-size: 25px;
      --label-pad: 8px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1422;
        --panel: #151f30;
        --ink: #eef4ff;
        --muted: #b7c2d4;
        --main: #75a9ff;
        --main-soft: #19345b;
        --main-band: #111d31;
        --skip: #f4b454;
        --skip-soft: #4a3215;
        --skip-band: #261d12;
        --merge: #bc9aff;
        --merge-soft: #342653;
        --result: #66d69e;
        --result-soft: #173d2d;
        --border: #435168;
        --note: #202c3e;
        --shadow: #00000035;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      overflow: hidden;
    }

    .figure__title {
      margin: 0;
      padding: 14px 20px 10px;
      border-bottom: var(--minor-line-width) solid var(--border);
      font-size: var(--title-size);
      font-weight: 750;
      line-height: 1.25;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    .band-main {
      fill: var(--main-band);
      stroke: var(--main-soft);
      stroke-width: var(--minor-line-width);
    }

    .band-skip {
      fill: var(--skip-band);
      stroke: var(--skip-soft);
      stroke-width: var(--minor-line-width);
    }

    .block-main {
      fill: var(--main-soft);
      stroke: var(--main);
      stroke-width: var(--line-width);
    }

    .block-activation {
      fill: var(--merge-soft);
      stroke: var(--merge);
      stroke-width: var(--line-width);
    }

    .block-result {
      fill: var(--result-soft);
      stroke: var(--result);
      stroke-width: var(--line-width);
    }

    .node-input {
      fill: var(--panel);
      stroke: var(--main);
      stroke-width: var(--line-width);
    }

    .merge-node {
      fill: var(--merge-soft);
      stroke: var(--merge);
      stroke-width: var(--line-width);
    }

    .branch-node {
      fill: var(--ink);
    }

    .line-main,
    .line-result {
      fill: none;
      stroke: var(--main);
      stroke-width: var(--line-width);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line-skip {
      fill: none;
      stroke: var(--skip);
      stroke-width: var(--line-width);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .line-result {
      stroke: var(--result);
    }

    .head-main {
      fill: var(--main);
    }

    .head-skip {
      fill: var(--skip);
    }

    .head-result {
      fill: var(--result);
    }

    .note-box {
      fill: var(--note);
      stroke: var(--border);
      stroke-width: var(--minor-line-width);
    }

    text {
      fill: var(--ink);
      font-size: var(--body-size);
      text-rendering: geometricPrecision;
    }

    .text-strong {
      font-weight: 750;
    }

    .text-small {
      fill: var(--muted);
      font-size: var(--small-size);
      font-weight: 650;
    }

    .text-main {
      fill: var(--main);
    }

    .text-skip {
      fill: var(--skip);
    }

    .text-result {
      fill: var(--result);
    }

    .text-symbol {
      font-size: var(--symbol-size);
      font-weight: 800;
    }

    .fallback {
      padding: 24px;
      color: var(--ink);
      background: var(--panel);
      font-size: var(--body-size);
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title">
    <figcaption class="figure__title" id="figure-title">
      Основной и обходной пути residual-блока
    </figcaption>
    <svg id="diagram"
         viewBox="0 0 1160 448"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Схема residual-блока</title>
      <desc id="svg-desc">
        Вход x одновременно проходит через две последовательные стадии свёртка и BN
        и напрямую по обходному пути. Потоки складываются, после чего применяется ReLU.
      </desc>
    </svg>
    <div class="fallback" id="fallback" hidden>
      Схема должна была показать два одновременных пути: основной путь формирует
      поправку F(x), обходной сохраняет x, затем F(x) + x проходит через ReLU.
    </div>
  </figure>

  <script>
    const diagramData = [
      {
        zero: 0,
        origin: { x: 0, y: 0 },
        scale: { x: 1, y: 1 },
        canvas: { x: 0, y: 0, width: 1160, height: 448 },
        corner: 16,
        smallCorner: 11,
        lineWidth: 3,
        minorLineWidth: 2,
        fontSize: 18,
        smallFontSize: 15,
        symbolFontSize: 25,
        labelPadding: 8
      },
      { kind: "rect", className: "band-main", x: 158, y: 46, width: 728, height: 188, radius: 16 },
      { kind: "rect", className: "band-skip", x: 158, y: 254, width: 728, height: 112, radius: 16 },

      { kind: "text", className: "text-small text-main", x: 181, y: 76, anchor: "start", value: "ОСНОВНОЙ ПУТЬ: выучить поправку F(x)" },
      { kind: "text", className: "text-small text-skip", x: 181, y: 346, anchor: "start", value: "ОБХОДНОЙ ПУТЬ: сохранить x без изменений" },

      { kind: "rect", className: "node-input", x: 30, y: 137, width: 100, height: 74, radius: 16 },
      { kind: "text", className: "text-symbol", x: 80, y: 182, anchor: "middle", value: "x" },
      { kind: "text", className: "text-small", x: 80, y: 124, anchor: "middle", value: "вход" },

      {
        kind: "arrow",
        className: "line-main",
        headClass: "head-main",
        points: [{ x: 130, y: 174 }, { x: 190, y: 174 }],
        head: [{ x: 190, y: 174 }, { x: 178, y: 167 }, { x: 178, y: 181 }]
      },
      { kind: "circle", className: "branch-node", x: 190, y: 174, radius: 7 },
      { kind: "text", className: "text-small", x: 190, y: 218, anchor: "middle", value: "один вход — два потока" },

      {
        kind: "arrow",
        className: "line-main",
        headClass: "head-main",
        points: [{ x: 190, y: 174 }, { x: 255, y: 174 }],
        head: [{ x: 255, y: 174 }, { x: 243, y: 167 }, { x: 243, y: 181 }]
      },
      { kind: "rect", className: "block-main", x: 255, y: 128, width: 176, height: 92, radius: 16 },
      { kind: "text", className: "text-strong", x: 343, y: 166, anchor: "middle", value: "Свёртка" },
      { kind: "text", className: "text-small text-main", x: 343, y: 194, anchor: "middle", value: "+ BN" },

      {
        kind: "arrow",
        className: "line-main",
        headClass: "head-main",
        points: [{ x: 431, y: 174 }, { x: 469, y: 174 }],
        head: [{ x: 469, y: 174 }, { x: 457, y: 167 }, { x: 457, y: 181 }]
      },
      { kind: "rect", className: "block-activation", x: 469, y: 145, width: 92, height: 58, radius: 11 },
      { kind: "text", className: "text-strong", x: 515, y: 181, anchor: "middle", value: "ReLU" },

      {
        kind: "arrow",
        className: "line-main",
        headClass: "head-main",
        points: [{ x: 561, y: 174 }, { x: 599, y: 174 }],
        head: [{ x: 599, y: 174 }, { x: 587, y: 167 }, { x: 587, y: 181 }]
      },
      { kind: "rect", className: "block-main", x: 599, y: 128, width: 176, height: 92, radius: 16 },
      { kind: "text", className: "text-strong", x: 687, y: 166, anchor: "middle", value: "Свёртка" },
      { kind: "text", className: "text-small text-main", x: 687, y: 194, anchor: "middle", value: "+ BN" },

      {
        kind: "arrow",
        className: "line-main",
        headClass: "head-main",
        points: [{ x: 775, y: 174 }, { x: 839, y: 174 }],
        head: [{ x: 839, y: 174 }, { x: 827, y: 167 }, { x: 827, y: 181 }]
      },
      { kind: "text", className: "text-strong text-main", x: 802, y: 151, anchor: "middle", value: "F(x)" },

      {
        kind: "arrow",
        className: "line-skip",
        headClass: "head-skip",
        points: [
          { x: 190, y: 174 },
          { x: 190, y: 310 },
          { x: 870, y: 310 },
          { x: 870, y: 205 }
        ],
        head: [{ x: 870, y: 205 }, { x: 862, y: 219 }, { x: 878, y: 219 }]
      },
      { kind: "text", className: "text-strong text-skip", x: 210, y: 289, anchor: "start", value: "x" },

      { kind: "circle", className: "merge-node", x: 870, y: 174, radius: 31 },
      { kind: "text", className: "text-symbol", x: 870, y: 183, anchor: "middle", value: "+" },
      { kind: "text", className: "text-small", x: 870, y: 116, anchor: "middle", value: "сложение" },

      {
        kind: "arrow",
        className: "line-result",
        headClass: "head-result",
        points: [{ x: 901, y: 174 }, { x: 951, y: 174 }],
        head: [{ x: 951, y: 174 }, { x: 939, y: 167 }, { x: 939, y: 181 }]
      },
      { kind: "text", className: "text-strong text-result", x: 926, y: 224, anchor: "middle", value: "F(x) + x" },

      { kind: "rect", className: "block-result", x: 951, y: 145, width: 105, height: 58, radius: 11 },
      { kind: "text", className: "text-strong", x: 1004, y: 181, anchor: "middle", value: "ReLU" },

      {
        kind: "arrow",
        className: "line-result",
        headClass: "head-result",
        points: [{ x: 1056, y: 174 }, { x: 1091, y: 174 }],
        head: [{ x: 1091, y: 174 }, { x: 1079, y: 167 }, { x: 1079, y: 181 }]
      },
      { kind: "rect", className: "block-result", x: 1091, y: 137, width: 52, height: 74, radius: 16 },
      { kind: "text", className: "text-symbol text-result", x: 1117, y: 182, anchor: "middle", value: "y" },
      { kind: "text", className: "text-small", x: 1117, y: 124, anchor: "middle", value: "выход" },

      { kind: "rect", className: "note-box", x: 281, y: 386, width: 598, height: 46, radius: 11 },
      { kind: "text", className: "text-small", x: 580, y: 414, anchor: "middle", value: "Если форма меняется: на обходном пути 1 × 1, иногда с шагом 2" }
    ];

    const [settings, ...items] = diagramData;
    const origin = Object.freeze(settings.origin);
    const scale = Object.freeze(settings.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      svg.setAttribute(
        "viewBox",
        [
          sx(settings.canvas.x),
          sy(settings.canvas.y),
          sx(settings.canvas.width) - sx(settings.zero),
          sy(settings.canvas.height) - sy(settings.zero)
        ].join(" ")
      );

      const make = (name, attributes) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };

      const layer = make("g", { "aria-hidden": "true" });
      svg.appendChild(layer);

      items.forEach(item => {
        if (item.kind === "rect") {
          layer.appendChild(make("rect", {
            class: item.className,
            x: sx(item.x),
            y: sy(item.y),
            width: sx(item.x + item.width) - sx(item.x),
            height: sy(item.y + item.height) - sy(item.y),
            rx: sx(item.radius) - sx(settings.zero),
            ry: sy(item.radius) - sy(settings.zero)
          }));
        }

        if (item.kind === "circle") {
          layer.appendChild(make("circle", {
            class: item.className,
            cx: sx(item.x),
            cy: sy(item.y),
            r: sx(item.radius) - sx(settings.zero)
          }));
        }

        if (item.kind === "text") {
          const textNode = make("text", {
            class: item.className,
            x: sx(item.x),
            y: sy(item.y),
            "text-anchor": item.anchor,
            "dominant-baseline": "alphabetic"
          });
          textNode.textContent = item.value;
          layer.appendChild(textNode);
        }

        if (item.kind === "arrow") {
          layer.appendChild(make("polyline", {
            class: item.className,
            points: item.points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
          }));
          layer.appendChild(make("polygon", {
            class: item.headClass,
            points: item.head.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
          }));
        }
      });
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
