<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь от LeNet-5 до ResNet</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #eef1f7;
    --bg: #f8f9fd;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #667085;
    --border: #c8cfdd;
    --track: #7b8497;
    --blue: #3974d8;
    --blue-soft: #dce9ff;
    --violet: #7657c8;
    --violet-soft: #e9e1ff;
    --green: #25866c;
    --green-soft: #d9f3e9;
    --orange: #b56820;
    --orange-soft: #ffead2;
    --red: #bd4d5b;
    --red-soft: #ffe0e4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111521;
      --bg: #171c29;
      --panel: #202737;
      --ink: #edf1fa;
      --muted: #aeb7c9;
      --border: #465067;
      --track: #9aa5ba;
      --blue: #75a7ff;
      --blue-soft: #253d68;
      --violet: #b79cff;
      --violet-soft: #403563;
      --green: #6fd4b2;
      --green-soft: #244f45;
      --orange: #f0ae66;
      --orange-soft: #5a3b24;
      --red: #ff92a0;
      --red-soft: #60323b;
    }
  }

  html, body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    margin: unset;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .diagram {
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .heading {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  svg:empty {
    display: none;
  }

  .fallback {
    margin: unset;
    padding: 16px;
    font-size: 16px;
    color: var(--ink);
  }

  .card {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 2;
  }

  .timeline {
    fill: none;
    stroke: var(--track);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .connector {
    fill: none;
    stroke: var(--border);
    stroke-width: 2;
  }

  .feature-line {
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .marker {
    stroke: var(--bg);
    stroke-width: 3;
  }

  .lenet-color { color: var(--blue); }
  .alex-color { color: var(--violet); }
  .vgg-color { color: var(--green); }
  .inception-color { color: var(--orange); }
  .resnet-color { color: var(--red); }

  .lenet-fill { fill: var(--blue-soft); stroke: var(--blue); }
  .alex-fill { fill: var(--violet-soft); stroke: var(--violet); }
  .vgg-fill { fill: var(--green-soft); stroke: var(--green); }
  .inception-fill { fill: var(--orange-soft); stroke: var(--orange); }
  .resnet-fill { fill: var(--red-soft); stroke: var(--red); }

  .feature-box {
    stroke-width: 2;
  }

  .card-title {
    fill: var(--ink);
    font-size: 18px;
    font-weight: bold;
  }

  .card-subtitle {
    fill: var(--muted);
    font-size: 14px;
  }

  .year {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .inside {
    fill: var(--ink);
    font-size: 12px;
    font-weight: bold;
  }

  .stat {
    fill: var(--muted);
    font-size: 13px;
  }

  .footer-box {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1;
  }

  .footer-label {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  line, polyline, polygon, rect, circle {
    vector-effect: non-scaling-stroke;
  }
</style>
</head>
<body>
<main class="diagram">
  <header class="heading">Путь от LeNet-5 до ResNet</header>
  <p id="fallback" class="fallback">
    Временная шкала: LeNet-5 закрепила свёртки и уменьшение, AlexNet добавила ReLU,
    VGG — стеки 3×3, Inception — параллельные ветки, ResNet — пропускающие связи.
  </p>
  <svg id="canvas" viewBox="0 0 1200 470" width="1200" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Временная шкала архитектур компьютерного зрения"></svg>
</main>

<script>
const [DATA] = Object.freeze([{
  origin: {x: 0, y: 0},
  scale: {x: 1, y: 1},
  timeline: {
    line: {a: {x: 60, y: 235}, b: {x: 1137, y: 235}},
    arrow: [{x: 1145, y: 235}, {x: 1129, y: 226}, {x: 1129, y: 244}]
  },
  events: [
    {
      x: 155, year: "1998", side: "top", color: "lenet",
      card: {x1: 45, y1: 35, x2: 265, y2: 175, r: 14},
      labels: [
        {x: 155, y: 60, text: "LeNet-5", cls: "card-title"},
        {x: 155, y: 82, text: "свёртка + уменьшение", cls: "card-subtitle"},
        {x: 155, y: 158, text: "60 тыс. параметров • CPU", cls: "stat"}
      ],
      boxes: [
        {x1: 72, y1: 105, x2: 99, y2: 133, r: 3},
        {x1: 121, y1: 100, x2: 160, y2: 138, r: 4},
        {x1: 183, y1: 107, x2: 211, y2: 131, r: 4},
        {x1: 235, y1: 111, x2: 246, y2: 127, r: 3}
      ],
      lines: [
        [{x: 99, y: 119}, {x: 121, y: 119}],
        [{x: 160, y: 119}, {x: 183, y: 119}],
        [{x: 211, y: 119}, {x: 235, y: 119}]
      ],
      inside: [
        {x: 140, y: 123, text: "св."},
        {x: 197, y: 123, text: "↓"}
      ]
    },
    {
      x: 350, year: "2012", side: "bottom", color: "alex",
      card: {x1: 255, y1: 290, x2: 445, y2: 415, r: 14},
      labels: [
        {x: 350, y: 315, text: "AlexNet", cls: "card-title"},
        {x: 350, y: 337, text: "глубже • ReLU • dropout", cls: "card-subtitle"},
        {x: 350, y: 399, text: "60 млн • 2 GPU • +10 п.п.", cls: "stat"}
      ],
      boxes: [
        {x1: 278, y1: 352, x2: 304, y2: 377, r: 4},
        {x1: 311, y1: 348, x2: 342, y2: 381, r: 4},
        {x1: 349, y1: 344, x2: 387, y2: 385, r: 5},
        {x1: 394, y1: 351, x2: 422, y2: 378, r: 4}
      ],
      lines: [],
      inside: [{x: 368, y: 369, text: "ReLU"}]
    },
    {
      x: 540, year: "2014", side: "top", color: "vgg",
      card: {x1: 455, y1: 35, x2: 630, y2: 175, r: 14},
      labels: [
        {x: 542, y: 60, text: "VGG", cls: "card-title"},
        {x: 542, y: 82, text: "стеки 3×3", cls: "card-subtitle"},
        {x: 542, y: 158, text: "малые фильтры один за другим", cls: "stat"}
      ],
      boxes: [
        {x1: 476, y1: 103, x2: 507, y2: 135, r: 4},
        {x1: 510, y1: 103, x2: 541, y2: 135, r: 4},
        {x1: 544, y1: 103, x2: 575, y2: 135, r: 4},
        {x1: 578, y1: 103, x2: 609, y2: 135, r: 4}
      ],
      lines: [],
      inside: [
        {x: 491, y: 123, text: "3×3"},
        {x: 525, y: 123, text: "3×3"},
        {x: 559, y: 123, text: "3×3"},
        {x: 593, y: 123, text: "3×3"}
      ]
    },
    {
      x: 745, year: "2014", side: "bottom", color: "inception",
      card: {x1: 645, y1: 290, x2: 845, y2: 415, r: 14},
      labels: [
        {x: 745, y: 315, text: "Inception", cls: "card-title"},
        {x: 745, y: 337, text: "параллельные ветки", cls: "card-subtitle"}
      ],
      boxes: [
        {x1: 714, y1: 346, x2: 773, y2: 360, r: 4},
        {x1: 714, y1: 368, x2: 773, y2: 382, r: 4},
        {x1: 714, y1: 390, x2: 773, y2: 404, r: 4}
      ],
      lines: [
        [{x: 670, y: 375}, {x: 694, y: 375}, {x: 694, y: 353}, {x: 714, y: 353}],
        [{x: 694, y: 375}, {x: 714, y: 375}],
        [{x: 694, y: 375}, {x: 694, y: 397}, {x: 714, y: 397}],
        [{x: 773, y: 353}, {x: 811, y: 353}, {x: 811, y: 375}],
        [{x: 773, y: 375}, {x: 820, y: 375}],
        [{x: 773, y: 397}, {x: 811, y: 397}, {x: 811, y: 375}]
      ],
      inside: [
        {x: 743, y: 357, text: "ветка"},
        {x: 743, y: 379, text: "ветка"},
        {x: 743, y: 401, text: "ветка"}
      ]
    },
    {
      x: 1000, year: "2015", side: "top", color: "resnet",
      card: {x1: 850, y1: 35, x2: 1150, y2: 175, r: 14},
      labels: [
        {x: 1000, y: 60, text: "ResNet", cls: "card-title"},
        {x: 1000, y: 82, text: "пропускающая связь", cls: "card-subtitle"},
        {x: 1000, y: 158, text: "надёжное обучение: глубина 100+", cls: "stat"}
      ],
      boxes: [
        {x1: 920, y1: 111, x2: 974, y2: 139, r: 5},
        {x1: 991, y1: 111, x2: 1045, y2: 139, r: 5}
      ],
      lines: [
        [{x: 875, y: 125}, {x: 920, y: 125}],
        [{x: 974, y: 125}, {x: 991, y: 125}],
        [{x: 1045, y: 125}, {x: 1071, y: 125}],
        [{x: 1099, y: 125}, {x: 1122, y: 125}],
        [{x: 875, y: 125}, {x: 875, y: 95}, {x: 1085, y: 95}, {x: 1085, y: 111}]
      ],
      arrows: [
        [{x: 1071, y: 125}, {x: 1061, y: 119}, {x: 1061, y: 131}],
        [{x: 1085, y: 111}, {x: 1079, y: 101}, {x: 1091, y: 101}],
        [{x: 1122, y: 125}, {x: 1112, y: 119}, {x: 1112, y: 131}]
      ],
      circle: {x: 1085, y: 125, r: 14},
      inside: [
        {x: 947, y: 129, text: "слои"},
        {x: 1018, y: 129, text: "слои"},
        {x: 1085, y: 130, text: "+"},
        {x: 893, y: 91, text: "обход", align: "start"}
      ]
    }
  ],
  footer: {
    box: {x1: 60, y1: 431, x2: 1145, y2: 461, r: 12},
    label: {
      x: 602, y: 451,
      text: "Основа сохраняется: свёртка → нелинейность → уменьшение → повтор"
    }
  },
  geometry: {
    topCardEdge: 175,
    bottomCardEdge: 290,
    axisY: 235,
    tickTop: 227,
    tickBottom: 243,
    markerRadius: 6,
    yearTopOffset: -18,
    yearBottomOffset: 29
  }
}]);

const origin = Object.freeze(DATA.origin);
const scale = Object.freeze(DATA.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("canvas");
const fallback = document.getElementById("fallback");

try {
  const ns = svg.namespaceURI;

  const add = (name, attrs, parent = svg) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    parent.append(node);
    return node;
  };

  const pointList = points => points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

  const line = (a, b, cls, parent = svg) => add("line", {
    x1: sx(a.x), y1: sy(a.y), x2: sx(b.x), y2: sy(b.y), class: cls
  }, parent);

  const polyline = (points, cls, parent = svg) => add("polyline", {
    points: pointList(points), class: cls
  }, parent);

  const polygon = (points, cls, parent = svg) => add("polygon", {
    points: pointList(points), class: cls
  }, parent);

  const rect = (box, cls, parent = svg) => add("rect", {
    x: sx(box.x1),
    y: sy(box.y1),
    width: sx(box.x2) - sx(box.x1),
    height: sy(box.y2) - sy(box.y1),
    rx: sx(box.x1 + box.r) - sx(box.x1),
    ry: sy(box.y1 + box.r) - sy(box.y1),
    class: cls
  }, parent);

  const circle = (spec, cls, parent = svg) => add("circle", {
    cx: sx(spec.x),
    cy: sy(spec.y),
    r: sx(spec.x + spec.r) - sx(spec.x),
    class: cls
  }, parent);

  const text = (spec, cls, align = "middle", parent = svg) => {
    const node = add("text", {
      x: sx(spec.x),
      y: sy(spec.y),
      class: cls,
      "text-anchor": spec.align || align
    }, parent);
    node.textContent = spec.text;
    return node;
  };

  line(DATA.timeline.line.a, DATA.timeline.line.b, "timeline");
  polygon(DATA.timeline.arrow, "track-arrow");

  DATA.events.forEach(event => {
    const top = event.side === "top";
    const cardEdge = top ? DATA.geometry.topCardEdge : DATA.geometry.bottomCardEdge;
    line(
      {x: event.x, y: DATA.geometry.axisY},
      {x: event.x, y: cardEdge},
      "connector"
    );
  });

  DATA.events.forEach(event => {
    const group = add("g", {"aria-label": `${event.year}: ${event.labels[0].text}`});
    const color = `${event.color}-color`;
    const fill = `${event.color}-fill`;

    rect(event.card, "card", group);

    event.lines.forEach(points => polyline(points, `feature-line ${color}`, group));
    event.boxes.forEach(box => rect(box, `feature-box ${fill}`, group));
    (event.arrows || []).forEach(points => polygon(points, fill, group));

    if (event.circle) {
      circle(event.circle, `feature-box ${fill}`, group);
    }

    event.inside.forEach(label => text(label, `inside ${color}`, label.align || "middle", group));
    event.labels.forEach(label => text(label, label.cls, "middle", group));
  });

  DATA.events.forEach(event => {
    const color = `${event.color}-color`;
    line(
      {x: event.x, y: DATA.geometry.tickTop},
      {x: event.x, y: DATA.geometry.tickBottom},
      `feature-line ${color}`
    );
    circle(
      {x: event.x, y: DATA.geometry.axisY, r: DATA.geometry.markerRadius},
      `marker ${event.color}-fill`
    );

    const offset = event.side === "top"
      ? DATA.geometry.yearBottomOffset
      : DATA.geometry.yearTopOffset;

    text(
      {x: event.x, y: DATA.geometry.axisY + offset, text: event.year},
      `year ${color}`
    );
  });

  rect(DATA.footer.box, "footer-box");
  text(DATA.footer.label, "footer-label");

  fallback.hidden = true;
} catch (error) {
  svg.replaceChildren();
  svg.hidden = true;
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна была показать путь от LeNet-5 через AlexNet, VGG и Inception к пропускающим связям ResNet.";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
