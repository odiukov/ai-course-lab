<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Масштабирование: растянуть вширь, сжать по высоте</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1e293b; --muted:#64748b; --grid:#cbd5e1;
    --src:#2563eb; --dst:#dc2626;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --fg:#e2e8f0; --muted:#94a3b8; --grid:#334155;
      --src:#60a5fa; --dst:#f87171;
    }
  }
  html,body{margin:0}
  .card{background:var(--bg);color:var(--fg);padding:14px 16px 12px;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-sizing:border-box}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .axis{stroke:var(--muted);fill:none}
  .tick{stroke:var(--muted);fill:none}
  .lbl{fill:var(--fg);font-size:14px;font-family:inherit}
  .num{fill:var(--muted);font-size:12px;font-family:inherit}
  .src{fill:var(--src);stroke:var(--src)}
  .dst{fill:var(--dst);stroke:var(--dst)}
  .srcT{fill:var(--src);font-size:14px;font-family:inherit}
  .dstT{fill:var(--dst);font-size:14px;font-family:inherit}
  .mtx{fill:var(--fg);font-size:14px;font-family:inherit}
  .legend{margin-top:8px;font-size:12.5px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:14px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
  .fb{font-size:13px;line-height:1.5}
</style>
</head>
<body>
<div class="card">
  <h2>Масштабирование S = [[2, 0], [0, 0.5]]: вширь ×2, по высоте ×0.5</h2>
  <div id="host"></div>
  <div class="legend">
    <span><i style="background:var(--src)"></i>до умножения на S</span>
    <span><i style="background:var(--dst)"></i>после умножения на S</span>
  </div>
</div>
<script>
(function(){
  var host = document.getElementById("host");
  try{
    /* ---- данные схемы ---- */
    var DATA = {
      points: [
        { name:"A", from:[2,1], to:[4,0.5],
          fromLabel:"A(2, 1)",   fromAnchor:"middle", fromDX:0,  fromDY:-14,
          toLabel:"A'(4, 0.5)",  toAnchor:"middle",   toDX:0,    toDY:24 },
        { name:"B", from:[0,2], to:[0,1],
          fromLabel:"B(0, 2)",   fromAnchor:"start",  fromDX:12, fromDY:-8,
          toLabel:"B'(0, 1)",    toAnchor:"start",    toDX:12,   toDY:5 }
      ],
      xTicks:[1,2,3,4],
      yTicks:[1,2],
      axisX:[-0.35, 5.05],
      axisY:[-0.35, 2.5],
      matrix:{
        head:[3.0, 2.0], headText:"S =",
        cols:[3.6, 4.25], rows:[2.2, 1.8],
        cells:[["2","0"],["0","0.5"]],
        brLeft:3.25, brRight:4.65, brTop:2.45, brBot:1.55, brTick:0.1
      },
      originNote:{ at:[0.15, 0.28], text:"O(0, 0) остаётся на месте" }
    };

    /* ---- холст, одно начало, один масштаб ---- */
    var CV = { w:560, h:288 };
    var origin = { x:60, y:250 };
    var scale  = 90;

    /* ---- единственная пара функций перевода ---- */
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    /* ---- пиксельные константы стиля ---- */
    var LW = 1.6, AXW = 1.2, R = 4.5, PAD = 9, HEAD = 10, HEADW = 6, GAP = 10;

    var NS = "http://www.w3.org/2000/svg";
    function el(n, a){
      var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); }
      return e;
    }
    function text(s, x, y, cls, anchor){
      var t = el("text", { x:x, y:y, class:cls, "text-anchor":anchor });
      t.textContent = s;
      return t;
    }

    var svg = el("svg", {
      viewBox:"0 0 " + CV.w + " " + CV.h,
      preserveAspectRatio:"xMidYMid meet",
      xmlns:NS, role:"img",
      "aria-label":"Точка A(2, 1) переходит в A'(4, 0.5), точка B(0, 2) переходит в B'(0, 1)"
    });
    var bg = el("rect", { x:0, y:0, width:CV.w, height:CV.h, fill:"var(--bg)" });
    svg.appendChild(bg);

    /* ---- оси ---- */
    svg.appendChild(el("path", {
      class:"axis", "stroke-width":AXW,
      d:"M" + sx(DATA.axisX[0]) + " " + sy(0) + "L" + sx(DATA.axisX[1]) + " " + sy(0)
    }));
    svg.appendChild(el("path", {
      class:"axis", "stroke-width":AXW,
      d:"M" + sx(0) + " " + sy(DATA.axisY[0]) + "L" + sx(0) + " " + sy(DATA.axisY[1])
    }));
    svg.appendChild(text("x", sx(DATA.axisX[1]), sy(0) - GAP, "num", "end"));
    svg.appendChild(text("y", sx(0), sy(DATA.axisY[1]) - GAP, "num", "middle"));

    /* ---- засечки ---- */
    DATA.xTicks.forEach(function(v){
      svg.appendChild(el("path", {
        class:"tick", "stroke-width":AXW,
        d:"M" + sx(v) + " " + sy(0) + "L" + sx(v) + " " + sy(-0.06)
      }));
      svg.appendChild(text(String(v), sx(v), sy(0) + 2 * GAP, "num", "middle"));
    });
    DATA.yTicks.forEach(function(v){
      svg.appendChild(el("path", {
        class:"tick", "stroke-width":AXW,
        d:"M" + sx(0) + " " + sy(v) + "L" + sx(-0.06) + " " + sy(v)
      }));
      svg.appendChild(text(String(v), sx(0) - GAP, sy(v) + 4, "num", "end"));
    });
    svg.appendChild(text("0", sx(0) - GAP, sy(0) + 2 * GAP, "num", "end"));

    /* ---- стрелки переноса ---- */
    function arrow(p, q, cls){
      var ax = sx(p[0]), ay = sy(p[1]), bx = sx(q[0]), by = sy(q[1]);
      var dx = bx - ax, dy = by - ay;
      var L = Math.hypot(dx, dy) || 1;
      var ux = dx / L, uy = dy / L;
      var s0x = ax + ux * PAD, s0y = ay + uy * PAD;
      var tx = bx - ux * PAD,  ty = by - uy * PAD;
      var cx = tx - ux * HEAD, cy = ty - uy * HEAD;
      var g = el("g", {});
      g.appendChild(el("path", {
        class:cls, "stroke-width":LW, fill:"none",
        d:"M" + s0x + " " + s0y + "L" + cx + " " + cy
      }));
      g.appendChild(el("polygon", {
        class:cls, "stroke-width":0,
        points:[tx + " " + ty,
                (cx - uy * HEADW) + " " + (cy + ux * HEADW),
                (cx + uy * HEADW) + " " + (cy - ux * HEADW)].join(" ")
      }));
      return g;
    }

    DATA.points.forEach(function(p){
      svg.appendChild(arrow(p.from, p.to, "dst"));
    });

    /* ---- точки и подписи ---- */
    DATA.points.forEach(function(p){
      svg.appendChild(el("circle", {
        cx:sx(p.from[0]), cy:sy(p.from[1]), r:R, class:"src", "stroke-width":0
      }));
      svg.appendChild(el("circle", {
        cx:sx(p.to[0]), cy:sy(p.to[1]), r:R, class:"dst", "stroke-width":0
      }));
      svg.appendChild(text(p.fromLabel,
        sx(p.from[0]) + p.fromDX, sy(p.from[1]) + p.fromDY, "srcT", p.fromAnchor));
      svg.appendChild(text(p.toLabel,
        sx(p.to[0]) + p.toDX, sy(p.to[1]) + p.toDY, "dstT", p.toAnchor));
    });

    /* ---- неподвижное начало координат ---- */
    svg.appendChild(el("circle", {
      cx:sx(0), cy:sy(0), r:R, fill:"var(--muted)", "stroke-width":0
    }));
    svg.appendChild(text(DATA.originNote.text,
      sx(DATA.originNote.at[0]), sy(DATA.originNote.at[1]), "num", "start"));

    /* ---- матрица S ---- */
    var M = DATA.matrix;
    svg.appendChild(text(M.headText, sx(M.head[0]), sy(M.head[1]), "mtx", "end"));
    M.rows.forEach(function(ry, i){
      M.cols.forEach(function(cx2, j){
        svg.appendChild(text(M.cells[i][j], sx(cx2), sy(ry), "mtx", "middle"));
      });
    });
    svg.appendChild(el("path", {
      class:"axis", "stroke-width":LW,
      d:"M" + sx(M.brLeft + M.brTick) + " " + sy(M.brTop) +
        "L" + sx(M.brLeft) + " " + sy(M.brTop) +
        "L" + sx(M.brLeft) + " " + sy(M.brBot) +
        "L" + sx(M.brLeft + M.brTick) + " " + sy(M.brBot)
    }));
    svg.appendChild(el("path", {
      class:"axis", "stroke-width":LW,
      d:"M" + sx(M.brRight - M.brTick) + " " + sy(M.brTop) +
        "L" + sx(M.brRight) + " " + sy(M.brTop) +
        "L" + sx(M.brRight) + " " + sy(M.brBot) +
        "L" + sx(M.brRight - M.brTick) + " " + sy(M.brBot)
    }));

    host.appendChild(svg);
  } catch (e) {
    host.innerHTML =
      '<div class="fb">Схема не построилась. Она должна была показать: ' +
      'матрица S = [[2, 0], [0, 0.5]] умножает горизонтальную координату на 2, ' +
      'вертикальную — на 0.5. Точка A(2, 1) переходит в A\u2032(4, 0.5), ' +
      'точка B(0, 2) — в B\u2032(0, 1). Точки на осях остаются на своих осях, ' +
      'начало координат (0, 0) не двигается.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
