<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Базисные векторы до и после преобразования</title>
<style>
  :root{
    --bg:#fbfbfa; --fg:#1c1b19; --muted:#6b6862;
    --grid:#d9d6cf; --grid2:#c3bdb0;
    --v1:#b4531c; --v2:#1f6f8b; --box:#efece5; --line:#8d887c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e9e7e3; --muted:#9b978f;
      --grid:#2c3037; --grid2:#3a4049;
      --v1:#e8944f; --v2:#63c1d8; --box:#20242a; --line:#7c8governance;
    }
  }
  @media (prefers-color-scheme: dark){ :root{ --line:#7c8794; } }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:10px 12px 14px;}
  h2{font-size:15px;font-weight:600;margin:0 0 6px;letter-spacing:.01em;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:14px;line-height:1.5;color:var(--fg);}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
<div class="wrap">
  <h2>Базисные векторы до и после преобразования</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var D = {
      M:  [[0,-1],[1,0]],
      e1: [1,0],
      e2: [0,1],
      gx: [-1,0,1,2],
      gy: [-1,0,1,2],
      shift: 10,
      headLen: 0.26,
      headHalf: 0.11,
      box: {x0:3.2, x1:6.8, y0:0.2, y1:1.6},
      link: [[2.3,0.9],[3.1,0.9],[6.9,0.9],[7.8,0.9]]
    };
    /* ---- один origin, один scale, одна пара sx/sy ---- */
    var origin = {x:92, y:188};
    var scale  = 44;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    /* пиксельные литералы: только отступы подписей, толщины, кегль */
    var PAD = 10, PADY = 18, LW = 1.6, GW = 1, FS = 14, FSM = 15;

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 700 292');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }

    function seg(p,q,stroke,w,op){
      el('line',{x1:sx(p[0]),y1:sy(p[1]),x2:sx(q[0]),y2:sy(q[1]),
        stroke:stroke,'stroke-width':w,'stroke-opacity':(op==null?1:op),
        'stroke-linecap':'round'});
    }
    function label(p,txt,anchor,dx,dy,fill,size,cls){
      var t=el('text',{x:sx(p[0])+dx,y:sy(p[1])+dy,'text-anchor':anchor,
        fill:fill,'font-size':(size||FS)});
      if(cls) t.setAttribute('class',cls);
      t.textContent=txt; return t;
    }
    function arrow(from,to,color){
      var dx=to[0]-from[0], dy=to[1]-from[1], L=Math.hypot(dx,dy);
      var ux=dx/L, uy=dy/L, nx=-uy, ny=ux;
      var b=[to[0]-ux*D.headLen, to[1]-uy*D.headLen];
      seg(from,b,color,LW);
      var a1=[b[0]+nx*D.headHalf, b[1]+ny*D.headHalf];
      var a2=[b[0]-nx*D.headHalf, b[1]-ny*D.headHalf];
      el('polygon',{fill:color,points:
        sx(to[0])+','+sy(to[1])+' '+sx(a1[0])+','+sy(a1[1])+' '+sx(a2[0])+','+sy(a2[1])});
    }
    function apply(m,v){
      return [m[0][0]*v[0]+m[0][1]*v[1], m[1][0]*v[0]+m[1][1]*v[1]];
    }
    function moved(v){ var w=apply(D.M,v); return [w[0]+D.shift, w[1]]; }

    var gx=D.gx, gy=D.gy;
    var xa=gx[0], xb=gx[gx.length-1], ya=gy[0], yb=gy[gy.length-1];

    /* сетка «до» */
    gx.forEach(function(i){ seg([i,ya],[i,yb],'var(--grid)',GW); });
    gy.forEach(function(j){ seg([xa,j],[xb,j],'var(--grid)',GW); });
    /* оси «до» */
    seg([xa,0],[xb,0],'var(--line)',GW);
    seg([0,ya],[0,yb],'var(--line)',GW);

    /* сетка «после» — образы тех же линий, сдвинутые вправо */
    gx.forEach(function(i){ seg(moved([i,ya]),moved([i,yb]),'var(--grid2)',GW); });
    gy.forEach(function(j){ seg(moved([xa,j]),moved([xb,j]),'var(--grid2)',GW); });
    seg(moved([xa,0]),moved([xb,0]),'var(--line)',GW);
    seg(moved([0,ya]),moved([0,yb]),'var(--line)',GW);

    /* базисные векторы «до» */
    var O=[0,0];
    arrow(O,D.e1,'var(--v1)');
    arrow(O,D.e2,'var(--v2)');
    label([D.e1[0]/2,0],'e₁=[1,0]','middle',0,PADY,'var(--v1)');
    label([0,D.e2[1]/2],'e₂=[0,1]','end',-PAD,0,'var(--v2)');

    /* базисные векторы «после» — столбцы M */
    var O2=moved(O), f1=moved(D.e1), f2=moved(D.e2);
    arrow(O2,f1,'var(--v1)');
    arrow(O2,f2,'var(--v2)');
    label([(O2[0]+f1[0])/2,(O2[1]+f1[1])/2],'e₁′','start',PAD,0,'var(--v1)');
    label([(O2[0]+f2[0])/2,(O2[1]+f2[1])/2],'e₂′','middle',0,PADY,'var(--v2)');

    /* матрица посередине */
    var b=D.box;
    el('rect',{x:sx(b.x0),y:sy(b.y1),width:sx(b.x1)-sx(b.x0),height:sy(b.y0)-sy(b.y1),
      rx:8,fill:'var(--box)',stroke:'var(--line)','stroke-width':GW});
    label([b.x0+0.25,(b.y0+b.y1)/2],'M =','start',0,0,'var(--fg)',FSM,'mono');
    var cx=(b.x0+b.x1)/2+0.6;
    label([cx,1.12],'[  0  −1 ]','middle',0,0,'var(--fg)',FSM,'mono');
    label([cx,0.58],'[  1   0 ]','middle',0,0,'var(--fg)',FSM,'mono');

    /* стрелки-переходы */
    arrow(D.link[0],D.link[1],'var(--line)');
    arrow(D.link[2],D.link[3],'var(--line)');

    /* заголовки панелей */
    label([(xa+xb)/2,yb],'Исходный базис','middle',0,-PAD,'var(--muted)');
    label([D.shift+(xa+xb)/2,yb],'После преобразования M','middle',0,-PAD,'var(--muted)');

    /* легенда */
    label([(b.x0+b.x1)/2,-1.35],
      'Столбцы M — концы новых стрелок: e₁′=[0,1], e₂′=[−1,0]',
      'middle',0,0,'var(--fg)');
    label([(b.x0+b.x1)/2,-1.85],
      'Сетка наклонилась вместе со стрелками: линии остались параллельными и равномерными',
      'middle',0,0,'var(--muted)');

    host.appendChild(svg);
  }catch(err){
    host.innerHTML='<p class="fail">Схема не построилась. Она должна показывать: '+
      'слева базисные векторы e₁=[1,0] (вправо) и e₂=[0,1] (вверх) на клетчатой сетке; '+
      'посередине матрицу M = [[0, −1], [1, 0]]; справа те же векторы после преобразования — '+
      'e₁′=[0,1] (вверх) и e₂′=[−1,0] (влево), то есть столбцы M, вместе с наклонённой сеткой.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
