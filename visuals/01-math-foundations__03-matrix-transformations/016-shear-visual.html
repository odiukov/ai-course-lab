<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Сдвиг по x</title>
<style>
  :root{
    --bg:#fbfaf7; --ink:#1e2430; --soft:#5b6craft; --soft:#5b6472;
    --grid:#e3e9f1; --before:#8b97a8; --after:#c2410c; --axis:#3b4655;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181f; --ink:#e6ebf2; --soft:#a3adbb;
      --grid:#242c38; --before:#6b7788; --after:#fb923c; --axis:#8fa0b4;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .card{background:var(--bg);padding:14px 12px 10px;max-width:760px;margin:0 auto}
  h2{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:.01em}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .grid{stroke:var(--grid)}
  .axis{stroke:var(--axis)}
  .axisfill{fill:var(--axis)}
  .before{stroke:var(--before);fill:none;stroke-dasharray:5 4}
  .beforedot{fill:var(--before)}
  .after{stroke:var(--after);fill:none}
  .afterfill{fill:var(--after);fill-opacity:.12;stroke:var(--after)}
  .afterdot{fill:var(--after)}
  .lb{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--ink)}
  .lb.dim{fill:var(--soft);font-size:12px}
  .lb.acc{fill:var(--after)}
  .fail{color:var(--soft);font-size:14px;padding:6px 2px}
</style>
<div class="card">
  <h2>Сдвиг по x: чем выше точка, тем сильнее она съехала</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    /* ---- данные схемы ---- */
    var D={
      k:1,
      xAxis:{from:-0.70,to:3.10},
      yAxis:{from:-0.55,to:2.60},
      gridX:[1,2,3], gridY:[1,2],
      square:[[0,0],[1,0],[1,1],[0,1]],
      sheared:[[0,0],[1,0],[2,1],[1,1]],
      spine:[[0,0],[2,2]],
      topBefore:[[0,1],[0,2]],
      shifts:[[[0,1],[1,1],"+k"],[[0,2],[2,2],"+2k"]],
      tick:0.07, head:0.15, headW:0.075
    };
    var origin={x:96,y:236}, scale=78;

    /* ---- единственная пара функций перевода ---- */
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var NS="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 400 348");
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");
    svg.setAttribute("aria-label",
      "Сдвиг Shx: A(1,0) на месте, B(0,1) уезжает в B'(1,1), на высоте 2 сдвиг вдвое больше");

    function add(tag,attrs,cls,text){
      var n=document.createElementNS(NS,tag);
      for(var a in attrs) n.setAttribute(a,attrs[a]);
      if(cls) n.setAttribute("class",cls);
      if(text!=null) n.textContent=text;
      svg.appendChild(n); return n;
    }
    function line(p,q,cls,w){
      add("line",{x1:sx(p[0]),y1:sy(p[1]),x2:sx(q[0]),y2:sy(q[1]),"stroke-width":w},cls);
    }
    function poly(pts,cls,w,closed){
      var d=pts.map(function(p){return sx(p[0])+","+sy(p[1]);}).join(" ");
      add(closed?"polygon":"polyline",{points:d,"stroke-width":w},cls);
    }
    function dot(p,cls,r){ add("circle",{cx:sx(p[0]),cy:sy(p[1]),r:r},cls); }
    function txt(p,dx,dy,anchor,cls,s){
      add("text",{x:sx(p[0])+dx,y:sy(p[1])+dy,"text-anchor":anchor},cls,s);
    }
    function head(p,q,cls){
      var ax=sx(q[0])-sx(p[0]), ay=sy(q[1])-sy(p[1]);
      var a=Math.atan2(ay,ax), h=D.head*scale, w=D.headW*scale;
      var bx=sx(q[0])-h*Math.cos(a), by=sy(q[1])-h*Math.sin(a);
      var pts=[[sx(q[0]),sy(q[1])],
               [bx+w*Math.sin(a),by-w*Math.cos(a)],
               [bx-w*Math.sin(a),by+w*Math.cos(a)]];
      add("polygon",{points:pts.map(function(t){return t[0]+","+t[1];}).join(" ")},cls);
    }
    function arrow(p,q,cls,w){
      line(p,q,cls,w); head(p,q,cls==="after"?"afterdot":"beforedot");
    }

    /* сетка */
    D.gridX.forEach(function(x){ line([x,D.yAxis.from],[x,D.yAxis.to],"grid",1); });
    D.gridY.forEach(function(y){ line([D.xAxis.from,y],[D.xAxis.to,y],"grid",1); });

    /* оси */
    line([D.xAxis.from,0],[D.xAxis.to,0],"axis",1.4);
    head([0,0],[D.xAxis.to,0],"axisfill");
    line([0,D.yAxis.from],[0,D.yAxis.to],"axis",1.4);
    head([0,0],[0,D.yAxis.to],"axisfill");
    D.gridX.forEach(function(x){ line([x,-D.tick],[x,D.tick],"axis",1.2); });
    D.gridY.forEach(function(y){ line([-D.tick,y],[D.tick,y],"axis",1.2); });
    txt([D.xAxis.to,0],10,5,"start","lb dim","x");
    txt([0,D.yAxis.to],0,-9,"middle","lb dim","y");
    txt([0,0],-8,16,"end","lb dim","0");

    /* до сдвига: квадрат и стопка вверх */
    poly(D.square,"before",1.6,true);
    line(D.topBefore[0],D.topBefore[1],"before",1.6);

    /* после сдвига */
    poly(D.sheared,"afterfill",1.8,true);
    line(D.spine[0],D.spine[1],"after",1.8);

    /* стрелки смещения */
    D.shifts.forEach(function(s){
      arrow(s[0],s[1],"after",1.6);
      var mid=[(s[0][0]+s[1][0])/2,s[0][1]];
      txt(mid,0,-10,"middle","lb acc",s[2]);
    });

    /* точки и подписи: каждая в свою сторону */
    dot([1,0],"afterdot",4.2);
    txt([1,0],0,20,"middle","lb","A(1,0) — на месте");
    dot([0,1],"beforedot",4.2);
    txt([0,1],-10,4,"end","lb","B(0,1)");
    dot([1,1],"afterdot",4.2);
    txt([1,1],10,18,"start","lb","B\u2032(1,1)");
    dot([0,2],"beforedot",4.2);
    txt([0,2],-10,4,"end","lb dim","(0,2)");
    dot([2,2],"afterdot",4.2);
    txt([2,2],10,4,"start","lb dim","(2,2)");

    /* легенда */
    txt([D.xAxis.from,-0.90],0,0,"start","lb dim",
      "Shx = [[1, 1], [0, 1]],  k = 1:  x\u2032 = x + k\u00b7y,  высота y не меняется");
    txt([D.xAxis.from,-1.20],0,0,"start","lb dim",
      "пунктир — до сдвига, оранжевое — после; y = 0 \u2192 0, y = 1 \u2192 k, y = 2 \u2192 2k");

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема должна была показать сдвиг Shx = [[1, 1], [0, 1]] при k = 1: '+
      'точка A(1,0) на оси x остаётся на месте, потому что её высота y = 0; '+
      'точка B(0,1) уезжает вправо на k и попадает в B\u2032(1,1); '+
      'точка на высоте y = 2 уезжает на 2k, то есть вдвое дальше. '+
      'Вертикальная сторона квадрата превращается в наклонную прямую, высота фигуры та же.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
