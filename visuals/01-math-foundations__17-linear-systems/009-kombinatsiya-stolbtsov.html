<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как два столбца складываются в вектор b</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #657087;
      --grid: #dce3ee;
      --axis: #8490a5;
      --first: #087f8c;
      --first-soft: #d8f1f1;
      --second: #d06b12;
      --second-soft: #fff0df;
      --result: #7048c9;
      --result-soft: #eee8ff;
      --outline: #cbd4e2;
      --shadow: rgba(31, 45, 68, 0.1);
      --line-thin: 1px;
      --line-main: 4px;
      --line-result: 3px;
      --font-title: 24px;
      --font-equation: 20px;
      --font-main: 16px;
      --font-small: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --card: #192231;
        --text: #edf2fa;
        --muted: #aab6c8;
        --grid: #2d394b;
        --axis: #718098;
        --first: #50cad1;
        --first-soft: #183b41;
        --second: #ffad5c;
        --second-soft: #4b301d;
        --result: #b699ff;
        --result-soft: #342852;
        --outline: #35445a;
        --shadow: rgba(0, 0, 0, 0.28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 18px;
    }

    main {
      width: min(100%, 920px);
      background: var(--card);
      border: var(--line-thin) solid var(--outline);
      border-radius: 16px;
      box-shadow: 0 8px 28px var(--shadow);
      overflow: hidden;
    }

    header {
      padding: 20px 24px 12px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: var(--font-title);
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .equation {
      display: inline-flex;
      align-items: center;
      margin-top: 12px;
      padding: 8px 14px;
      border: var(--line-thin) solid var(--outline);
      border-radius: 999px;
      background: var(--result-soft);
      color: var(--text);
      font-size: var(--font-equation);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .coefficient {
      font-weight: 750;
    }

    .coefficient.first {
      color: var(--first);
    }

    .coefficient.second {
      color: var(--second);
    }

    .figure-wrap {
      padding: 0 14px 14px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 390px;
      overflow: visible;
      background: var(--card);
    }

    .grid-line {
      stroke: var(--grid);
      stroke-width: var(--line-thin);
      vector-effect: non-scaling-stroke;
    }

    .axis-line {
      stroke: var(--axis);
      stroke-width: var(--line-thin);
      vector-effect: non-scaling-stroke;
    }

    .guide-line {
      stroke: var(--result);
      stroke-width: var(--line-thin);
      stroke-dasharray: 5 6;
      vector-effect: non-scaling-stroke;
    }

    .vector-first {
      fill: none;
      stroke: var(--first);
      stroke-width: var(--line-main);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .vector-second {
      fill: none;
      stroke: var(--second);
      stroke-width: var(--line-main);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .vector-result {
      fill: none;
      stroke: var(--result);
      stroke-width: var(--line-result);
      stroke-linecap: round;
      stroke-dasharray: 10 7;
      vector-effect: non-scaling-stroke;
    }

    .head-first {
      fill: var(--first);
    }

    .head-second {
      fill: var(--second);
    }

    .head-result {
      fill: var(--result);
    }

    .head-axis {
      fill: var(--axis);
    }

    .waypoint-first {
      fill: var(--card);
      stroke: var(--first);
      stroke-width: var(--line-result);
      vector-effect: non-scaling-stroke;
    }

    .endpoint {
      fill: var(--result);
      stroke: var(--card);
      stroke-width: var(--line-result);
      vector-effect: non-scaling-stroke;
    }

    text {
      fill: var(--text);
      font-size: var(--font-main);
      paint-order: stroke;
      stroke: var(--card);
      stroke-width: 4px;
      stroke-linejoin: round;
    }

    .small-label {
      fill: var(--muted);
      font-size: var(--font-small);
    }

    .first-label {
      fill: var(--first);
      font-weight: 700;
    }

    .second-label {
      fill: var(--second);
      font-weight: 700;
    }

    .result-label {
      fill: var(--result);
      font-weight: 800;
    }

    .panel {
      fill: var(--card);
      stroke: var(--outline);
      stroke-width: var(--line-thin);
      vector-effect: non-scaling-stroke;
    }

    .panel-first {
      fill: var(--first-soft);
      stroke: var(--first);
      stroke-width: var(--line-thin);
      vector-effect: non-scaling-stroke;
    }

    .panel-second {
      fill: var(--second-soft);
      stroke: var(--second);
      stroke-width: var(--line-thin);
      vector-effect: non-scaling-stroke;
    }

    .sum-label {
      font-size: var(--font-small);
      font-weight: 700;
    }

    #fallback {
      margin: 18px 24px 24px;
      padding: 16px;
      border: var(--line-thin) solid var(--outline);
      border-radius: 10px;
      background: var(--result-soft);
      color: var(--text);
      font-size: var(--font-main);
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 620px) {
      body {
        padding: 8px;
      }

      header {
        padding: 16px 12px 8px;
      }

      .equation {
        font-size: var(--font-main);
        padding-inline: 10px;
      }

      .figure-wrap {
        padding-inline: 4px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Как два столбца складываются в вектор b</h1>
      <div class="equation" aria-label="Дважды вектор два, один, плюс один раз вектор один, минус один, равно вектор пять, один">
        <span class="coefficient first">2 · [2, 1]</span>
        <span>&nbsp;+&nbsp;</span>
        <span class="coefficient second">1 · [1, −1]</span>
        <span>&nbsp;=&nbsp;</span>
        <strong>[5, 1]</strong>
      </div>
    </header>

    <div class="figure-wrap">
      <svg id="diagram"
           viewBox="0 0 760 370"
           width="760"
           height="370"
           preserveAspectRatio="xMidYMid meet"
           role="img"
           aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Сложение двух столбцов матрицы</title>
        <desc id="svg-desc">
          Вектор два, один откладывается дважды. Затем из его конца
          откладывается вектор один, минус один. Результат равен пять, один.
        </desc>
        <g id="drawing"></g>
      </svg>

      <div id="fallback" hidden>
        Схема должна показать: два последовательных шага [2, 1] дают [4, 2],
        затем шаг [1, −1] приводит в точку [5, 1]. Поэтому
        2 · [2, 1] + 1 · [1, −1] = [5, 1].
      </div>
    </div>
  </main>

  <script>
    const data = {
      columns: {
        first: { x: 2, y: 1 },
        second: { x: 1, y: -1 }
      },
      coefficients: {
        first: 2,
        second: 1
      },
      points: {
        start: { x: 0, y: 0 },
        firstStep: { x: 2, y: 1 },
        firstContribution: { x: 4, y: 2 },
        result: { x: 5, y: 1 }
      },
      bounds: {
        xMin: -0.45,
        xMax: 5.75,
        yMin: -1.08,
        yMax: 2.55
      },
      gridX: [0, 1, 2, 3, 4, 5],
      gridY: [-1, 0, 1, 2],
      head: {
        back: 0.17,
        wing: 0.09
      },
      pointRadius: 5,
      labels: {
        axisX: { x: 5.75, y: 0 },
        axisY: { x: 0, y: 2.55 },
        start: { x: 0, y: 0 },
        firstMove: { x: 1, y: 0.5 },
        secondFirstMove: { x: 3, y: 1.5 },
        firstTotal: { x: 2.35, y: 2.28 },
        secondMove: { x: 4.5, y: 1.5 },
        result: { x: 2.7, y: 0.54 },
        endpoint: { x: 5, y: 1 },
        horizontalSum: { x: 1.45, y: -0.72 },
        verticalSum: { x: 4.15, y: -0.72 }
      },
      panels: {
        horizontal: {
          left: 0.05,
          right: 2.85,
          top: -0.49,
          bottom: -0.98
        },
        vertical: {
          left: 3.02,
          right: 5.62,
          top: -0.49,
          bottom: -0.98
        }
      },
      offsets: {
        axisX: { dx: -8, dy: -10 },
        axisY: { dx: 12, dy: 16 },
        start: { dx: -12, dy: 20 },
        firstMove: { dx: 0, dy: 24 },
        secondFirstMove: { dx: 0, dy: -13 },
        firstTotal: { dx: 0, dy: -7 },
        secondMove: { dx: 15, dy: 5 },
        result: { dx: 0, dy: 25 },
        endpoint: { dx: 15, dy: 5 },
        sum: { dx: 0, dy: 5 }
      }
    };

    const origin = { x: 82, y: 238 };
    const scale = 92;
    const canvas = { width: 760, height: 370 };

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      svg.setAttribute(
        "viewBox",
        `0 0 ${canvas.width} ${canvas.height}`
      );

      const make = (name, attributes, parent = drawing) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const line = (from, to, className, parent = drawing) =>
        make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        }, parent);

      const circle = (point, radius, className, parent = drawing) =>
        make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: radius,
          class: className
        }, parent);

      const rectangle = (box, className, parent = drawing) => {
        const left = sx(box.left);
        const right = sx(box.right);
        const top = sy(box.top);
        const bottom = sy(box.bottom);

        return make("rect", {
          x: Math.min(left, right),
          y: Math.min(top, bottom),
          width: Math.abs(right - left),
          height: Math.abs(bottom - top),
          class: className
        }, parent);
      };

      const label = (
        text,
        point,
        offset,
        anchor,
        className,
        parent = drawing
      ) => {
        const node = make("text", {
          x: sx(point.x),
          y: sy(point.y),
          dx: offset.dx,
          dy: offset.dy,
          "text-anchor": anchor,
          class: className
        }, parent);
        node.textContent = text;
        return node;
      };

      const arrowHead = (from, to, className, parent = drawing) => {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const length = Math.hypot(dx, dy);
        const ux = dx / length;
        const uy = dy / length;
        const px = -uy;
        const py = ux;
        const base = {
          x: to.x - ux * data.head.back,
          y: to.y - uy * data.head.back
        };
        const left = {
          x: base.x + px * data.head.wing,
          y: base.y + py * data.head.wing
        };
        const right = {
          x: base.x - px * data.head.wing,
          y: base.y - py * data.head.wing
        };

        return make("polygon", {
          points:
            `${sx(to.x)},${sy(to.y)} ` +
            `${sx(left.x)},${sy(left.y)} ` +
            `${sx(right.x)},${sy(right.y)}`,
          class: className
        }, parent);
      };

      const arrow = (from, to, lineClass, headClass, parent = drawing) => {
        line(from, to, lineClass, parent);
        arrowHead(from, to, headClass, parent);
      };

      const grid = make("g", { "aria-hidden": "true" });

      data.gridX.forEach(x => {
        line(
          { x, y: data.bounds.yMin },
          { x, y: data.bounds.yMax },
          "grid-line",
          grid
        );
      });

      data.gridY.forEach(y => {
        line(
          { x: data.bounds.xMin, y },
          { x: data.bounds.xMax, y },
          "grid-line",
          grid
        );
      });

      const axes = make("g", { "aria-hidden": "true" });

      line(
        { x: data.bounds.xMin, y: data.points.start.y },
        { x: data.bounds.xMax, y: data.points.start.y },
        "axis-line",
        axes
      );
      arrowHead(
        { x: data.bounds.xMax - data.head.back, y: data.points.start.y },
        { x: data.bounds.xMax, y: data.points.start.y },
        "head-axis",
        axes
      );

      line(
        { x: data.points.start.x, y: data.bounds.yMin },
        { x: data.points.start.x, y: data.bounds.yMax },
        "axis-line",
        axes
      );
      arrowHead(
        { x: data.points.start.x, y: data.bounds.yMax - data.head.back },
        { x: data.points.start.x, y: data.bounds.yMax },
        "head-axis",
        axes
      );

      label(
        "горизонталь",
        data.labels.axisX,
        data.offsets.axisX,
        "end",
        "small-label",
        axes
      );
      label(
        "вертикаль",
        data.labels.axisY,
        data.offsets.axisY,
        "start",
        "small-label",
        axes
      );

      const guides = make("g", { "aria-hidden": "true" });

      line(
        { x: data.points.result.x, y: data.points.start.y },
        data.points.result,
        "guide-line",
        guides
      );
      line(
        { x: data.points.start.x, y: data.points.result.y },
        data.points.result,
        "guide-line",
        guides
      );

      const resultLayer = make("g", {
        "aria-label": "Результирующий вектор b равен пять, один"
      });

      arrow(
        data.points.start,
        data.points.result,
        "vector-result",
        "head-result",
        resultLayer
      );

      const contributionLayer = make("g", {
        "aria-label":
          "Два шага вектора два, один, затем шаг вектора один, минус один"
      });

      arrow(
        data.points.start,
        data.points.firstStep,
        "vector-first",
        "head-first",
        contributionLayer
      );
      arrow(
        data.points.firstStep,
        data.points.firstContribution,
        "vector-first",
        "head-first",
        contributionLayer
      );
      arrow(
        data.points.firstContribution,
        data.points.result,
        "vector-second",
        "head-second",
        contributionLayer
      );

      circle(
        data.points.start,
        data.pointRadius,
        "waypoint-first",
        contributionLayer
      );
      circle(
        data.points.firstStep,
        data.pointRadius,
        "waypoint-first",
        contributionLayer
      );
      circle(
        data.points.firstContribution,
        data.pointRadius,
        "waypoint-first",
        contributionLayer
      );
      circle(
        data.points.result,
        data.pointRadius,
        "endpoint",
        contributionLayer
      );

      const labels = make("g", {});

      label(
        "старт",
        data.labels.start,
        data.offsets.start,
        "end",
        "small-label",
        labels
      );
      label(
        "[2, 1]",
        data.labels.firstMove,
        data.offsets.firstMove,
        "middle",
        "first-label",
        labels
      );
      label(
        "ещё [2, 1]",
        data.labels.secondFirstMove,
        data.offsets.secondFirstMove,
        "middle",
        "first-label",
        labels
      );
      label(
        "2 · [2, 1] = [4, 2]",
        data.labels.firstTotal,
        data.offsets.firstTotal,
        "middle",
        "first-label",
        labels
      );
      label(
        "1 · [1, −1]",
        data.labels.secondMove,
        data.offsets.secondMove,
        "start",
        "second-label",
        labels
      );
      label(
        "b = [5, 1]",
        data.labels.result,
        data.offsets.result,
        "middle",
        "result-label",
        labels
      );
      label(
        "конец [5, 1]",
        data.labels.endpoint,
        data.offsets.endpoint,
        "start",
        "result-label",
        labels
      );

      const summaries = make("g", {
        "aria-label":
          "По горизонтали четыре плюс один равно пять. " +
          "По вертикали два минус один равно один."
      });

      rectangle(
        data.panels.horizontal,
        "panel-first",
        summaries
      );
      rectangle(
        data.panels.vertical,
        "panel-second",
        summaries
      );

      label(
        "горизонталь: 4 + 1 = 5",
        data.labels.horizontalSum,
        data.offsets.sum,
        "middle",
        "sum-label first-label",
        summaries
      );
      label(
        "вертикаль: 2 − 1 = 1",
        data.labels.verticalSum,
        data.offsets.sum,
        "middle",
        "sum-label second-label",
        summaries
      );

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }
      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
