<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проекция на пространство столбцов A</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #526078;
      --plane-fill: #e8ecf7;
      --plane-edge: #8b98af;
      --vector-b: #4169b1;
      --projection: #17845d;
      --residual: #d56332;
      --point-ring: #ffffff;
      --origin: #67748b;
      --fallback: #9b3f35;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #182130;
        --text: #eef3fb;
        --muted: #b4bfd1;
        --plane-fill: #29364c;
        --plane-edge: #8190aa;
        --vector-b: #83a9f4;
        --projection: #58d19b;
        --residual: #ff9a68;
        --point-ring: #182130;
        --origin: #a7b2c5;
        --fallback: #ffaaa0;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    figure {
      margin: unset;
      background: var(--surface);
    }

    figcaption {
      box-sizing: border-box;
      color: var(--text);
      background: var(--surface);
      font-size: 23px;
      font-weight: bold;
      text-align: center;
      padding: 12px 18px 8px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--surface);
      overflow: visible;
    }

    .plane {
      fill: var(--plane-fill);
      stroke: var(--plane-edge);
      stroke-width: 2.5px;
      stroke-linejoin: round;
    }

    .plane-guide {
      fill: none;
      stroke: var(--plane-edge);
      stroke-width: 1.5px;
      stroke-linecap: round;
    }

    .vector-b-line {
      fill: none;
      stroke: var(--vector-b);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .vector-b-head {
      fill: var(--vector-b);
      stroke: var(--vector-b);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .projection-line {
      fill: none;
      stroke: var(--projection);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .projection-head {
      fill: var(--projection);
      stroke: var(--projection);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .residual-line {
      fill: none;
      stroke: var(--residual);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .residual-head {
      fill: var(--residual);
      stroke: var(--residual);
      stroke-width: 1px;
      stroke-linejoin: round;
    }

    .right-angle {
      fill: var(--surface);
      stroke: var(--residual);
      stroke-width: 2.5px;
      stroke-linejoin: miter;
    }

    .point-b {
      fill: var(--vector-b);
      stroke: var(--point-ring);
      stroke-width: 2.5px;
    }

    .point-projection {
      fill: var(--projection);
      stroke: var(--point-ring);
      stroke-width: 2.5px;
    }

    .point-origin {
      fill: var(--origin);
      stroke: var(--point-ring);
      stroke-width: 2px;
    }

    .label {
      fill: var(--text);
      stroke: var(--surface);
      stroke-width: 7px;
      paint-order: stroke fill;
      stroke-linejoin: round;
      font-size: 19px;
      font-weight: bold;
    }

    .label-secondary {
      fill: var(--muted);
      stroke: var(--surface);
      stroke-width: 7px;
      paint-order: stroke fill;
      stroke-linejoin: round;
      font-size: 17px;
      font-weight: bold;
    }

    .label-projection {
      fill: var(--projection);
    }

    .label-residual {
      fill: var(--residual);
    }

    .label-b {
      fill: var(--vector-b);
    }

    .fallback {
      color: var(--fallback);
      background: var(--surface);
      font-size: 18px;
      text-align: center;
      padding: 18px;
    }

    noscript {
      display: block;
      color: var(--fallback);
      background: var(--surface);
      font-size: 18px;
      text-align: center;
      padding: 18px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <figcaption id="diagram-title">
      Наименьшие квадраты проецируют b на пространство столбцов A
    </figcaption>

    <svg
      id="diagram"
      viewBox="0 0 820 430"
      width="820"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        Вектор b находится вне пространства столбцов A. Вектор A x с крышкой
        заканчивается в ближайшей точке b с крышкой на плоскости, а невязка
        b минус A x с крышкой перпендикулярна этой плоскости.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать вектор b над пространством столбцов A,
      его перпендикулярную проекцию A x̂ = b̂ и невязку b − A x̂.
    </p>

    <noscript>
      Схема показывает вектор b над пространством столбцов A,
      его перпендикулярную проекцию A x̂ = b̂ и невязку b − A x̂.
    </noscript>
  </figure>

  <script>
    const diagramData = [
      {
        kind: "settings",
        origin: { x: 85, y: 390 },
        scale: 75,
        pointRadius: 0.075
      },
      {
        kind: "named-points",
        values: {
          origin: { x: 0, y: 0 },
          projection: { x: 4.9, y: 1.3 },
          b: { x: 4.9, y: 4.55 }
        }
      },
      {
        kind: "plane",
        vertices: [
          { x: 0, y: 0 },
          { x: 6.8, y: 0 },
          { x: 8.4, y: 2.25 },
          { x: 1.6, y: 2.25 }
        ],
        guides: [
          [
            { x: 1.65, y: 0.55 },
            { x: 7.05, y: 0.55 }
          ],
          [
            { x: 2.3, y: 1.45 },
            { x: 7.7, y: 1.45 }
          ],
          [
            { x: 1.15, y: 0.2 },
            { x: 2.35, y: 1.9 }
          ]
        ]
      },
      {
        kind: "vectors",
        values: [
          {
            role: "vector-b",
            from: "origin",
            to: "b",
            lineClass: "vector-b-line",
            headClass: "vector-b-head",
            wings: [
              { x: 4.613, y: 4.447 },
              { x: 4.777, y: 4.271 }
            ]
          },
          {
            role: "projection",
            from: "origin",
            to: "projection",
            lineClass: "projection-line",
            headClass: "projection-head",
            wings: [
              { x: 4.58, y: 1.37 },
              { x: 4.64, y: 1.13 }
            ]
          },
          {
            role: "residual",
            from: "projection",
            to: "b",
            lineClass: "residual-line",
            headClass: "residual-head",
            wings: [
              { x: 4.77, y: 4.3 },
              { x: 5.03, y: 4.3 }
            ]
          }
        ]
      },
      {
        kind: "right-angle",
        vertices: [
          "projection",
          { x: 5.18, y: 1.3 },
          { x: 5.18, y: 1.58 },
          { x: 4.9, y: 1.58 }
        ]
      },
      {
        kind: "visible-points",
        values: [
          { at: "origin", className: "point-origin" },
          { at: "projection", className: "point-projection" },
          { at: "b", className: "point-b" }
        ]
      },
      {
        kind: "labels",
        values: [
          {
            text: "b",
            at: "b",
            dx: 15,
            dy: -13,
            anchor: "start",
            className: "label label-b"
          },
          {
            text: "A x̂ = b̂",
            at: { x: 2.45, y: 0.65 },
            dx: 12,
            dy: -14,
            anchor: "start",
            className: "label label-projection"
          },
          {
            text: "r = b − A x̂",
            at: { x: 4.9, y: 2.9 },
            dx: 18,
            dy: 5,
            anchor: "start",
            className: "label label-residual"
          },
          {
            text: "пространство столбцов A",
            at: { x: 8.15, y: 0.28 },
            dx: -4,
            dy: 10,
            anchor: "end",
            className: "label-secondary"
          },
          {
            text: "ближайшая достижимая точка",
            at: "projection",
            dx: 15,
            dy: 30,
            anchor: "start",
            className: "label-secondary"
          }
        ]
      }
    ];

    const [
      settings,
      namedPointData,
      planeData,
      vectorData,
      angleData,
      visiblePointData,
      labelData
    ] = diagramData;

    const origin = Object.freeze(settings.origin);
    const scale = settings.scale;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";
      const namedPoints = namedPointData.values;

      const resolvePoint = value =>
        typeof value === "string" ? namedPoints[value] : value;

      const makeElement = (name, attributes, content) => {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([attribute, value]) => {
          element.setAttribute(attribute, String(value));
        });

        if (content !== undefined) {
          element.textContent = content;
        }

        return element;
      };

      const pointList = values =>
        values
          .map(resolvePoint)
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

      const appendLine = (startValue, endValue, className, parent) => {
        const start = resolvePoint(startValue);
        const end = resolvePoint(endValue);

        parent.appendChild(
          makeElement("line", {
            x1: sx(start.x),
            y1: sy(start.y),
            x2: sx(end.x),
            y2: sy(end.y),
            class: className
          })
        );
      };

      const planeGroup = makeElement("g", {
        "aria-label": "Пространство столбцов A"
      });

      planeGroup.appendChild(
        makeElement("polygon", {
          points: pointList(planeData.vertices),
          class: "plane"
        })
      );

      planeData.guides.forEach(guide => {
        appendLine(guide.at(0), guide.at(-1), "plane-guide", planeGroup);
      });

      svg.appendChild(planeGroup);

      const vectorGroup = makeElement("g", {
        "aria-label": "Векторы b, его проекция и невязка"
      });

      vectorData.values.forEach(vector => {
        appendLine(vector.from, vector.to, vector.lineClass, vectorGroup);

        vectorGroup.appendChild(
          makeElement("polygon", {
            points: pointList([
              resolvePoint(vector.to),
              ...vector.wings
            ]),
            class: vector.headClass
          })
        );
      });

      svg.appendChild(vectorGroup);

      svg.appendChild(
        makeElement("polygon", {
          points: pointList(angleData.vertices),
          class: "right-angle",
          "aria-label": "Прямой угол"
        })
      );

      const pointGroup = makeElement("g", {
        "aria-label": "Ключевые точки"
      });

      visiblePointData.values.forEach(item => {
        const point = resolvePoint(item.at);

        pointGroup.appendChild(
          makeElement("circle", {
            cx: sx(point.x),
            cy: sy(point.y),
            r: settings.pointRadius * scale,
            class: item.className
          })
        );
      });

      svg.appendChild(pointGroup);

      const labelGroup = makeElement("g", {
        "aria-label": "Подписи"
      });

      labelData.values.forEach(label => {
        const point = resolvePoint(label.at);

        labelGroup.appendChild(
          makeElement(
            "text",
            {
              x: sx(point.x),
              y: sy(point.y),
              dx: label.dx,
              dy: label.dy,
              "text-anchor": label.anchor,
              class: label.className
            },
            label.text
          )
        );
      });

      svg.appendChild(labelGroup);
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");

      svg.hidden = true;
      svg.setAttribute("aria-hidden", "true");
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
