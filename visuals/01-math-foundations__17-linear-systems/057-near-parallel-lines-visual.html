<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <title>Малый сдвиг уносит решение</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ee;
      --panel: #fffdf8;
      --ink: #20252b;
      --muted: #5d6872;
      --grid: #cbd2d7;
      --axis: #69747d;
      --fixed: #157a8a;
      --before: #c07816;
      --after: #b53b68;
      --motion: #694cb5;
      --halo: #efe2a6;
      --border: #d6d0c6;
      --line-thin: 1.5px;
      --line-main: 4px;
      --line-back: 7px;
      --font-small: 14px;
      --font-main: 16px;
      --font-title: 21px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #171a1e;
        --panel: #20252b;
        --ink: #edf1f3;
        --muted: #b4bec5;
        --grid: #46515a;
        --axis: #909ca5;
        --fixed: #5cc6d1;
        --before: #f2b653;
        --after: #f27da6;
        --motion: #b9a1ff;
        --halo: #514923;
        --border: #3d474f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
    }

    .figure {
      width: 100%;
      max-width: 1120px;
      margin: auto;
      overflow: hidden;
      background: var(--panel);
      border: var(--line-thin) solid var(--border);
    }

    .heading {
      margin: 0;
      padding: 14px 18px 3px;
      font-size: var(--font-title);
      line-height: 1.2;
      font-weight: 720;
    }

    .subheading {
      margin: 0;
      padding: 4px 18px 9px;
      color: var(--muted);
      font-size: var(--font-small);
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    svg text {
      fill: var(--ink);
      font-family: inherit;
      font-size: var(--font-main);
    }

    .small {
      font-size: var(--font-small);
    }

    .muted {
      fill: var(--muted);
    }

    .strong {
      font-weight: 700;
    }

    .axis,
    .tick,
    .leader {
      fill: none;
      stroke: var(--axis);
      stroke-width: var(--line-thin);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .grid {
      fill: none;
      stroke: var(--grid);
      stroke-width: var(--line-thin);
    }

    .fixed-line {
      fill: none;
      stroke: var(--fixed);
      stroke-width: var(--line-back);
      stroke-linecap: round;
    }

    .after-line {
      fill: none;
      stroke: var(--after);
      stroke-width: var(--line-main);
      stroke-linecap: round;
    }

    .before-line {
      fill: none;
      stroke: var(--before);
      stroke-width: var(--line-main);
      stroke-linecap: round;
    }

    .motion {
      fill: none;
      stroke: var(--motion);
      stroke-width: var(--line-main);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .motion-head {
      fill: var(--motion);
    }

    .before-point {
      fill: var(--before);
      stroke: var(--panel);
      stroke-width: var(--line-thin);
    }

    .after-point {
      fill: var(--after);
      stroke: var(--panel);
      stroke-width: var(--line-thin);
    }

    .halo {
      fill: var(--halo);
      stroke: var(--axis);
      stroke-width: var(--line-thin);
    }

    .legend-swatch {
      fill: none;
      stroke-linecap: round;
      stroke-width: var(--line-main);
    }

    .note-box {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: var(--line-thin);
    }

    .fallback {
      margin: 14px 18px 18px;
      color: var(--ink);
      font-size: var(--font-main);
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-title diagram-caption">
    <h2 class="heading" id="diagram-title">Малый сдвиг почти параллельных прямых уносит решение</h2>
    <p class="subheading" id="diagram-caption">
      При почти одинаковых наклонах изменение свободного члена на 0,001
      переносит пересечение с x = −1 к x = −2.
    </p>
    <svg id="diagram"
         viewBox="0 0 960 390"
         width="960"
         height="390"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сдвиг одной из почти параллельных прямых</title>
      <desc id="svg-desc">
        Прямая y равно x и два положения прямой с наклоном 1,001.
        Малый сдвиг свободного члена с 0,001 до 0,002 перемещает точку
        пересечения от минус одного к минус двум.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    "use strict";

    const data = {
      canvas: { width: 960, height: 390 },
      axes: {
        x: { from: -3.35, to: 0.9, at: 0 },
        y: { from: -2.72, to: 0.56, at: 0 },
        ticks: [
          { value: -2, half: 0.055, label: "−2" },
          { value: -1, half: 0.055, label: "−1" }
        ]
      },
      lines: [
        {
          role: "fixed",
          m: 1,
          b: 0,
          from: -2.63,
          to: 0.5,
          className: "fixed-line",
          legendClass: "fixed",
          label: "y = x"
        },
        {
          role: "before",
          m: 1.001,
          b: 0.001,
          from: -2.63,
          to: 0.5,
          className: "before-line",
          legendClass: "before",
          label: "до: y = 1,001x + 0,001",
          dash: [0.09, 0.065]
        },
        {
          role: "after",
          m: 1.001,
          b: 0.002,
          from: -2.63,
          to: 0.5,
          className: "after-line",
          legendClass: "after",
          label: "после: y = 1,001x + 0,002"
        }
      ],
      intersections: [
        {
          kind: "before",
          point: { x: -1, y: -1 },
          radius: 0.075,
          label: "до: x = −1",
          labelAnchor: { x: -0.92, y: -0.89 },
          pad: { x: 10, y: -7 },
          anchor: "start"
        },
        {
          kind: "after",
          point: { x: -2, y: -2 },
          radius: 0.075,
          label: "после: x = −2",
          labelAnchor: { x: -2.08, y: -2.1 },
          pad: { x: -10, y: 18 },
          anchor: "end"
        }
      ],
      movement: {
        tail: { x: -1.12, y: -0.89 },
        head: { x: -1.88, y: -1.65 },
        curve: { x: -1.54, y: -1.14 },
        headLength: 0.15,
        headWidth: 0.09,
        labelAnchor: { x: -1.56, y: -1.27 },
        labelPad: { x: 10, y: -9 },
        labels: [
          "точка встречи уехала далеко",
          "x: −1 → −2"
        ],
        lineGap: 0.18
      },
      intercept: {
        center: { x: 0, y: 0.0015 },
        radius: 0.15,
        leaderFrom: { x: -0.24, y: 0.31 },
        leaderBend: { x: -0.13, y: 0.2 },
        leaderTo: { x: -0.04, y: 0.08 },
        labelAnchor: { x: -0.3, y: 0.37 },
        labelPad: { x: -8, y: -5 },
        label: "у x = 0 сдвиг почти не виден"
      },
      legend: {
        titleAt: { x: -6.42, y: 0.46 },
        rows: [
          { line: "fixed", y: 0.18 },
          { line: "before", y: -0.13 },
          { line: "after", y: -0.44 }
        ],
        swatchFrom: -6.4,
        swatchTo: -5.96,
        textAt: -5.78,
        title: "Одни оси, три линии"
      },
      note: {
        topLeft: { x: -6.5, y: -0.76 },
        bottomRight: { x: -3.52, y: -1.68 },
        corner: 0.08,
        textAt: { x: -6.3, y: -0.98 },
        lines: [
          { text: "сдвиг в b:", className: "small muted" },
          { text: "0,001 → 0,002", className: "strong" },
          { text: "разница всего 0,001", className: "small muted" }
        ],
        lineGap: 0.27
      },
      labels: {
        x: { at: { x: 0.87, y: 0 }, pad: { x: 10, y: 22 } },
        y: { at: { x: 0, y: 0.53 }, pad: { x: 10, y: 4 } },
        tick: { pad: { x: 0, y: 22 } }
      },
      arrow: {
        axisLength: 0.13,
        axisWidth: 0.07
      }
    };

    const origin = { x: 780, y: 70 };
    const scale = 115;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y - y * scale;

    try {
      const svg = document.getElementById("diagram");
      const drawing = document.getElementById("drawing");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attrs, parent = drawing) => {
        const node = document.createElementNS(ns, name);
        for (const [key, value] of Object.entries(attrs || {})) {
          node.setAttribute(key, String(value));
        }
        parent.appendChild(node);
        return node;
      };

      const point = (p, className, radius) => make("circle", {
        cx: sx(p.x),
        cy: sy(p.y),
        r: Math.abs(sx(radius) - sx(0)),
        class: className
      });

      const text = (value, anchor, options = {}) => {
        const node = make("text", {
          x: sx(anchor.x),
          y: sy(anchor.y),
          dx: options.dx,
          dy: options.dy,
          "text-anchor": options.textAnchor || "start",
          class: options.className || ""
        });
        node.textContent = value;
        return node;
      };

      const segment = (a, b, className, extra = {}) => make("line", {
        x1: sx(a.x),
        y1: sy(a.y),
        x2: sx(b.x),
        y2: sy(b.y),
        class: className,
        ...extra
      });

      const lineY = (line, x) => line.m * x + line.b;

      const arrowHead = (tail, head, length, width, className) => {
        const vx = head.x - tail.x;
        const vy = head.y - tail.y;
        const magnitude = Math.hypot(vx, vy);
        const ux = vx / magnitude;
        const uy = vy / magnitude;
        const base = {
          x: head.x - ux * length,
          y: head.y - uy * length
        };
        const left = {
          x: base.x - uy * width,
          y: base.y + ux * width
        };
        const right = {
          x: base.x + uy * width,
          y: base.y - ux * width
        };
        make("polygon", {
          points: [
            `${sx(head.x)},${sy(head.y)}`,
            `${sx(left.x)},${sy(left.y)}`,
            `${sx(right.x)},${sy(right.y)}`
          ].join(" "),
          class: className
        });
      };

      const axisXStart = {
        x: data.axes.x.from,
        y: data.axes.x.at
      };
      const axisXEnd = {
        x: data.axes.x.to,
        y: data.axes.x.at
      };
      const axisYStart = {
        x: data.axes.y.at,
        y: data.axes.y.from
      };
      const axisYEnd = {
        x: data.axes.y.at,
        y: data.axes.y.to
      };

      segment(axisXStart, axisXEnd, "axis");
      segment(axisYStart, axisYEnd, "axis");
      arrowHead(
        axisXStart,
        axisXEnd,
        data.arrow.axisLength,
        data.arrow.axisWidth,
        "motion-head"
      );
      arrowHead(
        axisYStart,
        axisYEnd,
        data.arrow.axisLength,
        data.arrow.axisWidth,
        "motion-head"
      );

      for (const tick of data.axes.ticks) {
        segment(
          { x: tick.value, y: -tick.half },
          { x: tick.value, y: tick.half },
          "tick"
        );
        segment(
          { x: tick.value, y: data.axes.y.from },
          { x: tick.value, y: data.axes.y.to },
          "grid"
        );
        text(
          tick.label,
          { x: tick.value, y: data.axes.x.at },
          {
            dx: data.labels.tick.pad.x,
            dy: data.labels.tick.pad.y,
            textAnchor: "middle",
            className: "small muted"
          }
        );
      }

      text("x", data.labels.x.at, {
        dx: data.labels.x.pad.x,
        dy: data.labels.x.pad.y,
        className: "strong"
      });
      text("y", data.labels.y.at, {
        dx: data.labels.y.pad.x,
        dy: data.labels.y.pad.y,
        className: "strong"
      });

      const orderedLines = [
        data.lines.find(line => line.role === "fixed"),
        data.lines.find(line => line.role === "after"),
        data.lines.find(line => line.role === "before")
      ];

      for (const line of orderedLines) {
        const extra = {};
        if (line.dash) {
          extra["stroke-dasharray"] = line.dash
            .map(value => Math.abs(sx(value) - sx(0)))
            .join(" ");
        }
        segment(
          { x: line.from, y: lineY(line, line.from) },
          { x: line.to, y: lineY(line, line.to) },
          line.className,
          extra
        );
      }

      point(
        data.intercept.center,
        "halo",
        data.intercept.radius
      );

      make("path", {
        d: [
          `M ${sx(data.intercept.leaderFrom.x)} ${sy(data.intercept.leaderFrom.y)}`,
          `Q ${sx(data.intercept.leaderBend.x)} ${sy(data.intercept.leaderBend.y)}`,
          `${sx(data.intercept.leaderTo.x)} ${sy(data.intercept.leaderTo.y)}`
        ].join(" "),
        class: "leader"
      });

      text(data.intercept.label, data.intercept.labelAnchor, {
        dx: data.intercept.labelPad.x,
        dy: data.intercept.labelPad.y,
        textAnchor: "end",
        className: "small muted"
      });

      for (const item of data.intersections) {
        point(
          item.point,
          `${item.kind}-point`,
          item.radius
        );
        text(item.label, item.labelAnchor, {
          dx: item.pad.x,
          dy: item.pad.y,
          textAnchor: item.anchor,
          className: "strong"
        });
      }

      make("path", {
        d: [
          `M ${sx(data.movement.tail.x)} ${sy(data.movement.tail.y)}`,
          `Q ${sx(data.movement.curve.x)} ${sy(data.movement.curve.y)}`,
          `${sx(data.movement.head.x)} ${sy(data.movement.head.y)}`
        ].join(" "),
        class: "motion"
      });

      arrowHead(
        data.movement.curve,
        data.movement.head,
        data.movement.headLength,
        data.movement.headWidth,
        "motion-head"
      );

      const movementLabel = text(
        data.movement.labels.join(""),
        data.movement.labelAnchor,
        {
          dx: data.movement.labelPad.x,
          dy: data.movement.labelPad.y,
          textAnchor: "start",
          className: "small"
        }
      );
      movementLabel.textContent = "";

      for (const [label, offset] of [
        [data.movement.labels[0], 0],
        [data.movement.labels[1], data.movement.lineGap]
      ]) {
        const span = document.createElementNS(ns, "tspan");
        span.setAttribute("x", sx(data.movement.labelAnchor.x));
        span.setAttribute("dx", data.movement.labelPad.x);
        span.setAttribute("y", sy(data.movement.labelAnchor.y - offset));
        span.textContent = label;
        movementLabel.appendChild(span);
      }

      text(data.legend.title, data.legend.titleAt, {
        className: "small strong"
      });

      for (const row of data.legend.rows) {
        const line = data.lines.find(item => item.role === row.line);
        segment(
          { x: data.legend.swatchFrom, y: row.y },
          { x: data.legend.swatchTo, y: row.y },
          `legend-swatch ${line.legendClass}-line`,
          line.dash ? {
            "stroke-dasharray": line.dash
              .map(value => Math.abs(sx(value) - sx(0)))
              .join(" ")
          } : {}
        );
        text(line.label, { x: data.legend.textAt, y: row.y }, {
          dy: 5,
          className: "small"
        });
      }

      const noteWidth =
        sx(data.note.bottomRight.x) - sx(data.note.topLeft.x);
      const noteHeight =
        sy(data.note.bottomRight.y) - sy(data.note.topLeft.y);

      make("rect", {
        x: sx(data.note.topLeft.x),
        y: sy(data.note.topLeft.y),
        width: noteWidth,
        height: noteHeight,
        rx: Math.abs(sx(data.note.corner) - sx(0)),
        ry: Math.abs(sy(data.note.corner) - sy(0)),
        class: "note-box"
      });

      for (const [item, offset] of [
        [data.note.lines[0], 0],
        [data.note.lines[1], data.note.lineGap],
        [data.note.lines[2], data.note.lineGap + data.note.lineGap]
      ]) {
        text(
          item.text,
          {
            x: data.note.textAt.x,
            y: data.note.textAt.y - offset
          },
          { className: item.className }
        );
      }
    } catch (error) {
      const svg = document.getElementById("diagram");
      svg.remove();
      const fallback = document.createElement("p");
      fallback.className = "fallback";
      fallback.textContent =
        "Схема должна была показать две почти параллельные прямые: после малого сдвига с 0,001 до 0,002 их точка пересечения перемещается далеко — от x = −1 к x = −2.";
      document.querySelector(".figure").appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
