<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Маршрут данных через две сети GAN</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --panel: #ffffff;
    --text: #172033;
    --muted: #5b6475;
    --border: #cbd5e1;
    --generator-fill: #dbeafe;
    --generator-stroke: #2563eb;
    --discriminator-fill: #fef3c7;
    --discriminator-stroke: #d97706;
    --output-fill: #dcfce7;
    --output-stroke: #16a34a;
    --noise-fill: #eef2ff;
    --noise-stroke: #6366f1;
    --fake-route: #db2777;
    --real-route: #7c3aed;
    --common-route: #d97706;
    --junction-fill: #fff7ed;
    --fake-pixel-a: #f9a8d4;
    --fake-pixel-b: #fbcfe8;
    --fake-pixel-c: #be185d;
    --fake-pixel-d: #fdf2f8;
    --real-pixel-a: #a78bfa;
    --real-pixel-b: #ddd6fe;
    --real-pixel-c: #6d28d9;
    --real-pixel-d: #f5f3ff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111827;
      --panel: #182235;
      --text: #f1f5f9;
      --muted: #b7c1d1;
      --border: #475569;
      --generator-fill: #172f55;
      --generator-stroke: #60a5fa;
      --discriminator-fill: #493617;
      --discriminator-stroke: #fbbf24;
      --output-fill: #153c2b;
      --output-stroke: #4ade80;
      --noise-fill: #29294f;
      --noise-stroke: #a5b4fc;
      --fake-route: #f472b6;
      --real-route: #c4b5fd;
      --common-route: #fbbf24;
      --junction-fill: #3b2a1b;
      --fake-pixel-a: #9d174d;
      --fake-pixel-b: #831843;
      --fake-pixel-c: #f9a8d4;
      --fake-pixel-d: #4a1834;
      --real-pixel-a: #6d28d9;
      --real-pixel-b: #4c1d95;
      --real-pixel-c: #c4b5fd;
      --real-pixel-d: #2e1a52;
    }
  }

  html,
  body {
    margin: unset;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .figure {
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--border);
  }

  .heading {
    color: var(--text);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-size: 18px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  text {
    fill: var(--text);
    font-size: 15px;
  }

  .lane-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: bold;
  }

  .node-title {
    font-size: 17px;
    font-weight: bold;
  }

  .node-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .image-title {
    font-size: 15px;
    font-weight: bold;
  }

  .dimension {
    fill: var(--muted);
    font-size: 14px;
    font-weight: bold;
  }

  .arrow-label {
    fill: var(--muted);
    font-size: 13px;
  }

  .output-value {
    font-size: 17px;
    font-weight: bold;
  }

  .card {
    stroke-width: 2px;
  }

  .noise-card {
    fill: var(--noise-fill);
    stroke: var(--noise-stroke);
  }

  .generator-card {
    fill: var(--generator-fill);
    stroke: var(--generator-stroke);
  }

  .discriminator-card {
    fill: var(--discriminator-fill);
    stroke: var(--discriminator-stroke);
  }

  .output-card {
    fill: var(--output-fill);
    stroke: var(--output-stroke);
  }

  .image-border {
    fill: none;
    stroke: var(--border);
    stroke-width: 2px;
  }

  .pixel {
    stroke: var(--bg);
    stroke-width: 1px;
  }

  .fake-line,
  .real-line,
  .common-line,
  .generator-line {
    fill: none;
    stroke-width: 3px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .fake-line {
    stroke: var(--fake-route);
  }

  .real-line {
    stroke: var(--real-route);
  }

  .common-line {
    stroke: var(--common-route);
  }

  .generator-line {
    stroke: var(--generator-stroke);
  }

  .fake-head {
    fill: var(--fake-route);
  }

  .real-head {
    fill: var(--real-route);
  }

  .common-head {
    fill: var(--common-route);
  }

  .generator-head {
    fill: var(--generator-stroke);
  }

  .junction {
    fill: var(--junction-fill);
    stroke: var(--common-route);
    stroke-width: 2px;
  }

  .fallback {
    color: var(--text);
    background: var(--bg);
    font-size: 16px;
    text-align: center;
  }
</style>
</head>
<body>
<figure class="figure">
  <div class="heading" id="diagram-heading">Маршрут данных через две сети GAN</div>
  <svg id="diagram"
       viewBox="0 0 1120 390"
       width="1120"
       height="390"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-heading diagram-description">
    <desc id="diagram-description">
      Шум из 64 чисел проходит через Generator и становится картинкой
      32 на 32 на 3. Настоящая и созданная картинки поступают в один и тот
      же Discriminator, который возвращает один логит P(real).
    </desc>
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна была показать два маршрута: шум z из 64 чисел проходит через
    Generator в картинку 32 × 32 × 3, а настоящая картинка сразу направляется
    вместе с ней в один Discriminator, возвращающий 1 логит P(real) = 0,73.
  </div>
</figure>

<script>
const diagramData = [{
  origin: { x: 0, y: 0 },
  scale: { x: 1, y: 1 },
  canvas: { x: 0, y: 0, width: 1120, height: 390 },
  half: 2,
  arrowLength: 13,
  arrowHalfWidth: 7,
  corner: 12,
  junction: { x: 710, y: 195, dx: 11, dy: 11 },
  laneFake: { x: 35, y: 29 },
  laneReal: { x: 35, y: 229 },
  noise: {
    x: 35, y: 65, width: 150, height: 80,
    titleY: 96, noteY: 121
  },
  generator: {
    x: 245, y: 55, width: 180, height: 100,
    titleY: 94, noteY: 122
  },
  fakeImage: {
    x: 500, y: 50, size: 100,
    titleY: 39, dimensionY: 174
  },
  realImage: {
    x: 500, y: 245, size: 100,
    titleY: 234, dimensionY: 370
  },
  discriminator: {
    x: 760, y: 135, width: 190, height: 120,
    titleY: 183, noteY: 212
  },
  output: {
    x: 980, y: 157, width: 130, height: 76,
    titleY: 184, valueY: 212
  },
  fakeMergeLabel: { x: 705, y: 164 },
  outputLabel: { x: 965, y: 177 },
  generatorLabel: { x: 215, y: 91 },
  gridIndices: [0, 1, 2, 3, 4],
  fakePalette: [
    "var(--fake-pixel-a)",
    "var(--fake-pixel-b)",
    "var(--fake-pixel-c)",
    "var(--fake-pixel-d)"
  ],
  realPalette: [
    "var(--real-pixel-a)",
    "var(--real-pixel-b)",
    "var(--real-pixel-c)",
    "var(--real-pixel-d)"
  ],
  generatorInput: [
    { x: 185, y: 105 },
    { x: 245, y: 105 }
  ],
  generatorOutput: [
    { x: 425, y: 105 },
    { x: 500, y: 105 }
  ],
  fakeRoute: [
    { x: 600, y: 105 },
    { x: 650, y: 105 },
    { x: 702, y: 188 }
  ],
  realRoute: [
    { x: 600, y: 295 },
    { x: 650, y: 295 },
    { x: 702, y: 202 }
  ],
  commonRoute: [
    { x: 721, y: 195 },
    { x: 760, y: 195 }
  ],
  outputRoute: [
    { x: 950, y: 195 },
    { x: 980, y: 195 }
  ]
}];

const [{ origin, scale, ...data }] = diagramData;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  function append(tag, attributes, parent) {
    const node = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attributes)) {
      node.setAttribute(name, value);
    }
    (parent || svg).appendChild(node);
    return node;
  }

  function textAt(x, y, value, className, anchor) {
    const node = append("text", {
      x: sx(x),
      y: sy(y),
      class: className,
      "text-anchor": anchor
    });
    node.textContent = value;
    return node;
  }

  function rectangle(spec, className) {
    return append("rect", {
      x: sx(spec.x),
      y: sy(spec.y),
      width: sx(spec.width),
      height: sy(spec.height),
      rx: sx(data.corner),
      ry: sy(data.corner),
      class: className
    });
  }

  function arrow(points, lineClass, headClass) {
    append("polyline", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: lineClass
    });

    const reversed = [...points].reverse();
    const [tip, previous] = reversed;
    const deltaX = tip.x - previous.x;
    const deltaY = tip.y - previous.y;
    const length = Math.hypot(deltaX, deltaY);
    const unitX = deltaX / length;
    const unitY = deltaY / length;
    const baseX = tip.x - unitX * data.arrowLength;
    const baseY = tip.y - unitY * data.arrowLength;
    const left = {
      x: baseX - unitY * data.arrowHalfWidth,
      y: baseY + unitX * data.arrowHalfWidth
    };
    const right = {
      x: baseX + unitY * data.arrowHalfWidth,
      y: baseY - unitX * data.arrowHalfWidth
    };

    append("polygon", {
      points: [tip, left, right]
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" "),
      class: headClass
    });
  }

  function imageTile(spec, palette) {
    const cell = spec.size / data.gridIndices.length;

    for (const row of data.gridIndices) {
      for (const column of data.gridIndices) {
        const paletteIndex =
          (row * data.gridIndices.length + column + row) % palette.length;
        append("rect", {
          x: sx(spec.x + column * cell),
          y: sy(spec.y + row * cell),
          width: sx(cell),
          height: sy(cell),
          fill: palette[paletteIndex],
          class: "pixel"
        });
      }
    }

    append("rect", {
      x: sx(spec.x),
      y: sy(spec.y),
      width: sx(spec.size),
      height: sy(spec.size),
      rx: sx(data.corner),
      ry: sy(data.corner),
      class: "image-border"
    });
  }

  append("rect", {
    x: sx(data.canvas.x),
    y: sy(data.canvas.y),
    width: sx(data.canvas.width),
    height: sy(data.canvas.height),
    fill: "var(--bg)"
  });

  textAt(
    data.laneFake.x,
    data.laneFake.y,
    "МАРШРУТ ПОДДЕЛКИ",
    "lane-label",
    "start"
  );
  textAt(
    data.laneReal.x,
    data.laneReal.y,
    "МАРШРУТ НАСТОЯЩЕЙ КАРТИНКИ",
    "lane-label",
    "start"
  );

  rectangle(data.noise, "card noise-card");
  textAt(
    data.noise.x + data.noise.width / data.half,
    data.noise.titleY,
    "Шум z",
    "node-title",
    "middle"
  );
  textAt(
    data.noise.x + data.noise.width / data.half,
    data.noise.noteY,
    "64 случайных числа",
    "node-note",
    "middle"
  );

  rectangle(data.generator, "card generator-card");
  textAt(
    data.generator.x + data.generator.width / data.half,
    data.generator.titleY,
    "Generator",
    "node-title",
    "middle"
  );
  textAt(
    data.generator.x + data.generator.width / data.half,
    data.generator.noteY,
    "создаёт изображение",
    "node-note",
    "middle"
  );

  imageTile(data.fakeImage, data.fakePalette);
  textAt(
    data.fakeImage.x + data.fakeImage.size / data.half,
    data.fakeImage.titleY,
    "Поддельная картинка",
    "image-title",
    "middle"
  );
  textAt(
    data.fakeImage.x + data.fakeImage.size / data.half,
    data.fakeImage.dimensionY,
    "32 × 32 × 3",
    "dimension",
    "middle"
  );

  imageTile(data.realImage, data.realPalette);
  textAt(
    data.realImage.x + data.realImage.size / data.half,
    data.realImage.titleY,
    "Настоящая картинка",
    "image-title",
    "middle"
  );
  textAt(
    data.realImage.x + data.realImage.size / data.half,
    data.realImage.dimensionY,
    "32 × 32 × 3",
    "dimension",
    "middle"
  );

  arrow(data.generatorInput, "generator-line", "generator-head");
  arrow(data.generatorOutput, "generator-line", "generator-head");
  arrow(data.fakeRoute, "fake-line", "fake-head");
  arrow(data.realRoute, "real-line", "real-head");

  textAt(
    data.generatorLabel.x,
    data.generatorLabel.y,
    "64 числа",
    "arrow-label",
    "middle"
  );

  append("polygon", {
    points: [
      { x: data.junction.x, y: data.junction.y - data.junction.dy },
      { x: data.junction.x + data.junction.dx, y: data.junction.y },
      { x: data.junction.x, y: data.junction.y + data.junction.dy },
      { x: data.junction.x - data.junction.dx, y: data.junction.y }
    ].map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
    class: "junction"
  });

  textAt(
    data.fakeMergeLabel.x,
    data.fakeMergeLabel.y,
    "одинаковый формат",
    "arrow-label",
    "middle"
  );

  arrow(data.commonRoute, "common-line", "common-head");

  rectangle(data.discriminator, "card discriminator-card");
  textAt(
    data.discriminator.x + data.discriminator.width / data.half,
    data.discriminator.titleY,
    "Discriminator",
    "node-title",
    "middle"
  );
  textAt(
    data.discriminator.x + data.discriminator.width / data.half,
    data.discriminator.noteY,
    "одна и та же сеть",
    "node-note",
    "middle"
  );

  arrow(data.outputRoute, "common-line", "common-head");
  textAt(
    data.outputLabel.x,
    data.outputLabel.y,
    "оценка",
    "arrow-label",
    "end"
  );

  rectangle(data.output, "card output-card");
  textAt(
    data.output.x + data.output.width / data.half,
    data.output.titleY,
    "1 логит",
    "node-note",
    "middle"
  );
  textAt(
    data.output.x + data.output.width / data.half,
    data.output.valueY,
    "P(real) = 0,73",
    "output-value",
    "middle"
  );

  fallback.hidden = true;
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
