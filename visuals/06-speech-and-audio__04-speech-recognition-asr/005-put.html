<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Путь по кадрам и что из него получается</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d1f24; --muted:#6b7280; --line:#3f4652;
    --cell:#ffffff; --cellStroke:#3f4652; --blank:#eceef2; --blankFg:#8b94a3;
    --accent:#1f6f5c; --accentBg:#e3f1ec;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e9ecf1; --muted:#98a1b0; --line:#c3cad6;
      --cell:#1e232b; --cellStroke:#c3cad6; --blank:#252b34; --blankFg:#7d8797;
      --accent:#7fd6bb; --accentBg:#1c3a34;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 12px 10px;
        font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        box-sizing:border-box}
  h3{margin:0 0 6px;font-size:15px;font-weight:600;letter-spacing:.01em}
  svg{display:block;width:100%;height:auto;max-width:625px;margin:0 auto}
  .fallback{color:var(--fg);font-size:13px;line-height:1.5;max-width:625px;margin:0 auto}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg)}
  text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  text.muted{fill:var(--muted)}
  text.blankfg{fill:var(--blankFg)}
  text.acc{fill:var(--accent)}
</style>
<div class="wrap">
  <h3>Путь по кадрам и что из него получается</h3>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---------- данные схемы ---------- */
    var DATA = {
      frames: 8,
      paths: [
        ['c','c','_','a','a','_','t','t'],
        ['_','c','a','a','a','t','t','t'],
        ['c','_','_','a','_','t','t','t']
      ],
      rowTop: [0, 1.5, 3.0],
      result: 'cat',
      resultLen: 3
    };

    /* ---------- один origin, один scale, одна пара sx/sy ---------- */
    var ORIGIN = { x: 96, y: 52 };
    var SCALE  = 46;
    function sx(u){ return ORIGIN.x + u * SCALE; }
    function sy(v){ return ORIGIN.y + v * SCALE; }

    var NS = 'http://www.w3.org/2000/svg';
    var W = 500, H = 416;                    /* размеры холста */
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label',
      'Три пути из 8 кадров: c c _ a a _ t t, _ c a a a t t t, c _ _ a _ t t t — все дают cat');

    var bg = document.createElementNS(NS,'rect');
    bg.setAttribute('x','0'); bg.setAttribute('y','0');
    bg.setAttribute('width',W); bg.setAttribute('height',H);
    bg.setAttribute('fill','var(--bg)');
    svg.appendChild(bg);

    function txt(x,y,s,anchor,size,cls){
      var t = document.createElementNS(NS,'text');
      t.setAttribute('x', sx(x)); t.setAttribute('y', sy(y));
      t.setAttribute('text-anchor', anchor);
      t.setAttribute('font-size', size);
      if(cls) t.setAttribute('class', cls);
      t.textContent = s;
      svg.appendChild(t); return t;
    }
    function box(x1,y1,x2,y2,fill,stroke,dash){
      var r = document.createElementNS(NS,'rect');
      r.setAttribute('x', sx(x1)); r.setAttribute('y', sy(y1));
      r.setAttribute('width', sx(x2)-sx(x1));
      r.setAttribute('height', sy(y2)-sy(y1));
      r.setAttribute('rx', sx(0.1)-sx(0));
      r.setAttribute('fill', fill);
      r.setAttribute('stroke', stroke);
      r.setAttribute('stroke-width', 1.4);
      if(dash) r.setAttribute('stroke-dasharray','4 3');
      svg.appendChild(r); return r;
    }
    function line(x1,y1,x2,y2,w){
      var l = document.createElementNS(NS,'line');
      l.setAttribute('x1', sx(x1)); l.setAttribute('y1', sy(y1));
      l.setAttribute('x2', sx(x2)); l.setAttribute('y2', sy(y2));
      l.setAttribute('stroke','var(--line)');
      l.setAttribute('stroke-width', w);
      svg.appendChild(l); return l;
    }

    /* ---------- шапка: номера кадров ---------- */
    txt(0, -0.62, 'Лента кадров: на каждом ровно один токен', 'start', 13, 'muted');
    for(var i=0;i<DATA.frames;i++){
      txt(i+0.5, -0.12, String(i+1), 'middle', 11, 'muted');
    }

    /* ---------- три пути ---------- */
    for(var r=0;r<DATA.paths.length;r++){
      var top = DATA.rowTop[r], path = DATA.paths[r];
      txt(-0.18, top+0.45, 'путь '+(r+1), 'end', 12, 'muted')
        .setAttribute('dominant-baseline','central');
      for(var k=0;k<path.length;k++){
        var isBlank = (path[k] === '_');
        box(k+0.06, top+0.05, k+0.94, top+0.85,
            isBlank ? 'var(--blank)' : 'var(--cell)',
            'var(--cellStroke)', isBlank);
        var c = txt(k+0.5, top+0.45, path[k], 'middle', 17,
                    isBlank ? 'mono blankfg' : 'mono');
        c.setAttribute('dominant-baseline','central');
      }
    }

    /* ---------- стрелка вниз ---------- */
    line(4, 4.05, 4, 5.20, 2);
    var head = document.createElementNS(NS,'polygon');
    head.setAttribute('points',
      sx(3.86)+','+sy(5.14)+' '+sx(4.14)+','+sy(5.14)+' '+sx(4)+','+sy(5.40));
    head.setAttribute('fill','var(--line)');
    svg.appendChild(head);
    /* подпись у хвоста стрелки, сбоку */
    txt(3.80, 4.55, 'три разных черновика —', 'end', 12, 'muted');
    txt(3.80, 4.95, 'один и тот же ответ', 'end', 12, 'muted');

    /* ---------- результат ---------- */
    box(2.9, 5.50, 5.1, 6.60, 'var(--accentBg)', 'var(--accent)', false);
    var res = txt(4, 6.05, DATA.result, 'middle', 22, 'mono acc');
    res.setAttribute('dominant-baseline','central');
    res.setAttribute('font-weight','600');
    txt(4, 7.00, DATA.resultLen + ' символа вместо ' + DATA.frames + ' кадров',
        'middle', 12, 'muted');

    /* ---------- легенда ---------- */
    txt(0, 7.55, '_  —  blank: «на этом кадре ничего не выдавать»',
        'start', 12, 'muted');

    host.appendChild(svg);
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема не построилась. Она должна была ' +
      'показать три ленты по 8 кадров — <code>c c _ a a _ t t</code>, ' +
      '<code>_ c a a a t t t</code>, <code>c _ _ a _ t t t</code> — и стрелку вниз ' +
      'от них к общему результату <code>cat</code> (3 символа вместо 8 кадров), ' +
      'где <code>_</code> — blank, то есть «на этом кадре ничего не выдавать».</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
