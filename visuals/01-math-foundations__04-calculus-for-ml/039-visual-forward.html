<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Прямой проход по шагам</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1f24; --muted:#5b6673;
    --line:#2f6f9f; --box:#eef4fa; --edge:#8fb4d0; --accent:#a8452e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181d; --fg:#e6ebf1; --muted:#9aa7b4;
      --line:#6fb0dd; --box:#1d262f; --edge:#3d5566; --accent:#e2926f;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 12px 16px;
        font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
        box-sizing:border-box}
  h2{margin:0 0 10px;font-size:15px;font-weight:600}
  .fig{max-height:520px}
  svg{display:block;width:100%;height:auto;max-height:470px}
  .fallback{color:var(--muted);font-size:13px;white-space:pre-line}
  text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
<div class="wrap">
  <h2>Прямой проход: одна операция — одна строчка — одно сохранённое число</h2>
  <div class="fig" id="fig"></div>
</div>
<script>
(function(){
  var fig = document.getElementById('fig');
  try{
    /* ---- данные схемы ---- */
    var NODES = [
      {x:0.0, text:'x = 1',   note:'вход'},
      {x:2.9, text:'a = 2',   note:'запомнили 2'},
      {x:5.8, text:'u = 7',   note:'запомнили 7'},
      {x:8.7, text:'v = 343', note:'ответ 343'}
    ];
    var EDGES = [
      {from:0, to:1, op:'умножить на 2', formula:'a = 2x'},
      {from:1, to:2, op:'прибавить 5',   formula:'u = a + 5'},
      {from:2, to:3, op:'возвести в куб', formula:'v = u³'}
    ];
    var LEGEND = 'Все три числа 2, 7 и 343 останутся записанными — они понадобятся на обратном проходе.';

    /* ---- единственный перевод координат ---- */
    var ORIGIN = {x:64, y:72};
    var SCALE  = 56;
    function sx(x){ return ORIGIN.x + x * SCALE; }
    function sy(y){ return ORIGIN.y - y * SCALE; }

    /* ---- геометрия в единицах данных ---- */
    var BOX  = {hw:1.05, hh:0.40, r:0.14};
    var HEAD = {len:0.24, hh:0.13};
    var ROW  = {op:0.86, formula:-0.72, note:-1.26, legend:-2.02};

    var parts = [];
    function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function txt(x, y, s, anchor, size, cls, baseline){
      parts.push('<text x="'+sx(x)+'" y="'+sy(y)+'" text-anchor="'+anchor+
        '" font-size="'+size+'" fill="'+cls+'"'+
        (baseline?' dominant-baseline="'+baseline+'"':'')+'>'+esc(s)+'</text>');
    }

    /* базовая линия прохода — через ту же пару функций */
    parts.push('<line x1="'+sx(NODES[0].x)+'" y1="'+sy(0)+'" x2="'+
      sx(NODES[NODES.length-1].x)+'" y2="'+sy(0)+
      '" stroke="var(--edge)" stroke-width="1" stroke-dasharray="4 5"/>');

    /* стрелки: подпись операции над хвостом-серединой, формула под ней */
    EDGES.forEach(function(e){
      var a = NODES[e.from].x + BOX.hw;
      var b = NODES[e.to].x   - BOX.hw;
      var tip = b, base = b - HEAD.len;
      parts.push('<line x1="'+sx(a)+'" y1="'+sy(0)+'" x2="'+sx(base)+'" y2="'+sy(0)+
        '" stroke="var(--line)" stroke-width="2"/>');
      parts.push('<polygon points="'+
        sx(tip)+','+sy(0)+' '+
        sx(base)+','+sy(HEAD.hh)+' '+
        sx(base)+','+sy(-HEAD.hh)+
        '" fill="var(--line)"/>');
      var mid = (a + b) / 2;
      txt(mid, ROW.op, e.op, 'middle', 13, 'var(--fg)');
      txt(mid, ROW.formula, e.formula, 'middle', 13, 'var(--accent)');
    });

    /* узлы */
    NODES.forEach(function(n){
      var x0 = sx(n.x - BOX.hw), x1 = sx(n.x + BOX.hw);
      var y0 = sy(BOX.hh),       y1 = sy(-BOX.hh);
      parts.push('<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+
        '" rx="'+(sx(BOX.r)-sx(0))+'" fill="var(--box)" stroke="var(--line)" stroke-width="1.5"/>');
      txt(n.x, 0, n.text, 'middle', 15, 'var(--fg)', 'middle');
      txt(n.x, ROW.note, n.note, 'middle', 12, 'var(--muted)');
    });

    /* легенда отдельной строкой под схемой */
    var midAll = (NODES[0].x + NODES[NODES.length-1].x) / 2;
    txt(midAll, ROW.legend, LEGEND, 'middle', 12.5, 'var(--muted)');

    fig.innerHTML =
      '<svg viewBox="0 0 700 200" width="700" height="200" ' +
      'preserveAspectRatio="xMidYMid meet" role="img" ' +
      'aria-label="Цепочка прямого прохода: x = 1, умножить на 2 даёт a = 2, ' +
      'прибавить 5 даёт u = 7, возвести в куб даёт v = 343">' +
      '<rect x="0" y="0" width="700" height="200" fill="var(--bg)"/>' +
      parts.join('') + '</svg>';
  }catch(err){
    fig.innerHTML = '<div class="fallback">Схема должна была показать цепочку ' +
      'прямого прохода слева направо, по одной операции за шаг:\n' +
      'x = 1 → (умножить на 2) → a = 2 → (прибавить 5) → u = 7 → (возвести в куб) → v = 343.\n' +
      'Каждая стрелка — одна элементарная операция, каждый узел — сохранённое ' +
      'промежуточное число (2, 7, 343) для обратного прохода.</div>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
