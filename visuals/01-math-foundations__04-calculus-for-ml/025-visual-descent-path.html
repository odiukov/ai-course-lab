<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Траектория спуска</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c1f24; --muted:#5a6270;
    --axis:#4a515c; --curve:#2a6fb5; --dot:#d1495b; --arrow:#1f7a4d; --dash:#b6bcc6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e6e8ec; --muted:#a3abb8;
      --axis:#8f98a6; --curve:#7fb3e8; --dot:#ff8a9a; --arrow:#6ecf9a; --dash:#3a414c;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .wrap{background:var(--bg);padding:10px 12px 12px;}
  h2{margin:0 0 6px;font-size:16px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .ax{stroke:var(--axis);fill:none}
  .axfill{fill:var(--axis)}
  .curve{stroke:var(--curve);fill:none}
  .dot{fill:var(--dot)}
  .drop{stroke:var(--dash);fill:none;stroke-dasharray:4 4}
  .arr{stroke:var(--arrow);fill:none}
  .arrfill{fill:var(--arrow)}
  text{fill:var(--fg);font-family:inherit}
  .t-ax{font-size:13px;fill:var(--muted)}
  .t-step{font-size:13px;fill:var(--arrow)}
  .t-note{font-size:13px;fill:var(--muted)}
  .t-fn{font-size:14px;fill:var(--curve)}
  .t-start{font-size:13px;fill:var(--dot)}
  .fallback{font-size:14px;line-height:1.5;color:var(--fg);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <h2>Траектория спуска по f(x) = x², шаг 0.1</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы (те же числа, что в тексте шага) ---- */
    var XS    = [5, 4, 3.2, 2.56, 2.048];
    var SHIFT = [1, 0.8, 0.64, 0.512];

    /* ---- холст ---- */
    var W = 760, H = 466;

    /* ---- одна система координат ---- */
    var origin = {x: 92, y: 372};
    var scale  = {x: 104, y: 12.3};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y - y * scale.y; }

    var NS = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
    function line(x1,y1,x2,y2,cls,w){
      el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),'class':cls,'stroke-width':w}); }
    function label(x,y,dx,dy,txt,anchor,cls){
      var t=el('text',{x:sx(x)+dx,y:sy(y)+dy,'text-anchor':anchor,'class':cls});
      t.textContent=txt; return t; }
    /* наконечник: вершины тоже через sx/sy, размер задан в координатах данных */
    function head(xTip,yTip,dirX,dirY,lenX,lenY,cls){
      var bx=xTip-dirX*lenX, by=yTip-dirY*lenY;
      var p=[[xTip,yTip],[bx-dirY*lenX*0.45,by-dirX*lenY*0.45],[bx+dirY*lenX*0.45,by+dirX*lenY*0.45]];
      el('polygon',{points:p.map(function(q){return sx(q[0])+','+sy(q[1]);}).join(' '),'class':cls});
    }

    var bg = el('rect',{x:0,y:0,width:W,height:H,fill:'none'});
    bg.setAttribute('fill','var(--bg)');

    /* ---- оси ---- */
    line(-0.45, 0, 5.62, 0, 'ax', 1.6);
    head(5.72, 0, 1, 0, 0.13, 0.9, 'axfill');
    line(0, -0.9, 0, 25.5, 'ax', 1.6);
    head(0, 26.1, 0, 1, 0.13, 0.9, 'axfill');
    label(0, 0, -8, 16, '0', 'end', 't-ax');

    /* ---- парабола ---- */
    var pts=[], i, x;
    for(i=0;i<=108;i++){ x = i * (5.45/108); pts.push(sx(x)+','+sy(x*x)); }
    el('polyline',{points:pts.join(' '),'class':'curve','stroke-width':2.2});
    label(3.85, 25.4, 0, 0, 'f(x) = x²', 'end', 't-fn');

    /* ---- точки спуска + пунктир до оси + засечки ---- */
    for(i=0;i<XS.length;i++){
      x = XS[i];
      line(x, x*x, x, 0, 'drop', 1.2);
      line(x, 0, x, -0.55, 'ax', 1.4);
      el('circle',{cx:sx(x),cy:sy(x*x),r:5,'class':'dot'});
      label(x, 0, 0, 20, String(x), 'middle', 't-ax');
    }
    label(XS[0], XS[0]*XS[0], -10, -10, 'старт', 'end', 't-start');

    /* ---- сдвиги: стрелки под осью, справа налево ---- */
    var bandY = -3.1;
    for(i=0;i<SHIFT.length;i++){
      var a = XS[i], b = XS[i+1];
      line(a, bandY, b + 0.11, bandY, 'arr', 1.8);
      head(b, bandY, -1, 0, 0.11, 0.85, 'arrfill');
      line(a, bandY + 0.75, a, bandY - 0.75, 'arr', 1.2);
      label((a + b) / 2, bandY, 0, 20, String(SHIFT[i]), 'middle', 't-step');
    }
    label(XS[0], bandY, 14, 5, 'сдвиг = 0.1 × градиент', 'start', 't-note');
    label(0, -6.6, 0, 0,
      'Шаги укорачиваются сами: у дна градиент мал — и сдвиг мал.', 'start', 't-note');

    host.appendChild(svg);
  }catch(e){
    var p = document.createElement('p');
    p.className = 'fallback';
    p.textContent = 'Схема должна показывать параболу f(x) = x² и точки спуска ' +
      'x = 5, 4, 3.2, 2.56, 2.048 при длине шага 0.1. Сдвиги между соседними ' +
      'точками: 1, 0.8, 0.64, 0.512 — каждый следующий короче предыдущего, ' +
      'точки сбиваются в плотную кучку у дна чаши.';
    host.appendChild(p);
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
