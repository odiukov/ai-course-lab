<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Чаша против седла</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1c2330; --muted:#5b6675;
    --up:#c2410c; --down:#1d4ed8; --grid:#c9d2de; --surf:#e8edf4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f141b; --fg:#e6ecf4; --muted:#9aa7b8;
      --up:#fb923c; --down:#7aa2ff; --grid:#38424f; --surf:#1b2431;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{background:var(--bg);padding:6px 0 2px;}
  h2{margin:0 0 2px;padding:0 10px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;}
  .ttl{font-size:14px;font-weight:600;fill:var(--fg)}
  .lb{font-size:12px;fill:var(--fg)}
  .mu{font-size:11px;fill:var(--muted)}
  .up{font-size:11px;fill:var(--up)}
  .dn{font-size:11px;fill:var(--down)}
  .fail{padding:8px 12px;color:var(--fg)}
</style>
<div class="wrap">
  <h2>Чаша против седла: один нулевой градиент — две разные точки</h2>
  <div id="host"><svg id="s" viewBox="0 0 760 400" preserveAspectRatio="xMidYMid meet" role="img"
      aria-label="Слева чаша x^2+y^2, оба среза вверх. Справа седло x^2-y^2: срез по x вверх, срез по y вниз."></svg></div>
</div>
<script>
(function(){
var svg=document.getElementById("s");
try{
  /* ---- данные схемы ---- */
  var PANELS=[
    {cx:0,   ttl:"Чаша:  x² + y²",  hess:"H = [[2, 0], [0, 2]]",
     verdict:"минимум", vcls:"up",
     cuts:[{ax:"x",k:+1,lab:"срез по x: вверх"},{ax:"y",k:+1,lab:"срез по y: вверх"}]},
    {cx:1,   ttl:"Седло:  x² − y²",  hess:"H = [[2, 0], [0, −2]]",
     verdict:"седло", vcls:"dn",
     cuts:[{ax:"x",k:+1,lab:"срез по x: вверх"},{ax:"y",k:-1,lab:"срез по y: вниз"}]}
  ];
  var XS=[-2,-1.5,-1,-0.5,0,0.5,1,1.5,2];   /* узлы среза */
  var PANEL_W=6, PANEL_H=3.4, CUT_DY=1.9;   /* координаты схемы, не пиксели */

  /* ---- одна пара переводчиков ---- */
  var ORIGIN={x:60,y:196}, SCALE=52;
  function sx(x){ return ORIGIN.x + x*SCALE; }
  function sy(y){ return ORIGIN.y - y*SCALE; }

  var NS="http://www.w3.org/2000/svg";
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function add(n,a,t){var e=el(n,a);if(t!=null)e.textContent=t;svg.appendChild(e);return e;}
  function line(x1,y1,x2,y2,c,w,d){
    var a={x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),stroke:c,"stroke-width":w,"stroke-linecap":"round"};
    if(d)a["stroke-dasharray"]=d; return add("line",a);
  }
  function txt(x,y,dx,dy,cls,anch,s){
    return add("text",{x:sx(x)+dx,y:sy(y)+dy,class:cls,"text-anchor":anch},s);
  }
  function poly(pts,c,w){
    var d=pts.map(function(p,i){return (i?"L":"M")+sx(p[0])+" "+sy(p[1]);}).join(" ");
    return add("path",{d:d,fill:"none",stroke:c,"stroke-width":w,"stroke-linejoin":"round"});
  }
  function dot(x,y,c,r){ return add("circle",{cx:sx(x),cy:sy(y),r:r,fill:c}); }
  /* наконечник — тоже через переводчик */
  function arrow(x1,y1,x2,y2,c,w){
    line(x1,y1,x2,y2,c,w);
    var ux=x2-x1, uy=y2-y1, L=Math.hypot(ux,uy)||1; ux/=L; uy/=L;
    var h=0.26, s=0.13, bx=x2-ux*h, by=y2-uy*h;
    var d="M"+sx(x2)+" "+sy(y2)+
          "L"+sx(bx-uy*s)+" "+sy(by+ux*s)+
          "L"+sx(bx+uy*s)+" "+sy(by-ux*s)+"Z";
    add("path",{d:d,fill:c});
  }

  var UP=getComputedStyle(document.documentElement).getPropertyValue("--up").trim()||"#c2410c";
  var DN=getComputedStyle(document.documentElement).getPropertyValue("--down").trim()||"#1d4ed8";
  var GR=getComputedStyle(document.documentElement).getPropertyValue("--grid").trim()||"#c9d2de";
  var SF=getComputedStyle(document.documentElement).getPropertyValue("--surf").trim()||"#e8edf4";

  PANELS.forEach(function(P){
    var ox=P.cx*PANEL_W;

    /* фон панели */
    add("rect",{x:sx(ox-2.6),y:sy(PANEL_H-0.5),
      width:sx(ox+2.9)-sx(ox-2.6),height:sy(-1.05*CUT_DY-1.15)-sy(PANEL_H-0.5),
      rx:8,fill:SF});

    txt(ox-2.6,PANEL_H-0.85,0,0,"ttl","start",P.ttl);
    txt(ox-2.6,PANEL_H-1.25,0,0,"mu","start",P.hess);

    P.cuts.forEach(function(C,i){
      var oy=-i*CUT_DY;                       /* два среза друг под другом */

      /* горизонтальная ось среза + засечки */
      line(ox-2.1,oy,ox+2.35,oy,GR,1);
      XS.forEach(function(t){ line(ox+t,oy,ox+t,oy-0.09,GR,1); });
      txt(ox+2.35,oy,6,4,"mu","start",C.ax);

      /* парабола: k*t^2, масштаб общий */
      var pts=XS.map(function(t){ return [ox+t, oy + C.k*0.36*t*t]; });
      var col=C.k>0?UP:DN;
      poly(pts,col,2.4);

      /* стрелки от критической точки в обе стороны вдоль кривой */
      arrow(ox,oy, ox+1.15, oy+C.k*0.36*1.15*1.15, col,1.6);
      arrow(ox,oy, ox-1.15, oy+C.k*0.36*1.15*1.15, col,1.6);

      dot(ox,oy,col,4);

      /* подпись среза: слева, у хвоста, разведена по вертикали от кривой */
      txt(ox-2.1, oy + (C.k>0? -0.34 : 0.40), 0, C.k>0?4:0,
          C.k>0?"up":"dn","start",C.lab);
    });

    /* критическая точка: подпись под нижним срезом, по центру */
    var oyLast=-(P.cuts.length-1)*CUT_DY;
    txt(ox, oyLast-0.78, 0, 0, "lb","middle","(0, 0),  grad = [0, 0]");
    txt(ox, oyLast-1.14, 0, 0, "lb","middle","вердикт: "+P.verdict);
  });

  /* разделитель между панелями */
  line(PANEL_W/2-0.35, PANEL_H-0.55, PANEL_W/2-0.35, -1.05*CUT_DY-1.0, GR,1,"4 4");

  /* легенда одной строкой снизу */
  var ly=-1.05*CUT_DY-1.55, lx=-2.6;
  line(lx,ly,lx+0.5,ly,UP,2.4); txt(lx+0.5,ly,6,4,"mu","start","вверх от точки");
  line(lx+3.5,ly,lx+4.0,ly,DN,2.4); txt(lx+4.0,ly,6,4,"mu","start","вниз от точки");
  txt(PANEL_W+2.9,ly,0,4,"mu","end","градиент нулевой в обеих точках — решает форма, не наклон");

}catch(e){
  document.getElementById("host").innerHTML=
    '<p class="fail">Схема должна была показать две поверхности рядом с критической точкой в (0, 0) и нулевым градиентом. '+
    'Слева чаша x² + y², гессиан [[2, 0], [0, 2]]: срез по x вверх и срез по y вверх — минимум. '+
    'Справа седло x² − y², гессиан [[2, 0], [0, −2]]: срез по x вверх, а срез по y вниз — седло.</p>';
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
