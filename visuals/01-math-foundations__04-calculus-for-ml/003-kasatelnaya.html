<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Наклон в точке</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1c22; --muted:#5b6172;
    --curve:#2b5fd9; --tan:#d1601a; --dot:#c02a2a; --axis:#8b90a0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161c; --fg:#e8eaf0; --muted:#a2a8ba;
      --curve:#7aa2ff; --tan:#ffab5e; --dot:#ff7b7b; --axis:#5d6376;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;}
  .wrap{max-width:900px;margin:0 auto;padding:10px 12px 14px;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .fail{font-size:13px;color:var(--muted);line-height:1.5;}
  text{fill:var(--fg);}
  .lbl-muted{fill:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Наклон в точке: одна парабола, четыре касательные</h2>
  <svg id="s" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Парабола y=x² с касательными в точках x=0,1,2,3 и наклонами 0,2,4,6"></svg>
  <div id="fb" class="fail" hidden>
    Схема должна показать параболу y=x² и касательные к ней в точках
    x=0, 1, 2, 3 с наклонами 0, 2, 4 и 6: на дне (x=0) касательная
    горизонтальна, дальше вправо она задрана всё сильнее.
  </div>
</div>
<script>
(function(){
try{
  // ---- данные схемы ----
  var POINTS = [
    {x:0, y:0, m:0},
    {x:1, y:1, m:2},
    {x:2, y:4, m:4},
    {x:3, y:9, m:6}
  ];
  var XMIN=-3.2, XMAX=3.6, YMAX=10.2;   // окно в координатах функции
  var HALF=1.15;                        // полудлина касательной по x

  // ---- холст (литералы) ----
  var W=640, H=400, PAD_L=64, PAD_R=96, PAD_T=18, PAD_B=34;
  var FS=13, LW=1.6, GAP=8;

  // ---- ЕДИНСТВЕННОЕ отображение ----
  var scale = Math.min((W-PAD_L-PAD_R)/(XMAX-XMIN), (H-PAD_T-PAD_B)/YMAX);
  var origin = { x: PAD_L - XMIN*scale, y: H - PAD_B };
  function sx(x){ return origin.x + x*scale; }
  function sy(y){ return origin.y - y*scale; }

  var svg=document.getElementById("s"), NS="http://www.w3.org/2000/svg";
  function el(n,a){ var e=document.createElementNS(NS,n);
    for(var k in a) e.setAttribute(k,a[k]); svg.appendChild(e); return e; }
  function txt(s,x,y,anchor,cls){
    var t=el("text",{x:x,y:y,"text-anchor":anchor,"font-size":FS,
      "class":cls||"", "dominant-baseline":"middle"});
    t.textContent=s; return t;
  }

  // ---- оси ----
  el("line",{x1:sx(XMIN),y1:sy(0),x2:sx(XMAX),y2:sy(0),
    stroke:"var(--axis)","stroke-width":LW});
  el("line",{x1:sx(0),y1:sy(0),x2:sx(0),y2:sy(YMAX),
    stroke:"var(--axis)","stroke-width":LW});
  txt("x", sx(XMAX), sy(0)+GAP+GAP, "middle","lbl-muted");
  txt("y", sx(0)-GAP, sy(YMAX), "end","lbl-muted");

  // засечки по x
  [-3,-2,-1,1,2,3].forEach(function(x){
    el("line",{x1:sx(x),y1:sy(0),x2:sx(x),y2:sy(0)+GAP*0.6,
      stroke:"var(--axis)","stroke-width":LW});
    txt(String(x), sx(x), sy(0)+GAP*2.2, "middle","lbl-muted");
  });

  // ---- парабола ----
  var d="", n=120;
  for(var i=0;i<=n;i++){
    var x=XMIN+(XMAX-XMIN)*i/n, y=x*x;
    if(y>YMAX) { d=""; continue; }
    d += (d?" L":"M")+sx(x)+" "+sy(y);
  }
  el("path",{d:d,fill:"none",stroke:"var(--curve)","stroke-width":LW+1.2,
    "stroke-linecap":"round"});
  txt("y = x²", sx(-2.55), sy(2.55)-GAP*1.6, "middle","");

  // ---- касательные ----
  POINTS.forEach(function(p){
    var xL=p.x-HALF, xR=p.x+HALF;
    var yL=p.y+p.m*(xL-p.x), yR=p.y+p.m*(xR-p.x);
    el("line",{x1:sx(xL),y1:sy(yL),x2:sx(xR),y2:sy(yR),
      stroke:"var(--tan)","stroke-width":LW+0.4,"stroke-linecap":"round"});
    el("circle",{cx:sx(p.x),cy:sy(p.y),r:GAP*0.55,
      fill:"var(--dot)",stroke:"var(--bg)","stroke-width":LW});
  });

  // подписи наклонов — у правого хвоста касательной, разведены по вертикали
  POINTS.forEach(function(p){
    var xR=p.x+HALF, yR=p.y+p.m*HALF;
    txt("наклон "+p.m, sx(xR)+GAP, sy(yR), "start","");
  });

  // подпись точки x=0 — под осью, чтобы не столкнуться с "наклон 0"
  txt("дно, x = 0", sx(0), sy(0)+GAP*3.9, "middle","lbl-muted");
}catch(e){
  document.getElementById("s").setAttribute("hidden","");
  document.getElementById("fb").removeAttribute("hidden");
}
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
