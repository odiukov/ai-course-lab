<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Маршрут от HTTP-запроса до JSON</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5e687d;
      --line: #8490a7;
      --line-soft: #cbd2df;
      --standard: #eef1f7;
      --standard-stroke: #8995aa;
      --model-a: #fff1c7;
      --model-a-stroke: #c87508;
      --model-b: #dceaff;
      --model-b-stroke: #2866c7;
      --schema: #dcf7e5;
      --schema-stroke: #168652;
      --response: #e8e1ff;
      --response-stroke: #6748bd;
      --error: #c83f55;
      --error-soft: #fff0f2;
      --tag: #27334a;
      --tag-text: #ffffff;
      --shadow: #d9deea;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    figure {
      background: var(--panel);
    }

    h2 {
      font-size: 22px;
      color: var(--text);
    }

    #fallback {
      font-size: 16px;
      color: var(--muted);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
      border: 1px solid var(--line-soft);
    }

    .box {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .box-standard {
      fill: var(--standard);
      stroke: var(--standard-stroke);
    }

    .box-model-a {
      fill: var(--model-a);
      stroke: var(--model-a-stroke);
    }

    .box-model-b {
      fill: var(--model-b);
      stroke: var(--model-b-stroke);
    }

    .box-schema {
      fill: var(--schema);
      stroke: var(--schema-stroke);
    }

    .box-response {
      fill: var(--response);
      stroke: var(--response-stroke);
    }

    .accent-standard {
      fill: var(--standard-stroke);
    }

    .accent-model-a {
      fill: var(--model-a-stroke);
    }

    .accent-model-b {
      fill: var(--model-b-stroke);
    }

    .accent-schema {
      fill: var(--schema-stroke);
    }

    .accent-response {
      fill: var(--response-stroke);
    }

    .connector {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrowhead {
      fill: var(--line);
    }

    .error-route {
      fill: none;
      stroke: var(--error);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .error-arrowhead {
      fill: var(--error);
    }

    .node-title {
      fill: var(--text);
      font-size: 18px;
      font-weight: bold;
    }

    .node-subtitle {
      fill: var(--muted);
      font-size: 13px;
    }

    .tag-bg {
      fill: var(--tag);
    }

    .tag-text {
      fill: var(--tag-text);
      font-size: 10px;
      font-weight: bold;
    }

    .flow-label {
      fill: var(--muted);
      font-size: 12px;
      font-weight: bold;
    }

    .flow-dot {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .error-label {
      fill: var(--error);
      font-size: 13px;
      font-weight: bold;
    }

    .error-note {
      fill: var(--error);
      font-size: 12px;
    }

    .legend-title {
      fill: var(--text);
      font-size: 13px;
      font-weight: bold;
    }

    .legend-text {
      fill: var(--muted);
      font-size: 12px;
    }

    .kicker {
      fill: var(--muted);
      font-size: 11px;
      font-weight: bold;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --text: #f0f3f9;
        --muted: #b3bdd0;
        --line: #8d9ab1;
        --line-soft: #354055;
        --standard: #252d3b;
        --standard-stroke: #8998b2;
        --model-a: #473719;
        --model-a-stroke: #efad3e;
        --model-b: #1d3457;
        --model-b-stroke: #70a9ff;
        --schema: #173c2d;
        --schema-stroke: #53ca8e;
        --response: #302653;
        --response-stroke: #a88eff;
        --error: #ff8294;
        --error-soft: #45232c;
        --tag: #e5eaf3;
        --tag-text: #182032;
        --shadow: #0e1118;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Маршрут от HTTP-запроса до JSON</h2>
    <p id="fallback">
      Схема должна показать путь байтов изображения через подготовку,
      детектор, обрезку, классификатор, сборку и проверку Pydantic к
      JSON-ответу, а также отдельный короткий маршрут ошибки.
    </p>
    <svg
      id="pipeline"
      viewBox="0 0 1580 410"
      width="1580"
      height="410"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-desc"
      hidden
    >
      <desc id="diagram-desc">
        Последовательная схема преобразования HTTP-запроса с изображением в
        проверенный JSON-ответ. Пунктиром отмечен путь ошибки, при котором
        модели не запускаются.
      </desc>
    </svg>
  </figure>

  <script>
    const diagramData = [
      {
        type: "layout",
        zero: 0,
        half: 0.5,
        boxY: 88,
        boxW: 160,
        boxH: 145,
        radius: 12,
        accentW: 7,
        arrowY: 160,
        arrowHead: 11,
        arrowWing: 6,
        flowLabelY: 61,
        flowDotR: 4,
        titleGap: 20,
        tagY: 198,
        tagH: 22,
        tagRadius: 7,
        errorY: 286,
        errorLabelY: 268,
        errorNoteY: 316,
        dash: 9,
        dashGap: 7,
        legendY: 361,
        legendSwatchW: 26,
        legendSwatchH: 12,
        legendRadius: 4,
        legendTextGap: 38,
        kickerX: 28,
        kickerY: 25,
        legendTitleX: 28,
        legendTitleY: 340
      },
      {
        type: "node",
        id: "request",
        x: 28,
        title: ["HTTP-запрос"],
        titleY: 122,
        subtitle: ["байты изображения"],
        subtitleY: 166,
        tag: "ВХОД",
        tagW: 68,
        kind: "standard"
      },
      {
        type: "node",
        id: "decode",
        x: 223,
        title: ["Декодирование", "и подготовка"],
        titleY: 114,
        subtitle: ["байты → пиксели"],
        subtitleY: 166,
        tag: "ОБЫЧНЫЙ КОД",
        tagW: 112,
        kind: "standard"
      },
      {
        type: "node",
        id: "detector",
        x: 418,
        title: ["Детектор"],
        titleY: 122,
        subtitle: ["находит области"],
        subtitleY: 166,
        tag: "НЕЙРОСЕТЬ",
        tagW: 98,
        kind: "model-a"
      },
      {
        type: "node",
        id: "crop",
        x: 613,
        title: ["Обрезка", "и размер"],
        titleY: 114,
        subtitle: ["отдельные фрагменты"],
        subtitleY: 166,
        tag: "ОБЫЧНЫЙ КОД",
        tagW: 112,
        kind: "standard"
      },
      {
        type: "node",
        id: "classifier",
        x: 808,
        title: ["Классификатор"],
        titleY: 122,
        subtitle: ["назначает классы"],
        subtitleY: 166,
        tag: "НЕЙРОСЕТЬ",
        tagW: 98,
        kind: "model-b"
      },
      {
        type: "node",
        id: "aggregate",
        x: 1003,
        title: ["Сборка"],
        titleY: 122,
        subtitle: ["области + классы"],
        subtitleY: 166,
        tag: "ОБЫЧНЫЙ КОД",
        tagW: 112,
        kind: "standard"
      },
      {
        type: "node",
        id: "schema",
        x: 1198,
        title: ["Pydantic"],
        titleY: 122,
        subtitle: ["проверяет форму"],
        subtitleY: 166,
        tag: "ВАЛИДАЦИЯ",
        tagW: 102,
        kind: "schema"
      },
      {
        type: "node",
        id: "response",
        x: 1393,
        title: ["JSON-ответ"],
        titleY: 122,
        subtitle: ["данные для клиента"],
        subtitleY: 166,
        tag: "ВЫХОД",
        tagW: 72,
        kind: "response"
      },
      {
        type: "edge",
        from: "request",
        to: "decode",
        label: "байты"
      },
      {
        type: "edge",
        from: "decode",
        to: "detector",
        label: "пиксели"
      },
      {
        type: "edge",
        from: "detector",
        to: "crop",
        label: "области"
      },
      {
        type: "edge",
        from: "crop",
        to: "classifier",
        label: "фрагменты"
      },
      {
        type: "edge",
        from: "classifier",
        to: "aggregate",
        label: "классы"
      },
      {
        type: "edge",
        from: "aggregate",
        to: "schema",
        label: "единый результат"
      },
      {
        type: "edge",
        from: "schema",
        to: "response",
        label: "проверенные данные"
      },
      {
        type: "legend",
        x: 250,
        kind: "standard",
        label: "преобразование данных"
      },
      {
        type: "legend",
        x: 610,
        kind: "model-a",
        label: "запуск нейросети"
      },
      {
        type: "legend",
        x: 930,
        kind: "schema",
        label: "проверка структуры"
      },
      {
        type: "legend",
        x: 1250,
        kind: "error",
        label: "маршрут ошибки"
      }
    ];

    const origin = { x: 0, y: 0 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelPadding = 8;
    const lineThickness = 2;
    const titleFontSize = 18;
    const labelFontSize = 12;

    try {
      const svg = document.getElementById("pipeline");
      const fallback = document.getElementById("fallback");
      const layout = diagramData.find(item => item.type === "layout");
      const nodes = diagramData.filter(item => item.type === "node");
      const edges = diagramData.filter(item => item.type === "edge");
      const legends = diagramData.filter(item => item.type === "legend");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attrs, className) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attrs).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (className) element.setAttribute("class", className);
        return element;
      };

      const addText = (parent, x, y, text, className, anchor) => {
        const element = make(
          "text",
          {
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          },
          className
        );
        element.textContent = text;
        parent.appendChild(element);
        return element;
      };

      const nodeById = id => nodes.find(node => node.id === id);

      const drawRightArrow = (parent, xStart, xEnd, y, variant) => {
        const headBase = xEnd - layout.arrowHead;
        parent.appendChild(
          make(
            "path",
            {
              d: `M ${sx(xStart)} ${sy(y)} L ${sx(headBase)} ${sy(y)}`
            },
            variant === "error" ? "error-route" : "connector"
          )
        );
        parent.appendChild(
          make(
            "polygon",
            {
              points: [
                `${sx(xEnd)},${sy(y)}`,
                `${sx(headBase)},${sy(y - layout.arrowWing)}`,
                `${sx(headBase)},${sy(y + layout.arrowWing)}`
              ].join(" ")
            },
            variant === "error" ? "error-arrowhead" : "arrowhead"
          )
        );
      };

      const flowLayer = make("g", { "aria-hidden": "true" });
      const nodeLayer = make("g", { "aria-hidden": "true" });
      const noteLayer = make("g", { "aria-hidden": "true" });
      svg.append(flowLayer, nodeLayer, noteLayer);

      addText(
        noteLayer,
        layout.kickerX,
        layout.kickerY,
        "КАК МЕНЯЕТСЯ ПРЕДСТАВЛЕНИЕ ИЗОБРАЖЕНИЯ",
        "kicker",
        "start"
      );

      edges.forEach(edge => {
        const from = nodeById(edge.from);
        const to = nodeById(edge.to);
        const startX = from.x + layout.boxW;
        const endX = to.x;
        const middleX = (startX + endX) * layout.half;

        drawRightArrow(
          flowLayer,
          startX,
          endX,
          layout.arrowY,
          "normal"
        );

        flowLayer.appendChild(
          make(
            "circle",
            {
              cx: sx(middleX),
              cy: sy(layout.arrowY),
              r: sx(layout.flowDotR) - sx(layout.zero)
            },
            "flow-dot"
          )
        );

        addText(
          noteLayer,
          middleX,
          layout.flowLabelY,
          edge.label,
          "flow-label",
          "middle"
        );
      });

      nodes.forEach(node => {
        const group = make("g", {});
        const centerX = node.x + layout.boxW * layout.half;
        const tagX = centerX - node.tagW * layout.half;

        group.appendChild(
          make(
            "rect",
            {
              x: sx(node.x),
              y: sy(layout.boxY),
              width: sx(layout.boxW) - sx(layout.zero),
              height: sy(layout.boxH) - sy(layout.zero),
              rx: sx(layout.radius) - sx(layout.zero),
              ry: sy(layout.radius) - sy(layout.zero)
            },
            `box box-${node.kind}`
          )
        );

        group.appendChild(
          make(
            "rect",
            {
              x: sx(node.x),
              y: sy(layout.boxY),
              width: sx(layout.accentW) - sx(layout.zero),
              height: sy(layout.boxH) - sy(layout.zero),
              rx: sx(layout.radius) - sx(layout.zero),
              ry: sy(layout.radius) - sy(layout.zero)
            },
            `accent-${node.kind}`
          )
        );

        node.title.forEach((line, index) => {
          addText(
            group,
            centerX,
            node.titleY + index * layout.titleGap,
            line,
            "node-title",
            "middle"
          );
        });

        node.subtitle.forEach((line, index) => {
          addText(
            group,
            centerX,
            node.subtitleY + index * layout.titleGap,
            line,
            "node-subtitle",
            "middle"
          );
        });

        group.appendChild(
          make(
            "rect",
            {
              x: sx(tagX),
              y: sy(layout.tagY),
              width: sx(node.tagW) - sx(layout.zero),
              height: sy(layout.tagH) - sy(layout.zero),
              rx: sx(layout.tagRadius) - sx(layout.zero),
              ry: sy(layout.tagRadius) - sy(layout.zero)
            },
            "tag-bg"
          )
        );

        addText(
          group,
          centerX,
          layout.tagY + layout.tagH * layout.half,
          node.tag,
          "tag-text",
          "middle"
        );

        nodeLayer.appendChild(group);
      });

      const request = nodeById("request");
      const response = nodeById("response");
      const requestCenter = request.x + layout.boxW * layout.half;
      const responseCenter = response.x + layout.boxW * layout.half;
      const boxBottom = layout.boxY + layout.boxH;
      const arrowBaseY = boxBottom + layout.arrowHead;

      noteLayer.appendChild(
        make(
          "path",
          {
            d: [
              `M ${sx(requestCenter)} ${sy(boxBottom)}`,
              `L ${sx(requestCenter)} ${sy(layout.errorY)}`,
              `L ${sx(responseCenter)} ${sy(layout.errorY)}`,
              `L ${sx(responseCenter)} ${sy(arrowBaseY)}`
            ].join(" "),
            "stroke-dasharray":
              `${sx(layout.dash) - sx(layout.zero)} ` +
              `${sx(layout.dashGap) - sx(layout.zero)}`
          },
          "error-route"
        )
      );

      noteLayer.appendChild(
        make(
          "polygon",
          {
            points: [
              `${sx(responseCenter)},${sy(boxBottom)}`,
              `${sx(responseCenter - layout.arrowWing)},${sy(arrowBaseY)}`,
              `${sx(responseCenter + layout.arrowWing)},${sy(arrowBaseY)}`
            ].join(" ")
          },
          "error-arrowhead"
        )
      );

      addText(
        noteLayer,
        requestCenter + labelPadding,
        layout.errorLabelY,
        "запрос нельзя обработать",
        "error-label",
        "start"
      );

      addText(
        noteLayer,
        responseCenter - labelPadding,
        layout.errorNoteY,
        "модели не запускаются · клиент получает JSON с ошибкой",
        "error-note",
        "end"
      );

      addText(
        noteLayer,
        layout.legendTitleX,
        layout.legendTitleY,
        "ОБОЗНАЧЕНИЯ",
        "legend-title",
        "start"
      );

      legends.forEach(item => {
        const swatchClass =
          item.kind === "error"
            ? "error-route"
            : `box box-${item.kind}`;

        noteLayer.appendChild(
          make(
            "rect",
            {
              x: sx(item.x),
              y: sy(layout.legendY),
              width: sx(layout.legendSwatchW) - sx(layout.zero),
              height: sy(layout.legendSwatchH) - sy(layout.zero),
              rx: sx(layout.legendRadius) - sx(layout.zero),
              ry: sy(layout.legendRadius) - sy(layout.zero),
              "stroke-width": lineThickness
            },
            swatchClass
          )
        );

        addText(
          noteLayer,
          item.x + layout.legendTextGap,
          layout.legendY + layout.legendSwatchH * layout.half,
          item.label,
          "legend-text",
          "start"
        );
      });

      svg.style.setProperty("--title-font-size", `${titleFontSize}px`);
      svg.style.setProperty("--label-font-size", `${labelFontSize}px`);
      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("pipeline");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать цепочку: HTTP-запрос с байтами → " +
        "декодирование и подготовка → детектор → обрезка и изменение размера → " +
        "классификатор → сборка результатов → проверка Pydantic → JSON-ответ. " +
        "Отдельный пунктирный путь ведёт от ошибочного запроса прямо к " +
        "корректно оформленному JSON-ответу без запуска моделей.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
