<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта четырёх плоскостей и обратной связи</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #566176;
    --line: #77839a;
    --control: #2563a8;
    --control-soft: #e6f1ff;
    --target: #7352a6;
    --target-soft: #f0eaff;
    --safety: #b43b45;
    --safety-soft: #ffe9eb;
    --observe: #287862;
    --observe-soft: #e3f6ef;
    --feedback: #a56216;
    --feedback-soft: #fff2d9;
    --chip: #f3f6fa;
    --chip-line: #a7b0bf;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #182130;
      --ink: #edf2fb;
      --muted: #b9c4d5;
      --line: #9ba9bf;
      --control: #79b8ff;
      --control-soft: #183554;
      --target: #c3a5ff;
      --target-soft: #35294d;
      --safety: #ff8992;
      --safety-soft: #49252b;
      --observe: #6ed7b6;
      --observe-soft: #193e35;
      --feedback: #f2bd69;
      --feedback-soft: #48361c;
      --chip: #222d3d;
      --chip-line: #657188;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  figure {
    background: var(--page);
  }

  h1 {
    font: bold 20px system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--panel);
    border: solid 1px var(--chip-line);
  }

  .plane,
  .chip,
  .result,
  .accent,
  .route,
  .gate,
  .arrowhead {
    vector-effect: non-scaling-stroke;
  }

  .plane,
  .result {
    stroke-width: 2px;
  }

  .route,
  .gate {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .route {
    stroke-width: 3px;
  }

  .gate {
    stroke-width: 5px;
  }

  .arrowhead {
    stroke-width: 2px;
    stroke-linejoin: round;
  }

  .chip {
    fill: var(--chip);
    stroke: var(--chip-line);
    stroke-width: 1px;
  }

  .control {
    fill: var(--control-soft);
    stroke: var(--control);
  }

  .target {
    fill: var(--target-soft);
    stroke: var(--target);
  }

  .safety {
    fill: var(--safety-soft);
    stroke: var(--safety);
  }

  .observe {
    fill: var(--observe-soft);
    stroke: var(--observe);
  }

  .result {
    fill: var(--feedback-soft);
    stroke: var(--feedback);
  }

  .control-route {
    stroke: var(--control);
  }

  .observe-route {
    stroke: var(--observe);
  }

  .safety-route {
    stroke: var(--safety);
  }

  .feedback-route {
    stroke: var(--feedback);
  }

  .control-head {
    fill: var(--control);
    stroke: var(--control);
  }

  .observe-head {
    fill: var(--observe);
    stroke: var(--observe);
  }

  .feedback-head {
    fill: var(--feedback);
    stroke: var(--feedback);
  }

  .control-accent {
    fill: var(--control);
  }

  .target-accent {
    fill: var(--target);
  }

  .safety-accent {
    fill: var(--safety);
  }

  .observe-accent {
    fill: var(--observe);
  }

  text {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    fill: var(--ink);
  }

  .eyebrow {
    font-size: 13px;
    font-weight: bold;
  }

  .title {
    font-size: 18px;
    font-weight: bold;
  }

  .detail {
    font-size: 14px;
    fill: var(--muted);
  }

  .chip-label {
    font-size: 14px;
    font-weight: bold;
  }

  .route-label {
    font-size: 14px;
    font-weight: bold;
  }

  .control-text {
    fill: var(--control);
  }

  .target-text {
    fill: var(--target);
  }

  .safety-text {
    fill: var(--safety);
  }

  .observe-text {
    fill: var(--observe);
  }

  .feedback-text {
    fill: var(--feedback);
  }

  #fallback {
    background: var(--panel);
    color: var(--ink);
    border: solid 1px var(--chip-line);
    font: 16px system-ui, -apple-system, "Segoe UI", sans-serif;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Карта четырёх плоскостей и обратной связи</h1>
  <svg id="diagram" viewBox="0 0 1200 470" width="1200" height="470"
       role="img" aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      Плоскость управления запускает воздействие на целевую плоскость.
      Плоскость безопасности может остановить воздействие. Плоскость
      наблюдаемости собирает метрики, трейсы и логи, а измеренный результат
      возвращается в SLO, runbook-и и код.
    </desc>
  </svg>
  <p id="fallback" hidden>
    Плоскость управления запускает воздействие на целевые сервисы,
    плоскость безопасности может остановить его, наблюдаемость собирает
    метрики, трейсы и логи, а результат возвращается в SLO, runbook-и и код.
  </p>
  <noscript>
    Плоскость управления запускает воздействие на целевые сервисы,
    безопасность может остановить его, наблюдаемость измеряет результат,
    а обратная связь меняет SLO, runbook-и и код.
  </noscript>
</figure>

<script>
const diagramData = [{
  canvas: { width: 1200, height: 470 },
  zero: 0,
  radius: 12,
  accentWidth: 8,
  labelPad: 10,
  lineWidth: 3,
  gateWidth: 5,
  fontSmall: 13,
  fontBody: 14,
  fontTitle: 18,

  cards: [
    {
      x: 70, y: 80, w: 330, h: 120,
      kind: "control", accent: "control-accent",
      aria: "Плоскость управления"
    },
    {
      x: 800, y: 80, w: 330, h: 120,
      kind: "target", accent: "target-accent",
      aria: "Целевая плоскость"
    },
    {
      x: 460, y: 25, w: 280, h: 105,
      kind: "safety", accent: "safety-accent",
      aria: "Плоскость безопасности"
    },
    {
      x: 400, y: 240, w: 400, h: 110,
      kind: "observe", accent: "observe-accent",
      aria: "Плоскость наблюдаемости"
    }
  ],

  result: {
    x: 350, y: 385, w: 550, h: 70,
    aria: "Результат меняет решения команды"
  },

  routes: [
    {
      kind: "control-route",
      points: [["M", 400, 160], ["L", 580, 160]],
      head: []
    },
    {
      kind: "control-route",
      points: [["M", 620, 160], ["L", 800, 160]],
      head: [[800, 160], [782, 150], [782, 170]]
    },
    {
      kind: "observe-route",
      points: [["M", 930, 200], ["L", 930, 218], ["L", 780, 240]],
      head: [[780, 240], [797, 229], [799, 250]]
    },
    {
      kind: "observe-route",
      points: [["M", 600, 350], ["L", 600, 385]],
      head: [[600, 385], [590, 368], [610, 368]]
    },
    {
      kind: "feedback-route",
      points: [
        ["M", 350, 425],
        ["L", 45, 425],
        ["L", 45, 140],
        ["L", 70, 140]
      ],
      head: [[70, 140], [53, 130], [53, 150]]
    }
  ],

  gates: [
    { x1: 600, y1: 130, x2: 600, y2: 188 },
    { x1: 580, y1: 144, x2: 620, y2: 176 }
  ],

  chips: [
    { x: 430, y: 310, w: 100, h: 27, label: "метрики", tx: 480, ty: 329 },
    { x: 550, y: 310, w: 100, h: 27, label: "трейсы", tx: 600, ty: 329 },
    { x: 670, y: 310, w: 100, h: 27, label: "логи", tx: 720, ty: 329 },
    { x: 560, y: 405, w: 80, h: 32, label: "SLO", tx: 600, ty: 426 },
    { x: 655, y: 405, w: 130, h: 32, label: "runbook-и", tx: 720, ty: 426 },
    { x: 800, y: 405, w: 70, h: 32, label: "код", tx: 835, ty: 426 }
  ],

  labels: [
    {
      text: "ПЛОСКОСТЬ УПРАВЛЕНИЯ",
      x: 92, y: 108, dx: 0, dy: 0,
      anchor: "start", className: "eyebrow control-text"
    },
    {
      text: "Планировщик эксперимента",
      x: 92, y: 143, dx: 0, dy: 0,
      anchor: "start", className: "title"
    },
    {
      text: "команда запуска • расписание",
      x: 92, y: 174, dx: 0, dy: 0,
      anchor: "start", className: "detail"
    },
    {
      text: "ЦЕЛЕВАЯ ПЛОСКОСТЬ",
      x: 822, y: 108, dx: 0, dy: 0,
      anchor: "start", className: "eyebrow target-text"
    },
    {
      text: "Сервисы • поды • ноды",
      x: 822, y: 143, dx: 0, dy: 0,
      anchor: "start", className: "title"
    },
    {
      text: "LLM-провайдер • хранилища",
      x: 822, y: 174, dx: 0, dy: 0,
      anchor: "start", className: "detail"
    },
    {
      text: "ПЛОСКОСТЬ БЕЗОПАСНОСТИ",
      x: 482, y: 52, dx: 0, dy: 0,
      anchor: "start", className: "eyebrow safety-text"
    },
    {
      text: "Аварийный выключатель",
      x: 482, y: 82, dx: 0, dy: 0,
      anchor: "start", className: "title"
    },
    {
      text: "радиус • окно • бюджет ошибок",
      x: 482, y: 109, dx: 0, dy: 0,
      anchor: "start", className: "detail"
    },
    {
      text: "ПЛОСКОСТЬ НАБЛЮДАЕМОСТИ",
      x: 422, y: 265, dx: 0, dy: 0,
      anchor: "start", className: "eyebrow observe-text"
    },
    {
      text: "Наблюдает, но не управляет",
      x: 422, y: 292, dx: 0, dy: 0,
      anchor: "start", className: "title"
    },
    {
      text: "запускает воздействие",
      x: 410, y: 160, dx: 0, dy: 22,
      anchor: "start", className: "route-label control-text"
    },
    {
      text: "может остановить",
      x: 625, y: 139, dx: 10, dy: 0,
      anchor: "start", className: "route-label safety-text"
    },
    {
      text: "метрики связываются с trace-ID",
      x: 1125, y: 213, dx: 0, dy: 18,
      anchor: "end", className: "route-label observe-text"
    },
    {
      text: "измеренный результат",
      x: 620, y: 365, dx: 10, dy: 0,
      anchor: "start", className: "route-label observe-text"
    },
    {
      text: "ОБРАТНАЯ СВЯЗЬ",
      x: 60, y: 277, dx: 10, dy: 0,
      anchor: "start", className: "eyebrow feedback-text"
    },
    {
      text: "меняет следующий запуск",
      x: 60, y: 301, dx: 10, dy: 0,
      anchor: "start", className: "route-label feedback-text"
    },
    {
      text: "Результат меняет решения команды:",
      x: 370, y: 421, dx: 0, dy: 0,
      anchor: "start", className: "route-label feedback-text"
    }
  ]
}];

const origin = Object.freeze({ x: 0, y: 0 });
const scale = Object.freeze({ x: 1, y: 1 });

function sx(x) {
  return origin.x + x * scale.x;
}

function sy(y) {
  return origin.y + y * scale.y;
}

try {
  const [data] = diagramData;
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  function make(name, attributes, value) {
    const node = document.createElementNS(namespace, name);
    Object.entries(attributes).forEach(([key, attribute]) => {
      node.setAttribute(key, attribute);
    });
    if (value !== undefined) {
      node.textContent = value;
    }
    return node;
  }

  function rectangle(spec, className) {
    return make("rect", {
      x: sx(spec.x),
      y: sy(spec.y),
      width: sx(spec.w) - sx(data.zero),
      height: sy(spec.h) - sy(data.zero),
      rx: sx(data.radius) - sx(data.zero),
      ry: sy(data.radius) - sy(data.zero),
      class: className,
      "aria-label": spec.aria || ""
    });
  }

  function routePath(points) {
    return points.map(([command, x, y]) => {
      return command + " " + sx(x) + " " + sy(y);
    }).join(" ");
  }

  function polygonPoints(points) {
    return points.map(([x, y]) => {
      return sx(x) + "," + sy(y);
    }).join(" ");
  }

  const stage = make("g", { "aria-hidden": "true" });

  data.routes.forEach((route) => {
    stage.appendChild(make("path", {
      d: routePath(route.points),
      class: "route " + route.kind
    }));

    if (route.head.length) {
      const headClass = route.kind.replace("-route", "-head");
      stage.appendChild(make("polygon", {
        points: polygonPoints(route.head),
        class: "arrowhead " + headClass
      }));
    }
  });

  data.cards.forEach((card) => {
    stage.appendChild(rectangle(card, "plane " + card.kind));
    stage.appendChild(make("rect", {
      x: sx(card.x),
      y: sy(card.y),
      width: sx(data.accentWidth) - sx(data.zero),
      height: sy(card.h) - sy(data.zero),
      rx: sx(data.radius) - sx(data.zero),
      ry: sy(data.radius) - sy(data.zero),
      class: "accent " + card.accent
    }));
  });

  stage.appendChild(rectangle(data.result, "result"));

  data.gates.forEach((gate) => {
    stage.appendChild(make("line", {
      x1: sx(gate.x1),
      y1: sy(gate.y1),
      x2: sx(gate.x2),
      y2: sy(gate.y2),
      class: "gate safety-route"
    }));
  });

  data.chips.forEach((chip) => {
    stage.appendChild(rectangle(chip, "chip"));
    stage.appendChild(make("text", {
      x: sx(chip.tx),
      y: sy(chip.ty),
      "text-anchor": "middle",
      class: "chip-label"
    }, chip.label));
  });

  data.labels.forEach((label) => {
    stage.appendChild(make("text", {
      x: sx(label.x),
      y: sy(label.y),
      dx: label.dx,
      dy: label.dy,
      "text-anchor": label.anchor,
      class: label.className
    }, label.text));
  });

  svg.appendChild(stage);
  fallback.hidden = true;
} catch (error) {
  const svg = document.getElementById("diagram");
  const fallback = document.getElementById("fallback");
  if (svg) {
    svg.hidden = true;
  }
  if (fallback) {
    fallback.hidden = false;
  }
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
