<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как менялся способ хранить и рендерить выученную сцену</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f3ea;
      --panel: #fffdf7;
      --ink: #20252b;
      --muted: #667078;
      --line: #b9c0c3;
      --field: #dce7f7;
      --field-strong: #4776a8;
      --hash: #d8eadf;
      --hash-strong: #28705a;
      --gauss: #f7d9cc;
      --gauss-strong: #b95139;
      --chip: #ece7dc;
      --screen: #26333d;
      --screen-line: #8fd3dc;
      --trend: #7057a3;
      --shadow: #ddd5c7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    .frame {
      width: 1200px;
      max-width: 100%;
      margin-inline: auto;
      background: var(--bg);
    }

    .heading {
      margin: 0;
      padding: 14px 22px 3px;
      font-size: 23px;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .dek {
      margin: 0;
      padding: 0 22px 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--bg);
      font-family: inherit;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1.5px;
    }

    .panel-shadow {
      fill: var(--shadow);
    }

    .divider {
      stroke: var(--line);
      stroke-width: 1px;
    }

    .title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 750;
    }

    .kicker {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .label {
      fill: var(--ink);
      font-size: 13px;
      font-weight: 650;
    }

    .small {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 520;
    }

    .tiny {
      fill: var(--muted);
      font-size: 10px;
      font-weight: 650;
    }

    .metric-text {
      fill: var(--ink);
      font-size: 11px;
      font-weight: 760;
      letter-spacing: 0.035em;
    }

    .metric {
      fill: var(--chip);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .field-fill {
      fill: var(--field);
      stroke: var(--field-strong);
      stroke-width: 1.3px;
    }

    .field-line {
      fill: none;
      stroke: var(--field-strong);
      stroke-width: 1.4px;
    }

    .field-node {
      fill: var(--panel);
      stroke: var(--field-strong);
      stroke-width: 1.2px;
    }

    .hash-a {
      fill: var(--hash);
      stroke: var(--hash-strong);
      stroke-width: 1px;
    }

    .hash-b {
      fill: var(--hash-strong);
      stroke: var(--hash-strong);
      stroke-width: 1px;
    }

    .hash-line {
      fill: none;
      stroke: var(--hash-strong);
      stroke-width: 1.5px;
    }

    .gauss-a {
      fill: var(--gauss);
      stroke: var(--gauss-strong);
      stroke-width: 1.1px;
    }

    .gauss-b {
      fill: var(--gauss-strong);
      stroke: var(--gauss-strong);
      stroke-width: 1px;
    }

    .gauss-line {
      fill: none;
      stroke: var(--gauss-strong);
      stroke-width: 1.6px;
    }

    .ray {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.2px;
    }

    .sample {
      fill: var(--field-strong);
    }

    .screen {
      fill: var(--screen);
      stroke: var(--ink);
      stroke-width: 1.2px;
    }

    .screen-line {
      stroke: var(--screen-line);
      stroke-width: 1.2px;
    }

    .trend-line {
      fill: none;
      stroke: var(--trend);
      stroke-width: 2px;
    }

    .trend-head {
      fill: var(--trend);
    }

    .trend-label {
      fill: var(--trend);
      font-size: 12px;
      font-weight: 760;
    }

    .trend-note {
      fill: var(--ink);
      font-size: 11px;
      font-weight: 650;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #171a1e;
        --panel: #22272d;
        --ink: #f1eee7;
        --muted: #aab3ba;
        --line: #4c555d;
        --field: #243c58;
        --field-strong: #81b8ed;
        --hash: #24473d;
        --hash-strong: #72c9a8;
        --gauss: #5a3029;
        --gauss-strong: #f18b72;
        --chip: #30363c;
        --screen: #101820;
        --screen-line: #8fe5ed;
        --trend: #c0a1f2;
        --shadow: #111417;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1 class="heading">Как менялся способ хранить и рендерить выученную сцену</h1>
    <p class="dek">Не просто «быстрее»: всё больше работы переносится из повторных запросов в заранее подготовленное представление сцены.</p>

    <svg
      id="diagram"
      viewBox="0 0 1200 430"
      width="1200"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Сравнение NeRF, Instant-NGP и 3D Gaussian Splatting</title>
      <desc id="svg-desc">Три колонки показывают перенос выученной информации из весов MLP в хэш-сетку, а затем в готовые трёхмерные гауссианы.</desc>
      <g id="stage"></g>
    </svg>
  </main>

  <script>
    const DATA = {
      zero: 0,
      origin: { x: 0, y: 0 },
      scale: { x: 10, y: 10 },
      panels: [
        {
          box: { x: 2, y: 1, w: 37, h: 34.5 },
          shadow: { x: 2.45, y: 1.45, w: 37, h: 34.5 },
          kicker: { x: 4, y: 3.7, text: "КЛАССИЧЕСКИЙ NERF" },
          title: { x: 4, y: 6, text: "Поле внутри MLP" },
          divider: { x1: 4, y1: 8, x2: 37, y2: 8 },
          labels: [
            { x: 20.5, y: 20.2, text: "Сцена — в весах сети", cls: "label", anchor: "middle" },
            { x: 20.5, y: 22.1, text: "цвет и плотность запрашиваются заново", cls: "small", anchor: "middle" }
          ],
          metrics: [
            { x: 4, y: 25, w: 33, h: 3.2, tx: 20.5, ty: 27.05, text: "ОБУЧЕНИЕ · ЧАСЫ" },
            { x: 4, y: 29.2, w: 33, h: 3.9, tx: 20.5, ty: 31.15, text: "МНОГО ТОЧЕК НА КАЖДОМ ЛУЧЕ" }
          ]
        },
        {
          box: { x: 41.5, y: 1, w: 37, h: 34.5 },
          shadow: { x: 41.95, y: 1.45, w: 37, h: 34.5 },
          kicker: { x: 43.5, y: 3.7, text: "INSTANT-NGP" },
          title: { x: 43.5, y: 6, text: "Признаки в хэш-сетке" },
          divider: { x1: 43.5, y1: 8, x2: 76.5, y2: 8 },
          labels: [
            { x: 60, y: 20.2, text: "Локальные признаки уже рядом", cls: "label", anchor: "middle" },
            { x: 60, y: 22.1, text: "MLP получает быструю подсказку", cls: "small", anchor: "middle" }
          ],
          metrics: [
            { x: 43.5, y: 25, w: 33, h: 3.2, tx: 60, ty: 27.05, text: "ОБУЧЕНИЕ · СЕКУНДЫ" },
            { x: 43.5, y: 29.2, w: 33, h: 3.9, tx: 60, ty: 31.15, text: "ХЭШ-СЕТКА + НЕБОЛЬШАЯ MLP" }
          ]
        },
        {
          box: { x: 81, y: 1, w: 37, h: 34.5 },
          shadow: { x: 81.45, y: 1.45, w: 37, h: 34.5 },
          kicker: { x: 83, y: 3.7, text: "3D GAUSSIAN SPLATTING" },
          title: { x: 83, y: 6, text: "Готовые примитивы" },
          divider: { x1: 83, y1: 8, x2: 116, y2: 8 },
          labels: [
            { x: 99.5, y: 20.2, text: "Миллионы 3D-гауссиан", cls: "label", anchor: "middle" },
            { x: 99.5, y: 22.1, text: "проецируются и смешиваются на экране", cls: "small", anchor: "middle" }
          ],
          metrics: [
            { x: 83, y: 25, w: 33, h: 3.2, tx: 99.5, ty: 27.05, text: "ОБУЧЕНИЕ · МИНУТЫ" },
            { x: 83, y: 29.2, w: 33, h: 3.9, tx: 99.5, ty: 31.15, text: "РЕНДЕР · В РЕАЛЬНОМ ВРЕМЕНИ" }
          ]
        }
      ],
      classic: {
        rays: [
          { x1: 4.5, y1: 13, x2: 12, y2: 11 },
          { x1: 4.5, y1: 13, x2: 12, y2: 13 },
          { x1: 4.5, y1: 13, x2: 12, y2: 15 }
        ],
        samples: [
          { x: 7, y: 12.35, r: 0.22 },
          { x: 8.6, y: 13, r: 0.22 },
          { x: 10.2, y: 14.4, r: 0.22 }
        ],
        mlp: { x: 14, y: 9.8, w: 10.5, h: 7.2 },
        links: [
          { x1: 16, y1: 11.3, x2: 19, y2: 12.3 },
          { x1: 16, y1: 15.5, x2: 19, y2: 14.5 },
          { x1: 19, y1: 12.3, x2: 22, y2: 11.3 },
          { x1: 19, y1: 14.5, x2: 22, y2: 15.5 }
        ],
        nodes: [
          { x: 16, y: 11.3, r: 0.34 },
          { x: 16, y: 15.5, r: 0.34 },
          { x: 19, y: 12.3, r: 0.34 },
          { x: 19, y: 14.5, r: 0.34 },
          { x: 22, y: 11.3, r: 0.34 },
          { x: 22, y: 15.5, r: 0.34 }
        ],
        arrow: { x1: 24.5, y1: 13.4, x2: 28, y2: 13.4, head: 0.65 },
        screen: { x: 28, y: 9.8, w: 7, h: 7.2 },
        screenLines: [
          { x1: 29.3, y1: 15.6, x2: 31.2, y2: 11.3 },
          { x1: 31.2, y1: 11.3, x2: 33.7, y2: 14.6 }
        ]
      },
      instant: {
        cells: [
          { x: 44.5, y: 10, w: 2.5, h: 2.2, cls: "hash-a" },
          { x: 47, y: 10, w: 2.5, h: 2.2, cls: "hash-b" },
          { x: 49.5, y: 10, w: 2.5, h: 2.2, cls: "hash-a" },
          { x: 52, y: 10, w: 2.5, h: 2.2, cls: "hash-b" },
          { x: 44.5, y: 12.2, w: 2.5, h: 2.2, cls: "hash-b" },
          { x: 47, y: 12.2, w: 2.5, h: 2.2, cls: "hash-a" },
          { x: 49.5, y: 12.2, w: 2.5, h: 2.2, cls: "hash-b" },
          { x: 52, y: 12.2, w: 2.5, h: 2.2, cls: "hash-a" },
          { x: 44.5, y: 14.4, w: 2.5, h: 2.2, cls: "hash-a" },
          { x: 47, y: 14.4, w: 2.5, h: 2.2, cls: "hash-b" },
          { x: 49.5, y: 14.4, w: 2.5, h: 2.2, cls: "hash-a" },
          { x: 52, y: 14.4, w: 2.5, h: 2.2, cls: "hash-b" }
        ],
        arrowOne: { x1: 54.5, y1: 13.3, x2: 58, y2: 13.3, head: 0.65 },
        mlp: { x: 58, y: 10.8, w: 7, h: 5 },
        mlpText: { x: 61.5, y: 13.7, text: "MLP" },
        arrowTwo: { x1: 65, y1: 13.3, x2: 68.5, y2: 13.3, head: 0.65 },
        screen: { x: 68.5, y: 9.8, w: 6.5, h: 7.2 },
        screenLines: [
          { x1: 69.6, y1: 15.4, x2: 71.4, y2: 11.5 },
          { x1: 71.4, y1: 11.5, x2: 73.8, y2: 14.5 }
        ]
      },
      splat: {
        blobs: [
          { x: 85.2, y: 12, rx: 2.2, ry: 0.9, rot: -24, cls: "gauss-a" },
          { x: 88.5, y: 10.8, rx: 1.8, ry: 0.75, rot: 18, cls: "gauss-b" },
          { x: 89.5, y: 14.3, rx: 2.6, ry: 0.9, rot: -12, cls: "gauss-a" },
          { x: 93.1, y: 12.5, rx: 2, ry: 0.8, rot: 31, cls: "gauss-b" },
          { x: 95.3, y: 15, rx: 1.9, ry: 0.7, rot: 14, cls: "gauss-a" },
          { x: 96.1, y: 10.3, rx: 1.5, ry: 0.65, rot: -28, cls: "gauss-a" }
        ],
        arrow: { x1: 98, y1: 13.3, x2: 103.5, y2: 13.3, head: 0.65 },
        screen: { x: 103.5, y: 9.2, w: 10, h: 8.2 },
        screenLines: [
          { x1: 105, y1: 15.8, x2: 108, y2: 10.8 },
          { x1: 108, y1: 10.8, x2: 112, y2: 14.5 }
        ]
      },
      trend: {
        line: { x1: 6, y1: 39.1, x2: 114, y2: 39.1, head: 0.85 },
        caption: { x: 60, y: 37.8, text: "ГДЕ ЛЕЖИТ ВЫУЧЕННАЯ ИНФОРМАЦИЯ" },
        notes: [
          { x: 20.5, y: 41.7, text: "функция: повторные запросы" },
          { x: 60, y: 41.7, text: "быстрый каталог признаков" },
          { x: 99.5, y: 41.7, text: "готовые примитивы сцены" }
        ]
      },
      fallback: {
        x: 60,
        y: 20,
        text: "Схема должна сравнить MLP и часы, хэш-сетку и секунды, миллионы гауссиан, минуты и рендеринг в реальном времени."
      }
    };

    const origin = DATA.origin;
    const scale = DATA.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const stage = document.getElementById("stage");
    const NS = "http://www.w3.org/2000/svg";
    const z = DATA.zero;

    function make(tag, attrs, parent = stage) {
      const node = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([name, value]) => node.setAttribute(name, value));
      parent.appendChild(node);
      return node;
    }

    function rect(item, cls, parent = stage) {
      return make("rect", {
        x: sx(item.x),
        y: sy(item.y),
        width: sx(item.w) - sx(z),
        height: sy(item.h) - sy(z),
        class: cls
      }, parent);
    }

    function line(item, cls, parent = stage) {
      return make("line", {
        x1: sx(item.x1),
        y1: sy(item.y1),
        x2: sx(item.x2),
        y2: sy(item.y2),
        class: cls
      }, parent);
    }

    function text(item, cls = item.cls, parent = stage) {
      const node = make("text", {
        x: sx(item.x),
        y: sy(item.y),
        class: cls,
        "text-anchor": item.anchor || "start"
      }, parent);
      node.textContent = item.text;
      return node;
    }

    function arrow(item, cls, parent = stage) {
      line(item, cls, parent);
      const points = [
        [item.x2, item.y2],
        [item.x2 - item.head, item.y2 - item.head],
        [item.x2 - item.head, item.y2 + item.head]
      ].map(point => `${sx(point.shift())},${sy(point.pop())}`).join(" ");
      make("polygon", { points, class: cls === "trend-line" ? "trend-head" : cls }, parent);
    }

    function screen(item, lines, parent = stage) {
      rect(item, "screen", parent);
      lines.forEach(segment => line(segment, "screen-line", parent));
    }

    try {
      DATA.panels.forEach(panel => {
        const group = make("g", {}, stage);
        rect(panel.shadow, "panel-shadow", group);
        rect(panel.box, "panel", group);
        text(panel.kicker, "kicker", group);
        text(panel.title, "title", group);
        line(panel.divider, "divider", group);
        panel.labels.forEach(label => text(label, label.cls, group));
        panel.metrics.forEach(metric => {
          rect(metric, "metric", group);
          text({
            x: metric.tx,
            y: metric.ty,
            text: metric.text,
            anchor: "middle"
          }, "metric-text", group);
        });
      });

      DATA.classic.rays.forEach(item => line(item, "ray"));
      DATA.classic.samples.forEach(item => {
        make("circle", {
          cx: sx(item.x),
          cy: sy(item.y),
          r: sx(item.r) - sx(z),
          class: "sample"
        });
      });
      rect(DATA.classic.mlp, "field-fill");
      DATA.classic.links.forEach(item => line(item, "field-line"));
      DATA.classic.nodes.forEach(item => {
        make("circle", {
          cx: sx(item.x),
          cy: sy(item.y),
          r: sx(item.r) - sx(z),
          class: "field-node"
        });
      });
      arrow(DATA.classic.arrow, "field-fill");
      screen(DATA.classic.screen, DATA.classic.screenLines);

      DATA.instant.cells.forEach(item => rect(item, item.cls));
      arrow(DATA.instant.arrowOne, "hash-line");
      rect(DATA.instant.mlp, "hash-a");
      text({ ...DATA.instant.mlpText, anchor: "middle" }, "tiny");
      arrow(DATA.instant.arrowTwo, "hash-line");
      screen(DATA.instant.screen, DATA.instant.screenLines);

      DATA.splat.blobs.forEach(item => {
        make("ellipse", {
          cx: sx(item.x),
          cy: sy(item.y),
          rx: sx(item.rx) - sx(z),
          ry: sy(item.ry) - sy(z),
          transform: `rotate(${item.rot} ${sx(item.x)} ${sy(item.y)})`,
          class: item.cls
        });
      });
      arrow(DATA.splat.arrow, "gauss-line");
      screen(DATA.splat.screen, DATA.splat.screenLines);

      text({ ...DATA.trend.caption, anchor: "middle" }, "trend-label");
      arrow(DATA.trend.line, "trend-line");
      DATA.trend.notes.forEach(item => {
        text({ ...item, anchor: "middle" }, "trend-note");
      });
    } catch (error) {
      stage.replaceChildren();
      text({
        x: DATA.fallback.x,
        y: DATA.fallback.y,
        text: DATA.fallback.text,
        anchor: "middle"
      }, "label");
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
