<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>DPO или RLHF: дерево решения</title>
<style>
  :root {
    color-scheme: light;
    --page: #eef2f7;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --ink: #172033;
    --muted: #526079;
    --line: #718096;
    --border: #cbd5e1;
    --dpo: #087f73;
    --dpo-dark: #065f57;
    --dpo-fill: #e1f6f1;
    --dpo-lane: #f0fbf8;
    --rlhf: #7753c5;
    --rlhf-dark: #5937a4;
    --rlhf-fill: #f0eaff;
    --rlhf-lane: #f8f5ff;
    --warning: #a45f00;
    --warning-fill: #fff5d8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #111722;
      --surface: #182130;
      --surface-soft: #202b3c;
      --ink: #f1f5fb;
      --muted: #b7c2d4;
      --line: #9aa8bd;
      --border: #3c4a60;
      --dpo: #62d9c8;
      --dpo-dark: #8de8db;
      --dpo-fill: #123b3a;
      --dpo-lane: #172f31;
      --rlhf: #baa1ff;
      --rlhf-dark: #d0c0ff;
      --rlhf-fill: #302650;
      --rlhf-lane: #28243c;
      --warning: #ffd080;
      --warning-fill: #46361c;
    }
  }

  html,
  body {
    margin: auto;
    background: var(--page);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
      "Segoe UI", sans-serif;
  }

  main {
    max-width: 1360px;
    margin: auto;
    background: var(--surface);
  }

  h1 {
    margin: auto;
    text-align: center;
    font-size: 24px;
    line-height: normal;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--surface);
    border-block: 2px solid var(--border);
  }

  .background {
    fill: var(--surface);
  }

  .lane-dpo {
    fill: var(--dpo-lane);
    stroke: var(--dpo);
    stroke-width: 1px;
  }

  .lane-rlhf {
    fill: var(--rlhf-lane);
    stroke: var(--rlhf);
    stroke-width: 1px;
  }

  .root-shape,
  .neutral-shape {
    fill: var(--surface-soft);
    stroke: var(--line);
    stroke-width: 2px;
  }

  .dpo-shape {
    fill: var(--dpo-fill);
    stroke: var(--dpo);
    stroke-width: 2px;
  }

  .rlhf-shape {
    fill: var(--rlhf-fill);
    stroke: var(--rlhf);
    stroke-width: 2px;
  }

  .dpo-outcome {
    fill: var(--dpo-fill);
    stroke: var(--dpo-dark);
    stroke-width: 3px;
  }

  .rlhf-outcome {
    fill: var(--rlhf-fill);
    stroke: var(--rlhf-dark);
    stroke-width: 3px;
  }

  .edge-neutral,
  .edge-dpo,
  .edge-rlhf {
    fill: none;
    stroke-linejoin: round;
    stroke-linecap: round;
    stroke-width: 3px;
  }

  .edge-neutral {
    stroke: var(--line);
  }

  .edge-dpo {
    stroke: var(--dpo);
  }

  .edge-rlhf {
    stroke: var(--rlhf);
  }

  .arrow-neutral {
    fill: var(--line);
  }

  .arrow-dpo {
    fill: var(--dpo);
  }

  .arrow-rlhf {
    fill: var(--rlhf);
  }

  text {
    fill: var(--ink);
    font-size: 15px;
  }

  .lane-label {
    font-size: 12px;
    font-weight: bold;
  }

  .lane-label-dpo {
    fill: var(--dpo-dark);
  }

  .lane-label-rlhf {
    fill: var(--rlhf-dark);
  }

  .node-title {
    font-size: 16px;
    font-weight: bold;
  }

  .node-small {
    fill: var(--muted);
    font-size: 13px;
  }

  .outcome-title {
    font-size: 18px;
    font-weight: bold;
  }

  .outcome-dpo {
    fill: var(--dpo-dark);
  }

  .outcome-rlhf {
    fill: var(--rlhf-dark);
  }

  .edge-label {
    fill: var(--ink);
    stroke: var(--surface);
    stroke-width: 6px;
    paint-order: stroke;
    font-size: 13px;
    font-weight: bold;
  }

  .legend-title {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .legend-note {
    fill: var(--muted);
    font-size: 13px;
  }

  .error-box {
    fill: var(--warning-fill);
    stroke: var(--warning);
    stroke-width: 2px;
  }

  .error-text {
    fill: var(--warning);
    font-size: 16px;
    font-weight: bold;
  }

  .shape,
  .edge,
  .arrow {
    vector-effect: non-scaling-stroke;
  }

  noscript {
    display: block;
    background: var(--warning-fill);
    color: var(--warning);
    font-size: 16px;
  }
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">DPO или RLHF: сначала самое тесное ограничение</h1>
  <svg id="diagram"
       viewBox="0 0 1360 460"
       width="1360"
       height="460"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title"></svg>
  <noscript>
    Схема должна показать: фиксированные пары и ограниченные вычисления ведут
    к DPO; онлайн-цикл, многокритериальная награда и крупный масштаб — к RLHF.
  </noscript>
</main>

<script>
const diagramData = [
  { x: 0, y: 0 },
  { x: 1, y: 1 },
  { bounds: [0, 0, 1360, 460] },
  {

    arrowLength: 13,
    arrowWing: 6
  },
  [
    {
      bounds: [314, 16, 1322, 184],

        x: 334,
        y: 41,

      }

    {
      bounds: [314, 222, 1322, 382],

      }
    }
  ],
  [
    {

      className: "root-shape",
      lines: [
        { x: 176, y: 185, text: "Данные", anchor: "middle", className: "node-title" },

        { x: 176, y: 232, text: "Проверяем первыми", anchor: "middle", className: "node-small" }
      ]
    },
    {
      shape: "rect",
      bounds: [360, 52, 560, 156],
      className: "dpo-shape",
      lines: [
        { x: 460, y: 84, text: "Фиксированные пары", anchor: "middle", className: "node-title" },
        { x: 460, y: 111, text: "10 000 пар ответов", anchor: "middle", className: "node-small" },
        { x: 460, y: 135, text: "используются напрямую", anchor: "middle", className: "node-small" }
      ]
    },
    {
      shape: "polygon",
      points: [[720, 52], [820, 104], [720, 156], [620, 104]],
      className: "dpo-shape",
      lines: [
        { x: 720, y: 94, text: "Вычисления", anchor: "middle", className: "node-title" },
        { x: 720, y: 117, text: "ограничены?", anchor: "middle", className: "node-title" }
      ]
    },
    {
      shape: "rect",
      bounds: [900, 52, 1300, 156],
      className: "dpo-outcome",
      lines: [
        { x: 1100, y: 82, text: "ВЫБОР: DPO", anchor: "middle", className: "outcome-title outcome-dpo" },
        { x: 1100, y: 111, text: "10 000 пар • 2 недели", anchor: "middle", className: "node-title" },
        { x: 1100, y: 137, text: "Без модели награды и настройки PPO", anchor: "middle", className: "node-small" }
      ]
    },
    {
      shape: "rect",
      bounds: [350, 250, 550, 354],
      className: "rlhf-shape",
      lines: [
        { x: 450, y: 281, text: "Онлайн-цикл", anchor: "middle", className: "node-title" },
        { x: 450, y: 307, text: "люди оценивают", anchor: "middle", className: "node-small" },
        { x: 450, y: 331, text: "свежие ответы", anchor: "middle", className: "node-small" }
      ]
    },
    {
      shape: "rect",
      bounds: [600, 250, 840, 354],
      className: "rlhf-shape",
      lines: [
        { x: 720, y: 280, text: "Сложная награда", anchor: "middle", className: "node-title" },
        { x: 720, y: 306, text: "полезность • безопасность", anchor: "middle", className: "node-small" },
        { x: 720, y: 331, text: "• честность", anchor: "middle", className: "node-small" }
      ]
    },
    {
      shape: "rect",
      bounds: [890, 250, 1060, 354],
      className: "rlhf-shape",
      lines: [
        { x: 975, y: 280, text: "Миллионы", anchor: "middle", className: "node-title" },
        { x: 975, y: 306, text: "оценок", anchor: "middle", className: "node-title" },
        { x: 975, y: 331, text: "крупный масштаб", anchor: "middle", className: "node-small" }
      ]
    },
    {
      shape: "rect",
      bounds: [1110, 250, 1300, 354],
      className: "rlhf-outcome",
      lines: [
        { x: 1205, y: 281, text: "ВЫБОР: RLHF", anchor: "middle", className: "outcome-title outcome-rlhf" },
        { x: 1205, y: 309, text: "модель награды", anchor: "middle", className: "node-small" },
        { x: 1205, y: 333, text: "+ онлайн-цикл", anchor: "middle", className: "node-small" }
      ]
    }
  ],
  [
    {
      points: [[286, 203], [320, 203]],
      className: "edge-neutral",
      arrowClass: "arrow-neutral",
      arrow: false
    },
    {
      points: [[320, 203], [320, 104], [360, 104]],
      className: "edge-dpo",
      arrowClass: "arrow-dpo",
      arrow: true,
      label: { x: 331, y: 188, text: "ДА", anchor: "start", className: "edge-label" }
    },
    {
      points: [[560, 104], [620, 104]],
      className: "edge-dpo",
      arrowClass: "arrow-dpo",
      arrow: true
    },
    {
      points: [[820, 104], [900, 104]],
      className: "edge-dpo",
      arrowClass: "arrow-dpo",
      arrow: true
    },
    {
      points: [[320, 203], [320, 302], [350, 302]],
      className: "edge-rlhf",
      arrowClass: "arrow-rlhf",
      arrow: true,
      label: { x: 331, y: 219, text: "НЕТ", anchor: "start", className: "edge-label" }
    },
    {
      points: [[550, 302], [600, 302]],
      className: "edge-rlhf",
      arrowClass: "arrow-rlhf",
      arrow: true
    },
    {
      points: [[840, 302], [890, 302]],
      className: "edge-rlhf",
      arrowClass: "arrow-rlhf",
      arrow: true
    },
    {
      points: [[1060, 302], [1110, 302]],
      className: "edge-rlhf",
      arrowClass: "arrow-rlhf",
      arrow: true
    }
  ],
  [
    {
      x: 680,
      y: 414,
      text: "ПОРЯДОК ПРОВЕРКИ: ДАННЫЕ → ВЫЧИСЛЕНИЯ → ОНЛАЙН-РАЗМЕТКА → СИГНАЛ НАГРАДЫ",
      anchor: "middle",
      className: "legend-title"
    },
    {
      x: 680,
      y: 440,
      text: "Один жёсткий предел перевешивает остальные преимущества; большое железо само по себе не требует RLHF.",
      anchor: "middle",
      className: "legend-note"
    }
  ],
  {
    bounds: [180, 150, 1180, 310],
    lines: [
      {
        x: 680,
        y: 213,
        text: "Не удалось построить дерево решения.",
        anchor: "middle",
        className: "error-text"
      },
      {
        x: 680,
        y: 252,
        text: "Фиксированные пары и ограниченные вычисления → DPO.",
        anchor: "middle",
        className: "error-text"
      },
      {
        x: 680,
        y: 281,
        text: "Онлайн-цикл, сложная награда и крупный масштаб → RLHF.",
        anchor: "middle",
        className: "error-text"
      }
    ]
  }
];

const [origin, scale, frame, metrics, lanes, nodes, edges, notes, fallback] = diagramData;

const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const namespace = "http://www.w3.org/2000/svg";

function element(tag, attributes, value) {
  const item = document.createElementNS(namespace, tag);
  for (const [name, attribute] of Object.entries(attributes)) {
    item.setAttribute(name, attribute);
  }
  if (value !== undefined) item.textContent = value;
  return item;
}

function rectangle(bounds, className, radius) {
  const [left, top, right, bottom] = bounds;
  return element("rect", {
    x: sx(left),
    y: sy(top),
    width: sx(right) - sx(left),
    height: sy(bottom) - sy(top),
    rx: sx(radius) - sx(origin.x),
    class: `shape ${className}`
  });
}

function polygon(points, className) {
  return element("polygon", {
    points: points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
    class: `shape ${className}`
  });
}

function textLine(line) {
  return element("text", {
    x: sx(line.x),
    y: sy(line.y),
    "text-anchor": line.anchor,
    class: line.className
  }, line.text);
}

function drawArrow(edge, parent) {
  let previous;
  let tip;

  for (const point of edge.points) {
    previous = tip;
    tip = point;
  }

  const [previousX, previousY] = previous;
  const [tipX, tipY] = tip;
  const deltaX = tipX - previousX;
  const deltaY = tipY - previousY;
  const length = Math.hypot(deltaX, deltaY);

  if (!length) throw new Error("У стрелки отсутствует направление");

  const unitX = deltaX / length;
  const unitY = deltaY / length;
  const left = [
    tipX - unitX * metrics.arrowLength + unitY * metrics.arrowWing,
    tipY - unitY * metrics.arrowLength - unitX * metrics.arrowWing
  ];
  const right = [
    tipX - unitX * metrics.arrowLength - unitY * metrics.arrowWing,
    tipY - unitY * metrics.arrowLength + unitX * metrics.arrowWing
  ];

  parent.appendChild(polygon([tip, left, right], `arrow ${edge.arrowClass}`));
}

try {
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  svg.appendChild(rectangle(frame.bounds, "background", origin.x));

  for (const lane of lanes) {
    svg.appendChild(rectangle(lane.bounds, lane.className, metrics.corner));
    svg.appendChild(textLine(lane.label));
  }

  for (const edge of edges) {
    svg.appendChild(element("polyline", {
      points: edge.points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
      class: `edge ${edge.className}`
    }));

    if (edge.arrow) drawArrow(edge, svg);
    if (edge.label) svg.appendChild(textLine(edge.label));
  }

  for (const node of nodes) {
    const shape = node.shape === "rect"
      ? rectangle(node.bounds, node.className, metrics.corner)
      : polygon(node.points, node.className);

    svg.appendChild(shape);

    for (const line of node.lines) {
      svg.appendChild(textLine(line));
    }
  }

  for (const note of notes) {
    svg.appendChild(textLine(note));
  }
} catch (error) {
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  svg.appendChild(rectangle(frame.bounds, "background", origin.x));
  svg.appendChild(rectangle(fallback.bounds, "error-box", metrics.corner));

  for (const line of fallback.lines) {
    svg.appendChild(textLine(line));
  }
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
