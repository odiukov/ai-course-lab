<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сравнение методов выравнивания</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-alt: #f3f6fa;
      --ink: #172033;
      --muted: #5c687d;
      --line: #cbd4e2;
      --head: #e9eef6;
      --accent: #245fc5;
      --accent-soft: #e7efff;
      --yes: #176b4d;
      --yes-soft: #e1f3eb;
      --no: #8a4050;
      --no-soft: #f8e8ec;
      --simple: #6941c6;
      --simple-soft: #eee8ff;
      --callout: #eef4ff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10141d;
        --panel: #171d28;
        --panel-alt: #1c2330;
        --ink: #edf2fb;
        --muted: #aab5c7;
        --line: #3c4759;
        --head: #222b39;
        --accent: #8eb5ff;
        --accent-soft: #223657;
        --yes: #83dfba;
        --yes-soft: #183d31;
        --no: #f2a9b7;
        --no-soft: #48252e;
        --simple: #c1a8ff;
        --simple-soft: #35275a;
        --callout: #1b2c49;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: initial;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      background: var(--panel);
      overflow: hidden;
    }

    .figure-title {
      box-sizing: border-box;
      margin: initial;
      padding: 14px 40px 4px;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      letter-spacing: -0.02em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .outline,
    .grid,
    .badge,
    .callout-box {
      vector-effect: non-scaling-stroke;
    }

    .outline {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
    }

    .grid {
      stroke: var(--line);
      stroke-width: 1px;
    }

    .header-bg {
      fill: var(--head);
    }

    .row-bg {
      fill: var(--panel);
    }

    .row-alt {
      fill: var(--panel-alt);
    }

    .kicker {
      fill: var(--accent);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.08em;
    }

    .guide {
      fill: var(--muted);
      font-size: 14px;
    }

    .header-text {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
    }

    .method {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .cell-text {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .subtext {
      fill: var(--muted);
      font-size: 11px;
    }

    .badge {
      stroke-width: 1px;
    }

    .badge-yes {
      fill: var(--yes-soft);
      stroke: var(--yes);
    }

    .badge-no {
      fill: var(--no-soft);
      stroke: var(--no);
    }

    .badge-text-yes {
      fill: var(--yes);
      font-size: 13px;
      font-weight: bold;
    }

    .badge-text-no {
      fill: var(--no);
      font-size: 13px;
      font-weight: bold;
    }

    .metric-number {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .model-dot {
      fill: var(--accent);
    }

    .loop-dot {
      fill: var(--simple);
    }

    .metric-track {
      fill: var(--head);
    }

    .callout-box {
      fill: var(--callout);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .callout-mark {
      fill: var(--accent);
      font-size: 18px;
      font-weight: bold;
    }

    .callout-main {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .callout-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      fill: var(--ink);
      font-size: 18px;
    }
  </style>
</head>
<body>
  <main class="figure">
    <h1 class="figure-title">Сравнение методов выравнивания</h1>
    <svg id="chart"
         width="1200"
         height="470"
         viewBox="0 0 1200 470"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Таблица сравнения RLHF, DPO, KTO, ORPO и SimPO по данным, моделям и циклам обучения">
    </svg>
  </main>

  <script>
    const DATA = [
      {
        origin: { x: 40, y: 8 },
        scale: { x: 1, y: 1 },
        zero: 0,
        tableX: 0,
        tableY: 52,
        tableW: 1120,
        headerH: 58,
        rowH: 55,
        tableBottom: 385,
        corner: 10,
        columns: [0, 145, 310, 475, 650, 875, 1120],
        centers: [72.5, 227.5, 392.5, 562.5, 762.5, 997.5],
        headerLines: [74, 91],
        kickerY: 15,
        guideY: 38,
        rowTextShift: 34,
        rowSubShift: 47,
        badgeW: 78,
        badgeH: 28,
        badgeYShift: 14,
        badgeCorner: 14,
        metricTextX: [684, 910],
        metricDotX: [753, 977],
        metricGap: 19,
        dotR: 6,
        trackR: 9,
        calloutX: 0,
        calloutY: 400,
        calloutW: 1120,
        calloutH: 48,
        calloutCorner: 10,
        calloutMarkX: 24,
        calloutTextX: 58,
        calloutMainY: 420,
        calloutNoteY: 439,
        fallbackY: 80
      },
      {
        method: "RLHF",
        pairs: "Да",
        reference: "Да",
        reward: "Да",
        memory: "3–4",
        memoryDots: 4,
        loops: "3",
        loopDots: 3,
        note: "reward model + PPO"
      },
      {
        method: "DPO",
        pairs: "Да",
        reference: "Да",
        reward: "Нет",
        memory: "2",
        memoryDots: 2,
        loops: "2",
        loopDots: 2,
        note: "пары + reference"
      },
      {
        method: "KTO",
        pairs: "Нет",
        reference: "Да",
        reward: "Нет",
        memory: "2",
        memoryDots: 2,
        loops: "2",
        loopDots: 2,
        note: "непарные оценки"
      },
      {
        method: "ORPO",
        pairs: "Да",
        reference: "Нет",
        reward: "Нет",
        memory: "1",
        memoryDots: 1,
        loops: "1",
        loopDots: 1,
        note: "SFT + alignment вместе"
      },
      {
        method: "SimPO",
        pairs: "Да",
        reference: "Нет",
        reward: "Нет",
        memory: "1",
        memoryDots: 1,
        loops: "1",
        loopDots: 1,
        note: "без reference"
      }
    ];

    const [L, ...rows] = DATA;
    const origin = L.origin;
    const scale = L.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("chart");
    const NS = svg.namespaceURI;

    const node = (name, attrs, text) => {
      const element = document.createElementNS(NS, name);
      Object.entries(attrs).forEach(([key, value]) => {
        element.setAttribute(key, value);
      });
      if (text !== undefined) element.textContent = text;
      return element;
    };

    const add = (name, attrs, text, parent = svg) => {
      const element = node(name, attrs, text);
      parent.appendChild(element);
      return element;
    };

    const rect = (x, y, w, h, className, radius, parent = svg) =>
      add("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + w) - sx(L.zero),
        height: sy(y + h) - sy(y),
        rx: sx(radius) - sx(L.zero),
        ry: sy(radius) - sy(L.zero),
        class: className
      }, undefined, parent);

    const line = (x1, y1, x2, y2, className, parent = svg) =>
      add("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }, undefined, parent);

    const text = (x, y, value, className, anchor, parent = svg) =>
      add("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, value, parent);

    const badge = (centerX, topY, value, parent) => {
      const yes = value === "Да";
      const left = centerX - L.badgeW / DATA.length;
      rect(
        left,
        topY,
        L.badgeW,
        L.badgeH,
        yes ? "badge badge-yes" : "badge badge-no",
        L.badgeCorner,
        parent
      );
      text(
        centerX,
        topY + L.badgeH / DATA.length,
        value,
        yes ? "badge-text-yes" : "badge-text-no",
        "middle",
        parent
      );
    };

    const metric = (value, count, textX, dotX, centerY, dotClass, parent) => {
      text(textX, centerY, value, "metric-number", "start", parent);
      rows.slice(L.zero, count).forEach((unused, index) => {
        add("circle", {
          cx: sx(dotX + index * L.metricGap),
          cy: sy(centerY),
          r: sx(L.dotR) - sx(L.zero),
          class: dotClass
        }, undefined, parent);
      });
    };

    try {
      const main = add("g", { "aria-hidden": "true" });

      text(
        L.tableX,
        L.kickerY,
        "ВЫБОР ПОД ОГРАНИЧЕНИЯ ПРОЕКТА",
        "kicker",
        "start",
        main
      );
      text(
        L.tableX,
        L.guideY,
        "Каждая строка экономит на своём: разметке, памяти или этапах.",
        "guide",
        "start",
        main
      );

      rect(
        L.tableX,
        L.tableY,
        L.tableW,
        L.headerH,
        "header-bg",
        L.corner,
        main
      );

      rows.forEach((row, index) => {
        const rowY = L.tableY + L.headerH + index * L.rowH;
        rect(
          L.tableX,
          rowY,
          L.tableW,
          L.rowH,
          index % rows.length ? "row-alt" : "row-bg",
          L.zero,
          main
        );
      });

      L.columns.slice(L.badgeYShift / L.badgeYShift, -L.badgeYShift / L.badgeYShift)
        .forEach(columnX => {
          line(
            columnX,
            L.tableY,
            columnX,
            L.tableBottom,
            "grid",
            main
          );
        });

      rows.slice(L.zero, -L.badgeYShift / L.badgeYShift).forEach((row, index) => {
        const rowLineY = L.tableY + L.headerH + (index + L.badgeYShift / L.badgeYShift) * L.rowH;
        line(
          L.tableX,
          rowLineY,
          L.tableX + L.tableW,
          rowLineY,
          "grid",
          main
        );
      });

      line(
        L.tableX,
        L.tableY + L.headerH,
        L.tableX + L.tableW,
        L.tableY + L.headerH,
        "grid",
        main
      );

      const headers = [
        ["Метод", ""],
        ["Нужны", "пары?"],
        ["Нужен", "reference?"],
        ["Нужна", "reward model?"],
        ["Моделей", "в памяти"],
        ["Циклов", "обучения"]
      ];

      headers.forEach((parts, index) => {
        const centerX = L.centers[index];
        if (parts.at(-L.badgeYShift / L.badgeYShift)) {
          text(
            centerX,
            L.headerLines.at(L.zero),
            parts.at(L.zero),
            "header-text",
            "middle",
            main
          );
          text(
            centerX,
            L.headerLines.at(-L.badgeYShift / L.badgeYShift),
            parts.at(-L.badgeYShift / L.badgeYShift),
            "header-text",
            "middle",
            main
          );
        } else {
          text(
            centerX,
            L.headerLines.at(L.zero) + L.badgeYShift / DATA.length,
            parts.at(L.zero),
            "header-text",
            "middle",
            main
          );
        }
      });

      rows.forEach((row, index) => {
        const rowY = L.tableY + L.headerH + index * L.rowH;
        const centerY = rowY + L.rowH / DATA.length;
        const content = add("g", {});

        text(
          L.tableX + L.calloutMarkX,
          rowY + L.rowTextShift,
          row.method,
          "method",
          "start",
          content
        );

        text(
          L.tableX + L.calloutMarkX,
          rowY + L.rowSubShift,
          row.note,
          "subtext",
          "start",
          content
        );

        badge(
          L.centers.at(L.badgeYShift / L.badgeYShift),
          rowY + L.badgeYShift,
          row.pairs,
          content
        );
        badge(
          L.centers.at(L.badgeYShift / L.badgeYShift + L.badgeYShift / L.badgeYShift),
          rowY + L.badgeYShift,
          row.reference,
          content
        );
        badge(
          L.centers.at(-L.memoryDots),
          rowY + L.badgeYShift,
          row.reward,
          content
        );

        metric(
          row.memory,
          row.memoryDots,
          L.metricTextX.at(L.zero),
          L.metricDotX.at(L.zero),
          centerY,
          "model-dot",
          content
        );
        metric(
          row.loops,
          row.loopDots,
          L.metricTextX.at(-L.badgeYShift / L.badgeYShift),
          L.metricDotX.at(-L.badgeYShift / L.badgeYShift),
          centerY,
          "loop-dot",
          content
        );
      });

      rect(
        L.tableX,
        L.tableY,
        L.tableW,
        L.tableBottom - L.tableY,
        "outline",
        L.corner,
        main
      );

      rect(
        L.calloutX,
        L.calloutY,
        L.calloutW,
        L.calloutH,
        "callout-box",
        L.calloutCorner,
        main
      );
      text(
        L.calloutMarkX,
        L.calloutMainY,
        "≠",
        "callout-mark",
        "middle",
        main
      );
      text(
        L.calloutTextX,
        L.calloutMainY,
        "Меньше моделей и циклов — не автоматическая победа.",
        "callout-main",
        "start",
        main
      );
      text(
        L.calloutTextX,
        L.calloutNoteY,
        "Таблица сравнивает цену выбора: память, сложность разметки и число этапов — не качество.",
        "callout-note",
        "start",
        main
      );
    } catch (error) {
      svg.replaceChildren();
      text(
        L.tableX,
        L.fallbackY,
        "Схема должна была показать сравнение RLHF, DPO, KTO, ORPO и SimPO по парам, reference, reward model, памяти и циклам обучения.",
        "fallback",
        "start",
        svg
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
