<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь кандидата от shadow до полного трафика</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f8fafc;
  --ink:#172033;
  --muted:#586579;
  --border:#aeb9c8;
  --shadow:#e8f1f8;
  --canary:#fff5d6;
  --ab:#f0eaff;
  --card:#ffffff;
  --gate:#f59e0b;
  --gate-stroke:#a85e00;
  --flow:#167b5b;
  --alert:#c2413a;
  --purple:#7952b3;
  --legend:#eef2f6;
  --inverse:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111827;
    --ink:#e8edf5;
    --muted:#aeb9c9;
    --border:#526075;
    --shadow:#182b3b;
    --canary:#352c16;
    --ab:#29213d;
    --card:#1d2735;
    --gate:#e9a23b;
    --gate-stroke:#ffd38b;
    --flow:#4fc39b;
    --alert:#ff8179;
    --purple:#bca2ef;
    --legend:#1a2432;
    --inverse:#101820;
  }
}
*{box-sizing:border-box}
html,body,.figure{background:var(--bg);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.heading{
  font-size:20px;
  font-weight:bold;
  text-align:center;
  background:var(--bg);
  color:var(--ink);
}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:490px;
  background:var(--bg);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  shape-rendering:geometricPrecision;
}
.zone{stroke:var(--border);stroke-width:1.5;fill:var(--card)}
.zone.shadow{fill:var(--shadow)}
.zone.canary{fill:var(--canary)}
.zone.ab{fill:var(--ab)}
.card{fill:var(--card);stroke:var(--border);stroke-width:1.5}
.legend{fill:var(--legend);stroke:var(--border);stroke-width:1.5}
.node{fill:var(--card);stroke:var(--flow);stroke-width:2.5}
.node.done{fill:var(--flow)}
.gate{fill:var(--gate);stroke:var(--gate-stroke);stroke-width:1.5}
.flow-line{stroke:var(--flow);stroke-width:2.5;fill:none;stroke-linecap:round}
.alert-line{stroke:var(--alert);stroke-width:2.5;fill:none;stroke-linecap:round}
.ab-line{stroke:var(--purple);stroke-width:2.5;fill:none;stroke-linecap:round}
.zone-title{font-size:15px;font-weight:bold;fill:var(--ink)}
.subtitle{font-size:13px;fill:var(--muted)}
.body{font-size:13px;fill:var(--ink)}
.small{font-size:12px;fill:var(--muted)}
.percent{font-size:15px;font-weight:bold;fill:var(--ink)}
.inverse{fill:var(--inverse)}
.emphasis{font-size:13px;font-weight:bold;fill:var(--ink)}
.alert-text{font-size:12px;font-weight:bold;fill:var(--alert)}
.flow-text{font-size:12px;font-weight:bold;fill:var(--flow)}
.ab-text{font-size:12px;font-weight:bold;fill:var(--purple)}
.fallback{font-size:15px;fill:var(--alert)}
</style>
</head>
<body>
<main class="figure" aria-labelledby="diagram-heading">
  <div class="heading" id="diagram-heading">Путь кандидата от невидимого сравнения до полного трафика</div>
  <svg id="diagram" viewBox="0 0 1120 470" width="1120" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Shadow, ступени canary и необязательный A/B-тест</title>
    <desc id="svg-desc">Кандидат сначала не отвечает пользователям, затем получает 1, 10, 25, 50, 75 и 100 процентов трафика через ворота метрик. При нарушении выполняется откат. После успешной выкатки возможен A/B-тест 50 на 50.</desc>
    <g id="plot"></g>
  </svg>
</main>
<script>
const data=Object.freeze([{
  z:0,ah:8,aw:4,nr:24,gh:9,
  zones:[
    [18,8,210,326,"zone shadow"],
    [220,8,815,326,"zone canary"],
    [825,8,1102,326,"zone ab"],
    [18,338,1102,460,"legend"]
  ],
  cards:[
    [42,86,186,166,"card"],
    [900,83,1076,120,"card"],
    [900,143,1076,180,"card"]
  ],
  nodes:[
    [280,126,"1%","node"],
    [374,126,"10%","node"],
    [468,126,"25%","node"],
    [562,126,"50%","node"],
    [656,126,"75%","node"],
    [750,126,"100%","node done"]
  ],
  gates:[
    [242,126],[327,126],[421,126],[515,126],[609,126],[703,126],
    [242,187],[40,398],[250,398],[460,398],[670,398],[880,398]
  ],
  arrows:[
    [186,126,233,126,"flow-line"],
    [251,126,256,126,"flow-line"],
    [304,126,318,126,"flow-line"],
    [336,126,350,126,"flow-line"],
    [398,126,412,126,"flow-line"],
    [430,126,444,126,"flow-line"],
    [492,126,506,126,"flow-line"],
    [524,126,538,126,"flow-line"],
    [586,126,600,126,"flow-line"],
    [618,126,632,126,"flow-line"],
    [680,126,694,126,"flow-line"],
    [712,126,726,126,"flow-line"],
    [774,126,850,126,"ab-line"],
    [850,126,900,102,"ab-line"],
    [850,126,900,162,"ab-line"],
    [770,218,280,218,"alert-line"],
    [38,441,130,441,"flow-line"],
    [1050,441,958,441,"alert-line"]
  ],
  texts:[
    [114,28,"SHADOW","zone-title","middle"],
    [114,52,"невидимое сравнение","subtitle","middle"],
    [114,105,"Кандидат получает копию","body","middle"],
    [114,127,"Ответы идут только в лог","emphasis","middle"],
    [114,149,"Пользователям отвечает прод","body","middle"],
    [42,205,"Проверяет без последствий:","emphasis","start"],
    [42,227,"ошибки, задержку, стоимость","small","start"],
    [42,270,"Не проверяет реакцию","alert-text","start"],
    [42,290,"реальных пользователей","alert-text","start"],

    [518,28,"CANARY","zone-title","middle"],
    [518,52,"кандидат отвечает на настоящие запросы","subtitle","middle"],
    [260,187,"ворота после каждой ступени","small","start"],
    [770,200,"метрика вышла за границу — вернуть предыдущую версию","alert-text","end"],
    [242,254,"Пауза на каждом шаге:","emphasis","start"],
    [242,277,"накопить достаточно наблюдений;","body","start"],
    [242,298,"редкой метрике нужно больше запросов.","body","start"],
    [790,254,"Стрелки — решения, не расписание","flow-text","end"],
    [750,168,"текущая версия","flow-text","middle"],

    [963,28,"A/B · НЕОБЯЗАТЕЛЬНО","zone-title","middle"],
    [963,52,"если модель заметно другая","subtitle","middle"],
    [918,102,"A · 50% · текущая","body","start"],
    [918,162,"B · 50% · кандидат","body","start"],
    [850,205,"50/50 трафика","ab-text","start"],
    [846,237,"Canary: «не сломалось ли?»","small","start"],
    [846,263,"A/B: «стало ли лучше?»","ab-text","start"],
    [846,294,"Если различий нет — A/B пропускают","small","start"],

    [38,360,"ВОРОТА ПРОВЕРЯЮТ","zone-title","start"],
    [57,398,"Задержка","body","start"],
    [267,398,"Стоимость запроса","body","start"],
    [477,398,"Ошибки и отказы","body","start"],
    [687,398,"Длина ответов","body","start"],
    [897,391,"Негативная","body","start"],
    [897,410,"обратная связь","body","start"],
    [38,423,"В границах: следующая доля","flow-text","start"],
    [1050,423,"Нарушение: предыдущая версия","alert-text","end"]
  ],
  fallback:[
    [560,210,"Схема должна показать путь: shadow → 1% → 10% → 25% → 50% → 75% → 100%.","fallback","middle"],
    [560,244,"Между ступенями — ворота метрик и откат; затем возможен A/B 50/50.","fallback","middle"]
  ]
}]);
const origin=Object.freeze({x:0,y:0});
const scale=Object.freeze({x:1,y:1});
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const [D]=data;
const NS="http://www.w3.org/2000/svg";
const make=(tag,attrs,parent,text)=>{
  const node=document.createElementNS(NS,tag);
  for(const [key,value] of Object.entries(attrs)) node.setAttribute(key,value);
  if(text!==undefined) node.textContent=text;
  parent.appendChild(node);
  return node;
};
const drawRect=(item,parent)=>{
  const [x1,y1,x2,y2,c]=item;
  make("rect",{x:sx(x1),y:sy(y1),width:sx(x2)-sx(x1),height:sy(y2)-sy(y1),class:c},parent);
};
const drawText=(item,parent)=>{
  const [x,y,label,c,anchor]=item;
  make("text",{x:sx(x),y:sy(y),class:c,"text-anchor":anchor,"dominant-baseline":"middle"},parent,label);
};
const drawGate=(item,parent)=>{
  const [x,y]=item,h=D.gh;
  const points=[[x,y-h],[x+h,y],[x,y+h],[x-h,y]]
    .map(([px,py])=>`${sx(px)},${sy(py)}`).join(" ");
  make("polygon",{points,class:"gate"},parent);
};
const drawArrow=(item,parent)=>{
  const [x1,y1,x2,y2,c]=item;
  make("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:c},parent);
  const dx=x2-x1,dy=y2-y1,length=Math.hypot(dx,dy);
  const ux=dx/length,uy=dy/length;
  const points=[
    [x2,y2],
    [x2-D.ah*ux+D.aw*uy,y2-D.ah*uy-D.aw*ux],
    [x2-D.ah*ux-D.aw*uy,y2-D.ah*uy+D.aw*ux]
  ].map(([px,py])=>`${sx(px)},${sy(py)}`).join(" ");
  make("polygon",{points,class:c},parent);
};

try{
  const root=document.getElementById("plot");
  if(!root) throw new Error("plot");
  D.zones.forEach(item=>drawRect(item,root));
  D.cards.forEach(item=>drawRect(item,root));
  D.arrows.forEach(item=>drawArrow(item,root));
  D.gates.forEach(item=>drawGate(item,root));
  D.nodes.forEach(item=>{
    const [x,y,label,c]=item;
    make("circle",{cx:sx(x),cy:sy(y),r:sx(D.nr)-sx(D.z),class:c},root);
    drawText([x,y,label,c.includes("done")?"percent inverse":"percent","middle"],root);
  });
  D.texts.forEach(item=>drawText(item,root));
}catch(error){
  const root=document.getElementById("plot");
  if(root){
    root.replaceChildren();
    D.fallback.forEach(item=>drawText(item,root));
  }
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
