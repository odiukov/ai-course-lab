<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как ряд становится таблицей признаков и цели</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5d687c;
      --grid: #b9c2d2;
      --soft: #edf1f7;
      --feature-fill: #dcecff;
      --feature-strong: #2f6fbb;
      --feature-text: #174f91;
      --target-fill: #ffe4d9;
      --target-strong: #c85832;
      --target-text: #943a1f;
      --arrow: #66758b;
      --shadow: #d9e0eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151f;
        --panel: #171e2a;
        --text: #edf3ff;
        --muted: #aeb9ca;
        --grid: #536176;
        --soft: #222c3a;
        --feature-fill: #193b61;
        --feature-strong: #78b6ff;
        --feature-text: #b9dcff;
        --target-fill: #562d22;
        --target-strong: #ff9a72;
        --target-text: #ffd0bd;
        --arrow: #9aa9bf;
        --shadow: #0b0f16;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
    }

    h1 {
      margin: 0;
      padding: 8px 12px;
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      background: var(--panel);
      color: var(--text);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 450px;
      background: var(--panel);
    }

    .section-label {
      fill: var(--text);
      font-size: 17px;
      font-weight: 700;
    }

    .small-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .row-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .value {
      fill: var(--text);
      font-size: 18px;
      font-weight: 750;
    }

    .column-name {
      fill: var(--text);
      font-size: 15px;
      font-weight: 750;
    }

    .column-help {
      fill: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .group-feature {
      fill: var(--feature-text);
      font-size: 15px;
      font-weight: 750;
    }

    .group-target {
      fill: var(--target-text);
      font-size: 15px;
      font-weight: 750;
    }

    .legend-label {
      fill: var(--text);
      font-size: 14px;
      font-weight: 600;
    }

    .series-cell {
      fill: var(--soft);
      stroke: var(--grid);
    }

    .feature-cell {
      fill: var(--feature-fill);
      stroke: var(--feature-strong);
    }

    .target-cell {
      fill: var(--target-fill);
      stroke: var(--target-strong);
    }

    .header-feature {
      fill: var(--feature-fill);
      stroke: var(--feature-strong);
    }

    .header-target {
      fill: var(--target-fill);
      stroke: var(--target-strong);
    }

    .connector {
      fill: none;
      stroke: var(--arrow);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-bracket {
      fill: none;
      stroke: var(--feature-strong);
      stroke-linecap: round;
    }

    .target-bracket {
      fill: none;
      stroke: var(--target-strong);
      stroke-linecap: round;
    }

    .shift-guide {
      fill: none;
      stroke: var(--grid);
      stroke-linecap: round;
    }

    .fallback {
      fill: var(--text);
      font-size: 17px;
      font-weight: 650;
    }

    noscript {
      display: block;
      padding: 8px 12px;
      color: var(--text);
      background: var(--panel);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title">
    <h1 id="figure-title">Как ряд становится таблицей признаков и цели</h1>

    <svg
      id="canvas"
      viewBox="0 0 1000 450"
      width="1000"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="figure-title figure-description"
    >
      <desc id="figure-description">
        Ряд 10, 12, 14, 13, 15 разбивается скользящим окном на три
        учебных примера. Два первых значения каждого окна образуют признаки
        lag_2 и lag_1, а последнее значение становится целью target.
      </desc>
      <g id="diagram"></g>
    </svg>

    <noscript>
      Ряд [10, 12, 14, 13, 15] превращается в строки
      [10, 12 → 14], [12, 14 → 13] и [14, 13 → 15].
    </noscript>
  </figure>

  <script>
    const data = {
      series: [10, 12, 14, 13, 15],
      rows: [
        [10, 12, 14],
        [12, 14, 13],
        [14, 13, 15]
      ],
      columns: ["lag_2", "lag_1", "target"],
      explanations: [
        "два момента назад",
        "предыдущее значение",
        "что предсказываем"
      ],
      rowLabels: [
        "первое окно",
        "сдвиг на шаг",
        "ещё один сдвиг"
      ]
    };

    const canvas = { width: 1000, height: 450 };
    const origin = { x: 10, y: 10 };
    const scale = { x: 10, y: 10 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelOffset = 7;
    const lineWidth = 2;
    const svgNS = "http://www.w3.org/2000/svg";
    const diagram = document.getElementById("diagram");

    function element(name, attributes, className) {
      const item = document.createElementNS(svgNS, name);

      Object.entries(attributes).forEach(([key, value]) => {
        item.setAttribute(key, String(value));
      });

      if (className) {
        item.setAttribute("class", className);
      }

      return item;
    }

    function addText(x, y, value, className, anchor = "start") {
      const item = element(
        "text",
        {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        },
        className
      );

      item.textContent = value;
      diagram.appendChild(item);
      return item;
    }

    function addTwoLineText(
      x,
      y,
      first,
      second,
      firstClass,
      secondClass,
      anchor = "middle"
    ) {
      const group = element("g", {}, "");
      const top = element(
        "text",
        {
          x: sx(x),
          y: sy(y) - labelOffset,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        },
        firstClass
      );
      const bottom = element(
        "text",
        {
          x: sx(x),
          y: sy(y) + labelOffset,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        },
        secondClass
      );

      top.textContent = first;
      bottom.textContent = second;
      group.append(top, bottom);
      diagram.appendChild(group);
      return group;
    }

    function addRect(x, y, width, height, className) {
      const item = element(
        "rect",
        {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(0.7) - sx(0),
          ry: sy(0.7) - sy(0),
          "stroke-width": lineWidth
        },
        className
      );

      diagram.appendChild(item);
      return item;
    }

    function addLine(x1, y1, x2, y2, className) {
      const item = element(
        "line",
        {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          "stroke-width": lineWidth
        },
        className
      );

      diagram.appendChild(item);
      return item;
    }

    function addArrow(x1, y1, x2, y2) {
      addLine(x1, y1, x2 - 1.2, y2, "connector");

      const head = element(
        "polygon",
        {
          points: [
            `${sx(x2)},${sy(y2)}`,
            `${sx(x2 - 1.5)},${sy(y2 - 0.8)}`,
            `${sx(x2 - 1.5)},${sy(y2 + 0.8)}`
          ].join(" ")
        },
        "connector"
      );

      head.setAttribute("fill", "var(--arrow)");
      head.setAttribute("stroke-width", lineWidth);
      diagram.appendChild(head);
    }

    function addDownArrow(x, y1, y2) {
      addLine(x, y1, x, y2 - 1.1, "shift-guide");

      const head = element(
        "polygon",
        {
          points: [
            `${sx(x)},${sy(y2)}`,
            `${sx(x - 0.7)},${sy(y2 - 1.2)}`,
            `${sx(x + 0.7)},${sy(y2 - 1.2)}`
          ].join(" ")
        },
        "shift-guide"
      );

      head.setAttribute("fill", "var(--grid)");
      head.setAttribute("stroke-width", lineWidth);
      diagram.appendChild(head);
    }

    function addBracket(x1, x2, y, className) {
      addLine(x1, y, x2, y, className);
      addLine(x1, y, x1, y + 0.8, className);
      addLine(x2, y, x2, y + 0.8, className);
    }

    function addCell(x, y, width, height, value, className) {
      addRect(x, y, width, height, className);
      addText(
        x + width / 2,
        y + height / 2,
        String(value),
        "value",
        "middle"
      );
    }

    try {
      addText(
        3,
        5.5,
        "Исходный ряд",
        "section-label",
        "start"
      );

      data.series.forEach((value, index) => {
        const x = 21 + index * 10;
        addCell(x, 2, 8, 7, value, "series-cell");

        if (index < data.series.length - 1) {
          addArrow(x + 8.4, 5.5, x + 9.6, 5.5);
        }
      });

      addText(
        72,
        4.7,
        "одна цепочка",
        "small-label",
        "start"
      );
      addText(
        72,
        6.5,
        "из пяти значений",
        "small-label",
        "start"
      );

      addText(
        3,
        13,
        "Три положения окна",
        "section-label",
        "start"
      );

      addText(
        59,
        13,
        "Три учебные строки",
        "section-label",
        "start"
      );

      addBracket(59, 80, 15.2, "feature-bracket");
      addBracket(81, 92, 15.2, "target-bracket");

      addText(
        69.5,
        14.1,
        "X — признаки",
        "group-feature",
        "middle"
      );
      addText(
        86.5,
        14.1,
        "y — цель",
        "group-target",
        "middle"
      );

      const tableX = [59, 70, 81];

      data.columns.forEach((column, index) => {
        const cellClass = index < data.columns.length - 1
          ? "header-feature"
          : "header-target";

        addRect(tableX[index], 16, 11, 4, cellClass);
        addTwoLineText(
          tableX[index] + 5.5,
          18,
          column,
          data.explanations[index],
          "column-name",
          "column-help",
          "middle"
        );
      });

      addText(
        47,
        18,
        "каждое окно",
        "small-label",
        "middle"
      );
      addText(
        47,
        19.4,
        "становится строкой",
        "small-label",
        "middle"
      );

      const windowX = [18, 27, 36];
      const rowY = [20.5, 26.7, 32.9];

      data.rows.forEach((row, rowIndex) => {
        const y = rowY[rowIndex];

        addText(
          15.2,
          y + 2.5,
          data.rowLabels[rowIndex],
          "row-label",
          "end"
        );

        row.forEach((value, columnIndex) => {
          const cellClass = columnIndex < row.length - 1
            ? "feature-cell"
            : "target-cell";

          addCell(
            windowX[columnIndex],
            y,
            8,
            5,
            value,
            cellClass
          );

          addCell(
            tableX[columnIndex],
            y,
            11,
            5,
            value,
            cellClass
          );
        });

        addArrow(45, y + 2.5, 56.5, y + 2.5);
      });

      addDownArrow(16.5, 24.9, 27.1);
      addDownArrow(16.5, 31.1, 33.3);

      addRect(18, 40.2, 2.2, 2.2, "feature-cell");
      addText(
        21.3,
        41.3,
        "история: lag_2 и lag_1 → X",
        "legend-label",
        "start"
      );

      addRect(57, 40.2, 2.2, 2.2, "target-cell");
      addText(
        60.3,
        41.3,
        "следующее значение: target → y",
        "legend-label",
        "start"
      );
    } catch (error) {
      diagram.replaceChildren();

      const firstLine = document.createElementNS(svgNS, "text");
      firstLine.setAttribute("x", String(sx(5)));
      firstLine.setAttribute("y", String(sy(18)));
      firstLine.setAttribute("class", "fallback");
      firstLine.textContent =
        "Схема должна была показать преобразование ряда";

      const secondLine = document.createElementNS(svgNS, "text");
      secondLine.setAttribute("x", String(sx(5)));
      secondLine.setAttribute("y", String(sy(22)));
      secondLine.setAttribute("class", "fallback");
      secondLine.textContent =
        "[10, 12, 14, 13, 15] в три строки lag_2, lag_1 и target.";

      diagram.append(firstLine, secondLine);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
