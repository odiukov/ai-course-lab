<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три островка обучающего сигнала</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #637083;
      --line: #9aa7b8;
      --user-fill: #e8edf4;
      --user-stroke: #75859a;
      --assistant-fill: #dff3e8;
      --assistant-stroke: #23845a;
      --zero-fill: #eef1f5;
      --zero-text: #657286;
      --one-fill: #2d9368;
      --one-text: #ffffff;
      --rail: #506078;
      --shadow: rgba(23, 32, 51, .10);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182131;
        --ink: #edf3fb;
        --muted: #a9b5c7;
        --line: #637188;
        --user-fill: #273246;
        --user-stroke: #8493aa;
        --assistant-fill: #173d31;
        --assistant-stroke: #62d3a2;
        --zero-fill: #293345;
        --zero-text: #c0cad8;
        --one-fill: #42a879;
        --one-text: #081c14;
        --rail: #9eabc0;
        --shadow: rgba(0, 0, 0, .28);
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 18px;
    }

    figure {
      width: min(100%, 1260px);
      margin: 0 auto;
      padding: 16px 18px 18px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 5px 20px var(--shadow);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.2;
      text-align: center;
      letter-spacing: .01em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      overflow: visible;
      background: var(--panel);
    }

    [hidden] {
      display: none;
    }

    #fallback {
      margin: 12px;
      padding: 16px;
      color: var(--ink);
      background: var(--user-fill);
      border: 1px solid var(--user-stroke);
      border-radius: 9px;
      font-size: 16px;
      line-height: 1.45;
    }

    .context-line,
    .context-tick {
      stroke: var(--rail);
      fill: none;
      stroke-linecap: round;
    }

    .context-dot {
      fill: var(--rail);
    }

    .turn-user {
      fill: var(--user-fill);
      stroke: var(--user-stroke);
    }

    .turn-assistant {
      fill: var(--assistant-fill);
      stroke: var(--assistant-stroke);
    }

    .token-divider {
      stroke: var(--line);
    }

    .mask-zero {
      fill: var(--zero-fill);
      stroke: var(--line);
    }

    .mask-one {
      fill: var(--one-fill);
      stroke: var(--assistant-stroke);
    }

    .signal-line {
      stroke: var(--assistant-stroke);
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .label {
      fill: var(--ink);
    }

    .label-muted {
      fill: var(--muted);
    }

    .label-signal {
      fill: var(--assistant-stroke);
    }

    .mask-zero-text {
      fill: var(--zero-text);
    }

    .mask-one-text {
      fill: var(--one-text);
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Три островка обучающего сигнала</h1>

    <svg
      id="diagram"
      viewBox="0 0 1260 430"
      width="1260"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description">
      <title id="svg-title">Маска многоходового диалога</title>
      <desc id="svg-description">
        Шесть последовательных реплик образуют непрерывный контекст.
        Нули маски стоят на вопросах пользователя, а единицы образуют
        три отдельных участка на ответах ассистента.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать непрерывный диалог из трёх обменов:
      вопросы пользователя имеют маску 0, а ответы ассистента образуют
      три отдельных участка маски 1.
    </p>
  </figure>

  <script>
    const DATA = Object.freeze([
      Object.freeze({
        canvasWidth: 1260,
        canvasHeight: 430,
        left: 82,
        right: 1178,
        contextTextY: 24,
        contextLineY: 43,
        contextTickTop: 37,
        contextTickBottom: 49,
        turnLabelY: 72,
        turnTop: 84,
        turnHeight: 72,
        maskHeadingY: 187,
        maskTop: 203,
        maskHeight: 52,
        islandTop: 271,
        islandBottom: 279,
        islandLabelY: 301,
        railY: 332,
        railTextY: 357,
        legendY: 397,
        legendBoxSize: 25,
        legendLeft: 178,
        legendRight: 676,
        legendTextGap: 14,
        cellWidth: 56,
        turnGap: 14,
        cornerRadius: 8,
        lineWidth: 2,
        dividerWidth: 1,
        headingFont: 17,
        labelFont: 15,
        roleFont: 17,
        maskFont: 20,
        legendFont: 15,
        dotRadius: 5
      }),
      Object.freeze({
        kind: "user",
        label: "вопрос 1",
        role: "пользователь",
        value: "0",
        tokens: 3
      }),
      Object.freeze({
        kind: "assistant",
        label: "ответ 1",
        role: "ассистент",
        value: "1",
        tokens: 3,
        island: "островок 1"
      }),
      Object.freeze({
        kind: "user",
        label: "вопрос 2",
        role: "пользователь",
        value: "0",
        tokens: 3
      }),
      Object.freeze({
        kind: "assistant",
        label: "ответ 2",
        role: "ассистент",
        value: "1",
        tokens: 3,
        island: "островок 2"
      }),
      Object.freeze({
        kind: "user",
        label: "вопрос 3",
        role: "пользователь",
        value: "0",
        tokens: 3
      }),
      Object.freeze({
        kind: "assistant",
        label: "ответ 3",
        role: "ассистент",
        value: "1",
        tokens: 3,
        island: "островок 3"
      })
    ]);

    const ORIGIN = Object.freeze({ x: 0, y: 0 });
    const SCALE = Object.freeze({ x: 1, y: 1 });

    const sx = x => ORIGIN.x + x * SCALE.x;
    const sy = y => ORIGIN.y + y * SCALE.y;

    const LABEL_PAD = 8;

    try {
      const [layout, ...turns] = DATA;
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      const node = (name, attributes = {}, content = "") => {
        const element = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          element.setAttribute(key, String(value));
        }
        if (content) element.textContent = content;
        return element;
      };

      const addText = ({
        x,
        y,
        text,
        className,
        size,
        anchor = "middle",
        weight = "normal",
        baseline = "auto"
      }) => {
        const element = node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "font-size": size,
          "font-weight": weight,
          "text-anchor": anchor,
          "dominant-baseline": baseline
        }, text);
        svg.appendChild(element);
        return element;
      };

      const addLine = ({
        x1,
        y1,
        x2,
        y2,
        className,
        width
      }) => {
        const element = node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className,
          "stroke-width": width
        });
        svg.appendChild(element);
        return element;
      };

      const addRect = ({
        x,
        y,
        width,
        height,
        className,
        radius,
        lineWidth
      }) => {
        const element = node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          rx: sx(radius) - sx(0),
          ry: sy(radius) - sy(0),
          class: className,
          "stroke-width": lineWidth
        });
        svg.appendChild(element);
        return element;
      };

      const addCircle = ({
        x,
        y,
        radius,
        className
      }) => {
        const element = node("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(radius) - sx(0),
          class: className
        });
        svg.appendChild(element);
        return element;
      };

      const totalCells = turns.reduce(
        (sum, turn) => sum + turn.tokens,
        ORIGIN.x
      );
      const totalWidth =
        totalCells * layout.cellWidth +
        (turns.length - SCALE.x) * layout.turnGap;
      const startX =
        (layout.canvasWidth - totalWidth) / (SCALE.x + SCALE.x);
      const endX = startX + totalWidth;
      const middleX =
        (startX + endX) / (SCALE.x + SCALE.x);

      addText({
        x: middleX,
        y: layout.contextTextY,
        text: "Весь диалог остаётся в контексте",
        className: "label",
        size: layout.headingFont,
        weight: "600"
      });

      addLine({
        x1: startX,
        y1: layout.contextLineY,
        x2: endX,
        y2: layout.contextLineY,
        className: "context-line",
        width: layout.lineWidth
      });

      addLine({
        x1: startX,
        y1: layout.contextTickTop,
        x2: startX,
        y2: layout.contextTickBottom,
        className: "context-tick",
        width: layout.lineWidth
      });

      addLine({
        x1: endX,
        y1: layout.contextTickTop,
        x2: endX,
        y2: layout.contextTickBottom,
        className: "context-tick",
        width: layout.lineWidth
      });

      let cursor = startX;
      const placedTurns = [];

      for (const turn of turns) {
        const turnWidth = turn.tokens * layout.cellWidth;
        const center = cursor + turnWidth / (SCALE.x + SCALE.x);

        placedTurns.push({
          ...turn,
          x: cursor,
          width: turnWidth,
          center
        });

        addText({
          x: center,
          y: layout.turnLabelY,
          text: turn.label,
          className: turn.kind === "assistant"
            ? "label-signal"
            : "label-muted",
          size: layout.labelFont,
          weight: "600"
        });

        addRect({
          x: cursor,
          y: layout.turnTop,
          width: turnWidth,
          height: layout.turnHeight,
          className: turn.kind === "assistant"
            ? "turn-assistant"
            : "turn-user",
          radius: layout.cornerRadius,
          lineWidth: layout.lineWidth
        });

        for (
          let divider = SCALE.x;
          divider < turn.tokens;
          divider += SCALE.x
        ) {
          const dividerX = cursor + divider * layout.cellWidth;

          addLine({
            x1: dividerX,
            y1: layout.turnTop,
            x2: dividerX,
            y2: layout.turnTop + layout.turnHeight,
            className: "token-divider",
            width: layout.dividerWidth
          });
        }

        addText({
          x: center,
          y: layout.turnTop +
            layout.turnHeight / (SCALE.y + SCALE.y),
          text: turn.role,
          className: "label",
          size: layout.roleFont,
          weight: "600",
          baseline: "middle"
        });

        cursor += turnWidth + layout.turnGap;
      }

      addText({
        x: startX,
        y: layout.maskHeadingY,
        text: "Маска потерь: 0 на вопросах, 1 на ответах",
        className: "label",
        size: layout.headingFont,
        anchor: "start",
        weight: "600"
      });

      for (const turn of placedTurns) {
        for (
          let token = ORIGIN.x;
          token < turn.tokens;
          token += SCALE.x
        ) {
          const cellX = turn.x + token * layout.cellWidth;

          addRect({
            x: cellX,
            y: layout.maskTop,
            width: layout.cellWidth,
            height: layout.maskHeight,
            className: turn.kind === "assistant"
              ? "mask-one"
              : "mask-zero",
            radius: layout.cornerRadius,
            lineWidth: layout.dividerWidth
          });

          addText({
            x: cellX +
              layout.cellWidth / (SCALE.x + SCALE.x),
            y: layout.maskTop +
              layout.maskHeight / (SCALE.y + SCALE.y),
            text: turn.value,
            className: turn.kind === "assistant"
              ? "mask-one-text"
              : "mask-zero-text",
            size: layout.maskFont,
            weight: "700",
            baseline: "middle"
          });
        }

        if (turn.kind === "assistant") {
          addLine({
            x1: turn.x,
            y1: layout.islandTop,
            x2: turn.x,
            y2: layout.islandBottom,
            className: "signal-line",
            width: layout.lineWidth
          });

          addLine({
            x1: turn.x,
            y1: layout.islandBottom,
            x2: turn.x + turn.width,
            y2: layout.islandBottom,
            className: "signal-line",
            width: layout.lineWidth
          });

          addLine({
            x1: turn.x + turn.width,
            y1: layout.islandBottom,
            x2: turn.x + turn.width,
            y2: layout.islandTop,
            className: "signal-line",
            width: layout.lineWidth
          });

          addText({
            x: turn.center,
            y: layout.islandLabelY,
            text: turn.island,
            className: "label-signal",
            size: layout.labelFont,
            weight: "600"
          });
        }
      }

      addLine({
        x1: startX,
        y1: layout.railY,
        x2: endX,
        y2: layout.railY,
        className: "context-line",
        width: layout.lineWidth
      });

      addCircle({
        x: startX,
        y: layout.railY,
        radius: layout.dotRadius,
        className: "context-dot"
      });

      addCircle({
        x: endX,
        y: layout.railY,
        radius: layout.dotRadius,
        className: "context-dot"
      });

      addText({
        x: middleX,
        y: layout.railTextY,
        text: "Контекст непрерывен — обучающий сигнал прерывается",
        className: "label",
        size: layout.headingFont,
        weight: "600"
      });

      addRect({
        x: layout.legendLeft,
        y: layout.legendY -
          layout.legendBoxSize / (SCALE.y + SCALE.y),
        width: layout.legendBoxSize,
        height: layout.legendBoxSize,
        className: "mask-zero",
        radius: layout.cornerRadius,
        lineWidth: layout.dividerWidth
      });

      addText({
        x: layout.legendLeft +
          layout.legendBoxSize / (SCALE.x + SCALE.x),
        y: layout.legendY,
        text: "0",
        className: "mask-zero-text",
        size: layout.labelFont,
        weight: "700",
        baseline: "middle"
      });

      addText({
        x: layout.legendLeft +
          layout.legendBoxSize + layout.legendTextGap,
        y: layout.legendY + LABEL_PAD / (SCALE.y + SCALE.y),
        text: "вопрос виден, но не создаёт обучающий сигнал",
        className: "label-muted",
        size: layout.legendFont,
        anchor: "start"
      });

      addRect({
        x: layout.legendRight,
        y: layout.legendY -
          layout.legendBoxSize / (SCALE.y + SCALE.y),
        width: layout.legendBoxSize,
        height: layout.legendBoxSize,
        className: "mask-one",
        radius: layout.cornerRadius,
        lineWidth: layout.dividerWidth
      });

      addText({
        x: layout.legendRight +
          layout.legendBoxSize / (SCALE.x + SCALE.x),
        y: layout.legendY,
        text: "1",
        className: "mask-one-text",
        size: layout.labelFont,
        weight: "700",
        baseline: "middle"
      });

      addText({
        x: layout.legendRight +
          layout.legendBoxSize + layout.legendTextGap,
        y: layout.legendY + LABEL_PAD / (SCALE.y + SCALE.y),
        text: "токен ответа создаёт обучающий сигнал",
        className: "label-signal",
        size: layout.legendFont,
        anchor: "start"
      });

      fallback.hidden = true;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      document.getElementById("diagram").setAttribute("hidden", "");
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
