<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Цепочка из трёх вызовов</title>
<style>
  :root{
    --bg:#fbfaf8; --ink:#1d2026; --muted:#5c6472; --line:#39414f;
    --box:#eef2f8; --boxbd:#4a5costs; --boxbd:#41546e; --gate:#fdf3e0; --gatebd:#b07b1e;
    --stop:#a33a2a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --ink:#e9ecf1; --muted:#9aa4b4; --line:#8b97a8;
      --box:#1e2530; --boxbd:#7c93b0; --gate:#2a2419; --gatebd:#d8a441;
      --stop:#e08a76;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
  .wrap{max-width:100%;padding:10px 12px 14px;box-sizing:border-box}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fig{max-height:520px}
  .lbl{fill:var(--ink)}
  .mut{fill:var(--muted)}
  .bad{fill:var(--stop)}
  .ln{stroke:var(--line);fill:none}
  .hd{fill:var(--line);stroke:none}
  .lnbad{stroke:var(--stop);fill:none}
  .hdbad{fill:var(--stop);stroke:none}
  .box{fill:var(--box);stroke:var(--boxbd)}
  .gt{fill:var(--gate);stroke:var(--gatebd)}
  .fallback{color:var(--muted);font-size:13px}
</style>
<div class="wrap">
  <h2>Три вызова, две проверки: содержание живёт в стрелках</h2>
  <div id="host" class="fig"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* --- данные схемы --- */
    var data={
      blocks:[
        {x:1, t:'Вызов 1', s:'план'},
        {x:5, t:'Вызов 2', s:'разбор'},
        {x:9, t:'Вызов 3', s:'текст'}
      ],
      gates:[
        {x:3, cond:'if: 5 пунктов?', stop:'2-й и 3-й вызовы не случатся'},
        {x:7, cond:'if: формат ок?', stop:'3-й вызов не случится'}
      ],
      bw:0.9, bh:0.42, gw:0.5, gh:0.5,
      lane:0, arrLbl:0.12,
      brLine:0.95, brTick:0.88, cap:1.05,
      failFrom:-0.5, failTo:-1.0, failLbl:-0.78, stopY:-1.15, legY:-1.5,
      caption:'всегда 3 вызова', edge:'строка', pass:'ок', fail:'нет',
      legend:'Ромбик — обычный if на питоне: ноль токенов, микросекунды. Стрелки идут только вперёд.'
    };
    /* --- одна пара функций перевода --- */
    var origin={x:70,y:150}, scale=88;
    function sx(x){return origin.x+x*scale;}
    function sy(y){return origin.y-y*scale;}
    function len(u){return sx(u)-sx(0);}

    var PAD=8, SW=1.6, FS=13, FS_S=11.5;
    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 960 320');
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,a,cls){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]); if(cls)e.setAttribute('class',cls);
      svg.appendChild(e); return e;}
    function txt(x,y,s,anchor,cls,fs){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,'font-size':fs||FS},cls);
      t.textContent=s; return t;}
    function line(x1,y1,x2,y2,cls){
      el('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),
        'stroke-width':SW,'stroke-linecap':'round'},cls||'ln');}
    function arrow(x1,y1,x2,y2,bad){
      var ax=sx(x1),ay=sy(y1),bx=sx(x2),by=sy(y2);
      var dx=bx-ax,dy=by-ay,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
      var hl=len(0.17),hw=len(0.075);
      var tx=bx-ux*hl, ty=by-uy*hl;
      el('line',{x1:ax,y1:ay,x2:tx,y2:ty,'stroke-width':SW,
        'stroke-linecap':'round'}, bad?'lnbad':'ln');
      el('polygon',{points:[bx+','+by,
        (tx-uy*hw)+','+(ty+ux*hw),
        (tx+uy*hw)+','+(ty-ux*hw)].join(' ')}, bad?'hdbad':'hd');
    }

    /* фон */
    el('rect',{x:0,y:0,width:960,height:320,fill:'var(--bg)'});

    /* блоки вызовов */
    data.blocks.forEach(function(b){
      el('rect',{x:sx(b.x-data.bw), y:sy(data.bh),
        width:len(2*data.bw), height:sy(-data.bh)-sy(data.bh),
        rx:len(0.08),'stroke-width':SW},'box');
      txt(sx(b.x), sy(0.06), b.t,'middle','lbl',FS);
      txt(sx(b.x), sy(-0.2), b.s,'middle','mut',FS_S);
    });

    /* ромбики-проверки */
    data.gates.forEach(function(g){
      el('polygon',{points:[
        sx(g.x)+','+sy(data.gh),
        sx(g.x+data.gw)+','+sy(data.lane),
        sx(g.x)+','+sy(-data.gh),
        sx(g.x-data.gw)+','+sy(data.lane)].join(' '),
        'stroke-width':SW},'gt');
      txt(sx(g.x), sy(data.gh)-PAD, g.cond,'middle','lbl',FS_S);
      /* ветка «нет» вниз */
      arrow(g.x, data.failFrom, g.x, data.failTo, true);
      txt(sx(g.x)+PAD, sy(data.failLbl), data.fail,'start','bad',FS_S);
      txt(sx(g.x), sy(data.stopY), g.stop,'middle','bad',FS_S)
        .setAttribute('dominant-baseline','hanging');
    });

    /* стрелки вперёд: блок → ромбик → блок */
    for(var i=0;i<data.gates.length;i++){
      var a=data.blocks[i].x+data.bw, g=data.gates[i].x, b=data.blocks[i+1].x-data.bw;
      arrow(a, data.lane, g-data.gw, data.lane, false);
      txt(sx((a+g-data.gw)/2), sy(data.lane)-PAD, data.edge,'middle','mut',FS_S);
      arrow(g+data.gw, data.lane, b, data.lane, false);
      txt(sx((g+data.gw+b)/2), sy(data.lane)-PAD, data.pass,'middle','mut',FS_S);
    }

    /* подпись «всегда 3 вызова» на скобке */
    var l=data.blocks[0].x, r=data.blocks[data.blocks.length-1].x;
    line(l,data.brLine,r,data.brLine);
    line(l,data.brLine,l,data.brTick);
    line(r,data.brLine,r,data.brTick);
    txt(sx((l+r)/2), sy(data.cap)-PAD, data.caption,'middle','lbl',FS);

    /* легенда */
    txt(sx(0.2), sy(data.legY), data.legend,'start','mut',FS_S)
      .setAttribute('dominant-baseline','hanging');

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fallback">Схема должна показывать: три блока вызовов '+
      'модели подряд («Вызов 1 — план», «Вызов 2», «Вызов 3»); выход первого идёт '+
      'стрелкой на вход второго, выход второго — на вход третьего, и по стрелке '+
      'передаётся только строка. Между блоками — ромбики программных проверок '+
      '(«if: 5 пунктов?»); ветка «нет» уводит вниз в остановку, и следующие вызовы '+
      'не случаются. Все стрелки идут только вперёд. Общая подпись сверху: '+
      '«всегда 3 вызова».</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
