<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Матрица результатов: режим и сложность</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f6f8fb;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#59657a;
  --line:#cbd3df;
  --header:#e9eef6;
  --same-bg:#edf3ff;
  --same-line:#7898d5;
  --up-bg:#e5f7ed;
  --up-line:#3e9b69;
  --down-bg:#fff0e8;
  --down-line:#d47746;
  --easy-bg:#f0f7f3;
  --easy-line:#69a184;
  --hard-bg:#f5effc;
  --hard-line:#9570bd;
  --accent:#516b9d;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#10141d;
    --panel:#171d28;
    --ink:#eef3fb;
    --muted:#abb6c8;
    --line:#3d485b;
    --header:#222c3b;
    --same-bg:#1c2a43;
    --same-line:#7898d5;
    --up-bg:#173629;
    --up-line:#58b77e;
    --down-bg:#40271f;
    --down-line:#e18a5f;
    --easy-bg:#1d3028;
    --easy-line:#78b395;
    --hard-bg:#30243f;
    --hard-line:#ac85d2;
    --accent:#9db6e8;
  }
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{margin:0;padding:12px;font-family:Inter,Segoe UI,Arial,sans-serif}
main{max-width:1200px;margin:auto}
h1{margin:0 0 8px;font-size:21px;line-height:1.2}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:458px;
  background:var(--panel);
  border:1px solid var(--line);
}
.frame,.cell,.band,.arrow{
  vector-effect:non-scaling-stroke;
  stroke-width:1.5;
  stroke-linejoin:round;
}
.frame{fill:var(--panel);stroke:var(--line)}
.header{fill:var(--header);stroke:var(--line)}
.cell{stroke:var(--line)}
.same-cell{fill:var(--panel)}
.down-cell{fill:var(--down-bg)}
.up-cell{fill:var(--up-bg)}
.band{stroke-width:1.5}
.same-band{fill:var(--same-bg);stroke:var(--same-line)}
.up-band{fill:var(--up-bg);stroke:var(--up-line)}
.down-band{fill:var(--down-bg);stroke:var(--down-line)}
.easy-band{fill:var(--easy-bg);stroke:var(--easy-line)}
.hard-band{fill:var(--hard-bg);stroke:var(--hard-line)}
text{fill:var(--ink)}
.corner{font-size:12px;font-weight:bold;fill:var(--muted)}
.mode{font-size:17px;font-weight:bold;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.row-title{font-size:15px;font-weight:bold}
.row-note{font-size:12px;fill:var(--muted)}
.cell-title{font-size:13px;font-weight:bold;fill:var(--muted)}
.metric{font-size:11px;font-weight:bold;fill:var(--muted)}
.value{font-size:15px;font-weight:bold}
.note{font-size:12px;fill:var(--muted)}
.footer-main{font-size:14px;font-weight:bold;fill:var(--accent)}
.footer-note{font-size:13px;fill:var(--muted)}
.arrow{fill:none;stroke:var(--accent);stroke-width:2}
.arrow-head{fill:var(--accent);stroke:none}
.fallback{font-size:15px;fill:var(--ink)}
</style>
</head>
<body>
<main>
<h1 id="diagram-title">Матрица результатов: режим × сложность задачи</h1>
<svg id="diagram" viewBox="0 0 1200 458" width="1200" height="458"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="diagram-title diagram-description">
  <desc id="diagram-description">Сопоставление качества результата и простоты аудита для fixed-workflow и free-decomposition на простой и трудной задачах.</desc>
</svg>
</main>
<script>
const data=[
  {
    boxes:[
      {x0:0,y0:0,x1:1080,y1:364,c:"frame"},
      {x0:0,y0:0,x1:210,y1:62,c:"header"},
      {x0:220,y0:0,x1:640,y1:62,c:"header"},
      {x0:660,y0:0,x1:1080,y1:62,c:"header"},
      {x0:0,y0:72,x1:210,y1:214,c:"header"},
      {x0:0,y0:222,x1:210,y1:364,c:"header"}
    ],
    texts:[
      {x:105,y:31,t:"КЛАСС СЛОЖНОСТИ",c:"corner",a:"middle"},
      {x:430,y:31,t:"fixed-workflow",c:"mode",a:"middle"},
      {x:870,y:31,t:"free-decomposition",c:"mode",a:"middle"},
      {x:18,y:126,t:"ПРОСТАЯ ЗАДАЧА",c:"row-title",a:"start"},
      {x:18,y:151,t:"один очевидный путь",c:"row-note",a:"start"},
      {x:18,y:276,t:"ТРУДНАЯ ЗАДАЧА",c:"row-title",a:"start"},
      {x:18,y:301,t:"план приходится менять",c:"row-note",a:"start"},
      {x:540,y:393,t:"Сравнивай соседние ячейки внутри одной строки",c:"footer-main",a:"middle"},
      {x:540,y:422,t:"Качество результата и простота аудита — разные измерения",c:"footer-note",a:"middle"}
    ],
    arrows:[
      {y:143,x0:646,x1:654,l:[{x:646,y:143},{x:651,y:139},{x:651,y:147}],r:[{x:654,y:143},{x:649,y:139},{x:649,y:147}]},
      {y:293,x0:646,x1:654,l:[{x:646,y:293},{x:651,y:289},{x:651,y:297}],r:[{x:654,y:293},{x:649,y:289},{x:649,y:297}]}
    ],
    fallback:[
      {x:40,y:190,t:"Схема должна показать матрицу режимов и сложности задач.",c:"fallback",a:"start"},
      {x:40,y:225,t:"В каждой ячейке сопоставляются качество результата и простота аудита.",c:"fallback",a:"start"}
    ]
  },
  {
    box:{x0:220,y0:72,x1:640,y1:214,c:"cell same-cell"},
    title:{x:240,y:91,t:"РУТИНА ПО ГОТОВОМУ СЦЕНАРИЮ",c:"cell-title",a:"start"},
    bands:[
      {box:{x0:240,y0:104,x1:620,y1:154,c:"band same-band"},
       label:{x:254,y:119,t:"КАЧЕСТВО",c:"metric",a:"start"},
       value:{x:606,y:119,t:"Вровень или быстрее",c:"value",a:"end"},
       note:{x:254,y:141,t:"Путь уже известен, шаги не тратятся на выбор",c:"note",a:"start"}},
      {box:{x0:240,y0:161,x1:620,y1:205,c:"band easy-band"},
       label:{x:254,y:175,t:"АУДИТ",c:"metric",a:"start"},
       value:{x:606,y:175,t:"Проще",c:"value",a:"end"},
       note:{x:254,y:195,t:"Предписанная цепочка действий",c:"note",a:"start"}}
    ]
  },
  {
    box:{x0:660,y0:72,x1:1080,y1:214,c:"cell same-cell"},
    title:{x:680,y:91,t:"СВОБОДНЫЙ ВЫБОР НА РУТИНЕ",c:"cell-title",a:"start"},
    bands:[
      {box:{x0:680,y0:104,x1:1060,y1:154,c:"band same-band"},
       label:{x:694,y:119,t:"КАЧЕСТВО",c:"metric",a:"start"},
       value:{x:1046,y:119,t:"Вровень",c:"value",a:"end"},
       note:{x:694,y:141,t:"Часть шагов уходит на выбор и распределение",c:"note",a:"start"}},
      {box:{x0:680,y0:161,x1:1060,y1:205,c:"band hard-band"},
       label:{x:694,y:175,t:"АУДИТ",c:"metric",a:"start"},
       value:{x:1046,y:175,t:"Труднее",c:"value",a:"end"},
       note:{x:694,y:195,t:"Нужно проверить дополнительные решения",c:"note",a:"start"}}
    ]
  },
  {
    box:{x0:220,y0:222,x1:640,y1:364,c:"cell down-cell"},
    title:{x:240,y:241,t:"ЖЁСТКИЙ ПЛАН НА СЛОЖНОЙ ЗАДАЧЕ",c:"cell-title",a:"start"},
    bands:[
      {box:{x0:240,y0:254,x1:620,y1:304,c:"band down-band"},
       label:{x:254,y:269,t:"КАЧЕСТВО",c:"metric",a:"start"},
       value:{x:606,y:269,t:"Уступает",c:"value",a:"end"},
       note:{x:254,y:291,t:"План нельзя перестроить под новые условия",c:"note",a:"start"}},
      {box:{x0:240,y0:311,x1:620,y1:355,c:"band easy-band"},
       label:{x:254,y:325,t:"АУДИТ",c:"metric",a:"start"},
       value:{x:606,y:325,t:"Проще",c:"value",a:"end"},
       note:{x:254,y:345,t:"Заданная цепочка действий",c:"note",a:"start"}}
    ]
  },
  {
    box:{x0:660,y0:222,x1:1080,y1:364,c:"cell up-cell"},
    title:{x:680,y:241,t:"АДАПТИВНЫЙ ПЛАН И ПОДЗАДАЧИ",c:"cell-title",a:"start"},
    bands:[
      {box:{x0:680,y0:254,x1:1060,y1:304,c:"band up-band"},
       label:{x:694,y:269,t:"КАЧЕСТВО",c:"metric",a:"start"},
       value:{x:1046,y:269,t:"Заметное преимущество",c:"value",a:"end"},
       note:{x:694,y:291,t:"План перестраивается, подзадачи выделяются",c:"note",a:"start"}},
      {box:{x0:680,y0:311,x1:1060,y1:355,c:"band hard-band"},
       label:{x:694,y:325,t:"АУДИТ",c:"metric",a:"start"},
       value:{x:1046,y:325,t:"Труднее",c:"value",a:"end"},
       note:{x:694,y:345,t:"Перестройку и делегирование нужно проверить",c:"note",a:"start"}}
    ]
  }
];
const origin=Object.freeze({x:28,y:12});
const scale=1.04;
const sx=x=>origin.x+x*scale;
const sy=y=>origin.y+y*scale;

const svg=document.getElementById("diagram");
const [layout,...cells]=data;

function make(tag,attrs,text){
  const node=document.createElementNS(svg.namespaceURI,tag);
  for(const [name,value] of Object.entries(attrs))node.setAttribute(name,String(value));
  if(text!==undefined)node.textContent=text;
  return node;
}
function box(spec){
  const d=`M ${sx(spec.x0)} ${sy(spec.y0)} L ${sx(spec.x1)} ${sy(spec.y0)} L ${sx(spec.x1)} ${sy(spec.y1)} L ${sx(spec.x0)} ${sy(spec.y1)} Z`;
  svg.append(make("path",{d,class:spec.c}));
}
function label(spec){
  svg.append(make("text",{
    x:sx(spec.x),y:sy(spec.y),class:spec.c,
    "text-anchor":spec.a,"dominant-baseline":"middle"
  },spec.t));
}
function triangle(points){
  const [tip,upper,lower]=points;
  const d=`M ${sx(tip.x)} ${sy(tip.y)} L ${sx(upper.x)} ${sy(upper.y)} L ${sx(lower.x)} ${sy(lower.y)} Z`;
  svg.append(make("path",{d,class:"arrow-head"}));
}
function arrow(spec){
  const d=`M ${sx(spec.x0)} ${sy(spec.y)} L ${sx(spec.x1)} ${sy(spec.y)}`;
  svg.append(make("path",{d,class:"arrow"}));
  triangle(spec.l);
  triangle(spec.r);
}

try{
  for(const item of layout.boxes)box(item);
  for(const cell of cells){
    box(cell.box);
    label(cell.title);
    for(const band of cell.bands){
      box(band.box);
      label(band.label);
      label(band.value);
      label(band.note);
    }
  }
  for(const item of layout.arrows)arrow(item);
  for(const item of layout.texts)label(item);
}catch(error){
  svg.replaceChildren();
  for(const item of layout.fallback)label(item);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
