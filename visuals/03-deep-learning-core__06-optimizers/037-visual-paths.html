<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сравнение траекторий SGD, momentum и Adam</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #657086;
      --valley: #64748b;
      --valley-fill: #dbe4f0;
      --guide: #a3afc2;
      --sgd: #e05161;
      --momentum: #2f74d0;
      --adam: #15966f;
      --minimum: #172033;
      --start: #f0a126;
      --border: #d6deea;
      --halo: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151f;
        --panel: #161d29;
        --ink: #edf2fa;
        --muted: #aab5c8;
        --valley: #9ba9bd;
        --valley-fill: #253247;
        --guide: #536177;
        --sgd: #ff7180;
        --momentum: #65a4ff;
        --adam: #44d5a4;
        --minimum: #f5f8fc;
        --start: #ffc45f;
        --border: #303b4e;
        --halo: #161d29;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      padding: 15px 22px 10px;
      font-size: 22px;
      line-height: 1.25;
      font-weight: 720;
      letter-spacing: -0.01em;
    }

    .subtitle {
      margin: 0;
      padding: 0 22px 7px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .contour {
      fill: var(--valley-fill);
      stroke: var(--valley);
    }

    .center-guide {
      fill: none;
      stroke: var(--guide);
      stroke-linecap: round;
    }

    .trajectory-halo {
      fill: none;
      stroke: var(--halo);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .trajectory {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .step-dot {
      stroke: var(--halo);
    }

    .anchor-ring {
      fill: var(--panel);
      stroke: var(--start);
    }

    .anchor-core {
      fill: var(--start);
    }

    .minimum-ring {
      fill: none;
      stroke: var(--minimum);
    }

    .minimum-core {
      fill: var(--minimum);
    }

    .annotation {
      fill: var(--ink);
      font-weight: 680;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-linejoin: round;
    }

    .annotation-note {
      fill: var(--muted);
      font-weight: 520;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-linejoin: round;
    }

    .legend-label {
      fill: var(--ink);
      font-weight: 650;
    }

    .legend-note {
      fill: var(--muted);
      font-weight: 480;
    }

    .fallback {
      fill: var(--ink);
      font-weight: 650;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title figure-subtitle">
    <h1 id="figure-title">Сравнение траекторий SGD, momentum и Adam</h1>
    <p class="subtitle" id="figure-subtitle">
      Одна узкая долина, одинаковые старт и минимум — различается форма движения.
    </p>
    <svg
      id="diagram"
      viewBox="0 0 1000 430"
      width="1000"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Три траектории спускаются по одной узкой долине: SGD движется зигзагом, momentum идёт плавнее, Adam выбирает короткий адаптивный путь к общему минимуму."
    ></svg>
  </figure>

  <script>
    const data = {
      valley: {
        center: [55, 29],
        angle: 22,
        contours: [
          { radius: [45, 11], opacity: 0.20, width: 0.16 },
          { radius: [39, 8], opacity: 0.17, width: 0.15 },
          { radius: [33, 5.5], opacity: 0.14, width: 0.14 },
          { radius: [27, 3.2], opacity: 0.11, width: 0.13 }
        ],
        guide: [[13.3, 12.1], [92, 43.9]]
      },
      start: {
        point: [14.2, 13.1],
        radius: 0.72,
        core: 0.29,
        width: 0.24,
        label: {
          point: [14.2, 13.1],
          dx: -13,
          dy: -12,
          anchor: "end",
          title: "одинаковый старт",
          note: "одна и та же точка"
        }
      },
      minimum: {
        point: [55, 29],
        radius: 1.18,
        core: 0.48,
        width: 0.25,
        label: {
          point: [55, 29],
          dx: 16,
          dy: 3,
          anchor: "start",
          title: "общий минимум",
          note: "цель всех путей"
        }
      },
      trajectories: [
        {
          key: "sgd",
          color: "var(--sgd)",
          width: 0.43,
          halo: 0.78,
          dotRadius: 0.29,
          pathType: "polyline",
          points: [
            [14.2, 13.1],
            [18.4, 19.1],
            [22.7, 11.5],
            [27.1, 21.5],
            [31.4, 14.8],
            [35.8, 24.8],
            [40.2, 18.7],
            [44.2, 27.7],
            [47.7, 23.1],
            [50.6, 30.5],
            [52.8, 26.7],
            [55, 29]
          ],
          dots: [
            [18.4, 19.1],
            [22.7, 11.5],
            [27.1, 21.5],
            [31.4, 14.8],
            [35.8, 24.8],
            [40.2, 18.7],
            [44.2, 27.7],
            [47.7, 23.1],
            [50.6, 30.5],
            [52.8, 26.7]
          ]
        },
        {
          key: "momentum",
          color: "var(--momentum)",
          width: 0.48,
          halo: 0.82,
          dotRadius: 0.31,
          pathType: "curve",
          segments: [
            { command: "M", points: [[14.2, 13.1]] },
            {
              command: "C",
              points: [[18.8, 16.6], [22.4, 19.4], [27.5, 18.7]]
            },
            {
              command: "C",
              points: [[33.1, 18], [36.1, 23.7], [41.3, 24.5]]
            },
            {
              command: "C",
              points: [[46.1, 25.3], [50.4, 28.2], [55, 29]]
            }
          ],
          dots: [
            [27.5, 18.7],
            [41.3, 24.5],
            [55, 29]
          ]
        },
        {
          key: "adam",
          color: "var(--adam)",
          width: 0.55,
          halo: 0.9,
          dotRadius: 0.34,
          pathType: "curve",
          segments: [
            { command: "M", points: [[14.2, 13.1]] },
            {
              command: "C",
              points: [[24.8, 14.2], [39.8, 24.1], [55, 29]]
            }
          ],
          dots: [
            [27.7, 17.3],
            [41.5, 24.8],
            [55, 29]
          ]
        }
      ],
      legend: [
        {
          color: "var(--sgd)",
          line: [[7, 61], [13, 61]],
          titlePoint: [14.5, 60.25],
          notePoint: [14.5, 63],
          title: "SGD",
          note: "реагирует на текущий толчок"
        },
        {
          color: "var(--momentum)",
          line: [[37, 61], [43, 61]],
          titlePoint: [44.5, 60.25],
          notePoint: [44.5, 63],
          title: "momentum",
          note: "сглаживает направление"
        },
        {
          color: "var(--adam)",
          line: [[68, 61], [74, 61]],
          titlePoint: [75.5, 60.25],
          notePoint: [75.5, 63],
          title: "Adam",
          note: "выравнивает масштаб шага"
        }
      ],
      styles: {
        guideWidth: 0.14,
        legendWidth: 0.52,
        legendDot: 0.31,
        annotationSize: 16,
        noteSize: 13,
        legendTitleSize: 16,
        legendNoteSize: 13,
        fallbackSize: 17,
        textStroke: 0.56
      },
      fallback: {
        point: [55, 31],
        text: "Схема должна была показать три разных пути к одному минимуму."
      }
    };

    const origin = { x: 60, y: 13 };
    const scale = { x: 8.55, y: 6.35 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (tag, attributes, parent = svg) => {
        const node = document.createElementNS(namespace, tag);
        Object.entries(attributes).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const polylinePath = points => {
        let first = true;
        return points.map(([x, y]) => {
          const command = first ? "M" : "L";
          first = false;
          return `${command} ${sx(x)} ${sy(y)}`;
        }).join(" ");
      };

      const curvePath = segments => segments.map(segment => {
        const coordinates = segment.points.map(([x, y]) =>
          `${sx(x)} ${sy(y)}`
        ).join(" ");
        return `${segment.command} ${coordinates}`;
      }).join(" ");

      const addText = (className, label, fontSize, strokeWidth) => {
        const [x, y] = label.point;
        const title = make("text", {
          class: className,
          x: sx(x),
          y: sy(y),
          dx: label.dx,
          dy: label.dy,
          "text-anchor": label.anchor,
          "font-size": fontSize,
          "stroke-width": strokeWidth
        });
        title.textContent = label.title;

        const note = make("text", {
          class: "annotation-note",
          x: sx(x),
          y: sy(y),
          dx: label.dx,
          dy: label.dy + data.styles.noteSize + label.dy / Math.abs(label.dy),
          "text-anchor": label.anchor,
          "font-size": data.styles.noteSize,
          "stroke-width": strokeWidth
        });
        note.textContent = label.note;
      };

      data.valley.contours.forEach(contour => {
        const [cx, cy] = data.valley.center;
        const [rx, ry] = contour.radius;
        make("ellipse", {
          class: "contour",
          cx: sx(cx),
          cy: sy(cy),
          rx: sx(rx) - sx(0),
          ry: sy(ry) - sy(0),
          transform: `rotate(${data.valley.angle} ${sx(cx)} ${sy(cy)})`,
          opacity: contour.opacity,
          "stroke-width": sx(contour.width) - sx(0)
        });
      });

      make("path", {
        class: "center-guide",
        d: polylinePath(data.valley.guide),
        "stroke-width": sx(data.styles.guideWidth) - sx(0),
        opacity: data.valley.contours[0].opacity
      });

      data.trajectories.forEach(trajectory => {
        const pathData = trajectory.pathType === "polyline"
          ? polylinePath(trajectory.points)
          : curvePath(trajectory.segments);

        make("path", {
          class: "trajectory-halo",
          d: pathData,
          "stroke-width": sx(trajectory.halo) - sx(0)
        });

        make("path", {
          class: `trajectory trajectory-${trajectory.key}`,
          d: pathData,
          stroke: trajectory.color,
          "stroke-width": sx(trajectory.width) - sx(0)
        });

        trajectory.dots.forEach(([x, y]) => {
          make("circle", {
            class: "step-dot",
            cx: sx(x),
            cy: sy(y),
            r: sx(trajectory.dotRadius) - sx(0),
            fill: trajectory.color,
            "stroke-width": sx(data.styles.guideWidth) - sx(0)
          });
        });
      });

      const [startX, startY] = data.start.point;
      make("circle", {
        class: "anchor-ring",
        cx: sx(startX),
        cy: sy(startY),
        r: sx(data.start.radius) - sx(0),
        "stroke-width": sx(data.start.width) - sx(0)
      });
      make("circle", {
        class: "anchor-core",
        cx: sx(startX),
        cy: sy(startY),
        r: sx(data.start.core) - sx(0)
      });

      const [minimumX, minimumY] = data.minimum.point;
      make("circle", {
        class: "minimum-ring",
        cx: sx(minimumX),
        cy: sy(minimumY),
        r: sx(data.minimum.radius) - sx(0),
        "stroke-width": sx(data.minimum.width) - sx(0)
      });
      make("circle", {
        class: "minimum-core",
        cx: sx(minimumX),
        cy: sy(minimumY),
        r: sx(data.minimum.core) - sx(0)
      });

      addText(
        "annotation",
        data.start.label,
        data.styles.annotationSize,
        sx(data.styles.textStroke) - sx(0)
      );
      addText(
        "annotation",
        data.minimum.label,
        data.styles.annotationSize,
        sx(data.styles.textStroke) - sx(0)
      );

      data.legend.forEach(item => {
        const [[x1, y1], [x2, y2]] = item.line;
        make("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          stroke: item.color,
          "stroke-width": sx(data.styles.legendWidth) - sx(0),
          "stroke-linecap": "round"
        });
        make("circle", {
          cx: sx(x2),
          cy: sy(y2),
          r: sx(data.styles.legendDot) - sx(0),
          fill: item.color
        });

        const [titleX, titleY] = item.titlePoint;
        const title = make("text", {
          class: "legend-label",
          x: sx(titleX),
          y: sy(titleY),
          "text-anchor": "start",
          "font-size": data.styles.legendTitleSize
        });
        title.textContent = item.title;

        const [noteX, noteY] = item.notePoint;
        const note = make("text", {
          class: "legend-note",
          x: sx(noteX),
          y: sy(noteY),
          "text-anchor": "start",
          "font-size": data.styles.legendNoteSize
        });
        note.textContent = item.note;
      });
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";
      const fallback = document.createElementNS(namespace, "text");
      const [x, y] = data.fallback.point;
      fallback.setAttribute("class", "fallback");
      fallback.setAttribute("x", String(sx(x)));
      fallback.setAttribute("y", String(sy(y)));
      fallback.setAttribute("text-anchor", "middle");
      fallback.setAttribute("font-size", String(data.styles.fallbackSize));
      fallback.textContent = data.fallback.text;
      svg.appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
