<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта способов оценки модели</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f6f8fc;
    --panel: #ffffff;
    --text: #172033;
    --muted: #59657a;
    --line: #8793a8;
    --bench: #3268d8;
    --bench-soft: #e8f0ff;
    --custom: #168866;
    --custom-soft: #e2f6ef;
    --human: #b94d6d;
    --human-soft: #fae8ee;
    --warn: #9b6500;
    --warn-soft: #fff3d4;
    --shadow: #d9deea;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111622;
      --panel: #1b2231;
      --text: #f2f5fb;
      --muted: #b8c1d2;
      --line: #7f8ba0;
      --bench: #78a7ff;
      --bench-soft: #20365d;
      --custom: #65d5ae;
      --custom-soft: #183f35;
      --human: #ff91b0;
      --human-soft: #512738;
      --warn: #ffd176;
      --warn-soft: #493b1f;
      --shadow: #090c13;
    }
  }

  html, body {
    background: var(--page);
    color: var(--text);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
  }

  figure {
    margin: auto;
    background: var(--panel);
    border-style: solid;
    border-width: 1px;
    border-color: var(--shadow);
    overflow: hidden;
  }

  figcaption {
    box-sizing: border-box;
    background: var(--panel);
    color: var(--text);
    font-size: 22px;
    font-weight: bold;
    text-align: center;
    padding: 12px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 460px;
    background: var(--panel);
  }

  .card {
    fill: var(--panel);
    stroke-width: 2px;
  }

  .bench-card { stroke: var(--bench); }
  .custom-card { stroke: var(--custom); }
  .human-card { stroke: var(--human); }

  .bench-fill { fill: var(--bench-soft); }
  .custom-fill { fill: var(--custom-soft); }
  .human-fill { fill: var(--human-soft); }
  .warn-fill { fill: var(--warn-soft); }

  .bench-ink { fill: var(--bench); }
  .custom-ink { fill: var(--custom); }
  .human-ink { fill: var(--human); }
  .warn-ink { fill: var(--warn); }

  .main-text { fill: var(--text); }
  .muted-text { fill: var(--muted); }

  .route {
    fill: none;
    stroke: var(--line);
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow-head { fill: var(--line); }
  .candidate { fill: var(--bench-soft); stroke: var(--bench); }
  .stage-title { font-weight: bold; }
  .small-caps { font-weight: bold; letter-spacing: .04em; }
</style>
</head>
<body>
<figure aria-labelledby="diagram-caption">
  <figcaption id="diagram-caption">Карта способов оценки модели</figcaption>
  <svg id="map" viewBox="0 0 1200 460" width="1200" height="460"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Последовательное сужение выбора модели</title>
    <desc id="svg-desc">Двадцать моделей проходят публичные бенчмарки,
      затем проверки на собственных данных, а спорные ответы финалистов
      оценивают люди. Точность сигнала и стоимость растут по маршруту.</desc>
  </svg>
</figure>

<script>
const data = [
  {
    origin: [0, 0],
    scale: 1,
    canvas: [0, 0, 1200, 460],
    cardRadius: 14,
    arrow: [13, 8],
    dotRadius: 7,
    sourceLabel: [100, 118],
    sourceArrow: [160, 238, 205, 238],
    flowY: 238,
    routes: [
      [465, 238, 535, 238, "убрать явно слабые", 478, 214, "start"],
      [820, 238, 895, 238, "только спорные случаи", 858, 272, "middle"]
    ],
    trends: [
      [210, 372, 1140, 372, "Сигнал ближе к реальному продукту", 210, 354],
      [210, 421, 1140, 421, "Стоимость и время проверки", 210, 403]
    ],
    dots: [
      [55, 174], [85, 174], [115, 174], [145, 174],
      [55, 206], [85, 206], [115, 206], [145, 206],
      [55, 238], [85, 238], [115, 238], [145, 238],
      [55, 270], [85, 270], [115, 270], [145, 270],
      [55, 302], [85, 302], [115, 302], [145, 302]
    ],
    fallback: [600, 220],
    arrowLabelPad: 10
  },
  {
    kind: "bench",
    box: [210, 145, 465, 331],
    band: [210, 145, 465, 194],
    number: "1",
    title: "Публичные бенчмарки",
    titleAt: [238, 178],
    lines: [
      ["Одинаковые тесты для всех", 238, 226, "main-text"],
      ["Быстрый грубый отсев", 238, 254, "main-text"],
      ["Дёшево · стандартизировано", 238, 286, "bench-ink"],
      ["Общий балл ≠ ваши клиенты", 238, 314, "warn-ink"]
    ]
  },
  {
    kind: "custom",
    box: [540, 165, 820, 315],
    band: [540, 165, 820, 214],
    number: "2",
    title: "Custom evals",
    titleAt: [568, 198],
    lines: [
      ["Свои диалоги и критерии", 568, 244, "main-text"],
      ["Возврат · посылка · доставка", 568, 274, "main-text"],
      ["Сильный продуктовый сигнал", 568, 301, "custom-ink"]
    ]
  },
  {
    kind: "human",
    box: [900, 185, 1140, 301],
    band: [900, 185, 1140, 234],
    number: "3",
    title: "Human eval",
    titleAt: [928, 218],
    lines: [
      ["Спорные ответы финалистов", 928, 258, "main-text"],
      ["0,10–2 $ за суждение", 928, 283, "human-ink"]
    ]
  }
];

const [layout, ...stages] = data;
const [originX, originY] = layout.origin;
const scale = layout.scale;
const sx = x => originX + x * scale;
const sy = y => originY + y * scale;

const labelPad = 10;
const lineWidth = 3;
const cardLineWidth = 2;
const titleFontSize = 20;
const bodyFontSize = 17;
const smallFontSize = 15;
const trendFontSize = 16;

const svg = document.getElementById("map");
const ns = "http://www.w3.org/2000/svg";

function node(name, attrs, parent = svg) {
  const item = document.createElementNS(ns, name);
  Object.entries(attrs).forEach(([key, value]) => item.setAttribute(key, value));
  parent.appendChild(item);
  return item;
}

function textAt(value, x, y, options = {}) {
  const item = node("text", {
    x: sx(x),
    y: sy(y),
    "text-anchor": options.anchor || "start",
    "font-size": options.size || bodyFontSize,
    class: options.className || "main-text"
  }, options.parent || svg);
  item.textContent = value;
  return item;
}

function rectFrom(box, className, parent = svg) {
  const [left, top, right, bottom] = box;
  return node("rect", {
    x: sx(left),
    y: sy(top),
    width: sx(right) - sx(left),
    height: sy(bottom) - sy(top),
    rx: sx(layout.cardRadius) - sx(0),
    ry: sy(layout.cardRadius) - sy(0),
    class: className,
    "stroke-width": cardLineWidth
  }, parent);
}

function arrow(x1, y1, x2, y2, className = "route", parent = svg) {
  const [headLength, halfHead] = layout.arrow;
  node("line", {
    x1: sx(x1),
    y1: sy(y1),
    x2: sx(x2 - headLength),
    y2: sy(y2),
    class: className,
    "stroke-width": lineWidth
  }, parent);
  node("polygon", {
    points: [
      [x2, y2],
      [x2 - headLength, y2 - halfHead],
      [x2 - headLength, y2 + halfHead]
    ].map(([x, y]) => `${sx(x)},${sy(y)}`).join(" "),
    class: "arrow-head"
  }, parent);
}

function kindClasses(kind) {
  return {
    bench: ["bench-card", "bench-fill", "bench-ink"],
    custom: ["custom-card", "custom-fill", "custom-ink"],
    human: ["human-card", "human-fill", "human-ink"]
  }[kind];
}

try {
  const diagram = node("g", {"aria-hidden": "true"});

  textAt("20 моделей-кандидатов", ...layout.sourceLabel, {
    anchor: "middle",
    size: bodyFontSize,
    className: "main-text stage-title",
    parent: diagram
  });

  layout.dots.forEach(([x, y]) => {
    node("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(layout.dotRadius) - sx(0),
      class: "candidate",
      "stroke-width": cardLineWidth
    }, diagram);
  });

  arrow(...layout.sourceArrow, "route", diagram);

  layout.routes.forEach(([x1, y1, x2, y2, label, tx, ty, anchor]) => {
    arrow(x1, y1, x2, y2, "route", diagram);
    textAt(label, tx, ty, {
      anchor,
      size: smallFontSize,
      className: "muted-text",
      parent: diagram
    });
  });

  stages.forEach(stage => {
    const [cardClass, fillClass, inkClass] = kindClasses(stage.kind);
    rectFrom(stage.box, `card ${cardClass}`, diagram);

    const [bandLeft, bandTop, bandRight, bandBottom] = stage.band;
    node("path", {
      d: [
        `M ${sx(bandLeft + layout.cardRadius)} ${sy(bandTop)}`,
        `L ${sx(bandRight - layout.cardRadius)} ${sy(bandTop)}`,
        `Q ${sx(bandRight)} ${sy(bandTop)} ${sx(bandRight)} ${sy(bandTop + layout.cardRadius)}`,
        `L ${sx(bandRight)} ${sy(bandBottom)}`,
        `L ${sx(bandLeft)} ${sy(bandBottom)}`,
        `L ${sx(bandLeft)} ${sy(bandTop + layout.cardRadius)}`,
        `Q ${sx(bandLeft)} ${sy(bandTop)} ${sx(bandLeft + layout.cardRadius)} ${sy(bandTop)}`,
        "Z"
      ].join(" "),
      class: fillClass
    }, diagram);

    const [titleX, titleY] = stage.titleAt;
    textAt(`${stage.number}. ${stage.title}`, titleX, titleY, {
      size: titleFontSize,
      className: `${inkClass} stage-title`,
      parent: diagram
    });

    stage.lines.forEach(([label, x, y, className]) => {
      textAt(label, x, y, {
        size: className === "main-text" ? bodyFontSize : smallFontSize,
        className,
        parent: diagram
      });
    });
  });

  layout.trends.forEach(([x1, y1, x2, y2, label, tx, ty]) => {
    textAt(label, tx, ty, {
      size: trendFontSize,
      className: "muted-text small-caps",
      parent: diagram
    });
    arrow(x1, y1, x2, y2, "route", diagram);
  });

  textAt("точнее", 1137, 354, {
    anchor: "end",
    size: smallFontSize,
    className: "custom-ink",
    parent: diagram
  });

  textAt("дороже", 1137, 403, {
    anchor: "end",
    size: smallFontSize,
    className: "human-ink",
    parent: diagram
  });
} catch (error) {
  while (svg.lastChild && !["title", "desc"].includes(svg.lastChild.localName)) {
    svg.removeChild(svg.lastChild);
  }
  const [fallbackX, fallbackY] = layout.fallback;
  textAt(
    "Схема: бенчмарки → custom evals → человеческая проверка спорных случаев",
    fallbackX,
    fallbackY,
    {
      anchor: "middle",
      size: bodyFontSize,
      className: "main-text"
    }
  );
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
