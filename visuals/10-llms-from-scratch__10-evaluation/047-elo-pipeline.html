<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Путь одного сравнения до изменения рейтинга</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f9fc;
    --panel: #ffffff;
    --panel-soft: #eef3f8;
    --ink: #172234;
    --muted: #536277;
    --line: #708198;
    --accent: #285fbd;
    --accent-soft: #dce9ff;
    --judge: #7750a8;
    --judge-soft: #eee3fa;
    --positive: #167549;
    --positive-soft: #dff5e9;
    --negative: #b54343;
    --negative-soft: #fbe5e5;
    --note: #fff5cf;
    --note-line: #b88616;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --panel: #1a2331;
      --panel-soft: #222e3e;
      --ink: #edf3fb;
      --muted: #afbdd0;
      --line: #8293aa;
      --accent: #82adff;
      --accent-soft: #233d68;
      --judge: #c29ae9;
      --judge-soft: #3c2c50;
      --positive: #70d7a6;
      --positive-soft: #173e31;
      --negative: #ff9c9c;
      --negative-soft: #4b292d;
      --note: #3d351d;
      --note-line: #d9ae4e;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: auto;
    padding: 14px 16px;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    max-width: 1248px;
    margin: auto;
  }

  header {
    margin-bottom: 10px;
  }

  h1 {
    margin: auto;
    font-size: 22px;
    line-height: normal;
  }

  header p {
    margin: 4px auto auto;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 450px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .box {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 2;
  }

  .prompt-box,
  .model-box {
    fill: var(--accent-soft);
    stroke: var(--accent);
  }

  .judge-box,
  .choice-box {
    fill: var(--judge-soft);
    stroke: var(--judge);
  }

  .expect-box {
    fill: var(--note);
    stroke: var(--note-line);
  }

  .update-a {
    fill: var(--positive-soft);
    stroke: var(--positive);
  }

  .update-b {
    fill: var(--negative-soft);
    stroke: var(--negative);
  }

  .option {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2;
  }

  .selected {
    fill: var(--positive-soft);
    stroke: var(--positive);
    stroke-width: 3;
  }

  .note-box {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 1;
  }

  .flow {
    fill: none;
    stroke: var(--line);
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .flow-main { stroke: var(--accent); }
  .flow-decision { stroke: var(--judge); }
  .flow-a { stroke: var(--positive); }
  .flow-b { stroke: var(--negative); }

  .arrow-head { fill: var(--line); }
  .head-main { fill: var(--accent); }
  .head-decision { fill: var(--judge); }
  .head-a { fill: var(--positive); }
  .head-b { fill: var(--negative); }

  text {
    fill: var(--ink);
    font-size: 13px;
    pointer-events: none;
  }

  .title-text {
    font-size: 15px;
    font-weight: bold;
  }

  .small-text {
    fill: var(--muted);
    font-size: 12px;
  }

  .choice-text {
    font-size: 12px;
    font-weight: bold;
  }

  .positive-text { fill: var(--positive); }
  .negative-text { fill: var(--negative); }

  #fallback {
    padding: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 14px;
  }

  [hidden] { display: none; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Путь одного сравнения до изменения рейтинга</h1>
    <p>Один промпт → два ответа → решение судьи → ожидание → обновление обеих моделей</p>
  </header>

  <svg id="chart" viewBox="0 0 1248 450" width="1248" height="450"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Путь одного парного сравнения в рейтинге ELO</title>
    <desc id="svg-desc">Один промпт поступает моделям A и B. Судья выбирает победу A, победу B или ничью. Исход сравнивается с ожиданием, после чего оба рейтинга обновляются с коэффициентом K равным 32.</desc>
    <g id="drawing"></g>
  </svg>

  <p id="fallback">Схема должна была показать: один промпт поступает моделям A и B, судья выбирает A, B или ничью, система сравнивает исход с ожиданием и обновляет оба рейтинга с K=32.</p>
</main>

<script>
const diagramData = [
  {
    kind: "config",
    origin: { x: 0, y: 0 },
    scale: { x: 8, y: 7 },
    heads: {
      right: [{ x: -1.5, y: -1.2 }, { x: 0, y: 0 }, { x: -1.5, y: 1.2 }],
      up: [{ x: -1.1, y: 1.5 }, { x: 0, y: 0 }, { x: 1.1, y: 1.5 }],
      down: [{ x: -1.1, y: -1.5 }, { x: 0, y: 0 }, { x: 1.1, y: -1.5 }]
    },
    edges: [
      { layer: "back", line: "flow flow-main", head: "head-main", direction: "right",
        points: [{ x: 21, y: 29 }, { x: 24, y: 29 }, { x: 24, y: 15.5 }, { x: 27, y: 15.5 }] },
      { layer: "back", line: "flow flow-main", head: "head-main", direction: "right",
        points: [{ x: 21, y: 29 }, { x: 24, y: 29 }, { x: 24, y: 46.5 }, { x: 27, y: 46.5 }] },
      { layer: "back", line: "flow", head: "arrow-head", direction: "right",
        points: [{ x: 47, y: 15.5 }, { x: 50, y: 15.5 }, { x: 50, y: 29 }, { x: 54, y: 29 }] },
      { layer: "back", line: "flow", head: "arrow-head", direction: "right",
        points: [{ x: 47, y: 46.5 }, { x: 50, y: 46.5 }, { x: 50, y: 29 }, { x: 54, y: 29 }] },
      { layer: "back", line: "flow flow-decision", head: "head-decision", direction: "right",
        points: [{ x: 72, y: 29 }, { x: 79, y: 29 }] },
      { layer: "back", line: "flow flow-decision", head: "head-decision", direction: "right",
        points: [{ x: 104, y: 29 }, { x: 110, y: 29 }] },
      { layer: "back", line: "flow", head: "arrow-head", direction: "right",
        points: [{ x: 132, y: 29 }, { x: 135, y: 29 }, { x: 135, y: 15.5 }, { x: 139, y: 15.5 }] },
      { layer: "back", line: "flow", head: "arrow-head", direction: "right",
        points: [{ x: 132, y: 29 }, { x: 135, y: 29 }, { x: 135, y: 46.5 }, { x: 139, y: 46.5 }] },
      { layer: "front", line: "flow flow-a", head: "head-a", direction: "up",
        points: [{ x: 150, y: 19 }, { x: 150, y: 12 }] },
      { layer: "front", line: "flow flow-b", head: "head-b", direction: "down",
        points: [{ x: 150, y: 43 }, { x: 150, y: 50 }] }
    ]
  },
  {
    kind: "box", x: 3, y: 22, w: 18, h: 14, className: "box prompt-box",
    labels: [
      { x: 12, y: 27, text: "Один промпт", className: "title-text", anchor: "middle" },
      { x: 12, y: 31.5, text: "одинаковый вход", className: "small-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 27, y: 8, w: 20, h: 15, className: "box model-box",
    labels: [
      { x: 37, y: 13.5, text: "Ответ модели A", className: "title-text", anchor: "middle" },
      { x: 37, y: 18, text: "имя скрыто", className: "small-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 27, y: 39, w: 20, h: 15, className: "box model-box",
    labels: [
      { x: 37, y: 44.5, text: "Ответ модели B", className: "title-text", anchor: "middle" },
      { x: 37, y: 49, text: "имя скрыто", className: "small-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 54, y: 22, w: 18, h: 14, className: "box judge-box",
    labels: [
      { x: 63, y: 27, text: "Судья", className: "title-text", anchor: "middle" },
      { x: 63, y: 31.5, text: "сравнивает ответы", className: "small-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 79, y: 7, w: 25, h: 46, className: "box choice-box",
    labels: [
      { x: 91.5, y: 12, text: "Выбирает исход", className: "title-text", anchor: "middle" },
      { x: 91.5, y: 15.5, text: "один из трёх", className: "small-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 82, y: 18, w: 19, h: 7, className: "option selected",
    labels: [
      { x: 91.5, y: 22.5, text: "A победила", className: "choice-text positive-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 82, y: 29, w: 19, h: 7, className: "option",
    labels: [
      { x: 91.5, y: 33.5, text: "B победила", className: "choice-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 82, y: 40, w: 19, h: 7, className: "option",
    labels: [
      { x: 91.5, y: 44.5, text: "Ничья", className: "choice-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 110, y: 22, w: 22, h: 14, className: "box expect-box",
    labels: [
      { x: 121, y: 26, text: "Исход против", className: "title-text", anchor: "middle" },
      { x: 121, y: 30.2, text: "ожидания текущих", className: "small-text", anchor: "middle" },
      { x: 121, y: 33.7, text: "рейтингов", className: "small-text", anchor: "middle" }
    ]
  },
  {
    kind: "box", x: 139, y: 8, w: 14, h: 15, className: "box update-a",
    labels: [
      { x: 140.5, y: 13.5, text: "Рейтинг A", className: "title-text", anchor: "start" },
      { x: 140.5, y: 18, text: "обновлён", className: "small-text positive-text", anchor: "start" }
    ]
  },
  {
    kind: "box", x: 139, y: 39, w: 14, h: 15, className: "box update-b",
    labels: [
      { x: 140.5, y: 44.5, text: "Рейтинг B", className: "title-text", anchor: "start" },
      { x: 140.5, y: 49, text: "обновлён", className: "small-text negative-text", anchor: "start" }
    ]
  },
  {
    kind: "box", x: 3, y: 56, w: 150, h: 7, className: "note-box",
    labels: [
      { x: 78, y: 60.5, text: "Показана победа A: величину встречных сдвигов задаёт неожиданность исхода, чувствительность обновления — K=32", className: "small-text", anchor: "middle" }
    ]
  }
];

const [cfg, ...items] = diagramData;
const origin = Object.freeze(cfg.origin);
const scale = Object.freeze(cfg.scale);
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const ns = "http://www.w3.org/2000/svg";
  const chart = document.getElementById("chart");
  const drawing = document.getElementById("drawing");
  const fallback = document.getElementById("fallback");

  const make = (name, attrs, value) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, entry]) => node.setAttribute(key, entry));
    if (value !== undefined) node.textContent = value;
    return node;
  };

  const drawArrow = edge => {
    const pathData = edge.points
      .map((point, position) => `${position ? "L" : "M"} ${sx(point.x)} ${sy(point.y)}`)
      .join(" ");
    drawing.appendChild(make("path", { d: pathData, class: edge.line }));

    const end = edge.points.reduce((latest, point) => point);
    const polygon = cfg.heads[edge.direction]
      .map(point => `${sx(end.x + point.x)},${sy(end.y + point.y)}`)
      .join(" ");
    drawing.appendChild(make("polygon", { points: polygon, class: edge.head }));
  };

  const drawBox = item => {
    drawing.appendChild(make("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.x + item.w) - sx(item.x),
      height: sy(item.y + item.h) - sy(item.y),
      class: item.className
    }));

    item.labels.forEach(label => {
      drawing.appendChild(make("text", {
        x: sx(label.x),
        y: sy(label.y),
        class: label.className,
        "text-anchor": label.anchor
      }, label.text));
    });
  };

  cfg.edges.filter(edge => edge.layer === "back").forEach(drawArrow);
  items.filter(item => item.kind === "box").forEach(drawBox);
  cfg.edges.filter(edge => edge.layer === "front").forEach(drawArrow);
  fallback.hidden = true;
} catch (error) {
  document.getElementById("chart").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
