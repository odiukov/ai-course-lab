<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Треугольник на сетке 4×4</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1d21;
    --muted: #5b6470;
    --grid: #9aa4b0;
    --allow: #2f7d5d;
    --allow-fill: #cdeadc;
    --block: #b4483c;
    --block-fill: #f6e0dd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b;
      --fg: #e8ecf1;
      --muted: #9aa4b0;
      --grid: #4d5763;
      --allow: #6fd0a2;
      --allow-fill: #1e3a2e;
      --block: #e08b80;
      --block-fill: #3a2320;
    }
  }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  .wrap { background: var(--bg); color: var(--fg); padding: 8px 0 4px; }
  h2 {
    font: 600 15px/1.3 system-ui, sans-serif;
    margin: 0 0 6px; text-align: center; color: var(--fg);
  }
  svg { display: block; width: 100%; height: auto; max-height: 470px; margin: 0 auto; }
  .fallback { font: 13px/1.5 system-ui, sans-serif; color: var(--fg); padding: 8px 16px; }
  text { font-family: system-ui, sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Треугольник на сетке 4×4: 10 разрешённых клеток, 6 закрытых</h2>
  <div id="host"></div>
</div>
<script>
(function () {
  var host = document.getElementById('host');
  try {
    // ---- данные схемы ----
    var N = 4;
    var ROWS = [
      { i: 0, label: 'позиция 0 видит 1 токен' },
      { i: 1, label: 'позиция 1 видит 2 токена' },
      { i: 2, label: 'позиция 2 видит 3 токена' },
      { i: 3, label: 'позиция 3 видит 4 токена' }
    ];

    // ---- холст ----
    var W = 760, H = 430;

    // ---- одно начало координат и один масштаб ----
    var origin = { x: 250, y: 70 };
    var scale = 62;

    // единственный перевод координат
    function sx(x) { return origin.x + x * scale; }
    function sy(y) { return origin.y + y * scale; }

    // ---- пиксельные литералы (только отступы, шрифт, толщина) ----
    var PAD = 10, FS = 13, FS_SMALL = 12, LW = 1.5;

    var NS = 'http://www.w3.org/2000/svg';
    function el(name, attrs) {
      var n = document.createElementNS(NS, name);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      return n;
    }
    function txt(x, y, s, anchor, cls, size) {
      var t = el('text', {
        x: x, y: y, 'text-anchor': anchor,
        'font-size': size || FS, fill: cls
      });
      t.textContent = s;
      return t;
    }

    var svg = el('svg', {
      viewBox: '0 0 ' + W + ' ' + H,
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img'
    });
    svg.appendChild(el('rect', { x: 0, y: 0, width: W, height: H, fill: 'var(--bg)' }));

    var g = el('g', {});
    svg.appendChild(g);

    // ---- клетки ----
    var allowed = 0, blocked = 0;
    for (var i = 0; i < N; i++) {
      for (var j = 0; j < N; j++) {
        var open = j <= i;
        if (open) allowed++; else blocked++;
        g.appendChild(el('rect', {
          x: sx(j), y: sy(i),
          width: sx(j + 1) - sx(j), height: sy(i + 1) - sy(i),
          fill: open ? 'var(--allow-fill)' : 'var(--block-fill)',
          stroke: 'var(--grid)', 'stroke-width': LW
        }));
        if (!open) {
          // перечёркнутая клетка = будущее
          g.appendChild(el('line', {
            x1: sx(j), y1: sy(i), x2: sx(j + 1), y2: sy(i + 1),
            stroke: 'var(--block)', 'stroke-width': LW
          }));
          g.appendChild(el('line', {
            x1: sx(j + 1), y1: sy(i), x2: sx(j), y2: sy(i + 1),
            stroke: 'var(--block)', 'stroke-width': LW
          }));
        } else {
          g.appendChild(txt(sx(j + 0.5), sy(i + 0.5) + FS / 3, '0',
            'middle', 'var(--allow)', FS));
        }
      }
    }

    // ---- диагональ поверх: граница открыта ----
    g.appendChild(el('line', {
      x1: sx(0), y1: sy(0), x2: sx(N), y2: sy(N),
      stroke: 'var(--allow)', 'stroke-width': LW * 2
    }));

    // ---- подписи столбцов (сверху, middle) ----
    for (var c = 0; c < N; c++) {
      g.appendChild(txt(sx(c + 0.5), sy(0) - PAD, 'к ' + c, 'middle', 'var(--muted)', FS_SMALL));
    }
    g.appendChild(txt(sx(N / 2), sy(0) - PAD * 3, 'столбец — на кого смотрят',
      'middle', 'var(--fg)', FS));

    // ---- подписи строк (слева, end) ----
    for (var r = 0; r < ROWS.length; r++) {
      g.appendChild(txt(sx(0) - PAD, sy(ROWS[r].i + 0.5) + FS / 3,
        ROWS[r].label, 'end', 'var(--fg)', FS));
    }
    // вертикальная надпись оси строк — слева от подписей, свой якорь
    var rowAxis = txt(0, 0, 'строка — кто смотрит', 'middle', 'var(--fg)', FS);
    rowAxis.setAttribute('x', sx(0) - PAD);
    rowAxis.setAttribute('y', sy(N / 2));
    rowAxis.setAttribute('transform',
      'rotate(-90 ' + (sx(0) - PAD) + ' ' + sy(N / 2) + ') translate(0 ' + (-PAD * 16) + ')');
    g.appendChild(rowAxis);

    // ---- итог справа от каждой строки: число открытых клеток ----
    for (var k = 0; k < ROWS.length; k++) {
      g.appendChild(txt(sx(N) + PAD, sy(ROWS[k].i + 0.5) + FS / 3,
        (ROWS[k].i + 1) + ' из 4', 'start', 'var(--muted)', FS_SMALL));
    }

    // ---- легенда под схемой ----
    var ly = sy(N) + PAD * 3;

    var s1 = el('rect', {
      x: sx(0), y: ly - FS, width: sx(0.28) - sx(0), height: sx(0.28) - sx(0),
      fill: 'var(--allow-fill)', stroke: 'var(--allow)', 'stroke-width': LW
    });
    g.appendChild(s1);
    g.appendChild(txt(sx(0.28) + PAD, ly + FS / 4,
      allowed + ' разрешённых клеток (прошлое и сама позиция)', 'start', 'var(--fg)', FS));

    var ly2 = ly + PAD * 3;
    var s2 = el('rect', {
      x: sx(0), y: ly2 - FS, width: sx(0.28) - sx(0), height: sx(0.28) - sx(0),
      fill: 'var(--block-fill)', stroke: 'var(--block)', 'stroke-width': LW
    });
    g.appendChild(s2);
    g.appendChild(el('line', {
      x1: sx(0), y1: ly2 - FS, x2: sx(0.28), y2: ly2 - FS + (sx(0.28) - sx(0)),
      stroke: 'var(--block)', 'stroke-width': LW
    }));
    g.appendChild(el('line', {
      x1: sx(0.28), y1: ly2 - FS, x2: sx(0), y2: ly2 - FS + (sx(0.28) - sx(0)),
      stroke: 'var(--block)', 'stroke-width': LW
    }));
    g.appendChild(txt(sx(0.28) + PAD, ly2 + FS / 4,
      blocked + ' закрытых клеток над диагональю (будущее, −inf)', 'start', 'var(--fg)', FS));

    host.appendChild(svg);
  } catch (e) {
    var d = document.createElement('div');
    d.className = 'fallback';
    d.textContent = 'Схема: квадрат 4×4. Строка — кто смотрит, столбец — на кого. '
      + 'Ниже диагонали и на ней 10 разрешённых клеток: позиция 0 видит 1 токен, '
      + 'позиция 1 — 2, позиция 2 — 3, позиция 3 — 4. Над диагональю 6 клеток '
      + 'перечёркнуты — это будущее, там −inf, а после softmax ноль.';
    host.appendChild(d);
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
