<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три стадии на одной позиции</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1d1f24; --muted:#6a7080; --line:#c8ccd6;
    --c0:#4c7cf3; --c1:#2fa37c; --c2:#d98324; --sep:#fbfbfd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12141a; --fg:#e6e8ee; --muted:#98a0b0; --line:#3a4150;
      --c0:#7aa2ff; --c1:#4fc79b; --c2:#f0a44a; --sep:#12141a;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  figure{margin:0;padding:12px;background:var(--bg)}
  figcaption{font-size:14px;font-weight:600;margin-bottom:6px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fb{color:var(--muted);font-size:13px;white-space:pre-wrap}
</style>
<figure>
  <figcaption>Позиция 2 из трёх токенов: одна строка весов на трёх стадиях</figcaption>
  <div id="host"></div>
</figure>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var GROUPS = [
      { title:'Стадия 1 — равномерное среднее (веса из длины префикса)', ty:0.12,
        rows:[ {y:0.40, label:'любой текст', w:[1/3,1/3,1/3], num:'[1/3, 1/3, 1/3]'} ] },
      { title:'Стадия 2 — обученные статические веса (одна матрица на всё)', ty:1.05,
        rows:[ {y:1.33, label:'«кот сел на»',    w:[0.2,0.3,0.5], num:'[0.2, 0.3, 0.5]'},
               {y:1.78, label:'«банк открыл в»', w:[0.2,0.3,0.5], num:'[0.2, 0.3, 0.5]'} ] },
      { title:'Стадия 3 — веса из самих токенов: S = QKᵀ / √dk', ty:2.43,
        rows:[ {y:2.71, label:'«кот сел на»',    w:[0.05,0.15,0.80], num:'[0.05, 0.15, 0.80]'},
               {y:3.16, label:'«банк открыл в»', w:[0.55,0.25,0.20], num:'[0.55, 0.25, 0.20]'} ] }
    ];
    var BAR = {x0:0, x1:3, h:0.30};                 /* полоса шириной 1 = вся строка */
    var FUT = {x0:3.08, x1:3.50};                   /* столбец 3 — будущее */
    var NUMX = 3.65, LABX = -0.12;
    var LEGEND = [ {x:0.00, c:'var(--c0)', t:'поз. 0'},
                   {x:0.85, c:'var(--c1)', t:'поз. 1'},
                   {x:1.70, c:'var(--c2)', t:'поз. 2'},
                   {x:2.55, c:null,        t:'поз. 3 — будущего нет'} ];
    var LEG = {y:3.80, sw:0.18, sh:0.20}, NOTE = {y:4.14};
    var COLORS = ['var(--c0)','var(--c1)','var(--c2)'];
    var W = 660, H = 450;

    /* ---- единственный перевод координат ---- */
    var scale = 100, origin = {x:150, y:14};
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y + y*scale; }

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label','Три стадии весов для позиции 2');

    function el(n,a){ var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e; }
    function txt(x,y,s,anchor,fill,size,weight){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,'dominant-baseline':'middle',
        fill:fill,'font-size':size,'font-family':'system-ui,-apple-system,Segoe UI,Roboto,sans-serif'});
      if(weight) t.setAttribute('font-weight',weight);
      t.textContent=s; svg.appendChild(t); return t;
    }

    GROUPS.forEach(function(g){
      txt(sx(BAR.x0), sy(g.ty), g.title, 'start', 'var(--fg)', 13, 600);

      g.rows.forEach(function(r){
        var yTop=sy(r.y), yBot=sy(r.y+BAR.h), yMid=sy(r.y+BAR.h/2);

        /* подпись строки — слева, anchor end */
        txt(sx(LABX), yMid, r.label, 'end', 'var(--muted)', 12.5);

        /* сегменты полосы: ширина = вес */
        var acc=BAR.x0;
        r.w.forEach(function(w,i){
          var a=acc, b=acc+w*(BAR.x1-BAR.x0); acc=b;
          svg.appendChild(el('rect',{x:sx(a), y:yTop, width:sx(b)-sx(a), height:yBot-yTop,
            fill:COLORS[i], stroke:'var(--sep)','stroke-width':1.5}));
        });

        /* столбец будущего — пусто */
        svg.appendChild(el('rect',{x:sx(FUT.x0), y:yTop, width:sx(FUT.x1)-sx(FUT.x0),
          height:yBot-yTop, fill:'none', stroke:'var(--line)','stroke-width':1.5,
          'stroke-dasharray':'4 3'}));
        txt(sx((FUT.x0+FUT.x1)/2), yMid, '0', 'middle', 'var(--muted)', 11);

        /* числа — справа, anchor start */
        txt(sx(NUMX), yMid, r.num, 'start', 'var(--fg)', 12);
      });
    });

    /* легенда */
    LEGEND.forEach(function(it){
      var x0=sx(it.x), x1=sx(it.x+LEG.sw), y0=sy(LEG.y), y1=sy(LEG.y+LEG.sh);
      var box={x:x0, y:y0, width:x1-x0, height:y1-y0};
      if(it.c){ box.fill=it.c; }
      else { box.fill='none'; box.stroke='var(--line)'; box['stroke-width']=1.5;
             box['stroke-dasharray']='4 3'; }
      svg.appendChild(el('rect',box));
      txt(x1+6, sy(LEG.y+LEG.sh/2), it.t, 'start', 'var(--muted)', 12);
    });

    txt(sx(BAR.x0), sy(NOTE.y),
      'Ширина полосы — вес. Во всех пяти строках: три веса, сумма 1, четвёртого нет.',
      'start', 'var(--muted)', 12);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fp"></p>';
    var p=host.firstChild; p.className='fb';
    p.textContent=
      'Схема (не построилась). Позиция 2 из трёх токенов, строка весов:\n'+
      'Стадия 1 — любой текст: [1/3, 1/3, 1/3].\n'+
      'Стадия 2 — «кот сел на»: [0.2, 0.3, 0.5]; «банк открыл в»: [0.2, 0.3, 0.5].\n'+
      'Стадия 3 — «кот сел на»: [0.05, 0.15, 0.80]; «банк открыл в»: [0.55, 0.25, 0.20].\n'+
      'Везде три веса, сумма 1, четвёртого столбца нет.';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
