<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Когда оценкам судьи можно доверять</title>
<style>
  :root {
    color-scheme: light dark;
    --background: white;
    --ink: midnightblue;
    --muted: slategray;
    --line: lightsteelblue;
    --panel: whitesmoke;
    --danger-fill: mistyrose;
    --danger-ink: firebrick;
    --work-fill: honeydew;
    --work-ink: seagreen;
    --accent: darkorange;
    --sample: royalblue;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background: black;
      --ink: whitesmoke;
      --muted: lightgray;
      --line: slategray;
      --panel: midnightblue;
      --danger-fill: maroon;
      --danger-ink: lightsalmon;
      --work-fill: darkgreen;
      --work-ink: palegreen;
      --accent: gold;
      --sample: lightskyblue;
    }
  }

  html,
  body {
    margin: unset;
    background: var(--background);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    max-width: 1200px;
    margin-inline: auto;
    background: var(--background);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 520px;
    background: var(--background);
  }

  text {
    fill: var(--ink);
  }

  .heading {
    font-size: 27px;
    font-weight: bold;
  }

  .subtitle {
    font-size: 16px;
    fill: var(--muted);
  }

  .section-title {
    font-size: 18px;
    font-weight: bold;
  }

  .zone-label {
    font-size: 18px;
    font-weight: bold;
  }

  .small-label {
    font-size: 15px;
  }

  .tick-label {
    font-size: 17px;
    font-weight: bold;
  }

  .score-label {
    font-size: 16px;
    font-weight: bold;
    fill: var(--accent);
  }

  .sample-label {
    font-size: 17px;
    font-weight: bold;
  }

  .formula {
    font-size: 18px;
    font-weight: bold;
  }

  .footer {
    font-size: 14px;
    fill: var(--muted);
  }

  .frame {
    fill: var(--background);
    stroke: var(--line);
    stroke-width: 1px;
  }

  .divider,
  .axis,
  .tick {
    fill: none;
    stroke: var(--line);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .danger-zone {
    fill: var(--danger-fill);
    stroke: var(--danger-ink);
    stroke-width: 2px;
  }

  .work-zone {
    fill: var(--work-fill);
    stroke: var(--work-ink);
    stroke-width: 2px;
  }

  .danger-text {
    fill: var(--danger-ink);
  }

  .work-text {
    fill: var(--work-ink);
  }

  .threshold {
    fill: none;
    stroke: var(--work-ink);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .score-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .score-tip,
  .score-dot {
    fill: var(--accent);
  }

  .sample-line {
    fill: none;
    stroke: var(--sample);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  .sample-tick {
    fill: none;
    stroke: var(--sample);
    stroke-width: 3px;
    stroke-linecap: round;
  }

  .sample-dot {
    fill: var(--background);
    stroke: var(--sample);
    stroke-width: 4px;
  }

  .sample-text {
    fill: var(--sample);
  }

  .formula-panel {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 1px;
  }

  #fallback {
    font-size: 18px;
    background: var(--background);
    color: var(--ink);
  }
</style>
</head>
<body>
<main>
  <svg id="diagram"
       viewBox="0 0 1200 430"
       width="1200"
       height="430"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Когда оценкам судьи можно доверять</title>
    <desc id="svg-description">
      Шкала корреляции Спирмена от нуля до единицы: ниже 0,7 показана
      красная зона, от 0,7 — рабочая зона. Ниже отмечены минимум 50 и
      рекомендуемые 100 примеров с человеческой разметкой.
    </desc>
    <text id="visible-heading" class="heading">
      Когда оценкам судьи можно доверять
    </text>
  </svg>
  <p id="fallback">
    Схема должна показать шкалу корреляции Спирмена от 0 до 1:
    красную зону ниже 0,7, рабочую зону от 0,7, минимум 50 и
    рекомендуемые 100 примеров с человеческой разметкой.
  </p>
</main>

<script>
(() => {
  const data = [{
    base: 0,
    frame: {
      left: 0.35, right: 11.65, top: 5.85, bottom: 0.12, radius: 0.12
    },
    heading: {
      x: 0.68, y: 5.48, padX: 0, padY: 0, anchor: "start"
    },
    subtitle: {
      x: 0.68, y: 5.08, padX: 0, padY: 0, anchor: "start",
      text: "Сначала проверьте совпадение порядка с человеческими оценками"
    },
    gauge: {
      start: 1, threshold: 8, score: 9.4, end: 11,
      top: 4.48, bottom: 3.78, radius: 0.16,
      axisY: 3.6, tickBottom: 3.48, labelY: 3.25
    },
    zoneLabels: [
      {
        x: 4.5, y: 4.08, padX: 0, padY: 0, anchor: "middle",
        text: "ниже 0,7 · доработать рубрику",
        className: "zone-label danger-text"
      },
      {
        x: 9.5, y: 4.16, padX: 0, padY: 0, anchor: "middle",
        text: "ρ ≥ 0,7",
        className: "zone-label work-text"
      },
      {
        x: 9.5, y: 3.91, padX: 0, padY: 0, anchor: "middle",
        text: "можно сравнивать версии",
        className: "small-label work-text"
      }
    ],
    ticks: [
      {
        x: 1, text: "0", anchor: "start", padX: 0, padY: 0
      },
      {
        x: 8, text: "0,7", anchor: "middle", padX: 0, padY: 0
      },
      {
        x: 11, text: "1", anchor: "end", padX: 0, padY: 0
      }
    ],
    rhoLabel: {
      x: 1, y: 3.25, padX: -18, padY: 0, anchor: "end", text: "ρ"
    },
    scoreLabel: {
      x: 9.4, y: 4.93, padX: 0, padY: -8, anchor: "middle",
      text: "пример: ρ = 0,84"
    },
    scoreArrow: {
      tail: { x: 9.4, y: 4.76 },
      head: { x: 9.4, y: 4.52 },
      left: { x: 9.31, y: 4.62 },
      right: { x: 9.49, y: 4.62 },
      dotY: 4.13,
      dotRadius: 0.055
    },
    thresholdLine: {
      top: 4.58, bottom: 3.68
    },
    divider: {
      left: 0.7, right: 11.3, y: 2.98
    },
    sampleHeading: {
      x: 0.72, y: 2.58, padX: 0, padY: 0, anchor: "start",
      text: "Человеческая калибровочная выборка"
    },
    sample: {
      start: 2, minimum: 6.1, recommended: 10.2,
      y: 1.72, tickTop: 1.91, tickBottom: 1.52,
      radius: 0.095
    },
    sampleLabels: [
      {
        x: 6.1, y: 2.08, padX: 14, padY: 0, anchor: "start",
        text: "50 — минимум"
      },
      {
        x: 10.2, y: 1.31, padX: 0, padY: 18, anchor: "end",
        text: "100 — рекомендуется"
      },
      {
        x: 2, y: 1.31, padX: 0, padY: 18, anchor: "start",
        text: "размечено человеком"
      }
    ],
    formulaPanel: {
      left: 0.82, right: 11.18, top: 1.02, bottom: 0.43, radius: 0.13
    },
    formulaLabel: {
      x: 6, y: 0.68, padX: 0, padY: 5, anchor: "middle",
      text: "Доверие = одинаковый порядок + общая человеческая выборка"
    },
    footer: {
      x: 6, y: 0.2, padX: 0, padY: 0, anchor: "middle",
      text: "Сменили рубрику, модель судьи или её версию — калибруйте заново"
    }
  }];

  const origin = Object.freeze({ x: 0, y: 420 });
  const scale = Object.freeze({ x: 100, y: 70 });

  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y - y * scale.y;

  try {
    const [d] = data;
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const heading = document.getElementById("visible-heading");
    const namespace = "http://www.w3.org/2000/svg";

    const make = (name, attributes, textValue) => {
      const node = document.createElementNS(namespace, name);
      Object.entries(attributes).forEach(([key, value]) => {
        node.setAttribute(key, String(value));
      });
      if (textValue !== undefined) node.textContent = textValue;
      return node;
    };

    const add = node => {
      svg.appendChild(node);
      return node;
    };

    const rectangle = (box, className) => make("rect", {
      x: sx(box.left),
      y: sy(box.top),
      width: sx(box.right) - sx(box.left),
      height: sy(box.bottom) - sy(box.top),
      rx: sx(box.radius) - sx(d.base),
      class: className
    });

    const line = (x1, y1, x2, y2, className) => make("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    });

    const label = (item, className) => make("text", {
      x: sx(item.x) + item.padX,
      y: sy(item.y) + item.padY,
      "text-anchor": item.anchor,
      class: className
    }, item.text);

    const circle = (x, y, radius, className) => make("circle", {
      cx: sx(x),
      cy: sy(y),
      r: sx(radius) - sx(d.base),
      class: className
    });

    heading.setAttribute("x", String(sx(d.heading.x) + d.heading.padX));
    heading.setAttribute("y", String(sy(d.heading.y) + d.heading.padY));
    heading.setAttribute("text-anchor", d.heading.anchor);

    add(rectangle(d.frame, "frame"));
    add(label(d.subtitle, "subtitle"));

    add(make("rect", {
      x: sx(d.gauge.start),
      y: sy(d.gauge.top),
      width: sx(d.gauge.threshold) - sx(d.gauge.start),
      height: sy(d.gauge.bottom) - sy(d.gauge.top),
      rx: sx(d.gauge.radius) - sx(d.base),
      class: "danger-zone"
    }));

    add(make("rect", {
      x: sx(d.gauge.threshold),
      y: sy(d.gauge.top),
      width: sx(d.gauge.end) - sx(d.gauge.threshold),
      height: sy(d.gauge.bottom) - sy(d.gauge.top),
      rx: sx(d.gauge.radius) - sx(d.base),
      class: "work-zone"
    }));

    add(line(
      d.gauge.start, d.gauge.axisY,
      d.gauge.end, d.gauge.axisY,
      "axis"
    ));

    d.ticks.forEach(tick => {
      add(line(
        tick.x, d.gauge.axisY,
        tick.x, d.gauge.tickBottom,
        "tick"
      ));
      add(label({
        x: tick.x,
        y: d.gauge.labelY,
        padX: tick.padX,
        padY: tick.padY,
        anchor: tick.anchor,
        text: tick.text
      }, "tick-label"));
    });

    d.zoneLabels.forEach(item => add(label(item, item.className)));
    add(label(d.rhoLabel, "tick-label"));

    add(line(
      d.gauge.threshold, d.thresholdLine.top,
      d.gauge.threshold, d.thresholdLine.bottom,
      "threshold"
    ));

    add(label(d.scoreLabel, "score-label"));
    add(line(
      d.scoreArrow.tail.x, d.scoreArrow.tail.y,
      d.scoreArrow.head.x, d.scoreArrow.head.y,
      "score-line"
    ));

    add(make("polygon", {
      points: [
        `${sx(d.scoreArrow.head.x)},${sy(d.scoreArrow.head.y)}`,
        `${sx(d.scoreArrow.left.x)},${sy(d.scoreArrow.left.y)}`,
        `${sx(d.scoreArrow.right.x)},${sy(d.scoreArrow.right.y)}`
      ].join(" "),
      class: "score-tip"
    }));

    add(circle(
      d.gauge.score,
      d.scoreArrow.dotY,
      d.scoreArrow.dotRadius,
      "score-dot"
    ));

    add(line(
      d.divider.left, d.divider.y,
      d.divider.right, d.divider.y,
      "divider"
    ));

    add(label(d.sampleHeading, "section-title"));

    add(line(
      d.sample.start, d.sample.y,
      d.sample.recommended, d.sample.y,
      "sample-line"
    ));

    [d.sample.minimum, d.sample.recommended].forEach(x => {
      add(line(
        x, d.sample.tickTop,
        x, d.sample.tickBottom,
        "sample-tick"
      ));
      add(circle(
        x, d.sample.y,
        d.sample.radius,
        "sample-dot"
      ));
    });

    d.sampleLabels.forEach(item => {
      add(label(item, "sample-label sample-text"));
    });

    add(rectangle(d.formulaPanel, "formula-panel"));
    add(label(d.formulaLabel, "formula"));
    add(label(d.footer, "footer"));

    fallback.hidden = true;
  } catch (error) {
    document.getElementById("diagram").hidden = true;
    document.getElementById("fallback").hidden = false;
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
