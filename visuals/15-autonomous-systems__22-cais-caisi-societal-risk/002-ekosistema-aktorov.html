<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кто формирует нижнюю планку безопасности</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --surface: #ffffff;
    --surface-soft: #eef2ff;
    --surface-public: #fff7e6;
    --surface-state: #e8f7ef;
    --ink: #182033;
    --muted: #566178;
    --border: #cbd3e3;
    --lab: #5268d8;
    --eval: #9a5bc5;
    --civil: #d2822f;
    --state: #24895b;
    --floor: #173f67;
    --floor-ink: #ffffff;
    --arrow: #78849a;
    --shadow: #dfe4ef;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #111722;
      --surface: #192231;
      --surface-soft: #222e4b;
      --surface-public: #372b1d;
      --surface-state: #183629;
      --ink: #f1f4fa;
      --muted: #b5bfd0;
      --border: #405069;
      --lab: #91a2ff;
      --eval: #d19aef;
      --civil: #f0aa5e;
      --state: #67d49d;
      --floor: #3578ad;
      --floor-ink: #ffffff;
      --arrow: #9aa8bc;
      --shadow: #0c111a;
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    padding: 14px;
    background: var(--page);
  }

  .figure-title {
    margin: 0;
    padding: 0 0 10px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--page);
  }

  .panel-shadow {
    fill: var(--shadow);
  }

  .panel {
    fill: var(--surface);
    stroke: var(--border);
    stroke-width: 2;
  }

  .lab-head {
    fill: var(--surface-soft);
  }

  .eval-head {
    fill: var(--surface-soft);
  }

  .public-head {
    fill: var(--surface-public);
  }

  .lab-icon {
    fill: var(--lab);
  }

  .eval-icon {
    fill: var(--eval);
  }

  .public-icon {
    fill: var(--civil);
  }

  .icon-text {
    fill: #ffffff;
    font-size: 18px;
    font-weight: bold;
  }

  .eyebrow {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .header-meta {
    fill: var(--muted);
    font-size: 13px;
  }

  .section-title {
    fill: var(--ink);
    font-size: 20px;
    font-weight: bold;
  }

  .body-copy {
    fill: var(--muted);
    font-size: 15px;
  }

  .chip {
    fill: var(--surface-soft);
    stroke: var(--border);
    stroke-width: 1;
  }

  .chip-text {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }

  .measure-box {
    fill: var(--surface-soft);
    stroke: var(--eval);
    stroke-width: 2;
  }

  .measure-line {
    stroke: var(--eval);
    stroke-width: 2;
  }

  .measure-dot {
    fill: var(--eval);
  }

  .civil-card {
    fill: var(--surface-public);
    stroke: var(--civil);
    stroke-width: 2;
  }

  .state-card {
    fill: var(--surface-state);
    stroke: var(--state);
    stroke-width: 2;
  }

  .subcard-title {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  .subcard-copy {
    fill: var(--muted);
    font-size: 13px;
  }

  .flow {
    stroke: var(--arrow);
    stroke-width: 3;
    stroke-linecap: round;
  }

  .flow-head {
    fill: var(--arrow);
  }

  .state-flow {
    stroke: var(--state);
    stroke-width: 4;
    stroke-linecap: round;
  }

  .state-flow-head {
    fill: var(--state);
  }

  .floor {
    fill: var(--floor);
  }

  .floor-title {
    fill: var(--floor-ink);
    font-size: 19px;
    font-weight: bold;
  }

  .floor-copy {
    fill: var(--floor-ink);
    font-size: 14px;
  }

  .conclusion {
    fill: var(--ink);
    font-size: 15px;
    font-weight: bold;
  }

  .fallback {
    margin: 0;
    padding: 24px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    text-align: center;
  }

  [hidden] {
    display: none;
  }
</style>
</head>
<body>
<figure aria-labelledby="scheme-title">
  <h2 class="figure-title" id="scheme-title">Кто формирует нижнюю планку безопасности</h2>
  <svg id="scheme"
       viewBox="0 0 1200 440"
       width="1200"
       height="440"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Три участника формирования нижней планки безопасности</title>
    <desc id="svg-desc">Лаборатории задают внутренние политики, независимые оценщики измеряют возможности, а гражданское общество и государство формируют публичные нормы. Публичное правило делает минимум обязательным для всех.</desc>
  </svg>
  <p class="fallback" id="fallback" hidden>Схема должна была показать три звена: внутренние политики лабораторий, измерения независимых оценщиков и публичные нормы, формируемые гражданским обществом и государством.</p>
</figure>

<script>
(() => {
  "use strict";

  const diagram = [
    {
      originX: 40, originY: 410, scaleX: 1, scaleY: 1,
      radius: 14, shadowShift: 5, arrowHead: 8,
      panelTop: 380, panelHeight: 250, panelWidth: 350,
      headerHeight: 55, floorTop: 92, floorHeight: 50
    },
    {
      kind: "panel", role: "lab", x: 40, y: 380, w: 350, h: 250,
      iconX: 76, iconY: 352, iconR: 18, icon: "Л",
      header: "ЛАБОРАТОРИИ", meta: "внутренний контур",
      titleLines: [
        { text: "Задают внутренние", x: 68, y: 294 },
        { text: "политики", x: 68, y: 270 }
      ],
      texts: [
        { text: "Показывают, какие меры выполнимы", x: 68, y: 151, className: "body-copy" }
      ],
      chips: [
        { text: "10 проверок", x: 68, y: 242, w: 122, h: 32 },
        { text: "5 проверок", x: 200, y: 242, w: 104, h: 32 },
        { text: "1 проверка", x: 68, y: 198, w: 104, h: 32 },
        { text: "часть проверок снята", x: 182, y: 198, w: 180, h: 32 }
      ]
    },
    {
      kind: "panel", role: "eval", x: 425, y: 380, w: 350, h: 250,
      iconX: 461, iconY: 352, iconR: 18, icon: "О",
      header: "ВНЕШНИЕ ОЦЕНЩИКИ", meta: "независимое измерение",
      titleLines: [
        { text: "Измеряют", x: 453, y: 294 },
        { text: "возможности модели", x: 453, y: 270 }
      ],
      texts: [
        { text: "Дают проверяемые факты", x: 453, y: 151, className: "body-copy" }
      ],
      measure: {
        x: 453, y: 244, w: 294, h: 58,
        label: "Опасные возможности",
        lineX1: 479, lineY: 206, lineX2: 719,
        dots: [
          { x: 510, y: 206, r: 5 },
          { x: 592, y: 206, r: 5 },
          { x: 688, y: 206, r: 5 }
        ]
      }
    },
    {
      kind: "panel", role: "public", x: 810, y: 380, w: 350, h: 250,
      iconX: 846, iconY: 352, iconR: 18, icon: "П",
      header: "ПУБЛИЧНЫЙ КОНТУР", meta: "общество и государство",
      subcards: [
        {
          className: "civil-card", x: 838, y: 303, w: 294, h: 61,
          title: "Гражданское общество", titleY: 281,
          copy: "Рамки общественного риска", copyY: 259
        },
        {
          className: "state-card", x: 838, y: 225, w: 294, h: 61,
          title: "Государство", titleY: 203,
          copy: "Публичное правило для всех", copyY: 181
        }
      ],
      texts: [
        { text: "Формируют публичные нормы", x: 838, y: 151, className: "body-copy" }
      ]
    },
    {
      kind: "arrows",
      arrows: [
        { x: 215, fromY: 121, toY: 99, className: "flow", headClass: "flow-head" },
        { x: 600, fromY: 121, toY: 99, className: "flow", headClass: "flow-head" },
        { x: 985, fromY: 121, toY: 99, className: "state-flow", headClass: "state-flow-head" }
      ]
    },
    {
      kind: "floor", x: 40, y: 92, w: 1120, h: 50,
      title: "НИЖНЯЯ ПЛАНКА БЕЗОПАСНОСТИ",
      titleX: 600, titleY: 72,
      copy: "минимум, ниже которого нельзя опускаться",
      copyX: 600, copyY: 52
    },
    {
      kind: "conclusion",
      text: "Обязательной для всех планку делает публичное правило",
      x: 600, y: 18
    }
  ];

  const [config, ...items] = diagram;
  const origin = Object.freeze({ x: config.originX, y: config.originY });
  const scale = Object.freeze({ x: config.scaleX, y: config.scaleY });
  const sx = x => origin.x + x * scale.x;
  const sy = y => origin.y - y * scale.y;

  const svg = document.getElementById("scheme");
  const fallback = document.getElementById("fallback");
  const namespace = "http://www.w3.org/2000/svg";

  try {
    const make = (tag, attributes, parent = svg) => {
      const element = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });
      parent.appendChild(element);
      return element;
    };

    const addText = (text, x, y, className, anchor = "start", parent = svg) => {
      const element = make("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, parent);
      element.textContent = text;
      return element;
    };

    const addRect = (x, y, w, h, className, radius = config.radius, parent = svg) =>
      make("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + w) - sx(x),
        height: sy(y - h) - sy(y),
        rx: sx(radius) - sx(0),
        ry: sy(0) - sy(radius),
        class: className
      }, parent);

    const addCircle = (x, y, radius, className, parent = svg) =>
      make("circle", {
        cx: sx(x),
        cy: sy(y),
        r: sx(radius) - sx(0),
        class: className
      }, parent);

    const addLine = (x1, y1, x2, y2, className, parent = svg) =>
      make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      }, parent);

    const drawArrow = arrow => {
      addLine(arrow.x, arrow.fromY, arrow.x, arrow.toY + config.arrowHead, arrow.className);
      make("polygon", {
        points: [
          `${sx(arrow.x)},${sy(arrow.toY)}`,
          `${sx(arrow.x - config.arrowHead)},${sy(arrow.toY + config.arrowHead)}`,
          `${sx(arrow.x + config.arrowHead)},${sy(arrow.toY + config.arrowHead)}`
        ].join(" "),
        class: arrow.headClass
      });
    };

    const drawPanel = panel => {
      const group = make("g", {
        "aria-label": panel.header
      });

      addRect(
        panel.x + config.shadowShift,
        panel.y - config.shadowShift,
        panel.w,
        panel.h,
        "panel-shadow",
        config.radius,
        group
      );
      addRect(panel.x, panel.y, panel.w, panel.h, "panel", config.radius, group);
      addRect(
        panel.x,
        panel.y,
        panel.w,
        config.headerHeight,
        `${panel.role}-head`,
        config.radius,
        group
      );

      addCircle(panel.iconX, panel.iconY, panel.iconR, `${panel.role}-icon`, group);
      addText(panel.icon, panel.iconX, panel.iconY, "icon-text", "middle", group);
      addText(panel.header, panel.iconX + panel.iconR + config.arrowHead, panel.iconY + config.arrowHead, "eyebrow", "start", group);
      addText(panel.meta, panel.iconX + panel.iconR + config.arrowHead, panel.iconY - config.arrowHead, "header-meta", "start", group);

      if (panel.titleLines) {
        panel.titleLines.forEach(line => {
          addText(line.text, line.x, line.y, "section-title", "start", group);
        });
      }

      if (panel.chips) {
        panel.chips.forEach(chip => {
          addRect(chip.x, chip.y, chip.w, chip.h, "chip", config.arrowHead, group);
          addText(
            chip.text,
            chip.x + chip.w / scale.x / (scale.x + scale.x),
            chip.y - chip.h / scale.y / (scale.y + scale.y),
            "chip-text",
            "middle",
            group
          );
        });
      }

      if (panel.measure) {
        const measure = panel.measure;
        addRect(measure.x, measure.y, measure.w, measure.h, "measure-box", config.arrowHead, group);
        addText(
          measure.label,
          measure.x + measure.w / scale.x / (scale.x + scale.x),
          measure.y - config.arrowHead - config.arrowHead,
          "chip-text",
          "middle",
          group
        );
        addLine(measure.lineX1, measure.lineY, measure.lineX2, measure.lineY, "measure-line", group);
        measure.dots.forEach(dot => addCircle(dot.x, dot.y, dot.r, "measure-dot", group));
      }

      if (panel.subcards) {
        panel.subcards.forEach(card => {
          addRect(card.x, card.y, card.w, card.h, card.className, config.arrowHead, group);
          addText(card.title, card.x + config.arrowHead + config.arrowHead, card.titleY, "subcard-title", "start", group);
          addText(card.copy, card.x + config.arrowHead + config.arrowHead, card.copyY, "subcard-copy", "start", group);
        });
      }

      panel.texts.forEach(label => {
        addText(label.text, label.x, label.y, label.className, "start", group);
      });
    };

    items.forEach(item => {
      if (item.kind === "panel") {
        drawPanel(item);
      }

      if (item.kind === "arrows") {
        item.arrows.forEach(drawArrow);
      }

      if (item.kind === "floor") {
        addRect(item.x, item.y, item.w, item.h, "floor", config.radius);
        addText(item.title, item.titleX, item.titleY, "floor-title", "middle");
        addText(item.copy, item.copyX, item.copyY, "floor-copy", "middle");
      }

      if (item.kind === "conclusion") {
        addText(item.text, item.x, item.y, "conclusion", "middle");
      }
    });
  } catch (error) {
    svg.hidden = true;
    fallback.hidden = false;
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
