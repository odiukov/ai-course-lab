<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Почему одно β-расписание даёт разный результат</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fc;
      --panel: #ffffff;
      --panel-strong: #edf1f8;
      --ink: #172033;
      --muted: #58657a;
      --line: #a9b4c7;
      --grid: #d8dee9;
      --long: #6d5ce7;
      --long-soft: #ddd8ff;
      --short: #e06b3c;
      --short-soft: #ffe0d3;
      --signal: #2b9b78;
      --track: #d9e2e1;
      --border: #cbd3df;
      --shadow: #20304a1a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: unset;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      background: var(--bg);
      border: 1px solid var(--border);
      box-shadow: 0 2px 14px var(--shadow);
    }

    h1 {
      margin: unset;
      padding: 14px 18px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 22px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--bg);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 1px;
    }

    .result-card {
      fill: var(--panel-strong);
      stroke: var(--border);
      stroke-width: 1px;
    }

    .axis {
      stroke: var(--line);
      stroke-width: 2px;
      fill: none;
    }

    .guide {
      stroke: var(--grid);
      stroke-width: 1px;
      fill: none;
    }

    .connector {
      stroke: var(--line);
      stroke-width: 1px;
      fill: none;
    }

    .curve-long {
      stroke: var(--long);
      stroke-width: 3px;
      fill: none;
    }

    .curve-short {
      stroke: var(--short);
      stroke-width: 3px;
      fill: none;
    }

    .ticks-long {
      stroke: var(--long);
      stroke-width: 1px;
      fill: none;
    }

    .ticks-short {
      stroke: var(--short);
      stroke-width: 2px;
      fill: none;
    }

    .point-long {
      fill: var(--long);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .point-short {
      fill: var(--short);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .signal-track {
      fill: var(--track);
    }

    .signal-fill {
      fill: var(--signal);
    }

    .row-title {
      fill: var(--ink);
      font-size: 22px;
      font-weight: bold;
    }

    .row-note {
      fill: var(--muted);
      font-size: 14px;
    }

    .endpoint-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .curve-label {
      fill: var(--muted);
      font-size: 13px;
    }

    .alpha-value {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .amplitude-value {
      fill: var(--signal);
      font-size: 17px;
      font-weight: bold;
    }

    .summary {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .fallback {
      padding: 18px;
      font-size: 16px;
      color: var(--ink);
      background: var(--panel);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111622;
        --panel: #192131;
        --panel-strong: #202b3e;
        --ink: #eef2fa;
        --muted: #b3bed0;
        --line: #69758a;
        --grid: #354055;
        --long: #a799ff;
        --long-soft: #453c7d;
        --short: #ff9166;
        --short-soft: #6c3e2d;
        --signal: #61d2ab;
        --track: #3b4c4e;
        --border: #3b4659;
        --shadow: #00000040;
      }
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="figure-title">
    <h1 id="figure-title">Одно β-расписание, два разных финала</h1>
    <div id="diagram"></div>
  </figure>

  <script>
    const DATA = [{
      zero: 0,
      one: 1,
      two: 2,
      half: 0.5,
      originX: 40,
      originY: 420,
      scaleX: 80,
      scaleY: 48,
      canvasWidth: 960,
      canvasHeight: 440,
      logicalRight: 11,
      logicalTop: 8.4,
      panelX: 0.12,
      panelW: 10.76,
      panelH: 3.1,
      panelRadius: 0.12,
      panelBottoms: [4.76, 1.06],
      centers: [6.25, 2.55],
      labelX: 0.35,
      scheduleStartX: 2.45,
      scheduleEndX: 6.65,
      betaOffsetY: 0.82,
      betaLabelOffsetY: 0.42,
      minTickH: 0.08,
      maxTickH: 0.34,
      curveBottomOffsetY: -0.9,
      curveHeight: 1.04,
      curveLabelOffsetY: -0.34,
      cardX: 7.15,
      cardW: 3.42,
      cardBottomOffsetY: -1.03,
      cardH: 2.22,
      alphaTextOffsetY: 0.55,
      amplitudeTextOffsetY: 0.02,
      barOffsetY: -0.58,
      barXInset: 0.35,
      barW: 2.72,
      barH: 0.23,
      pointR: 0.07,
      connectorGap: 0.08,
      dash: 0.08,
      dashGap: 0.07,
      summaryY: 0.43,
      betaStart: 0.0001,
      betaEnd: 0.02,
      rows: [
        {
          T: 1000,
          alphaShown: 0.00004,
          amplitude: 0.006,
          title: "T = 1000",
          note: "тысяча малых потерь подряд",
          alphaText: "ᾱ_T ≈ 0,00004",
          amplitudeText: "остаётся 0,6% амплитуды",
          curveClass: "curve-long",
          tickClass: "ticks-long",
          pointClass: "point-long"
        },
        {
          T: 40,
          alphaShown: 0.667,
          amplitude: 0.82,
          title: "T = 40",
          note: "сорок таких же малых потерь",
          alphaText: "ᾱ_T ≈ 0,667",
          amplitudeText: "остаётся 82% амплитуды",
          curveClass: "curve-short",
          tickClass: "ticks-short",
          pointClass: "point-short"
        }
      ]
    }];

    const [cfg] = DATA;
    const origin = Object.freeze({ x: cfg.originX, y: cfg.originY });
    const scale = Object.freeze({ x: cfg.scaleX, y: cfg.scaleY });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const host = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      const node = (name, attributes, content) => {
        const item = document.createElementNS(ns, name);
        Object.entries(attributes || {}).forEach(([key, value]) => {
          item.setAttribute(key, String(value));
        });
        if (content !== undefined) item.textContent = content;
        return item;
      };

      const lengthX = value => Math.abs(sx(value) - sx(cfg.zero));
      const lengthY = value => Math.abs(sy(value) - sy(cfg.zero));

      const line = (parent, x1, y1, x2, y2, className, extra) => {
        parent.appendChild(node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className,
          ...extra
        }));
      };

      const text = (parent, x, y, value, className, anchor) => {
        parent.appendChild(node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, value));
      };

      const rect = (parent, x, y, width, height, className, radius) => {
        parent.appendChild(node("rect", {
          x: sx(x),
          y: sy(y + height),
          width: sx(x + width) - sx(x),
          height: sy(y) - sy(y + height),
          rx: lengthX(radius),
          class: className
        }));
      };

      const circle = (parent, x, y, radius, className) => {
        parent.appendChild(node("circle", {
          cx: sx(x),
          cy: sy(y),
          r: lengthX(radius),
          class: className
        }));
      };

      const svg = node("svg", {
        viewBox: `0 0 ${cfg.canvasWidth} ${cfg.canvasHeight}`,
        width: cfg.canvasWidth,
        height: cfg.canvasHeight,
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "svg-title svg-description"
      });

      svg.appendChild(node("title", { id: "svg-title" },
        "Сравнение линейного β-расписания при T равном 1000 и 40"));
      svg.appendChild(node("desc", { id: "svg-description" },
        "При одинаковых границах бета тысяча множителей почти уничтожает сигнал, а сорок сохраняют восемьдесят два процента его амплитуды."));

      cfg.rows.forEach((row, rowIndex) => {
        const centerY = cfg.centers[rowIndex];
        const panelBottom = cfg.panelBottoms[rowIndex];
        const betaY = centerY + cfg.betaOffsetY;
        const curveBottom = centerY + cfg.curveBottomOffsetY;
        const cardBottom = centerY + cfg.cardBottomOffsetY;
        const group = node("g", {});

        rect(group, cfg.panelX, panelBottom, cfg.panelW, cfg.panelH,
          "panel", cfg.panelRadius);

        text(group, cfg.labelX, centerY + cfg.alphaTextOffsetY,
          row.title, "row-title", "start");
        text(group, cfg.labelX, centerY + cfg.amplitudeTextOffsetY,
          row.note, "row-note", "start");

        line(group, cfg.scheduleStartX, betaY, cfg.scheduleEndX, betaY, "axis");

        text(group, cfg.scheduleStartX,
          betaY + cfg.betaLabelOffsetY,
          "β = 0,0001", "endpoint-label", "start");
        text(group, cfg.scheduleEndX,
          betaY + cfg.betaLabelOffsetY,
          "β = 0,02", "endpoint-label", "end");

        let tickPath = "";
        let curvePath = "";
        let alphaBar = cfg.one;

        for (let step = cfg.zero; step <= row.T; step += cfg.one) {
          const ratio = step / row.T;
          const x = cfg.scheduleStartX +
            (cfg.scheduleEndX - cfg.scheduleStartX) * ratio;

          if (step > cfg.zero) {
            const betaRatio = (step - cfg.one) / (row.T - cfg.one);
            const beta = cfg.betaStart +
              (cfg.betaEnd - cfg.betaStart) * betaRatio;
            const tickHeight = cfg.minTickH +
              (cfg.maxTickH - cfg.minTickH) *
              ((beta - cfg.betaStart) / (cfg.betaEnd - cfg.betaStart));

            tickPath += `M ${sx(x)} ${sy(betaY - tickHeight * cfg.half)} ` +
              `L ${sx(x)} ${sy(betaY + tickHeight * cfg.half)} `;
            alphaBar *= cfg.one - beta;
          }

          const curveY = curveBottom + cfg.curveHeight * alphaBar;
          curvePath += `${step === cfg.zero ? "M" : "L"} ` +
            `${sx(x)} ${sy(curveY)} `;
        }

        group.appendChild(node("path", {
          d: tickPath,
          class: row.tickClass
        }));

        line(group, cfg.scheduleStartX, curveBottom,
          cfg.scheduleEndX, curveBottom, "guide", {
            "stroke-dasharray":
              `${lengthX(cfg.dash)} ${lengthX(cfg.dashGap)}`
          });

        group.appendChild(node("path", {
          d: curvePath,
          class: row.curveClass,
          "stroke-linecap": "round",
          "stroke-linejoin": "round"
        }));

        const endpointY = curveBottom + cfg.curveHeight * alphaBar;
        circle(group, cfg.scheduleEndX, endpointY,
          cfg.pointR, row.pointClass);

        text(group, cfg.scheduleStartX,
          curveBottom + cfg.curveLabelOffsetY,
          "накопленное ᾱₜ", "curve-label", "start");

        line(group,
          cfg.scheduleEndX + cfg.connectorGap,
          endpointY,
          cfg.cardX - cfg.connectorGap,
          endpointY,
          "connector", {
            "stroke-dasharray":
              `${lengthX(cfg.dash)} ${lengthX(cfg.dashGap)}`
          });

        rect(group, cfg.cardX, cardBottom, cfg.cardW, cfg.cardH,
          "result-card", cfg.panelRadius);

        text(group, cfg.cardX + cfg.cardW * cfg.half,
          centerY + cfg.alphaTextOffsetY,
          row.alphaText, "alpha-value", "middle");

        text(group, cfg.cardX + cfg.cardW * cfg.half,
          centerY + cfg.amplitudeTextOffsetY,
          row.amplitudeText, "amplitude-value", "middle");

        const barX = cfg.cardX + cfg.barXInset;
        const barY = centerY + cfg.barOffsetY;
        rect(group, barX, barY, cfg.barW, cfg.barH,
          "signal-track", cfg.pointR);
        rect(group, barX, barY, cfg.barW * row.amplitude,
          cfg.barH, "signal-fill", cfg.pointR);

        svg.appendChild(group);
      });

      text(svg, cfg.logicalRight * cfg.half, cfg.summaryY,
        "Одинаковые границы β, но разное число множителей → разная степень зашумления",
        "summary", "middle");

      host.replaceChildren(svg);
    } catch (error) {
      const host = document.getElementById("diagram");
      const fallback = document.createElement("p");
      fallback.className = "fallback";
      fallback.textContent =
        "Схема должна была показать: при T = 1000 ᾱ_T ≈ 0,00004 и остаётся 0,6% амплитуды данных; при T = 40 ᾱ_T ≈ 0,667 и остаётся 82%.";
      host.replaceChildren(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
