<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Односторонний поток от исполнителя к человеку</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f6f8fc;
      --panel: #ffffff;
      --panel-strong: #edf3ff;
      --artifact: #f1f6ff;
      --report: #f7f2ff;
      --score: #ffffff;
      --human: #eef9f3;
      --ink: #172033;
      --muted: #59657a;
      --line: #49617f;
      --builder-accent: #356ae6;
      --reviewer-accent: #7555c7;
      --human-accent: #25835f;
      --note: #fff7db;
      --note-line: #b98513;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192231;
        --panel-strong: #1c2a42;
        --artifact: #1b2940;
        --report: #27213b;
        --score: #1b2331;
        --human: #172d27;
        --ink: #eef3ff;
        --muted: #b5c0d3;
        --line: #91a7c4;
        --builder-accent: #77a2ff;
        --reviewer-accent: #b49aef;
        --human-accent: #69c69d;
        --note: #352d17;
        --note-line: #e1b84f;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 14px 18px 8px;
      font-size: 21px;
      line-height: 1.2;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--page);
    }

    .flow {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      fill: var(--line);
    }

    .box {
      stroke-width: 2px;
    }

    .builder-box {
      fill: var(--panel-strong);
      stroke: var(--builder-accent);
    }

    .artifact-box {
      fill: var(--artifact);
      stroke: var(--builder-accent);
    }

    .reviewer-box {
      fill: var(--panel);
      stroke: var(--reviewer-accent);
    }

    .report-box {
      fill: var(--report);
      stroke: var(--reviewer-accent);
    }

    .score-box {
      fill: var(--score);
      stroke: var(--reviewer-accent);
      stroke-width: 1.5px;
    }

    .human-box {
      fill: var(--human);
      stroke: var(--human-accent);
    }

    .note-box {
      fill: var(--note);
      stroke: var(--note-line);
      stroke-width: 1.5px;
    }

    text {
      fill: var(--ink);
      font-size: 14px;
    }

    .role {
      font-size: 18px;
      font-weight: bold;
    }

    .artifact-title,
    .report-title {
      font-size: 15px;
      font-weight: bold;
    }

    .small {
      fill: var(--muted);
      font-size: 12px;
    }

    .score-range {
      fill: var(--reviewer-accent);
      font-size: 13px;
      font-weight: bold;
    }

    .note-text {
      font-size: 13px;
      font-weight: bold;
    }

    .fallback {
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Односторонний поток от исполнителя к человеку</h1>
    <svg id="diagram" viewBox="0 0 1200 460" width="1200" height="460"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Builder передаёт четыре артефакта ревьюеру, а ревьюер — отчёт с пятью оценками человеку</title>
      <desc id="svg-desc">Поток направлен только вперёд. Стрелки от ревьюера обратно к diff нет.</desc>
    </svg>
  </main>

  <script>
    const diagramData = {
      zero: 0,
      canvas: { width: 1200, height: 460 },
      corners: { role: 18, item: 11, score: 8, note: 14 },
      arrow: { length: 13, halfWidth: 6 },
      builder: {
        x: 28, y: 96, width: 164, height: 238,
        labels: [
          { x: 110, y: 153, text: "ИСПОЛНИТЕЛЬ", className: "role" },
          { x: 110, y: 181, text: "Builder", className: "artifact-title" },
          { x: 110, y: 230, text: "передаёт пакет", className: "small" },
          { x: 110, y: 250, text: "следов работы", className: "small" }
        ]
      },
      artifacts: [
        {
          x: 232, y: 40, width: 176, height: 58,
          title: "diff", subtitle: "изменения",
          titleY: 65, subtitleY: 84,
          from: { x: 192, y: 125 }, to: { x: 232, y: 69 },
          out: { x: 408, y: 69 }, review: { x: 452, y: 125 }
        },
        {
          x: 232, y: 126, width: 176, height: 58,
          title: "state", subtitle: "текущее состояние",
          titleY: 151, subtitleY: 170,
          from: { x: 192, y: 177 }, to: { x: 232, y: 155 },
          out: { x: 408, y: 155 }, review: { x: 452, y: 174 }
        },
        {
          x: 232, y: 212, width: 176, height: 58,
          title: "feedback", subtitle: "обратная связь",
          titleY: 237, subtitleY: 256,
          from: { x: 192, y: 253 }, to: { x: 232, y: 241 },
          out: { x: 408, y: 241 }, review: { x: 452, y: 251 }
        },
        {
          x: 232, y: 298, width: 176, height: 58,
          title: "verdict", subtitle: "итоговый вердикт",
          titleY: 323, subtitleY: 342,
          from: { x: 192, y: 305 }, to: { x: 232, y: 327 },
          out: { x: 408, y: 327 }, review: { x: 452, y: 302 }
        }
      ],
      reviewer: {
        x: 452, y: 96, width: 176, height: 238,
        labels: [
          { x: 540, y: 153, text: "РЕВЬЮЕР", className: "role" },
          { x: 540, y: 181, text: "Reviewer", className: "artifact-title" },
          { x: 540, y: 226, text: "сверяет с чек-листом", className: "small" },
          { x: 540, y: 248, text: "и пишет отчёт", className: "small" },
          { x: 540, y: 292, text: "diff — только чтение", className: "small" }
        ]
      },
      reportArrow: {
        from: { x: 628, y: 215 },
        to: { x: 684, y: 215 }
      },
      report: {
        x: 684, y: 22, width: 308, height: 390,
        title: { x: 838, y: 51, text: "review_report.json" },
        subtitle: { x: 838, y: 72, text: "пять независимых оценок" },
        scores: [
          { x: 704, y: 88, width: 268, height: 43, labelX: 719, labelY: 114, rangeX: 955, rangeY: 114, label: "Соответствие задаче", range: "0–2" },
          { x: 704, y: 144, width: 268, height: 43, labelX: 719, labelY: 170, rangeX: 955, rangeY: 170, label: "Дисциплина скоупа", range: "0–2" },
          { x: 704, y: 200, width: 268, height: 43, labelX: 719, labelY: 226, rangeX: 955, rangeY: 226, label: "Допущения", range: "0–2" },
          { x: 704, y: 256, width: 268, height: 43, labelX: 719, labelY: 282, rangeX: 955, rangeY: 282, label: "Качество проверки", range: "0–2" },
          { x: 704, y: 312, width: 268, height: 43, labelX: 719, labelY: 338, rangeX: 955, rangeY: 338, label: "Готовность передачи", range: "0–2" }
        ],
        total: { x: 838, y: 386, text: "Итого: 0–10" }
      },
      humanArrow: {
        from: { x: 992, y: 216 },
        to: { x: 1032, y: 216 }
      },
      human: {
        x: 1032, y: 139, width: 142, height: 154,
        labels: [
          { x: 1103, y: 181, text: "ЧЕЛОВЕК", className: "role" },
          { x: 1103, y: 210, text: "Human", className: "artifact-title" },
          { x: 1103, y: 232, text: "Sign-Off", className: "artifact-title" },
          { x: 1103, y: 264, text: "принять или вернуть", className: "small" }
        ]
      },
      note: {
        x: 232, y: 424, width: 760, height: 28,
        textX: 612, textY: 443,
        text: "Только вперёд: Reviewer не изменяет diff и не стирает замечания"
      },
      fallback: {
        x: 600, y: 208,
        lines: [
          { y: 208, text: "Builder → diff, state, feedback, verdict → Reviewer" },
          { y: 242, text: "Reviewer → пять оценок и review_report.json → Human Sign-Off" },
          { y: 276, text: "Стрелки от Reviewer обратно к diff нет." }
        ]
      }
    };

    const origin = { x: 0, y: 0 };
    const scale = 1;
    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const element = (name, attributes, className) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        if (className) node.setAttribute("class", className);
        return node;
      };

      const add = node => {
        svg.appendChild(node);
        return node;
      };

      const widthPx = width => sx(width) - sx(diagramData.zero);
      const heightPx = height => sy(height) - sy(diagramData.zero);

      const rect = (box, className, radius) => add(element("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: widthPx(box.width),
        height: heightPx(box.height),
        rx: widthPx(radius),
        ry: heightPx(radius)
      }, className));

      const text = (label, anchor, className) => {
        const node = element("text", {
          x: sx(label.x),
          y: sy(label.y),
          "text-anchor": anchor
        }, className || label.className);
        node.textContent = label.text;
        return add(node);
      };

      const arrow = (from, to) => {
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const distance = Math.hypot(dx, dy);
        const ux = dx / distance;
        const uy = dy / distance;
        const baseX = to.x - ux * diagramData.arrow.length;
        const baseY = to.y - uy * diagramData.arrow.length;
        const wingX = -uy * diagramData.arrow.halfWidth;
        const wingY = ux * diagramData.arrow.halfWidth;

        add(element("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(baseX),
          y2: sy(baseY)
        }, "flow"));

        add(element("polygon", {
          points: [
            `${sx(to.x)},${sy(to.y)}`,
            `${sx(baseX + wingX)},${sy(baseY + wingY)}`,
            `${sx(baseX - wingX)},${sy(baseY - wingY)}`
          ].join(" ")
        }, "arrow-head"));
      };

      add(element("rect", {
        x: sx(diagramData.zero),
        y: sy(diagramData.zero),
        width: widthPx(diagramData.canvas.width),
        height: heightPx(diagramData.canvas.height)
      }, "background")).setAttribute("fill", "var(--page)");

      diagramData.artifacts.forEach(item => {
        arrow(item.from, item.to);
        arrow(item.out, item.review);
      });
      arrow(diagramData.reportArrow.from, diagramData.reportArrow.to);
      arrow(diagramData.humanArrow.from, diagramData.humanArrow.to);

      rect(diagramData.builder, "box builder-box", diagramData.corners.role);
      diagramData.builder.labels.forEach(label => text(label, "middle"));

      diagramData.artifacts.forEach(item => {
        rect(item, "box artifact-box", diagramData.corners.item);
        text({ x: item.x + item.width / diagramData.arrow.halfWidth * diagramData.arrow.halfWidth / diagramData.arrow.length, y: item.titleY, text: item.title }, "middle", "artifact-title");
        text({ x: item.x + item.width / diagramData.arrow.halfWidth * diagramData.arrow.halfWidth / diagramData.arrow.length, y: item.subtitleY, text: item.subtitle }, "middle", "small");
      });

      rect(diagramData.reviewer, "box reviewer-box", diagramData.corners.role);
      diagramData.reviewer.labels.forEach(label => text(label, "middle"));

      rect(diagramData.report, "box report-box", diagramData.corners.role);
      text(diagramData.report.title, "middle", "report-title");
      text(diagramData.report.subtitle, "middle", "small");

      diagramData.report.scores.forEach(score => {
        rect(score, "score-box", diagramData.corners.score);
        text({ x: score.labelX, y: score.labelY, text: score.label }, "start");
        text({ x: score.rangeX, y: score.rangeY, text: score.range }, "end", "score-range");
      });
      text(diagramData.report.total, "middle", "report-title");

      rect(diagramData.human, "box human-box", diagramData.corners.role);
      diagramData.human.labels.forEach(label => text(label, "middle"));

      rect(diagramData.note, "note-box", diagramData.corners.note);
      text({
        x: diagramData.note.textX,
        y: diagramData.note.textY,
        text: diagramData.note.text
      }, "middle", "note-text");
    } catch (error) {
      const svg = document.getElementById("diagram");
      while (svg.lastChild && !["title", "desc"].includes(svg.lastChild.localName)) {
        svg.removeChild(svg.lastChild);
      }
      const namespace = "http://www.w3.org/2000/svg";
      diagramData.fallback.lines.forEach(line => {
        const node = document.createElementNS(namespace, "text");
        node.setAttribute("x", sx(diagramData.fallback.x));
        node.setAttribute("y", sy(line.y));
        node.setAttribute("text-anchor", "middle");
        node.setAttribute("class", "fallback");
        node.textContent = line.text;
        svg.appendChild(node);
      });
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
