<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Сквозной цикл AI Scientist v2</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#f7f9fc;
  --panel:#ffffff;
  --ink:#172033;
  --muted:#5b6475;
  --border:#c8d0dc;
  --flow:#287b8e;
  --flow-fill:#dff3f5;
  --weak:#b43b42;
  --weak-fill:#fdebed;
  --vision:#7049a8;
  --vision-fill:#eee7f8;
  --note:#fff4ce;
  --note-border:#b98b22;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111620;
    --panel:#19212d;
    --ink:#edf2fa;
    --muted:#b4bfce;
    --border:#465264;
    --flow:#65c4d1;
    --flow-fill:#17353c;
    --weak:#ff8990;
    --weak-fill:#3e2228;
    --vision:#c3a0f2;
    --vision-fill:#302643;
    --note:#352f1d;
    --note-border:#ddb853;
  }
}
html,body{margin:unset;padding:unset;background:var(--bg)}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.title{fill:var(--ink);font-size:28px;font-weight:bold}
.subtitle{fill:var(--muted);font-size:15px}
.card{fill:var(--panel);stroke:var(--border);stroke-width:2px}
.card-weak{fill:var(--weak-fill);stroke:var(--weak);stroke-width:2px}
.card-vision{fill:var(--vision-fill);stroke:var(--vision);stroke-width:2px}
.accent{stroke:var(--flow);stroke-width:5px;stroke-linecap:round}
.accent-weak{stroke:var(--weak);stroke-width:5px;stroke-linecap:round}
.accent-vision{stroke:var(--vision);stroke-width:5px;stroke-linecap:round}
.number-disc{fill:var(--flow-fill);stroke:var(--flow);stroke-width:2px}
.number-disc-weak{fill:var(--weak-fill);stroke:var(--weak);stroke-width:2px}
.number-disc-vision{fill:var(--vision-fill);stroke:var(--vision);stroke-width:2px}
.stage-number{fill:var(--ink);font-size:13px;font-weight:bold}
.stage-title{fill:var(--ink);font-size:15px;font-weight:bold}
.stage-detail{fill:var(--muted);font-size:12px}
.arrow,.loop{fill:none;stroke:var(--flow);stroke-width:3px;stroke-linecap:round;stroke-linejoin:round}
.arrow-head{fill:var(--flow)}
.loop-label{fill:var(--flow);font-size:12px;font-weight:bold}
.connector{stroke:var(--weak);stroke-width:2px;fill:none}
.callout{fill:var(--weak-fill);stroke:var(--weak);stroke-width:2px}
.callout-title{fill:var(--weak);font-size:13px;font-weight:bold}
.callout-text{fill:var(--ink);font-size:12px}
.insight{fill:var(--note);stroke:var(--note-border);stroke-width:2px}
.insight-rule{stroke:var(--note-border);stroke-width:2px}
.insight-title{fill:var(--ink);font-size:15px;font-weight:bold}
.insight-text{fill:var(--ink);font-size:13px}
.fallback{fill:var(--ink);font-size:17px}
</style>
</head>
<body>
<svg viewBox="0 0 1180 468" width="1180" height="468"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Сквозной цикл AI Scientist v2</title>
  <desc id="svgDesc">Семь стадий от идеи до подачи статьи, две петли возврата и слабые проверки новизны и эксперимента.</desc>
  <text id="heading" class="title">Сквозной цикл AI Scientist v2</text>
  <text id="subheading" class="subtitle">Семь связанных станций, две локальные петли возврата и две слабые проверки</text>
  <g id="drawing"></g>
</svg>
<script>
const D={
  title:{x:0,y:16},subtitle:{x:0,y:48},
  dash:[7,6],
  cards:[
    {box:[0,85,130,215],c:[65,105],r:16,n:"1",kind:"normal",
      title:[["ИДЕЯ",65,143]],detail:[["перебор",65,181],["гипотез",65,200]]},
    {box:[160,85,290,215],c:[225,105],r:16,n:"2",kind:"weak",
      title:[["ПРОВЕРКА",225,138],["НОВИЗНЫ",225,157]],detail:[["поиск по",225,185],["литературе",225,203]]},
    {box:[320,85,450,215],c:[385,105],r:16,n:"3",kind:"weak",
      title:[["ЭКСПЕРИМЕНТ",385,143]],detail:[["план • код",385,181],["песочница",385,200]]},
    {box:[480,85,610,215],c:[545,105],r:16,n:"4",kind:"vision",
      title:[["ГРАФИКИ",545,140]],detail:[["vision + text",545,174],["перерисовка",545,191],["добавление v2",545,208]]},
    {box:[640,85,770,215],c:[705,105],r:16,n:"5",kind:"normal",
      title:[["ТЕКСТ",705,143]],detail:[["черновик",705,181],["статьи",705,200]]},
    {box:[800,85,930,215],c:[865,105],r:16,n:"6",kind:"normal",
      title:[["РЕЦЕНЗИЯ",865,143]],detail:[["внутренние",865,181],["замечания",865,200]]},
    {box:[960,85,1110,215],c:[1035,105],r:16,n:"7",kind:"normal",
      title:[["ПОДАЧА",1035,143]],detail:[["необязательная",1035,181],["станция",1035,200]]}
  ],
  arrows:[
    {line:[130,150,150,150],head:[[150,143],[160,150],[150,157]]},
    {line:[290,150,310,150],head:[[310,143],[320,150],[310,157]]},
    {line:[450,150,470,150],head:[[470,143],[480,150],[470,157]]},
    {line:[610,150,630,150],head:[[630,143],[640,150],[630,157]]},
    {line:[770,150,790,150],head:[[790,143],[800,150],[790,157]]},
    {line:[930,150,950,150],head:[[950,143],[960,150],[950,157]]}
  ],
  loops:[
    {points:[[430,215],[430,248],[340,248],[340,224]],
      head:[[333,225],[340,215],[347,225]],
      label:["ошибка → исправить код → повторить",385,270]},
    {points:[[900,215],[900,248],[690,248],[690,224]],
      head:[[683,225],[690,215],[697,225]],
      label:["замечания → переписать",795,270]}
  ],
  callouts:[
    {box:[10,292,315,355],connector:[190,215,165,292],
      title:["СЛАБАЯ ПРОВЕРКА НОВИЗНЫ",25,312],
      text:[["известное регулярно принимается",25,333],["за новое",25,349]]},
    {box:[330,292,740,355],connector:[450,215,505,292],
      title:["СЛАБАЯ ПРОВЕРКА ЭКСПЕРИМЕНТА",345,312],
      text:[["ловит падение кода, но не бессмысленный опыт",345,333],
            ["42% экспериментов падали из-за ошибок кода",345,349]]}
  ],
  insight:{box:[10,377,1110,433],rule:[365,377,365,433],
    title:[["ПЕРЕДАЧА ДАЛЬШЕ",30,400],["≠ ПРОВЕРКА КАЧЕСТВА",30,420]],
    text:[["Успешно завершённая станция не доказывает, что идея новая,",390,400],
          ["эксперимент осмыслен, а итоговая статья хороша.",390,420]]},
  fallback:[
    ["Схема должна была показать путь: идея → новизна → эксперимент → графики → текст → рецензия → подача.",0,190],
    ["Слабые проверки находятся на стадиях новизны и эксперимента.",0,225]
  ]
};
const origin={x:35,y:20};
const scale={x:1,y:1};
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

try{
  const NS="http://www.w3.org/2000/svg";
  const layer=document.getElementById("drawing");
  const make=(tag,cls)=>{
    const el=document.createElementNS(NS,tag);
    if(cls)el.setAttribute("class",cls);
    return el;
  };
  const box=(el,b)=>{
    el.setAttribute("x",sx(b[0]));
    el.setAttribute("y",sy(b[1]));
    el.setAttribute("width",sx(b[2])-sx(b[0]));
    el.setAttribute("height",sy(b[3])-sy(b[1]));
  };
  const line=(el,p)=>{
    el.setAttribute("x1",sx(p[0]));
    el.setAttribute("y1",sy(p[1]));
    el.setAttribute("x2",sx(p[2]));
    el.setAttribute("y2",sy(p[3]));
  };
  const polygon=(el,pts)=>{
    el.setAttribute("points",pts.map(p=>sx(p[0])+","+sy(p[1])).join(" "));
  };
  const text=(parent,rows,cls,anchor)=>{
    const el=make("text",cls);
    el.setAttribute("text-anchor",anchor);
    rows.forEach(row=>{
      const span=make("tspan");
      span.setAttribute("x",sx(row[1]));
      span.setAttribute("y",sy(row[2]));
      span.textContent=row[0];
      el.appendChild(span);
    });
    parent.appendChild(el);
  };
  const path=(el,pts)=>{
    el.setAttribute("d",pts.map((p,key)=>
      (key?"L ":"M ")+sx(p[0])+" "+sy(p[1])
    ).join(" "));
  };

  const heading=document.getElementById("heading");
  heading.setAttribute("x",sx(D.title.x));
  heading.setAttribute("y",sy(D.title.y));
  const subheading=document.getElementById("subheading");
  subheading.setAttribute("x",sx(D.subtitle.x));
  subheading.setAttribute("y",sy(D.subtitle.y));

  D.arrows.forEach(a=>{
    const shaft=make("line","arrow");
    line(shaft,a.line);
    layer.appendChild(shaft);
    const head=make("polygon","arrow-head");
    polygon(head,a.head);
    layer.appendChild(head);
  });

  D.cards.forEach(card=>{
    const group=make("g");
    const rect=make("rect",card.kind==="weak"?"card-weak":card.kind==="vision"?"card-vision":"card");
    box(rect,card.box);
    group.appendChild(rect);

    const top=make("line",card.kind==="weak"?"accent-weak":card.kind==="vision"?"accent-vision":"accent");
    line(top,[card.box[0],card.box[1],card.box[2],card.box[1]]);
    group.appendChild(top);

    const disc=make("circle",card.kind==="weak"?"number-disc-weak":card.kind==="vision"?"number-disc-vision":"number-disc");
    disc.setAttribute("cx",sx(card.c[0]));
    disc.setAttribute("cy",sy(card.c[1]));
    disc.setAttribute("r",sx(card.r)-sx(0));
    group.appendChild(disc);

    text(group,[[card.n,card.c[0],card.c[1]]],"stage-number","middle");
    text(group,card.title,"stage-title","middle");
    text(group,card.detail,"stage-detail","middle");
    layer.appendChild(group);
  });

  D.loops.forEach(loop=>{
    const route=make("path","loop");
    path(route,loop.points);
    layer.appendChild(route);
    const head=make("polygon","arrow-head");
    polygon(head,loop.head);
    layer.appendChild(head);
    text(layer,[loop.label],"loop-label","middle");
  });

  D.callouts.forEach(note=>{
    const connector=make("line","connector");
    line(connector,note.connector);
    connector.setAttribute("stroke-dasharray",D.dash.map(v=>sx(v)-sx(0)).join(" "));
    layer.appendChild(connector);

    const rect=make("rect","callout");
    box(rect,note.box);
    layer.appendChild(rect);
    text(layer,[note.title],"callout-title","start");
    text(layer,note.text,"callout-text","start");
  });

  const insight=make("rect","insight");
  box(insight,D.insight.box);
  layer.appendChild(insight);
  const rule=make("line","insight-rule");
  line(rule,D.insight.rule);
  layer.appendChild(rule);
  text(layer,D.insight.title,"insight-title","start");
  text(layer,D.insight.text,"insight-text","start");
}catch(error){
  const NS="http://www.w3.org/2000/svg";
  const layer=document.getElementById("drawing");
  layer.replaceChildren();
  const message=document.createElementNS(NS,"text");
  message.setAttribute("class","fallback");
  D.fallback.forEach(row=>{
    const span=document.createElementNS(NS,"tspan");
    span.setAttribute("x",sx(row[1]));
    span.setAttribute("y",sy(row[2]));
    span.textContent=row[0];
    message.appendChild(span);
  });
  layer.appendChild(message);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
