<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Блок энкодера: две развилки</title>
<style>
  :root{
    --bg:#fbfbf9; --fg:#1a1a1a; --line:#1a1a1a;
    --loop:#b25a00; --node:#0b6b6b; --muted:#5a5a5a; --panel:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171a; --fg:#e8e8e6; --line:#e8e8e6;
      --loop:#f0a33c; --node:#4fd0cc; --muted:#a0a4a8; --panel:#1c2024;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:12px 10px 14px;
        font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  h2{margin:0 0 8px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .fail{color:var(--muted);font-size:13px;margin:8px 0 0}
  text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:var(--fg)}
  text.small{font-size:11px;fill:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Блок энкодера: магистраль и две развилки подряд</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (координаты в условных единицах) ----
    var D = {
      main: 0,          // высота магистрали
      loop: -2.2,       // высота нижней петли
      xIn: 0, xFork1: 2, xLN1: 4, xSub1: 7.5, xPlus1: 11,
      xFork2: 13, xLN2: 15, xSub2: 18.5, xPlus2: 22, xOut: 24.5,
      boxW: 2.6, boxH: 1.5, r: 0.55
    };
    var nodes = [
      {x:D.xLN1, y:D.loop, w:1.7, label:"LN"},
      {x:D.xSub1, y:D.loop, w:D.boxW, label:"MHA"},
      {x:D.xLN2, y:D.loop, w:1.7, label:"LN"},
      {x:D.xSub2, y:D.loop, w:D.boxW, label:"FFN"}
    ];

    // ---- одна пара функций перевода ----
    var origin = {x:46, y:110}, scale = 26;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var VB_W = 760, VB_H = 200;
    var LW = 2, PAD = 7;

    var s = [];
    function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
    function line(x1,y1,x2,y2,cls){
      s.push('<path d="M'+sx(x1)+' '+sy(y1)+' L'+sx(x2)+' '+sy(y2)+'" '+cls+'/>');
    }
    function poly(pts,cls){
      var d = pts.map(function(p,i){ return (i?'L':'M')+sx(p[0])+' '+sy(p[1]); }).join(' ');
      s.push('<path d="'+d+'" '+cls+'/>');
    }
    function label(x,y,dx,dy,anchor,txt,cls){
      s.push('<text x="'+(sx(x)+dx)+'" y="'+(sy(y)+dy)+'" text-anchor="'+anchor+'"'+
             (cls?' class="'+cls+'"':'')+'>'+esc(txt)+'</text>');
    }

    var MAIN = 'fill="none" stroke="var(--line)" stroke-width="'+(LW+0.6)+'" stroke-linecap="round"';
    var LOOP = 'fill="none" stroke="var(--loop)" stroke-width="'+LW+'" stroke-linejoin="round" stroke-linecap="round"';
    var BOX  = 'fill="var(--panel)" stroke="var(--node)" stroke-width="'+LW+'"';

    // магистраль: непрерывная от входа до выхода
    line(D.xIn, D.main, D.xOut, D.main, MAIN);

    // наконечник на выходе магистрали
    (function(){
      var t = 0.5, h = 0.32;
      poly([[D.xOut,D.main],[D.xOut-t,D.main+h],[D.xOut-t,D.main-h],[D.xOut,D.main]],
           'fill="var(--line)" stroke="var(--line)" stroke-width="'+LW+'"');
    })();

    // две петли: отщипнуть копию вниз, пройти LN + подслой, вернуться в «+»
    function loopPath(xFork, xPlus, xA, xB, wA, wB){
      poly([[xFork,D.main],[xFork,D.loop],[xA-wA/2,D.loop]], LOOP);
      line(xA+wA/2, D.loop, xB-wB/2, D.loop, LOOP);
      poly([[xB+wB/2,D.loop],[xPlus,D.loop],[xPlus,D.main-D.r]], LOOP);
      // наконечник входа в «+» снизу
      var t = 0.45, w = 0.28;
      poly([[xPlus,D.main-D.r],[xPlus-w,D.main-D.r-t],[xPlus+w,D.main-D.r-t],[xPlus,D.main-D.r]],
           'fill="var(--loop)" stroke="var(--loop)" stroke-width="'+LW+'"');
    }
    loopPath(D.xFork1, D.xPlus1, D.xLN1, D.xSub1, 1.7, D.boxW);
    loopPath(D.xFork2, D.xPlus2, D.xLN2, D.xSub2, 1.7, D.boxW);

    // точки развилок
    [D.xFork1, D.xFork2].forEach(function(x){
      s.push('<circle cx="'+sx(x)+'" cy="'+sy(D.main)+'" r="'+(0.16*scale)+'" fill="var(--loop)"/>');
    });

    // кружки «+»
    [D.xPlus1, D.xPlus2].forEach(function(x){
      s.push('<circle cx="'+sx(x)+'" cy="'+sy(D.main)+'" r="'+(D.r*scale)+'" fill="var(--bg)" stroke="var(--line)" stroke-width="'+LW+'"/>');
      var a = D.r*0.55;
      s.push('<path d="M'+sx(x-a)+' '+sy(D.main)+' L'+sx(x+a)+' '+sy(D.main)+
             ' M'+sx(x)+' '+sy(D.main-a)+' L'+sx(x)+' '+sy(D.main+a)+'" stroke="var(--line)" stroke-width="'+LW+'"/>');
    });

    // блоки LN / MHA / FFN
    nodes.forEach(function(n){
      var x0 = sx(n.x-n.w/2), y0 = sy(n.y+D.boxH/2);
      s.push('<rect x="'+x0+'" y="'+y0+'" width="'+(n.w*scale)+'" height="'+(D.boxH*scale)+'" rx="'+(0.25*scale)+'" '+BOX+'/>');
      s.push('<text x="'+sx(n.x)+'" y="'+(sy(n.y)+5)+'" text-anchor="middle">'+esc(n.label)+'</text>');
    });

    // подписи: разведены выше/ниже линий, у хвостов
    label(D.xIn, D.main, -PAD, -PAD, 'end', 'вход x');
    label(D.xOut, D.main, PAD, -PAD, 'end', 'выход');
    label(D.xFork1, D.main, PAD, -PAD, 'start', 'развилка 1', 'small');
    label(D.xFork2, D.main, PAD, -PAD, 'start', 'развилка 2 — от выхода первого «+»', 'small');
    label((D.xFork1+D.xPlus1)/2, D.main, 0, -PAD*2.2, 'middle', 'residual: идёт прямо, не прерывается', 'small');
    label((D.xLN1+D.xSub1)/2, D.loop, 0, PAD*3.2, 'middle', 'x + sublayer(LN(x))', 'small');
    label((D.xLN2+D.xSub2)/2, D.loop, 0, PAD*3.2, 'middle', 'вход — уже сумма после attention', 'small');

    host.innerHTML =
      '<svg viewBox="0 0 '+VB_W+' '+VB_H+'" width="'+VB_W+'" height="'+VB_H+'" '+
      'preserveAspectRatio="xMidYMid meet" role="img" '+
      'aria-label="Магистраль слева направо с двумя последовательными residual-развилками: LN и MHA, затем LN и FFN">'+
      s.join('')+'</svg>';
  }catch(e){
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна показывать: '+
      'прямую линию от входа x к выходу, которая ни разу не прерывается; на ней две развилки подряд. '+
      'Первая уводит копию вниз через LN и MHA обратно в кружок «+». '+
      'Вторая отходит НЕ от входа x, а от выхода первого «+», и ведёт через LN и FFN во второй «+». '+
      'То есть x + sublayer(LN(x)), дважды и последовательно.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
