<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Память миллиона гауссиан</title>
<style>
  :root {
    color-scheme: light dark;
    --page: whitesmoke;
    --panel: white;
    --panel-soft: aliceblue;
    --ink: midnightblue;
    --muted: slategray;
    --line: lightslategray;
    --position: royalblue;
    --rotation: mediumpurple;
    --scale-color: seagreen;
    --alpha: darkorange;
    --color: crimson;
    --result: lemonchiffon;
    --result-line: darkorange;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: midnightblue;
      --panel: darkslategray;
      --panel-soft: slategray;
      --ink: white;
      --muted: gainsboro;
      --line: lightsteelblue;
      --position: cornflowerblue;
      --rotation: plum;
      --scale-color: mediumseagreen;
      --alpha: orange;
      --color: lightcoral;
      --result: darkgoldenrod;
      --result-line: gold;
    }
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    max-width: 960px;
    background: var(--panel);
  }

  header {
    padding: 10px 16px;
    background: var(--panel);
  }

  .heading {
    font-size: 22px;
    font-weight: bold;
  }

  .subheading {
    padding-top: 4px;
    color: var(--muted);
    font-size: 14px;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    background: var(--panel);
    border-top: 1px solid var(--line);
    font-family: inherit;
    shape-rendering: geometricPrecision;
  }

  .box {
    fill: var(--panel-soft);
    stroke: var(--line);
    stroke-width: 1.5;
  }

  .memory-box {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2;
  }

  .result-box {
    fill: var(--result);
    stroke: var(--result-line);
    stroke-width: 2;
  }

  .outline {
    fill: none;
    stroke: var(--line);
    stroke-width: 1.5;
  }

  .connector {
    fill: none;
    stroke: var(--ink);
    stroke-width: 2;
  }

  .position-fill { fill: var(--position); }
  .rotation-fill { fill: var(--rotation); }
  .scale-fill { fill: var(--scale-color); }
  .alpha-fill { fill: var(--alpha); }
  .color-fill { fill: var(--color); }

  .title {
    fill: var(--ink);
    font-size: 17px;
    font-weight: bold;
  }

  .body {
    fill: var(--ink);
    font-size: 15px;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .segment-number {
    fill: white;
    font-size: 15px;
    font-weight: bold;
  }

  .formula {
    fill: var(--ink);
    font-size: 22px;
    font-weight: bold;
  }

  .result-number {
    fill: var(--ink);
    font-size: 30px;
    font-weight: bold;
  }

  .result-unit {
    fill: var(--ink);
    font-size: 16px;
    font-weight: bold;
  }

  #fallback {
    padding: 16px;
    background: var(--panel-soft);
    color: var(--ink);
    font-size: 15px;
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="heading">Память миллиона гауссиан</div>
    <div class="subheading">У одной гауссианы 59 параметров — и 48 из них описывают цвет.</div>
  </header>

  <svg id="diagram"
       viewBox="0 0 960 448"
       width="960"
       height="448"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="diagram-title diagram-description">
  </svg>

  <div id="fallback">
    Одна гауссиана хранит 3 параметра позиции, 4 поворота, 3 масштаба,
    1 непрозрачности и 48 цвета. Миллион таких гауссиан занимает около 236 МБ.
  </div>
</main>

<script>
const data = [{
  zero: 0,
  map: { originX: 0, originY: 0, scaleX: 10, scaleY: 10 },
  total: 59,
  bytes: 4,
  million: 1000000,
  pad: { none: 0, near: 4, far: 8, up: -4, down: 5 },
  radius: { box: 0.7, dot: 0.75 },
  arrow: { size: 1.2, wing: 0.65 },
  top: {
    title: { x: 5, y: 2.8, dx: 0, dy: 0 },
    gaussian: { cx: 13.5, cy: 10.1 },
    ellipses: [
      { rx: 7.1, ry: 4.2, cls: "position-fill" },
      { rx: 5.4, ry: 3.2, cls: "rotation-fill" },
      { rx: 3.7, ry: 2.2, cls: "color-fill" }
    ],
    core: { r: 0.8 },
    caption: { x: 13.5, y: 15.5, dx: 0, dy: 0 },
    arrow: { x1: 21.2, y1: 10.1, x2: 25.3, y2: 10.1 },
    arrowLabel: { x: 21.2, y: 7.9, dx: 0, dy: -4 }
  },
  bar: { x: 26.5, y: 6.5, w: 64.5, h: 7.2, r: 0.45 },
  segments: [
    { label: "3", name: "позиция · 3", count: 3, cls: "position-fill" },
    { label: "4", name: "поворот · 4", count: 4, cls: "rotation-fill" },
    { label: "3", name: "масштаб · 3", count: 3, cls: "scale-fill" },
    { label: "1", name: "непрозрачность · 1", count: 1, cls: "alpha-fill" },
    { label: "48", name: "цвет, степень 3 · 48", count: 48, cls: "color-fill" }
  ],
  barCaption: { x: 58.75, y: 15.5, dx: 0, dy: 0 },
  legends: [
    { x: 5, y: 17.7, w: 16, h: 5.8, dotX: 7.2, dotY: 20.6, textX: 9, textY: 21.1, text: "позиция · 3", cls: "position-fill" },
    { x: 22.4, y: 17.7, w: 16, h: 5.8, dotX: 24.6, dotY: 20.6, textX: 26.4, textY: 21.1, text: "поворот · 4", cls: "rotation-fill" },
    { x: 39.8, y: 17.7, w: 16, h: 5.8, dotX: 42, dotY: 20.6, textX: 43.8, textY: 21.1, text: "масштаб · 3", cls: "scale-fill" },
    { x: 57.2, y: 17.7, w: 18.3, h: 5.8, dotX: 59.4, dotY: 20.6, textX: 61.2, textY: 21.1, text: "непрозрачность · 1", cls: "alpha-fill" },
    { x: 76.9, y: 17.7, w: 14.1, h: 5.8, dotX: 79.1, dotY: 20.6, textX: 80.9, textY: 21.1, text: "цвет · 48", cls: "color-fill" }
  ],
  memory: {
    box: { x: 5, y: 26.1, w: 61.5, h: 8.2, r: 0.8 },
    formula: { x: 35.75, y: 30.1, dx: 0, dy: 0 },
    note: { x: 35.75, y: 32.6, dx: 0, dy: 0 },
    arrow: { x1: 67.6, y1: 30.2, x2: 73.3, y2: 30.2 },
    arrowLabel: { x: 67.6, y: 27.7, dx: 0, dy: -4 },
    result: { x: 74.6, y: 25.4, w: 16.4, h: 9.6, r: 0.9 },
    resultNumber: { x: 82.8, y: 29.7, dx: 0, dy: 0 },
    resultUnit: { x: 82.8, y: 32.8, dx: 0, dy: 0 }
  },
  bottom: {
    colorBox: { x: 5, y: 36.7, w: 43.8, h: 6.9, r: 0.8 },
    colorTitle: { x: 7.1, y: 39.1, dx: 0, dy: 0 },
    colorNote: { x: 7.1, y: 42.1, dx: 0, dy: 0 },
    miniBar: { x: 29.4, y: 39.1, w: 17.1, h: 2.2, r: 0.25 },
    nonColor: 11,
    color: 48,
    compactBox: { x: 50.4, y: 36.7, w: 40.6, h: 6.9, r: 0.8 },
    compactTitle: { x: 52.5, y: 39.5, dx: 0, dy: 0 },
    compactNote: { x: 52.5, y: 42.1, dx: 0, dy: 0 }
  }
}];

const [d] = data;
const origin = Object.freeze({ x: d.map.originX, y: d.map.originY });
const scale = Object.freeze({ x: d.map.scaleX, y: d.map.scaleY });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");

function node(tag, attrs, value) {
  const item = document.createElementNS(svg.namespaceURI, tag);
  for (const [key, val] of Object.entries(attrs)) item.setAttribute(key, val);
  if (value !== undefined) item.textContent = value;
  return item;
}

function add(item) {
  svg.appendChild(item);
  return item;
}

function rect(spec, cls) {
  return node("rect", {
    x: sx(spec.x),
    y: sy(spec.y),
    width: sx(spec.x + spec.w) - sx(spec.x),
    height: sy(spec.y + spec.h) - sy(spec.y),
    rx: sx(spec.r) - sx(d.zero),
    ry: sy(spec.r) - sy(d.zero),
    class: cls
  });
}

function label(spec, value, cls, anchor) {
  return node("text", {
    x: sx(spec.x),
    y: sy(spec.y),
    dx: spec.dx,
    dy: spec.dy,
    class: cls,
    "text-anchor": anchor
  }, value);
}

function circle(x, y, r, cls) {
  return node("circle", {
    cx: sx(x),
    cy: sy(y),
    r: sx(r) - sx(d.zero),
    class: cls
  });
}

function ellipse(cx, cy, rx, ry, cls) {
  return node("ellipse", {
    cx: sx(cx),
    cy: sy(cy),
    rx: sx(rx) - sx(d.zero),
    ry: sy(ry) - sy(d.zero),
    class: cls
  });
}

function arrow(spec) {
  const vx = spec.x2 - spec.x1;
  const vy = spec.y2 - spec.y1;
  const length = Math.hypot(vx, vy);
  const ux = vx / length;
  const uy = vy / length;
  const bx = spec.x2 - ux * d.arrow.size;
  const by = spec.y2 - uy * d.arrow.size;
  const leftX = bx - uy * d.arrow.wing;
  const leftY = by + ux * d.arrow.wing;
  const rightX = bx + uy * d.arrow.wing;
  const rightY = by - ux * d.arrow.wing;

  add(node("line", {
    x1: sx(spec.x1),
    y1: sy(spec.y1),
    x2: sx(spec.x2),
    y2: sy(spec.y2),
    class: "connector"
  }));

  add(node("polygon", {
    points: [
      `${sx(spec.x2)},${sy(spec.y2)}`,
      `${sx(leftX)},${sy(leftY)}`,
      `${sx(rightX)},${sy(rightY)}`
    ].join(" "),
    class: "connector"
  }));
}

try {
  svg.replaceChildren();

  add(node("title", { id: "diagram-title" }, "Память миллиона гауссиан"));
  add(node("desc", { id: "diagram-description" },
    "Одна гауссиана содержит 59 параметров. Миллион гауссиан по четыре байта на параметр занимает около 236 мегабайт."
  ));

  add(label(d.top.title, "ОДНА ГАУССИАНА → 59 ПАРАМЕТРОВ", "title", "start"));

  for (const layer of d.top.ellipses) {
    add(ellipse(
      d.top.gaussian.cx,
      d.top.gaussian.cy,
      layer.rx,
      layer.ry,
      layer.cls
    ));
  }

  add(circle(
    d.top.gaussian.cx,
    d.top.gaussian.cy,
    d.top.core.r,
    "alpha-fill"
  ));

  add(label(d.top.caption, "одна гауссиана", "small", "middle"));
  arrow(d.top.arrow);
  add(label(d.top.arrowLabel, "раскладываем", "small", "end"));

  let cursor = d.bar.x;
  for (const segment of d.segments) {
    const width = d.bar.w * segment.count / d.total;
    const segmentBox = {
      x: cursor,
      y: d.bar.y,
      w: width,
      h: d.bar.h,
      r: d.bar.r
    };

    add(rect(segmentBox, segment.cls));
    add(label({
      x: cursor + width / d.map.scaleX * d.map.scaleX / d.map.scaleX,
      y: d.bar.y + d.bar.h / d.map.scaleX * d.map.scaleX / d.map.scaleX,
      dx: d.pad.none,
      dy: d.pad.none
    }, "", "small", "start"));

    add(label({
      x: cursor + width / d.top.core.r * d.top.core.r / d.map.scaleX * d.map.scaleX / d.map.scaleX / d.map.scaleX * d.map.scaleX,
      y: d.bar.y + d.bar.h / d.map.scaleX * d.map.scaleX / d.map.scaleX,
      dx: d.pad.none,
      dy: d.pad.none
    }, "", "small", "start"));

    add(label({
      x: cursor + width * d.top.core.r / (d.top.core.r + d.top.core.r),
      y: d.bar.y + d.bar.h * d.top.core.r / (d.top.core.r + d.top.core.r) + d.top.core.r / d.map.scaleX,
      dx: d.pad.none,
      dy: d.pad.none
    }, segment.label, "segment-number", "middle"));

    cursor += width;
  }

  add(rect(d.bar, "outline"));
  add(label(d.barCaption, "3 + 4 + 3 + 1 + 48 = 59", "small", "middle"));

  for (const legend of d.legends) {
    add(rect(legend, "box"));
    add(circle(legend.dotX, legend.dotY, d.radius.dot, legend.cls));
    add(label({
      x: legend.textX,
      y: legend.textY,
      dx: d.pad.none,
      dy: d.pad.none
    }, legend.text, "small", "start"));
  }

  add(rect(d.memory.box, "memory-box"));
  add(label(
    d.memory.formula,
    "1 000 000 × 59 × 4 байта",
    "formula",
    "middle"
  ));
  add(label(
    d.memory.note,
    "гауссиан × параметров × размер одного float",
    "small",
    "middle"
  ));

  arrow(d.memory.arrow);
  add(label(d.memory.arrowLabel, "итого", "small", "end"));

  add(rect(d.memory.result, "result-box"));
  add(label(d.memory.resultNumber, "≈ 236", "result-number", "middle"));
  add(label(d.memory.resultUnit, "МБ", "result-unit", "middle"));

  add(rect(d.bottom.colorBox, "box"));
  add(label(
    d.bottom.colorTitle,
    "Цвет: 48 из 59 параметров",
    "title",
    "start"
  ));
  add(label(
    d.bottom.colorNote,
    "больше 80% всей памяти",
    "small",
    "start"
  ));

  const nonColorWidth =
    d.bottom.miniBar.w * d.bottom.nonColor / d.total;
  const colorWidth =
    d.bottom.miniBar.w * d.bottom.color / d.total;

  add(rect({
    x: d.bottom.miniBar.x,
    y: d.bottom.miniBar.y,
    w: nonColorWidth,
    h: d.bottom.miniBar.h,
    r: d.bottom.miniBar.r
  }, "position-fill"));

  add(rect({
    x: d.bottom.miniBar.x + nonColorWidth,
    y: d.bottom.miniBar.y,
    w: colorWidth,
    h: d.bottom.miniBar.h,
    r: d.bottom.miniBar.r
  }, "color-fill"));

  add(rect(d.bottom.miniBar, "outline"));

  add(rect(d.bottom.compactBox, "box"));
  add(label(
    d.bottom.compactTitle,
    "Степень 0: 3 цвета → 14 параметров → ≈ 56 МБ",
    "body",
    "start"
  ));
  add(label(
    d.bottom.compactNote,
    "примерно в 4 раза меньше, но без ракурсного блеска",
    "small",
    "start"
  ));

  fallback.hidden = true;
} catch (error) {
  svg.replaceChildren();
  fallback.hidden = false;
  fallback.textContent =
    "Схема должна была показать: 3 параметра позиции + 4 поворота + 3 масштаба + 1 непрозрачности + 48 цвета = 59 параметров. Для миллиона гауссиан это около 236 МБ.";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
