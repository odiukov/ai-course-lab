<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Расхождение гейтов для Long-range Autonomy</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #eef2f7;
      --canvas: #f8fafc;
      --card: #ffffff;
      --ink: #172033;
      --muted: #536176;
      --line: #9aa8bb;
      --branch: #64748b;
      --input-fill: #e8edf5;
      --input-stroke: #64748b;
      --research-fill: #e7f0ff;
      --research-stroke: #3d6fa8;
      --risk-fill: #fff0dc;
      --risk-stroke: #a76519;
      --folded-fill: #eee9ff;
      --folded-stroke: #7254a8;
      --domain-fill: #f4f1ff;
      --observe-fill: #e6f5ef;
      --observe-stroke: #367c62;
      --no-fill: #fff0f0;
      --no-stroke: #ad4d55;
      --no-ink: #8d3039;
      --error: #8d3039;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --canvas: #151d2b;
        --card: #1c2636;
        --ink: #edf2f8;
        --muted: #b5c0cf;
        --line: #64748b;
        --branch: #91a0b5;
        --input-fill: #263449;
        --input-stroke: #91a0b5;
        --research-fill: #1c3553;
        --research-stroke: #75a8e3;
        --risk-fill: #49351f;
        --risk-stroke: #d4a05c;
        --folded-fill: #352b4d;
        --folded-stroke: #ac91df;
        --domain-fill: #29233c;
        --observe-fill: #183a30;
        --observe-stroke: #6db696;
        --no-fill: #45252a;
        --no-stroke: #dc7f87;
        --no-ink: #ffb1b7;
        --error: #ffb1b7;
      }
    }

    html {
      background: var(--page);
    }

    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      max-width: 1200px;
      margin: auto;
      background: var(--canvas);
      border: 1px solid var(--line);
    }

    figcaption {
      padding: 12px 18px;
      background: var(--canvas);
      color: var(--ink);
      border-bottom: 1px solid var(--line);
      font-size: 22px;
      font-weight: bold;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--canvas);
    }

    .card {
      fill: var(--card);
      stroke: var(--line);
    }

    .rule {
      stroke: var(--line);
    }

    .branch {
      fill: none;
      stroke: var(--branch);
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .branch-head {
      fill: var(--branch);
    }

    .input {
      fill: var(--input-fill);
      stroke: var(--input-stroke);
    }

    .research {
      fill: var(--research-fill);
      stroke: var(--research-stroke);
    }

    .risk {
      fill: var(--risk-fill);
      stroke: var(--risk-stroke);
    }

    .folded {
      fill: var(--folded-fill);
      stroke: var(--folded-stroke);
    }

    .domain {
      fill: var(--domain-fill);
      stroke: var(--folded-stroke);
    }

    .observe {
      fill: var(--observe-fill);
      stroke: var(--observe-stroke);
    }

    .no-action {
      fill: var(--no-fill);
      stroke: var(--no-stroke);
    }

    .heading,
    .pill-label,
    .input-label,
    .observe-label,
    .action-label,
    .body-copy,
    .conclusion {
      fill: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .heading {
      font-size: 19px;
      font-weight: bold;
    }

    .input-label {
      font-size: 18px;
      font-weight: bold;
    }

    .pill-label {
      font-size: 17px;
      font-weight: bold;
    }

    .body-copy {
      fill: var(--muted);
      font-size: 15px;
    }

    .observe-label {
      font-size: 16px;
      font-weight: bold;
    }

    .action-label {
      fill: var(--no-ink);
      font-size: 17px;
      font-weight: bold;
    }

    .conclusion {
      font-size: 17px;
      font-weight: bold;
    }

    #fallback {
      padding: 18px;
      background: var(--canvas);
      color: var(--error);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-caption">
    <figcaption id="diagram-caption">Расхождение гейтов для Long-range Autonomy</figcaption>
    <svg id="diagram" role="img" aria-labelledby="svg-title svg-desc"
         preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">Три классификации long_range_autonomy и их обязательные последствия</title>
      <desc id="svg-desc">OpenAI относит возможность к Research, Anthropic — к named risk, DeepMind распределяет её между доменами. Во всех трёх случаях наблюдение есть, а обязательного действия по этому сигналу нет.</desc>
      <g id="stage"></g>
    </svg>
    <div id="fallback" hidden></div>
  </figure>

  <script>
    const DATA = {
      base: 0,
      bounds: { x: 0, y: 0, w: 1200, h: 500 },
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },
      strokes: { regular: 2, strong: 3 },
      radii: { card: 14, pill: 10, round: 19 },
      input: {
        box: { x: 340, y: 10, w: 520, h: 46, r: 19 },
        text: { x: 600, y: 34, value: "Один вход: long_range_autonomy" }
      },
      layout: {
        cardY: 88,
        cardW: 372,
        cardH: 368,
        headingY: 114,
        ruleY: 137,
        ruleInset: 18,
        classDX: 24,
        classY: 151,
        classW: 324,
        classH: 50,
        classTextY: 177,
        observeDX: 76,
        observeY: 320,
        observeW: 220,
        observeH: 38,
        observeTextY: 340,
        actionDX: 24,
        actionY: 382,
        actionW: 324,
        actionH: 56,
        actionTextY: 411,
        connectorTop: 358,
        connectorBottom: 378,
        arrowTipY: 382,
        arrowWingY: 372,
        arrowWingDX: 7
      },
      branches: [
        {
          points: [
            { x: 600, y: 56 },
            { x: 600, y: 72 },
            { x: 208, y: 72 },
            { x: 208, y: 84 }
          ],
          head: [
            { x: 208, y: 88 },
            { x: 200, y: 78 },
            { x: 216, y: 78 }
          ]
        },
        {
          points: [
            { x: 600, y: 56 },
            { x: 600, y: 84 }
          ],
          head: [
            { x: 600, y: 88 },
            { x: 592, y: 78 },
            { x: 608, y: 78 }
          ]
        },
        {
          points: [
            { x: 600, y: 56 },
            { x: 600, y: 72 },
            { x: 992, y: 72 },
            { x: 992, y: 84 }
          ],
          head: [
            { x: 992, y: 88 },
            { x: 984, y: 78 },
            { x: 1000, y: 78 }
          ]
        }
      ],
      columns: [
        {
          x: 22,
          name: "OpenAI",
          className: "research",
          classification: "Research",
          body: [
            { x: 208, y: 228, value: "Категория исследования:" },
            { x: 208, y: 252, value: "изучать и наблюдать," },
            { x: 208, y: 276, value: "автоматического гейта нет" }
          ],
          domains: []
        },
        {
          x: 414,
          name: "Anthropic",
          className: "risk",
          classification: "named risk",
          body: [
            { x: 600, y: 228, value: "Стоп обучения убран в v3.0." },
            { x: 600, y: 252, value: "Следующий названный гейт:" },
            { x: 600, y: 276, value: "AI R&D-4 — он ещё не пересечён" }
          ],
          domains: []
        },
        {
          x: 806,
          name: "DeepMind",
          className: "folded",
          classification: "domain-folded",
          body: [
            { x: 992, y: 274, value: "Tracked Capability Levels — апрель 2026." },
            { x: 992, y: 296, value: "Отдельного гейта автономности нет" }
          ],
          domains: [
            {
              box: { x: 840, y: 218, w: 138, h: 34, r: 10 },
              text: { x: 909, y: 236, value: "ML R&D" }
            },
            {
              box: { x: 1006, y: 218, w: 138, h: 34, r: 10 },
              text: { x: 1075, y: 236, value: "Cyber" }
            }
          ]
        }
      ],
      conclusion: {
        x: 600,
        y: 480,
        value: "Риск замечен везде • обязательного торможения именно по этому сигналу нет"
      }
    };

    const origin = Object.freeze(DATA.origin);
    const scale = Object.freeze(DATA.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.getElementById("diagram");
      const stage = document.getElementById("stage");
      const fallback = document.getElementById("fallback");
      const L = DATA.layout;

      svg.setAttribute("viewBox", [
        sx(DATA.bounds.x),
        sy(DATA.bounds.y),
        sx(DATA.bounds.x + DATA.bounds.w) - sx(DATA.bounds.x),
        sy(DATA.bounds.y + DATA.bounds.h) - sy(DATA.bounds.y)
      ].join(" "));

      const make = name => document.createElementNS(NS, name);

      const set = (node, values) => {
        Object.entries(values).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };

      const addRect = (g, className, strokeWidth) => {
        const node = make("rect");
        set(node, {
          x: sx(g.x),
          y: sy(g.y),
          width: sx(g.x + g.w) - sx(g.x),
          height: sy(g.y + g.h) - sy(g.y),
          rx: sx(g.r) - sx(DATA.base),
          ry: sy(g.r) - sy(DATA.base),
          class: className,
          "stroke-width": strokeWidth
        });
        stage.appendChild(node);
        return node;
      };

      const addLine = (a, b, className, strokeWidth) => {
        const node = make("line");
        set(node, {
          x1: sx(a.x),
          y1: sy(a.y),
          x2: sx(b.x),
          y2: sy(b.y),
          class: className,
          "stroke-width": strokeWidth
        });
        stage.appendChild(node);
        return node;
      };

      const addText = (entry, className, anchor) => {
        const node = make("text");
        set(node, {
          x: sx(entry.x),
          y: sy(entry.y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        });
        node.textContent = entry.value;
        stage.appendChild(node);
        return node;
      };

      const addPolyline = (points, className, strokeWidth) => {
        const node = make("polyline");
        set(node, {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className,
          "stroke-width": strokeWidth
        });
        stage.appendChild(node);
        return node;
      };

      const addPolygon = (points, className) => {
        const node = make("polygon");
        set(node, {
          points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
          class: className
        });
        stage.appendChild(node);
        return node;
      };

      addRect(
        {
          x: DATA.bounds.x,
          y: DATA.bounds.y,
          w: DATA.bounds.w,
          h: DATA.bounds.h,
          r: DATA.base
        },
        "canvas-background",
        DATA.strokes.regular
      );

      DATA.branches.forEach(branch => {
        addPolyline(branch.points, "branch", DATA.strokes.strong);
        addPolygon(branch.head, "branch-head");
      });

      DATA.columns.forEach(column => {
        addRect(
          {
            x: column.x,
            y: L.cardY,
            w: L.cardW,
            h: L.cardH,
            r: DATA.radii.card
          },
          "card",
          DATA.strokes.regular
        );

        addText(
          {
            x: column.x + L.cardW / DATA.strokes.regular,
            y: L.headingY,
            value: column.name
          },
          "heading",
          "middle"
        );

        addLine(
          { x: column.x + L.ruleInset, y: L.ruleY },
          { x: column.x + L.cardW - L.ruleInset, y: L.ruleY },
          "rule",
          DATA.strokes.regular
        );

        addRect(
          {
            x: column.x + L.classDX,
            y: L.classY,
            w: L.classW,
            h: L.classH,
            r: DATA.radii.pill
          },
          column.className,
          DATA.strokes.regular
        );

        addText(
          {
            x: column.x + L.cardW / DATA.strokes.regular,
            y: L.classTextY,
            value: `Классификация: ${column.classification}`
          },
          "pill-label",
          "middle"
        );

        column.domains.forEach(domain => {
          addRect(domain.box, "domain", DATA.strokes.regular);
          addText(domain.text, "body-copy", "middle");
        });

        column.body.forEach(line => addText(line, "body-copy", "middle"));

        addRect(
          {
            x: column.x + L.observeDX,
            y: L.observeY,
            w: L.observeW,
            h: L.observeH,
            r: DATA.radii.round
          },
          "observe",
          DATA.strokes.regular
        );

        const centerX = column.x + L.cardW / DATA.strokes.regular;

        addText(
          {
            x: centerX,
            y: L.observeTextY,
            value: "Наблюдение: есть"
          },
          "observe-label",
          "middle"
        );

        addPolyline(
          [
            { x: centerX, y: L.connectorTop },
            { x: centerX, y: L.connectorBottom }
          ],
          "branch",
          DATA.strokes.strong
        );

        addPolygon(
          [
            { x: centerX, y: L.arrowTipY },
            { x: centerX - L.arrowWingDX, y: L.arrowWingY },
            { x: centerX + L.arrowWingDX, y: L.arrowWingY }
          ],
          "branch-head"
        );

        addRect(
          {
            x: column.x + L.actionDX,
            y: L.actionY,
            w: L.actionW,
            h: L.actionH,
            r: DATA.radii.pill
          },
          "no-action",
          DATA.strokes.strong
        );

        addText(
          {
            x: centerX,
            y: L.actionTextY,
            value: "Обязательное действие: НЕТ"
          },
          "action-label",
          "middle"
        );
      });

      addRect(DATA.input.box, "input", DATA.strokes.strong);
      addText(DATA.input.text, "input-label", "middle");
      addText(DATA.conclusion, "conclusion", "middle");

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent = "Схема должна была показать три классификации long_range_autonomy: OpenAI — Research, Anthropic — named risk, DeepMind — domain-folded. Наблюдение есть во всех трёх случаях, но обязательного действия именно по этому сигналу нет.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
