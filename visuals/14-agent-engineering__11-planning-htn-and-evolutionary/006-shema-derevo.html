<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Дерево декомпозиции</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2430; --muted:#5d6b7c; --line:#7c8798;
    --task:#ffffff; --task-br:#3f5d8f; --method:#eef2fb; --method-br:#6b7fa8;
    --op:#e8f4ec; --op-br:#2f7a4f; --plan:#a4551f;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14181f; --fg:#e6ebf2; --muted:#a3b0c0; --line:#7f8b9c;
      --task:#1d2430; --task-br:#8fb2e6; --method:#232b38; --method-br:#93a6c9;
      --op:#1b2b22; --op-br:#69c48d; --plan:#e0a06a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{padding:10px 12px 12px;}
  h3{margin:0 0 6px;font-size:15px;font-weight:600;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .legend{margin-top:6px;color:var(--muted);font-size:12px;}
  .fail{color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">
  <h3>Дерево декомпозиции: одна задача, метод, листья-операторы</h3>
  <div id="host"></div>
  <div class="legend">task — составная задача, её надо раскрыть методом · operator — примитивное действие, только оно попадает в план</div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (координаты в условных единицах дерева) ----
    var H = 0.33, AW = 0.14, AH = 0.24;
    var NODES = [
      {id:'dinner', x:6.0, y:0, w:1.35, label:'приготовить ужин',      kind:'task',   tag:'task',     tagAt:'top'},
      {id:'m',      x:6.0, y:1, w:1.95, label:'метод: макароны + соус',kind:'method', tag:'method',   tagAt:'left'},
      {id:'pasta',  x:2.5, y:2, w:1.00, label:'макароны',              kind:'task',   tag:'task',     tagAt:'left'},
      {id:'sauce',  x:9.5, y:2, w:1.00, label:'соус',                  kind:'task',   tag:'task',     tagAt:'right'},
      {id:'o1',     x:1.0, y:3, w:1.05, label:'налить воду',           kind:'op',     tag:'operator', tagAt:'bottom'},
      {id:'o2',     x:4.0, y:3, w:1.05, label:'включить плиту',        kind:'op',     tag:'operator', tagAt:'bottom'},
      {id:'o3',     x:8.0, y:3, w:1.05, label:'включить плиту',        kind:'op',     tag:'operator', tagAt:'bottom'},
      {id:'o4',     x:11.0,y:3, w:1.05, label:'налить воду',           kind:'op',     tag:'operator', tagAt:'bottom'}
    ];
    var EDGES = [['dinner','m'],['m','pasta'],['m','sauce'],
                 ['pasta','o1'],['pasta','o2'],['sauce','o3'],['sauce','o4']];
    var PLAN = {y:3.75, x1:1.0, x2:11.0, xm:6.0, label:'план = только листья, слева направо'};

    // ---- одна пара функций перевода ----
    var ORIGIN = {x:40, y:46}, SCALE = 52;
    function sx(x){ return ORIGIN.x + x * SCALE; }
    function sy(y){ return ORIGIN.y + y * SCALE; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){ var e = document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k, a[k]); return e; }
    function txt(x, y, s, anchor, size, fill){
      var t = el('text',{x:x, y:y, 'text-anchor':anchor, 'font-size':size, fill:fill,
        'font-family':'system-ui, -apple-system, "Segoe UI", sans-serif'});
      t.appendChild(document.createTextNode(s)); return t;
    }
    function byId(id){ for(var i=0;i<NODES.length;i++) if(NODES[i].id===id) return NODES[i]; }

    var svg = el('svg',{viewBox:'0 0 700 270', preserveAspectRatio:'xMidYMid meet',
      role:'img','aria-label':'Дерево: задача «приготовить ужин» раскрывается методом в макароны и соус, каждая — в операторы'});

    var STYLE = {
      task:  {fill:'var(--task)',   stroke:'var(--task-br)',   dash:'none'},
      method:{fill:'var(--method)', stroke:'var(--method-br)', dash:'5 4'},
      op:    {fill:'var(--op)',     stroke:'var(--op-br)',     dash:'none'}
    };

    // ---- рёбра со стрелками к верхнему краю ребёнка ----
    EDGES.forEach(function(e){
      var p = byId(e[0]), c = byId(e[1]);
      svg.appendChild(el('line',{x1:sx(p.x), y1:sy(p.y + H), x2:sx(c.x), y2:sy(c.y - H - AH),
        stroke:'var(--line)', 'stroke-width':1.4}));
      svg.appendChild(el('polygon',{points:
        sx(c.x)+','+sy(c.y - H)+' '+
        sx(c.x - AW)+','+sy(c.y - H - AH)+' '+
        sx(c.x + AW)+','+sy(c.y - H - AH),
        fill:'var(--line)'}));
    });

    // ---- узлы ----
    NODES.forEach(function(n){
      var st = STYLE[n.kind];
      svg.appendChild(el('rect',{x:sx(n.x - n.w), y:sy(n.y - H),
        width:sx(n.x + n.w) - sx(n.x - n.w), height:sy(n.y + H) - sy(n.y - H),
        rx:6, fill:st.fill, stroke:st.stroke, 'stroke-width':1.5, 'stroke-dasharray':st.dash}));
      var lab = txt(sx(n.x), sy(n.y), n.label, 'middle', 12, 'var(--fg)');
      lab.setAttribute('dominant-baseline','middle');
      svg.appendChild(lab);

      if(n.tagAt === 'top')
        svg.appendChild(txt(sx(n.x), sy(n.y - H) - 8, n.tag, 'middle', 10, 'var(--muted)'));
      else if(n.tagAt === 'bottom')
        svg.appendChild(txt(sx(n.x), sy(n.y + H) + 12, n.tag, 'middle', 10, 'var(--muted)'));
      else if(n.tagAt === 'left')
        svg.appendChild(txt(sx(n.x - n.w) - 8, sy(n.y) + 4, n.tag, 'end', 10, 'var(--muted)'));
      else
        svg.appendChild(txt(sx(n.x + n.w) + 8, sy(n.y) + 4, n.tag, 'start', 10, 'var(--muted)'));
    });

    // ---- нижний край дерева = план ----
    svg.appendChild(el('line',{x1:sx(PLAN.x1), y1:sy(PLAN.y), x2:sx(PLAN.x2), y2:sy(PLAN.y),
      stroke:'var(--plan)', 'stroke-width':1.4, 'stroke-dasharray':'6 4'}));
    svg.appendChild(txt(sx(PLAN.xm), sy(PLAN.y) + 15, PLAN.label, 'middle', 11, 'var(--plan)'));

    host.appendChild(svg);
  }catch(err){
    host.innerHTML = '<p class="fail">Схема не построилась. Она должна была показать: '
      + 'задача «приготовить ужин» (task) раскрывается одним методом в две составные подзадачи — '
      + '«макароны» и «соус» (обе тоже task); каждая из них раскрывается в примитивные действия '
      + '«налить воду» и «включить плиту», подписанные operator. Планом становится только нижний '
      + 'край дерева — листья, прочитанные слева направо.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
