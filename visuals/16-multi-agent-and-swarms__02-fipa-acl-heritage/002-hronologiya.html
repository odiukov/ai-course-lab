<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>От речевых актов к современным агентным протоколам</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f4ec;
      --surface: #fffdf7;
      --panel: #f1ede2;
      --ink: #20252b;
      --muted: #626a73;
      --line: #747d86;
      --accent: #176f82;
      --accent-soft: #d8edf0;
      --strict: #8b5635;
      --strict-soft: #f1dfd2;
      --faded: #9b948b;
      --note: #e9e3d5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      background: var(--surface);
      border: 1px solid var(--line);
    }

    h1 {
      font-size: 20px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--surface);
    }

    text {
      fill: var(--ink);
      font-family: inherit;
      font-size: 15px;
    }

    .year {
      font-size: 17px;
      font-weight: bold;
    }

    .protocol {
      font-size: 17px;
      font-weight: bold;
    }

    .detail {
      fill: var(--muted);
      font-size: 14px;
    }

    .code {
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13px;
    }

    .axis,
    .connector,
    .rule {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
    }

    .idea {
      stroke: var(--accent);
    }

    .legacy {
      stroke: var(--strict);
    }

    .faded {
      stroke: var(--faded);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .modern-panel {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 1px;
    }

    .strict-panel {
      fill: var(--strict-soft);
      stroke: var(--strict);
      stroke-width: 1px;
    }

    .note-panel {
      fill: var(--note);
      stroke: var(--line);
      stroke-width: 1px;
    }

    .node {
      fill: var(--surface);
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .strict-node {
      stroke: var(--strict);
    }

    .quiet-node {
      stroke: var(--faded);
    }

    .arrow {
      fill: var(--accent);
    }

    #fallback {
      font-size: 16px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11171b;
        --surface: #182126;
        --panel: #222d33;
        --ink: #edf2f3;
        --muted: #b8c2c6;
        --line: #7d8b91;
        --accent: #69c7d5;
        --accent-soft: #183940;
        --strict: #dfa176;
        --strict-soft: #3c2b23;
        --faded: #8d9699;
        --note: #2a3031;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>От речевых актов к современным агентным протоколам</h1>
    <p id="fallback">
      Временная шкала: Остин 1962 → KQML 1993 → FIPA-ACL 2000 →
      закат около 2010 → MCP и A2A в 2024–2026.
    </p>
    <svg
      id="diagram"
      role="img"
      aria-labelledby="svg-title svg-desc"
      viewBox="0 0 1200 480"
      width="1200"
      height="480"
      preserveAspectRatio="xMidYMid meet">
      <title id="svg-title">От речевых актов к современным агентным протоколам</title>
      <desc id="svg-desc">
        Временная шкала показывает наследование идеи структурированного
        намерения от Остина через KQML и FIPA-ACL к MCP и A2A.
      </desc>
    </svg>
  </main>

  <script>
    const DATA = {
      canvas: { width: 1200, height: 480 },
      axis: {
        y: 220,
        start: 0,
        end: 1060,
        arrow: [
          { x: 1060, y: 220 },
          { x: 1042, y: 210 },
          { x: 1042, y: 230 }
        ]
      },
      ticks: [
        {
          x: 90,
          year: "1962",
          name: "Остин",
          nodeClass: "node",
          panel: { x: 0, y: 20, w: 190, h: 145, className: "panel" },
          connector: { x1: 90, y1: 165, x2: 90, y2: 220 },
          lines: [
            { x: 16, y: 48, text: "Человеческая фраза", className: "protocol" },
            { x: 16, y: 80, text: "«Передай отчёт»", className: "code" },
            { x: 16, y: 108, text: "Высказывание —", className: "detail" },
            { x: 16, y: 130, text: "это действие", className: "detail" }
          ]
        },
        {
          x: 275,
          year: "1993",
          name: "KQML",
          nodeClass: "node",
          panel: { x: 180, y: 282, w: 205, h: 118, className: "panel" },
          connector: { x1: 275, y1: 220, x2: 275, y2: 282 },
          lines: [
            { x: 196, y: 310, text: "KQML", className: "protocol" },
            { x: 196, y: 340, text: "(ask :content …)", className: "code" },
            { x: 196, y: 370, text: "+ машинная метка", className: "detail" },
            { x: 196, y: 390, text: "намерения", className: "detail" }
          ]
        },
        {
          x: 505,
          year: "2000",
          name: "FIPA-ACL",
          nodeClass: "node strict-node",
          panel: { x: 390, y: 20, w: 235, h: 145, className: "strict-panel" },
          connector: { x1: 505, y1: 165, x2: 505, y2: 220 },
          lines: [
            { x: 406, y: 48, text: "FIPA-ACL", className: "protocol" },
            { x: 406, y: 78, text: "REQUEST", className: "code" },
            { x: 406, y: 104, text: "кто • кому • зачем • что", className: "detail" },
            { x: 406, y: 128, text: "фиксированные правила", className: "detail" },
            { x: 406, y: 150, text: "и сценарии обмена", className: "detail" }
          ]
        },
        {
          x: 710,
          year: "около 2010",
          name: "закат",
          nodeClass: "node quiet-node",
          panel: { x: 640, y: 282, w: 175, h: 118, className: "panel" },
          connector: { x1: 710, y1: 220, x2: 710, y2: 282 },
          lines: [
            { x: 656, y: 310, text: "Закат", className: "protocol" },
            { x: 656, y: 340, text: "тяжёлые онтологии", className: "detail" },
            { x: 656, y: 366, text: "и накладные", className: "detail" },
            { x: 656, y: 388, text: "расходы", className: "detail" }
          ]
        },
        {
          x: 970,
          year: "2024–2026",
          name: "MCP и A2A",
          nodeClass: "node",
          panel: { x: 825, y: 20, w: 300, h: 145, className: "modern-panel" },
          connector: { x1: 970, y1: 165, x2: 970, y2: 220 },
          lines: [
            { x: 841, y: 48, text: "MCP и A2A", className: "protocol" },
            { x: 841, y: 78, text: "MCP", className: "protocol" },
            { x: 895, y: 78, text: "tools/call → инструмент", className: "code" },
            { x: 841, y: 108, text: "A2A", className: "protocol" },
            { x: 895, y: 108, text: "задача → состояния", className: "code" },
            { x: 841, y: 138, text: "JSON • схемы • контекст", className: "detail" }
          ]
        }
      ],
      segments: [
        { x1: 0, y1: 220, x2: 275, y2: 220, className: "axis idea" },
        { x1: 275, y1: 220, x2: 505, y2: 220, className: "axis legacy" },
        { x1: 505, y1: 220, x2: 710, y2: 220, className: "axis faded", dash: [12, 9] },
        { x1: 710, y1: 220, x2: 1060, y2: 220, className: "axis idea" }
      ],
      yearLabels: [
        { x: 90, y: 251, text: "Остин 1962", anchor: "middle" },
        { x: 275, y: 251, text: "KQML 1993", anchor: "middle" },
        { x: 505, y: 251, text: "FIPA-ACL 2000", anchor: "middle" },
        { x: 710, y: 251, text: "закат около 2010", anchor: "middle" },
        { x: 970, y: 251, text: "MCP и A2A 2024–2026", anchor: "middle" }
      ],
      node: { r: 8 },
      tick: { top: 209, bottom: 231 },
      note: {
        box: { x: 0, y: 420, w: 1125, h: 44 },
        lines: [
          {
            x: 20,
            y: 447,
            text: "Наследуется идея: кто говорит → кому → зачем → что делать дальше.",
            anchor: "start",
            className: "protocol"
          },
          {
            x: 1105,
            y: 447,
            text: "Не прямая совместимость форматов.",
            anchor: "end",
            className: "detail"
          }
        ]
      },
      captions: [
        {
          x: 645,
          y: 198,
          text: "линия наследования идей",
          anchor: "start",
          className: "detail"
        }
      ]
    };

    const origin = { x: 38, y: 6 };
    const scale = { x: 1, y: 1 };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const NS = "http://www.w3.org/2000/svg";

      const make = (name, attrs, text) => {
        const el = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => el.setAttribute(key, value));
        if (text !== undefined) el.textContent = text;
        svg.appendChild(el);
        return el;
      };

      const drawLine = item => {
        const line = make("line", {
          x1: sx(item.x1),
          y1: sy(item.y1),
          x2: sx(item.x2),
          y2: sy(item.y2),
          class: item.className
        });
        if (item.dash) {
          line.setAttribute(
            "stroke-dasharray",
            item.dash.map(value => sx(value) - sx(DATA.axis.start)).join(" ")
          );
        }
        return line;
      };

      const drawRect = box => make("rect", {
        x: sx(box.x),
        y: sy(box.y),
        width: sx(box.x + box.w) - sx(box.x),
        height: sy(box.y + box.h) - sy(box.y),
        class: box.className
      });

      const drawText = item => make("text", {
        x: sx(item.x),
        y: sy(item.y),
        class: item.className || "detail",
        "text-anchor": item.anchor || "start"
      }, item.text);

      DATA.segments.forEach(drawLine);

      make("polygon", {
        points: DATA.axis.arrow
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: "arrow"
      });

      DATA.ticks.forEach(item => {
        drawRect(item.panel);
        drawLine({
          ...item.connector,
          className: item.x === DATA.ticks[2].x
            ? "connector legacy"
            : item.x === DATA.ticks[3].x
              ? "connector faded"
              : "connector idea"
        });

        drawLine({
          x1: item.x,
          y1: DATA.tick.top,
          x2: item.x,
          y2: DATA.tick.bottom,
          className: "rule"
        });

        make("circle", {
          cx: sx(item.x),
          cy: sy(DATA.axis.y),
          r: sx(DATA.node.r) - sx(DATA.axis.start),
          class: item.nodeClass
        });

        item.lines.forEach(drawText);
      });

      DATA.yearLabels.forEach(item => drawText({
        ...item,
        className: "year"
      }));

      DATA.captions.forEach(drawText);

      drawRect({
        ...DATA.note.box,
        className: "note-panel"
      });
      DATA.note.lines.forEach(drawText);

      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать путь: Остин 1962 → KQML 1993 → FIPA-ACL 2000 → закат около 2010 → MCP и A2A в 2024–2026.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
