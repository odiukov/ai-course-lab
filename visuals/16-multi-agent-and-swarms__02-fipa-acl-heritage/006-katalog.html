<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Семейства перформативов FIPA-ACL</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #182033;
    --muted: #5e687b;
    --border: #cbd3e1;
    --info: #2563eb;
    --ask: #7c3aed;
    --action: #c76a08;
    --deal: #c52d72;
    --subscribe: #087a70;
    --cancel: #a64b16;
    --error: #bd3d27;
  }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 {
    color: var(--ink);
    font-size: 22px;
    text-align: center;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 430px;
    background: var(--bg);
  }
  .card {
    fill: var(--panel);
    stroke: var(--border);
    stroke-width: 1.5;
  }
  .band, .chip, .arrow-head {
    fill: var(--accent);
  }
  .arrow-line {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2;
    stroke-linecap: round;
  }
  .family-inform { --accent: var(--info); }
  .family-ask { --accent: var(--ask); }
  .family-action { --accent: var(--action); }
  .family-deal { --accent: var(--deal); }
  .family-subscribe { --accent: var(--subscribe); }
  .family-cancel { --accent: var(--cancel); }
  .family-error { --accent: var(--error); }
  .family-title {
    fill: #ffffff;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: .04em;
  }
  .chip-text {
    fill: #ffffff;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    font-size: 12px;
    font-weight: bold;
  }
  .note {
    fill: var(--muted);
    font-size: 13px;
  }
  .footer {
    fill: var(--ink);
    font-size: 14px;
    font-weight: bold;
  }
  .fallback {
    color: var(--ink);
    font-size: 14px;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10131c;
      --panel: #191e2b;
      --ink: #edf1fb;
      --muted: #b7c0d2;
      --border: #3a4356;
      --info: #5d91ff;
      --ask: #a982ff;
      --action: #e89a3e;
      --deal: #ed68a3;
      --subscribe: #3bb9ab;
      --cancel: #e1844d;
      --error: #ed725d;
    }
  }
</style>
</head>
<body>
<main>
  <h1 id="diagram-title">16 перформативов: сначала задача, потом кнопка</h1>
  <svg id="map" width="1120" height="430" viewBox="0 0 1120 430"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-title diagram-description">
    <desc id="diagram-description">
      Карта шестнадцати перформативов FIPA-ACL по семи задачам разговора.
    </desc>
    <g id="diagram"></g>
  </svg>
  <div id="fallback" class="fallback" hidden></div>
  <noscript>
    <p class="fallback">Схема должна показать 16 перформативов, собранных по задачам: сообщить, спросить, запросить действие, договориться, подписаться, отменить и сообщить об ошибке.</p>
  </noscript>
</main>
<script>
const DATA = Object.freeze({
  style: {
    zero: 0, half: .5, radius: .65, band: 3.8, titleY: 2.45,
    arrowHead: .75, arrowWing: .42
  },
  cards: [
    {
      family: "inform", title: "СООБЩИТЬ", x: 1, y: 2, w: 21, h: 15,
      chips: [
        { x: 3, y: 7.5, w: 7, h: 3.2, label: "inform" },
        { x: 11.2, y: 7.5, w: 8, h: 3.2, label: "confirm" },
        { x: 6.4, y: 12, w: 10.5, h: 3.2, label: "disconfirm" }
      ],
      notes: [], routes: []
    },
    {
      family: "ask", title: "СПРОСИТЬ", x: 24, y: 2, w: 17, h: 15,
      chips: [
        { x: 25.7, y: 7.2, w: 8, h: 3.2, label: "query-if" },
        { x: 25.7, y: 12, w: 9, h: 3.2, label: "query-ref" }
      ],
      notes: [
        { x: 37.2, y: 9.25, label: "да / нет", anchor: "middle" },
        { x: 37.2, y: 14.05, label: "значение", anchor: "middle" }
      ],
      routes: []
    },
    {
      family: "action", title: "ЗАПРОСИТЬ ДЕЙСТВИЕ", x: 43, y: 2, w: 27, h: 15,
      chips: [
        { x: 45, y: 7.2, w: 7.5, h: 3.2, label: "request" },
        { x: 54.5, y: 7.2, w: 6.2, h: 3.2, label: "agree" },
        { x: 54.5, y: 12, w: 6.2, h: 3.2, label: "refuse" },
        { x: 63, y: 7.2, w: 5.8, h: 3.2, label: "failure" }
      ],
      notes: [],
      routes: [
        { a: { x: 52.8, y: 8.8 }, b: { x: 54.2, y: 8.8 } },
        { a: { x: 52.8, y: 9 }, b: { x: 54.2, y: 13.6 } },
        { a: { x: 61, y: 8.8 }, b: { x: 62.7, y: 8.8 } }
      ]
    },
    {
      family: "deal", title: "ДОГОВОРИТЬСЯ", x: 72, y: 2, w: 27, h: 15,
      chips: [
        { x: 74, y: 7.5, w: 4, h: 3.2, label: "cfp" },
        { x: 79.8, y: 7.5, w: 6.5, h: 3.2, label: "propose" },
        { x: 87.8, y: 6.3, w: 10.5, h: 3.2, label: "accept-proposal" },
        { x: 87.8, y: 11.7, w: 10.5, h: 3.2, label: "reject-proposal" }
      ],
      notes: [],
      routes: [
        { a: { x: 78.3, y: 9.1 }, b: { x: 79.5, y: 9.1 } },
        { a: { x: 86.6, y: 9 }, b: { x: 87.5, y: 7.9 } },
        { a: { x: 86.6, y: 9.2 }, b: { x: 87.5, y: 13.3 } }
      ]
    },
    {
      family: "subscribe", title: "ПОДПИСАТЬСЯ", x: 1, y: 20, w: 30, h: 14.5,
      chips: [
        { x: 3, y: 25.7, w: 9, h: 3.5, label: "subscribe" }
      ],
      notes: [
        { x: 22, y: 28, label: "поток уведомлений", anchor: "middle" }
      ],
      routes: [
        { a: { x: 12.3, y: 27.45 }, b: { x: 15.2, y: 27.45 } }
      ]
    },
    {
      family: "cancel", title: "ОТМЕНИТЬ", x: 34, y: 20, w: 25, h: 14.5,
      chips: [
        { x: 36, y: 25.7, w: 7, h: 3.5, label: "cancel" }
      ],
      notes: [
        { x: 51.2, y: 28, label: "работа остановлена", anchor: "middle" }
      ],
      routes: [
        { a: { x: 43.3, y: 27.45 }, b: { x: 45.2, y: 27.45 } }
      ]
    },
    {
      family: "error", title: "СООБЩИТЬ ОБ ОШИБКЕ", x: 62, y: 20, w: 37, h: 14.5,
      chips: [
        { x: 64, y: 25.7, w: 14, h: 3.5, label: "not-understood" }
      ],
      notes: [
        { x: 89.5, y: 28, label: "сообщение не распознано", anchor: "middle" }
      ],
      routes: [
        { a: { x: 78.3, y: 27.45 }, b: { x: 81.2, y: 27.45 } }
      ]
    }
  ],
  footer: {
    x: 50, y: 39,
    label: "Сначала выбери процесс → затем точный перформатив"
  }
});
const origin = Object.freeze({ x: 60, y: 20 });
const scale = Object.freeze({ x: 10, y: 10 });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

try {
  const NS = "http://www.w3.org/2000/svg";
  const root = document.getElementById("diagram");
  const zero = DATA.style.zero;

  function make(tag, attrs, content) {
    const item = document.createElementNS(NS, tag);
    Object.entries(attrs).forEach(([name, value]) => {
      item.setAttribute(name, String(value));
    });
    if (content !== undefined) item.textContent = content;
    return item;
  }

  function rect(parent, item, className) {
    parent.appendChild(make("rect", {
      x: sx(item.x),
      y: sy(item.y),
      width: sx(item.w) - sx(zero),
      height: sy(item.h) - sy(zero),
      rx: sx(DATA.style.radius) - sx(zero),
      class: className
    }));
  }

  function text(parent, item, className) {
    parent.appendChild(make("text", {
      x: sx(item.x),
      y: sy(item.y),
      "text-anchor": item.anchor || "middle",
      "dominant-baseline": "middle",
      class: className
    }, item.label));
  }

  function arrow(parent, route) {
    const dx = route.b.x - route.a.x;
    const dy = route.b.y - route.a.y;
    const length = Math.hypot(dx, dy);
    const ux = dx / length;
    const uy = dy / length;
    const baseX = route.b.x - ux * DATA.style.arrowHead;
    const baseY = route.b.y - uy * DATA.style.arrowHead;
    const leftX = baseX - uy * DATA.style.arrowWing;
    const leftY = baseY + ux * DATA.style.arrowWing;
    const rightX = baseX + uy * DATA.style.arrowWing;
    const rightY = baseY - ux * DATA.style.arrowWing;

    parent.appendChild(make("path", {
      d: `M ${sx(route.a.x)} ${sy(route.a.y)} L ${sx(baseX)} ${sy(baseY)}`,
      class: "arrow-line"
    }));
    parent.appendChild(make("polygon", {
      points: `${sx(route.b.x)},${sy(route.b.y)} ${sx(leftX)},${sy(leftY)} ${sx(rightX)},${sy(rightY)}`,
      class: "arrow-head"
    }));
  }

  DATA.cards.forEach(card => {
    const group = make("g", { class: `family-${card.family}` });
    rect(group, card, "card");
    rect(group, {
      x: card.x,
      y: card.y,
      w: card.w,
      h: DATA.style.band
    }, "band");

    text(group, {
      x: card.x + card.w * DATA.style.half,
      y: card.y + DATA.style.titleY,
      label: card.title,
      anchor: "middle"
    }, "family-title");

    card.routes.forEach(route => arrow(group, route));
    card.chips.forEach(chip => {
      rect(group, chip, "chip");
      text(group, {
        x: chip.x + chip.w * DATA.style.half,
        y: chip.y + chip.h * DATA.style.half,
        label: chip.label,
        anchor: "middle"
      }, "chip-text");
    });
    card.notes.forEach(note => text(group, note, "note"));
    root.appendChild(group);
  });

  text(root, {
    x: DATA.footer.x,
    y: DATA.footer.y,
    label: DATA.footer.label,
    anchor: "middle"
  }, "footer");
} catch (error) {
  const fallback = document.getElementById("fallback");
  document.getElementById("map").hidden = true;
  fallback.hidden = false;
  fallback.textContent = "Схема должна была показать 16 перформативов по задачам: сообщить, спросить, запросить действие, договориться, подписаться, отменить и сообщить об ошибке.";
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
