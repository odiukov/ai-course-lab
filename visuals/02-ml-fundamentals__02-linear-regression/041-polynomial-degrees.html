<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как степень меняет форму модели</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --axis: #596579;
      --grid: #d9dee8;
      --point: #252d3d;
      --point-edge: #ffffff;
      --degree-2: #246bdb;
      --degree-5: #d85c24;
      --frame: #d8dde7;
      --fallback: #f4efe5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #151821;
        --panel: #1d222d;
        --text: #eef2fa;
        --muted: #aab4c5;
        --axis: #a8b2c3;
        --grid: #394252;
        --point: #f3f5f9;
        --point-edge: #1d222d;
        --degree-2: #72a7ff;
        --degree-5: #ff9565;
        --frame: #3a4352;
        --fallback: #29261f;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      place-items: start center;
      padding: 12px;
    }

    .figure {
      width: min(100%, 680px);
      background: var(--panel);
      border: 1px solid var(--frame);
      padding: 14px 14px 10px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 5px 0 8px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      overflow: visible;
      background: var(--panel);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 1.5;
      stroke-linecap: round;
    }

    .arrowhead {
      fill: var(--axis);
    }

    .guide {
      stroke: var(--grid);
      stroke-width: 1;
      stroke-dasharray: 4 5;
    }

    .curve-two {
      fill: none;
      stroke: var(--degree-2);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .curve-five {
      fill: none;
      stroke: var(--degree-5);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .observation {
      fill: var(--point);
      stroke: var(--point-edge);
      stroke-width: 1.5;
    }

    .axis-label {
      fill: var(--axis);
      font-size: 15px;
      font-weight: 650;
    }

    .turn-label {
      fill: var(--degree-2);
      font-size: 13px;
      font-weight: 650;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 4;
      stroke-linejoin: round;
    }

    .legend-text {
      fill: var(--text);
      font-size: 14px;
    }

    .legend-two {
      stroke: var(--degree-2);
      stroke-width: 4;
      stroke-linecap: round;
    }

    .legend-five {
      stroke: var(--degree-5);
      stroke-width: 3;
      stroke-linecap: round;
    }

    .fallback {
      margin: 8px 0 0;
      padding: 12px;
      background: var(--fallback);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <h1 id="diagram-title">Как степень меняет форму модели</h1>
    <p class="subtitle">
      Одни шумные точки из зависимости y = 0.5x² − 2x + 3
    </p>

    <svg
      id="chart"
      viewBox="0 0 560 430"
      width="560"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Сравнение полиномов степени 2 и степени 5</title>
      <desc id="svg-description">
        Одни и те же шумные точки, гладкая квадратичная кривая и более
        извилистая кривая пятой степени.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать одни и те же шумные точки, гладкий полином
      степени 2 и более извилистый полином степени 5.
    </p>

    <noscript>
      <p class="fallback">
        Схема должна была показать одни и те же шумные точки, гладкий полином
        степени 2 и более извилистый полином степени 5.
      </p>
    </noscript>
  </main>

  <script>
    const observations = [
      [0, 3.28],
      [0.24, 2.42],
      [0.48, 2.18],
      [0.72, 1.58],
      [0.96, 1.86],
      [1.2, 1.17],
      [1.44, 1.45],
      [1.68, 0.62],
      [1.92, 0.91],
      [2.16, 1.34],
      [2.4, 1.08],
      [2.64, 1.56],
      [2.88, 1.26],
      [3.12, 1.76],
      [3.36, 2.19],
      [3.6, 1.92],
      [3.84, 2.74],
      [4.08, 2.83],
      [4.32, 3.82],
      [4.56, 4.08],
      [4.8, 5.02],
      [5, 5.82]
    ];

    const quadraticCoefficients = [0.5, -2, 3];
    const fifthDegreeShape = [-0.18, 0.2, 1.2, 2.4, 3.7, 4.8];
    const layout = [
      0, 5, 0.025,
      -0.55, 5.8, -0.55, 6,
      0.14, 0.24,
      0.065,
      -0.35, 0.35, 0.42,
      -0.78, -1.18, -1.58,
      2, 1,
      4, 5,
      10, -9, 10, 18, 0, -14, 8, 5
    ];

    const origin = { x: 90, y: 315 };
    const scale = 52;

    function toPx(point) {
      const [x, y] = point;
      return [origin.x + x * scale, origin.y - y * scale];
    }

    try {
      const svg = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const [
        curveStart, curveEnd, curveStep,
        axisLeft, axisRight, axisBottom, axisTop,
        arrowHalf, arrowLength,
        pointRadius,
        legendLeft, legendRight, legendTextX,
        legendPointsY, legendTwoY, legendFiveY,
        turnX, turnY,
        dashLength, dashGap,
        xLabelDx, xLabelDy, yLabelDx, yLabelDy,
        turnDx, turnDy, legendDx, legendDy
      ] = layout;

      const [quadraticA, quadraticB, quadraticC] =
        quadraticCoefficients;

      const [
        wiggleAmount,
        rootOne,
        rootTwo,
        rootThree,
        rootFour,
        rootFive
      ] = fifthDegreeShape;

      const zero = curveStart;

      function element(tag, attributes, content) {
        const created = document.createElementNS(namespace, tag);
        for (const [name, value] of Object.entries(attributes)) {
          created.setAttribute(name, String(value));
        }
        if (content) {
          created.textContent = content;
        }
        return created;
      }

      function quadratic(x) {
        return quadraticA * x * x + quadraticB * x + quadraticC;
      }

      function fifthDegree(x) {
        const adjustment =
          wiggleAmount *
          (x - rootOne) *
          (x - rootTwo) *
          (x - rootThree) *
          (x - rootFour) *
          (x - rootFive);
        return quadratic(x) + adjustment;
      }

      function line(start, end, className) {
        const [x1, y1] = toPx(start);
        const [x2, y2] = toPx(end);
        return element("line", {
          x1,
          y1,
          x2,
          y2,
          class: className
        });
      }

      function polygon(points, className) {
        const converted = points
          .map((point) => {
            const [x, y] = toPx(point);
            return `${x},${y}`;
          })
          .join(" ");
        return element("polygon", {
          points: converted,
          class: className
        });
      }

      function textAt(anchor, offset, value, className, textAnchor) {
        const [anchorX, anchorY] = toPx(anchor);
        const [offsetX, offsetY] = offset;
        return element("text", {
          x: anchorX + offsetX,
          y: anchorY + offsetY,
          class: className,
          "text-anchor": textAnchor
        }, value);
      }

      function curvePath(curve, className) {
        const commands = [];
        let firstPoint = true;

        for (
          let x = curveStart;
          x <= curveEnd;
          x += curveStep
        ) {
          const [pixelX, pixelY] = toPx([x, curve(x)]);
          commands.push(
            `${firstPoint ? "M" : "L"} ${pixelX} ${pixelY}`
          );
          firstPoint = false;
        }

        return element("path", {
          d: commands.join(" "),
          class: className
        });
      }

      const [radiusEdgeX] = toPx([pointRadius, zero]);
      const [zeroX] = toPx([zero, zero]);
      const radiusInPixels = Math.abs(radiusEdgeX - zeroX);

      const axes = element("g", {
        "aria-hidden": "true"
      });

      axes.append(
        line([axisLeft, zero], [axisRight, zero], "axis"),
        line([zero, axisBottom], [zero, axisTop], "axis"),
        polygon([
          [axisRight, zero],
          [axisRight - arrowLength, arrowHalf],
          [axisRight - arrowLength, -arrowHalf]
        ], "arrowhead"),
        polygon([
          [zero, axisTop],
          [-arrowHalf, axisTop - arrowLength],
          [arrowHalf, axisTop - arrowLength]
        ], "arrowhead"),
        textAt(
          [axisRight, zero],
          [xLabelDx, xLabelDy],
          "x",
          "axis-label",
          "start"
        ),
        textAt(
          [zero, axisTop],
          [yLabelDx, yLabelDy],
          "y",
          "axis-label",
          "start"
        )
      );

      const turnGuide = line(
        [turnX, zero],
        [turnX, turnY],
        "guide"
      );
      turnGuide.setAttribute(
        "stroke-dasharray",
        `${dashLength} ${dashGap}`
      );

      const curves = element("g", {
        "aria-label": "Кривые моделей"
      });

      curves.append(
        curvePath(fifthDegree, "curve-five"),
        curvePath(quadratic, "curve-two")
      );

      const points = element("g", {
        "aria-label": "Шумные наблюдения"
      });

      for (const point of observations) {
        const [cx, cy] = toPx(point);
        points.append(
          element("circle", {
            cx,
            cy,
            r: radiusInPixels,
            class: "observation"
          })
        );
      }

      const annotations = element("g", {
        "aria-hidden": "true"
      });

      annotations.append(
        turnGuide,
        textAt(
          [turnX, turnY],
          [turnDx, turnDy],
          "плавный поворот",
          "turn-label",
          "middle"
        )
      );

      const legend = element("g", {
        "aria-label": "Обозначения"
      });

      const [legendPointX, legendPointY] =
        toPx([legendLeft, legendPointsY]);

      legend.append(
        element("circle", {
          cx: legendPointX,
          cy: legendPointY,
          r: radiusInPixels,
          class: "observation"
        }),
        textAt(
          [legendTextX, legendPointsY],
          [legendDx, legendDy],
          "шумные точки",
          "legend-text",
          "start"
        ),
        line(
          [legendLeft, legendTwoY],
          [legendRight, legendTwoY],
          "legend-two"
        ),
        textAt(
          [legendTextX, legendTwoY],
          [legendDx, legendDy],
          "степень 2 — гладкая форма",
          "legend-text",
          "start"
        ),
        line(
          [legendLeft, legendFiveY],
          [legendRight, legendFiveY],
          "legend-five"
        ),
        textAt(
          [legendTextX, legendFiveY],
          [legendDx, legendDy],
          "степень 5 — больше изгибов",
          "legend-text",
          "start"
        )
      );

      svg.append(axes, curves, points, annotations, legend);
      fallback.hidden = true;
    } catch (error) {
      const chart = document.getElementById("chart");
      const fallback = document.getElementById("fallback");
      chart.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
