<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Как w и b задают прямую</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #53627a;
      --axis: #56647a;
      --line: #246bce;
      --run: #d97706;
      --rise: #c24173;
      --point: #132f55;
      --guide: #8b98aa;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --surface: #182131;
        --text: #eef4ff;
        --muted: #b5c0d2;
        --axis: #a9b5c8;
        --line: #70a9ff;
        --run: #f6b84a;
        --rise: #f080ad;
        --point: #ffffff;
        --guide: #8290a5;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
    }

    main {
      background: var(--surface);
    }

    h1 {
      font-size: 21px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      overflow: visible;
      background: var(--surface);
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 2.2px;
      stroke-linecap: round;
    }

    .tick {
      stroke: var(--axis);
      stroke-width: 1.8px;
      stroke-linecap: round;
    }

    .model-line {
      stroke: var(--line);
      stroke-width: 4px;
      stroke-linecap: round;
    }

    .run-line {
      stroke: var(--run);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .rise-line {
      stroke: var(--rise);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .guide-line {
      stroke: var(--guide);
      stroke-width: 1.5px;
      stroke-linecap: round;
    }

    .axis-arrow {
      fill: var(--axis);
    }

    .run-arrow {
      fill: var(--run);
    }

    .rise-arrow {
      fill: var(--rise);
    }

    .point {
      fill: var(--surface);
      stroke: var(--point);
      stroke-width: 3px;
    }

    .label {
      fill: var(--text);
      font-size: 17px;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
      stroke-linejoin: round;
    }

    .axis-label {
      fill: var(--muted);
      font-size: 18px;
      font-style: italic;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
    }

    .tick-label {
      fill: var(--muted);
      font-size: 15px;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
    }

    .equation-label {
      fill: var(--line);
      font-size: 19px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 6px;
    }

    .run-label {
      fill: var(--run);
      font-size: 16px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
    }

    .rise-label {
      fill: var(--rise);
      font-size: 16px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--surface);
      stroke-width: 5px;
    }

    .caption {
      color: var(--muted);
      font-size: 15px;
    }

    .caption strong {
      color: var(--text);
    }

    .fallback {
      color: var(--text);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <main aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Как <i>w</i> и <i>b</i> задают прямую</h1>

    <svg
      id="chart"
      viewBox="0 0 920 430"
      width="920"
      height="430"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">График прямой y равно 3x плюс 7</title>
      <desc id="svg-description">
        Прямая пересекает вертикальную ось в 7. При увеличении x на 1
        значение y увеличивается на 3.
      </desc>
      <g id="drawing"></g>
    </svg>

    <p id="fallback" class="fallback" hidden></p>

    <p class="caption">
      <strong><i>b</i> = 7</strong> задаёт высоту пересечения с осью
      <i>y</i>, а <strong><i>w</i> = 3</strong> означает: шаг на
      <strong>1</strong> вправо даёт подъём на <strong>3</strong>.
    </p>
  </main>

  <script>
    const data = Object.freeze({
      canvas: { width: 920, height: 430 },
      origin: { x: 210, y: 373 },
      scale: { x: 134, y: 18 },
      zero: 0,
      model: { w: 3, b: 7 },
      axes: {
        x: {
          from: { x: -1.35, y: 0 },
          to: { x: 4.75, y: 0 }
        },
        y: {
          from: { x: 0, y: -1 },
          to: { x: 0, y: 19.5 }
        }
      },
      line: {
        fromX: -1.3,
        toX: 3.9
      },
      ticks: [
        {
          from: { x: 1, y: -0.31 },
          to: { x: 1, y: 0.31 }
        },
        {
          from: { x: -0.07, y: 7 },
          to: { x: 0.07, y: 7 }
        }
      ],
      guides: [
        {
          from: { x: 1, y: 0 },
          to: { x: 1, y: 7 }
        }
      ],
      run: {
        from: { x: 0, y: 7 },
        to: { x: 1, y: 7 },
        arrow: [
          { x: 1, y: 7 },
          { x: 0.85, y: 7.26 },
          { x: 0.85, y: 6.74 }
        ]
      },
      rise: {
        from: { x: 1, y: 7 },
        to: { x: 1, y: 10 },
        arrow: [
          { x: 1, y: 10 },
          { x: 0.92, y: 9.43 },
          { x: 1.08, y: 9.43 }
        ]
      },
      axisArrows: [
        [
          { x: 4.75, y: 0 },
          { x: 4.57, y: 0.42 },
          { x: 4.57, y: -0.42 }
        ],
        [
          { x: 0, y: 19.5 },
          { x: -0.095, y: 18.72 },
          { x: 0.095, y: 18.72 }
        ]
      ],
      points: [
        { x: 0, y: 7 },
        { x: 1, y: 10 }
      ],
      pointRadius: 0.045,
      labels: [
        {
          text: "x",
          at: { x: 4.16, y: 0 },
          dx: 0,
          dy: -15,
          anchor: "middle",
          className: "axis-label"
        },
        {
          text: "y",
          at: { x: 0, y: 18.05 },
          dx: 17,
          dy: 5,
          anchor: "start",
          className: "axis-label"
        },
        {
          text: "0",
          at: { x: 0, y: 0 },
          dx: -11,
          dy: 25,
          anchor: "end",
          className: "tick-label"
        },
        {
          text: "1",
          at: { x: 1, y: 0 },
          dx: 0,
          dy: 25,
          anchor: "middle",
          className: "tick-label"
        },
        {
          text: "b = 7 — пересечение с осью y",
          at: { x: 0, y: 7 },
          dx: -17,
          dy: -15,
          anchor: "end",
          className: "label"
        },
        {
          text: "+1 по x",
          at: { x: 0.43, y: 7 },
          dx: 0,
          dy: 30,
          anchor: "middle",
          className: "run-label"
        },
        {
          text: "+3 по y",
          at: { x: 1, y: 8.38 },
          dx: 22,
          dy: 5,
          anchor: "start",
          className: "rise-label"
        },
        {
          text: "y = 3x + 7",
          at: { x: 2.05, y: 13.15 },
          dx: 0,
          dy: -17,
          anchor: "middle",
          className: "equation-label"
        }
      ]
    });

    const origin = Object.freeze({
      x: data.origin.x,
      y: data.origin.y
    });

    const scale = Object.freeze({
      x: data.scale.x,
      y: data.scale.y
    });

    function sx(x) {
      return origin.x + x * scale.x;
    }

    function sy(y) {
      return origin.y - y * scale.y;
    }

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const drawing = document.getElementById("drawing");

      function make(name, attributes, text) {
        const element = document.createElementNS(namespace, name);

        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });

        if (text !== undefined) {
          element.textContent = text;
        }

        return element;
      }

      function addLine(parent, from, to, className) {
        parent.appendChild(make("line", {
          x1: sx(from.x),
          y1: sy(from.y),
          x2: sx(to.x),
          y2: sy(to.y),
          class: className
        }));
      }

      function addPolygon(parent, points, className) {
        const converted = points
          .map((point) => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");

        parent.appendChild(make("polygon", {
          points: converted,
          class: className
        }));
      }

      function modelY(x) {
        return data.model.w * x + data.model.b;
      }

      const axesGroup = make("g", {
        "aria-label": "Оси координат"
      });

      addLine(
        axesGroup,
        data.axes.x.from,
        data.axes.x.to,
        "axis"
      );

      addLine(
        axesGroup,
        data.axes.y.from,
        data.axes.y.to,
        "axis"
      );

      data.axisArrows.forEach((arrow) => {
        addPolygon(axesGroup, arrow, "axis-arrow");
      });

      data.ticks.forEach((tick) => {
        addLine(axesGroup, tick.from, tick.to, "tick");
      });

      drawing.appendChild(axesGroup);

      const guideGroup = make("g", {
        "aria-label": "Вспомогательная линия"
      });

      data.guides.forEach((guide) => {
        addLine(guideGroup, guide.from, guide.to, "guide-line");
      });

      drawing.appendChild(guideGroup);

      const modelGroup = make("g", {
        "aria-label": "Прямая y равно 3x плюс 7"
      });

      addLine(
        modelGroup,
        {
          x: data.line.fromX,
          y: modelY(data.line.fromX)
        },
        {
          x: data.line.toX,
          y: modelY(data.line.toX)
        },
        "model-line"
      );

      drawing.appendChild(modelGroup);

      const slopeGroup = make("g", {
        "aria-label": "Шаг вправо на 1 и подъём на 3"
      });

      addLine(
        slopeGroup,
        data.run.from,
        data.run.to,
        "run-line"
      );

      addPolygon(
        slopeGroup,
        data.run.arrow,
        "run-arrow"
      );

      addLine(
        slopeGroup,
        data.rise.from,
        data.rise.to,
        "rise-line"
      );

      addPolygon(
        slopeGroup,
        data.rise.arrow,
        "rise-arrow"
      );

      drawing.appendChild(slopeGroup);

      const pointsGroup = make("g", {
        "aria-label": "Точки прямой"
      });

      data.points.forEach((point) => {
        pointsGroup.appendChild(make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: Math.abs(
            sx(data.pointRadius) - sx(data.zero)
          ),
          class: "point"
        }));
      });

      drawing.appendChild(pointsGroup);

      const labelsGroup = make("g", {
        "aria-label": "Подписи"
      });

      data.labels.forEach((label) => {
        labelsGroup.appendChild(make("text", {
          x: sx(label.at.x),
          y: sy(label.at.y),
          dx: label.dx,
          dy: label.dy,
          "text-anchor": label.anchor,
          class: label.className
        }, label.text));
      });

      drawing.appendChild(labelsGroup);
    } catch (error) {
      const chart = document.getElementById("chart");
      const fallback = document.getElementById("fallback");

      if (chart) {
        chart.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
        fallback.textContent =
          "Схема должна была показать прямую y = 3x + 7: " +
          "пересечение оси y в 7 и подъём на 3 при увеличении x на 1.";
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
