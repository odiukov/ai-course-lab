<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Цена vocabulary в параметрах</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --matrix: cornflowerblue;
      --matrix-alt: lightskyblue;
      --line: royalblue;
      --accent: darkorange;
      --soft: aliceblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --ink: white;
        --muted: lightsteelblue;
        --matrix: steelblue;
        --matrix-alt: darkcyan;
        --line: lightskyblue;
        --accent: orange;
        --soft: darkslateblue;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      font-size: 16px;
    }

    h1 {
      margin: unset;
      font-size: 21px;
      font-weight: bold;
      text-align: center;
    }

    figure {
      margin: unset;
      background: var(--panel);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 455px;
      background: var(--panel);
    }

    text {
      fill: var(--ink);
    }

    .muted {
      fill: var(--muted);
    }

    .strong {
      font-weight: bold;
    }

    #fallback {
      margin: unset;
      font-size: 17px;
      text-align: center;
      background: var(--panel);
      color: var(--ink);
    }

    #fallback[hidden],
    svg[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title" aria-describedby="fallback">
    <h1 id="diagram-title">Цена vocabulary в параметрах</h1>
    <p id="fallback">
      Схема показывает две матрицы эмбеддингов: 32 000 × 4096 ≈ 131 млн
      параметров и 128 000 × 4096 ≈ 524 млн параметров; разница ≈ 393 млн.
    </p>
    <svg
      id="diagram"
      viewBox="0 0 1200 455"
      width="1200"
      height="455"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
      hidden>
      <title id="svg-title">Сравнение размеров матриц эмбеддингов</title>
      <desc id="svg-desc">
        При одинаковой размерности эмбеддинга 4096 увеличение словаря
        с 32 000 до 128 000 увеличивает матрицу и число параметров в четыре раза.
      </desc>
    </svg>
  </figure>

  <script>
    (() => {
      const data = [
        {
          kind: "config",
          namespace: "http://www.w3.org/2000/svg",
          line: 2,
          gridLine: 1,
          head: 11,
          wing: 6,
          font: 16,
          smallFont: 15,
          equationFont: 20,
          resultFont: 18,
          deltaFont: 18,
          labelPad: 8,
          rowLabelPad: 12,
          matrixStroke: "var(--line)",
          gridStroke: "var(--soft)",
          arrowStroke: "var(--accent)",
          arrowFill: "var(--accent)",
          mainFill: "var(--matrix)",
          alternateFill: "var(--matrix-alt)",
          guideStroke: "var(--muted)",
          multiplierX: 580,
          multiplierTopY: 164,
          multiplierArrowStartY: 181,
          multiplierArrowEndY: 228,
          multiplierBottomY: 254,
          formulaY: 374,
          resultY: 399,
          deltaLabelY: 425,
          deltaLineY: 442,
          deltaStartX: 315,
          deltaEndX: 845,
          deltaCenterX: 580,
          deltaText: "разница ≈ 393 млн параметров",
          multiplierTopText: "словарь ×4",
          multiplierBottomText: "строк ×4"
        },
        {
          kind: "matrix",
          x: 170,
          y: 275,
          width: 290,
          height: 70,
          centerX: 315,
          centerY: 310,
          dimensionY: 242,
          dimensionLabelY: 225,
          rowArrowX: 154,
          rowLabelX: 142,
          rowLabelY: 310,
          rowAnchor: "end",
          dimensionText: "размерность: 4096",
          rowText: "32 000 строк",
          formulaText: "32 000 × 4096",
          resultText: "≈ 131 млн параметров",
          blocks: [
            { x: 170, y: 275, width: 290, height: 70, fill: "main" }
          ],
          verticals: [
            { x: 228, y1: 275, y2: 345 },
            { x: 286, y1: 275, y2: 345 },
            { x: 344, y1: 275, y2: 345 },
            { x: 402, y1: 275, y2: 345 }
          ],
          horizontals: [
            { x1: 170, x2: 460, y: 289 },
            { x1: 170, x2: 460, y: 303 },
            { x1: 170, x2: 460, y: 317 },
            { x1: 170, x2: 460, y: 331 }
          ]
        },
        {
          kind: "matrix",
          x: 700,
          y: 65,
          width: 290,
          height: 280,
          centerX: 845,
          centerY: 205,
          dimensionY: 32,
          dimensionLabelY: 16,
          rowArrowX: 1006,
          rowLabelX: 1018,
          rowLabelY: 205,
          rowAnchor: "start",
          dimensionText: "размерность: 4096",
          rowText: "128 000 строк",
          formulaText: "128 000 × 4096",
          resultText: "≈ 524 млн параметров",
          blocks: [
            { x: 700, y: 65, width: 290, height: 70, fill: "main" },
            { x: 700, y: 135, width: 290, height: 70, fill: "alternate" },
            { x: 700, y: 205, width: 290, height: 70, fill: "main" },
            { x: 700, y: 275, width: 290, height: 70, fill: "alternate" }
          ],
          verticals: [
            { x: 758, y1: 65, y2: 345 },
            { x: 816, y1: 65, y2: 345 },
            { x: 874, y1: 65, y2: 345 },
            { x: 932, y1: 65, y2: 345 }
          ],
          horizontals: [
            { x1: 700, x2: 990, y: 79 },
            { x1: 700, x2: 990, y: 93 },
            { x1: 700, x2: 990, y: 107 },
            { x1: 700, x2: 990, y: 121 },
            { x1: 700, x2: 990, y: 135 },
            { x1: 700, x2: 990, y: 149 },
            { x1: 700, x2: 990, y: 163 },
            { x1: 700, x2: 990, y: 177 },
            { x1: 700, x2: 990, y: 191 },
            { x1: 700, x2: 990, y: 205 },
            { x1: 700, x2: 990, y: 219 },
            { x1: 700, x2: 990, y: 233 },
            { x1: 700, x2: 990, y: 247 },
            { x1: 700, x2: 990, y: 261 },
            { x1: 700, x2: 990, y: 275 },
            { x1: 700, x2: 990, y: 289 },
            { x1: 700, x2: 990, y: 303 },
            { x1: 700, x2: 990, y: 317 },
            { x1: 700, x2: 990, y: 331 }
          ]
        }
      ];

      const origin = { x: 0, y: 0 };
      const scale = { x: 1, y: 1 };

      const sx = x => origin.x + x * scale.x;
      const sy = y => origin.y + y * scale.y;

      try {
        const [cfg, ...matrices] = data;
        const svg = document.getElementById("diagram");
        const fallback = document.getElementById("fallback");

        const element = (name, attributes, textValue) => {
          const node = document.createElementNS(cfg.namespace, name);
          Object.entries(attributes).forEach(([key, value]) => {
            node.setAttribute(key, value);
          });
          if (textValue !== undefined) {
            node.textContent = textValue;
          }
          return node;
        };

        const add = node => {
          svg.appendChild(node);
          return node;
        };

        const line = (x1, y1, x2, y2, stroke, width) => add(element("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          stroke,
          "stroke-width": width,
          "stroke-linecap": "round"
        }));

        const arrowHead = (tipX, tipY, fromX, fromY, stroke, length, wing) => {
          const vectorX = tipX - fromX;
          const vectorY = tipY - fromY;
          const magnitude = Math.hypot(vectorX, vectorY);
          const unitX = vectorX / magnitude;
          const unitY = vectorY / magnitude;
          const baseX = tipX - unitX * length;
          const baseY = tipY - unitY * length;
          const leftX = baseX - unitY * wing;
          const leftY = baseY + unitX * wing;
          const rightX = baseX + unitY * wing;
          const rightY = baseY - unitX * wing;
          const points = [
            [tipX, tipY],
            [leftX, leftY],
            [rightX, rightY]
          ].map(point => `${sx(point.shift())},${sy(point.pop())}`).join(" ");

          add(element("polygon", {
            points,
            fill: stroke
          }));
        };

        const arrow = (x1, y1, x2, y2, stroke, width, heads) => {
          line(x1, y1, x2, y2, stroke, width);
          if (heads === "start" || heads === "both") {
            arrowHead(x1, y1, x2, y2, stroke, cfg.head, cfg.wing);
          }
          if (heads === "end" || heads === "both") {
            arrowHead(x2, y2, x1, y1, stroke, cfg.head, cfg.wing);
          }
        };

        const text = (x, y, value, anchor, size, className, dx, dy) => {
          const attributes = {
            x: sx(x),
            y: sy(y),
            "text-anchor": anchor,
            "font-size": size,
            "dominant-baseline": "middle",
            dx,
            dy
          };
          if (className) {
            attributes.class = className;
          }
          return add(element("text", attributes, value));
        };

        const rectangle = (x, y, width, height, fill, stroke, strokeWidth) => {
          const attributes = {
            x: sx(x),
            y: sy(y),
            width: sx(x + width) - sx(x),
            height: sy(y + height) - sy(y),
            fill
          };
          if (stroke) {
            attributes.stroke = stroke;
            attributes["stroke-width"] = strokeWidth;
          }
          return add(element("rect", attributes));
        };

        matrices.forEach(matrix => {
          matrix.blocks.forEach(block => {
            const fill = block.fill === "alternate"
              ? cfg.alternateFill
              : cfg.mainFill;
            rectangle(
              block.x,
              block.y,
              block.width,
              block.height,
              fill,
              undefined,
              cfg.gridLine
            );
          });

          matrix.verticals.forEach(guide => {
            line(
              guide.x,
              guide.y1,
              guide.x,
              guide.y2,
              cfg.gridStroke,
              cfg.gridLine
            );
          });

          matrix.horizontals.forEach(guide => {
            line(
              guide.x1,
              guide.y,
              guide.x2,
              guide.y,
              cfg.gridStroke,
              cfg.gridLine
            );
          });

          rectangle(
            matrix.x,
            matrix.y,
            matrix.width,
            matrix.height,
            "none",
            cfg.matrixStroke,
            cfg.line
          );

          arrow(
            matrix.x,
            matrix.dimensionY,
            matrix.x + matrix.width,
            matrix.dimensionY,
            cfg.arrowStroke,
            cfg.line,
            "both"
          );

          text(
            matrix.centerX,
            matrix.dimensionLabelY,
            matrix.dimensionText,
            "middle",
            cfg.smallFont,
            "strong",
            sx(origin.x),
            -cfg.labelPad
          );

          arrow(
            matrix.rowArrowX,
            matrix.y,
            matrix.rowArrowX,
            matrix.y + matrix.height,
            cfg.arrowStroke,
            cfg.line,
            "both"
          );

          const rowDx = matrix.rowAnchor === "end"
            ? -cfg.rowLabelPad
            : cfg.rowLabelPad;

          text(
            matrix.rowLabelX,
            matrix.rowLabelY,
            matrix.rowText,
            matrix.rowAnchor,
            cfg.font,
            "strong",
            rowDx,
            sy(origin.y)
          );

          text(
            matrix.centerX,
            cfg.formulaY,
            matrix.formulaText,
            "middle",
            cfg.equationFont,
            "strong",
            sx(origin.x),
            sy(origin.y)
          );

          text(
            matrix.centerX,
            cfg.resultY,
            matrix.resultText,
            "middle",
            cfg.resultFont,
            "",
            sx(origin.x),
            sy(origin.y)
          );
        });

        text(
          cfg.multiplierX,
          cfg.multiplierTopY,
          cfg.multiplierTopText,
          "middle",
          cfg.font,
          "strong",
          sx(origin.x),
          sy(origin.y)
        );

        arrow(
          cfg.multiplierX,
          cfg.multiplierArrowStartY,
          cfg.multiplierX,
          cfg.multiplierArrowEndY,
          cfg.arrowStroke,
          cfg.line,
          "end"
        );

        text(
          cfg.multiplierX,
          cfg.multiplierBottomY,
          cfg.multiplierBottomText,
          "middle",
          cfg.font,
          "strong",
          sx(origin.x),
          cfg.labelPad
        );

        text(
          cfg.deltaCenterX,
          cfg.deltaLabelY,
          cfg.deltaText,
          "middle",
          cfg.deltaFont,
          "strong",
          sx(origin.x),
          -cfg.labelPad
        );

        arrow(
          cfg.deltaStartX,
          cfg.deltaLineY,
          cfg.deltaEndX,
          cfg.deltaLineY,
          cfg.arrowStroke,
          cfg.line,
          "both"
        );

        fallback.hidden = true;
        svg.hidden = false;
      } catch (error) {
        const fallback = document.getElementById("fallback");
        const svg = document.getElementById("diagram");
        fallback.hidden = false;
        fallback.textContent =
          "Схема должна была показать: 32 000 × 4096 ≈ 131 млн параметров, " +
          "128 000 × 4096 ≈ 524 млн параметров, разница ≈ 393 млн.";
        svg.hidden = true;
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
