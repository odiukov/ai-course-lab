<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <title>Малый и большой vocabulary</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: ivory;
      --panel: white;
      --ink: midnightblue;
      --muted: dimgray;
      --beam: slategray;
      --small: cornflowerblue;
      --small-alt: lightskyblue;
      --large: mediumseagreen;
      --large-alt: mediumaquamarine;
      --accent: darkorange;
      --grid: white;
      --pill: lavender;
      --support: lightsteelblue;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: auto;
    }

    figure {
      margin: auto;
      background: var(--bg);
    }

    figcaption {
      padding: 10px 14px;
      background: var(--panel);
      border: 1px solid var(--support);
      border-bottom: none;
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--bg);
      border: 1px solid var(--support);
    }

    .beam,
    .hanger,
    .pan,
    .support,
    .base {
      fill: none;
      stroke: var(--beam);
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hanger {
      stroke-width: 2px;
    }

    .support-fill {
      fill: var(--support);
      stroke: var(--beam);
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .pivot {
      fill: var(--accent);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .small-cell {
      fill: var(--small);
      stroke: var(--grid);
      stroke-width: 2px;
    }

    .small-cell-alt {
      fill: var(--small-alt);
      stroke: var(--grid);
      stroke-width: 2px;
    }

    .large-cell {
      fill: var(--large);
      stroke: var(--grid);
      stroke-width: 2px;
    }

    .large-cell-alt {
      fill: var(--large-alt);
      stroke: var(--grid);
      stroke-width: 2px;
    }

    .matrix-frame,
    .token-frame {
      fill: none;
      stroke: var(--ink);
      stroke-width: 3px;
    }

    .small-token {
      fill: var(--small-alt);
    }

    .large-token {
      fill: var(--large-alt);
    }

    .token-cut {
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .outcome {
      fill: var(--pill);
      stroke: var(--support);
      stroke-width: 2px;
    }

    .heading {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .section-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: bold;
    }

    .metric {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .token-label {
      fill: var(--ink);
      font-size: 16px;
    }

    .badge {
      fill: var(--accent);
      font-size: 16px;
      font-weight: bold;
    }

    .outcome-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .tradeoff {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .fallback {
      padding: 14px;
      min-height: 320px;
      background: var(--bg);
      border: 1px solid var(--support);
      color: var(--ink);
      font-size: 18px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: midnightblue;
        --panel: darkslateblue;
        --ink: whitesmoke;
        --muted: lightsteelblue;
        --beam: silver;
        --small: royalblue;
        --small-alt: steelblue;
        --large: seagreen;
        --large-alt: mediumseagreen;
        --accent: orange;
        --grid: midnightblue;
        --pill: darkslategray;
        --support: slategray;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="scheme-title">
    <figcaption id="scheme-title">Малый и большой vocabulary</figcaption>
    <svg id="diagram" width="1040" height="470" viewBox="0 0 1040 470"
         preserveAspectRatio="xMidYMid meet" role="img"
         aria-labelledby="scheme-title scheme-description"></svg>
  </figure>

  <script>
    const DATA = [{
      zero: 0,
      one: 1,
      two: 2,
      originX: 20,
      originY: 8,
      scaleX: 1,
      scaleY: 1,
      contentW: 1000,
      contentH: 448,

      leftCenter: 230,
      rightCenter: 770,
      headingY: 28,

      beamLeft: 210,
      beamRight: 790,
      beamY: 88,
      pivotX: 500,
      pivotY: 88,
      pivotR: 12,

      leftHangX: 230,
      rightHangX: 770,
      panY: 340,
      panDepth: 12,
      leftPanL: 45,
      leftPanR: 415,
      rightPanL: 585,
      rightPanR: 955,

      supportTopY: 101,
      supportLeftX: 463,
      supportRightX: 537,
      supportBottomY: 370,
      baseLeftX: 430,
      baseRightX: 570,
      baseY: 370,

      smallMatrix: {
        x: 155,
        y: 198,
        w: 150,
        h: 26,
        rows: 2,
        cols: 6,
        labelY: 181,
        metricY: 247
      },
      largeMatrix: {
        x: 695,
        y: 120,
        w: 150,
        h: 104,
        rows: 8,
        cols: 6,
        labelY: 103,
        metricY: 247
      },

      sequenceY: 286,
      sequenceH: 24,
      sequenceLabelY: 274,
      smallSequenceX: 70,
      smallSequenceW: 320,
      largeSequenceX: 688,
      tokensSmall: 100,
      tokensLarge: 70,
      smallCuts: [
        0.07, 0.15, 0.23, 0.31, 0.39, 0.48,
        0.57, 0.66, 0.75, 0.84, 0.92
      ],
      largeCuts: [
        0.12, 0.25, 0.39, 0.54, 0.69, 0.84
      ],
      badgeY: 329,

      outcomeY: 382,
      outcomeH: 38,
      leftOutcomeX: 45,
      rightOutcomeX: 585,
      outcomeW: 370,
      outcomeTextY: 407,
      tradeoffY: 444,

      matrixRadius: 5,
      tokenRadius: 7,
      outcomeRadius: 14
    }];

    const [D] = DATA;
    const origin = Object.freeze({ x: D.originX, y: D.originY });
    const scale = Object.freeze({ x: D.scaleX, y: D.scaleY });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");

    try {
      const ns = svg.namespaceURI;

      const node = (name, attrs, content) => {
        const element = document.createElementNS(ns, name);
        Object.entries(attrs || {}).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        if (content !== undefined) {
          element.textContent = content;
        }
        return element;
      };

      const add = element => {
        svg.appendChild(element);
        return element;
      };

      const line = (x1, y1, x2, y2, className) =>
        node("line", {
          x1: sx(x1),
          y1: sy(y1),
          x2: sx(x2),
          y2: sy(y2),
          class: className
        });

      const rect = (x, y, w, h, className, radius) =>
        node("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + w) - sx(x),
          height: sy(y + h) - sy(y),
          rx: sx(radius) - sx(D.zero),
          ry: sy(radius) - sy(D.zero),
          class: className
        });

      const circle = (x, y, radius, className) =>
        node("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(radius) - sx(D.zero),
          class: className
        });

      const label = (x, y, value, className, anchor) =>
        node("text", {
          x: sx(x),
          y: sy(y),
          class: className,
          "text-anchor": anchor
        }, value);

      const polygon = (points, className) =>
        node("polygon", {
          points: points.map(point =>
            `${sx(point.x)},${sy(point.y)}`
          ).join(" "),
          class: className
        });

      const panPath = (left, right, center) => {
        const edgeY = D.panY;
        const bottomY = D.panY + D.panDepth;
        return node("path", {
          d: [
            `M ${sx(left)} ${sy(edgeY)}`,
            `Q ${sx(center)} ${sy(bottomY)} ${sx(right)} ${sy(edgeY)}`
          ].join(" "),
          class: "pan"
        });
      };

      const description = node(
        "desc",
        { id: "scheme-description" },
        "Весы сравнивают vocabulary 32K и 128K. Слева матрица эмбеддингов меньше, но последовательность содержит 100 токенов. Справа матрица больше, зато тот же текст занимает примерно 70 токенов, то есть на 30% меньше."
      );
      add(description);

      add(rect(
        D.zero,
        D.zero,
        D.contentW,
        D.contentH,
        "background",
        D.zero
      )).setAttribute("fill", "var(--bg)");

      add(polygon([
        { x: D.pivotX, y: D.supportTopY },
        { x: D.supportLeftX, y: D.supportBottomY },
        { x: D.supportRightX, y: D.supportBottomY }
      ], "support-fill"));

      add(line(
        D.baseLeftX,
        D.baseY,
        D.baseRightX,
        D.baseY,
        "base"
      ));

      add(line(
        D.beamLeft,
        D.beamY,
        D.beamRight,
        D.beamY,
        "beam"
      ));

      add(circle(
        D.pivotX,
        D.pivotY,
        D.pivotR,
        "pivot"
      ));

      add(line(
        D.leftHangX,
        D.beamY,
        D.leftPanL,
        D.panY,
        "hanger"
      ));
      add(line(
        D.leftHangX,
        D.beamY,
        D.leftPanR,
        D.panY,
        "hanger"
      ));
      add(line(
        D.rightHangX,
        D.beamY,
        D.rightPanL,
        D.panY,
        "hanger"
      ));
      add(line(
        D.rightHangX,
        D.beamY,
        D.rightPanR,
        D.panY,
        "hanger"
      ));

      add(label(
        D.leftCenter,
        D.headingY,
        "Малый vocabulary — 32K",
        "heading",
        "middle"
      ));
      add(label(
        D.rightCenter,
        D.headingY,
        "Большой vocabulary — 128K",
        "heading",
        "middle"
      ));

      const drawMatrix = (matrix, primaryClass, alternateClass) => {
        const cellW = matrix.w / matrix.cols;
        const cellH = matrix.h / matrix.rows;

        for (let row = D.zero; row < matrix.rows; row += D.one) {
          for (let column = D.zero; column < matrix.cols; column += D.one) {
            const className =
              (row + column) % D.two === D.zero
                ? primaryClass
                : alternateClass;

            add(rect(
              matrix.x + column * cellW,
              matrix.y + row * cellH,
              cellW,
              cellH,
              className,
              D.zero
            ));
          }
        }

        add(rect(
          matrix.x,
          matrix.y,
          matrix.w,
          matrix.h,
          "matrix-frame",
          D.matrixRadius
        ));
      };

      add(label(
        D.leftCenter,
        D.smallMatrix.labelY,
        "меньшая матрица эмбеддингов",
        "section-label",
        "middle"
      ));
      drawMatrix(
        D.smallMatrix,
        "small-cell",
        "small-cell-alt"
      );
      add(label(
        D.leftCenter,
        D.smallMatrix.metricY,
        "≈131 млн параметров",
        "metric",
        "middle"
      ));

      add(label(
        D.rightCenter,
        D.largeMatrix.labelY,
        "большая матрица эмбеддингов",
        "section-label",
        "middle"
      ));
      drawMatrix(
        D.largeMatrix,
        "large-cell",
        "large-cell-alt"
      );
      add(label(
        D.rightCenter,
        D.largeMatrix.metricY,
        "≈524 млн параметров",
        "metric",
        "middle"
      ));

      const largeSequenceW =
        D.smallSequenceW * D.tokensLarge / D.tokensSmall;

      const drawSequence = (x, width, cuts, fillClass) => {
        add(rect(
          x,
          D.sequenceY,
          width,
          D.sequenceH,
          fillClass,
          D.tokenRadius
        ));

        cuts.forEach(cut => {
          add(line(
            x + width * cut,
            D.sequenceY,
            x + width * cut,
            D.sequenceY + D.sequenceH,
            "token-cut"
          ));
        });

        add(rect(
          x,
          D.sequenceY,
          width,
          D.sequenceH,
          "token-frame",
          D.tokenRadius
        ));
      };

      add(label(
        D.leftCenter,
        D.sequenceLabelY,
        "тот же абзац: 100 токенов",
        "token-label",
        "middle"
      ));
      drawSequence(
        D.smallSequenceX,
        D.smallSequenceW,
        D.smallCuts,
        "small-token"
      );

      add(label(
        D.rightCenter,
        D.sequenceLabelY,
        "тот же абзац: ≈70 токенов",
        "token-label",
        "middle"
      ));
      drawSequence(
        D.largeSequenceX,
        largeSequenceW,
        D.largeCuts,
        "large-token"
      );
      add(label(
        D.rightCenter,
        D.badgeY,
        "на 30% короче",
        "badge",
        "middle"
      ));

      add(panPath(
        D.leftPanL,
        D.leftPanR,
        D.leftCenter
      ));
      add(panPath(
        D.rightPanL,
        D.rightPanR,
        D.rightCenter
      ));

      add(rect(
        D.leftOutcomeX,
        D.outcomeY,
        D.outcomeW,
        D.outcomeH,
        "outcome",
        D.outcomeRadius
      ));
      add(label(
        D.leftCenter,
        D.outcomeTextY,
        "меньше памяти • длиннее последовательность",
        "outcome-label",
        "middle"
      ));

      add(rect(
        D.rightOutcomeX,
        D.outcomeY,
        D.outcomeW,
        D.outcomeH,
        "outcome",
        D.outcomeRadius
      ));
      add(label(
        D.rightCenter,
        D.outcomeTextY,
        "больше памяти • короче последовательность",
        "outcome-label",
        "middle"
      ));

      add(label(
        D.pivotX,
        D.tradeoffY,
        "Обмен: параметры в памяти ↔ токены на каждый запрос",
        "tradeoff",
        "middle"
      ));
    } catch (error) {
      const fallback = document.createElement("div");
      fallback.className = "fallback";
      fallback.textContent =
        "Схема должна была показать весы: vocabulary 32K с матрицей примерно на 131 млн параметров и последовательностью в 100 токенов — против vocabulary 128K с матрицей примерно на 524 млн параметров и последовательностью около 70 токенов, на 30% короче.";
      svg.replaceWith(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
