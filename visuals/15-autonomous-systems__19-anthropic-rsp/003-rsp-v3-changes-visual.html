<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Что изменилось в RSP v3.0</title>
<style>
:root {
  color-scheme: light dark;
  --page: white;
  --canvas: snow;
  --panel: white;
  --panel-soft: whitesmoke;
  --ink: midnightblue;
  --muted: slategray;
  --line: lightsteelblue;
  --added: seagreen;
  --added-soft: honeydew;
  --removed: firebrick;
  --removed-soft: mistyrose;
  --warning: darkgoldenrod;
  --warning-soft: lightyellow;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: black;
    --canvas: #10151d;
    --panel: #171f2b;
    --panel-soft: #202b39;
    --ink: gainsboro;
    --muted: lightsteelblue;
    --line: slategray;
    --added: lightgreen;
    --added-soft: #173425;
    --removed: salmon;
    --removed-soft: #3b2024;
    --warning: khaki;
    --warning-soft: #38341e;
  }
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.shell {
  width: 100%;
  max-width: 1200px;
  background: var(--canvas);
  border: 1px solid var(--line);
}
h1 {
  margin: 0;
  padding: 12px 18px 8px;
  font-size: 22px;
  font-weight: bold;
}
svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 470px;
  background: var(--canvas);
}
text {
  fill: var(--ink);
  dominant-baseline: hanging;
}
.small { font-size: 14px; }
.body { font-size: 16px; }
.label { font-size: 13px; font-weight: bold; }
.heading { font-size: 21px; font-weight: bold; }
.score-text { font-size: 22px; font-weight: bold; }
.delta { font-size: 25px; font-weight: bold; fill: var(--removed); }
.muted { fill: var(--muted); }
.added-text { fill: var(--added); }
.removed-text { fill: var(--removed); }
.warning-text { fill: var(--warning); }
.frame, .panel, .soft-panel, .added-panel, .removed-panel, .warning-panel {
  stroke-width: 2;
}
.frame { fill: var(--canvas); stroke: var(--line); }
.panel { fill: var(--panel); stroke: var(--line); }
.soft-panel { fill: var(--panel-soft); stroke: var(--line); }
.added-panel { fill: var(--added-soft); stroke: var(--added); }
.removed-panel { fill: var(--removed-soft); stroke: var(--removed); }
.warning-panel { fill: var(--warning-soft); stroke: var(--warning); }
.rule { stroke: var(--line); stroke-width: 2; fill: none; }
.added-rule { stroke: var(--added); stroke-width: 3; fill: none; }
.removed-rule { stroke: var(--removed); stroke-width: 3; fill: none; }
.removed-head { fill: var(--removed); }
.ink-head { fill: var(--ink); }
[hidden] { display: none; }
.fallback {
  margin: 0;
  padding: 18px;
  font-size: 16px;
  color: var(--removed);
}
</style>
</head>
<body>
<main class="shell" aria-labelledby="diagram-title">
  <h1 id="diagram-title">Что изменилось в RSP v3.0</h1>
  <svg id="diagram" width="1200" height="440" viewBox="0 0 1200 440"
       preserveAspectRatio="xMidYMid meet"
       role="img" aria-labelledby="svg-title svg-description">
    <title id="svg-title">Сравнение RSP 2023 и RSP v3.0</title>
    <desc id="svg-description">В новой редакции появились Roadmaps, Risk Reports и AI R&amp;D-4, но исчезло обязательство остановить обучение. Оценка SaferAI снизилась с 2,2 до 1,9 из 4.</desc>
  </svg>
  <p id="fallback" class="fallback" hidden>Схема должна была показать: в RSP v3.0 добавлены Frontier Safety Roadmaps, Risk Reports и AI R&amp;D-4, убрано обязательство остановить обучение, а оценка SaferAI снизилась с 2,2 до 1,9 из 4.</p>
</main>

<script>
const DATA = [{
  canvas: { x: 0, y: 0, w: 1200, h: 440 },
  frame: { x: 16, y: 10, w: 1168, h: 416, r: 12 },
  oldCard: { x: 38, y: 28, w: 300, h: 262, r: 10 },
  newCard: { x: 382, y: 28, w: 410, h: 262, r: 10 },
  splitCard: { x: 818, y: 28, w: 342, h: 262, r: 10 },
  scoreCard: { x: 38, y: 308, w: 1122, h: 100, r: 10 },
  oldStop: { x: 58, y: 130, w: 260, h: 108, r: 8 },
  removedBand: { x: 400, y: 250, w: 374, h: 28, r: 6 },
  rows: [
    { box: { x: 400, y: 88, w: 374, h: 45, r: 6 }, mark: { x: 418, y: 99 }, title: { x: 446, y: 96 }, note: { x: 446, y: 116 }, name: "Frontier Safety Roadmaps", detail: "планы усиления безопасности" },
    { box: { x: 400, y: 141, w: 374, h: 45, r: 6 }, mark: { x: 418, y: 152 }, title: { x: 446, y: 149 }, note: { x: 446, y: 169 }, name: "Risk Reports", detail: "отчёты о конкретных рисках" },
    { box: { x: 400, y: 194, w: 374, h: 45, r: 6 }, mark: { x: 418, y: 205 }, title: { x: 446, y: 202 }, note: { x: 446, y: 222 }, name: "AI R&D-4", detail: "ускорение разработки следующих систем" }
  ],
  dividers: [
    { x1: 838, y1: 91, x2: 1140, y2: 91 },
    { x1: 989, y1: 102, x2: 989, y2: 233 },
    { x1: 838, y1: 244, x2: 1140, y2: 244 }
  ],
  mainArrow: {
    line: { x1: 344, y1: 69, x2: 374, y2: 69 },
    head: [{ x: 374, y: 69 }, { x: 363, y: 62 }, { x: 363, y: 76 }]
  },
  removalArrow: {
    line: { x1: 318, y1: 264, x2: 374, y2: 264 },
    head: [{ x: 374, y: 264 }, { x: 363, y: 257 }, { x: 363, y: 271 }]
  },
  scoreArrow: {
    line: { x1: 490, y1: 359, x2: 662, y2: 359 },
    head: [{ x: 662, y: 359 }, { x: 648, y: 350 }, { x: 648, y: 368 }]
  },
  scoreOld: { x: 267, y: 339, w: 205, h: 39, r: 8 },
  scoreNew: { x: 680, y: 339, w: 205, h: 39, r: 8 },
  texts: [
    { x: 58, y: 47, value: "RSP 2023", cls: "heading" },
    { x: 58, y: 80, value: "Редакция с ограничителем действия", cls: "small muted" },
    { x: 78, y: 148, value: "ОБЯЗАТЕЛЬСТВО", cls: "label removed-text" },
    { x: 78, y: 180, value: "Остановить обучение", cls: "body removed-text" },
    { x: 78, y: 207, value: "при опасных условиях", cls: "body removed-text" },
    { x: 188, y: 251, value: "реальное условие остановки", cls: "small muted", anchor: "middle" },

    { x: 402, y: 47, value: "RSP v3.0", cls: "heading" },
    { x: 402, y: 72, value: "ДОБАВЛЕНО", cls: "label added-text" },
    { x: 587, y: 256, value: "Правило «остановить обучение» — убрано", cls: "small removed-text", anchor: "middle" },

    { x: 838, y: 47, value: "Меры защиты в v3.0", cls: "heading" },
    { x: 838, y: 73, value: "Формулировки разделены по силе", cls: "small muted" },
    { x: 913, y: 111, value: "ОБЯЗУЕТСЯ", cls: "label added-text", anchor: "middle" },
    { x: 913, y: 145, value: "Anthropic", cls: "body", anchor: "middle" },
    { x: 913, y: 170, value: "делает сама", cls: "body", anchor: "middle" },
    { x: 1065, y: 111, value: "РЕКОМЕНДУЕТ", cls: "label warning-text", anchor: "middle" },
    { x: 1065, y: 145, value: "всей", cls: "body", anchor: "middle" },
    { x: 1065, y: 170, value: "индустрии", cls: "body", anchor: "middle" },
    { x: 989, y: 252, value: "Рекомендация другим ≠ своё обязательство", cls: "small warning-text", anchor: "middle" },
    { x: 989, y: 272, value: "Больше формулировок не значит строже", cls: "small muted", anchor: "middle" },

    { x: 62, y: 327, value: "Оценка SaferAI", cls: "heading" },
    { x: 369, y: 347, value: "v2: 2,2 из 4", cls: "score-text", anchor: "middle" },
    { x: 576, y: 324, value: "оценка ниже", cls: "small removed-text", anchor: "middle" },
    { x: 782, y: 347, value: "v3.0: 1,9 из 4", cls: "score-text removed-text", anchor: "middle" },
    { x: 1020, y: 342, value: "−0,3", cls: "delta", anchor: "middle" },
    { x: 1020, y: 374, value: "балла", cls: "small removed-text", anchor: "middle" },
    { x: 576, y: 387, value: "Подробнее — не обязательно строже", cls: "small muted", anchor: "middle" }
  ]
}];

const ORIGIN = { x: 0, y: 0 };
const SCALE = { x: 1, y: 1 };

function sx(x) { return ORIGIN.x + x * SCALE.x; }
function sy(y) { return ORIGIN.y + y * SCALE.y; }

try {
  const [{ canvas, frame, oldCard, newCard, splitCard, scoreCard, oldStop,
    removedBand, rows, dividers, mainArrow, removalArrow, scoreArrow,
    scoreOld, scoreNew, texts }] = DATA;

  const svg = document.getElementById("diagram");
  const namespace = "http://www.w3.org/2000/svg";

  function make(tag, attributes, content) {
    const element = document.createElementNS(namespace, tag);
    for (const [name, value] of Object.entries(attributes)) {
      element.setAttribute(name, value);
    }
    if (content !== undefined) element.textContent = content;
    svg.appendChild(element);
    return element;
  }

  function rectangle(spec, cls) {
    return make("rect", {
      x: sx(spec.x),
      y: sy(spec.y),
      width: sx(spec.w) - sx(0),
      height: sy(spec.h) - sy(0),
      rx: sx(spec.r) - sx(0),
      ry: sy(spec.r) - sy(0),
      class: cls
    });
  }

  function line(spec, cls) {
    return make("line", {
      x1: sx(spec.x1),
      y1: sy(spec.y1),
      x2: sx(spec.x2),
      y2: sy(spec.y2),
      class: cls
    });
  }

  function polygon(points, cls) {
    return make("polygon", {
      points: points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" "),
      class: cls
    });
  }

  function label(spec) {
    return make("text", {
      x: sx(spec.x),
      y: sy(spec.y),
      class: spec.cls,
      "text-anchor": spec.anchor || "start"
    }, spec.value);
  }

  rectangle(canvas, "frame");
  rectangle(frame, "frame");
  rectangle(oldCard, "panel");
  rectangle(newCard, "panel");
  rectangle(splitCard, "panel");
  rectangle(scoreCard, "soft-panel");
  rectangle(oldStop, "removed-panel");
  rectangle(removedBand, "removed-panel");

  for (const row of rows) {
    rectangle(row.box, "added-panel");
    label({ x: row.mark.x, y: row.mark.y, value: "+", cls: "heading added-text", anchor: "middle" });
    label({ x: row.title.x, y: row.title.y, value: row.name, cls: "body added-text" });
    label({ x: row.note.x, y: row.note.y, value: row.detail, cls: "small muted" });
  }

  for (const divider of dividers) line(divider, "rule");

  line(mainArrow.line, "rule");
  polygon(mainArrow.head, "ink-head");
  line(removalArrow.line, "removed-rule");
  polygon(removalArrow.head, "removed-head");

  rectangle(scoreOld, "panel");
  rectangle(scoreNew, "removed-panel");
  line(scoreArrow.line, "removed-rule");
  polygon(scoreArrow.head, "removed-head");

  for (const text of texts) label(text);
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
