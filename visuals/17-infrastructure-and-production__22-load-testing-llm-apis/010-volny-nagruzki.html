<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Четыре формы нагрузки на одной временной шкале</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5b6578;
      --guide: #cbd3df;
      --axis: #667085;
      --steady: #2474d2;
      --ramp: #159570;
      --spike: #db493d;
      --soak: #7656c9;
      --range: #dbe9fb;
      --range-soak: #e8e0fa;
      --note: #eef2f7;
      --error: #9b1c1c;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111620;
        --panel: #171e2b;
        --text: #edf2f8;
        --muted: #aab5c5;
        --guide: #394456;
        --axis: #8e9aad;
        --steady: #69aaf4;
        --ramp: #51c9a2;
        --spike: #ff7c70;
        --soak: #ab91ef;
        --range: #243e5d;
        --range-soak: #372d55;
        --note: #202a39;
        --error: #ffaaa3;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--panel);
      border: 1px solid var(--guide);
      padding: 12px;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
    }

    .axis,
    .tick {
      stroke: var(--axis);
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .duration-steady {
      stroke: var(--range);
      stroke-width: 14;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .duration-soak {
      stroke: var(--range-soak);
      stroke-width: 14;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .steady,
    .ramp,
    .spike,
    .soak {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .steady {
      stroke: var(--steady);
    }

    .ramp {
      stroke: var(--ramp);
    }

    .spike {
      stroke: var(--spike);
    }

    .soak {
      stroke: var(--soak);
    }

    .steady-mark,
    .ramp-mark,
    .spike-mark,
    .soak-mark {
      fill: var(--panel);
      stroke-width: 3;
      vector-effect: non-scaling-stroke;
    }

    .steady-mark {
      stroke: var(--steady);
    }

    .ramp-mark {
      stroke: var(--ramp);
    }

    .spike-mark {
      stroke: var(--spike);
    }

    .soak-mark {
      stroke: var(--soak);
    }

    .leader {
      fill: none;
      stroke: var(--muted);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .label {
      fill: var(--text);
      font-size: 16px;
      font-weight: 650;
    }

    .annotation {
      fill: var(--text);
      font-size: 15px;
      font-weight: 600;
    }

    .small {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .time-label {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .error {
      margin: 12px;
      padding: 12px;
      background: var(--note);
      color: var(--error);
      font-size: 16px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-heading">
    <h2 id="diagram-heading">Четыре формы нагрузки на одной временной шкале</h2>
    <svg id="load-diagram"
         viewBox="0 0 1200 460"
         width="1200"
         height="460"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-description">
      <title id="svg-title">Четыре графика RPS на общей шкале от нуля до восьми часов</title>
      <desc id="svg-description">Ровная нагрузка длится 30–60 минут, плавный набор достигает цели за 15 минут, всплеск увеличивает RPS в 3–10 раз на 2 минуты, длительная нагрузка продолжается 4–8 часов.</desc>
    </svg>
  </figure>

  <script>
    const data = Object.freeze({
      canvas: { width: 1200, height: 460 },
      timeline: { start: 0, end: 8 },
      labelPad: 12,
      cap: 6,
      markRadius: 5,
      rows: [
        {
          key: "steady",
          name: "РОВНАЯ НАГРУЗКА",
          baseline: 320,
          level: 350,
          duration: [0.5, 1],
          points: [
            { x: 0, y: 350 },
            { x: 1, y: 350 }
          ],
          annotation: "30–60 минут"
        },
        {
          key: "ramp",
          name: "ПЛАВНЫЙ НАБОР",
          baseline: 235,
          level: 275,
          duration: 0.25,
          points: [
            { x: 0, y: 235 },
            { x: 0.25, y: 275 }
          ],
          annotation: "0 → цель за 15 минут"
        },
        {
          key: "spike",
          name: "РЕЗКИЙ ВСПЛЕСК",
          baseline: 150,
          normal: 164,
          peak: 212,
          riseAt: 0.65,
          hold: 0.03333333333333333,
          endAt: 1.2,
          annotation: "×3–10 • 2 минуты"
        },
        {
          key: "soak",
          name: "ДЛИТЕЛЬНАЯ НАГРУЗКА",
          baseline: 65,
          level: 95,
          duration: [4, 8],
          points: [
            { x: 0, y: 95 },
            { x: 8, y: 95 }
          ],
          annotation: "4–8 часов"
        }
      ],
      ticks: [
        { x: 0, label: "0", anchor: "start" },
        { x: 4, label: "4 ч", anchor: "middle" },
        { x: 8, label: "8 ч", anchor: "end" }
      ],
      grid: [4, 8],
      anchors: {
        rps: { x: -1.44, y: 365 },
        timelineTitle: { x: 4, y: -28 },
        steadyText: { x: 0.75, y: 365 },
        steadyBracket: 333,
        rampText: { x: 0.25, y: 275 },
        spikeText: { x: 1.03, y: 212 },
        spikeLeaderEnd: { x: 0.96, y: 212 },
        soakText: { x: 6, y: 110 },
        soakBracket: 78,
        labelX: -0.18,
        guideEnd: 8
      }
    });

    const origin = Object.freeze({ x: 202, y: 414 });
    const scale = Object.freeze({ x: 118, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    const SVG_NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("load-diagram");

    function make(tag, attributes, content) {
      const element = document.createElementNS(SVG_NS, tag);
      for (const [name, value] of Object.entries(attributes)) {
        element.setAttribute(name, String(value));
      }
      if (content !== undefined) {
        element.textContent = content;
      }
      return element;
    }

    function addLine(parent, x1, y1, x2, y2, className) {
      const element = make("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      });
      parent.appendChild(element);
      return element;
    }

    function addPolyline(parent, points, className) {
      const mapped = points
        .map(point => `${sx(point.x)},${sy(point.y)}`)
        .join(" ");
      const element = make("polyline", {
        points: mapped,
        class: className
      });
      parent.appendChild(element);
      return element;
    }

    function addCircle(parent, x, y, radius, className) {
      const element = make("circle", {
        cx: sx(x),
        cy: sy(y),
        r: radius,
        class: className
      });
      parent.appendChild(element);
      return element;
    }

    function addText(parent, x, y, value, options = {}) {
      const attributes = {
        x: sx(x),
        y: sy(y),
        class: options.className || "annotation",
        "text-anchor": options.anchor || "middle",
        "dominant-baseline": options.baseline || "middle"
      };
      if (options.dx !== undefined) {
        attributes.dx = options.dx;
      }
      if (options.dy !== undefined) {
        attributes.dy = options.dy;
      }
      const element = make("text", attributes, value);
      parent.appendChild(element);
      return element;
    }

    function addBracket(parent, start, end, y, className) {
      addLine(parent, start, y, end, y, className);
      addLine(parent, start, y - data.cap, start, y + data.cap, className);
      addLine(parent, end, y - data.cap, end, y + data.cap, className);
    }

    function drawAxis(parent) {
      addLine(
        parent,
        data.timeline.start,
        data.timeline.start,
        data.timeline.end,
        data.timeline.start,
        "axis"
      );

      for (const x of data.grid) {
        addLine(parent, x, data.timeline.start, x, 355, "guide");
      }

      for (const tick of data.ticks) {
        addLine(
          parent,
          tick.x,
          data.timeline.start,
          tick.x,
          data.timeline.start + data.cap,
          "tick"
        );
        addText(
          parent,
          tick.x,
          data.timeline.start,
          tick.label,
          {
            className: "time-label",
            anchor: tick.anchor,
            baseline: "hanging",
            dy: data.labelPad
          }
        );
      }

      addText(
        parent,
        data.anchors.timelineTitle.x,
        data.anchors.timelineTitle.y,
        "ОБЩАЯ ВРЕМЕННАЯ ШКАЛА",
        { className: "small" }
      );

      addText(
        parent,
        data.anchors.rps.x,
        data.anchors.rps.y,
        "RPS ↑",
        {
          className: "time-label",
          anchor: "start"
        }
      );
    }

    function drawGuides(parent) {
      for (const row of data.rows) {
        addLine(
          parent,
          data.timeline.start,
          row.baseline,
          data.anchors.guideEnd,
          row.baseline,
          "guide"
        );
        addText(
          parent,
          data.anchors.labelX,
          row.level || row.normal,
          row.name,
          {
            className: "label",
            anchor: "end",
            dx: -data.labelPad
          }
        );
      }
    }

    function drawSteady(parent, row) {
      const [rangeStart, rangeEnd] = row.duration;
      addLine(
        parent,
        rangeStart,
        row.level,
        rangeEnd,
        row.level,
        "duration-steady"
      );
      addPolyline(parent, row.points, "steady");
      addCircle(
        parent,
        data.timeline.start,
        row.level,
        data.markRadius,
        "steady-mark"
      );
      addCircle(
        parent,
        rangeEnd,
        row.level,
        data.markRadius,
        "steady-mark"
      );
      addBracket(
        parent,
        rangeStart,
        rangeEnd,
        data.anchors.steadyBracket,
        "leader"
      );
      addText(
        parent,
        data.anchors.steadyText.x,
        data.anchors.steadyText.y,
        row.annotation,
        {
          className: "annotation",
          baseline: "auto"
        }
      );
    }

    function drawRamp(parent, row) {
      addPolyline(parent, row.points, "ramp");
      addCircle(
        parent,
        data.timeline.start,
        row.baseline,
        data.markRadius,
        "ramp-mark"
      );
      addCircle(
        parent,
        row.duration,
        row.level,
        data.markRadius,
        "ramp-mark"
      );
      addText(
        parent,
        data.anchors.rampText.x,
        data.anchors.rampText.y,
        row.annotation,
        {
          className: "annotation",
          anchor: "start",
          baseline: "auto",
          dx: data.labelPad,
          dy: -data.labelPad
        }
      );
    }

    function drawSpike(parent, row) {
      const fallAt = row.riseAt + row.hold;
      const points = [
        { x: data.timeline.start, y: row.normal },
        { x: row.riseAt, y: row.normal },
        { x: row.riseAt, y: row.peak },
        { x: fallAt, y: row.peak },
        { x: fallAt, y: row.normal },
        { x: row.endAt, y: row.normal }
      ];

      addPolyline(parent, points, "spike");
      addCircle(
        parent,
        row.riseAt + row.hold / 2,
        row.peak,
        data.markRadius,
        "spike-mark"
      );
      addLine(
        parent,
        fallAt,
        row.peak,
        data.anchors.spikeLeaderEnd.x,
        data.anchors.spikeLeaderEnd.y,
        "leader"
      );
      addText(
        parent,
        data.anchors.spikeText.x,
        data.anchors.spikeText.y,
        row.annotation,
        {
          className: "annotation",
          anchor: "start",
          dx: data.labelPad
        }
      );
    }

    function drawSoak(parent, row) {
      const [rangeStart, rangeEnd] = row.duration;
      addLine(
        parent,
        rangeStart,
        row.level,
        rangeEnd,
        row.level,
        "duration-soak"
      );
      addPolyline(parent, row.points, "soak");
      addCircle(
        parent,
        data.timeline.start,
        row.level,
        data.markRadius,
        "soak-mark"
      );
      addCircle(
        parent,
        rangeEnd,
        row.level,
        data.markRadius,
        "soak-mark"
      );
      addBracket(
        parent,
        rangeStart,
        rangeEnd,
        data.anchors.soakBracket,
        "leader"
      );
      addText(
        parent,
        data.anchors.soakText.x,
        data.anchors.soakText.y,
        row.annotation,
        {
          className: "annotation"
        }
      );
    }

    function buildDiagram() {
      const layer = make("g", { "aria-hidden": "true" });
      drawGuides(layer);

      for (const row of data.rows) {
        if (row.key === "steady") drawSteady(layer, row);
        if (row.key === "ramp") drawRamp(layer, row);
        if (row.key === "spike") drawSpike(layer, row);
        if (row.key === "soak") drawSoak(layer, row);
      }

      drawAxis(layer);
      svg.appendChild(layer);
    }

    try {
      buildDiagram();
    } catch (error) {
      const fallback = document.createElement("p");
      fallback.className = "error";
      fallback.textContent =
        "Схема должна показывать четыре графика RPS на общей временной шкале: ровную нагрузку на 30–60 минут, набор от нуля до цели за 15 минут, всплеск в 3–10 раз на 2 минуты и длительную нагрузку на 4–8 часов.";
      svg.replaceWith(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
