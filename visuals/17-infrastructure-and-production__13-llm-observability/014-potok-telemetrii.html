  <title>Один поток спанов для шлюза, оценок и анализа</title>
  <style>

      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;

      --muted: #59657a;
      --line: #4b607d;
      --flow: #2868d8;

      --span-fill: #e5f6f2;
      --span-accent: #087f69;
      --gateway-fill: #fff3d8;
      --gateway-accent: #c76a00;
      --eval-fill: #f1eaff;
      --eval-accent: #7650c7;
      --lake-fill: #e8f4ff;
      --lake-accent: #1673a8;
      --chip-fill: #ffffff;
      --chip-line: #9ba8ba;
      --note-fill: #edf1f6;
      --frame: #c7d0dd;
      --error: #9d2f2f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #10151f;
        --panel: #151c28;
        --ink: #eef3fb;
        --muted: #b1bdd0;
        --line: #91a2bb;
        --flow: #76a8ff;
        --source-fill: #1d2a43;
        --span-fill: #153830;
        --span-accent: #57d4b7;
        --gateway-fill: #3c2c15;
        --gateway-accent: #ffb655;
        --eval-fill: #302542;
        --eval-accent: #bc9bff;
        --lake-fill: #173246;
        --lake-accent: #68c6f4;
        --chip-fill: #1b2432;
        --chip-line: #617087;
        --note-fill: #202a39;
        --frame: #405069;
        --error: #ff9a9a;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      background: var(--page);
    }

    h1 {
      color: var(--ink);
      font-size: 21px;
      line-height: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
      border: 1px solid var(--frame);
    }

    svg text {
      fill: var(--ink);
      user-select: none;
    }

    .card {
      stroke: var(--line);
      fill: var(--panel);
    }

    .source-card {
      fill: var(--source-fill);
    }

    .span-card {
      fill: var(--span-fill);
      stroke: var(--span-accent);
    }

    .gateway-card {
      fill: var(--gateway-fill);
    }

    .eval-card {
      fill: var(--eval-fill);
    }

    .lake-card {
      fill: var(--lake-fill);
    }

    .gateway-accent {
      fill: var(--gateway-accent);
    }

    .eval-accent {
      fill: var(--eval-accent);
    }

    .lake-accent {
      fill: var(--lake-accent);
    }

    .hub {
      fill: var(--flow);
      stroke: var(--flow);
    }

    .chip {
      fill: var(--chip-fill);
      stroke: var(--chip-line);
    }

    .note {
      fill: var(--note-fill);
      stroke: var(--frame);
    }

    .flow {
      fill: none;
      stroke: var(--flow);
      stroke-linecap: square;
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }

    .arrow {
      fill: var(--flow);
      stroke: var(--flow);
      stroke-linejoin: miter;
      vector-effect: non-scaling-stroke;
    }

    .eyebrow {
      fill: var(--muted);
      font-weight: bold;
    }

    .heading {
      font-weight: bold;
    }

    .detail {
      fill: var(--muted);
    }

    .field {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .flow-label {
      fill: var(--flow);
      font-weight: bold;
    }

    .note-label {
      fill: var(--muted);
    }

    #fallback {
      color: var(--error);
      font-size: 16px;
    }

    noscript {
      color: var(--error);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-title">Один OTel GenAI-спан — несколько независимых читателей</h1>

    <svg id="diagram"
         viewBox="0 0 1200 430"
         width="1200"
         height="430"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="diagram-title diagram-description">
      <desc id="diagram-description">
        LLM-вызов создаёт один спан OpenTelemetry GenAI. Копии одного потока
        независимо поступают в шлюз, платформу оценки и долговременное хранилище.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать: один LLM-вызов выпускает один OTel GenAI-спан,
      а его копии независимо читают шлюз, платформа оценки и data lake.
    </p>

    <noscript>
      Схема: один LLM-вызов создаёт один OTel GenAI-спан; копии спана поступают
      в Helicone или Portkey, Phoenix или Langfuse и Iceberg для анализа через
      Arize AX или DuckDB.
    </noscript>
  </main>

        font: "body",
        value: "исследование через месяцы"
      },

      {
        kind: "text",
        className: "note-label",
        at: [600, 411],
        offset: [0, 0],
        anchor: "middle",
        font: "note",
        value: "Назначения независимы: отказ аналитики не останавливает ответ пользователю"
      }
    ];

    const [config, ...items] = data;
    const origin = Object.freeze(config.origin);
    const scale = Object.freeze(config.scale);

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    const namespace = "http://www.w3.org/2000/svg";

    try {
      const make = name => document.createElementNS(namespace, name);

      const setLineStyle = element => {
        element.setAttribute("stroke-width", String(config.strokeWidth));
      };

      const renderRect = item => {
        const [xStart, yStart, xEnd, yEnd] = item.box;
        const element = make("rect");
        element.setAttribute("x", String(sx(xStart)));
        element.setAttribute("y", String(sy(yStart)));
        element.setAttribute("width", String(sx(xEnd) - sx(xStart)));
        element.setAttribute("height", String(sy(yEnd) - sy(yStart)));
        element.setAttribute("class", item.className);
        element.setAttribute("stroke-width", String(config.fineWidth));
        svg.appendChild(element);
      };

      const renderLine = item => {
        const element = make("polyline");
        element.setAttribute(
          "points",
          item.points.map(point => {
            const [x, y] = point;
            return `${sx(x)},${sy(y)}`;
          }).join(" ")
        );
        element.setAttribute("class", item.className);
        setLineStyle(element);
        svg.appendChild(element);
      };

      const renderPolygon = item => {
        const element = make("polygon");
        element.setAttribute(
          "points",
          item.points.map(point => {
            const [x, y] = point;
            return `${sx(x)},${sy(y)}`;
          }).join(" ")
        );
        element.setAttribute("class", item.className);
        element.setAttribute("stroke-width", String(config.fineWidth));
        svg.appendChild(element);
      };

      const renderText = item => {
        const [x, y] = item.at;
        const [dx, dy] = item.offset;
        const element = make("text");
        element.setAttribute("x", String(sx(x)));
        element.setAttribute("y", String(sy(y)));
        element.setAttribute("dx", String(dx));
        element.setAttribute("dy", String(dy));
        element.setAttribute("text-anchor", item.anchor);
        element.setAttribute("class", item.className);
        element.setAttribute("font-size", String(config.font[item.font]));
        element.textContent = item.value;
        svg.appendChild(element);
      };

      items.filter(item => item.kind === "rect").forEach(renderRect);
      items.filter(item => item.kind === "line").forEach(renderLine);
      items.filter(item => item.kind === "polygon").forEach(renderPolygon);
      items.filter(item => item.kind === "text").forEach(renderText);
    } catch (error) {
      svg.replaceChildren();
      svg.hidden = true;
      fallback.hidden = false;
    }

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
