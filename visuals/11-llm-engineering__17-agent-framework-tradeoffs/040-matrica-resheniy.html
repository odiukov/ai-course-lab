<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Матрица решений по форме задачи</title>
<style>
  :root{
    --bg:#fbfaf8; --fg:#1c2431; --muted:#5c6a7d; --line:#c7d1de;
    --panel:#ffffff; --head:#eaf0f8; --accent:#1f6feb; --dash:#8a7233; --proto:#f7f1e0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#11151b; --fg:#e6ecf3; --muted:#9db0c4; --line:#2e3947;
      --panel:#1a2027; --head:#212b37; --accent:#7ab0ff; --dash:#c8ae63; --proto:#241f13;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  figure{margin:0;padding:10px 12px}
  figcaption{font-weight:600;margin:0 0 6px}
  svg{display:block;width:100%;height:auto;max-height:470px;background:var(--bg)}
  #fb{color:var(--muted);font-size:13px}
  #fb:empty{display:none}
</style>
<figure>
  <figcaption>Матрица по форме задачи: вход — то, что у тебя на руках</figcaption>
  <svg id="s" viewBox="0 0 940 452" role="img"
       aria-label="Шесть строк: форма задачи и подходящий фреймворк"></svg>
  <div id="fb"></div>
</figure>
<script>
(function(){
  var svg=document.getElementById("s"), fb=document.getElementById("fb");

  /* ---- данные схемы ---- */
  var ROWS=[
    {shape:["Процесс-DAG: типизированное состояние,","согласования человека, долгая жизнь"],
     fw:["LangGraph"]},
    {shape:["Конвейер с явными ролями:","исследование или текст"],
     fw:["CrewAI (sequential),","дальше — подграфы LangGraph"]},
    {shape:["Диалог «предлагающий — критик»","или «учитель — ученик»"],
     fw:["AutoGen"]},
    {shape:["Одиночный агент:","инструменты, сессии, память"],
     fw:["Agno"]},
    {shape:["Тысячи параллельных ответвлений,","результаты сводятся вместе"],
     fw:["LangGraph + Send"]},
    {shape:["Быстрый прототип","без привязки к фреймворку"],
     fw:["обычный Python","+ SDK провайдера"], proto:true}
  ];
  var HEAD=["Форма задачи","Фреймворк"];

  /* ---- одна система координат ---- */
  var origin={x:26,y:20}, scale=55;
  function sx(x){return origin.x+x*scale;}
  function sy(y){return origin.y+y*scale;}

  /* сетка в единицах: колонка 1 — x 0..9.1, колонка 2 — x 9.8..16.0,
     шапка — y 0..1, строка i — y 1+i..2+i, подвал — y 7.4 */
  var C1=[0,9.1], C2=[9.8,16.0], NS=1.6/*px: половина зазора строк*/;
  var GAP=17, FS_H=14, FS_S=13, FS_F=14, FS_L=12, SW=1.2, PAD=0.22;

  function el(n,a){var e=document.createElementNS("http://www.w3.org/2000/svg",n);
    for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}

  function box(x0,x1,y0,y1,fill,dash){
    el("rect",{x:sx(x0),y:sy(y0),width:sx(x1)-sx(x0),height:sy(y1)-sy(y0),
      fill:fill,stroke:"var(--line)","stroke-width":SW,
      "stroke-dasharray":dash?"5 4":"none",rx:4});
  }
  /* подписи: якорь start у левой кромки колонки, блок строк центрован по строке */
  function lines(arr,x,cy,size,color,weight){
    var top=sy(cy)+size*0.35-(arr.length-1)*GAP/2;
    for(var i=0;i<arr.length;i++)
      el("text",{x:sx(x),y:top+i*GAP,"text-anchor":"start","font-size":size,
        "font-weight":weight||"400",fill:color}).textContent=arr[i];
  }

  try{
    /* шапка */
    box(C1[0],C1[1],0,1,"var(--head)");
    box(C2[0],C2[1],0,1,"var(--head)");
    lines([HEAD[0]],C1[0]+PAD,0.5,FS_H,"var(--muted)","600");
    lines([HEAD[1]],C2[0]+PAD,0.5,FS_H,"var(--muted)","600");

    ROWS.forEach(function(r,i){
      var y0=1+i, y1=2+i, cy=y0+0.5;
      var fill=r.proto?"var(--proto)":"var(--panel)";
      /* зазор между строками — пиксельный, не координатный сдвиг */
      el("rect",{x:sx(C1[0]),y:sy(y0)+NS,width:sx(C1[1])-sx(C1[0]),
        height:sy(y1)-sy(y0)-2*NS,fill:fill,stroke:"var(--line)",
        "stroke-width":SW,"stroke-dasharray":r.proto?"5 4":"none",rx:4});
      el("rect",{x:sx(C2[0]),y:sy(y0)+NS,width:sx(C2[1])-sx(C2[0]),
        height:sy(y1)-sy(y0)-2*NS,fill:fill,stroke:"var(--line)",
        "stroke-width":SW,"stroke-dasharray":r.proto?"5 4":"none",rx:4});

      lines(r.shape,C1[0]+PAD,cy,FS_S,"var(--fg)");
      lines(r.fw,C2[0]+PAD,cy,FS_F,r.proto?"var(--dash)":"var(--accent)","600");

      /* стрелка «форма садится в строку»: хвост у колонки 1, наконечник у колонки 2 */
      var tail=C1[1]+0.08, tip=C2[0]-0.06, back=tip-0.2, w=0.055;
      el("line",{x1:sx(tail),y1:sy(cy),x2:sx(back),y2:sy(cy),
        stroke:"var(--muted)","stroke-width":SW});
      el("polygon",{points:[sx(tip),sy(cy),sx(back),sy(cy-w),sx(back),sy(cy+w)].join(" "),
        fill:"var(--muted)"});
    });

    /* подвал: одна строка легенды, якорь start у левой кромки */
    lines(["Прикладывай задачу к строкам, пока какая-нибудь не сядет без зазора."+
           " Не села ни одна — это тоже ответ: шестая строка."],
          C1[0]+PAD,7.35,FS_L,"var(--muted)");
  }catch(e){
    svg.textContent="";
    fb.textContent="Схема должна показывать шесть строк «форма задачи — фреймворк»: "+
      "DAG с согласованиями — LangGraph; роли — CrewAI sequential; "+
      "диалог предлагающий—критик — AutoGen; одиночный агент — Agno; "+
      "тысячи ответвлений — LangGraph + Send; прототип — голый SDK провайдера.";
  }
})();
</script>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
