<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Четыре рисунка одной задачи</title>
<style>
:root{--bg:#fdfcf9;--paper:#fffdf6;--ink:#23262b;--muted:#6d7176;--accent:#b4531f}
@media (prefers-color-scheme:dark){:root{--bg:#15171b;--paper:#1c1f25;--ink:#e7e9ec;--muted:#99a0a7;--accent:#e2a374}}
html,body{margin:0;background:var(--bg)}
.wrap{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:10px 12px}
h2{font-size:15px;margin:0 0 6px;font-weight:600}
svg{display:block;width:100%;height:auto;max-height:520px}
.napkin{fill:var(--paper);stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4}
.shape{fill:none;stroke:var(--ink);stroke-width:1.6}
.dash{stroke-dasharray:4 3}
.arr{stroke:var(--accent);stroke-width:1.6}
.head{fill:var(--accent);stroke:none}
text{fill:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.t-title{font-size:13px;font-weight:600}
.t-lab,.t-in{font-size:10.5px}
.t-model{font-size:11px;font-style:italic;fill:var(--muted)}
.t-leg{font-size:11px;fill:var(--muted)}
#fail{display:none;font-size:13px;color:var(--ink);white-space:pre-line}
</style>
</head>
<body>
<div class="wrap">
<h2>Четыре салфетки: задача одна, рисунка четыре</h2>
<svg id="fig" viewBox="0 0 1000 324" preserveAspectRatio="xMidYMid meet" role="img"
     aria-label="Четыре салфетки: LangGraph — прямоугольники со стрелками, CrewAI — человечки с должностями, AutoGen — реплики в столбик, Agno — коробка с инструментами"></svg>
<div id="fail"></div>
</div>
<script>
(function(){
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("fig");

/* ---- данные схемы ---- */
const DATA={
  panel:{w:23,top:3.6,bottom:26,titleY:2.4,modelY:28.6},
  legendY:31.4,
  legend:"Стрелки · человечки · реплики · коробка — это и есть главная абстракция фреймворка",
  panels:[
    {x:1,   title:"LangGraph", model:"конечный автомат",      kind:"graph"},
    {x:25.5,title:"CrewAI",    model:"команда специалистов",  kind:"crew"},
    {x:50,  title:"AutoGen",   model:"чат",                   kind:"chat"},
    {x:74.5,title:"Agno",      model:"всё нужное внутри",     kind:"agno"}
  ]
};

/* ---- один origin, один scale, одна пара sx/sy ---- */
const ORIGIN={x:0,y:0};
const SCALE=10;
const sx=u=>ORIGIN.x+u*SCALE;
const sy=u=>ORIGIN.y+u*SCALE;
const d=u=>sx(u)-sx(0);            /* длина той же парой */

/* ---- примитивы ---- */
function add(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,String(a[k]));svg.appendChild(e);return e;}
function rect(x,y,w,h,cls,r){return add("rect",{x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),rx:d(r||0),class:cls});}
function seg(x1,y1,x2,y2,cls){return add("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:cls});}
function dot(x,y,r,cls){return add("circle",{cx:sx(x),cy:sy(y),r:d(r),class:cls});}
function txt(x,y,s,anchor,dy,cls){const t=add("text",{x:sx(x),y:sy(y),dy:dy,"text-anchor":anchor,class:cls});t.textContent=s;return t;}
function arrow(x1,y1,x2,y2){
  const vx=x2-x1,vy=y2-y1,L=Math.hypot(vx,vy),ux=vx/L,uy=vy/L,hl=0.85,hw=0.42;
  const bx=x2-ux*hl,by=y2-uy*hl;
  seg(x1,y1,bx,by,"arr");
  add("polygon",{class:"head",points:[[x2,y2],[bx-uy*hw,by+ux*hw],[bx+uy*hw,by-ux*hw]]
    .map(p=>sx(p[0])+","+sy(p[1])).join(" ")});
}

/* ---- салфетка 1: граф ---- */
function graph(p){
  const cx=p.x+p.w/2;
  [5.6,12.8,20].forEach(function(y){
    rect(cx-5.5,y,11,3.4,"shape",0.6);
    txt(cx,y+1.7,"шаг","middle",4,"t-in");
  });
  arrow(cx,9.2,cx,12.6);
  arrow(cx,16.4,cx,19.8);
  txt(cx+0.9,11,"переход","start",0,"t-lab");
  txt(cx+0.9,18.2,"состояние","start",0,"t-lab");
}

/* ---- салфетка 2: оргструктура ---- */
function stick(cx,hy){
  dot(cx,hy,1,"shape");
  seg(cx,hy+1,cx,hy+4,"shape");
  seg(cx-1.7,hy+2,cx+1.7,hy+2,"shape");
  seg(cx,hy+4,cx-1.4,hy+5.8,"shape");
  seg(cx,hy+4,cx+1.4,hy+5.8,"shape");
}
function crew(p){
  const cx=p.x+p.w/2;
  stick(cx,6.2);
  txt(cx,12,"менеджер","middle",14,"t-lab");
  arrow(cx-2,14.6,cx-5.2,16.3);
  arrow(cx+2,14.6,cx+5.2,16.3);
  stick(cx-6,17.4); stick(cx+6,17.4);
  txt(cx-6,23.2,"исследователь","middle",13,"t-lab");
  txt(cx+6,23.2,"редактор","middle",13,"t-lab");
}

/* ---- салфетка 3: реплики в столбик ---- */
function chat(p){
  const bw=8.2,L=p.x+2.2,R=p.x+12.6;
  txt(L+bw/2,5.4,"агент А","middle",0,"t-lab");
  txt(R+bw/2,5.4,"агент Б","middle",0,"t-lab");
  rect(L,6.4,bw,2.6,"shape",0.7);
  rect(R,10.6,bw,2.6,"shape",0.7);
  rect(L,14.8,bw,2.6,"shape",0.7);
  arrow(L+bw,8,R,10.9);
  arrow(R,12.6,L+bw,15.4);
  arrow(L+bw/2,17.4,p.x+9,19.6);
  rect(p.x+6.5,19.8,10,3,"shape",0.7);
  txt(p.x+11.5,21.3,"модератор","middle",4,"t-in");
}

/* ---- салфетка 4: коробка с крючками ---- */
function agno(p){
  const bx=p.x+2.2,by=8.2,bw=10,bh=8;
  rect(bx,by,bw,bh,"shape",0.7);
  txt(bx+bw/2,by+bh/2,"агент","middle",4,"t-in");
  [2,5,8].forEach(function(o){
    seg(bx+o,by+bh,bx+o,by+bh+1.6,"shape");
    dot(bx+o,by+bh+1.9,0.35,"head");
  });
  txt(bx+bw/2,by+bh+1.9,"инструменты","middle",14,"t-lab");
  const x2=p.x+14.6,w2=6.4;
  rect(x2,by+1,w2,bh-2,"shape dash",0.7);
  txt(x2+w2/2,by+1,"ещё один","middle",-6,"t-lab");
  txt(x2+w2/2,by+bh-1,"= команда","middle",16,"t-lab");
}

const KIND={graph:graph,crew:crew,chat:chat,agno:agno};

try{
  const P=DATA.panel;
  DATA.panels.forEach(function(p){
    p.w=P.w;
    rect(p.x,P.top,P.w,P.bottom-P.top,"napkin",0.8);
    txt(p.x+P.w/2,P.titleY,p.title,"middle",0,"t-title");
    txt(p.x+P.w/2,P.modelY,p.model,"middle",0,"t-model");
    KIND[p.kind](p);
  });
  txt(DATA.panels[0].x+(DATA.panels[3].x+P.w-DATA.panels[0].x)/2,
      DATA.legendY,DATA.legend,"middle",0,"t-leg");
}catch(e){
  svg.style.display="none";
  const f=document.getElementById("fail");
  f.style.display="block";
  f.textContent=
   "Схема не построилась. Она должна была показать четыре салфетки в ряд:\n"+
   "LangGraph — три прямоугольника «шаг», соединённые стрелками «переход», состояние в каждой точке; мысленно конечный автомат.\n"+
   "CrewAI — человечки с подписями «менеджер», «исследователь», «редактор», стрелки задач сверху вниз; мысленно команда специалистов.\n"+
   "AutoGen — две колонки реплик «агент А» и «агент Б», стрелки туда-обратно, внизу «модератор»; мысленно чат.\n"+
   "Agno — одна коробка «агент» с крючками-инструментами, рядом вторая коробка: = команда.";
}
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
