<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три семейства моделей будущего</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f8fafc;
      --ink: #172033;
      --muted: #58657a;
      --node: #ffffff;
      --node-stroke: #b8c2d1;
      --blue-panel: #e7f1ff;
      --blue-line: #2563eb;
      --blue-ink: #174ea6;
      --yellow-panel: #fff4cf;
      --yellow-line: #c87405;
      --yellow-ink: #8a4b00;
      --green-panel: #e1f8e9;
      --green-line: #169448;
      --green-ink: #106b36;
      --shadow: #d5dce7;
      --fallback: #fff2f2;
      --fallback-ink: #8c2525;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #101620;
        --ink: #eef3fb;
        --muted: #b7c1d0;
        --node: #1b2431;
        --node-stroke: #526074;
        --blue-panel: #172b49;
        --blue-line: #72a7ff;
        --blue-ink: #bcd5ff;
        --yellow-panel: #3b3017;
        --yellow-line: #f1b24b;
        --yellow-ink: #ffd88f;
        --green-panel: #173725;
        --green-line: #62d890;
        --green-ink: #aaf0c2;
        --shadow: #080b10;
        --fallback: #3b2023;
        --fallback-ink: #ffd3d6;
      }
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: 100%;
      background: var(--page);
    }

    h1 {
      margin: 0;
      padding: 12px 28px 6px;
      font-size: 22px;
      font-weight: bold;
      color: var(--ink);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--page);
    }

    .panel {
      stroke-width: 2px;
    }

    .node {
      fill: var(--node);
      stroke: var(--node-stroke);
      stroke-width: 2px;
    }

    .node-shadow {
      fill: var(--shadow);
      stroke: none;
    }

    .flow {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-head {
      stroke: none;
    }

    .blue .panel {
      fill: var(--blue-panel);
      stroke: var(--blue-line);
    }

    .blue .flow {
      stroke: var(--blue-line);
    }

    .blue .arrow-head,
    .blue .accent {
      fill: var(--blue-line);
    }

    .blue .branch-title,
    .blue .tag {
      fill: var(--blue-ink);
    }

    .yellow .panel {
      fill: var(--yellow-panel);
      stroke: var(--yellow-line);
    }

    .yellow .flow {
      stroke: var(--yellow-line);
    }

    .yellow .arrow-head,
    .yellow .accent {
      fill: var(--yellow-line);
    }

    .yellow .branch-title,
    .yellow .tag,
    .yellow .loop-label {
      fill: var(--yellow-ink);
    }

    .green .panel {
      fill: var(--green-panel);
      stroke: var(--green-line);
    }

    .green .flow {
      stroke: var(--green-line);
    }

    .green .arrow-head,
    .green .accent {
      fill: var(--green-line);
    }

    .green .branch-title,
    .green .tag,
    .green .loop-label {
      fill: var(--green-ink);
    }

    .branch-title {
      font-size: 18px;
      font-weight: bold;
    }

    .branch-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .tag {
      font-size: 11px;
      font-weight: bold;
    }

    .node-label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .node-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .loop-label {
      font-size: 13px;
      font-weight: bold;
    }

    #fallback {
      margin: 12px 28px;
      padding: 18px;
      background: var(--fallback);
      color: var(--fallback-ink);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="diagram-heading">Три семейства моделей будущего</h1>

    <svg
      id="diagram"
      viewBox="0 0 1200 450"
      width="1200"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description"
    >
      <desc id="diagram-description">
        Три параллельные ветви: генерация видео, управляемое предсказание кадров
        и переход в скрытом состоянии с наградой.
      </desc>
    </svg>

    <p id="fallback" hidden>
      Схема должна была показать три ветви: промпт → Video DiT → кадры;
      прошлые кадры и действие → следующие кадры → обратно; состояние и
      действие → следующий latent и награда → обратно.
    </p>
  </main>

  <script>
    const diagramData = [
      {
        kind: "metrics",
        radius: 16,
        nodeRadius: 11,
        shadowShift: 4,
        accentWidth: 7
      },
      {
        kind: "branch",
        theme: "blue",
        panel: { x: 28, y: 12, w: 1144, h: 126 },
        headings: [
          { text: "Чистая генерация", x: 54, y: 47, anchor: "start", className: "branch-title" },
          { text: "видео", x: 54, y: 70, anchor: "start", className: "branch-title" },
          { text: "ролик без интерфейса действий", x: 54, y: 98, anchor: "start", className: "branch-note" }
        ],
        nodes: [
          {
            rect: { x: 290, y: 44, w: 200, h: 62 },
            labels: [
              { text: "ВХОД", x: 314, y: 63, anchor: "start", className: "tag" },
              { text: "Промпт или", x: 390, y: 81, anchor: "middle", className: "node-label" },
              { text: "изображение", x: 390, y: 99, anchor: "middle", className: "node-label" }
            ]
          },
          {
            rect: { x: 580, y: 44, w: 200, h: 62 },
            labels: [
              { text: "МОДЕЛЬ", x: 604, y: 63, anchor: "start", className: "tag" },
              { text: "Video DiT", x: 680, y: 88, anchor: "middle", className: "node-label" }
            ]
          },
          {
            rect: { x: 870, y: 44, w: 245, h: 62 },
            labels: [
              { text: "ВЫХОД", x: 894, y: 63, anchor: "start", className: "tag" },
              { text: "Кадры", x: 992, y: 88, anchor: "middle", className: "node-label" }
            ]
          }
        ],
        arrows: [
          {
            points: [{ x: 490, y: 75 }, { x: 580, y: 75 }],
            head: [{ x: 580, y: 75 }, { x: 568, y: 68 }, { x: 568, y: 82 }]
          },
          {
            points: [{ x: 780, y: 75 }, { x: 870, y: 75 }],
            head: [{ x: 870, y: 75 }, { x: 858, y: 68 }, { x: 858, y: 82 }]
          }
        ],
        captions: []
      },
      {
        kind: "branch",
        theme: "yellow",
        panel: { x: 28, y: 154, w: 1144, h: 136 },
        headings: [
          { text: "Управляемая", x: 54, y: 188, anchor: "start", className: "branch-title" },
          { text: "world model", x: 54, y: 211, anchor: "start", className: "branch-title" },
          { text: "сцена отвечает на действие", x: 54, y: 239, anchor: "start", className: "branch-note" }
        ],
        nodes: [
          {
            rect: { x: 290, y: 180, w: 200, h: 58 },
            labels: [
              { text: "ВХОД", x: 314, y: 199, anchor: "start", className: "tag" },
              { text: "Прошлые кадры", x: 390, y: 216, anchor: "middle", className: "node-label" },
              { text: "+ действие", x: 390, y: 233, anchor: "middle", className: "node-note" }
            ]
          },
          {
            rect: { x: 580, y: 180, w: 200, h: 58 },
            labels: [
              { text: "МОДЕЛЬ", x: 604, y: 199, anchor: "start", className: "tag" },
              { text: "Latent-action", x: 680, y: 216, anchor: "middle", className: "node-label" },
              { text: "Video DiT", x: 680, y: 233, anchor: "middle", className: "node-note" }
            ]
          },
          {
            rect: { x: 870, y: 180, w: 245, h: 58 },
            labels: [
              { text: "ВЫХОД", x: 894, y: 199, anchor: "start", className: "tag" },
              { text: "Следующие кадры", x: 992, y: 224, anchor: "middle", className: "node-label" }
            ]
          }
        ],
        arrows: [
          {
            points: [{ x: 490, y: 209 }, { x: 580, y: 209 }],
            head: [{ x: 580, y: 209 }, { x: 568, y: 202 }, { x: 568, y: 216 }]
          },
          {
            points: [{ x: 780, y: 209 }, { x: 870, y: 209 }],
            head: [{ x: 870, y: 209 }, { x: 858, y: 202 }, { x: 858, y: 216 }]
          },
          {
            points: [
              { x: 992, y: 238 },
              { x: 992, y: 266 },
              { x: 390, y: 266 },
              { x: 390, y: 238 }
            ],
            head: [{ x: 390, y: 238 }, { x: 383, y: 250 }, { x: 397, y: 250 }]
          }
        ],
        captions: [
          { text: "новая команда · кадры снова входят в контекст", x: 691, y: 284, anchor: "middle", className: "loop-label" }
        ]
      },
      {
        kind: "branch",
        theme: "green",
        panel: { x: 28, y: 306, w: 1144, h: 136 },
        headings: [
          { text: "World model для RL", x: 54, y: 340, anchor: "start", className: "branch-title" },
          { text: "DreamerV3", x: 54, y: 363, anchor: "start", className: "branch-title" },
          { text: "переход внутри latent-пространства", x: 54, y: 391, anchor: "start", className: "branch-note" }
        ],
        nodes: [
          {
            rect: { x: 290, y: 332, w: 200, h: 58 },
            labels: [
              { text: "ВХОД", x: 314, y: 351, anchor: "start", className: "tag" },
              { text: "Состояние", x: 390, y: 368, anchor: "middle", className: "node-label" },
              { text: "+ действие", x: 390, y: 385, anchor: "middle", className: "node-note" }
            ]
          },
          {
            rect: { x: 580, y: 332, w: 200, h: 58 },
            labels: [
              { text: "МОДЕЛЬ", x: 604, y: 351, anchor: "start", className: "tag" },
              { text: "Latent transition", x: 680, y: 368, anchor: "middle", className: "node-label" },
              { text: "model", x: 680, y: 385, anchor: "middle", className: "node-note" }
            ]
          },
          {
            rect: { x: 870, y: 332, w: 245, h: 58 },
            labels: [
              { text: "ВЫХОД", x: 894, y: 351, anchor: "start", className: "tag" },
              { text: "Следующий latent", x: 992, y: 368, anchor: "middle", className: "node-label" },
              { text: "+ награда", x: 992, y: 385, anchor: "middle", className: "node-note" }
            ]
          }
        ],
        arrows: [
          {
            points: [{ x: 490, y: 361 }, { x: 580, y: 361 }],
            head: [{ x: 580, y: 361 }, { x: 568, y: 354 }, { x: 568, y: 368 }]
          },
          {
            points: [{ x: 780, y: 361 }, { x: 870, y: 361 }],
            head: [{ x: 870, y: 361 }, { x: 858, y: 354 }, { x: 858, y: 368 }]
          },
          {
            points: [
              { x: 992, y: 390 },
              { x: 992, y: 418 },
              { x: 390, y: 418 },
              { x: 390, y: 390 }
            ],
            head: [{ x: 390, y: 390 }, { x: 383, y: 402 }, { x: 397, y: 402 }]
          }
        ],
        captions: [
          { text: "следующее состояние возвращается в цикл", x: 691, y: 436, anchor: "middle", className: "loop-label" }
        ]
      }
    ];

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const metrics = diagramData.find(item => item.kind === "metrics");
      const branches = diagramData.filter(item => item.kind === "branch");
      const namespace = "http://www.w3.org/2000/svg";

      const element = (name, attributes, className) => {
        const node = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, value);
        }
        if (className) node.setAttribute("class", className);
        return node;
      };

      const rectangle = (rect, className, shift) => {
        const movedX = rect.x + shift;
        const movedY = rect.y + shift;
        return element("rect", {
          x: sx(movedX),
          y: sy(movedY),
          width: sx(movedX + rect.w) - sx(movedX),
          height: sy(movedY + rect.h) - sy(movedY),
          rx: sx(metrics.nodeRadius) - sx(origin.x),
          ry: sy(metrics.nodeRadius) - sy(origin.y)
        }, className);
      };

      const label = item => {
        const text = element("text", {
          x: sx(item.x),
          y: sy(item.y),
          "text-anchor": item.anchor
        }, item.className);
        text.textContent = item.text;
        return text;
      };

      const polyline = arrow => {
        const points = arrow.points
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
        return element("polyline", { points }, "flow");
      };

      const arrowHead = arrow => {
        const points = arrow.head
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" ");
        return element("polygon", { points }, "arrow-head");
      };

      for (const branch of branches) {
        const group = element("g", {}, branch.theme);

        const panel = branch.panel;
        group.appendChild(element("rect", {
          x: sx(panel.x),
          y: sy(panel.y),
          width: sx(panel.x + panel.w) - sx(panel.x),
          height: sy(panel.y + panel.h) - sy(panel.y),
          rx: sx(metrics.radius) - sx(origin.x),
          ry: sy(metrics.radius) - sy(origin.y)
        }, "panel"));

        for (const heading of branch.headings) {
          group.appendChild(label(heading));
        }

        for (const node of branch.nodes) {
          group.appendChild(rectangle(node.rect, "node-shadow", metrics.shadowShift));
          group.appendChild(rectangle(node.rect, "node", origin.x));

          group.appendChild(element("rect", {
            x: sx(node.rect.x),
            y: sy(node.rect.y),
            width: sx(node.rect.x + metrics.accentWidth) - sx(node.rect.x),
            height: sy(node.rect.y + node.rect.h) - sy(node.rect.y),
            rx: sx(metrics.nodeRadius) - sx(origin.x),
            ry: sy(metrics.nodeRadius) - sy(origin.y)
          }, "accent"));

          for (const nodeLabel of node.labels) {
            group.appendChild(label(nodeLabel));
          }
        }

        for (const arrow of branch.arrows) {
          group.appendChild(polyline(arrow));
          group.appendChild(arrowHead(arrow));
        }

        for (const caption of branch.captions) {
          group.appendChild(label(caption));
        }

        svg.appendChild(group);
      }
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
