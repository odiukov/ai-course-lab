<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стоимость трёхмерного внимания в числах</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f7fb;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #647087;
    --line: #aab4c5;
    --grid: #cbd3df;
    --full: #d95366;
    --full-soft: #f8dce1;
    --divided: #178a78;
    --divided-soft: #d8f1eb;
    --exercise: #7563d4;
    --exercise-soft: #e8e3fa;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10141d;
      --panel: #181e29;
      --ink: #eef2f8;
      --muted: #aeb8ca;
      --line: #69758a;
      --grid: #465267;
      --full: #ff8291;
      --full-soft: #442831;
      --divided: #5bd3bd;
      --divided-soft: #183f3a;
      --exercise: #b4a5ff;
      --exercise-soft: #302b50;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .diagram {
    width: 100%;
    max-height: 520px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--line);
  }

  .heading {
    padding: 12px 18px 8px;
    font-size: 20px;
    font-weight: bold;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--bg);
  }

  .panel {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2;
  }

  .source-frame {
    fill: var(--panel);
    stroke: var(--line);
    stroke-width: 2;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1;
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
  }

  .arrow-full { fill: var(--full); }
  .arrow-divided { fill: var(--divided); }

  .full-fill {
    fill: var(--full-soft);
    stroke: var(--full);
    stroke-width: 2;
  }

  .divided-fill {
    fill: var(--divided-soft);
    stroke: var(--divided);
    stroke-width: 2;
  }

  .exercise-fill {
    fill: var(--exercise-soft);
    stroke: var(--exercise);
    stroke-width: 2;
  }

  .full-line {
    stroke: var(--full);
    stroke-width: 1;
  }

  .divided-line {
    stroke: var(--divided);
    stroke-width: 1;
  }

  .exercise-line {
    stroke: var(--exercise);
    stroke-width: 1;
  }

  .exercise-diagonal {
    stroke: var(--exercise);
    stroke-width: 2;
  }

  text {
    fill: var(--ink);
    font-size: 15px;
  }

  .panel-title {
    font-size: 17px;
    font-weight: bold;
  }

  .small {
    fill: var(--muted);
    font-size: 13px;
  }

  .formula {
    font-size: 15px;
    font-weight: bold;
  }

  .result {
    font-size: 24px;
    font-weight: bold;
  }

  .full-text { fill: var(--full); }
  .divided-text { fill: var(--divided); }
  .exercise-text { fill: var(--exercise); }

  #fallback {
    display: none;
    padding: 18px;
    font-size: 16px;
  }
</style>
</head>
<body>
<main class="diagram" aria-labelledby="diagram-title">
  <div class="heading" id="diagram-title">Стоимость трёхмерного внимания в числах</div>
  <svg id="chart" viewBox="0 0 1040 446"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-label="Сравнение количества пар в полном и разделённом внимании для сетки из четырёх моментов времени и шестидесяти четырёх пространственных позиций">
  </svg>
  <div id="fallback">
    Схема должна была показать: для 256 токенов full joint attention вычисляет
    65&nbsp;536 пар, divided attention — 17&nbsp;408 пар, а в упражнении
    рассматривается матрица 202&nbsp;500².
  </div>
</main>

<script>
const data = {
  zero: 0,
  one: 1,
  canvas: [0, 0, 1040, 446],
  origin: [0, 0],
  scale: 1,
  panel: {
    source: [20, 32, 285, 396],
    full: [380, 32, 290, 164],
    divided: [380, 214, 290, 214],
    exercise: [700, 32, 320, 396]
  },
  source: {
    title: [42, 61],
    subtitle: [42, 86],
    frames: [[48, 112], [164, 112], [48, 230], [164, 230]],
    side: 88,
    columns: 8,
    rows: 8,
    caption: [162, 355],
    total: [162, 389]
  },
  fork: {
    start: [305, 250],
    joint: [[340, 250], [340, 114]],
    divided: [[340, 250], [340, 318]],
    jointArrow: [340, 114, 380],
    dividedArrow: [340, 318, 380],
    headLength: 12,
    headHalf: 7
  },
  full: {
    title: [402, 61],
    matrix: [405, 82, 86],
    steps: 8,
    formula: [510, 104],
    result: [510, 139],
    note: [510, 167]
  },
  divided: {
    title: [402, 243],
    timeMatrix: [405, 264, 46],
    timeSteps: 4,
    timeFormula: [470, 285],
    spaceMatrix: [405, 322, 62],
    spaceSteps: 8,
    spaceFormula: [486, 348],
    totalLabel: [402, 397],
    tokenNote: [648, 397]
  },
  exercise: {
    title: [722, 61],
    subtitle: [722, 86],
    matrix: [755, 108, 210],
    steps: 14,
    result: [860, 356],
    caption: [860, 386],
    note: [860, 411]
  }
};

const [originX, originY] = data.origin;
const origin = { x: originX, y: originY };
const scale = data.scale;
const sx = x => origin.x + x * scale;
const sy = y => origin.y + y * scale;

try {
  const svg = document.getElementById("chart");
  const fallback = document.getElementById("fallback");
  const ns = "http://www.w3.org/2000/svg";

  function node(tag, attributes, parent) {
    const item = document.createElementNS(ns, tag);
    for (const [name, value] of Object.entries(attributes)) {
      item.setAttribute(name, value);
    }
    (parent || svg).appendChild(item);
    return item;
  }

  function rectangle(box, className) {
    const [x, y, width, height] = box;
    return node("rect", {
      x: sx(x),
      y: sy(y),
      width: sx(x + width) - sx(x),
      height: sy(y + height) - sy(y),
      class: className
    });
  }

  function segment(x1, y1, x2, y2, className) {
    return node("line", {
      x1: sx(x1),
      y1: sy(y1),
      x2: sx(x2),
      y2: sy(y2),
      class: className
    });
  }

  function polyline(points, className) {
    const value = points
      .map(point => `${sx(point.x)},${sy(point.y)}`)
      .join(" ");
    return node("polyline", { points: value, class: className });
  }

  function polygon(points, className) {
    const value = points
      .map(point => `${sx(point.x)},${sy(point.y)}`)
      .join(" ");
    return node("polygon", { points: value, class: className });
  }

  function label(value, point, className, anchor) {
    const [x, y] = point;
    const item = node("text", {
      x: sx(x),
      y: sy(y),
      class: className || "",
      "text-anchor": anchor || "start"
    });
    item.textContent = value;
    return item;
  }

  function matrix(box, steps, fillClass, lineClass) {
    const [x, y, side] = box;
    rectangle([x, y, side, side], fillClass);
    const interval = side / steps;

    for (let index = data.one; index < steps; index += data.one) {
      const shift = interval * index;
      segment(x + shift, y, x + shift, y + side, lineClass);
      segment(x, y + shift, x + side, y + shift, lineClass);
    }
  }

  function arrow(x1, y, x2, fillClass) {
    const lineEnd = x2 - data.fork.headLength;
    segment(x1, y, lineEnd, y, "connector");
    polygon([
      { x: x2, y: y },
      { x: lineEnd, y: y - data.fork.headHalf },
      { x: lineEnd, y: y + data.fork.headHalf }
    ], fillClass);
  }

  rectangle(data.panel.source, "panel");
  rectangle(data.panel.full, "panel");
  rectangle(data.panel.divided, "panel");
  rectangle(data.panel.exercise, "panel");

  label("Исходная сетка видео", data.source.title, "panel-title", "start");
  label("T=4, H×W=64", data.source.subtitle, "small", "start");

  for (const [frameX, frameY] of data.source.frames) {
    matrix(
      [frameX, frameY, data.source.side],
      data.source.columns,
      "source-frame",
      "grid-line"
    );
  }

  label("4 кадра × 64 позиции", data.source.caption, "formula", "middle");
  label("256 токенов", data.source.total, "result", "middle");

  const [startX, startY] = data.fork.start;
  const jointPoints = [
    { x: startX, y: startY },
    { x: data.fork.joint[0][0], y: data.fork.joint[0][1] },
    { x: data.fork.joint[1][0], y: data.fork.joint[1][1] }
  ];
  const dividedPoints = [
    { x: startX, y: startY },
    { x: data.fork.divided[0][0], y: data.fork.divided[0][1] },
    { x: data.fork.divided[1][0], y: data.fork.divided[1][1] }
  ];

  polyline(jointPoints, "connector");
  polyline(dividedPoints, "connector");

  const [jointArrowX, jointArrowY, jointArrowEnd] = data.fork.jointArrow;
  const [dividedArrowX, dividedArrowY, dividedArrowEnd] = data.fork.dividedArrow;
  arrow(jointArrowX, jointArrowY, jointArrowEnd, "arrow-full");
  arrow(dividedArrowX, dividedArrowY, dividedArrowEnd, "arrow-divided");

  label("Full joint", data.full.title, "panel-title full-text", "start");
  matrix(data.full.matrix, data.full.steps, "full-fill", "full-line");
  label("256²", data.full.formula, "formula", "start");
  label("65 536 пар", data.full.result, "result full-text", "start");
  label("каждый токен — с каждым", data.full.note, "small", "start");

  label("Divided attention", data.divided.title,
        "panel-title divided-text", "start");
  matrix(
    data.divided.timeMatrix,
    data.divided.timeSteps,
    "divided-fill",
    "divided-line"
  );
  label("время: 64×4² = 1 024", data.divided.timeFormula,
        "formula", "start");

  matrix(
    data.divided.spaceMatrix,
    data.divided.spaceSteps,
    "divided-fill",
    "divided-line"
  );
  label("пространство: 4×64² = 16 384", data.divided.spaceFormula,
        "formula", "start");
  label("всего: 17 408 пар", data.divided.totalLabel,
        "result divided-text", "start");
  label("токенов: 256", data.divided.tokenNote, "small", "end");

  label("Упражнение: видео 360p", data.exercise.title,
        "panel-title exercise-text", "start");
  label("Отдельная матрица полного внимания",
        data.exercise.subtitle, "small", "start");

  matrix(
    data.exercise.matrix,
    data.exercise.steps,
    "exercise-fill",
    "exercise-line"
  );

  const [exerciseX, exerciseY, exerciseSide] = data.exercise.matrix;
  segment(
    exerciseX,
    exerciseY,
    exerciseX + exerciseSide,
    exerciseY + exerciseSide,
    "exercise-diagonal"
  );

  label("202 500²", data.exercise.result,
        "result exercise-text", "middle");
  label("пар в матрице внимания", data.exercise.caption,
        "formula", "middle");
  label("квадрат растёт вместе с числом токенов",
        data.exercise.note, "small", "middle");

  fallback.setAttribute("aria-hidden", "true");
} catch (error) {
  const svg = document.getElementById("chart");
  const fallback = document.getElementById("fallback");
  svg.style.display = "none";
  fallback.style.display = "block";
  fallback.removeAttribute("aria-hidden");
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
