<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Путь от token IDs до вероятностей</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f7f8fc;
  --ink:#172033;
  --muted:#59657a;
  --line:#68758b;
  --panel:#ffffff;
  --panel-alt:#edf2ff;
  --accent:#5a63d8;
  --accent-fill:#e7e9ff;
  --green:#168653;
  --green-fill:#dff6e9;
  --chip:#252d43;
  --chip-ink:#ffffff;
  --shadow:#cbd3e2;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#111521;
    --ink:#f2f5ff;
    --muted:#aab4c8;
    --line:#8995aa;
    --panel:#1a2030;
    --panel-alt:#202a42;
    --accent:#9da4ff;
    --accent-fill:#292d58;
    --green:#66d99a;
    --green-fill:#173c2d;
    --chip:#e9ecff;
    --chip-ink:#171b28;
    --shadow:#30394d;
  }
}
*{box-sizing:border-box}
html,body{background:var(--page);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.frame{background:var(--page);overflow:hidden}
.heading{font-size:18px;font-weight:bold;color:var(--ink)}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--page);
}
.panel{fill:var(--panel);stroke:var(--line)}
.panel-alt{fill:var(--panel-alt);stroke:var(--accent)}
.final{fill:var(--green-fill);stroke:var(--green)}
.flow{fill:none;stroke:var(--line);stroke-linecap:round;stroke-linejoin:round}
.flow-accent{fill:none;stroke:var(--accent);stroke-linecap:round;stroke-linejoin:round}
.arrowhead{fill:var(--line)}
.arrowhead-accent{fill:var(--accent)}
.chip{fill:var(--chip);stroke:var(--chip)}
.chip-text{fill:var(--chip-ink);font-weight:bold}
.label{fill:var(--ink);font-weight:bold}
.small{fill:var(--muted)}
.accent-text{fill:var(--accent);font-weight:bold}
.green-text{fill:var(--green);font-weight:bold}
.floor{stroke:var(--accent);stroke-linecap:round}
.plus{fill:var(--accent-fill);stroke:var(--accent)}
.fallback{color:var(--ink);font-size:14px}
</style>
</head>
<body>
<main class="frame">
  <div class="heading" id="diagram-heading">Путь от token IDs до вероятностей</div>
  <svg id="diagram" width="1400" height="410" viewBox="0 0 1400 410"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="diagram-heading diagram-description">
    <desc id="diagram-description">
      Конвейер от token IDs через эмбеддинги и двенадцать
      трансформерных блоков к вероятностям следующего токена.
    </desc>
  </svg>
  <div id="fallback" class="fallback" hidden>
    Схема должна была показать: token IDs расходятся в token и position
    embeddings, складываются, проходят через 12 transformer-блоков,
    LayerNorm, проекцию 768 × 50 257 и softmax.
  </div>
  <noscript>
    Схема: token IDs → token и position embeddings → 12 transformer-блоков
    → LayerNorm → проекция 768 × 50 257 → softmax.
  </noscript>
</main>

<script>
const DATA={
  bounds:{x:0,y:0,w:136,h:38},
  metrics:{radius:0.8,head:1.15,wing:0.62},
  ids:{
    box:{x:1,y:5,w:14,h:24},
    title:{x:8,y:2.5,text:"token IDs"},
    chips:[
      {x:8,y:10.5,r:2.15,text:"14"},
      {x:8,y:17,r:2.15,text:"27"},
      {x:8,y:23.5,r:2.15,text:"6"}
    ]
  },
  cards:[
    {
      kind:"panelAlt",x:23,y:1,w:23,h:12,
      lines:[
        {x:34.5,y:6,text:"token embeddings",kind:"label"},
        {x:34.5,y:10,text:"вектор токена · 768",kind:"small"}
      ]
    },
    {
      kind:"panelAlt",x:23,y:21,w:23,h:12,
      lines:[
        {x:34.5,y:26,text:"position embeddings",kind:"label"},
        {x:34.5,y:30,text:"позиции 0, 1, 2 · 768",kind:"small"}
      ]
    },
    {
      kind:"panel",x:85,y:7,w:11,h:20,
      lines:[
        {x:90.5,y:15,text:"финальная",kind:"small"},
        {x:90.5,y:20,text:"LayerNorm",kind:"label"}
      ]
    },
    {
      kind:"panelAlt",x:102,y:4,w:15,h:26,
      lines:[
        {x:109.5,y:11,text:"линейная",kind:"small"},
        {x:109.5,y:16,text:"голова",kind:"label"},
        {x:109.5,y:21,text:"768 × 50 257",kind:"accentText"},
        {x:109.5,y:26,text:"логиты",kind:"small"}
      ]
    },
    {
      kind:"final",x:122,y:6,w:14,h:24,
      lines:[
        {x:129,y:13,text:"softmax",kind:"greenText"},
        {x:129,y:18,text:"вероятности",kind:"label"},
        {x:129,y:23,text:"0…1",kind:"small"},
        {x:129,y:27,text:"Σ = 1",kind:"greenText"}
      ]
    }
  ],
  add:{
    x:52,y:17,r:3.2,
    lines:[
      {x:52,y:16,text:"+",kind:"accentText"},
      {x:52,y:19.8,text:"сложить",kind:"small"}
    ]
  },
  transformer:{
    x:61,y:0,w:18,h:34,
    bars:[
      {y:3},{y:5.5},{y:8},{y:10.5},{y:13},{y:15.5},
      {y:18},{y:20.5},{y:23},{y:25.5},{y:28},{y:30.5}
    ],
    bar:{x1:63,x2:67},
    lines:[
      {x:73,y:12,text:"12",kind:"accentText"},
      {x:73,y:17,text:"transformer-",kind:"label"},
      {x:73,y:22,text:"блоков",kind:"label"},
      {x:73,y:27,text:"контекст",kind:"small"}
    ]
  },
  arrows:[
    {
      x1:15,y1:17,x2:23,y2:7,
      label:{x:17.5,y:7.5,text:"что?",anchor:"middle"},
      tone:"base"
    },
    {
      x1:15,y1:17,x2:23,y2:27,
      label:{x:17.5,y:29.5,text:"где?",anchor:"middle"},
      tone:"base"
    },
    {x1:46,y1:7,x2:48.8,y2:15.3,tone:"base"},
    {x1:46,y1:27,x2:48.8,y2:18.7,tone:"base"},
    {x1:55.2,y1:17,x2:61,y2:17,tone:"accent"},
    {x1:79,y1:17,x2:85,y2:17,tone:"accent"},
    {x1:96,y1:17,x2:102,y2:17,tone:"base"},
    {
      x1:117,y1:17,x2:122,y2:17,
      label:{x:119.5,y:12.5,text:"весь словарь",anchor:"middle"},
      tone:"base"
    }
  ],
  footer:{
    x:68.5,y:38,
    text:"Для продолжения текста берём вероятности у последней позиции."
  }
};

const ORIGIN={x:20,y:8};
const SCALE=10;
const CANVAS_WIDTH=1400;
const CANVAS_HEIGHT=410;
const LABEL_PAD=7;
const LINE_WIDTH=2;
const FONT_MAIN=14;
const FONT_SMALL=12;
const FONT_PLUS=18;

const sx=x=>ORIGIN.x+x*SCALE;
const sy=y=>ORIGIN.y+y*SCALE;

try{
  const svg=document.getElementById("diagram");
  const NS="http://www.w3.org/2000/svg";

  function make(name,attrs={},text){
    const el=document.createElementNS(NS,name);
    for(const [key,value] of Object.entries(attrs)){
      el.setAttribute(key,String(value));
    }
    if(text!==undefined) el.textContent=text;
    return el;
  }

  function append(name,attrs,text,parent=svg){
    const el=make(name,attrs,text);
    parent.appendChild(el);
    return el;
  }

  function rect(item,className,parent=svg){
    return append("rect",{
      x:sx(item.x),
      y:sy(item.y),
      width:sx(item.x+item.w)-sx(item.x),
      height:sy(item.y+item.h)-sy(item.y),
      rx:sx(DATA.metrics.radius)-sx(0),
      class:className,
      "stroke-width":LINE_WIDTH
    },undefined,parent);
  }

  function circle(item,className,parent=svg){
    return append("circle",{
      cx:sx(item.x),
      cy:sy(item.y),
      r:sx(item.x+item.r)-sx(item.x),
      class:className,
      "stroke-width":LINE_WIDTH
    },undefined,parent);
  }

  function text(item,className="label",anchor="middle",size=FONT_MAIN,parent=svg){
    return append("text",{
      x:sx(item.x),
      y:sy(item.y),
      class:className,
      "text-anchor":anchor,
      "dominant-baseline":"middle",
      "font-size":size
    },item.text,parent);
  }

  function arrow(item,parent=svg){
    const dx=item.x2-item.x1;
    const dy=item.y2-item.y1;
    const length=Math.hypot(dx,dy);
    const ux=dx/length;
    const uy=dy/length;
    const bx=item.x2-ux*DATA.metrics.head;
    const by=item.y2-uy*DATA.metrics.head;
    const px=-uy*DATA.metrics.wing;
    const py=ux*DATA.metrics.wing;
    const lineClass=item.tone==="accent"?"flow-accent":"flow";
    const headClass=item.tone==="accent"?"arrowhead-accent":"arrowhead";

    append("line",{
      x1:sx(item.x1),
      y1:sy(item.y1),
      x2:sx(bx),
      y2:sy(by),
      class:lineClass,
      "stroke-width":LINE_WIDTH
    },undefined,parent);

    const points=[
      [sx(item.x2),sy(item.y2)],
      [sx(bx+px),sy(by+py)],
      [sx(bx-px),sy(by-py)]
    ].map(point=>point.join(",")).join(" ");

    append("polygon",{points,class:headClass},undefined,parent);

    if(item.label){
      text(
        item.label,
        "small",
        item.label.anchor,
        FONT_SMALL,
        parent
      );
    }
  }

  const flowLayer=append("g",{"aria-label":"Связи конвейера"});
  const shapeLayer=append("g",{"aria-label":"Этапы вычисления"});
  const textLayer=append("g",{"aria-label":"Подписи этапов"});

  for(const item of DATA.arrows) arrow(item,flowLayer);

  rect(DATA.ids.box,"panel",shapeLayer);
  text(DATA.ids.title,"label","middle",FONT_MAIN,textLayer);

  for(const chip of DATA.ids.chips){
    circle(chip,"chip",shapeLayer);
    text(chip,"chip-text","middle",FONT_MAIN,textLayer);
  }

  for(const card of DATA.cards){
    const cardClass=
      card.kind==="final"?"final":
      card.kind==="panelAlt"?"panel-alt":"panel";
    rect(card,cardClass,shapeLayer);

    for(const line of card.lines){
      const lineClass=
        line.kind==="accentText"?"accent-text":
        line.kind==="greenText"?"green-text":
        line.kind==="small"?"small":"label";
      const lineSize=line.kind==="small"?FONT_SMALL:FONT_MAIN;
      text(line,lineClass,"middle",lineSize,textLayer);
    }
  }

  circle(DATA.add,"plus",shapeLayer);
  for(const line of DATA.add.lines){
    const lineClass=line.kind==="small"?"small":"accent-text";
    const lineSize=line.text==="+"?FONT_PLUS:FONT_SMALL;
    text(line,lineClass,"middle",lineSize,textLayer);
  }

  rect(DATA.transformer,"panel-alt",shapeLayer);
  for(const band of DATA.transformer.bars){
    append("line",{
      x1:sx(DATA.transformer.bar.x1),
      y1:sy(band.y),
      x2:sx(DATA.transformer.bar.x2),
      y2:sy(band.y),
      class:"floor",
      "stroke-width":LINE_WIDTH
    },undefined,shapeLayer);
  }

  for(const line of DATA.transformer.lines){
    const lineClass=
      line.kind==="accentText"?"accent-text":
      line.kind==="small"?"small":"label";
    const lineSize=line.kind==="small"?FONT_SMALL:FONT_MAIN;
    text(line,lineClass,"middle",lineSize,textLayer);
  }

  text(DATA.footer,"small","middle",FONT_MAIN,textLayer);

  svg.setAttribute("data-width",String(CANVAS_WIDTH));
  svg.setAttribute("data-height",String(CANVAS_HEIGHT));
  svg.setAttribute("data-label-pad",String(LABEL_PAD));
}catch(error){
  document.getElementById("diagram").hidden=true;
  document.getElementById("fallback").hidden=false;
  console.error(error);
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
