<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дерево решения о включении EAGLE-3</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f4f7fb;
      --panel: #ffffff;
      --text: #172235;
      --muted: #52647c;
      --line: #42607d;
      --accent: #146c94;
      --accent-fill: #e8f5fb;
      --decision-fill: #fff5d7;
      --decision-line: #a66708;
      --stop-fill: #fdebec;
      --stop-line: #b83b48;
      --success-fill: #e7f6ed;
      --success-line: #247a49;
      --repair-fill: #f0ecfb;
      --repair-line: #6d55a3;
    }

    html,
    body {
      background: var(--page);
      color: var(--text);
    }

    figure {
      max-width: 950px;
      margin: auto;
    }

    h1 {
      font-family: system-ui, sans-serif;
      font-size: 20px;
      text-align: center;
      color: var(--text);
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
      border: 2px solid var(--line);
      font-family: system-ui, sans-serif;
    }

    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .edge.loop {
      stroke: var(--repair-line);
    }

    .arrow {
      fill: var(--line);
      stroke: none;
    }

    .arrow.loop {
      fill: var(--repair-line);
    }

    .node {
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .action {
      fill: var(--accent-fill);
      stroke: var(--accent);
    }

    .decision {
      fill: var(--decision-fill);
      stroke: var(--decision-line);
    }

    .stop {
      fill: var(--stop-fill);
      stroke: var(--stop-line);
    }

    .success {
      fill: var(--success-fill);
      stroke: var(--success-line);
    }

    .repair {
      fill: var(--repair-fill);
      stroke: var(--repair-line);
    }

    text {
      fill: var(--text);
      font-size: 15px;
    }

    .node-label {
      font-weight: bold;
      pointer-events: none;
    }

    .edge-label {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
      paint-order: stroke;
      stroke: var(--panel);
      stroke-width: 6px;
      stroke-linejoin: round;
    }

    .fallback {
      fill: var(--text);
      font-size: 15px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1420;
        --panel: #121d2b;
        --text: #edf3fa;
        --muted: #b8c7d8;
        --line: #7890aa;
        --accent: #63c3eb;
        --accent-fill: #153448;
        --decision-fill: #403319;
        --decision-line: #e3ad4f;
        --stop-fill: #42242a;
        --stop-line: #ef7b88;
        --success-fill: #173b2a;
        --success-line: #61c88b;
        --repair-fill: #302846;
        --repair-line: #ad94e2;
      }
    }
  </style>
</head>
<body>
  <figure>
    <h1 id="diagram-heading">Дерево решения о включении EAGLE-3</h1>
    <svg
      id="diagram"
      viewBox="0 0 950 460"
      width="950"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-heading diagram-description">
      <desc id="diagram-description">
        Дерево ведёт от проверки baseline через включение EAGLE-3 и измерение
        alpha к проверке P99 ITL, после которой конфигурацию оставляют или дорабатывают.
      </desc>
    </svg>
  </figure>

  <script>
    const data = {
      zero: 0,
      origin: { x: 24, y: 10 },
      scale: { x: 1, y: 1 },
      style: {
        radius: 10
      },
      nodes: [
        {
          shape: "diamond",
          kind: "decision",
          cx: 380, cy: 40, rx: 150, ry: 35,
          lines: [
            { x: 380, y: 34, text: "Есть корректный baseline" },
            { x: 380, y: 52, text: "на целевой одновременности?" }
          ]
        },
        {
          shape: "rect",
          kind: "stop",
          x: 0, y: 11, w: 190, h: 58,
          lines: [
            { x: 95, y: 34, text: "Вернуться к замеру" },
            { x: 95, y: 52, text: "baseline target-модели" }
          ]
        },
        {
          shape: "rect",
          kind: "action",
          x: 260, y: 92, w: 240, h: 44,
          lines: [
            { x: 380, y: 119, text: "Включить EAGLE-3" }
          ]
        },
        {
          shape: "rect",
          kind: "action",
          x: 220, y: 157, w: 320, h: 50,
          lines: [
            { x: 380, y: 178, text: "Измерить α" },
            { x: 380, y: 196, text: "при целевой одновременности" }
          ]
        },
        {
          shape: "diamond",
          kind: "decision",
          cx: 380, cy: 249, rx: 125, ry: 34,
          lines: [
            { x: 380, y: 254, text: "α не ниже 0,55?" }
          ]
        },
        {
          shape: "rect",
          kind: "stop",
          x: 0, y: 217, w: 205, h: 66,
          lines: [
            { x: 102, y: 239, text: "Отключить EAGLE-3" },
            { x: 102, y: 257, text: "или дообучить голову" },
            { x: 102, y: 275, text: "и повторить проверку" }
          ]
        },
        {
          shape: "diamond",
          kind: "decision",
          cx: 380, cy: 344, rx: 135, ry: 36,
          lines: [
            { x: 380, y: 339, text: "P99 ITL" },
            { x: 380, y: 357, text: "не ухудшился?" }
          ]
        },
        {
          shape: "rect",
          kind: "repair",
          x: 580, y: 309, w: 335, h: 71,
          lines: [
            { x: 747, y: 331, text: "Уменьшить K или маршрутизировать" },
            { x: 747, y: 349, text: "подходящий трафик; доработать" },
            { x: 747, y: 367, text: "draft-голову и повторить ветку" }
          ]
        },
        {
          shape: "rect",
          kind: "success",
          x: 270, y: 399, w: 220, h: 45,
          lines: [
            { x: 380, y: 418, text: "Оставить EAGLE-3" },
            { x: 380, y: 436, text: "включённым" }
          ]
        }
      ],
      edges: [
        {
          kind: "normal",
          points: [
            { x: 230, y: 40 },
            { x: 190, y: 40 }
          ],
          head: [
            { x: 190, y: 40 },
            { x: 202, y: 34 },
            { x: 202, y: 46 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 380, y: 75 },
            { x: 380, y: 92 }
          ],
          head: [
            { x: 380, y: 92 },
            { x: 374, y: 82 },
            { x: 386, y: 82 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 380, y: 136 },
            { x: 380, y: 157 }
          ],
          head: [
            { x: 380, y: 157 },
            { x: 374, y: 147 },
            { x: 386, y: 147 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 380, y: 207 },
            { x: 380, y: 215 }
          ],
          head: [
            { x: 380, y: 215 },
            { x: 374, y: 205 },
            { x: 386, y: 205 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 255, y: 249 },
            { x: 205, y: 249 }
          ],
          head: [
            { x: 205, y: 249 },
            { x: 217, y: 243 },
            { x: 217, y: 255 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 380, y: 283 },
            { x: 380, y: 308 }
          ],
          head: [
            { x: 380, y: 308 },
            { x: 374, y: 298 },
            { x: 386, y: 298 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 515, y: 344 },
            { x: 580, y: 344 }
          ],
          head: [
            { x: 580, y: 344 },
            { x: 568, y: 338 },
            { x: 568, y: 350 }
          ]
        },
        {
          kind: "normal",
          points: [
            { x: 380, y: 380 },
            { x: 380, y: 399 }
          ],
          head: [
            { x: 380, y: 399 },
            { x: 374, y: 389 },
            { x: 386, y: 389 }
          ]
        },
        {
          kind: "loop",
          points: [
            { x: 747, y: 309 },
            { x: 747, y: 182 },
            { x: 540, y: 182 }
          ],
          head: [
            { x: 540, y: 182 },
            { x: 552, y: 176 },
            { x: 552, y: 188 }
          ]
        }
      ],
      labels: [
        {
          anchor: { x: 212, y: 40 },
          offset: { x: 0, y: -10 },
          align: "middle",
          text: "нет"
        },
        {
          anchor: { x: 380, y: 82 },
          offset: { x: 12, y: 0 },
          align: "start",
          text: "да"
        },
        {
          anchor: { x: 230, y: 249 },
          offset: { x: 0, y: -10 },
          align: "middle",
          text: "нет: α < 0,55"
        },
        {
          anchor: { x: 380, y: 296 },
          offset: { x: 12, y: 0 },
          align: "start",
          text: "да"
        },
        {
          anchor: { x: 548, y: 344 },
          offset: { x: 0, y: -11 },
          align: "middle",
          text: "нет: хвост хуже"
        },
        {
          anchor: { x: 380, y: 390 },
          offset: { x: 12, y: 0 },
          align: "start",
          text: "да"
        },
        {
          anchor: { x: 747, y: 232 },
          offset: { x: 11, y: 0 },
          align: "start",
          text: "повторить профиль"
        }
      ],
      fallback: [
        {
          x: 45, y: 205,
          text: "Схема должна была показать: baseline → EAGLE-3 → α."
        },
        {
          x: 45, y: 232,
          text: "При α ниже 0,55 — отключить или дообучить; иначе проверить P99 ITL."
        }
      ]
    };

    const origin = data.origin;
    const scale = data.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      const element = (name, attributes, className) => {
        const item = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          item.setAttribute(key, String(value));
        });
        if (className) item.setAttribute("class", className);
        return item;
      };

      const pointString = points =>
        points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ");

      const edgeLayer = element("g", {}, "edges");
      const nodeLayer = element("g", {}, "nodes");
      const labelLayer = element("g", {}, "labels");

      data.edges.forEach(edge => {
        const edgeClass = edge.kind === "loop" ? "edge loop" : "edge";
        const arrowClass = edge.kind === "loop" ? "arrow loop" : "arrow";

        edgeLayer.appendChild(element("polyline", {
          points: pointString(edge.points)
        }, edgeClass));

        edgeLayer.appendChild(element("polygon", {
          points: pointString(edge.head)
        }, arrowClass));
      });

      data.nodes.forEach(node => {
        let shape;

        if (node.shape === "rect") {
          shape = element("rect", {
            x: sx(node.x),
            y: sy(node.y),
            width: sx(node.w) - sx(data.zero),
            height: sy(node.h) - sy(data.zero),
            rx: sx(data.style.radius) - sx(data.zero),
            ry: sy(data.style.radius) - sy(data.zero)
          }, `node ${node.kind}`);
        } else {
          const vertices = [
            { x: node.cx, y: node.cy - node.ry },
            { x: node.cx + node.rx, y: node.cy },
            { x: node.cx, y: node.cy + node.ry },
            { x: node.cx - node.rx, y: node.cy }
          ];
          shape = element("polygon", {
            points: pointString(vertices)
          }, `node ${node.kind}`);
        }

        nodeLayer.appendChild(shape);

        node.lines.forEach(line => {
          const text = element("text", {
            x: sx(line.x),
            y: sy(line.y),
            "text-anchor": "middle"
          }, "node-label");
          text.textContent = line.text;
          nodeLayer.appendChild(text);
        });
      });

      data.labels.forEach(label => {
        const text = element("text", {
          x: sx(label.anchor.x) + label.offset.x,
          y: sy(label.anchor.y) + label.offset.y,
          "text-anchor": label.align,
          "dominant-baseline": "middle"
        }, "edge-label");
        text.textContent = label.text;
        labelLayer.appendChild(text);
      });

      svg.appendChild(edgeLayer);
      svg.appendChild(nodeLayer);
      svg.appendChild(labelLayer);
    } catch (error) {
      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      while (svg.lastChild) svg.removeChild(svg.lastChild);

      data.fallback.forEach(line => {
        const text = document.createElementNS(ns, "text");
        text.setAttribute("x", String(sx(line.x)));
        text.setAttribute("y", String(sy(line.y)));
        text.setAttribute("class", "fallback");
        text.textContent = line.text;
        svg.appendChild(text);
      });
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
