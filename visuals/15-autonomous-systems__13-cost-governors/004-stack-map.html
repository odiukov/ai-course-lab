<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта двенадцати слоёв cost governor</title>
<style>
  :root {
    color-scheme: light dark;
    --page: whitesmoke;
    --panel: white;
    --ink: darkslategray;
    --muted: slategray;
    --line: lightslategray;
    --count-fill: lavender;
    --count-edge: royalblue;
    --cheap-fill: honeydew;
    --cheap-edge: seagreen;
    --human-fill: oldlace;
    --human-edge: darkorange;
    --badge: white;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10151c;
      --panel: #18212b;
      --ink: ghostwhite;
      --muted: lightgray;
      --line: slategray;
      --count-fill: #242b52;
      --count-edge: cornflowerblue;
      --cheap-fill: #173d32;
      --cheap-edge: mediumseagreen;
      --human-fill: #49341f;
      --human-edge: sandybrown;
      --badge: #10151c;
    }
  }

  * { box-sizing: border-box; }

  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    max-width: 1200px;
    margin: auto;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  h1 {
    margin: auto;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    font-size: 22px;
    line-height: normal;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 468px;
    background: var(--panel);
  }

  .layer,
  .zone-card,
  .summary {
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .zone-count {
    fill: var(--count-fill);
    stroke: var(--count-edge);
  }

  .zone-cheap {
    fill: var(--cheap-fill);
    stroke: var(--cheap-edge);
  }

  .zone-human {
    fill: var(--human-fill);
    stroke: var(--human-edge);
  }

  .badge {
    fill: var(--badge);
    stroke: currentColor;
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }

  .connector {
    fill: none;
    stroke: var(--line);
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }

  .arrow-count { fill: var(--count-edge); }
  .arrow-cheap { fill: var(--cheap-edge); }
  .arrow-human { fill: var(--human-edge); }

  text {
    fill: var(--ink);
    font-size: 16px;
  }

  .number {
    font-size: 15px;
    font-weight: bold;
  }

  .layer-label {
    font-size: 15px;
  }

  .range {
    font-size: 22px;
    font-weight: bold;
  }

  .zone-title {
    font-size: 17px;
    font-weight: bold;
  }

  .zone-note {
    fill: var(--muted);
    font-size: 14px;
  }

  .summary {
    fill: var(--panel);
    stroke: var(--line);
  }

  .summary-text {
    font-size: 15px;
    font-weight: bold;
  }

  #fallback {
    padding: 12px;
    color: var(--ink);
    font-size: 16px;
  }
</style>
</head>
<body>
<figure>
  <h1>Карта двенадцати слоёв cost governor</h1>
  <svg id="diagram" viewBox="0 0 1200 468" width="1200" height="468"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Стопка из двенадцати слоёв контроля стоимости</title>
    <desc id="svg-desc">Слои с первого по седьмой считают расход и останавливают работу, с восьмого по десятый удешевляют шаг, одиннадцатый и двенадцатый подключают человека и аварийно отключают агента.</desc>
  </svg>
  <div id="fallback" hidden>
    Схема должна была показать стопку из 12 слоёв: 1–7 считают расход и
    останавливают работу, 8–10 удешевляют каждый шаг, 11–12 подключают
    человека и аварийно отключают агента.
  </div>
</figure>

<script>
const data = [
  {
    origin: { x: 20, y: 4 },
    scale: { x: 1, y: 1 },
    zero: 0,
    half: 2,
    radius: 7,
    labelX: 91,
    badgeX: 30,
    badgeW: 48,
    rowX: 20,
    rowW: 680,
    rowH: 28,
    bracketInnerX: 704,
    bracketOuterX: 736,
    arrowBaseX: 766,
    arrowTipX: 786,
    arrowHalfH: 7,
    boxX: 786,
    boxW: 354,
    summary: {
      x: 20, y: 418, w: 1120, h: 34, textX: 580, textY: 435,
      text: "8–10 снижают цену шага  •  1–7 считают расход  •  11–12 передают контроль человеку"
    },
    groups: [
      {
        zone: "count", y1: 10, y2: 230, arrowY: 116,
        boxY: 25, boxH: 164,
        texts: [
          { x: 806, y: 50, cls: "range", text: "1–7" },
          { x: 806, y: 77, cls: "zone-title", text: "СЧИТАТЬ И ОСТАНАВЛИВАТЬ" },
          { x: 806, y: 107, cls: "zone-note", text: "Пределы запроса, задачи, инструмента" },
          { x: 806, y: 130, cls: "zone-note", text: "и времени ловят разные перерасходы." },
          { x: 806, y: 158, cls: "zone-note", text: "Нарушение лимита → остановка." }
        ]
      },
      {
        zone: "cheap", y1: 240, y2: 332, arrowY: 282,
        boxY: 226, boxH: 100,
        texts: [
          { x: 806, y: 250, cls: "range", text: "8–10" },
          { x: 806, y: 277, cls: "zone-title", text: "УДЕШЕВЛЯТЬ ШАГ" },
          { x: 806, y: 305, cls: "zone-note", text: "Работа продолжается, но каждый" },
          { x: 806, y: 322, cls: "zone-note", text: "следующий шаг обходится дешевле." }
        ]
      },
      {
        zone: "human", y1: 342, y2: 402, arrowY: 372,
        boxY: 334, boxH: 76,
        texts: [
          { x: 806, y: 354, cls: "range", text: "11–12" },
          { x: 806, y: 378, cls: "zone-title", text: "ПОДКЛЮЧАТЬ ЧЕЛОВЕКА" },
          { x: 806, y: 399, cls: "zone-title", text: "И АВАРИЙНО ОТКЛЮЧАТЬ" }
        ]
      }
    ]
  },
  { n: 1, zone: "count", y: 10,  label: "Потолок токенов одного запроса" },
  { n: 2, zone: "count", y: 42,  label: "Токены на всю задачу" },
  { n: 3, zone: "count", y: 74,  label: "Денежный бюджет задачи" },
  { n: 4, zone: "count", y: 106, label: "Число вызовов каждого инструмента" },
  { n: 5, zone: "count", y: 138, label: "Число итераций" },
  { n: 6, zone: "count", y: 170, label: "Расходы за минуту, час, день и месяц" },
  { n: 7, zone: "count", y: 202, label: "Скорость расходования денег" },
  { n: 8, zone: "cheap", y: 240, label: "Менее дорогая модель по умолчанию" },
  { n: 9, zone: "cheap", y: 272, label: "Кэширование неизменного промпта" },
  { n: 10, zone: "cheap", y: 304, label: "Сжатие активного контекста" },
  { n: 11, zone: "human", y: 342, label: "Подтверждение человеком дорогого действия" },
  { n: 12, zone: "human", y: 374, label: "Аварийное отключение + отдельный повторный запуск" }
];

const [layout, ...layers] = data;
const origin = layout.origin;
const scale = layout.scale;
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;
const labelPad = 8;
const strokeWidth = 2;
const fontSize = 16;

try {
  const svg = document.getElementById("diagram");
  const ns = "http://www.w3.org/2000/svg";
  const zero = layout.zero;

  const make = (name, attrs, text) => {
    const element = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => {
      element.setAttribute(key, String(value));
    });
    if (text !== undefined) element.textContent = text;
    return element;
  };

  const append = (name, attrs, text) => {
    const element = make(name, attrs, text);
    svg.appendChild(element);
    return element;
  };

  layout.groups.forEach(group => {
    append("rect", {
      x: sx(layout.boxX),
      y: sy(group.boxY),
      width: sx(layout.boxW) - sx(zero),
      height: sy(group.boxH) - sy(zero),
      rx: sx(layout.radius) - sx(zero),
      class: `zone-card zone-${group.zone}`,
      "stroke-width": strokeWidth
    });

    append("path", {
      d: [
        "M", sx(layout.bracketOuterX), sy(group.y1),
        "L", sx(layout.bracketInnerX), sy(group.y1),
        "L", sx(layout.bracketInnerX), sy(group.y2),
        "L", sx(layout.bracketOuterX), sy(group.y2)
      ].join(" "),
      class: "connector"
    });

    append("line", {
      x1: sx(layout.bracketInnerX),
      y1: sy(group.arrowY),
      x2: sx(layout.arrowTipX),
      y2: sy(group.arrowY),
      class: "connector"
    });

    append("polygon", {
      points: [
        `${sx(layout.arrowTipX)},${sy(group.arrowY)}`,
        `${sx(layout.arrowBaseX)},${sy(group.arrowY - layout.arrowHalfH)}`,
        `${sx(layout.arrowBaseX)},${sy(group.arrowY + layout.arrowHalfH)}`
      ].join(" "),
      class: `arrow-${group.zone}`
    });

    group.texts.forEach(item => {
      append("text", {
        x: sx(item.x) + labelPad,
        y: sy(item.y),
        class: item.cls,
        "text-anchor": "start",
        "dominant-baseline": "middle",
        "font-size": fontSize
      }, item.text);
    });
  });

  layers.forEach(item => {
    const cy = item.y + layout.rowH / layout.half;

    append("rect", {
      x: sx(layout.rowX),
      y: sy(item.y),
      width: sx(layout.rowW) - sx(zero),
      height: sy(layout.rowH) - sy(zero),
      rx: sx(layout.radius) - sx(zero),
      class: `layer zone-${item.zone}`,
      "stroke-width": strokeWidth
    });

    append("rect", {
      x: sx(layout.badgeX),
      y: sy(item.y),
      width: sx(layout.badgeW) - sx(zero),
      height: sy(layout.rowH) - sy(zero),
      rx: sx(layout.radius) - sx(zero),
      class: "badge"
    });

    append("text", {
      x: sx(layout.badgeX + layout.badgeW / layout.half),
      y: sy(cy),
      class: "number",
      "text-anchor": "middle",
      "dominant-baseline": "middle"
    }, item.n);

    append("text", {
      x: sx(layout.labelX) + labelPad,
      y: sy(cy),
      class: "layer-label",
      "text-anchor": "start",
      "dominant-baseline": "middle"
    }, item.label);
  });

  append("rect", {
    x: sx(layout.summary.x),
    y: sy(layout.summary.y),
    width: sx(layout.summary.w) - sx(zero),
    height: sy(layout.summary.h) - sy(zero),
    rx: sx(layout.radius) - sx(zero),
    class: "summary"
  });

  append("text", {
    x: sx(layout.summary.textX),
    y: sy(layout.summary.textY),
    class: "summary-text",
    "text-anchor": "middle",
    "dominant-baseline": "middle"
  }, layout.summary.text);
} catch (error) {
  document.getElementById("diagram").hidden = true;
  document.getElementById("fallback").hidden = false;
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
