<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Матрица атак и методов консенсуса</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --ink: #172033;
      --muted: #617086;
      --grid: #cad3df;
      --accent: #315b9b;
      --good-bg: #e8f7ee;
      --good-line: #2f855a;
      --good-ink: #17633f;
      --bad-bg: #fff0ee;
      --bad-line: #c5534c;
      --bad-ink: #9e342f;
      --shadow: #dfe5ed;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #192231;
        --panel-soft: #202c3d;
        --ink: #edf3fa;
        --muted: #aab8ca;
        --grid: #405168;
        --accent: #9bbcf0;
        --good-bg: #17392c;
        --good-line: #63c18e;
        --good-ink: #a9e8c5;
        --bad-bg: #432523;
        --bad-line: #e17a72;
        --bad-ink: #ffc0bb;
        --shadow: #0b1018;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      margin: unset;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .figure {
      width: 100%;
      background: var(--page);
      padding: 14px 16px 12px;
    }

    .figure__title {
      margin: unset;
      padding-block-end: 3px;
      color: var(--ink);
      font-size: 20px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .figure__lead {
      margin: unset;
      padding-block-end: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    #stage {
      width: 100%;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.4;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--panel);
      border: 1px solid var(--grid);
      box-shadow: 0 2px 12px var(--shadow);
    }

    .corner,
    .row-box,
    .cell {
      stroke-width: 2px;
    }

    .corner,
    .row-box {
      fill: var(--panel-soft);
      stroke: var(--grid);
    }

    .cell.good {
      fill: var(--good-bg);
      stroke: var(--good-line);
    }

    .cell.bad {
      fill: var(--bad-bg);
      stroke: var(--bad-line);
    }

    .header {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 700;
    }

    .header-note {
      fill: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .row-title {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: 0.035em;
    }

    .row-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .answer {
      fill: var(--ink);
      font-size: 15px;
      font-weight: 750;
    }

    .status-good {
      fill: var(--good-ink);
      font-size: 12px;
      font-weight: 700;
    }

    .status-bad {
      fill: var(--bad-ink);
      font-size: 12px;
      font-weight: 700;
    }

    .cell-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .icon-good {
      fill: var(--good-line);
    }

    .icon-bad {
      fill: var(--bad-line);
    }

    .icon-mark {
      fill: #ffffff;
      font-size: 15px;
      font-weight: 800;
    }

    .legend {
      fill: var(--muted);
      font-size: 12px;
    }

    .legend-good {
      fill: var(--good-ink);
      font-size: 13px;
      font-weight: 800;
    }

    .legend-bad {
      fill: var(--bad-ink);
      font-size: 13px;
      font-weight: 800;
    }

    .fallback {
      background: var(--panel);
      border: 2px solid var(--grid);
      padding: 16px;
      color: var(--ink);
    }
  </style>
</head>
<body>
  <main class="figure">
    <h2 class="figure__title">Матрица атак и методов консенсуса</h2>
    <p class="figure__lead">Читайте по строке: меняется метод. Читайте по столбцу: меняется атака.</p>
    <div id="stage" aria-live="polite"></div>
  </main>

  <script>
    "use strict";

    const data = Object.freeze([
      {
        kind: "layout",
        zero: 0,
        one: 1,
        canvasW: 1200,
        canvasH: 440,
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1,
        cornerX: 24,
        cornerY: 20,
        cornerW: 202,
        cornerH: 38,
        cornerTextX: 125,
        cornerTextY: 39,
        gridX: 244,
        gridY: 68,
        cellW: 296,
        cellH: 98,
        gapX: 12,
        gapY: 10,
        rowX: 24,
        rowW: 202,
        radiusX: 9,
        radiusY: 9,
        headerY: 39,
        rowTextX: 16,
        rowTitleY: 34,
        rowNoteY: 61,
        iconX: 23,
        iconY: 29,
        iconR: 12,
        answerX: 46,
        answerY: 25,
        statusY: 49,
        noteX: 18,
        noteY: 76,
        legendY: 418,
        legendMarkX: 244,
        legendTextX: 265,
        legendSecondMarkX: 638,
        legendSecondTextX: 659
      },
      { kind: "column", col: 0, label: "plurality" },
      { kind: "column", col: 1, label: "CP-WBFT" },
      { kind: "column", col: 2, label: "DecentLLMs" },

      {
        kind: "row",
        row: 0,
        label: "BYZANTINE",
        note: "один намеренно плохой голос"
      },
      {
        kind: "row",
        row: 1,
        label: "SYCOPHANCY",
        note: "копирование чужой позиции"
      },
      {
        kind: "row",
        row: 2,
        label: "MONOCULTURE",
        note: "три агента — общая ошибка"
      },

      {
        kind: "cell",
        row: 0,
        col: 0,
        ok: true,
        answer: "Верный ответ",
        status: "✓ правильно",
        note: "Большинство остаётся честным"
      },
      {
        kind: "cell",
        row: 0,
        col: 1,
        ok: true,
        answer: "Верный ответ",
        status: "✓ правильно",
        note: "Один плохой голос изолирован"
      },
      {
        kind: "cell",
        row: 0,
        col: 2,
        ok: true,
        answer: "Верный ответ",
        status: "✓ правильно",
        note: "Медиана в честном кластере"
      },

      {
        kind: "cell",
        row: 1,
        col: 0,
        ok: false,
        answer: "Ошибочный ответ",
        status: "✕ неправильно",
        note: "Копия усиливает плохую позицию"
      },
      {
        kind: "cell",
        row: 1,
        col: 1,
        ok: true,
        answer: "Верный ответ",
        status: "✓ правильно",
        note: "Уверенность ослабляет копию"
      },
      {
        kind: "cell",
        row: 1,
        col: 2,
        ok: true,
        answer: "Верный ответ",
        status: "✓ правильно",
        note: "Честный кластер плотнее"
      },

      {
        kind: "cell",
        row: 2,
        col: 0,
        ok: false,
        answer: "Ошибочный ответ",
        status: "✕ неправильно",
        note: "Крупнейший кластер ошибочен"
      },
      {
        kind: "cell",
        row: 2,
        col: 1,
        ok: false,
        answer: "Ошибочный ответ",
        status: "✕ неправильно",
        note: "Суммарный вес не доказывает истину"
      },
      {
        kind: "cell",
        row: 2,
        col: 2,
        ok: false,
        answer: "Ошибочный ответ",
        status: "✕ неправильно",
        note: "3 из 5 смещают медиану"
      }
    ]);

    const layout = data.find(item => item.kind === "layout");
    const origin = Object.freeze({
      x: layout.originX,
      y: layout.originY
    });
    const scale = Object.freeze({
      x: layout.scaleX,
      y: layout.scaleY
    });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const stage = document.getElementById("stage");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attributes, className) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (className) node.setAttribute("class", className);
        return node;
      };

      const addText = (parent, text, x, y, className, anchor) => {
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, className);
        node.textContent = text;
        parent.appendChild(node);
        return node;
      };

      const svg = make("svg", {
        viewBox:
          sx(layout.zero) + " " +
          sy(layout.zero) + " " +
          (sx(layout.canvasW) - sx(layout.zero)) + " " +
          (sy(layout.canvasH) - sy(layout.zero)),
        width: layout.canvasW,
        height: layout.canvasH,
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "diagram-title diagram-desc"
      });

      const title = make("title", { id: "diagram-title" });
      title.textContent = "Матрица трёх атак и трёх методов консенсуса";
      svg.appendChild(title);

      const description = make("desc", { id: "diagram-desc" });
      description.textContent =
        "Девять клеток показывают итоговый ответ и его правильность для атак " +
        "byzantine, sycophancy и monoculture при plurality, CP-WBFT и DecentLLMs.";
      svg.appendChild(description);

      const corner = make("rect", {
        x: sx(layout.cornerX),
        y: sy(layout.cornerY),
        width: sx(layout.cornerW) - sx(layout.zero),
        height: sy(layout.cornerH) - sy(layout.zero),
        rx: sx(layout.radiusX) - sx(layout.zero),
        ry: sy(layout.radiusY) - sy(layout.zero)
      }, "corner");
      svg.appendChild(corner);

      addText(
        svg,
        "АТАКА ↓  ·  МЕТОД →",
        layout.cornerTextX,
        layout.cornerTextY,
        "header-note",
        "middle"
      );

      data
        .filter(item => item.kind === "column")
        .forEach(column => {
          const x =
            layout.gridX +
            column.col * (layout.cellW + layout.gapX) +
            layout.cellW / (layout.one + layout.one);

          addText(
            svg,
            column.label,
            x,
            layout.headerY,
            "header",
            "middle"
          );
        });

      data
        .filter(item => item.kind === "row")
        .forEach(row => {
          const y =
            layout.gridY +
            row.row * (layout.cellH + layout.gapY);

          svg.appendChild(make("rect", {
            x: sx(layout.rowX),
            y: sy(y),
            width: sx(layout.rowW) - sx(layout.zero),
            height: sy(layout.cellH) - sy(layout.zero),
            rx: sx(layout.radiusX) - sx(layout.zero),
            ry: sy(layout.radiusY) - sy(layout.zero)
          }, "row-box"));

          addText(
            svg,
            row.label,
            layout.rowX + layout.rowTextX,
            y + layout.rowTitleY,
            "row-title",
            "start"
          );

          addText(
            svg,
            row.note,
            layout.rowX + layout.rowTextX,
            y + layout.rowNoteY,
            "row-note",
            "start"
          );
        });

      data
        .filter(item => item.kind === "cell")
        .forEach(cell => {
          const x =
            layout.gridX +
            cell.col * (layout.cellW + layout.gapX);
          const y =
            layout.gridY +
            cell.row * (layout.cellH + layout.gapY);
          const state = cell.ok ? "good" : "bad";

          svg.appendChild(make("rect", {
            x: sx(x),
            y: sy(y),
            width: sx(layout.cellW) - sx(layout.zero),
            height: sy(layout.cellH) - sy(layout.zero),
            rx: sx(layout.radiusX) - sx(layout.zero),
            ry: sy(layout.radiusY) - sy(layout.zero)
          }, "cell " + state));

          svg.appendChild(make("circle", {
            cx: sx(x + layout.iconX),
            cy: sy(y + layout.iconY),
            r: sx(layout.iconR) - sx(layout.zero)
          }, cell.ok ? "icon-good" : "icon-bad"));

          addText(
            svg,
            cell.ok ? "✓" : "×",
            x + layout.iconX,
            y + layout.iconY,
            "icon-mark",
            "middle"
          );

          addText(
            svg,
            cell.answer,
            x + layout.answerX,
            y + layout.answerY,
            "answer",
            "start"
          );

          addText(
            svg,
            cell.status,
            x + layout.answerX,
            y + layout.statusY,
            cell.ok ? "status-good" : "status-bad",
            "start"
          );

          addText(
            svg,
            cell.note,
            x + layout.noteX,
            y + layout.noteY,
            "cell-note",
            "start"
          );
        });

      addText(
        svg,
        "✓",
        layout.legendMarkX,
        layout.legendY,
        "legend-good",
        "start"
      );
      addText(
        svg,
        "предположение метода сохранилось",
        layout.legendTextX,
        layout.legendY,
        "legend",
        "start"
      );
      addText(
        svg,
        "×",
        layout.legendSecondMarkX,
        layout.legendY,
        "legend-bad",
        "start"
      );
      addText(
        svg,
        "предположение метода сломалось",
        layout.legendSecondTextX,
        layout.legendY,
        "legend",
        "start"
      );

      stage.replaceChildren(svg);
    } catch (error) {
      const stage = document.getElementById("stage");
      stage.className = "fallback";
      stage.textContent =
        "Схема должна была показать таблицу 3 × 3: атаки byzantine, " +
        "sycophancy и monoculture по строкам; plurality, CP-WBFT и " +
        "DecentLLMs по столбцам; в каждой клетке — итоговый ответ и " +
        "отметка правильности.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
