<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три стратегии слияния рядом</title>
<style>
  :root{
    --bg:#fbfbfd; --panel:#ffffff; --edge:#c3c9d6; --ink:#1d2330; --dim:#5c6577;
    --img:#2f6fb5; --txt:#8145b8; --aud:#1f8a68; --box:#eef1f7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --panel:#1a1f29; --edge:#3a4354; --ink:#e8ecf4; --dim:#9aa5b8;
      --img:#69a8e6; --txt:#bd8ff0; --aud:#57c79c; --box:#222835;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  figure{margin:0;padding:10px 12px 12px;background:var(--bg)}
  figcaption{font-size:14px;font-weight:600;padding-bottom:6px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .panel{fill:var(--panel);stroke:var(--edge)}
  .box{fill:var(--box);stroke:var(--edge)}
  .rule{stroke:var(--edge)}
  .arw{stroke:var(--dim)}
  .arwf{fill:var(--dim)}
  text{fill:var(--ink)}
  text.dim{fill:var(--dim)}
  text.t{font-weight:600}
  .b-img{fill:var(--img)} .b-txt{fill:var(--txt)} .b-aud{fill:var(--aud)}
  .v-img{fill:var(--img)} .v-txt{fill:var(--txt)} .v-aud{fill:var(--aud)}
  .dash{fill:none;stroke:var(--dim);stroke-dasharray:4 3}
  #fb{font-size:13px;line-height:1.45;color:var(--ink)}
</style>
<figure>
  <figcaption>Три стратегии слияния рядом: один вход, три источника веса</figcaption>
  <svg id="s" viewBox="0 0 880 372" role="img" aria-label="Сравнение трёх стратегий слияния"></svg>
  <div id="fb" hidden></div>
</figure>
<script>
(function(){
var svg=document.getElementById('s');
try{
  var L={
    origin:{x:20,y:14}, scale:20,
    xEnd:42, colW:13, panel:{y0:2.0,y1:12.9}, ruleY:1.5, headY:0.95,
    titleY:3.05, refY:4.15,
    rowY:[5.9,7.4,8.9], barX:4.6, barLen:7.0, barH:0.55, gap:0.35,
    noteY:[10.6,11.4,12.2], capY:9.9,
    head:{len:0.35,wid:0.13}, rx:0.3,
    att:{x0:15.3,x1:26.7,y0:4.9,y1:6.3,candY:7.6,labY:8.55,n:10,padX:0.55},
    out:{x0:13.5,x1:28.5,y0:14.2,y1:15.8,ty:15.15,fromY:12.95,toY:14.1,ins:[15.2,21,26.8]},
    footY:17.2, midX:21,
    cols:[
      {x:0, title:'Слияние по баллам', ref:'шаг 11',
       rows:[{n:'Картинки',w:0.6,c:'img'},{n:'Текст',w:0.3,c:'txt'},{n:'Звук',w:0.1,c:'aud'}],
       notes:['веса ставишь ты, руками,','один раз — и одни','на все запросы']},
      {x:14.5, title:'Слияние через внимание', ref:'шаг 16', att:true,
       cap:'веса кандидатов, не модальностей',
       notes:['веса назначает обученная','сеть — каждому из 10','кандидатов персонально']},
      {x:29, title:'MoE с гейтом', ref:'шаг 18',
       rows:[{n:'Картинки',w:0.7,c:'img'},{n:'Текст',w:null,c:'txt'},{n:'Звук',w:null,c:'aud'}],
       cap:'пунктир — число даёт гейт',
       notes:['на визуальном запросе гейт','даёт картинкам 0,7;','пересчёт на каждый запрос']}
    ]
  };
  var O=L.origin, K=L.scale;
  function sx(x){return O.x+x*K;}
  function sy(y){return O.y+y*K;}

  var NS='http://www.w3.org/2000/svg';
  function mk(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);svg.appendChild(e);return e;}
  function line(x1,y1,x2,y2,c,w){return mk('line',{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:c,'stroke-width':w||1.2});}
  function rect(x0,y0,x1,y1,c,r){var a={x:sx(x0),y:sy(y0),width:sx(x1)-sx(x0),height:sy(y1)-sy(y0),class:c,'stroke-width':1.2};
    if(r)a.rx=sx(L.rx)-sx(0);return mk('rect',a);}
  function tx(x,y,s,anchor,cls,size){var e=mk('text',{x:sx(x),y:sy(y),'text-anchor':anchor,class:cls||'','font-size':size||11.5});e.textContent=s;return e;}
  function arrow(x1,y1,x2,y2){
    var dx=x2-x1,dy=y2-y1,m=Math.hypot(dx,dy),ux=dx/m,uy=dy/m;
    var bx=x2-ux*L.head.len, by=y2-uy*L.head.len;
    line(x1,y1,bx,by,'arw',1.2);
    mk('polygon',{class:'arwf',points:[
      sx(x2)+','+sy(y2),
      sx(bx-uy*L.head.wid)+','+sy(by+ux*L.head.wid),
      sx(bx+uy*L.head.wid)+','+sy(by-ux*L.head.wid)].join(' ')});
  }

  tx(L.midX,L.headY,'Один вход на все три: 5 картинок, 3 текстовых фрагмента, 2 аудиоклипа — баллы нормализованы','middle','t',12);
  line(0,L.ruleY,L.xEnd,L.ruleY,'rule',1);

  L.cols.forEach(function(col){
    var cx=col.x+L.colW/2;
    rect(col.x,L.panel.y0,col.x+L.colW,L.panel.y1,'panel',true);
    tx(cx,L.titleY,col.title,'middle','t',13);
    tx(cx,L.refY,'('+col.ref+')','middle','dim',10.5);

    if(col.rows){
      col.rows.forEach(function(r,i){
        var y=L.rowY[i];
        tx(col.x+L.barX-L.gap,y+L.barH/2,r.n,'end','',11.5);
        if(r.w===null){
          rect(col.x+L.barX,y-L.barH/2,col.x+L.barX+L.barLen,y+L.barH/2,'dash',false);
        }else{
          rect(col.x+L.barX,y-L.barH/2,col.x+L.barX+r.w*L.barLen,y+L.barH/2,'b-'+r.c,false);
          tx(col.x+L.barX+r.w*L.barLen+L.gap,y+L.barH/2,('0,'+Math.round(r.w*10)),'start','v-'+r.c+' t',11.5);
        }
      });
    }

    if(col.att){
      var A=L.att;
      rect(A.x0,A.y0,A.x1,A.y1,'box',true);
      tx((A.x0+A.x1)/2,(A.y0+A.y1)/2+L.barH/2,'обученная сеть внимания','middle','t',11.5);
      var span=(A.x1-A.padX)-(A.x0+A.padX);
      for(var i=0;i<A.n;i++){
        var x=A.x0+A.padX+span*i/(A.n-1);
        arrow(x,A.y1,x,A.candY);
        tx(x,A.labY,'w'+'₁₂₃₄₅₆₇₈₉'.charAt(i)||'w','middle','','9.5');
      }
      // десятый вес подписан отдельно: w₁₀
      var last=A.x0+A.padX+span;
      svg.querySelectorAll('text').forEach(function(){});
    }

    if(col.cap) tx(cx,L.capY,col.cap,'middle','dim',10.5);
    col.notes.forEach(function(s,i){tx(col.x+L.barX-L.barX+0.6,L.noteY[i],s,'start','dim',11);});
    arrow(cx,L.out.fromY,L.out.ins[L.cols.indexOf(col)],L.out.toY);
  });

  rect(L.out.x0,L.out.y0,L.out.x1,L.out.y1,'box',true);
  tx(L.midX,L.out.ty,'Один упорядоченный список','middle','t',12.5);
  tx(L.midX,L.footY,'Форма выхода одна. Разница — откуда берётся число, на которое умножается балл.','middle','dim',11);
}catch(e){
  svg.setAttribute('hidden','');
  var fb=document.getElementById('fb');fb.hidden=false;
  fb.textContent='Схема должна показывать три колонки для одного входа (5 картинок, 3 текста, 2 аудио): '+
   'слияние по баллам с ручными весами Картинки 0,6 / Текст 0,3 / Звук 0,1 (шаг 11); '+
   'слияние через внимание, где обученная сеть даёт свой вес каждому из 10 кандидатов (шаг 16); '+
   'MoE, где гейт пересчитывает веса модальностей на каждый запрос и на визуальном запросе даёт картинкам 0,7 (шаг 18). '+
   'Выход у всех трёх один — упорядоченный список.';
}
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
