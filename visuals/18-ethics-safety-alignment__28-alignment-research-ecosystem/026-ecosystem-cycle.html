<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Замкнутый цикл кадров и исследований</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #536078;
      --line: #4458bd;
      --line-soft: #dce3ff;
      --training: #e8edff;
      --placement: #e6f6f0;
      --publication: #fff0d9;
      --return: #f2e9ff;
      --inside: #d9e3ff;
      --outside: #d9f3e8;
      --accent: #283fae;
      --shadow: #cbd3e6;
      --error: #8c2c38;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111521;
        --panel: #191f2d;
        --ink: #f2f5ff;
        --muted: #b9c2d8;
        --line: #9cacff;
        --line-soft: #313b66;
        --training: #242e59;
        --placement: #183d35;
        --publication: #4a351d;
        --return: #38264f;
        --inside: #293761;
        --outside: #21483d;
        --accent: #bec8ff;
        --shadow: #080b12;
        --error: #ffabb5;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 10px;
    }

    .figure {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 2px solid var(--line-soft);
      box-shadow: 0 3px 14px var(--shadow);
    }

    .heading {
      margin: 0;
      padding: 12px 18px 4px;
      font-size: 20px;
      line-height: 1.15;
      text-align: center;
    }

    .subheading {
      margin: 0;
      padding: 2px 18px 5px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.25;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--panel);
    }

    .node {
      stroke: var(--line);
      stroke-width: 2px;
    }

    .node.training {
      fill: var(--training);
    }

    .node.placement {
      fill: var(--placement);
    }

    .node.publication {
      fill: var(--publication);
    }

    .node.return {
      fill: var(--return);
    }

    .band.inside {
      fill: var(--inside);
    }

    .band.outside {
      fill: var(--outside);
    }

    .divider {
      stroke: var(--line);
      stroke-width: 1px;
    }

    .arrow {
      fill: none;
      stroke: var(--line);
      stroke-width: 5px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrowhead {
      fill: var(--line);
    }

    .node-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .node-copy {
      fill: var(--ink);
      font-size: 14px;
    }

    .node-note {
      fill: var(--muted);
      font-size: 13px;
    }

    .arrow-label {
      fill: var(--accent);
      font-size: 13px;
      font-weight: bold;
    }

    .cycle-note {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .cycle-subnote {
      fill: var(--muted);
      font-size: 13px;
    }

    .fallback {
      display: none;
      margin: 12px 18px 18px;
      padding: 12px;
      color: var(--error);
      border: 2px solid var(--error);
      font-size: 15px;
      line-height: 1.4;
    }

    noscript p {
      margin: 12px 18px 18px;
      padding: 12px;
      color: var(--error);
      border: 2px solid var(--error);
      font-size: 15px;
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-title diagram-caption">
    <h1 class="heading" id="diagram-title">Замкнутый цикл кадров и исследований</h1>
    <p class="subheading" id="diagram-caption">
      Обучение возвращает в следующую когорту накопленные знания и опыт наставников
    </p>

    <svg
      id="diagram"
      viewBox="0 0 1000 470"
      width="1000"
      height="470"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Круг из четырёх стрелок: MATS обучает исследователей 10–12 недель, выпускники распределяются по лабораториям и внешним оценщикам, организации публикуют результаты, а авторы и методы возвращаются в MATS для следующей когорты."
    ></svg>

    <div class="fallback" id="fallback" role="alert"></div>
    <noscript>
      <p>
        Схема должна была показать цикл: MATS обучает исследователей 10–12 недель,
        выпускники переходят в лаборатории и к внешним оценщикам, организации
        публикуют результаты, а авторы возвращаются менторами следующей когорты.
      </p>
    </noscript>
  </figure>

  <script>
    const data = Object.freeze({
      canvas: { x1: 0, y1: 0, x2: 1000, y2: 470 },

      nodes: [
        {
          kind: "training",
          box: { x1: 330, y1: 28, x2: 670, y2: 124, r: 18 },
          texts: [
            { value: "MATS", x: 500, y: 58, role: "node-title", anchor: "middle" },
            { value: "обучает исследователей", x: 500, y: 82, role: "node-copy", anchor: "middle" },
            { value: "10–12 недель", x: 500, y: 105, role: "node-note", anchor: "middle" }
          ]
        },
        {
          kind: "placement",
          box: { x1: 700, y1: 164, x2: 970, y2: 314, r: 18 },
          divider: { x1: 700, y1: 212, x2: 970, y2: 212 },
          bands: [
            { kind: "inside", box: { x1: 714, y1: 222, x2: 956, y2: 260, r: 10 } },
            { kind: "outside", box: { x1: 714, y1: 266, x2: 956, y2: 304, r: 10 } }
          ],
          texts: [
            { value: "Распределение", x: 835, y: 193, role: "node-title", anchor: "middle" },
            { value: "Лаборатории", x: 727, y: 239, role: "node-copy", anchor: "start" },
            { value: "Anthropic · DeepMind · OpenAI", x: 727, y: 253, role: "node-note", anchor: "start" },
            { value: "Внешняя оценка", x: 727, y: 283, role: "node-copy", anchor: "start" },
            { value: "Redwood · Apollo · METR · Eleos", x: 727, y: 297, role: "node-note", anchor: "start" }
          ]
        },
        {
          kind: "publication",
          box: { x1: 330, y1: 352, x2: 670, y2: 442, r: 18 },
          texts: [
            { value: "Результаты и публикации", x: 500, y: 383, role: "node-title", anchor: "middle" },
            { value: "лаборатории · внешние оценщики", x: 500, y: 407, role: "node-copy", anchor: "middle" },
            { value: "UK AISI · CAISI", x: 500, y: 429, role: "node-note", anchor: "middle" }
          ]
        },
        {
          kind: "return",
          box: { x1: 30, y1: 164, x2: 300, y2: 314, r: 18 },
          texts: [
            { value: "Возврат в MATS", x: 165, y: 198, role: "node-title", anchor: "middle" },
            { value: "авторы становятся менторами", x: 165, y: 230, role: "node-copy", anchor: "middle" },
            { value: "методы и вопросы переходят", x: 165, y: 258, role: "node-copy", anchor: "middle" },
            { value: "к следующей когорте", x: 165, y: 280, role: "node-note", anchor: "middle" }
          ]
        }
      ],

      arrows: [
        {
          path: {
            start: { x: 670, y: 76 },
            controlA: { x: 780, y: 76 },
            controlB: { x: 835, y: 108 },
            end: { x: 835, y: 164 }
          },
          head: [
            { x: 835, y: 164 },
            { x: 821, y: 140 },
            { x: 849, y: 140 }
          ],
          label: {
            value: "выпускает и распределяет",
            x: 716,
            y: 62,
            role: "arrow-label",
            anchor: "start"
          }
        },
        {
          path: {
            start: { x: 835, y: 314 },
            controlA: { x: 835, y: 356 },
            controlB: { x: 760, y: 397 },
            end: { x: 670, y: 397 }
          },
          head: [
            { x: 670, y: 397 },
            { x: 694, y: 383 },
            { x: 694, y: 411 }
          ],
          label: {
            value: "исследуют и публикуют",
            x: 827,
            y: 338,
            role: "arrow-label",
            anchor: "end"
          }
        },
        {
          path: {
            start: { x: 330, y: 397 },
            controlA: { x: 240, y: 397 },
            controlB: { x: 165, y: 356 },
            end: { x: 165, y: 314 }
          },
          head: [
            { x: 165, y: 314 },
            { x: 151, y: 338 },
            { x: 179, y: 338 }
          ],
          label: {
            value: "возвращают знания",
            x: 284,
            y: 422,
            role: "arrow-label",
            anchor: "end"
          }
        },
        {
          path: {
            start: { x: 165, y: 164 },
            controlA: { x: 165, y: 108 },
            controlB: { x: 220, y: 76 },
            end: { x: 330, y: 76 }
          },
          head: [
            { x: 330, y: 76 },
            { x: 306, y: 62 },
            { x: 306, y: 90 }
          ],
          label: {
            value: "обновляют наставничество",
            x: 284,
            y: 142,
            role: "arrow-label",
            anchor: "end"
          }
        }
      ],

      center: [
        { value: "≈ годовой ритм", x: 500, y: 222, role: "cycle-note", anchor: "middle" },
        { value: "летняя когорта → статьи к зиме", x: 500, y: 247, role: "cycle-subnote", anchor: "middle" },
        { value: "→ новые менторы следующим летом", x: 500, y: 268, role: "cycle-subnote", anchor: "middle" },
        { value: "каждый круг усиливает следующий", x: 500, y: 298, role: "cycle-note", anchor: "middle" }
      ]
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = 1;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    const canvasWidth = 1000;
    const canvasHeight = 470;
    const labelPadding = 10;
    const lineWidth = 2;
    const titleFontSize = 18;
    const copyFontSize = 14;

    try {
      const svg = document.getElementById("diagram");
      const namespace = "http://www.w3.org/2000/svg";

      const element = (name, attributes = {}) => {
        const item = document.createElementNS(namespace, name);
        for (const [key, value] of Object.entries(attributes)) {
          item.setAttribute(key, String(value));
        }
        return item;
      };

      const appendText = (parent, item) => {
        const text = element("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: item.role,
          "text-anchor": item.anchor,
          "dominant-baseline": "middle"
        });
        text.textContent = item.value;
        parent.appendChild(text);
      };

      const appendBox = (parent, box, className) => {
        parent.appendChild(element("rect", {
          x: sx(box.x1),
          y: sy(box.y1),
          width: sx(box.x2) - sx(box.x1),
          height: sy(box.y2) - sy(box.y1),
          rx: sx(box.r) - sx(0),
          ry: sy(box.r) - sy(0),
          class: className
        }));
      };

      svg.appendChild(element("rect", {
        x: sx(data.canvas.x1),
        y: sy(data.canvas.y1),
        width: sx(data.canvas.x2) - sx(data.canvas.x1),
        height: sy(data.canvas.y2) - sy(data.canvas.y1),
        fill: "var(--panel)"
      }));

      const arrowsLayer = element("g", { "aria-hidden": "true" });
      for (const arrow of data.arrows) {
        const p = arrow.path;
        arrowsLayer.appendChild(element("path", {
          d:
            `M ${sx(p.start.x)} ${sy(p.start.y)} ` +
            `C ${sx(p.controlA.x)} ${sy(p.controlA.y)}, ` +
            `${sx(p.controlB.x)} ${sy(p.controlB.y)}, ` +
            `${sx(p.end.x)} ${sy(p.end.y)}`,
          class: "arrow"
        }));

        arrowsLayer.appendChild(element("polygon", {
          points: arrow.head
            .map(point => `${sx(point.x)},${sy(point.y)}`)
            .join(" "),
          class: "arrowhead"
        }));

        appendText(arrowsLayer, arrow.label);
      }
      svg.appendChild(arrowsLayer);

      const nodesLayer = element("g");
      for (const node of data.nodes) {
        const group = element("g", {
          role: "group",
          "aria-label": node.texts.map(item => item.value).join(". ")
        });

        appendBox(group, node.box, `node ${node.kind}`);

        if (node.bands) {
          for (const band of node.bands) {
            appendBox(group, band.box, `band ${band.kind}`);
          }
        }

        if (node.divider) {
          group.appendChild(element("line", {
            x1: sx(node.divider.x1),
            y1: sy(node.divider.y1),
            x2: sx(node.divider.x2),
            y2: sy(node.divider.y2),
            class: "divider"
          }));
        }

        for (const text of node.texts) {
          appendText(group, text);
        }

        nodesLayer.appendChild(group);
      }
      svg.appendChild(nodesLayer);

      const centerLayer = element("g", {
        role: "group",
        "aria-label": "Примерно годовой ритм: летняя когорта, статьи к зиме и новые менторы следующим летом."
      });
      for (const text of data.center) {
        appendText(centerLayer, text);
      }
      svg.appendChild(centerLayer);

      svg.setAttribute("data-canvas-width", String(canvasWidth));
      svg.setAttribute("data-canvas-height", String(canvasHeight));
      svg.setAttribute("data-label-padding", String(labelPadding));
      svg.setAttribute("data-line-width", String(lineWidth));
      svg.setAttribute("data-title-font-size", String(titleFontSize));
      svg.setAttribute("data-copy-font-size", String(copyFontSize));
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.style.display = "block";
      fallback.textContent =
        "Схема должна была показать замкнутый цикл: MATS обучает исследователей " +
        "10–12 недель, выпускники распределяются по лабораториям и внешним " +
        "оценщикам, организации публикуют результаты, а авторы, методы и новые " +
        "вопросы возвращаются в следующую когорту вместе с будущими менторами.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
