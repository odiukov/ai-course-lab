<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>9 тайлов: MLP против Q-Former</title>
<style>
:root{--bg:#fdfdfb;--fg:#1b1c1e;--mut:#5d6066;--line:#3a3d42;--tile:#e6ecf5;--tileEd:#8fa6c4;--mlp:#c9522e;--qf:#1a7a58;--barbg:#e9eaec}
@media (prefers-color-scheme:dark){:root{--bg:#15171a;--fg:#eceef1;--mut:#a4a9b1;--line:#c3c8d0;--tile:#233043;--tileEd:#5f7fa8;--mlp:#ff8a5f;--qf:#4fd6a4;--barbg:#2a2d32}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 8px}
h2{font-size:16px;margin:0 0 4px;font-weight:600}
svg{width:100%;height:auto;max-height:520px;display:block}
text{font-family:system-ui,-apple-system,sans-serif;fill:var(--fg)}
.mut{fill:var(--mut)}
.big{font-weight:600}
.fb{color:var(--mut);font-size:14px;padding:8px 2px}
</style>
<div class="wrap">
<h2>Нарезка на 9 тайлов: MLP отдаёт ≈6500 tokens, Q-Former — 64</h2>
<svg id="d" viewBox="0 0 960 452" role="img" aria-label="Схема: скриншот 1152 на 1152 режется на 9 тайлов; через MLP получается 9 × 729 ≈ 6500 tokens, через Q-Former — 64 tokens при любом числе тайлов"></svg>
<div id="fb"></div>
</div>
<script>
(function(){
var S=document.getElementById('d');
try{
  /* ---- данные схемы (единицы схемы, не пиксели) ---- */
  var D={
    n:3, cell:0.95, gx:13.6, gy:0.65,
    tilesN:9, perTile:729, mlpTok:6500, qfTok:64, ctx:8000, query:64,
    splitY:4.5, boxTop:5.5, boxBot:7.0, outTop:8.15, outBot:9.5,
    colL:7, colR:23, half:3.5, divY:9.85,
    bar:{x0:6,x1:24,h:0.65,yA:10.6,yB:11.9,head:10.1},
    legY:[13.15,13.7]
  };
  /* ---- единственный перевод в пиксели ---- */
  var origin={x:30,y:26}, scale=30;
  function sx(u){return origin.x+u*scale;}
  function sy(u){return origin.y+u*scale;}

  var NS='http://www.w3.org/2000/svg';
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);S.appendChild(e);return e;}
  function box(x,y,w,h,f,s){return el('rect',{x:sx(x),y:sy(y),width:sx(x+w)-sx(x),height:sy(y+h)-sy(y),rx:sx(0.12)-sx(0),fill:f,stroke:s,'stroke-width':1.7});}
  function tx(x,y,s,an,cls,fs){var e=el('text',{x:sx(x),y:sy(y),'text-anchor':an,'dominant-baseline':'middle','font-size':fs||14,'class':cls||''});e.textContent=s;return e;}
  function poly(pts,st){el('path',{d:pts.map(function(p,i){return (i?'L':'M')+sx(p[0])+' '+sy(p[1]);}).join(' '),fill:'none',stroke:st||'var(--line)','stroke-width':1.8});}
  function head(x,y){el('polygon',{points:[[x-0.19,y-0.38],[x+0.19,y-0.38],[x,y]].map(function(p){return sx(p[0])+','+sy(p[1]);}).join(' '),fill:'var(--line)'});}

  /* ---- вход: скриншот, нарезанный 3x3 ---- */
  tx(15,0.2,'Скриншот 1152×1152, энкодер берёт только 384×384','middle','',14);
  for(var r=0;r<D.n;r++)for(var c=0;c<D.n;c++)
    box(D.gx+c*D.cell,D.gy+r*D.cell,D.cell,D.cell,'var(--tile)','var(--tileEd)');
  var gRight=D.gx+D.n*D.cell, gBot=D.gy+D.n*D.cell;
  tx(gRight+0.35,1.3,'нарезка 3×3 = 9 тайлов','start','',13.5);
  tx(gRight+0.35,1.9,'1 тайл = сетка патчей 27×27','start','mut',13);
  tx(gRight+0.35,2.5,'= 729 патч-tokens','start','mut',13);

  /* ---- развилка на два коннектора ---- */
  [D.colL,D.colR].forEach(function(cx){
    poly([[15,gBot+0.1],[15,D.splitY],[cx,D.splitY],[cx,D.boxTop-0.38]]);
    head(cx,D.boxTop);
  });

  /* ---- коннекторы ---- */
  box(D.colL-D.half,D.boxTop,D.half*2,D.boxBot-D.boxTop,'none','var(--mlp)');
  tx(D.colL,6.0,'Коннектор: MLP','middle','',16);
  tx(D.colL,6.55,'все патч-tokens дальше','middle','mut',12.5);
  box(D.colR-D.half,D.boxTop,D.half*2,D.boxBot-D.boxTop,'none','var(--qf)');
  tx(D.colR,6.0,'Коннектор: Q-Former','middle','',16);
  tx(D.colR,6.55,D.query+' query, фиксировано','middle','mut',12.5);

  /* ---- к выходу ---- */
  poly([[D.colL,D.boxBot],[D.colL,D.outTop-0.38]]); head(D.colL,D.outTop);
  tx(D.colL-0.3,7.55,'9 × 729','end','mut',12.5);
  poly([[D.colR,D.boxBot],[D.colR,D.outTop-0.38]]); head(D.colR,D.outTop);
  tx(D.colR-0.3,7.55,'сжатие','end','mut',12.5);

  /* ---- выход в tokens ---- */
  box(D.colL-D.half,D.outTop,D.half*2,D.outBot-D.outTop,'var(--mlp)','var(--mlp)').setAttribute('fill-opacity',0.18);
  tx(D.colL,8.7,'≈ '+D.mlpTok+' tokens','middle','big',18);
  tx(D.colL,9.22,'растёт с числом тайлов','middle','mut',12.5);
  box(D.colR-D.half,D.outTop,D.half*2,D.outBot-D.outTop,'var(--qf)','var(--qf)').setAttribute('fill-opacity',0.18);
  tx(D.colR,8.7,D.qfTok+' tokens','middle','big',18);
  tx(D.colR,9.22,'не зависит от числа тайлов','middle','mut',12.5);

  /* ---- что это делает с контекстом ---- */
  var B=D.bar, w=B.x1-B.x0;
  el('path',{d:'M'+sx(D.colL-D.half)+' '+sy(D.divY)+'L'+sx(D.colR+D.half)+' '+sy(D.divY),
    stroke:'var(--mut)','stroke-width':1,'stroke-dasharray':(sx(0.2)-sx(0))+' '+(sx(0.2)-sx(0)),opacity:0.5});
  tx(B.x0,B.head,'Контекст LLM — '+D.ctx+' tokens','start','mut',13);

  [{y:B.yA,t:D.mlpTok,c:'var(--mlp)',lab:'MLP'},
   {y:B.yB,t:D.qfTok,c:'var(--qf)',lab:'Q-Former'}].forEach(function(row){
    var mid=row.y+B.h/2, fw=w*row.t/D.ctx;
    box(B.x0,row.y,w,B.h,'var(--barbg)','var(--mut)');
    box(B.x0,row.y,fw,B.h,row.c,row.c).setAttribute('fill-opacity',0.4);
    tx(B.x0-0.3,mid,row.lab,'end','',13.5);
    tx(B.x1+0.3,mid,row.t+' из '+D.ctx,'start','big',13.5);
  });
  tx((B.x0+w*D.mlpTok/D.ctx)/2+B.x0/2,B.yA+B.h/2,'картинка','middle','mut',12.5);
  tx(B.x0+w*D.qfTok/D.ctx+0.25,B.yB+B.h/2,'свободно','start','mut',12.5);

  /* ---- легенда ---- */
  tx(15,D.legY[0],'MLP: 6500 из 8000 занято одной картинкой — на вопрос, историю и ответ остаётся крошка, вторая картинка уже не влезет.','middle','mut',13);
  tx(15,D.legY[1],'Q-Former: 64 tokens и при 9, и при 16 тайлах — но мелкий шрифт в таблице требует 2048+ tokens, и цифры из ячеек в 64 не влезают.','middle','mut',13);
}catch(e){
  S.remove();
  document.getElementById('fb').className='fb';
  document.getElementById('fb').textContent='Схема должна была показать: скриншот 1152×1152 режется на 9 тайлов по 384×384, каждый тайл — сетка патчей 27×27 = 729 патч-tokens. Через MLP наружу идут все патчи: 9 × 729 ≈ 6500 tokens, и это почти весь контекст в 8000 tokens. Через Q-Former с 64 query на выходе 64 tokens и при 9 тайлах, и при 16 — но мелкий шрифт в таблице требует 2048+ tokens, поэтому цифры из ячеек в такое сжатие не влезают.';
}
})();
</script>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
