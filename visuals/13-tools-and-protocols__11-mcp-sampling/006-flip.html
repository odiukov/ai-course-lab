<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Разворот стрелки</title>
<style>
  :root{
    --bg:#fbfbf8; --fg:#1d1d1f; --muted:#6a6a70;
    --cli:#1f5f9e; --srv:#a2531f; --line:#c9c9c4;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16171a; --fg:#eceef2; --muted:#9aa0aa;
      --cli:#7db6ec; --srv:#e6a76a; --line:#3a3d44;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:12px 14px 16px;}
  h2{font-size:15px;margin:0 0 8px;font-weight:650;}
  svg{display:block;width:100%;height:auto;max-height:520px;}
  .fail{border:1px solid var(--line);padding:10px;color:var(--muted);font-size:13px;}
  .lg{margin:6px 0 0;font-size:12.5px;color:var(--muted);}
  .lg b{color:var(--fg);font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <h2>Разворот стрелки: один вызов, две инициативы</h2>
  <div id="host"></div>
  <p class="lg" id="legend"><b>①</b> клиент→сервер: <code>tools/call</code> — инициатива у клиента.
  <b>②</b> сервер→клиент: <code>sampling/createMessage</code>, <code>id 42</code> принадлежит серверу — отвечает клиент. Обе стрелки живут внутри одного незакрытого вызова.</p>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    /* ---------- данные схемы (единственные литеральные координаты) ---------- */
    var COL={client:0, server:12};          // условные единицы по X
    var arrows=[
      {y:7, from:COL.client, to:COL.server, cls:'cli',
       label:'① tools/call — «опиши репозиторий»', side:'up'},
      {y:4, from:COL.server, to:COL.client, cls:'srv',
       label:'② sampling/createMessage · id 42 (сервер спрашивает)', side:'down'}
    ];
    var lanes={top:9, bottom:2};            // вертикальные границы «трубы»
    var boxW=3.4, boxH=1.5;

    /* ---------- одна пара функций перевода ---------- */
    var origin={x:150, y:250}, scale={x:44, y:44};
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    /* ---------- литералы, которые разрешены ---------- */
    var VB_W=880, VB_H=430, PAD=9, LW=2, FS=13, FSS=12;

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a)e.setAttribute(k,a[k]);return e;}
    function txt(x,y,s,anchor,cls,size){
      var t=el('text',{x:x,y:y,'text-anchor':anchor,'font-size':size||FS,
        'font-family':'system-ui,-apple-system,Segoe UI,sans-serif'});
      if(cls)t.setAttribute('class',cls);
      t.appendChild(document.createTextNode(s));return t;}

    var svg=el('svg',{viewBox:'0 0 '+VB_W+' '+VB_H,
      preserveAspectRatio:'xMidYMid meet',role:'img',
      'aria-label':'Две стрелки в одном соединении: tools/call от клиента к серверу и sampling/createMessage с id 42 от сервера к клиенту'});
    svg.appendChild(el('rect',{x:0,y:0,width:VB_W,height:VB_H,fill:'var(--bg)'}));

    /* ---------- труба: одно соединение ---------- */
    var pipeX1=sx(COL.client)+PAD, pipeX2=sx(COL.server)-PAD;
    svg.appendChild(el('rect',{x:pipeX1, y:sy(lanes.top),
      width:pipeX2-pipeX1, height:sy(lanes.bottom)-sy(lanes.top),
      rx:PAD, fill:'none', stroke:'var(--line)', 'stroke-width':LW,
      'stroke-dasharray':'6 5'}));
    svg.appendChild(txt((pipeX1+pipeX2)/2, sy(lanes.top)-PAD,
      'одно двустороннее соединение — вызов ещё не закрыт','middle','',FSS))
      .setAttribute('fill','var(--muted)');

    /* ---------- узлы ---------- */
    function node(cx, label, sub, cls){
      var g=el('g',{});
      g.appendChild(el('rect',{x:sx(cx)-scale.x*boxW/2, y:sy(lanes.top-boxH/2+2.5),
        width:scale.x*boxW, height:scale.y*boxH, rx:PAD,
        fill:'none', stroke:'var(--'+cls+')','stroke-width':LW}));
      var ty=sy(lanes.top+1.6);
      var a=txt(sx(cx), ty, label,'middle','',FS); a.setAttribute('fill','var(--'+cls+')');
      a.setAttribute('font-weight','650'); g.appendChild(a);
      var b=txt(sx(cx), ty+scale.y*0.45, sub,'middle','',FSS);
      b.setAttribute('fill','var(--muted)'); g.appendChild(b);
      return g;
    }
    svg.appendChild(node(COL.client,'Клиент','есть модель и ключи','cli'));
    svg.appendChild(node(COL.server,'Сервер','есть алгоритм, ключей нет','srv'));

    /* ---------- вертикальные ножки от узлов в трубу ---------- */
    [COL.client,COL.server].forEach(function(c,i){
      svg.appendChild(el('line',{x1:sx(c),y1:sy(lanes.top+1.9),
        x2:sx(c),y2:sy(lanes.bottom-0.6),
        stroke:'var(--'+(i?'srv':'cli')+')','stroke-width':LW,
        'stroke-opacity':'0.35'}));
    });

    /* ---------- стрелки ---------- */
    arrows.forEach(function(a){
      var y=sy(a.y), x1=sx(a.from), x2=sx(a.to);
      var dir=(x2>x1)?1:-1;
      var tipX=x2-dir*PAD*1.4, tailX=x1+dir*PAD*1.4;
      var col='var(--'+a.cls+')';
      svg.appendChild(el('line',{x1:tailX,y1:y,x2:tipX,y2:y,
        stroke:col,'stroke-width':LW+1,'stroke-linecap':'round'}));
      var hw=scale.y*0.24, hl=scale.x*0.32;
      svg.appendChild(el('polygon',{points:
        [tipX,y, tipX-dir*hl,y-hw, tipX-dir*hl,y+hw].join(' '),
        fill:col}));
      /* подпись у хвоста, разведена по разные стороны линии */
      var lx=tailX+dir*PAD, ly=(a.side==='up')?y-PAD*1.2:y+PAD*2.2;
      var t=txt(lx,ly,a.label,(dir>0)?'start':'end','',FS);
      t.setAttribute('fill',col); svg.appendChild(t);
    });

    /* ---------- ответ клиента: id 42 возвращается ---------- */
    var ry=sy((arrows[1].y+lanes.bottom)/2+0.1);
    var rx1=sx(COL.client)+PAD*1.4, rx2=sx(COL.server)-PAD*1.4;
    svg.appendChild(el('line',{x1:rx1,y1:ry,x2:rx2,y2:ry,
      stroke:'var(--cli)','stroke-width':LW,'stroke-dasharray':'5 4'}));
    svg.appendChild(el('polygon',{points:
      [rx2,ry, rx2-scale.x*0.28,ry-scale.y*0.2, rx2-scale.x*0.28,ry+scale.y*0.2].join(' '),
      fill:'var(--cli)'}));
    var rt=txt(rx1,ry+PAD*2.2,'ответ модели на id 42 — внутрь того же вызова','start','',FSS);
    rt.setAttribute('fill','var(--muted)'); svg.appendChild(rt);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема не построилась. Она должна была показать: '+
      'обычная стрелка <code>tools/call</code> идёт от клиента к серверу; '+
      'внутри того же незакрытого вызова сервер отправляет обратную стрелку '+
      '<code>sampling/createMessage</code> с <code>id 42</code>, который принадлежит серверу, '+
      'и отвечать на неё обязан клиент — своей моделью и своими ключами.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
