<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Карта: задача — метрика — лидерборд</title>
<style>
  :root{ --bg:#fbfaf7; --fg:#1d2330; --muted:#5c6577; --line:#c3cad6;
         --row:#eef1f6; --down:#b4472e; --up:#1f6f4a; --chip:#e3e9f2; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141821; --fg:#e8ecf4; --muted:#98a3b6; --line:#3b4557;
           --row:#1d2330; --down:#e08b6f; --up:#69c295; --chip:#26303f; }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:10px 12px 14px;
        font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  p.sub{margin:0 0 8px;font-size:12px;color:var(--muted)}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{font-size:13px;color:var(--muted)}
</style>
<div class="wrap">
  <h2>Карта: задача — метрика — лидерборд</h2>
  <p class="sub">Число живёт только вместе с задачей, направлением метрики и лидербордом.</p>
  <div id="host"><noscript class="fail">Таблица: задача → primary-метрика (направление) → secondary.</noscript></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    // ---------- данные ----------
    var ROWS=[
      ["ASR","WER","dn","CER · RTFx · задержка 1-го токена"],
      ["TTS","MOS / UTMOS","up","SECS · WER кругового прогона · CER · TTFA"],
      ["Клонирование голоса","SECS","up","MOS · CER"],
      ["Верификация диктора","EER","dn","minDCF · FAR / FRR"],
      ["Диаризация","DER","dn","JER · путаница дикторов"],
      ["Классификация аудио","top-1 · mAP","up","macro F1 · recall по классам"],
      ["Генерация музыки","FAD","dn","CLAP · MOS панели"],
      ["Audio language model","MMAU-Pro","up","LongAudioBench · AudioCaps FENSE"],
      ["Streaming S2S","задержка P50/P95","dn","WER · MOS"]
    ];
    var COLS=[
      {x:0.6,  t:"Задача",   a:"start"},
      {x:8.4,  t:"Primary",  a:"start"},
      {x:15.4, t:"↕",        a:"middle"},
      {x:16.6, t:"Secondary",a:"start"}
    ];

    // ---------- одна пара перевода ----------
    var ORIGIN={x:14,y:34}, SCALE={x:20.5,y:34};
    function sx(x){ return ORIGIN.x + x*SCALE.x; }
    function sy(y){ return ORIGIN.y + y*SCALE.y; }

    var W=740, H=430, PAD=4, FS=12.5;
    var NS="http://www.w3.org/2000/svg";
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function txt(x,y,s,anchor,cls,size){
      var t=el("text",{x:x,y:y,"text-anchor":anchor||"start",
        "font-size":(size||FS),"font-family":"system-ui,sans-serif"});
      if(cls)t.setAttribute("class",cls);
      t.appendChild(document.createTextNode(s)); return t;
    }

    var svg=el("svg",{viewBox:"0 0 "+W+" "+H,preserveAspectRatio:"xMidYMid meet",
                      role:"img","aria-label":"Матрица задач, primary- и secondary-метрик"});
    svg.appendChild(el("rect",{x:0,y:0,width:W,height:H,fill:"var(--bg)"}));

    // ---------- шапка ----------
    var yHead=-0.55, yRule=-0.18;
    COLS.forEach(function(c){
      svg.appendChild(txt(sx(c.x),sy(yHead),c.t,c.a,null,11.5)).setAttribute("fill","var(--muted)");
    });
    svg.appendChild(el("line",{x1:sx(0),y1:sy(yRule),x2:sx(34.2),y2:sy(yRule),
      stroke:"var(--line)","stroke-width":1.4}));

    // ---------- строки ----------
    ROWS.forEach(function(r,i){
      var yTop=i, yMid=i+0.5;
      if(i%2===0){
        svg.appendChild(el("rect",{x:sx(0),y:sy(yTop+0.06),
          width:sx(34.2)-sx(0),height:sy(yTop+0.94)-sy(yTop+0.06),
          fill:"var(--row)",rx:3}));
      }
      var task=txt(sx(COLS[0].x),sy(yMid)+PAD,r[0],"start",null,FS);
      task.setAttribute("fill","var(--fg)"); svg.appendChild(task);

      // primary — чип
      var chip=el("rect",{x:sx(COLS[1].x-0.25),y:sy(yMid-0.32),
        width:sx(6.4)-sx(0),height:sy(0.64)-sy(0),fill:"var(--chip)",rx:4});
      svg.appendChild(chip);
      var pm=txt(sx(COLS[1].x),sy(yMid)+PAD,r[1],"start",null,FS);
      pm.setAttribute("fill","var(--fg)"); pm.setAttribute("font-weight","600");
      svg.appendChild(pm);

      // направление
      var up=(r[2]==="up");
      var col=up?"var(--up)":"var(--down)";
      var ax=sx(COLS[2].x), y0=sy(yMid+0.26), y1=sy(yMid-0.26);
      var tail=up?y0:y1, head=up?y1:y0;
      svg.appendChild(el("line",{x1:ax,y1:tail,x2:ax,y2:head,stroke:col,"stroke-width":1.8}));
      var hw=sx(0.16)-sx(0), hl=sy(0.2)-sy(0);
      var dir=up?-1:1;
      svg.appendChild(el("polygon",{points:
        [ax,head, ax-hw,head-dir*hl, ax+hw,head-dir*hl].join(" "),fill:col}));

      var sec=txt(sx(COLS[3].x),sy(yMid)+PAD,r[3],"start",null,FS);
      sec.setAttribute("fill","var(--muted)"); svg.appendChild(sec);
    });

    var yBase=ROWS.length+0.02;
    svg.appendChild(el("line",{x1:sx(0),y1:sy(yBase),x2:sx(34.2),y2:sy(yBase),
      stroke:"var(--line)","stroke-width":1.4}));

    // ---------- легенда ----------
    var yL=yBase+0.62;
    function arrow(x,up){
      var col=up?"var(--up)":"var(--down)";
      var ax=sx(x), y0=sy(yL+0.2), y1=sy(yL-0.2);
      var tail=up?y0:y1, head=up?y1:y0, dir=up?-1:1;
      var hw=sx(0.16)-sx(0), hl=sy(0.18)-sy(0);
      svg.appendChild(el("line",{x1:ax,y1:tail,x2:ax,y2:head,stroke:col,"stroke-width":1.8}));
      svg.appendChild(el("polygon",{points:[ax,head, ax-hw,head-dir*hl, ax+hw,head-dir*hl].join(" "),fill:col}));
    }
    arrow(0.6,false);
    var l1=txt(sx(1.1),sy(yL)+PAD,"меньше — лучше (WER, CER, DER, EER, FAD, задержка)","start",null,11.5);
    l1.setAttribute("fill","var(--muted)"); svg.appendChild(l1);
    arrow(17.2,true);
    var l2=txt(sx(17.7),sy(yL)+PAD,"больше — лучше (MOS, UTMOS, SECS, mAP, RTFx)","start",null,11.5);
    l2.setAttribute("fill","var(--muted)"); svg.appendChild(l2);

    var l3=txt(sx(0.6),sy(yL+0.72)+PAD,
      "Лидерборд задаёт общие данные: Open ASR Leaderboard — WER 2%; UTMOS: F5-TTS 3.95 при 4.08 у живой записи.",
      "start",null,11.5);
    l3.setAttribute("fill","var(--muted)"); svg.appendChild(l3);

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема должна показывать таблицу: строка — задача '+
      '(ASR, TTS, клонирование, верификация, диаризация, классификация, музыка, LALM, streaming), '+
      'столбцы — одна primary-метрика (WER, MOS/UTMOS, SECS, EER, DER, mAP, FAD, MMAU-Pro, задержка P95), '+
      'её направление (WER, CER, DER, EER, FAD, задержка — меньше лучше; MOS, UTMOS, SECS, mAP, RTFx — больше лучше) '+
      'и три-четыре secondary-метрики рядом.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
