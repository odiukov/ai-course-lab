<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Девять вызовов при N=3 и R=2</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --ink: #172033;
      --muted: #5d687b;
      --line: #9aa7bb;
      --panel: #ffffff;
      --proposal: #e4efff;
      --proposal-line: #4c7fd1;
      --revision-one: #fff0cf;
      --revision-one-line: #c27a16;
      --revision-two: #e0f4e8;
      --revision-two-line: #39865b;
      --summary: #eef1f7;
      --summary-line: #536078;
      --shadow: #d6deea;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    figure {
      background: var(--page);
    }

    h2 {
      color: var(--ink);
      font-size: 18px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 440px;
      background: var(--page);
    }

    .sheet {
      fill: var(--page);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .panel-shadow {
      fill: var(--shadow);
    }

    .card {
      stroke-width: 2px;
    }

    .proposal .card {
      fill: var(--proposal);
      stroke: var(--proposal-line);
    }

    .revision-one .card {
      fill: var(--revision-one);
      stroke: var(--revision-one-line);
    }

    .revision-two .card {
      fill: var(--revision-two);
      stroke: var(--revision-two-line);
    }

    .proposal .call-dot {
      fill: var(--proposal-line);
    }

    .revision-one .call-dot {
      fill: var(--revision-one-line);
    }

    .revision-two .call-dot {
      fill: var(--revision-two-line);
    }

    .round-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    .round-subtitle,
    .top-note,
    .explanation {
      fill: var(--muted);
      font-size: 14px;
    }

    .card-label {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .counter {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .flow {
      fill: none;
      stroke: var(--summary-line);
      stroke-width: 2px;
      stroke-linecap: round;
    }

    .arrow-head {
      fill: var(--summary-line);
    }

    .divider {
      stroke: var(--line);
      stroke-width: 2px;
    }

    .summary-box {
      fill: var(--summary);
      stroke: var(--summary-line);
      stroke-width: 2px;
    }

    .summary-text {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
    }

    #fallback {
      display: none;
      color: var(--ink);
      background: var(--panel);
      font-size: 16px;
      text-align: center;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --ink: #edf2fa;
        --muted: #b2bdd0;
        --line: #536177;
        --panel: #192231;
        --proposal: #182e4a;
        --proposal-line: #74a6ed;
        --revision-one: #3b2c16;
        --revision-one-line: #e3a747;
        --revision-two: #193629;
        --revision-two-line: #68bd88;
        --summary: #202a3a;
        --summary-line: #9aa9c1;
        --shadow: #0b1018;
      }
    }
  </style>
</head>
<body>
  <figure aria-labelledby="diagram-title">
    <h2 id="diagram-title">Девять вызовов при N=3 и R=2</h2>
    <svg
      id="diagram"
      viewBox="0 0 960 440"
      width="960"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Три агента сначала параллельно создают три предложения, затем каждый
        агент по одному разу пересматривает ответ в каждом из двух раундов.
        Всего выполняется девять вызовов модели.
      </desc>
    </svg>
    <div id="fallback" role="img">
      Схема должна была показать три первоначальных предложения и по три
      пересмотра в двух раундах: всего 9 вызовов модели.
    </div>
  </figure>

  <script>
    const data = Object.freeze({
      canvas: { left: -40, top: -36, right: 920, bottom: 404 },
      background: { x: -40, y: -36, width: 960, height: 440 },
      top: {
        y: 8,
        leftX: 20,
        rightX: 880,
        leftText: "N=3 агента",
        rightText: "R=2 раунда пересмотра"
      },
      panel: {
        y: 38,
        width: 260,
        height: 250,
        radius: 14,
        shadow: 5,
        titleY: 64,
        subtitleY: 86,
        cardInset: 18,
        cardWidth: 224,
        cardHeight: 38,
        cardRadius: 9,
        cardYs: [100, 153, 206],
        dotOffsetX: 31,
        dotOffsetY: 19,
        dotRadius: 6,
        labelOffsetX: 50,
        counterY: 270
      },
      rounds: [
        {
          x: 20,
          tone: "proposal",
          title: "Раунд 0",
          subtitle: "3 параллельных предложения",
          action: "предложение",
          counter: "Счётчик: 3"
        },
        {
          x: 320,
          tone: "revision-one",
          title: "Раунд 1",
          subtitle: "3 пересмотра",
          action: "пересмотр",
          counter: "Счётчик: 6"
        },
        {
          x: 620,
          tone: "revision-two",
          title: "Раунд 2",
          subtitle: "3 пересмотра",
          action: "пересмотр",
          counter: "Счётчик: 9"
        }
      ],
      agents: ["Агент А", "Агент Б", "Агент В"],
      connectors: [
        { fromX: 280, toX: 320 },
        { fromX: 580, toX: 620 }
      ],
      arrow: { inset: 3, size: 7 },
      divider: { x1: 20, x2: 880, y: 309 },
      summary: {
        x: 215,
        y: 326,
        width: 470,
        height: 46,
        radius: 12,
        textX: 450,
        textY: 349,
        text: "3 + 3 + 3 = 9 вызовов модели"
      },
      explanation: {
        x: 450,
        y: 393,
        text: "Каждый пересмотр — один вызов: ответы двух коллег передаются сразу"
      }
    });

    const origin = Object.freeze({ x: 40, y: 36 });
    const scale = 1;

    const sx = x => origin.x + x * scale;
    const sy = y => origin.y + y * scale;

    try {
      const svg = document.getElementById("diagram");
      const ns = "http://www.w3.org/2000/svg";

      const make = (name, attributes, parent = svg) => {
        const node = document.createElementNS(ns, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        parent.appendChild(node);
        return node;
      };

      const rectangle = (parent, box, className, radius) =>
        make("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.width) - sx(box.x),
          height: sy(box.y + box.height) - sy(box.y),
          rx: sx(radius) - sx(0),
          class: className
        }, parent);

      const label = (parent, item) => {
        const node = make("text", {
          x: sx(item.x),
          y: sy(item.y),
          class: item.className,
          "text-anchor": item.anchor,
          "dominant-baseline": "middle"
        }, parent);
        node.textContent = item.text;
        return node;
      };

      const circle = (parent, point, radius, className) =>
        make("circle", {
          cx: sx(point.x),
          cy: sy(point.y),
          r: sx(radius) - sx(0),
          class: className
        }, parent);

      rectangle(
        svg,
        data.background,
        "sheet",
        data.panel.radius
      );

      label(svg, {
        x: data.top.leftX,
        y: data.top.y,
        text: data.top.leftText,
        className: "top-note",
        anchor: "start"
      });

      label(svg, {
        x: data.top.rightX,
        y: data.top.y,
        text: data.top.rightText,
        className: "top-note",
        anchor: "end"
      });

      data.rounds.forEach(round => {
        const group = make("g", { class: round.tone });

        rectangle(group, {
          x: round.x + data.panel.shadow,
          y: data.panel.y + data.panel.shadow,
          width: data.panel.width,
          height: data.panel.height
        }, "panel-shadow", data.panel.radius);

        rectangle(group, {
          x: round.x,
          y: data.panel.y,
          width: data.panel.width,
          height: data.panel.height
        }, "panel", data.panel.radius);

        label(group, {
          x: round.x + data.panel.width / scale / (scale + scale),
          y: data.panel.titleY,
          text: round.title,
          className: "round-title",
          anchor: "middle"
        });

        label(group, {
          x: round.x + data.panel.width / scale / (scale + scale),
          y: data.panel.subtitleY,
          text: round.subtitle,
          className: "round-subtitle",
          anchor: "middle"
        });

        data.panel.cardYs.forEach((cardY, agentIndex) => {
          rectangle(group, {
            x: round.x + data.panel.cardInset,
            y: cardY,
            width: data.panel.cardWidth,
            height: data.panel.cardHeight
          }, "card", data.panel.cardRadius);

          circle(group, {
            x: round.x + data.panel.dotOffsetX,
            y: cardY + data.panel.dotOffsetY
          }, data.panel.dotRadius, "call-dot");

          label(group, {
            x: round.x + data.panel.labelOffsetX,
            y: cardY + data.panel.dotOffsetY,
            text: data.agents[agentIndex] + " — " + round.action,
            className: "card-label",
            anchor: "start"
          });
        });

        label(group, {
          x: round.x + data.panel.width / scale / (scale + scale),
          y: data.panel.counterY,
          text: round.counter,
          className: "counter",
          anchor: "middle"
        });
      });

      data.connectors.forEach(connector => {
        data.panel.cardYs.forEach(cardY => {
          const flowY = cardY + data.panel.dotOffsetY;
          const endX = connector.toX - data.arrow.inset;

          make("line", {
            x1: sx(connector.fromX + data.arrow.inset),
            y1: sy(flowY),
            x2: sx(endX),
            y2: sy(flowY),
            class: "flow"
          });

          make("polygon", {
            points: [
              sx(endX) + "," + sy(flowY),
              sx(endX - data.arrow.size) + "," + sy(flowY - data.arrow.size),
              sx(endX - data.arrow.size) + "," + sy(flowY + data.arrow.size)
            ].join(" "),
            class: "arrow-head"
          });
        });
      });

      make("line", {
        x1: sx(data.divider.x1),
        y1: sy(data.divider.y),
        x2: sx(data.divider.x2),
        y2: sy(data.divider.y),
        class: "divider"
      });

      rectangle(
        svg,
        data.summary,
        "summary-box",
        data.summary.radius
      );

      label(svg, {
        x: data.summary.textX,
        y: data.summary.textY,
        text: data.summary.text,
        className: "summary-text",
        anchor: "middle"
      });

      label(svg, {
        x: data.explanation.x,
        y: data.explanation.y,
        text: data.explanation.text,
        className: "explanation",
        anchor: "middle"
      });
    } catch (error) {
      document.getElementById("diagram").style.display = "none";
      document.getElementById("fallback").style.display = "block";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
