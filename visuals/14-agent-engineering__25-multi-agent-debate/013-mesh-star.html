<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полный меш против звезды</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --ink: midnightblue;
      --muted: slategray;
      --border: lightsteelblue;
      --mesh: royalblue;
      --mesh-soft: lavender;
      --star: seagreen;
      --star-soft: honeydew;
      --edge: lightslategray;
      --comparison: aliceblue;
      --comparison-border: cornflowerblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: darkslategray;
        --ink: white;
        --muted: lightgray;
        --border: slategray;
        --mesh: lightskyblue;
        --mesh-soft: midnightblue;
        --star: aquamarine;
        --star-soft: darkgreen;
        --edge: lightsteelblue;
        --comparison: darkslateblue;
        --comparison-border: lightskyblue;
      }
    }

    html,
    body {
      margin: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure-title {
      margin: unset;
      padding: 10px 18px 8px;
      background: var(--page);
      color: var(--ink);
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--page);
      font-family: inherit;
      shape-rendering: geometricPrecision;
    }

    .panel {
      fill: var(--panel);
      stroke: var(--border);
      stroke-width: 2px;
    }

    .panel-title {
      fill: var(--ink);
      font-size: 23px;
      font-weight: bold;
      text-anchor: middle;
    }

    .panel-subtitle {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .round-box {
      fill: var(--page);
      stroke: var(--border);
      stroke-width: 1px;
    }

    .round-text {
      fill: var(--muted);
      font-size: 13px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .mesh-edge {
      stroke: var(--mesh);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .star-edge {
      stroke: var(--star);
      stroke-width: 3px;
      stroke-linecap: round;
    }

    .agent-mesh {
      fill: var(--mesh-soft);
      stroke: var(--mesh);
      stroke-width: 3px;
    }

    .agent-star {
      fill: var(--star-soft);
      stroke: var(--star);
      stroke-width: 3px;
    }

    .agent-hub {
      fill: var(--star);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .agent-letter {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .hub-letter {
      fill: white;
    }

    .network-note {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .metric-mesh {
      fill: var(--mesh-soft);
      stroke: var(--mesh);
      stroke-width: 2px;
    }

    .metric-star {
      fill: var(--star-soft);
      stroke: var(--star);
      stroke-width: 2px;
    }

    .metric-main {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
      text-anchor: middle;
    }

    .metric-detail {
      fill: var(--muted);
      font-size: 14px;
      text-anchor: middle;
    }

    .comparison {
      fill: var(--comparison);
      stroke: var(--comparison-border);
      stroke-width: 2px;
    }

    .comparison-text {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .fallback {
      padding: 18px;
      background: var(--page);
      color: var(--ink);
      font-size: 16px;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1 class="figure-title">Полный меш против звезды</h1>

  <svg id="diagram"
       width="1200"
       height="460"
       viewBox="0 0 1200 460"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Сравнение полного меша и звезды</title>
    <desc id="svg-description">
      В обеих схемах работают пять агентов и проходят три раунда.
      Полный меш требует 60 операций критики, а звезда — 12.
    </desc>
  </svg>

  <p id="fallback" class="fallback" hidden>
    Схема должна была показать пять агентов и три раунда:
    полный меш с 60 операциями критики рядом со звездой с 12 операциями.
  </p>

  <script>
    const diagramData = Object.freeze({
      panels: [
        {
          kind: "mesh",
          box: { x: 16, y: 8, w: 568, h: 402, r: 20 },
          title: { x: 300, y: 40, value: "Полный меш" },
          subtitle: {
            x: 300,
            y: 66,
            value: "каждый агент читает остальных 4"
          },
          rounds: [
            { x: 137, y: 82, w: 82, h: 28, r: 14, cx: 178, cy: 96 },
            { x: 259, y: 82, w: 82, h: 28, r: 14, cx: 300, cy: 96 },
            { x: 381, y: 82, w: 82, h: 28, r: 14, cx: 422, cy: 96 }
          ],
          roundLabel: "раунд",
          nodes: [
            { x: 300, y: 139, r: 27, label: "А" },
            { x: 413, y: 221, r: 27, label: "Б" },
            { x: 370, y: 330, r: 27, label: "В" },
            { x: 230, y: 330, r: 27, label: "Г" },
            { x: 187, y: 221, r: 27, label: "Д" }
          ],
          note: { x: 300, y: 371, value: "5 агентов · 3 раунда" },
          metric: {
            x: 38,
            y: 378,
            w: 524,
            h: 24,
            r: 12,
            mainX: 300,
            mainY: 397,
            main: "60 операций критики",
            detailX: 300,
            detailY: 371,
            detail: "15 предложений · 5 × 4 × 3"
          }
        },
        {
          kind: "star",
          box: { x: 616, y: 8, w: 568, h: 402, r: 20 },
          title: { x: 900, y: 40, value: "Звезда" },
          subtitle: {
            x: 900,
            y: 66,
            value: "4 агента читают только ведущего"
          },
          rounds: [
            { x: 737, y: 82, w: 82, h: 28, r: 14, cx: 778, cy: 96 },
            { x: 859, y: 82, w: 82, h: 28, r: 14, cx: 900, cy: 96 },
            { x: 981, y: 82, w: 82, h: 28, r: 14, cx: 1022, cy: 96 }
          ],
          roundLabel: "раунд",
          nodes: [
            { x: 900, y: 234, r: 30, label: "В", hub: true },
            { x: 900, y: 139, r: 27, label: "А" },
            { x: 1021, y: 234, r: 27, label: "Б" },
            { x: 900, y: 330, r: 27, label: "Г" },
            { x: 779, y: 234, r: 27, label: "Д" }
          ],
          spokes: [
            { from: { x: 900, y: 234 }, to: { x: 900, y: 139 } },
            { from: { x: 900, y: 234 }, to: { x: 1021, y: 234 } },
            { from: { x: 900, y: 234 }, to: { x: 900, y: 330 } },
            { from: { x: 900, y: 234 }, to: { x: 779, y: 234 } }
          ],
          note: { x: 900, y: 371, value: "5 агентов · 3 раунда" },
          metric: {
            x: 638,
            y: 378,
            w: 524,
            h: 24,
            r: 12,
            mainX: 900,
            mainY: 397,
            main: "12 операций критики",
            detailX: 900,
            detailY: 371,
            detail: "15 предложений · 4 × 3"
          }
        }
      ],
      comparison: {
        x: 16,
        y: 420,
        w: 1168,
        h: 34,
        r: 17,
        cx: 600,
        cy: 437,
        text: "60 против 12 · звезда требует в 5 раз меньше чтения"
      }
    });

    const origin = Object.freeze({ x: 0, y: 0 });
    const scale = Object.freeze({ x: 1, y: 1 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = svg.namespaceURI;

      const make = (name, attributes, value) => {
        const element = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, entry]) => {
          element.setAttribute(key, String(entry));
        });
        if (value !== undefined) {
          element.textContent = value;
        }
        return element;
      };

      const addRect = (parent, box, className) => {
        parent.appendChild(make("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.w) - sx(0),
          height: sy(box.h) - sy(0),
          rx: sx(box.r) - sx(0),
          ry: sy(box.r) - sy(0),
          class: className
        }));
      };

      const addLine = (parent, start, end, className) => {
        parent.appendChild(make("line", {
          x1: sx(start.x),
          y1: sy(start.y),
          x2: sx(end.x),
          y2: sy(end.y),
          class: className
        }));
      };

      const addText = (parent, point, value, className) => {
        parent.appendChild(make("text", {
          x: sx(point.x),
          y: sy(point.y),
          class: className
        }, value));
      };

      const addNode = (parent, node, className) => {
        parent.appendChild(make("circle", {
          cx: sx(node.x),
          cy: sy(node.y),
          r: sx(node.r) - sx(0),
          class: className
        }));

        addText(
          parent,
          node,
          node.label,
          node.hub ? "agent-letter hub-letter" : "agent-letter"
        );
      };

      diagramData.panels.forEach(panel => {
        const group = make("g", {
          "aria-label": panel.title.value
        });

        addRect(group, panel.box, "panel");
        addText(group, panel.title, panel.title.value, "panel-title");
        addText(
          group,
          panel.subtitle,
          panel.subtitle.value,
          "panel-subtitle"
        );

        panel.rounds.forEach(round => {
          addRect(group, round, "round-box");
          addText(
            group,
            { x: round.cx, y: round.cy },
            panel.roundLabel,
            "round-text"
          );
        });

        if (panel.kind === "mesh") {
          panel.nodes.forEach((start, startIndex) => {
            panel.nodes.forEach((end, endIndex) => {
              if (endIndex > startIndex) {
                addLine(group, start, end, "mesh-edge");
              }
            });
          });
        }

        if (panel.kind === "star") {
          panel.spokes.forEach(spoke => {
            addLine(group, spoke.from, spoke.to, "star-edge");
          });
        }

        panel.nodes.forEach(node => {
          const nodeClass = node.hub
            ? "agent-hub"
            : panel.kind === "mesh"
              ? "agent-mesh"
              : "agent-star";
          addNode(group, node, nodeClass);
        });

        addText(group, panel.note, panel.note.value, "network-note");

        addRect(
          group,
          panel.metric,
          panel.kind === "mesh" ? "metric-mesh" : "metric-star"
        );

        addText(
          group,
          { x: panel.metric.mainX, y: panel.metric.mainY },
          panel.metric.main,
          "metric-main"
        );

        addText(
          group,
          { x: panel.metric.detailX, y: panel.metric.detailY },
          panel.metric.detail,
          "metric-detail"
        );

        svg.appendChild(group);
      });

      addRect(svg, diagramData.comparison, "comparison");
      addText(
        svg,
        { x: diagramData.comparison.cx, y: diagramData.comparison.cy },
        diagramData.comparison.text,
        "comparison-text"
      );

      fallback.hidden = true;
    } catch (error) {
      document.getElementById("diagram").hidden = true;
      document.getElementById("fallback").hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
