<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Регистрация и проверка</title>
<style>
  :root{
    --bg:#fbfbfd; --fg:#1b1f27; --muted:#5d6675; --line:#39404d;
    --box:#eef1f7; --accent:#1f6feb; --accent2:#b45309; --ok:#15803d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --fg:#e7ebf2; --muted:#9aa4b4; --line:#8b95a5;
      --box:#1e2430; --accent:#6ea8fe; --accent2:#f0b357; --ok:#5fd08a;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;}
  .wrap{max-width:980px;margin:0 auto;padding:12px}
  h2{font-size:15px;margin:0 0 8px}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .lbl{fill:var(--fg);font-size:12px}
  .sub{fill:var(--muted);font-size:11px}
  .ttl{fill:var(--fg);font-size:12.5px;font-weight:600}
  .bx{fill:var(--box);stroke:var(--line);stroke-width:1.4}
  .ln{stroke:var(--line);stroke-width:1.6;fill:none}
  .en{stroke:var(--accent);stroke-width:1.6;fill:none}
  .ve{stroke:var(--accent2);stroke-width:1.6;fill:none}
  .fail{padding:10px;color:var(--fg)}
  .leg{color:var(--muted);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h2>Схема регистрации и проверки: один и тот же блок модели, две частоты запуска</h2>
  <div id="host"></div>
  <div class="leg">u₁–u₃ — три клипа регистрации (5–30 с), сходятся в один вектор e (192-d). t — тестовый клип (2 с), вектор v (192-d). cos(e, v) сравнивается с порогом.</div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    var SC=52, OX=26, OY=18;           // scale, origin
    function sx(x){ return OX + x*SC; }
    function sy(y){ return OY + y*SC; }

    var D={
      clips:[{y:0.55,l:"u₁"},{y:1.75,l:"u₂"},{y:2.95,l:"u₃"}],
      micX:0.85, mergeX:2.6, modelX:4.6, vecX:7.2,
      enrollY:1.75, verifyY:5.1,
      testY:5.1,
      cosX:9.7, cosY:3.4, decX:12.1,
      boxW:1.5, boxH:0.9
    };

    var W=760, H=380, VB="0 0 "+ (sx(13.6)) + " " + (sy(6.6));
    var s='<svg viewBox="'+VB+'" preserveAspectRatio="xMidYMid meet" role="img">';
    s+='<defs>'
      +'<marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/></marker>'
      +'<marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>'
      +'<marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent2)"/></marker>'
      +'</defs>';

    function box(x,y,w,h,cls){
      return '<rect class="'+(cls||'bx')+'" x="'+sx(x-w/2)+'" y="'+sy(y-h/2)+'" width="'+(sx(w)-sx(0))+'" height="'+(sy(h)-sy(0))+'" rx="6"/>';
    }
    function txt(x,y,t,cls,anch,dx,dy){
      return '<text class="'+cls+'" x="'+(sx(x)+(dx||0))+'" y="'+(sy(y)+(dy||0))+'" text-anchor="'+anch+'">'+t+'</text>';
    }
    function line(x1,y1,x2,y2,cls,mk){
      return '<path class="'+cls+'" d="M'+sx(x1)+','+sy(y1)+' L'+sx(x2)+','+sy(y2)+'"'+(mk?' marker-end="url(#'+mk+')"':'')+'/>';
    }
    function mic(x,y,cls){
      var r=sx(0.22)-sx(0);
      return '<circle class="'+cls+'" cx="'+sx(x)+'" cy="'+sy(y)+'" r="'+r+'"/>'
        +'<path class="'+cls+'" d="M'+sx(x)+','+sy(y+0.22)+' L'+sx(x)+','+sy(y+0.46)+'"/>'
        +'<path class="'+cls+'" d="M'+sx(x-0.18)+','+sy(y+0.46)+' L'+sx(x+0.18)+','+sy(y+0.46)+'"/>';
    }

    // ---- ветка регистрации ----
    s+=txt(D.micX-0.3,-0.35,"РЕГИСТРАЦИЯ · один раз","ttl","start");
    D.clips.forEach(function(c){
      s+=mic(D.micX,c.y,"en");
      s+=txt(D.micX-0.4,c.y,c.l,"lbl","end",0,4);
      s+=line(D.micX+0.35,c.y,D.mergeX,D.enrollY,"en");
    });
    s+=txt(D.micX+0.4,D.clips[2].y+0.85,"3 клипа по 5–30 с","sub","start");
    s+=line(D.mergeX,D.enrollY,D.modelX-D.boxW/2,D.enrollY,"en","a2");

    // ---- ветка проверки ----
    s+=txt(D.micX-0.3,D.verifyY-1.0,"ПРОВЕРКА · каждый вход","ttl","start");
    s+=mic(D.micX,D.testY,"ve");
    s+=txt(D.micX-0.4,D.testY,"t","lbl","end",0,4);
    s+=txt(D.micX+0.4,D.testY+0.85,"тестовый клип, 2 с","sub","start");
    s+=line(D.micX+0.35,D.testY,D.modelX-D.boxW/2,D.testY,"ve","a3");

    // ---- модель: два раза нарисована, один блок ----
    s+=box(D.modelX,D.enrollY,D.boxW,D.boxH);
    s+=txt(D.modelX,D.enrollY,"модель","lbl","middle",0,-1);
    s+=txt(D.modelX,D.enrollY,"192-d","sub","middle",0,13);
    s+=box(D.modelX,D.testY,D.boxW,D.boxH);
    s+=txt(D.modelX,D.testY,"модель","lbl","middle",0,-1);
    s+=txt(D.modelX,D.testY,"192-d","sub","middle",0,13);
    s+='<path class="ln" stroke-dasharray="4 4" d="M'+sx(D.modelX-D.boxW/2-0.2)+','+sy(D.enrollY+D.boxH/2)
      +' L'+sx(D.modelX-D.boxW/2-0.2)+','+sy(D.testY-D.boxH/2)+'"/>';
    s+=txt(D.modelX-D.boxW/2-0.35,(D.enrollY+D.testY)/2,"те же веса,","sub","end");
    s+=txt(D.modelX-D.boxW/2-0.35,(D.enrollY+D.testY)/2,"та же версия","sub","end",0,14);

    // ---- векторы ----
    s+=line(D.modelX+D.boxW/2,D.enrollY,D.vecX-D.boxW/2,D.enrollY,"en","a2");
    s+=box(D.vecX,D.enrollY,D.boxW,D.boxH);
    s+=txt(D.vecX,D.enrollY,"e · 192-d","lbl","middle",0,4);
    s+=txt(D.vecX,D.enrollY-D.boxH/2,"хранится в базе","sub","middle",0,-8);

    s+=line(D.modelX+D.boxW/2,D.testY,D.vecX-D.boxW/2,D.testY,"ve","a3");
    s+=box(D.vecX,D.testY,D.boxW,D.boxH);
    s+=txt(D.vecX,D.testY,"v · 192-d","lbl","middle",0,4);
    s+=txt(D.vecX,D.testY+D.boxH/2,"не хранится","sub","middle",0,16);

    // ---- сходятся в косинус ----
    s+=line(D.vecX+D.boxW/2,D.enrollY,D.cosX-0.55,D.cosY,"en","a2");
    s+=line(D.vecX+D.boxW/2,D.testY,D.cosX-0.55,D.cosY,"ve","a3");
    s+=box(D.cosX+0.15,D.cosY,2.0,D.boxH);
    s+=txt(D.cosX+0.15,D.cosY,"cos(e, v)","lbl","middle",0,4);
    s+=txt(D.cosX+0.15,D.cosY-D.boxH/2,"одно число","sub","middle",0,-8);

    s+=line(D.cosX+1.15,D.cosY,D.decX-0.05,D.cosY,"ln","a1");
    s+=box(D.decX+0.75,D.cosY,1.9,D.boxH*1.5);
    s+=txt(D.decX+0.75,D.cosY,"порог","lbl","middle",0,-4);
    s+=txt(D.decX+0.75,D.cosY,"пустить / отказать","sub","middle",0,12);

    s+='</svg>';
    host.innerHTML=s;
  }catch(e){
    host.innerHTML='<div class="fail">Схема не построилась. Она должна показывать: '
      +'три клипа регистрации по 5–30 с сходятся в один вектор 192-d (хранится в базе); '
      +'тестовый клип 2 с проходит через ТОТ ЖЕ блок модели (те же веса, та же версия) '
      +'и даёт свой вектор 192-d (не хранится); оба вектора идут в cos(e, v) — одно число, '
      +'которое сравнивается с порогом и даёт решение «пустить или отказать».</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
