<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Пересечение кривых FA и FR</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5c6470; --grid:#dfe3e8;
    --fa:#c2410c; --fr:#1d4ed8; --eer:#7c3aed;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e8ecf1; --muted:#9aa4b2; --grid:#2b3138;
      --fa:#fb923c; --fr:#7dabff; --eer:#c4a2ff;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:12px 10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .title{font-size:15px;font-weight:600;margin:0 0 6px 2px}
  svg{display:block;width:100%;height:auto;max-height:480px;background:var(--bg)}
  text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .fallback{font-size:14px;line-height:1.5;color:var(--fg);margin:8px 2px}
  .legend{font-size:13px;color:var(--muted);margin:6px 2px 0}
  .sw{display:inline-block;width:22px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
  <p class="title">Пересечение кривых FA и FR: точка EER</p>
  <div id="host"></div>
  <p class="legend">
    <span class="sw" style="border-color:var(--fa)"></span>FA — ложные пропуски чужих &nbsp;&nbsp;
    <span class="sw" style="border-color:var(--fr)"></span>FR — ложные отказы своим
  </p>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    // ---- данные схемы (порог, FA %, FR %) — числа из текста шага ----
    var DATA = [
      {t:0.30, fa:8.00, fr:0.10},
      {t:0.55, fa:0.90, fr:0.85},
      {t:0.70, fa:0.40, fr:1.50},
      {t:0.90, fa:0.05, fr:12.00}
    ];
    var EER = {t:0.55, v:0.87};
    var XT  = [0, 0.3, 0.55, 0.7, 0.9, 1];
    var YT  = [0, 3, 6, 9, 12];

    // ---- холст (литералы: viewBox / размеры / отступы / штрихи / кегль) ----
    var W = 780, H = 460;
    var PAD_S = 6, PAD_M = 10, PAD_L = 16;
    var LW = 2.6, LW_AX = 1.6, LW_THIN = 1.2;
    var FS = 14, FS_SM = 12.5;

    // ---- одна пара origin/scale, дальше не меняются ----
    var origin = {x:96, y:H-70};              // пиксель точки (0,0) в данных
    var scale  = {x:(W-96-160)/1.0, y:(H-70-40)/12.0}; // px на 1 ед. данных

    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    // ---- монотонные кривые через узлы (Catmull-Rom -> кубическая) ----
    function path(pts){
      var d = 'M'+sx(pts[0].x).toFixed(2)+' '+sy(pts[0].y).toFixed(2);
      for(var i=0;i<pts.length-1;i++){
        var p0=pts[i>0?i-1:0], p1=pts[i], p2=pts[i+1], p3=pts[i+2!==pts.length?i+2:i+1];
        var c1={x:p1.x+(p2.x-p0.x)/6, y:p1.y+(p2.y-p0.y)/6};
        var c2={x:p2.x-(p3.x-p1.x)/6, y:p2.y-(p3.y-p1.y)/6};
        d += ' C'+sx(c1.x).toFixed(2)+' '+sy(c1.y).toFixed(2)+
             ' '+sx(c2.x).toFixed(2)+' '+sy(c2.y).toFixed(2)+
             ' '+sx(p2.x).toFixed(2)+' '+sy(p2.y).toFixed(2);
      }
      return d;
    }

    var faPts = DATA.map(function(d){return {x:d.t, y:d.fa};});
    var frPts = DATA.map(function(d){return {x:d.t, y:d.fr};});

    var s = [];
    function el(t){ s.push(t); }
    function T(x,y,txt,anchor,cls,size){
      el('<text x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" text-anchor="'+anchor+
         '" fill="'+cls+'" font-size="'+(size||FS)+'">'+txt+'</text>');
    }

    el('<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" '+
       'xmlns="http://www.w3.org/2000/svg" role="img" '+
       'aria-label="Кривые FA и FR по оси порога пересекаются в точке EER 0,87 процента">');
    el('<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="var(--bg)"/>');
    el('<defs>'+
       '<marker id="ah" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">'+
       '<path d="M0 0 L7 3.2 L0 6.4 Z" fill="var(--muted)"/></marker></defs>');

    // сетка по Y
    YT.forEach(function(v){
      if(v===0) return;
      el('<line x1="'+sx(0)+'" y1="'+sy(v)+'" x2="'+sx(1)+'" y2="'+sy(v)+
         '" stroke="var(--grid)" stroke-width="'+LW_THIN+'"/>');
    });

    // оси из sx(0)/sy(0)
    el('<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(1.04)+'" y2="'+sy(0)+
       '" stroke="var(--muted)" stroke-width="'+LW_AX+'" marker-end="url(#ah)"/>');
    el('<line x1="'+sx(0)+'" y1="'+sy(0)+'" x2="'+sx(0)+'" y2="'+sy(12.6)+
       '" stroke="var(--muted)" stroke-width="'+LW_AX+'" marker-end="url(#ah)"/>');

    // засечки X
    XT.forEach(function(v){
      el('<line x1="'+sx(v)+'" y1="'+sy(0)+'" x2="'+sx(v)+'" y2="'+(sy(0)+PAD_S)+
         '" stroke="var(--muted)" stroke-width="'+LW_THIN+'"/>');
      if(v!==EER.t) T(sx(v), sy(0)+PAD_L+PAD_S, String(v).replace('.',','), 'middle', 'var(--muted)', FS_SM);
    });
    // засечки Y
    YT.forEach(function(v){
      el('<line x1="'+sx(0)+'" y1="'+sy(v)+'" x2="'+(sx(0)-PAD_S)+'" y2="'+sy(v)+
         '" stroke="var(--muted)" stroke-width="'+LW_THIN+'"/>');
      T(sx(0)-PAD_M, sy(v)+PAD_S*0.7, v+'%', 'end', 'var(--muted)', FS_SM);
    });

    // подписи осей
    T(sx(0.5), sy(0)+PAD_L*2.6, 'порог сравнения', 'middle', 'var(--muted)', FS_SM);
    T(sx(0)-PAD_M, sy(12.6)-PAD_M, 'доля ошибок', 'end', 'var(--muted)', FS_SM);

    // кривые
    el('<path d="'+path(faPts)+'" fill="none" stroke="var(--fa)" stroke-width="'+LW+
       '" stroke-linecap="round"/>');
    el('<path d="'+path(frPts)+'" fill="none" stroke="var(--fr)" stroke-width="'+LW+
       '" stroke-linecap="round"/>');

    // узлы-замеры
    DATA.forEach(function(d){
      el('<circle cx="'+sx(d.t)+'" cy="'+sy(d.fa)+'" r="3.4" fill="var(--fa)"/>');
      el('<circle cx="'+sx(d.t)+'" cy="'+sy(d.fr)+'" r="3.4" fill="var(--fr)"/>');
    });

    // концевые подписи кривых: FA слева сверху, FR справа сверху — разные стороны
    T(sx(0.30)+PAD_M, sy(8.00)-PAD_M, 'FA падает', 'start', 'var(--fa)', FS);
    T(sx(0.90)-PAD_M, sy(12.00)+PAD_S, 'FR растёт', 'end', 'var(--fr)', FS);

    // крайние замеры: разведены вверх/вниз
    T(sx(0.90)+PAD_S, sy(0.05)-PAD_M, 'FA 0,05%', 'start', 'var(--fa)', FS_SM);
    T(sx(0.30)+PAD_S, sy(0.10)+PAD_L+PAD_S, 'FR 0,10%', 'start', 'var(--fr)', FS_SM);

    // точка пересечения
    var ex = sx(EER.t), ey = sy(EER.v);
    el('<line x1="'+ex+'" y1="'+sy(0)+'" x2="'+ex+'" y2="'+ey+
       '" stroke="var(--eer)" stroke-width="'+LW_THIN+'" stroke-dasharray="4 4"/>');
    el('<circle cx="'+ex+'" cy="'+ey+'" r="6" fill="none" stroke="var(--eer)" stroke-width="'+LW+'"/>');
    el('<circle cx="'+ex+'" cy="'+ey+'" r="2.4" fill="var(--eer)"/>');

    // подпись EER — сбоку справа, выше точки; порог t — ниже оси
    T(ex+PAD_L, ey-PAD_L, 'EER = 0,87%', 'start', 'var(--eer)', FS);
    T(ex+PAD_L, ey-PAD_S+PAD_M, 'FA = FR', 'start', 'var(--muted)', FS_SM);
    T(ex, sy(0)+PAD_L+PAD_S, 'порог t = 0,55', 'middle', 'var(--eer)', FS_SM);

    el('</svg>');
    host.innerHTML = s.join('');
  }catch(e){
    host.innerHTML = '<p class="fallback">Схема: по горизонтали — порог от 0 до 1, '+
      'по вертикали — доля ошибок в процентах. Кривая FA падает слева направо '+
      '(8% при пороге 0,3 → 0,05% при 0,9), кривая FR растёт '+
      '(0,1% при 0,3 → 12% при 0,9). Две монотонные кривые пересекаются ровно один раз — '+
      'в точке EER = 0,87% при пороге t = 0,55.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
