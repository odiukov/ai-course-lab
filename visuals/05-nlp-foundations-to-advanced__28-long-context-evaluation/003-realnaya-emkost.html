<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как задача сужает полезное окно контекста</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: whitesmoke;
      --panel: white;
      --ink: darkslategray;
      --muted: slategray;
      --track: gainsboro;
      --declared: royalblue;
      --search: seagreen;
      --search-range: palegreen;
      --reason: darkorange;
      --reason-range: moccasin;
      --marker: mediumvioletred;
      --guide: lightslategray;
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .diagram {
      background: var(--panel);
      overflow: hidden;
    }

    .diagram h2 {
      font-size: 20px;
      font-weight: bold;
    }

    #stage {
      background: var(--panel);
    }

    #stage svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
    }

    #stage p {
      font-size: 16px;
      color: var(--ink);
    }

    .track {
      fill: var(--track);
    }

    .declared {
      fill: var(--declared);
    }

    .search {
      fill: var(--search);
    }

    .search-range {
      fill: var(--search-range);
    }

    .reason {
      fill: var(--reason);
    }

    .reason-range {
      fill: var(--reason-range);
    }

    .range-boundary {
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .document-marker {
      stroke: var(--marker);
      stroke-width: 3px;
      fill: none;
    }

    .document-point {
      fill: var(--marker);
      stroke: var(--panel);
      stroke-width: 2px;
    }

    .row-label {
      fill: var(--ink);
      font-size: 17px;
      font-weight: bold;
    }

    .row-value {
      fill: var(--ink);
      font-size: 16px;
      font-weight: bold;
    }

    .marker-label {
      fill: var(--marker);
      font-size: 16px;
      font-weight: bold;
    }

    .legend-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .summary {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .guide {
      stroke: var(--guide);
      stroke-width: 1px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: black;
        --panel: midnightblue;
        --ink: whitesmoke;
        --muted: lightgray;
        --track: darkslategray;
        --declared: cornflowerblue;
        --search: mediumaquamarine;
        --search-range: seagreen;
        --reason: goldenrod;
        --reason-range: darkgoldenrod;
        --marker: hotpink;
        --guide: slategray;
      }
    }
  </style>
</head>
<body>
  <section class="diagram" aria-labelledby="diagram-title">
    <h2 id="diagram-title">Как задача сужает полезное окно контекста</h2>
    <div id="stage">
      <p id="fallback">Заявленное окно — 1M токенов; простой поиск использует примерно 600–700k, рассуждение — 250–500k, а договор на 200 страниц занимает около 130k.</p>
    </div>
  </section>

  <script>
    const diagram = {
      canvas: {
        minX: 0,
        minY: 0,
        width: 960,
        height: 420
      },
      layout: {
        originX: 82,
        originY: 0,
        scaleX: 0.78,
        scaleY: 1
      },
      domain: {
        start: 0,
        end: 1000,
        document: 130
      },
      bars: {
        height: 38,
        rows: [
          {
            label: "Заявленное окно",
            value: "1M токенов",
            y: 62,
            labelY: 45,
            valueY: 45,
            certainEnd: 1000,
            rangeEnd: 1000,
            fill: "declared",
            rangeFill: "declared"
          },
          {
            label: "Простой поиск",
            value: "600–700k · 60–70%",
            y: 147,
            labelY: 130,
            valueY: 130,
            certainEnd: 600,
            rangeEnd: 700,
            fill: "search",
            rangeFill: "search-range"
          },
          {
            label: "Рассуждение по разбросанным фактам",
            value: "250–500k · 25–50%",
            y: 232,
            labelY: 215,
            valueY: 215,
            certainEnd: 250,
            rangeEnd: 500,
            fill: "reason",
            rangeFill: "reason-range"
          }
        ]
      },
      marker: {
        top: 54,
        bottom: 292,
        diamondHalfX: 9,
        diamondHalfY: 7,
        labelY: 314,
        valueY: 335,
        label: "Договор на 200 страниц",
        value: "≈130k токенов",
        dash: "7 6"
      },
      legend: {
        y: 365,
        swatchY: 352,
        swatchHeight: 18,
        swatchWidth: 34,
        firstX: 0,
        firstTextX: 48,
        secondX: 500,
        secondTextX: 548,
        first: "наиболее надёжная часть",
        second: "переходный практический диапазон"
      },
      summary: {
        x: 500,
        y: 402,
        text: "Одно заявленное окно — разные практические пределы"
      },
      guide: {
        y: 385,
        start: 0,
        end: 1000
      },
      labels: {
        zeroOffsetX: 0,
        zeroOffsetY: 0,
        valueOffsetX: 0,
        valueOffsetY: 0
      }
    };

    const origin = {
      x: diagram.layout.originX,
      y: diagram.layout.originY
    };

    const scale = {
      x: diagram.layout.scaleX,
      y: diagram.layout.scaleY
    };

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const namespace = "http://www.w3.org/2000/svg";
      const stage = document.getElementById("stage");

      const element = (name, attributes, content) => {
        const node = document.createElementNS(namespace, name);

        for (const [key, value] of Object.entries(attributes)) {
          node.setAttribute(key, String(value));
        }

        if (content !== undefined) {
          node.textContent = content;
        }

        return node;
      };

      const rectangle = (xStart, yStart, xEnd, yEnd, className) =>
        element("rect", {
          x: sx(xStart),
          y: sy(yStart),
          width: sx(xEnd) - sx(xStart),
          height: sy(yEnd) - sy(yStart),
          class: className
        });

      const line = (xStart, yStart, xEnd, yEnd, className, extra = {}) =>
        element("line", {
          x1: sx(xStart),
          y1: sy(yStart),
          x2: sx(xEnd),
          y2: sy(yEnd),
          class: className,
          ...extra
        });

      const label = ({
        text,
        x,
        y,
        className,
        anchor,
        offsetX,
        offsetY
      }) =>
        element("text", {
          x: sx(x) + offsetX,
          y: sy(y) + offsetY,
          class: className,
          "text-anchor": anchor
        }, text);

      const svg = element("svg", {
        viewBox: [
          diagram.canvas.minX,
          diagram.canvas.minY,
          diagram.canvas.width,
          diagram.canvas.height
        ].join(" "),
        width: diagram.canvas.width,
        height: diagram.canvas.height,
        preserveAspectRatio: "xMidYMid meet",
        role: "img",
        "aria-labelledby": "svg-title svg-description"
      });

      svg.append(
        element("title", { id: "svg-title" },
          "Полезное окно контекста уменьшается с усложнением задачи"),
        element("desc", { id: "svg-description" },
          "Три вложенные шкалы сравнивают заявленное окно в один миллион токенов, простой поиск до шестисот–семисот тысяч и рассуждение до двухсот пятидесяти–пятисот тысяч. Договор на двести страниц отмечен около ста тридцати тысяч токенов.")
      );

      for (const row of diagram.bars.rows) {
        const bottom = row.y + diagram.bars.height;

        svg.append(
          rectangle(
            diagram.domain.start,
            row.y,
            diagram.domain.end,
            bottom,
            "track"
          ),
          rectangle(
            diagram.domain.start,
            row.y,
            row.certainEnd,
            bottom,
            row.fill
          )
        );

        if (row.rangeEnd !== row.certainEnd) {
          svg.append(
            rectangle(
              row.certainEnd,
              row.y,
              row.rangeEnd,
              bottom,
              row.rangeFill
            ),
            line(
              row.certainEnd,
              row.y,
              row.certainEnd,
              bottom,
              "range-boundary"
            )
          );
        }

        svg.append(
          label({
            text: row.label,
            x: diagram.domain.start,
            y: row.labelY,
            className: "row-label",
            anchor: "start",
            offsetX: diagram.labels.zeroOffsetX,
            offsetY: diagram.labels.zeroOffsetY
          }),
          label({
            text: row.value,
            x: row.rangeEnd,
            y: row.valueY,
            className: "row-value",
            anchor: "end",
            offsetX: diagram.labels.valueOffsetX,
            offsetY: diagram.labels.valueOffsetY
          })
        );
      }

      svg.append(
        line(
          diagram.domain.document,
          diagram.marker.top,
          diagram.domain.document,
          diagram.marker.bottom,
          "document-marker",
          { "stroke-dasharray": diagram.marker.dash }
        )
      );

      for (const row of diagram.bars.rows) {
        const centerY = row.y + diagram.bars.height / diagram.marker.diamondHalfY;
        const points = [
          `${sx(diagram.domain.document)},${sy(centerY - diagram.marker.diamondHalfY)}`,
          `${sx(diagram.domain.document + diagram.marker.diamondHalfX)},${sy(centerY)}`,
          `${sx(diagram.domain.document)},${sy(centerY + diagram.marker.diamondHalfY)}`,
          `${sx(diagram.domain.document - diagram.marker.diamondHalfX)},${sy(centerY)}`
        ].join(" ");

        svg.append(
          element("polygon", {
            points,
            class: "document-point"
          })
        );
      }

      svg.append(
        label({
          text: diagram.marker.label,
          x: diagram.domain.document,
          y: diagram.marker.labelY,
          className: "marker-label",
          anchor: "middle",
          offsetX: diagram.labels.zeroOffsetX,
          offsetY: diagram.labels.zeroOffsetY
        }),
        label({
          text: diagram.marker.value,
          x: diagram.domain.document,
          y: diagram.marker.valueY,
          className: "marker-label",
          anchor: "middle",
          offsetX: diagram.labels.zeroOffsetX,
          offsetY: diagram.labels.zeroOffsetY
        })
      );

      svg.append(
        rectangle(
          diagram.legend.firstX,
          diagram.legend.swatchY,
          diagram.legend.firstX + diagram.legend.swatchWidth,
          diagram.legend.swatchY + diagram.legend.swatchHeight,
          "search"
        ),
        label({
          text: diagram.legend.first,
          x: diagram.legend.firstTextX,
          y: diagram.legend.y,
          className: "legend-label",
          anchor: "start",
          offsetX: diagram.labels.zeroOffsetX,
          offsetY: diagram.labels.zeroOffsetY
        }),
        rectangle(
          diagram.legend.secondX,
          diagram.legend.swatchY,
          diagram.legend.secondX + diagram.legend.swatchWidth,
          diagram.legend.swatchY + diagram.legend.swatchHeight,
          "reason-range"
        ),
        label({
          text: diagram.legend.second,
          x: diagram.legend.secondTextX,
          y: diagram.legend.y,
          className: "legend-label",
          anchor: "start",
          offsetX: diagram.labels.zeroOffsetX,
          offsetY: diagram.labels.zeroOffsetY
        }),
        line(
          diagram.guide.start,
          diagram.guide.y,
          diagram.guide.end,
          diagram.guide.y,
          "guide"
        ),
        label({
          text: diagram.summary.text,
          x: diagram.summary.x,
          y: diagram.summary.y,
          className: "summary",
          anchor: "middle",
          offsetX: diagram.labels.zeroOffsetX,
          offsetY: diagram.labels.zeroOffsetY
        })
      );

      stage.replaceChildren(svg);
    } catch (error) {
      const stage = document.getElementById("stage");
      stage.textContent = "Схема должна была показать три вложенные шкалы: заявленное окно 1M токенов, простой поиск до 600–700k, рассуждение до 250–500k и отметку договора на 200 страниц около 130k.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
