<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Как K меняет границу решения</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --surface: #ffffff;
    --text: #202432;
    --muted: #626a7d;
    --frame: #cfd5e3;
    --arrow: #747d93;
    --red-region: #f7d9d7;
    --red-point: #c84e4a;
    --blue-region: #d8e5ff;
    --blue-point: #3974d8;
    --point-ring: #ffffff;
    --boundary: #4c556b;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #151821;
      --surface: #1e2330;
      --text: #f1f3f8;
      --muted: #b8c0d1;
      --frame: #4b5367;
      --arrow: #aab3c8;
      --red-region: #563536;
      --red-point: #ff837e;
      --blue-region: #293f67;
      --blue-point: #7caaff;
      --point-ring: #1e2330;
      --boundary: #d6dbea;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--page);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--frame);
    overflow: hidden;
  }

  h1 {
    margin: 0;
    padding: 12px 16px 4px;
    text-align: center;
    font-size: 20px;
    line-height: 1.25;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 470px;
    background: var(--surface);
  }

  .panel {
    stroke: var(--frame);
    stroke-width: 1.5;
    fill: none;
  }

  .red-region { fill: var(--red-region); }
  .blue-region { fill: var(--blue-region); }

  .decision-boundary {
    fill: none;
    stroke: var(--boundary);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .point {
    stroke: var(--point-ring);
    stroke-width: 1.7;
  }

  .blue-point { fill: var(--blue-point); }
  .red-point { fill: var(--red-point); }

  .panel-title {
    fill: var(--text);
    font-size: 18px;
    font-weight: 750;
  }

  .panel-note {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .legend-label,
  .flow-label {
    fill: var(--muted);
    font-size: 13px;
    font-weight: 600;
  }

  .flow {
    stroke: var(--arrow);
    stroke-width: 2;
    stroke-linecap: round;
    fill: none;
  }

  .arrow-head { fill: var(--arrow); }

  #fallback {
    display: none;
    padding: 20px;
    color: var(--text);
    background: var(--surface);
    font-size: 16px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-title">
  <h1 id="diagram-title">Как K меняет границу решения</h1>
  <svg id="diagram" viewBox="0 0 960 470" width="960" height="470"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три карты одних и тех же точек: рваная граница при K равно 1, гладкая при K равно 15 и единый класс большинства при K равно N"></svg>
  <div id="fallback" role="status">
    Схема должна была показать одни и те же точки на трёх картах:
    рваную границу при K=1, гладкую при K=15 и единый класс большинства при K=N.
  </div>
</figure>

<script>
(() => {
  "use strict";

  const data = Object.freeze({
    zero: 0,
    canvas: { width: 960, height: 470 },
    plot: { y: 7, width: 28, height: 31 },
    panels: [
      { x: 2, title: "K = 1", note: "рваная граница" },
      { x: 34, title: "K = 15", note: "гладкая граница" },
      { x: 66, title: "K = N", note: "единый класс большинства" }
    ],
    titleY: 44,
    noteY: 40.5,
    pointRadius: 0.43,
    legendRadius: 0.48,
    points: [
      { x: 3,  y: 4,  kind: "blue" },
      { x: 5,  y: 9,  kind: "blue" },
      { x: 6,  y: 15, kind: "blue" },
      { x: 9,  y: 6,  kind: "blue" },
      { x: 10, y: 12, kind: "blue" },
      { x: 12, y: 17, kind: "blue" },
      { x: 14, y: 9,  kind: "blue" },
      { x: 16, y: 14, kind: "blue" },
      { x: 18, y: 6,  kind: "blue" },
      { x: 21, y: 11, kind: "blue" },
      { x: 22, y: 24, kind: "blue" },
      { x: 4,  y: 26, kind: "red" },
      { x: 7,  y: 29, kind: "red" },
      { x: 8,  y: 22, kind: "red" },
      { x: 11, y: 24, kind: "red" },
      { x: 14, y: 28, kind: "red" },
      { x: 16, y: 22, kind: "red" },
      { x: 16, y: 29, kind: "red" },
      { x: 20, y: 28, kind: "red" },
      { x: 23, y: 19, kind: "red" },
      { x: 24, y: 27, kind: "red" },
      { x: 26, y: 23, kind: "red" },
      { x: 26, y: 30, kind: "red" },
      { x: 10, y: 10, kind: "red" }
    ],
    jaggedBoundary: [
      { x: 0,  y: 21 },
      { x: 3,  y: 20 },
      { x: 5,  y: 22 },
      { x: 7,  y: 18 },
      { x: 9,  y: 20 },
      { x: 11, y: 16 },
      { x: 13, y: 18 },
      { x: 15, y: 14 },
      { x: 18, y: 16 },
      { x: 20, y: 12 },
      { x: 23, y: 14 },
      { x: 25, y: 10 },
      { x: 28, y: 12 }
    ],
    smoothBoundary: {
      start: { x: 0, y: 21 },
      curves: [
        {
          c1: { x: 7, y: 21 },
          c2: { x: 9, y: 18 },
          end: { x: 14, y: 16 }
        },
        {
          c1: { x: 19, y: 14 },
          c2: { x: 22, y: 12 },
          end: { x: 28, y: 11 }
        }
      ]
    },
    blueIsland: [
      { x: 20.7, y: 23.2 },
      { x: 21.2, y: 25.2 },
      { x: 22.7, y: 25.8 },
      { x: 23.5, y: 24.2 },
      { x: 22.7, y: 22.8 }
    ],
    redIsland: [
      { x: 8.8, y: 9.3 },
      { x: 9.6, y: 11.1 },
      { x: 11.1, y: 11.5 },
      { x: 11.8, y: 9.7 },
      { x: 10.5, y: 8.7 }
    ],
    arrows: [
      {
        from: { x: 30.6, y: 22.5 },
        to: { x: 33.1, y: 22.5 },
        head: [
          { x: 33.1, y: 22.5 },
          { x: 32.3, y: 23.1 },
          { x: 32.3, y: 21.9 }
        ]
      },
      {
        from: { x: 62.6, y: 22.5 },
        to: { x: 65.1, y: 22.5 },
        head: [
          { x: 65.1, y: 22.5 },
          { x: 64.3, y: 23.1 },
          { x: 64.3, y: 21.9 }
        ]
      }
    ],
    flow: {
      from: { x: 40, y: 2.7 },
      to: { x: 59, y: 2.7 },
      head: [
        { x: 59, y: 2.7 },
        { x: 58, y: 3.35 },
        { x: 58, y: 2.05 }
      ],
      label: { x: 49.5, y: 4.35, text: "K увеличивается" }
    },
    legend: [
      { x: 4, y: 2.7, kind: "blue", labelX: 5.1, text: "синий класс" },
      { x: 18, y: 2.7, kind: "red", labelX: 19.1, text: "красный класс" }
    ],
    endNote: {
      x: 93,
      y: 2.7,
      text: "граница исчезает"
    },
    labelPadding: { title: 0, note: 0, legend: 2 },
    lineThickness: { frame: 1.5, boundary: 2.4, point: 1.7, arrow: 2 },
    fontSize: { title: 18, note: 13, legend: 13 }
  });

  const origin = Object.freeze({ x: 0, y: 470 });
  const scale = 10;

  const sx = x => origin.x + x * scale;
  const sy = y => origin.y - y * scale;

  try {
    const svg = document.getElementById("diagram");
    const ns = "http://www.w3.org/2000/svg";

    const make = (name, attrs, className, text) => {
      const node = document.createElementNS(ns, name);
      Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
      if (className) node.setAttribute("class", className);
      if (text) node.textContent = text;
      return node;
    };

    const screenPoint = (panel, point) => ({
      x: panel.x + point.x,
      y: data.plot.y + point.y
    });

    const polygonPath = points => {
      const [first, ...rest] = points;
      return [
        `M ${sx(first.x)} ${sy(first.y)}`,
        ...rest.map(point => `L ${sx(point.x)} ${sy(point.y)}`),
        "Z"
      ].join(" ");
    };

    const openPath = points => {
      const [first, ...rest] = points;
      return [
        `M ${sx(first.x)} ${sy(first.y)}`,
        ...rest.map(point => `L ${sx(point.x)} ${sy(point.y)}`)
      ].join(" ");
    };

    const panelBox = panel => {
      const left = panel.x;
      const right = panel.x + data.plot.width;
      const bottom = data.plot.y;
      const top = data.plot.y + data.plot.height;
      return [
        { x: left, y: bottom },
        { x: right, y: bottom },
        { x: right, y: top },
        { x: left, y: top }
      ];
    };

    const addText = (text, point, className, anchor, dx) => {
      const node = make("text", {
        x: sx(point.x),
        y: sy(point.y),
        "text-anchor": anchor,
        dx
      }, className, text);
      svg.appendChild(node);
    };

    const addPanelBase = panel => {
      svg.appendChild(make("path", {
        d: polygonPath(panelBox(panel))
      }, "red-region"));

      svg.appendChild(make("path", {
        d: polygonPath(panelBox(panel))
      }, "panel"));

      addText(
        panel.title,
        { x: panel.x + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + panel.x - panel.x + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + panel.x - panel.x + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale, y: data.titleY },
        "panel-title",
        "middle",
        data.labelPadding.title
      );

      addText(
        panel.note,
        { x: panel.x + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + panel.x - panel.x + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale + panel.x - panel.x + data.plot.width / scale * scale / data.plot.width * data.plot.width / scale, y: data.noteY },
        "panel-note",
        "middle",
        data.labelPadding.note
      );
    };

    const addPoints = panel => {
      data.points.forEach(point => {
        const placed = screenPoint(panel, point);
        svg.appendChild(make("circle", {
          cx: sx(placed.x),
          cy: sy(placed.y),
          r: sx(data.pointRadius) - sx(data.zero)
        }, `point ${point.kind}-point`));
      });
    };

    const [firstPanel, middlePanel, lastPanel] = data.panels;

    data.panels.forEach(addPanelBase);

    const firstBottomLeft = {
      x: firstPanel.x,
      y: data.plot.y
    };
    const firstBottomRight = {
      x: firstPanel.x + data.plot.width,
      y: data.plot.y
    };
    const jaggedGlobal = data.jaggedBoundary.map(point => screenPoint(firstPanel, point));
    svg.appendChild(make("path", {
      d: polygonPath([firstBottomLeft, firstBottomRight, ...jaggedGlobal.slice().reverse()])
    }, "blue-region"));

    const blueIslandGlobal = data.blueIsland.map(point => screenPoint(firstPanel, point));
    const redIslandGlobal = data.redIsland.map(point => screenPoint(firstPanel, point));
    svg.appendChild(make("path", {
      d: polygonPath(blueIslandGlobal)
    }, "blue-region"));
    svg.appendChild(make("path", {
      d: polygonPath(redIslandGlobal)
    }, "red-region"));
    svg.appendChild(make("path", {
      d: openPath(jaggedGlobal)
    }, "decision-boundary"));
    svg.appendChild(make("path", {
      d: `${openPath([...blueIslandGlobal, blueIslandGlobal.at(-blueIslandGlobal.length)])} Z`
    }, "decision-boundary"));
    svg.appendChild(make("path", {
      d: `${openPath([...redIslandGlobal, redIslandGlobal.at(-redIslandGlobal.length)])} Z`
    }, "decision-boundary"));

    const smoothStart = screenPoint(middlePanel, data.smoothBoundary.start);
    const smoothCurve = data.smoothBoundary.curves.map(curve => {
      const c1 = screenPoint(middlePanel, curve.c1);
      const c2 = screenPoint(middlePanel, curve.c2);
      const end = screenPoint(middlePanel, curve.end);
      return `C ${sx(c1.x)} ${sy(c1.y)} ${sx(c2.x)} ${sy(c2.y)} ${sx(end.x)} ${sy(end.y)}`;
    }).join(" ");
    const middleBottomLeft = {
      x: middlePanel.x,
      y: data.plot.y
    };
    const middleBottomRight = {
      x: middlePanel.x + data.plot.width,
      y: data.plot.y
    };
    const smoothEnd = screenPoint(
      middlePanel,
      data.smoothBoundary.curves.at(-data.smoothBoundary.curves.length).end
    );

    svg.appendChild(make("path", {
      d: [
        `M ${sx(middleBottomLeft.x)} ${sy(middleBottomLeft.y)}`,
        `L ${sx(middleBottomRight.x)} ${sy(middleBottomRight.y)}`,
        `L ${sx(smoothEnd.x)} ${sy(smoothEnd.y)}`,
        smoothCurve.split(" ").reverse().reverse().join(" "),
        `L ${sx(middleBottomLeft.x)} ${sy(smoothStart.y)}`,
        "Z"
      ].join(" ")
    }, "blue-region"));

    svg.appendChild(make("path", {
      d: `M ${sx(smoothStart.x)} ${sy(smoothStart.y)} ${smoothCurve}`
    }, "decision-boundary"));

    data.panels.forEach(addPoints);

    data.arrows.forEach(arrow => {
      svg.appendChild(make("line", {
        x1: sx(arrow.from.x),
        y1: sy(arrow.from.y),
        x2: sx(arrow.to.x),
        y2: sy(arrow.to.y)
      }, "flow"));
      svg.appendChild(make("path", {
        d: polygonPath(arrow.head)
      }, "arrow-head"));
    });

    svg.appendChild(make("line", {
      x1: sx(data.flow.from.x),
      y1: sy(data.flow.from.y),
      x2: sx(data.flow.to.x),
      y2: sy(data.flow.to.y)
    }, "flow"));
    svg.appendChild(make("path", {
      d: polygonPath(data.flow.head)
    }, "arrow-head"));
    addText(
      data.flow.label.text,
      data.flow.label,
      "flow-label",
      "middle",
      data.labelPadding.note
    );

    data.legend.forEach(item => {
      svg.appendChild(make("circle", {
        cx: sx(item.x),
        cy: sy(item.y),
        r: sx(data.legendRadius) - sx(data.zero)
      }, `point ${item.kind}-point`));
      addText(
        item.text,
        { x: item.labelX, y: item.y },
        "legend-label",
        "start",
        data.labelPadding.legend
      );
    });

    addText(
      data.endNote.text,
      data.endNote,
      "legend-label",
      "end",
      data.labelPadding.note
    );

    svg.appendChild(make("path", {
      d: polygonPath(panelBox(firstPanel))
    }, "panel"));
    svg.appendChild(make("path", {
      d: polygonPath(panelBox(middlePanel))
    }, "panel"));
    svg.appendChild(make("path", {
      d: polygonPath(panelBox(lastPanel))
    }, "panel"));
  } catch (error) {
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");
    svg.style.display = "none";
    fallback.style.display = "block";
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
