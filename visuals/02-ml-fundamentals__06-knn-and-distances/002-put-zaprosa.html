<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Путь запроса через KNN</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #eef3f8;
      --ink: #172033;
      --muted: #667085;
      --line: #8a98aa;
      --accent: #246bfd;
      --accent-soft: #dce8ff;
      --query: #f0a51a;
      --query-soft: #fff0c7;
      --classify: #8a45d6;
      --classify-soft: #eee1ff;
      --regress: #168569;
      --regress-soft: #d9f3ea;
      --excluded: #d8dee8;
      --shadow: #c7d0dc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111722;
        --panel: #192231;
        --panel-soft: #202c3d;
        --ink: #f1f5fb;
        --muted: #aab5c4;
        --line: #738199;
        --accent: #75a2ff;
        --accent-soft: #263e69;
        --query: #ffc353;
        --query-soft: #493b1c;
        --classify: #c794ff;
        --classify-soft: #3a2950;
        --regress: #64d5b2;
        --regress-soft: #1e493f;
        --excluded: #3b4657;
        --shadow: #0b1018;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg);
    }

    h1 {
      margin: 0;
      padding: 12px 18px 4px;
      font-size: 24px;
      line-height: 1.2;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 470px;
      background: var(--bg);
    }

    #fallback {
      margin: 0;
      padding: 20px;
      font-size: 17px;
      line-height: 1.45;
      text-align: center;
      background: var(--panel);
      color: var(--ink);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--shadow);
      stroke-width: 2px;
    }

    .stage-title {
      fill: var(--ink);
      font-size: 19px;
      font-weight: 700;
    }

    .label {
      fill: var(--ink);
      font-size: 16px;
      font-weight: 600;
    }

    .small {
      fill: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .value {
      fill: var(--ink);
      font-size: 18px;
      font-weight: 750;
    }

    .query-text {
      fill: var(--ink);
      font-size: 25px;
      font-weight: 800;
    }

    .route {
      fill: none;
      stroke: var(--line);
      stroke-width: 2px;
      stroke-dasharray: 6px 6px;
    }

    .flow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3px;
    }

    .flow-head {
      fill: var(--accent);
    }

    .point {
      fill: var(--accent);
      stroke: var(--panel);
      stroke-width: 3px;
    }

    .query {
      fill: var(--query-soft);
      stroke: var(--query);
      stroke-width: 3px;
    }

    .row {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .chosen {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2px;
    }

    .excluded {
      fill: var(--excluded);
      stroke: var(--line);
      stroke-width: 2px;
    }

    .class-card {
      fill: var(--classify-soft);
      stroke: var(--classify);
      stroke-width: 2px;
    }

    .regress-card {
      fill: var(--regress-soft);
      stroke: var(--regress);
      stroke-width: 2px;
    }

    .class-line {
      fill: none;
      stroke: var(--classify);
      stroke-width: 3px;
    }

    .class-head {
      fill: var(--classify);
    }

    .regress-line {
      fill: none;
      stroke: var(--regress);
      stroke-width: 3px;
    }

    .regress-head {
      fill: var(--regress);
    }

    .brace {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Путь запроса через KNN</h1>
    <p id="fallback">
      Новая точка сравнивается со всеми обучающими точками, расстояния
      сортируются, выбираются K ближайших, затем выполняется голосование
      или усреднение.
    </p>
    <svg id="diagram"
         viewBox="0 0 1200 440"
         width="1200"
         height="440"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Путь запроса через KNN</title>
      <desc id="svg-desc">
        Четыре последовательных этапа: вычисление всех расстояний,
        сортировка, выбор трёх ближайших соседей и получение прогноза.
      </desc>
    </svg>
  </main>

  <script>
    const DATA = Object.freeze({
      transform: {
        origin: [10, 8],
        scale: [0.983, 0.96]
      },
      canvas: [0, 0, 1200, 440],
      panels: [
        [12, 38, 286, 420],
        [330, 38, 536, 420],
        [580, 38, 792, 420],
        [836, 38, 1196, 420]
      ],
      titles: [
        [149, 72, "Расстояния до всех"],
        [433, 72, "Сортировка"],
        [686, 72, "Выбор K ближайших"],
        [1016, 72, "Голосование или среднее"]
      ],
      query: [74, 226, 21],
      queryLabel: [74, 263, "новая точка"],
      training: [
        [146, 126, 8, 158, 109, "2,1", "start"],
        [238, 175, 8, 249, 164, "5,7", "start"],
        [126, 302, 8, 139, 325, "1,4", "start"],
        [232, 329, 8, 244, 351, "3,0", "start"]
      ],
      distanceNote: [149, 392, "сравнить с каждой точкой"],
      sortedRows: [
        [354, 105, 512, 155, "1,4"],
        [354, 171, 512, 221, "2,1"],
        [354, 237, 512, 287, "3,0"],
        [354, 303, 512, 353, "5,7"]
      ],
      sortedNote: [433, 390, "по возрастанию расстояния"],
      selectedRows: [
        [602, 105, 742, 155, "1,4", "chosen"],
        [602, 171, 742, 221, "2,1", "chosen"],
        [602, 237, 742, 287, "3,0", "chosen"],
        [602, 321, 742, 371, "5,7", "excluded"]
      ],
      brace: [
        [758, 105],
        [773, 105],
        [773, 287],
        [758, 287]
      ],
      kLabel: [765, 309, "K = 3"],
      excludedLabel: [751, 350, "вне выбора"],
      neighborNode: [856, 174, 938, 250],
      neighborText: [
        [897, 204, "K ближайших"],
        [897, 226, "соседей"]
      ],
      classCard: [982, 102, 1169, 184],
      regressCard: [982, 270, 1169, 352],
      classText: [
        [1075, 132, "Классификация"],
        [1075, 159, "голосование большинства"]
      ],
      regressText: [
        [1075, 300, "Регрессия"],
        [1075, 327, "среднее значений"]
      ],
      finalNote: [1075, 391, "одна ближайшая группа — два типа задачи"],
      arrows: [
        {
          line: [[292, 219], [323, 219]],
          head: [[323, 219], [311, 211], [311, 227]],
          kind: "flow"
        },
        {
          line: [[542, 219], [573, 219]],
          head: [[573, 219], [561, 211], [561, 227]],
          kind: "flow"
        },
        {
          line: [[798, 219], [829, 219]],
          head: [[829, 219], [817, 211], [817, 227]],
          kind: "flow"
        },
        {
          line: [[938, 196], [976, 150]],
          head: [[976, 150], [960, 155], [972, 166]],
          kind: "class"
        },
        {
          line: [[938, 228], [976, 304]],
          head: [[976, 304], [962, 295], [959, 311]],
          kind: "regress"
        }
      ]
    });

    const origin = Object.freeze(DATA.transform.origin);
    const scale = Object.freeze(DATA.transform.scale);
    const [originX, originY] = origin;
    const [scaleX, scaleY] = scale;
    const sx = x => originX + x * scaleX;
    const sy = y => originY + y * scaleY;

    (() => {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      try {
        const node = (name, attributes, content) => {
          const element = document.createElementNS(namespace, name);
          Object.entries(attributes || {}).forEach(([key, value]) => {
            element.setAttribute(key, String(value));
          });
          if (content !== undefined) {
            element.textContent = content;
          }
          return element;
        };

        const pointString = points =>
          points.map(([x, y]) => `${sx(x)},${sy(y)}`).join(" ");

        const addRect = (parent, box, className) => {
          const [x1, y1, x2, y2] = box;
          parent.appendChild(node("rect", {
            x: sx(x1),
            y: sy(y1),
            width: sx(x2) - sx(x1),
            height: sy(y2) - sy(y1),
            class: className
          }));
        };

        const addLine = (parent, endpoints, className) => {
          const [[x1, y1], [x2, y2]] = endpoints;
          parent.appendChild(node("line", {
            x1: sx(x1),
            y1: sy(y1),
            x2: sx(x2),
            y2: sy(y2),
            class: className
          }));
        };

        const addText = (
          parent,
          x,
          y,
          content,
          className,
          anchor = "middle"
        ) => {
          parent.appendChild(node("text", {
            x: sx(x),
            y: sy(y),
            class: className,
            "text-anchor": anchor,
            "dominant-baseline": "middle"
          }, content));
        };

        const addCircle = (parent, x, y, radius, className) => {
          parent.appendChild(node("circle", {
            cx: sx(x),
            cy: sy(y),
            r: sx(radius) - sx(DATA.canvas[0]),
            class: className
          }));
        };

        const root = node("g", {
          "aria-hidden": "true"
        });

        DATA.panels.forEach(panel => addRect(root, panel, "panel"));

        DATA.titles.forEach(([x, y, title]) => {
          addText(root, x, y, title, "stage-title");
        });

        DATA.training.forEach(([x, y, radius, lx, ly, value, anchor]) => {
          addLine(root, [
            [DATA.query[0], DATA.query[1]],
            [x, y]
          ], "route");
          addCircle(root, x, y, radius, "point");
          addText(root, lx, ly, value, "value", anchor);
        });

        addCircle(
          root,
          DATA.query[0],
          DATA.query[1],
          DATA.query[2],
          "query"
        );
        addText(
          root,
          DATA.query[0],
          DATA.query[1],
          "?",
          "query-text"
        );
        addText(
          root,
          DATA.queryLabel[0],
          DATA.queryLabel[1],
          DATA.queryLabel[2],
          "small"
        );
        addText(
          root,
          DATA.distanceNote[0],
          DATA.distanceNote[1],
          DATA.distanceNote[2],
          "small"
        );

        DATA.sortedRows.forEach(([x1, y1, x2, y2, value]) => {
          addRect(root, [x1, y1, x2, y2], "row");
          addCircle(root, x1 + DATA.training[0][2] * scaleX, (y1 + y2) / scaleX, DATA.training[0][2], "point");
          addText(root, (x1 + x2) / scaleX, (y1 + y2) / scaleX, value, "value");
        });

        addText(
          root,
          DATA.sortedNote[0],
          DATA.sortedNote[1],
          DATA.sortedNote[2],
          "small"
        );

        DATA.selectedRows.forEach(([x1, y1, x2, y2, value, className]) => {
          addRect(root, [x1, y1, x2, y2], className);
          addText(root, (x1 + x2) / scaleX, (y1 + y2) / scaleX, value, "value");
        });

        root.appendChild(node("polyline", {
          points: pointString(DATA.brace),
          class: "brace"
        }));

        addText(
          root,
          DATA.kLabel[0],
          DATA.kLabel[1],
          DATA.kLabel[2],
          "label"
        );
        addText(
          root,
          DATA.excludedLabel[0],
          DATA.excludedLabel[1],
          DATA.excludedLabel[2],
          "small",
          "end"
        );

        addRect(root, DATA.neighborNode, "chosen");
        DATA.neighborText.forEach(([x, y, content]) => {
          addText(root, x, y, content, "label");
        });

        addRect(root, DATA.classCard, "class-card");
        addRect(root, DATA.regressCard, "regress-card");

        DATA.classText.forEach(([x, y, content], index) => {
          addText(root, x, y, content, index ? "small" : "label");
        });

        DATA.regressText.forEach(([x, y, content], index) => {
          addText(root, x, y, content, index ? "small" : "label");
        });

        addText(
          root,
          DATA.finalNote[0],
          DATA.finalNote[1],
          DATA.finalNote[2],
          "small"
        );

        DATA.arrows.forEach(arrow => {
          addLine(root, arrow.line, `${arrow.kind}-line`);
          root.appendChild(node("polygon", {
            points: pointString(arrow.head),
            class: `${arrow.kind}-head`
          }));
        });

        svg.appendChild(root);
        fallback.hidden = true;
      } catch (error) {
        fallback.hidden = false;
        fallback.textContent =
          "Схема должна была показать путь запроса: вычислить расстояния до всех точек, отсортировать их, выбрать K = 3 ближайших и выполнить голосование или усреднение.";
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
