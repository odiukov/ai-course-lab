<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Игрушечный мир из трёх действий</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fc;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #5c667a;
      --grid: #c8cfdb;
      --track: #e8ebf2;
      --correct: #17855b;
      --correct-soft: #d9f2e7;
      --agree: #b96518;
      --agree-soft: #f8e5d1;
      --wrong: #b23a52;
      --wrong-soft: #f7dce2;
      --beta: #6750c9;
      --alpha: #087a90;
      --white: #ffffff;
      --shadow: #dfe3ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111522;
        --panel: #191f2d;
        --ink: #edf1fa;
        --muted: #b5bdd0;
        --grid: #596276;
        --track: #2a3243;
        --correct: #43bd87;
        --correct-soft: #183c30;
        --agree: #e69a4f;
        --agree-soft: #49321f;
        --wrong: #e67589;
        --wrong-soft: #472832;
        --beta: #b1a3ff;
        --alpha: #62cada;
        --white: #10141f;
        --shadow: #0d111b;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      padding: unset;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .figure {
      width: 100%;
      max-height: 520px;
      overflow: hidden;
      background: var(--panel);
      border: 2px solid var(--shadow);
    }

    h1 {
      margin: unset;
      padding: 12px 18px 8px;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: normal;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 460px;
      background: var(--panel);
    }

    #fallback {
      margin: unset;
      padding: 18px;
      font-size: 16px;
      color: var(--ink);
      background: var(--panel);
    }

    [hidden] {
      display: none;
    }

    .axis,
    .guide,
    .bracket,
    .track,
    .arrow {
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--grid);
      fill: none;
    }

    .guide {
      stroke: var(--grid);
      fill: none;
      stroke-dasharray: 7 7;
    }

    .bracket {
      stroke: var(--muted);
      fill: none;
    }

    .track {
      stroke: var(--grid);
      fill: var(--track);
    }

    .fill-correct {
      fill: var(--correct);
    }

    .fill-agree {
      fill: var(--agree);
    }

    .fill-wrong {
      fill: var(--wrong);
    }

    .cap-correct {
      fill: var(--correct-soft);
      stroke: var(--correct);
    }

    .cap-agree {
      fill: var(--agree-soft);
      stroke: var(--agree);
    }

    .cap-wrong {
      fill: var(--wrong-soft);
      stroke: var(--wrong);
    }

    .arrow-beta {
      stroke: var(--beta);
      fill: none;
    }

    .head-beta {
      fill: var(--beta);
    }

    .arrow-alpha {
      stroke: var(--alpha);
      fill: none;
    }

    .head-alpha {
      fill: var(--alpha);
    }

    .text-main {
      fill: var(--ink);
      font-weight: bold;
    }

    .text-muted {
      fill: var(--muted);
    }

    .text-value {
      fill: var(--white);
      font-weight: bold;
    }

    .text-beta {
      fill: var(--beta);
      font-weight: bold;
    }

    .text-alpha {
      fill: var(--alpha);
      font-weight: bold;
    }

    .id-label {
      fill: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="figure-title">
    <h1 id="figure-title">Игрушечный мир из трёх действий</h1>
    <p id="fallback">
      Схема должна показать три равные стартовые доли — правильный ответ,
      подхалимское согласие и случайную ошибку — и перенос вероятностной массы
      под действием β и α.
    </p>
    <svg
      id="diagram"
      viewBox="0 0 960 460"
      width="960"
      height="460"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-desc"
      hidden>
    </svg>
  </main>

  <script>
    const DATA = [{
      canvas: [0, 0, 960, 460],
      origin: { x: 120, y: 375 },
      scale: { x: 1, y: 1 },
      style: {
        line: 2,
        arrow: 4,
        titleFont: 17,
        labelFont: 15,
        smallFont: 13,
        valueFont: 18
      },
      axis: {
        start: { x: 0, y: 0 },
        end: { x: 680, y: 0 },
        top: { x: 0, y: 270 },
        guideStart: { x: 0, y: 90 },
        guideEnd: { x: 680, y: 90 }
      },
      bracket: {
        start: { x: 40, y: 294 },
        end: { x: 650, y: 294 },
        leftTip: { x: 40, y: 284 },
        rightTip: { x: 650, y: 284 }
      },
      columns: [
        {
          key: "correct",
          x: 40,
          width: 130,
          trackHeight: 270,
          fillHeight: 90,
          center: 105,
          name: "правильный ответ",
          id: "correct-answer"
        },
        {
          key: "agree",
          x: 280,
          width: 130,
          trackHeight: 270,
          fillHeight: 90,
          center: 345,
          name: "подхалимское согласие",
          id: "sycophantic-agreement"
        },
        {
          key: "wrong",
          x: 520,
          width: 130,
          trackHeight: 270,
          fillHeight: 90,
          center: 585,
          name: "случайная ошибка",
          id: "random-wrong"
        }
      ],
      labels: {
        start: { x: 40, y: 317, text: "Старт: ≈33% каждому" },
        total: { x: 650, y: 317, text: "Вместе всегда 100%" },
        hundred: { x: -18, y: 265, text: "100%" },
        third: { x: -18, y: 85, text: "≈33%" },
        share: "≈33%",
        namesY: -28,
        idsY: -53
      },
      arrows: [
        {
          kind: "beta",
          start: { x: 520, y: 205 },
          controlA: { x: 490, y: 224 },
          controlB: { x: 440, y: 224 },
          end: { x: 410, y: 205 },
          head: [
            { x: 410, y: 205 },
            { x: 428, y: 217 },
            { x: 426, y: 195 }
          ],
          label: {
            x: 465,
            y: 239,
            text: "β: слабее якорь — легче переток"
          }
        },
        {
          kind: "alpha",
          start: { x: 280, y: 145 },
          controlA: { x: 250, y: 127 },
          controlB: { x: 200, y: 127 },
          end: { x: 170, y: 145 },
          head: [
            { x: 170, y: 145 },
            { x: 188, y: 133 },
            { x: 186, y: 155 }
          ],
          label: {
            x: 225,
            y: 112,
            text: "α: сильнее штраф согласия"
          }
        }
      ],
      notes: [
        {
          x: 105,
          y: 67,
          className: "text-value",
          text: "≈33%"
        },
        {
          x: 345,
          y: 67,
          className: "text-value",
          text: "≈33%"
        },
        {
          x: 585,
          y: 67,
          className: "text-value",
          text: "≈33%"
        }
      ]
    }];

    const [cfg] = DATA;
    const origin = Object.freeze(cfg.origin);
    const scale = Object.freeze(cfg.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y - y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const ns = "http://www.w3.org/2000/svg";

      const make = (tag, attrs, text) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attrs).forEach(([name, value]) => {
          node.setAttribute(name, String(value));
        });
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const title = make("title", { id: "svg-title" },
        "Три действия начинают с равных долей");
      const desc = make("desc", { id: "svg-desc" },
        "Три столбца показывают примерно по тридцать три процента. " +
        "Стрелка бета показывает более свободный перенос массы при слабом " +
        "KL-якоре, а стрелка альфа — отток массы от подхалимского согласия " +
        "при усилении штрафа.");
      svg.append(title, desc);

      const base = make("g", { "aria-hidden": "true" });
      base.append(
        make("line", {
          x1: sx(cfg.axis.start.x),
          y1: sy(cfg.axis.start.y),
          x2: sx(cfg.axis.end.x),
          y2: sy(cfg.axis.end.y),
          class: "axis",
          "stroke-width": cfg.style.line
        }),
        make("line", {
          x1: sx(cfg.axis.start.x),
          y1: sy(cfg.axis.start.y),
          x2: sx(cfg.axis.top.x),
          y2: sy(cfg.axis.top.y),
          class: "axis",
          "stroke-width": cfg.style.line
        }),
        make("line", {
          x1: sx(cfg.axis.guideStart.x),
          y1: sy(cfg.axis.guideStart.y),
          x2: sx(cfg.axis.guideEnd.x),
          y2: sy(cfg.axis.guideEnd.y),
          class: "guide",
          "stroke-width": cfg.style.line
        })
      );

      base.append(
        make("line", {
          x1: sx(cfg.bracket.start.x),
          y1: sy(cfg.bracket.start.y),
          x2: sx(cfg.bracket.end.x),
          y2: sy(cfg.bracket.end.y),
          class: "bracket",
          "stroke-width": cfg.style.line
        }),
        make("line", {
          x1: sx(cfg.bracket.start.x),
          y1: sy(cfg.bracket.start.y),
          x2: sx(cfg.bracket.leftTip.x),
          y2: sy(cfg.bracket.leftTip.y),
          class: "bracket",
          "stroke-width": cfg.style.line
        }),
        make("line", {
          x1: sx(cfg.bracket.end.x),
          y1: sy(cfg.bracket.end.y),
          x2: sx(cfg.bracket.rightTip.x),
          y2: sy(cfg.bracket.rightTip.y),
          class: "bracket",
          "stroke-width": cfg.style.line
        })
      );
      svg.append(base);

      const bars = make("g", { "aria-label": "Стартовое распределение" });
      cfg.columns.forEach(column => {
        const group = make("g", {
          "aria-label": column.name + ": примерно 33%"
        });

        group.append(
          make("rect", {
            x: sx(column.x),
            y: sy(column.trackHeight),
            width: sx(column.x + column.width) - sx(column.x),
            height: sy(0) - sy(column.trackHeight),
            class: "track",
            "stroke-width": cfg.style.line
          }),
          make("rect", {
            x: sx(column.x),
            y: sy(column.fillHeight),
            width: sx(column.x + column.width) - sx(column.x),
            height: sy(0) - sy(column.fillHeight),
            class: "fill-" + column.key
          }),
          make("text", {
            x: sx(column.center),
            y: sy(cfg.labels.namesY),
            class: "text-main",
            "font-size": cfg.style.labelFont,
            "text-anchor": "middle"
          }, column.name),
          make("text", {
            x: sx(column.center),
            y: sy(cfg.labels.idsY),
            class: "id-label",
            "font-size": cfg.style.smallFont,
            "text-anchor": "middle"
          }, column.id)
        );
        bars.append(group);
      });
      svg.append(bars);

      const values = make("g", { "aria-hidden": "true" });
      cfg.notes.forEach(note => {
        values.append(make("text", {
          x: sx(note.x),
          y: sy(note.y),
          class: note.className,
          "font-size": cfg.style.valueFont,
          "text-anchor": "middle"
        }, note.text));
      });

      values.append(
        make("text", {
          x: sx(cfg.labels.hundred.x),
          y: sy(cfg.labels.hundred.y),
          class: "text-muted",
          "font-size": cfg.style.smallFont,
          "text-anchor": "end"
        }, cfg.labels.hundred.text),
        make("text", {
          x: sx(cfg.labels.third.x),
          y: sy(cfg.labels.third.y),
          class: "text-muted",
          "font-size": cfg.style.smallFont,
          "text-anchor": "end"
        }, cfg.labels.third.text),
        make("text", {
          x: sx(cfg.labels.start.x),
          y: sy(cfg.labels.start.y),
          class: "text-main",
          "font-size": cfg.style.titleFont,
          "text-anchor": "start"
        }, cfg.labels.start.text),
        make("text", {
          x: sx(cfg.labels.total.x),
          y: sy(cfg.labels.total.y),
          class: "text-main",
          "font-size": cfg.style.titleFont,
          "text-anchor": "end"
        }, cfg.labels.total.text)
      );
      svg.append(values);

      const transfers = make("g", {
        "aria-label": "Перенос вероятностной массы"
      });
      cfg.arrows.forEach(arrow => {
        transfers.append(
          make("path", {
            d:
              "M " + sx(arrow.start.x) + " " + sy(arrow.start.y) +
              " C " + sx(arrow.controlA.x) + " " + sy(arrow.controlA.y) +
              " " + sx(arrow.controlB.x) + " " + sy(arrow.controlB.y) +
              " " + sx(arrow.end.x) + " " + sy(arrow.end.y),
            class: "arrow arrow-" + arrow.kind,
            "stroke-width": cfg.style.arrow
          }),
          make("polygon", {
            points: arrow.head.map(point =>
              sx(point.x) + "," + sy(point.y)
            ).join(" "),
            class: "head-" + arrow.kind
          }),
          make("text", {
            x: sx(arrow.label.x),
            y: sy(arrow.label.y),
            class: "text-" + arrow.kind,
            "font-size": cfg.style.labelFont,
            "text-anchor": "middle"
          }, arrow.label.text)
        );
      });
      svg.append(transfers);

      fallback.hidden = true;
      svg.hidden = false;
    } catch (error) {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
