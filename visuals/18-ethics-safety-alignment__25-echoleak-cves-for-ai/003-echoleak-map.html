<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карта zero-click атаки EchoLeak</title>
<style>
:root{
  color-scheme:light dark;
  --page:#f5f7fb;
  --panel:#ffffff;
  --ink:#182033;
  --muted:#59647a;
  --line:#77839a;
  --border:#cbd3e1;
  --track:#e8edf6;
  --blue:#2563a9;
  --blue-soft:#e2efff;
  --amber:#a85d00;
  --amber-soft:#fff0d2;
  --violet:#7045a0;
  --violet-soft:#eee4fa;
  --red:#a3313b;
  --red-soft:#fbe2e4;
  --banner:#152846;
  --banner-ink:#ffffff;
}
@media (prefers-color-scheme:dark){
  :root{
    --page:#10151f;
    --panel:#171f2d;
    --ink:#edf2fb;
    --muted:#b8c2d4;
    --line:#aeb9cb;
    --border:#3a465b;
    --track:#222c3c;
    --blue:#73b5ff;
    --blue-soft:#173453;
    --amber:#ffc46b;
    --amber-soft:#493319;
    --violet:#c7a4f4;
    --violet-soft:#39284d;
    --red:#ff929b;
    --red-soft:#4b252b;
    --banner:#dce9ff;
    --banner-ink:#12223d;
  }
}
html,body{background:var(--page);color:var(--ink)}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:22px}
svg{
  display:block;
  width:100%;
  height:auto;
  max-height:520px;
  background:var(--page);
}
.node-card{fill:var(--panel);stroke:var(--border);stroke-width:1.5}
.accent{stroke:none}
.icon-halo,.tag-bg{stroke:none}
.icon-line{
  fill:none;
  stroke:currentColor;
  stroke-width:2.4;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.icon-fill{fill:currentColor;stroke:none}
.node-title{fill:var(--ink);font-size:17px;font-weight:bold}
.node-copy{fill:var(--muted);font-size:14px}
.tag-text{font-size:12px;font-weight:bold}
.flow-line{
  fill:none;
  stroke:var(--line);
  stroke-width:3;
  stroke-linecap:round;
}
.flow-head{fill:var(--line)}
.banner{fill:var(--banner);stroke:none}
.banner-text{fill:var(--banner-ink);font-size:15px;font-weight:bold}
.brace{stroke:var(--line);stroke-width:2;fill:none;stroke-linecap:round}
.brace-text{fill:var(--ink);font-size:16px;font-weight:bold}
.danger{color:var(--red)}
.danger .accent{fill:var(--red)}
.danger .icon-halo,.danger .tag-bg{fill:var(--red-soft)}
.danger .tag-text{fill:var(--red)}
.retrieval{color:var(--blue)}
.retrieval .accent{fill:var(--blue)}
.retrieval .icon-halo,.retrieval .tag-bg{fill:var(--blue-soft)}
.retrieval .tag-text{fill:var(--blue)}
.warning{color:var(--amber)}
.warning .accent{fill:var(--amber)}
.warning .icon-halo,.warning .tag-bg{fill:var(--amber-soft)}
.warning .tag-text{fill:var(--amber)}
.secret{color:var(--violet)}
.secret .accent{fill:var(--violet)}
.secret .icon-halo,.secret .tag-bg{fill:var(--violet-soft)}
.secret .tag-text{fill:var(--violet)}
.fallback{fill:var(--ink);font-size:18px}
</style>
</head>
<body>
<h1>Карта zero-click атаки EchoLeak</h1>
<svg id="map" viewBox="0 0 1200 430" width="1200" height="430"
     preserveAspectRatio="xMidYMid meet" role="img"
     aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Цепочка zero-click атаки EchoLeak</title>
  <desc id="svg-desc">Пять связанных узлов от письма злоумышленника до утечки секретов через разрешённый Microsoft URL.</desc>
</svg>

<script>
const data=[
  {
    origin:{x:0,y:0},scale:{x:1,y:1},
    canvas:{left:0,top:0,right:1200,bottom:430},
    banner:{x:325,y:18,w:550,h:44,r:16,textX:600,textY:46},
    fallback:[
      {x:600,y:178,text:"Схема должна была показать цепочку EchoLeak:"},
      {x:600,y:216,text:"письмо → RAG → скрытая инструкция → почта и MFA-коды"},
      {x:600,y:254,text:"→ утечка через разрешённый Microsoft URL"}
    ]
  },
  [
    {
      tone:"danger",box:{x:25,y:90,w:210,h:250,r:18},
      accent:{x:25,y:90,w:210,h:8,r:18},
      halo:{cx:130,cy:130,r:27},
      icon:[
        {type:"rect",x:101,y:115,w:58,h:38,r:4},
        {type:"line",x1:102,y1:117,x2:130,y2:137},
        {type:"line",x1:158,y1:117,x2:130,y2:137},
        {type:"line",x1:102,y1:151,x2:121,y2:135},
        {type:"line",x1:158,y1:151,x2:139,y2:135}
      ],
      title:[
        {x:130,y:181,text:"Письмо"},
        {x:130,y:203,text:"злоумышленника"}
      ],
      copy:[
        {x:130,y:249,text:"Уже во входящих."},
        {x:130,y:271,text:"Сотрудник его"},
        {x:130,y:293,text:"не открывает."}
      ],
      tag:{x:59,y:306,w:142,h:24,r:12,textX:130,textY:323,text:"НЕТ КЛИКА"}
    },
    {
      tone:"retrieval",box:{x:260,y:90,w:210,h:250,r:18},
      accent:{x:260,y:90,w:210,h:8,r:18},
      halo:{cx:365,cy:130,r:27},
      icon:[
        {type:"rect",x:337,y:109,w:41,h:51,r:4},
        {type:"line",x1:345,y1:120,x2:369,y2:120},
        {type:"line",x1:345,y1:130,x2:364,y2:130},
        {type:"circle",cx:381,cy:148,r:13},
        {type:"line",x1:390,y1:157,x2:401,y2:168}
      ],
      title:[
        {x:365,y:181,text:"Zero-click получение"},
        {x:365,y:203,text:"через RAG"}
      ],
      copy:[
        {x:365,y:249,text:"Copilot сам находит"},
        {x:365,y:271,text:"письмо при обычном"},
        {x:365,y:293,text:"запросе пользователя."}
      ],
      tag:{x:312,y:306,w:106,h:24,r:12,textX:365,textY:323,text:"RAG"}
    },
    {
      tone:"warning",box:{x:495,y:90,w:210,h:250,r:18},
      accent:{x:495,y:90,w:210,h:8,r:18},
      halo:{cx:600,cy:130,r:27},
      icon:[
        {type:"rect",x:566,y:109,w:68,h:45,r:4},
        {type:"line",x1:577,y1:121,x2:623,y2:121},
        {type:"line",x1:577,y1:132,x2:613,y2:132},
        {type:"line",x1:577,y1:143,x2:624,y2:143},
        {type:"circle",cx:626,cy:157,r:8},
        {type:"line",x1:626,y1:153,x2:626,y2:158},
        {type:"circle",cx:626,cy:163,r:2,fill:true}
      ],
      title:[
        {x:600,y:181,text:"Скрытая"},
        {x:600,y:203,text:"инструкция"}
      ],
      copy:[
        {x:600,y:249,text:"Текст попадает"},
        {x:600,y:271,text:"в контекст и начинает"},
        {x:600,y:293,text:"управлять помощником."}
      ],
      tag:{x:535,y:306,w:130,h:24,r:12,textX:600,textY:323,text:"КОНТЕКСТ"}
    },
    {
      tone:"secret",box:{x:730,y:90,w:210,h:250,r:18},
      accent:{x:730,y:90,w:210,h:8,r:18},
      halo:{cx:835,cy:130,r:27},
      icon:[
        {type:"rect",x:808,y:128,w:54,h:36,r:5},
        {type:"polyline",points:[[818,128],[818,118],[823,109],[835,105],[847,109],[852,118],[852,128]]},
        {type:"circle",cx:835,cy:143,r:5},
        {type:"line",x1:835,y1:148,x2:835,y2:155}
      ],
      title:[
        {x:835,y:181,text:"Доступ к почте"},
        {x:835,y:203,text:"и MFA-кодам"}
      ],
      copy:[
        {x:835,y:249,text:"Помощник ищет"},
        {x:835,y:271,text:"секретные данные"},
        {x:835,y:293,text:"в доступной переписке."}
      ],
      tag:{x:779,y:306,w:112,h:24,r:12,textX:835,textY:323,text:"СЕКРЕТЫ"}
    },
    {
      tone:"danger",box:{x:965,y:90,w:210,h:250,r:18},
      accent:{x:965,y:90,w:210,h:8,r:18},
      halo:{cx:1070,cy:130,r:27},
      icon:[
        {type:"rect",x:1031,y:112,w:31,h:18,r:9},
        {type:"rect",x:1078,y:130,w:31,h:18,r:9},
        {type:"line",x1:1054,y1:130,x2:1086,y2:130},
        {type:"line",x1:1058,y1:137,x2:1082,y2:123}
      ],
      title:[
        {x:1070,y:174,text:"Утечка через"},
        {x:1070,y:196,text:"разрешённый"},
        {x:1070,y:218,text:"Microsoft URL"}
      ],
      copy:[
        {x:1070,y:260,text:"Секрет записан в URL."},
        {x:1070,y:282,text:"CSP узнаёт домен"},
        {x:1070,y:304,text:"Microsoft и пропускает."}
      ],
      tag:{x:1013,y:311,w:114,h:20,r:10,textX:1070,textY:326,text:"УТЕЧКА"}
    }
  ],
  [
    {line:{x1:235,y1:215,x2:250,y2:215},head:[[250,207],[260,215],[250,223]]},
    {line:{x1:470,y1:215,x2:485,y2:215},head:[[485,207],[495,215],[485,223]]},
    {line:{x1:705,y1:215,x2:720,y2:215},head:[[720,207],[730,215],[720,223]]},
    {line:{x1:940,y1:215,x2:955,y2:215},head:[[955,207],[965,215],[955,223]]}
  ],
  {
    line:{x1:25,y1:380,x2:1175,y2:380},
    left:{x1:25,y1:370,x2:25,y2:390},
    right:{x1:1175,y1:370,x2:1175,y2:390},
    text:{x:600,y:414,value:"Клик сотрудника не требуется: все ходы делает система"}
  }
];

const [meta,nodes,links,brace]=data;
const origin=meta.origin;
const scale=meta.scale;
const sx=x=>origin.x+x*scale.x;
const sy=y=>origin.y+y*scale.y;

const svg=document.getElementById("map");
const ns="http://www.w3.org/2000/svg";
const make=(name,attrs={})=>{
  const node=document.createElementNS(ns,name);
  Object.entries(attrs).forEach(([key,value])=>node.setAttribute(key,String(value)));
  return node;
};
const addText=(parent,item,className,anchor="middle")=>{
  const text=make("text",{
    x:sx(item.x),y:sy(item.y),class:className,"text-anchor":anchor
  });
  text.textContent=item.text;
  parent.appendChild(text);
};
const addRect=(parent,g,className)=>{
  parent.appendChild(make("rect",{
    x:sx(g.x),y:sy(g.y),
    width:sx(g.w)-sx(meta.canvas.left),
    height:sy(g.h)-sy(meta.canvas.top),
    rx:sx(g.r)-sx(meta.canvas.left),
    class:className
  }));
};
const addPrimitive=(parent,g)=>{
  if(g.type==="rect"){
    addRect(parent,g,"icon-line");
  }else if(g.type==="line"){
    parent.appendChild(make("line",{
      x1:sx(g.x1),y1:sy(g.y1),x2:sx(g.x2),y2:sy(g.y2),class:"icon-line"
    }));
  }else if(g.type==="circle"){
    parent.appendChild(make("circle",{
      cx:sx(g.cx),cy:sy(g.cy),
      r:sx(g.r)-sx(meta.canvas.left),
      class:g.fill?"icon-fill":"icon-line"
    }));
  }else if(g.type==="polyline"){
    parent.appendChild(make("polyline",{
      points:g.points.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" "),
      class:"icon-line"
    }));
  }
};

try{
  const background=make("rect",{
    x:sx(meta.canvas.left),y:sy(meta.canvas.top),
    width:sx(meta.canvas.right)-sx(meta.canvas.left),
    height:sy(meta.canvas.bottom)-sy(meta.canvas.top),
    fill:"var(--page)"
  });
  svg.appendChild(background);

  addRect(svg,meta.banner,"banner");
  addText(svg,{
    x:meta.banner.textX,y:meta.banner.textY,
    text:"ZERO-CLICK: СЛЕДУЮЩИЙ ХОД ДЕЛАЕТ RAG"
  },"banner-text");

  links.forEach(link=>{
    svg.appendChild(make("line",{
      x1:sx(link.line.x1),y1:sy(link.line.y1),
      x2:sx(link.line.x2),y2:sy(link.line.y2),
      class:"flow-line"
    }));
    svg.appendChild(make("polygon",{
      points:link.head.map(([x,y])=>`${sx(x)},${sy(y)}`).join(" "),
      class:"flow-head"
    }));
  });

  nodes.forEach(node=>{
    const group=make("g",{class:`node ${node.tone}`});
    addRect(group,node.box,"node-card");
    addRect(group,node.accent,"accent");
    group.appendChild(make("circle",{
      cx:sx(node.halo.cx),cy:sy(node.halo.cy),
      r:sx(node.halo.r)-sx(meta.canvas.left),
      class:"icon-halo"
    }));
    node.icon.forEach(item=>addPrimitive(group,item));
    node.title.forEach(item=>addText(group,item,"node-title"));
    node.copy.forEach(item=>addText(group,item,"node-copy"));
    addRect(group,node.tag,"tag-bg");
    addText(group,{
      x:node.tag.textX,y:node.tag.textY,text:node.tag.text
    },"tag-text");
    svg.appendChild(group);
  });

  [brace.line,brace.left,brace.right].forEach(line=>{
    svg.appendChild(make("line",{
      x1:sx(line.x1),y1:sy(line.y1),
      x2:sx(line.x2),y2:sy(line.y2),
      class:"brace"
    }));
  });
  addText(svg,{
    x:brace.text.x,y:brace.text.y,text:brace.text.value
  },"brace-text");
}catch(error){
  svg.replaceChildren();
  svg.appendChild(make("rect",{
    x:sx(meta.canvas.left),y:sy(meta.canvas.top),
    width:sx(meta.canvas.right)-sx(meta.canvas.left),
    height:sy(meta.canvas.bottom)-sy(meta.canvas.top),
    fill:"var(--page)"
  }));
  meta.fallback.forEach(item=>addText(svg,item,"fallback"));
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
