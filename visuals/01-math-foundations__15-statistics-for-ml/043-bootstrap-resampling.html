<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как одна выборка превращается в множество бутстрэп-выборок</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f9fc;
      --panel: #ffffff;
      --panel-soft: #f1f5f9;
      --ink: #172033;
      --muted: #5b677a;
      --line: #aab5c5;
      --strong-line: #66758b;
      --accent: #1769e0;
      --accent-soft: #e8f1ff;
      --repeat: #7c3aed;
      --repeat-soft: #f1eaff;
      --shadow: #d9e0ea;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111722;
        --panel: #182130;
        --panel-soft: #202b3b;
        --ink: #edf3ff;
        --muted: #b2bfd0;
        --line: #536176;
        --strong-line: #8897ad;
        --accent: #79adff;
        --accent-soft: #213b62;
        --repeat: #c4a0ff;
        --repeat-soft: #3d2d59;
        --shadow: #0a0f18;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    body {
      padding: 14px;
    }

    .figure {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 8px 24px var(--shadow);
    }

    .figure__header {
      padding: 14px 20px 10px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 720;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .canvas {
      width: 100%;
      display: block;
      max-height: 450px;
      background: var(--panel);
    }

    .fallback {
      margin: 0;
      padding: 28px 20px;
      color: var(--ink);
      font-size: 16px;
      background: var(--panel);
    }

    .fallback[hidden] {
      display: none;
    }

    svg text {
      fill: var(--ink);
      font-family: inherit;
      font-size: 16px;
    }

    svg .section-label {
      font-size: 17px;
      font-weight: 700;
    }

    svg .small-label {
      fill: var(--muted);
      font-size: 14px;
    }

    svg .row-label {
      font-size: 15px;
      font-weight: 680;
    }

    svg .chip-text {
      font-size: 18px;
      font-weight: 740;
    }

    svg .sample-card {
      fill: var(--panel-soft);
      stroke: var(--line);
      stroke-width: 1.5;
    }

    svg .source-chip {
      fill: var(--accent-soft);
      stroke: var(--accent);
      stroke-width: 2;
    }

    svg .sample-chip {
      fill: var(--panel);
      stroke: var(--strong-line);
      stroke-width: 1.5;
    }

    svg .sample-chip.repeated {
      fill: var(--repeat-soft);
      stroke: var(--repeat);
      stroke-width: 2;
    }

    svg .arrow {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
    }

    svg .arrow-head {
      fill: var(--accent);
    }

    svg .repeat-key {
      fill: var(--repeat-soft);
      stroke: var(--repeat);
      stroke-width: 1.5;
    }

    svg .meta-repeat {
      fill: var(--repeat);
      font-size: 14px;
      font-weight: 650;
    }

    svg .meta-missing {
      fill: var(--muted);
      font-size: 14px;
    }

    svg .divider {
      stroke: var(--line);
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-title">
    <header class="figure__header">
      <h1 id="diagram-title">Как одна выборка превращается в множество бутстрэп-выборок</h1>
      <p class="subtitle">Каждый переотбор имеет тот же размер и использует только исходные наблюдения.</p>
    </header>

    <svg
      id="diagram"
      class="canvas"
      viewBox="0 0 1000 450"
      width="1000"
      height="450"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-label="Исходная выборка 2, 4, 5, 8, 11 и три бутстрэп-выборки с повторениями и пропущенными наблюдениями">
    </svg>

    <p id="fallback" class="fallback">
      Схема должна была показать исходные наблюдения 2, 4, 5, 8, 11 и три выборки того же размера, полученные случайным выбором с возвращением.
    </p>
  </main>

  <script>
    const DATA = Object.freeze({
      zero: 0,
      origin: { x: 20, y: 12 },
      scale: { x: 1, y: 1 },
      labelPad: 12,
      corner: 10,
      source: {
        values: [2, 4, 5, 8, 11],
        label: { x: 176, y: 74 },
        start: { x: 195, y: 48 },
        chip: { w: 74, h: 52, gap: 12 },
        note: { x: 650, y: 74 }
      },
      arrow: {
        from: { x: 424, y: 110 },
        to: { x: 424, y: 154 },
        head: [
          { x: 414, y: 143 },
          { x: 424, y: 157 },
          { x: 434, y: 143 }
        ],
        label: { x: 445, y: 129 }
      },
      samplesHeader: {
        title: { x: 90, y: 178 },
        keyBox: { x: 700, y: 163, w: 22, h: 18 },
        keyText: { x: 734, y: 178 }
      },
      card: { x: 95, w: 810, h: 64, corner: 12 },
      rowLabelX: 120,
      sampleStartX: 260,
      sampleChip: { w: 65, h: 44, gap: 10, topInset: 10 },
      metaX: 660,
      metaRepeatInset: 23,
      metaMissingInset: 45,
      rows: [
        {
          y: 195,
          name: "вариант А",
          values: [2, 2, 5, 11, 11],
          repeated: [2, 11],
          repeatText: "повтор: 2, 11",
          missingText: "не попали: 4, 8"
        },
        {
          y: 275,
          name: "вариант Б",
          values: [4, 5, 5, 8, 4],
          repeated: [4, 5],
          repeatText: "повтор: 4, 5",
          missingText: "не попали: 2, 11"
        },
        {
          y: 355,
          name: "вариант В",
          values: [11, 8, 8, 8, 2],
          repeated: [8],
          repeatText: "повтор: 8",
          missingText: "не попали: 4, 5"
        }
      ]
    });

    const origin = Object.freeze(DATA.origin);
    const scale = Object.freeze(DATA.scale);
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const svg = document.getElementById("diagram");
      const fallback = document.getElementById("fallback");
      const NS = "http://www.w3.org/2000/svg";

      const make = (name, attrs, text) => {
        const node = document.createElementNS(NS, name);
        Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const addText = (parent, point, text, className, anchor) => {
        parent.appendChild(make("text", {
          x: sx(point.x),
          y: sy(point.y),
          class: className,
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, text));
      };

      const addRect = (parent, box, className, corner) => {
        parent.appendChild(make("rect", {
          x: sx(box.x),
          y: sy(box.y),
          width: sx(box.x + box.w) - sx(box.x),
          height: sy(box.y + box.h) - sy(box.y),
          rx: sx(corner) - sx(DATA.zero),
          ry: sy(corner) - sy(DATA.zero),
          class: className
        }));
      };

      const addChip = (parent, box, value, className) => {
        addRect(parent, box, className, DATA.corner);
        addText(parent, {
          x: box.x + box.w / DATA.source.values.length * DATA.source.values.length / [2, 2].length,
          y: box.y + box.h / [2, 2].length
        }, String(value), "chip-text", "middle");
      };

      const sourceGroup = make("g", {
        "aria-label": "Исходная выборка"
      });

      addText(
        sourceGroup,
        DATA.source.label,
        "Исходная выборка",
        "section-label",
        "end"
      );

      DATA.source.values.forEach((value, index) => {
        const box = {
          x: DATA.source.start.x +
            index * (DATA.source.chip.w + DATA.source.chip.gap),
          y: DATA.source.start.y,
          w: DATA.source.chip.w,
          h: DATA.source.chip.h
        };
        addChip(sourceGroup, box, value, "source-chip");
      });

      addText(
        sourceGroup,
        DATA.source.note,
        "пять наблюдений",
        "small-label",
        "start"
      );

      svg.appendChild(sourceGroup);

      svg.appendChild(make("line", {
        x1: sx(DATA.arrow.from.x),
        y1: sy(DATA.arrow.from.y),
        x2: sx(DATA.arrow.to.x),
        y2: sy(DATA.arrow.to.y),
        class: "arrow"
      }));

      svg.appendChild(make("polygon", {
        points: DATA.arrow.head
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: "arrow-head"
      }));

      addText(
        svg,
        DATA.arrow.label,
        "случайный выбор с возвращением",
        "small-label",
        "start"
      );

      addText(
        svg,
        DATA.samplesHeader.title,
        "Три бутстрэп-выборки того же размера",
        "section-label",
        "start"
      );

      addRect(
        svg,
        DATA.samplesHeader.keyBox,
        "repeat-key",
        DATA.corner
      );

      addText(
        svg,
        DATA.samplesHeader.keyText,
        "цветом отмечены повторы",
        "small-label",
        "start"
      );

      DATA.rows.forEach(row => {
        const group = make("g", {
          "aria-label": `${row.name}: ${row.values.join(", ")}`
        });

        const cardBox = {
          x: DATA.card.x,
          y: row.y,
          w: DATA.card.w,
          h: DATA.card.h
        };

        addRect(group, cardBox, "sample-card", DATA.card.corner);

        addText(group, {
          x: DATA.rowLabelX,
          y: row.y + DATA.card.h / [2, 2].length
        }, row.name, "row-label", "start");

        row.values.forEach((value, index) => {
          const box = {
            x: DATA.sampleStartX +
              index * (DATA.sampleChip.w + DATA.sampleChip.gap),
            y: row.y + DATA.sampleChip.topInset,
            w: DATA.sampleChip.w,
            h: DATA.sampleChip.h
          };
          const className = row.repeated.includes(value)
            ? "sample-chip repeated"
            : "sample-chip";
          addChip(group, box, value, className);
        });

        group.appendChild(make("line", {
          x1: sx(DATA.metaX - DATA.labelPad),
          y1: sy(row.y + DATA.sampleChip.topInset),
          x2: sx(DATA.metaX - DATA.labelPad),
          y2: sy(row.y + DATA.card.h - DATA.sampleChip.topInset),
          class: "divider"
        }));

        addText(group, {
          x: DATA.metaX,
          y: row.y + DATA.metaRepeatInset
        }, row.repeatText, "meta-repeat", "start");

        addText(group, {
          x: DATA.metaX,
          y: row.y + DATA.metaMissingInset
        }, row.missingText, "meta-missing", "start");

        svg.appendChild(group);
      });

      fallback.hidden = true;
    } catch (error) {
      const fallback = document.getElementById("fallback");
      fallback.hidden = false;
      fallback.textContent =
        "Схема должна была показать исходные наблюдения 2, 4, 5, 8, 11 и три выборки того же размера: некоторые числа повторяются, а некоторые не попадают в конкретный переотбор.";
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
