<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Как читать ковариационную матрицу 3 × 3</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --panel: #ffffff;
      --ink: #182033;
      --muted: #59647a;
      --grid: #aeb8ca;
      --guide: #e8edf6;
      --guide-strong: #d4deed;
      --diag-fill: #dce8ff;
      --diag-stroke: #527dcc;
      --diag-ink: #173f7a;
      --pair-a-fill: #efe2ff;
      --pair-a-stroke: #9462c5;
      --pair-a-ink: #5a287e;
      --pair-b-fill: #ffe5d4;
      --pair-b-stroke: #d77942;
      --pair-b-ink: #773718;
      --pair-c-fill: #dff3e8;
      --pair-c-stroke: #4f9a72;
      --pair-c-ink: #205d3d;
      --shadow: #2437541f;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: unset;
      background: var(--page);
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--ink);
    }

    .frame {
      width: 100%;
      max-width: 1200px;
      margin-inline: auto;
      background: var(--panel);
      box-shadow: 0 1px 8px var(--shadow);
      overflow: hidden;
    }

    .heading {
      margin: unset;
      padding: 12px 24px 10px;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.25;
      color: var(--ink);
      border-bottom: 1px solid var(--guide-strong);
    }

    #diagram {
      display: block;
      width: 100%;
      height: auto;
      max-height: 448px;
      background: var(--panel);
    }

    .label {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      fill: var(--ink);
    }

    .muted {
      fill: var(--muted);
    }

    .header-label {
      font-weight: bold;
      fill: var(--ink);
    }

    .cell-main {
      font-weight: bold;
    }

    .diag-text {
      fill: var(--diag-ink);
    }

    .pair-a-text {
      fill: var(--pair-a-ink);
    }

    .pair-b-text {
      fill: var(--pair-b-ink);
    }

    .pair-c-text {
      fill: var(--pair-c-ink);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111622;
        --panel: #171e2c;
        --ink: #edf2ff;
        --muted: #b2bdd2;
        --grid: #647088;
        --guide: #232d40;
        --guide-strong: #344057;
        --diag-fill: #203c69;
        --diag-stroke: #7ba4ed;
        --diag-ink: #d7e6ff;
        --pair-a-fill: #432a59;
        --pair-a-stroke: #c28aee;
        --pair-a-ink: #f1d9ff;
        --pair-b-fill: #563221;
        --pair-b-stroke: #ee9a68;
        --pair-b-ink: #ffe0cd;
        --pair-c-fill: #234534;
        --pair-c-stroke: #72c493;
        --pair-c-ink: #d7f5e2;
        --shadow: #00000066;
        --white: #ffffff;
      }
    }
  </style>
</head>
<body>
  <main class="frame">
    <h1 class="heading">Как читать ковариационную матрицу 3 × 3</h1>
    <svg
      id="diagram"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 1200 448"
      width="1200"
      height="448"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Симметричная ковариационная матрица роста, веса и возраста</title>
      <desc id="svg-description">
        На диагонали показаны дисперсии признаков, вне диагонали — ковариации.
        Зеркальные клетки каждой пары признаков выделены одинаковым цветом.
      </desc>
    </svg>
  </main>

  <script>
    const diagramData = Object.freeze({
      canvas: [0, 0, 1200, 448],
      origin: [24, 12],
      scale: [1, 1],
      layout: {
        guide: [18, 48, 230, 294],
        guideTitle: [36, 76],
        guideSteps: [
          [36, 112, 194, 48, "Сначала — строка"],
          [36, 180, 194, 48, "Затем — столбец"],
          [36, 248, 194, 64, "На пересечении", "совместное изменение"]
        ],
        guideLines: [
          [133, 160, 133, 180],
          [133, 228, 133, 248]
        ],
        guideTips: [
          [126, 172, 133, 180, 140, 172],
          [126, 240, 133, 248, 140, 240]
        ],
        corner: [272, 48, 178, 66],
        cornerText: [361, 76, "строка ↓"],
        cornerSubtext: [361, 98, "столбец →"],
        grid: [450, 114, 230, 82],
        columnHeaders: [
          [565, 78, "Рост"],
          [795, 78, "Вес"],
          [1025, 78, "Возраст"]
        ],
        columnRules: [
          [475, 92, 655, 92],
          [705, 92, 885, 92],
          [935, 92, 1115, 92]
        ],
        rowHeaders: [
          [430, 155, "Рост"],
          [430, 237, "Вес"],
          [430, 319, "Возраст"]
        ],
        cells: [
          [0, 0, "diag", "Var(рост)", "дисперсия роста"],
          [0, 1, "pair-a", "Cov(рост, вес)", "зеркальная пара"],
          [0, 2, "pair-b", "Cov(рост, возраст)", "зеркальная пара"],
          [1, 0, "pair-a", "Cov(вес, рост)", "зеркальная пара"],
          [1, 1, "diag", "Var(вес)", "дисперсия веса"],
          [1, 2, "pair-c", "Cov(вес, возраст)", "зеркальная пара"],
          [2, 0, "pair-b", "Cov(возраст, рост)", "зеркальная пара"],
          [2, 1, "pair-c", "Cov(возраст, вес)", "зеркальная пара"],
          [2, 2, "diag", "Var(возраст)", "дисперсия возраста"]
        ],
        cellText: [115, 35, 59],
        legendRule: [18, 368, 1134, 368],
        legend: [
          [36, 399, "diag", "Диагональ: Var — дисперсия одного признака"],
          [450, 399, "pair-a", "Вне диагонали: Cov — связь двух признаков"],
          [36, 428, "mirror", "Одинаковый цвет означает одну зеркальную пару: Cov(A, B) = Cov(B, A)"]
        ],
        swatches: [
          [18, 386, 10, 18],
          [432, 386, 10, 18],
          [18, 415, 10, 18],
          [31, 415, 10, 18]
        ]
      }
    });

    const [originX, originY] = diagramData.origin;
    const [scaleX, scaleY] = diagramData.scale;
    const origin = Object.freeze({ x: originX, y: originY });
    const scale = Object.freeze({ x: scaleX, y: scaleY });
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const labelOffset = 10;
    const thinLine = 1;
    const regularLine = 2;
    const guideFont = 15;
    const headerFont = 17;
    const formulaFont = 16;
    const noteFont = 13;
    const legendFont = 14;

    try {
      const svg = document.getElementById("diagram");
      const namespace = svg.namespaceURI;
      const layout = diagramData.layout;

      const make = (name, attributes, className) => {
        const node = document.createElementNS(namespace, name);
        Object.entries(attributes).forEach(([key, value]) => {
          node.setAttribute(key, String(value));
        });
        if (className) node.setAttribute("class", className);
        return node;
      };

      const group = className => {
        const node = make("g", {}, className);
        svg.appendChild(node);
        return node;
      };

      const rect = (parent, x, y, width, height, className, fill, stroke, strokeWidth) => {
        const node = make("rect", {
          x: sx(x),
          y: sy(y),
          width: sx(x + width) - sx(x),
          height: sy(y + height) - sy(y),
          fill,
          stroke,
          "stroke-width": strokeWidth
        }, className);
        parent.appendChild(node);
        return node;
      };

      const line = (parent, xOne, yOne, xTwo, yTwo, stroke, strokeWidth) => {
        const node = make("line", {
          x1: sx(xOne),
          y1: sy(yOne),
          x2: sx(xTwo),
          y2: sy(yTwo),
          stroke,
          "stroke-width": strokeWidth,
          "stroke-linecap": "round"
        });
        parent.appendChild(node);
        return node;
      };

      const polyline = (parent, points, stroke, strokeWidth) => {
        const converted = points
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" ");
        const node = make("polyline", {
          points: converted,
          fill: "none",
          stroke,
          "stroke-width": strokeWidth,
          "stroke-linecap": "round",
          "stroke-linejoin": "round"
        });
        parent.appendChild(node);
        return node;
      };

      const text = (parent, x, y, value, anchor, className, fontSize) => {
        const node = make("text", {
          x: sx(x),
          y: sy(y),
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        }, className);
        node.style.fontSize = `${fontSize}px`;
        node.textContent = value;
        parent.appendChild(node);
        return node;
      };

      const colorFor = kind => {
        const colors = {
          "diag": ["var(--diag-fill)", "var(--diag-stroke)", "diag-text"],
          "pair-a": ["var(--pair-a-fill)", "var(--pair-a-stroke)", "pair-a-text"],
          "pair-b": ["var(--pair-b-fill)", "var(--pair-b-stroke)", "pair-b-text"],
          "pair-c": ["var(--pair-c-fill)", "var(--pair-c-stroke)", "pair-c-text"]
        };
        return colors[kind];
      };

      const guideLayer = group("guide-layer");
      const [guideX, guideY, guideWidth, guideHeight] = layout.guide;
      rect(
        guideLayer,
        guideX,
        guideY,
        guideWidth,
        guideHeight,
        "",
        "var(--guide)",
        "var(--guide-strong)",
        thinLine
      );

      const [guideTitleX, guideTitleY] = layout.guideTitle;
      text(
        guideLayer,
        guideTitleX,
        guideTitleY,
        "Маршрут чтения",
        "start",
        "label header-label",
        headerFont
      );

      layout.guideSteps.forEach(step => {
        const [x, y, width, height, firstLine, secondLine] = step;
        rect(
          guideLayer,
          x,
          y,
          width,
          height,
          "",
          "var(--panel)",
          "var(--guide-strong)",
          regularLine
        );
        const textX = x + width / scale.x / (scale.x + scale.x);
        const firstY = secondLine ? y + height / scale.y / (scale.y + scale.y) - labelOffset : y + height / scale.y / (scale.y + scale.y);
        text(
          guideLayer,
          textX,
          firstY,
          firstLine,
          "middle",
          "label",
          guideFont
        );
        if (secondLine) {
          text(
            guideLayer,
            textX,
            firstY + labelOffset + labelOffset,
            secondLine,
            "middle",
            "label muted",
            noteFont
          );
        }
      });

      layout.guideLines.forEach(segment => {
        const [xOne, yOne, xTwo, yTwo] = segment;
        line(
          guideLayer,
          xOne,
          yOne,
          xTwo,
          yTwo,
          "var(--muted)",
          regularLine
        );
      });

      layout.guideTips.forEach(tip => {
        const [leftX, topY, pointX, pointY, rightX, rightY] = tip;
        polyline(
          guideLayer,
          [[leftX, topY], [pointX, pointY], [rightX, rightY]],
          "var(--muted)",
          regularLine
        );
      });

      const headerLayer = group("headers");
      const [cornerX, cornerY, cornerWidth, cornerHeight] = layout.corner;
      rect(
        headerLayer,
        cornerX,
        cornerY,
        cornerWidth,
        cornerHeight,
        "",
        "var(--guide)",
        "var(--guide-strong)",
        thinLine
      );

      const [cornerTextX, cornerTextY, cornerValue] = layout.cornerText;
      const [cornerSubX, cornerSubY, cornerSubValue] = layout.cornerSubtext;
      text(
        headerLayer,
        cornerTextX,
        cornerTextY,
        cornerValue,
        "middle",
        "label header-label",
        guideFont
      );
      text(
        headerLayer,
        cornerSubX,
        cornerSubY,
        cornerSubValue,
        "middle",
        "label muted",
        noteFont
      );

      layout.columnHeaders.forEach(item => {
        const [x, y, value] = item;
        text(
          headerLayer,
          x,
          y,
          value,
          "middle",
          "label header-label",
          headerFont
        );
      });

      layout.columnRules.forEach(rule => {
        const [xOne, yOne, xTwo, yTwo] = rule;
        line(
          headerLayer,
          xOne,
          yOne,
          xTwo,
          yTwo,
          "var(--grid)",
          regularLine
        );
      });

      layout.rowHeaders.forEach(item => {
        const [x, y, value] = item;
        text(
          headerLayer,
          x,
          y,
          value,
          "end",
          "label header-label",
          headerFont
        );
      });

      const cellLayer = group("matrix-cells");
      const [gridX, gridY, cellWidth, cellHeight] = layout.grid;
      const [textCenterX, mainOffsetY, noteOffsetY] = layout.cellText;

      layout.cells.forEach(cell => {
        const [row, column, kind, mainValue, noteValue] = cell;
        const x = gridX + column * cellWidth;
        const y = gridY + row * cellHeight;
        const [fill, stroke, textClass] = colorFor(kind);

        rect(
          cellLayer,
          x,
          y,
          cellWidth,
          cellHeight,
          "",
          fill,
          stroke,
          regularLine
        );

        text(
          cellLayer,
          x + textCenterX,
          y + mainOffsetY,
          mainValue,
          "middle",
          `label cell-main ${textClass}`,
          formulaFont
        );

        text(
          cellLayer,
          x + textCenterX,
          y + noteOffsetY,
          noteValue,
          "middle",
          `label ${textClass}`,
          noteFont
        );
      });

      const legendLayer = group("legend");
      const [ruleXOne, ruleYOne, ruleXTwo, ruleYTwo] = layout.legendRule;
      line(
        legendLayer,
        ruleXOne,
        ruleYOne,
        ruleXTwo,
        ruleYTwo,
        "var(--guide-strong)",
        thinLine
      );

      layout.swatches.forEach((swatch, swatchIndex) => {
        const [x, y, width, height] = swatch;
        const kinds = ["diag", "pair-a", "pair-b", "pair-b"];
        const [fill, stroke] = colorFor(kinds[swatchIndex]);
        rect(
          legendLayer,
          x,
          y,
          width,
          height,
          "",
          fill,
          stroke,
          thinLine
        );
      });

      layout.legend.forEach(item => {
        const [x, y, kind, value] = item;
        const textClass = kind === "mirror" ? "label" : `label ${colorFor(kind)[2]}`;
        text(
          legendLayer,
          x,
          y,
          value,
          "start",
          textClass,
          legendFont
        );
      });
    } catch (error) {
      const svg = document.getElementById("diagram");
      const namespace = svg.namespaceURI;
      const fallback = document.createElementNS(namespace, "text");
      const [, , canvasWidth, canvasHeight] = diagramData.canvas;
      fallback.setAttribute("x", String(sx(canvasWidth / (scale.x + scale.x) - origin.x)));
      fallback.setAttribute("y", String(sy(canvasHeight / (scale.y + scale.y) - origin.y)));
      fallback.setAttribute("text-anchor", "middle");
      fallback.setAttribute("class", "label");
      fallback.style.fontSize = `${headerFont}px`;
      fallback.textContent = "Здесь должна быть матрица: Var на диагонали, Cov вне диагонали, зеркальные клетки одного цвета.";
      svg.appendChild(fallback);
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
