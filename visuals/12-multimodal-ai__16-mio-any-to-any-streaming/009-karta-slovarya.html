<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Карта словаря на 48391 запись</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #5a6270;
    --line: #333a45;
    --text-c: #3b6ea5;
    --img-c: #2e8b6f;
    --spe-c: #b07d2b;
    --mus-c: #8a5aa8;
    --sep-c: #c0453c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c;
      --fg: #e8ebef;
      --muted: #9aa4b2;
      --line: #b6bfcc;
      --text-c: #6fa8dc;
      --img-c: #5fc0a0;
      --spe-c: #d9a441;
      --mus-c: #b48ad4;
      --sep-c: #e2716a;
    }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { background: var(--bg); padding: 8px 10px 12px; }
  h2 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  svg { display: block; width: 100%; height: auto; max-height: 470px; background: var(--bg); }
  .fail { color: var(--muted); font-size: 13px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <h2>Карта словаря: 48391 ID в одной шкале</h2>
  <svg id="map" viewBox="0 0 900 300" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Лента словаря из четырёх блоков с границами ID"></svg>
  <div id="fallback" class="fail" hidden></div>
</div>
<script>
(function () {
  var svg = document.getElementById('map');
  var NS = 'http://www.w3.org/2000/svg';

  var BLOCKS = [
    { key: 'text',   name: 'text',   ru: 'текст',      from: 0,     to: 31999, size: 32000, color: 'var(--text-c)' },
    { key: 'image',  name: 'image',  ru: 'картинки',   from: 32000, to: 36095, size: 4096,  color: 'var(--img-c)' },
    { key: 'speech', name: 'speech', ru: 'речь',       from: 36096, to: 40191, size: 4096,  color: 'var(--spe-c)' },
    { key: 'music',  name: 'music',  ru: 'музыка',     from: 40192, to: 48383, size: 8192,  color: 'var(--mus-c)' },
    { key: 'sep',    name: 'sep',    ru: 'метки',      from: 48384, to: 48390, size: 7,     color: 'var(--sep-c)' }
  ];

  var TOTAL = 48391;

  var FS = 12, FS_SMALL = 11, LW = 1.5, PAD = 6;

  try {
    // ---- одна пара функций перевода ----
    var originX = 70, originY = 200;          // sx(0), sy(0)
    var scaleX = 760 / TOTAL;                 // ID -> px
    var scaleY = 22;                          // ярус -> px (вверх положительный)
    function sx(x) { return originX + x * scaleX; }
    function sy(y) { return originY - y * scaleY; }

    function el(n, a) {
      var e = document.createElementNS(NS, n);
      for (var k in a) e.setAttribute(k, a[k]);
      return e;
    }
    function txt(x, y, s, anchor, color, size, weight) {
      var t = el('text', { x: x, y: y, 'text-anchor': anchor, fill: color || 'var(--fg)',
                           'font-size': size || FS, 'font-weight': weight || 'normal' });
      t.textContent = s;
      return t;
    }

    // фон
    svg.appendChild(el('rect', { x: 0, y: 0, width: 900, height: 300, fill: 'var(--bg)' }));

    var BAR_TOP = 1, BAR_BOT = 0;             // ярусы ленты

    // ---- лента блоков ----
    BLOCKS.forEach(function (b) {
      var x0 = sx(b.from), x1 = sx(b.to + 1);
      var w = Math.max(x1 - x0, 1.2);
      svg.appendChild(el('rect', {
        x: x0, y: sy(BAR_TOP), width: w, height: sy(BAR_BOT) - sy(BAR_TOP),
        fill: b.color, 'fill-opacity': 0.75, stroke: b.color, 'stroke-width': LW
      }));
    });

    // ---- границы: засечки вниз + числа ----
    var edges = [
      { v: 0,     lvl: 1, side: 'start' },
      { v: 32000, lvl: 2, side: 'middle' },
      { v: 36096, lvl: 1, side: 'middle' },
      { v: 40192, lvl: 2, side: 'middle' },
      { v: 48384, lvl: 1, side: 'middle' },
      { v: 48390, lvl: 3, side: 'end' }
    ];
    edges.forEach(function (e) {
      var x = sx(e.v);
      svg.appendChild(el('line', {
        x1: x, y1: sy(BAR_BOT), x2: x, y2: sy(-0.35 - 0.55 * e.lvl),
        stroke: 'var(--line)', 'stroke-width': LW
      }));
      svg.appendChild(txt(x, sy(-0.35 - 0.55 * e.lvl) + FS + PAD - 4,
                          String(e.v), e.side, 'var(--muted)', FS_SMALL));
    });

    // ---- подписи блоков над лентой ----
    // широкие — по центру над блоком; узкие — выносными линиями на разные ярусы
    var wide = { text: true, music: true };
    var thinLevel = { image: 2.1, speech: 3.3, sep: 4.5 };

    BLOCKS.forEach(function (b) {
      var cx = (sx(b.from) + sx(b.to + 1)) / 2;
      var label = b.name + ' — ' + b.ru + ', ' + b.size + ' ID';
      if (wide[b.key]) {
        svg.appendChild(txt(cx, sy(BAR_TOP + 0.35), label, 'middle', b.color, FS, '600'));
      } else {
        var lvl = thinLevel[b.key];
        svg.appendChild(el('line', {
          x1: cx, y1: sy(BAR_TOP), x2: cx, y2: sy(BAR_TOP + lvl),
          stroke: b.color, 'stroke-width': LW
        }));
        svg.appendChild(el('line', {
          x1: cx, y1: sy(BAR_TOP + lvl), x2: sx(b.key === 'sep' ? TOTAL : b.to + 1) + (b.key === 'sep' ? 0 : 40),
          y2: sy(BAR_TOP + lvl), stroke: b.color, 'stroke-width': LW
        }));
        var ax = sx(b.key === 'sep' ? TOTAL : b.to + 1) + (b.key === 'sep' ? 0 : 40);
        svg.appendChild(txt(ax + PAD, sy(BAR_TOP + lvl) + 4, label,
                            b.key === 'sep' ? 'end' : 'start', b.color, FS, '600'));
        if (b.key === 'sep') {
          // подпись меток уводим влево-вверх, чтобы не спорить с краем
          var last = svg.lastChild;
          last.setAttribute('x', ax - PAD);
          last.setAttribute('y', sy(BAR_TOP + lvl) - PAD);
        }
      }
    });

    // ---- стрелка охвата всей шкалы под лентой ----
    var aY = sy(-3.2);
    var aL = sx(0), aR = sx(TOTAL);
    svg.appendChild(el('line', { x1: aL, y1: aY, x2: aR, y2: aY,
                                 stroke: 'var(--line)', 'stroke-width': LW }));
    [[aL, 1], [aR, -1]].forEach(function (p) {
      var head = el('polygon', {
        points: [
          p[0], aY,
          p[0] + p[1] * (sx(700) - sx(0)), sy(-3.2) - (sy(0) - sy(0.28)),
          p[0] + p[1] * (sx(700) - sx(0)), sy(-3.2) + (sy(0) - sy(0.28))
        ].join(' '),
        fill: 'var(--line)'
      });
      svg.appendChild(head);
    });
    svg.appendChild(txt(sx(0) + PAD, aY - PAD,
      'вся шкала 48391 ID лежит внутри входного эмбеддинга',
      'start', 'var(--muted)', FS_SMALL));

    // ---- нижняя строка-легенда: ширина = алфавит, не длина ----
    svg.appendChild(txt(sx(0), sy(-4.4),
      'Ширина полоски = сколько разных значений у токена (алфавит).',
      'start', 'var(--fg)', FS));
    svg.appendChild(txt(sx(0), sy(-5.15),
      'Длина последовательности — другое: одна картинка 32x32 = 1024 токена из 4096 возможных.',
      'start', 'var(--muted)', FS_SMALL));
  } catch (err) {
    svg.setAttribute('hidden', 'hidden');
    var f = document.getElementById('fallback');
    f.hidden = false;
    f.textContent = 'Схема должна была показать ленту словаря на 48391 запись: ' +
      'text 0..31999 (32000 ID), image 32000..36095 (4096), speech 36096..40191 (4096), ' +
      'music 40192..48383 (8192), sep 48384..48390 (7). ' +
      'Ширина блока — размер алфавита, а не длина последовательности.';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
