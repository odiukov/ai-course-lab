<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три оси M-RoPE на одной схеме</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; background:#ffffff; color:#16181d;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  figure { margin:0; padding:12px 14px 14px; background:#ffffff; }
  figcaption { font-size:15px; font-weight:600; margin-bottom:10px; }
  svg { display:block; width:100%; height:auto; max-height:520px; background:#ffffff; }
  text { fill:#16181d; }
  .ttl { font-size:13px; font-weight:600; }
  .lbl { font-size:12px; }
  .sml { font-size:11px; fill:#5b6270; }
  .leg { font-size:11.5px; fill:#4a5060; }
  .zone { fill:none; stroke:#3a3f4b; stroke-width:1.6; }
  .zone.off { stroke-dasharray:5 4; stroke:#8b919e; }
  .cell { stroke:#ffffff; stroke-width:0.6; opacity:.55; }
  .z-t.a { fill:#3a6fc4; } .z-t.b { fill:#7ba1e0; }
  .z-h.a { fill:#2f8a63; } .z-h.b { fill:#77c2a0; }
  .z-w.a { fill:#c1701f; } .z-w.b { fill:#e6ad६f; } .z-w.b { fill:#e6ad6f; }
  .pair.zero { fill:#dcdfe5; }
  .a-t { stroke:#2b5fb0; fill:#2b5fb0; }
  .a-h { stroke:#227050; fill:#227050; }
  .a-w { stroke:#a55c12; fill:#a55c12; }
  .arr { stroke-width:1.8; }
  .fb { font-size:13px; line-height:1.5; color:#16181d; }
  @media (prefers-color-scheme: dark) {
    body, figure, svg { background:#14161a; }
    body, text, .fb { color:#e6e8ec; fill:#e6e8ec; }
    .sml { fill:#98a0ae; } .leg { fill:#a9b1bf; }
    .zone { stroke:#c6ccd8; } .zone.off { stroke:#6c7481; }
    .cell { stroke:#14161a; opacity:.5; }
    .z-t.a { fill:#3f6fbe; } .z-t.b { fill:#5f8fdc; }
    .z-h.a { fill:#2c7d5b; } .z-h.b { fill:#48a37c; }
    .z-w.a { fill:#a8631d; } .z-w.b { fill:#cb8a3c; }
    .pair.zero { fill:#3a3f49; }
    .a-t { stroke:#7ea8ea; fill:#7ea8ea; }
    .a-h { stroke:#5fc199; fill:#5fc199; }
    .a-w { stroke:#e0a35e; fill:#e0a35e; }
  }
</style>
<figure>
  <figcaption>Три оси M-RoPE на одной схеме: d = 96 = 32 + 32 + 32</figcaption>
  <div id="holder"></div>
</figure>
<script>
(function () {
  var holder = document.getElementById('holder');
  try {
    var NS = 'http://www.w3.org/2000/svg';

    /* ---- данные схемы ---- */
    var D = {
      zones: [
        { key:'t', from:0,  to:32, name:'время t',   rot:'R_t', mPatch:5,  mText:7 },
        { key:'h', from:32, to:64, name:'высота h',  rot:'R_h', mPatch:10, mText:0 },
        { key:'w', from:64, to:96, name:'ширина w',  rot:'R_w', mPatch:20, mText:0 }
      ],
      d: 96,
      strip1: { top:5,  bot:9 },
      strip2: { top:19, bot:23 },
      arrow:  { tail:13.5, head:9.4 },
      view:   { x0:-2, x1:98, y0:0, y1:30 }
    };

    /* ---- единственный перевод координат ---- */
    var scale = 8;
    var origin = { x: 2 * scale, y: 0 };
    function sx(x) { return origin.x + x * scale; }
    function sy(y) { return origin.y + y * scale; }

    function el(name, attrs) {
      var e = document.createElementNS(NS, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    }
    /* dx/dy — пиксельный отступ подписи от её точки привязки */
    function label(x, y, dx, dy, anchor, cls, s) {
      var t = el('text', { x: sx(x) + dx, y: sy(y) + dy, 'text-anchor': anchor, 'class': cls });
      t.appendChild(document.createTextNode(s));
      return t;
    }

    var svg = el('svg', {
      viewBox: sx(D.view.x0) + ' ' + sy(D.view.y0) + ' ' +
               (sx(D.view.x1) - sx(D.view.x0)) + ' ' + (sy(D.view.y1) - sy(D.view.y0)),
      preserveAspectRatio: 'xMidYMid meet',
      role: 'img',
      'aria-label': 'Вектор из 96 размерностей, разрезанный на три полосы по 32: время, высота, ширина'
    });

    function center(z) { return (z.from + z.to) / 2; }

    function strip(top, bot, mute) {
      D.zones.forEach(function (z) {
        var off = mute && z.mText === 0;
        for (var i = z.from; i < z.to; i += 2) {
          svg.appendChild(el('rect', {
            x: sx(i), y: sy(top),
            width: sx(i + 2) - sx(i), height: sy(bot) - sy(top),
            'class': 'pair z-' + z.key + ((i - z.from) % 4 ? ' b' : ' a') + (off ? ' zero' : '')
          }));
          svg.appendChild(el('line', {
            x1: sx(i + 1), y1: sy(top), x2: sx(i + 1), y2: sy(bot), 'class': 'cell'
          }));
        }
        svg.appendChild(el('rect', {
          x: sx(z.from), y: sy(top),
          width: sx(z.to) - sx(z.from), height: sy(bot) - sy(top),
          'class': 'zone' + (off ? ' off' : '')
        }));
      });
    }

    /* ---- патч ---- */
    svg.appendChild(label(0, 2, 0, 0, 'start', 'ttl', 'Патч видео: t = 5, h = 10, w = 20'));
    D.zones.forEach(function (z) {
      svg.appendChild(label(center(z), D.strip1.top, 0, -6, 'middle', 'lbl', z.name + ' · 32'));
    });
    svg.appendChild(label(D.d, D.strip1.top, 0, -6, 'end', 'sml', 'd = 96'));
    strip(D.strip1.top, D.strip1.bot, false);
    svg.appendChild(label(32, D.strip1.bot, 0, 13, 'middle', 'sml', '32'));
    svg.appendChild(label(64, D.strip1.bot, 0, 13, 'middle', 'sml', '64'));

    /* ---- три стрелки поворота ---- */
    D.zones.forEach(function (z) {
      var cx = center(z), hy = D.arrow.head, by = D.arrow.head + 1.5;
      svg.appendChild(el('line', {
        x1: sx(cx), y1: sy(D.arrow.tail), x2: sx(cx), y2: sy(by), 'class': 'arr a-' + z.key
      }));
      svg.appendChild(el('polygon', {
        points: sx(cx) + ',' + sy(hy) + ' ' +
                sx(cx - 0.7) + ',' + sy(by) + ' ' +
                sx(cx + 0.7) + ',' + sy(by),
        'class': 'a-' + z.key
      }));
      svg.appendChild(label(cx, D.arrow.tail, 0, 14, 'middle', 'lbl',
        z.rot + ' (m = ' + z.mPatch + ')'));
    });

    /* ---- текстовый token ---- */
    svg.appendChild(label(0, 17.5, 0, 0, 'start', 'ttl', 'Текстовый token: t = 7, h = 0, w = 0'));
    strip(D.strip2.top, D.strip2.bot, true);
    D.zones.forEach(function (z) {
      var s = z.mText === 0
        ? z.rot + ' (m = 0) — не тронуто'
        : z.rot + ' (m = 7) — как в RoPE';
      svg.appendChild(label(center(z), D.strip2.bot, 0, 13, 'middle', 'lbl', s));
    });

    /* ---- легенда ---- */
    svg.appendChild(label(0, 26.2, 0, 0, 'start', 'leg',
      '32 размерности в зоне = 16 пар клеток; каждая пара крутится на свой угол по частотам theta_i.'));
    svg.appendChild(label(0, 27.7, 0, 0, 'start', 'leg',
      'Зоны не пересекаются: R_t входит только в левую, R_h — только в среднюю, R_w — только в правую.'));
    svg.appendChild(label(0, 29.2, 0, 0, 'start', 'leg',
      'Кадр видео: t = время кадра, h = строка, w = столбец. Одиночная картинка: t = 0, h и w живые.'));

    holder.appendChild(svg);
  } catch (e) {
    var p = document.createElement('p');
    p.className = 'fb';
    p.textContent =
      'Схема должна показывать полоску из 96 клеток, разрезанную на три зоны по 32: ' +
      'слева время t, в середине высота h, справа ширина w. Клетки внутри зоны сцеплены по две (16 пар). ' +
      'Под полоской три стрелки: R_t с m = 5 входит только в левую зону, R_h с m = 10 — только в среднюю, ' +
      'R_w с m = 20 — только в правую. Ниже такая же полоска для текстового token: t = 7, h = 0, w = 0, ' +
      'то есть левая зона повёрнута как в обычном RoPE, а две правые повёрнуты на нулевой угол.';
    holder.appendChild(p);
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
