<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Восстановление от падения до продолжения</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #172033;
      --muted: #667085;
      --lane: #c9d2e3;
      --work: #2563eb;
      --work-fill: #dbeafe;
      --saved: #087f5b;
      --saved-fill: #d8f3e8;
      --danger: #c92a2a;
      --danger-fill: #ffe3e3;
      --lease: #b7791f;
      --lease-fill: #fff3bf;
      --shadow: #e7ebf2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #10141d;
        --panel: #161c27;
        --text: #eef2f8;
        --muted: #a8b2c3;
        --lane: #465166;
        --work: #72a7ff;
        --work-fill: #1c355f;
        --saved: #62d6ad;
        --saved-fill: #163f35;
        --danger: #ff8585;
        --danger-fill: #522527;
        --lease: #ffd166;
        --lease-fill: #4a3b18;
        --shadow: #232c3c;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--lane);
    }

    h1 {
      margin: 0;
      padding: 14px 18px 12px;
      border-bottom: 1px solid var(--lane);
      font-size: 20px;
      line-height: 1.25;
      font-weight: 700;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 430px;
      background: var(--panel);
    }

    .lane {
      stroke: var(--lane);
      stroke-width: 2px;
      fill: none;
      stroke-linecap: round;
    }

    .work,
    .saved,
    .lease,
    .danger {
      fill: none;
      stroke-width: 3px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .work {
      stroke: var(--work);
    }

    .saved {
      stroke: var(--saved);
    }

    .lease {
      stroke: var(--lease);
    }

    .danger {
      stroke: var(--danger);
    }

    .halo {
      fill: none;
      stroke: var(--panel);
      stroke-width: 9px;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .arrow-work {
      fill: var(--work);
    }

    .arrow-saved {
      fill: var(--saved);
    }

    .arrow-lease {
      fill: var(--lease);
    }

    .node-work {
      fill: var(--work-fill);
      stroke: var(--work);
      stroke-width: 3px;
    }

    .node-saved {
      fill: var(--saved-fill);
      stroke: var(--saved);
      stroke-width: 3px;
    }

    .node-lease {
      fill: var(--lease-fill);
      stroke: var(--lease);
      stroke-width: 3px;
    }

    .checkpoint-box {
      fill: var(--saved-fill);
      stroke: var(--saved);
      stroke-width: 3px;
    }

    .crash-box {
      fill: var(--danger-fill);
      stroke: var(--danger);
      stroke-width: 3px;
    }

    .lane-label {
      fill: var(--muted);
      font-size: 16px;
      font-weight: 700;
    }

    .label {
      fill: var(--text);
      font-size: 16px;
      font-weight: 600;
    }

    .small-label {
      fill: var(--muted);
      font-size: 15px;
      font-weight: 600;
    }

    .inside-label {
      fill: var(--text);
      font-size: 16px;
      font-weight: 700;
    }

    .danger-label {
      fill: var(--danger);
      font-size: 16px;
      font-weight: 700;
    }

    .lease-label {
      fill: var(--lease);
      font-size: 16px;
      font-weight: 700;
    }

    .saved-label {
      fill: var(--saved);
      font-size: 16px;
      font-weight: 700;
    }

    #fallback {
      margin: 0;
      padding: 18px;
      background: var(--danger-fill);
      color: var(--text);
      font-size: 16px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="figure" aria-labelledby="diagram-heading">
    <h1 id="diagram-heading">Восстановление от падения до продолжения</h1>
    <svg id="diagram"
         viewBox="0 0 1200 400"
         width="1200"
         height="400"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         aria-label="Воркер A сохраняет чекпоинт 7, падает на шаге 8, а воркер B после истечения 30-секундного лиза восстанавливает снимок и продолжает с шага 8">
    </svg>
    <p id="fallback" hidden>
      Схема должна была показать: воркер A сохраняет чекпоинт 7 и падает на
      шаге 8; через 30 секунд лиз истекает, после чего воркер B находит
      чекпоинт 7, восстанавливает снимок и продолжает с шага 8.
    </p>
  </main>

  <script>
    const DATA = [{
      origin: { x: 62, y: 24 },
      scale: { x: 37, y: 28 },
      lanes: [
        { from: [5.5, 2.4], to: [29.8, 2.4] },
        { from: [5.5, 6.6], to: [29.8, 6.6] },
        { from: [18.5, 10.8], to: [29.8, 10.8] }
      ],
      arrows: [
        {
          points: [[6.1, 2.4], [14.75, 2.4]],
          head: [[15.15, 2.4], [14.72, 2.16], [14.72, 2.64]],
          line: "work",
          fill: "arrow-work"
        },
        {
          points: [[11.55, 3.05], [11.55, 5.72]],
          head: [[11.55, 6.08], [11.31, 5.66], [11.79, 5.66]],
          line: "saved",
          fill: "arrow-saved"
        },
        {
          points: [[15.7, 2.4], [19.62, 2.4]],
          head: [[20.02, 2.4], [19.59, 2.16], [19.59, 2.64]],
          line: "lease",
          fill: "arrow-lease",
          dash: [0.22, 0.18]
        },
        {
          points: [[20.05, 3.05], [20.8, 4.4], [21.55, 10.1]],
          head: [[21.6, 10.5], [21.32, 10.11], [21.79, 10.05]],
          line: "lease",
          fill: "arrow-lease",
          halo: true
        },
        {
          points: [[13.2, 6.6], [24.8, 6.6], [24.8, 10.08]],
          head: [[24.8, 10.48], [24.56, 10.06], [25.04, 10.06]],
          line: "saved",
          fill: "arrow-saved"
        },
        {
          points: [[21.9, 10.8], [29.15, 10.8]],
          head: [[29.55, 10.8], [29.12, 10.56], [29.12, 11.04]],
          line: "work",
          fill: "arrow-work"
        }
      ],
      circles: [
        { point: [7.55, 2.4], radius: 0.28, className: "node-work" },
        { point: [9.35, 2.4], radius: 0.28, className: "node-work" },
        { point: [24.8, 10.8], radius: 0.36, className: "node-saved" },
        { point: [29.0, 10.8], radius: 0.3, className: "node-work" }
      ],
      rectangles: [
        {
          from: [10.05, 1.83],
          to: [13.05, 2.97],
          radius: 0.25,
          className: "checkpoint-box"
        },
        {
          from: [9.95, 6.02],
          to: [13.15, 7.18],
          radius: 0.28,
          className: "checkpoint-box"
        },
        {
          from: [19.34, 1.86],
          to: [20.66, 2.94],
          radius: 0.24,
          className: "node-lease"
        }
      ],
      crosses: [
        {
          segments: [
            [[14.9, 2.04], [15.62, 2.76]],
            [[15.62, 2.04], [14.9, 2.76]]
          ]
        }
      ],
      labels: [
        {
          point: [1.05, 2.4],
          dx: 0,
          dy: 5,
          anchor: "start",
          text: "Воркер A",
          className: "lane-label"
        },
        {
          point: [1.05, 6.6],
          dx: 0,
          dy: 5,
          anchor: "start",
          text: "Надёжное хранилище",
          className: "lane-label"
        },
        {
          point: [17.05, 10.8],
          dx: 0,
          dy: 5,
          anchor: "start",
          text: "Воркер B",
          className: "lane-label"
        },
        {
          point: [8.45, 2.4],
          dx: 0,
          dy: 34,
          anchor: "middle",
          text: "два перехода выполнены",
          className: "small-label"
        },
        {
          point: [11.55, 1.83],
          dx: 0,
          dy: -13,
          anchor: "middle",
          text: "сохраняет чекпоинт 7",
          className: "saved-label"
        },
        {
          point: [11.55, 4.45],
          dx: 14,
          dy: 5,
          anchor: "start",
          text: "запись снимка",
          className: "small-label"
        },
        {
          point: [11.6, 2.4],
          dx: 0,
          dy: 5,
          anchor: "middle",
          text: "чекпоинт 7",
          className: "inside-label"
        },
        {
          point: [11.55, 6.6],
          dx: 0,
          dy: 5,
          anchor: "middle",
          text: "чекпоинт 7",
          className: "inside-label"
        },
        {
          point: [15.26, 2.4],
          dx: 0,
          dy: 35,
          anchor: "middle",
          text: "падение на шаге 8",
          className: "danger-label"
        },
        {
          point: [15.75, 2.4],
          dx: 8,
          dy: -22,
          anchor: "start",
          text: "лиз не обновляется · 30 секунд",
          className: "lease-label"
        },
        {
          point: [20.0, 2.4],
          dx: 0,
          dy: 5,
          anchor: "middle",
          text: "лиз истёк",
          className: "inside-label"
        },
        {
          point: [20.28, 3.42],
          dx: 16,
          dy: 0,
          anchor: "start",
          text: "воркер B получает запуск",
          className: "label"
        },
        {
          point: [13.55, 6.6],
          dx: 8,
          dy: -18,
          anchor: "start",
          text: "находит последний чекпоинт 7",
          className: "saved-label"
        },
        {
          point: [24.8, 10.8],
          dx: 0,
          dy: 34,
          anchor: "middle",
          text: "восстанавливает снимок",
          className: "saved-label"
        },
        {
          point: [28.65, 10.8],
          dx: 0,
          dy: -22,
          anchor: "middle",
          text: "продолжает с шага 8",
          className: "label"
        },
        {
          point: [24.8, 9.35],
          dx: 14,
          dy: 0,
          anchor: "start",
          text: "подтверждённое состояние",
          className: "small-label"
        }
      ]
    }];

    const [diagram] = DATA;
    const origin = diagram.origin;
    const scale = diagram.scale;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const NS = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const make = (name, attributes, parent = svg) => {
        const element = document.createElementNS(NS, name);
        Object.entries(attributes).forEach(([key, value]) => {
          element.setAttribute(key, String(value));
        });
        parent.appendChild(element);
        return element;
      };

      const title = make("title", {});
      title.textContent =
        "Сохранение чекпоинта 7, падение на шаге 8 и продолжение новым воркером после истечения 30-секундного лиза";

      const laneLayer = make("g", { "aria-hidden": "true" });
      diagram.lanes.forEach(lane => {
        const [fromX, fromY] = lane.from;
        const [toX, toY] = lane.to;
        make("line", {
          x1: sx(fromX),
          y1: sy(fromY),
          x2: sx(toX),
          y2: sy(toY),
          class: "lane"
        }, laneLayer);
      });

      const arrowLayer = make("g", { "aria-hidden": "true" });
      diagram.arrows.forEach(arrow => {
        const points = arrow.points
          .map(([x, y]) => `${sx(x)},${sy(y)}`)
          .join(" ");

        if (arrow.halo) {
          make("polyline", { points, class: "halo" }, arrowLayer);
        }

        const line = make("polyline", {
          points,
          class: arrow.line
        }, arrowLayer);

        if (arrow.dash) {
          const [dash, gap] = arrow.dash;
          line.setAttribute(
            "stroke-dasharray",
            `${sx(dash) - sx(0)} ${sx(gap) - sx(0)}`
          );
        }

        make("polygon", {
          points: arrow.head
            .map(([x, y]) => `${sx(x)},${sy(y)}`)
            .join(" "),
          class: arrow.fill
        }, arrowLayer);
      });

      const shapeLayer = make("g", { "aria-hidden": "true" });
      diagram.rectangles.forEach(rectangle => {
        const [fromX, fromY] = rectangle.from;
        const [toX, toY] = rectangle.to;
        make("rect", {
          x: sx(fromX),
          y: sy(fromY),
          width: sx(toX) - sx(fromX),
          height: sy(toY) - sy(fromY),
          rx: sx(rectangle.radius) - sx(0),
          ry: sy(rectangle.radius) - sy(0),
          class: rectangle.className
        }, shapeLayer);
      });

      diagram.circles.forEach(circle => {
        const [x, y] = circle.point;
        make("circle", {
          cx: sx(x),
          cy: sy(y),
          r: sx(circle.radius) - sx(0),
          class: circle.className
        }, shapeLayer);
      });

      diagram.crosses.forEach(cross => {
        cross.segments.forEach(segment => {
          const [[fromX, fromY], [toX, toY]] = segment;
          make("line", {
            x1: sx(fromX),
            y1: sy(fromY),
            x2: sx(toX),
            y2: sy(toY),
            class: "danger"
          }, shapeLayer);
        });
      });

      const labelLayer = make("g", {});
      diagram.labels.forEach(label => {
        const [x, y] = label.point;
        const text = make("text", {
          x: sx(x) + label.dx,
          y: sy(y) + label.dy,
          "text-anchor": label.anchor,
          "dominant-baseline": "middle",
          class: label.className
        }, labelLayer);
        text.textContent = label.text;
      });
    } catch (error) {
      svg.setAttribute("aria-hidden", "true");
      svg.replaceChildren();
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
