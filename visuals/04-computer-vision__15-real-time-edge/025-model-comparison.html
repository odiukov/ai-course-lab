<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Матрица сравнения кандидатов для edge</title>
<style>
  :root {
    color-scheme: light dark;
    --page: #f7f8fc;
    --panel: #ffffff;
    --ink: #172033;
    --muted: #5c667a;
    --grid: #cbd2df;
    --header: #e9edf5;
    --known: #e7f4ee;
    --known-strong: #14765a;
    --pending: #f8f1df;
    --pending-strong: #8a6412;
    --accent: #325cc8;
    --accent-soft: #e9efff;
    --resnet: #9b4d72;
    --shadow: #dfe4ee;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --page: #11151d;
      --panel: #181e29;
      --ink: #edf1f7;
      --muted: #aeb8ca;
      --grid: #465065;
      --header: #252d3b;
      --known: #173c34;
      --known-strong: #63d2ac;
      --pending: #40371f;
      --pending-strong: #f0c761;
      --accent: #87a8ff;
      --accent-soft: #25345b;
      --resnet: #e399bc;
      --shadow: #0b0e14;
    }
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    background: var(--page);
    color: var(--ink);
  }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .figure {
    width: 100%;
    max-width: 1200px;
    background: var(--panel);
    border: 1px solid var(--grid);
    box-shadow: 0 2px 10px var(--shadow);
    overflow: hidden;
  }

  .figure h1 {
    margin: 0;
    padding: 14px 20px 10px;
    font-size: 22px;
    line-height: 1.2;
    font-weight: 750;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 500px;
    background: var(--panel);
  }

  text {
    fill: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .subtitle {
    fill: var(--muted);
    font-size: 15px;
  }

  .condition {
    fill: var(--accent);
    font-size: 16px;
    font-weight: 700;
  }

  .header-cell {
    fill: var(--header);
  }

  .known-cell {
    fill: var(--known);
  }

  .pending-cell {
    fill: var(--pending);
  }

  .row-alt {
    fill: var(--accent-soft);
  }

  .outline {
    fill: none;
    stroke: var(--grid);
    stroke-width: 2px;
    vector-effect: non-scaling-stroke;
  }

  .grid-line {
    stroke: var(--grid);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .model {
    font-size: 17px;
    font-weight: 750;
  }

  .header-label {
    font-size: 14px;
    font-weight: 750;
  }

  .header-note {
    fill: var(--muted);
    font-size: 12px;
  }

  .value {
    font-size: 17px;
    font-weight: 800;
  }

  .known-value {
    fill: var(--known-strong);
  }

  .pending-value {
    fill: var(--pending-strong);
    font-size: 14px;
    font-weight: 700;
  }

  .cell-note {
    fill: var(--muted);
    font-size: 12px;
  }

  .bar-track {
    fill: var(--grid);
  }

  .bar-mobile {
    fill: var(--accent);
  }

  .bar-resnet {
    fill: var(--resnet);
  }

  .rule-box {
    fill: var(--header);
    stroke: var(--grid);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .rule-number {
    fill: var(--panel);
    font-size: 15px;
    font-weight: 800;
  }

  .rule-circle {
    fill: var(--accent);
  }

  .rule-title {
    font-size: 15px;
    font-weight: 800;
  }

  .rule-text {
    fill: var(--muted);
    font-size: 13px;
  }

  .legend-text {
    fill: var(--muted);
    font-size: 12px;
  }

  .legend-known {
    fill: var(--known);
    stroke: var(--known-strong);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .legend-pending {
    fill: var(--pending);
    stroke: var(--pending-strong);
    stroke-width: 1px;
    vector-effect: non-scaling-stroke;
  }

  .fallback {
    margin: 0;
    padding: 20px;
    color: var(--ink);
    background: var(--panel);
    font-size: 16px;
  }

  [hidden] {
    display: none;
  }
</style>
</head>
<body>
<main class="figure" aria-labelledby="diagram-heading">
  <h1 id="diagram-heading">Матрица сравнения кандидатов для edge</h1>
  <svg id="diagram" viewBox="0 0 1200 500" width="1200" height="500"
       preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Сравнительная таблица MobileNetV3-Small и ResNet-50 по параметрам, вычислениям, задержке, памяти и точности">
    <desc>Известные характеристики модели стоят рядом с метриками, которые необходимо измерить в одинаковых условиях на целевом устройстве.</desc>
  </svg>
  <p id="fallback" class="fallback" hidden>
    Схема должна была показать матрицу MobileNetV3-Small и ResNet-50: 2,5 млн против 25 млн параметров, 0,06 против 4,1 GFLOPs, а рядом — отдельные столбцы p50, p95, памяти и точности.
  </p>
</main>

<script>
const data = [
  {
    originX: 0, originY: 0, scaleX: 1, scaleY: 1,
    left: 25, right: 1175, top: 20, bottom: 485,
    conditionY: 30, subtitleY: 61, legendY: 91,
    tableTop: 115, headerBottom: 185, rowOneBottom: 270, tableBottom: 355,
    columns: [25, 265, 417, 569, 721, 873, 1025, 1175],
    headerTextY: 143, headerNoteY: 166,
    rowCenters: [227.5, 312.5],
    valueY: 216, noteY: 242, barY: 250,
    barLeftPad: 18, barRightPad: 18, barHeight: 7, corner: 8,
    modelPad: 18, trackWidth: 116,
    ruleTop: 377, ruleBottom: 455, ruleSplit: 600,
    ruleCircleX: [54, 629], ruleCircleY: 401, ruleRadius: 15,
    ruleTitleX: [82, 657], ruleTitleY: 398,
    ruleTextX: [82, 657], ruleTextY: 423,
    footerY: 478, legendBoxX: [777, 966], legendTextX: [798, 987],
    legendBoxY: 82, legendBoxSize: 12,
    condition: "Одинаковые условия: одно устройство  •  вход 224×224  •  один режим модели",
    subtitle: "Каждый столбец отвечает на отдельный вопрос — строку нужно читать целиком",
    headers: [
      ["Кандидат", "одна строка — одна модель"],
      ["Параметры", "место весов"],
      ["GFLOPs", "объём вычислений"],
      ["p50", "обычная задержка"],
      ["p95", "тяжёлые случаи"],
      ["Пик памяти", "весь запуск"],
      ["Точность", "на своей задаче"]
    ],
    footer: "Матрица показывает цену компромисса — она не назначает победителя."
  },
  {
    name: "MobileNetV3-Small",
    params: 2.5,
    paramsLabel: "≈ 2,5 млн",
    flops: 0.06,
    flopsLabel: "≈ 0,06",
    pending: ["на устройстве", "на устройстве", "замерить", "проверить"],
    barClass: "bar-mobile"
  },
  {
    name: "ResNet-50",
    params: 25,
    paramsLabel: "≈ 25 млн",
    flops: 4.1,
    flopsLabel: "≈ 4,1",
    pending: ["на устройстве", "на устройстве", "замерить", "проверить"],
    barClass: "bar-resnet"
  }
];

const [layout, ...models] = data;
const origin = Object.freeze({ x: layout.originX, y: layout.originY });
const scale = Object.freeze({ x: layout.scaleX, y: layout.scaleY });
const sx = x => origin.x + x * scale.x;
const sy = y => origin.y + y * scale.y;

const svg = document.getElementById("diagram");
const fallback = document.getElementById("fallback");
const namespace = "http://www.w3.org/2000/svg";

function node(name, attributes, parent = svg) {
  const item = document.createElementNS(namespace, name);
  Object.entries(attributes).forEach(([key, value]) => item.setAttribute(key, value));
  parent.appendChild(item);
  return item;
}

function rectangle(x, y, width, height, className, radius = layout.originX) {
  return node("rect", {
    x: sx(x),
    y: sy(y),
    width: sx(x + width) - sx(x),
    height: sy(y + height) - sy(y),
    rx: sx(radius) - sx(0),
    class: className
  });
}

function segment(xOne, yOne, xTwo, yTwo, className) {
  return node("line", {
    x1: sx(xOne),
    y1: sy(yOne),
    x2: sx(xTwo),
    y2: sy(yTwo),
    class: className
  });
}

function circle(x, y, radius, className) {
  return node("circle", {
    cx: sx(x),
    cy: sy(y),
    r: sx(radius) - sx(0),
    class: className
  });
}

function label(x, y, content, className, anchor = "middle") {
  const item = node("text", {
    x: sx(x),
    y: sy(y),
    class: className,
    "text-anchor": anchor
  });
  item.textContent = content;
  return item;
}

try {
  const columns = layout.columns;
  const tableWidth = layout.right - layout.left;
  const tableHeight = layout.tableBottom - layout.tableTop;
  const headerHeight = layout.headerBottom - layout.tableTop;
  const firstRowHeight = layout.rowOneBottom - layout.headerBottom;
  const secondRowHeight = layout.tableBottom - layout.rowOneBottom;
  const maximumParams = Math.max(...models.map(model => model.params));
  const maximumFlops = Math.max(...models.map(model => model.flops));

  label(
    (layout.left + layout.right) / models.length,
    layout.conditionY,
    layout.condition,
    "condition"
  );

  label(
    (layout.left + layout.right) / models.length,
    layout.subtitleY,
    layout.subtitle,
    "subtitle"
  );

  rectangle(
    layout.legendBoxX.shift(),
    layout.legendBoxY,
    layout.legendBoxSize,
    layout.legendBoxSize,
    "legend-known",
    layout.corner
  );
  label(
    layout.legendTextX.shift(),
    layout.legendY,
    "известно заранее",
    "legend-text",
    "start"
  );

  rectangle(
    layout.legendBoxX.shift(),
    layout.legendBoxY,
    layout.legendBoxSize,
    layout.legendBoxSize,
    "legend-pending",
    layout.corner
  );
  label(
    layout.legendTextX.shift(),
    layout.legendY,
    "измерить в benchmark",
    "legend-text",
    "start"
  );

  rectangle(
    layout.left,
    layout.tableTop,
    tableWidth,
    headerHeight,
    "header-cell",
    layout.corner
  );

  rectangle(
    columns.shift(),
    layout.headerBottom,
    columns[0] - layout.left,
    firstRowHeight,
    "row-alt"
  );

  rectangle(
    columns[0],
    layout.headerBottom,
    columns[2] - columns[0],
    firstRowHeight,
    "known-cell"
  );

  rectangle(
    columns[0],
    layout.rowOneBottom,
    columns[2] - columns[0],
    secondRowHeight,
    "known-cell"
  );

  rectangle(
    columns[2],
    layout.headerBottom,
    layout.right - columns[2],
    firstRowHeight,
    "pending-cell"
  );

  rectangle(
    columns[2],
    layout.rowOneBottom,
    layout.right - columns[2],
    secondRowHeight,
    "pending-cell"
  );

  rectangle(
    layout.left,
    layout.tableTop,
    tableWidth,
    tableHeight,
    "outline",
    layout.corner
  );

  segment(layout.left, layout.headerBottom, layout.right, layout.headerBottom, "grid-line");
  segment(layout.left, layout.rowOneBottom, layout.right, layout.rowOneBottom, "grid-line");

  columns.forEach(column => {
    segment(column, layout.tableTop, column, layout.tableBottom, "grid-line");
  });

  layout.headers.forEach((header, index) => {
    const leftEdge = index ? columns[index - 1] : layout.left;
    const rightEdge = columns[index] || layout.right;
    const center = (leftEdge + rightEdge) / models.length;
    label(center, layout.headerTextY, header.shift(), "header-label");
    label(center, layout.headerNoteY, header.shift(), "header-note");
  });

  models.forEach((model, modelIndex) => {
    const rowTop = modelIndex ? layout.rowOneBottom : layout.headerBottom;
    const rowCenter = layout.rowCenters[modelIndex];
    const valueY = rowTop + (layout.valueY - layout.headerBottom);
    const noteY = rowTop + (layout.noteY - layout.headerBottom);
    const barY = rowTop + (layout.barY - layout.headerBottom);

    label(
      layout.left + layout.modelPad,
      rowCenter,
      model.name,
      "model",
      "start"
    );

    label(
      (columns[0] + columns[1]) / models.length,
      valueY,
      model.paramsLabel,
      "value known-value"
    );

    label(
      (columns[1] + columns[2]) / models.length,
      valueY,
      model.flopsLabel,
      "value known-value"
    );

    label(
      (columns[1] + columns[2]) / models.length,
      noteY,
      "GFLOPs",
      "cell-note"
    );

    const paramsTrackX = columns[0] + layout.barLeftPad;
    const flopsTrackX = columns[1] + layout.barLeftPad;

    rectangle(
      paramsTrackX,
      barY,
      layout.trackWidth,
      layout.barHeight,
      "bar-track",
      layout.corner
    );

    rectangle(
      paramsTrackX,
      barY,
      layout.trackWidth * model.params / maximumParams,
      layout.barHeight,
      model.barClass,
      layout.corner
    );

    rectangle(
      flopsTrackX,
      barY,
      layout.trackWidth,
      layout.barHeight,
      "bar-track",
      layout.corner
    );

    rectangle(
      flopsTrackX,
      barY,
      layout.trackWidth * model.flops / maximumFlops,
      layout.barHeight,
      model.barClass,
      layout.corner
    );

    model.pending.forEach((pendingText, pendingIndex) => {
      const leftEdge = columns[pendingIndex + models.length];
      const rightEdge = columns[pendingIndex + models.length + origin.x + origin.y + layout.scaleX];
      label(
        (leftEdge + rightEdge) / models.length,
        rowCenter,
        pendingText,
        "pending-value"
      );
    });
  });

  const ruleWidth = layout.ruleSplit - layout.left;
  const ruleHeight = layout.ruleBottom - layout.ruleTop;

  rectangle(
    layout.left,
    layout.ruleTop,
    ruleWidth,
    ruleHeight,
    "rule-box",
    layout.corner
  );

  rectangle(
    layout.ruleSplit,
    layout.ruleTop,
    layout.right - layout.ruleSplit,
    ruleHeight,
    "rule-box",
    layout.corner
  );

  layout.ruleCircleX.forEach((circleX, ruleIndex) => {
    circle(circleX, layout.ruleCircleY, layout.ruleRadius, "rule-circle");
    label(
      circleX,
      layout.ruleCircleY + layout.scaleY + layout.scaleY + layout.scaleY + layout.scaleY + layout.scaleY,
      ruleIndex + layout.scaleX,
      "rule-number"
    );
  });

  label(
    layout.ruleTitleX.shift(),
    layout.ruleTitleY,
    "Сначала — пороги по столбцам",
    "rule-title",
    "start"
  );

  label(
    layout.ruleTextX.shift(),
    layout.ruleTextY,
    "Отметь неприемлемые значения и отсей строку.",
    "rule-text",
    "start"
  );

  label(
    layout.ruleTitleX.shift(),
    layout.ruleTitleY,
    "Затем — вся оставшаяся строка",
    "rule-title",
    "start"
  );

  label(
    layout.ruleTextX.shift(),
    layout.ruleTextY,
    "Не складывай метрики в воображаемый общий балл.",
    "rule-text",
    "start"
  );

  label(
    (layout.left + layout.right) / models.length,
    layout.footerY,
    layout.footer,
    "subtitle"
  );
} catch (error) {
  svg.setAttribute("hidden", "");
  fallback.removeAttribute("hidden");
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
