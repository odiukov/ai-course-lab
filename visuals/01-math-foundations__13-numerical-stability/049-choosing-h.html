<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Компромисс при выборе h</title>
<style>
  :root {
    color-scheme: light dark;
    --background: whitesmoke;
    --panel: white;
    --ink: midnightblue;
    --muted: slategray;
    --axis: darkslategray;
    --curve: royalblue;
    --accent: darkorange;
    --guide: lightsteelblue;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background: midnightblue;
      --panel: darkslategray;
      --ink: ghostwhite;
      --muted: lightgray;
      --axis: gainsboro;
      --curve: lightskyblue;
      --accent: gold;
      --guide: slategray;
    }
  }

  html,
  body {
    margin: unset;
    padding: unset;
    background: var(--background);
  }

  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
      sans-serif;
    color: var(--ink);
  }

  figure {
    margin: unset;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--guide);
  }

  header {
    padding: 12px 18px;
    font-size: 20px;
    font-weight: bold;
    color: var(--ink);
    background: var(--panel);
    border-bottom: 1px solid var(--guide);
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
    max-height: 410px;
    background: var(--panel);
  }

  .axis,
  .tick {
    fill: none;
    stroke: var(--axis);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .curve-halo {
    fill: none;
    stroke: var(--panel);
    stroke-width: 8px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .curve {
    fill: none;
    stroke: var(--curve);
    stroke-width: 4px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .leader {
    fill: none;
    stroke: var(--muted);
    stroke-width: 2px;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .minimum-guide {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2px;
    stroke-linecap: round;
  }

  .minimum-mark {
    fill: none;
    stroke: var(--accent);
    stroke-width: 4px;
    stroke-linecap: round;
  }

  text {
    font-family: inherit;
    fill: var(--ink);
  }

  .axis-label {
    font-size: 16px;
    font-weight: bold;
  }

  .region-label {
    font-size: 17px;
    font-weight: bold;
  }

  .region-note {
    font-size: 14px;
    fill: var(--muted);
  }

  .minimum-label {
    font-size: 17px;
    font-weight: bold;
    fill: var(--accent);
  }

  .scale-label {
    font-size: 15px;
    fill: var(--muted);
  }

  .fallback {
    font-size: 17px;
  }
</style>
</head>
<body>
<figure aria-labelledby="diagram-heading">
  <header id="diagram-heading">Компромисс при выборе <i>h</i></header>
  <svg
    id="diagram"
    viewBox="0 0 920 410"
    width="100%"
    height="410"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-labelledby="diagram-heading diagram-description"
  >
    <desc id="diagram-description">
      U-образная кривая общей ошибки. При слишком малом h ошибка растёт
      из-за потери значимости, при слишком большом — из-за грубого
      приближения. Минимум находится около h, равного 1e-6.
    </desc>
  </svg>
</figure>

<script>
const DATA = [
  {
    role: "curve",
    points: [
      [0.55, 5.15],
      [0.80, 4.55],
      [1.10, 3.95],
      [1.45, 3.35],
      [1.85, 2.75],
      [2.30, 2.20],
      [2.80, 1.70],
      [3.40, 1.25],
      [4.00, 0.93],
      [4.60, 0.72],
      [5.20, 0.60],
      [5.80, 0.55],
      [6.40, 0.62],
      [7.00, 0.82],
      [7.55, 1.18],
      [8.00, 1.70],
      [8.45, 2.35],
      [8.85, 3.10],
      [9.20, 3.90],
      [9.50, 4.65],
      [9.75, 5.20]
    ]
  },
  {
    role: "axes",
    x: [[0, 0], [10.20, 0]],
    y: [[0, 0], [0, 6.00]],
    xHead: [[9.95, 0.14], [10.20, 0], [9.95, -0.14]],
    yHead: [[-0.15, 5.72], [0, 6.00], [0.15, 5.72]]
  },
  {
    role: "minimum",
    point: [5.80, 0.55],
    horizontal: [[5.66, 0.55], [5.94, 0.55]],
    vertical: [[5.80, 0.36], [5.80, 0.74]],
    toAxis: [[5.80, 0.34], [5.80, 0]],
    tick: [[5.80, -0.13], [5.80, 0.13]],
    connector: [[5.80, 0.82], [5.80, 1.24]],
    label: [5.80, 1.55],
    scaleLabel: [5.80, -0.52]
  },
  {
    role: "small-h",
    leader: [[2.34, 4.65], [1.36, 3.60]],
    head: [[1.66, 3.72], [1.36, 3.60], [1.49, 3.96]],
    title: [2.38, 5.45],
    note: [2.38, 5.05],
    scaleLabel: [1.30, -0.52]
  },
  {
    role: "large-h",
    leader: [[7.82, 4.65], [8.78, 3.20]],
    head: [[8.48, 3.38], [8.78, 3.20], [8.70, 3.60]],
    title: [8.18, 5.45],
    note: [8.18, 5.05],
    scaleLabel: [8.70, -0.52]
  },
  {
    role: "labels",
    error: [0.18, 5.94],
    step: [10.08, 0.30]
  },
  {
    role: "fallback",
    first: [0.45, 4.80],
    second: [0.45, 4.15],
    third: [0.45, 3.50]
  }
];

const origin = Object.freeze({ x: 80, y: 350 });
const scale = Object.freeze({ x: 80, y: -55 });

const sx = (x) => origin.x + x * scale.x;
const sy = (y) => origin.y + y * scale.y;

const LABEL_PADDING = Object.freeze({
  none: 0,
  small: 4,
  regular: 8
});

const LINE_WIDTH = Object.freeze({
  fine: 1,
  normal: 2,
  strong: 4
});

const FONT_SIZE = Object.freeze({
  note: 14,
  scale: 15,
  normal: 16,
  emphasis: 17,
  heading: 20
});

const svg = document.getElementById("diagram");
const ns = svg.namespaceURI;

function item(role) {
  return DATA.find((entry) => entry.role === role);
}

function element(name, attributes, className) {
  const node = document.createElementNS(ns, name);
  if (className) node.setAttribute("class", className);

  Object.entries(attributes).forEach(([key, value]) => {
    node.setAttribute(key, String(value));
  });

  return node;
}

function line(points, className) {
  return element("line", {
    x1: sx(points[0][0]),
    y1: sy(points[0][1]),
    x2: sx(points[1][0]),
    y2: sy(points[1][1])
  }, className);
}

function polyline(points, className) {
  const mapped = points
    .map((point) => `${sx(point[0])},${sy(point[1])}`)
    .join(" ");

  return element("polyline", { points: mapped }, className);
}

function text(point, value, className, anchor, dx, dy) {
  const node = element("text", {
    x: sx(point[0]),
    y: sy(point[1]),
    dx: dx,
    dy: dy,
    "text-anchor": anchor
  }, className);

  node.textContent = value;
  return node;
}

function group(label) {
  return element("g", {
    role: "group",
    "aria-label": label
  });
}

try {
  const axes = item("axes");
  const curve = item("curve");
  const minimum = item("minimum");
  const smallH = item("small-h");
  const largeH = item("large-h");
  const labels = item("labels");

  const axisLayer = group("Оси графика");
  axisLayer.append(
    line(axes.x, "axis"),
    line(axes.y, "axis"),
    polyline(axes.xHead, "axis"),
    polyline(axes.yHead, "axis"),
    line(minimum.tick, "tick"),
    text(
      labels.error,
      "Общая ошибка",
      "axis-label",
      "start",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      labels.step,
      "шаг h",
      "axis-label",
      "end",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    )
  );

  const curveLayer = group("Кривая общей ошибки");
  curveLayer.append(
    polyline(curve.points, "curve-halo"),
    polyline(curve.points, "curve")
  );

  const explanationLayer = group("Причины роста ошибки");
  explanationLayer.append(
    line(smallH.leader, "leader"),
    polyline(smallH.head, "leader"),
    text(
      smallH.title,
      "Потеря значимости",
      "region-label",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      smallH.note,
      "значения почти совпали",
      "region-note",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      smallH.scaleLabel,
      "слишком малое h",
      "scale-label",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    line(largeH.leader, "leader"),
    polyline(largeH.head, "leader"),
    text(
      largeH.title,
      "Грубое приближение",
      "region-label",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      largeH.note,
      "точки слишком далеко",
      "region-note",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      largeH.scaleLabel,
      "слишком большое h",
      "scale-label",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    )
  );

  const minimumLayer = group("Минимум ошибки около h, равного 1e-6");
  minimumLayer.append(
    line(minimum.toAxis, "minimum-guide"),
    line(minimum.connector, "minimum-guide"),
    line(minimum.horizontal, "minimum-mark"),
    line(minimum.vertical, "minimum-mark"),
    text(
      minimum.label,
      "минимум ошибки",
      "minimum-label",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      minimum.scaleLabel,
      "h ≈ 1e−6",
      "minimum-label",
      "middle",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    )
  );

  svg.append(axisLayer, curveLayer, explanationLayer, minimumLayer);
} catch (error) {
  const fallback = item("fallback");
  svg.replaceChildren();

  svg.append(
    text(
      fallback.first,
      "Ошибка сначала уменьшается, затем снова растёт.",
      "fallback",
      "start",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      fallback.second,
      "Слева мешает потеря значимости, справа — грубое приближение.",
      "fallback",
      "start",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    ),
    text(
      fallback.third,
      "Минимум должен находиться около h ≈ 1e−6.",
      "fallback",
      "start",
      LABEL_PADDING.none,
      LABEL_PADDING.none
    )
  );
}
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
