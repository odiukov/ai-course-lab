<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Значения идут вперёд, а градиенты — назад</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: white;
      --ink: midnightblue;
      --muted: slategray;
      --panel: ghostwhite;
      --outline: lightsteelblue;
      --forward: darkorange;
      --forward-fill: cornsilk;
      --backward: mediumvioletred;
      --backward-fill: lavenderblush;
      --memory: steelblue;
      --memory-fill: aliceblue;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: midnightblue;
        --ink: white;
        --muted: lightsteelblue;
        --panel: darkslateblue;
        --outline: slateblue;
        --forward: orange;
        --forward-fill: saddlebrown;
        --backward: hotpink;
        --backward-fill: darkmagenta;
        --memory: lightskyblue;
        --memory-fill: darkslategray;
      }
    }

    html,
    body,
    figure {
      margin: unset;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    figure {
      background: var(--bg);
    }

    .diagram-title {
      color: var(--ink);
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 480px;
      background: var(--bg);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .divider {
      stroke: var(--outline);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .arrow {
      fill: none;
      stroke-width: 4px;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .arrow-head {
      stroke: none;
    }

    .forward {
      stroke: var(--forward);
    }

    .arrow-head.forward {
      fill: var(--forward);
    }

    .backward {
      stroke: var(--backward);
    }

    .arrow-head.backward {
      fill: var(--backward);
    }

    .node {
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .forward-node {
      fill: var(--forward-fill);
      stroke: var(--forward);
    }

    .backward-node {
      fill: var(--backward-fill);
      stroke: var(--backward);
    }

    .node-title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .node-note {
      fill: var(--muted);
      font-size: 15px;
    }

    .lane-label {
      font-size: 18px;
      font-weight: bold;
    }

    .forward-label {
      fill: var(--forward);
    }

    .backward-label {
      fill: var(--backward);
    }

    .memory-path {
      fill: none;
      stroke: var(--memory);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    .memory-box {
      fill: var(--memory-fill);
      stroke: var(--memory);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .memory-label {
      fill: var(--memory);
      font-size: 16px;
      font-weight: bold;
    }

    .edge-label {
      fill: var(--muted);
      font-size: 14px;
    }

    .fallback-title {
      fill: var(--ink);
      font-size: 21px;
      font-weight: bold;
    }

    .fallback-note {
      fill: var(--muted);
      font-size: 17px;
    }
  </style>
</head>
<body>
  <figure>
    <figcaption class="diagram-title">
      Значения идут вперёд, а градиенты — назад
    </figcaption>

    <svg
      id="diagram"
      width="1200"
      height="480"
      viewBox="0 0 1200 480"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">Прямой и обратный проход вычислительного графа</title>
      <desc id="svg-description">
        Сверху значения проходят от x через z и a к ошибке L.
        Снизу градиенты идут от L в обратном направлении к весам.
      </desc>
      <g id="drawing"></g>
    </svg>
  </figure>

  <script>
    const data = [
      { x: 40, y: 18 },
      { x: 1, y: 1 },
      {
        panels: [
          { x: 12, y: 10, w: 1086, h: 192, r: 18 },
          { x: 12, y: 218, w: 1086, h: 224, r: 18 }
        ],
        divider: { x1: 34, y1: 210, x2: 1076, y2: 210 },

        laneArrows: [
          {
            kind: "forward",
            x1: 72, y1: 48, x2: 1042, y2: 48,
            head: [
              { x: 1042, y: 48 },
              { x: 1018, y: 35 },
              { x: 1018, y: 61 }
            ],
            label: {
              x: 82, y: 32,
              text: "ЗНАЧЕНИЯ · прямой проход",
              anchor: "start",
              className: "lane-label forward-label"
            }
          },
          {
            kind: "backward",
            x1: 1042, y1: 414, x2: 72, y2: 414,
            head: [
              { x: 72, y: 414 },
              { x: 96, y: 401 },
              { x: 96, y: 427 }
            ],
            label: {
              x: 1032, y: 398,
              text: "ГРАДИЕНТЫ · обратный проход",
              anchor: "end",
              className: "lane-label backward-label"
            }
          }
        ],

        forwardNodes: [
          {
            x: 34, y: 92, w: 148, h: 76, r: 14,
            className: "node forward-node",
            labels: [
              { x: 108, y: 119, text: "x", className: "node-title" },
              { x: 108, y: 146, text: "входное значение", className: "node-note" }
            ]
          },
          {
            x: 292, y: 92, w: 202, h: 76, r: 14,
            className: "node forward-node",
            labels: [
              { x: 393, y: 119, text: "z = Wx + b", className: "node-title" },
              { x: 393, y: 146, text: "линейный результат", className: "node-note" }
            ]
          },
          {
            x: 604, y: 92, w: 216, h: 76, r: 14,
            className: "node forward-node",
            labels: [
              { x: 712, y: 119, text: "a = sigmoid(z)", className: "node-title" },
              { x: 712, y: 146, text: "активация", className: "node-note" }
            ]
          },
          {
            x: 936, y: 92, w: 140, h: 76, r: 14,
            className: "node forward-node",
            labels: [
              { x: 1006, y: 119, text: "L", className: "node-title" },
              { x: 1006, y: 146, text: "ошибка", className: "node-note" }
            ]
          }
        ],

        forwardEdges: [
          {
            kind: "forward",
            x1: 182, y1: 130, x2: 292, y2: 130,
            head: [
              { x: 292, y: 130 },
              { x: 276, y: 121 },
              { x: 276, y: 139 }
            ],
            label: { x: 228, y: 112, text: "значение x", anchor: "middle" }
          },
          {
            kind: "forward",
            x1: 494, y1: 130, x2: 604, y2: 130,
            head: [
              { x: 604, y: 130 },
              { x: 588, y: 121 },
              { x: 588, y: 139 }
            ],
            label: { x: 540, y: 112, text: "значение z", anchor: "middle" }
          },
          {
            kind: "forward",
            x1: 820, y1: 130, x2: 936, y2: 130,
            head: [
              { x: 936, y: 130 },
              { x: 920, y: 121 },
              { x: 920, y: 139 }
            ],
            label: { x: 868, y: 112, text: "значение a", anchor: "middle" }
          }
        ],

        backwardNodes: [
          {
            x: 34, y: 290, w: 242, h: 78, r: 14,
            className: "node backward-node",
            labels: [
              { x: 155, y: 316, text: "dL/dW, dL/db", className: "node-title" },
              { x: 155, y: 345, text: "градиенты параметров", className: "node-note" }
            ]
          },
          {
            x: 382, y: 290, w: 194, h: 78, r: 14,
            className: "node backward-node",
            labels: [
              { x: 479, y: 316, text: "dL/dz", className: "node-title" },
              { x: 479, y: 345, text: "через sigmoid", className: "node-note" }
            ]
          },
          {
            x: 672, y: 290, w: 194, h: 78, r: 14,
            className: "node backward-node",
            labels: [
              { x: 769, y: 316, text: "dL/da", className: "node-title" },
              { x: 769, y: 345, text: "влияние активации", className: "node-note" }
            ]
          },
          {
            x: 936, y: 290, w: 140, h: 78, r: 14,
            className: "node backward-node",
            labels: [
              { x: 1006, y: 316, text: "L", className: "node-title" },
              { x: 1006, y: 345, text: "начало назад", className: "node-note" }
            ]
          }
        ],

        backwardEdges: [
          {
            kind: "backward",
            x1: 936, y1: 329, x2: 866, y2: 329,
            head: [
              { x: 866, y: 329 },
              { x: 882, y: 320 },
              { x: 882, y: 338 }
            ]
          },
          {
            kind: "backward",
            x1: 672, y1: 329, x2: 576, y2: 329,
            head: [
              { x: 576, y: 329 },
              { x: 592, y: 320 },
              { x: 592, y: 338 }
            ]
          },
          {
            kind: "backward",
            x1: 382, y1: 329, x2: 276, y2: 329,
            head: [
              { x: 276, y: 329 },
              { x: 292, y: 320 },
              { x: 292, y: 338 }
            ]
          }
        ],

        memoryPaths: [
          {
            start: { x: 108, y: 168 },
            controlA: { x: 108, y: 218 },
            controlB: { x: 155, y: 238 },
            end: { x: 155, y: 290 }
          },
          {
            start: { x: 393, y: 168 },
            controlA: { x: 393, y: 218 },
            controlB: { x: 479, y: 238 },
            end: { x: 479, y: 290 }
          },
          {
            start: { x: 712, y: 168 },
            controlA: { x: 712, y: 218 },
            controlB: { x: 769, y: 238 },
            end: { x: 769, y: 290 }
          }
        ],

        memoryDash: [8, 7],

        memoryLegend: {
          box: { x: 326, y: 226, w: 532, h: 42, r: 12 },
          sample: { x1: 350, y1: 247, x2: 414, y2: 247 },
          label: {
            x: 434, y: 252,
            text: "сохранённые x, z и a нужны на обратном пути",
            anchor: "start"
          }
        },

        fallback: {
          box: { x: 96, y: 126, w: 928, h: 196, r: 18 },
          title: {
            x: 560, y: 188,
            text: "Схема прямого и обратного прохода",
            anchor: "middle"
          },
          lines: [
            {
              x: 560, y: 236,
              text: "Вперёд: x → z = Wx + b → a = sigmoid(z) → L",
              anchor: "middle"
            },
            {
              x: 560, y: 276,
              text: "Назад: L → dL/da → dL/dz → dL/dW",
              anchor: "middle"
            }
          ]
        }
      }
    ];

    const [origin, scale, scene] = data;
    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.querySelector("#diagram");
    const drawing = document.querySelector("#drawing");

    const add = (tag, attributes, text) => {
      const element = document.createElementNS(namespace, tag);
      Object.entries(attributes).forEach(([name, value]) => {
        element.setAttribute(name, String(value));
      });
      if (text !== undefined) {
        element.textContent = text;
      }
      drawing.append(element);
      return element;
    };

    const drawRect = (rect, className) => {
      add("rect", {
        x: sx(rect.x),
        y: sy(rect.y),
        width: sx(rect.x + rect.w) - sx(rect.x),
        height: sy(rect.y + rect.h) - sy(rect.y),
        rx: sx(rect.r) - sx(0),
        ry: sy(rect.r) - sy(0),
        class: className
      });
    };

    const drawText = (label, className) => {
      add("text", {
        x: sx(label.x),
        y: sy(label.y),
        "text-anchor": label.anchor || "middle",
        class: className || label.className
      }, label.text);
    };

    const drawArrow = arrow => {
      add("line", {
        x1: sx(arrow.x1),
        y1: sy(arrow.y1),
        x2: sx(arrow.x2),
        y2: sy(arrow.y2),
        class: `arrow ${arrow.kind}`
      });

      add("polygon", {
        points: arrow.head
          .map(point => `${sx(point.x)},${sy(point.y)}`)
          .join(" "),
        class: `arrow-head ${arrow.kind}`
      });

      if (arrow.label) {
        drawText(
          arrow.label,
          arrow.label.className || "edge-label"
        );
      }
    };

    const drawNode = node => {
      drawRect(node, node.className);
      node.labels.forEach(label => drawText(label, label.className));
    };

    try {
      scene.panels.forEach(panel => drawRect(panel, "panel"));

      add("line", {
        x1: sx(scene.divider.x1),
        y1: sy(scene.divider.y1),
        x2: sx(scene.divider.x2),
        y2: sy(scene.divider.y2),
        class: "divider"
      });

      scene.memoryPaths.forEach(path => {
        add("path", {
          d: [
            "M", sx(path.start.x), sy(path.start.y),
            "C", sx(path.controlA.x), sy(path.controlA.y),
            sx(path.controlB.x), sy(path.controlB.y),
            sx(path.end.x), sy(path.end.y)
          ].join(" "),
          class: "memory-path",
          "stroke-dasharray": scene.memoryDash
            .map(value => sx(value) - sx(0))
            .join(" ")
        });
      });

      scene.laneArrows.forEach(drawArrow);
      scene.forwardEdges.forEach(drawArrow);
      scene.backwardEdges.forEach(drawArrow);
      scene.forwardNodes.forEach(drawNode);
      scene.backwardNodes.forEach(drawNode);

      drawRect(scene.memoryLegend.box, "memory-box");

      add("line", {
        x1: sx(scene.memoryLegend.sample.x1),
        y1: sy(scene.memoryLegend.sample.y1),
        x2: sx(scene.memoryLegend.sample.x2),
        y2: sy(scene.memoryLegend.sample.y2),
        class: "memory-path",
        "stroke-dasharray": scene.memoryDash
          .map(value => sx(value) - sx(0))
          .join(" ")
      });

      drawText(scene.memoryLegend.label, "memory-label");
    } catch (error) {
      drawing.replaceChildren();
      drawRect(scene.fallback.box, "memory-box");
      drawText(scene.fallback.title, "fallback-title");
      scene.fallback.lines.forEach(line => drawText(line, "fallback-note"));
      svg.setAttribute(
        "aria-label",
        "Схема должна была показать значения слева направо и градиенты справа налево."
      );
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
