<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Одно предложение в разметке PTB и UD</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f8fafc;
      --ink: #172033;
      --muted: #64748b;
      --border: #cbd5e1;
      --guide: #d9e1ec;
      --ptb: #315ea8;
      --ptb-soft: #e9f0ff;
      --ptb-ink: #173f7a;
      --ud: #24745b;
      --ud-soft: #e2f5ed;
      --ud-ink: #155943;
      --focus: #a66012;
      --focus-soft: #fff1d6;
      --focus-line: #d49138;
      --footer: #f1f4f8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #111827;
        --panel: #182234;
        --panel-soft: #202c40;
        --ink: #edf2f7;
        --muted: #aebbd0;
        --border: #42516a;
        --guide: #35445b;
        --ptb: #8db8ff;
        --ptb-soft: #253b60;
        --ptb-ink: #dbe9ff;
        --ud: #71d7b2;
        --ud-soft: #1d4a3d;
        --ud-ink: #d7faec;
        --focus: #ffc56e;
        --focus-soft: #5a3b18;
        --focus-line: #dca24d;
        --footer: #202b3d;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    h1 {
      font-size: 24px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--panel);
    }

    [hidden] {
      display: none;
    }

    #fallback {
      box-sizing: border-box;
      width: 100%;
      white-space: pre-line;
      font-size: 18px;
      color: var(--ink);
      background: var(--panel);
    }

    .board {
      fill: var(--panel);
      stroke: var(--border);
    }

    .caption {
      fill: var(--ink);
      font-weight: bold;
    }

    .row-panel {
      fill: var(--panel-soft);
      stroke: var(--border);
    }

    .row-panel.ptb {
      stroke: var(--ptb);
    }

    .row-panel.ud {
      stroke: var(--ud);
    }

    .row-name.ptb {
      fill: var(--ptb);
    }

    .row-name.ud {
      fill: var(--ud);
    }

    .row-note,
    .row-count {
      fill: var(--muted);
    }

    .mapping-line {
      stroke: var(--guide);
      fill: none;
    }

    .mapping-line.focus {
      stroke: var(--focus-line);
    }

    .token-card {
      fill: var(--panel);
      stroke: var(--border);
    }

    .token-card.focus {
      fill: var(--focus-soft);
      stroke: var(--focus-line);
    }

    .token-divider {
      stroke: var(--guide);
    }

    .token-word {
      fill: var(--ink);
      font-weight: bold;
    }

    .tag-pill.ptb {
      fill: var(--ptb-soft);
      stroke: var(--ptb);
    }

    .tag-pill.ud {
      fill: var(--ud-soft);
      stroke: var(--ud);
    }

    .tag-pill.focus {
      fill: var(--focus-soft);
      stroke: var(--focus-line);
    }

    .tag-text.ptb {
      fill: var(--ptb-ink);
      font-weight: bold;
    }

    .tag-text.ud {
      fill: var(--ud-ink);
      font-weight: bold;
    }

    .tag-text.focus {
      fill: var(--focus);
    }

    .footer {
      fill: var(--footer);
      stroke: var(--border);
    }

    .footer-key {
      fill: var(--focus);
      font-weight: bold;
    }

    .footer-copy {
      fill: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <figure aria-labelledby="diagram-heading">
      <h1 id="diagram-heading">Одно предложение в разметке PTB и UD</h1>

      <div id="fallback" role="img" aria-live="polite">Схема должна была показать одно предложение в двух строках.
PTB: The/DT cats/NNS were/VBD running/VBG at/IN 3pm/NN ./.
UD: The/DET cats/NOUN were/AUX running/VERB at/ADP 3pm/NOUN ./PUNCT</div>

      <svg
        id="diagram"
        width="1200"
        height="460"
        viewBox="0 0 1200 460"
        preserveAspectRatio="xMidYMid meet"
        role="img"
        aria-labelledby="svg-title svg-description"
        hidden>
        <title id="svg-title">Семь токенов с тегами PTB и UD</title>
        <desc id="svg-description">
          Две выровненные строки показывают одинаковые токены The cats were
          running at 3pm и точку. В верхней строке стоят подробные PTB-теги,
          в нижней — укрупнённые UD-теги.
        </desc>
      </svg>
    </figure>
  </main>

  <script>
    const data = Object.freeze([
      Object.freeze({
        kind: "layout",
        zero: 0,
        one: 1,
        two: 2,
        originX: 0,
        originY: 0,
        scaleX: 1,
        scaleY: 1,
        boardX: 0,
        boardY: 0,
        boardW: 1200,
        boardH: 460,
        boardRadius: 18,
        captionX: 600,
        captionY: 35,
        labelX: 38,
        labelW: 140,
        cardsX: 198,
        cardW: 124,
        cardH: 132,
        cardRadius: 13,
        cardGap: 14,
        ptbY: 67,
        udY: 235,
        rowNameY: 42,
        rowNoteY: 75,
        rowCountY: 104,
        tokenY: 37,
        dividerY: 59,
        pillX: 14,
        pillY: 75,
        pillW: 96,
        pillH: 38,
        pillRadius: 10,
        tagY: 95,
        footerX: 38,
        footerY: 390,
        footerW: 1124,
        footerH: 49,
        footerRadius: 12,
        firstKeyX: 68,
        firstCopyX: 132,
        secondKeyX: 620,
        secondCopyX: 692,
        footerTextY: 415
      }),
      Object.freeze({ token: "The", ptb: "DT", ud: "DET" }),
      Object.freeze({ token: "cats", ptb: "NNS", ud: "NOUN" }),
      Object.freeze({
        token: "were",
        ptb: "VBD",
        ud: "AUX",
        focus: "role"
      }),
      Object.freeze({ token: "running", ptb: "VBG", ud: "VERB" }),
      Object.freeze({ token: "at", ptb: "IN", ud: "ADP" }),
      Object.freeze({ token: "3pm", ptb: "NN", ud: "NOUN" }),
      Object.freeze({
        token: ".",
        ptb: ".",
        ud: "PUNCT",
        focus: "punctuation"
      })
    ]);

    const [layout, ...tokens] = data;

    const origin = Object.freeze({
      x: layout.originX,
      y: layout.originY
    });

    const scale = Object.freeze({
      x: layout.scaleX,
      y: layout.scaleY
    });

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    const canvas = Object.freeze({
      width: 1200,
      height: 460
    });

    const labelOffset = Object.freeze({
      none: 0
    });

    const lineWidth = Object.freeze({
      thin: 1,
      regular: 2,
      strong: 3
    });

    const fontSize = Object.freeze({
      small: 14,
      note: 15,
      body: 17,
      tag: 18,
      token: 22,
      row: 24
    });

    const rows = Object.freeze([
      Object.freeze({
        system: "PTB",
        note: "точнее: форма",
        count: "7 тегов",
        key: "ptb",
        y: layout.ptbY
      }),
      Object.freeze({
        system: "UD",
        note: "крупнее: класс и роль",
        count: "7 тегов",
        key: "ud",
        y: layout.udY
      })
    ]);

    const namespace = "http://www.w3.org/2000/svg";
    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    function element(name, attributes, content) {
      const node = document.createElementNS(namespace, name);

      Object.entries(attributes).forEach(([attribute, value]) => {
        if (value !== undefined) {
          node.setAttribute(attribute, String(value));
        }
      });

      if (content !== undefined) {
        node.appendChild(document.createTextNode(content));
      }

      return node;
    }

    function rectangle(x, y, width, height, radius, className, stroke) {
      return element("rect", {
        x: sx(x),
        y: sy(y),
        width: sx(x + width) - sx(x),
        height: sy(y + height) - sy(y),
        rx: sx(radius) - sx(layout.zero),
        ry: sy(radius) - sy(layout.zero),
        class: className,
        "stroke-width": stroke,
        "vector-effect": "non-scaling-stroke"
      });
    }

    function segment(xStart, yStart, xEnd, yEnd, className, stroke) {
      return element("line", {
        x1: sx(xStart),
        y1: sy(yStart),
        x2: sx(xEnd),
        y2: sy(yEnd),
        class: className,
        "stroke-width": stroke,
        "vector-effect": "non-scaling-stroke"
      });
    }

    function label(x, y, content, className, size, anchor) {
      return element("text", {
        x: sx(x),
        y: sy(y),
        dx: labelOffset.none,
        dy: labelOffset.none,
        class: className,
        "font-size": size,
        "text-anchor": anchor,
        "dominant-baseline": "middle"
      }, content);
    }

    function cardX(index) {
      return layout.cardsX + index * (layout.cardW + layout.cardGap);
    }

    try {
      const drawing = element("g", {
        "aria-hidden": "true"
      });

      drawing.appendChild(
        rectangle(
          layout.boardX,
          layout.boardY,
          layout.boardW,
          layout.boardH,
          layout.boardRadius,
          "board",
          lineWidth.regular
        )
      );

      drawing.appendChild(
        label(
          layout.captionX,
          layout.captionY,
          "Те же 7 токенов — две системы тегов",
          "caption",
          fontSize.body,
          "middle"
        )
      );

      tokens.forEach((item, index) => {
        const x = cardX(index);
        const centerX = x + layout.cardW / layout.two;
        const mappingClass = item.focus
          ? "mapping-line focus"
          : "mapping-line";

        drawing.appendChild(
          segment(
            centerX,
            layout.ptbY + layout.cardH,
            centerX,
            layout.udY,
            mappingClass,
            item.focus ? lineWidth.strong : lineWidth.regular
          )
        );
      });

      rows.forEach((row) => {
        const labelCenterX = layout.labelX + layout.labelW / layout.two;

        drawing.appendChild(
          rectangle(
            layout.labelX,
            row.y,
            layout.labelW,
            layout.cardH,
            layout.cardRadius,
            `row-panel ${row.key}`,
            lineWidth.regular
          )
        );

        drawing.appendChild(
          label(
            labelCenterX,
            row.y + layout.rowNameY,
            row.system,
            `row-name ${row.key}`,
            fontSize.row,
            "middle"
          )
        );

        drawing.appendChild(
          label(
            labelCenterX,
            row.y + layout.rowNoteY,
            row.note,
            "row-note",
            fontSize.note,
            "middle"
          )
        );

        drawing.appendChild(
          label(
            labelCenterX,
            row.y + layout.rowCountY,
            row.count,
            "row-count",
            fontSize.small,
            "middle"
          )
        );

        tokens.forEach((item, index) => {
          const x = cardX(index);
          const centerX = x + layout.cardW / layout.two;
          const focused = Boolean(item.focus);
          const cardClass = focused ? "token-card focus" : "token-card";
          const pillClass = focused
            ? `tag-pill ${row.key} focus`
            : `tag-pill ${row.key}`;
          const tagClass = focused
            ? `tag-text ${row.key} focus`
            : `tag-text ${row.key}`;

          drawing.appendChild(
            rectangle(
              x,
              row.y,
              layout.cardW,
              layout.cardH,
              layout.cardRadius,
              cardClass,
              focused ? lineWidth.strong : lineWidth.regular
            )
          );

          drawing.appendChild(
            label(
              centerX,
              row.y + layout.tokenY,
              item.token,
              "token-word",
              fontSize.token,
              "middle"
            )
          );

          drawing.appendChild(
            segment(
              x + layout.pillX,
              row.y + layout.dividerY,
              x + layout.cardW - layout.pillX,
              row.y + layout.dividerY,
              "token-divider",
              lineWidth.thin
            )
          );

          drawing.appendChild(
            rectangle(
              x + layout.pillX,
              row.y + layout.pillY,
              layout.pillW,
              layout.pillH,
              layout.pillRadius,
              pillClass,
              lineWidth.regular
            )
          );

          drawing.appendChild(
            label(
              centerX,
              row.y + layout.tagY,
              item[row.key],
              tagClass,
              fontSize.tag,
              "middle"
            )
          );
        });
      });

      drawing.appendChild(
        rectangle(
          layout.footerX,
          layout.footerY,
          layout.footerW,
          layout.footerH,
          layout.footerRadius,
          "footer",
          lineWidth.regular
        )
      );

      drawing.appendChild(
        label(
          layout.firstKeyX,
          layout.footerTextY,
          "were:",
          "footer-key",
          fontSize.body,
          "start"
        )
      );

      drawing.appendChild(
        label(
          layout.firstCopyX,
          layout.footerTextY,
          "VBD — форма · AUX — роль",
          "footer-copy",
          fontSize.body,
          "start"
        )
      );

      drawing.appendChild(
        label(
          layout.secondKeyX,
          layout.footerTextY,
          "точка:",
          "footer-key",
          fontSize.body,
          "start"
        )
      );

      drawing.appendChild(
        label(
          layout.secondCopyX,
          layout.footerTextY,
          ". — PTB · PUNCT — UD",
          "footer-copy",
          fontSize.body,
          "start"
        )
      );

      svg.setAttribute(
        "viewBox",
        [
          sx(layout.zero),
          sy(layout.zero),
          canvas.width,
          canvas.height
        ].join(" ")
      );

      svg.appendChild(drawing);
      svg.hidden = false;
      fallback.hidden = true;
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
      fallback.setAttribute("data-render-error", "true");
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
