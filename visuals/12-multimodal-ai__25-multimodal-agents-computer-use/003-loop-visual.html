<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Цикл агента целиком</title>
<style>
  :root{
    --bg:#fbfaf8; --ink:#1e2430; --dim:#5c6675;
    --line:#3d4椒; --accent:#b4531f; --exit:#1d6a4f; --node:#ffffff;
  }
  :root{ --line:#3d4756; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12151a; --ink:#e7eaf0; --dim:#9aa5b4;
           --line:#8b97a8; --accent:#e8944f; --exit:#5ec49a; --node:#1b2027; }
  }
  html,body{margin:0;background:var(--bg);}
  .wrap{background:var(--bg);color:var(--ink);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:10px 12px 6px;box-sizing:border-box;}
  h1{font-size:15px;margin:0 0 2px;font-weight:600;}
  .sub{font-size:12px;color:var(--dim);margin:0 0 4px;}
  svg{display:block;width:100%;height:auto;max-height:470px;}
  .fallback{font-size:13px;color:var(--ink);padding:8px 0;}
  text{fill:var(--ink);}
</style>
<div class="wrap">
  <h1>Цикл агента целиком: один проход — одно действие</h1>
  <p class="sub">Выход только через <code>done</code> или предохранитель на 30 шагов.</p>
  <div id="host"></div>
</div>
<script>
(function(){
  var host = document.getElementById('host');
  try{
    /* ---- данные схемы ---- */
    var NODES = [
      {t:'1 · скриншот',        a: 90},
      {t:'2 · разбор',          a: 30},
      {t:'3 · JSON-действие',   a:-30},
      {t:'4 · применить',       a:-90},
      {t:'5 · новое состояние', a:-150},
      {t:'6 · повтор',          a: 150}
    ];
    var R = 1, RLAB = 1.28, RNODE = 0.17, GAP = 0.21, HEAD = 0.085;
    var EXIT = {from:2, x0:1.066, x1:2.05, bx:[2.05,3.15], by:[-0.28,-0.72], y:-0.5};

    /* ---- единственный перевод координат ---- */
    var W = 720, H = 395, FONT = 14, SMALL = 12, PAD = 10, LW = 1.6;
    var origin = {x:300, y:200}, scale = 118;
    function sx(x){ return origin.x + x*scale; }
    function sy(y){ return origin.y - y*scale; }

    var NS='http://www.w3.org/2000/svg';
    var svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');
    function el(n,at){ var e=document.createElementNS(NS,n);
      for(var k in at) e.setAttribute(k,at[k]); svg.appendChild(e); return e; }
    function txt(x,y,s,anch,size,fill){
      var t=el('text',{x:x,y:y,'text-anchor':anch,'font-size':size,'font-family':'inherit'});
      if(fill) t.setAttribute('fill',fill);
      t.textContent=s; return t;
    }
    el('rect',{x:sx(0)-sx(0),y:sy(0)-sy(0),width:W,height:H,fill:'var(--bg)'});

    function pt(a,rad){
      var r=a*Math.PI/180;
      return {x:Math.cos(r)*rad, y:Math.sin(r)*rad};
    }
    function arrow(A,B,color){
      var dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy);
      var ux=dx/L, uy=dy/L;
      var s={x:A.x+ux*GAP, y:A.y+uy*GAP};
      var e={x:B.x-ux*GAP, y:B.y-uy*GAP};
      var b={x:e.x-ux*HEAD, y:e.y-uy*HEAD};
      el('line',{x1:sx(s.x),y1:sy(s.y),x2:sx(b.x),y2:sy(b.y),
        stroke:color,'stroke-width':LW,'stroke-linecap':'round'});
      el('polygon',{fill:color,points:
        sx(e.x)+','+sy(e.y)+' '+
        sx(b.x-uy*HEAD*0.55)+','+sy(b.y+ux*HEAD*0.55)+' '+
        sx(b.x+uy*HEAD*0.55)+','+sy(b.y-ux*HEAD*0.55)});
    }

    var P = NODES.map(function(n){ return pt(n.a,R); });

    /* стрелки цикла */
    for(var i=0;i<P.length;i++) arrow(P[i],P[(i+1)%P.length],'var(--accent)');

    /* узлы и подписи */
    var rpx = sx(RNODE)-sx(0);
    NODES.forEach(function(n,i){
      el('circle',{cx:sx(P[i].x),cy:sy(P[i].y),r:rpx,
        fill:'var(--node)',stroke:'var(--line)','stroke-width':LW});
      txt(sx(P[i].x),sy(P[i].y)+SMALL*0.36,String(i+1),'middle',SMALL,'var(--dim)');
      var L=pt(n.a,RLAB), anch, dy;
      if(L.x>0.15){ anch='start'; } else if(L.x<-0.15){ anch='end'; } else { anch='middle'; }
      dy = L.y>0.1 ? -PAD : (L.y<-0.1 ? PAD+FONT*0.7 : FONT*0.35);
      txt(sx(L.x),sy(L.y)+dy,n.t,anch,FONT);
    });

    /* ядро мысли */
    txt(sx(0),sy(0.10),'один проход =','middle',FONT,'var(--dim)');
    txt(sx(0),sy(-0.10),'одно действие','middle',FONT,'var(--dim)');

    /* выход по done */
    var a3=P[EXIT.from];
    arrow({x:EXIT.x0-GAP,y:EXIT.y},{x:EXIT.x1+GAP,y:EXIT.y},'var(--exit)');
    txt(sx(EXIT.x0),sy(EXIT.y)+ -PAD,'действие = done','start',SMALL,'var(--exit)');
    el('rect',{x:sx(EXIT.bx[0]),y:sy(EXIT.by[0]),
      width:sx(EXIT.bx[1])-sx(EXIT.bx[0]),
      height:sy(EXIT.by[1])-sy(EXIT.by[0]),
      rx:rpx*0.3,fill:'var(--node)',stroke:'var(--exit)','stroke-width':LW});
    var cx=(EXIT.bx[0]+EXIT.bx[1])/2;
    txt(sx(cx),sy(EXIT.y)+FONT*0.36,'стоп','middle',FONT,'var(--exit)');
    txt(sx(cx),sy(EXIT.by[1])+PAD+SMALL*0.7,'или счётчик 30 шагов','middle',SMALL,'var(--dim)');
    txt(sx(cx),sy(EXIT.by[1])+PAD*2+SMALL*1.9,'обрывает цикл','middle',SMALL,'var(--dim)');
    /* якорь узла 3 обозначен явно */
    el('line',{x1:sx(a3.x),y1:sy(a3.y),x2:sx(EXIT.x0-GAP),y2:sy(EXIT.y),
      stroke:'var(--exit)','stroke-width':LW,'stroke-dasharray':'3 3'});

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fallback">Схема: шесть узлов по кругу — '+
      '1 скриншот, 2 разбор, 3 JSON-действие, 4 применить, 5 новое состояние, 6 повтор — '+
      'стрелки замыкают круг обратно на скриншот. От узла 3 отходит ветка «действие = done» '+
      'к состоянию «стоп»; второй выход — счётчик 30 шагов, который обрывает цикл.</p>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
