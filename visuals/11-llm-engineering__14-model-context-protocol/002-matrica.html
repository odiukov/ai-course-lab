<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Матрица интеграций N×M</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2430; --muted:#5c6675;
    --line:#c2410c; --line2:#1d4ed8; --node:#1d2430; --mcp:#1d4ed8; --mcpfg:#ffffff;
    --rule:#d5d0c6;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171c; --fg:#e9edf3; --muted:#9aa5b4;
      --line:#fb923c; --line2:#7ea6ff; --node:#e9edf3; --mcp:#3b6fd4; --mcpfg:#ffffff;
      --rule:#333a45;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);padding:14px 16px;
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  h2{margin:0 0 6px;font-size:17px;font-weight:650}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fallback{color:var(--muted);margin:8px 0 0}
</style>
<div class="wrap">
  <h2>Матрица интеграций N×M: 3 × 5 = 15 против 3 + 5</h2>
  <svg id="s" viewBox="0 0 1340 500" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Слева три инструмента и пять хостов соединены пятнадцатью линиями. Справа три инструмента идут в один узел MCP тремя линиями, из узла выходят пять линий к пяти хостам."></svg>
  <div id="fb"></div>
</div>
<script>
(function(){
  var svg = document.getElementById("s");
  try{
    /* ---- данные схемы: всё в условных единицах ---- */
    var D = {
      tools: ["запрос к базе","календарь","чтение файлов"],
      hosts: ["Claude Desktop","ChatGPT","Cursor","Zed","Claude Code"],
      toolY: [1.2, 3.0, 4.8],
      hostY: [0.3, 1.65, 3.0, 4.35, 5.7],
      x: { ltool:0, lhost:5.2, rtool:11, mcpL:14, mcpR:15, rhost:18, div:8.1 },
      y: { title:-0.95, cap:6.8, legend:7.7, divTop:-0.35, divBot:7.1, mcpT:2.6, mcpB:3.4 },
      r: 0.1
    };

    /* ---- один origin, один scale, одна пара sx/sy ---- */
    var origin = { x:140, y:90 }, scale = 52;
    function sx(u){ return origin.x + u * scale; }
    function sy(u){ return origin.y + u * scale; }

    var R = sx(D.r) - sx(0);
    var NS = "http://www.w3.org/2000/svg";
    function el(n,a){ var e=document.createElementNS(NS,n); for(var k in a) e.setAttribute(k,a[k]); return e; }
    function line(x1,y1,x2,y2,cls){ svg.appendChild(el("line",{x1:sx(x1),y1:sy(y1),x2:sx(x2),y2:sy(y2),class:cls})); }
    function dot(x,y){ svg.appendChild(el("circle",{cx:sx(x),cy:sy(y),r:R,class:"nd"})); }
    function txt(x,y,dx,dy,anchor,cls,s){
      var t=el("text",{x:sx(x)+dx,y:sy(y)+dy,"text-anchor":anchor,class:cls}); t.textContent=s; svg.appendChild(t);
    }

    var st = el("style",{});
    st.textContent =
      ".nd{fill:var(--node)}"+
      ".lm{stroke:var(--line);stroke-width:1.1;opacity:.75}"+
      ".lp{stroke:var(--line2);stroke-width:2}"+
      ".dv{stroke:var(--rule);stroke-width:1.2;stroke-dasharray:6 6}"+
      "text{fill:var(--fg);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}"+
      ".ti{font-size:17px;font-weight:650}.cap{fill:var(--muted);font-size:15px}"+
      ".sm{fill:var(--muted);font-size:14px}.lg{fill:var(--muted);font-size:14px}"+
      ".mcp{fill:var(--mcpfg);font-size:16px;font-weight:650}";
    svg.appendChild(st);

    /* разделитель панелей */
    line(D.x.div, D.y.divTop, D.x.div, D.y.divBot, "dv");

    /* ---- левая панель: 3 × 5 = 15 линий ---- */
    for(var i=0;i<D.toolY.length;i++)
      for(var j=0;j<D.hostY.length;j++)
        line(D.x.ltool, D.toolY[i], D.x.lhost, D.hostY[j], "lm");

    for(i=0;i<D.toolY.length;i++){
      dot(D.x.ltool, D.toolY[i]);
      txt(D.x.ltool, D.toolY[i], -12, 5, "end", "", D.tools[i]);
    }
    for(j=0;j<D.hostY.length;j++){
      dot(D.x.lhost, D.hostY[j]);
      txt(D.x.lhost, D.hostY[j], 12, 5, "start", "sm", "h"+"₁₂₃₄₅"[j]);
    }

    /* ---- правая панель: 3 линии + 5 линий ---- */
    for(i=0;i<D.toolY.length;i++) line(D.x.rtool, D.toolY[i], D.x.mcpL, (D.y.mcpT+D.y.mcpB)/2, "lp");
    for(j=0;j<D.hostY.length;j++) line(D.x.mcpR, (D.y.mcpT+D.y.mcpB)/2, D.x.rhost, D.hostY[j], "lp");

    svg.appendChild(el("rect",{
      x:sx(D.x.mcpL), y:sy(D.y.mcpT),
      width:sx(D.x.mcpR)-sx(D.x.mcpL), height:sy(D.y.mcpB)-sy(D.y.mcpT),
      rx:R, fill:"var(--mcp)"
    }));
    txt((D.x.mcpL+D.x.mcpR)/2, (D.y.mcpT+D.y.mcpB)/2, 0, 6, "middle", "mcp", "MCP");

    for(i=0;i<D.toolY.length;i++){
      dot(D.x.rtool, D.toolY[i]);
      txt(D.x.rtool, D.toolY[i], -12, 5, "end", "sm", "t"+"₁₂₃"[i]);
    }
    for(j=0;j<D.hostY.length;j++){
      dot(D.x.rhost, D.hostY[j]);
      txt(D.x.rhost, D.hostY[j], 14, 5, "start", "", D.hosts[j]);
    }

    /* ---- заголовки панелей и подписи-итоги ---- */
    txt((D.x.ltool+D.x.lhost)/2, D.y.title, 0, 0, "middle", "ti", "Без MCP: своя схема в каждой клетке");
    txt((D.x.rtool+D.x.rhost)/2, D.y.title, 0, 0, "middle", "ti", "С MCP: один протокол посередине");
    txt((D.x.ltool+D.x.lhost)/2, D.y.cap, 0, 0, "middle", "cap", "3 инструмента × 5 хостов = 15 схем");
    txt((D.x.rtool+D.x.rhost)/2, D.y.cap, 0, 0, "middle", "cap", "3 схемы + 5 хостов: сложение, не умножение");
    txt(10.2, D.y.legend, 0, 0, "middle", "lg",
      "t₁ запрос к базе · t₂ календарь · t₃ чтение файлов · h₁–h₅ — те же пять хостов, что справа");
  }catch(e){
    svg.remove();
    var p=document.createElement("p"); p.className="fallback";
    p.textContent="Схема не построилась. Она показывает: слева 3 инструмента (запрос к базе, календарь, чтение файлов) "+
      "соединены с 5 хостами (Claude Desktop, ChatGPT, Cursor, Zed, Claude Code) — 15 отдельных линий, по схеме на клетку. "+
      "Справа те же 3 инструмента идут 3 линиями в один узел MCP, и из узла выходят 5 линий к тем же 5 хостам: 3 + 5 вместо 3 × 5.";
    document.getElementById("fb").appendChild(p);
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
