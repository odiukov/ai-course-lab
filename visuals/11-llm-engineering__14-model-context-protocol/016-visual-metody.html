<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Три примитива × два метода</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5b636e;
    --grid:#ccd2da; --cell-list:#eef4fb; --cell-act:#fdf2e8;
    --edge-list:#8fb6de; --edge-act:#e0a86b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15181d; --fg:#e7eaee; --muted:#9aa3ae;
      --grid:#39414d; --cell-list:#1a2531; --cell-act:#2a2116;
      --edge-list:#3f6d9e; --edge-act:#8a6535;
    }
  }
  body{margin:0;background:var(--bg);color:var(--fg);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:12px 10px 14px;}
  h2{font-size:15px;font-weight:600;margin:0 0 8px;}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg);}
  .cap{margin:8px 2px 0;font-size:12.5px;line-height:1.5;color:var(--muted);}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}
  .fallback{font-size:13px;line-height:1.6;}
</style>
<div class="wrap">
  <h2>Сетка три на два: примитив слева от слэша, действие справа</h2>
  <div id="slot"></div>
  <p class="cap">Первый столбец одинаков у всех трёх строк, второй зависит от природы примитива.
  Выдуманные <code>resources/call</code> и <code>prompts/read</code> в сетку не попадают: у ресурса нечего вызывать, а шаблон запрашивают по имени, а не по URI.</p>
</div>
<script>
(function(){
  var slot = document.getElementById('slot');
  try{
    // ---- данные схемы ----
    var COLS = ['покажи, что у тебя есть', 'сделай вот это'];
    var ROWS = [
      {p:'tools',     list:'tools/list',     act:'tools/call',     why:'инструмент выполняют'},
      {p:'resources', list:'resources/list', act:'resources/read', why:'ресурс читают по URI'},
      {p:'prompts',   list:'prompts/list',   act:'prompts/get',    why:'шаблон берут по имени'}
    ];

    // ---- один origin, один scale, одна пара sx/sy ----
    var origin = {x:110, y:42};
    var scale  = {x:190, y:62};
    function sx(x){ return origin.x + x * scale.x; }
    function sy(y){ return origin.y + y * scale.y; }

    // пиксельные отступы подписей от их точек привязки, толщины, кегли
    var DY_MAIN = -4, DY_SUB = 14, DY_ONE = 5, LW = 1.4, FS = 15, FS_SM = 11, FS_HEAD = 12.5;

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a){ e.setAttribute(k, a[k]); } return e; }
    function txt(x, y, s, anchor, size, cls){
      var t = el('text', {x:x, y:y, 'text-anchor':anchor, 'font-size':size});
      if(cls){ t.setAttribute('class', cls); }
      t.textContent = s; return t;
    }

    var svg = el('svg', {
      xmlns:NS,
      viewBox: sx(-0.5) + ' ' + sy(-0.6) + ' ' + (sx(2.5)-sx(-0.5)) + ' ' + (sy(3.5)-sy(-0.6)),
      preserveAspectRatio:'xMidYMid meet',
      role:'img',
      'aria-label':'Таблица три на два: три примитива и по два метода у каждого'
    });
    svg.appendChild(el('rect', {
      x:sx(-0.5), y:sy(-0.6), width:sx(2.5)-sx(-0.5), height:sy(3.5)-sy(-0.6), fill:'var(--bg)'
    }));

    function cell(col, row, fill, edge){
      return el('rect', {
        x: sx(col-0.5), y: sy(row-0.5),
        width: sx(col+0.5)-sx(col-0.5), height: sy(row+0.5)-sy(row-0.5),
        rx: 6, fill: fill, stroke: edge, 'stroke-width': LW
      });
    }

    // заголовки столбцов (подписи сверху — anchor middle, ровно над своими столбцами)
    for(var c = 0; c < COLS.length; c++){
      var t = txt(sx(c+1), sy(0)+DY_ONE, COLS[c], 'middle', FS_HEAD, 'h');
      t.setAttribute('fill', 'var(--muted)');
      svg.appendChild(t);
    }

    // строки
    for(var r = 0; r < ROWS.length; r++){
      var row = ROWS[r], y = r + 1;

      // левая колонка: имя примитива, подпись прижата вправо к своей ячейке
      var lab = txt(sx(0.42), sy(y)+DY_ONE, row.p, 'end', FS, 'mono');
      lab.setAttribute('fill', 'var(--fg)');
      svg.appendChild(lab);

      // ячейка «покажи, что есть» — одна строка текста по центру
      svg.appendChild(cell(1, y, 'var(--cell-list)', 'var(--edge-list)'));
      var a = txt(sx(1), sy(y)+DY_ONE, row.list, 'middle', FS, 'mono');
      a.setAttribute('fill', 'var(--fg)');
      svg.appendChild(a);

      // ячейка действия — метод сверху, причина ниже, разведены по вертикали
      svg.appendChild(cell(2, y, 'var(--cell-act)', 'var(--edge-act)'));
      var b = txt(sx(2), sy(y)+DY_MAIN, row.act, 'middle', FS, 'mono');
      b.setAttribute('fill', 'var(--fg)');
      svg.appendChild(b);
      var w = txt(sx(2), sy(y)+DY_SUB, row.why, 'middle', FS_SM, 'h');
      w.setAttribute('fill', 'var(--muted)');
      svg.appendChild(w);
    }

    // разделитель между колонкой примитивов и колонками методов
    svg.appendChild(el('line', {
      x1: sx(0.5), y1: sy(0.5), x2: sx(0.5), y2: sy(3.5),
      stroke:'var(--grid)', 'stroke-width': LW, 'stroke-dasharray':'4 4'
    }));

    var style = document.createElementNS(NS, 'style');
    style.textContent = '.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}' +
      '.h{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}';
    svg.insertBefore(style, svg.firstChild);

    slot.appendChild(svg);
  } catch(e){
    slot.innerHTML = '<div class="fallback">Схема не построилась. Она показывает таблицу 3×2: ' +
      'строки — примитивы <code>tools</code>, <code>resources</code>, <code>prompts</code>; ' +
      'столбец «покажи, что у тебя есть» — <code>tools/list</code>, <code>resources/list</code>, ' +
      '<code>prompts/list</code>; столбец «сделай вот это» — <code>tools/call</code> (инструмент выполняют), ' +
      '<code>resources/read</code> (ресурс читают по URI), <code>prompts/get</code> (шаблон берут по имени).</div>';
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
