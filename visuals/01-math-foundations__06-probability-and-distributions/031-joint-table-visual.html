<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Совместное распределение: таблица с итогами на полях</title>
<style>
  :root{
    --bg:#ffffff; --ink:#1c2430; --muted:#5a6577; --grid:#aeb7c6; --edge:#3d4757;
    --inner:#eef4ff; --diag:#d3e3ff; --marg:#f4efe1; --corner:#ffe6bf; --head:#f2f4f8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12161d; --ink:#e7ebf2; --muted:#a2acbd; --grid:#3d4756; --edge:#8b98ab;
      --inner:#1a2431; --diag:#24real; --marg:#2a2519; --corner:#3d3016; --head:#1a1f27;
    }
  }
  @media (prefers-color-scheme: dark){ :root{ --diag:#24384f; } }
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{padding:10px 12px 12px}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fb{margin:8px 0 0;color:var(--muted);font-size:13px}
  text{fill:var(--ink)}
  .t-head{fill:var(--muted)}
</style>
<div class="wrap">
  <h2>Совместное распределение: таблица 2×2 и итоги на полях</h2>
  <svg id="s" viewBox="0 0 420 442" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Таблица совместного распределения погоды и зонта с итогами по строкам и столбцам"></svg>
  <p class="fb" id="fb" hidden>
    Таблица 2×2: строка «солнце» — 0.40 и 0.10, строка «дождь» — 0.05 и 0.45;
    итоги по строкам справа — 0.50 и 0.50; итоги по столбцам снизу — 0.45 и 0.55;
    в правом нижнем углу 1.00.
  </p>
</div>
<script>
(function(){
  var svg=document.getElementById('s');
  try{
    // ---- данные схемы ----
    var cols=[{u:1,l:['Y=0','без зонта']},{u:2,l:['Y=1','с зонтом']},{u:3,l:['Итог','по строке']}];
    var rows=[{v:1,l:['X=0','солнце']},{v:2,l:['X=1','дождь']},{v:3,l:['Итог','по столбцу']}];
    var cells=[
      {u:1,v:1,t:'0.40',k:'diag'},{u:2,v:1,t:'0.10',k:'inner'},{u:3,v:1,t:'0.50',k:'marg'},
      {u:1,v:2,t:'0.05',k:'inner'},{u:2,v:2,t:'0.45',k:'diag'},{u:3,v:2,t:'0.50',k:'marg'},
      {u:1,v:3,t:'0.45',k:'marg'},{u:2,v:3,t:'0.55',k:'marg'},{u:3,v:3,t:'1.00',k:'corner'}
    ];
    var fill={inner:'var(--inner)',diag:'var(--diag)',marg:'var(--marg)',corner:'var(--corner)'};

    // ---- единственный origin, единственный scale, единственная пара sx/sy ----
    var origin={x:20,y:16}, scale=95;
    function sx(u){return origin.x+u*scale;}
    function sy(v){return origin.y+v*scale;}

    var NS='http://www.w3.org/2000/svg';
    function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
    function rect(u,v,f){
      svg.appendChild(el('rect',{x:sx(u),y:sy(v),width:sx(u+1)-sx(u),height:sy(v+1)-sy(v),fill:f}));
    }
    function line(u1,v1,u2,v2,w,c){
      svg.appendChild(el('line',{x1:sx(u1),y1:sy(v1),x2:sx(u2),y2:sy(v2),
        stroke:c||'var(--grid)','stroke-width':w||1}));
    }
    function label(u,v,dy,txt,size,cls,weight){
      var t=el('text',{x:sx(u),y:sy(v),dy:dy,'text-anchor':'middle',
        'font-size':size,'font-weight':weight||'400'});
      if(cls)t.setAttribute('class',cls);
      t.textContent=txt; svg.appendChild(t); return t;
    }

    // фон холста
    svg.appendChild(el('rect',{x:0,y:0,width:'100%',height:'100%',fill:'var(--bg)'}));

    // подложки: шапка, клетки
    for(var i=0;i<cols.length;i++) rect(cols[i].u,0,'var(--head)');
    for(var j=0;j<rows.length;j++) rect(0,rows[j].v,'var(--head)');
    for(var c=0;c<cells.length;c++) rect(cells[c].u,cells[c].v,fill[cells[c].k]);

    // сетка
    for(var g=0;g<=4;g++){ line(g,0,g,4); line(0,g,4,g); }

    // жирная рамка вокруг четырёх внутренних клеток
    line(1,1,3,1,2.4,'var(--edge)'); line(1,3,3,3,2.4,'var(--edge)');
    line(1,1,1,3,2.4,'var(--edge)'); line(3,1,3,3,2.4,'var(--edge)');
    // внешняя рамка таблицы
    line(0,0,4,0,1.6,'var(--edge)'); line(0,4,4,4,1.6,'var(--edge)');
    line(0,0,0,4,1.6,'var(--edge)'); line(4,0,4,4,1.6,'var(--edge)');

    // шапка столбцов: две строки — разные точки привязки, без наложения
    for(var k1=0;k1<cols.length;k1++){
      label(cols[k1].u+0.5,0.40,0,cols[k1].l[0],13,'t-head','600');
      label(cols[k1].u+0.5,0.72,0,cols[k1].l[1],11.5,'t-head');
    }
    // шапка строк
    for(var k2=0;k2<rows.length;k2++){
      label(0.5,rows[k2].v+0.40,0,rows[k2].l[0],13,'t-head','600');
      label(0.5,rows[k2].v+0.72,0,rows[k2].l[1],11.5,'t-head');
    }
    // угловая клетка шапки
    label(0.5,0.58,0,'X ╲ Y',12,'t-head');

    // значения
    for(var c2=0;c2<cells.length;c2++){
      var d=cells[c2];
      var big=(d.k==='diag'||d.k==='corner');
      label(d.u+0.5,d.v+0.5,6,d.t,big?19:16,null,big?'700':'500');
    }

    // подписи-пояснения на полях (разведены по разным сторонам)
    var rl=el('text',{x:sx(4),y:sy(0.5),dx:-6,dy:-4,'text-anchor':'end',
      'font-size':11.5,'class':'t-head'});
    rl.textContent='итоги по строкам →'; svg.appendChild(rl);
    var cl=el('text',{x:sx(0),y:sy(4),dx:6,dy:-6,'text-anchor':'start',
      'font-size':11.5,'class':'t-head'});
    cl.textContent='↑ итоги по столбцам'; svg.appendChild(cl);

    // строка-легенда под таблицей
    label(2,4.28,0,'4 внутренние клетки в сумме дают 1.00 — угол сходится',12,'t-head');
  }catch(e){
    svg.setAttribute('hidden','hidden');
    document.getElementById('fb').removeAttribute('hidden');
  }
})();
</script>
</html>

<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script>
