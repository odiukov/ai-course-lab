<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Как сужается круг в колоде карт</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#1d2430; --muted:#5c6675;
    --deck:#e6e9ef; --deckLine:#b9c0cc;
    --face:#ffe9b8; --faceLine:#d19a1f;
    --king:#e03e3e; --kingText:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#151a21; --fg:#e8ecf2; --muted:#9aa5b4;
      --deck:#232b35; --deckLine:#3d4855;
      --face:#4a3a14; --faceLine:#d9a83c;
      --king:#e2564f; --kingText:#1a1010;
    }
  }
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:8px 10px 12px}
  h1{font-size:15px;font-weight:600;margin:0 0 4px}
  svg{display:block;width:100%;height:auto;max-height:520px}
  .fail{font-size:13px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Как сужается круг в колоде карт</h1>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById("host");
  try{
    // ---------- данные схемы ----------
    var COLS=13, ROWS=4;
    var RANKS=["2","3","4","5","6","7","8","9","10","A","В","Д","К"];
    var FACE=["В","Д","К"];          // 12 картинок
    var KING="К";                    // 4 короля
    var CAPTIONS=[
      {rank:"2", side:"top",    text:"все 52 карты"},
      {rank:"В", side:"top",    text:"12 картинок"},
      {rank:"К", side:"bottom", text:"4 короля"}
    ];
    var NOTES=[
      {rank:"2", text:"4/52 ≈ 8%",  side:"bottom"},
      {rank:"Д", text:"4/12 ≈ 33%", side:"top"}
    ];

    // ---------- одно отображение ----------
    var ORIGIN={x:96,y:120}, SCALE=34;
    function sx(x){ return ORIGIN.x + x*SCALE; }
    function sy(y){ return ORIGIN.y + y*SCALE; }

    // ---------- холст (литералы разрешены) ----------
    var VBW=880, VBH=300, PAD=6, LW=1.5, FS=13, FSC=12, FSS=11;
    var NS="http://www.w3.org/2000/svg";
    var svg=document.createElementNS(NS,"svg");
    svg.setAttribute("viewBox","0 0 "+VBW+" "+VBH);
    svg.setAttribute("preserveAspectRatio","xMidYMid meet");
    svg.setAttribute("role","img");

    function el(n,a){var e=document.createElementNS(NS,n);
      for(var k in a) e.setAttribute(k,a[k]); return e;}
    function txt(x,y,s,anchor,size,fill,weight){
      var t=el("text",{x:x,y:y,"text-anchor":anchor,
        "font-size":size,fill:fill,"font-weight":weight||"400",
        "dominant-baseline":"middle"});
      t.textContent=s; svg.appendChild(t); return t;}

    var bg=el("rect",{x:sx(0),y:sy(0),width:0,height:0});
    // фон явно, по всему холсту
    svg.appendChild(el("rect",{x:0,y:0,width:VBW,height:VBH,fill:"var(--bg)"}));

    var colOf={}; for(var i=0;i<COLS;i++) colOf[RANKS[i]]=i;
    function isFace(r){ return FACE.indexOf(r)>=0; }

    // ---------- рамка картинок ----------
    var f0=colOf[FACE[0]];
    svg.appendChild(el("rect",{
      x:sx(f0)-PAD, y:sy(0)-PAD,
      width:sx(f0+FACE.length)-sx(f0)-SCALE+ (sx(1)-sx(0)) + 2*PAD - (sx(1)-sx(0)) + (sx(1)-sx(0)),
      height:sy(ROWS)-sy(0)+2*PAD,
      rx:PAD, fill:"none", stroke:"var(--faceLine)",
      "stroke-width":LW*2, "stroke-dasharray":"6 4"}));

    // ---------- карты ----------
    for(var r=0;r<ROWS;r++){
      for(var c=0;c<COLS;c++){
        var rank=RANKS[c];
        var king=(rank===KING);
        var face=isFace(rank);
        svg.appendChild(el("rect",{
          x:sx(c)+ (LW), y:sy(r)+(LW),
          width:sx(c+1)-sx(c)-2*LW-4, height:sy(r+1)-sy(r)-2*LW-4,
          rx:4,
          fill: king?"var(--king)":(face?"var(--face)":"var(--deck)"),
          stroke: king?"var(--king)":(face?"var(--faceLine)":"var(--deckLine)"),
          "stroke-width":LW}));
        txt((sx(c)+sx(c+1))/2 - 2, (sy(r)+sy(r+1))/2 - 2, rank,
            "middle", FSS,
            king?"var(--kingText)":(face?"var(--fg)":"var(--muted)"),
            king?"700":"400");
      }
    }

    // ---------- подписи блоков ----------
    CAPTIONS.forEach(function(cp){
      var c=colOf[cp.rank];
      var x, y, anchor;
      if(cp.rank==="2"){                      // слева от колоды
        x=sx(0)-PAD*2; y=(sy(0)+sy(ROWS))/2; anchor="end";
      }else if(cp.side==="top"){
        x=(sx(c)+sx(c+FACE.length))/2 - 2; y=sy(0)-PAD*4; anchor="middle";
      }else{
        x=(sx(c)+sx(c+1))/2 - 2; y=sy(ROWS)+PAD*4; anchor="middle";
      }
      txt(x,y,cp.text,anchor,FSC,"var(--fg)","600");
    });

    // ---------- стрелка сужения (хвост у колоды, подпись у хвоста) ----------
    var defs=el("defs",{}); svg.appendChild(defs);
    var mk=el("marker",{id:"ah",viewBox:"0 0 10 10",refX:"9",refY:"5",
      markerWidth:"7",markerHeight:"7",orient:"auto-start-reverse"});
    mk.appendChild(el("path",{d:"M0,0 L10,5 L0,10 z",fill:"var(--faceLine)"}));
    defs.appendChild(mk);

    var tailX=sx(colOf["8"]), headX=sx(colOf["В"])-PAD;
    var ay=sy(ROWS)+PAD*9;
    svg.appendChild(el("line",{x1:tailX,y1:ay,x2:headX,y2:ay,
      stroke:"var(--faceLine)","stroke-width":LW*2,"marker-end":"url(#ah)"}));
    txt(tailX-PAD, ay, "круг сужается", "end", FSC, "var(--muted)","600");

    // ---------- дроби ----------
    NOTES.forEach(function(n){
      var c=colOf[n.rank];
      if(n.side==="bottom"){
        txt(sx(0), sy(ROWS)+PAD*9, n.text, "start", FS, "var(--muted)","700");
      }else{
        txt(sx(c+1)+PAD*2, sy(ROWS)+PAD*9, n.text, "start", FS, "var(--king)","700");
      }
    });

    // ---------- легенда ----------
    var ly=sy(ROWS)+PAD*14;
    var items=[
      {fill:"var(--deck)", stroke:"var(--deckLine)", text:"остальные 40 карт гаснут"},
      {fill:"var(--face)", stroke:"var(--faceLine)", text:"картинки: В, Д, К"},
      {fill:"var(--king)", stroke:"var(--king)",     text:"короли: их по-прежнему 4"}
    ];
    var lx=sx(0);
    items.forEach(function(it){
      svg.appendChild(el("rect",{x:lx,y:ly-sy(0)+sy(0)-7,width:14,height:14,rx:3,
        fill:it.fill,stroke:it.stroke,"stroke-width":LW}));
      var t=txt(lx+20, ly, it.text, "start", FSS, "var(--muted)");
      lx += 20 + it.text.length*6.2 + PAD*4;
    });

    host.appendChild(svg);
  }catch(e){
    host.innerHTML='<p class="fail">Схема должна была показать колоду из 52 карт: '+
      'все карты в сетке 4×13, среди них подсвечены 12 картинок (валеты, дамы, короли), '+
      'а внутри картинок — 4 короля. Подписи: 4/52 ≈ 8% для всей колоды и 4/12 ≈ 33% '+
      'после сужения круга до картинок. Знаменатель уменьшился с 52 до 12, числитель остался 4.</p>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
