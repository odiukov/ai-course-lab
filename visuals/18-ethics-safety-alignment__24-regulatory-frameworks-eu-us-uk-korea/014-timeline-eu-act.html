<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Линия времени EU AI Act</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: #f7f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted-ink: #606b80;
      --track: #d9deea;
      --guide: #aeb7c8;
      --border: #dfe3ec;
      --start: #238565;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    body {
      padding: 12px;
    }

    .figure {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .figure__header {
      margin: 0;
      padding: 14px 22px 6px;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 760;
      letter-spacing: -0.02em;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      background: var(--panel);
    }

    .axis,
    .tick,
    .guide,
    .track,
    .active {
      vector-effect: non-scaling-stroke;
    }

    .axis {
      stroke: var(--ink);
    }

    .tick {
      stroke: var(--ink);
    }

    .guide {
      stroke: var(--guide);
      stroke-dasharray: 3 5;
    }

    .track {
      stroke: var(--track);
      stroke-linecap: round;
    }

    .active {
      stroke-linecap: round;
    }

    .axis-dot {
      fill: var(--panel);
    }

    .lane-dot {
      fill: var(--panel);
    }

    .date {
      fill: var(--ink);
      font-weight: 760;
    }

    .date-note,
    .caption {
      fill: var(--muted-ink);
    }

    .lane-title {
      fill: var(--ink);
      font-weight: 720;
    }

    .lane-detail {
      fill: var(--muted-ink);
      font-weight: 520;
    }

    .caption-strong {
      fill: var(--ink);
      font-weight: 720;
    }

    .fallback {
      margin: 0;
      padding: 20px 22px;
      font-size: 17px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--panel);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0d1119;
        --panel: #151b26;
        --ink: #f1f4fa;
        --muted-ink: #aeb8cb;
        --track: #343d50;
        --guide: #58647a;
        --border: #30394b;
        --start: #58c6a0;
      }
    }
  </style>
</head>
<body>
  <figure class="figure" aria-labelledby="diagram-title">
    <h1 class="figure__header" id="diagram-title">Линия времени EU AI Act</h1>

    <svg
      id="timeline"
      viewBox="0 0 1200 440"
      width="1200"
      height="440"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="diagram-title diagram-description"
    >
      <desc id="diagram-description">
        Закон вступил в силу 1 августа 2024 года. Запрещённые практики и
        AI literacy применяются со 2 февраля 2025 года, обязанности GPAI и
        управление — со 2 августа 2025 года, основная масса правил,
        прозрачность по Article 50 и штрафы — со 2 августа 2026 года,
        унаследованные GPAI и встроенные высокорисковые системы —
        со 2 августа 2027 года.
      </desc>
    </svg>

    <p id="fallback" class="fallback" hidden>
      Схема должна была показать линию от 1 августа 2024 года до 2 августа
      2027 года: запреты и AI literacy — со 2 февраля 2025 года; GPAI и
      управление — со 2 августа 2025 года; основная масса правил,
      Article 50 и штрафы — со 2 августа 2026 года; унаследованные GPAI и
      встроенные high-risk системы — со 2 августа 2027 года.
    </p>

    <noscript>
      <p class="fallback">
        Линия идёт от вступления закона в силу 1 августа 2024 года к
        последовательному включению обязанностей 2 февраля 2025 года,
        2 августа 2025 года, 2 августа 2026 года и 2 августа 2027 года.
      </p>
    </noscript>
  </figure>

  <script>
    const data = {
      layout: {
        originX: 300,
        originY: 76,
        scaleX: 8.2,
        scaleY: 22,
        axisStart: 0,
        axisEnd: 100,
        axisY: 0,
        tickTop: -0.46,
        tickBottom: 0.46,
        guideStart: 0.52,
        dateTop: -1.78,
        noteTop: -0.82,
        dateBottom: 1.78,
        noteBottom: 2.66,
        labelX: -2.2,
        labelTop: -0.28,
        labelBottom: 0.58,
        captionY: 16,
        captionSampleStart: 0,
        captionSampleEnd: 12,
        captionTextX: 15,
        dotRadius: 0.72,
        dotInnerRadius: 0.31
      },
      style: {
        axisWidth: 3,
        tickWidth: 2,
        guideWidth: 1.5,
        trackWidth: 12,
        dotWidth: 3,
        dateSize: 17,
        noteSize: 14,
        laneTitleSize: 17,
        laneDetailSize: 15,
        captionSize: 15
      },
      events: [
        {
          x: 0,
          date: "1 августа 2024",
          note: "Закон вступил в силу",
          side: "top",
          anchor: "end",
          color: "#238565"
        },
        {
          x: 17,
          date: "2 февраля 2025",
          note: "Запреты · AI literacy",
          side: "top",
          anchor: "middle",
          color: "#d34c5a",
          targetY: 5
        },
        {
          x: 33,
          date: "2 августа 2025",
          note: "GPAI · управление",
          side: "bottom",
          anchor: "middle",
          color: "#7657c8",
          targetY: 8
        },
        {
          x: 67,
          date: "2 августа 2026",
          note: "Основная масса правил",
          side: "top",
          anchor: "middle",
          color: "#167aa5",
          targetY: 11
        },
        {
          x: 100,
          date: "2 августа 2027",
          note: "Отдельные системы",
          side: "bottom",
          anchor: "end",
          color: "#b86b14",
          targetY: 14
        }
      ],
      lanes: [
        {
          y: 5,
          start: 17,
          color: "#d34c5a",
          title: "Запрещённые практики",
          detail: "+ AI literacy"
        },
        {
          y: 8,
          start: 33,
          color: "#7657c8",
          title: "GPAI",
          detail: "+ управление"
        },
        {
          y: 11,
          start: 67,
          color: "#167aa5",
          title: "Полное применение + Article 50",
          detail: "Штрафы до 15 млн EUR / 3% оборота"
        },
        {
          y: 14,
          start: 100,
          color: "#b86b14",
          title: "Унаследованные GPAI",
          detail: "+ встроенные high-risk системы"
        }
      ]
    };

    const origin = {
      x: data.layout.originX,
      y: data.layout.originY
    };

    const scale = {
      x: data.layout.scaleX,
      y: data.layout.scaleY
    };

    const sx = (x) => origin.x + x * scale.x;
    const sy = (y) => origin.y + y * scale.y;

    (() => {
      const svg = document.getElementById("timeline");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      try {
        const make = (name, attributes, text) => {
          const node = document.createElementNS(namespace, name);

          Object.entries(attributes).forEach(([key, value]) => {
            node.setAttribute(key, String(value));
          });

          if (text !== undefined) {
            node.textContent = text;
          }

          return node;
        };

        const append = (name, attributes, text) => {
          const node = make(name, attributes, text);
          svg.appendChild(node);
          return node;
        };

        const radius = sx(data.layout.dotRadius) - sx(data.layout.axisStart);
        const innerRadius =
          sx(data.layout.dotInnerRadius) - sx(data.layout.axisStart);

        append("line", {
          class: "axis",
          x1: sx(data.layout.axisStart),
          y1: sy(data.layout.axisY),
          x2: sx(data.layout.axisEnd),
          y2: sy(data.layout.axisY),
          "stroke-width": data.style.axisWidth
        });

        data.events.forEach((event) => {
          if (event.targetY !== undefined) {
            append("line", {
              class: "guide",
              x1: sx(event.x),
              y1: sy(data.layout.guideStart),
              x2: sx(event.x),
              y2: sy(event.targetY),
              "stroke-width": data.style.guideWidth
            });
          }
        });

        data.lanes.forEach((lane) => {
          append("line", {
            class: "track",
            x1: sx(data.layout.axisStart),
            y1: sy(lane.y),
            x2: sx(data.layout.axisEnd),
            y2: sy(lane.y),
            "stroke-width": data.style.trackWidth
          });

          append("line", {
            class: "active",
            x1: sx(lane.start),
            y1: sy(lane.y),
            x2: sx(data.layout.axisEnd),
            y2: sy(lane.y),
            stroke: lane.color,
            "stroke-width": data.style.trackWidth
          });

          append("circle", {
            class: "lane-dot",
            cx: sx(lane.start),
            cy: sy(lane.y),
            r: radius,
            stroke: lane.color,
            "stroke-width": data.style.dotWidth
          });

          append("circle", {
            cx: sx(lane.start),
            cy: sy(lane.y),
            r: innerRadius,
            fill: lane.color
          });

          append(
            "text",
            {
              class: "lane-title",
              x: sx(data.layout.labelX),
              y: sy(lane.y + data.layout.labelTop),
              "text-anchor": "end",
              "font-size": data.style.laneTitleSize
            },
            lane.title
          );

          append(
            "text",
            {
              class: "lane-detail",
              x: sx(data.layout.labelX),
              y: sy(lane.y + data.layout.labelBottom),
              "text-anchor": "end",
              "font-size": data.style.laneDetailSize
            },
            lane.detail
          );
        });

        data.events.forEach((event) => {
          append("line", {
            class: "tick",
            x1: sx(event.x),
            y1: sy(data.layout.tickTop),
            x2: sx(event.x),
            y2: sy(data.layout.tickBottom),
            "stroke-width": data.style.tickWidth
          });

          append("circle", {
            class: "axis-dot",
            cx: sx(event.x),
            cy: sy(data.layout.axisY),
            r: radius,
            stroke: event.color,
            "stroke-width": data.style.dotWidth
          });

          append("circle", {
            cx: sx(event.x),
            cy: sy(data.layout.axisY),
            r: innerRadius,
            fill: event.color
          });

          const dateY =
            event.side === "top"
              ? data.layout.dateTop
              : data.layout.dateBottom;

          const noteY =
            event.side === "top"
              ? data.layout.noteTop
              : data.layout.noteBottom;

          append(
            "text",
            {
              class: "date",
              x: sx(event.x),
              y: sy(dateY),
              "text-anchor": event.anchor,
              "font-size": data.style.dateSize
            },
            event.date
          );

          append(
            "text",
            {
              class: "date-note",
              x: sx(event.x),
              y: sy(noteY),
              "text-anchor": event.anchor,
              "font-size": data.style.noteSize
            },
            event.note
          );
        });

        append("line", {
          class: "track",
          x1: sx(data.layout.captionSampleStart),
          y1: sy(data.layout.captionY),
          x2: sx(data.layout.captionSampleEnd),
          y2: sy(data.layout.captionY),
          "stroke-width": data.style.trackWidth
        });

        append("line", {
          class: "active",
          x1: sx(data.layout.captionSampleEnd),
          y1: sy(data.layout.captionY),
          x2: sx(data.layout.captionTextX),
          y2: sy(data.layout.captionY),
          stroke: "var(--start)",
          "stroke-width": data.style.trackWidth
        });

        const caption = append("text", {
          class: "caption",
          x: sx(data.layout.captionTextX),
          y: sy(data.layout.captionY + data.layout.labelBottom),
          "text-anchor": "start",
          "font-size": data.style.captionSize
        });

        const captionStrong = make(
          "tspan",
          {
            class: "caption-strong",
            x: sx(data.layout.captionTextX),
            y: sy(data.layout.captionY + data.layout.labelBottom)
          },
          "Серый участок — подготовка; цветной — обязанность уже применяется."
        );

        caption.appendChild(captionStrong);
      } catch (error) {
        svg.hidden = true;
        fallback.hidden = false;
        console.error(error);
      }
    })();
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
