<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Данные по стадиям: Janus против Janus-Pro</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1a1d21; --muted:#5c6470; --grid:#d8dde4;
    --a:#7a8794; --b:#2f6fd0; --hi:#d94f2b; --hibg:#fdece7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14171b; --fg:#e8ecf1; --muted:#9aa4b2; --grid:#2c333c;
      --a:#69737f; --b:#5c9cf0; --hi:#ff8259; --hibg:#33231d;
    }
  }
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .wrap{max-width:100%;padding:8px 4px 4px;box-sizing:border-box;}
  h2{font-size:15px;margin:0 0 6px;font-weight:600;text-align:center;}
  svg{display:block;width:100%;height:auto;max-height:520px;margin:0 auto;background:var(--bg);}
  .fail{padding:10px;font-size:13px;color:var(--fg);line-height:1.5;}
  text{font-family:inherit;fill:var(--fg);}
</style>
</head>
<body>
<div class="wrap">
  <h2>Куда вложили бюджет: Janus (1.3B) против Janus-Pro (7B)</h2>
  <div id="host"></div>
</div>
<script>
(function(){
  var host=document.getElementById('host');
  try{
    // ---- данные схемы (литералы) ----
    var STAGES=[
      {key:'Стадия 1', sub:'пары «картинка-текст»', a:72,  b:90,  ua:'72M', ub:'90M', hi:false, note:'+четверть'},
      {key:'Стадия 2', sub:'унифицированная',      a:26,  b:72,  ua:'26M', ub:'72M', hi:true,  note:'почти втрое'},
      {key:'Стадия 3', sub:'инструкции генерации', a:0,   b:0.2, ua:'—',   ub:'+200k', hi:false, note:'доводка'}
    ];
    var PARAMS={a:'1.3B', b:'7B', note:'×5.4 параметров'};

    // холст (литералы)
    var W=880, H=470, PAD=6, LW=1.5, FS=13, FSS=11, FSB=14;

    // ---- одна пара функций перевода ----
    // единицы данных: x — колонки/полосы, y — миллионы примеров
    var origin={x:150, y:400};      // положение sx(0),sy(0) в пикселях
    var scale ={x:190, y:3.6};      // px на единицу x / на 1M по y
    function sx(x){ return origin.x + x*scale.x; }
    function sy(y){ return origin.y - y*scale.y; }

    var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');
    svg.setAttribute('role','img');

    function el(n,at,txt){
      var e=document.createElementNS('http://www.w3.org/2000/svg',n);
      for(var k in at) e.setAttribute(k,at[k]);
      if(txt!=null) e.textContent=txt;
      svg.appendChild(e); return e;
    }

    // подсветка стадии 2 (полосой фона)
    el('rect',{x:sx(1.30),y:sy(80),width:sx(2.30)-sx(1.30),height:sy(0)-sy(80),
      fill:'var(--hibg)',rx:6});

    // ---- ось Y: засечки 0,25,50,75 M ----
    [0,25,50,75].forEach(function(v){
      el('line',{x1:sx(0.28),y1:sy(v),x2:sx(3.15),y2:sy(v),
        stroke:'var(--grid)','stroke-width':LW,'stroke-dasharray':v?'3 4':''});
      el('text',{x:sx(0.28)-8,y:sy(v)+4,'text-anchor':'end','font-size':FSS,
        fill:'var(--muted)'}, v+'M');
    });
    // базовая линия = sy(0)
    el('line',{x1:sx(0.28),y1:sy(0),x2:sx(3.15),y2:sy(0),
      stroke:'var(--fg)','stroke-width':LW});
    el('text',{x:sx(0.28)-8,y:sy(88),'text-anchor':'end','font-size':FSS,
      fill:'var(--muted)'},'примеров');

    // ---- парные столбики ----
    STAGES.forEach(function(s,i){
      var c=0.55+i;                      // центр группы в единицах x
      var bw=sx(0.30)-sx(0);             // ширина столбика
      var gap=sx(0.03)-sx(0);
      var xa=sx(c)-bw-gap, xb=sx(c)+gap;
      var col=s.hi?'var(--hi)':'var(--b)';

      var ha=Math.max(sy(0)-sy(s.a),0), hb=Math.max(sy(0)-sy(s.b),0);
      if(ha>0) el('rect',{x:xa,y:sy(s.a),width:bw,height:ha,fill:'var(--a)',rx:3});
      else el('line',{x1:xa,y1:sy(0),x2:xa+bw,y2:sy(0),stroke:'var(--a)','stroke-width':3});
      el('rect',{x:xb,y:sy(s.b),width:bw,height:Math.max(hb,2),fill:col,rx:3});

      // значения над столбиками: Janus слева (end), Janus-Pro справа (start)
      el('text',{x:xa+bw/2,y:sy(s.a)-8,'text-anchor':'middle','font-size':FS,
        fill:'var(--muted)'}, s.ua);
      el('text',{x:xb+bw/2,y:sy(s.b)-8,'text-anchor':'middle','font-size':FS,
        fill:col,'font-weight':'600'}, s.ub);

      // подпись стадии — под осью, middle
      el('text',{x:sx(c),y:sy(0)+22,'text-anchor':'middle','font-size':FS,
        'font-weight':s.hi?'600':'400'}, s.key);
      el('text',{x:sx(c),y:sy(0)+40,'text-anchor':'middle','font-size':FSS,
        fill:'var(--muted)'}, s.sub);
      el('text',{x:sx(c),y:sy(0)+58,'text-anchor':'middle','font-size':FSS,
        fill:s.hi?'var(--hi)':'var(--muted)','font-style':'italic'}, s.note);
    });

    // ---- стрелка роста стадии 2: от хвоста у 26M к 72M ----
    var cx=sx(1.55);
    var tailY=sy(26), headY=sy(72)+6;
    el('defs');
    el('path',{d:'M '+cx+' '+tailY+' L '+cx+' '+headY,
      stroke:'var(--hi)','stroke-width':LW+0.5,fill:'none'});
    el('path',{d:'M '+cx+' '+sy(72)+' L '+(cx-5)+' '+(sy(72)+11)+
      ' L '+(cx+5)+' '+(sy(72)+11)+' Z', fill:'var(--hi)'});
    // подпись у ХВОСТА стрелки, слева
    el('text',{x:cx-9,y:sy(26)-6,'text-anchor':'end','font-size':FSS,
      fill:'var(--hi)','font-weight':'600'},'×2.8');

    // ---- боковой блок параметров ----
    var px=sx(3.30);
    el('text',{x:px,y:sy(88),'text-anchor':'start','font-size':FS,
      'font-weight':'600'},'Параметры');
    el('rect',{x:px,y:sy(20),width:sx(0.14)-sx(0),height:sy(0)-sy(20),
      fill:'var(--a)',rx:3});
    el('rect',{x:px+(sx(0.20)-sx(0)),y:sy(78),width:sx(0.14)-sx(0),
      height:sy(0)-sy(78),fill:'var(--b)',rx:3});
    el('text',{x:px+(sx(0.07)-sx(0)),y:sy(20)-8,'text-anchor':'middle',
      'font-size':FS,fill:'var(--muted)'},PARAMS.a);
    el('text',{x:px+(sx(0.27)-sx(0)),y:sy(78)-8,'text-anchor':'middle',
      'font-size':FS,fill:'var(--b)','font-weight':'600'},PARAMS.b);
    el('text',{x:px,y:sy(0)+22,'text-anchor':'start','font-size':FSS,
      fill:'var(--muted)'},PARAMS.note);
    el('text',{x:px,y:sy(0)+40,'text-anchor':'start','font-size':FSS,
      fill:'var(--muted)'},'при +25% данных');
    el('text',{x:px,y:sy(0)+58,'text-anchor':'start','font-size':FSS,
      fill:'var(--muted)'},'стадии 1');

    // ---- легенда одной строкой под схемой ----
    var ly=sy(0)+88, lx=sx(0.28);
    el('rect',{x:lx,y:ly-10,width:14,height:14,fill:'var(--a)',rx:3});
    el('text',{x:lx+20,y:ly+2,'text-anchor':'start','font-size':FSB},'Janus (1.3B)');
    var lx2=lx+(sx(0.90)-sx(0));
    el('rect',{x:lx2,y:ly-10,width:14,height:14,fill:'var(--b)',rx:3});
    el('text',{x:lx2+20,y:ly+2,'text-anchor':'start','font-size':FSB},'Janus-Pro (7B)');
    var lx3=lx2+(sx(1.10)-sx(0));
    el('rect',{x:lx3,y:ly-10,width:14,height:14,fill:'var(--hi)',rx:3});
    el('text',{x:lx3+20,y:ly+2,'text-anchor':'start','font-size':FSB,
      fill:'var(--hi)'},'узкое место: стадия 2');

    host.appendChild(svg);
    void PAD;
  }catch(e){
    host.innerHTML='<div class="fail"><b>Схема не построилась.</b> Она должна была '+
      'показать парные столбики по стадиям обучения: стадия 1 — 72M против 90M пар '+
      '«картинка-текст»; стадия 2 (унифицированная, подсвечена) — 26M против 72M, '+
      'рост почти втрое; стадия 3 — не было против +200k инструкционных примеров. '+
      'Сбоку — параметры: 1.3B у Janus против 7B у Janus-Pro (×5.4) при росте '+
      'данных стадии 1 всего на четверть.</div>';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
