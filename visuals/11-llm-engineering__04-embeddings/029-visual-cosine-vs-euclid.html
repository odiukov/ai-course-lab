<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta charset="utf-8">
<title>Заметка и статья: угол против длины</title>
<style>
  :root{
    --bg:#fbfaf7; --fg:#23201c; --axis:#9a958c;
    --note:#1d6fb8; --art:#b3541e; --cup:#3f7f3a; --dist:#7b7570;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181c; --fg:#e8e6e1; --axis:#6d7278;
      --note:#6cb6f2; --art:#f0a06a; --cup:#8fd08a; --dist:#a8a29b;
    }
  }
  html,body{margin:0}
  .wrap{background:var(--bg);color:var(--fg);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:10px 12px 12px}
  h2{margin:0 0 6px;font-size:15px;font-weight:600}
  svg{display:block;width:100%;height:auto;max-height:520px;background:var(--bg)}
  .cap{margin:6px 2px 0;font-size:12.5px;opacity:.85}
  .fb{margin:8px 2px;font-size:13px}
  .axis{stroke:var(--axis);fill:none}
  .v-note{stroke:var(--note);fill:var(--note)}
  .v-art{stroke:var(--art);fill:var(--art)}
  .v-cup{stroke:var(--cup);fill:var(--cup)}
  .arc-a{stroke:var(--art);fill:none}
  .arc-b{stroke:var(--cup);fill:none}
  .dist{stroke:var(--dist);fill:none}
  text{fill:var(--fg)}
  text.t-note{fill:var(--note)}
  text.t-art{fill:var(--art)}
  text.t-cup{fill:var(--cup)}
  text.t-a{fill:var(--art)}
  text.t-b{fill:var(--cup)}
  text.t-dist{fill:var(--dist)}
</style>
</head>
<body>
<div class="wrap">
  <h2>Заметка и статья про котов: угол против длины</h2>
  <svg id="d" viewBox="60 12 440 448" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="Три вектора из начала координат: короткая заметка и длинная статья почти в одну сторону, «купить кружку» уходит вбок"></svg>
  <div id="fb"></div>
  <p class="cap">Косинус смотрит только на угол. Короткая заметка и длинная статья указывают почти в одну сторону, хотя их концы далеко друг от друга.</p>
</div>
<script>
(function(){
  var svg = document.getElementById('d');
  try{
    var DATA = {
      vectors:[
        {deg:8,  len:1.0, cls:'v-note', tc:'t-note', label:'заметка, 12 слов',  lt:0.55, dx:0,   dy:-18, anchor:'middle'},
        {deg:38, len:2.8, cls:'v-art',  tc:'t-art',  label:'статья, 800 слов', lt:0.50, dx:-30, dy:-14, anchor:'end'},
        {deg:-64,len:1.2, cls:'v-cup',  tc:'t-cup',  label:'«купить кружку»',  lt:0.60, dx:10,  dy:4,   anchor:'start'}
      ],
      arcs:[
        {a:8,   b:38, r:0.55, lr:1.6, label:'cos 0.72', dx:8, dy:0, anchor:'start', cls:'arc-a', tc:'t-a'},
        {a:-64, b:8,  r:0.75, lr:1.0, label:'cos 0.30', dx:6, dy:0, anchor:'start', cls:'arc-b', tc:'t-b'}
      ],
      axes:{x0:-0.2, x1:2.45, y0:-1.15, y1:1.85, xt:[1,2], yt:[1,-1], tick:0.05},
      dist:{label:'большое расстояние', dx:10, dy:18, anchor:'start'},
      head:{len:0.17, half:0.055},
      zero:{label:'0', dx:-6, dy:16, anchor:'end'}
    };

    var origin = {x:110, y:281}, scale = 140;
    function sx(x){ return origin.x + x * scale; }
    function sy(y){ return origin.y - y * scale; }

    var NS = 'http://www.w3.org/2000/svg';
    function el(n, a){ var e = document.createElementNS(NS, n);
      for(var k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; }
    function txt(px, py, s, cls, anchor, size){
      var t = el('text', {x:px, y:py, class:cls, 'text-anchor':anchor, 'font-size':size});
      t.textContent = s; return t;
    }
    function seg(p, q, cls, w, extra){
      var a = {x1:sx(p.x), y1:sy(p.y), x2:sx(q.x), y2:sy(q.y), class:cls, 'stroke-width':w};
      if(extra) a['stroke-dasharray'] = extra;
      return el('line', a);
    }
    function pol(deg, len){ var r = deg * Math.PI / 180;
      return {x: len * Math.cos(r), y: len * Math.sin(r)}; }

    var ax = DATA.axes;
    seg({x:ax.x0,y:0}, {x:ax.x1,y:0}, 'axis', 1);
    seg({x:0,y:ax.y0}, {x:0,y:ax.y1}, 'axis', 1);
    ax.xt.forEach(function(v){ seg({x:v,y:-ax.tick}, {x:v,y:ax.tick}, 'axis', 1); });
    ax.yt.forEach(function(v){ seg({x:-ax.tick,y:v}, {x:ax.tick,y:v}, 'axis', 1); });
    txt(sx(0) + DATA.zero.dx, sy(0) + DATA.zero.dy, DATA.zero.label, 'axis-lab', DATA.zero.anchor, 12);

    DATA.arcs.forEach(function(a){
      var pts = [], n = 24, i;
      for(i = 0; i <= n; i++){
        var p = pol(a.a + (a.b - a.a) * i / n, a.r);
        pts.push(sx(p.x) + ',' + sy(p.y));
      }
      el('polyline', {points: pts.join(' '), class:a.cls, 'stroke-width':1});
      var lp = pol((a.a + a.b) / 2, a.lr);
      txt(sx(lp.x) + a.dx, sy(lp.y) + a.dy, a.label, a.tc, a.anchor, 13);
    });

    var tips = [];
    DATA.vectors.forEach(function(v){
      var tip = pol(v.deg, v.len), u = pol(v.deg, 1);
      var base = {x: tip.x - u.x * DATA.head.len, y: tip.y - u.y * DATA.head.len};
      var w1 = {x: base.x - u.y * DATA.head.half, y: base.y + u.x * DATA.head.half};
      var w2 = {x: base.x + u.y * DATA.head.half, y: base.y - u.x * DATA.head.half};
      seg({x:0,y:0}, base, v.cls, 2.4);
      el('polygon', {class:v.cls, 'stroke-width':1, points:
        sx(tip.x)+','+sy(tip.y)+' '+sx(w1.x)+','+sy(w1.y)+' '+sx(w2.x)+','+sy(w2.y)});
      var lp = pol(v.deg, v.len * v.lt);
      txt(sx(lp.x) + v.dx, sy(lp.y) + v.dy, v.label, v.tc, v.anchor, 14);
      tips.push(tip);
    });

    seg(tips[0], tips[1], 'dist', 1.4, '6 5');
    var mid = {x:(tips[0].x + tips[1].x) / 2, y:(tips[0].y + tips[1].y) / 2};
    txt(sx(mid.x) + DATA.dist.dx, sy(mid.y) + DATA.dist.dy, DATA.dist.label, 't-dist', DATA.dist.anchor, 13);
  }catch(e){
    svg.remove();
    document.getElementById('fb').className = 'fb';
    document.getElementById('fb').textContent =
      'Схема не построилась. Она должна показывать: из начала координат выходят две стрелки почти в одну сторону — короткая «заметка, 12 слов» и длинная «статья, 800 слов», между ними малый угол (cos 0.72), но концы стрелок далеко друг от друга; третья стрелка «купить кружку» уходит вбок под большим углом (cos 0.30).';
  }
})();
</script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
