<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реальная система внутри и снаружи тренировочного конверта</title>
  <style>
    :root {
      color-scheme: light dark;
      --surface: #f8fafc;
      --surface-soft: #eef3f8;
      --ink: #172033;
      --muted: #58657a;
      --axis: #334155;
      --tick: #64748b;
      --envelope-fill: #dce9ff;
      --envelope-stroke: #2563eb;
      --envelope-edge: #174ea6;
      --inside: #16845b;
      --inside-soft: #d8f5e8;
      --outside: #c43c42;
      --outside-soft: #fde2e3;
      --frame: #cbd5e1;
      --leader: #64748b;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #111827;
        --surface-soft: #182235;
        --ink: #f1f5f9;
        --muted: #aebbd0;
        --axis: #d5deeb;
        --tick: #9cabc0;
        --envelope-fill: #183563;
        --envelope-stroke: #78a9ff;
        --envelope-edge: #a8c7ff;
        --inside: #56d39b;
        --inside-soft: #173e32;
        --outside: #ff858a;
        --outside-soft: #4b2429;
        --frame: #40506a;
        --leader: #9cabc0;
      }
    }

    html,
    body {
      background: var(--surface);
      color: var(--ink);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .diagram {
      background: var(--surface);
      border: 1px solid var(--frame);
      max-width: 760px;
      margin: auto;
    }

    .diagram-title {
      color: var(--ink);
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .diagram-subtitle {
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--surface);
      overflow: visible;
      shape-rendering: geometricPrecision;
      text-rendering: geometricPrecision;
    }

    .axis {
      stroke: var(--axis);
      stroke-width: 3px;
      fill: none;
      vector-effect: non-scaling-stroke;
    }

    .axis-arrow {
      fill: var(--axis);
      stroke: none;
    }

    .tick {
      stroke: var(--tick);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .envelope {
      fill: var(--envelope-fill);
      stroke: var(--envelope-stroke);
      stroke-width: 3px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .boundary {
      stroke: var(--envelope-edge);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .inside-halo {
      fill: var(--inside-soft);
      stroke: var(--inside);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .inside-point {
      fill: var(--inside);
      stroke: var(--surface);
      stroke-width: 3px;
      vector-effect: non-scaling-stroke;
    }

    .outside-halo {
      fill: var(--outside-soft);
      stroke: var(--outside);
      stroke-width: 2px;
      vector-effect: non-scaling-stroke;
    }

    .outside-point {
      fill: var(--outside);
      stroke: var(--surface);
      stroke-width: 3px;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .leader {
      fill: none;
      stroke: var(--leader);
      stroke-width: 2px;
      stroke-linecap: round;
      vector-effect: non-scaling-stroke;
    }

    text {
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      pointer-events: none;
    }

    .range-title {
      fill: var(--envelope-edge);
      font-size: 17px;
      font-weight: bold;
    }

    .range-value {
      fill: var(--muted);
      font-size: 15px;
    }

    .axis-name {
      fill: var(--muted);
      font-size: 14px;
    }

    .tick-label {
      fill: var(--ink);
      font-size: 15px;
      font-weight: bold;
    }

    .inside-value {
      fill: var(--inside);
      font-size: 18px;
      font-weight: bold;
    }

    .inside-label {
      fill: var(--inside);
      font-size: 15px;
      font-weight: bold;
    }

    .outside-value {
      fill: var(--outside);
      font-size: 18px;
      font-weight: bold;
    }

    .outside-label {
      fill: var(--outside);
      font-size: 15px;
      font-weight: bold;
    }

    .region-inside {
      fill: var(--envelope-edge);
      font-size: 14px;
      font-weight: bold;
    }

    .region-outside {
      fill: var(--outside);
      font-size: 14px;
      font-weight: bold;
    }

    .caption,
    .fallback {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .fallback {
      color: var(--outside);
      font-weight: bold;
    }
  </style>
</head>
<body>
  <figure class="diagram" aria-labelledby="diagram-static-title">
    <h2 class="diagram-title" id="diagram-static-title">
      Реальная система и тренировочный конверт
    </h2>
    <p class="diagram-subtitle">
      Положение на оси коэффициента трения
    </p>

    <svg
      id="diagram-svg"
      viewBox="0 0 760 300"
      width="760"
      height="300"
      preserveAspectRatio="xMidYMid meet"
      role="img"
      aria-labelledby="svg-title svg-description"
    >
      <title id="svg-title">
        Реальная точка внутри и снаружи тренировочного диапазона
      </title>
      <desc id="svg-description">
        Тренировочный диапазон коэффициента трения идёт от 0,3 до 0,7.
        Точка 0,55 находится внутри и означает интерполяцию. Точка 0,9
        находится снаружи и означает экстраполяцию.
      </desc>
      <g id="plot"></g>
    </svg>

    <p class="fallback" id="fallback" hidden>
      Схема должна была показать тренировочный диапазон трения от 0,3 до
      0,7, реальную точку 0,55 внутри диапазона и точку 0,9 вне диапазона.
    </p>

    <figcaption class="caption">
      Внутри конверта политика интерполирует знакомые условия; снаружи ей
      приходится экстраполировать.
    </figcaption>
  </figure>

  <script>
    const diagramData = [{
      axis: {
        start: 0,
        end: 1.05,
        y: 0,
        arrowBack: 1.015,
        arrowHalfHeight: 0.055
      },
      envelope: {
        start: 0.3,
        end: 0.7,
        top: 0.18,
        bottom: -0.18,
        boundaryTop: 0.31,
        boundaryBottom: -0.31
      },
      tick: {
        halfHeight: 0.075
      },
      ticks: [
        { x: 0.3, label: "0,3", labelY: -0.39 },
        { x: 0.7, label: "0,7", labelY: -0.39 }
      ],
      inside: {
        x: 0.55,
        y: 0,
        radius: 0.034,
        haloRadius: 0.064
      },
      outside: {
        x: 0.9,
        y: 0,
        radiusX: 0.04,
        radiusY: 0.075,
        haloRadius: 0.07
      },
      leaders: [
        {
          x1: 0.55,
          y1: 0.16,
          x2: 0.55,
          y2: 0.35,
          className: "leader"
        },
        {
          x1: 0.9,
          y1: -0.14,
          x2: 0.9,
          y2: -0.32,
          className: "leader"
        }
      ],
      labels: [
        {
          x: 0.5,
          y: 1.13,
          text: "тренировочный конверт",
          className: "range-title",
          anchor: "middle"
        },
        {
          x: 0.5,
          y: 0.92,
          text: "от 0,3 до 0,7",
          className: "range-value",
          anchor: "middle"
        },
        {
          x: 0,
          y: 0.42,
          text: "коэффициент трения",
          className: "axis-name",
          anchor: "start"
        },
        {
          x: 0.55,
          y: 0.66,
          text: "0,55",
          className: "inside-value",
          anchor: "middle"
        },
        {
          x: 0.55,
          y: 0.47,
          text: "реальная точка внутри",
          className: "inside-label",
          anchor: "middle"
        },
        {
          x: 0.5,
          y: -0.78,
          text: "ИНТЕРПОЛЯЦИЯ",
          className: "region-inside",
          anchor: "middle"
        },
        {
          x: 0.9,
          y: -0.48,
          text: "0,9",
          className: "outside-value",
          anchor: "middle"
        },
        {
          x: 0.9,
          y: -0.67,
          text: "реальная точка вне диапазона",
          className: "outside-label",
          anchor: "middle"
        },
        {
          x: 0.9,
          y: -0.94,
          text: "ЭКСТРАПОЛЯЦИЯ",
          className: "region-outside",
          anchor: "middle"
        }
      ]
    }];

    const origin = Object.freeze({ x: 92, y: 158 });
    const scale = Object.freeze({ x: 570, y: -95 });

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    try {
      const [data] = diagramData;
      const svg = document.getElementById("diagram-svg");
      const plot = document.getElementById("plot");
      const fallback = document.getElementById("fallback");
      const namespace = "http://www.w3.org/2000/svg";

      const make = (name, className) => {
        const node = document.createElementNS(namespace, name);
        if (className) {
          node.setAttribute("class", className);
        }
        return node;
      };

      const appendLine = (parent, spec, className) => {
        const line = make("line", className);
        line.setAttribute("x1", sx(spec.x1));
        line.setAttribute("y1", sy(spec.y1));
        line.setAttribute("x2", sx(spec.x2));
        line.setAttribute("y2", sy(spec.y2));
        parent.appendChild(line);
        return line;
      };

      const appendPolygon = (parent, points, className) => {
        const polygon = make("polygon", className);
        polygon.setAttribute(
          "points",
          points.map(point => `${sx(point.x)},${sy(point.y)}`).join(" ")
        );
        parent.appendChild(polygon);
        return polygon;
      };

      const appendCircle = (parent, point, radius, className) => {
        const circle = make("circle", className);
        circle.setAttribute("cx", sx(point.x));
        circle.setAttribute("cy", sy(point.y));
        circle.setAttribute(
          "r",
          Math.abs(sx(radius) - sx(data.axis.start))
        );
        parent.appendChild(circle);
        return circle;
      };

      const appendText = (parent, label) => {
        const text = make("text", label.className);
        text.setAttribute("x", sx(label.x));
        text.setAttribute("y", sy(label.y));
        text.setAttribute("text-anchor", label.anchor);
        text.setAttribute("dominant-baseline", "middle");
        text.textContent = label.text;
        parent.appendChild(text);
        return text;
      };

      plot.replaceChildren();

      const envelopeLayer = make("g", "envelope-layer");
      const axisLayer = make("g", "axis-layer");
      const leaderLayer = make("g", "leader-layer");
      const pointLayer = make("g", "point-layer");
      const labelLayer = make("g", "label-layer");

      plot.appendChild(envelopeLayer);
      plot.appendChild(axisLayer);
      plot.appendChild(leaderLayer);
      plot.appendChild(pointLayer);
      plot.appendChild(labelLayer);

      appendPolygon(
        envelopeLayer,
        [
          { x: data.envelope.start, y: data.envelope.top },
          { x: data.envelope.end, y: data.envelope.top },
          { x: data.envelope.end, y: data.envelope.bottom },
          { x: data.envelope.start, y: data.envelope.bottom }
        ],
        "envelope"
      );

      appendLine(
        envelopeLayer,
        {
          x1: data.envelope.start,
          y1: data.envelope.boundaryTop,
          x2: data.envelope.start,
          y2: data.envelope.boundaryBottom
        },
        "boundary"
      );

      appendLine(
        envelopeLayer,
        {
          x1: data.envelope.end,
          y1: data.envelope.boundaryTop,
          x2: data.envelope.end,
          y2: data.envelope.boundaryBottom
        },
        "boundary"
      );

      appendLine(
        axisLayer,
        {
          x1: data.axis.start,
          y1: data.axis.y,
          x2: data.axis.end,
          y2: data.axis.y
        },
        "axis"
      );

      appendPolygon(
        axisLayer,
        [
          { x: data.axis.end, y: data.axis.y },
          {
            x: data.axis.arrowBack,
            y: data.axis.y + data.axis.arrowHalfHeight
          },
          {
            x: data.axis.arrowBack,
            y: data.axis.y - data.axis.arrowHalfHeight
          }
        ],
        "axis-arrow"
      );

      data.ticks.forEach(tick => {
        appendLine(
          axisLayer,
          {
            x1: tick.x,
            y1: data.axis.y + data.tick.halfHeight,
            x2: tick.x,
            y2: data.axis.y - data.tick.halfHeight
          },
          "tick"
        );

        appendText(labelLayer, {
          x: tick.x,
          y: tick.labelY,
          text: tick.label,
          className: "tick-label",
          anchor: "middle"
        });
      });

      data.leaders.forEach(leader => {
        appendLine(leaderLayer, leader, leader.className);
      });

      appendCircle(
        pointLayer,
        data.inside,
        data.inside.haloRadius,
        "inside-halo"
      );

      appendCircle(
        pointLayer,
        data.inside,
        data.inside.radius,
        "inside-point"
      );

      appendCircle(
        pointLayer,
        data.outside,
        data.outside.haloRadius,
        "outside-halo"
      );

      appendPolygon(
        pointLayer,
        [
          {
            x: data.outside.x,
            y: data.outside.y + data.outside.radiusY
          },
          {
            x: data.outside.x + data.outside.radiusX,
            y: data.outside.y
          },
          {
            x: data.outside.x,
            y: data.outside.y - data.outside.radiusY
          },
          {
            x: data.outside.x - data.outside.radiusX,
            y: data.outside.y
          }
        ],
        "outside-point"
      );

      data.labels.forEach(label => {
        appendText(labelLayer, label);
      });

      svg.hidden = false;
      fallback.hidden = true;
    } catch (error) {
      const svg = document.getElementById("diagram-svg");
      const fallback = document.getElementById("fallback");

      if (svg) {
        svg.hidden = true;
      }

      if (fallback) {
        fallback.hidden = false;
      }
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
