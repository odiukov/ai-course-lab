<!doctype html>
<html lang="ru">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Из чего складывается разрыв между симуляцией и реальностью</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: floralwhite;
      --panel: white;
      --band: lavender;
      --ink: midnightblue;
      --muted: slategray;
      --rule: lightsteelblue;
      --contact: darkorange;
      --motor: mediumpurple;
      --vision: royalblue;
      --environment: seagreen;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: midnightblue;
        --panel: darkslategray;
        --band: black;
        --ink: whitesmoke;
        --muted: lightsteelblue;
        --rule: lightslategray;
        --contact: orange;
        --motor: plum;
        --vision: lightskyblue;
        --environment: mediumseagreen;
      }
    }

    html,
    body {
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    body {
      margin: unset;
    }

    h1 {
      box-sizing: border-box;
      margin: unset;
      padding: unset;
      font-size: 22px;
      line-height: normal;
    }

    svg {
      display: block;
      box-sizing: border-box;
      width: 100%;
      height: auto;
      max-height: 520px;
      background: var(--page);
      border: 1px solid var(--rule);
    }

    .panel {
      fill: var(--panel);
      stroke: var(--rule);
      stroke-width: 1.5px;
    }

    .gap-band {
      fill: var(--band);
      stroke: var(--rule);
      stroke-width: 1.5px;
    }

    .divider,
    .connector {
      fill: none;
      stroke: var(--rule);
      stroke-width: 2px;
    }

    .column-title {
      fill: var(--ink);
      font-size: 18px;
      font-weight: bold;
      letter-spacing: normal;
    }

    .column-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .card-title {
      fill: var(--ink);
      font-size: 14px;
      font-weight: bold;
    }

    .card-note {
      fill: var(--muted);
      font-size: 12px;
    }

    .gap-title {
      font-size: 12px;
      font-weight: bold;
    }

    .gap-note {
      fill: var(--muted);
      font-size: 11px;
    }

    .footer {
      fill: var(--ink);
      font-size: 13px;
      font-weight: bold;
    }

    .contact-fill {
      fill: var(--contact);
    }

    .contact-stroke {
      stroke: var(--contact);
    }

    .contact-text {
      fill: var(--contact);
    }

    .motor-fill {
      fill: var(--motor);
    }

    .motor-stroke {
      stroke: var(--motor);
    }

    .motor-text {
      fill: var(--motor);
    }

    .vision-fill {
      fill: var(--vision);
    }

    .vision-stroke {
      stroke: var(--vision);
    }

    .vision-text {
      fill: var(--vision);
    }

    .environment-fill {
      fill: var(--environment);
    }

    .environment-stroke {
      stroke: var(--environment);
    }

    .environment-text {
      fill: var(--environment);
    }

    #fallback {
      box-sizing: border-box;
      margin: unset;
      color: var(--ink);
      background: var(--panel);
      border: 2px solid var(--rule);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <h1>Из чего складывается разрыв между симуляцией и реальностью</h1>

  <svg id="diagram"
       width="960"
       height="448"
       viewBox="0 0 960 448"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       aria-labelledby="svg-title svg-description">
    <title id="svg-title">Четыре источника разрыва между симуляцией и реальностью</title>
    <desc id="svg-description">Две колонки сопоставляют симуляцию и реальность. Между ними показаны трение, задержка мотора, искажение камеры и меняющееся освещение.</desc>
  </svg>

  <p id="fallback" hidden>
    Схема должна была показать две колонки — «Симуляция» и «Реальность» —
    и четыре разрыва между ними: трение, задержку мотора, искажение камеры
    и меняющееся освещение.
  </p>

  <script>
    const DATA = Object.freeze([{
      origin: { x: 0, y: 0 },
      scale: { x: 1, y: 1 },

      header: {
        y1: 16,
        y2: 94,
        leftX1: 30,
        leftX2: 354,
        bandX1: 378,
        bandX2: 582,
        rightX1: 606,
        rightX2: 930,
        titleY: 49,
        noteY: 74,
        leftTitleX: 192,
        bandTitleX: 480,
        rightTitleX: 768,
        leftTitle: "СИМУЛЯЦИЯ",
        leftNote: "идеальные допущения модели",
        bandTitle: "РАЗРЫВ",
        bandNote: "малые несовпадения усиливают друг друга",
        rightTitle: "РЕАЛЬНОСТЬ",
        rightNote: "измерения и движение настоящего робота"
      },

      layout: {
        leftX1: 30,
        leftX2: 354,
        leftStripeX2: 38,
        leftTextX: 54,
        bandX1: 378,
        bandX2: 582,
        bandTextX: 480,
        rightX1: 606,
        rightX2: 930,
        rightStripeX2: 614,
        rightTextX: 630,
        leftLineX1: 354,
        leftLineX2: 401,
        rightLineX1: 559,
        rightLineX2: 606,
        headBaseX: 596,
        headTipX: 606,
        dividerX1: 30,
        dividerX2: 930,
        dividerY: 396,
        footerX: 480,
        footerY: 422,
        footerText: "Вместе они замыкаются в цикл: наблюдение → команда → движение → новое наблюдение"
      },

      rows: [
        {
          tone: "contact",
          y1: 108,
          y2: 168,
          titleY: 133,
          noteY: 155,
          lineY: 139,
          headTopY: 133,
          headBottomY: 145,
          gapTitleY: 128,
          gapNoteY: 160,
          leftTitle: "Трение задано моделью",
          leftNote: "кубик не скользит",
          gapTitle: "ТРЕНИЕ",
          gapNote: "физика контакта",
          rightTitle: "Трение отличается",
          rightNote: "кубик может выскользнуть"
        },
        {
          tone: "motor",
          y1: 178,
          y2: 238,
          titleY: 203,
          noteY: 225,
          lineY: 209,
          headTopY: 203,
          headBottomY: 215,
          gapTitleY: 198,
          gapNoteY: 230,
          leftTitle: "Команда исполняется сразу",
          leftNote: "пальцы сходятся вовремя",
          gapTitle: "ЗАДЕРЖКА МОТОРА",
          gapNote: "сам робот",
          rightTitle: "Мотор отвечает позже",
          rightNote: "захват запаздывает"
        },
        {
          tone: "vision",
          y1: 248,
          y2: 308,
          titleY: 273,
          noteY: 295,
          lineY: 279,
          headTopY: 273,
          headBottomY: 285,
          gapTitleY: 268,
          gapNoteY: 300,
          leftTitle: "Камера видит точно",
          leftNote: "кубик находится на месте",
          gapTitle: "ИСКАЖЕНИЕ КАМЕРЫ",
          gapNote: "восприятие",
          rightTitle: "Объектив смещает образ",
          rightNote: "захват целится в сторону"
        },
        {
          tone: "environment",
          y1: 318,
          y2: 378,
          titleY: 343,
          noteY: 365,
          lineY: 349,
          headTopY: 343,
          headBottomY: 355,
          gapTitleY: 338,
          gapNoteY: 370,
          leftTitle: "Свет остаётся постоянным",
          leftNote: "вид кубика не меняется",
          gapTitle: "МЕНЯЮЩЕЕСЯ ОСВЕЩЕНИЕ",
          gapNote: "окружение",
          rightTitle: "Свет создаёт блики и тени",
          rightNote: "знакомые грани выглядят иначе"
        }
      ]
    }]);

    const [diagramData] = DATA;
    const origin = Object.freeze(diagramData.origin);
    const scale = Object.freeze(diagramData.scale);

    const sx = x => origin.x + x * scale.x;
    const sy = y => origin.y + y * scale.y;

    const svg = document.getElementById("diagram");
    const fallback = document.getElementById("fallback");

    try {
      const create = (tag, attributes, value) => {
        const node = document.createElementNS(svg.namespaceURI, tag);

        Object.entries(attributes).forEach(([name, attributeValue]) => {
          node.setAttribute(name, String(attributeValue));
        });

        if (value !== undefined) {
          node.textContent = value;
        }

        svg.appendChild(node);
        return node;
      };

      const rectangle = (x1, y1, x2, y2, className) => create("rect", {
        x: sx(x1),
        y: sy(y1),
        width: sx(x2) - sx(x1),
        height: sy(y2) - sy(y1),
        class: className
      });

      const line = (x1, y1, x2, y2, className) => create("line", {
        x1: sx(x1),
        y1: sy(y1),
        x2: sx(x2),
        y2: sy(y2),
        class: className
      });

      const label = (x, y, value, className, anchor) => create("text", {
        x: sx(x),
        y: sy(y),
        class: className,
        "text-anchor": anchor
      }, value);

      const arrowHead = (baseX, topY, tipX, middleY, bottomY, className) => {
        const points = [
          `${sx(baseX)},${sy(topY)}`,
          `${sx(tipX)},${sy(middleY)}`,
          `${sx(baseX)},${sy(bottomY)}`
        ].join(" ");

        return create("polygon", {
          points,
          class: className
        });
      };

      const header = diagramData.header;
      const layout = diagramData.layout;

      rectangle(
        header.leftX1,
        header.y1,
        header.leftX2,
        header.y2,
        "panel"
      );

      rectangle(
        header.bandX1,
        header.y1,
        header.bandX2,
        header.y2,
        "gap-band"
      );

      rectangle(
        header.rightX1,
        header.y1,
        header.rightX2,
        header.y2,
        "panel"
      );

      label(
        header.leftTitleX,
        header.titleY,
        header.leftTitle,
        "column-title",
        "middle"
      );

      label(
        header.leftTitleX,
        header.noteY,
        header.leftNote,
        "column-note",
        "middle"
      );

      label(
        header.bandTitleX,
        header.titleY,
        header.bandTitle,
        "column-title",
        "middle"
      );

      label(
        header.bandTitleX,
        header.noteY,
        header.bandNote,
        "column-note",
        "middle"
      );

      label(
        header.rightTitleX,
        header.titleY,
        header.rightTitle,
        "column-title",
        "middle"
      );

      label(
        header.rightTitleX,
        header.noteY,
        header.rightNote,
        "column-note",
        "middle"
      );

      diagramData.rows.forEach(row => {
        rectangle(
          layout.leftX1,
          row.y1,
          layout.leftX2,
          row.y2,
          "panel"
        );

        rectangle(
          layout.leftX1,
          row.y1,
          layout.leftStripeX2,
          row.y2,
          `${row.tone}-fill`
        );

        rectangle(
          layout.bandX1,
          row.y1,
          layout.bandX2,
          row.y2,
          "gap-band"
        );

        rectangle(
          layout.rightX1,
          row.y1,
          layout.rightX2,
          row.y2,
          "panel"
        );

        rectangle(
          layout.rightX1,
          row.y1,
          layout.rightStripeX2,
          row.y2,
          `${row.tone}-fill`
        );

        line(
          layout.leftLineX1,
          row.lineY,
          layout.leftLineX2,
          row.lineY,
          `connector ${row.tone}-stroke`
        );

        line(
          layout.rightLineX1,
          row.lineY,
          layout.rightLineX2,
          row.lineY,
          `connector ${row.tone}-stroke`
        );

        arrowHead(
          layout.headBaseX,
          row.headTopY,
          layout.headTipX,
          row.lineY,
          row.headBottomY,
          `${row.tone}-fill`
        );

        label(
          layout.leftTextX,
          row.titleY,
          row.leftTitle,
          "card-title",
          "start"
        );

        label(
          layout.leftTextX,
          row.noteY,
          row.leftNote,
          "card-note",
          "start"
        );

        label(
          layout.bandTextX,
          row.gapTitleY,
          row.gapTitle,
          `gap-title ${row.tone}-text`,
          "middle"
        );

        label(
          layout.bandTextX,
          row.gapNoteY,
          row.gapNote,
          "gap-note",
          "middle"
        );

        label(
          layout.rightTextX,
          row.titleY,
          row.rightTitle,
          "card-title",
          "start"
        );

        label(
          layout.rightTextX,
          row.noteY,
          row.rightNote,
          "card-note",
          "start"
        );
      });

      line(
        layout.dividerX1,
        layout.dividerY,
        layout.dividerX2,
        layout.dividerY,
        "divider"
      );

      label(
        layout.footerX,
        layout.footerY,
        layout.footerText,
        "footer",
        "middle"
      );
    } catch (error) {
      svg.hidden = true;
      fallback.hidden = false;
    }
  </script>
<script>
(function () {
  function contentHeight() {
    var body = document.body;
    if (!body) return 0;

    var bottom = body.getBoundingClientRect().bottom;
    var nodes = body.getElementsByTagName("*");
    for (var i = 0; i < nodes.length; i += 1) {
      var box = nodes[i].getBoundingClientRect();
      // Схлопнутые и спрятанные узлы пропускаются: у скрытого запасного
      // текста нулевая коробка, но она всё равно где-то «заканчивается».
      if (box.width > 0 || box.height > 0) bottom = Math.max(bottom, box.bottom);
    }

    var style = window.getComputedStyle(body);
    return bottom + (parseFloat(style.marginBottom) || 0);
  }

  function report() {
    parent.postMessage(
      { type: "lab-visual-height", height: Math.ceil(contentHeight()) },
      "*"
    );
  }

  report();
  window.addEventListener("load", report);
  if (window.ResizeObserver) new ResizeObserver(report).observe(document.documentElement);
})();
</script></body>
</html>
