<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повторение — AI Lab</title>
<link rel="icon" type="image/svg+xml" href="/ai-course-lab/assets/favicon.svg">
<link rel="stylesheet" href="/ai-course-lab/assets/katex/katex.min.css">
<link rel="stylesheet" href="/ai-course-lab/assets/site.css">
</head>
<body data-base="/ai-course-lab" data-pagefind-ignore="all">
<header class="lesson-header">
<div class="header-toolbar">
<a class="back" href="/ai-course-lab/">← к списку уроков</a>
<span class="header-actions" data-header-actions><button type="button" class="nav-button search-button" data-search-trigger data-pagefind-ignore aria-haspopup="dialog">
<span>Поиск</span>
<kbd class="search-shortcut" data-search-shortcut aria-hidden="true">⌘K</kbd>
</button></span>
</div>
<h1>Повторение</h1>
<p class="lesson-meta">Карточки, до которых дошёл срок. График живёт в этом браузере.</p>
</header>
<main class="lesson review-page">
<div class="review-debug" data-review-debug hidden>
<label for="review-shift">Показать день +N</label>
<input id="review-shift" type="number" data-review-shift value="0" min="0" max="365" step="1">
<button type="button" class="nav-button" data-review-shift-apply>Пересчитать</button>
<p class="run-status" data-review-shift-note></p>
</div>
<div class="review" data-review>
<p class="run-status">Загружаю карточки…</p>
</div>
</main>
<script src="/ai-course-lab/assets/search.js"></script>
<script src="/ai-course-lab/assets/auth.js"></script>
<script src="/ai-course-lab/assets/review.js"></script>
</body>
</html>
